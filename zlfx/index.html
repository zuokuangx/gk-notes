12 年是 06 年的多少倍？限期是基期的多少倍？\n> 它其实跟算增长率是一致的。因为倍数就是 1 + 增速，限期是基期的多少倍等于增速加 1，\n> 所以你跟算增速的思维是一样的。那零六年在哪呢？他没直接给你零六年，他只给了你零七年的数据，\n> 所以这里也是一个间隔增长率问题，零六年、零七年、一二年。」\n\n> **老师说**（倍数的好处）：「那这样子呢，其实相对比较麻烦一点。如果是这种间隔形式的问法，\n> 他问的不是增速，问的是倍数，其实你直接用倍数来看会更简单。\n> 零六年到零七年增长了百分之十一，其实意思就是零七年是零六年的多少倍啊？一点一一倍。\n> 然后一二年是零七年的多少倍？我们可以算一下，七十五除以三十一，我们就可以不用去把这个增量减出来了，\n> 直接七十五除以三十一，你看是不是省了个事；不然你刚刚又要先把增量减出来，减出来之后你算出这么多，\n> 又要再把这个一加回去，就有点麻烦了。」\n\n> **老师说**（为什么倍数可以直接乘）：「为什么可以直接这两个去乘呢？你看一二年，或者说你看零七年是等于零六乘以一点一一，\n> 12 年是等于 07 乘以 2.4，那 07 又等于 06 乘以 1.11，\n> 不就是 06 乘以 1.11 乘 2.4 吗？所以 12 年除以 06 年就是 1.11 乘以 2.4，这样就能算到这个 2.7 了。」\n\n> **老师说**（方法选择）：「这里选择 C 选项，如果他直接问了倍数，我们就看倍数；问增速，我们就看增速。」\n\n**【选项原文】**\n\n- A.2.2\n- B.2.4\n- C.2.7\n- D.3.3\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **C 正确**：`1.11 × 2.4 ≈ 2.66`（或增速合成 `168% → 2.68` 倍），四舍五入到 2.7。\n- **A / B 错误**：2.2 / 2.4 只反映了 07→12 一段的倍数（2.4 倍），漏掉了 06→07 的 1.11 倍。\n- **D 错误**：3.3 明显偏大。\n- **陷阱类型**：**概念陷阱**（把「倍数」与「增速」割裂，算完增速忘了 `+1`）；**定位陷阱**（2006 年数据未直接给出，需借助 2007 年增速 11%）；**时间陷阱**（用 2012 年增速 15.6% 去凑 06→12 的关系）。\n- **板书**：画面在 `2007年` 柱上圈出 `30.93`，并在图上写出 `06 → 07 → 12` 时间轴、分别标 `11%`、`142%`、`153% + 15% = 168%`，右侧还写有 `1 + r = 现期/基期`。\n\n---\n\n### 第 7 题｜长江流域棉区棉花总产量同比变化\n\n**【题干原文】**\n\n> 7.2017年黄河流域棉花播种面积减少215.1千公顷，下降24.3%，长江流域棉花播种面积减少97.0千公顷，下降14.9%。\n>\n> 黄河流域棉区每公顷单位面积产量增加22.9公斤，增长2.1%；长江流域棉区每公顷单位面积产量减少39.5公斤，下降3.6%。\n>\n> 2017年，长江流域棉区棉花总产量同比约下降（　）。\n>\n> A.4%　B.7%　C.15%　D.18%\n\n**【材料数据】**\n\n| 流域 | 播种面积变化 | 播种面积增速 | 每公顷单位面积产量变化 | 单产增速 |\n|---|---|---:|---|---:|\n| 黄河流域 | 减少 215.1 千公顷 | 下降 24.3% | 增加 22.9 公斤 | 增长 2.1% |\n| **长江流域** | **减少 97.0 千公顷** | **下降 14.9%** | **减少 39.5 公斤** | **下降 3.6%** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「总产量」符合 `A = B × C` 关系，问它的增速 → **乘积（累积）增长率** |\n| 定位数据 | `总产量 = 播种面积 × 单位面积产量`；长江流域面积增速 `−14.9%`，长江流域单产增速 `−3.6%`（黄河数据是干扰） |\n| 列式 | `r = (−14.9%) + (−3.6%) + (−14.9%)×(−3.6%)` |\n| 速算步骤 | ① 先加：`−14.9 − 3.6 = −18.5`\u003cbr>② 尾巴负负得正：`14.9 × 3.6 ≈ 53.6 ÷ 100 ≈ 0.54`（画面写 0.5）\u003cbr>③ `−18.5 + 0.54 ≈ −18` |\n| 结论 | 约下降 18%，即 **D** |\n\n> **老师说**（题型反应）：「那这种总产量它也是符合那种 a 等于 b 乘 c 这种关系的一种概念。\n> 总产量等于面积乘以单位面积产量。所以当他问我们这个东西的一个增速的时候，\n> 我们要立刻反应过来，他很可能是在考一个成绩（乘积）增长率。」\n\n> **老师说**（符号判断）：「−14.9 加上 −3.6，先加得到负的 18.5。然后因为这两个增速都是负的，\n> 后面我们再去加那个 r1 乘 r2 的时候，它会负负得正，会把这个数变小一点，会加上一个正数，\n> 导致这个负数变小。所以选一个比它这个数小一点点的十八就好了。\n> 因为这两个增速都不高，所以它那个小尾巴会非常非常小。\n> 要算的话，也就大概 15 乘以 3.6，负负把两个负号抵消掉，除以 100。\n> 15 乘 3.6 的话就是 54 除以 100，就是 0.54。」\n\n**【选项原文】**\n\n- A.4%\n- B.7%\n- C.15%\n- D.18%\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **D 正确**：`−18.5% + 0.54% ≈ −17.96% ≈ −18%`，即约下降 18%。\n- **A / B 错误**：4%、7% 是单因素的量级（单产 −3.6%、面积 −14.9% 的其中一项），不是两者乘积的效果。\n- **C 错误**：15% 的绝对降幅小于 `14.9 + 3.6 = 18.5`——负负得正的尾巴让降幅**变小**，从 18.5 变到约 18，而不是减到 15。\n- **陷阱类型**：**范围陷阱**（黄河流域数据 24.3%、2.1% 是干扰，题目问长江流域）；**概念陷阱**（只把两个增速相加得 18.5 直接选最高项，或错误地把尾巴减掉）。\n- **板书**：画面写 `总产量 = 面积 × 单位面积产量`、`−14.9 − 3.6 + r1×r2 = −18.5 + ...`、`15×3.6/100 ≈ 0.5`。\n\n---\n\n### 第 8 题｜社会消费品零售总额月度累计表（三次变化累积求倍数）\n\n**【题干原文】**\n\n> 8.该地区2018年完成社会消费品零售总额约是2015年的（　）倍。\n>\n> A.1.0　B.1.2　C.1.4　D.1.6\n\n**【材料数据】**\n\n表头（画面原文）：**某地区社会消费品零售总额月度累计完成情况**\n\n| 年份 | 指标 | 2月 | 3月 | 4月 | 5月 | 6月 | 7月 | 8月 | 9月 | 10月 | 11月 | 12月 |\n|:---:|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| **2016** | 绝对量（亿元） | 98.0 | 141.2 | 188.6 | 250.1 | 301.2 | 352.5 | 398.6 | 449.5 | 515.4 | 559.8 | 613.6 |\n| | 同比增长（%） | 13.5 | 13.1 | 13.4 | 13.4 | 13.2 | 13.4 | 13.1 | 13.1 | 12.7 | 12.1 | **12.0** |\n| **2017** | 绝对量（亿元） | 107.9 | 156.2 | 207.8 | 276.0 | 332.5 | 389.3 | 440.7 | 497.7 | 570.0 | 618.6 | 679.2 |\n| | 同比增长（%） | 10.1 | 10.6 | 10.2 | 10.4 | 10.4 | 10.4 | 10.6 | 10.7 | 10.6 | 10.5 | **10.7** |\n| **2018** | 绝对量（亿元） | 118.4 | 171.8 | 227.9 | 301.7 | 363.6 | 425.7 | 483.3 | 545.9 | 625.5 | 680.2 | 747.4 |\n| | 同比增长（%） | 9.7 | 10.0 | 9.7 | 9.3 | 9.4 | 9.4 | 9.7 | 9.7 | 9.7 | 10.0 | **10.0** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 问「18 年是 15 年的几倍」＝问变化比例 → 三次变化累积（间隔增长率的多次版） |\n| 定位数据（表头性质） | 表头是「**月度累计完成情况**」→ **12 月即为全年累计值**；且数据逐月递增，也说明是累计值 |\n| 关键提醒 | 「问的是一个倍数关系，并不是问一五年是多少。所以这个量呢其实不重要，主要看的是一个变化的一个比例。」 |\n| 定位增速 | 15→16 年：`12%`；16→17 年：`10.7%`；17→18 年：`10%` |\n| 列式（法一：倍数连乘） | `倍数 = 1.12 × 1.107 × 1.10 ≈ 1.12 × 1.1 × 1.1` |\n| 速算步骤 | ① `1.12 × 1.1 ≈ 1.232`（错位相加）\u003cbr>② `1.232 × 1.1 ≈ 1.355`（再错位相加）\u003cbr>③ ≈ 1.35 倍 |\n| 列式（法二：增速合成） | `12% + 10.7% = 22.7%`，加尾巴 ≈ 24%；再与 10% 合：`24 + 10 + 2.4 = 36.4%`；`倍数 = 1 + 36.4% = 1.364 ≈ 1.4` |\n| 结论 | 选 1.4 倍，即 **C** |\n\n> **老师说**（怎么看表）：「一八年的量的话，它上面给的是二、三、四、五一直到十二月份。那哪边有一八年全年的量呢？\n> 就是十二月份。为什么这里十二月份呢？不知道你们有没有注意到，你看这个数据，它是在越来越高，越来越高。\n> 如果他是给这种每个月的情况，然后越来越高的，那它其实往往来说是一个累计值。\n> 它这个表头就是一个月度累计完成情况，就是从当年的一月份开始，到二月份累计完成了 98，\n> 再到三月份累计完成了 141，就是因为三月份它额外就三月份他做了 43.2，跟前面两个月加起来到三月份一共完成这么多，\n> 然后一直到十二月份，就把全年的十二个月的全加起来了。」\n\n> **老师说**（两次合成演示）：「或者你也可以就看增速，从 15 年到 16 年增长了 12%，16 年到 17 年增长了 10.7%，\n> 17 年到 18 年增长了 10%。就三个增速，三次变化合为一次，可以先两两去合一下，\n> 先把这个 12 跟 10.7 合一下，这两次变化合为一次，就会变成先加加起来得到 22.7，再加个小尾巴，大概变成 24 左右。\n> 再把 24% 和 17 年到 18 年的变化，这两次再合一次，变成 34 + 2.4，也就是 36.4。\n> 这 34 是两个相加，2.4 呢？是它们俩相乘 2.4 加起来 36.4，所以还是选择 1.4 倍。」\n\n**【选项原文】**\n\n- A.1.0\n- B.1.2\n- C.1.4\n- D.1.6\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **C 正确**：`1.12 × 1.107 × 1.10 ≈ 1.355 ≈ 1.4` 倍（画面写 `1.12 × 1.1 × 1.1 ≈ 1.35`）。\n- **A / B 错误**：1.0 / 1.2 都没反映三次变化累积的效果。\n- **D 错误**：1.6 明显偏大。\n- **陷阱类型**：**范围陷阱**（表是「累计」值而非当月值，若误当单月值会取错数据）；**时间陷阱**（问 18 年 vs 15 年，中间有 16、17 两次，共三次变化）；**概念陷阱**（倍数与增速混淆）。\n- **板书**：画面写 `15 → 16 → 17 → 18` 时间轴，分别标 `12%`、`10.7%`、`10%`，下方 `1.12 × 1.1 × 1.1 = 1.35`。\n\n---\n\n### 第 9 题｜全国资助学前教育 · 每人次平均受资助额\n\n**【题干原文】**\n\n> 9.2014年，全国资助学前教育（幼儿）、义务教育、中职学校、普通高中和普通高校学生8543.78万人次（不包括义务教育免费教科书、营养改善计划资助），较上年增长约6.86%；\n> 累计资助金额1421.28亿元，比上年增加236.13亿元，增幅19.92%。\n>\n> 2014年每人次平均受资助额比上年增长约（　）。\n>\n> A.7%　B.12%　C.14%　D.20%\n\n**【材料数据】**\n\n| 指标 | 2014 年数值 | 同比变化 |\n|---|---:|---|\n| 资助学生（人次） | 8543.78 万人次 | 较上年增长约 **6.86%** |\n| 累计资助金额 | 1421.28 亿元 | 比上年增加 236.13 亿元，增幅 **19.92%** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「每人次平均受资助额」＝均值概念 → **平均数增长率** |\n| 定位数据 | 分子＝受资助额，增速 `19.92%`（画面圈出，取整 `20%`）；分母＝人次，增速 `6.86%`（取整 `7%`） |\n| 关键提醒 | 「限期我们要导致（求）增速，说限期不重要。增速在这儿，增幅 19.92%，那就算 20%。……人次增速不用管它的限期是多少，我们只要看增速。」 |\n| 列式 | `r = (20% − 7%) ÷ (1 + 7%)` |\n| 速算步骤 | ① 增速差：`20 − 7 = 13`\u003cbr>② 分母 `1.07` 用**画除为乘**：`13 × (1 − 7%)`\u003cbr>③ `13 − 13×7% ≈ 13 − 1 = 12` |\n| 结论 | 选 12%，即 **B** |\n\n> **老师说**（为什么可以两个都取整）：「相当于两个都给你调大一点的结果呢，就没有多大影响。」\n> （画面把 `19.92%` 圈出写成 `20%`、把 `6.86%` 圈出写成 `7%`）\n\n**【选项原文】**\n\n- A.7%\n- B.12%\n- C.14%\n- D.20%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **B 正确**：`(19.92% − 6.86%) ÷ (1 + 6.86%) = 13.06% ÷ 1.0686 ≈ 12.2% ≈ 12%`。\n- **A 错误**：7% 是分母（人次）自身的增速，不是均值的增速。\n- **C 错误**：14% 是把增速差 13 又往上凑的结果，忽略了 `1 + 6.86%` 这个分母使结果**变小**。\n- **D 错误**：20% 是分子（资助金额）自身的增速。\n- **陷阱类型**：**概念陷阱**（均值增速 ≠ 分子增速，也不是分子分母增速之差）；**运算陷阱**（忘记除 `(1 + r分母)`）。\n- **板书**：左侧写 `资/人`（受资助额 ÷ 人次），中间写 `20% / 7%`，右侧 `r = (20 − 7) / 1.07 = 13/1.07 ≈ 13×(1−7%) = 13 − 1 = 12`。\n\n---\n\n### 第 10 题｜新设私营企业平均注册资本（金）倍数\n\n**【题干原文】**\n\n> 10.2014年上半年，该市新设内资企业19674户，注册资本（金）1179.4亿元，同比分别增长37.7%和166%。其中，私营企业19167户，注册资本（金）1046.76亿元，同比分别增长39.7%和213%。\n>\n> A市2014上半年新设私营企业平均注册资本（金）约是上年的（　）倍。\n>\n> A.1.4　B.2.2　C.4.2　D.5.4\n\n**【材料数据】**\n\n| 主体 | 户数 | 注册资本（金） |\n|---|---|---|\n| 内资企业（全部） | 19674 户（同比增长 37.7%） | 1179.4 亿元（同比增长 166%） |\n| **其中：私营企业** | **19167 户**（同比增长 **39.7%**） | **1046.76 亿元**（同比增长 **213%**） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「平均注册资本（金）」是均值；问「约是上年的几倍」→ **平均数增长率 → 转倍数** |\n| 关键提醒 | 「要注意主体，不是上面，它是所有的内资企业，我们要找的是**私营企业**。」 |\n| 定位数据 | 分子＝注册资本，增速 `213%`；分母＝企业数，增速 `39.7%`（画面取整 `40%`） |\n| 列式 | `r = (213% − 40%) ÷ (1 + 40%) = 173% ÷ 1.4`；`倍数 = 1 + r` |\n| 速算步骤（法一） | ① `173 ÷ 1.4`，把分母放缩为 `1.43`，分子同步放大取整 `180`\u003cbr>② `180 ÷ 143 = 180 × (1/7)`（因为 `143 ≈ 1000/7`），`= 18 × 7 = 1.26`\u003cbr>③ `r ≈ 126%` ⇒ `倍数 = 1 + 126% = 2.26 ≈ 2.2` |\n| 速算步骤（法二：倍数视角） | ① 分子变成 `1 + 213% = 3.13` 倍，分母变成 `1 + 40% = 1.4` 倍\u003cbr>② `倍数 = 3.13 ÷ 1.4`，分母调成 `1.43`、分子调成 `3.2`\u003cbr>③ `3.2 ÷ 1.43 ≈ 3.2 × (1/7) × 10 = 2.24 ≈ 2.3` |\n| 结论 | 选 2.2 倍，即 **B** |\n\n> **老师说**（倍数与增速的关系）：「这还是一个均值的概念，问均值跟去年增长了百分之多少是多少倍，\n> 这个都是平均数增长率的一个关系，因为倍数它就是一加增速。」\n\n> **老师说**（法二的原理）：「或者也可以这样子，我们可以直接从倍数去看。分子的增速是 213%，说明分子变成了 3.13 倍，\n> 分母变成了 1.4 倍。那它的整体就会变成 3.13 除以 1.4 倍，这个跟那个乘法的倍数关系也是一样的。\n> 那分母上是 1.4，我们就可以把它先调成 1.43，上面呢就大概的调成 3.2，\n> 还是一样的 3.2 除以 1.43 ≈ 2.3 倍左右，所以还是选择 B 选项。」\n\n**【选项原文】**\n\n- A.1.4\n- B.2.2\n- C.4.2\n- D.5.4\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **B 正确**：`r = 173% ÷ 1.4 ≈ 126%`，`倍数 = 2.26 ≈ 2.2`（画面写 `173/1.4 ≈ 180/143 = 18×7 = 1.26`，最后写 `2.26`）。\n- **A 错误**：1.4 只是分母（企业数）的倍数。\n- **C / D 错误**：4.2 / 5.4 偏大。注意 4.2 相当于「分子倍数 3.13」再加一截，方向不对。\n- **陷阱类型**：**范围陷阱**（题目问「私营企业」，题干里 `166%`、`1179.4 亿元`、`37.7%` 是**全部内资企业**的数据，是干扰）；**概念陷阱**（忘记 `倍数 = 1 + 增速`）。\n- **板书**：画面写 `资本/企业数`、`213% / 40%`、`r = (213 − 40)/1.4 = 173/1.4 ≈ 180/143 = 18×7 = 1.26 = 126%`、`2.26`，并另写 `3.13 / 1.4 ≈ 3.2/1.43 = 2.26`。\n\n---\n\n### 第 11 题｜快递企业每件业务获得的收入\n\n**【题干原文】**\n\n> 11.据统计数据显示，2018年上半年，全国快递服务企业业务量累计完成220.8亿件，同比增长27.5%；业务收入累计完成2745亿元，同比增长25.8%。\n>\n> 与上年同期相比，2018年上半年全国快递企业每件业务获得的收入约（　）。\n>\n> A.上升了1.5%\n> B.下降了1.5%\n> C.上升了1.3%\n> D.下降了1.3%\n\n**【材料数据】**\n\n| 指标 | 2018 年上半年累计 | 同比增速 |\n|---|---:|---:|\n| 快递服务企业业务量 | 220.8 亿件 | **27.5%** |\n| 业务收入 | 2745 亿元 | **25.8%** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「每件业务获得的收入」＝收入 ÷ 业务量，均值概念 → **平均数增长率** |\n| 定位数据 | 分子＝业务收入，增速 `25.8%`；分母＝业务量，增速 `27.5%` |\n| 列式 | `r = (25.8% − 27.5%) ÷ (1 + 27.5%)` |\n| 速算步骤 | ① 增速差：`25.8 − 27.5 = −1.7%`（负号先定性：**下降**，排掉 A、C）\u003cbr>② 分母 `1.275` 调成 `1.25`（变小），分子同步调小：`1.7 → 1.6`\u003cbr>③ `1.6 ÷ 1.25 = 1.6 × 8 = 12.8` ⇒ 结果为 `−1.28%`\u003cbr>④ 约 `−1.3%` |\n| 结论 | 选「下降了 1.3%」，即 **D** |\n\n> **老师说**（不能只做差就选）：「那第一步就是应该先算他们的增速差，分子减分母，得到 −1.7。\n> 然后这个地方还要继续计算，你不能靠一个负的一点七就去选了。因为你虽然是知道是负的，\n> 把 A、C 能排了，但是这个负一点五跟负一点三，那都是比这个负一点七要小一点的，\n> 除以一加 r，就除以一点二七五。注意这个地方是分母，这个增速一点二七五。\n> 它到底是要到一点五还是到一点三，是要稍微算一下的。」\n\n> **老师说**（关于「随意放缩」的疑问）：「可能有很多同学在对于这个放缩这一步呢，有点担心，感觉负一点六写的好随意啊，\n> 可以这么随意吗？当然可以，因为我们分母不管是分母还是分子，把它变小的这个幅度都是小于百分之十的。\n> 而 B 跟 D 之间的差距是大于 10% 的，基本上有 20% 那么多了。\n> 所以我们这种计算它出来，这个误差肯定也是很小的。我分子就动几个点，分母就动几个点，\n> 他们动的方案还是一致的，那相对应他们还可以抵消掉这个误差，那我剩下的这么一点点误差就真的很小。」\n\n**【选项原文】**\n\n- A.上升了 1.5%\n- B.下降了 1.5%\n- C.上升了 1.3%\n- D.下降了 1.3%\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **D 正确**：收入增速（25.8%）低于业务量增速（27.5%），均值必然**下降**；`−1.7% ÷ 1.275 ≈ −1.33%`，约下降 1.3%。\n- **A 错误**：分子增速小于分母增速，均值不可能上升。\n- **B 错误**：下降方向对，但量级偏大（1.5% 未考虑分母 `1.275` 的稀释作用）。\n- **C 错误**：方向相反。\n- **陷阱类型**：**概念陷阱**（`每件业务获得的收入`是「收入 ÷ 业务量」，分子分母不能颠倒）；**运算陷阱**（只做增速差就选，忽略分母 `(1 + r分母)`）。\n- **板书**：画面写 `收入 / 业务量`、标 `25.8` 与 `27.5`，并写 `r = −1.7%/1.275 = −1.6/1.25`（`1.25 = 1/8`）`= 1.6 × 8 = 12.8 → −1.28%`；选项 A 与 C 被划叉。\n\n---\n\n### 第 12 题｜全国棉花单位面积产量\n\n**【题干原文】**\n\n> 12.2016年，全国棉花产量534.3万吨，比2015年减产26.0万吨。全国棉花播种面积为3376.1千公顷，比2015年减少420.5千公顷。\n>\n> 2016年，全国棉花单位面积产量比上年约：\n>\n> A.下降6.8%\n> B.下降3.9%\n> C.上升2.6%\n> D.上升7.2%\n\n**【材料数据】**\n\n| 指标 | 2016 年 | 与 2015 年相比 |\n|---|---:|---|\n| 全国棉花产量 | 534.3 万吨 | 减产 26.0 万吨 |\n| 全国棉花播种面积 | 3376.1 千公顷 | 减少 420.5 千公顷 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「单位面积产量」＝产量 ÷ 面积，均值概念 → **平均数增长率** |\n| 特殊点 | 分子、分母**都没给增速** → 有两条路：①先估分子分母增速再套平均数增长率；②先算现期比、基期比再估增速 |\n| 老师选择 | 「它的增速相对好估一点，所以我们选择第一种方式」，即先估增速 |\n| 第一步：分子增速 | `产量增速 ≈ −26 ÷ 560 ≈ −5%`（用 2015 年产量 534.3 + 26 ≈ 560 做分母） |\n| 第二步：分母增速 | `面积增速 ≈ −420 ÷ 3796 ≈ −11%`（用 2015 年面积 3376.1 + 420.5 ≈ 3797 做分母） |\n| 第三步：平均数增长率 | `r = (−5%) − (−11%) 再除以 (1 − 11%) = 6% ÷ (1 − 11%)` |\n| 速算步骤 | ① 增速差：`−5 − (−11) = +6%`，**负负得正 ⇒ 上升**（排掉 A、B）\u003cbr>② 分母 `1 − 11% = 0.89 \u003c 1` ⇒ 结果**比 6% 更大**\u003cbr>③ 画面写 `6%/(1−11%) > 6%` ⇒ 只有 D（上升 7.2%）满足 |\n| 结论 | 选「上升 7.2%」，即 **D** |\n\n> **老师说**（两种思路的选择）：「产量他没给增速，面积也没给增速，那怎么办呢？这个时候就有两种思路，\n> 一种还是常规的，我们去把它的分子分母的增速找出来。第二种就是把它的现期算出来，再去看它的增速。\n> 这两种思路总体都是三步，第一步算分子增速，第二步算分母增速，第三步算他们的平均数增长率。\n> [第二种]第一步算它的现期比，第二步算它的基期比，然后再看基期怎么变成现期，估一个增速。\n> 那其实都是可以的，但到底用哪一种呢，就要结合数据去判断了。\n> 如果增速比较好、估这个比较容易算，就用第一种。如果现期比和基期比比较好算，就用第二种。\n> 比方说如果它这个分母上就是什么五百除个五百，它乘二就它这个比值非常好写出来，那肯定用第二种嘛。\n> 如果它的这个增速很好估，比如这个地方一眼就能看出来，它是负百分之五左右，那我们就用第一种。\n> 那像这个题目呢，它的增速相对好估一点，所以我们选择第一种方式。」\n\n> **老师说**（精度要求）：「一般来说，平均的增长率或者说乘积增长率，它的计算的精度要求往往不是太高。\n> 大概先估一下就好了，尤其这个题目应该看一下吧，差距还是很大的，二点六、七点二、三点九、六点八什么的，\n> 这个差挺多的。所以可以简单的估一下，这也是上面这种方式相对来说可能的一个优势，\n> 就是增速往往它估算你不用算的很细。」\n\n> **老师说**（短平快）：「基本上这个增速差百分之六写出来之后就能直接选 D 了，\n> 这个什么除一点一减去百分之十一，这个其实是没必要写的。这种运算的时候，思路一定要短平快。\n> 平均数增长率就先看增速差，再去考虑去除这个分母。」\n\n**【选项原文】**\n\n- A.下降6.8%\n- B.下降3.9%\n- C.上升2.6%\n- D.上升7.2%\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **D 正确**：`6% ÷ (1 − 11%) ≈ 6% ÷ 0.89 ≈ 6.74%`，考虑到前面是粗估（`−5%`、`−11%`），落在「上升 7.2%」一档。\n- **A / B 错误**：产量降幅（约 −5%）远小于面积降幅（约 −11%），单位面积产量必然**上升**，不可能下降。\n- **C 错误**：上升方向对，但 2.6% 太小——`6% ÷ 0.89` 一定大于 6%。\n- **陷阱类型**：**概念陷阱**（`单位面积产量 = 产量 ÷ 面积`，分子分母不能颠倒）；**运算陷阱**（忘记分母 `(1 − 11%)` 小于 1，会使结果比增速差更大）。\n- **板书**：画面写 `产量 / 面积`，右侧写 `r1`、`r2` 对照 `现期/基期`，并写 `−26/560 ≈ −5%`、`−420/3796 ≈ −11%`、`r = (−5% + 11%)/(1 − 11%) = 6%/(1 − 11%) > 6%`，选项 D 被圈出。\n\n---\n\n### 第 13 题｜中药行业平均每个雇员创造的收益\n\n**【题干原文】**\n\n> 13.表中该省4个中药行业类别中，有（　）个行业类别2015年平均每个雇员创造的销售及其他收益高于2013年水平。\n>\n> A.1　B.2　C.3　D.4\n\n**【材料数据】**\n\n表头（画面原文）：**2013-2015年某省中药行业经营状况**\n\n| 行业类别 | 年份 | 单位数（个） | 雇员人数（人） | 销售及其他收益（亿元） | 雇员薪酬（亿元） | 经营盈余总额（亿元） |\n|:---|:---:|---:|---:|---:|---:|---:|\n| 中药制造业 | 2013 | 210 | 2140 | 36.52 | 4.42 | 7.55 |\n| | 2014 | 210 | 2260 | 39.43 | 5.03 | 8.81 |\n| | 2015 | 210 | 2240 | 39.23 | 5.88 | 13.10 |\n| 中药进出口贸易业 | 2013 | 560 | 1820 | 129.86 | 2.97 | 5.40 |\n| | 2014 | 560 | 1840 | 104.31 | 3.10 | 5.84 |\n| | 2015 | 540 | 1840 | 106.37 | 3.30 | 6.35 |\n| 中药批发业 | 2013 | 360 | 1370 | 54.26 | 2.37 | 2.32 |\n| | 2014 | 340 | 1270 | 57.54 | 2.39 | 3.78 |\n| | 2015 | 330 | 1270 | 56.21 | 2.47 | 3.85 |\n| 中药零售业 | 2013 | 1400 | 4920 | 69.48 | 6.01 | 6.65 |\n| | 2014 | 1380 | 4840 | 71.59 | 6.36 | 7.14 |\n| | 2015 | 1370 | 4790 | 71.06 | 6.78 | 6.26 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「平均每个雇员创造的销售及其他收益」＝收益 ÷ 雇员人数，均值比较 2015 vs 2013 → 只要**平均数增长率 > 0** |\n| 核心判据 | `平均数增长率 > 0 ⟺ 分子增速 > 分母增速`（画面写 `r1 > r2`） |\n| 逐个判断 | ① **中药制造业**：收益 `36.52 → 39.23`（增约 2.7，≈7.5%），人数 `2140 → 2240`（增 100，≈4.7%）⇒ `r1 > r2` ✅ 高于 2013\u003cbr>② **中药进出口贸易业**：收益 `129.86 → 106.37`（下降），人数 `1820 → 1840`（上升）⇒ 分子降、分母升 ❌\u003cbr>③ **中药批发业**：收益 `54.26 → 56.21`（上升），人数 `1370 → 1270`（下降）⇒ 分子升、分母降 ✅\u003cbr>④ **中药零售业**：收益 `69.48 → 71.06`（上升），人数 `4920 → 4790`（下降）⇒ 分子升、分母降 ✅ |\n| 结论 | 共 **3** 个，即 **C** |\n\n> **老师说**（口诀化判断）：「这是个平均数，它的平均数增长率有没有大于零，那要看平均数增长率有没有大于零，\n> 就是看分子的增速有没有高于分母的增速就好了。看这个收益的增速，有没有高于雇员人数的增速。」\n\n> **老师说**（速算技巧）：「从 36.5 变成 39.2，是增加了 2.7 左右。从 2140 到 2240，是增加了 100。\n> 然后就跟我们上一题一样，你先粗略的大概的估计一下，2.7 是 36.5 的百分之多少？\n> 27 除以 36 的话，正好是 3/4。一个是 4×9，一个是 3×9。9 乘法表要熟悉，也就是 7.5% 左右。\n> 而另外这个一百，它占这个两千一百，是不到百分之五的，是比百分之五稍微低一点点的。\n> 所以分子的增速就是收益的增速，比分母雇员人数的增速要快，那么它（平均数）就是提高的。」\n\n> **老师说**（后三个一眼判断）：「再 129 到 106 下降，1820 到 1840 上升。那分子下降，分母上升，整体变小，\n> 这个就不行。分子增速小于零，分母增速大于零，它肯定还是下降的。\n> 54 到 56 上升，137 到 127 下降，那就反过来了。分子提高，分母降低呢，平均数是增加的。\n> 同理，69 到 71 增加，492 到 479 下降，也是提高。这个平均数在增加，所以有**三个**高于 13 年水平。」\n\n**【选项原文】**\n\n- A.1\n- B.2\n- C.3\n- D.4\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **C 正确**：中药制造业、中药批发业、中药零售业共 3 个行业类别满足「收益增速 > 雇员人数增速」。\n- **A / B / D 错误**：中药进出口贸易业是唯一不满足的（收益 129.86 → 106.37 下降，雇员 1820 → 1840 上升），故不是 4 个；也不是 1 个或 2 个。\n- **陷阱类型**：**时间陷阱**（基准是 **2013 年**，不是 2014 年，画面题干「高于 2013 年水平」）；**概念陷阱**（只需判增速大小关系，无需真算出平均数增长率的具体数值）；**范围陷阱**（只统计「4 个中药行业类别」，单位数、雇员薪酬、经营盈余总额三列均为干扰）。\n- **板书**：画面写 `收益/雇员`、`r > 0`、`r1 > r2`，并在「中药制造业」行旁算 `27/36 = 3/4 = 7.5%`、`4×9 / 3×9`；后三行用箭头标注升降方向。\n\n---\n\n### 第 14 题｜2013 比 2011 年快递业务量增长\n\n**【题干原文】**\n\n> 14.2013比2011年，我国的快递业务量增长约为（　）。\n>\n> A.120%　B.150%　C.170%　D.250%\n\n**【材料数据】**\n\n图表标题（画面原文）：**图1 2012-2016年快递业务量（亿件）及增长速度（%）**\n\n| 年份 | 快递业务量（亿件，柱） | 比上年增长（%，折线） |\n|:---:|---:|---:|\n| 2012 | 56.9 | **54.80** |\n| 2013 | 91.9 | **61.60** |\n| 2014 | 139.6 | 51.90 |\n| 2015 | 206.7 | 48 |\n| 2016 | 312.8 | 51.40 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「2013 比 2011 年」中间隔 2012 年 → **间隔增长率** |\n| 定位数据 | 2011→2012 的增速＝2012 年的同比增速 `54.8%`；2012→2013 的增速＝2013 年的同比增速 `61.6%` |\n| 列式 | `r = 54.8% + 61.6% + 54.8%×61.6%` |\n| 速算步骤 | ① 先加：`54.8 + 61.6 = 116.4`\u003cbr>② 尾巴**这次不能忽略**：「因为这个增速太大了，两个都很大，两个都很大的时候，一定不能忽略」→ 用**乘法放缩**：`61.6%` 往下调一点写 `60%`、另一个往上调一点写 `56%`\u003cbr>③ `56 × 60 = 3360 → ÷100 = 33.6`\u003cbr>④ `116.4 + 33.6 = 150` |\n| 结论 | 选增长约 150%，即 **B** |\n\n> **老师说**（为什么一定要算尾巴）：「然后他后面这个小尾巴呢，这次就不能够去忽略了，\n> 因为这个增速太大了，两个都很大，两个都很大的时候，一定不能忽略，稍微要给他们乘一下了。」\n\n> **老师说**（放缩技巧）：「然后这个地方计算的时候可以运用一些小技巧。因为这个地方属于是位数比较多嘛，\n> 可以把它的位数变小一点，这样子好乘一点。而且本身虽然它增速还是比较大的，\n> 但是跟前面的百分之一百一十六相比，好歹是两个不足百分之百的这种零点几的一个乘积，\n> 它这个还是没有那么特别大的。所以精度要求没有那么高，可以用乘法放缩，稍微的估一下，\n> 61.6 是很适合直接写成 60%，把它往下调一点，那 60 往下调了，另外一个就往上调一点，就在 55% 左右，\n> 这样好算。55 多一点，其实应该写 56 吧，56 好一点。然后 56% 乘以 60%，56 乘以 60 就是 33.6，\n> 所以再加一个 33.6，加起来就正好是 150%。」\n\n> **老师说**（本考点收束）：「间隔增长率，你就把中间这两段时间对应的各自的一个增速给它累计起来就可以了。」\n\n**【选项原文】**\n\n- A.120%\n- B.150%\n- C.170%\n- D.250%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **B 正确**：`116.4% + 33.6% ≈ 150%`。\n- **A 错误**：120% 接近只把两段增速相加（116.4%）凑整，漏掉了约 33.6% 的乘积尾巴。\n- **C / D 错误**：170%、250% 均偏大。\n- **陷阱类型**：**时间陷阱**（`2013 比 2011` 中间隔 2012 年，不能用 2013 年自身对 2012 年的增速单独作答）；**概念陷阱**（两段增速都接近 60%，乘积尾巴高达 33 个百分点，绝对不能忽略）。\n- **板书**：画面在 `2012年` 处画圈并标 `间隔`，写 `11 ← 54.8% → 12 ← 61.6% → 13`，右侧写 `r = 116.4% + 54.8%×61.6% ≈ 150%`、`54.8 × 61.6 ÷ 100 ≈ 33.6`、`116.4 + 33.6 = 150`，选项 B 被圈出。\n\n---\n\n### 第 15 题｜房地产开发企业到位资金（20 年增量）\n\n**【题干原文】**\n\n> 15.2021年，房地产开发企业到位资金201132亿元，比上年增长4.2%，比2019年增长12.6%，两年平均增长6.1%。其中，国内贷款23296亿元，比上年下降12.7%；利用外资107亿元，比上年下降44.1%；自筹资金65428亿元，比上年增长3.2%；定金及预收款73946亿元，比上年增长11.1%；个人按揭贷款32388亿元，比上年增长8.0%。\n>\n> 2020年房地产开发企业到位资金比2019年约多（　）亿元。\n>\n> A.3456.7\n> B.11563.7\n> C.14399.8\n> D.22506.8\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2021 年房地产开发企业到位资金 | 201132 亿元（比上年增长 4.2%） |\n| 比 2019 年增长 | 12.6% |\n| 两年平均增长 | 6.1% |\n| 国内贷款 | 23296 亿元（比上年下降 12.7%） |\n| 利用外资 | 107 亿元（比上年下降 44.1%） |\n| 自筹资金 | 65428 亿元（比上年增长 3.2%） |\n| 定金及预收款 | 73946 亿元（比上年增长 11.1%） |\n| 个人按揭贷款 | 32388 亿元（比上年增长 8.0%） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求「2020 年比 2019 年的增量」→ 需要 2020 年的**增速** + 2019 年的**值**；题干只给 2021 年，构成 **间隔增长率（拆分）** |\n| 第一步：拆出 2020 年增速 | 整体（19→21）`R = 12.6%`；右边一段（20→21）`r2 = 4.2%`；求左边一段（19→20）`r1`：`r1 = (R − r2) ÷ (1 + r2) = (12.6% − 4.2%) ÷ (1 + 4.2%) = 8.4% ÷ 1.042` |\n| 第一步速算 | 分母 `1 + 4.2%` 用**画除为乘**：`8.4% × (1 − 4%)`（把 4.2% **提前修正**为 4%），`≈ 8.4% − 8.4%×4% ≈ 8.4% − 0.33% ≈ 8%` |\n| 第二步：求 2020 年值（可选） | `2021 年 20 万 ÷ 1.042 ≈ 20万 − 20万×4% = 200000 − 8000 = 192000` |\n| 第三步：求增量 | `Δ2020 = 192000 × 8% = 15360`，因画除为乘结果**偏大**，再扣掉约 8%：`15360 − 15360×8% ≈ 14100 ≈ 14000多` |\n| 老师的「更快」做法 | 「不需要算 19 年是多少，也不需要算 20 年是多少，直接拿 21 年的代替先算一下，然后你最后根据选项结合去调一下就可以了」：`20万 × 8% = 16000`，结果偏大 12.6%，选项里哪个数涨 12.6% 能变成 16000？只有 C 的 14399.8（`14399.8 × 1.126 ≈ 16215`）最接近 |\n| 结论 | 选 14399.8，即 **C** |\n\n> **老师说**（拆分与累积的对偶）：「那现在我们需要的左边这段的增速，就可以通过去拆分出右边这一段的增速，就能得到左边的增速了。\n> 右边这段增速就是二一年的同比增速百分之四点二。所以我们先拆，那拆的时候，二零年的增速就等于先做差，\n> 这个跟我们算什么成绩（乘积）增长率那种也是一样的，跟累计起来是一样，累计的时候你要先加，加是主要的；\n> 那拆分的时候，减就是主要的，先减下来是 8.4，但这 8.4 准吗？它不准，因为减了之后还要除个 1 + r，\n> 就除个 1 + 4.2%。」\n\n> **老师说**（提前修正的妙用）：「好在做这种增速的拆分，或者就是平均数增长率的计算的时候，注意这个分母上的增速，\n> 去运用我们前面学的三板斧，画除为乘、分数法、放缩，去简单的估算、快速的估算。\n> ……因为这个增速比较小嘛，所以我们画除为乘直接限期减增量，增量呢就是约等于 8.4 乘以 4%。\n> 为什么是 4%？不是 4.2%？因为我们提前修正了。如果你只用现期乘增速去算这个增量，结果会偏大 4.2%。\n> 那我们就先让这个某个数小百分之四点二，让四点二变成了四，这样子的话就能算出来它的增速，\n> 除下来应该就是百分之八左右。因为四八三十二嘛，相当于减了个零点三几，\n> 算下来就是八左右。」\n\n> **老师说**（先算好算的、把不重要的往后放）：「但这样子稍微麻烦了一点。因为我们可以注意到，其实选项差距真的很大。\n> 而且我们在第二节课就讲过，你尽量把一些影响比较小的、不是那么重要的、稍微也不是那么好算的东西，往后放放，\n> 先把好算的、重要的往前放。那在这个问题中，什么样的东西比较好算呢？什么东西影响比较大呢？\n> 我们现在已经有的增速了，这个百分之八是准确的，我们只是这个限期不知道，\n> 或者说就是对应的二零年、它这个基期一九年，我们不知道对不对？\n> 你要算 20 年的增量，其实准确来说，应该是 19 年的值去乘以增速 8%。……有了呀，那 19 年的值在哪呢？\n> 需要在这个 20 万的基础上退 12.6 个点。那这个十几个点相对于选项这种差距来源其实不是很重要，\n> 而且就算重要，我们可以最后再调嘛。所以我们可以先拿我们比较整的已知的二一年代替一下一九年。\n> 21 年是 20 万，先乘了再说呗。20 万乘以 8% 是 16000，那这个结果是不是偏大了 12% 呀？\n> 因为 21 年比 19 年多了 12% 嘛，所以这个结果也会把这个误差的比例穿透到结果上去。\n> 那选项里面哪一个数涨 12.6% 能变成 16000 呢？不就只有 C 吗？\n> 所以这个题目压根不需要算 19 年是多少，也不需要算 20 年是多少，\n> 直接拿二一年的代替先算一下，然后你最后根据选项结合去调一下就可以了。」\n\n**老师补充：「两年平均增长 6.1%」是什么意思？**\n\n> 「后面这句话两年平均增长百分之六点一，这个什么意思呢？19 年、20 年、21 年，\n> 从 19 涨到 20，20 涨到 21，这是两年的增长。什么叫平均增长 6.1？\n> 是这个整体增长的两次增速的一个平均值吗？还是说这个总增速的一个平均值？不是吧？\n> 你 12.6 除以 2 不应该是 6.3 吗？怎么变成 6.1 了呢？\n> 因为你刚刚这里算的是百分之八，这个地方是百分之四点二，这样算好像都有点像，\n> 但其实也不是的，百分之八、百分之四点二，他们的平均值确实是六点一，但不是这个意思。\n> **不是两年增速的平均值，这个平均增长其实是年均增长的意思。**\n> 意思就是你可以把这个完整的增长重新写一下，把这个完整的增长一九、二零、二一整体不是涨了百分之十二点六吗？\n> 你不用管它这两次分别涨多少，我可以把它们视为**每年都涨了 6.1%**。这样子，他们整体下来的结果是一致的。」\n\n> 「你看，我用（乘积）增长率那个间隔增长率的那个关系给你理一下，**每年如果都涨百分之六点一**，\n> 那这个总的增速它就应该是 `6.1 + 6.1 + 6.1×6.1÷100`。\n> 12.2 加上 0.36（画面写 6636 → 0.36），应该算下 12.56，也是 12.6%。\n> 这就是两年平均增长的意思，就是把这两年的增长总体的增长，可以视为每一年都增长百分之六点一。\n> 这个百分之六点一它并没有一个实际的存在，并不是说哪一年真的涨到百分之六点一，\n> 只是说它相当于等于这样的一个增长，它也使用那些（乘积）增长的计算公式计算关系。」\n\n**【选项原文】**\n\n- A.3456.7\n- B.11563.7\n- C.14399.8\n- D.22506.8\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **C 正确**：`r2020 = 8.4% ÷ 1.042 ≈ 8%`；`Δ2020 = 201132 ÷ 1.042 × 8% ≈ 192000 × 8% = 15360`，修正后约 1.4 万亿，即 14399.8 亿元。\n- **A 错误**：3456.7 量级太小，约为 201132 的 1.7%。\n- **B 错误**：11563.7 比正确值偏小。\n- **D 错误**：22506.8 明显偏大。\n- **陷阱类型**：**时间陷阱**（问 2020 年比 2019 年的增量，却只给了 2021 年的现期与增速，必须先拆出 2020 年增速）；**概念陷阱**（把「两年平均增长 6.1%」误当成 `12.6% ÷ 2` 或两次增速的平均值）；**运算陷阱**（拆分时忘记除 `(1 + 4.2%)`）。\n- **板书**：画面写 `19 → 20 → 21` 时间轴（上标整体 `12.6%`、右段 `4.2%`），并写：\n  ```\n  r20 = 8.4% / (1 + 4.2%) = 8.4% − 8.4%×4% = 8%\n  20 年值 = 20万 − 20万×4% = 192000\n  Δ20 = 192000 × 8% = 15360 → 15360 − 15360×8% ≈ 14000 多\n  或：Δ20 ≈ 20万 × 8% = 16000，偏大 12.6% → 对应 C\n  ```\n  画面下半部另写 `6.1% + 6.1% + 6.1%×6.1% = 12.2 + 0.36 = 12.56% ≈ 12.6%`。\n\n---\n\n## 三、本讲知识点总表\n\n| 考点 | 识别特征 | 公式 | 本集例题 |\n|---|---|---|---|\n| **乘积（累积）增长率** | 所求量满足 `A = B × C`（如总额＝量×均价、总产量＝面积×单产） | `r = r1 + r2 + r1×r2` | 第 1、7 题 |\n| **间隔增长率** | 所求年份与给出年份中间隔了一年及以上；或「A 比 B 增长 x%」跨越多年 | `R = r1 + r2 + r1×r2` | 第 3、4、5、8、14 题 |\n| **间隔增长率的拆分** | 给了整体增速 R 与其中一段 r2，求另一段 r1 | `r1 = (R − r2) ÷ (1 + r2)` | 第 15 题 |\n| **平均数增长率** | 所求对象是「均值」（户均、每人次、每件、单位面积、平均每人） | `r = (r1 − r2) ÷ (1 + r2)`（r1 分子增速、r2 分母增速） | 第 2、9、11、12 题 |\n| **平均数增长率的定性判断** | 只问「高于/低于」某年水平，或「上升/下降」 | `r > 0 ⟺ r1 > r2` | 第 13 题 |\n| **倍数与增速互化** | 问「是……的几倍」 | `倍数 = 1 + 增速`；多段时 `倍数 = 倍数1 × 倍数2 × …` | 第 6、8、10 题 |\n| **反求基期** | 已知现期 + 增速，求过去某年值 | `基期 = 现期 ÷ (1 + r)` | 第 4、5、15 题 |\n\n---\n\n## 四、速算口诀与解题流程\n\n### 4.1 三大公式速记（代码块版）\n\n```\n【乘积 / 间隔增长率】  r = r1 + r2 + r1 × r2\n                       主项相加为主，小尾巴看大小决定算不算\n\n【间隔增长率拆分】      r1 = (R − r2) ÷ (1 + r2)\n                       累积时\"加\"是主要的，拆分时\"减\"是主要的\n\n【平均数增长率】        r = (r1 − r2) ÷ (1 + r2)\n                       r1 = 分子增速，r2 = 分母增速\n\n【倍数与增速】          倍数 = 1 + 增速\n\n【反求基期】            基期 = 现期 ÷ (1 + 增速)\n```\n\n### 4.2 「小尾巴」r1×r2 到底要不要算？（老师的判据）\n\n| 情形 | 处理 | 出处 |\n|---|---|---|\n| 两个增速都很小（如 2.8% 与 8.9%） | 尾巴只有零点几个百分点，**可以粗略估或忽略** | 第 1 题 |\n| 两个增速同为负 | 尾巴**负负得正**，会让降幅变小，方向不能搞错 | 第 7 题 |\n| 两个增速都较大（都接近 60%） | **绝对不能忽略**，尾巴可能高达 30 多个百分点 | 第 14 题 |\n| 两增速都极小（如 1%、2%） | 尾巴仅 0.02%，四舍五入会被舍掉，可直接相加 | 第 3 题讲解 |\n\n### 4.3 分母带 `(1 + r)` 时的三板斧\n\n```\n① 画除为乘   a ÷ (1 + r) ≈ a × (1 − r)      （要求 |r| 小，一般 10% 以内）\n② 提前修正   把 4.2% 调成 4%、把 8.9% 调成 9%，让数字变整好算\n③ 分数法     把百分数换成分数（18% ≈ 1/5、−24.4% ≈ −1/4、6.86% ≈ 7%）\n④ 放缩       分子分母同向调整（一个调大一个调小，或一起调小），\n             只要调整幅度 \u003c 选项差距，误差可抵消\n```\n\n> **老师说**：「分母不管是分母还是分子，把它变小的这个幅度都是小于百分之十的，\n> 而 B 跟 D 之间的差距是大于 10% 的……我分子就动几个点，分母就动几个点，\n> 他们动的方案还是一致的，那相对应他们还可以抵消掉这个误差。」\n\n### 4.4 万能解题流程（本集 15 题归纳）\n\n```\n第 1 步  看问的是\"什么量\"的增速 / 倍数 / 增量\n第 2 步  给\"什么数据\"？\n         · 只给现期值          → 走乘积增长率（去别的量上找增速）\n         · 跨年问增长          → 间隔增长率\n         · 均值概念            → 平均数增长率\n         · 问倍数              → 直接用倍数相乘（= 1+增速）\n第 3 步  找分子 / 分母 / 两个因素，各对应哪个增速\n第 4 步  先做\"加\"或\"减\"（主项），再决定小尾巴\n第 5 步  分母有 (1+r) 就画除为乘 / 放缩 / 提前修正\n第 6 步  结合选项定答案（选项差距大就大胆粗估）\n```\n\n> **老师说**：「这种运算的时候，思路一定要短平快。」「不要死板。」\n\n---\n\n## 五、易错点与陷阱清单\n\n| 陷阱类型 | 具体表现 | 本集出现 |\n|---|---|---|\n| **时间陷阱** | ① 问 2018 年相对 **2016** 年，误用 2016 年自身增速 9.9% | 第 3 题 |\n| | ② 问 2014 年，只退一年到 2015 年 | 第 4 题 |\n| | ③ 问 2013 年，只退一年到 2014 年 | 第 5 题 |\n| | ④ 问 18 年 vs 15 年，漏掉中间两次变化 | 第 8 题 |\n| | ⑤ 问 `2013 比 2011`，误用单年增速 | 第 14 题 |\n| | ⑥ 问 2020 年增量，只看到 2021 年的数据 | 第 15 题 |\n| **概念陷阱** | ① 把乘积增长率当成简单相加（漏 `r1×r2`），或反过来两增速很大时仍忽略尾巴 | 第 1、3、14 题 |\n| | ② 均值增速误当成分子增速，或忘了除 `(1 + r分母)` | 第 2、9、11、12 题 |\n| | ③ 算完增速忘了 `倍数 = 1 + 增速` | 第 6、10 题 |\n| | ④ 「降幅收窄 1.6 个百分点」要**加回去**才得去年降幅 26% | 第 4 题 |\n| | ⑤ 「增长率比 2014 年下降 0.8 个百分点」要**加回去**得 9% | 第 5 题 |\n| | ⑥ 「两年平均增长 6.1%」≠ `12.6% ÷ 2`，是**年均增长**（`6.1+6.1+6.1×6.1%`） | 第 15 题 |\n| | ⑦ 负负得正的尾巴会让降幅变小（−18.5 → −18），不是变大 | 第 7 题 |\n| | ⑧ 分母 `(1 − 11%)` \u003c 1，会使结果**比增速差更大** | 第 12 题 |\n| **范围陷阱** | ① 问长江流域却用黄河流域数据（24.3%、2.1%） | 第 7 题 |\n| | ② 问私营企业却用全部内资企业数据（166%、37.7%、1179.4 亿元） | 第 10 题 |\n| | ③ 中药行业表里「单位数 / 雇员薪酬 / 经营盈余总额」是干扰列 | 第 13 题 |\n|  | ④ 第 2 题「投资总额 15.05%」是干扰 | 第 2 题 |\n| **单位陷阱** | ① 第 1 题均价单位「千美元/吨」与出口量「万吨」 | 第 1 题 |\n| | ② 第 5 题题干「元」、选项「万元」 | 第 5 题 |\n| **表格性质陷阱** | 「月度累计完成情况」表——数据逐月递增即为累计值，全年量看 12 月 | 第 8 题 |\n| **运算陷阱** | 只做增速差就选，忽略分母 `(1 + r)` 的稀释 / 放大作用 | 第 11、12 题 |\n\n---\n\n## 六、老师金句\n\n> ⭐ **「一般来说在我们资料分析中，如果要你算增速，它一般就只有这几种考法（给增量求增速 / 累积与拆分 / 平均数增长率）。」**\n\n> ⭐ **「不要死板。」**——遇到「给两年增速求间隔之前基期」时，累计好算就累计，直接推两次基期好算就推两次。\n\n> ⭐ **「这种运算的时候，思路一定要短平快。平均数增长率就先看增速差，再去考虑去除这个分母。」**\n\n> ⭐ **「先说增速差写出来就能直接选，这个什么除一减百分之十一，这个其实是没必要写的。」**\n\n> ⭐ **「尽量把一些影响比较小的、不是那么重要的、稍微也不是那么好算的东西，往后放放，先把好算的、重要的往前放。」**——第 15 题直接拿 2021 年值代替 2019 年值估算增量。\n\n> ⭐ **「出题人想要考察这个（乘积）增长率，它肯定是会让后面这个小尾巴起到相应的作用的。不然的话，他这题目不就等于白考嘛。」**\n\n> ⭐ **「降幅收窄就好像人的腰围一样，从 10 英寸的腰围变成 8 英寸的腰围，那不就是收窄了吗？」**\n\n> ⭐ **「如果是这种间隔形式的问法，他问的不是增速，问的是倍数，其实你直接用倍数来看会更简单。……如果他直接问了倍数，我们就看倍数，问增速，我们就看增速。」**\n\n> ⭐ **「因为倍数它就是一加增速。」**\n\n> ⭐ **「这个百分之六点一它并没有一个实际的存在，并不是说哪一年真的涨到百分之六点一，只是说它相当于等于这样的一个增长。」**——「两年平均增长」的本质是年均增长。\n\n> ⭐ **「我分子就动几个点，分母就动几个点，他们动的方案还是一致的，那相对应他们还可以抵消掉这个误差，那我剩下的这么一点点误差就真的很小。」**\n\n> ⭐ **「9 乘法表要熟悉。」**——第 13 题用 `27/36 = 3/4 = 7.5%` 秒判。\n\n---\n\n*（本集共 15 道课后作业题，已逐题全讲，一题不落。）*\n\n\n---\n","outline":[{"level":2,"text":"一、本集主线：15 道作业题的考点分布","id":"一本集主线15-道作业题的考点分布"},{"level":2,"text":"二、例题精讲（逐题全讲，一题不落）","id":"二例题精讲逐题全讲一题不落"},{"level":3,"text":"第 1 题｜2018 年全球茶叶产量 · 出口总额同比增速","id":"第-1-题2018-年全球茶叶产量-出口总额同比增速"},{"level":3,"text":"第 2 题｜2015 联考 · 新登记注册外商投资企业户均注册资本","id":"第-2-题2015-联考-新登记注册外商投资企业户均注册资本"},{"level":3,"text":"第 3 题｜社会消费品零售总额表 · 间隔增幅","id":"第-3-题社会消费品零售总额表-间隔增幅"},{"level":3,"text":"第 4 题｜东北地区民间固定资产投资额（间隔增长率反求基期）","id":"第-4-题东北地区民间固定资产投资额间隔增长率反求基期"},{"level":3,"text":"第 5 题｜城镇居民人均可支配收入（间隔增长率反求基期）","id":"第-5-题城镇居民人均可支配收入间隔增长率反求基期"},{"level":3,"text":"第 6 题｜2007-2012 年测绘服务总值倍数（间隔增长率·倍数视角）","id":"第-6-题2007-2012-年测绘服务总值倍数间隔增长率倍数视角"},{"level":3,"text":"第 7 题｜长江流域棉区棉花总产量同比变化","id":"第-7-题长江流域棉区棉花总产量同比变化"},{"level":3,"text":"第 8 题｜社会消费品零售总额月度累计表（三次变化累积求倍数）","id":"第-8-题社会消费品零售总额月度累计表三次变化累积求倍数"},{"level":3,"text":"第 9 题｜全国资助学前教育 · 每人次平均受资助额","id":"第-9-题全国资助学前教育-每人次平均受资助额"},{"level":3,"text":"第 10 题｜新设私营企业平均注册资本（金）倍数","id":"第-10-题新设私营企业平均注册资本金倍数"},{"level":3,"text":"第 11 题｜快递企业每件业务获得的收入","id":"第-11-题快递企业每件业务获得的收入"},{"level":3,"text":"第 12 题｜全国棉花单位面积产量","id":"第-12-题全国棉花单位面积产量"},{"level":3,"text":"第 13 题｜中药行业平均每个雇员创造的收益","id":"第-13-题中药行业平均每个雇员创造的收益"},{"level":3,"text":"第 14 题｜2013 比 2011 年快递业务量增长","id":"第-14-题2013-比-2011-年快递业务量增长"},{"level":3,"text":"第 15 题｜房地产开发企业到位资金（20 年增量）","id":"第-15-题房地产开发企业到位资金20-年增量"},{"level":2,"text":"三、本讲知识点总表","id":"三本讲知识点总表"},{"level":2,"text":"四、速算口诀与解题流程","id":"四速算口诀与解题流程"},{"level":3,"text":"4.1 三大公式速记（代码块版）","id":"41-三大公式速记代码块版"},{"level":3,"text":"4.2 「小尾巴」r1×r2 到底要不要算？（老师的判据）","id":"42-小尾巴r1r2-到底要不要算老师的判据"},{"level":3,"text":"4.3 分母带 (1 + r) 时的三板斧","id":"43-分母带-1-r-时的三板斧"},{"level":3,"text":"4.4 万能解题流程（本集 15 题归纳）","id":"44-万能解题流程本集-15-题归纳"},{"level":2,"text":"五、易错点与陷阱清单","id":"五易错点与陷阱清单"},{"level":2,"text":"六、老师金句","id":"六老师金句"}]}]},{"name":"第 6 课 拉长平均率（含课后作业）","items":[{"id":"P15","title":"拉长平均率","full":"第6课 拉平增长率（全一集）","lect":"","dur":"169:04","sec":10144,"theme":"基期比值（拉平增长率 / 补正平均数增长率）的完整公式体系——基期比值的估算、基期比值比较大小、增量比值、增量比较大小、基期和差，共五大考点","url":"https://www.bilibili.com/video/BV15bGA6PEJL?p=15","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 15 集\n\n# 第6课 拉平增长率（全一集）\n\n> **课程信息**\n> - 课程名称：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> - 本集位置：合集第 15 集（共 21 集）\n> - 视频地址：`https://www.bilibili.com/video/BV15bGA6PEJL?p=15`\n> - 时长：约 2 小时 49 分（10144 秒）\n> - 本集主题：**基期比值（拉平增长率 / 补正平均数增长率）的完整公式体系**——基期比值的估算、基期比值比较大小、增量比值、增量比较大小、基期和差，共五大考点\n> - 素材规模：141 张网格图（3×3）、1268 张原帧\n> - 板书标题（画面显示）：**「拉平增长率」**（转写中作\"拉长平均率\"，以画面为准）\n\n---\n\n## 目录\n\n- [一、开篇：从\"分式的增速\"到\"定这个量\"](#一开篇从分式的增速到定这个量)\n- [二、本集知识地图（目录页）](#二本集知识地图目录页)\n- [三、板块 01 基期比值：从两个特例到一般公式](#三板块-01-基期比值从两个特例到一般公式)\n  - [1. 引入例题：单价 = 销售额 / 销量](#1-引入例题单价--销售额--销量)\n  - [2. 特例一：分子分母增速相同（+10% 与 +10%）](#2-特例一分子分母增速相同10-与-10)\n  - [3. 特例二：分子增速为 0%，分母增速 +10%](#3-特例二分子增速为-0分母增速-10)\n  - [4. 特例三：分子 +10%，分母 +21%（分位上的增速不是简单差值）](#4-特例三分子-10分母-21分位上的增速不是简单差值)\n  - [5. 特例四：分子 +21%，分母 +10%（反向）](#5-特例四分子-21分母-10反向)\n  - [6. 板书公式卡：现期比 → 基期比（正式公式与两种写法）](#6-板书公式卡现期比--基期比正式公式与两种写法)\n  - [7. \"给增速低的一方补正平均数增长率\"——本课灵魂口诀](#7-给增速低的一方补正平均数增长率本课灵魂口诀)\n  - [8. 为什么要\"给低的补\"：两个优点](#8-为什么要给低的补两个优点)\n  - [9. 除法放缩视角的再解释（2000 / 1000 数值例）](#9-除法放缩视角的再解释2000--1000-数值例)\n- [四、基期比 a/b 估算练习（6 组）](#四基期比-ab-估算练习6-组)\n- [五、过程中的修正 vs 结果上的修正](#五过程中的修正-vs-结果上的修正)\n- [六、重要注意点：增速差距过大时怎么办](#六重要注意点增速差距过大时怎么办)\n- [七、例题精讲](#七例题精讲)\n- [八、结尾提炼](#八结尾提炼)\n\n---\n\n## 一、开篇：从\"分式的增速\"到\"定这个量\"\n\n> \"我们今天就开始资料分析的第六节课，拉平增长率。今天这一节课跟我们上一节课第五节课、增速的累计和拆分那一块的增速的拆分有一个比较强的关联。\"\n\n> \"昨天我们主要讲的就是平均数增长率、间隔增长率怎么计算，以及通过平均数的增长率，我们是可以去理解基期比和现期比值的一个关系。\"\n\n老师先用一个随手举的数字引出\"分式的增速\"：\n\n```\n分子 1000，增速 20%\n分母  500，增速 10%\n\n分式的增速 ≈ (20% − 10%) ÷ (1 + 10%) = 10% ÷ 1.1 ≈ 9%\n```\n\n> \"这个分式的增速就大概是百分之十除以一点一，大约是百分之九左右。\"\n\n> \"通过分子的增速，我们可以知道这个分式（今年 1000 除以 500）它的增速；然后我们有限期也有增速，我们可以通过这个增速知道它跟基期的关系。\"\n\n> \"因为这个平均的增长率它是大于零的，说明它这个均值、它这个分式是上升的，那去年肯定就比这个二要小。\"\n\n**本集要解决的问题（老师原话）：**\n\n> \"今天我们就要讲的是怎么去**定这个量**——它小到底小多少，到底小在哪儿，怎么去把它快速地给它估出来呢？\"\n\n> \"就是今天要讲的东西：一个就是**基期比值怎么算**，一个**基期比较大小**，一个**增量的比值**，还有就是**增量怎么比较大小**，以及最后一个**基期和差**。\"\n\n---\n\n## 二、本集知识地图（目录页）\n\n画面目录页（Catalogue）五大板块：\n\n| 序号 | 板块名称 | 对应本集内容 |\n| --- | --- | --- |\n| 壹 | **基期比值** | 拉平增长率公式、先补后算 / 先算后补 |\n| 贰 | **基期比较** | 基期比值比较大小 |\n| 叁 | **增量比值** | 增长量的比值 |\n| 肆 | **增量比较** | 增长量比较大小 |\n| 伍 | **基期和差** | 基期值之和差 |\n\n> \"这个大家都预习过了，我们先研究一下这个基期比值，就我们刚说的怎么去把这个值给它定下来。\"\n\n---\n\n## 三、板块 01 基期比值：从两个特例到一般公式\n\n### 1. 引入例题：单价 = 销售额 / 销量\n\n**【题干原文】**（画面逐字）\n\n> 某年甲产品总销售额为 110 万元，同比增长 10%，销量 11 万单，同比增长 10%。\n> 问：去年甲产品单价多少？\n\n**【材料数据】**\n\n| 指标 | 本期（某年） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 总销售额 | 110 万元 | +10% | 分子 |\n| 销量 | 11 万单 | +10% | 分母 |\n| 单价 | ？ | — | 销售额 ÷ 销量 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 单价是\"比值\"；给本期、求去年 → **基期比值** |\n| 关系式 | `单价 = 销售额 ÷ 销量` |\n| 本期单价 | `110 万 ÷ 11 万 = 10 元/单` |\n| 常规做法 | 先算两个基期：`110万/(1+10%)`、`11万/(1+10%)`，再相除 → 要算 **两个基期 + 一次除法** |\n\n> \"单价就是销售额除以销量……我一共十一万单卖了一百一十万，那我平均每一单今年卖了多少？今年是不是一百一十万？除以 11 万就是 10 元每单。\"\n\n> \"那我们如果想算去年的怎么算呢？如果我们还用单价 = 销售额 ÷ 销量，我们就需要把去年的销售额、去年的销量给它算出来吧。\"\n\n---\n\n### 2. 特例一：分子分母增速相同（+10% 与 +10%）\n\n板书逐字（画面）：\n\n```\n去年 单价 = 销售额/销量 = (110万 ÷ (1+10%)) ÷ (11万 ÷ (1+10%))\n          = 110万/11万 × (1+10%)/(1+10%)\n          = 110万/11万 = 10 元/单\n```\n\n推导过程（老师逐步写的）：\n\n```\n第 ① 步：写明去年销售额 = 110万 ÷ (1+10%)，去年销量 = 11万 ÷ (1+10%)\n第 ② 步：把 110 万、11 万挪出来\n第 ③ 步：上面这个 (1+10%) 因为\"除以它\"→ 挪到分母上；\n          下面那个 (1+10%) 因为\"除以它等于乘它的倒数\"→ 挪到分子上。\n          → 两个 (1+10%) 一上一下，消掉\n第 ④ 步：结果 = 110万/11万 = 10 元/单\n```\n\n> \"有没有发现这两个一加百分之……好像一样的？我们把它单独拿出来，上面这个一加百分之十还放在下面，上面的分母就还放在分母上。\"\n\n> \"下面的这个因为你是除以 11 万除以（1+10%），除数等于乘数的倒数，所以在分母上就会乘到分子上去，能理解吧？交换了一下位置。\"\n\n> \"然后这两个（1+10%）是一样的，所以是不是就可以消掉了？所以会发现它去年的单价就还是一百一十万除以十一万，也是 10 元每单。\"\n\n**结论（老师原话）：**\n\n> \"好，这样的一个基期比值就很好算，因为它的增速是一样的。这个也跟我们昨天讲的那个关系是一样的：**你只要分子和分母的增速是一样的，那么你的基期的平均数跟你这个现期的平均数它就是相等的，它就是不变的，等比例变化了。**\"\n\n> \"是增速一样的情况，太好算了，题目也不会这么出。所以我们再来看看增速不一样的情况。\"\n\n---\n\n### 3. 特例二：分子增速为 0%，分母增速 +10%\n\n**【题干原文】**（画面逐字）\n\n> 某年甲产品总销售额为 110 万元，同比增长 0%，销量 11 万单，同比增长 10%。\n> 问：去年甲产品单价多少？\n\n板书逐字（画面）：\n\n```\n去年 单价 = 销售额/销量\n          = (110万 ÷ (1+0%)) ÷ (11万 ÷ (1+10%))\n          = 110万/11万 × (1+10%)/(1+0%)\n          = 10 元/单 × (1+10%)\n```\n\n> \"如果今年这个分子总销售额只涨了百分之零，它没有发生任何变化，它去年就是这么多，今年也是这么多。然后销量增速是百分之十，这是我们在预算去年的单价会是什么样？\"\n\n> \"左边这个是不是就是现期的单价？一百一十万除以十一万……**左边这个东西永远是一个什么东西？是个现期比值**，算出来是 10 元每单，这是一个现期的单价，但它不是基期吧，基期还要怎样，是不是还要乘一个这个东西，再乘一个 (1+10%)。\"\n\n**关键洞察 —— \"这个百分之十是哪来的？\"**\n\n板书画圈标注：把题目里\"分子增速 0%\"与\"分母增速 10%\"两个增速圈起来，旁边写大字 **「差距」**。\n\n> \"百分之十是不是就这个东西？那怎么刚刚我们没有直接把这个百分之十保留下来呢？是因为之前的时候，这百分之十跟这个百分之十会消掉，对吧？因为他们的增速一样会消掉。\"\n\n> \"那为什么这里可以保留下来呢？因为这里他们的增速不一样，**那说明这个百分之十其实就是他们之间的一个差距**。\"\n\n> \"所以我们可能从这样一个式子就能理解一个事情：就是我们只要在这个现期比值的基础上，去补上一个、再去乘上一个增速的一个差距，就能得到一个基期比值。\"\n\n> \"那这个增速差距难道不用看这个分子分母谁高谁低吗？那肯定还是要看的。\"\n\n---\n\n### 4. 特例三：分子 +10%，分母 +21%（分位上的增速不是简单差值）\n\n**【题干原文】**（画面逐字）\n\n> 某年甲产品总销售额为 110 万元，同比增长 10%，销量 11 万单，同比增长 21%。\n> 问：去年甲产品单价多少？\n\n板书逐字（画面）：\n\n```\n去年 单价 = (110 ÷ (1+10%)) ÷ (11 ÷ (1+21%))\n          = 110/11 × (1+21%)/(1+10%)\n          = 10 元/单 × (1+21%)/(1+10%)\n          ∵ 1.21/1.1 = 1.1  ∴ = 10 元/单 × (1+10%)\n```\n\n老师把 `(1+21%)/(1+10%)` 展开（画面红笔）：\n\n```\n(1+21%)/(1+10%)\n  = (1 + 10% + 21% − 10%) ÷ (1+10%)            ← 分子先\"凑\"出一个 (1+10%)\n  = 1 + (21% − 10%) ÷ (1+10%)\n  = 1 + 11% ÷ 1.1\n  = 1 + 10%\n```\n\n> \"为什么刚刚正好是百分之十？因为刚刚这个地方，其实它是等于 1 加上 10% 减 0% 除以 1 加 0%，这个分母上（的增速）是个 0%，它不影响，所以那时候才是正好是一个差值。\"\n\n> \"这个地方你分母上（的增速）一加百分之十，它有影响，所以要考虑进去。所以其实我们补的这个差距，补的是什么？补的是这两个**增速之间的平均数增长率**，或者你也可以把它理解成**间隔增长率**。\"\n\n> \"就好像我这个总销售额本来涨了 10% 的，你销量涨了 21%，我想要让我的这个甲产品（比值）涨到 21%，我就需要给它再乘一个 10%，让两次变化合为一次之后也等于 21%。这种感觉懂吗？这就是一个差距。**这个差距你不能简简单单地用一个差值来理解。**\"\n\n**生活化类比（老师原话）：**\n\n> \"比如说你的竞争对手，他跟你说，我今年这个月我的账户涨了百分之二十一。然后你一看自己的账户，我的账户怎么只涨了百分之十，然后想不行，那我要把（它）追上去。你说你从百分之十要追上他这个百分之二十一，你需要追多少？**你不需要再涨 11% 了，你只要再涨 10% 就够了**。\"\n\n> \"你把你的这两次变化合并为一次，10% 和 10% 两次变化合并为一次怎么算？我们是用累计增长率那个公式，R₁ 加 R₂ 加起来是 20%，再加上一个它俩相乘百分之一，你看是不是就是这百分之二十一？这个就是增速的累积跟拆分，它的逻辑是一样的。\"\n\n> \"**所以这个百分之十的算法其实就是（21% − 10%）除以（1 + 10%）。**\"\n\n---\n\n### 5. 特例四：分子 +21%，分母 +10%（反向）\n\n**【题干原文】**（画面逐字）\n\n> 某年甲产品总销售额为 110 万元，同比增长 21%，销量 11 万单，同比增长 10%。\n> 问：去年甲产品单价多少？\n\n板书逐字（画面）：\n\n```\n去年 单价 = (110 ÷ (1+21%)) ÷ (11 ÷ (1+10%))\n          = 110/11 × (1+10%)/(1+21%)\n          = 10 元/单 × (1+10%)/(1+21%)\n          = 10 元/单 × [ 1 + (10% − 21%)/(1+21%) ]\n          = 10 元/单 × ( 1 − 11%/1.21 )\n          ≈ 10 元/单 × (1 − 9%)\n```\n\n画面红笔标注：\n- 上方写 `1 + (10% − 21%)/(1+21%)`\n- 左侧红字 **「看上」→「给上补」**，画圈写 `−11% / 1.21 ≈ −9%`\n- 圈出 20 与 18 的比较：`20/(1+10%) ≈ 18`，即\"20 减掉 9% 左右 ≈ 18\"\n\n**老师为什么不满意这个式子（原话）：**\n\n> \"哎呀，这个式子看着就烦。有没有感觉这个式子很烦？一个是不好算——不好除，十一除一二一是不是不好除？还是个负的，还不能直接在十的基础上去加，还得去考虑去乘个负的去减，烦对不对？\"\n\n> \"所以我们能不能再把这个式子转化成我们上一个地方那个样子呢？我还想用一点二一除这个一点一，行不行？怎么搞？我把它放到分母上来。\"\n\n板书转向（画面）：\n\n```\n去年 单价 = 110/11 × (1+10%)/(1+21%)\n          = 110/11 ÷ [ (1+21%)/(1+10%) ]\n          = 110/11 ÷ [ 1 + (21%−10%)/(1+10%) ]\n          = 10 ÷ (1 + 10%) = 10 × (1/1.1)\n```\n\n> \"它相当于 110 除以 11 乘它的倒数，这样可以不？我们把右边这个式子取个倒数，倒过来，它是不是又回到我们刚刚那个样子了？那取了倒数，它是不是就从分子到分母上去了，相当于这个数值变成分母上的了，你去乘的时候是不是要给它乘到分母上？\"\n\n> \"那这样的分母上就变成 11 乘以（1 + (21−10)/1+10%）这样是不是就好算了？\"\n\n---\n\n### 6. 板书公式卡：现期比 → 基期比（正式公式与两种写法）\n\n**【板书原文】**（原帧 f_0138 / f_0144 / f_0145 逐字，画面为公式幻灯片）\n\n> 现期比 → 基期比\n> **给增速低的一方补正平均数增长率**\n\n```\n①   a         A      1 + r₂       A × ( 1 + (r₂ − r₁)/(1 + r₁) )        A      (   r₂ − r₁  )\n    ─────  =  ─── ×  ────────  =  ─────────────────────────────    =  ─── × ( 1 + ────────  )\n     b         B      1 + r₁                  B                        B      (   1 + r₁   )\n   ─────\n   1 + r₂\n```\n\n（注：画面左端写作 `小 a ÷ (…)` 的形式，即\"基期 a ÷ 基期 b\"；右端 `A / B` 为现期比。）\n\n```\n②   a         A              A                        A          1\n    ─────  =  ─────────── = ────────────────────  =  ─── × ───────────────\n     b          B × (1+r₁)      B × ( 1 + (r₁−r₂)/(1+r₂) )     B      (    1        )\n   ─────            (1+r₂)                                        ( ───────────── )\n   1 + r₂                                                        ( 1 + (r₁−r₂)/(1+r₂) )\n```\n\n老师用红笔在两个式子旁分别标注：\n\n| 位置 | 红笔标注 | 含义 |\n| --- | --- | --- |\n| ①式上方 | `r₂ > r₁` | 分母增速高、分子增速低 → **给分子补** |\n| ②式上方 | `r₁ > r₂` | 分子增速高、分母增速低 → **给分母补** |\n| ①式右侧 | 圈出 `(1 + (r₂−r₁)/(1+r₁))`，并画线指向 `B`、`(r₂−r₁)` | 指出\"补正量\"就是括号里那部分 |\n| ②式右侧 | 圈出 `1/(1 + (r₁−r₂)/(1+r₂))` | 指出这次是\"除以\"而不是\"乘\" |\n\n**符号约定（老师原话）：**\n\n> \"来看这个式子，小 a 小 b 是 a 跟 b 的一个基期。大 A 大 B 是 A 跟 B 的一个现期，（现期）比这个小 A 是不是就除小 B？小 a 是不是等于大 A 除以一加它的增速，小 b 就是大 B 除以一加它的增速。\"\n\n> \"然后如果是 r₂ 大于 r₁，我们就把这个 R₂ − R₁ 作为一个主要目标把它写出来，就把这个式子转化为乘以 (1+R₂) 除以 (1+R₁)，然后这样的一个式子才能写成 1 加上 (R₂−R₁) 除以 (1+R₁)。\"\n\n> \"**所以给增速低的补上了一个平均数增长率。**\"\n\n**为什么写成两个式子（老师自问自答，重要）：**\n\n> \"为什么这边还要再加个等于号呢？你们同学能明白我为什么要这么写，想提醒你们什么？\"\n\n> \"**一个是在过程中补，一个是在结果上补，就看你这个 a 除 b 好不好算。**\"\n\n> \"如果本身你这个现期比就很好算，你就直接先把现期比算出来，然后你看是要给分子补还是分母补。如果你本身这个现期比不那么好算，那你可以就先调整，你先把这个 A 补一个大概的、接近的增速，补到一个好算的位置上，再去算。\"\n\n> \"这样就非常灵活——**可以在过程中修正，也可以在结果上修正**。懂了吧，就是在过程中修正，这个就是在结果上修正。\"\n\n> \"反过来如果是 r₁ 大于 r₂，分子的增速更高，你看，我们就把这个式子也很灵活地去转化一下，把上面这个 (1+r₁) 挪下来……（1+r₁）除以（1+r₂）就又有人写成一加上（r₁−r₂）除以（1+r₂）的形式，这样我们就给分母这个 b 去补，因为 b 的增速比较低，它低你就给它去补，补的时候也是一样的。\"\n\n> \"要么你本身就比较好算，你就算完了再去给它的分母去补，**这时候就可以用化除为乘了**。比如说我算出来一个现期比是二十，我需要给分母去补五个点，我就能直接知道它的基期比是十九——相当于除以（1+5%），就约等于 20 减去 20 乘以 5%，化除为乘。这样不就一下就很快出来了吗？\"\n\n**老师小结：**\n\n> \"我这是两种情况：上面这个情况是 R₂ 大于 R₁，下面这个情况是 R₁ 大于 R₂。\"\n\n---\n\n### 7. \"给增速低的一方补正平均数增长率\"——本课灵魂口诀\n\n> \"**对谁的增速低，就给谁补。这句话非常重要，这句话刻在你们脑海里面——谁的增速低，就给谁去补。**\"\n\n> \"而且这句话**没有任何的适用范围，所有情况都是这样的，因为负增速都是这样的**。你哪怕负增速，也是这样子的一个增速。\"\n\n**负增速举例（老师原话）：**\n\n> \"如果是负百分之五十、一个增速是负百分之三十，你还是给这个负百分之五十去补，因为它的增速低。给他补多少？补他们的间隔增长率、那个平均增长率——你看他差多少。\"\n\n> \"这时候差多少？差 20%，除以（1 − 50%），等于 40%。\"\n\n> \"**永远是高的减低的，补的那个东西永远是（高的 − 低的）除以（一加低的）。**\"\n\n> \"这块可能又稍微有点跳了，就为什么是拿这个负三十去减这个负五十呢？因为你要把这个低的补到上面、补到高上去，能懂吗？就好像本来你从三十到五十，你需要补一个（50 − 30）除以（1 + 30%），对不对？那你从 −50 到 −30，其实逻辑上是一样的。\"\n\n> \"待会儿再拿一个普遍的那种字母符号，再来给你推导一遍这种方法。你不要说觉得好像脱裤子放屁一样——你正常这样直接算，你不是也一样能算出来吗？\"\n\n---\n\n### 8. 为什么要\"给低的补\"：两个优点\n\n> \"这样的好处有两个点：\"\n\n| 序号 | 优点 | 老师原话 |\n| --- | --- | --- |\n| 1 | **非常统一** | \"你在讨论跟基期比有关的问题的时候，你不用管谁的增速高、谁的增速低、到底谁减谁，你就只用管谁的增速低，你就去找这个低的就好。非常统一。\" |\n| 2 | **好算** | \"因为小减大肯定是不如大减小好算的。你如果是一个什么百分之二点七和百分之八点三，你说是大的减小的好算，还是小的减大的好算？肯定大的减小的吧，一减我就知道是五点六。你说你减个负的，你有那么快吗？正的肯定很好算，负的相对没有那么好算。\" |\n\n> \"所以这样转换一下，就会有它的一个优点，就能让你提速。\"\n\n> \"所以我们最后就是总结一下：**我们想把一个数从现期比转成基期比，只需要给增速低的那一个去补正平均数增长率。**\"\n\n---\n\n### 9. 除法放缩视角的再解释（2000 / 1000 数值例）\n\n**题目设定（老师口播）：**\n\n```\n甲（分子）：2000，增速 21%\n乙（分母）：1000，增速 10%\n求：基期比\n```\n\n**常规写法：**\n\n```\n基期比 = (2000 ÷ (1+21%)) ÷ (1000 ÷ (1+10%))\n```\n\n> \"那这个时候什么叫做给增速低的去补呢？这个是百分之十，它比较低，我要给这个一千补，对不对？\"\n\n**除法放缩视角（老师原话逐步）：**\n\n> \"你看我现在给分母上，**等比例扩大一个 (1+10%)，上面也扩一个 (1+10%)**。……我除法放缩，分子分母同时扩大一个一加上他们的平均的增长率，对不对？\"\n\n> \"为什么是 10% 呢？因为这 10% 它是 `1 + (21% − 10%) ÷ (1 + 10%)`——就是 `(1+21%)/(1+10%)`，这样你才能把这 10% 消掉，变成 (1+21%)，能听懂吗？\"\n\n板书（画面）：\n\n```\n基期比 = 2000 ÷ (1+21%) ÷ [ 1000 ÷ (1+10%) ]\n       = 2000 ÷ (1+21%) × (1+10%) ÷ 1000\n       = 2000/1000 × (1+10%)/(1+21%)\n       = 2 × 1.1/1.21\n       ≈ 2 × ( 1 + (10% − 21%)/(1+21%) )\n```\n\n画面红笔另写：\n\n```\n2000/(1+21%) = 2000/1.21 ≈ 1653\n1000/(1+10%) = 1000/1.1  ≈ 909\n1653/909 ≈ 1.82  （≈ 2 × 0.909）\n```\n\n> \"好，那这个式子不就变成了 2000 除以 (1+21%)，再除以 1000，乘以 (1+10%)？分母上你看，分母我们给它通分，相当于通分给这个除法放缩，把分母也变成了 (1+21%)，这样子他们的增速一样，是不是就可以消掉了？\"\n\n> \"消掉了之后，分母上就留下了一个给这个小的、给这个增速低的一千补的一个增长率。\"\n\n**换个方向再讲一遍（画面数值：2000 增速 10%，1000 增速 21%）：**\n\n> \"如果把这个关系再换一下，（比如）2000、1000、21%，他们的基期比按道理应该是这样写的：（2000 ÷ (1+10%)）÷（1000 ÷ (1+21%)），对不对？\"\n\n> \"然后让他们的分母要搞得一样，我就给上面的分母乘了个 (1+10%)，这个 10% 是 21 和 10 拆分下来的那个增速，`(21 − 10) ÷ (1 + 10%)`。好，你给它的上面这个分母乘了个这个东西，分子是不是也要乘？然后上面就会变成 `2000 × (1+10%) ÷ (1+21%) ÷ 1000 × (1+21%)`，那分母又消掉了吧？它又变成 `2000 × (1+10%) ÷ 1000`。你看**谁的增速低，就给谁补**——2000 的增速低，给它补，补多少？补他们俩之间的平均增长率：`(21 − 10) ÷ (1 + 10%)`，补 10%。\"\n\n> \"所以他们的基期比就是 2200 除以 1000，等于 2.2。**这样你就不需要算他们两个基期到底是多少，你只要把因为增速的差异带来的影响消除掉就可以了。**\"\n\n**本质（老师原话）：**\n\n> \"其实本质上是什么呢？本质上就是我们前面说的：**如果你两个数增速是一样的，那现期比就等于基期比**。只不过是把这个 2000、10% 换成了一个 2200、21%——它这个 2200、21% 和 1000、21% 增速就一样了，你看增速是不是就一样了，就可以消掉。\"\n\n> \"为什么要把它变成 21%？因为他们增幅不一样。那我怎么把那个材料让它变成增速一样？给他补呗——**但我又不能在影响他基期大小的情况下补吧？所以在同样的基期上，给他再补 10%，让它变成了 2200**，懂了吧？\"\n\n> \"对，就是这个 2200，它在这个题目的这些数据、这些对象上是没有什么实际含义的，**只是我们补出来的一个东西，让它可以直接去除现期，得到一个基期比**。\"\n\n---\n\n## 四、基期比 a/b 估算练习（6 组）\n\n**【练习原文】**（原帧 f_0198 逐字）\n\n> 拉平增长率-练习\n> **基期比 a/b 估算练习**\n\n| 组 | a（分子） | a 的增速 | b（分母） | b 的增速 |\n| --- | --- | --- | --- | --- |\n| ① | 7358 | 10.9% | 3909 | 16.7% |\n| ② | 5280 | 30.9% | 1747 | 3.1% |\n| ③ | 1027 | 29.3% | 7475 | 23.7% |\n| ④ | 1475 | 5.1% | 2761 | −4.5% |\n| ⑤ | 3482 | 9.6% | 299 | 27% |\n| ⑥ | 757 | −10.8% | 495 | −3.1% |\n\n**通用步骤（老师原话）：**\n\n> \"我首先第一步看什么？**找低增速**，看谁低。\"\n\n> \"先减，这个就跟你算那个平均数增长率用的步骤是一样的，先减。（差距）减下来大概是五个多点吧，五个多点你按几个点算，就按百分之五算。**没有必要算那么细**，你没有必要算什么四点四、四点五、五个点还是什么四点八、八个点，**你本身就只是在调误差，调它现期比跟基期比之间的一个差距，这个误差你的计算对象很小的。**\"\n\n**逐组拆解：**\n\n| 组 | 低增速方 | 差值（高点 − 低点） | 折算补正 ≈ 差值 ÷ (1+低增速) | 实际取补正 | 速算过程 | 结果 |\n| --- | --- | --- | --- | --- | --- | --- |\n| ① | a（10.9%） | 16.7% − 10.9% = 5.8 个点 | 5.8% ÷ 1.109 ≈ 5.2% | **5%** | 7358 × 1.05 ≈ 7700；7700 ÷ 3900 ≈ **1.97** | **1.97 ~ 1.98** |\n| ② | b（3.1%） | 30.9% − 3.1% = 27.8 个点 | 27.8% ÷ 1.031 ≈ 27% | **25 个点左右 → 好算可用 25%** | 5280 ÷ 1747 = 3；3 ÷ 1.25 = **2.4** | **2.4（计算器 2.39）** |\n| ③ | a（29.3%） | 29.3% − 23.7% = 5.6 个点 | 5.6% ÷ 1.237 ≈ 4.5% | **约 5 个点** | 先算现期比：7475 ≈ 3/4 → 1027/7475 ≈ **13.4~13.7**；再减约 5 个点 → **13.1** | **13.1（计算器 13.494）** |\n| ④ | b（−4.5%） | 5.1% − (−4.5%) = 9.6 个点 | 9.6% ÷ (1−4.5%) ≈ 10% | **10%** | 1475/2761 ≈ 0.534；给 b 补 10% → b ≈ 3000；1475 ÷ 3000 ≈ **0.49** | **0.49** |\n| ⑤ | a（9.6%） | 27% − 9.6% = 17.4 个点 | 17.4% ÷ 1.096 ≈ 15.9% | **约 16 个点** | 3482 ÷ 299 ≈ 11.6；11.6 × 1.16 ≈ **13.5** | **13.5（计算器 13.494）** |\n| ⑥ | a（−10.8%） | −3.1% − (−10.8%) = 7.7 个点 | 7.7% ÷ (1−10.8%) ≈ 8.6% | **约 8 个点** | 757/495 ≈ 1.53（可看作 770/500 ≈ 1.54）；1.53 × 1.08 ≈ **1.66** | **1.66（计算器 1.6613）** |\n\n**第 ① 组详讲（老师原话）：**\n\n> \"它低了 5.8 个点，对不对？那我们给它补多少？**不需要补 5.8 啊，你只要补 5% 就好了**。为什么呢？因为我们补的这东西，它不是一个增速差值，是 5.8 除以（1 + 10.9%），它会比 5.8% 要小，所以就写 5%。你也不要写什么 5.3、5.2，没有意义，也不要算那么精确，你只要大概算个 5% 就行了。\"\n\n> \"找到低的，知道低多少，然后给这个 7358 去补 5%，7000 多的 5% 就是差不多 350。7358 + 350 = 7700，补好了，干嘛？直接除以另外一个的现期 3900，约等于——3900 × 2 = 7800，7700 离 7800 差 100，100/3900 ≈ 2.6%，所以大概是 2 − 0.026 ≈ **1.97，一点九七一点九八的样子**。\"\n\n**对照计算器结果（老师现场按键）：**\n\n```\n7358 ÷ 1.109 = 6634   （a 的基期）\n3909 ÷ 1.167 = 3350   （b 的基期）\n6634 ÷ 3350  = 1.98\n```\n\n> \"我这好像几秒钟就出来了，人家好像快一分钟才把这个三个除法算出来，对不对？**直接帮你省去了算两个基期的一个工作了。**\"\n\n> \"你把它想成 78 除以 39，78 减 1 除以 39，就是 2 减去 1 除以 39，这个东西不就是 2% 左右吗？2% 多一点呗，所以就是 1.97 到 98 之间。\"\n\n**第 ② 组详讲（老师原话）：**\n\n> \"再来一组，我们干嘛？先找谁低，对不对？谁低呀？是不是后面这个低？后面这个低，低多少先减，减下来大概是五个多点吧……\"\n\n> \"补五个点，继续补多少？补 350 以上、370 左右，这个没问题。补个 370。不过 370 就会变成 7840，对不对？它的基期比就是 1027 除以 7840，这个你就大概可能放缩一下，下面加个 160，上面八分之一左右加个 20……大概在 132 左右、131 左右。**所以它的基期比就是百分之十三点一左右。**\"\n\n**第 ② 组课后练习组（5280 / 1747）详讲：**\n\n> \"这个我们是不是也可以直接在结果上去调？因为 5280 正好是 1747 的 3 倍吧，现期比是 3 倍。然后给谁补？给谁补是不是给分母去补，需要补多少个点？二十五个点左右吧。因为你做差是 27 多，然后还除个 1.03，虽然除下来可能说没有到 25，但是 25 好算——除 1.25 倍，因为分母补 25 个点，不就是要去乘一个 1/(1+25%) 吗？\"\n\n> \"3 ÷ 1.25 = 2.4。**所以 2.4 倍**，也很准。我课前备过，我就不去摁了，我课前好像摁过，我记得它算的好像是 2.39，也差不太多。\"\n\n**第 ③ 组详讲（老师原话）：**\n\n> \"我感觉好像不够快，有没有觉得这种（像 1027 ÷ 7840）我凑上去也不是太整，就会相对没有那么舒服，没有刚刚那个 77 除 39 那么快那么爽。\"\n\n> \"还有个关系呢，我们还可以更快。你有没有觉得好像你本身你直接除这个 7475，这个数还蛮特殊的，它是个什么数？**这不就是个四分之三吗？除个四分之三不就是乘了个三分之四吗？**\"\n\n> \"所以你的现期比就是 `1027 ÷ 7475 ≈ 0.137`，也就是百分之十三点几——**算 13.4**。然后怎么样？我要给谁补？我是不是要给分子（分子增速低）去补几个点，补五个点。那么再画出微尘，13.4 减下来大概在 12.9 附近，这样子也能比较快地出来。\"\n\n> \"我按一下计算器，我也看一下 1027 除以 7475，我做到 13.7 了，13.7 再减五个点，也差不多到这了。\"\n\n> \"所以这个关系明白吧？**就先把这个数算出来，大概 13.4~13.5 的样子，这样你就能很快算了。**\"\n\n> \"有的时候你甚至到了这个地方你都不需要算，因为你已经把一个很靠近答案的现期比先搞出来了，它已经很靠近选项了。说不定选项是 A 12、B 13、C 14、D 15，那你还算啥呀？13.5 往下推五个点，那不就是 13 吗？你怎么能到 12 或者 14、15 上去？对不对？**这样你就更好地去结合选项进行判断了。**\"\n\n**第 ④ 组详讲（老师原话，考问式）：**\n\n> \"我来考一下大家第五个情况，我们是先算再补，还是先补再算？有说补的，有说算的——**这个地方肯定得先补**。为什么要先补？\"\n\n> \"就是我感觉吧，这个除 2761 这个东西，它还没有到它的两倍呢。你到时候要是想算得细一点，有点麻烦。这个地方你给它补是非常好的，**因为 5.1% 和 −4.5% 他们之间正好基本上就是差百分之十，太好算了**。\"\n\n> \"做差是 9.6，再除个（1 减去百分之四点五多一点点），那不就是 10 嘛。你给它补个百分之十，正好是多少？**3000 对不对？正好是 3000**，那（除以）3000 是多少？直接除以 3。除下来它的这个比值就基本上是确定的。\"\n\n> \"除下来的话就是四多少，三四一十二……你可以算一下它的基期比是不是 **0.49**，就基本上没有多少误差的 0.49，懂了吧？\"\n\n**第 ⑤ 组详讲（老师原话）：**\n\n> \"第三个（口播顺序），我们是不是也是先算？为什么先算？**因为这个分母太简单了，这分母不就是个三百吗？** 对不对？直接除以 3，现期是多少？是 11.6 倍。\"\n\n> \"好，然后给谁补，再去找给谁补。是不是前面分子的增速比较低？所以给他补，所以你要给这个分子补，就是让这个数变大，乘一个一加多少。先减，（27% − 9.6% = 17.4%）除以 1.096，大概我按它算多少？十六个点吧。\"\n\n> \"不用算那么准，大概估一下就好了。这里可以用放缩或者什么思维去想一想——大概在 16 到 15 这个附近。这就是 11.6 加上大概它的六分之一不到，加个 1.9 左右（12 除以 6 是 2 嘛，那 11.6 除以 6 不到就是 2 不到，那就加个 1.9），所以就是 13.5。\"\n\n> \"你要不信，你去按下计算器，它这个基期比就是在 13.5 附近的。我再来按一下计算器，我怕你们不放心：299 乘以 1.27，再除以 1.096，算下来是 **13.494**。\"\n\n> \"因为我们计算的对象就是很小的，所以这个东西就算有误差，影响也非常小，对你的结果不会有太大影响。有时候你可以结合选项去看，有几个数比 11.6 要大的，看大多少，哪个选项比较合适？大概 16% 附近，你可能也就不需要算。\"\n\n> \"负十七也可以，负十七你不还是 11.6 乘以百分之十七吗？还是把十七看成六分之一，一样的呀。\"\n\n**第 ⑥ 组详讲（老师原话）：**\n\n> \"你像这个也可以先算再补吧。因为这个 495 也是比较好算的，直接除出来的是 1.5 多一点。你可以把它看作 770 除以 500 吧，先简单粗暴放缩一下吧，顺手的事情，就除以 5 等于乘以 2，是一点五四，现期比是不是 1.54？\"\n\n> \"给谁补？给分子补，因为分子的增速低。补几个点？七个多点给他补八个点嘛。补八个点，1.5 的百分之八是多少？0.12，所以是 1.66。\"\n\n> \"是不是这种调误差这种事情影响本身就是比较小的？所以很多时候你就顺手给它凑凑整，给它好算一点，让你运算的量就小很多，因为算得很快。\"\n\n> \"（核对）757 ÷ 495 × 0.9 的倒数……算出来应该是 **1.6613**，没有问题了。\"\n\n**老师的总结：**\n\n> \"那我们来看看题目，看看做题，你再结合选项就会更轻松。\"\n\n---\n\n## 五、过程中的修正 vs 结果上的修正\n\n| 修正位置 | 适用条件 | 做法 | 例子 |\n| --- | --- | --- | --- |\n| **过程中修正**（先补再算） | 现期比本身不好算、不整 | 先把低增速那一方的现期值补成一个**好算的整数**，再去除 | 第 ① 组：7358 补 5% → 7700，再 ÷ 3900 |\n| **结果上修正**（先算再补） | 现期比本身好算（分母是 3、3/4 之类的特殊数） | 先算出接近答案的现期比，再给低增速一方补几个点 | 第 ③ 组：先得 13.4，再减 5 个点 → 13.1 |\n| **结果上修正（化除为乘）** | 需要给**分母**补若干点 | 现期比 ÷ (1+x) ≈ 现期比 − 现期比 × x | 现期比 20，分母补 5 个点 → 20 − 20×5% = 19 |\n\n> \"**这个跟我们前面讲的那些估算方式，什么画出微尘、什么分数微调，其实原理都是一样的，就是为了怎么计算方便，我们就什么时候再去调了个误差——在过程中把误差先调上去好算，就是过程中调；结果好算你就在结果算出来之后，你再去调。**\"\n\n> \"所以这个东西就非常灵活：你可以先补了再算，先补了再算的目的是为了让你凑整。像这个地方，我先补 5 个点，补到大概 7800 不到，这样的 7800 除以 3900 好算。那我如果（现期比）本身就不是太整，我没必要先凑整，我可以先算，先算了之后再去调。调了之后你也能把它凑整、也能把它算得很准，或者说你可以不要算，你就观察一下选项，看选哪一个选项——大概的去涨这五个点，能长到这里就好了。\"\n\n---\n\n## 六、重要注意点：增速差距过大时怎么办\n\n> \"还有一个忘记说了，讲入迷了，还有一个注意点：**我们刚举这例子以后，有没有发现其实一个点，就是他们的增速差距都不是太大？** 都是那种百分之几、百分之十几、百分之二十这种范围，没有特别大对不对？\"\n\n> \"那有的时候如果这个**选项的增速差距有点大了**，这种你去调误差的方式就可能不是那么好。\"\n\n> \"一方面**分母上的一加（增速）你无法忽略了**，因为它的影响太大了。他们俩之间你要补多少？你要补一个 `39.1% ÷ 1.645`，你说你能不管它吗？你能随便估吗？不敢吧？为什么？因为它影响太大了，而且这误差占比也大，39% 啊，很大，对不对？\"\n\n> \"所以这个时候你用这个拉平增长率去补这个误差、去调这个分子分母，**相对性价比就低了很多**。\"\n\n> \"在这种情况下，我建议你怎么办？**老老实实地你就去算基期**，这个时候就没有办法，你就硬算。\"\n\n> \"因为一般其实也还好，因为一般增速比较大的时候，放缩算基期不会花很久——这个基期一千二呗，百分之百，那基期不就是现期的一半不到吗？1200 左右。这个地方，768 ÷ 1.645，稍微地放缩一下，770 ÷ 166，77 乘以 6.67……然后再去算一个基期匹配。\"\n\n**判断标准（老师明确表态）：**\n\n> \"这个时候就是当**选项差距比较大**的时候，我认为一般超过这种大概**超过百分之三十、四十**的样子，我觉得就算影响比较大的了。\"\n\n> \"你们每次都要我给你们定个量，多大算大，其实这个东西还没有一个非常明确的标准，也要看选项的关系，没有那么明确的标准的，**要看好不好算，主要还是要看好不好算**，你们多练了之后，自己会有感觉的。\"\n\n> \"你们不要说每次都指望着，好像我一下子就把所有的全面的东西都给你们规划得透透的。你们去驾校学汽车，难道你还要把教练一直捆在身边吗？说教练，我什么时候该五十码，什么时候该六十码，什么时候算危险的路况，什么时候算安全的路况？没有那么多的定性的、没有那么多的定量的东西的，**我只能提醒你在有的地方的时候，你要注意一下**。\"\n\n**配套数值例（画面练习页新增一行）**\n\n> 拉平增长率-练习 · 基期比 a/b 估算练习（追加行）\n> a: 2472, 103.6%; b: 768, 64.5%\n\n板书逐字（画面）：\n\n```\n差距 = 103.6% − 64.5% = 39.1 个百分点\n补正 = 39.1% ÷ (1 + 64.5%) = 39.1 ÷ 1.645 ≈ 23.8% ≈ 24%\n\n若强行用拉平增长率：2472 ÷ (768 × 1.24) ≈ 2472 ÷ 952 ≈ 2.6\n```\n\n> \"他们俩之间你要补多少？你要补一个 `39.1 ÷ 1.645`。你说你能不管它吗？你能随便估吗？不敢吧？因为它影响太大了，而且这误差占比也大，39% 啊，很大。这个地方，768 ÷ 1.645，稍微地放缩一下，770 ÷ 166，77 乘以 6.67……然后再去算一个基期匹配。\"\n\n> \"1200 左右——（分子）这个基期一千二呗，百分之百（增速），那基期不就是现期的一半不到吗？\"\n\n**核实（按画面数据）**\n\n```\n分子基期 = 2472 ÷ (1 + 103.6%) = 2472 ÷ 2.036 ≈ 1214\n分母基期 =  768 ÷ (1 + 64.5%)  = 768 ÷ 1.645  ≈  467\n基期比   = 1214 ÷ 467 ≈ 2.6   （与\"补 24%\"得到的结果一致）\n```\n\n> \"**这个时候就没有办法，你就硬算。** 因为一般其实也还好，因为一般增速比较大的时候，放缩算基期不会花很久。\"\n\n---\n\n## 七、例题精讲\n\n### 第 1 题｜基期比值 · 西部地区商品房销售价格\n\n**【题干原文】**（原帧 f_0335 逐字）\n\n> 2014 年，西部地区商品房销售面积 32068 万平方米，增长 0.6%，增速回落 0.6 个百分点；销售额 16127 亿元，增长 3.5%，增速回落 0.6 个百分点。\n> 2013 年西部地区商品房销售价格为：\n\n**【材料数据】**\n\n| 指标 | 2014 年（现期） | 同比增速 | 增速变化 | 角色 |\n| --- | --- | --- | --- | --- |\n| 商品房销售额 | 16127 亿元 | +3.5% | 增速回落 0.6 个百分点 | 分子 |\n| 商品房销售面积 | 32068 万平方米 | +0.6% | 增速回落 0.6 个百分点 | 分母 |\n| 销售价格（单价） | ？ | — | — | 销售额 ÷ 销售面积 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求\"2013 年\"单价，材料给\"2014 年\" → **基期比值问题**（价格 = 销售额 ÷ 面积） |\n| 定位数据 | 分子：销售额 16127 亿元，增速 3.5%；分母：面积 32068 万平方米，增速 0.6% |\n| 第一步：先看现期比好不好算 | `16127 ÷ 32068 ≈ 0.5` → 约 5000 元/平方米；且选项 D 就是 5008，**可以借选项直接取现期比 ≈ 5008** |\n| 第二步：找增速低的一方 | 分母增速 0.6% \u003c 分子增速 3.5% → **给分母补** |\n| 补正量 | `(3.5% − 0.6%) ÷ (1 + 0.6%) = 2.9% ÷ 1.006 ≈ 2.9% ≈ 3 个点` |\n| 速算步骤 | `5008 ÷ 1.03 ≈ 4862` → 结合选项 A 3694 / B 4676 / C 4888 / D 5008，落 C 附近 |\n| 结论 | **C. 4888 元/平方米** |\n\n**【选项原文】**\n\n> A. 3694 元/平方米　B. 4676 元/平方米　C. 4888 元/平方米　D. 5008 元/平方米\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- **D 5008 元/平方米是最大陷阱**：它就是**2014 年的现期单价**（约 5029 元/平方米，出题人取整写进选项），时间陷阱——问的是 2013 年，必须扣掉增速差的影响。\n- 分子增速（3.5%）高于分母增速（0.6%），说明\"每平方米价格\"这个比值在**上升**，所以 2013 年单价一定**低于** 5008，排除 D。\n- 给分母补 3 个点后 `5008 ÷ 1.03 ≈ 4862`，A 3694 差太远，B 4676 也差近 200 元，只有 C 4888 最接近。\n- 陷阱类型：**时间陷阱（现期/基期混用）+ 概念陷阱（价格 = 销售额÷面积，别把分子分母弄反）**。\n\n> \"时间的问题是 13 年的题目，时间给的是 14 年的，这是一个基期比问题吧。首先看题目，我们就要识别出来它是一个基期比问题。\"\n\n> \"第一步我们要先观察你直接除好不好除，不要忙着去补——比如说你补完了，不一定好算。现期比好不好算？一万六除三万二，好算不？太好算了吧，这个除出来的是不是基本上就是五五？我不光知道它是 5 左右，我还知道它是 5008。我怎么算出来是 5008 的呀？**在这儿，比如说出题人他会把这个现期比告诉你，你可以借助这个选项，省一点功夫。**\"\n\n> \"好，这就 5008。然后怎么样？第二步找增速低的。谁低？是不是分母增速低？低了多少？三个点，所以要给分母补三个点。5000 除以 1.03，你说你要算吗？**别划出一层了，你算都不用算**——就它嘛，你前面 A 跟 B 是不是远了呀？\"\n\n> \"那你说这个题目，我做了什么计算量？**我的计算量只有一个：16 除 32，找到了它；第二个，3.5 减 0.6，找到了个 3。** 知道为什么有的时候我一提只要十几秒二十秒的吗？我找到数据，我看一眼选项答案出来了。\"\n\n---\n\n### 第 2 题｜基期比值 · 民办中等职业学校校均在校生\n\n**【题干原文】**（原帧 f_0342 / f_0354 逐字）\n\n> 2017 年，全国民办中等职业学校 2069 所，比上年下降 2.17%；在校生 197.33 万人，比上年增长 7.16%。\n> 2016 年平均每所民办中等职业学校在校生人数约为：\n\n**【材料数据】**\n\n| 指标 | 2017 年（现期） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 民办中等职业学校数 | 2069 所 | −2.17% | 分母 |\n| 在校生人数 | 197.33 万人 | +7.16% | 分子 |\n| 校均在校生人数 | ？ | — | 在校生 ÷ 学校数 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求\"2016 年\"校均在校生 → **基期比值** |\n| 定位数据 | 分子：在校生 197.33 万人，+7.16%；分母：学校数 2069 所，−2.17% |\n| 现期比 | `197.33 ÷ 2069 ≈ 0.0953 万人 = 953 人`（画面写作 95.3，量级为\"百人\"） |\n| 找增速低的一方 | 分母增速 −2.17% \u003c 分子增速 7.16% → **给分母补** |\n| 补正量 | `(7.16% − (−2.17%)) ÷ (1 − 2.17%) = 9.33% ÷ 0.9783 ≈ 9.5% ≈ 10 个点` |\n| 速算步骤 | `953 ÷ 1.0954 ≈ 870`；画面写 `197/(2069×1.0954) = 95.3/(1+10%) = 950/…` → 约 871 |\n| 结论 | **A. 871 人** |\n\n**【选项原文】**\n\n> A. 871 人　B. 991 人　C. 1091 人　D. 1181 人\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 现期校均在校生已算出 953 人左右，分母增速低（−2.17%），所以 2016 年一定比 953 人**更小**，直接排除 B 991 / C 1091 / D 1181。\n- 补正约 10 个点，`953 ÷ 1.1 ≈ 866~871`，落在 A。\n- 陷阱类型：**单位陷阱（所 ↔ 万人，需换算量级）+ 时间陷阱（2016 vs 2017）**。\n\n> \"问：去年平均每所民办中等职业学校，它的在校生人数是多少？这还是个基期比问题吧。找谁？先找分子分母，他们的现期增速。\"\n\n> \"第一步先告诉我直接除好不好除？……对，直接就 A 嘛，**你看根本不需要算什么基期**，要算基期干嘛呀？又不是没有现期，又不是没有量。现期比是 197 除以 2069，它明显就是个九百多的数吧，你根据选项观察一下，是不是九百多？它是没有到那个一千的。\"\n\n> \"九百多，然后要怎么样？你是不是要给分母补？补多少？负 2.17 和 7.16 差了差不多 10 个点吧。900 多再退 10 个点，800 多倍。\"\n\n> \"**什么叫差 10 个点不用算？你都 900 多往下退 10 个点了，你还能选到 B、C、D 上面去啊？** 你说 991 涨 10 个点是 900 多，还是说 1091 涨 10 个点是 900 多？\"\n\n---\n\n### 第 3 题｜基期比值 · 秋粮产量占粮食总产量比重（高精度）\n\n**【题干原文】**（原帧 f_0358 逐字）\n\n> 该省粮食连续七年实现增产，2009 年总产量达到 4316.3 万吨，比上年增长 1.3%，其中夏粮产量为 2047.7 万吨，比上年增长 0.6%；秋粮产量为 2268.6 万吨，比上年增长 1.9%。\n> 2008 年，该省秋粮产量占当年粮食总产量的比重为：\n\n**【材料数据】**\n\n| 指标 | 2009 年（现期） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 粮食总产量 | 4316.3 万吨 | +1.3% | 分母 |\n| 其中：夏粮产量 | 2047.7 万吨 | +0.6% | 干扰项 |\n| 　　　秋粮产量 | 2268.6 万吨 | +1.9% | 分子 |\n| 秋粮占比 | ？ | — | 秋粮 ÷ 总产量 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求 2008 年比重 → **基期比重 = 基期比值** |\n| 定位数据 | 分子：秋粮 2268.6 万吨，+1.9%；分母：总产量 4316.3 万吨，+1.3% |\n| 第一判断：现期比好不好算 | `2268.6 ÷ 4316.3` 不太整 → 老师和学生都认为\"不那么好算\" |\n| 方案 A：先补再算 | 给增速低的分母（1.3%）补 0.6 个点：`4316.3 × (1 + 0.6%) = 4316.3 + 25.9 ≈ 4342`（画面算 4342） |\n| 　 | `2268.6 ÷ 4342`：分母凑整到 4400 要加 102（画面写作\"四四\"），上面按 52%~53% 加 54 → `2322` |\n| 　 | `2322 ÷ 44 = 2322 ÷ (4 × 11) = 580.5 ÷ 11 ≈ 52.77`，即现期比约 **52.5%** |\n| 方案 B：先算再补（画面上最终采用） | 分母先减 16 凑整：`4316 → 4300`，分子减 8 → `2260`；`2260 ÷ 43 = 52.5`（画面写\"2268/4316 = 2260/4300，45/86 = 52.5\"） |\n| 补正 | 给分母补 `0.6% ÷ (1 + 1.3%) ≈ 0.6%`；**用化除为乘**：`52.5 − 52.5 × 0.6% = 52.5 − 0.3 = 52.2` |\n| 结论 | **D. 52.2%** |\n\n**【选项原文】**\n\n> A. 53.4%　B. 53.1%　C. 52.5%　D. 52.2%\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 选项间距仅 0.3~0.6 个百分点，是本节**计算精度要求最高**的一道题，不能随便放缩。\n- 分子增速 1.9% > 分母增速 1.3%，比值在**下降**，所以 2008 年比重大于还是小于现期比？——现期比约 52.5%（画面写作 `2260/4300 = 45/86 = 52.5`），2008 年应再**减去**约 0.3 个百分点 → 52.2%。\n- A 53.4% / B 53.1% 是\"不调整\"或\"调反方向\"的陷阱；C 52.5% 是**现期比**本身的时间陷阱。\n- 陷阱类型：**时间陷阱（现值直接当答案）+ 方向陷阱（补正加/减搞反）**。\n\n> \"可能有的同学说：老师，你前面这两题找的这种题目，是不是专门找的那种凑数据的题啊？搞的那个计算精度那么低。**来个计算精度高的——这选项够近了吧？** 差多少？差百分之零点三，相邻选项之间的差距是不是只有百分之零点六？这已经算高精度题目了吧。\"\n\n> \"什么叫重点真题？**全是真题，都是真题。** 我们来看一下这个高精度的基期比问题好不好算。\"\n\n> \"2268 除以 4316.3，没有那么好算。那我们是不是可以先补？补的很小，补多少？补百分之零点六左右。因为这增幅比较小，分母上的除以（1+1.3%）可以不用管，这个可以不用管，因为这太小了。\"\n\n> \"（量级提醒）**26 不是两百多，有个量级要搞清楚，你要把这个什么百分之一、百分之十好好想想。** 有的时候你这个量级搞错了，危害也很大的。你去算它百分之零点多少、百分之几到底是多少的时候，你去想想看它的百分之一是多少——四千三百一十六的百分之一是四十三，10% 是 43……你算的是 0.6，是比 1% 要小的，所以要比 43 小，**你只能加 26，也不能加 260**，加 26 之后就是 4342。\"\n\n> \"（凑整加 102）那我们把 4342 往哪去凑？直接凑成 4400 嘛，你只要加个……只要加个一百零二多好。4400 凑得很准，加个 102 对不对？那分母让加 102 呢，分子上加多少？**这个地方还有个小技巧：就是有的时候你想算准一点的话，尤其是选项它距离比较近的话，你结合选项。** 分子数分母一定是 0.52 到 0.53 左右，你就利用选项肯定在这个范围，那 102 的 52%、53% 是多少？那就是 53 到 54 倍，给他加个 54，变成 2322 可以不？\"\n\n> \"2322 除以 44 怎么算？先除 4，就把下面这个讲成 4 乘 111，除了个 4，再除 11，先除 4 等于 580.5，580.5 再除 11 等于……错位相减 580……**这样子的话就是 52.5%，没问题吧？**\"\n\n> \"因为选项距离很近，所以你不管这个结果，你算的是 A 还是 D，它总是在百分之五十二和百分之五十三之间，它的距离越近，那你这个误差也会对应地越来越小。\"\n\n> \"你觉得不如直除？你这个题目你去算算看嘛，你不觉得不如直除——你每次你都要除个 4316 除 1.013，你要除一遍吗？2268，你要再除个 1.019，再除一遍吗？除完了之后，你还要再除一遍，你这**三步除法**，你是基本上都不能有什么误差的。你有一点误差，你这个百分之零点六的选项差距就会导致你错掉。\"\n\n> \"（方案 B）我们直接算 2268，我们先把现期算出来 4316。其实也可以，因为 4316 离 4300 这个两位数距离很近，距离越近，我调的误差是不是就越小？我分母上我先减个 16 行不行？上面减多少？一半多一点，减个 9——其实你减 8 也可以啊……减 8 吧，减 8 好一点，上面整一点，2260 除以 43。然后我就直接 2260 除以 43。\"\n\n> \"所以它的现期比就基本上是 52.5。然后我们要给谁补？**这是现期比，这还不是基期比——别看我圈那个 C 就以为要走了**。这是现期比，给谁补？是不是要给分母去补，补多少？百分之零点六。谁是不是 D 走了？画出微尘，就变成 52.5 减掉 52.5 乘以 0.6%，等于 52.5 减去 0.3，**等于 52.2**。是不是其实都可以？\"\n\n> \"刚刚那个第一种方法呢，其实很多时候我是习惯性地会先补再算。其实真的很多时候我会先补再算的，因为很多题目它的计算精度要求不高，然后往往可能说本来那个数也没那么好算，你先补个大概凑个整好算一点。那这个题目呢，因为计算精度太高了，所以先补后算的时候，我这个先补就算得比较细，因为我觉得它没有什么优势。\"\n\n**偷鸡技巧（老师明确说\"尽量别这么做\"）**\n\n> \"其实这个题目如果选项再改一改，如果它改成这样子，有的时候还能偷鸡。我稍微提一下，虽然这个题目不是那么好投机——如果他选项改一改，这边写个 53.7，后面 53.1，然后 52.5、52.2。如果是这样子，你在观察到这个现期增速的关系上之后，我可以直接知道这个题目。如果我没时间了或者来不及算了，我不想算了，**我直接 D 就走了**。\"\n\n> \"为什么呢？因为你肯定是在一个现期比的基础上去给分母补一个百分之零点六，那不管是哪一个是现期比，百分之五十到百分之零点六，不就是零点三嘛，那不就是减个零点三，不就是 C 跟 D 减的关系吗？减百分之零点三。**这种是偷鸡，尽量一般尽量不要这么做，该算什么就算。**\"\n\n---\n\n### 第 4 题｜基期比值 · 2016 年 5 月进口药品金额环比增速\n\n**【题干原文】**（原帧 f_0426 逐字）\n\n> 图 2　2017 年 3 月~2018 年 2 月全国进口药品金额及同比增速\n> 2016 年 5 月，全国进口药品金额环比增速：\n\n**【材料数据】**（图 2，柱状为金额、折线为同比增速）\n\n| 月份 | 金额（亿美元） | 同比增速 |\n| --- | --- | --- |\n| 2017 年 3 月 | 24.9 | 24.2% |\n| 2017 年 4 月 | 18.8 | 12.2% |\n| 2017 年 5 月 | 27.8 | 54.5% |\n| 2017 年 6 月 | 26.5 | 32.1% |\n| 2017 年 7 月 | 19.6 | −4.6% |\n| 2017 年 8 月 | 23.8 | 29.5% |\n| 2017 年 9 月 | 21.9 | 3.5% |\n| 2017 年 10 月 | 18.4 | 10.5% |\n| 2017 年 11 月 | 24.0 | 11.9% |\n| 2017 年 12 月 | 27.8 | 24.1% |\n| 2018 年 1 月 | 22.2 | 16.3% |\n| 2018 年 2 月 | 15.6 | 1.7% |\n\n**【解题拆解（常规解法）】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求\"2016 年 5 月环比增速\"，即 `2016年5月金额 ÷ 2016年4月金额 − 1`；两个数都要从 2017 年基期化 → **基期比值** |\n| 定位数据 | 2017 年 5 月：27.8 亿美元，同比 +54.5%；2017 年 4 月：18.8 亿美元，同比 +12.2% |\n| 2016 年 5 月 | `27.8 ÷ 1.545`：放缩——下面减 5，上面减约 8 → `27 ÷ 1.5 = 18`；画面即\"27 除以 15 再除个 3，等于 9/5，等于 18\" |\n| 2016 年 4 月 | `18.8 ÷ 1.122`：用**分数法**，12.2% 很接近 1/8，增量 = 现期的 1/9 ≈ 2.1 → `18.8 − 2.1 = 16.7` |\n| 环比 | `18 ÷ 16.7 ≈ 1.08` → 环比增速不到 10% |\n| 结论 | **C. 在 0%~40% 之间** |\n\n**【解题拆解（拉平增长率法，秒杀）】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 现期环比倍数 | `27.8 ÷ 18.8 ≈ 1.5`（很整） |\n| 给谁补 | 分子（5 月）增速 54.5% > 分母（4 月）增速 12.2% → **给分母补** |\n| 补正量 | `(54.5% − 12.2%) ÷ (1 + 12.2%) = 42.3% ÷ 1.122 ≈ 37.7% ≈ 40 个点` |\n| 基期环比倍数 | `1.5 ÷ 1.4 ≈ 1.07`（不到 1.4，肯定是 1.1 附近） |\n| 结论 | 环比增速 = 倍数 − 1 ≈ 7%~10% → **C** |\n\n**【选项原文】**\n\n> A. 超过 100%　B. 在 40%~100% 之间　C. 在 0%~40% 之间　D. 低于 0%\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- 2016 年 5 月金额约 18 亿、2016 年 4 月金额约 16.7 亿，环比正增长但不到 10%，落在 `0%~40%` 区间 → C。\n- 选项 D \"低于 0\" 是方向陷阱：分子增速（54.5%）远高于分母增速（12.2%），现期倍数 1.5 被补正后仍 > 1，不可能为负。\n- 选项 A/B 是幅度陷阱：补正接近 40 个点，`1.5 ÷ 1.4` 只剩 1.07 左右，绝不可能超过 40%。\n- 陷阱类型：**概念陷阱（环比 ≠ 同比）+ 幅度陷阱**。\n\n> \"这道题目跟我们昨天讲的那个环比、同比变化比较像，他问的是什么呢？问的是 2016 年 5 月份进口药品的金额环比增速是多少？题干给的时间是 2017 年 5 月份，要求环比，我们是不是要知道 2016 年的 5 月份是多少，再知道 2016 年的 4 月份是多少？\"\n\n> \"常规做法就是我们先去把他们的基期顺便算出来……17 年 5 月是 27.8，增速是 54.5，那么它的基期呢？27.8 除以 1.545，那我们就可以选择放缩，也可以选择分数修正，都行。如果选择放缩的话，就是这样子：给下面减个 5，上面大概是两倍不到，减个 8。27 除以 15，现在多除个 3，等于 5 分之 9，等于 18。\"\n\n> \"然后再去算前面这个基期怎么算呢？12.2% 是不是很靠近 1/8？其实刚才 54.5 你也可以用分数法，也可以的。八分之一说明它的增量是现期的九分之一，增量就是 2.1，那 18.8 减 2.1，它的基期就是 16.7。\"\n\n> \"所以它的环比增速就从 16.7 到 18，增长了 10% 不到，这个好理解吧？……**10% 不到是在 0 到 40 之间，所以选择 C 啊。**\"\n\n> \"然后我们现在再来讲一个题目，你可以甚至说不用动笔就能把它答案看出来一个关系。我们昨天讲的东西还记得吗？就是我们看基期环比增速与现期环比增速之间的关系，我们看什么？我们是不是不看增速，我们看谁？**我们是看倍数。** 我们看基期的环比倍数和现期的环比倍数之间的关系。\"\n\n> \"环比倍数是什么？它不也是一个基期比值吗？去年的环比倍数就是拿 16 年的 5 月份除以 16 年的 4 月份，对不对？今年的环比倍数，就是 17 年的 5 月份除以 17 年的 4 月份。那它也是一个比值的变化吧？我们就还用刚刚的方法去想行不行？\"\n\n> \"那我问你，分子是 27.8，增速是 54.5%，对不对？分母是 18.8，增速是 12.2%，对不对？**先算还是先补？——先算。** 为什么先算？因为 27 正好是 18 的 1.5 倍，这太整了呀，那我们就知道现期的环比倍数是 1.5 了吧。然后我们要给谁补？给多少？四十个点左右。\"\n\n> \"所以基期比是多少？`1.5 ÷ (1 + 40%) ≈ 1.07`，那不就 C 走了吗？为什么直接 C 就走了？**因为 1.5 除以 1.4 不到，你肯定是个 1.1 附近的数呀。**你的基期环比是 1.1 左右，就是说你这个 16 年的 5 月份是 16 年 4 月份的大概 1.1 倍左右，那你这增速不就是百分之十吗？**倍数是 1.1 倍，增速就是 10%。**\"\n\n> \"这个当然肯定是不准的，但是不影响，因为它不可能大于百分之五十，它也不可能说能到百分之四十以上，不可能说低于百分之十吧？但起码是个三四十个点，对不对？你不管是 1.5 除个 1.3，还是 1.5 除个 1.4，你肯定都在 C 里面啊。\"\n\n> \"好，那昨天那个关系能不能再理解一点？就是为什么 17 年的这个环比增速提高了？有些同学昨天还是没听懂。我问你，17 年 5 月份它这个环比增速有没有提高？——**提高了。为什么提高了？因为它的分子增速更高，所以它的环比比值在提高；环比比值在提高，它的增速就在提高。**\"\n\n> \"它的同比的增速，分子增速比分母增速高，它这个比值就在提高，比值在提高，增速就在提高。**你不要把一些概念想得太概念化了，你那些概念呢，它也就是些数字而已。其实玩的就是数字。**\"\n\n---\n\n### 第 5 题｜基期比值应用 · 2022 年第四季度铁矿石环比增速趋势\n\n**【题干原文】**（原帧 f_0481 逐字）\n\n> 2023 年 1-12 月全国铁矿石产量及增长率\n> 以下折线图中，能准确反映 2022 年第四季度各月全国铁矿石的环比增速变化趋势的是：\n\n**【材料数据】**（柱状为产量、折线为同比增长率）\n\n| 月份 | 产量（万吨） | 同比增长率 |\n| --- | --- | --- |\n| 1-2 月 | 15035（画面显示为 15035） | 3.7% |\n| 3 月 | 8640 | −4.8% |\n| 4 月 | 7510 | −0.7% |\n| 5 月 | 7760 | −2.9% |\n| 6 月 | 8516 | 1.8% |\n| 7 月 | 8571 | 8.0% |\n| 8 月 | 8633 | 1.3% |\n| 9 月 | 8437 | −0.9% |\n| 10 月 | 8645 | 29.8% |\n| 11 月 | 8577 | 8.8% |\n| 12 月 | 8603 | 0.4% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 问\"2022 年第四季度各月环比增速\"趋势 → 需比 `2022年10/11/12月` 的环比大小，即比 2022 年各月的**基期倍数** |\n| 关键换算 | 2022 年 9 月 = `8437 ÷ (1 − 0.9%)`；10 月 = `8645 ÷ (1 + 29.8%)`；11 月 = `8577 ÷ (1 + 8.8%)`；12 月 = `8603 ÷ (1 + 0.4%)` |\n| 常规做法代价 | 要算 4 个基期再算 3 个环比增速，非常慢（老师：\"等你做完，感觉五分钟过去了\"） |\n| 拉平增长率法 | 只看**现期环比倍数**（都在 1 附近：`8645/8437 ≈ 1.02`、`8577/8645 ≈ 0.99`、`8603/8577 ≈ 1.00`），再给增速低的一方补正 |\n| ①10 月/9 月 | 分子（10 月）增速 29.8% 高，分母（9 月）增速 −0.9% 低 → **给分母补** `(29.8% − (−0.9%)) ÷ (1 − 0.9%) ≈ 30 个点` → 倍数 `1.02 ÷ 1.3 ≈ 0.78` → 环比约 **−22%**（最低） |\n| ②11 月/10 月 | 分子（11 月）增速 8.8% 低，分母（10 月）增速 29.8% 高 → **给分子补** `(29.8% − 8.8%) ÷ (1 + 8.8%) ≈ 20 个点` → 倍数 `0.99 × 1.2 ≈ 1.19` → 环比约 **+19%**（最高） |\n| ③12 月/11 月 | 分子（12 月）增速 0.4% 低，分母（11 月）增速 8.8% 高 → **给分子补** `(8.8% − 0.4%) ÷ (1 + 0.4%) ≈ 6~8 个点` → 倍数 `1.00 × 1.08 ≈ 1.08` → 环比约 **+8%**（居中） |\n| 结论 | 趋势：**10 月最低 → 11 月最高 → 12 月居中** |\n\n**【选项原文】**\n\n> A / B / C / D 四幅折线图（横轴 10 月、11 月、12 月）\n> 画面：A 的折线为 10 月在低位、11 月冲高、12 月回落到中间；B 为 10 月高、11 月低、12 月最高；C、D 为单调变化。\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 2022 年 10 月因 2023 年 10 月同比增速高达 29.8%，倒推回去 2022 年 10 月产量最低，环比增速为负 → 10 月必须在**最低点**。\n- 11 月倒推后回升最多 → 11 月**最高**；12 月小幅正增长 → 居中。\n- 陷阱类型：**概念陷阱（环比 ≠ 同比）+ 时间陷阱（材料 2023 年、问 2022 年）**。\n\n> \"很多同学都会拿这个题目来问我：老师这个题目有没有什么快速算的办法？我不想把他们九月份、十月份、十一月、十二月的基期全给他算出来。\"\n\n> \"常规的做法就很麻烦了吧。你要算 10 月份的环比增速怎么算？你是不是要把 9 月份的基期先算出来？你要先知道 23 年的 9 月是多少，等于 8437 除以（1 减去 0.9%），对不对？算出来之后，你要再把 10 月份的又算出来，10 月份的是 8645，除个 1.298，你把这两个算出来，你才能知道 10 月份的环比增速吧。\"\n\n> \"学了我们今天前面的内容，这个题目还需要这么做吗？**我们一定要把基期算出来才能看基期比吗？我们是不是可以直接看现期比和它需要修正的地方？**\"\n\n> \"看现期比，11、12 这三个月，看比值，不要看增速，看环比倍数是什么情况。8600 减 8400 等于 200，一出头吧，现期比是不是都是一？……我写清楚点，环比倍数 10、11、12 基本上都是一。\"\n\n> \"好，我们怎么把它们转化为 22 年的环比倍数呢？看分子分母，谁的增速低，给谁补。10 月份跟 9 月份比谁低？是不是九月份低？九月份在这个环比倍数里面，它是在分子还是在分母上？它在分母上（十月除九月），所以你要给分母补多少？补三十个点。\"\n\n> \"11 跟 10，11 低，它在哪？它在分子，所以要给分子补，20 个点左右。11 跟 12 谁低？12 低，需要给分子补 6 个点左右。\"\n\n> \"你说这个题目，我还要再算下去吗？**10 最低，11 最高，12 第二。** 明白了吧？\"\n\n---\n\n## 八、板块 02 基期比较\n\n**(画面切换：`02 基期比较`)**\n\n> \"我们前面已经把这个怎么通过拉平增长率去计算基期比给大家讲了一遍。接下来就是根据这个基期比、根据这个拉平增长率，它们对应的一些其他题型的应用。第一个是跟拉平增长率或者说基期计算比较相关的一个 —— 现期比较问题……不对，是**基期比较问题**。\"\n\n> \"基期比较什么意思呢？**就它不需要你去算这个基期比值是多少，只要你去比较这两个数，它们谁的基期比较大。**\"\n\n### 8.1 两条基本规律（板书原文，原帧 f_0516 / f_0523）\n\n**① 现期增速大小不同边时，现期大增速小的基期更大。**\n\n```\n现期 A > 现期 B，r_a \u003c r_b，则基期 A > 基期 B\n```\n\n> \"这是比较简单的。比如，如果我们刚刚举的例子，5000、10%，我把它增速换一下，4500、20%，这个毫无疑问，谁都知道，肯定上面的大。因为基期等于现期除以（1+增速），就是 5000 除以（1+10%），下面是 4500 除以（1+20%）。**上面这个分子又大（现期大），增速又小（分母小），它只会更大。**所以这个就是现期增速大小如果不同边，那就现期大、增速小的基期更大。\"\n\n> \"什么叫不同边？就是这是现期大的，这是增速大的，它们不在一边上。\"\n\n**② 现期增速大小同边时，拉平增长率后现期大者基期更大。**\n\n```\n现期 A > 现期 B，r_a > r_b\n\n若 现期 B × (1 + (r_a − r_b)/(1 + r_b)) > 现期 A\n即 基期 B × (1 + r_b) × (1 + (r_a − r_b)/(1 + r_b)) > 基期 A × (1 + r_a)\n即 基期 B × (1 + r_a) > 基期 A × (1 + r_a)\n即 基期 B > 基期 A\n```\n\n> \"如果有的题目稍微复杂一点，就要刚刚说的这个 5000、20%，4500、10%，这时候他们的现期、增速大小**同边**呢？全是上面的这个大。那这个时候它的分子又大、分母又大，那它除下来到底大不大呢？**我们就用拉平增长率，把增速低的补上去。**\"\n\n> \"跟刚刚我们计算基期比的逻辑还是一样的，我们就直接给增速低的百分之十的 4500 补，补多少？补不到百分之十，大概补百分之九左右——就是百分之十除以一点一，百分之九左右。你想想看，这 4500 补上 9%，它够不够得到这个 5000？补了 9% 之后是多少？就加了个 405 吧，才 4905。那 5000 比 4905 大，上面这个大，它的基期大。\"\n\n**原理推导（老师原话）：**\n\n> \"你看如果现期 A 比现期 B 大，就这个 5000 比 4500 大，增速也是它大，20 比 10。如果我们把他们差的这个增速百分之九给这个 4500 去补上去了，**如果大于 5000，我们就把这个现期转化为基期**……后面这个式子呢，我们把它写成一加上 (a−b) 除以 (1+b)，对吧？那一加 b 跟这一加 b 是不是消掉了？就变成基期 B 乘以（1+a）……会大于我们把现期 A 也换成基期 A 乘以（1+a），就会消掉。\"\n\n> \"**所以你只要拉平之后，他们的大小关系是统一的。你拉平了之后能大，那就大；大不了，那就小。**这个公式怎么推过来的？这个地方是拿这个现期转化过来的，这里也是拿这个现期转化过来的，然后这个东西是拿这个 (1+b) 和后面这个式子消掉分母得到的，然后两边就消掉。**这个是没有误差的，没有任何误差。**\"\n\n**数值演示（板书逐个数字）**\n\n| 情形 | A | B | 判断 | 结论 |\n| --- | --- | --- | --- | --- |\n| 同边 | 5000，20% | 4500，10% | 给 B 补 `(20−10)% ÷ (1+10%) ≈ 9%` → `4500 × 1.09 = 4905 \u003c 5000` | **基期 A > 基期 B**（5000/1.2 = 4167 > 4500/1.1 = 4095） |\n| 异边 | 5000，10% | 4500，20% | 分子大、分母小 | **基期 A > 基期 B**（5000/1.1 ≈ 4545 > 4500/1.2 = 3750） |\n| 同边（反例） | 5000，20% | 4800，10% | 给 B 补 9% → `4800 × 1.09 = 5232 > 5000` | **基期 B > 基期 A**（4800/1.1 = 4364 > 5000/1.2 = 4167） |\n\n> \"我再换个例子，我再换个数据。如果是 5000，还是 20%，后面我再换个数，4800、10%。这 4800 他就不服气了：我虽然比你少 200，但不能说明我去年比你少，因为我今天涨得太少了。你要是想公平比较，你等我，**我再涨 9%，让自己变成了 20% 的增速**，涨了个 9%，加了多少呢？加了个大概 480 减 48 等于 432，变成了 5232。你看，**这才是我真正涨了 20% 的样子。我 5232 比你 5000 多，说明我的基期就是比你多。**\"\n\n> \"好，听明白了吧？就跟我们之前那个基期比值的计算逻辑还是一样的，**就是给增速低的去补**。为什么是百分之九？这百分之九就是他们增速之间的差距，不是差值，是 `20% 减 10% 除以（1 + 10%）`，等于 10% 除 1.1，约等于百分之九，这个意思，平均数增长率、间隔增长率。\"\n\n---\n\n### 第 6 题｜基期比较 · 文化及相关产业营业收入最高行业\n\n**【题干原文】**（原帧 f_0577 逐字）\n\n> 对全国规模以上文化及相关产业 5.9 万家企业的调查显示，2018 年上半年，文化及相关产业 9 个行业的营业收入均实现增长。其中，新闻信息服务营业收入 3744 亿元，比上年同期增长 29.4%；创意设计服务 5143 亿元，增长 15.1%；内容创作生产 8820 亿元，增长 11.9%；文化传播渠道 4501 亿元，增长 10.0%；文化辅助生产和中介服务 7783 亿元，增长 8.2%；文化消费终端生产 7911 亿元，增长 4.2%；文化投资运营 349 亿元，增长 3.5%；文化装备生产 3313 亿元，增长 0.7%；文化休闲娱乐服务 663 亿元，增长 0.2%。\n> 2017 年上半年，我国文化及相关产业营业收入最高的行业是（　）。\n\n**【材料数据】**\n\n| 行业 | 2018 年上半年营业收入（亿元） | 同比增速 |\n| --- | --- | --- |\n| 新闻信息服务 | 3744 | 29.4% |\n| 创意设计服务 | 5143 | 15.1% |\n| **内容创作生产** | **8820** | **11.9%** |\n| 文化传播渠道 | 4501 | 10.0% |\n| 文化辅助生产和中介服务 | 7783 | 8.2% |\n| **文化消费终端生产** | **7911** | **4.2%** |\n| 文化投资运营 | 349 | 3.5% |\n| 文化装备生产 | 3313 | 0.7% |\n| 文化休闲娱乐服务 | 663 | 0.2% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求\"2017 年上半年\"谁最高 → **基期比较**（不是算具体值） |\n| 排除 B（创意设计服务 5143，15.1%） | 现期比 A（8820）小、增速比 A 大 → **大小不同边**，基期只会更小，直接排除 |\n| 排除 C（文化休闲娱乐服务 663，0.2%） | 现期只有 663 亿，量级差太远，\"给他涨十倍都不够\"，直接排除 |\n| 只剩 A、D 比较 | A：8820，11.9%；D：7911，4.2% → **同边**（A 现期大、增速也大） |\n| 给 D 补正 | `(11.9% − 4.2%) ÷ (1 + 4.2%) = 7.7% ÷ 1.042 ≈ 7.4% ≈ 7~8 个点` |\n| 速算步骤 | `7911 × 1.074 ≈ 8497 \u003c 8820`（画面写 8500 左右）→ 补满也追不上 A |\n| 结论 | **A. 内容创作生产** |\n\n**【选项原文】**\n\n> A. 内容创作生产　B. 创意设计服务　C. 文化休闲娱乐服务　D. 文化消费终端生产\n\n**【答案】** ✅ A\n\n（画面：A 前写大红 \"A\"；B、C 上打红 ×。）\n\n**【解析】**\n\n- B 用\"现期小、增速大\"直接排掉；C 用\"量级差太远\"直接排掉；只需在 A、D 之间补正一次。\n- 给 D 补到 11.9% 需要补 7~8 个点，`7911 → 约 8500`，仍小于 8820，所以 **A 的基期更大**。\n- 陷阱类型：**范围陷阱（选项只给 4 个行业，别去跟没进选项的行业比）+ 概念陷阱（同边必须拉平才能比）**。\n\n> \"因为你提案给的时间是 18 年，这是 17 年，问基期大小。我们先干嘛？肯定还是先把他们的现期、增速找出来。\"\n\n> \"当你看到 A 跟 B 的时候，你已经直接可以把这个 B 给它否掉了。为什么我可以直接把 B 否掉了？**因为 B 它的现期比 8820 要小，增速还比 11.9 要高。这个就属于是大小不同边的，它现期又小、增速又大，那它的基期只会更小。**所以直接排除。\"\n\n> \"再看 C 文化休闲在这儿，那也没什么好看的吧。虽然说现期增速大小同边都是内容创作生产的最大，但是你就算给下面这个 663 补……哎哟，你这有点就好像那种人还没成年呢就出来打比赛了。前面呢是个泰森，这边是个六年级的小孩，**你就算让他补个十个点，他有用吗？这也太小了。所以直接 C 排除，你给他涨十倍都不够。**\"\n\n> \"再来看 D 文化消费终端生产，在这儿，有点意思了。这个人总算有点让我去跟他 PK 的这种想法了。我 8820，他 7911，我 11.9，他 4.2，我要等等看，我看他给他涨个这个，再等等他涨到 11.9，能不能超过我，对不对？\"\n\n> \"所以我们现在开始补，给谁补？给 7911 补，因为他增速低，补几个点？8% 不到。那有的时候你在补的时候可以稍微地多补一点、往上凑个整补一点，比如让你凑个百分之八，你看涨个百分之八能不能到。要是连 8% 都不到、都到不了，也没必要去算他到底是 7.几了，对不对？\"\n\n> \"7900 的 8% 是多少？630 多，给他补个 600 多，补下来这不才 8500 多吗？**哪够啊！所以还是他厉害，所以 A 走人。**\"\n\n> \"就这么做。先把比较基础的、能直接排的那种——现期又小、增速又大的——先排掉；然后把这种明显量级排不上桌的第二个排；然后剩下在一个量级上的，需要去给他补真的来比较大小的，你再去补。\"\n\n> \"补的时候其实还有一个细节：**有的时候你不需要去算这个六百多是多少**。你看什么呢？你也可以看**需要大概多少**。你想想看，8820 跟 7911 差多少啊？差 900 多。你想赶上我，你要补多少？**你起码给我补个百分之十几吧。你才补几个点，你才给我补八个点，哪够啊，差这么多了。**\"\n\n---\n\n### 第 7 题｜基期比较 · 图书出口额排序\n\n**【题干原文】**（原帧 f_0598 / f_0621 逐字）\n\n> 2011 年我国图书、期刊、报纸进出口情况\n> 2010 年，文化教育、文学艺术、综合图书出口额由高到低排序，正确的是：\n\n**【材料数据】**（表：2011 年我国图书、期刊、报纸进出口情况）\n\n| 指标 | 出口数量（万册/份） | 出口数量同比（%） | 出口金额（万美元） | 出口金额同比（%） | 进口数量（万册/份） | 进口数量同比（%） | 进口金额（万美元） | 进口金额同比（%） |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 图书合计 | 855.76 | 21.00 | 3276.61 | 1.38 | 754.85 | 32.76 | 11666.91 | 24.09 |\n| **文化教育** | 158.08 | 50.09 | **571.18** | **−30.86** | 180.25 | 194.95 | 2037.88 | 26.85 |\n| 社会科学 | 101.52 | −18.29 | 752.50 | 36.17 | 117.99 | −6.56 | 2476.69 | 41.86 |\n| **文学艺术** | 144.66 | 11.53 | **650.66** | **8.17** | 138.23 | 53.20 | 1690.11 | 32.94 |\n| 自然科学 | 57.99 | 3.12 | 345.88 | −0.01 | 134.63 | 25.13 | 3414.30 | −1.85 |\n| 少儿读物 | 205.24 | 46.11 | 280.62 | 5.95 | 78.66 | 99.27 | 629.25 | 67.66 |\n| **综合图书** | 188.27 | 27.52 | **675.77** | **5.42** | 105.09 | −26.96 | 1418.68 | 53.49 |\n| 期刊 | 252.89 | 29.83 | 573.44 | 35.25 | 439.93 | 4.58 | 13906.17 | 0.56 |\n| 报纸 | 35.53 | −18.53 | 55.46 | 1.00 | 1785.10 | −5.68 | 2800.18 | 0.81 |\n\n（题目只问**出口额**，注意看\"出口金额\"列。）\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 问 2010 年三个品类出口额排序 → **基期比较 + 排序** |\n| 定位数据 | 文化教育 571.18（−30.86%）；文学艺术 650.66（8.17%）；综合图书 675.77（5.42%） |\n| 第一步：找\"必须换位置\"的 | 文化教育现期最小（571），但增速是 **−30.86%**（大跌）→ 基期必然暴涨 |\n| 文化教育基期 | `571.18 ÷ (1 − 30.86%) = 571.18 ÷ 0.6914 ≈ 826` |\n| 第二步：剩下两个 | 文学艺术 650.66（8.17%）与综合图书 675.77（5.42%）：**现期大、增速也大**（同边），需拉平 |\n| 给综合图书补正 | `(8.17% − 5.42%) ÷ (1 + 5.42%) = 2.75% ÷ 1.0542 ≈ 2.6% ≈ 2.6 个点` |\n| 速算 | 给文学艺术补：`650.66 × 1.026 ≈ 667.6 \u003c 675.77` → 补不到，**综合图书基期更大** |\n| 　 | 或直接算：文学艺术 `650.66 ÷ 1.0817 ≈ 601`；综合图书 `675.77 ÷ 1.0542 ≈ 641` |\n| 排序 | 文化教育（≈826）> 综合图书（≈641）> 文学艺术（≈601） |\n| 结论 | **D. 文化教育—综合图书—文学艺术** |\n\n**【选项原文】**\n\n> A. 综合图书—文化教育—文学艺术\n> B. 综合图书—文学艺术—文化教育\n> C. 文化教育—文学艺术—综合图书\n> D. 文化教育—综合图书—文学艺术\n\n**【答案】** ✅ D\n\n（画面：A、B 打红 ×；D 下划红线，题干前写大红 \"D\"。）\n\n**【解析】**\n\n- 文化教育虽然 2011 年出口额最低（571.18），但同比 **下降 30.86%**，说明 2010 年一定**远高于** 2011 年 → 排出 A、B（A、B 都把综合图书放第一）。\n- 剩下文学艺术与综合图书要拉平：差距只有 `8.17% − 5.42% = 2.75` 个百分点，补正约 2.6 个点。给文学艺术补 2.6% 也追不上综合图书，所以**综合图书 > 文学艺术** → D。\n- 陷阱类型：**方向陷阱（负增速的项容易被忽略）+ 概念陷阱（同边必须补正）**。\n\n> \"再看问：2010 年的时候，文化教育、文学艺术、综合图书这三个，他们的基期谁高谁低？文化教育在这儿，找的是什么？出口额，出口额在这 571，增速是负了 30.8%。文化教育还有个文学艺术在这儿，另外 8.17%，第三个是综合图书。\"\n\n> \"要稍微排下序。这三个里面，现在你能不能一眼就看出来谁的基期最大？你可以看一看低的人跟前面高的人差大概多少，他补能补多少，有没有明显的一个量级的差距。\"\n\n> \"虽然这个 571 比下面这个 650、675 小，但小得很有限，这才差多少啊？你哪怕跟这个 675 去比，就我这个 571 现在虽然是最小的，但你让我去跟那个最厉害的人去比的话，我也就比他少 20% 不到吧，是不是就少了百分之二十不到？才差了快 100 左右。\"\n\n> \"你补要补多少啊？我负 30，你是 8，你是 5，我（差距）的差值就已经有了，起码 35、36 了。这只是差值，你还要再除什么？除 0.7。**你要给他补大概五十个点。要补太多了，他们增速差距太大了，所以文化教育绝对是最高的。**\"\n\n> \"然后再看 C、D，文化教育最高，就剩剩下两个文学艺术跟综合图书。看他们俩，这也没啥好看的了，**因为文学艺术现期小、增速大，所以综合图书更高**。懂了吗？这个就是属于你这个小的 571，他要补的实在太多了。\"\n\n**同学的提问与老师的答复（重要）：**\n\n> \"有同学问：老师，那如果补完感觉差不多了，怎么算？那只能说明什么？**只能说明他们俩的基期本身就特别靠近，说明他们的基期差距就是特别小，就是很近。**这种情况下，你要么补的时候给我补准了，要么你就放缩、把他们的基期精算。\"\n\n> \"这个时候你如果是用平均的增长去估算，有的时候你会有风险的。那你就精算——你不管怎么精算，你要么就把它这个增速精算，他们的增速差距是多少，是 `2.75 除以 1.054`，你就要把这个东西算准了，你就全要算准了。\"\n\n> \"或者你就老老实实地放缩，或者说化除为乘，把它的基期算出来。用精算的方式放缩，或者说画出微尘，画出微尘也是精算——**你不要听到个精算就说是放缩，画出微尘它也很精的，也很精确的**。老老实实把它基期算出来再比，那种就属于特殊情况，它两个太近了，你不算出来可能不好比。\"\n\n> \"或者你就是他们两个增速之间的这个补的东西，你就不要随便估了。比如说 8.17、5.42，补两个点吧——你就不能说两个点了，你得说清楚一点：`2.75 除 1.054` 大概给他补 2.6 左右，2.6 多一点，然后这样补 2.6，这样就会更准，就方法没误差。**但你如果想算得近、想算得细，你就把它算精一点。**\"\n\n> \"今天你们课后作业里面有一道题，精度要求特别高，你要拉平去做也可以做，而且也不难做，你去认真算也可以算，到时候你们可以去做做看。\"\n\n---\n\n### 第 8 题｜基期比较 · 江苏省出口额排序\n\n**【题干原文】**（原帧 f_0633 / f_0648 逐字）\n\n> 2013 年江苏省贸易进出口总额 5508.4 亿美元，比上年增长 0.5%。其中，出口 3288.5 亿美元，增长 0.1%；进口 2219.9 亿美元，增长 1.1%。对欧盟、美国、日本、中国香港出口额分别为 571.2 亿美元、654.3 亿美元、312.4 亿美元和 368.3 亿美元，比上年分别增长 −9.7%、2.6%、1.3% 和 9.2%。\n> 2012 年江苏省对欧盟、美国、日本、中国香港出口额由大到小排序正确的是：\n\n**【材料数据】**\n\n| 地区 | 2013 年出口额（亿美元） | 同比增速 |\n| --- | --- | --- |\n| 欧盟 | 571.2 | −9.7% |\n| 美国 | 654.3 | 2.6% |\n| 日本 | 312.4 | 1.3% |\n| 中国香港 | 368.3 | 9.2% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求 2012 年四地出口额**由大到小排序** → 基期比较 + 排序 |\n| 第一步：先\"分桌\"（分组） | 欧盟、美国一组（五六百亿量级）；日本、中国香港一组（三百多亿量级），跨组不可能翻盘 |\n| 第二步：比小组内的日本 vs 中国香港 | 日本 312.4（1.3%）现期小、增速小（同边）；中国香港 368.3（9.2%）现期大、增速大（同边） |\n| 补正 | 给日本补 `(9.2% − 1.3%) ÷ (1 + 1.3%) ≈ 7.8% ≈ 8 个点` |\n| 判断 | 差 55.9 亿美元，日本补 8 个点只有 24 亿多，**根本补不到** → 日本 \u003c 中国香港，且差距大 |\n| 第三步：比欧盟 vs 美国 | 欧盟 571.2（−9.7%）现期小、增速小；美国 654.3（2.6%）现期大、增速大（同边） |\n| 补正 | 给欧盟补 `(2.6% − (−9.7%)) ÷ (1 − 9.7%) = 12.3% ÷ 0.903 ≈ 13.5%` |\n| 速算 | 看差距：`654.3 − 571.2 = 83`；`83 ÷ 571.2 ≈ 14.5% > 13.5%`，**补 13.5 个点不够** → 美国 > 欧盟 |\n| 排序 | 美国 > 欧盟 > 中国香港 > 日本 |\n| 结论 | **A. 美国、欧盟、中国香港、日本** |\n\n**【选项原文】**\n\n> A. 美国、欧盟、中国香港、日本\n> B. 美国、欧盟、日本、中国香港\n> C. 欧盟、美国、中国香港、日本\n> D. 欧盟、美国、日本、中国香港\n\n**【答案】** ✅ A\n\n（画面：A 前打红 √，B 打红 ×。）\n\n**【解析】**\n\n- 先分桌：欧盟/美国（500+）与日本/中国香港（300+）不可能换组，于是 C、D 想\"欧盟第一\"必须击败美国。\n- 日本 vs 中国香港：差距 55.9 亿，补正只有约 8 个点（约 25 亿），**补不到** → 排除 B。\n- 欧盟 vs 美国：差距 83 亿，需要补约 `83 ÷ 571.2 ≈ 14.5%`，而实际只能补 13.5 个点（画面：`571.2 × 1.135 ≈ 648 \u003c 654.3`）→ **补不到** → 美国 > 欧盟 → 排除 C、D。\n- 陷阱类型：**方向陷阱（欧盟负增长，容易误判）＋ 概念陷阱（\"同边\"不能直接比，必须先看补不补得到）**。\n\n> \"在比的时候，首先你应该先怎么样？稍微先分桌。肯定是日本、香港一组，欧盟、美国一组，因为上面这边五六百，下面这边才三百多。**可以看到学校里面他也是这么分桌的。**\"\n\n> \"那其中哪个最好比呢？日本、香港的好比一点。日本是 312、1.3%，中国香港是 368、9.2%。那我们要比较他们的基期大小对吧？给谁补？给日本补，对不对？因为这时候你大小是同边的——香港它现期也大、增速也大，它基期不一定大的，你要补。\"\n\n> \"补几个点？补八个点。要算这八个点左右是多少吗？**不需要吧。因为什么？因为明显补不到啊，你 312 跟 368 差了二三十个点呢，差距太多了。**所以日本的基期肯定比香港的要小。那我们可以先把 B、D 排了，日本要排在香港的后面。\"\n\n> \"好，我们再给欧盟和美国去比。欧盟呢是 571，增速是 −9.7%；美国是 654，增速是 2.6，也是大小同边，也是美国的增速高、它的现期也大，所以还是要去补。给谁补？给欧盟去补几个点，先做差。\"\n\n> \"做差（2.6 − (−9.7)）大概是 12.3，再除以（1 − 9.7%），所以 13.5% 左右。13.5 怎么来的？化除为乘嘛——**这不就是增速是负百分之九点七的时候，你就算它基期这个东西就约等于 12.3 乘以 1 加上 9.7 乘以个大概 10% 的数，加个 1.2，得 13.5**，这 13.5 这么来的，没问题吧？\"\n\n> \"给他补 13.5，我不想去算这个 13.5，感觉 57 乘 13.5 不好算，那咋办？**看差多少？我不能看他们差多少吗？他们要是差得实在多，我根本不需要算了。**差多少呢？差 83，83 是 57 的多少呢？就有点近了吧，这种就是属于你**觉得会有点近的情况**了。\"\n\n> \"因为 83 比 57 差不多是 10 几（倍）……那我们就稍微算一下 `83 除 57`。下面加三，上面比如加个四、加个五左右，加个四吧，`87 除以 6`，发现明显大于 14 吧？14 点以上对不对？这个 14 还是能比较好看出来的吧。**所以 13.5 不够啊，这不够的，他这个也涨不到 14 上去。所以不够，那就美国大 A。**\"\n\n> \"他们俩的基期就属于是比较近的了。它欧盟的基期呢，按照计算器是 632，美国的基期呢，654 除以 1.026 是 637。**所以他们的基期就确实是比较近的。所以你在比较的时候也确实会发现难比一点，那时候就要利用一些技巧，看看一些范围。**\"\n\n> \"就比如 571 乘以百分之十三点五，对不对？能不能反应过来这 13.5 它是什么？二分之二十七。我先让 570 除个 2，285……乘 27……又是 3 乘 9，我再乘个三……错位相减，**所以它只能加一个 77 的样子**。那 571 加 77 是 648，小于 654，这样也不够啊。\"\n\n> \"**就是这个题目主要是要告诉大家：有时候你要算的时候，你不一定真的要把这个东西算出来。你可以看看它需要涨多少——只要比你这个实际能涨的部分（补的部分）多，那你就补不到；如果你不需要补那么多，那你就补得到。**\"\n\n---\n\n## 九、板块 03 增量比值\n\n**(画面切换：`03 增量比值`)**\n\n### 9.1 板书公式卡（原帧 f_0715）\n\n> 增量比值\n> 路程 = 速度 × 时间\n\n```\nΔA      基期A     增速A\n───  =  ─────  ×  ─────   =  基期比 × 增速比\nΔB      基期B     增速B\n```\n\n红笔大字标注：**「增 = 基 × 速」（增量 = 基期 × 增速）**\n\n> \"增量比值为什么会跟拉平增长率有关系呢？**因为增量的比值跟基期比也有关系。**\"\n\n**引入：路程 = 速度 × 时间（龟兔赛跑）**\n\n| 问 | 条件 | 列式 | 答案 |\n| --- | --- | --- | --- |\n| ① | 兔子平均速度是乌龟的 5 倍，奔跑时间是乌龟的 3 倍，兔子路程是乌龟的多少倍？ | `5 × 3` | **15 倍** |\n| ② | 兔子平均速度是乌龟的 5 倍，乌龟奔跑时间是兔子的 10 倍（兔子时间是乌龟的 1/10），兔子路程是乌龟的多少倍？ | `5 ÷ 10` | **0.5 倍** |\n\n> \"路程等于速度乘时间，如果现在龟兔赛跑比谁跑得更远……我知道兔子的平均速度是乌龟的五倍，然后它奔跑的时间是乌龟的三倍，那我问你路程是乌龟的多少倍？我速度是你的五倍，用的时间是你的三倍，那我的路程是不是就是你的 5 乘 3，15 倍？**因为这个倍数是可以根据这样的一个关系去累积起来的。**\"\n\n> \"那如果换个情况，兔子它比较懒，它喜欢睡觉。兔子的速度是乌龟的五倍，但是乌龟的时间是兔子的十倍，那兔子的路程是乌龟的多少倍呢？……怎么那么多个说二的呀？我速度是你的五倍，但我时间比你短，**这个时间是一个对我来说、对兔子来说是一个副作用。**应该是 5 除以 10，0.5 倍，能明白不？你速度是 5 倍，时间人家是你的 10 倍，所以是乘了个 1/10……有时候你不需要把这个十倍转化成十分之一，你叫它 5 除以 10 就好了。\"\n\n**公司福利类比（老师原话）：**\n\n> \"就好像我还是拿钱，因为有时候你对这个钱可能会敏感一点。有两个公司，一个公司是 A，一个公司是 B，要比较他们俩谁的待遇好、谁的人均福利高。然后 A 公司说，我今年这个福利给出去 200 万，发给员工；B 公司说，哎哟我今天只给了 100 万。那你能说 A 的福利一定比 B 的好吗？是不是不一定，因为来看人均值。\"\n\n> \"那我这个人数，A 他要分给十倍的人，(B) 要分给五倍的人……**你要去看这些东西，它对于你这个最终成绩的一个结果是正作用还是副作用？**那这个钱是正作用吧，我是你的两倍，所以我就把这个二直接乘上来。但是人数呢？人数是个副作用吧，我人数是你两倍，但我这时候就不能乘二了，**我得除二，因为人越多分得越少**，所以除二，所以他们的人均福利其实是一样的。\"\n\n> \"**反正他们之间永远都是一个乘除关系，又不是加跟减，你只能乘或者除。**\"\n\n> \"因为路程等于速度乘时间，这种 a = b × c 的关系，其实跟我们增量里面的也是比较接近的。因为**增量它就等于基期乘以增速**。所以我们想要看增量的倍数关系，我们也可以看基期和增速的倍数关系。**增量比值就等于基期比乘以增速比。**\"\n\n### 9.2 增量比值练习（三组）\n\n**【练习原文】**（原帧 f_0715）\n\n| 组 | a | a 的增速 | b | b 的增速 |\n| --- | --- | --- | --- | --- |\n| ① | 15394 | 3.6% | 1210 | 5.4% |\n| ② | 41.96 | 18.77% | 28.63 | 9.91% |\n| ③ | 3482 | 9.6% | 299 | 27% |\n\n**【第 ① 组】**\n\n```\n量的比：15394 ÷ 1210 ≈ 12.7 ≈ 13 倍（画面写\"15700/1210 ≈ 13\"）\n增速比：5.4 ÷ 3.6 = 1.5 倍（大数除小数）\n增量比 = 13 ÷ 1.5 ≈ 8.7 倍\n```\n\n> \"我们首先应该看什么？基期比跟现期比对不对？那我们这边它没有基期，这是啥？这是现期。咋办？我们只有现期跟增速。\"\n\n> \"你要是想准确一点，或者想凑数一点，给左边补什么？补两个点不到，补 300 不到。**因为我不需要补，我这个就是我们的基期比，你也可以不补，你就说我就拿 15394 除 1210 行不行？这也可以。**你除了之后，你只要记得有这么个误差，你看你需不需要调——有的时候你那个选项并不一定需要你调这个东西。\"\n\n> \"然后大概估一下，这个算呢应该在十三倍左右……你有时候不用管它，**这种题目它的精度要求也不高的**。就十几倍、十三倍，这个就是我们得到的一个大概的基期比。\"\n\n> \"然后再看什么？再看增速比。**增速比你不一定非要去拿这个增速 a 除增速 b，说唉我非要算一个什么 3.6 除以 5.4，没必要，因为小数除以大数，它往往没有大数除以小数来得更好算。**\"\n\n> \"所以就问你自己，2 除 7 好不好算，7 除 2 好不好算？一般来说都是大数除小数好算一点。所以你不一定要拿 3.6 除 5.4，你可以想 5.4 是 3.6 的几倍。我习惯性都会拿这个大数出小数，5.4 是不是 3.6 的 1.5 倍？量的比是 13 倍，增速的比是 1.5 倍，所以增量的比是 13 除以 1.5。\"\n\n> \"这肯定有同学说，老师你上面不是说这个增量比值等于基期比乘增速比吗？怎么这个地方你是除 1.5 了呢？**这就跟我们刚说这个问题是一样的，这是对方是你的几倍，这是对方的优势，你是劣势，所以你要除。**所以它们的增量比就是 13 除以 1.5，大概就是 8 倍多吧，8 乘以 1.5 是 12，8 倍多一点。\"\n\n**【第 ② 组】**\n\n```\n量的比：41.96 ÷ 28.63 ≈ 1.5 倍（现期比，好算所以先算）\n增速比：18.77 ÷ 9.91 ≈ 19 ÷ 10 = 1.9 倍\n增量比（未修正）= 1.5 × 1.9 = 1.9 + 0.95 = 2.85\n补正：现期比 1.5 偏高，给分母补 8 个点 → 1.5 ÷ 1.08 ≈ 1.39\n修正后：1.39 × 1.9 ≈ 2.64 ≈ 2.6\n```\n\n> \"直接看量的比、增速的比，这时候我们要不要拉平？先不拉。为什么先不拉？因为直接算好算——四十二是二十八的一点五倍左右，这种问题你不用算很准。一般来说这种增量比值，它要求都不会特别高，你按照 0.5 去定个档：这是一倍多一点、一点五倍、两倍、2.5 倍、三倍，稍微估一个就可以了。\"\n\n> \"1.5 倍附近对吧？增速好不好看？**要看吧，9.91，那不就是 10 吗？** 18.77 除以 9.91 约等于 19 除以 10，1.9 倍。所以它的增量比就是 1.5 乘以 1.9，大概就是 1.9 加 0.95，等于 2.85 倍。\"\n\n> \"那如果这个比值不够准——这个比值肯定不够准——为什么我说这个比值肯定不准？如果选项 C 这边比如说是一个 2.6，D 是个 2.9，你算出来个 2.85，你应该选哪一个？**对，很好选 C。**\"\n\n> \"为什么会这样？因为我刚说了，拉平这个东西我们是分两种的：一种是过程中修正，一种是结果上修正。这个地方你直接拿 42 除以 28，它本身太好除了，就是 1.5，**所以我们先算再调，需要调再调**。我们是不是刚刚这个 1.5 是偏高的？准确的基期比应该是在这个结果这个现期比 1.5 的基础上，给分母去补，大概几个点？八个点。\"\n\n> \"增速差是 8.8（18.77 − 9.91），你还要除以一个 1.099，也就是 1.1。八个点就是这么来的……所以你这个结果 2.85 也偏高 8 个点，你要把它除以 1.08，那 2.85 退 8 个点，那不就是 C 吗？不可能是 D 对吧？\"\n\n> \"**这样子的话，就是你这个拉平增长率，它修正的过程、修正的地方还是很灵活的。**你可以在过程中修（先把 1.5 补成基期比），也可以在结果上修。\"\n\n**【第 ③ 组】**\n\n```\n量的比：3482 ÷ 299 ≈ 11.6 倍（现期比）\n增速比：9.6 ÷ 27 ≈ 1/3（三不到 → 27 ÷ 9.6 ≈ 2.8~3 倍）\n增量比 ≈ 11.6 ÷ 2.8 ≈ 4.1（粗放：看作 12 ÷ 3 ≈ 4 倍）\n补正（给分子补 15%~16%）→ 约 4.6 倍（选项 4.6 被圈出）\n```\n\n> \"继续再看第三组，他们的增量比直接先看现期比，因为你直接算也挺好算的。除以三是多少？现期比是 11.6。然后呢，也可以选择补，也可以选择先除。增速比大概是多少？三不到，对不对？\"\n\n> \"所以我们要除以三，因为这个优势是对方的，你是劣势的，是他的三倍多，所以你看这个增量比你要除以三。除了三不到，那我就看作十二除以三，粗略一点——**很多时候你可以粗放一点，因为这种题目它的精度要求真的不高**……大概是四倍。\"\n\n> \"如果这个四选不出来，我们再补。我们可以再去补，给谁补？给分子补，补大概 15%~16% 的样子，所以它准确的增量比应该是 4.6 倍。\"\n\n> \"像很多时候你大概看一个现期的比值、增速的比值，然后记得那个误差，知道什么时候去调，你这种题目就会很快了。\"\n\n> \"我来给你们按一下计算器，我看看是不是 4.6。我这边也是现场临时估算的：`3482 除以 1.096 乘以 0.096 等于 305`，然后 `299 除以 1.27 乘以 0.27 等于 63.5`，305 除以 63.5 还是有点误差的，算下来应该是 4.8。那说明刚刚这个地方呢算的还是有点误差。\"\n\n> \"那其实对于大部分题目来说，这种精度要求已经完全足够了……4.16 其实也高不了多少，还是有点误差的。\"\n\n> \"**如果题目是什么 4.8 倍，你能算到 4.6，肯定能选出来。这种题目真的精度要求不高。**……因为这（种题）步骤多：一般一个题目，它常规步骤越多，它的选项的差距就会越大。\"\n\n---\n\n### 第 9 题｜增量比值 · S 省工业品物流总额增量占比\n\n**【题干原文】**（原帧 f_0792 逐字）\n\n> 2018 年前三季度，S 省社会物流总额 35357.26 亿元，同比增长 6.4%，增速比上年同期提高 0.7 个百分点。其中，工业品物流总额 16636.15 亿元，同比增长 0.2%，增速比上年同期提高 2.1 个百分点。\n> 2018 年前三季度，S 省工业品物流总额同比增量约为同期社会物流总额同比增量的：\n\n**【材料数据】**\n\n| 指标 | 2018 年前三季度（亿元） | 同比增速 | 增速变化 |\n| --- | --- | --- | --- |\n| 社会物流总额 | 35357.26 | +6.4% | 提高 0.7 个百分点 |\n| 其中：工业品物流总额 | 16636.15 | +0.2% | 提高 2.1 个百分点 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求两个量**增量的比值**（\"约为……的\"） |\n| 关系式 | `增量比 = 基期比 × 增速比`（谁是谁的倍数，看分子分母） |\n| 先看现期比 | 社会物流总额 ÷ 工业品物流总额 = `35357.26 ÷ 16636.15 ≈ 2.1 倍`（\"35000 是 16000 的两倍多\"） |\n| 再看增速比 | `6.4% ÷ 0.2% = 32 倍`（\"64 是 0.2 的多少倍？32 倍吧\"） |\n| 增量比 | 社会增量 ÷ 工业品增量 ≈ `2.1 × 32 ≈ 68 倍`（画面写\"64 倍多\"） |\n| 反求占比 | 工业品增量 ÷ 社会增量 = `1 ÷ 68 ≈ 1.5%`（画面写 `1/60 ≈ 1.6%`） |\n| 判据 | \"20 倍是一个分界线\"：超过 20 倍即占比不到 5% |\n| 结论 | **D. 不到 5%** |\n\n**【选项原文】**\n\n> A. 超过 30%　B. 10%~30% 之间　C. 5%~10% 之间　D. 不到 5%\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 现期比约 2 倍、增速比 32 倍，两者相乘约 64~68 倍，说明工业品增量只有社会物流总额增量的约 **1/64**（约 1.6%），远小于 5%。\n- 关键判据：**只要\"社会增量 ÷ 工业品增量 > 20 倍\"，工业品占比就不到 5%**，所以那 6 个百分点的误差根本不需要调。\n- 陷阱类型：**倍数陷阱（不注意 20 倍 = 5% 这条分界线）+ 概念陷阱（问的是占比，却容易去算具体增量）**。\n\n> \"问：18 年前三季度，工业品物流总额的增量是社会物流总额增量的多少倍？……**比较他们增量的比值，我们需要把它的增量算出来吗？有的时候可以算，但这个题目不需要。为什么呢？因为倍数关系太明显了，你直接算倍数很快，它很整。**\"\n\n> \"那我们看谁是谁的倍数？我们看社会物流总额是工业品物流总额的多少倍。为什么看他们俩？**因为后面的大，你要大数除小数会好算。** 64 是 0.2 的多少倍？32 倍吧。35000 是 16000 的多少倍？两倍多吧。我直接拿一个现期比和增速比来乘，我们的增量比就已经到了 64 倍多了。\"\n\n> \"那你说选啥呀？……你说不行，你拿现计算的不作数，你应该拿基期算——**那我这个现期比跟增速比又差几个点呢？是不是只差 6 个点？我差这六个点吗？我六个点我不要了，我退给你。我退完，我不还有六十倍吗？**\"\n\n> \"我是你的 60 倍，你是我的 1/60，你才多少？才 1.6% 啊。因为不到 5%，它是个 20 倍的一个分界线——**我是你的 20 倍，你就是我的 5% 不到；只要我是你的 20 倍以上就好了。我这边现期这边是 64 倍呀。**\"\n\n> \"这个题目就是详细说明了：**第一，为什么要用这种方法，为什么我们不去直接算这个增量，因为有的时候这个倍数太明显了；第二，这种题目它的选项差距往往比较大，精度要求不高，你简单估一估就可以了，不需要把那个增量算得很准确；第三，说明一个点，就是大数除小数好算，你尽量先大数除小数，然后具体是乘还是除，你结合那个关系思考一下就好了。**\"\n\n---\n\n### 第 10 题｜增量比值 · 铜产量增量是锌产量增量的多少倍\n\n**【题干原文】**（原帧 f_0814 逐字）\n\n> 2018 年 1 季度，全国十种有色金属产量 1339 万吨，同比增长 2.4%，增速同比回落 6.6 个百分点。其中，铜产量 221 万吨，增长 8.7%，提高 1.4 个百分点；电解铝产量 812 万吨，增长 0.3%，回落 10.6 个百分点；铅产量 127 万吨，增长 11.1%，提高 1.2 个百分点；锌产量 142 万吨，增长 1.7%，回落 1.3 个百分点；氧化铝产量 1589 万吨，下降 6.1%，去年同期为增长 19.9%。\n> 2018 年 1 季度全国铜产量同比增量是同期锌产量同比增量的：\n\n**【材料数据】**\n\n| 品种 | 2018 年 1 季度产量（万吨） | 同比增速 |\n| --- | --- | --- |\n| 十种有色金属（合计） | 1339 | 2.4% |\n| 其中：**铜** | **221** | **8.7%** |\n| 　　　电解铝 | 812 | 0.3% |\n| 　　　铅 | 127 | 11.1% |\n| 　　　**锌** | **142** | **1.7%** |\n| 　　　氧化铝 | 1589 | −6.1% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求增量比值 |\n| 现期比（铜 ÷ 锌） | `221 ÷ 142 ≈ 1.5 倍`（画面：`221 ÷ 142 ≈ 1.5`） |\n| 补正（可选） | 若要精确的基期比，给分母补 `(8.7% − 1.7%) ÷ (1 + 1.7%) ≈ 7%` → `142 × 1.07 ≈ 152` → 基期比 `221 ÷ 152 ≈ 1.45` |\n| 增速比 | `8.7% ÷ 1.7% ≈ 5 倍`（画面：\"八点七是十一点七的多少倍？五倍多吧\"） |\n| 增量比 | `1.5 × 5 ≈ 7.5 倍` |\n| 判据 | 选项档位粗（2 / 2~4 / 4~6 / 6 倍以上），直接落 **6 倍以上** |\n| 结论 | **D. 6 倍以上** |\n\n**【选项原文】**\n\n> A. 不到 2 倍　B. 2~4 倍之间　C. 4~6 倍之间　D. 6 倍以上\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 量级判断即可：铜的现期比锌多一半（1.5 倍），增速是锌的 5 倍多，两者相乘已超过 6 倍，直接选 D。\n- 这类题\"精度要求不高，你大概估个四估四点几、五点几还是六点几、七点几就行了\"。\n- 陷阱类型：**倍数陷阱（不必精算增量）+ 范围陷阱（选项是区间）**。\n\n> \"那么再看这道题也是个增量比值吧。18 年一季度全国铜产量的增量是锌产量增量的多少倍？找到铜和锌，铜的产量，这是它的现期增速，锌的现期增速，比较它们俩的增量倍数。\"\n\n> \"你看这种题目，它的精度要求不会很高，你就大概估计就出来了。（选项）是四估四点几、五点几还是六点几、七点几就行了。\"\n\n> \"好，那我们应该先看什么？看它的现期比增速比好不好？大概估一个是几倍好不？应该还是比较好比的吧。我是不是可以直接拿这个 221 除以 142，大概是一点五倍？而且明显比一点五倍多一点，但也不影响——为什么呢？因为如果你要算一个准确的基期比，你需要给这个 142 去补大概百分之七，会把它补到大概一百五左右……那 221 是 150 的 1.5 倍，这个应该大家都知道吧？（15 乘 15 是 225）。这个基期比大概 1.5，你看你这个题目，要是他问你基期比，我一点五几秒钟就出来了。\"\n\n> \"再看增速是多少倍？我的增速也高，优势还是在我，8.7 是 1.7 的多少倍？是不是 5 倍？五倍多吧。那 1.5 乘 5，7.5 多，那不就地走了吗？**要算什么增量啊，我何苦去算增量，没必要去算增量。你算两个增量，还得来增量除一下看倍数，我现在直接看现期倍数、增速倍数大概估一下就好了。要是估的不准嘛，那个差距大了，你把那个误差再补回去不就好了吗？**\"\n\n---\n\n### 第 11 题（反例）｜2016 年该市教育支出增量是医疗卫生的多少倍\n\n**【题干原文】**（原帧 f_0784 逐字）\n\n> 表 2　2016 年该市本级主要预算支出项目完成情况\n> 2016 年该市教育支出同比增量约是医疗卫生的多少倍？\n\n**【材料数据】**（表 2　2016 年该市本级主要预算支出项目完成情况）\n\n| 支出项目 | 支出金额（亿元） | 同比增速（%） |\n| --- | --- | --- |\n| 一般公共服务 | 6.37 | 31.0 |\n| 公共安全 | 4.77 | 37.3 |\n| **教育** | **6.03** | **51.7** |\n| 科学技术 | 1.11 | 181.0 |\n| 文化体育与传媒 | 1.29 | 35.8 |\n| 社会保障和就业 | 2.63 | 26.7 |\n| **医疗卫生** | **2.28** | **14.4** |\n| 节能环保 | 6.68 | 567.0 |\n| 城乡社区事务 | 2.57 | 48.7 |\n| 农林水事务 | 4.02 | 34.5 |\n| 交通运输 | 2.58 | 10.8 |\n| 资源勘探电力信息等事务 | 4.70 | 67.8 |\n\n**【解题拆解（分数法秒解）】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 增量比值——但本题是**拉平增长率法的反例** |\n| 数据 | 教育 6.03 亿元（+51.7%，≈ 1/2）；医疗卫生 2.28 亿元（+14.4%，≈ 1/7） |\n| 教育增量 | `r ≈ 1/2` → 增量 = 现期 ÷ 3 = `6.03 ÷ 3 = 2.01` |\n| 医疗卫生增量 | `r ≈ 1/7` → 增量 = 现期 ÷ 8 = `2.28 ÷ 8 = 0.285 ≈ 0.28`（画面特别提示：**是 0.28，不是 2.8**） |\n| 倍数 | `2.01 ÷ 0.28 ≈ 2.1 ÷ 0.3 = 7` |\n| 结论 | **B. 7** |\n\n**【若硬用增量比值公式（画面校验）】**\n\n```\n现期比 = 6.03 ÷ 2.28 ≈ 2.645（画面写\"6/2.28 = 2.7\"）\n增速比 = 51.7 ÷ 14.4 ≈ 3.59（画面写\"3.5 倍\"）\n未修正增量比 = 2.645 × 3.59 ≈ 9.5（画面写\"9.45 倍\"）\n补正（给分母补 (51.7−14.4)/(1+14.4%) ≈ 32.6%）→ 基期比 ≈ 2.645 ÷ 1.326 ≈
