 2.0\n修正后增量比 ≈ 2.0 × 3.59 ≈ 7.2 ≈ 7\n```\n\n**【选项原文】**\n\n> A. 4　B. 7　C. 10　D. 14\n\n**【答案】** ✅ B\n\n（画面：B 前打红 √。）\n\n**【解析】**\n\n- 本题**不适合**用\"基期比 × 增速比\"两步走，原因有二（画面板书）：\n  - **① 增速差距大**：51.7% 与 14.4% 相差 37 个百分点，`1+r` 影响太大，拉平不好拉；\n  - **② 增速太特殊**：51.7% ≈ 1/2、14.4% ≈ 1/7，正是出题人送的\"分数法\"福利，直接算增量更快。\n- 分数法：`r = 1/n` 时，**增量 = 现期 ÷ (n + 1)**。所以教育 `6.03 ÷ 3 = 2.01`，医疗卫生 `2.28 ÷ 8 ≈ 0.28`。\n- 陷阱类型：**单位/量级陷阱（`2.28 ÷ 8 = 0.285`，绝不能写成 2.8）+ 方法陷阱（该用分数法时别硬套拉平增长率）**。\n\n> \"来看这道题：2016 年教育支出的增量是医疗卫生的多少倍？教育支出在这，医疗卫生在这。**题目就是一个反例，这道题目是增量比值，我们有拉平增长率的一个反例。**这也就是我前面也说过的：**没有一个方法它是能在所有的情况下都是又快又好的，每一个方法都有它一定的局限性。**\"\n\n> \"这个题目就没有那么适合去用基期比、增速比来看。有两个原因：**一个是增速差距太大了**，你要去拉的话，没有那么好拉；而且如果你不拿现期比，跟基期比差距太大，容易误差大。**第二个是这个增速太特殊了**——这个增速这么特殊，你还不去算增量，你这不浪费出题人给你设置的好增速吗？\"\n\n> \"那百分之五十一点七不就是二分之一吗？百分之十四点四这不就是七分之一吗？**分数法直接秒出增量**，大概估一下就出结果的事情，你还要在这边拉平，是不是就有点绕远路了呀？所以这种增量特别好算的，你就把它增量算出来。\"\n\n> \"上面这个教育的增量，因为增速是 1/2，所以**增量是现期的 1/3**，6.03 除以 3 等于 2.01，对吧？下面这增速是 1/7，**增量就是现期除以 8**，2.28 除以 8，大概就是二点几……**注意，别写成 2.8 啊，写 2.8 你也没答案。因为这个（2.28）总共才 2.28%，10% 左右，应该是 0.2 几，所以 0.28。**\"\n\n> \"好，所以 2.01 是 0.28 的多少倍呢？那 7 倍是不是一下看出来了？大概看成 2.1 除以 0.3 倍，你把这个 0.28 凑成 0.3，上面的适当变大一点，2.1 除 0.3 等于 7。这边就是还用到了一个**放缩**。\"\n\n> \"哎，我知道你拉平补一下也没有多慢，那肯定没有我这样直接估一个快。**我何苦去给你写个 0.28 呢？我正在给你讲题目，我把这个东西写细一点的。**你这个题目你要是直接看分数法来做，基本上是没有什么计算量的。懂了吗？\"\n\n---\n","outline":[{"level":2,"text":"一、开篇：从\"分式的增速\"到\"定这个量\"","id":"一开篇从分式的增速到定这个量"},{"level":2,"text":"二、本集知识地图（目录页）","id":"二本集知识地图目录页"},{"level":2,"text":"三、板块 01 基期比值：从两个特例到一般公式","id":"三板块-01-基期比值从两个特例到一般公式"},{"level":3,"text":"1. 引入例题：单价 = 销售额 / 销量","id":"1-引入例题单价-销售额-销量"},{"level":3,"text":"2. 特例一：分子分母增速相同（+10% 与 +10%）","id":"2-特例一分子分母增速相同10-与-10"},{"level":3,"text":"3. 特例二：分子增速为 0%，分母增速 +10%","id":"3-特例二分子增速为-0分母增速-10"},{"level":3,"text":"4. 特例三：分子 +10%，分母 +21%（分位上的增速不是简单差值）","id":"4-特例三分子-10分母-21分位上的增速不是简单差值"},{"level":3,"text":"5. 特例四：分子 +21%，分母 +10%（反向）","id":"5-特例四分子-21分母-10反向"},{"level":3,"text":"6. 板书公式卡：现期比 → 基期比（正式公式与两种写法）","id":"6-板书公式卡现期比-基期比正式公式与两种写法"},{"level":3,"text":"7. \"给增速低的一方补正平均数增长率\"——本课灵魂口诀","id":"7-给增速低的一方补正平均数增长率本课灵魂口诀"},{"level":3,"text":"8. 为什么要\"给低的补\"：两个优点","id":"8-为什么要给低的补两个优点"},{"level":3,"text":"9. 除法放缩视角的再解释（2000 / 1000 数值例）","id":"9-除法放缩视角的再解释2000-1000-数值例"},{"level":2,"text":"四、基期比 a/b 估算练习（6 组）","id":"四基期比-ab-估算练习6-组"},{"level":2,"text":"五、过程中的修正 vs 结果上的修正","id":"五过程中的修正-vs-结果上的修正"},{"level":2,"text":"六、重要注意点：增速差距过大时怎么办","id":"六重要注意点增速差距过大时怎么办"},{"level":2,"text":"七、例题精讲","id":"七例题精讲"},{"level":3,"text":"第 1 题｜基期比值 · 西部地区商品房销售价格","id":"第-1-题基期比值-西部地区商品房销售价格"},{"level":3,"text":"第 2 题｜基期比值 · 民办中等职业学校校均在校生","id":"第-2-题基期比值-民办中等职业学校校均在校生"},{"level":3,"text":"第 3 题｜基期比值 · 秋粮产量占粮食总产量比重（高精度）","id":"第-3-题基期比值-秋粮产量占粮食总产量比重高精度"},{"level":3,"text":"第 4 题｜基期比值 · 2016 年 5 月进口药品金额环比增速","id":"第-4-题基期比值-2016-年-5-月进口药品金额环比增速"},{"level":3,"text":"第 5 题｜基期比值应用 · 2022 年第四季度铁矿石环比增速趋势","id":"第-5-题基期比值应用-2022-年第四季度铁矿石环比增速趋势"},{"level":2,"text":"八、板块 02 基期比较","id":"八板块-02-基期比较"},{"level":3,"text":"8.1 两条基本规律（板书原文，原帧 f_0516 / f_0523）","id":"81-两条基本规律板书原文原帧-f_0516-f_0523"},{"level":3,"text":"第 6 题｜基期比较 · 文化及相关产业营业收入最高行业","id":"第-6-题基期比较-文化及相关产业营业收入最高行业"},{"level":3,"text":"第 7 题｜基期比较 · 图书出口额排序","id":"第-7-题基期比较-图书出口额排序"},{"level":3,"text":"第 8 题｜基期比较 · 江苏省出口额排序","id":"第-8-题基期比较-江苏省出口额排序"},{"level":2,"text":"九、板块 03 增量比值","id":"九板块-03-增量比值"},{"level":3,"text":"9.1 板书公式卡（原帧 f_0715）","id":"91-板书公式卡原帧-f_0715"},{"level":3,"text":"9.2 增量比值练习（三组）","id":"92-增量比值练习三组"},{"level":3,"text":"第 9 题｜增量比值 · S 省工业品物流总额增量占比","id":"第-9-题增量比值-s-省工业品物流总额增量占比"},{"level":3,"text":"第 10 题｜增量比值 · 铜产量增量是锌产量增量的多少倍","id":"第-10-题增量比值-铜产量增量是锌产量增量的多少倍"},{"level":3,"text":"第 11 题（反例）｜2016 年该市教育支出增量是医疗卫生的多少倍","id":"第-11-题反例2016-年该市教育支出增量是医疗卫生的多少倍"}]},{"id":"P16","title":"拉长平均率·课后作业解析（上）","full":"第6课 拉平增长率（拉长平均率）·课后作业解析（上）","lect":"","dur":"33:20","sec":2000,"theme":"第 6 课《拉平增长率》课后作业解析（上）——逐题精讲第 1 题 ~ 第 11 题（第 11 题在本集末尾讲到一半，视频结束，未给出最终选项）","url":"https://www.bilibili.com/video/BV15bGA6PEJL?p=16","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 16 集\n\n# 第6课 拉平增长率（拉长平均率）·课后作业解析（上）\n\n> **课程信息**\n> - 课程名称：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> - 本集位置：合集第 16 集（共 21 集）\n> - 视频地址：`https://www.bilibili.com/video/BV15bGA6PEJL?p=16`\n> - 时长：33 分 20 秒\n> - 本集主题：**第 6 课《拉平增长率》课后作业解析（上）**——逐题精讲第 1 题 ~ 第 11 题（第 11 题在本集末尾讲到一半，视频结束，未给出最终选项）\n> - 素材规模：28 张网格图（3×3）、250 张原帧（1440×810，相隔 8 秒）\n> - 补充说明：本集**无目录页 / 无标题页**，画面从第 1 题直接开始；课程板书标题为「**拉平增长率**」（转写作\"拉长平均率\"，以画面与 P15 板书为准）\n> - 上一集衔接：P15《第6课 拉平增长率》讲完「基期比值 / 基期比较 / 增量比值 / 增量比较 / 基期和差」五大考点的公式体系，本集为其课后作业的**逐题实战解析（上）**，与 P17（中）、P18（下）同属一课\n\n---\n\n## 目录\n\n- [一、本讲方法论总纲（拉平增长率的三种调法）](#一本讲方法论总纲拉平增长率的三种调法)\n- [二、例题精讲（11 题全覆盖）](#二例题精讲11-题全覆盖)\n  - [第1题｜2011年全国展览业：基期比值（平均每场展出面积）](#第1题2011年全国展览业基期比值平均每场展出面积)\n  - [第2题｜2023年信息技术服务：基期比值（云服务 ÷ 集成电路设计）](#第2题2023年信息技术服务基期比值云服务--集成电路设计)\n  - [第3题｜2014年房地产业：基期比值（土地购置单价）](#第3题2014年房地产业基期比值土地购置单价)\n  - [第4题｜2021年工业企业利润：基期比较大小（谁最低）](#第4题2021年工业企业利润基期比较大小谁最低)\n  - [第5题｜2019年通勤高峰拥堵：基期比较大小（谁最拥堵）](#第5题2019年通勤高峰拥堵基期比较大小谁最拥堵)\n  - [第6题｜一线城市拥堵排序：基期比较大小（由重到轻）](#第6题一线城市拥堵排序基期比较大小由重到轻)\n  - [第7题｜2019年一季度社零：基期比较大小（谁最高）](#第7题2019年一季度社零基期比较大小谁最高)\n  - [第8题｜2022年服务业增加值：增量比较大小（谁最多）](#第8题2022年服务业增加值增量比较大小谁最多)\n  - [第9题｜2017年上半年S市手机出口：基期比值（含负增速）](#第9题2017年上半年s市手机出口基期比值含负增速)\n  - [第10题｜2016年该市财政支出：增量倍数（教育 ÷ 医疗卫生）](#第10题2016年该市财政支出增量倍数教育--医疗卫生)\n  - [第11题｜2021年上半年S市零售：增量倍数（视频未完）](#第11题2021年上半年s市零售增量倍数视频未完)\n- [三、本讲知识点总表](#三本讲知识点总表)\n- [四、速算口诀与解题流程](#四速算口诀与解题流程)\n- [五、易错点与陷阱清单](#五易错点与陷阱清单)\n- [六、老师金句](#六老师金句)\n- [附录：画面进程表（核对用）](#附录画面进程表核对用)\n\n---\n\n## 一、本讲方法论总纲（拉平增长率的三种调法）\n\n本集 11 道题，只有两类内核：\n\n| 类型 | 题目 | 核心式子 |\n| --- | --- | --- |\n| **基期比值 / 基期比较** | 第 1、2、3、4、5、6、7、9 题 | 从\"现期比\"倒推\"基期比\"，只补/退一个增速差 |\n| **增量比值 / 增量比较** | 第 8、10、11 题 | 增量 = 现期 × r ÷ (1 + r)；增量比 = 基期比 × 增速比 |\n\n**公式卡（画面板书逐字）**\n\n```\n分子 A（增速 r高）\n分母 B（增速 r低）\n\n现期比 = A / B\n\n基期比 = (A ÷ (1+r高)) ÷ (B ÷ (1+r低))\n       = (A / B) × (1+r低) / (1+r高)\n       = 现期比 ÷ [ 1 + (r高 − r低) / (1 + r低) ]\n```\n\n> \"七期笔（现期比）就是在现期比的基础上去给他们补一个比零售增长率（平均增长率）……要给谁补呢？要给增速低的那个去补。\"\n\n令 `Δ = (r高 − r低) / (1 + r低)`，则\n\n```\n基期比 ≈ 现期比 ÷ (1 + Δ)\n```\n\n**Δ 的三种落点（本集反复演示，\"调误差本身是灵活的\"）**\n\n```\n方式① 补在分子上：分子 × (1+Δ)          （适合分子好凑整时）\n方式② 退/补在分母上：分母 × (1−Δ) 或 × (1+Δ)（适合分母好凑整时）\n方式③ 先算完现期比，再整体 ÷ (1+Δ)      （适合现期比本身好算时）\n```\n\n> **调误差这件事情它本身就是灵活的，你可以在过程中调，也可以在结果上调。**\n>\n> 一般来说，这种算基期比就是这样的三种思路，选择哪一种思路，核心原理还是**看哪里有你需要的整数**，哪边能更方便你去到你想要的那个整数上去。\n\n**增量方向的两条式子（板书逐字）**\n\n```\n增量 Δ = 现期 × r ÷ (1 + r)     （板书：Δ = 现期 × r / (1+r)）\n增量比 = 基期比 × 增速比          （板书：Δ₁/Δ₂ = 基期比 × 增速比）\n```\n\n> \"因为增量一比上增量二等于基期比乘以增速比。只要这种 a 等于 b 乘 c 的，你要比较 a 的关系，就看 b 的跟 c 的倍数关系就好了。\"\n\n**\"大则大\"原则（第 8 题板书：**大则大**）**\n\n```\n增量 = 现期 ÷ (1 + 1/r) 形式展开后：\n现期又大、增速又大 → 增量必然大（分子大、分母小）\n```\n\n**基期比较大小的\"排除法\"（第 4、5、6、7 题通用）**\n\n```\n基期 = 现期 ÷ (1 + r)\n\n若甲：现期更小 + 增速更大  →  分子小、分母大 → 基期必更小，直接排除\n若甲：现期最大 + 增速最低  →  基期必为最大（其他人都追不上）\n其余情况：选现期最大者，给其他\"增速更低\"的候选补 Δ，看能否追上\n```\n\n---\n\n## 二、例题精讲（11 题全覆盖）\n\n### 第1题｜2011年全国展览业：基期比值（平均每场展出面积）\n\n**【题干原文】**（画面逐字，f_0001）\n\n> 1.2011年全国共举办展览6830场，比2010年增加9.2%；展出面积为8120万平方米，比2010年增长8.5%。\n>\n> 2010年平均每场展览展出面积约为多少平方米：\n>\n> A.11000　B.12000　C.13000　D.14000\n\n**【材料数据】**\n\n| 指标 | 2011 年（现期） | 同比增速 | 在比值中的角色 |\n| --- | --- | --- | --- |\n| 展览场数 | 6830 场 | +9.2% | **分母**（增速高 → 让它的分母变大，比值要往下退） |\n| 展出面积 | 8120 万平方米 | +8.5% | **分子**（增速低 → 给它补） |\n| 所求 | 2010 年平均每场展出面积 | — | = 展出面积 ÷ 展览场数 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"平均每场面积\"是**比值**；问的是 **2010 年 = 基期** → **基期比值（基期比）问题** |\n| 定位数据 | 面积 `8120 万平方米（+8.5%）`、场数 `6830 场（+9.2%）` |\n| 列式 | `基期比 = (8120 ÷ (1+8.5%)) ÷ (6830 ÷ (1+9.2%)) = 8120/6830 × (1+9.2%)/(1+8.5%)` |\n| 先写现期比 | `现期比 = 8120 ÷ 6830` |\n| 算增速差 | `9.2% − 8.5% = 0.7%`，即\"上面那个差值 0.7%\" |\n| 补的比例 | `Δ = 0.7% ÷ (1 + 8.5%) ≈ 0.7% / 1.085 ≈ 0.65% ≈ 0.6%` |\n| 结论 | `基期比 ≈ 8120/6830 × (1+0.6%) ≈ 1.189 万 × 1.006 ≈ 1.2 万平方米/场 = 12000 平方米/场` |\n\n**【速算演示（画面板书 + 老师口播三种调法）】**\n\n老师原话的处理顺序：\n\n> \"看到这两个数的时候，脑海中先要有一个上面的差值百分之零点七，然后可能要再小那么一点点……所以大概就是给他补一个百分之零点六的样子。\"\n\n```\n【总式】\n基期比 = 现期比 × (1 + 0.6%) = 8120 / 6830 × (1 + 0.6%)\n       = 812 / 683 （单位：万平方米 ÷ 场，结果再 ×10000 变平方米）\n```\n\n```\n【调法①：补在分子上】\n8120 的 1% ≈ 81，则 0.6% ≈ 49\n8120 + 49 ≈ 8170\n8170 / 6830 ≈ 1.196 万 → 约 11960 ≈ 12000\n```\n\n```\n【调法②：上下同时凑整，分母退到 2/3 万】\n分母 6830 退到约 6660（≈ 2/3 万 = 6667），分子同步减：\n8120 → 8000（跟着一起减一点，减到 800）\n8000 / 6660 ≈ 8000 × (3/2) / 10000 = 1.2（万平方米/场）\n→ 12000 平方米/场\n\n（板书另记：812/683 上下同加 → 830/700 ≈ 1.186 → 即 11857 平方米/场，\n 再补上 0.6% ：11857 × 1.006 ≈ 11930 ≈ 12000）\n```\n\n```\n【调法③：把 (1+0.6%) 挪到分母上（×分子 = ÷分母，效果一样）】\n8120 / 6830 ÷ (1 − 0.6%) 形式书写\n板书：8120 / 6830 ÷ (1+0.6%) 与 8120/(6830×(1−0.6%)) 等价\n```\n\n> \"你这个分子上去补百分之零点六，跟你分母上去退百分之零点六，对整个结果来说是一样的。为什么有时要这么做呢？因为有的时候可能有一个分母给它调低一点……也能正好凑到一个比较整的数。\"\n\n另外老师还演示了\"**先算再补**\"：\n\n```\n8120 / 6830 先算 ≈ 1.19 万（先把它算出来）\n再补 0.6% ：约 1.2 万 → 12000\n```\n\n**【选项原文】**\n\n> A.11000　B.12000　C.13000　D.14000\n\n**【答案】** ✅ **B（12000）**\n\n**【解析】**\n\n- 现期比 `8120 ÷ 6830 = 1.1889`（万平方米/场）= **11889 平方米/场**；\n- 面积增速 8.5% 低于场数增速 9.2%，补 0.6% 后 `11889 × 1.006 ≈ 11961 ≈ 1.2 万` → **12000 平方米/场，选 B**。\n- 陷阱类型：**单位陷阱**（万平方米 ÷ 场 = 万平方米/场，必须 ×10000 才是平方米）；**时间陷阱**（问的是 2010 年基期，不是 2011 年现期）。\n- 老师提醒：本题三个数（812 / 683 / 0.6%）之间\"**哪里能凑出你想要的整数就调哪里**\"，11000 与 13000 都离得太远，无需纠结第二种调法的误差。\n\n---\n\n### 第2题｜2023年信息技术服务：基期比值（云服务 ÷ 集成电路设计）\n\n**【题干原文】**（画面逐字，f_0048）\n\n> 2.2023年信息技术服务收入81226亿元，同比增长14.7%，其中云服务、大数据服务共实现收入12470亿元，同比增长15.4%；集成电路设计收入3069亿元，同比增长6.4%；电子商务平台技术服务收入11789亿元，同比增长9.6%。\n>\n> 2022年，云服务、大数据服务共实现收入是集成电路设计收入的：\n>\n> A.不到3倍　B.3~3.5倍　C.3.5~4倍　D.4倍以上\n\n**【材料数据】**\n\n| 指标 | 2023 年（现期） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 信息技术服务收入 | 81226 亿元 | +14.7% | 总量（本题不用） |\n| 云服务、大数据服务收入 | 12470 亿元 | +15.4% | **分子**（增速高） |\n| 集成电路设计收入 | 3069 亿元 | +6.4% | **分母**（增速低 → 给它补） |\n| 电子商务平台技术服务收入 | 11789 亿元 | +9.6% | 干扰项（本题不用） |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"A 是 B 的多少倍\" = **倍数（比值）**；问 **2022 年 = 基期** → **基期比** |\n| 定位数据 | `12470（+15.4%）` ÷ `3069（+6.4%）` |\n| 写现期比 | 位数太多 → 直接写 `1247 / 3069`，再约成 `125 / 30.7`（板书：`125/307`） |\n| 算增速差 | `15.4% − 6.4% = 9%` |\n| 补给谁 | **给增速低的集成电路设计（分母）补，约 9 个点** |\n| 速算 | 分母 307 补 9% → 约 333（≈ 335）；`1247 / 333 ≈ 3.74`，按 1/3 处理 → `125 × 3/100 = 3.75` |\n| 结论 | 约 **3.75 倍** → 落在 3.5~4 倍区间 |\n\n**【速算演示】**\n\n```\n现期比 = 12470 / 3069 ≈ 1247 / 307\n\n分母（集成电路设计，增速低）补 9%：\n1247 / (307 × 1.09) ≈ 1247 / 334.6 ≈ 3.73\n\n板书凑整写法：\n125 / 30.7  →  分母 +9%  →  125 / 33.3\n125 ÷ 33.3 = 125 ÷ (100/3) = 125 × 3 / 100 = 3.75\n```\n\n老师原话：\n\n> \"他的基期比的关系是 1247 除以 3069。这个位数太多了，写的时候可以直接写个一二五除以三零七吧。\"\n\n> \"永远是拿增速高的减增速低的，去除以一加增速低的，大概就是九个点不到，你需要给下面这个补九个点不到。或者给上面那个退 9 个点，或者你算完之后再退 9 个点。\"\n\n> \"为什么给分母上去补？因为你给这 307 补 9 个点，正好基本上能到百（分）的位置 33 左右。\"\n\n> \"那分量出三三等于除以三分之一，就等于整体乘以三，变成三七五，所以选择 C 选项三点七五倍。\"\n\n**【选项原文】**\n\n> A.不到3倍　B.3~3.5倍　C.3.5~4倍　D.4倍以上\n\n**【答案】** ✅ **C（3.5~4 倍）**\n\n**【解析】**\n\n- 现期比 `12470 ÷ 3069 = 4.063`；分子增速高（15.4%）、分母增速低（6.4%）→ 基期比必然**低于**现期比；\n- 精确值：`4.063 × (1+6.4%)/(1+15.4%) = 4.063 × 0.922 ≈ 3.746` → 3.75 倍；\n- **不选 D**：4 倍以上是\"现期比\"的量级，直接用现期比就会掉进 **时间陷阱**（题目问 2022 年）；**不选 A、B**：3.75 明显高于 3.5。\n- 陷阱类型：**时间陷阱**（2023 → 2022）+ **概念陷阱**（倍数也要\"补增速差\"）。\n\n---\n\n### 第3题｜2014年房地产业：基期比值（土地购置单价）\n\n**【题干原文】**（画面逐字，f_0059 / f_0064）\n\n> 3.2014年1~2月份，我国房地产业土地购置面积4062万平方米，同比增长6.5%，土地成交价款1000亿元，同比增长8.9%。\n>\n> 2013年1~2月，我国房地产业土地购置单价约为每平方米多少元？\n>\n> A.2300　B.2400　C.2500　D.2600\n\n**【材料数据】**\n\n| 指标 | 2014 年 1~2 月（现期） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 土地购置面积 | 4062 万平方米 | +6.5% | **分母**（增速低 → 给它补） |\n| 土地成交价款 | 1000 亿元 | +8.9% | **分子**（增速高） |\n| 所求 | 2013 年 1~2 月土地购置单价 | — | = 成交价款 ÷ 购置面积 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"单价 = 价款 ÷ 面积\"是比值；问 2013 年 = **基期比** |\n| 定位数据 | `1000 亿元（+8.9%）`、`4062 万平方米（+6.5%）` |\n| 增速差 | `8.9% − 6.5% = 2.4%`，再 ÷ (1+6.5%) → **约 2.3 个点** |\n| 补给谁 | 面积增速低（分母）→ **给分母补 2.3%** |\n| 列式 | `基期单价 = 1000 ÷ (4062 × (1+2.3%))`（画面板书） |\n| 结论 | ≈ **2400 元/平方米** |\n\n**【速算演示（两种）】**\n\n```\n【调法①：先补分母，再放缩】\n1000 / (4062 × 1.023) ≈ 1000 / 4155  → 板书按 4160\n分母放缩：4160 − 160 = 4000（约 −3.8%）\n分子同步：1000 − 40 = 960（约 −4%）\n960 / 4000 = 0.24（亿元/万平方米）= 2400 元/平方米\n（板书：1000/4160 = 984/400 → 2400）\n```\n\n```\n【调法②：先把分母当 4000，最后一次性补 3.8%】\n1000 / 4000 = 1/4 → 即 2500 元/平方米（每万平方米 0.25 亿元）\n缺的 62 是多少？62 是 4062 的 1.5%\n于是总共要补：2.3% + 1.5% ≈ 3.8%\n2500 ÷ (1 + 3.8%) ≈ 2500 / 1.038 ≈ 2408 ≈ 2400\n```\n\n老师原话（第 3 题最关键的\"微调\"原则）：\n\n> \"或者我就觉得这个一千（除以）四千这样的算是不是也很好算，也比较整。那我可以先把它想成一千除以四千，可是我的分母上不是四千，是四千零六十二，你不光没给我补，还给我退了，那怎么办？我把缺的这个 62，也就是 62 是多少？62 是 4062 的 1.5%。一起补我给你补百分之三点八。\"\n\n> **\"这种微调的时候是百分之一百分之二，不用太在意它之间是否需要什么沉积造率（复合增长率），就给它合起来大概差不多就行了。你给它补一个点，再补一个点，其实跟补两个点是没多大差距的。\"**\n\n> \"2500 除以 1+3.8%，这样就能很快的看出来是必（B）选项 2400 了，哎，不可能到 2300 的。2300 到 2500 之间，将近 10 个点了，这 3.8 个点远远没有那么远。\"\n\n**【选项原文】**\n\n> A.2300　B.2400　C.2500　D.2600\n\n**【答案】** ✅ **B（2400）**\n\n**【解析】**\n\n- 现期单价 `1000 亿元 ÷ 4062 万平方米 = 0.2462 亿元/万平方米 = 2462 元/平方米`；\n- 面积增速（6.5%）低于价款增速（8.9%）→ 基期单价要**往下退 2.3%**：`2462 ÷ 1.023 ≈ 2407 ≈ 2400`；\n- 陷阱类型：**单位陷阱**（亿元 ÷ 万平方米 → 元/平方米，中间差 10000 倍量纲）＋**时间陷阱**（问 2013 年）；\n- 老师特别提醒：2.3% 这种小比例可以直接用 `1.065` 近似除（`2.4 ÷ 1.065 ≈ 2.3`），不用追求复合精确。\n\n---\n\n### 第4题｜2021年工业企业利润：基期比较大小（谁最低）\n\n**【题干原文】**（画面逐字，f_0076）\n\n> 4.2021年，我国规模以上工业企业利润87092亿元，比上年增长34.3%。分经济类型看，国有控股企业利润22770亿元，比上年增长56.0%；股份制企业62702亿元，增长40.2%；外商及港澳台商投资企业22846亿元，增长21.1%；私营企业29150亿元，增长27.6%。\n>\n> 2020年，分经济类型看，我国企业利润最低的企业类型为（　）。\n>\n> A.国有控股企业\n> B.股份制企业\n> C.外商及港澳台商投资企业\n> D.私营企业\n\n**【材料数据】**\n\n| 企业类型 | 2021 年利润（现期） | 同比增速 | 2020 年基期（核算值） |\n| --- | --- | --- | --- |\n| **A. 国有控股企业** | **22770 亿元** | **+56.0%（最高）** | 22770 ÷ 1.56 ≈ **14596（最小）** |\n| B. 股份制企业 | 62702 亿元 | +40.2% | 62702 ÷ 1.402 ≈ 44723（最大） |\n| C. 外商及港澳台商投资企业 | 22846 亿元 | +21.1% | 22846 ÷ 1.211 ≈ 18865 |\n| D. 私营企业 | 29150 亿元 | +27.6% | 29150 ÷ 1.276 ≈ 22845 |\n| （总量） | 87092 亿元 | 比上年增长 34.3% | 本题不用 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 问 **2020 年**（基期）谁利润最低 → **基期比较大小** |\n| 核心式子 | `基期 = 现期 ÷ (1 + 增速)` |\n| 排除逻辑 | 国有控股：**分子最小（22770）＋分母最大（1+56.0%）** → 基期必然最小 |\n| 对照 | 其余三家现期都比它大（22846 / 29150 / 62702），增速又都比它小 → 基期都比它大 |\n| 结论 | **国有控股企业利润最低** |\n\n**【速算演示（画面板书\"现期 / 基期\"对照）】**\n\n```\n国有控股：现期 22770（最小） 增速 56.0%（最大）  → 大 / 大 → 基期最小\n股份制  ：现期 62702（最大） 增速 40.2%         → 基期最大\n外商    ：现期 22846（最小档）增速 21.1%（最小）\n私营    ：现期 29150         增速 27.6%\n```\n\n老师原话：\n\n> \"因为基期要等于限期除以（1+增速），所以如果你的限期小，增速还大，那你的就是分子又小，分母又大，它除下来肯定小。\"\n\n> \"而在题目里面，正好 A 选项的两万二，它的分子是最小的（现期最小），其他人两万两千八、两万九、六万二都比他大。然后它的增速还最不争气，它的增速还特别大，分母又最大、分子最小。所以国有控股企业它的基期就是最小的，所以选择 A 选项。\"\n\n**老师顺势追问：那如果问基期\"最高\"的呢？**\n\n> \"那如果要找基期最高的是哪一个呢？……还是拉平增长率，让其他这些增速比较低的（来追）。增速高的肯定不用看了，因为这种增（速）本来限期就没它大，增速还比他高的机器（基期）肯定比它小，不用看。\"\n\n```\n找基期最大：现期最大的是股份制 62000（增速 40.2%，最高）\n其余三家增速更低（21.1% / 27.6%）：给它们的现期补上增速差（十几到二十个点）\n从 22000 到 29000，也不可能追上这个 62000\n→ 股份制的基期就是最大的\n```\n\n**【选项原文】**\n\n> A.国有控股企业\n> B.股份制企业\n> C.外商及港澳台商投资企业\n> D.私营企业\n\n**【答案】** ✅ **A（国有控股企业）**\n\n**【解析】**\n\n- 国有控股基期 ≈ 14596 亿元，是四者中最小的（外商 ≈ 18865、私营 ≈ 22845、股份制 ≈ 44723）；\n- **陷阱类型：时间陷阱**（问 2020 年，材料是 2021 年）；**最大的坑是\"现期最大 ↔ 基期最大\"不成立**——外商与私营现期接近国有控股，但增速更低，所以它们的基期反而更大；\n- 老师强调：\"**分子最小 + 分母最大 → 必然最小**\"这一条是**基期比较的秒杀结论**，看到\"现期最小且增速最高\"即可直接锁定\"基期最小\"。\n\n---\n\n### 第5题｜2019年通勤高峰拥堵：基期比较大小（谁最拥堵）\n\n**【题干原文】**（画面逐字，f_0092 / f_0093）\n\n> （表）2020年一线城市和新一线城市交通状况\n>\n> | 城市 | 2020年度排名 | 通勤高峰交通拥堵指数 | 拥堵指数同比2019年(%) | 通勤高峰实际速度(km/h) | 地面公交线路网密度(km/km²) | 地铁线路网密度(km/km²) |\n> | --- | --- | --- | --- | --- | --- | --- |\n> | 北京 | 3 | 2.063 | 1.15 | 26.91 | 4.541 | 1.033 |\n> | 上海 | 5 | 1.932 | 11.08 | 24.94 | 4.672 | 1.387 |\n> | 广州 | 6 | 1.887 | 8.24 | 29.84 | 3.855 | 0.727 |\n> | 深圳 | 21 | 1.673 | 4.61 | 33.93 | 4.864 | 0.840 |\n> | 成都 | 11 | 1.763 | 9.52 | 32.72 | 4.678 | 0.977 |\n> | 杭州 | 13 | 1.756 | 7.91 | 27.25 | 5.14 | 0.856 |\n> | 重庆 | 1 | 2.260 | 4.40 | 24.06 | 4.372 | 1.016 |\n> | 武汉 | 17 | 1.707 | -0.51 | 30.12 | 3.311 | 0.872 |\n> | 西安 | 4 | 1.987 | 14.83 | 26.41 | 3.999 | 0.618 |\n> | 苏州 | 39 | 1.556 | 4.95 | 37.36 | 4.022 | 0.644 |\n> | 天津 | 24 | 1.659 | 2.96 | 30.87 | 4.479 | 0.667 |\n> | 南京 | 9 | 1.822 | 6.54 | 27.11 | 3.707 | 0.680 |\n> | 长沙 | 14 | 1.720 | 1.92 | 30.07 | 3.953 | 0.630 |\n> | 郑州 | 45 | 1.526 | -3.44 | 34.04 | 4.106 | 0.753 |\n> | 东莞 | 29 | 1.605 | 1.06 | 34.51 | 3.104 | 0.075 |\n> | 青岛 | 8 | 1.838 | 16.74 | 27.03 | 3.749 | 0.440 |\n> | 沈阳 | 23 | 1.665 | -0.76 | 27.09 | 3.997 | 0.606 |\n> | 佛山 | 19 | 1.681 | -0.90 | 31.87 | 5.029 | 0.236 |\n> | 合肥 | 20 | 1.678 | -1.96 | 29.18 | 3.029 | 0.480 |\n>\n> 5.2019年，通勤高峰最拥堵的城市是：\n>\n> A.北京　B.上海　C.重庆　D.南京\n\n**【材料数据】**（本题只用\"拥堵指数\"与\"同比增速\"两列）\n\n| 城市 | 2020 年拥堵指数（现期） | 同比 2019 年增速 | 2019 年基期（核算值） |\n| --- | --- | --- | --- |\n| 北京 | 2.063 | **+1.15%（最低）** | 2.063 ÷ 1.0115 ≈ 2.0395 |\n| 上海 | 1.932 | +11.08% | 1.932 ÷ 1.1108 ≈ 1.7393（排除） |\n| 重庆 | **2.260（最高）** | +4.40% | 2.260 ÷ 1.044 ≈ 2.1648（最大） |\n| 南京 | 1.822 | +6.54% | 1.822 ÷ 1.0654 ≈ 1.7101（排除） |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"哪个城市最拥堵\"→ 指数越高越堵；问 **2019 年 = 基期** → **基期比较大小** |\n| 排除逻辑 | 上海（1.932）、南京（1.822）**现期就比重庆小，增速还比重庆高** → 分子小、分母大 → 基期必更小，直接排除 |\n| 只剩 | 北京 vs 重庆：北京现期 2.063、增速最低 1.15% → 需要\"拉平\"看能否追上重庆 |\n| 补的比例 | `(4.40% − 1.15%) ÷ (1 + 1.15%) ≈ 3.25% ÷ 1.0115 ≈ 3.2 个点` |\n| 判定 | `2.063 × 1.032 ≈ 2.129 ＜ 2.260`，**追不上** |\n| 结论 | 2019 年最拥堵的是**重庆** |\n\n**【速算演示】**\n\n```\n北京补 3 个点：\n2.063 ≈ 2.06\n2 的 3 个点 = 0.06\n2.06 + 0.06 ≈ 2.12\n距离重庆的 2.26 差得远 → 追不上\n```\n\n老师原话：\n\n> \"他就是拿拥堵指数来形容这个城市它是否拥堵，拥堵指数越高就越堵。那像北京就堵的要死。\"\n\n> \"那一般题目它不会那么简单给你一个增量的，我们找到它对应的增速，跟一九年同期相比，跟一九年相比，同比增长了这么多。\"\n\n> \"那像上海南京这种肯定就不用看了，因为他们限期就比重庆小，增速还比重庆高，他的基期肯定小，你给他补都没得补，你还给他退（更小）。\"\n\n> \"你从 2.06 想要追到 2.26，将近要补 10 个点才够。这三个点才哪到哪儿？2 的三个点是 0.06，才能补成 2.12，距离 2.26 差得远呢，所以追不上。所以重庆它就是基期最大的。\"\n\n**【选项原文】**\n\n> A.北京　B.上海　C.重庆　D.南京\n\n**【答案】** ✅ **C（重庆）**\n\n**【解析】**\n\n- 画面板书：重庆的\"2.260\"与\"4.40\"双双圈出（现期最高）；上海\"11.08\"、南京\"6.54\"圈出并划掉（增速更高 → 直接排除）；北京\"2.063 / 1.15\"标记为唯一挑战者；\n- 重庆基期 2.1648 ＞ 北京基期 2.1297（补 3.2 个点后）→ **C**；\n- 陷阱类型：**时间陷阱**（问 2019 年）；**概念陷阱**（\"2020 年度排名第 1\"≠\"2019 年最堵\"，也要看增速做修正）；\n- 老师顺带提醒：重庆增速 4.40% 不算最低，但**现期最高**；北京增速最低但**现期差了 0.2**，补 3 个点补不回来。\n\n---\n\n### 第6题｜一线城市拥堵排序：基期比较大小（由重到轻）\n\n**【题干原文】**（画面逐字，f_0107 / f_0110 / f_0113，表格同上题）\n\n> 6.比较一线城市（北京、上海、广州、深圳），2019年通勤高峰交通拥堵程度由重到轻依次是：\n>\n> A.北京、上海、广州、深圳\n> B.上海、北京、深圳、广州\n> C.深圳、北京、上海、广州\n> D.北京、广州、上海、深圳\n\n**【材料数据】**\n\n| 城市 | 2020 年拥堵指数（现期） | 同比 2019 年增速 | 2019 年基期（核算值） | 排序 |\n| --- | --- | --- | --- | --- |\n| 北京 | **2.063（最高）** | **+1.15%（最低）** | 2.063 ÷ 1.0115 ≈ **2.0395** | 第 1 |\n| 上海 | 1.932 | +11.08%（最高） | 1.932 ÷ 1.1108 ≈ 1.7393 | 第 3 |\n| 广州 | 1.887 | +8.24% | 1.887 ÷ 1.0824 ≈ 1.7434 | 第 2 |\n| 深圳 | 1.673（最低） | +4.61% | 1.673 ÷ 1.0461 ≈ 1.5993 | 第 4 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 第一步 | 北京：**现期最高 + 增速最低** → 基期必然最高，直接定第 1 名 |\n| 第二步 | 用选项排除：B、C 的第一位都不是北京 → **直接排除**，只剩 A、D |\n| 第三步 | A 与 D 的第 2、第 3 位都相同（上海 / 广州），差别只在**上海与广州谁第 2** |\n| 第四步 | 广州增速低（8.24%）→ **给广州补**：`(11.08% − 8.24%) ÷ 1.0824 = 2.84% ÷ 1.0824 ≈ 2.6%` |\n| 第五步 | `1.887 × 1.026 ≈ 1.936 ＞ 1.932` → **广州基期 ＞ 上海基期** |\n| 结论 | 由重到轻：**北京、广州、上海、深圳** → D |\n\n**【速算演示（画面板书逐字）】**\n\n```\n11.08 − 8.24 = 2.84\n2.84 / 1.08 ≈ 2.6%          （化除为乘：≈ 2.84 × (1 − 8%) ≈ 2.61）\n\n给广州 1.887 补 2.6%：\n1.887 + 2.6%\n两倍法：2 × 2.5% = 0.05\n1.887 + 0.05 = 1.937 ＞ 1.932\n→ 广州的基期比上海的基期要大\n```\n\n老师原话（含\"精算\"与\"反向验证\"两个版本）：\n\n> \"那然后我们再比较 a、d 的区别在哪，当选项只剩下两个的时候呢，你就主要比较它们的区别。\"\n\n> \"上海和广州的话比较基期大小，就还是给增速低的那个去补上平均增长率，看能不能够追上增速高的那一个。\"\n\n> \"你要注意到这个地方的差距挺小的，它们的增速差觉得挺小的，增速差大概就两个多点……所以这个地方我们就要稍微精算一点，要防止那个误差对我们有影响。\"\n\n> \"然后这个时候你要是不放心，有时候硬算一下。硬算一下也是可以的，或者胆子大一点，就是像我姐写的那样，乘法放缩，把它写成二乘以补了个东西，就是二乘以百分之二点五，大概补个 0.05 左右，会变成 1.937，会比 1.932 高。\"\n\n**老师给的\"反向验证\"（怕自己补大了）：**\n\n```\n要看 1.932 到 1.887 差多少，验证需不需要补 2.6 个点：\n两者差距 = 1.932 − 1.887 = 0.045\n0.045 对 1.887 而言：\n1.887 → 189（凑整），分子 0.045 → 上下各加约 30 → 480 / 200\n这样算下来也只要补 2.4 个百分点\n→ 充其量最多补 2.4 个点就能追上\n而我现在要补的是 2.6 个点 → 自然稍微大一点 → 选 D\n```\n\n> \"这个题目难度系数非常高，基本上考场上是很难做出来的，正常做法很难做出来的，因为你们可以发现这个东西精度要求太高了。\"\n\n> \"**因为我们拉平增长率，它主要讨论的是一个百分之二点六，是对于这个一点八八七而言，是一个比较小的数，计算的是这个零点零五，那就算有误差，它的误差也非常小。但如果你是真的去算基期，你的计算对象就是一个一点八八，就是这种一点几，对于这种零点零五而言，倍数是大了很多倍的。如果你算的有那么一点点误差，就很容易错了。**\"\n\n**【选项原文】**\n\n> A.北京、上海、广州、深圳\n> B.上海、北京、深圳、广州\n> C.深圳、北京、上海、广州\n> D.北京、广州、上海、深圳\n\n**【答案】** ✅ **D（北京、广州、上海、深圳）**\n\n**【解析】**\n\n- 北京第 1（2.0395）、广州第 2（1.7434）、上海第 3（1.7393）、深圳第 4（1.5993）；\n- 画面板书先划掉 **B.上海、北京、深圳、广州**（第一位不是北京）与 **C.深圳、北京、上海、广州**（第一位不是北京）；\n- 陷阱类型：**概念陷阱**（\"现期排序\"≠\"基期排序\"，本题广州与上海会**换位**）＋**精度陷阱**（0.05 的差距，必须精算或严格放缩）；\n- 老师总结：这是本套作业里\"**精度要求最高**\"的一道，考场上正常算基期基本做不出来，必须靠拉平增长率把大除法换成小乘法。\n\n---\n\n### 第7题｜2019年一季度社零：基期比较大小（谁最高）\n\n**【题干原文】**（画面逐字，f_0142 / f_0146 / f_0148）\n\n> （表）2019年一季度社会消费品零售总额主要数据\n>\n> | 指标 | 3 月 绝对量（亿元） | 3 月 同比增长（%） | 1-3 月 绝对量（亿元） | 1-3 月 同比增长（%） |\n> | --- | --- | --- | --- | --- |\n> | 社会消费品零售总额 | 31726 | 8.7 | 97790 | 8.3 |\n> | 　其中：限额以上单位消费品零售额 | 11953 | 5.1 | 35078 | 4.1 |\n> | 　　其中：实物商品网上零售额 | - | - | 17772 | 21.0 |\n> | 按经营地分 | | | | |\n> | 　城镇 | 27192 | 8.5 | 83402 | 8.2 |\n> | 　乡村 | 4534 | 9.4 | 14388 | 9.2 |\n> | 按消费类型分 | | | | |\n> | 　餐饮收入 | 3393 | 9.5 | 10644 | 9.6 |\n> | 　其中：限额以上单位餐饮收入 | 726 | 7.5 | 2226 | 7.9 |\n> | 　商品零售 | 28333 | 8.6 | 87146 | 8.2 |\n> | 　其中：限额以上单位商品零售额 | 11227 | 5.0 | 32852 | 3.8 |\n> | 　　粮油、食品类 | 1081 | 11.8 | 3628 | 10.6 |\n> | 　　烟酒类 | 287 | 9.5 | 1061 | 5.9 |\n> | 　　金银珠宝类 | 218 | -1.2 | 725 | 2.6 |\n> | 　　日用品类 | 471 | 16.6 | 1410 | 16.1 |\n> | 　　中西药品类 | 502 | 11.8 | 1440 | 10.8 |\n> | 　　文化办公用品类 | 249 | -4.0 | 692 | 3.8 |\n> | 　　通讯器材类 | 365 | 13.8 | 1093 | 10.0 |\n>\n> 注：1. 此表速度均为未扣除价格因素的名义增速；\n> 　　2. 此表部分数据因四舍五入的原因，存在总计与分项合计不等的情况。\n>\n> 7.2018年1-3月，限额以上单位烟酒类、日用品类、中西药品类及通讯器材类零售总额最高的是：\n>\n> A.烟酒类　B.日用品类　C.中西药品类　D.通讯器材类\n\n**【材料数据】**（只取 1-3 月两列）\n\n| 选项 | 1-3 月绝对量（亿元） | 1-3 月同比增速（%） | 2018 年 1-3 月基期（核算值） |\n| --- | --- | --- | --- |\n| A. 烟酒类 | 1061 | 5.9 | 1061 ÷ 1.059 ≈ 1002 |\n| B. 日用品类 | 1410 | 16.1（最高） | 1410 ÷ 1.161 ≈ 1214 |\n| C. **中西药品类** | **1440（最高）** | 10.8 | 1440 ÷ 1.108 ≈ **1300（最大）** |\n| D. 通讯器材类 | 1093 | 10.0 | 1093 ÷ 1.10 ≈ 993 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 问 **2018 年 1-3 月**（基期）\"哪一个最高\" → **基期比较大小** |\n| 先圈数据 | 把四个选项的 **1-3 月**绝对量与增速圈出来（画面用红笔圈出） |\n| 排除一 | 日用品类：现期 1410 **增速 16.1% 明显更高** → 基期只会更小，**不用看** |\n| 排除二 | 现期最高的是中西药品 1440 → 让另外两个\"增速更低\"的候选来追 |\n| 补法① | 烟酒类 1061，增速 5.9%，与 10.8% 差 **4.9 ≈ 5 个点** → 补 5% 不到：1061 × 1.05 ≈ 1114 ＜ 1440 |\n| 补法② | 通讯器材类 1093，增速 10.0%，与 10.8% 差 **0.8 个点** → 只补 0.8%：1093 × 1.008 ≈ 1102 ＜ 1440 |\n| 结论 | **中西药品类**零售总额最高 |\n\n**【速算演示】**\n\n```\n现期最高 = 中西药品 1440\n烟酒类 1061 → 补 (10.8 − 5.9) = 4.9% ≈ 5% 不到 → 约 1114\n通讯器材 1093 → 补 (10.8 − 10.0) = 0.8% → 约 1102\n两个都远低于 1440 → 追不上\n```\n\n老师原话：\n\n> \"第七题是比较基期，他们这四个谁最高？把对应的 1-3 月份的限期（现期）、增速给他们圈出来。\"\n\n> \"最高的那里就看这个：现期最高的，其他比它增速低的，有没有哪一个能赶得上它？那日用品就肯定不看了，你给他都没得补，它增速高了。\"\n\n> \"你们这 1061、1093 想要追上 1440，你起码好歹说你要补个几十个点吧，你二三十个点得要的吧，你们这（增速）差才几个点啊，所以肯定补不上的。\"\n\n> \"你给这个 1093 只能给他补 0.8%，给上面这个 1061，只能给他补 5% 不到。补的太少了，所以就是 1440 这个中西药品类基期最高。\"\n\n**【选项原文】**\n\n> A.烟酒类　B.日用品类　C.中西药品类　D.通讯器材类\n\n**【答案】** ✅ **C（中西药品类）**\n\n**【解析】**\n\n- 画面板书：日用品类 1410 与 16.1 被划掉（增速更高、追不上）；中西药品 1440 圈出；通讯器材 1093 圈出并标注补 0.8%；\n- 中西药品类基期 ≈ 1300 亿元，为四者最大（日用品 ≈ 1214、烟酒 ≈ 1002、通讯器材 ≈ 993）；\n- 陷阱类型：**时间陷阱**（问 2018 年 1-3 月，不是 2019 年）＋**范围陷阱**（表里 3 月与 1-3 月两组数据，必须取 **1-3 月**那一组，因为题干问的就是 1-3 月）。\n\n---\n\n### 第8题｜2022年服务业增加值：增量比较大小（谁最多）\n\n**【题干原文】**（画面逐字，f_0150 / f_0152 / f_0176 / f_0181）\n\n> 8.2022年全年全国批发和零售业增加值114518亿元，同比增长0.9%；交通运输、仓储和邮政业增加值49674亿元，同比下降0.8%；住宿和餐饮业增加值17855亿元，同比下降2.3%；金融业增加值96811亿元，同比增长5.6%；房地产业增加值73821亿元，同比下降5.1%；信息传输、软件和信息技术服务业增加值47934亿元，同比增长9.1%；租赁和商务服务业增加值39153亿元，同比增长3.4%。\n>\n> 2022年全年，全国下列服务业增加值中同比增量最多的是：\n>\n> A.批发和零售业\n> B.金融业\n> C.信息传输、软件和信息技术服务业\n> D.租赁和商务服务业\n\n**【材料数据】**\n\n| 选项 | 2022 年增加值（现期） | 同比增速 | 同比增量（现期×r÷(1+r)） |\n| --- | --- | --- | --- |\n| A. 批发和零售业 | 114518 亿元 | +0.9% | ≈ 114518 × 0.0089 ≈ **1021** |\n| B. **金融业** | 96811 亿元 | +5.6% | ≈ 96811 × 0.053 ≈ **5133（最大）** |\n| C. 信息传输、软件和信息技术服务业 | 47934 亿元 | +9.1% | ≈ 47934 × 0.0834 ≈ 3998 |\n| D. 租赁和商务服务业 | 39153 亿元 | +3.4% | ≈ 39153 × 0.0329 ≈ 1288（最小） |\n| （干扰项）交通运输、仓储和邮政业 | 49674 亿元 | -0.8% | 增量为负 |\n| （干扰项）住宿和餐饮业 | 17855 亿元 | -2.3% | 增量为负 |\n| （干扰项）房地产业 | 73821 亿元 | -5.1% | 增量为负 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"同比增量最多\"→ **增量比较大小** |\n| 核心式子 | `增量 = 现期 × r ÷ (1 + r)`；`增量比 = 基期比 × 增速比` |\n| 秒杀一 | **大则大**：现期又大、增速又大 → 增量必然大 |\n| 秒杀二 | 租赁和商务服务：现期（39153）比金融业（96811）小，增速（3.4%）也比金融业（5.6%）小 → 小小 → **直接排除** |\n| 批发零售 vs 金融业 | 现期 11 万 vs 9 万 6 → **只多约 1.2 倍**；增速 0.9% vs 5.6% → **差了约 6 倍** → 批发零售增量远小于金融业 |\n| 信息传输 vs 金融业 | 增速比：9.1 ÷ 5.6 ≈ **1.5~1.7 倍**；现期比：96811 ÷ 47934 ≈ **2 倍多一点** → 金融业增量仍更大 |\n| 结论 | **金融业增量最大** |\n\n**【速算演示（画面板书）】**\n\n```\nΔ = 现期 × r / (1 + r)\n\nΔ₁/Δ₂ = (基期₁ / 基期₂) × (r₁ / r₂)\n        ↑ 基期比            ↑ 增速比\n\n大则大：现期 ↑ 且 r ↑  →  Δ ↑\n```\n\n老师原话：\n\n> \"增量等于基期乘以增速，所以比较增量，其实就是比较大家两者之间基期比和增速比之间的关系。因为增量一比上增量二等于基期比乘以增速比。\"\n\n> \"因为比如说像路程等于时间乘速度，我的时间用（是你）时间两倍，你的速度是我的三倍，那肯定你更走的更远嘛。\"\n\n> \"通过大（大则大），我们可以先把这个租赁和商务服务给它排掉，因为它的限期比金融业的限期小，增速 3.4 又小，那就是小小的小。\"\n\n> \"你们发现虽然你这个批发零售业它的限期大一点，但是大的非常有限，11 万只比 9 万 6 高那么一点点，我充其量算了一个 1.2 倍。可是在增速上，5.6 却是 0.9 的 7 倍了、6 倍了……那差距太明显了，所以这个批发和零售业，它的增量一定很小。\"\n\n> \"虽然这个信息传输的增速高，但高的也不多，从 5.6 到 9.1，只需要给它加上 3.5。5.6 的一半是 2.8，3.5 就比 2.8 稍微高那么一点点吧，所以增速比大概也不过就是 1.5 倍多一点、1.6 倍 1.7 的样子，而限期已经达到了两倍多一点。所以虽然金融业的增速稍微低了那么一点点，但是金融业它的限期够大，所以它的增量也会比信息传输的要高。\"\n\n**关于\"到底要不要给谁补\"：**\n\n> \"很多同学担心老师，你不用看那个什么现期比跟基期比的差距了吗？这个题目不用看。为什么不用看呢？因为你会发现里面比较的倍数的时候，他们的倍数差距是很大的。比如说这里的一点二跟六，比如说这边的二点几（二出头）跟这个一点五出头，他们差的比例是挺大的，而他们的增速差距我不用管……你不管是给谁补，对于这个结果来说，都是于事无补的。\"\n\n> \"**所以选择 B 选项，差距太明显，补的又太小，杯水车薪。就好像皮肤汗术（杯水车薪）一样。**\"\n\n**【选项原文】**\n\n> A.批发和零售业\n> B.金融业\n> C.信息传输、软件和信息技术服务业\n> D.租赁和商务服务业\n\n**【答案】** ✅ **B（金融业）**\n\n**【解析】**\n\n- 增量：金融业 ≈ 5133 ＞ 信息传输 ≈ 3998 ＞ 租赁商服 ≈ 1288 ＞ 批发零售 ≈ 1021（画面板书：从左到右依次划掉批发零售、信息传输、租赁商服三个选项）；\n- **陷阱类型：概念陷阱**——\"增速最快\"是 C（信息传输 9.1%），但题干问的是\"**增量最多**\"，两者不同；\n- **陷阱类型：时间/基数联动陷阱**——只比增速会选 C，只比现期会选 A，必须\"现期 × 增速\"一起看；\n- 老师强调：当**倍数差距明显、增速差距又很小**时，不必纠结\"给谁补\"，**谁倍数占优谁就赢**。\n\n---\n\n### 第9题｜2017年上半年S市手机出口：基期比值（含负增速）\n\n**【题干原文】**（画面逐字，f_0208 / f_0210）\n\n> 9.2017年上半年，S市以一般贸易方式出口手机1.8亿台，减少22.1%；以加工贸易方式出口699.9万台，减少30.7%；以海关特殊监管方式出口手机245.2万台，减少36.6%。\n>\n> 2016年上半年，S市以加工贸易方式出口手机数量约是以海关特殊监管方式出口的（　）倍。\n>\n> A.2.1　B.2.6　C.2.9　D.3.5\n\n**【材料数据】**\n\n| 出口方式 | 2017 上半年（现期） | 同比增速 | 角色 |\n| --- | --- | --- | --- |\n| 一般贸易方式 | 1.8 亿台 | -22.1% | 干扰项 |\n| **加工贸易方式** | **699.9 万台（≈700）** | **-30.7%** | **分子**（增速较高） |\n| **海关特殊监管方式** | **245.2 万台（≈245）** | **-36.6%（最低）** | **分母**（增速低 → 给它补） |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"A 约是 B 的多少倍\"，问 **2016 年上半年 = 基期** → **基期比（基期倍数）** |\n| 写现期比 | `700 ÷ 245`（699.9 / 245.2 直接约成 700 / 245） |\n| 谁低给谁补 | **给增速低的补**：−36.6% ＜ −30.7% → 分子是海关特殊监管方式（分母）→ 补在分母上 |\n| 关键坑 | 增速差不能直接 6 个点，**必须再除以 (1 + r低)** |\n| 补的比例 | `(−30.7% − (−36.6%)) ÷ (1 − 36.6%) = 5.9% ÷ 0.634 ≈ 9.3% ≈ 10% 不到` |\n| 速算 | 分母 245 补 10% → 约 270 → `700 ÷ 270 ≈ 2.6` |\n| 结论 | 约 **2.6 倍** |\n\n**【速算演示（画面板书三种写法）】**\n\n```\n① 6% / (1 − 36.6%) = 6% / 0.634 ≈ 10%\n   给 245 补 10% → 245 + 25 ≈ 270\n   700 / 270 = 2.6\n```\n\n```\n② 700 / 27 的错位法：\n   700 ÷ 27 ≈ 25.9（27 = 9 × 3：先借 9 的错位相减，再除以 3）\n   即约 2.59 → 2.6\n```\n\n```\n③ 先整了再补（老师最推荐）：\n   700 / 250 = 2.8（先算现期比，且 250 好算）\n   2.8 ÷ 1.1 ≈ 2.55 → 约 2.6\n```\n\n老师原话：\n\n> \"这个还是基期比问题，基期倍数、基期比。找到加工贸易方式出口的这么多，海关特殊监管方式出口的这么多，那就是基期比，还是拿现期比，然后去补。给谁补？**给增速低的补，注意是增速低，不是小，不是绝对值小，谁低谁补。**\"\n\n> \"那海关这个补多少？做差的话是六个点左右，但这个地方要注意，下面这个一加 r，你还是要考虑一下，最好考虑一下，还严谨一点。为什么要考虑？因为这个时候这个低的这个增速，它是个稍微还是比较大一点的负增速，那负增速在分母上的影响就会比较大，分母上会变成一个一减去百分之三十六点六，也就是差不多零点六三四。6% 除以 0.634，你看这个影响就大了吧？那你想把 6% 变成将近 16%（10%），除以 0.6 吧。\"\n\n> \"所以你要给这个 245 补 10% 不到，也就补个 24 左右，所以在 27（270）左右。27 分之 700……然后你可以直除，70 除以 27，二五十四，46，然后这边再来一个六左右，6 的话正好是 162，差不多，所以大概是 2.6 倍。\"\n\n> \"或者这个 7 除 27 呢，你能这么看，因为 27 它是 9 的倍数，可以把它想成 7 除以 3 乘以 9（700/9/3）。先除 9，除 9 等于错位相减，上面变成 777，再除以 3，差不多就是二六不到。所以选择 B 选项。\"\n\n> \"**所以一定要记好原则，原则就是先整了再说。这些什么其他的那些百分之几个点那种误差，想什么时候调就什么时候调。**\"\n\n**【选项原文】**\n\n> A.2.1　B.2.6　C.2.9　D.3.5\n\n**【答案】** ✅ **B（2.6）**\n\n**【解析】**\n\n- 现期比 `699.9 ÷ 245.2 = 2.854`；基期比 = `2.854 × 0.634 / 0.693 = 2.854 × 0.9149 ≈ 2.611` → 2.6；\n- **陷阱类型：概念陷阱（负增速）**——这是全集的\"头号坑\"：`r = −36.6%` 时，补的比例是 `5.9% ÷ 0.634 ≈ 9.3%`，而不是 5.9%；如果错算成补 6%，会得到 `2.854 / 1.06 ≈ 2.69`，仍能选 B，但方法错；\n- **陷阱类型：概念陷阱（谁低）**——是\"谁增速低给谁补\"，**不是\"谁绝对值小\"**；\n- 老师反复强调：负增速下 `(1 + r)` 变小到 0.634，\"影响就会比较大\"。\n\n---\n\n### 第10题｜2016年该市财政支出：增量倍数（教育 ÷ 医疗卫生）\n\n**【题干原文】**（画面逐字，f_0216 / f_0219 / f_0232）\n\n> （表）表 2　2016年该市本级主要预算支出项目完成情况\n>\n> | 支出项目 | 支出金额（亿元） | 同比增速(%) |\n> | --- | --- | --- |\n> | 一般公共服务 | 6.37 | 31.0 |\n> | 公共安全 | 4.77 | 37.3 |\n> | **教育** | **6.03** | **51.7** |\n> | 科学技术 | 1.11 | 181.0 |\n> | 文化体育与传媒 | 1.29 | 35.8 |\n> | 社会保障和就业 | 2.63 | 26.7 |\n> | **医疗卫生** | **2.28** | **14.4** |\n> | 节能环保 | 6.68 | 567.0 |\n> | 城乡社区事务 | 2.57 | 48.7 |\n> | 农林水事务 | 4.02 | 34.5 |\n> | 交通运输 | 2.58 | 10.8 |\n> | 资源勘探电力信息等事务 | 4.70 | 67.8 |\n>\n> 10.2016年该市教育支出同比增量约是医疗卫生的多少倍？\n>\n> A.4　B.7　C.10　D.14\n\n**【材料数据】**\n\n| 项目 | 2016 年支出额（现期） | 同比增速 | 2015 年基期 | 同比增量 |\n| --- | --- | --- | --- | --- |\n| 教育 | 6.03 亿元 | +51.7% | 6.03 ÷ 1.517 ≈ 3.975 | ≈ 6.03 × 0.517/1.517 ≈ **2.06** |\n| 医疗卫生 | 2.28 亿元 | +14.4% | 2.28 ÷ 1.144 ≈ 1.993 | ≈ 2.28 × 0.144/1.144 ≈ **0.287** |\n| 倍数 | — | — | 基期比 ≈ 1.995 | **增量比 ≈ 7.2** |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"教育增量是医疗卫生的多少倍\"→ **增量倍数（增量比）** |\n| 核心式子 | `增量比 = 基期比 × 增速比` |\n| 题目只给现期 | 于是先用 **现期比 × 增速比**，再**按增速差做一次修正** |\n| 现期比 | `6.03 ÷ 2.28 ≈ 2.7`（板书按 `6 / 2.28 = 2.7`） |\n| 增速比 | `51.7% ÷ 14.4% ≈ 3.5`（板书用分数法：50% ≈ 1/2、14.4% ≈ 1/7 → 3.5） |\n| 乘积 | `2.7 × 3.5 = 9.45 ≈ 9.5`（**这是\"现期量级\"，不是答案**） |\n| 修正 | 增速差 `51.7% − 14.4% = 37.3%`，再 ÷ 1.144 ≈ 32.6% ≈ **30 个点** → `÷1.3` |\n| 结论 | `9.5 ÷ 1.3 ≈ 7.3` → **约 7 倍** |\n\n**【速算演示（画面板书逐字）】**\n\n```\n6 / 2.28 ≈ 2.7              （现期比）\n50 / 143 ≈ 3.5              （增速比：51.7% ≈ 1/2，14.4% ≈ 1/7）\n2.7 × 3.5 = 9.5             （现期比 × 增速比）\n51.7 − 14.4 = 37.3          （增速差）\n37.3 / 1.144 ≈ 32.6% ≈ 30%  （修正幅度，看分母 1+r）\n9.5 / 1.3 ≈ 7.3  → 选 B（7）\n```\n\n**老师给出的第二种做法（分数法直接估增量）：**\n\n```\n教育：51.7% ≈ 1/2  →  增量 = 现期 / (n+1) = 6.03 / 3 ≈ 2.0\n医疗：14.4% ≈ 1/7  →  增量 = 现期 / (n+1) = 2.28 / 8 ≈ 0.285\n倍数：2.0 / 0.285 ≈ 7  →  B\n```\n\n老师原话：\n\n> \"增量的倍数呢？它是等于基期比乘以增速比的。但题目一般来说不会给我们机会，它只会给限期（现期），那怎么办？我们就还是先看现期比和增速比的一个情况，然后去灵活的对这个现期比进行调整，看在哪边要补那个差的平均增长率。\"\n\n> \"这（现期比）六（6.03）除二点二八，基本上能看得出来三倍不到，而且要想具体的算这个二二八，它的分母上也适合作为一个九分之二……那就是六除以九分之二等于先除二再乘九，三九二十七（2.7 倍），这个现期比给出的比较快。\"\n\n> \"然后再看增速比呢也是一样，这个 144 它就是 1/7，那放在分母上好算，50 除以 143，把 144 写成 143……3.5 倍，50/143 嘛，144 分之一除以 7 分之一等于乘以 7，那 2.7 乘以 3.5，2.7 先乘 3 等于 8.1，0.1 乘 0.5，再加 0.5，加个 1.35，大概在 9.5 倍左右。\"\n\n> **\"这个就是现期比乘增速比，那这个时候千万不要去选这个 C（10）。因为你要心中要有误差，这个地方我们要算的是增量比，是基期比成增速比，它不是现期比成增速比。\"**\n\n> \"而这两个基期比跟现期比之间……差了大概三十个点左右。51.7 减 14.4 是 37.3，然后还要让它再除以 1.144，因为再小一点，大概在 30 个点左右，所以还要再调整这个 5 条（量级）。30 个点不小，那要给谁补给？增速低的补，这个增速低的，它是在分母上的。所以你在分母上去再给它补一个一加百分之三十左右。那 9.5 除以 1.3，只能选择 B 选项 7。\"\n\n> \"或者这个题目也不一定非得这么做。为什么呢？因为它的增速这两个增速都还是很适合用百（分数）法去直接把增量估出来的……这个增速它约等于 1/2，所以增量就是限期除以 3，二（2.0）左右。这个增速约等于 1/7，那增量就是限期除以 8，2.28 除以 8，0.3 不到，那二是 0.3 的 7 倍左右，所以选择 B 选项。\"\n\n> \"**对，具体用哪种方法，你还是要看这个数据怎么去处理更好算。**\"\n\n**【选项原文】**\n\n> A.4　B.7　C.10　D.14\n\n**【答案】** ✅ **B（7）**\n\n**【解析】**\n\n- 精确核算：教育增量 ≈ 2.055，医疗增量 ≈ 0.287，比值 ≈ **7.16** → B；\n- **陷阱类型：概念陷阱（最大陷阱）**——`现期比 × 增速比 = 9.5` 是\"现期口径\"，**必须再按增速差修正 ÷1.3**，否则会误选 **C（10）**；\n- **陷阱类型：单位/口径陷阱**——本题两个增速都不小（51.7% 与 14.4%），差额 37.3% 属于\"不小的差距\"，绝不能忽略；\n- 老师原话：**\"这个就是现期比乘增速比，那这个时候千万不要去选这个 C（10）。因为你要心中要有误差。\"**\n\n---\n\n### 第11题｜2021年上半年S市零售：增量倍数（视频未完）\n\n**【题干原文】**（画面逐字，f_0244 / f_0246 / f_0250）\n\n> 11.2021年上半年，全市社会消费品零售总额9048.44亿元，比去年同期增加了2104.14亿元。分行业看，批发和零售业零售额8287.13亿元，同比增长28.4%；住宿和餐饮业零售额761.31亿元，同比增长54.0%。\n>\n> 2021年上半年，S市批发和零售业零售额同比增量约是住宿和餐饮业的多少倍？\n>\n> A.3　B.5　C.7　D.9\n\n**【材料数据】**\n\n| 行业 | 2021 上半年零售额（现期） | 同比增速 | 2020 上半年基期（核算参考） | 同比增量（核算参考） |\n| --- | --- | --- | --- | --- |\n| **批发和零售业** | **8287.13 亿元** | **+28.4%** | 8287.13 ÷ 1.284 ≈ 6454（2020 上半年） | ≈ 8287 × 0.284/1.284 ≈ **1833** |\n| **住宿和餐饮业** | **761.31 亿元** | **+54.0%** | 761.31 ÷ 1.54 ≈ 494（2020 上半年） | ≈ 761 × 0.54/1.54 ≈ **267** |\n| 全市社会消费品零售总额 | 9048.44 亿元 | 比去年同期增加 2104.14 亿元 | — | 干扰数据 |\n\n**【解题拆解（老师本集讲到的部分）】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | \"增量约是多少倍\"→ **增量倍数（增量比）** |\n| 核心式子 | `增量比 = 基期比 × 增速比` |\n| 现期比 | `8287.13 ÷ 761.31 ≈ 11 倍`（板书圈出\"11 倍\"） |\n| 增速比 | `54.0% ÷ 28.4% ≈ 1.9 ≈ 2`（板书：增速反比约 2 倍；\"五十四除以二十八，基本上就是两倍不到\"） |\n| 换算 | 对方（住宿餐饮）增速是我的 2 倍 → 增速比 = 1/2 |\n| 初步结果 | `11 ÷ 2 = 5.5`（板书：`11/2 = 5.5`） |\n\n**【速算演示（画面板书逐字）】**\n\n```\n8287.13 / 761.31 ≈ 11（现期比，板书标\"11 倍\"）\n54.0 / 28.4 ≈ 2（增速反比）\n增速比 = 1/2\n增量比 ≈ 11 × 1/2 = 11 / 2 = 5.5\n```\n\n老师原话（本集最后一段）：\n\n> \"第十一点还是增量倍数问题，找到他们的现期、增速。\"\n\n> \"现期倍数（现期比）那这个地方呢，它这个增量呢就没有上行（上一题）那么好估了，百分之二十八点四。你如果想要估的快，你得把它调整成百分之二十五，那就有点远。你如果想把它估得准，你要把它看到二十八点六，但二十八点六这个七分之二相对来说，这个作为分数法没有那么很快的……所以然后我们在（看）现期增速的这个倍数呢还是挺明显的，可以从这个现期（比）他们这个比值的关系去考虑。\"\n\n> \"8200 是 761 的，基本上正好是 11 倍。（761 乘以 11 是 8371）再往上加个一倍，到个 8300 左右，差不多。\"\n\n> \"然后增速是下面这个大，那么可以相当于看增速这个反比，我们看这个五十四除以二十八是多少，基本上就是两倍不到。所以他们的增量比就是 11 除以 2，为什么这样是除 2，不是乘 2？因为是对方是你的两倍，相当于是 11 乘了个 1/2。所以是 5.5。\"\n\n> **\"大家要注意，就跟上一题一样，不能像上一题那样，你算个 9.5 就选 10。因为这个地方增速差距还是不小的，你要把这个增速差距给它补（上）……\"**\n\n**【说明】** ⚠️ **本集视频在此处结束（33 分 20 秒）**：老师刚说完\"要把增速差距补上\"，画面停在板书 `11 / 2 = 5.5`，**没有给出最终选项**。因此：\n\n- 老师板书明确给出的中间结果是 **5.5**；\n- 老师明确提示\"**增速差距还是不小的，需要修正**\"（与第 10 题同理，修正方向是\"给增速低的批发零售业补/退\"），最终选项 **待 P17（中）继续**；\n- 本集**不臆造答案**，此处仅记录板书与口播。\n\n**【选项原文】**\n\n> A.3　B.5　C.7　D.9\n\n**【答案】** ⏳ **本集未给出**（板书写到 `11 / 2 = 5.5`，老师提示还需按增速差修正，视频结束）\n\n**【解析（本集可见部分）】**\n\n- 现期比 ≈ 11 倍，增速比 ≈ 1/2，初步 `11 ÷ 2 = 5.5`；\n- 与第 10 题完全同构：**现期比 × 增速比 ≠ 增量比**，必须再做一次按增速差的修正；\n- 陷阱类型（预告）：**概念陷阱**（增量比 ≠ 现期比 × 增速比）＋**精度陷阱**（28.4% 与 54.0% 的差距不算小，不能直接选 5）。\n\n---\n\n## 三、本讲知识点总表\n\n| 考点 | 识别特征 | 核心式子 | 本集对应题 | 关键口诀 |\n| --- | --- | --- | --- | --- |\n| **基期比值（基期比）** | \"A 是 B 的多少倍 / 平均每场、单价…\"，问**上一年** | `基期比 = 现期比 ÷ (1 + Δ)`，`Δ = (r高 − r低)/(1 + r低)` | 第 1、2、3、9 题 | 给增速低的补 |\n| **基期比较大小** | \"上一年谁最高 / 最低 / 最拥堵\" | `基期 = 现期 ÷ (1 + r)`，先排除再做拉平对比 | 第 4、5、6、7 题 | 分子小分母大 → 基期必小 |\n| **增量比较大小** | \"增量最多 / 最少\" | `增量 = 现期 × r ÷ (1 + r)`；`增量比 = 基期比 × 增速比` | 第 8 题 | 大则大 |\n| **增量倍数（增量比）** | \"增量是…的多少倍\" | `增量比 = 基期比 × 增速比`（只能给现期时先算现期比再修正） | 第 10、11 题 | 现期比 × 增速比 ≠ 增量比 |\n| **负增速下的基期比** | 材料里出现\"减少 X%\" | `Δ = (r高 − r低) ÷ (1 + r低)`，`(1+r低)` 会缩到 0.6 几 | 第 9 题 | 负增速要除 0.634，不是除 1 |\n\n**本集 11 题答案一览（画面核对）**\n\n| 题号 | 主题 | 答案 | 依据 |\n| --- | --- | --- | --- |\n| 1 | 2011 全国展览业 · 平均每场面积 | **B.12000** | 画面划出 B |\n| 2 | 2023 信息技术服务 · 云服务 ÷ 集成电路设计 | **C.3.5~4 倍** | `1247/333 ≈ 3.75` |\n| 3 | 2014 房地产业 · 土地购置单价 | **B.2400** | 画面划出 B |\n| 4 | 2021 工业企业利润 · 谁最低 | **A.国有控股企业** | 画面圈出 A |\n| 5 | 2019 通勤高峰 · 最拥堵 | **C.重庆** | 口播\"所以重庆它就是基期最大的\" |\n| 6 | 一线城市拥堵排序 | **D.北京、广州、上海、深圳** | 口播\"所以选择 D 选项\" |\n| 7 | 2019 一季度社零 · 谁最高 | **C.中西药品类** | 1440 圈出，其余补不上 |\n| 8 | 2022 服务业增加值 · 增量最多 | **B.金融业** | 画面标出 B |\n| 9 | 2017 上半年 S 市手机出口 · 基期倍数 | **B.2.6** | 画面标出 B，A 划掉 |\n| 10 | 2016 该市财政支出 · 增量倍数 | **B.7** | `9.5 ÷ 1.3 ≈ 7.3` |\n| 11 | 2021 上半年 S 市零售 · 增量倍数 | ⏳ **本集未给出**（板书 5.5） | 视频在讲解中结束 |\n\n---\n\n## 四、速算口诀与解题流程\n\n**① 基期比值三步流程**\n\n```\n第一步：写现期比（A / B）——数字太大先约（12470/3069 → 1247/307）\n第二步：算 Δ = (r高 − r低) ÷ (1 + r低)\n        · 先做差，再\"除以一加 r低\"\n        · 差很小（1~2 个点）时可直接除；差大或遇负增速必须严格除\n第三步：三选一落点——补分子 / 退分母 / 先算完再整体除，谁的整数好凑就选谁\n```\n\n**② 口诀卡**\n\n| 口诀 | 出处/说明 |\n| --- | --- |\n| **给增速低的补** | 全集出现 4 次以上，是本法门的灵魂 |\n| **永远是拿增速高的减增速低的，除以一加增速低的** | 第 2 题原话 |\n| **谁低谁补，不是绝对值小** | 第 9 题原话（−36.6% vs −30.7%） |\n| **先整了再说** | 第 9 题原话，把 ±几个点的误差留到最后 |\n| **大则大** | 第 8 题板书（现期大、增速大 → 增量必大） |\n| **分子小 + 分母大 → 必小** | 第 4、5 题共用的基期比较秒杀结论 |\n| **1%、2% 的微调直接加减，不管复合** | 第 3 题原话 |\n| **补在分子 = 退在分母，效果一样** | 第 1 题原话 |\n| **差距太明显、补的又太小 → 杯水车薪，不用纠结** | 第 8 题原话 |\n\n**③ 增量题流程**\n\n```\n增量 = 现期 × r ÷ (1 + r)\n增量比 = 基期比 × 增速比\n\n先看倍数差距大不大：\n  差距大（1.2 倍 vs 6 倍）→ 直接比倍数，不用补\n  差距小（第 6、10 题）  → 必须精算 / 必须按增速差修正\n```\n\n**④ 基期比较大小流程**\n\n```\n第 1 步：圈出每个候选的\"现期 + 增速\"\n第 2 步：凡是\"现期更小 + 增速更大\"的，直接排除（分子小分母大）\n第 3 步：锁定现期最大者，让其他\"增速更低\"的候选补 Δ，看能否追上\n第 4 步：选项只剩两个时，只比较两者区别（第 6 题：广州 vs 上海）\n```\n\n---\n\n## 五、易错点与陷阱清单\n\n| # | 陷阱类型 | 具体表现 | 本集题号 | 正确做法 |\n| --- | --- | --- | --- | --- |\n| 1 | **概念陷阱** | 给谁补？补错对象 | 第 9 题 | 给**增速低**的一方补（不是给数值小的那一个补） |\n| 2 | **概念陷阱** | 负增速直接做差就补 | 第 9 题 | 必须 ÷ `(1 + r低)`：`5.9% ÷ 0.634 ≈ 9.3%`，不是 5.9% |\n| 3 | **概念陷阱** | 增量比当成\"现期比 × 增速比\" | 第 10、11 题 | 增量比 = **基期比** × 增速比，现期口径要再 ÷(1+30%) 修一次 |\n| 4 | **时间陷阱** | 问上一年却算现期 | 第 1、2、3、4、5、6、7、9 题 | 题干\"2010 年 / 2022 年 / 2013 年 / 2020 年 / 2019 年 / 2018 年 / 2016 年\"都是基期 |\n| 5 | **单位陷阱** | 万平方米 ÷ 场、亿元 ÷ 万平方米 | 第 1、3 题 | 结果要还原成\"平方米/场\"\"元/平方米\"，差 10000 倍量纲 |\n| 6 | **范围陷阱** | 表格里有 3 月与 1-3 月两组 | 第 7 题 | 题干问 1-3 月就取 1-3 月那两列 |\n| 7 | **精度陷阱** | 差距只有 0.05 却粗略估 | 第 6 题 | 必须硬算或严格放缩，否则上海/广州排反 |\n| 8 | **反向陷阱** | \"现期最大 → 基期也最大\" | 第 4、6 题 | 只有在\"现期最大 + 增速最低\"时才成立；否则要给他人补后再判 |\n| 9 | **混淆陷阱** | \"同比增量最多\"看成\"增速最快\" | 第 8 题 | 增速最快是 C（9.1%），增量最多是 B（金融业） |\n| 10 | **过度精算陷阱** | 倍数差距明显还去补增速差 | 第 8 题 | 倍数差距大 + 增速差小 → 直接比倍数 |\n\n---\n\n## 六、老师金句\n\n> ⭐ **\"给谁补？给增速低的那个去补，永远是拿增速高的减增速低的，去除以一加增速低的。\"**\n\n> ⭐ **\"给增速低的补，注意是增速低，不是小，不是绝对值小，谁低谁补。\"**（第 9 题）\n\n> ⭐ **\"调误差这件事情它本身就是灵活的，你可以在过程中调，也可以在结果上调。\"**（第 1 题）\n\n> ⭐ **\"选择哪一种思路，核心原理还是看哪里有你需要的整数，哪边能更方便你去到你想要的那个整数上去。\"**（第 1 题）\n\n> ⭐ **\"先整了再说。这些什么其他的那些百分之几个点那种误差，想什么时候调就什么时候调。\"**（第 9 题）\n\n> ⭐ **\"这种微调的时候是百分之一百分之二，不用太在意它之间是否需要什么复合增长率，就给它合起来大概差不多就行了。\"**（第 3 题）\n\n> ⭐ **\"分子又小，分母又大，它除下来肯定小。\"**（第 4 题）\n\n> ⭐ **\"这个题目难度系数非常高，基本上考场上是很难做出来的……因为我们拉平增长率，它主要讨论的是一个百分之二点六，是对于这个一点八八七而言，是一个比较小的数，计算的是这个零点零五，那就算有误差，它的误差也非常小。\"**（第 6 题）\n\n> ⭐ **\"差距太明显，补的又太小，杯水车薪。\"**（第 8 题）\n\n> ⭐ **\"具体用哪种方法，你还是要看这个数据怎么去处理更好算。\"**（第 10 题）\n\n---\n\n## 附录：画面进程表（核对用）\n\n本集共 250 张原帧（每隔 8 秒一张），按题号对应的**抽样核对帧**如下（均为逐字核对过的高清帧）：\n\n| 题号 | 题干帧 | 板书/选项帧 |\n| --- | --- | --- |\n| 第1题 | f_0001 | f_0031、f_0038、f_0041、f_0044 |\n| 第2题 | f_0048 | f_0055、f_0057 |\n| 第3题 | f_0059 | f_0064、f_0070 |\n| 第4题 | f_0076 | f_0080 |\n| 第5题 | f_0092、f_0093 | f_0100、f_0102、f_0104 |\n| 第6题 | f_0107、f_0110、f_0113 | f_0120–f_0170（板书累计） |\n| 第7题 | f_0142、f_0146、f_0148 | f_0148（1440 圈出） |\n| 第8题 | f_0150、f_0152 | f_0176、f_0181 |\n| 第9题 | f_0208、f_0210 | f_0208（6%/0.634、700/270） |\n| 第10题 | f_0216、f_0232 | f_0219、f_0224、f_0228 |\n| 第11题 | f_0244、f_0246、f_0250 | f_0250（11/2 = 5.5，视频结束） |\n\n> **转写与画面的主要差异（已按画面纠正）**\n> 1. 转写\"限期比\"→ 画面/术语为**现期比**；\"机器/机期\"→ **基期**；\"拉长平均率\"→ 板书为**拉平增长率**。\n> 2. 第 10 题：转写\"六十六（6.65）\"→ 画面为 **教育 6.03 亿元 / 增速 51.7%**；转写\"51.7 减 14.4\"正确对应画面增速。\n> 3. 第 11 题：转写\"8237.13 亿元、同比增长 13.2%\"→ 画面为 **8287.13 亿元、同比增长 28.4%**（\"五十四除以二十八\"口播与画面一致）。\n> 4. 第 2 题：转写\"一二五除以三零七\"→ 画面为 `
