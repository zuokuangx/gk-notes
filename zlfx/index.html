期量（下降率→份数法 / 除以 0.9 的错位相加技巧）\n```\n\n> ⭐ 老师全场总纲：**\"在计算机期或者增量的时候，我们主要要看增速有什么特点去选择计算方式。\"**\n\n---\n\n## 二、作业题精讲 第 14~30 题\n\n### 第14题 2020年全国人口增长量区间\n\n**【题干原文】**\n\n> 14.2020年全国人口共 141178 万人，比2010年增长约 5.38%。\n>\n> 2020年全国人口比2010年全国人口增加的数量位于以下哪个区间：\n> A.5000万人-6000万人\n> B.6000万人-7000万人\n> C.7000万人-8000万人\n> D.8000万人-9000万人\n\n（画面中 141178 与 5.38% 均被红笔圈出，为定位数据）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年全国人口 | 141178 | 万人 |\n| 2020年比2010年增长 | 约 5.38% | % |\n| 所求 | 2020年比2010年的增长量 | 万人（区间） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（已知现期值 + 增长率，且只要求判断区间） |\n| 定位数据 | 现期 141178 万人 ≈ 14 万万人；r = 5.38% ≈ 5.4% |\n| 列式 | `增长量 = 现期值 × r / (1 + r)`，此处把 14.1178 万人凑整为 14 万万人，r 凑整为 5.4% |\n| 速算步骤 | ① 用**乘法方式凑整**：141178 → 140000（14 万万人），同时把 5.38% **变大**为 5.4%，两头一升一降，误差互相抵消；② `14 × 5.4 = 75.6` → `7560` 万人；③ 结论偏大，误差约 5.38%，向下修 `7560 × 5.38% ≈ 420`；④ `7560 − 420 ≈ 7140` 万人 |\n| 结论 | 7140 万人落在 **7000万~8000万** 区间 → **C** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n（1）乘法方式凑整，不减除\n    141178 → 140000（即 14 万万人）   变小\n    5.38%  → 5.4%                     变大\n    ↓ 一升一降，直接按\"现期 × 增速\"算\n\n（2）14 × 5.4 = 75.6\n    75.6 → 7560 （万人）\n    （竖式：54 × 14 = 756）\n\n（3）误差修正：这个增量偏大 5% 左右，实际偏大 5.38%\n    7560 × 5.38% ≈ 420\n    7560 − 420 ≈ 7140\n\n（4）7000 多 → 选 C（7000万-8000万人）\n```\n\n> ⭐ **\"虽然它的增量应该是7560，然后这个增量呢是偏大了百分之五左右的，偏大百分之五点三八。\"**\n> ⭐ **\"可是那七千五就算往下降五个点，也就只能降三四百，还是会比七千要多的，所以选择C选项。\"**\n\n**老师补充的第二条思路（提前调误差）**\n\n> **\"或者你也可以从增速提前调误差的角度去想，百分之五的平方是不是二十五……接下来算你5.1%，所以它的准确的一个增量，相对准确的增量，起码也是141178×5.1%。这就是增量，那是不是比7000要多？而且很明显也没到8000。\"**\n\n```\n用\"提前调误差\"：\n  5.38% 往下调 → 5.1%\n  141178 × 5.1% ≈ 7200 （万人）→ 比 7000 多、没到 8000 → C\n\n用\"画出真（化除为乘）提前调误差\"：\n  压根不用算出具体数——\n  14 开头一点点 × 5 多一点 = 7000 多一点的东西\n  （\"你起码到 16 乘以 5 才能到 80 嘛\"）\n```\n\n> ⭐ **\"你如果用这个题目，用化除为乘的提前调误差的话，更快。我压根都不需要算出来它是多少，我就知道它是一个十四开头一点点的东西，就乘一个五多一点的东西，那就是七千多一点的东西。\"**\n\n**【选项原文】**\n\n- A.5000万人-6000万人\n- B.6000万人-7000万人\n- C.7000万人-8000万人\n- D.8000万人-9000万人\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 本题不需要算精确值，只要定性判断落在哪个 1000 万的区间里即可。\n- 关键技巧是\"**现期凑整 + 增速凑整**\"：现期 141178 往下缩到 140000，增速 5.38% 往上抬到 5.4%，一个变小一个变大，误差方向相反、量级相近，正好互相抵消。\n- 7256~7560 万人都在 7000 万以上、8000 万以下，**A、B、D 三个区间均不可能**。\n- **陷阱类型：单位陷阱 + 量级陷阱**——题目给的是\"万人\"，141178 万人 = 14.1 亿人，若把 141178 当成 14 万直接乘 5.38% 会得到 7560（万人），量级正好对；但若误当作 141178 万人 × 5.38% = 7595 万人也可以；真正的坑在于算出 7500 左右后犹豫\"差 300 是不是该选 B\"，本题选项区间宽 1000 万，完全容错。\n\n---\n\n### 第15题 2019年6月地方政府债券增量\n\n**【题干原文】**\n\n> 15.2019年6月，全国发行地方政府债券 **8996** 亿元，同比增长 **68.37%**。\n>\n> 2019年6月，全国发行的地方政府债券比2018年6月多约：\n> A.6151亿元　B.5953亿元　C.3653亿元　D.3043亿元\n\n（画面中 8996 被圈出，68.37% 被圈出并旁注 `⇒ 2/3`）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2019年6月全国发行地方政府债券（现期） | 8996 | 亿元 |\n| 同比增长率 r | 68.37% ≈ 2/3 | % |\n| 所求 | 2019年6月比2018年6月的增长量 | 亿元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（已知现期 + 增速，增速可凑成简单分数） |\n| 定位数据 | 现期 8996 亿元 ≈ 9000；r = 68.37% ≈ 2/3 |\n| 列式 | 设基期为 3 份，则增量 = 2 份，现期 = 5 份 → `增量 = 现期 × 2/5` |\n| 速算步骤 | ① 增速 68.37% 看作 `2/3`（\"这个增速的特点是靠近百分三分之二\"）；② 现期 8996 **不用调**——\"它本身就很整，它离这个九千就基本上没什么差距，我们就把它看作九千\"，只把增速降低；③ `9000 × 2/5 = 9000 × 0.4 = 3600` |\n| 结论 | 3600 亿元 → **C.3653亿元** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n增速 68.37% → 2/3\n    基期看作 3 份\n    增量占其中 2 份\n    现期 = 3 份 + 2 份 = 5 份\n    ⇒ 增量 = 现期 × 2/5\n\n9000 × 2/5 = 3600\n\n（另一写法）\n    r = 3/2 → 现期 5 份 → 增量 = 现期 × 2/5\n```\n\n> ⭐ **\"那这个时候我们要不去调这个现期，不用去调，因为它本身就很整，它离这个九千就基本上没什么差距，我们就把它看作九千。我们只不过是把增速降低了。后面如果我们要调误差，我们在最后的结果上再去调就好了。\"**\n> ⭐ **\"增速是3/2，相当于把基期看作了3份，加了其中的2份，这叫3/2的一个增量，变成了现期的5份。那增量就是现期的2/5。\"**\n\n**【选项原文】**\n\n- A.6151亿元\n- B.5953亿元\n- C.3653亿元\n- D.3043亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 68.37% 与 2/3（≈66.7%）只差 1.7 个百分点，属于\"够用的凑整\"。\n- 用份数法（分数法）时，**只需调增速、不调现期**：现期 8996 本来就在 9000 附近，动它反而多引入误差；把误差留给最后一步（或干脆不调）。\n- 用\"增量 = 现期 × 2/5\"直接得到 3600，与 C 的 3653 相差不到 1.5%，是唯一接近的选项。\n- **陷阱类型：概念陷阱**——\"同比增长 68.37%\"是**增长率**不是增量；\"多约\"问的是增长量。A.6151、B.5953 都是现期值的直接比例（8996×68.37%=6150，正是 6151！），这是典型的\"拿现期乘增速\"陷阱。D.3043 无从来源。\n\n---\n\n### 第16题 2010年我国制造业利润总额\n\n**【题干原文】**\n\n> 16.2015年我国高技术制造业实现利润总额 7233.7 亿元，比2010年增长 165.5%，增幅比其他制造业平均水平高出 11.5 个百分点；高技术制造业利润总额占全部制造业的比重为 13.1%，比2010年提高 0.5 个百分点。\n>\n> 2010年，我国制造业实现利润总额约多少万亿元？\n> A.1.3　B.1.7　C.2.2　D.2.8\n\n（画面红笔：7233.7、165.5%、11.5 个百分点、13.1%、0.5 个百分点 全部圈出并画线）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2015年高技术制造业利润总额（现期） | 7233.7 | 亿元 |\n| 比2010年增长 | 165.5% | % |\n| 增幅比其他制造业平均水平高出 | 11.5 | 个百分点 |\n| 2015年高技术制造业占全部制造业比重 | 13.1% | % |\n| 比2010年提高 | 0.5 | 个百分点 |\n| 所求 | 2010年我国制造业实现利润总额 | 万亿元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | ① 求部分量的基期量（高技术制造业2010年利润）；② 再由\"比重\"反推总体（制造业2010年利润） |\n| 定位数据 | 2010年高技术占比 = `13.1% − 0.5 个百分点 = 12.6%`；高技术2010年利润 = `7233.7 ÷ (1 + 165.5%)` |\n| 列式 | `制造业2010 = 高技术2010 ÷ 12.6%` |\n| 速算步骤 | ① 先算比重：`13.1% − 0.5% = 12.6%`（板书：高/制 = 12.6%）；② 求高技术 2010 年利润：`7233.7 ÷ (1 + 165.5%) = 7233.7 ÷ 2.655`，用**放缩法**：`7233.7 → 7200`，`2.655 → 2.65`，再写 `72 ÷ 2.6`；③ 分母凑整：`2.6 → 2.5`（减 15，即约 6%），上面也同比例减 4 → `68 ÷ 2.5 = 68 × 4 = 272`，量级回到 **2720**；④ 反推总体：`2720 ÷ 12.6%`，12.6% ≈ 1/8（≈12.5%），`2720 × 8 = 21760 ≈ 2.16 万亿` |\n| 结论 | 约 2.2 万亿元 → **C** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n第一步：2010年高技术制造业占全部制造业比重\n    13.1% − 0.5 个百分点 = 12.6%\n    板书写作： 高 / 制 = 12.6%\n\n第二步：2010年高技术制造业利润总额（放缩法）\n    7233.7 ÷ (1 + 165.5%) = 7233.7 ÷ 2.655\n    → 取 7200 ÷ 2.65 ，再写 72 ÷ 2.6\n\n    放缩凑整（分母 2.6 → 2.5）：\n        分母减 15（约 6%）\n        分子大概也是它的 1/4 左右 → 减 4\n        → 68 ÷ 2.5 = 68 × 4 = 272\n    → 量级还原：2720\n\n第三步：反推 2010 年制造业利润总额\n    12.6% ≈ 12.5% = 1/8\n    2720 × 8 = 21760 ≈ 2.16 万亿\n\n    （板书旁注：2720 / 12.6% = 1/8 → 2720 × 8 = 2.16）\n```\n\n> ⭐ **\"限期7200，这个时候算基期，我们肯定要放缩法了，因为这个增速你不适合用化除为乘，用分数法呢也有点麻烦。\"**\n> ⭐ **\"12.6%是什么？就是1/8嘛，约等于12.5%。所以制造业它就是两千七乘以八。\"**\n\n**【选项原文】**\n\n- A.1.3\n- B.1.7\n- C.2.2\n- D.2.8\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 这是一道**双重间接**题：已知现期部分量 + 增长率 → 求基期部分量；再借助\"比重\"和\"比重变化\"求基期总体量。\n- 两个易错点：\n  1. **百分点不是百分数**。13.1% 比 2010 年**提高 0.5 个百分点**，所以 2010 年比重是 `13.1% − 0.5% = 12.6%`，**不是** 13.1% ÷ (1+0.5%)。\n  2. **题干里的\"增幅比其他制造业平均水平高出 11.5 个百分点\"是干扰信息**，本题根本用不到（它是为其他小问准备的）。\n- 100% 的排除法：目标量 = 2.16 万亿，只有 C.2.2 与之匹配。A.1.3 / B.1.7 是\"把 12.6% 当 20% 或 15% 算\"的误值；D.2.8 是\"忘了减 0.5 个百分点、用 13.1% 除\"或\"分子算大\"得到的误值。\n- **陷阱类型：概念陷阱（百分数 vs 百分点）+ 范围陷阱（干扰数据 11.5 个百分点）+ 单位陷阱（亿元 ↔ 万亿元）**。\n\n---\n\n### 第17题 2013年城镇消费品零售总额\n\n**【题干原文】**\n\n> 17.2014年，某市全年实现社会消费品零售总额 261.38 亿元，比上年增长 13.2%。按经营地统计，城镇消费品零售总额为 178.6 亿元，比上年增长 13.5%。\n>\n> 2013年，该市城镇消费品零售总额约为多少亿元？\n> A.150.5　B.157.4　C.170.6　D.206.5\n\n（画面红笔：178.6 亿元与 13.5% 被圈出，13.5% 旁注 `⇒ 13.5% = 1/7`）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2014年全市社会消费品零售总额 | 261.38 | 亿元 |\n| 比上年增长 | 13.2% | % |\n| 2014年城镇消费品零售总额（现期） | 178.6 | 亿元 |\n| 城镇比上年增长 r | 13.5% | % |\n| 所求 | 2013年该市城镇消费品零售总额 | 亿元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求基期量（已知现期 + 增速） |\n| 定位数据 | 现期 178.6 亿元；r = 13.5%，可看作 `1/7`，也可看作 `1/8`（12.5%） |\n| 列式 | 路线一：`r = 1/7` → 增量 = 现期 ÷ 8，基期 = 现期 − 增量\u003cbr>路线二：`r = 1/8` → 增量 = 现期 ÷ 9，基期 = 现期 − 增量 |\n| 速算步骤 | ① `178.6` 调整成 `160`（或 `170`）——\"因为他们比较整\"；② `160 ÷ 8 = 20`（或 `170 ÷ 8 = 21.25`）；③ `178.6 − 20 = 158.6`（或 `178.6 − 21.25 = 157.4`） |\n| 结论 | 约 157~159 亿元 → **B.157.4亿元** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n路线一：13.5% 看成 1/7\n    增速 = 1/7 ⇒ 增量 = 现期 ÷ (7+1) = 现期 ÷ 8\n    现期 178.6 → 调整成 160（更整）\n        160 ÷ 8 = 20      （板书圈出 20）\n        170 ÷ 8 = 21.25\n    178.6 − 20 = 158.6\n    178.6 − 21.25 = 157.4\n\n路线二：13.5% 看成 1/8（12.5%）\n    增速变小了 ⇒ 把现期变大一点，用 180\n    增量 = 180 ÷ (8+1) = 180 ÷ 9 = 20\n    178.6 − 20 = 158.6   → 仍是 B\n    （板书：178.6 ÷ 9 = 20 → 1/8 增量）\n```\n\n> ⭐ **\"它比较靠近百分之十四点三，或者你也可以说它比较靠近百分之十二点五，其实都行，一个点呢不算多，不算大。\"**\n> ⭐ **\"你只要用一百六或者一百七，为什么选他们俩？因为他们比较整，你再到一百五的话，有点太远了。\"**\n> ⭐ **\"我们计算的这个东西对于他问我们这个东西占比很小……就算它有百分之十的误差，在整个这个一百五十七这种这么大的差距来看，我们是不可能出现这么大的误差的。\"**\n> ⭐ **\"所以你不管用哪个去除一八都行……你觉得哪个快，谁都能去算。\"**\n\n**【选项原文】**\n\n- A.150.5\n- B.157.4\n- C.170.6\n- D.206.5\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 本题的精华在于**误差的量级感知**：被调整的对象只是\"20 左右的小数\"，即便把它算成 21.25，178.6 − 21.25 = 157.4，与 158.6 只差 1.2，仍指向同一个选项 B。\n- 老师原话点破：\"**这有起码30个点了**……我不可能把一个二十七的东西算成二十\"——绝对不可能出现跨选项的大误差。\n- **A.150.5**：把 r 当成 18% 左右（178.6/1.185 ≈ 150.7）的误值。\n- **C.170.6 / D.206.5**：C 相当于\"没减增量\"或只减了一点点；D 相当于\"加了增量\"（178.6 × 1.155 ≈ 206.3）。\n- **陷阱类型：时间陷阱（2014 现期 → 2013 基期）+ 概念陷阱（13.2% 是全市总额增速，13.5% 才是城镇增速，要取城镇的那个）**。\n\n---\n\n### 第18题 2014年1-11月民航周转总量增量\n\n**【题干原文】**\n\n> 18.2014年1月~11月中，民航周转总量同比增加（　）亿吨公里。\n> A.13.65　B.15.21　C.12.17　D.20.08\n\n（表头为「2014年1-11月我国货物运输情况」，题目中年份数字在部分画面被红笔圈遮挡，以高清帧为准读作 **2014**）\n\n**【材料数据】**\n\n> 2014年1-11月我国货物运输情况\n\n| 指标 | 11月 | 同比增速(%) | 1-11月 | 同比增速(%) |\n|---|---|---|---|---|\n| 货物运输总量（亿吨） | 39.3 | 7.1 | 393.2 | 7.3 |\n| 其中：铁路（亿吨） | 3.2 | -6.5 | 35.0 | -3.2 |\n| 公路（亿吨） | 30.7 | 8.6 | 303.6 | 8.8 |\n| 水运（亿吨） | 5.4 | 7.6 | 54.5 | 6.8 |\n| 民航（万吨） | 55.5 | 3.4 | 538.0 | 5.7 |\n| 货物周转总量（亿吨公里） | 16409.2 | 8.6 | 164873.0 | 10.1 |\n| 其中：铁路（亿吨公里） | 2354.4 | -6.4 | 25200.7 | -5.2 |\n| 公路（亿吨公里） | 5833.0 | 10.4 | 55448.0 | 9.8 |\n| 水运（亿吨公里） | 8204.1 | 12.5 | 84056.0 | 16.0 |\n| **民航（亿吨公里）** | 17.6 | 8.5 | **168.7** | **8.8** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（已知现期 + 增速） |\n| 定位数据 | 注意**不是\"货物运输量\"里的民航 538.0 万吨**，而是**\"货物周转量\"里的民航：1-11月 168.7 亿吨公里，同比增速 8.8%** |\n| 列式 | `增长量 = 现期 × r / (1 + r)` → 用**化除为乘**思路：`168.7 × 8.8%` |\n| 速算步骤 | ① 直接算 `168.7 × 8.8%` 偏大，且两边都不整；② 比较\"调左边（现期）\"还是\"调右边（增速）\"：**88648.8 的平方比 64 要高一点**，所以把 8.8% 调成 **8%** 更顺；③ `168.7 → 170`（四舍五入，差距只有 1% 左右），`170 × 8% = 13.6` |\n| 结论 | 13.6 → **A.13.65** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n现期 168.7，增速 8.8%（两者都不整）\n    ⇒ 先把它往下提前微调一下\n\n判断调哪边？\n    \"8.8% 的平方要比 64 要高一点\"\n    ⇒ 把增速 8.8% 调成 8% 更好调\n    （调现期 168.7 的 8.8% 或 8% 都比较麻烦）\n\n168.7 → 170   （差 1.3，约 1%，属于四舍五入，可忽略）\n170 × 8% = 13.6\n\n板书原样：\n    168.7 × 8.8% ↓\n    170   × 8%   = 13.6\n```\n\n> ⭐ **\"这个增速呢是小于百分之十的比较小的增速，所以我们用化除为乘。\"**\n> ⭐ **\"88648.8的平方呢是要比64要高一点的，所以我基本上正好可以把这个8.8去调成8%，调它会好一点。\"**\n> ⭐ **\"这里呢就属于四舍五入，因为这个168.7跟17这差距太小了，只有1%左右。1%的误差在这个题目里面是完全可以允许的。\"**\n\n**【选项原文】**\n\n- A.13.65\n- B.15.21\n- C.12.17\n- D.20.08\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **定位陷阱是本题第一大坑**：表格里\"货物运输总量\"下有\"民航 538.0 万吨\"，\"货物周转总量\"下才有\"民航 168.7 亿吨公里\"。题目问的是**周转量**（单位亿吨公里），必须取第二块。\n- 精算验证：`168.7 × 8.8/108.8 = 13.64`，与 A.13.65 完全吻合。\n- **B.15.21**：直接 `168.7 × 8.8% = 14.85`（≈15）的\"未做除法修正\"值，属于典型陷阱。\n- **C.12.17 / D.20.08**：均为定位错误或倍数错误的干扰值。\n- **陷阱类型：单位陷阱（万吨 / 亿吨公里）+ 概念陷阱（运输量 ≠ 周转量）+ 范围陷阱（同表 11 月数据 17.6 也是干扰）**。\n\n---\n\n### 第19题 2024年一季度F市货运量增量\n\n**【题干原文】**\n\n> 19.2024年一季度，F市货运 2.09 亿吨，同比增长 2.6%。\n>\n> 2024年一季度，F市货运量同比约增加了（　）万吨。\n> A.488.3　B.502.3　C.529.6　D.546.4\n\n（画面中 2.09 亿吨与 2.6% 均被圈出）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2024年一季度F市货运（现期） | 2.09 | 亿吨 |\n| 同比增长 r | 2.6% | % |\n| 所求 | 货运量同比增加量 | **万吨** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（已知现期 + 增速，增速很小） |\n| 定位数据 | 现期 2.09 亿吨 = 20900 万吨；r = 2.6% |\n| 列式 | `增长量 ≈ 现期 × r`（增速小，化除为乘几乎无误差） |\n| 速算步骤 | ① 位数多，去凑整：把 `2.09 → 2`，直接用 `2 × 2.6% = 0.052 亿 = 520 万吨`；② 判断误差方向：2.09 → 2 实际**减少了 4.5%**（\"准确点来说减了4.5%\"），而本来只打算调 2.6%，等于**多减了约 2 个点**；③ 520 的 2% ≈ 10，所以 `520 + 10 ≈ 530` |\n| 结论 | 约 529.6 万吨 → **C** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n（1）化除为乘\n    2.09 × 2.6%\n    2.09 → 2  （把三位数直接变成一位数）\n    2 × 2.6% = 0.052 亿 = 520 万吨\n\n（2）修正误差\n    2.09 → 2  ，减了约 4.5%（本来只打算减 2.6%）\n    ⇒ 一来一去多减了约 2 个点\n    520 × 2% ≈ 10\n    520 + 10 ≈ 530\n\n（板书原样：2.09 × 2.6% ／ 2 × 2.6% = 520 → 529.6 → C）\n```\n\n> ⭐ **\"位数多，我们就去凑整，二点六不好凑……因为左边这个你可能把它从三位数直接变成一位数。\"**\n> ⭐ **\"我知道你从 2.09 变成 2，少了多少？少了 4%。这个量肯定是你本来打算调的那个 2.6% 要多得多，所以你算的这个 52 是偏小的。所以说要选一个比它大一点的 529。\"**\n\n**【选项原文】**\n\n- A.488.3\n- B.502.3\n- C.529.6\n- D.546.4\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 精算：`2.09亿 × 2.6% / 1.026 = 529.6 万吨`，与 C 完全一致。\n- 本题演示的是\"**凑整必然带来误差，误差方向要能判断，并且要知道该往哪边补偿**\"：把现期**调小**了，结果就**偏小**，所以要往**大**选。\n- **A.488.3 / B.502.3**：都是\"把结果算小\"的选项，若只算到 520 就停手，很容易误选 B。\n- **D.546.4**：相当于用 2.6% 之外的更大增速，或\"2.09 直接乘 2.6% 后取 543\"再调错方向的干扰值。\n- **陷阱类型：单位陷阱（亿吨 ↔ 万吨，量级差 1 万倍）+ 误差方向陷阱**。\n\n---\n\n### 第20题 2020年末G省两项保险累计结余增量\n\n**【题干原文】**\n\n> 20.2020年G省养老、失业、工伤保险基金总收入（不含上下级往来）4015.10亿元；年末累计结余 13325.14 亿元，比上年末降低 2.8%。全年全省基本医疗和生育保险基金总收入 2228.61 亿元，增长 1.6%；年末累计结余 3664.87 亿元，增长 10.1%。\n>\n> 下列关于2020年末G省养老、失业、工伤保险基金累计结余增量同基本医疗和生育保险基金累计结余增量的说法正确的是（　）。\n> A.前者增加约383亿元，后者减少约337亿元\n> B.前者减少约383亿元，后者增加约337亿元\n> C.前者增加约4015.10亿元，后者减少约2228.61亿元\n> D.前者减少约4015.10亿元，后者增加约2228.61亿元\n\n（画面红笔：13325.14、2.8%、3664.87、10.1% 被圈出；A、C 两个选项被打叉，B 被圈，D 被画线）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年G省养老、失业、工伤保险基金总收入（不含上下级往来） | 4015.10 | 亿元 |\n| 养老、失业、工伤保险基金**年末累计结余**（现期） | 13325.14 | 亿元 |\n| 该累计结余比上年末 | **降低 2.8%** | % |\n| 全年全省基本医疗和生育保险基金总收入 | 2228.61 | 亿元 |\n| 该总收入增长 | 1.6% | % |\n| 基本医疗和生育保险基金**年末累计结余**（现期） | 3664.87 | 亿元 |\n| 该累计结余增长 | **增长 10.1%** | % |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 两量增长量比较（正负 + 量级） |\n| 定位数据 | 前者：13325.14 亿元，r = **−2.8%**；后者：3664.87 亿元，r = **+10.1%** |\n| 列式 | 前者增量 = `13325.14 × (−2.8%) ÷ (1 − 2.8%)`；后者增量 = `3664.87 × 10.1% ÷ (1 + 10.1%)` |\n| 速算步骤 | ① **先看增速正负**：前者 −2.8% ⇒ 一定**减少**；后者 +10.1% ⇒ 一定**增加** ⇒ 排除 A、C；② 算前者量级：`13325 × (−2.8%)`，2.8% 已经很靠近整数，索性上调成 **−3%**：`13000 × 3% = 399`（板书 `13000 × 3% × (−1) = −399`，\"那就是在 383 这边\"）；③ 一眼排除 D：**1% 是 100 多，3% 就是 300 多，怎么可能是 4000 呢**——从量级就能否决；④ 验证后者：`10.1% ≈ 1/10` ⇒ 增量 = `3664.87 ÷ 11 ≈ 333`（错位相减），落在 **337** 附近 |\n| 结论 | 前者减少约 383 亿元、后者增加约 337 亿元 → **B** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n第一步：只看增速符号定正负\n    前者 r = −2.8%  ⇒ 减少     （前者减少）\n    后者 r = +10.1% ⇒ 增加     （后者增加）\n    ⇒ 排除 A（说前者增加）、C（说后者减少）\n\n第二步：量级判断（排除 D）\n    13325 亿元，1% 就是 133 亿\n    3% 就是 399 亿左右\n    ⇒ 增量只能是\"300 多亿\"，不可能 4015.10 亿\n    ⇒ D 排除\n\n第三步：算前者（化除为乘 + 把 2.8% 上调成 3%）\n    13325 × (−3%) ≈ −399\n    ⇒ 对应选项里的\"减少约 383 亿元\"\n\n第四步：算后者\n    10.1% ≈ 1/10 ⇒ 增量 = 3664.87 ÷ (10+1) = 3664.87 ÷ 11 ≈ 333\n    ⇒ 对应选项里的\"增加约 337 亿元\"\n\n⇒ 选 B\n```\n\n> ⭐ **\"这种二点八呀，这种说它本身就已经很靠近整数的这个现象，看能不能先把它凑整。本身如果你这些乘数偏小二点八个点，那我就索性把它往上调，变成负的百分之三，这样你去算下来结果后面就会更准一点，也更轻松一点。\"**\n> ⭐ **\"这个题目你直接可以从量级也能判断出来。1% 多，1% 是 100 多，3% 就是 300 多，怎么可能是 4000 呢？\"**\n> ⭐ **\"那增加减少在这里面应该是最容易看出来的，我们只要看它增速的正负，就能判断它是增量是增加还是减少。\"**\n\n**【选项原文】**\n\n- A.前者增加约383亿元，后者减少约337亿元\n- B.前者减少约383亿元，后者增加约337亿元\n- C.前者增加约4015.10亿元，后者减少约2228.61亿元\n- D.前者减少约4015.10亿元，后者增加约2228.61亿元\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **第一步就能砍掉一半选项**：增速符号 = 增减方向。前者 −2.8% 必减，后者 +10.1% 必增。\n- C、D 的数值 4015.10 / 2228.61 其实是题干里的**\"总收入\"**，不是\"累计结余\"，也不是\"增量\"——这是**张冠李戴型概念陷阱**。老师用\"量级\"一句话就否掉了 D。\n- A 与 B 只差\"前者 / 后者\"的增减方向，是典型的**方向对调陷阱**。\n- **陷阱类型：概念陷阱（总收入 vs 累计结余 vs 增量）+ 方向陷阱（增加 / 减少）+ 单位陷阱（亿元）**。\n\n---\n\n### 第21题 2020年脱贫县农村居民人均可支配收入\n\n**【题干原文】**\n\n> 21.2021年，脱贫县农村居民人均可支配收入 14051 元，比上年增长 11.6%，增速比全国农村快 1.1 个百分点。\n>\n> 2020年，脱贫县农村居民人均可支配收入均为（　）元。\n> A.12450　B.12483　C.12591　D.12638\n\n（画面红笔：14051、11.6% 被圈出，旁注 `⇒ 11.1% = 1/9`）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2021年脱贫县农村居民人均可支配收入（现期） | 14051 | 元 |\n| 比上年增长 r | 11.6% | % |\n| 增速比全国农村快 | 1.1 | 个百分点 |\n| 所求 | 2020年脱贫县农村居民人均可支配收入 | 元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求基期量（已知现期 + 增速）；**选项差距极近（12450 / 12483 / 12591 / 12638，相邻只差几十）** |\n| 定位数据 | 现期 14051 元；r = 11.6% |\n| 列式 | `基期 = 现期 ÷ (1 + r) = 14051 ÷ 1.116` |\n| 速算步骤 | ① **不用分数法**！老师明确：\"看到 11.6% 很多同学会想当作 11.1% = 1/9，在大部分题目上没问题，但**这个地方有点问题，因为选项的差距太近了**\"；② 改用**放缩法**：`14051/1.116`，把末尾的 1 去掉（\"1405 这个 1 万不要一个 1，没什么影响\"）→ `1405 / 1116`；③ 分母 `1116` 调到 **111**（减 5，注意\"你别把 1001 去调成 1000，那么调太多了\"）；分子大约是它的 1.3~1.4 倍，所以减 6~7 → **1399**；④ `111 ≈ 1/9` ⇒ 除以 `1/9` = **乘以 9**，用**错位相减**：`1399 ÷ 111 = 139.9 ÷ 11.1 ≈ 148→ 1259`（板书 `1399/111 → 139.9/148 → 1259.0`） |\n| 结论 | 约 1259 元 → **C.12591** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n（不用分数法的理由）\n    11.6% 想凑 11.1% = 1/9 ？——本题选项差距太小，调增速产生的\n    误差很难补回来，\"想把误差控的很准，相对比较麻烦\"\n\n（改用放缩法）\n    14051 ÷ (1 + 11.6%) = 14051 ÷ 1.116\n    去掉末尾无关的 1 → 1405 ÷ 1116\n\n    分母 1116 → 111   （减 5，只减一点点，不能把 1001 调成 1000）\n    分子约为分母的 1.3~1.4 倍 → 减 6 或 7 → 1399\n\n    111 看作 1/9 ⇒ 除以 1/9 = 乘以 9\n    错位相减： 1399 ÷ 111 = 139.9 ÷ 11.1 → 148 → 1259.0\n\n板书原样：\n    1405      1399      139.9\n    ----  →   ----  →   -----  →  1259.0\n    1116      111        148\n       -6       -5\n```\n\n> ⭐ **\"那当我们看到百分之十一点六的时候，其实很多同学都会想着说，我去把它当做百分之十一点一，当做九分之一去算行不行？在大部分题目上是没有问题的，但这个地方有点问题，因为选项的差距太近了。\"**\n> ⭐ **\"那什么标准？要么化除为乘标准，因为它增速很小，误差小；要么就是放缩法。\"**\n> ⭐ **\"这种百分之十几的增速，百分之十左右的增速，用放缩法其实也挺好的，因为它分母上你可以比较好的凑出来那个幺幺幺。\"**\n> ⭐ **\"注意 116，想算的准，那我们这个就要调到小，你别把什么 1001 去调成 1000，那么调太多了。\"**\n> ⭐ **\"放缩优点就是相对来说比较准。\"**\n\n**【选项原文】**\n\n- A.12450\n- B.12483\n- C.12591\n- D.12638\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 精算：`14051 ÷ 1.116 = 12590.5`，正好是 **C.12591**。\n- **本题的核心教学点是\"算法选择由选项间距决定\"**：四个选项相邻差距只有 30~100 元（约 0.3%~0.8%），一旦把 11.6% 调到 11.1%（相差 0.5 个百分点、约 4.5% 的相对误差），算出来可能落到 12000 或 13100，四个选项谁都可能被误选。\n- 放缩法的好处是**误差可控且方向明确**（分母调小 → 结果偏大，可回补），比分数法\"调增速\"更稳。\n- **陷阱类型：算法陷阱（选项近差距时慎用份数法）+ 干扰信息陷阱（\"比全国农村快 1.1 个百分点\"完全不用）**。\n\n---\n\n### 第22题 2022年3-10月化学药品原药当月增量超3万吨的月份数\n\n**【题干原文】**\n\n> 22.2022年3-10月，我国化学药品原药产量当月同比增量超过 3 万吨的月份有几个？（　）\n> A.3　B.4　C.5　D.6\n\n（表头为「2021年11月~2022年10月我国化学药品原药产量及增长情况」，画面红笔在 2022年3月、5月、6月、7月、9月 打√并写\"1\"序号，在 4月、8月、10月 打×）\n\n**【材料数据】**\n\n> 2021年11月~2022年10月我国化学药品原药产量及增长情况\n\n| 日期 | 当月产量（万吨） | 累计产量（万吨） | 当月同比增长（%） | 累计同比增长（%） |\n|---|---|---|---|---|\n| 2021年11月 | 28.1 | 275.7 | 6.8 | 8.7 |\n| 2021年12月 | 31.7 | 308.6 | 8.9 | 8.8 |\n| 2022年1-2月 | – | 51.6 | – | 5.1 |\n| **2022年3月** | **29.1** | 78.9 | **8.2** | 8.7 |\n| **2022年4月** | **28.8** | 108.0 | **6.3** | 7.7 |\n| **2022年5月** | **32.2** | 140.5 | **23.4** | 11.7 |\n| **2022年6月** | **30.6** | 171.0 | **18.6** | 12.6 |\n| **2022年7月** | **26.9** | 197.1 | **13.5** | 12.9 |\n| **2022年8月** | **24.3** | 221.0 | **3.8** | 12.3 |\n| **2022年9月** | **29.3** | 250.5 | **12.7** | 12.8 |\n| **2022年10月** | **30.1** | 285.4 | **4.9** | 13.9 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 增量大小比较（判断是否\"超过 3 万吨\"），**只判断不精算** |\n| 定位数据 | 当月口径：**当月产量** 配 **当月同比增长**（不能用累计列！） |\n| 列式 | `当月增量 ≈ 当月产量 × 当月增速 / (1 + 当月增速)`，只需与 3 比较 |\n| 速算步骤 | ① **能不算就不算**——\"他只要你判断有没有超过三万，并不需要你把这八个月的资料全算出来\"；② 先砍掉明显不可能的**3、4、8、10 月**：3月 `29.1 × 8.2%`、\"29 乘 8 肯定没有到 3，更何况直接拿 29 乘 8 还会偏大 8%\"；**判据是\"30 × 10% 才到 3，你 29 乘 8.2% 怎么可能到\"**；4月同理；8月 24.3 与 3.8%、10月 30.1 与 4.9% 增速都太小；③ 剩下 5、6、7、9 月逐个看：**5月** 现期已超 30、增速 23.4% 远超 10% ⇒ 必超；**6月** 30.6 与 18.6% ⇒ 必超；**7月** 26.9 与 13.5%：先用\"30 除 10 才到 3\"，此处 26.9 约 27，`27 ÷ 9 = 3`，只需增速达到 **12.5%（1/8）** 即够，而 13.5% > 12.5% ⇒ 超；**9月** 29.3 与 12.7%，同样超过 12.5% 的门槛 ⇒ 超 |\n| 结论 | 5、6、7、9 共 **4 个月** → **B.4** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n判据一：什么时候\"产量 × 增速\"能到 3 ？\n    \"30 × 10% 才到 3\"\n    ⇒ 现期不到 30 或增速不到 10%，基本就没戏\n\n3月：29.1、8.2%\n    29 × 8.2%  \u003c 30 × 10% = 3 ，且 29 × 8.2% 本身还偏大 8%\n    ⇒ 一定不超过 3 万吨   ×  排掉\n\n4月：28.8、6.3%      ⇒ 同理排掉  ×\n8月：24.3、3.8%      ⇒ 排掉      ×\n10月：30.1、4.9%     ⇒ 排掉      ×\n\n判据二：现期约 27 时，增速要到多少？\n    27 ÷ 9 = 3\n    27 ÷ 9  ⇔  增速 = 1/8 = 12.5%\n    （\"27 除 9 才是 3，所以只要它的增速能到 12.5% 就行\"）\n\n5月：32.2、23.4%   ⇒ 远超 10%   ✓ 1\n6月：30.6、18.6%   ⇒ 远超 10%   ✓ 2\n7月：26.9、13.5%   ⇒ 13.5% > 12.5%  ✓ 3\n9月：29.3、12.7%   ⇒ 12.7% > 12.5%  ✓ 4\n\n板书原样：\n    29 × 8.2% ／ 30 × 10% = 3\n    30 × 11% = 1/9  → 3\n    12.5% = 1/8\n    26.9 、13.5% 、27\n\n⇒ 5、6、7、9 共 4 个月 ⇒ B\n```\n\n> ⭐ **\"注意是当月的增量，那些就要拿当月的产量，结合它当月的增速去判断它的一个增量有没有超过三万吨。\"**\n> ⭐ **\"注意这边他只要你判断有没有超过三万的，并不需要你把这八个月的资料全算出来。这种不需要你全算出来的东西呢，你就尽量不要算，你就看看能不能通过他的数据去分析，先分析再说，分析不出来再去计算。\"**\n> ⭐ **\"因为 30 乘以 10% 才到 3 啊，这才是 3 啊。你 29 乘以 8.2% 怎么可能到呢？\"**\n> ⭐ **\"26.9，它不就 27 吗？27 除 9 就是 3，所以只要它的增速能到 1/8，12.5% 就行了。\"**\n> ⭐ **\"这样子就基本上没有什么运算量吧，因为它只需要你跟比较跟三这个量的一个大小关系。\"**\n\n**【选项原文】**\n\n- A.3\n- B.4\n- C.5\n- D.6\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 这是本集**最有代表性的一道\"少算多比\"题**：全程只做数量级比较，不做一次真实乘除。\n- 两个阈值口诀：\n  - **阈值一**：现期 ≥ 30 时，增速 ≥ 10% 就能让增量 ≥ 3 万吨（因为 30 × 10% = 3）。\n  - **阈值二**：现期 ≈ 27 时，`27 ÷ 9 = 3` ⇔ 增速 ≈ 12.5%（1/8）。\n- 因此 5 月（32.2 / 23.4%）、6 月（30.6 / 18.6%）、7 月（26.9 / 13.5%）、9 月（29.3 / 12.7%）四个月达标。\n- **陷阱类型：时间陷阱（3-10 月，2021 年 11、12 月与 2022 年 1-2 月不算入）+ 口径陷阱（当月 vs 累计，表格里同时给了两组增速，必须取\"当月同比增长\"）+ 计算陷阱（当成精算题会浪费大量时间）**。\n\n---\n\n### 第23题 2017年全国发电量增量\n\n**【题干原文】**\n\n> 23.2017年全国发电量 6.3 万亿千瓦时，比上年增长 5.7%。\n>\n> 2017年全国发电量比上年约增加多少万亿千瓦时？（　）\n> A.0.21　B.0.34　C.0.49　D.21.9\n\n（画面红笔：6.3、5.7% 被圈出，B 选项被圈）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2017年全国发电量（现期） | 6.3 | 万亿千瓦时 |\n| 比上年增长 r | 5.7% | % |\n| 所求 | 2017年比上年的增加量 | 万亿千瓦时 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（增速 5.7%，属于小增速 → 化除为乘） |\n| 定位数据 | 现期 6.3 万亿千瓦时；r = 5.7% |\n| 列式 | `增长量 = 现期 × r / (1 + r)`；用**提前修正**或**乘法方式**都可 |\n| 速算步骤 | 路线一（提前修正）：把 6.3 先调成与基期更接近的 **6**，同时增速趁势调到 **5.7%**：`6 × 5.7% = 0.342`；\u003cbr>路线二（乘法方式、先不修正）：`6.3 × 5.7%`，一个调成 6、一个调成 `6 × 6% = 0.36` |\n| 结论 | 0.34 → **B** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n路线一：提前修正\n    6.3 → 6      （把现期先调成一个跟基期差不多的量）\n    6 × 5.7% = 0.342\n\n路线二：乘法方式（先不修正误差）\n    \"先让现期乘增速\"，然后一个调成 6、一个调成 0.36\n    6 × 6% = 0.36\n    0.36 也只不过偏大了百分之五点几而已\n\n板书原样：\n    6 × 5.7% = 0.342\n    6.3 × 5.7\n    ------  → 0.36\n      6  × 6\n```\n\n> ⭐ **\"计算增量，就化除为乘，那地方凑整，要么你就直接把 6.3，你先提前修正，变成 6 × 5.7%。\"**\n> ⭐ **\"这个属于提前修正，把 6.3 这个现期先调成一个跟它基期差不多的一个量。\"**\n> ⭐ **\"或者说我先不修正这个误差，我就按乘法方式的角度去想……那零点三六它也只不过就是偏大了百分之五点几而已。\"**\n\n**【选项原文】**\n\n- A.0.21\n- B.0.34\n- C.0.49\n- D.21.9\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 精算：`6.3 × 5.7/105.7 = 0.3397 ≈ 0.34`，正好 **B**。\n- 提前修正的妙处：把现期 6.3 调成 6，同时**没有**单独把增速调小，相当于把\"现期与基期接近\"这一条先满足，误差从两头变成了\"一头\"，方向更好判断。\n- **A.0.21**：把增速当成 3.3% 左右的值；**C.0.49**：把增速当成 7.8% 左右的偏大值；**D.21.9**：把\"万亿千瓦时\"当\"亿千瓦时\"、量级错了 10 倍的典型误值（6.3 × 5.7% = 0.359，乘以 60 才到 21.9）。\n- **陷阱类型：量级陷阱（D 的量级明显离谱）+ 单位陷阱（万亿千瓦时）**。\n\n---\n\n### 第24题 2019年上半年在线政务服务用户增长率\n\n**【题干原文】**\n\n> 24.2019年上半年期间，在线政务服务用户约增长了：\n> A.31%　B.33%　C.29%　D.35%\n\n（图1 为「2017年12月-2020年3月我国在线政务服务用户规模」；画面红笔把 2018.12 的 3.9 和 2019.06 的 5.1 圈出）\n\n**【材料数据】**\n\n> 图1 2017年12月-2020年3月我国在线政务服务用户规模\n> 柱：在线政务服务用户规模（亿人）　折线：占网民整体的比例\n\n| 时间 | 2017.12 | 2018.06 | 2018.12 | 2019.06 | 2020.03 |\n|---|---|---|---|---|---|\n| 用户规模（亿人） | 4.9 | 4.7 | **3.9** | **5.1** | 6.9 |\n| 占网民整体的比例 | 62.90% | 58.60% | 47.50% | 59.60% | 76.80% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长率（已知基期、现期；关键是\"上半年期间\"确定基期位置） |\n| 定位数据 | 上半年期间 = 1月1日 ~ 6月30日 ⇒ 现期 = **2019年6月 = 5.1 亿人**；基期 = **2018年12月 = 3.9 亿人** |\n| 列式 | `r = (现期 − 基期) ÷ 基期 = (5.1 − 3.9) ÷ 3.9 = 1.2 ÷ 3.9` |\n| 速算步骤 | ① 上下同乘 10：`12 ÷ 39`；② 上下都能被 3 整除，先约分：`4/13`；③ 直除：`13√40 → 3.1…` 即 `4/13 ≈ 30.8% ≈ 31%`（板书 `13 ｜ 40 ｜ 39 → 10`）；\u003cbr>④ 也可放缩：`12/39`，下面加 1 到 40（好看），上面按 3 倍关系加 3 → `15/40`，或直接 `12/40 = 0.3`，`123 ÷ 40 = 3.075` 即 30.75% |\n| 结论 | 约 31% → **A** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n关键：上半年期间的\"基期\"在哪？\n    \"上半年前期间就是 1月1号到6月30号\"\n    现期 = 2019年6月 = 5.1\n    基期 = 2019年1月1日 的量 = 2018年12月31日 的量 = 2018年12月 = 3.9\n    （\"一月一号的量，它其实就是十二月三十一号的量，这是统计里面；\n      你可以把它想成一月一号凌晨零点钟刚过来的一秒钟那个时候的量\"）\n\nr = (5.1 − 3.9) ÷ 3.9 = 1.2 ÷ 3.9\n\n（1）约分法\n    1.2/3.9 = 12/39  （上下都是 3 的倍数）\n          = 4/13\n    直除：13 ｜ 40 ｜ 39 → 3.1…\n    ⇒ ≈ 30.8% ≈ 31%\n\n（2）放缩法\n    下面加 1 → 40（倍数关系好看）\n    上面大概是 3 倍关系 → 加 3 → 123\n    123 ÷ 40 = 3.075  ⇒ 30.75%\n\n板书原样：\n    1.2         6.30\n    ----        ----\n    3.9  1.2     5.1\n       13｜40 → 4/13\n```\n\n> ⭐ **\"上半年前期间就是1月1号到6月30号。那现期好找啊，一九年六月份五点一。那基期在哪呢？一月一号的量，它其实就是十二月三十一号的量。\"**\n> ⭐ **\"所以它的基期其实是一八年的十二月份，这才叫上半年期间的一个增长。\"**\n> ⭐ **\"3.9看到这个半年怎么从3.9涨到5.1的？那么它的增速就是等于增量除以基期……上下呢，它都是 3 的倍数，这个时候你可以先化简一下，把它变成 13 分之 4。\"**\n\n**【选项原文】**\n\n- A.31%\n- B.33%\n- C.29%\n- D.35%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **本题最大的坑是\"基期到底取哪一根柱子\"**：题问\"2019 年上半年期间增长了\"，起算点是 2019 年 1 月 1 日，而 1 月 1 日的存量就等于 2018 年 12 月的存量 3.9，所以基期是 2018.12，不是 2018.06（4.7）。\n  - 若误取 2018.06 的 4.7：`(5.1 − 4.7)/4.7 = 8.5%`，四个选项都不对，说明取法有误。\n- 精算：`1.2/3.9 = 30.77%`，与 A.31% 吻合。\n- **B.33% / D.35%**：把分母当成 3.6 或 3.4 的误差值；**C.29%**：分母偏大的误值。\n- **陷阱类型：时间陷阱（上半年期间的基期 = 上年 12 月）+ 图表陷阱（柱形图与折线的双口径，\"占网民整体比例\"是干扰数据）**。\n\n---\n\n### 第25题 2020年农村居民人均可支配收入增量\n\n**【题干原文】**\n\n> 25.2020年，农村居民人均可支配收入 17131 元，比上年增长 6.9%。\n>\n> 2020年农村居民人均可支配收入比上年增长了（　）。\n> A.1106元　B.1182元　C.651元　D.1927元\n\n（画面红笔圈出 17131 与 6.9%；A 选项被圈，左侧批一个大 A）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年农村居民人均可支配收入（现期） | 17131 | 元 |\n| 比上年增长 r | 6.9% | % |\n| 所求 | 2020年比上年增长量 | 元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（增速小 → 化除为乘 + 乘法放缩） |\n| 定位数据 | 现期 17131 元；r = 6.9% |\n| 列式 | `增长量 = 现期 × r / (1 + r)`，用化除为乘简化为 `现期 × r` |\n| 速算步骤 | ① **本例无法提前修正**：\"这六点九个点，你不管在现期上还是增速上，都不好把它往下调到一个整数上去\"；② 直接用**乘法放缩**：`17131 × 6.9%`，位数多就凑整，`17131 → 17000`、`6.9% → 7%`，`170 × 7 = 119`（即 1190）；③ **牢记现期 × 增速的结果偏大**（\"我们这个调整它只是乘法放缩……它的结果跟增量相比，跟具体的增量相比，还是偏大百分之六点九的\"）；④ 所以要往下减约 7 个点：`1190 × 7% ≈ 84`，`1190 − 84 = 1106` |\n| 结论 | 1106 元 → **A** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n（1）为什么不提前修正？\n    \"这六点九个点，你不管在现期上还是增速上，都不好把它\n      往下调到一个整数上去\"\n\n（2）乘法放缩\n    17131 × 6.9%  →  17000 × 7%\n    170 × 7 = 119   （即 1190）\n\n（3）误差方向提醒\n    \"现期 × 增速\"的结果一定偏大（这里偏大约 6.9%）\n    ⇒ 要选一个比 1190 小大约 7 个点的数\n\n（4）修正\n    1190 × 7% ≈ 84\n    1190 − 84 = 1106\n\n板书原样：\n    171 × 6.9%\n    ↓      ↓\n    170 × 7%  = 1190\n                  −7%\n                  -84\n                  -----\n                   1106\n```\n\n> ⭐ **\"那就直接想的就是 171 乘以百分之六点九……位数是比较多，我们可以用乘法放缩，多把它想成 170 × 7%。\"**\n> ⭐ **\"如果我们只用现期乘增速，应该是 1190 左右。然后有同学选 B 了，别忘了呀，我们这个调整它只是乘法放缩，只是在现期乘增速的条件下去做了一个调整，没有改变这个乘法式子的大小。\"**\n> ⭐ **\"所以你要选一个比这个 1190 小大概 7 个点左右的数……其实就是要用 1200 乘百分之七，12 乘 7 是 84，减 84 就变成 1106 了。\"**\n> ⭐ **\"这个一定要记得你的现期乘以增速，结果会偏大的，这个点一定要记得。\"**\n\n**【选项原文】**\n\n- A.1106元\n- B.1182元\n- C.651元\n- D.1927元\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- 精算：`17131 × 6.9/106.9 = 1105.7 元`，正好 **A.1106**。\n- **B.1182** 就是未减误差的 1190 附近的干扰项，这正是老师说的\"有同学选 B 了\"。\n- **C.651**：把增速当 3.8% 左右；**D.1927**：相当于没做\"(1+r)\"的修正、甚至放大——都是典型的\"方向/量级\"错。\n- **陷阱类型：误差方向陷阱（现期 × 增速必偏大，必须往小修）+ 计算陷阱（增速不整时不要硬做提前修正，直接乘法放缩更快）**。\n\n---\n\n### 第26题 2020年医院诊疗人次降幅\n\n**【题干原文】**\n\n> 26.2020年，全国医疗卫生机构总诊疗人次达 77.4 亿人次，比上年减少 9.8 亿人次。其中，医院 33.2 亿人次，基层医疗卫生机构 41.2 亿人次，其他医疗卫生机构 3.0 亿人次。与上年比较，医院诊疗人次减少 5.2 亿人次，基层医疗卫生机构诊疗人次减少 4.1 亿人次。\n>\n> 2020年医院诊疗人次比2019年下降了约（　）。\n> A.11.2%　B.12.7%　C.13.5%　D.15.7%\n\n（画面红笔圈出 77.4、9.8、33.2、5.2；C 选项被画线）\n\n> ⚠️ 转写在此处念成\"基层医疗卫生机构诊疗人次减少 3.4 亿人次\"，**画面原文为 4.1 亿人次**，以画面为准。\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年全国医疗卫生机构总诊疗人次 | 77.4 | 亿人次 |\n| 比上年减少 | 9.8 | 亿人次 |\n| 其中：医院 | 33.2 | 亿人次 |\n| 基层医疗卫生机构 | 41.2 | 亿人次 |\n| 其他医疗卫生机构 | 3.0 | 亿人次 |\n| 医院诊疗人次比上年减少 | 5.2 | 亿人次 |\n| 基层医疗卫生机构诊疗人次比上年减少 | 4.1 | 亿人次 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长率（已知现期 + 增量，注意是**下降率**） |\n| 定位数据 | 医院：现期 33.2 亿人次；增量 −5.2 亿人次 |\n| 列式 | `r = 增量 ÷ 基期`，其中 `基期 = 现期 − 增量 = 33.2 + 5.2 = 38.4` ⇒ `r = −5.2 ÷ 38.4` |\n| 速算步骤 | ① `−5.2/38.4`，上下同乘 10 → `−52/384`；② 下面加 16 凑成 **400**（倍数关系更好看），上面按\"520 比 384 多一点点、一倍多一点\"的比例也加 20 → `−540/400`；③ `540 ÷ 4 = 135` ⇒ **−13.5%** |\n| 结论 | 下降约 13.5% → **C** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\nr = 增量 ÷ 基期\n  增量 = −5.2 亿人次\n  基期 = 33.2 + 5.2 = 38.4   （\"原来呢是 38.4 减了 5.2 才会变成 33.2\"）\n\nr = −5.2 / 38.4\n\n放缩：\n    -5.2     -52      -520      -540\n    ----  =  ----  =  ----  →  ----\n    38.4     384       384       400\n                        +16      +20\n    （下面加 16 凑成 400；上面按\"520 比 384 多一点点，\n      一倍多一点点\"的比例，加 20）\n\n540 ÷ 4 = 135  ⇒  −13.5%\n\n板书原样：\n    r = Δ/基 = −5.2/38.4 = −520/384 = −540/400 = −13.5\n```\n\n> ⭐ **\"先讲到它的现期、基期，或者增量，看有没有什么数据能去算它的一个增速。\"**\n> ⭐ **\"给了你现期，给了你增量，那你算增速，增速等于增量除以基期。\"**\n> ⭐ **\"上面给它加个 0，相同位数的话，你这个倍数关系更好看一点，我可以给下面加一个 16，把它变成 400。\"**\n\n**【选项原文】**\n\n- A.11.2%\n- B.12.7%\n- C.13.5%\n- D.15.7%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 精算：`5.2/38.4 = 13.54%`，完全对应 **C.13.5%**。\n- **两大坑**：\n  1. **基期不是 33.2**。题目给的是\"减少了 5.2 亿人次\"，要先把减少量加回去得到基期 `38.4`，再用 `Δ ÷ 基期`。\n  2. **题干给的 77.4 / 9.8 / 41.2 / 3.0 / 4.1 全是干扰数据**，本题只需\"医院 33.2\"与\"减少 5.2\"两个数。\n- 若误用 `5.2/33.2 = 15.7%`，正好命中 **D.15.7%**——这是本题设计好的错误选项，**分母用错**就会选 D。\n- **陷阱类型：概念陷阱（分母用现期还是基期）+ 范围陷阱（一堆无关数据混淆定位）+ 时间陷阱（2020 比 2019）**。\n\n---\n\n### 第27题 2019年1-6月规上工业企业利润总额\n\n**【题干原文】**\n\n> 27.2020年1-6月，全国规模以上工业企业实现利润总额 25114.9 亿元，同比下降 12.8%。\n>\n> 2019年1-6月，全国规模以上工业企业实现利润总额约为（　）。\n> A.22265.0亿元\n> B.22965.1亿元\n> C.28357.2亿元\n> D.28801.5亿元\n\n（画面红笔圈出 25114.9 与 12.8%，右侧批注 `⇒ 1/8`；D 选项被圈）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年1-6月全国规模以上工业企业实现利润总额（现期） | 25114.9 | 亿元 |\n| 同比变化 | 下降 12.8% | % |\n| 所求 | 2019年1-6月利润总额（基期） | 亿元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求基期量（已知现期 + 下降率） |\n| 定位数据 | 现期 25114.9 亿元；r = −12.8% ≈ −1/8 |\n| 列式 | `基期 = 现期 ÷ (1 + r) = 25114.9 ÷ (1 − 12.8%) = 25114.9 ÷ 0.872` |\n| 速算步骤 | ① 把 12.8% 看作 **1/8**：\"八份减一份 → 七份\"，即 `现期 = 基期 × 7/8` ⇒ `基期 = 现期 × 8/7`；② `25114.9 ÷ 7 ≈ 3587.8 ≈ 3600`（板书 `251/7 ≈ 36 → 3600`）；③ `3600 × 8 = 28800`，或直接 `25114.9 × 8 ÷ 7 ≈ 28702.7` |\n| 结论 | 约 28801.5 亿元 → **D** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n12.8% ≈ 1/8\n    基期 8 份，减少 1 份，现期 7 份\n    ⇒ 现期 = 基期 × 7/8\n    ⇒ 基期 = 现期 × 8/7\n\n25114.9 ÷ 7 ≈ 3587.8 ≈ 3600\n3600 × 8 = 28800\n\n（板书竖式： 7 ｜ 251 → 36； 21；41）\n板书原样：\n    8 − 1 = 7\n    251 / 7 ≈ 3600\n    3600 × 8 = 28800  →  D.28801.5\n\n另一帧板书：\n    = 28714   ⇒ ≈ 28800\n```\n\n> ⭐ **\"看到 12.8%，就把它当做负的八分之一……那么八份减一份，注意是减变成七份，这个千万不要除以九，是除的是七。\"**（此句为第 28 题同类表述，第 27 题同法）\n> ⭐ 第 27 题的核心一句：**\"8 − 1 = 7，251 除以 7 大概就是 3600。\"**\n\n**【选项原文】**\n\n- A.22265.0亿元\n- B.22965.1亿元\n- C.28357.2亿元\n- D.28801.5亿元\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- 精算：`25114.9 ÷ 0.872 = 28801.5 亿元`，与 **D** 分毫不差。\n- **本题的\"死亡陷阱\"是分母方向**：\n  - 正确：下降 12.8% ⇒ `基期 = 现期 ÷ 0.872 > 现期`，答案一定**大于 25114.9**。\n  - 若把 12.8% 当成 1/8 后写成 `25114.9 ÷ (8/7) = 21975`，则会误选 A 或 B（这正是 A.22265.0 / B.22965.1 的设置意图）。老师原话：\"**注意是减变成七份，这个千万不要除以九，是除的是七**\"。\n- **C.28357.2**：是用 `25114.9 ÷ 0.8857`（即把 12.8% 调小）得到的偏小值。\n- **陷阱类型：概念陷阱（下降率下基期 > 现期）+ 分数法方向陷阱（除以 8/7 vs 乘以 8/7）**。\n\n---\n\n### 第28题 2020年1-8月轻工8种重点商品出口额增量\n\n**【题干原文】**\n\n> 28.2020年轻工8种重点商品出口额 3621.0 亿美元，同比增长 7.0%。\n>\n> 2020年轻工8种重点商品出口额比2019年多（　）亿美元。\n> A.236.9　B.253.5　C.271.2　D.490.4\n\n（画面红笔：3621.0 与 7.0% 被画线；A 选项被圈，左侧批大 A）\n\n**【材料数据】**\n\n| 指标 | 数值 | 单位 |\n|---|---|---|\n| 2020年轻工8种重点商品出口额（现期） | 3621.0 | 亿美元 |\n| 同比增长 r | 7.0% | % |\n| 所求 | 2020年比2019年多出的金额（增量） | 亿美元 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长量（增速小 → 化除为乘 + 乘法放缩） |\n| 定位数据 | 现期 3621.0 亿美元；r = 7.0% |\n| 列式 | `增长量 = 现期 × r / (1 + r)`，化为 `3621 × 7.0%` 后再做误差回补 |\n| 速算步骤 | ① `3621 → 36`（降一个量级），`36 × 7 = 252`（板书 `36/7 = 252`）；② 判方向：这是\"现期 × 增速\"，结果**偏大约 7 个点**；③ 补误差：200 多的 7 个点 ≈ 16 → `252 − 16 = 236` |\n| 结论 | 约 236 亿美元 → **A.236.9** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n36 × 7 = 252        （3621 降量级取 36，7% 取 7）\n\n但这个结果偏大了 7 个点（\"现期 × 增速\"必然偏大）\n要减掉 200 多的 7 个点 ≈ 15~16\n\n252 − 16 = 236\n\n板书原样：\n        3600\n        4 7\n      ---------\n        2.52 ✕  −7%\n         16\n         236\n```\n\n> ⭐ **\"计算增量，就化除为乘，直接 36 × 7 = 252。但是这个结果它是稍微偏大了那么一点点的，稍微偏大了 7 个点。\"**\n> ⭐ **\"有同学说，老师，你这个 3621 变成 3600，这一步会不会已经把它误差变小了？不怕你，你算一下嘛，3621 到 3600，你就只减了个 21，左右百分之一都不到。\"**\n> ⭐ **\"而你实际算的结果，如果你只用 3600 去乘的话，你是要往下降 7 个点的。你现在只不过在现期上只降了不到 1 个点，那其实你应该还是再往下降几个点的。\"**\n\n**【选项原文】**\n\n- A.236.9\n- B.253.5\n- C.271.2\n- D.490.4\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- 精算：`3621.0 × 7/107 = 236.9 亿美元`，正好 **A.236.9**。\n- **B.253.5** = `3621 × 7%` 的未修正值，是最大的诱惑项（老师专门解释\"有同学选 B 了，别忘了你这个调整只是乘法放缩\"）。\n- **C.271.2**：把增速当成 8% 或未修正再放大；**D.490.4**：把基期算成 2019 年再算 13% 之类的大幅偏离值。\n- 老师还专门回应了\"3621→3600 这一步是不是已经补偿过误差了\"的疑问：**降 21（约 0.6%）远远不够抵消 7 个点的偏差**，所以还得再减。\n- **陷阱类型：误差方向陷阱（现期 × 增速必偏大）+ 选项诱惑陷阱（B 就是未补偿的结果）**。\n\n---\n\n### 第29题 2023年一季度大型商业银行总负债环比\n\n**【题干原文】**\n\n> 29.2023年一季度，大型商业银行总负债比上季度约：\n> A.增长了3%　B.增长了7%\n> C.减少了3%　D.减少了7%\n\n（表头为「2023年全国部分商业银行资产负债金额及同比增速」，单位：万亿元（金额），%（增速）；画面红笔在\"一季度\"列与\"四季度\"列打勾、在四季度总负债 162.9 旁写 `2.9`）\n\n**【材料数据】**\n\n> 2023年全国部分商业银行资产负债金额及同比增速\n> 单位：万亿元（金额），%（增速）\n\n| 类别 | 项目 | 一季度 | 二季度 | 三季度 | 四季度 |\n|---|---|---|---|---|---|\n| 大型商业银行 | 总资产 金额 | 166.42 | 171.53 | 173.26 | 176.76 |\n| 大型商业银行 | 总资产 增速 | 13.95 | 13.29 | 12.08 | 13.12 |\n| 大型商业银行 | **总负债 金额** | **153.3** | 158.45 | 159.78 | **162.9** |\n| 大型商业银行 | **总负债 增速** | **14.52** | 13.77 | 12.44 | **13.52** |\n| 股份制商业银行 | 总资产 金额 | 68.92 | 69.56 | 69.59 | 70.98 |\n| 股份制商业银行 | 总资产 增速 | 7.53 | 6.98 | 6.72 | 6.65 |\n| 股份制商业银行 | 总负债 金额 | 63.37 | 64.01 | 63.94 | 65.1 |\n| 股份制商业银行 | 总负债 增速 | 7.62 | 7.02 | 6.76 | 6.62 |\n| 城市商业银行 | 总资产 金额 | 52.03 | 53.33 | 54.28 | 55.2 |\n| 城市商业银行 | 总资产 增速 | 11.46 | 11.05 | 11.39 | 10.66 |\n| 城市商业银行 | 总负债 金额 | 48.21 | 49.43 | 50.29 | 51.13 |\n| 城市商业银行 | 总负债 增速 | 11.84 | 11.33 | 11.67 | 10.75 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求增长率（环比），但**缺\"上季度\"数据，需要绕道求基期** |\n| 定位数据 | 大型商业银行总负债：一季度 153.3（现期）；四季度 162.9 与增速 13.52%（用来反推 2022 年四季度） |\n| 列式 | ① 求上季度（2022 年四季度）：`162.9 ÷ (1 + 13.52%)`；② 求环比增速：`153.3 ÷ 上季度 − 1` |\n| 速算步骤 | ① 表内只到 2023 年，求 2022 年四季度要\"**围魏救赵**\"：用四季度数据反推；② `163 ÷ 1.135`，十几出头的增速适合**放缩法**，把分母凑成 `1111`：`1630/1135`，下面减 24、上面按 1.5 倍关系减 36 → `1600/1111`；③ `1600 ÷ 1111` 用错位相减 ≈ **144**（即 2022 年四季度总负债约 144 万亿）；④ `153.3 ÷ 144 − 1 = 9.3 ÷ 144`（板书圈出 `9.3/144`），9.3 是 144 的 6.5% 左右，明显超过 3 个点、接近 7 个点 |\n| 结论 | 约增长 7% → **B** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n问题：2023年一季度 比 上季度（2022年四季度）\n      但表里只有 2023 年四个季度的数据 ⇒ 必须\"围魏救赵\"\n\n第一步：用 2023年四季度 反推 2022年四季度（即\"上季度\"）\n    第四季度总负债 = 162.9，同比增速 = 13.52%\n    基期 = 162.9 ÷ (1 + 13.52%) ≈ 163 ÷ 1.135\n\n    放缩（分母凑 1111）：\n        1630     -30/-36      1600\n        ----  →  ---------  →  ----\n        1135     -24          1111\n       （下面减 24，上面约为 1.5 倍关系，减 36）\n    错位相减：1600 ÷ 1111 ≈ 144  → 144\n\n第二步：算环比增速\n    一季度 153.3  比  上季度 144\n    增长量 = 153.3 − 144 = 9.3\n    9.3 ÷ 144 ≈ 6.5%  （\"肯定不可能减少，而且这个也很明显\n                        超过三个点，七个点差不多\"）\n\n板书原样：\n    -30        1600\n    1630   →   ----   →  144\n    1135   →   1111\n    -24\n\n    144 〇\n    9.3\n    ---  →  153.3\n    144\n```\n\n> ⭐ **\"23年的一季度，大型商业银行总负债金额有了，那现在差什么？差它上季度，也就是22年的四季度。想知道这个季度是多少，怎么算呢？那只能通过这里的四季度去围魏救赵，去间接的把它算出来。\"**\n> ⭐ **\"163 除以 1135，直接可以放缩运算，因为这种 10 几出头一点的增速，它比较适合用放缩法，比较适合把分母直接划成 1111。\"**\n> ⭐ **\"那一季度呢是 153.3，就看这个 153.3 比上个季度这个 144 增长了百分之多少？增长了 9.3，9.3 除以 144，虽然肯定增长不可能减少，而且这个也很明显超过三个点，七个点差不多，所以选择 B 选项。\"**\n\n**【选项原文】**\n\n- A.增长了3%\n- B.增长了7%\n- C.减少了3%\n- D.减少了7%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 精算：`162.9 ÷ 1.1352 = 143.5`；`153.3 ÷ 143.5 = 6.84% ≈ 7%`，与 **B** 吻合。\n- 本题的**结构性难点在于\"数据缺口\"**：求解需要\"2022 年四季度\"，而表格只给 2023 年四个季度。老师的解法是用 2023 年四季度的**同比增速 13.52%** 反推出 2022 年四季度（表注单位为\"同比增速\"，这一点必须读清）。\n- **先定性再定量**：环比是 153.3 vs 144，**是正的、且明显大于 3%**，可直接排除 C、D 两个\"减少\"选项；A.3% 与 B.7% 之间，9.3/144 ≈ 6.5% 明显偏向 7%。\n- **陷阱类型：时间陷阱（环比 vs 同比；\"上季度\"= 2022 年四季度）+ 表格陷阱（增速是同比增速，不是环比增速）+ 范围陷阱（股份制商业银行、城市商业银行的整块数据都是干扰）**。\n\n---\n\n### 第30题 2017年甲市房间空气调节器产量\n\n**【题干原文】**\n\n> 30.2017年，甲市房间空气调节器产量约为（　）万台。\n> A.181.3　B.239.3　C.269.5　D.292.4\n\n（表头为「2018年甲市规模以上工业企业主要产品产量及其增长速度」；画面红笔框住\"房间空气调节器 万台 263.2 −10.0\"一行，D 选项被圈）\n\n**【材料数据】**\n\n> 2018年甲市规模以上工业企业主要产品产量及其增长速度\n\n| 产品名称 | 单位 | 绝对数 | 比上年增长（%） |\n|---|---|---|---|\n| 原煤 | 万吨 | 3516.3 | -0.6 |\n| 汽油 | 万吨 | 181.2 | -14.5 |\n| 天然气 | 亿立方米 | 384.8 | 8.3 |\n| 发电量 | 亿千瓦小时 | 3499.4 | 6.9 |\n| 铁矿石原矿量 | 万吨 | 10044.2 | -18.6 |\n| 生铁 | 万吨 | 1978.6 | 4.2 |\n| 钢 | 万吨 | 2400.7 | 18.7 |\n| 成品钢材 | 万吨 | 2896.6 | 19.4 |\n| 十种有色金属 | 万吨 | 78.8 | 15.8 |\n| 农用氮磷钾化学肥料 | 万吨 | 369.5 | -1.7 |\n| 饲料 | 万吨 | 1492.0 | 9.2 |\n| 食用植物油 | 万吨 | 200.2 | 3.3 |\n| 白酒 | 万千升 | 358.3 | 14.0 |\n| 啤酒 | 万千升 | 221.4 | 10.2 |\n| 卷烟 | 亿支 | 755.2 | 2.9 |\n| 纱 | 亿吨（画面如此显示） | 73.0 | 7.3 |\n| 布 | 亿米 | 15.6 | 1.5 |\n| 化学纤维 | 万吨 | 86.2 | 4.5 |\n| 彩色电视机 | 万台 | 1001.5 | 13.6 |\n| 家用电冰箱 | 万台 | 85.3 | 2.6 |\n| **房间空气调节器** | **万台** | **263.2** | **-10.0** |\n| 水泥 | 万吨 | 13748.7 | 6.2 |\n| 平板玻璃 | 万重量箱 | 5384.1 | -0.5 |\n| 中成药 | 万吨 | 28.2 | -3.7 |\n| 汽车 | 万辆 | 137.8 | -4.2 |\n| 电力电缆 | 万千米 | 281.3 | -0.3 |\n| 电子计算机整机 | 万台 | 6307.9 | 16.8 |\n| 移动通信手持机（手机） | 万台 | 9437.0 | 155.2 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求基期量（已知现期 + 下降率 −10%，增速极为整齐） |\n| 定位数据 | 2018年房间空气调节器产量 263.2 万台，比上年增长 −10.0% |\n| 列式 | `基期 = 现期 ÷ (1 + r) = 263.2 ÷ (1 − 10%) = 263.2 ÷ 0.9` |\n| 方法一 | 除以 0.9 = 除以 9 后**错位相加**：`263.2 ÷ 9` → `263.2 + 26.32 = 289.5`；但\"除以 9 的错位相加是**偏小百分之一**的\"，所以要补回去：`289.5 + 2.9 ≈ 292.4` |\n| 方法二 | 用增速当**份数**：−10% = −1/10 ⇒ 十份减一份得九份，**减少量 = 现期的 1/9**；`263.2 ÷ 9 = 28.95 ≈ 29`；`263.2 + 29 = 292.2` |\n| 结论 | 约 292.4 万台 → **D** |\n\n**老师的完整速算板书（代码块还原）**\n\n```\n方法一：期 ÷ (1 + 增速)\n    263.2 ÷ 0.9 ＝ 263.2 ÷ 9 的\"错位相加\"\n    错位相加： 263.2 + 26.32 = 289.5\n    ⚠ 除以 9 的错位相加是偏小 1% 的\n    ⇒ 补 2.9 左右： 289.5 + 2.9 = 292.4\n\n板书原样：\n    263.2        263.2\n    -----  ＝   -----  →  289.5   ⇒ 292.4\n     0.9          9\n     \"不能直接选 C，因为除以九的错位相加，它是偏小百分之一的\"\n\n方法二：用增速当份数\n    −10% = −1/10  ⇒ 十份减一份＝九份\n    减少量 = 现期的 1/9\n    263.2 ÷ 9 = 28.95 ≈ 29\n    263.2 + 29 = 292.2\n\n板书原样：\n    10 − 1 = 9\n    263.2\n    ----- = 28.95 ≈ 29\n      9\n    263.2 + 29 = 292.2   →  D.292.4\n```\n\n> ⭐ **\"后面是两种方法，一种就是我们说的现期除以一加增速，一种就是用增速去估增量，然后用现期减去这个增量就好了。两种方法都可以，因为这个增速太整了。\"**\n> ⭐ **\"这种负 10% 也除过 0.9，除个 9 就错位相加，就很快。2632 错位相加 263，得到 2895。这 C 是不是一模一样？但是能直接选吗？不能，因为除以九的错位相加，它是偏小百分之一的，怎么会这么巧，他又正正好好的。你要把这百分之一再加上去，加个 2.9 左右，变成 292.4，所以选 D。\"**\n> ⭐ **\"下面这个为什么我不用去管这个错位相加的百分之一？因为我的计算对象它已经不是两百多了，它的是二十多。这种百分之一换到这个两百多里面，相当只有百分之零点一，这种误差呢就很小了。\"**\n> ⭐ **\"两种方法都可以，不影响，只要你对整个计算过程中的误差了然于胸，胸有成竹，就不会错。\"**\n\n**【选项原文】**\n\n- A.181.3\n- B.239.3\n- C.269.5\n- D.292.4\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- 精算：`263.2 ÷ 0.9 = 292.44 万台`，正是 **D.292.4**。\n- **本题是全集的收官\"教学题\"，演示了误差的双重把控**：\n  1. 方法一（÷0.9 错位相加）算出的 289.5 **偏小 1%**，若不补偿就会**正好撞上 C.269.5 附近的思维误区**（老师原话\"怎么会这么巧，他又正正好好的\"）；\n  2. 方法二（用减少量）算出的量级是\"二十多\"，误差折算到最终结果里只有 0.1%，**可以忽略**——所以方法二不用补偿。\n- **C.269.5** 是\"只除以 9、没做错位相加\"或\"没补偿\"的误值；**B.239.3** 相当于把 −10% 当 −18% 左右；**A.181.3** 相当于把降幅当 −31%。\n- **陷阱类型：计算陷阱（错位相加的 1% 系统偏差）+ 概念陷阱（下降率下基期 > 现期）+ 选项陷阱（C 与错位相加结果接近，诱导不补偿）**。\n\n---\n\n## 三、本讲知识点总表\n\n| 题型 | 识别特征 | 列式 | 首选算法 | 本集例题 |\n|---|---|---|---|---|\n| 求增长量 | 已知\"现期 + 增速\"，问\"增加多少 / 多多少\" | `增量 = 现期 × r / (1 + r)` | 增速小 → **化除为乘**：`现期 × r`；增速可凑简单分数 → **份数法** | 14、15、18、19、23、25、28 |\n| 求基期量 | 已知\"现期 + 增速\"，问\"上年 / 去年是多少\" | `基期 = 现期 ÷ (1 + r)` | 十出头增速 → **放缩法**（分母凑 111 / 1111）；增速极整（如 −10%）→ **除以 0.9 错位相加**或**份数法** | 17、21、27、29、30 |\n| 求增长率（含降幅） | 已知\"现期 + 增量\"，问\"增长 / 下降百分之几\" | `r = 增量 ÷ (现期 − 增量)`（下降时增量取负） | **放缩法**（分母凑整百） | 24、26 |\n| 求总体量（比重反推） | 已知\"部分量的基期 + 部分占总体的比重\" | `总体 = 部分 ÷ 比重` | 先求部分基期（放缩法），再用**比重 ≈ 简单分数**（12.6% ≈ 1/8） | 16 |\n| 增量比较 / 是否超阈值 | 问\"有几个超过 X\" | 阈值反推：`现期 × r ≥ X` | **只比不算**，先排明显不可能，再用阈值口诀 | 22 |\n| 环比（数据缺失） | 问\"比上季度\"，但表内没有上季度 | 用高季度的**同比增速**反推上一年同季，再求环比 | **放缩法 + 围魏救赵** | 29 |\n\n---\n\n## 四、速算口诀与解题流程\n\n### 4.1 算法选择决策树（本集总纲）\n\n```\n看题目问什么\n├─ 问\"增加/减少多少\"（增量）\n│   ├─ 增速 \u003c 10%        → 化除为乘：增量 ≈ 现期 × 增速\n│   │                      （先凑整，再回补误差）\n│   └─ 增速能凑简单分数  → 份数法：\n│                          r = 1/n  ⇒ 增量 = 现期 ÷ (n+1)\n│                          r = m/n  ⇒ 增量 = 现期 × m/(m+n)\n│\n├─ 问\"上年/上季度是多少\"（基期）\n│   ├─ 选项差距小（几十元级别）→ 必须用放缩法，别用份数法\n│   ├─ 增速约 10%~12%         → 放缩法：分母凑 111 / 1111，再错位相减\n│   └─ 增速极整（如 −10%）    → 除以 0.9 错位相加 或 份数法（十份减一份）\n│\n├─ 问\"增长/下降百分之几\"（增长率）\n│   └─ r = 增量 ÷ 基期，其中 基期 = 现期 − 增量（下降时增量取负）\n│      用放缩法把分母凑成 400 之类的整百数\n│\n├─ 问\"有几个超过某阈值\"（比较）\n│   └─ 先分析、后计算：能不算就不算\n│      阈值反推：现期 ≥ 30 且增速 ≥ 10% ⇒ 增量 ≥ 3（对\"超 3 万吨\"）\n│\n└─ 问\"比上季度\"（环比，但表里没有上季度）\n    └─ 围魏救赵：用下一年同季的同比增速反推上季度，再算环比\n```\n\n### 4.2 三个\"凑整\"手法（本集反复出现）\n\n| 手法 | 做法 | 适用 | 例题 |\n|---|---|---|---|\n| **互补凑整** | 现期变小 ↔ 增速变大，误差方向相反、互相抵消 | 两边都差一点点就能凑整时 | 14（141178→140000，5.38%→5.4%） |\n| **只调一头** | 现期本来很整就**不动现期**，只调增速 | 现期离整数极近（如 8996→9000） | 15、18、23 |\n| **降量级凑整** | 现期直接降一个量级（3621→36、17131→170、25114.9→251） | 位数太多、无法精确凑整时 | 19、25、27、28 |\n\n### 4.3 必须记住的分数—百分数对照（本集用到的）\n\n```\n1/7  ≈ 14.3%        13.5% 约等于 1/7\n1/8  = 12.5%        12.6% ≈ 1/8（12.5%）\n1/9  ≈ 11.1%        11.1% = 1/9 ；11.6% 可近似 1/9（但选项近时慎用）\n1/10 = 10%          10.1% ≈ 1/10\n1/11 ≈ 9.09%\n2/3  ≈ 66.7%        68.37% ≈ 2/3\n```\n\n### 4.4 本集反复强调的两条\"误差定律\"\n\n```\n定律一：现期 × 增速 的结果一律\"偏大\"\n        ⇒ 要往下降（19、25、28 题都靠这条救命）\n\n定律二：除以 9 的\"错位相加\"一律\"偏小 1%\"\n        ⇒ 要往上补（30 题）\n        但若计算对象是\"二十多\"而非\"二百多\"，1% 折算后仅 0.1%，可忽略\n```\n\n> ⭐ **\"两种方法都可以，不影响，只要你对整个计算过程中的误差了然于胸，胸有成竹，就不会错。\"**\n\n### 4.5 通用解题流程（本集 17 题全部适用）\n\n| 步 | 动作 | 要点 |\n|---|---|---|\n| 1 | 读时间 | 现期是哪个时间？所求是现期、基期还是增量？（上半年→基期取上年12月；比上季度→数据可能缺失） |\n| 2 | 定题型 | 增量 / 基期 / 增长率 / 比重反推 / 比较 |\n| 3 | 看增速 | 增速 \u003c 10%？能凑简单分数？约 10%~12%？极整（±10%）？ |\n| 4 | 看选项 | **选项差距近 → 弃份数法、上放缩法** |\n| 5 | 选算法 | 查 4.1 决策树 |\n| 6 | 凑整算 | 互补凑整 / 只调一头 / 降量级 |\n| 7 | 补误差 | 判断偏大偏小，往反方向补回，再对选项 |\n| 8 | 交卷 | 不放心时可用第二种方法互证 |\n\n---\n\n## 五、易错点与陷阱清单\n\n| 编号 | 陷阱类型 | 具体表现 | 对应例题 | 破解方法 |\n|---|---|---|---|---|\n| 1 | **时间陷阱** | 问 2013 年给的却是 2014 年数据；\"上半年期间\"的基期在**上年 12 月**；\"比上季度\"但表里只有本年度 | 17、24、29 | 先圈\"现期时间\"和\"所求时间\"，再定位数据 |\n| 2 | **概念陷阱** | 百分点 vs 百分数（13.1% 提高 0.5 个百分点 ⇒ 12.6%）；下降率下**基期 > 现期**；增长率 vs 增长量 | 16、26、27 | 百分点直接加减；下降时基期 = 现期 + 减少量 |\n| 3 | **概念陷阱** | \"总收入\" ≠ \"累计结余\" ≠ \"增量\" | 20（C、D 项） | 量级一眼否决（1% 才 133 亿，3% 才 399 亿） |\n| 4 | **口径陷阱** | 表格同时给\"当月同比增长\"与\"累计同比增长\"；\"货物运输量\" vs \"货物周转量\" | 22、18 | 看清问的是\"当月\"还是\"累计\"；单位是\"万吨\"还是\"亿吨公里\" |\n| 5 | **单位/量级陷阱** | 亿吨 ↔ 万吨（差 1 万倍）；亿 ↔ 万亿；亿元 ↔ 万亿元 | 19、23、16 | 算完先看量级是否离谱 |\n| 6 | **误差方向陷阱** | \"现期 × 增速\"偏大却直接选；把结果调小的同时又去调现期 | 19、25、28 | 记住定律一，往反方向补；一次只动一个地方 |\n| 7 | **分数法方向陷阱** | 12.8% 看成 1/8 后写错成除以 9 或 8/7 用反 | 27 | 下降 ⇒ 基期 = 现期 × 8/7；\"八份减一份是七份\" |\n| 8 | **算法选择陷阱** | 选项差距极近（12450/12483/12591/12638）时仍用份数法调增速 | 21 | 选项近 ⇒ 只上放缩法；除非增速本来就不需要调 |\n| 9 | **定位陷阱** | 题干给一大堆无关数据（77.4 / 9.8 / 41.2 / 3.0 / 4.1 全是干扰）；表格里其他类别整块无关 | 26、29、16 | 只找题目真正需要的那 2~3 个数 |\n| 10 | **系统偏差陷阱** | 除以 9 的错位相加偏小 1%，不补偿会\"正好\"撞上干扰项 | 30（C.269.5） | 记住定律二，按量级决定是否补偿 |\n| 11 | **能算却硬算陷阱** | 判\"有没有超过 3 万吨\"却把 8 个月全算一遍 | 22 | 先分析后计算，先排明显不可能 |\n| 12 | **干扰信息陷阱** | \"增速比全国农村快 1.1 个百分点\"、\"增幅比其他制造业高出 11.5 个百分点\"在本题用不到 | 21、16 | 用不到就别用，别自造计算 |\n\n---\n\n## 六、老师金句\n\n> ⭐ **\"在计算机期或者增量的时候，我们主要要看增速有什么特点去选择计算方式。\"**\n\n> ⭐ **\"可是那七千五就算往下降五个点，也就只能降三四百，还是会比七千要多的。\"**（第 14 题）\n\n> ⭐ **\"你压根都不需要算出来它是多少，我就知道它是一个十四开头一点点的东西，就乘一个五多一点的东西，那就是七千多一点的东西。你起码到 16 乘以 5 才能到 80 嘛。\"**（第 14 题）\n\n> ⭐ **\"那这个时候我们要不去调这个现期，不用去调，因为它本身就很整……我们只不过是把增速降低了。后面如果我们要调误差，我们在最后的结果上再去调就好了。\"**（第 15 题）\n\n> ⭐ **\"12.6% 是什么？就是 1/8 嘛。\"**（第 16 题）\n\n> ⭐ **\"你不管用哪个去除一八都行。你只要把这个增速知道，只要知道把这个现期调成一个稍微好算一点的小数，一百六、一百七，你觉得哪个快，谁都能去算。\"**（第 17 题）\n\n> ⭐ **\"我们计算的这个东西，对于他问我们这个东西占比很小……就算它有百分之十的误差，我们是不可能出现这么大的误差的。我不可能把一个二十七的东西算成二十，这有起码 30 个点了。\"**（第 17 题）\n\n> ⭐ **\"这种不需要你全算出来的东西呢，你就尽量不要算，你就看看能不能通过他的数据去分析，先分析再说，分析不出来再去计算。\"**（第 22 题）\n\n> ⭐ **\"因为 30 乘以 10% 才到 3 啊，这才是 3 啊。你 29 乘以 8.2% 怎么可能到呢？\"**（第 22 题）\n\n> ⭐ **\"它只需要你跟比较跟三这个量的一个大小关系，所以就基本上没有什么运算量。\"**（第 22 题）\n\n> ⭐ **\"一月一号的量，它其实就是十二月三十一号的量，这是统计里面。\"**（第 24 题）\n\n> ⭐ **\"这个一定要记得你的现期乘以增速，结果会偏大的，这个点一定要记得。\"**（第 25 题）\n\n> ⭐ **\"那只能通过这里的四季度去围魏救赵，去间接的把它算出来。\"**（第 29 题）\n\n> ⭐ **\"两种方法都可以，不影响，只要你对整个计算过程中的误差了然于胸，胸有成竹，就不会错。\"**（第 30 题）\n\n> ⭐ **\"误差的奇妙的地方。\"**（第 17 题）\n\n> ⭐ **\"好，第三节课的课后作业就要讲到这里。\"**（本集收尾原话）\n\n---\n\n## 附：本集题目速查表\n\n| 题号 | 材料主题 | 现期值 | 增速 | 所求 | 答案 |\n|---|---|---|---|---|---|\n| 14 | 2020年全国人口 | 141178 万人 | +5.38% | 增长量区间 | **C** |\n| 15 | 2019年6月地方政府债券 | 8996 亿元 | +68.37%＝2/3 | 增长量 | **C** |\n| 16 | 2015年高技术制造业利润 | 7233.7 亿元 | +165.5% | 2010年制造业利润总额 | **C** |\n| 17 | 2014年某市城镇消费品零售 | 178.6 亿元 | +13.5% | 2013年基期 | **B** |\n| 18 | 2014年1-11月民航周转量 | 168.7 亿吨公里 | +8.8% | 增长量 | **A** |\n| 19 | 2024年一季度F市货运 | 2.09 亿吨 | +2.6% | 增长量（万吨） | **C** |\n| 20 | 2020年末G省两项保险结余 | 13325.14 / 3664.87 亿元 | −2.8% / +10.1% | 两量增量 | **B** |\n| 21 | 2021年脱贫县农村居民收入 | 14051 元 | +11.6% | 2020年基期 | **C** |\n| 22 | 化学药品原药产量（当月） | 见表 | 见表 | 增量超 3 万吨的月数 | **B** |\n| 23 | 2017年全国发电量 | 6.3 万亿千瓦时 | +5.7% | 增长量 | **B** |\n| 24 | 在线政务服务用户规模 | 5.1 亿人 | — | 上半年增长率 | **A** |\n| 25 | 2020年农村居民收入 | 17131 元 | +6.9% | 增长量 | **A** |\n| 26 | 2020年医院诊疗人次 | 33.2 亿人次 | 减少 5.2 亿 | 降幅 | **C** |\n| 27 | 2020年1-6月规上工业利润 | 25114.9 亿元 | −12.8%≈−1/8 | 2019年基期 | **D** |\n| 28 | 2020年轻工8种重点商品出口 | 3621.0 亿美元 | +7.0% | 增长量 | **A** |\n| 29 | 2023年一季度商业银行负债 | 153.3 万亿元 | 四季度同比 13.52% | 环比增速 | **B** |\n| 30 | 2018年甲市房间空气调节器 | 263.2 万台 | −10.0% | 2017年基期 | **D** |\n\n**本集共讲解作业题 17 道（第 14 题 ~ 第 30 题），覆盖完整、无遗漏。**\n\n---\n\n> **画面与转写差异备注（便于复核）**\n> 1. 第 26 题，转写念成\"基层医疗卫生机构诊疗人次减少 3.4 亿人次\"，**画面原文为 4.1 亿人次**（且本题不用该数据）。\n> 2. 第 28 题，题目原文是\"**2020年轻工8种重点商品出口额**\"，转写只念\"8种重点商品\"；数值画面显示为 **3621.0 亿美元**。\n> 3. 第 18 题，表格标题与题干年份的数字在部分帧被红笔圈遮挡，**画面读作 2014 年**（表头「2014年1-11月我国货物运输情况」）。\n> 4. 转写中若干同音字已按画面订正：`限期 → 现期`、`机器 → 基期`、`笔中/比重 → 比重`、`画出微尘/画出一层/画出围城 → 化除为乘`、`放松法/放缩预算 → 放缩法`、`尾成/微成 → 修正`、`进个六 → 补个 6`。\n> 5. 第 21 题题干原文为\"2020年，脱贫县农村居民人均可支配收入**均为**（　）元\"，\"均为\"二字按画面照录。\n> 6. 第 30 题材料表中\"纱\"的**单位画面显示为\"亿吨\"**（与其他纺织类产品的\"万吨\"量级不符），此处按画面照录，未作改动。","outline":[{"level":2,"text":"一、本集概览：这一集到底讲什么","id":"一本集概览这一集到底讲什么"},{"level":3,"text":"1.1 网格 ↔ 题号对照表（画面地图）","id":"11-网格-题号 ","items":[{"id":"P11","title":"增速的累积与拆分（上）","full":"资料分析第五课 增速的累积与拆分（上）","lect":"","dur":"55:36","sec":3336,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 11 集\n\n# 资料分析第五课 增速的累积与拆分（上）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 11 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=11`\n> **时长**：55 分 36 秒\n> **本集主题**：**增速的累积与拆分（上）**——把\"乘积增长率 / 平均数增长率 / 间隔增长率\"统一成**一件事**：怎样把两次增速**累积**成一个整体增速，以及怎样把一个整体增速**拆分**回其中一段。\n> 上半场先补讲**份数法微调的三个注意点**（负增速大慎用份数法、快速估算偏差比例用哪个做分母、提前修正后不能乱减），再正式进入 **增速的累积**（间隔增长率 + 乘积增长率，含完整公式推导），并配 2 道真题；下半场讲 **增速的拆分**（平均数增长率 / 间隔增长率的逆运算），配 2 道真题。\n\n---\n\n## 讲义目录页（本讲四大模块）\n\n画面「**目 录 CATALOGUE**」页（老师在页面上画了连线）：\n\n| 序号 | 模块 | 讲义下方小字 |\n|---|---|---|\n| 壹 | **乘积增长率** | 增速的累积 |\n| 贰 | **平均数增长率** | 增速的拆分 |\n| 叁 | **间隔增长率** | 另一种形式的累积与拆分 |\n| 肆 | **比值变化关系** | 平均数增长率基础应用 |\n\n> 老师页面手写批注（画面）：把「壹 乘积增长率」的\"增速的累积\"与「叁 间隔增长率」一起圈出并连线——**两者本质是同一件事**；把「贰 平均数增长率」的\"增速的拆分\"圈出——**它是累积的逆运算**；再从「贰」引一条箭头指向「肆 比值变化关系」，说明**肆是平均数增长率的进一步应用**。\n\n> 老师原话：\n> \"今天我们这个增速的累积与拆分，主要就是四块，除了四块，其实是两块：一个是我们学会怎么去把这个增速累积起来，以及怎么把这个增速拆分下来。**间隔增长率其实本身就是（乘积）增长率和平均数增长率的一个共通的东西**，也是增速的累积跟拆分。\"\n> \"以及增速的拆分的一个基础应用——比值它是在怎么变化。我们今天把这几个东西（算三个东西）给它学明白了。\"\n\n> 说明：本集（上）只讲到 **壹、贰、叁** 三个模块（结尾停在\"平均数谁除谁\"的口诀上），**肆「比值变化关系」未在本集展开**。\n\n---\n\n## 目录\n\n- [讲义目录页（本讲四大模块）](#讲义目录页本讲四大模块)\n- [一、开篇复习：份数法微调的三个注意点](#一开篇复习份数法微调的三个注意点)\n  - [1.1 微调公式回顾（板书）](#11-微调公式回顾板书)\n  - [1.2 注意点①：负增速较大时，谨慎使用份数法](#12-注意点负增速较大时谨慎使用份数法)\n  - [1.3 注意点②：快速估算偏差比例方法](#13-注意点快速估算偏差比例方法)\n  - [1.4 注意点③：提前修正后，减增量要用\"原始限期\"](#14-注意点提前修正后减增量要用原始限期)\n- [二、例题精讲（第一部分：份数法微调）](#二例题精讲第一部分份数法微调)\n  - [第 1 题｜2022 年 1~4 月 · 珠江水系四省水路客运量](#第-1-题2022-年-14-月--珠江水系四省水路客运量)\n  - [第 2 题｜2019 年第一季度 · 131 家证券公司代理买卖证券业务净收入](#第-2-题2019-年第一季度--131-家证券公司代理买卖证券业务净收入)\n- [三、增速的累积（乘积增长率 / 间隔增长率）](#三增速的累积乘积增长率--间隔增长率)\n  - [3.1 引入：小明和秘书的故事](#31-引入小明和秘书的故事)\n  - [3.2 定义：增速的累积](#32-定义增速的累积)\n  - [3.3 两大场景：时间间隔 vs 主体相乘](#33-两大场景时间间隔-vs-主体相乘)\n  - [3.4 数值验证：100 → 110 → 121，累计 21%](#34-数值验证100--110--121累计-21)\n  - [3.5 公式推导（板书全抄）](#35-公式推导板书全抄)\n  - [3.6 运算纪律：第一步加法要精准，第二步乘法要估算](#36-运算纪律第一步加法要精准第二步乘法要估算)\n- [四、例题精讲（第二部分：增速的累积）](#四例题精讲第二部分增速的累积)\n  - [第 3 题｜2021 年 1—4 月 · 某省第一产业用电量（间隔增长率）](#第-3-题2021-年-14-月--某省第一产业用电量间隔增长率)\n  - [补充：不是\"隔一年\"也能用（环比例）](#补充不是隔一年也能用环比例)\n  - [第 4 题｜2021 年 · 我国各类镁产品出口总金额（乘积增长率）](#第-4-题2021-年--我国各类镁产品出口总金额乘积增长率)\n  - [4.1 变式：材料给\"倍数\"，就直接乘](#41-变式材料给倍数就直接乘)\n- [五、增速的拆分（平均数增长率）](#五增速的拆分平均数增长率)\n  - [5.1 核心思想：知二求一，累计的反运算](#51-核心思想知二求一累计的反运算)\n  - [5.2 公式推导（板书全抄）](#52-公式推导板书全抄)\n- [六、例题精讲（第三部分：增速的拆分）](#六例题精讲第三部分增速的拆分)\n  - [第 5 题｜2021 年 1-2 月 · 全国商品房销售面积（间隔增长率拆分）](#第-5-题2021-年-1-2-月--全国商品房销售面积间隔增长率拆分)\n  - [6.1 变式：给倍数就直接除](#61-变式给倍数就直接除)\n  - [第 6 题｜2014 年 · 全国棉花单位面积产量（平均数增长率拆分）](#第-6-题2014-年--全国棉花单位面积产量平均数增长率拆分)\n  - [6.2 方向口诀：谁除谁](#62-方向口诀谁除谁)\n- [七、本讲知识点总表](#七本讲知识点总表)\n- [八、速算口诀与解题流程](#八速算口诀与解题流程)\n- [九、易错点与陷阱清单](#九易错点与陷阱清单)\n- [十、老师金句](#十老师金句)\n\n---\n\n## 一、开篇复习：份数法微调的三个注意点\n\n> 老师开篇原话：\n> \"在上这节课之前，我们还需要一点点时间，把上一节课第四节课我们快速估算那一部分、关于份数法的使用上，我再做一点提醒。\"\n> \"有些同学可能在上节课做完课后作业的时候就会有一些类似的问题，所以就做一个集中的解释。\"\n\n本集封面页板书标题为「**增速的累积与拆分**」（画面 `g_001`，第 1~7 格为封面）。\n\n### 1.1 微调公式回顾（板书）\n\n画面（「**份数法微调注意点**」页）板书公式：\n\n```\nr ≈ 1/n\n\n              算Δ × ( r − 1/n )\n实际Δ = 算Δ + ─────────────────\n                   1 + r\n```\n\n| 符号 | 含义 |\n|---|---|\n| `r` | 材料给出的**实际增速** |\n| `1/n` | 份数法取用的**近似分数**（如 −50% = `−1/2`、13.77% 附近取 14.3% = `1/7`） |\n| `算Δ` | 用 `1/n` 估出来的增量 |\n| `实际Δ` | 真实增量 |\n\n> 老师讲：\"昨天讲的，你如果想用份数法算一个实际增量，是在这个**估算的增量**上去进行调整的。一个是你把估算的增量算出来之后，你需要根据**这个增速差值的比例**去把这个算出来的增量进行一个微调；然后这个调的误差，你是要去**除一个一加 r** 的。\"\n\n### 1.2 注意点①：负增速较大时，谨慎使用份数法\n\n画面板书：**① 负增速较大时，谨慎使用份数法**（老师在该行右侧手写两个字：「**放缩**」）。\n\n> 老师原话：\n> \"如果题目的负增速它比较大，大家尽量谨慎使用这个分数法，甚至可以说尽量不要用。比较大的负增速，就算你觉得好像蛮靠近百分之五十的，我也建议你用什么？**用放缩**，准确一点。\"\n> \"为什么大的负增速建议大家谨慎使用分数法呢？就要是因为这个分母 `1+r`，如果你这个 r 是一个比较大的**负增速**，那这个分母它的影响就非常大了。\"\n\n**对比说明（板书推演）：**\n\n```\n【正增速·小】r 由 12.8% 变成 12.5%\n  → 无非就是少除了个 1.128\n  → 误差很小，影响不大\n\n【负增速·大】r 由 −76% 看成 −75%（只差 1 个百分点）\n  → 但这一步少算的，变成了「除以 1 − 76% = 0.24」\n  → 除 0.24 就等于乘以 4 ≈ 乘以四\n  → 误差直接变成原来的 1/4，这就有点大了\n\n【正增速·中】54% 看成 50%（差 4 个百分点）\n  → 4% 是 50% 的 8%（这就是\"凭什么是 8%\"的来历）\n  → 只不过少除了 1.54，除 1.54 就乘个三分之二\n  → 只是少了个 1/3，跟\"少了个 3/4\"完全没法比\n```\n\n> 老师原话：\n> \"**正增长量其实还好**……（正增速）你哪怕把百分之五十四看成百分之五十，也不过就是后面的那个增量本来要乘以 8% 的……你只不过就是少除了 1.54，这个东西就影响还好。\"\n\n**\"多大算大\"——老师的判断标准：**\n\n| 判断依据 | 说明 |\n|---|---|\n| 选项差距 | 选项之间差距小，就不敢用份数法 |\n| 实际增速与份数增速的差距 | 两者差得越多，误差越大 |\n| **经验阈值** | **一般建议超过 30% 就要稍微小心**（因为份额开始除以\"零点六级\"了，整体会有比较大的影响） |\n\n> ⭐ 老师金句：\"**分数法，你要么就把它算得很准，要么你就是把它当做一个简单的估算。如果题目的要求精度比较高，我是不太建议你去用分数法的。**\"\n\n画面底部小字提示：\n\n> 注意点：此过程过于繁琐，因此**份数思想不需要追求完全精准**，尽量使用份数思想**快速解决低精度问题**。\n\n### 1.3 注意点②：快速估算偏差比例方法\n\n画面板书：**② 快速估算偏差比例方法**。\n\n**核心一句话：拿\"两个增速的差\"去除\"你假设的那个 1/n\"，不是除实际增速。**\n\n配合第 1 题看：实际增速 −47.6%，假设 `−50% = −1/2`，差值 `2.4%`，\n\n```\n偏差比例 = 2.4% / 50% = 4.8%\n（50% 是 1/2，除 50% 相当于 ×2，所以 2.4% ÷ 50% = 4.8%）\n```\n\n> 老师原话：\n> \"我们是拿这个 2.4% 去除这个 50% 的。就说 2.4% 在这个 50% 里面，占比除以 50%——50% 是二分之一，相当于乘以二，百分之四点八。**不是除这个 47.6%，是除这个 50%**。\"\n> \"首先它本身就是这样算下来就是准的，你除这个 50%，然后再除这个溢价（1+r），它就是准的，它这个地方是个**等于号，是没有误差的**，你就应该去除它。而且除它还有个好处就是——**快**。\"\n\n### 1.4 注意点③：提前修正后，减增量要用\"原始限期\"\n\n第三个注意点由老师在讲第 2 题时口述强调（画面标题为「**份数思想—提前修正**」）：\n\n> 老师原话：\n> \"如果你用那个份数微调的时候，要有个注意点……有些人他会犯一个什么问题呢？我来演示一下，然后你们看问题出在哪。\"\n\n**错在哪里（老师当堂演示）：**\n\n- 提前修正时，把**限期**也顺手改了（221 看成 220，再减到 210）；\n- 算出来的增量 `Δ = 26.3` 是**\"限期 210、增速 14.3%\"**这个平行组合下的增量；\n- 但**限期本身没有变**，它只是\"找了一个平行的数据来代替计算\"；\n- 所以**基期必须用原始限期去减**，不能用被修正过的 210 去减。\n\n> ⭐ 老师原话：\"**限期是没有变的，限期是没有改的，我们只是找了一个平行的数据来代替计算。**\"\n\n---\n\n## 二、例题精讲（第一部分：份数法微调）\n\n### 第 1 题｜2022 年 1~4 月 · 珠江水系四省水路客运量\n\n**【题干原文】**\n\n> 2022 年 1~4 月，珠江水系四省累计完成水路客运量 499 万人次、旅客周转量 12785 万人公里，同比分别下降 47.6%、53.9%。\n>\n> 2022 年 1~4 月，珠江水系四省累计完成水路客运量与去年相比减少约多少万人次：\n> A. 395　　B.436　　C.453　　D.514\n\n**【材料数据】**\n\n| 指标 | 2022 年 1~4 月累计值 | 同比增速 |\n|---|---|---|\n| 水路客运量 | 499 万人次 | −47.6% |\n| 旅客周转量 | 12785 万人公里 | −53.9% |\n\n（本题问的是**客运量**的减少量，旅客周转量是干扰项。）\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 负的同比增速，求**减少量**（负增长量） |\n| 定位数据 | 客运量 499 万人次，增速 −47.6% |\n| 列式 | 减少量 = 现期 − 基期 = 499 − 499/(1 − 47.6%) |\n| 速算步骤 | ① 份数法估：−50% = `−1/2` → `2 − 1 = 1` → 算Δ = 499\u003cbr>② 偏差比例：`2.4% ÷ 50% = 4.8%`\u003cbr>③ 微调丢失的一步：再除以 `(1 − 47.6%) = 0.524`\u003cbr>④ 499 − 24/0.524 = 499 − 46 ≈ 453 |\n| 结论 | ✅ C |\n\n**【选项原文】**\n\n- A. 395\n- B. 436\n- C. 453\n- D. 514\n\n**【答案】** ✅ **C**（画面中老师在 C 上打勾）\n\n**【解析】**\n\n**① 份数法直接算会错（画面板书全抄）：**\n\n```\n−50% = −1/2\n2 − 1 = 1\n算Δ = 499                       ← 若 r 真是 −50%，减少量就是现期的 1 倍\n2.4 / 50 = 4.8%                 ← 偏差比例（分母用假设的 50%，不是 47.6%）\n499 − 499 × 4.8%                ← 499 ≈ 500，500 × 4.8% = 24\n499 − 24 = 475\n```\n\n> 老师原话：\"一算怎么感觉你这个（和）453 差这么多呢，这算的也太不准了吧。**问题出在哪儿？问题就出在你漏了这一步。**\"\n\n**② 补上\"除以 (1+r)\"这一步（画面板书全抄）：**\n\n```\n          算Δ × ( r − 1/n )              24\n实际Δ = 算Δ + ─────────────────  ⇒  499 − ────\n                 1 + r                    0.524\n                                    = 499 − 46\n                                    = 453\n```\n\n**③ 老师推荐的解法：直接放缩（画面板书全抄）**\n\n```\n499 / (1 − 47.6%) = 499 / 0.524\n放缩：分母 524 减 24 得 500；分子 499 相应减 23 得 476\n      476 / 500 = 0.952  ⇒  499 / 0.524 ≈ 952\n减少量 = 952 − 499 = 453\n```\n\n> 老师原话：\n> \"所以我遇到这种负增速比较大的时候，我就给他去**放缩**嘛，直接放缩不就好了吗？**只有放缩是让我最安心的。**\"\n> \"我们昨天课上讲的什么化除为乘、分数法，它主要是个估算……分数法只是个估算，精算就像刚才那样比较麻烦，你不如放缩，你看你放缩，其实很快的。\"\n> \"你看放缩的这种负的比较大的这种负增速的情况下，是非常好用的。\"\n\n**陷阱类型**：**精度陷阱 + 单位陷阱**——负大增速下，份数法微调的误差被分母 `1+r` 放大（本例约 4 倍），少除一步就会算成 475；同时材料并列给出了旅客周转量的 −53.9%，属于典型的口径干扰（问的是\"客运量\"，不是\"旅客周转量\"）。\n（画面中老师先在 A、B 下打了问号，最终在 C 上打勾。）\n\n---\n\n### 第 2 题｜2019 年第一季度 · 131 家证券公司代理买卖证券业务净收入\n\n**【题干原文】**\n\n> 2019 年第一季度，131 家证券公司代理买卖证券业务净收入（含席位租赁）221.49 亿元，同比增长 13.77%。\n>\n> 2018 年第一季度，131 家证券公司代理买卖证券业务净收入（含席位租赁）约为：\n> A.184.6 亿元　　B.190.1 亿元　　C.194.7 亿元　　D.204.2 亿元\n\n**【材料数据】**\n\n| 年份 | 代理买卖证券业务净收入（含席位租赁） | 同比增速 |\n|---|---|---|\n| 2019 年第一季度 | 221.49 亿元 | 13.77% |\n| 2018 年第一季度 | 待求 | — |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增速，求**基期值**（基期 = 现期 ÷ (1+r)） |\n| 定位数据 | 现期 221.49 亿元，r = 13.77% |\n| 列式 | 基期 = 221.49 ÷ 1.1377 |\n| 速算步骤 | ① 13.77% → 取最近百化分 **14.3% = 1/7**（画面：`13.77% → 14.3%`）\u003cbr>② **提前修正**：现期 220 减 10 变 210（把\"加 5 的增速\"与\"减 10 的限期\"配成一对平行数据）\u003cbr>③ 增量 `Δ = 210 ÷ 8 = 26.3`\u003cbr>④ **用原始限期减增量**：221 − 26 ≈ 195（≈ 220 − 26 = 194） |\n| 结论 | ✅ C |\n\n**【选项原文】**\n\n- A. 184.6 亿元\n- B. 190.1 亿元\n- C. 194.7 亿元\n- D. 204.2 亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n**① 老师演示的\"错解\"（画面板书全抄）：**\n\n```\n13.77% → 14.3% = 1/7（取最近的百化分）\n          13.8 ─→ +5 ─→ 14.3 = 1/7\n现期提前微调：220 − 10 = 210\n\nΔ = 210 / 8 = 26.3\n基期 = 210 − 26.3 = 184        ← 错！正好落到 A.184.6\n（画面在 A 上打叉）\n```\n\n> 老师原话：\"刚才把 A 走掉了。（这是）一个什么样的问题呢？这个问题出在哪？\"（随后老师当场指出\"你算的 26.3 算的是增量……限期是没有变的\"。）\n\n**② 正确做法（画面板书全抄）：**\n\n```\n26 ↓  195          ← 用原始限期 221 去减增量 26\n                     （老师又用 220 去减：220 − 26 = 194）\n⇒ 选 C.194.7 亿元\n```\n\n> 老师原话：\n> \"你算的 26.3 算的是增量，这个增量确实是个 210 的增量，但是**这个 210 的增量只是用来去平替我们上面这个 220 的增量的，限期是 220 啊**。\"\n> \"**限期是没有变的，我们只是找了一个平行的数据来代替计算。所以你要用这个（原始 221）去减，用 221 减 26，减下来是 195。这个一定要注意，千万别犯在这个错误上去。**\"\n\n**陷阱类型**：**过程陷阱**——\"提前修正\"同时动了两个变量（增速调大、限期调小），把两个平行数据配成一对以抵消误差；但**参与最终减法的限期必须是原始真实限期**。\n\n---\n\n## 三、增速的累积（乘积增长率 / 间隔增长率）\n\n### 3.1 引入：小明和秘书的故事\n\n画面标题：**增速的累积**。原文照抄：\n\n> 小明公司体制改革两年了，想知道这次改革给公司带来了多大的提升。于是小明找到秘书问了一下这两年公司营业额增长了多少。\n>\n> 秘书就跟小明汇报：\n> \"老板，今年我们公司营业额与去年相比**同比增长了 10%**，去年也是和前年相比**同比增长了 10%**。\"\n>\n> 结果小明是个暴发户，没学过我们今天这节课的内容，就给秘书骂了一顿：\n> \"我问的是这两年增长了多少，你一年一年的告诉我干什么！\"\n\n> 老师原话：\n> \"我问的是这两年一共涨多少，他这一年一年并不是整体的一共一个增速。所以秘书就应该利用我们今天要学的东西——**增速的累积**——去尝试着把这两年的增速给合并起来，来告诉老板从前年到今年两年一共涨了多少。\"\n\n### 3.2 定义：增速的累积\n\n画面原文：\n\n> **增速的累积，就是将同一个主体的两段增长情况累积为一次完整的增长。**\n\n> 老师原话：\"我们这个（今天讲的）叫增速的累积，那是一个具体的数字，如果我们把它转化成一个公式，怎么去描述呢？\"\n\n### 3.3 两大场景：时间间隔 vs 主体相乘\n\n画面（同一页分为上下两个色块）：\n\n| 场景 | 画面原文 | 本质 |\n|---|---|---|\n| **间隔增长率** | 营业收入 2024 年同比增长 10%，2025 年同比增长 10%，则 2025 年比 2023 年增长多少？ | **有时间来间隔，时间是不同的**——同主体、跨时间的两段增速 |\n| **乘积增长率** | 总支出 = 人数 × 人均支出，2025 年人数同比增长 10%，人均支出同比增长 10%，则总支出增长多少？ | **没有时间上的间隔**——一个数据跟另一个数据、不同主体的**沉积（相乘）关系** |\n\n> 老师原话：\n> \"增速累积主要有两种场景：一种场景就是我们刚刚聊的这个间隔增长率，这种呢就是**以时间为间隔**，它的特点是有时间来间隔，时间是不同的。\"\n> \"还有一种应用场景，它不太一样，它没有时间上的间隔，它是一个数据跟数据、不同主体的这样一个**沉积**的关系……**跟复利很像**。\"\n\n### 3.4 数值验证：100 → 110 → 121，累计 21%\n\n**间隔增长率（画面板书全抄）：**\n\n```\n       23     ← 100（假设 23 年营业额 100 块）\n10% ↗\n       24     ← 100 × 1.1 = 110\n10% ↗\n       25     ← 110 × 1.1 = 121\n\n从 100 到 121，两年一共涨了 21%\n⇒ 可以直接说：25 年比 23 年涨了 21%\n```\n\n**乘积增长率（画面板书全抄）：**\n\n```\n24 年：10000 = 10（人） × 1000（元/人）\n25 年：人数 10 → 11（+10%），人均 1000 → 1100（+10%）\n       12100 = 11 × 1100\n       总支出 10000 → 12100，也涨了 21%\n```\n\n> 老师原话：\n> \"咋这么巧呢？这边一个涨 10%，这边一个涨 10%，合起来是 21%；这儿涨 10%，这也涨 10%，合起来还是 21%。是巧合吗？……**其实不是的，其实就是因为他们本质上都是把两次百分之十的一个变化，一起推倒到了最终的结果上。**\"\n> \"你想想看，第一次 10% 让这个 100 涨了 10%，第二次 10% 又让这个东西再涨了 10%，就相当于在这个 100 的基础上，先乘个 `(1+10%)`，扩大了；到了 25 年的时候，又乘了一次 `(1+10%)`，再扩大了。\"\n> \"总支出 = 人数 × 人均。如果只是人数增加了 10%，这个结果也会扩大 10%……人均也涨了 10%，它的增长也一样**会传导到最终的结果上**，会让它再乘一个 `(1+10%)`。所以总的支出也是原来的（基础上）成了两次 `(1+10%)`，所以他们的关系是一样的。\"\n> \"所以他们这两次变化对最终的结果带来的影响是一致的，因为都是对同一个东西搞了两次变化，**把这两次变化累积起来了**。\"\n\n### 3.5 公式推导（板书全抄）\n\n画面右侧板书给出的总结式：\n\n```\n则累积增速 r = r1 + r2 + r1 × r2\n```\n\n**推导一：间隔增长率（画面板书全抄）**\n\n```\n间隔增长率：营业收入 2024 年同比增长 r1，2025 年同比增长 r2，则 2025 年比 2023 年增长多少？\n\n25 = 24 × (1 + r2)\n24 = 23 × (1 + r1)\n\n⇒ 25 = 23 × (1 + r1) × (1 + r2)\n     = 23 × ( 1 + r2 + r1 + r1 × r2 )\n\n  25\n ──── = 1 + r1 + r2 + r1 × r2 = 1 + r(23→25)\n  23\n\n⇒ r(23→25) = r1 + r2 + r1 × r2\n```\n\n> 老师原话：\n> \"把这个式子展开就等于 23 年乘以 `(1+r1)(1+r2)`，这种括号的这种加号法相乘，就是我们交替相乘得结果，交替相乘再相加——一先乘一，一再乘以 r2，加上 r1 再乘以 1，再加上 r1 再乘以 r2。\"\n> \"所以我们就能得到原来 25 年跟 23 年的比值，它是等于 `1 + r1 + r2 + r1×r2`。那是比值吧，比值是什么？比值是**一加增速**嘛。所以这个 23 到 25 的增速就是把这个 1 给它去掉呗——`r1 + r2 + r1×r2`。\"\n\n**推导二：乘积增长率（画面板书全抄）**\n\n```\n乘积增长率：总支出 = 人数 × 人均支出\n           2025 年人数同比增长 r1，人均支出同比增长 r2，则总支出增长多少？\n\n25支出     25人 × 25人均     25人     25人均\n─────  =  ─────────────  =  ───── × ─────\n24支出     24人 × 24人均     24人     24人均\n\n       = (1 + r1) × (1 + r2)\n       = 1 + ( r1 + r2 + r1 × r2 )\n\n⇒ 总支出的增速 = r1 + r2 + r1 × r2\n```\n\n> 老师原话：\n> \"两个相乘除、两个相乘，我们可以把它单独拆下来，就等于 25 年的人数除以 24 年的人数，再乘以 25 年的人均除以 24 年的人均。那 25 的人数除以 24 的人数，这不就是一个 `1+增速` 吗？25 的人均除以 24 的人均，这也是一个增速，也是个 `1+增速`。\"\n> \"这本质上就是把这个东西两次变化、`(1+r1)(1+r2)` 给它一乘，把你们的 `r1 + r2 + r1×r2` 给它拆出来。**本质上都是一样的，就是两次变化累积到了一起。**\"\n> \"24 年的变化、25 年的变化，全部堆到一起，堆成了这个 23 年到 25 年的一个增长。人数的变化和人均支出的变化全部累积到了**总支出**一个人的头上，让总支出涨了两次，把这两次变化合为一次。\"\n\n### 3.6 运算纪律：第一步加法要精准，第二步乘法要估算\n\n> 老师原话（**重要口诀**）：\n> \"我们先干嘛呢？**先加**。为什么我们不去先算这个乘法呢？因为这个加法，首先第一**它重要、它大**，因为你往往碰到那些增速全是一些什么百分之十几、百分之二十几小数字，他们俩乘起来更小；**第二好算了**，加多好算，**营养又大，那肯定先加嘛**。\"\n> \"然后你再加后面这个东西……这边第二步这个地方**一定要估算**，你可以记个笔记：**第一步这个加法，你尽量精准，因为它好算**，你加一下就好了，你不要去在这个地方偷懒；**后面那个你要尽量估算**，为什么要估算？因为**它的影响小**。\"\n> \"乘法的估算就是用**乘法放缩**，把它去两边凑个整。\"\n\n---\n\n## 四、例题精讲（第二部分：增速的累积）\n\n### 第 3 题｜2021 年 1—4 月 · 某省第一产业用电量（间隔增长率）\n\n**【题干原文】**\n\n> 2021 年 1—4 月份，某省全社会用电量 284.59 亿千瓦时，同比增长 7.9%。从不同产业看，第一产业用电量 6.36 亿千瓦时，同比增长 29%，增速比上年同期提高 6.2 个百分点。\n>\n> 与 2019 年同期相比，2021 年 1—4 月该省第一产业用电量增长了约（　）。\n> A.46%　　B.52%　　C.58%　　D.61%\n\n**【材料数据】**\n\n| 指标 | 2021 年 1—4 月 | 同比增速 | 增速变动 |\n|---|---|---|---|\n| 全社会用电量 | 284.59 亿千瓦时 | 7.9% | — |\n| 第一产业用电量 | 6.36 亿千瓦时 | **29%** | 增速比上年同期**提高 6.2 个百分点** |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 问 2019 年同期 → 2021 年，中间隔着 2020 年 → **间隔增长率（增速的累积）** |\n| 定位数据 | 2021 年增速 29%；用\"提高 6.2 个百分点\"倒推 2020 年增速 = 29% − 6.2% = **22.8%** |\n| 列式 | 累计增速 = r1 + r2 + r1 × r2 = 22.8% + 29% + 22.8% × 29% |\n| 速算步骤 | ① **先加（要精准）**：22.8% + 29% = **51.8%**\u003cbr>② **后乘（要估算）**：22.8% × 29% ≈ 22 × 30 = 660 → **6.6%**（画面右上角写 `22 × 30`）\u003cbr>③ 合计：51.8% + 6.6% = **58.4%** |\n| 结论 | ✅ C |\n\n**【选项原文】**\n\n- A. 46%\n- B. 52%\n- C. 58%\n- D. 61%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n**① 识别题型（老师讲题第一步）：**\n\n> 老师原话：\"这种题目的一个特征就是，他如果想问你间隔增长率，那么他**往往中间会隔一年**。往往，不绝对。你看这个一九年二一年中间怎么隔了个二零年呢？那就是在考虑间隔增长率。\"\n\n**② 找 2020 年的增速——\"提高 x 个百分点\"是增量，不是增速：**\n\n> 老师原话：\n> \"那二零年增速有没有给呢？没有直接给，他通过了一个**增量**给你的，要注意，这是个增量——我们第一节课强调过的，还记得？**多少个百分点，是专属于那种百分比数据的一个增量。**\"\n> \"它的增速今年是 29%，它的增量是 6.2 个百分点，说明 20 年 1—4 月份，它的增速就是 `29 − 6.2 = 22.8%`。\"\n\n**③ 完整算式（画面板书全抄）：**\n\n```\n19 1-4月  ──22.8%──→  20 1-4月  ──29%──→  21 1-4月\n\n1. 先加 = 22.8% + 29% = 51.8%\n2. 后乘（估算）= 22.8% × 29% ≈ 22 × 30 = 6.6%\n   ⇒ 合计 = 51.8% + 6.6% = 58.4%   →  C\n```\n\n**④ 老师另演示的\"倍数法\"（画面板书全抄）：**\n\n```\n1.29 × 1.228   （21 年倍数 × 20 年倍数，直接相乘）\n```\n\n即：`(1+r总) = (1+r1)(1+r2)`，把两个增速各自加 1 变倍数直接乘。\n\n**陷阱类型**：**概念陷阱（百分点≠增速）+ 时间陷阱（跨 2020 年）**。2020 年增速必须用\"29% 减 6.2 个百分点\"倒推，而不是把 6.2% 拿去当增速。\n\n---\n\n### 补充：不是\"隔一年\"也能用（环比例）\n\n老师口述例题（画面手写于同页右下，**无题目原文**）：\n\n```\n21 年 3 月：同比 = 10%\n21 年 4 月：环比 = 5%\n\n问：21 年 4 月比 20 年 3 月增长多少？\n\n20.3月 ──10%──→ 21.3月 ──5%──→ 21.4月\n\n15% + 10% × 5% = 15% + 0.5% = 15.5%\n```\n\n> 老师原话：\n> \"他只要是这样的一个连续的时间就可以了。**你不要管他是什么时间**，你哪怕这是一个 26 年 3 月 2 号、这是个 26 年 3 月 7 号、这是个 26 年 6 月 21 号都行。**他只要是不同的三个时间节点，他们之间这个增速关系都是满足的。**\"\n> \"环比是啥意思？跟上个月相比……就跟 21 年 3 月份相比，所以它中间的间隔点其实就是个前面的 21 年 3 月，拿这个 21 年 3 月做了中间的一个**支点、一个连接点**，把这一整段分成了两段。\"\n> \"当然前提一定要是**连续的**，不过你三个时间节点，你想要有两段连在一起的，那肯定也是连续的。\"\n\n**关于 `10% × 5% = 0.5%` 的计算：**\n\n> 老师说：\"你把这个 10% 当什么？你当个十分之一不就好了吗？这不是十分之一，那后面百分号我不动它，把 5 乘了个十分之一，5 除了个 10，那不就 0.5 了吗？这个让你大概估算一下其实就可以了。\"\n> \"如果这个增速是个大于 10% 的，你大概估算一下，它是十分之一还是五分之一还是四分之一，然后让边去除个四啊、除个五啊什么的就行了。\"\n\n---\n\n### 第 4 题｜2021 年 · 我国各类镁产品出口总金额（乘积增长率）\n\n**【题干原文】**\n\n> 2021 年，未锻轧铜及铜材出口 93.2 万吨，同比增长 25.2%。未锻轧铝及铝材出口 561.9 万吨，同比增长 15.7%；出口金额 194.7 亿美元，同比增长 48.7%。各类镁产品出口 47.72 万吨，同比增长 21.2%；出口单价 4052.3 美元/吨，同比增长 65.8%。\n>\n> 2021 年，我国各类镁产品出口总金额同比约增长了：\n> A.36.8%　　B.79.7%　　C.100.9%　　D.126.8%\n\n**【材料数据】**\n\n| 产品/指标 | 数量 | 同比增速 |\n|---|---|---|\n| 未锻轧铜及铜材出口 | 93.2 万吨 | 25.2% |\n| 未锻轧铝及铝材出口 | 561.9 万吨 | 15.7% |\n| 未锻轧铝及铝材出口金额 | 194.7 亿美元 | 48.7% |\n| **各类镁产品出口** | **47.72 万吨** | **21.2%（出口量增速）** |\n| **各类镁产品出口单价** | **4052.3 美元/吨** | **65.8%** |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 求\"**总金额**\"增速 → 出口总金额 = 出口量 × 出口单价 → **乘积增长率（增速的累积）** |\n| 定位数据 | 出口量增速 21.2%，出口单价增速 65.8% |\n| 列式 | 总金额增速 = 21.2% + 65.8% + 21.2% × 65.8% |\n| 速算步骤 | ① 先加：21.2% + 65.8% = **87%**\u003cbr>② 后乘（估算放缩）：把 21.2% 当 `1/5`，即 `65.8% ÷ 5 ≈ 13%`\u003cbr>③ 合计：87% + 13% = **100%（100 出头）** |\n| 结论 | ✅ C |\n\n**【选项原文】**\n\n- A. 36.8%\n- B. 79.7%\n- C. 100.9%\n- D. 126.8%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n**① 题型识别——\"总金额\"往往是\"拆成两个东西\"：**\n\n> 老师原话：\n> \"你看这个题目的时候，他问了个什么东西——**出口总金额**。这种总金额、什么总收入、总支出、总产量什么的，它往往有时候就是**有两个东西去相乘**的。\"\n> \"看他材料里面有没有给总金额呢？各类镁产品在这儿，他给了一个**出口量**、给了一个**出口单价**，你看他就是**不给你总金额**。前面这个铜材、铝材，他给你总金额的，但这个他要你算了，他就不给你了。他把这个总金额**拆分成了两个部分**：一个是出口量，一个是出口单价。\"\n\n**② 列式与速算（画面板书全抄）：**\n\n```\n出口总金额 = 出口量 × 出口单价\n\n列式： = 出口量增速 + 单价增速 + 两者相乘\n       = 21.2%      + 65.8%   + 21.2% × 65.8%\n\n1. 先加：21.2% + 65.8% = 87%\n2. 后乘（估算）：65.8% ÷ 5 ≈ 13%      ← 把 21.2% 当 1/5\n3. 合计：87% + 13% ≈ 100% 出头\n⇒ C.100.9%\n```\n\n> 老师原话：\n> \"计算的时候就先加起来是 87。然后我们再加上它俩相乘……你用这个 21.2% 当什么？当五分之一行不行？那这个地方就给他出个五呗，当然肯定要多一点嘛，13 多一点。87 加 13，100 出头，所以选 C。\"\n\n**陷阱类型**：**概念陷阱**——\"总金额\"必须自己先搭关系式 `总金额 = 量 × 单价`；材料里\"未锻轧铜及铜材/未锻轧铝及铝材\"的数据都是**干扰项**（老师明确说\"他给总金额的，但这个他要你算了，他就不给你了\"）。\n\n### 4.1 变式：材料给\"倍数\"，就直接乘\n\n画面（同页下方手写）：\n\n```\n出口量是去年的 1.21 倍      出口单价是去年的 1.65 倍\n（即 21.2% + 1）           （即 65.8% + 1）\n\n1.21 × 1.65 ≈ 1.2 × (1 + 66%) = 1.2 × 1.66 ≈ 2 倍\n                  ↑ 把 1.65 看作 5/3 附近，凑成好算的 1.66\n\n⇒ 限期 ÷ 基期 = 2 倍\n⇒ 增速 = 2 − 1 = 100%\n```\n\n> 老师原话：\n> \"题目它可以改，它可以变成这样子——比如说他不告诉你增速，他说（出口单价）是去年的 1.6 倍，这个地方也不告诉你增速，这个出口量是去年的 1.21 倍，现在问出口总金额增长了多少。**你也不一定非要把这个倍数去转化成增速，再去套那个乘积增长率公式了，你直接乘。**\"\n> \"两倍这个是什么？是**限期除以基期的倍数**。所以增速就等于 `2 − 1 = 100%`。\"\n> \"为什么这两个可以直接乘呢？我们刚刚再想想看，是不是 `2025 = 2023 × (1+r1) × (1+r2)`？**我们本身就是从这个公式套过来的呀，本身就是把两个式子展开的呀**……所以 25 年和 23 年的倍数关系，就等于他们俩这个倍数相乘。\"\n\n**关于\"要不要把倍数加一变成增速\"：**\n\n> 老师原话：\n> \"要是一个是倍数、一个百分之几十，我目前没见过这么出题的……你要是真是这样的，你随便找个你觉得好算的就行了，你要么把倍数减一变成增速，要么把增速加一变成倍数，都可以，你看怎么好算你就怎么算。\"\n> ⭐ \"**你看材料给什么，你就可以算什么。给什么你就算什么吧。**\"\n> \"有同学问：这个地方不应该是 0.2 吗？——**你又忘了我第一节课、第二节课说的东西了，你不要在意位数**。我这种 1.65 写成 6 分之（几），只是因为这样好写……你沉下来，你知道是个 0.2，但是你也要知道，你一开始是 1.2×1.65，它肯定是比 1 大的数，不可能是 0.2 的，它应该是个 2。\"\n\n**画面板书（完整链条）：**\n\n```\n        ×1.21        ×1.65\n2023 ──────────→ 24 ──────────→ 25\n       └────── ×1.21 × 1.65 ──────┘\n\n2025 = 2023 × (1 + r1)(1 + r2)\n```\n\n---\n\n## 五、增速的拆分（平均数增长率）\n\n画面章节页：**02 平均数增长率**（老师在该页手写 `A + B = C`、`C − A = B`）。\n\n> 老师原话：\n> \"我们讲了增速的累计，增速累计需要我们去学这个**增速的拆分**、平均数增长率这一块。我们可以把两个部分的增速给他们去累计起来，变成一个整体的增速、整体的一次变化，对不对？那相对应的，我们肯定也能把**一次整体的变化去拆成两个小的**。\"\n\n### 5.1 核心思想：知二求一，累计的反运算\n\n> 老师原话：\n> \"就好像什么关系呢？就好像我知道 `A + B = C`，我通过 `A + B` 能得到 `C`，那我通过 `C` 来减这个 `A`，我是不是也一样能得到这个 `B` 啊？**全是知二求一嘛，知道两个东西，算剩下一个东西。**\"\n> \"那增速的累计是将同一个主体的两段累计为一次完整的增长，那**增速的拆分就是要把这次完整的增长去拆下来**，对，就是个**逆运算**。\"\n> \"我们举了两个例子，一个是间隔增长率和平均数增长率两种场景，跟累计也是对应的：一个是**根据时间来做一个区分**，一个是**根据两个不同的元素、两个不同的要素、两个不同的主体进行拆分**。\"\n\n**画面（「增速的拆分」页）原文：**\n\n| 场景 | 画面原文 |\n|---|---|\n| **间隔增长率** | 2025 年比 2023 年增长 21%，2025 年同比增速 10%，则 2024 年同比增长多少？ |\n| **平均数增长率** | 2025 年总支出增长了 21%，人数增长了 10%，则 2025 年人均支出增长多少？ |\n\n**现场推导（间隔增长率版，画面板书全抄）：**\n\n```\n       23 ─────? a─────→ 24 ──10%──→ 25\n       └─────────── 21% ───────────┘\n\n21% = a + 10% + a × 10%\na (1 + 10%) = 21% − 10%\n      a = (21% − 10%) / (1 + 10%)\n        = 11% / 1.1\n        = 10%\n```\n\n> 老师原话：\n> \"这个式子很关键，这个式子这个结构、这种形式，给我记牢了。你看算出来跟我们刚刚的结果是一样的吧？10%、10% 合成了 21%，21% 拆掉一个 10%，还能变成剩下的 10%。\"\n\n### 5.2 公式推导（板书全抄）\n\n画面原文：\n\n> **累积增速为 r1、部分增速为 r2**\n>\n> 间隔增长率：营业收入 2025 年比 2023 年同比增长 r1，2025 年同比增长 r2，则 2024 年同比增长多少？\n> 乘积增长率：总支出 = 人数 × 人均支出，2025 年总支出同比增长 r1，人数同比增长 r2，则人均支出同比增长多少？\n>\n> **另一部分增速 `r = (r1 − r2) / (1 + r2)`**\n\n**推导（画面板书全抄）：**\n\n```\n乘积增长率：总支出 = 人数 × 人均支出\n\nr1 = r2 + r + r2 × r\nr(1 + r2) = r1 − r2\n        r1 − r2\n   r = ─────────\n        1 + r2\n\n人均支出 =  总支出(r1)\n          ─────────────\n            人数(r2)\n```\n\n> 老师原话：\n> \"平均的增长率就不用推了吧，跟刚刚的关系也是一样的……我们转化成公式的话就是这样子的。\"\n> \"我们把这个人均支出转换成这种平均数的关系，你看人均支出它是等于什么？等于**总支出除以人数**。这个分子是由这两个相乘的，它更像是一个**总的关系**，这个分子是个 r1，**用它去减别人**，减这个分母这个 r2，**用上面的减下面的**。\"\n> \"上面的减下面的，减掉，然后再除以一个 `1+r2`（`减 r2 除以 1 加 r2`），除一除，就能得到人均支出的增速了。\"\n> \"**分子减分母，或者说就是间隔增长率里面 23、24、25，我再把这个模式跟你说一下：这个 r 就等于总的这个增长减掉部分的这个增长，除以 `1+r2`。**\"\n> \"他们只是时间上有些（不同），但是**对结果的影响是一样的，对于结果的影响是均等的，就是一个地位是一样的**。\"\n\n---\n\n## 六、例题精讲（第三部分：增速的拆分）\n\n### 第 5 题｜2021 年 1-2 月 · 全国商品房销售面积（间隔增长率拆分）\n\n**【题干原文】**\n\n> 2021 年 1-2 月，全国房地产开发投资 13986 亿元，同比增长 3873 亿元，房屋施工面积 770629 万平方米，同比增长 11.0%。商品房销售面积 17363 万平方米，同比增长 1.05 倍，比 2019 年 1-2 月增长 23.3%，商品房销售额 19151 亿元，同比增长 1.33 倍，比 2019 年同期增长 49.6%。\n>\n> 2020 年 1-2 月，全国商品房销售面积同比增长（　）\n> A.-40.0%　　B.-32.5%　　C.40%　　D.17.2%\n\n**【材料数据】**\n\n| 指标 | 2021 年 1-2 月数值 | 同比（对 2020 年） | 比 2019 年 1-2 月 |\n|---|---|---|---|\n| 全国房地产开发投资 | 13986 亿元 | 同比增长 **3873 亿元** | — |\n| 房屋施工面积 | 770629 万平方米 | 同比增长 **11.0%** | — |\n| **商品房销售面积** | **17363 万平方米** | **同比增长 1.05 倍** | **增长 23.3%** |\n| 商品房销售额 | 19151 亿元 | 同比增长 1.33 倍 | 增长 49.6% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 问 2020 年增速，材料给\"20→21 的增速\"和\"19→21 的累积增速\" → **间隔增长率（增速的拆分）** |\n| 定位数据 | 累积（整体）r1 = **23.3%**（19→21）；已知一段（局部）r2 = **105%**（20→21，因为\"增长 1.05 倍\"就是增速 105%） |\n| 列式 | r20 = (r1 − r2) / (1 + r2) = (23.3% − 105%) / (1 + 105%) |\n| 速算步骤 | ① 分子：23.3% − 105% = **−81.7%**\u003cbr>② 分母：1 + 105% = **2.05**\u003cbr>③ 放缩：`−81.7 / 2.05 ≈ −80 / 2 = −40%` |\n| 结论 | ✅ A |\n\n**【选项原文】**\n\n- A. −40.0%\n- B. −32.5%\n- C. 40%\n- D. 17.2%\n\n**【答案】** ✅ **A**（画面中老师在 A 上打勾）\n\n**【解析】**\n\n**① \"增长 1.05 倍\"必须先换成增速（画面板书全抄）：**\n\n```\n增长 1.05 倍  ⇒  r = 105%\n   1.05                                        ← 老师把\"倍\"和\"百分比\"并排写\n   r = 105%\n```\n\n> 老师原话：\n> \"他告诉你，从 20 年到 21 年增长了 1.05 倍。这 1.05 倍增速是多少呢？增长多少倍？**这个东西就是个增速，1.05，它就是增速**，那 1.05 是等于 105%，增加了一倍多。\"\n> \"还告诉你，比 19 年同时期增长了 23.3%。所以就又给了你这个整体段时间的一个增速，百分之二十三点三。现在要你算剩下的这部分，我们就拆呀——怎么拆？把这个 23.3（%）拆出来一个 105（%）。\"\n\n**② 拆的算式（画面板书全抄）：**\n\n```\n19 1-2月 ──r=?──→ 20 1-2月 ──105%──→ 21 1-2月\n          └────────── 23.3% ──────────┘\n\n     23.3% − 105%      −81.7%\nr20 = ────────────  =  ────────  = −40%\n       1 + 105%          2.05\n```\n\n> 老师原话：\n> \"然后除以一加上什么？加上上面被减的这个东西。这个就是我们要算的 20 年的增速。上面减下来是负的 81.7，分母上一加上 105% 就是 2.05。那这个稍微的口算放缩一下，可不可以？是不是就是负的 40%？把上面想成 80 除以 2。80 除以 2 等于百分之负的 40%。所以选择 A。\"\n\n**③ 老师特别强调\"别搞混倍数和增速\"：**\n\n> 老师原话：\n> \"怎么这个 1.05 倍、这个 1.05 就能是 105% 呢？那我问你，如果我问你**增长一倍**是多少？……你总不能说增长一倍的增速是 0 吧，那不扯了吗？**增速是百分之百。**那增长 1.05 倍，上面不就是 1 倍、就是 1.00 呗，那 1.05 倍不就是增速 105% 吗？\"\n> \"有的东西可能跟那个搞混了：比如说 21 年这个东西是**去年同期的 2.3 倍**，这就不一样了。**我是去年同期的 2.3 倍**，这个就是我比它、我跟它的比值，我等于它乘以 2.3，**这个时候增速就是百分之 130，你要去减个 1 的**。\"\n> \"我是你的一倍，就是我跟你相等，我们增速是 0%；我是你的两倍，也就比你多一、多一倍、多百分之百；是你的 2.3 倍，就是多 130%。\"\n\n**④ 谁是 r1、谁是 r2：**\n\n> 老师原话：\"**整体的是 r1，局部的是 r2。整体减局部，除以 1 加局部。**\"\n\n**陷阱类型**：**概念陷阱（\"增长几倍\" vs \"是几倍\"）+ 时间陷阱**。四个选项里埋了 `−40.0%` 与 `40%`（正负号相反）、`−32.5%`（量级差不多的干扰项）等；材料里\"房地产开发投资\"\"房屋施工面积\"\"商品房销售额\"三组数据都是**范围陷阱**（本题只用\"商品房销售面积\"那一句）。\n\n### 6.1 变式：给倍数就直接除\n\n画面（同页右侧板书全抄）：\n\n```\n2021 年销售面积是去年的 2.05 倍，是 2019 年的 1.23 倍\n问：19 年到 20 年（这一段的）倍数是多少？\n\n        1.23\n19→20 = ───── = 0.6 倍\n        2.05\n\n       19 ──×0.6──→ 20 ──×2.05──→ 21\n        └──────── ×1.23 ─────────┘\n\n⇒ 相当于乘了个 0.6，那变成了 0.6 倍，说明增速是负的 0.4，就是 −40%\n\n另：1 + r = (1 + r1)(1 + r2)\n              1 + r\n    1 + r2 = ─────────\n              1 + r1\n```\n\n> 老师原话：\n> \"**如果这个题目是这么说的**：21 年这个销售面积是去年的 2.05 倍，是 2019 年的 1.23 倍，问 21 年是 19 年的多少倍？那就**直接除**。\"\n> \"它本质上就还是我们关系：`1+r = (1+r1)(1+r2)`。总的是变成了 1.23 倍，其中一次变化是乘了个 2.05，那另外一次，我就是拿这个 1.23 除以这个 2.05 嘛。\"\n> ⭐ \"**两次这个变化，如果是乘什么倍数、是对方的多少倍，那你把它们合起来就直接乘，拆开来就是直接除。**\"\n> \"对刚刚那个**多少倍跟增长的关系，人要记得减个一**：是 0.6 倍，不能说它增速是百分之六十，**减个一**、增长的负的 0.4 倍，就是增速是负百分之四十。\"\n\n---\n\n### 第 6 题｜2014 年 · 全国棉花单位面积产量（平均数增长率拆分）\n\n**【题干原文】**\n\n> 2014 年全国棉花播种面积 4219.1 千公顷，比 2013 年减少 2.9%。棉花总产量 616.1 万吨，比 2013 年减产 2.2%。\n>\n> 2014 年全国棉花单位面积产量比上年约：\n> A. 提高了 5.1%　　B. 提高了 0.7%　　C. 降低了 5.1%　　D. 降低了 0.7%\n\n**【材料数据】**\n\n| 指标 | 2014 年数值 | 比 2013 年 |\n|---|---|---|\n| 全国棉花播种面积 | 4219.1 千公顷 | 减少 **2.9%** |\n| 全国棉花总产量 | 616.1 万吨 | 减产 **2.2%** |\n| 全国棉花单位面积产量 | 待求 | ？ |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n|---|---|\n| 题型识别 | 求\"单位面积产量\"这个**平均数**的增速 → **平均数增长率（增速的拆分）** |\n| 定位数据 | 分子（总产量）增速 r1 = **−2.2%**；分母（播种面积）增速 r2 = **−2.9%** |\n| 列式 | 单位面积产量 = 总产量 ÷ 播种面积；r = (r1 − r2) / (1 + r2) |\n| 速算步骤 | ① 分子：−2.2% − (−2.9%) = **+0.7%**\u003cbr>② 分母：1 + (−2.9%) = **0.971**\u003cbr>③ 估算：`0.7% / 0.971 ≈ 0.72%`（略大于 0.7%） |\n| 结论 | ✅ B（提高的幅度很小，被四舍五入舍掉一点） |\n\n**【选项原文】**\n\n- A. 提高了 5.1%\n- B. 提高了 0.7%\n- C. 降低了 5.1%\n- D. 降低了 0.7%\n\n**【答案】** ✅ **B**（画面中老师在 B 上打勾，并在 C、D 上打叉）\n\n**【解析】**\n\n**① 读懂\"单位面积产量\"是什么关系：**\n\n> 老师原话：\n> \"那单位面积产量是什么东西呢？他有没有给你？他不给，他给个什么？给个棉花的**播种面积**，给个棉花的**总产量**。现在问单位产量，**单位产量它是个平均数**，它是把这个总产量去除的、拿这个总产量去除了一个播种面积。\"\n\n**画面板书：**\n\n```\n总产量\n─────   =  单位面积产量      A = B / C\n播种面积\n\n总产量  −2.2%   →   分子（B）\n播种面积 −2.9%  →   分母（C）\n```\n\n**② 通用条件（老师强调的\"万能钥匙\"）：**\n\n> ⭐ 老师原话：\n> \"**只要这一个式子、只要一个式子，它能满足这种什么除什么的关系，都可以用平均数增长率去进行计算。就只要他满足 `a = b ÷ c`，这都能用平均数增长率去算。同理，如果一个数、一直就是可以满足 `a = b × c`，我们也都可以用乘积增长率去计算。**\"\n> ⭐ \"**它只是数字的一个运算关系，它跟它的具体的概念是什么是没有关系的。**它不管是什么概念，你只要是 `a = b × c`，就都能用乘积增长率；只要是 `a = b ÷ c`，就都可以用平均数增长率。\"\n\n**③ 算式（画面板书全抄）：**\n\n```\n      −2.2% − (−2.9%)     0.7%\nr = ─────────────────── = ────── ≈ 0.72% > 0.7%\n        1 + (−2.9%)        0.971\n```\n\n> 老师原话：\n> \"那上面呢，减掉一个负的等于加上一个正的，−2.2% 加正的 2.9% 等于 0.7%，0.7 除以 0.971。这是个正的，对不对？**那这时候我们可以先把降低的排除掉**，然后你再观察一下是 5.1% 还是 0.7%，那只能是 0.7% 嘛。\"\n\n**④ 关于\"0.7% 除以 0.971 其实大于 0.7%\"：**\n\n> 老师原话：\n> \"因为你这个 0.7% 虽然除以 0.971，它确实大于百分之 0.7，但是有些同学**不要光看一个什么大小的，有一定会把什么 0.7 给它排掉，不一定的**。因为它这个变大的幅度太小了，**提高的那个量太小了，被他四舍五入舍掉了**。\"\n> \"对啊，你这想到哪儿去才能到这个 5.1% 啊？你得乘个六什么的、乘个七，乘个还不够、七七四十九。所以只能选 B。\"\n\n**陷阱类型**：**方向陷阱 + 概念陷阱**。① \"减少 2.9%\"要先转成 `−2.9%` 再代入，减负数等于加正数；② 分子分母不能反（反了就成 `−2.9% −(−2.2%) = −0.7%`，会误选 D）；③ 结果的量级很小，容易被\"四舍五入\"误导而不敢选 0.7%。\n\n### 6.2 方向口诀：谁除谁\n\n画面（结尾页手写）：\n\n```\n每平方米产量    →   后 ÷ 前（产量 ÷ 面积）\n\n人均收入        →   收入 / 人数\n                     （后 ÷ 前）\n```\n\n> 老师原话：\n> \"单位面积产量就是它**产量除以面积**嘛。你可以这么记，我们也可以给你整理一下，就是平均数到底谁除谁，主要有这样一个关系。比如说每平方米产量，这边有个口诀的：比如你这边有个**每**字，每人多少个、每平方每一生产了多少，**你就拿后面的去除前面的**（后除前）。\"\n> \"人均收入、人均收入，那就是拿还是拿**收入去除这个人数**。\"\n> \"什么'军前母后'，你这个军（均）不是后除前吗？为什么你们都在说一个什么军前母后？人均收入不是他收入除以人数吗？**不要被带歪**……**就是拿后面的去除前面的**。\"\n> \"你多做题，多背背公式呗。**怎么知道谁除谁、容易出反呢？你多做题，多背背公式。**\"\n\n---\n\n## 七、本讲知识点总表\n\n| 模块 | 场景 | 关系式 | 已知 | 求 | 公式 / 方法 |\n|---|---|---|---|---|---|\n| **份数法微调** | 任何 | `r ≈ 1/n` | 现期、r | 实际Δ | `实际Δ = 算Δ + 算Δ×(r − 1/n) / (1 + r)` |\n| **份数法·偏差比例** | 任何 | — | `r` 与假设的 `1/n` | 偏差比例 | `偏差比例 = (r − 1/n) ÷ (1/n)`（**除假设的百化分，不除实际增速**） |\n| **增速的累积①** | 间隔增长率（跨时间） | — | 两段增速 r1、r2 | 累计增速 | `r = r1 + r2 + r1 × r2` |\n| **增速的累积②** | 乘积增长率（`A = B × C`） | `总支出 = 人数 × 人均支出` | r1、r2 | r | `r = r1 + r2 + r1 × r2` |\n| **增速的累积·倍数版** | 材料直接给倍数 | `1+r = (1+r1)(1+r2)` | 两个倍数 | 总倍数 | **倍数直接相乘**，再 `−1` 得增速 |\n| **增速的拆分①** | 间隔增长率（逆运算） | — | 累计 r1、其中一段 r2 | 另一段 r | `r = (r1 − r2) / (1 + r2)` |\n| **增速的拆分②** | 平均数增长率（`A = B ÷ C`） | `单位面积产量 = 总产量 ÷ 面积` | 分子增速 r1、分母增速 r2 | 平均数增速 r | `r = (r1 − r2) / (1 + r2)` |\n| **增速的拆分·倍数版** | 材料直接给倍数 | `1+r = (1+r1)(1+r2)` | 总倍数、一段倍数 | 另一段倍数 | **倍数直接相除**，再 `−1` 得增速 |\n| **百分点的含义** | 任何 | — | \"增速比上年同期提高/回落 x 个百分点\" | 上年增速 | 上年增速 = 今年增速 **∓** x 个百分点 |\n| **倍数的含义** | 任何 | — | 增长 a 倍 / 是去年的 a 倍 | 增速 | 增长 a 倍 → 增速 = `a × 100%`；是 a 倍 → 增速 = `(a − 1) × 100%` |\n| **平均数方向** | 任何 | — | \"每/人均/单位…\" | 谁除谁 | **后 ÷ 前**（产量÷面积、收入÷人数） |\n\n---\n\n## 八、速算口诀与解题流程\n\n**1. 累积（用公式 `r = r1 + r2 + r1×r2`）——\"先加后乘\"：**\n\n```\n第一步：加法 —— 要精准（好算、权重大，别偷懒）\n        如 22.8% + 29% = 51.8%\n第二步：乘法 —— 要估算（权重小）\n        用乘法放缩凑整：\n          22.8% × 29%  ≈ 22% × 30% = 6.6%\n          21.2% × 65.8% ≈ 65.8% ÷ 5 ≈ 13%\n第三步：相加得答案\n        51.8% + 6.6% = 58.4%\n```\n\n**2. 拆分（用公式 `r = (r1 − r2) / (1 + r2)`）——\"整体减局部\"：**\n\n```\n口诀：整体的是 r1，局部的是 r2；整体减局部，除以 1 加局部\n\n        23.3% − 105%     −81.7%\nr20 = ─────────────── = ──────── ≈ −80/2 = −40%\n          1 + 105%         2.05\n（分母放缩凑整：2.05 → 2）\n\n         −2.2% − (−2.9%)      0.7%\nr   = ──────────────────── = ─────── ≈ 0.72%\n            1 + (−2.9%)        0.971\n```\n\n**3. 给倍数就直接乘 / 直接除：**\n\n```\n累积：1.21 × 1.65 ≈ 1.2 × 1.66 ≈ 2 倍  →  增速 = 2 − 1 = 100%\n拆分：1.23 ÷ 2.05 = 0.6 倍            →  增速 = 0.6 − 1 = −40%\n```\n\n**4. 份数法使用纪律（负增速场景）：**\n\n```\n① |r| 较大（经验上超过 30%）且是负增速 → 慎用份数法 → 改用放缩\n   （因为微调要除以 (1+r)，负大增速会把误差成倍放大）\n② 一定要用份数法时：\n   - 偏差比例的分母用\"假设的百化分 1/n\"，不用实际增速\n   - 补上\"再除以 (1+r)\"这一步\n③ 提前修正后 → 算基期必须用\"原始限期\"减增量\n④ 追求低精度、快速解题才用份数法；要求精度高就换放缩\n```\n\n**5. 判断题型的两把尺子：**\n\n| 看到什么 | 想什么 |\n|---|---|\n| 问的年份与给的年份**中间隔了一（或更多）年** | 间隔增长率（累积 / 拆分） |\n| 有\"**总**金额/总收入/总支出/总产量\"，而材料只给**量 + 单价**（或只给两个相乘因子） | 乘积增长率 |\n| 求\"**单位面积产量 / 人均 / 平均每…**\"的增速，材料给分子分母 | 平均数增长率 |\n| 材料给\"同比增长 x 倍\"\"是去年的 x 倍\" | 先换成增速（**减 1**）再代入 |\n\n---\n\n## 九、易错点与陷阱清单\n\n| # | 易错点 | 正确做法 | 陷阱类型 |\n|---|---|---|---|\n| 1 | 负大增速用份数法，忘了再除 `(1+r)`（如算出 475 而非 453） | 补上 `÷(1+r)`，或直接改用放缩 | 精度陷阱 |\n| 2 | 快速估算偏差比例时用**实际增速**做分母（2.4% ÷ 47.6%） | 分母用**假设的百化分**（2.4% ÷ 50% = 4.8%），这样是\"准的、等于号\" | 概念陷阱 |\n| 3 | **提前修正后**用被修正的限期去减增量（210 − 26.3 = 184，误选 A） | 必须用**原始限期**减增量（221 − 26 ≈ 195） | 过程陷阱 |\n| 4 | 把\"**增长 1.05 倍**\"当成增速 1.05%（或 5%） | 增长 1.05 倍 = **增速 105%** | 概念陷阱 |\n| 5 | 把\"**是去年的 2.3 倍**\"当成增速 230% | 是 a 倍 → 增速 = **（a − 1）× 100%**（2.3 倍 → 130%） | 概念陷阱 |\n| 6 | 把\"提高/回落 x 个百分点\"当成增长率 | 百分点是**百分比数据的增量**，用来**加减**（29% − 6.2 个百分点 = 22.8%） | 概念陷阱 |\n| 7 | 拆分的分子分母搞反（多算成 −0.7%） | **整体（累积）是 r1，局部是 r2；上减下，除以 `1+r2`** | 方向陷阱 |\n| 8 | 单位面积产量/人均，谁除谁搞反 | **后 ÷ 前**（产量÷面积、收入÷人数） | 方向陷阱 |\n| 9 | 只做加法、漏掉\"两个增速相乘\" | `r = r1 + r2 + r1×r2`，**乘积部分不能漏** | 概念陷阱 |\n| 10 | 放缩时不敢选\"略大于\"的答案（0.7% ÷ 0.971 ≈ 0.72%，被四舍五入舍掉） | 先排除大方向（正/负），再看量级，**0.7% 的量级不可能是 5.1%** | 精度陷阱 |\n| 11 | 认为\"必须隔一整年\"才能用间隔增长率 | **只要三个连续的、不同的时间节点**就行（同比×环比也可） | 范围陷阱 |\n| 12 | 把材料里不相干的产品/指标数据拿来算（如用铜材铝材的 25.2%、15.7% 去算镁产品） | 先搭关系式，再**只取需要的两个增速** | 范围陷阱 |\n| 13 | 纠结\"1.65 看成 1/6 到底是多少\" | **不要在意位数**，先看初始量级（1.2×1.65 一定是 2 左右，不可能是 0.2） | 计算陷阱 |\n\n---\n\n## 十、老师金句\n\n> ⭐ \"**分数法，你要么就把它算得很准，要么你就是把它当做一个简单的估算。如果题目的要求精度比较高，我是不太建议你去用分数法的。**\"\n\n> ⭐ \"所以我遇到这种负增速比较大的时候，我就给他去**放缩**嘛，直接放缩不就好了吗？**只有放缩是让我最安心的。**\"\n\n> ⭐ \"**第一步这个加法，你尽量精准，因为它好算……后面那个（乘法）你要尽量估算，因为它的影响小。**\"\n\n> ⭐ \"**加多好算，营养又大，那肯定先加嘛。**\"\n\n> ⭐ \"**限期是没有变的，限期是没有改的，我们只是找了一个平行的数据来代替计算。**\"\n\n> ⭐ \"**它只是数字的一个运算关系，它跟它的具体的概念是什么是没有关系的。**\"\n\n> ⭐ \"**全是知二求一嘛，知道两个东西，算剩下一个东西。**\"\n\n> ⭐ \"**你看材料给什么，你就可以算什么。给什么你就算什么吧。**\"\n\n> ⭐ \"**两次这个变化，如果（材料给的）是乘什么倍数、是对方的多少倍，那你把它们合起来就直接乘，拆开来就是直接除。**\"\n\n> ⭐ \"**你不要在意位数啊。**\"\n\n> ⭐ \"**整体的是 r1，局部的是 r2。整体减局部，除以 1 加局部。**\"\n\n> ⭐ \"**就是拿后面的去除前面的（后除前）。**\"\n\n> ⭐ \"怎么知道谁除谁、容易出反呢？**你多做题，多背背公式呗。**\"\n","outline":[{"level":2,"text":"讲义目录页（本讲四大模块）","id":"讲义目录页本讲四大模块"},{"level":2,"text":"一、开篇复习：份数法微调的三个注意点","id":"一开篇复习份数法微调的三个注意点"},{"level":3,"text":"1.1 微调公式回顾（板书）","id":"11-微调公式回顾板书"},{"level":3,"text":"1.2 注意点①：负增速较大时，谨慎使用份数法","id":"12-注意点负增速较大时谨慎使用份数法"},{"level":3,"text":"1.3 注意点②：快速估算偏差比例方法","id":"13-注意点快速估算偏差比例方法"},{"level":3,"text":"1.4 注意点③：提前修正后，减增量要用\"原始限期\"","id":"14-注意点提前修正后减增量要用原始限期"},{"level":2,"text":"二、例题精讲（第一部分：份数法微调）","id":"二例题精讲第一部分份数法微调"},{"level":3,"text":"第 1 题｜2022 年 1~4 月 · 珠江水系四省水路客运量","id":"第-1-题2022-年-14-月-珠江水系四省水路客运量"},{"level":3,"text":"第 2 题｜2019 年第一季度 · 131 家证券公司代理买卖证券业务净收入","id":"第-2-题2019-年第一季度-131-家证券公司代理买卖证券业务净收入"},{"level":2,"text":"三、增速的累积（乘积增长率 / 间隔增长率）","id":"三增速的累积乘积增长率-间隔增长率"},{"level":3,"text":"3.1 引入：小明和秘书的故事","id":"31-引入小明和秘书的故事"},{"level":3,"text":"3.2 定义：增速的累积","id":"32-定义增速的累积"},{"level":3,"text":"3.3 两大场景：时间间隔 vs 主体相乘","id":"33-两大场景时间间隔-vs-主体相乘"},{"level":3,"text":"3.4 数值验证：100 → 110 → 121，累计 21%","id":"34-数值验证100-110-121累计-21"},{"level":3,"text":"3.5 公式推导（板书全抄）","id":"35-公式推导板书全抄"},{"level":3,"text":"3.6 运算纪律：第一步加法要精准，第二步乘法要估算","id":"36-运算纪律第一步加法要精准第二步乘法要估算"},{"level":2,"text":"四、例题精讲（第二部分：增速的累积）","id":"四例题精讲第二部分增速的累积"},{"level":3,"text":"第 3 题｜2021 年 1—4 月 · 某省第一产业用电量（间隔增长率）","id":"第-3-题2021-年-14-月-某省第一产业用电量间隔增长率"},{"level":3,"text":"补充：不是\"隔一年\"也能用（环比例）","id":"补充不是隔一年也能用环比例"},{"level":3,"text":"第 4 题｜2021 年 · 我国各类镁产品出口总金额（乘积增长率）","id":"第-4-题2021-年-我国各类镁产品出口总金额乘积增长率"},{"level":3,"text":"4.1 变式：材料给\"倍数\"，就直接乘","id":"41-变式材料给倍数就直接乘"},{"level":2,"text":"五、增速的拆分（平均数增长率）","id":"五增速的拆分平均数增长率"},{"level":3,"text":"5.1 核心思想：知二求一，累计的反运算","id":"51-核心思想知二求一累计的反运算"},{"level":3,"text":"5.2 公式推导（板书全抄）","id":"52-公式推导板书全抄"},{"level":2,"text":"六、例题精讲（第三部分：增速的拆分）","id":"六例题精讲第三部分增速的拆分"},{"level":3,"text":"第 5 题｜2021 年 1-2 月 · 全国商品房销售面积（间隔增长率拆分）","id":"第-5-题2021-年-1-2-月-全国商品房销售面积间隔增长率拆分"},{"level":3,"text":"6.1 变式：给倍数就直接除","id":"61-变式给倍数就直接除"},{"level":3,"text":"第 6 题｜2014 年 · 全国棉花单位面积产量（平均数增长率拆分）","id":"第-6-题2014-年-全国棉花单位面积产量平均数增长率拆分"},{"level":3,"text":"6.2 方向口诀：谁除谁","id":"62-方向口诀谁除谁"},{"level":2,"text":"七、本讲知识点总表","id":"七本讲知识点总表"},{"level":2,"text":"八、速算口诀与解题流程","id":"八速算口诀与解题流程"},{"level":2,"text":"九、易错点与陷阱清单","id":"九易错点与陷阱清单"},{"level":2,"text":"十、老师金句","id":"十老师金句"}]},{"id":"P12","title":"增速的累积与拆分（中）","full":"第5课 增速的累积与拆分（中）","lect":"","dur":"63:20","sec":3800,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 12 集\n\n# 第5课 增速的累积与拆分（中）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 12 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=12`\n> **时长**：63 分 20 秒\n> **本集主题**：**增速的累积与拆分的「简化计算」——三重取巧思路（运算顺序 / 简化步骤 / 凑整）、定性与定量的配合、低增速与高增速两套累积估算方式、平均数增长率的「化除为乘 + 提前修正」三步走，以及比值变化关系的方向判断。**\n\n> ⭐ 本集与 P11（上）、P13（下）同属「第 5 课 增速的累积与拆分」，本集是**中篇**，专注**计算的高效化（简化计算）**。\n\n---\n\n## 目录\n\n- [零、本集画面地图（网格 ↔ 内容对照）](#零本集画面地图网格--内容对照)\n- [一、承接上集：倍数关系与增速关系的互化](#一承接上集倍数关系与增速关系的互化)\n- [二、平均数增长率：谁除以谁（「后÷前」口诀）](#二平均数增长率谁除以谁后前口诀)\n- [三、简化计算：三重取巧思路](#三简化计算三重取巧思路)\n- [四、增速累积的定性判断（先定性，再定量）](#四增速累积的定性判断先定性再定量)\n- [五、低增速累积估算方式（含提前修正的雏形）](#五低增速累积估算方式含提前修正的雏形)\n- [六、高增速累积：倍化与百化分两种思路](#六高增速累积倍化与百化分两种思路)\n- [七、「收窄」与「回落」的概念辨析](#七收窄与回落的概念辨析)\n- [八、增速拆分的计算模式（平均数增长率的估算）](#八增速拆分的计算模式平均数增长率的估算)\n- [九、例题精讲](#九例题精讲)\n  - [第 1 题｜2021 年 1-2 月全国商品房销售面积（间隔倍数反推）](#第-1-题2021-年-1-2-月全国商品房销售面积间隔倍数反推)\n  - [第 2 题｜2014 年全国棉花单位面积产量（平均数增长率）](#第-2-题2014-年全国棉花单位面积产量平均数增长率)\n  - [第 3 题｜2014 年国家下拨农村义务教育经费（低增速累积）](#第-3-题2014-年国家下拨农村义务教育经费低增速累积)\n  - [第 4 题｜2016 年东北地区民间固定资产投资（降幅收窄）](#第-4-题2016-年东北地区民间固定资产投资降幅收窄)\n  - [第 5 题｜2019 年 1-8 月房地产开发企业土地成交额（乘积增长率）](#第-5-题2019-年-1-8-月房地产开发企业土地成交额乘积增长率)\n  - [第 6 题｜2017 年 A 省平均每人次客运旅客运输距离（平均数增长率）](#第-6-题2017-年-a-省平均每人次客运旅客运输距离平均数增长率)\n  - [第 7 题｜2023 年 1-7 月规上工业企业利润总额（小增速忽略乘积）](#第-7-题2023-年-1-7-月规上工业企业利润总额小增速忽略乘积)\n  - [第 8 题｜2014 年某区第三产业平均每名从业人员创造利润](#第-8-题2014-年某区第三产业平均每名从业人员创造利润)\n  - [第 9 题｜2018 年上半年快递业务平均每件收入](#第-9-题2018-年上半年快递业务平 .05 嘛，就 `1+r = (1+r₁) ÷ (1+r₂)`。\n\n板书（画面原样）：\n\n```\n1 + r = (1 + r₁)(1 + r₂)          ← 增速的累积（乘起来）\n1 + r₂ = (1 + r) ÷ (1 + r₁)       ← 增速的拆分（除回去）\n```\n\n> 两次变化如果都是「成什么倍数、是对方的多少倍」，那你把它们合起来就直接乘，拆开来就是直接除。\n\n**易错提醒（画面圈划）**：\n\n```\n1.23 ÷ 2.05 = 0.6 倍\n```\n\n> 刚刚那个「是多少倍」跟「增长」的关系，人要记得减个一，是 0.6 倍，不能说它增速是 60%，减个一 —— 增长了负的 0.4 倍，就是增速是负 40%，要记得减一。\n\n---\n\n## 二、平均数增长率：谁除以谁（「后÷前」口诀）\n\n> 问一四年这个单位面积产量的增速是多少？那单位面积产量是什么东西呢？他有没有给你？他不给他给个什么？给个棉花的播种面积，给个棉花的总产量。现在问单位产量，单位产量它是个平均数，它是把这个总产量去除一个播种面积。\n\n> 只要这一个式子能满足「什么除什么」的关系，都可以用平均数增长率去进行计算。就只要它满足 `a = b ÷ c`，就都能用平均数增长率去算。\n> 同理，如果一个数可以满足 `a = b × c`，我们也都可以用乘积增长率去计算。\n\n```\na = b × c   →  用「乘积增长率」：r = r₁ + r₂ + r₁ × r₂\na = b ÷ c   →  用「平均数增长率」：r = (r₁ − r₂) ÷ (1 + r₂)\n```\n\n> ⭐ **它只是数字的一个运算关系，它跟它的具体的概念是什么是没有关系的。** 它不管是什么概念，你只要是 `a = b × c`，就都能用乘积增长率；只要是 `a = b ÷ c`，就都可以用平均增长率。\n\n**「谁除以谁」口诀（板书）**：\n\n| 表达 | 谁除以谁 | 板书原样 |\n| --- | --- | --- |\n| 平均每平方米产量（单位面积产量） | 产量 ÷ 面积 | 平均每平方米产量 → **后÷前** |\n| 人均收入 | 收入 ÷ 人数 | 人均收入 = 收入 / 人数 |\n| 平均每人得分 | 得分 ÷ 人数 | 平均每人得分 = 得分 / 人数 |\n\n> 这边有个口诀的，就是里面有个「每」字。每平方米生产了多少，你就拿后面的去除前面的 —— 后÷前。\n> 人均收入，那还是拿收入去除这个人数。你不要被带歪 —— 你们说一个什么「均前母后」，你自己想：人均收入不是要收入除以人数吗？就大概这个意思，如果这种「人均」「平均」的表达，你拿后面的除前面的。\n> 再比如「平均每人得分」，那不还是拿得分除人数吗？\n> 什么「平均每也是每」「平均每也是均」—— 没必要那么复杂，**就是拿后面的除前面的**。\n\n---\n\n## 三、简化计算：三重取巧思路\n\n画面章节封面：**03 简化计算**\n\n> 我们后面呢在计算的过程中，有一些稍微注意的地方、一些可以优化的地方。不然你做这种题目，就每天在那边死列一个公式、在那边算，可能跟别人的速度上还不好拉开差距，怎么去简化计算呢？\n\n板书（画面原样）：\n\n```\n取巧 ⟸ ① 运算顺序\n       ② 简化步骤\n       ③ 凑整\n```\n\n> 我们在第二节课上讲过，我们想要让自己做题目做的更快更好，主要是什么几种方式？\n> 第一种，注意你的运算顺序；第二种可以简化一些步骤；第三个可以去凑整，简化计算。主要就是三种，去让我们计算做题做的又快又好。\n\n| 取巧方式 | 具体做法 | 老师原话 |\n| --- | --- | --- |\n| ① 运算顺序 | 做增速累积时**先加再乘** | 「因为这个加是最重要的，乘的东西相对来说比较小，影响比较小」 |\n| ② 简化步骤 | ①定性 → 选不出再定量；②把 `r₁ × r₂` 稍微拆分 | 「我能通过定性把这个选项选出来的，我就不要去算它的量了」 |\n| ③ 凑整 | 小增速直接数值相乘÷100；大增速找百化分或按倍数放大 | 「稍微大一点的，你可以用一些百化分」 |\n\n> ⭐ 这种思维在针对计算、或者说后面的分式混合比重问题上，是一个很常见很好用的思维。就做题的时候，你不管做什么题，最好都有这种思维。\n\n> 就是我能通过定性把这个选项选出来的，我就不要去算它的量了。\n\n```\n第一步：定性（只看正负、只看大小方向）\n第二步：定性选不出来，再定量（精确算）\n```\n\n---\n\n## 四、增速累积
