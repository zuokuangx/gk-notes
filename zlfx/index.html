**周转量 ÷ 客运量** |\n| 列式 | `1768.2 亿人公里 ÷ 151080.5 万人` → 截位 `177 / 151` |\n| 速算 | 分母 151 → 143（−8，143 = 1/7）；分子 177 → 167（−10）→ `167 / 143` |\n| 速算 | `167 / 143 = 167 × 7 = 1169` → 1169 |\n| **量级校验** | `1768.2 亿 ÷ 151080.5 万`：把「万」与「亿」消掉 → `1768.2 ÷ 15.108` → **一百多**，不是一千多 |\n| 结论 | **117 公里** → D |\n\n**板书演算（画面原样）**：\n\n```\n 1768.2亿人公里       177       167\n——————————————  ≈  ————  =  ————  = 167 × 7 = 1169\n 151080.5万人         151       143\n                     −10  −8      （×7）\n\n量级校验：\n 1768.2亿        1768.2         1768\n——————————  ≈  ————————（消万、亿）→ —————  ≈ 一百多\n 151080.5万       15.108          15\n\n⇒ 117 公里（D）\n```\n\n> 「这个客运平均运送距离咋算呢？这边要涉及到一个计算公式，就是平均运送距离等于旅客的周转量除以他的客运量。……他的单位是什么？是人。那平均运送距离这个单位是什么？是公里。所以他们俩一乘这两个东西，一乘就是这个周转量，一人公里就是人乘公里。所以他们是这样一个乘积关系。你拿这个一人公里去除这个人，就能得到这个公里。懂了吧？」\n> 「应该把它的分母调成 143，143 的话就是减了一个 8。那分子上比较大一点，干脆又减个 11（这里写 167），167 除以 143 等于乘以 7，167 乘以 7，749？167 乘 7 得 1169，所以选 C1170。」\n> **然后老师自己掉进了量级坑，当场纠正：**\n> 「不好意思，要注意量级的，不能犯过这种问题。这边还有个量级，因为这也是个幺幺七，所以你要看量级。你要看这个东西，它到底是应该是一千公里还是一百公里？」\n> 「那我们来看一下这个大概的一个量，是一七六八亿除以 151080 喂（万）。那这个万和这个亿，我先消掉吧，把它变成万可不可以？然后可以把这个万再跟下面这个消掉，把它变成 15.108 万，可以吧？那 1768 除以 15，应该是一百多，他到不了一千多了，因为他说个十以上的，1700 多除以 10 几，肯定只有 100 多嘛，所以给它 d 啊，117 啊。」\n> 「我这要以身试法，让你们看看，考试的时候一不小心你就会掉进去了。要注意这个量级，虽然这个量级这个坑呢，很不少、不好见、比较少。我去年还是专门把这个题目拿下来，就说让你们注意一下这个量级的坑的，今年自己都忘掉了。」\n\n**【选项原文】**\n- A.107 公里\n- B.1007 公里\n- C.1170 公里\n- D.117 公里\n\n**【答案】** ✅ **D**（板书左侧写 D；C 先被圈后被打叉）\n\n**【解析】**\n- 真实值：`1768.2 亿人公里 ÷ 151080.5 万人 = 117.0 公里` → D。\n- **双重陷阱**：\n  - **单位陷阱**：人公里 ÷ 人 = 公里；分子是「亿」、分母是「万」，相差 10⁴ 倍。\n  - **量级陷阱**：算出的「1169」是**无量级**的纯数值，必须回头消单位确认量级是「百」而不是「千」。选项 C.1170 与 D.117 只有量级之差，正是为不校量级的人准备的。\n- 换算演示（老师口述）：\n\n```\n1768.2 亿 ÷ 151080.5 万\n= 1768.2 × 10⁸ ÷ (1.510805 × 10⁹)\n= 1768.2 ÷ 15.108\n≈ 117（公里）\n```\n\n---\n\n### 4.16 例题 16｜2017 年社会消费品零售总额\n\n**【题干原文】**\n> 2018 全年实现社会消费品零售总额 2613.2 亿元，增长 9.1%。\n> 2017 年，该市社会消费品零售总额约为（ ）亿元。\n> A.2613.2　B.2395.2　C.2378.8　D.2874.8\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2018 年社会消费品零售总额（现期） | 2613.2 亿元 |\n| 同比增长 | 9.1% |\n| 所求（2017 年基期） | ? |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求基期值 |\n| 列式 | `2613.2 / (1 + 9.1%) = 2613.2 / 1091` |\n| 截位 | 各取三位 → `261 / 109` |\n| 凑整 | 分母 109 + 2 = 111；分子 261 + 5 = 266 → `266 / 111` |\n| 速算 | 错位相减 `2660 − 266 = 2394` |\n| 误差修正 | 分母是 111（3 位 1），误差仅 0.1% 级 → `2394 × 1.001 ≈ 2396` |\n| 结论 | ≈ 2395 → **B.2395.2** |\n\n**板书演算（画面原样）**：\n\n```\n 261      +5      266\n——————  ————>  —————  → 2660 − 266 = 2394\n 109      +2      111\n  +5        +2                0.1%\n                              2396\n\n 错误示范（只留两位）：\n 26             26\n———  → 错位相减  ——— = 2340\n 11             11\n                   +1%（错位相减的误差）→ 2363\n                   +1%（截位 109→110 的误差）→ 2389\n                   +0.4%（分子 261→260 的误差）→ ≈2398\n\nB.2395.2  ✔（打钩）\n```\n\n> 「继续 18 年是 2613，增多 9.1%，问 17 年是多少？那期就是限期 2613，除以……那我就想二六一吧，261 除以 109 可以吧？都保留三位。」\n> 「我们给他的分母加 2，那分子是不是要加五啊？下面是 111，上面是 266。然后就错位相减，就把它变成 2394。那这个地方它的误差应该是多少？应该是百分之零点一，因为是三个一，三个一只有百分之零点一，两个一才是百分之一。百分之（之一）应该补上，其实 2396 跟这也差不多。」\n> 「可能有同学这个题目他会错，他怎么错呢？那我不保留三位，我就喜欢保留两位，我就是胆子大，我就搞个二十六除个十一，那就算二六除十一，老师说的除十一等于错位相减、减二六，等于 2340。好像 2340 偏小 1%，还记得加个 23，变成了 2363 了。他这个地方出问题，就是在于它这个分母动的有点多了。」\n> 「然后你要注意，你截位，你把 109 变成了 110，多了 1%。那本来按照除法的放缩，你上面是不是应该也加 1% 去弥补这个误差的？你现在没加，你就抱着这个二十多在算，所以你最后结果上你还要再加个百分之一，这个是截位的误差。所以就是 2363 再加个 23，2389，这样就差不多了。」\n> 「为什么距离还有点距离呢？因为你还把这个 261 也变成 260 了。虽然这个影响比较小，只有那么 0.0 几%……再加个百分之 0.4，这是分子的截位的影响。再加个百分之零点四的话，就大概是十左右。2389 也不到，0.4 也就是 2398 左右，这样就差不多了。」\n\n**【选项原文】**\n- A.2613.2\n- B.2395.2\n- C.2378.8\n- D.2874.8\n\n**【答案】** ✅ **B**（板书左侧写 B，B 项打钩）\n\n**【解析】**\n- 真实值：`2613.2 ÷ 1.091 = 2395.2` 亿元 → B。\n- **本题是三段误差叠加的完整示范**：\n\n| 误差来源 | 大小 | 修正动作 |\n|---|---|---|\n| 除以 111 错位相减 | 0.1% | 2394 → 2396 |\n| 截位 109 → 110 | 1%（**只动分母没动分子**） | +23 |\n| 截位 261 → 260 | ≈ 0.4% | +10 → ≈ 2398 |\n\n- 陷阱类型：**精度陷阱（截位太少 + 分母单边变动不补误差）**。老师用对比方式说明：**保留三位（截三位）误差只有 0.1%~1%，保留两位误差会成倍放大**。\n\n---\n\n### 4.17 例题 17｜2018 年 V 市交通运输、仓储和邮政业增加值（本集未讲）\n\n**【题干原文】**\n> 2019 年全年 V 市交通运输、仓储和邮政业增加值 398 亿元，增长 4.4%\n> 2018 年全年 V 市交通运输、仓储和邮政业增加值约为（ ）亿元。\n> A.376.8　B.381.2　C.385.9　D.390.5\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2019 年 V 市交通运输、仓储和邮政业增加值 | 398 亿元 |\n| 同比增长 | 4.4% |\n| 所求（2018 年基期） | ? |\n\n**【说明】** ⚠️ 本集视频显示到这道题即结束，**老师尚未讲解**（画面上无任何板书演算，转写亦未涉及）。\n\n> 备注：本题为「求基期值」型（`398 / 1.044`），所用方法属于本讲已讲内容——**分母凑百化分/截位 + 补偿误差**。留待后续分集解析。\n\n---\n\n## 五、本讲知识点总表\n\n| 板块 | 核心内容 | 关键公式 / 口诀 | 板书页 |\n|---|---|---|---|\n| 放缩逻辑 | ①简化计算→减少位数（**目的**）；②调整误差→盈亏相抵（**要求**） | 位数越少越好，方向可失控、但**不能没有误差意识** | 放缩逻辑 |\n| 加法放缩 | 四舍五入 + 尾数凑整 | `123+318 ≈ 120+320 = 440`；`479+674 ≈ 480+670 = 1150` | 加法放缩 |\n| 加法放缩 | 「秋后结账」——误差允许留着，但不能一边倒 | `78767+44921+23750+92126+67810 ≈ 79000+45000+24000+92000+67500 = 307500` | 加法放缩 |\n| 加法放缩 | 削峰填谷（预设平均数法） | `平均数 = 预设值 ± (总差额 ÷ 个数)` | 削峰填谷 |\n| 加法放缩 | 削峰填谷适用面窄 | 数越接近越好用；差距大不如直接加 | 削峰填谷 |\n| 减法放缩 | 同大同小，「公平对待」 | `A − B ≈ (A+△) − (B+△) = A+△−B−△` | 减法放缩 |\n| 减法放缩 | 尾数法 | 加减题、选项保留到个位时看尾数；**负值尾数要「补 10」反向看** | 尾数法 |\n| 除法放缩 | 原理 | `A/B = A(1+r) / B(1+r) = (A+A×r)/(B+B×r)`；`△₁/△₂ = A/B` | 除法放缩 |\n| 除法放缩 | 操作模式一：减少分母位数 | ①截位：1.91→2.00；1.78→1.8；1.18→1.2　②凑百化分：1.23→1.25；1.39→1.43；1.13→1.11 | 操作模式——减少分母位数 |\n| 除法放缩 | 常用 1/n 表 | 333→1/3；25→1/4；2→1/5；167→1/6；143→1/7；125→1/8；111→1/9；9→1/11；667→2/3；366→11/3；286→2/7 | 常用 1/n 表 |\n| 除法放缩 | 操作模式二：补偿误差 | ①`A/B ≈ (A+A×r)/(B+B×r)`（分子近似等比例变化）②`A/B ≈ A/(B×(1+r)) × (1+r)`（结果近似等比例调整） | 操作模式——补偿误差 |\n| 除法放缩 | 计算小技巧 | `A/11 ≈ A×9 = 10A − A`；`A/11n ≈ A×9÷n`；`A/9 ≈ A×11 = 10A + A`；`A/9n ≈ A×11÷n`；`A/5 = A×2` | 计算小技巧 |\n| 除法放缩 | 错位误差 | ÷11 误差 1%；÷111 误差 0.1%；÷1111 误差 0.01%；**错位相加/相减结果一律偏小，要往上扩** | 计算小技巧 |\n| 放缩纪律 | 移动幅度 | **分母/分子移动不超过 10%** | 操作模式——补偿误差 |\n\n---\n\n## 六、速算口诀与解题流程\n\n### 6.1 口诀汇总\n\n```\n【加法】\n① 有借有还：一个数往上凑，另一个数就往下凑，让误差抵消\n② 秋后结账：前面借多了，后面象征性还一点；实在还不了就记着\"我偏大\"\n③ 削峰填谷：先预设中位数附近的整数，再看盈和亏\n   盈 = 亏  →  预设值就是平均数\n   盈 > 亏  →  平均数 > 预设值\n   盈 \u003c 亏  →  平均数 \u003c 预设值\n   修正量 = 总差额 ÷ 个数\n\n【减法】\n④ 同大同小、公平对待：A 和 B 必须往同一个方向调\n⑤ 尾数法：纯加减 + 选项保留到个位时看尾数\n   负值尾数要\"补 10 反过来看\"（−493 的尾数当 7 看）\n\n【除法】\n⑥ 分母是主角：重点减少分母位数，分子只是配合\n⑦ 两条通道：截位（→整数/一位小数）或凑百化分（→1/n 的数值）\n⑧ 补偿误差两条路：\n   分子法 = 分母动多少比例，分子跟多少比例（分子不整时用）\n   结果法 = 分子不动，先算再按比例回调结果（分子整时用）\n⑨ 错位相加：除以 9（9 的倍数先除倍数再除 9）\n   错位相减：除以 11（11 的倍数先除倍数再除 11）\n   错位相加/相减结果都偏小 → 往上扩\n   111 补 0.1%，1111 补 0.01%，11 才补 1%\n⑩ 除以 5 = 乘以 2；除以 2 直接掰一半\n⑪ 移动不超过 10%\n```\n\n### 6.2 除法放缩标准流程\n\n```\nStep 1  看清题型：增速 / 基期 / 平均数 / 占比 / 倍数\nStep 2  写对式子（增速先减出生增长量再除；基期除以 1+r）\nStep 3  上下各截三位（保留三位误差仅 0.1%~1%）\nStep 4  观察分母：附近有整数就截位，附近有 1/n 数值就凑百化分\nStep 5  分子跟着动：\n         · 分子不整 → 按比例同步调整（横向看占比 / 纵向看倍数）\n         · 分子很整 → 先不动，算完在结果上回调\nStep 6  用错位相加/相减、除以 5 乘 2 等技巧出数\nStep 7  补回误差：错位相加/相减偏小 → 往上扩（÷11 扩 1%，÷111 扩 0.1%，÷1111 扩 0.01%）\nStep 8  看选项：能区分就停手；量级/单位再核一遍（千万别忘）\n```\n\n### 6.3 三条「什么时候不用放缩」\n\n```\n① 已是明显整数倍关系：如 422.68/14 → 42 是 14 的 3 倍，直接出结果\n② 常识可替代：全国人口按 14 亿直接用（近年人口基本停滞）\n③ 纯加减且选项到个位：直接用尾数法，无需估算\n```\n\n---\n\n## 七、易错点与陷阱清单\n\n| 序号 | 陷阱 / 易错点 | 具体表现 | 正确做法 |\n|---|---|---|---|\n| 1 | **累计值陷阱** | 材料给「上半年/前三季度/全年」等累计值，直接拿来比较或直接当单季值用 | 求单季/下半年必须先**作差**（下半年 = 全年 − 上半年） |\n| 2 | **减法的方向陷阱** | 只动 A 不动 B，或 A、B 反向调整 | 必须**同大同小**（A 加 △，B 也要加 △） |\n| 3 | **尾数法的负值陷阱** | 选项里同时有 `+493` 与 `−493`，两者的「尾数」都像 3 | 负值尾数要**补 10 倒看**（−493 的尾数当 7），尾数为 3 只能是正值 |\n| 4 | **错位相加/相减不补误差** | 用 `A/9`、`A/11` 口算后直接定答案 | 结果**一律偏小**，要往上扩：÷11 扩 1%、÷111 扩 0.1%、÷1111 扩 0.01% |\n| 5 | **移动幅度过大** | 把分母 122 直接凑成 100（−18%），误差失控 | **移动不超过 10%**；宁愿凑 125 也别凑 100 |\n| 6 | **截位过少** | 3620/1585 直接截两位算（如 26/11） | **截三位保准**；截两位的误差成倍放大，还要连补三段误差 |\n| 7 | **单边截位不补** | 分母 109→110（+1%）但分子没动 | 分母单边变大 ⇒ 结果偏小 ⇒ 结果要 **+1%** |\n| 8 | **量级陷阱（最隐蔽）** | 1768 亿 ÷ 151080 万，算出 1169 直接选 1170 | 出数后**回头消单位**确认量级（亿 vs 万相差 10⁴），本题答案是 117 |\n| 9 | **求增速先算倍数** | `63061 ÷ 55200 − 1`，误差被放大 10 倍 | 先减出**增长量**再除：`7861 ÷ 55200`，误差小一个量级 |\n| 10 | **减少量的分母用错** | 减少量 ÷ 现期值 | 减少量要 ÷ **基期值**（基期 = 现期 + 减少量） |\n| 11 | **多组数据取错组** | 柱状图有「固定互联网」和「移动宽带」两组，取了后者 | 先圈定题干关键词再取数 |\n| 12 | **占比的分母取错** | 食品烟酒占比用「人均可支配收入 25974」做分母 | 占比的分母是**人均消费支出 18323** |\n| 13 | **削峰填谷用错场景** | 各数差距很大（878 / 24600 / 7270）仍强行削峰填谷 | 数越接近越好用；差距大不如直接加 |\n| 14 | **削峰填谷忘平摊** | 得到总差额 1000 就直接 6 万 − 1000 | 总差额要**除以个数**再修正（−1000 ÷ 4 = −250） |\n| 15 | **排除方向记反** | 算出结果偏大，却往上选 | 算出偏大 ⇒ 选**偏小**的；算出偏小 ⇒ 选**偏大**的 |\n\n---\n\n## 八、老师金句\n\n> ⭐「放缩的目的一定是减少位数，它不可能是让你去增加位数的。你要是增加位数，那这个放缩肯定是不到位的。」\n\n> ⭐「这个（调整误差）不是目的，是为了让我们达到更准确的结果的一个要求。你要有这种调整误差的意识，**你可以不去调整，但你不能没有这个意识**。」\n\n> ⭐「你欠人家十块钱，你说那我这边也没有零钱，我把个一百个给你吧？那这不直接导致对方欠你九十了，这个账更还不掉了。所以怎么办呢？那就继续欠着嘛。」\n\n> ⭐「你只要心里面有误差，你记得你的误差在哪就可以了。」\n\n> ⭐「这个（削峰填谷）的应用面其实并不广，不过有时候也能用得上，所以要介绍一下。」\n\n> ⭐「我们做除法的时候，其实我们往往不是去烦那些分子位数太多，我们烦的是分母。所以我们要调整的是分母，**重点是分母，分子只是为了去配合它**。」\n\n> ⭐「**分子调整这一步一定不要太准确，好算一点就够了**。不要怕他不准——因为你的分母本身就动的很小。」\n\n> ⭐「凡是涉及到**除以 9**，你就可以直接错位相加；**除以 11** 就错位相减。」\n\n> ⭐「错位相加、错位相减，**结果都偏小 1%**，都要往上扩百分之一。」\n\n> ⭐「我建议大家做放缩法的时候，不管是除法放缩还是乘法放缩，这个移动的范围**不要超过 10%**。你动 10% 以内，我保你基本上不怎么错。」\n\n> ⭐「这种等比例放缩的放缩法，除了放缩，其实我认为它是**截位直除的完全的上位法**。它拥有截位直除的优点，位数也可以很少；它有一些截位直除没有的优点，我可以人为的去控制好这个误差，我还能去凑一下百化分，你截位直除能凑百化分吗？」\n\n> ⭐「放缩是不是比什么截位直除香多了？**你可细可粗。想快可以快，想慢也能慢，想准也能准。**」\n\n> ⭐「放缩它的优点是**通用**。你只要涉及到除法，你都可以用它。」\n\n> ⭐「计算它是最末位的东西，真的不重要。……读题理解题目、找数据最花时间。所以一般来说我跟你们差距最小的，就是这种求和的题，他也得一个个加，没有什么技巧性的东西。」\n\n> ⭐「你本身的 42 就是 14 的 3 倍，你还出（放缩）啥呀？……**你不要为了放缩而放缩**。」\n\n> ⭐「涉及到全国人数的时候，还是可以借助一点点常识的。」\n\n> ⭐「我这要以身试法，让你们看看，考试的时候**一不小心你就会掉进去了**——要注意这个量级。」\n\n> ⭐「你练熟了之后，你就永远不用担心说这个除法好难算、好麻烦、这个数字不好算，**你可以把它变成任意你想要算的好算的数**。」\n\n> ⭐「你分母动的不多，别超过百分之十，它基本上能保你基本上没什么误差的。」\n\n---\n\n## 九、画面与转写的差异 / 存疑处\n\n| 位置 | 转写 | 画面 | 采用 |\n|---|---|---|---|\n| 加法放缩标题 | 「尾数部分凑整」口播为「尾数部分凑整」 | 板书「四舍五入，尾数部分凑整，『有借有还』」 | 以画面为准 |\n| 削峰填谷 | 转写「薛峰填股 / 宣文挺广 / 削风填谷」 | 板书「削峰填谷」 | 以画面为准 |\n| 例题 2 选项 | 转写提到「59500、56600、51600」 | 板书为 `A.59859 B.56746 C.61497 D.62864` | 以画面为准 |\n| 例题 7 选项 A | 转写未读清 | 画面 `A.12.6%` | 以画面为准 |\n| 例题 8 题目 | 转写「2022 年下半年」 | 画面为「2020 年度国内旅游人数 28.79 亿人次…同比约（ ）」，选项 `A.下降51.2% B.下降48.8% C.下降53.8% D.下降47.6%` | 以画面为准 |\n| 例题 12 选项 B | 转写「在1到1.2人之间」 | 画面 `B.在1.1到1.2人之间` | 以画面为准 |\n| 例题 13 图 1 的 2017 年数值 | 转写「55200」 | 前一道题（例题 7）表格显示 `55200`；本图象 1 柱标显示为 `55103`，老师圈注后按 551 计算 | **两处画面数值本身不一致，此处按各自画面记录**（存疑） |\n| 例题 14 题干 | 转写「2020年第一季度全国…出口的水产品」 | 画面「2024 年第一季度全国烤烟出口均价」，图 1/图 2 均为烤烟 | 以画面为准 |\n| 例题 14 图 1 10 月出口额 | 转写「69350」 | 画面柱标字迹不清（转写与画面均不清晰） | 标注「画面不清」 |\n| 例题 15 题干 | 转写「Q省2018年…」 | 画面一致：`Q 省 2018 年旅客周转量 1768.2 亿人公里` | 一致 |\n| 例题 16 题干 | 转写「某市」 | 画面「该市」；数值一致（2613.2 亿元、9.1%） | 以画面为准 |\n| 例题 17 | 转写未提及 | 画面为 V 市 398 亿元、增长 4.4%，选项 `A.376.8 B.381.2 C.385.9 D.390.5`，本集结束未讲解 | 以画面为准 |\n| 快速练习 ⑤ | 转写「把它想成二二二…分母上加个4…490除以222…245除11…221」 | 板书可见「4850/2180 → 490/222 → 245/111」 | 大体一致，个别口播数字（如「上加4」）与板书不符，以板书为准 |\n| 快速练习 ⑦ 路线一 | 转写「455 对 44…730 先除 4 等于 182…再除 11 错位相减 164」 | 板书 `744/444（455−11）→ 730/444 → 182/111 → 164` | 以画面为准 |\n| 计算小技巧第 2 条 | 转写「除九的倍数，你也可以先把这个倍数除掉，再去除以九」 | 板书写作 `A/11n`（分母字迹为 `nn`/`11n`，辨识度低） | 按上下文取「11 的倍数」；**存疑** |\n| 常用 1/n 表「366」行 | 转写口播为「3/11」「3+3/2=3.666」 | 板书对应列写为 `11/3` | 以画面为准；讲解中的 `3/11` 指「除以 11/3 = 乘以 3/11」 |\n| 乘法放缩 | 目录列出 | 本集**未展开讲解**（视频结束于除法放缩练习后的第 17 题） | 如实标注 |\n\n**存疑清单（3 处）**：\n\n1. **2017 年软件业务收入**：例题 7 的表格显示 `55200`，例题 13 的图 1 柱标显示为 `55103`，两处画面数值不一致（转写读作「55200」）。\n2. **图 2 的同比增速折线数值**（例题 13）：字迹较小，2014 年处标注辨识不清（疑为 5.30% 或 4.30%），本讲未用于解题。\n3. **计算小技巧第 2 条的分母写法**：画面字符形如 `nn`（可能是 `11n` 的草写），按上下文与讲解取「11 的倍数」。\n","outline":[{"level":2,"text":"一、开篇：放缩的两条根本逻辑","id":"一开篇放缩的两条根本逻辑"},{"level":2,"text":"二、加法放缩","id":"二加法放缩"},{"level":3,"text":"2.1 「有借有还」：四舍五入 + 尾数凑整","id":"21-有借有还四舍五入-尾数凑整"},{"level":3,"text":"2.2 「秋后结账」：误差可以留着，但不能一边倒","id":"22-秋后结账误差可以留着但不能一边倒"},{"level":3,"text":"2.3 例题 1｜2018—2022 年我国新立采矿权总数","id":"23-例题-120182022-年我国新立采矿权总数"},{"level":3,"text":"2.4 削峰填谷（预设平均数法）","id":"24-削峰填谷预设平均数法"},{"level":3,"text":"2.5 例题 2｜(71165+43357+57826+67089)÷4","id":"25-例题-2711654335757826670894"},{"level":3,"text":"2.6 削峰填谷的适用面为什么窄","id":"26-削峰填谷的适用面为什么窄"},{"level":3,"text":"2.7 例题 3｜2003—2007 年 SCI 平均每年收录中国科技论文","id":"27-例题-320032007-年-sci-平均每年收录中国科技论文"},{"level":3,"text":"2.8 例题 4｜2012—2016 年固定互联网宽带接入用户平均数","id":"28-例题-420122016-年固定互联网宽带接入用户平均数"},{"level":2,"text":"三、减法放缩","id":"三减法放缩"},{"level":3,"text":"3.1 「同大同小、公平对待」","id":"31-同大同小公平对待"},{"level":3,"text":"3.2 例题 5｜2022 年下半年全国居民人均经营净收入","id":"32-例题-52022-年下半年全国居民人均经营净收入"},{"level":3,"text":"3.3 尾数法（含负值尾数的处理）","id":"33-尾数法含负值尾数的处理"},{"level":3,"text":"3.4 例题 6｜2022 年四个季度人均工资性收入最高者","id":"34-例题-62022-年四个季度人均工资性收入最高者"},{"level":2,"text":"四、除法放缩（本讲重点）","id":"四除法放缩本讲重点"},{"level":3,"text":"4.1 原理：分子分母等比例变化，结果不变","id":"41-原理分子分母等比例变化结果不变"},{"level":3,"text":"4.2 操作模式一：减少分母位数（截位 / 凑百化分）","id":"42-操作模式一减少分母位数截位-凑百化分"},{"level":3,"text":"4.3 常用 1/n 表与三大「百化分」通道","id":"43-常用-1n-表与三大百化分通道"},{"level":3,"text":"4.4 操作模式二：补偿误差（分子法 / 结果法）","id":"44-操作模式二补偿误差分子法-结果法"},{"level":3,"text":"4.5 计算小技巧（错位相加 / 错位相减及其误差）","id":"45-计算小技巧错位相加-错位相减及其误差"},{"level":3,"text":"4.6 例题 7｜2018 年我国软件业务收入比上年增长","id":"46-例题-72018-年我国软件业务收入比上年增长"},{"level":3,"text":"4.7 例题 8｜2020 年度国内旅游人数同比","id":"47-例题-82020-年度国内旅游人数同比"},{"level":3,"text":"4.8 例题 9｜2017 年全国互联网企业电子商务平台收入","id":"48-例题-92017-年全国互联网企业电子商务平台收入"},{"level":3,"text":"4.9 例题 10｜食品烟酒和居住占居民人均消费支出的百分比","id":"49-例题-10食品烟酒和居住占居民人均消费支出的百分比"},{"level":3,"text":"4.10 快速练习（10 道除法放缩练习 + 整百版复练）","id":"410-快速练习10-道除法放缩练习-整百版复练"},{"level":3,"text":"4.11 例题 11｜2022 年全国每万人拥有的体育场地数量","id":"411-例题-112022-年全国每万人拥有的体育场地数量"},{"level":3,"text":"4.12 例题 12｜G 省平均每件法律援助案件帮助受援群众","id":"412-例题-12g-省平均每件法律援助案件帮助受援群众"},{"level":3,"text":"4.13 例题 13｜2017 年我国软件和信息技术服务业从业人员","id":"413-例题-132017-年我国软件和信息技术服务业从业人员"},{"level":3,"text":"4.14 例题 14｜2024 年第一季度全国烤烟出口均价","id":"414-例题-142024-年第一季度全国烤烟出口均价"},{"level":3,"text":"4.15 例题 15｜Q 省客运平均运送距离（量级陷阱）","id":"415-例题-15q-省客运平均运送距离量级陷阱"},{"level":3,"text":"4.16 例题 16｜2017 年社会消费品零售总额","id":"416-例题-162017-年社会消费品零售总额"},{"level":3,"text":"4.17 例题 17｜2018 年 V 市交通运输、仓储和邮政业增加值（本集未讲）","id":"417-例题-172018-年-v-市交通运输仓储和邮政业增加值本集未讲"},{"level":2,"text":"五、本讲知识点总表","id":"五本讲知识点总表"},{"level":2,"text":"六、速算口诀与解题流程","id":"六速算口诀与解题流程"},{"level":3,"text":"6.1 口诀汇总","id":"61-口诀汇总"},{"level":3,"text":"6.2 除法放缩标准流程","id":"62-除法放缩标准流程"},{"level":3,"text":"6.3 三条「什么时候不用放缩」","id":"63-三条什么时候不用放缩"},{"level":2,"text":"七、易错点与陷阱清单","id":"七易错点与陷阱清单"},{"level":2,"text":"八、老师金句","id":"八老师金句"},{"level":2,"text":"九、画面与转写的差异 / 存疑处","id":"九画面与转写的差异-存疑处"}]},{"id":"P05","title":"放缩运算（下）","full":"第三课 放缩运算（下）","lect":"","dur":"22:48","sec":1368,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 5 集\n# 第三课 放缩运算（下）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 5 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=5`\n> **时长**：约 22 分 48 秒\n> **本集主题**：**放缩运算（下）**——除法放缩收尾（截位习惯 + \"计算对象\"误差陷阱）、乘法放缩原理与专项口算训练、乘法放缩两道综合例题、第三课放缩运算总结\n\n---\n\n## 目录\n\n- [一、本集在课程中的位置（承接上集）](#一本集在课程中的位置承接上集)\n- [二、除法放缩收尾：截位习惯与\"计算对象\"陷阱](#二除法放缩收尾截位习惯与计算对象陷阱)\n- [三、乘法放缩原理（板书幻灯片）](#三乘法放缩原理板书幻灯片)\n- [四、乘法放缩示范与专项口算训练](#四乘法放缩示范与专项口算训练)\n- [五、例题精讲](#五例题精讲)\n  - [第 1 题｜V市交通运输业增加值（基期 + 增量变体）](#第-1-题v市交通运输业增加值基期--增量变体)\n  - [第 2 题｜2016年该省4G用户数增量](#第-2-题2016年该省4g用户数增量)\n  - [第 3 题｜2016年某市邻里关系调查（乘法放缩）](#第-3-题2016年某市邻里关系调查乘法放缩)\n- [六、第三课放缩运算总结（板书原文）](#六第三课放缩运算总结板书原文)\n- [七、本讲知识点总表](#七本讲知识点总表)\n- [八、速算口诀与解题流程](#八速算口诀与解题流程)\n- [九、易错点与陷阱清单](#九易错点与陷阱清单)\n- [十、老师金句](#十老师金句)\n\n---\n\n## 一、本集在课程中的位置（承接上集）\n\n本集是**第三课「放缩运算」的下半场**（上半场见第 4 集），开头直接承接上一集讲了一半的**除法放缩**例题。本集完整脉络：\n\n| 段落 | 内容 | 板书/画面依据 |\n| --- | --- | --- |\n| 开场 | 除法放缩收尾题（V市增加值），讲截位习惯 | `f_0001`~`f_0025` |\n| 过渡 | 把题目改成\"问增量\"，引出**计算对象**误差陷阱（呼应第二节课） | `f_0025`~`f_0035` |\n| 主体 1 | 乘法放缩原理（幻灯片 + 红字推导） | `f_0036`~`f_0045` |\n| 主体 2 | 乘法放缩示范（8622×2.1‰）+ 7 道口算训练 | `f_0046`~`f_0100` |\n| 例题 | 4G 用户增量题、邻里关系调查题 | `f_0101`~`f_0153` |\n| 收尾 | 「第三课放缩运算总结」三张卡片 | `f_0154`~`f_0171` |\n\n> 老师预告：**增速很小的时候怎么算增量**，\"请听下回分解，我们明天来讲\"（下一集内容，本集不展开）。\n\n---\n\n## 二、除法放缩收尾：截位习惯与\"计算对象\"陷阱\n\n### 2.1 题目（承接上集板书，画面 `f_0001`）\n\n> 2019年全年V市交通运输、仓储和邮政业增加值 **398 亿元**，**增长 4.4%**。2018年全年V市交通运输、仓储和邮政业增加值约为（ ）亿元。\n> A.376.8　B.381.2　C.385.9　D.390.5\n\n### 2.2 截位习惯：为什么分母写 1044 而不是 104\n\n板书列式 `398/(1+4.4%)`（画面红笔把\"增长4.4%\"圈出）。老师特意解释了截位习惯（转写原话，同音字已修正）：\n\n> > 这里为什么不写 104，我写 1044？因为我就是这么感觉：如果你在写分母的时候截掉了这一位，是让这个 4.4% 变成了 4%，**我会觉得对于这个增速的影响有点大了**。虽然可能说在整个式子里只是千分之四（0.4 个百分点）的影响，可能确实不影响你解出答案，**但我感觉这个习惯不太好**。\n> >\n> > **所以如果这种增速它比较小，你截了这一位，对它来说意义比较重大，我是不太想把它截掉的。**\n\n### 2.3 放缩求解（板书，`f_0017`~`f_0025`）\n\n```\n398/(1+4.4%) = 398/1044\n分母 1044 离 1000 比离 1100 更近 → 分母减 44，变成 1000\n分子补零：398 → 3980\n3980/1000 = 382 → 最接近 B（381.2）✅\n```\n\n> 老师点评：这么一推就推过去了，\"平平无奇，这不也很简单\"。**真正的考点在下面这个变体。**\n\n### 2.4 变体：把问题换成\"增量\"——放缩翻车现场（`f_0025`~`f_0035`）\n\n老师口头改造题目：**不问基期了，问它的增量**。选项为板书手写（转写口述一致）：A.15.2　B.16　C.16.8　D.17.6。\n\n```\n若沿用上面的放缩结果：398 − 382 = 16 → 会选到 B（16）\n但按前面的准确答案看：增量明明是 16.8 → 应该选 C\n```\n\n> > 老师，你不是说放缩精度也很高吗？它的精度那么高，怎么 16 跟 16.8 它也分不清呢？\n\n**原因：跟第二节课讲的\"计算对象\"息息相关。**\n\n```\n放缩算出来的对象是\"基期\"：300 多的量级\n    偏差 1%   → 影响 3.8\n    偏差 0.5% → 影响 1.9\n而问题是\"增量\"：16 点几的量级\n    3.8、1.9 的影响对它来说\"无法承受\"\n```\n\n> ⭐ **\"这个就好像时代的一粒沙，落在了增量身上。这个沙子对于 382 来说很小，但是压在他身上，能直接把他压死。\"**（板书红字：`1% → 3.8`、`0.5% → 1.9`，见 `f_0033`）\n\n**本段结论（转写原文，同音字已修正）：**\n\n> > 从这个题目我们可以知道：**这种比较小的增速，不建议你用放缩法先算基期、再算增量**，这样容易出问题——基期的一点点误差，会让你的增量误差显得很大。\n> >\n> > 那增速比较小的时候怎么算增量？**请听下回分解，我们明天来讲。**\n>\n> 老师还提醒：放缩法不太适合\"除以 1.0 几、然后把它变成 100（量级差太远）\"这种操作，这样的速算容易出问题；今天先把基本的乘除运算搞清楚。\n\n---\n\n## 三、乘法放缩原理（板书幻灯片）\n\n**幻灯片原文（`f_0041`）：**\n\n> **乘式的两边反方向小幅度等比例调整，则几乎不影响结果。**\n\n**板书公式链（幻灯片 + 红字推导，`f_0045`~`f_0049`）：**\n\n```\nA×B ≈ A×B×(1-r^2) = A×(1+r)×B×(1-r) = (A+A×r)×(B-B×r)\n\n其中：(1+r)×(1-r) ≈ 1-r^2   （平方差公式）\n红字板书：r ≤ 10%  →  r^2 ≤ 1%  →  1-r^2 ≥ 99%（跟 1 基本没差别）\n```\n\n**原理解读（转写）：**\n\n> > 除法放缩是分子分母要**同方向**变化；乘法放缩呢？乘法的误差是两边要**反方向**变化的——你一边变大，另外一边就要变小，不然这个误差你就控不住。所以乘法放缩就是：两边以一个接近的、小幅度的等比例调整，基本上不影响结果。\n> >\n> > 我让 a 变大一个比例，让 b 变小一个比例，两个比例乘起来 (1+r)×(1-r)，根据平方差公式约等于 1-r²。只要动的比例比较小——比如 r ≤ 10%，那 r² ≤ 1%，1-r² ≥ 99%，跟 1 就基本上没差别。\n\n**与除法放缩的对比（转写归纳）：**\n\n| 对比项 | 除法放缩 | 乘法放缩 |\n| --- | --- | --- |\n| 变化方向 | 分子分母**同方向**变化 | 两边**反方向**变化 |\n| 误差 | 上下同乘同比例（如同乘 10%）可以**完整消掉** | **天然自带误差**（1-r²），消不掉 |\n| 使用频率 | 常用 | \"我一般用的也少，但有时候还是蛮好用\" |\n| 适用场景 | 精度要求较高也可用 | **选项差距大、精度要求没那么高时**用用蛮好 |\n| 定位（老师原话） | — | ⭐\"**它适合估，适合快，但它不适合精**\" |\n\n---\n\n## 四、乘法放缩示范与专项口算训练\n\n### 4.1 示例：`8622×2.1‰`（板书 `f_0057`）\n\n> 老师原话：我想的是 862 乘以 21。我觉得位数太多了，要把它变小，就把 21 变成 20——这是不是减了 5% 左右？那这边就给它加 5% 左右，\"五八四十\"，变成 900。900×20 = 18000，即 ≈ 18。这样也挺准的。\n\n```\n8622×2.1‰ → 各挪一位 → 862×2.1（量级不变）\n调整：21 → 20（减 1，约 -5%）；862 → 900（约 +5%）\n900×20 = 18000 → 还原量级 ≈ 18\n计算器验证：8622×2.1‰ = 18.106，精度还是可以的\n```\n\n**两种\"看误差\"的方法（转写，与除法放缩同理）：**\n\n| 方法 | 操作 | 本例 |\n| --- | --- | --- |\n| 看比例 | 21→20 少 5% 左右，另一边补 5% 左右，比例一样就行 | 862 加 5% ≈ 900 |\n| 看倍数 | 21 变 20 是减 1；862 大概是 21 的 40 倍左右，那就加 40 | 862+40 ≈ 900 |\n\n⭐ **抓准 1% 这个特殊点位（老师反复强调）：**\n\n> > 你看这种乘除的误差，重点抓**百分之一**，因为你一般动的不多。21 的 1% 是 0.2，你减了个 1，是 0.2 的 5 倍，所以是 5%。**1% 不需要你算什么东西，只要挪小数点**——21 变成 0.2，那 1 是 0.2 的 5 倍，这 5% 就出来了。\n\n### 4.2 专项口算训练（板书 7 题，`f_0064`~`f_0100`）\n\n> 板书标题：**乘法放缩（估 · 快）**（`f_0068`，\"估、快\"为老师红笔圈注）\n\n| # | 题目 | 放缩思路（转写 + 板书红字） | 估算结果 | 老师给的参照值 |\n| --- | --- | --- | --- | --- |\n| 1 | `5097×5.8%=` | 5097→5000（变小约 2%）；5.8%→6%（变大约 3%，\"虽然不止 2%，但我觉得这个误差我可以接受，我不去调得那么准\"） | `5000×6% = 300` | — |\n| 2 | `572×3.8%=` | 3.8→4（+2，约 +5%）没问题；但 572 **不能变 500**（\"明显变小了太多了，要稍微注意一下这个差距\"）；57.2 的 5% ≈ 3，减 3.2 → 54 | `54×40 = 2160 → 21.6` | 计算器 `572×3.8% = 21.736`，\"其实也够准的\" |\n| 3 | `8762×9.4%=` | 9.4→9（94 减 4，约 -4%）；87→90（8762→9000，加约 3%） | `9000×9% = 810` | —（板书另有一行过渡演算，字迹较小，画面显示为\"8762×9.5%=816\"一类的中间步骤，转写不清） |\n| 4 | `1580×9.6%=` | \"不要算得那么准，前面放缩就用来估的\"：1580→1500，9.6%→10% | `1500×10% = 150` | — |\n| 5 | `7927×6.9%=` | 6.9→7（变大一点），那 7.9→7.8（变小一点，\"7.7 也行\"） | `78×7 = 546 → 54.6` | \"你算个 553 出来，跟算个 546 出来，很多题目里真没影响\" |\n| 6 | `6394×4.4%=` | 4.4→4（少 10%）；6394→7000（加 600，多约 10%） | `7000×4% = 280` | 转写口述\"直接乘下来 281.6\"，\"不会差太多——我本身动的就没有那么多\" |\n| 7 | `4418×(-8.5)%=` | **负的不要管，看绝对值**；8.5→8（85→80，少约 6%）；4418→4700（加 200 多，+6%） | `4700×8% = 376` | \"直接乘的话就是 375.5，差不多就行\" |\n\n> > 有些同学总说感觉用不好乘法放缩，可能就是因为你把乘法放缩想得太精确了。**你就大概地估一个**，不要求它搞得很准——这些方法设计出来的目的就是不一样的。\n\n> > 如果题目的精度要求比较高，你就老老实实的：简单一点、少动一点，或者就老老实实硬算了。\n\n---\n\n## 五、例题精讲\n\n### 第 1 题｜V市交通运输业增加值（基期 + 增量变体）\n\n**【题干原文】**（画面 `f_0001`，逐字）\n\n> 2019年全年V市交通运输、仓储和邮政业增加值 **398 亿元**，**增长 4.4%**。2018年全年V市交通运输、仓储和邮政业增加值约为（ ）亿元。\n\n**【材料数据】**\n\n| 指标 | 时期 | 数值 | 增速 |\n| --- | --- | --- | --- |\n| V市交通运输、仓储和邮政业增加值 | 2019年全年 | 398 亿元 | 4.4% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 已知现期 + 增长率，求**基期** |\n| 定位数据 | 现期 398 亿元，增速 4.4% |\n| 列式 | `398/(1+4.4%)` |\n| 速算步骤 | 分母保留 1044（不截成 104）；放缩 `1044-44=1000`，分子补零 `3980`；`3980/1000=382` |\n| 结论 | 382 最接近 381.2 → B |\n\n**【选项原文】**\n\n- A.376.8\n- B.381.2\n- C.385.9\n- D.390.5\n\n**【答案】** ✅ B\n\n**【解析】**\n\n```\n398/(1+4.4%) = 398/1044 ≈ 3980/1000 = 382 → 选 B（381.2）\n```\n\n- 分母不写 104 而写 1044：**小增速不能随意截位**，4.4% 截成 4% 对增速本身影响太大（陷阱类型：**截位习惯陷阱**）。\n- 离 1000 近就凑 1000，\"减个 44\"，同时分子补零保量级。\n\n**【变体（老师口头改造 + 板书手写选项）】问增量：**\n\n> 选项（板书手写，转写口述一致）：A.15.2　B.16　C.16.8　D.17.6\n\n```\n沿用放缩结果：398 − 382 = 16 → 误选 B（16）\n准确答案：增量明明是 16.8 → 应选 C\n```\n\n- **陷阱类型：计算对象陷阱（误差量级错配）**。放缩结果服务于\"300 多\"的基期，1% 的偏差 = 3.8、0.5% = 1.9；对\"16 点几\"的增量来说是致命偏差。\n- **结论**：小增速（分母是 1.0 几）时**不要**用放缩先算基期再算增量；怎么算，下一集讲。\n\n---\n\n### 第 2 题｜2016年该省4G用户数增量\n\n**【题干原文】**（画面 `f_0104`~`f_0108`，逐字）\n\n> 2016年，该省电话用户数为 **1.69 亿**，其中固定电话用户数为 **2609.7 万**，移动电话用户数为 **14349 万**，分别比上年减少 **197.4 万户**和 **203.1 万户**。移动电话中4G移动电话用户数为 **9085.30 万**，占移动电话用户的比重由上年的 **38.5%** 提升至 **63.3%**。\n> 2016年该省移动电话用户中4G用户数比2015年大约增加了多少万？\n\n（注：\"移动电话中4G移动电话用户数为 9085.30 万\"一句在画面 `f_0108` 起以红字标注显示；转写口述\"这个是16年 9085 万\"一致。）\n\n**【材料数据】**\n\n| 指标 | 2016年 | 比上年 |\n| --- | --- | --- |\n| 该省电话用户数 | 1.69 亿 | — |\n| 固定电话用户数 | 2609.7 万 | 减少 197.4 万户 |\n| 移动电话用户数 | 14349 万 | 减少 203.1 万户 |\n| 移动电话中4G用户数 | 9085.30 万 | 占比由上年 38.5% 提升至 63.3% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 已知**今年（现期）4G 用户数**，求比**上年（基期）**增加了多少 → 增量 = 现期 − 基期 |\n| 定位数据 | 现期 4G 用户 9085.30 万；2015 年 4G 用户材料没直接给——只给了**上年的比重 38.5%**，需要先还原 2015 年移动电话用户总数 |\n| 求基期总量 | `14349 + 203.1 ≈ 14550 万户`（板书：`14349+203=14550`；减少 → 加回） |\n| 求基期4G | `14550 × 38.5%`——位数太多，\"直接 1455×385 乘完一分钟没了\" → **乘法放缩** |\n| 乘法放缩 | 反方向等比例：`38.5 → 40`（+1.5，约 +4%）；`14550 → 14000`（−550，约 −4%）→ `14000×40% = 5600`（板书圈出 `=5600`） |\n| 求增量 | `9085 − 5600 = 3485` → 最接近 B |\n\n**【选项原文】**\n\n- A.3154\n- B.3483\n- C.3844\n- D.4239\n\n**【答案】** ✅ B（3483）\n\n**【解析】（板书演算，`f_0108`~`f_0124`）**\n\n```\n2015年移动电话用户 = 14349 + 203.1 ≈ 14550 万户\n2015年4G用户 ≈ 14550 × 38.5%\n   乘法放缩（反方向）：38.5→40（+4%），14550→14000（-4%）\n   ≈ 14000 × 40% = 5600 万户\n增量 ≈ 9085.30 − 5600 = 3485 万 → 选 B（3483）\n```\n\n- **误差为什么可控（老师逐句论证，转写）**：\n  - \"我这边加的 15（1.5），它只占了 385 的**百分之四**，那我这边的误差就一定**小于 4%**；四五千多（14550）的 4% 才多少？误差顶多一百。\"（板书红字 `\u003c4%`，见 `f_0124`）\n  - \"主要是你这边动的本身就已经**抵消**掉了——这边加了 4% 不到，那边减了 4% 左右，基本相抵，实际误差可能只有 1%、2%，五千多的 1%、2% 可能就几十。\"→ 选项差距 300+，完全够用。\n  - \"14550 除以 385（约 1500 除以 400）是多少？**4 倍不到**\"——除法放缩用起来，倍数很快能看出来。\n- **与除法放缩同源**：\"乘法放缩有那么难理解吗？跟除法放缩不是一个原理吗？只不过除法是在分子分母（两边），乘法是在乘号两边——这边加 15，那边就减 550，**等比例**，也是看倍数或者看比例。\"（转写）\n- **陷阱类型**：\n  - **时间陷阱**：现期 2016（9085.30 万、14349 万），基期 2015（38.5% 对应的量）；\n  - **方向陷阱**：\"比上年**减少** 203.1 万户\"→ 求基期要**加回**（`14349+203=14550`）；\n  - **数据干扰**：63.3% 为 2016 年占比，本题板书未直接使用（现期 4G 用户数已直接给出）；固定电话的 2609.7 万、197.4 万户均为干扰数据；\n  - **单位陷阱**：材料混用\"亿 / 万户 / 万\"，列式统一成\"万\"。\n\n---\n\n### 第 3 题｜2016年某市邻里关系调查（乘法放缩）\n\n**【题干原文】**（画面 `f_0132`，逐字）\n\n> 2016年某市一次有关市民邻里关系的调查显示，在受访的 **951 位**市民中，\"没有邻居\"的有 **6 位**。\"有邻居\"的受访市民中，对邻居表示\"了解\"的占 **55.8%**（\"了解\"分\"很了解\"和\"部分了解\"，占比分别为 **26.9%** 和 **28.9%**），其余的表示\"不了解\"。\n> 受访市民中，\"不了解\"邻居的有：\n> A.275人　B.365人　C.412人　D.418人\n\n**【材料数据】**\n\n| 项目 | 数值 |\n| --- | --- |\n| 受访市民总数 | 951 位 |\n| \"没有邻居\" | 6 位 |\n| \"有邻居\"市民中\"了解\"占比 | 55.8%（很了解 26.9% + 部分了解 28.9%） |\n| 其余 | 表示\"不了解\" |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求部分量 = 总量 × 占比（乘法） |\n| 定位数据 | 有邻居市民 = `951 − 6 = 945` 人（板书在\"951\"旁写\"945\"）；不了解占比 = `1 − 55.8% = 44.2%`（板书在 55.8% 旁写 `44.2%`） |\n| 列式 | `945 × 44.2%`——三位数乘三位数，麻烦 |\n| 速算核心 | **945 正好是 9 的倍数，不要破坏它**；把 44.2% 调成 44.4% = 4/9 |\n| 放缩与回调 | 44.2→44.4 变大了 0.2/44 ≈ 0.5% → 结果退回 0.5% |\n| 结论 | ≈ 418 → D |\n\n**【选项原文】**\n\n- A.275人\n- B.365人\n- C.412人\n- D.418人\n\n**【答案】** ✅ D（418人）\n\n**【解析】（板书演算，`f_0136`~`f_0152`）**\n\n方法一（老师主推：保住 9 的倍数）：\n\n```\n945 × 44.2%\n  44.2% → 44.4% = 4/9（调大 0.2/44 ≈ 0.5%）\n945 × 4/9 = 105 × 4 = 420        （板书：945×4/9 → 105×4）\n结果偏大约 0.5% → 退回去：420 × (1-0.5%) ≈ 420 − 2 = 418 → 选 D ✅\n```\n\n> 老师原话（转写，同音字已修正）：可能有同学说，老师，你这个 442 变成 444，左边（945）你不应该减个四减个五吗？**不是调不调的问题**——是因为 44.4% 不就是 4/9 吗？945 正好是 9 的倍数，**你干嘛还去破坏这个 9 的倍数呢**？直接除了之后是 105，105×4 = 420，最后再把误差调回去：442 变 444 变大了 0.5%，让结果退回去 0.5%，减个 2 变成 418。\n\n方法二（板书另一写法，`f_0152`）：\n\n```\n945 → 940（减 5）；44.2 → 44.4（加 2）\n940 × 4/9 = 3760/9 ≈ 417.7 ≈ 418 → 选 D ✅\n```\n\n- **陷阱类型：概念/速算陷阱**——\"你说算 413.6，你会选到 C 吗？**千万不能选 C**！因为除以 9 用错位相加，结果会**偏小 1%**\"，再加回 1%（约 4.1）才是 417.7 → 418。（板书红字：`413.6`、`+4.1`、`417.7`）\n- 26.9% 和 28.9% 是**干扰数据**（很了解 + 部分了解的拆分，本题用不到）；\"没有邻居的 6 位\"要**先扣除**再算占比（范围陷阱）。\n\n---\n\n## 六、第三课放缩运算总结（板书原文）\n\n总结页幻灯片（`f_0155`~`f_0171`）原文 + 老师红笔批注：\n\n| 卡片 | 要点 | 老师红笔批注 |\n| --- | --- | --- |\n| **加减放缩** | ① 四舍五入\u003cbr>② 加法注意**有借有还**\u003cbr>③ 减法注意**同增同减** | ②③ 红笔下划线 |\n| **乘除放缩** | ① **减少位数**\u003cbr>② **按比例调整误差** | ①旁批\"**快**\"、②旁批\"**准**\"（圈注） |\n| **注意点** | ① **尽量少动**\u003cbr>② **象征性调整**即可应对常规题目 | ①旁批\"≤10%\"（圈注）、②\"象征性调整\"下划线，旁批\"**快**\" |\n\n老师口述展开（转写，同音字已修正）：\n\n> > 加减放缩就注意：有时候四舍五入一下，**注意有借有还**，你要控制一下这个平衡，**不要全往一个方向去挤**——把它们全进位上去、或者全舍掉，有时候就可能出问题。\n> >\n> > 做乘除放缩，核心思想是**为了减少位数**；同时注意**按比例调整误差**，不要偏差太大。**减少位数才能快，控制好误差才能准。**\n> >\n> > 做的时候稍微**少动一点**，尽量不要动得超过 **10%**。当然有时候正好能凑百分之二十、六分之一这种正正好的，也可以；一般我建议不要超过 10%。\n> >\n> > 另外一部分的调整，**象征性的调整就好了**。千万不要把另外一部分调整得非常精确——什么\"我分子一定要调个 2.5%\"\"那边我一定要调它 3.4 倍\"，没有意义。因为你本身就已经少动了，再调整那么准，只是在\"史上雕花\"（转写原词），根本没有任何意义。这样才能快，这样才能准。\n> >\n> > 还有：放缩可以是**过程中放缩**，也可以是**结果上放缩**，不是说非要在过程中放缩。如果过程中某个部分（分子或另一边）本身就已经很整了，那就**先算了再说**，算完之后整体再把这个误差调回去就好了。**核心还是为了凑整、减少位数。**\n\n> 结课闲话（转写）：这节课从晚上上到十一点多，扣掉休息时间净时长三个小时二十五分钟。\"今天这个课还是蛮重要的，所以讲的时间也长一点，铺垫也比较多，希望大家能够接受。\"\n\n---\n\n## 七、本讲知识点总表\n\n| 知识点 | 内容要点 |\n| --- | --- |\n| 截位与增速 | 增速很小（如 4.4%）时，截位会让增速明显失真（4.4%→4%），**不宜截掉该位** |\n| 计算对象决定允许误差 | 基期（300 多）1% 误差 = 3.8；增量（16 点几）1% 误差是致命的 → **小增速不用\"放缩求基期再求增量\"** |\n| 乘法放缩定义 | 乘式两边**反方向**小幅度**等比例**调整，几乎不影响结果 |\n| 乘法放缩公式 | `A×B ≈ A×(1+r)×B×(1-r) = A×B×(1-r²)`；`r≤10% → 1-r²≥99%` |\n| 与除法放缩区别 | 除法放缩误差可完全消掉；乘法放缩**天然自带 ≤1% 误差，消不掉** |\n| 乘法放缩定位 | **适合估、适合快，不适合精**；选项差距大时很好用 |\n| 补偿比例怎么算 | ① 看比例；② 看倍数；③ 抓 1%（挪小数点即可） |\n| 负增长率 | 符号不管，**看绝对值**放缩 |\n| 特殊结构 | 遇到 9 的倍数（如 945）配 4/9（44.4%），**保倍数、调比重、再回调** |\n| 过程放缩 vs 结果放缩 | 一边已经很整就先算，最后整体调回误差；核心是凑整减位数 |\n| 放缩纪律 | 尽量少动（≤10%）；另一边**象征性调整**即可 |\n\n## 八、速算口诀与解题流程\n\n**乘法放缩四步流程：**\n\n```\n① 识别：A×B 型（含百分数/千分数乘法）\n② 凑整：把其中一边调成整十整百（减少位数，动幅 ≤10%）\n③ 补偿：另一边反方向等比例调整\n    - 看比例：一边少 x%，另一边补 x% 左右\n    - 看倍数：一边减 n，另一边加（另一边 ÷ 这边）×n\n    - 抓 1%：挪小数点定基准，误差是 1% 的几倍就是百分之几\n④ 计算 + 回调：算出结果；精度要求高时把 (1-r²) ≈ 1% 的系统误差调回去\n```\n\n**口诀（老师原话浓缩）：**\n\n> > 反方向、等比例、小幅度；\n> > **少动**保稳定，**凑整**减位数；\n> > **减少位数才能快，控制好误差才能准**；\n> > 另一边象征性调，不必精调；\n> > 能在过程放缩，也能在结果放缩。\n\n## 九、易错点与陷阱清单\n\n| # | 陷阱/易错点 | 说明 | 本集对应 |\n| --- | --- | --- | --- |\n| 1 | 小增速 + 放缩求增量 | 基期 1% 误差（3.8）对 16 点几的增量是致命误差 → 误把 16.8 算成 16 | 第 1 题变体 |\n| 2 | 小增速截位 | 4.4% 截成 4% 对增速影响大，习惯不好 | 第 1 题 |\n| 3 | 乘法放缩同向调 | 必须**反方向**调整，同向会放大误差 | 乘法放缩原理 |\n| 4 | 乘法放缩用于精算 | 自带 1-r² 误差消不掉，精度要求高就少动或硬算 | 乘法放缩定位 |\n| 5 | 放缩幅度过大 | \"572 变 500 明显变小太多\"；尽量 ≤10% | 口算第 2 题、总结页 |\n| 6 | 负号干扰 | 增长率为负时看**绝对值**放缩 | 口算第 7 题、7927×6.9% 演示 |\n| 7 | \"减少\"求基期 | 比上年减少 203.1 万户 → 基期 = 14349**+**203 | 第 2 题 |\n| 8 | 破坏倍数结构 | 945 是 9 的倍数，应调 44.2%→44.4%（=4/9），别去调 945 | 第 3 题 |\n| 9 | ÷9 错位相加偏小约 1% | 得 413.6 → 误选 C（412）；要回调到 417.7 ≈ 418 | 第 3 题 |\n| 10 | 调整后忘记回调 | 44.2%→44.4% 变大 0.5%，结果要减 0.5%（420−2=418） | 第 3 题 |\n| 11 | 数据/单位干扰 | 63.3%、26.9%、28.9%、固定电话数据均为干扰；\"亿/万户/万\"要统一 | 第 2、3 题 |\n\n## 十、老师金句\n\n> ⭐ **\"这个就好像时代的一粒沙，落在了增量身上。这个沙子对于 382 来说很小，但是压在他身上，能直接把他压死。\"**（谈误差量级与计算对象）\n\n> ⭐ **\"乘法放缩这个东西，我给它的一个定义就是：它适合估，适合快，但它不适合精。\"**\n\n> ⭐ **\"少动，是你除法放缩跟乘法放缩保障稳定的、最关键的一点。\"**\n\n> ⭐ **\"减少位数才能快，控制好误差才能准。\"**\n\n> ⭐ **\"你本身就已经少动了，再调整那么准，只是在'史上雕花'（转写原词），根本没有任何意义。象征性调整一下就好了，这样才能快，这样才能准。\"**\n\n> ⭐ **\"你刚开始学这些放缩的时候肯定相对慢一点。就好像你刚学骑自行车，肯定骑得歪歪扭扭、又慢又容易摔；但等你练熟了，肯定比你跑步要快。\"**（谈方法熟练度）\n\n> ⭐ **\"他本来就是一米七的，写文章写得比较厉害，你还非要他去打篮球，那肯定不合适；你就让他在写文章的领域发光发热就好了。\"**（谈方法分工：放缩管估算，精算有精算的办法）\n\n> ⭐ **\"核心还是为了凑整，减少位数。\"**\n\n> ⭐ **\"1% 不需要你算什么东西，只要挪小数点。\"**（抓特殊点位估比例）\n\n> **\"增速比较小的时候怎么算增量？请听下回分解，我们明天来讲。\"**（预告下一集）\n","outline":[{"level":2,"text":"一、本集在课程中的位置（承接上集）","id":"一本集在课程中的位置承接上集"},{"level":2,"text":"二、除法放缩收尾：截位习惯与\"计算对象\"陷阱","id":"二除法放缩收尾截位习惯与计算对象陷阱"},{"level":3,"text":"2.1 题目（承接上集板书，画面 f_0001）","id":"21-题目承接上集板书画面-f_0001"},{"level":3,"text":"2.2 截位习惯：为什么分母写 1044 而不是 104","id":"22-截位习惯为什么分母写-1044-而不是-104"},{"level":3,"text":"2.3 放缩求解（板书，f_0017~f_0025）","id":"23-放缩求解板书f_0017f_0025"},{"level":3,"text":"2.4 变体：把问题换成\"增量\"——放缩翻车现场（f_0025~f_0035）","id":"24-变体把问题换成增量放缩翻车现场f_0025f_0035"},{"level":2,"text":"三、乘法放缩原理（板书幻灯片）","id":"三乘法放缩原理板书幻灯片"},{"level":2,"text":"四、乘法放缩示范与专项口算训练","id":"四乘法放缩示范与专项口算训练"},{"level":3,"text":"4.1 示例：8622×2.1‰（板书 f_0057）","id":"41-示例862221板书-f_0057"},{"level":3,"text":"4.2 专项口算训练（板书 7 题，f_0064~f_0100）","id":"42-专项口算训练板书-7-题f_0064f_0100"},{"level":2,"text":"五、例题精讲","id":"五例题精讲"},{"level":3,"text":"第 1 题｜V市交通运输业增加值（基期 + 增量变体）","id":"第-1-题v市交通运输业增加值基期-增量变体"},{"level":3,"text":"第 2 题｜2016年该省4G用户数增量","id":"第-2-题2016年该省4g用户数增量"},{"level":3,"text":"第 3 题｜2016年某市邻里关系调查（乘法放缩）","id":"第-3-题2016年某市邻里关系调查乘法放缩"},{"level":2,"text":"六、第三课放缩运算总结（板书原文）","id":"六第三课放缩运算总结板书原文"},{"level":2,"text":"七、本讲知识点总表","id":"七本讲知识点总表"},{"level":2,"text":"八、速算口诀与解题流程","id":"八速算口诀与解题流程"},{"level":2,"text":"九、易错点与陷阱清单","id":"九易错点与陷阱清单"},{"level":2,"text":"十、老师金句","id":"十老师金句"}]},{"id":"P06","title":"放缩运算·课后作业解析","full":"放缩运算课后作业解析（全）","lect":"","dur":"51:20","sec":3080,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 6 集\n\n# 放缩运算课后作业解析（全）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 6 集（共 21 集）\n> **视频地址**：https://www.bilibili.com/video/BV15bGA6PEJL?p=6\n> **时长**：约 51 分 20 秒\n> **本集主题**：**放缩运算课后作业解析（25 道题的乘法放缩 / 除法放缩实战演示）**\n\n---\n\n## 目录\n\n- [本集方法论总览](#本集方法论总览)\n- [例题精讲（第 1～25 题）](#例题精讲)\n  - [第 1 题｜乘法放缩 · 561.4×45.8%](#第-1-题乘法放缩--5614458)\n  - [第 2 题｜除法放缩 · 6279÷853](#第-2-题除法放缩--6279853)\n  - [第 3 题｜除法放缩 + 量级陷阱 · 16.0万亿÷5055.9万](#第-3-题除法放缩--量级陷阱--160万亿50559万)\n  - [第 4 题｜除法放缩（分子分母同步减）· 133.7÷1463](#第-4-题除法放缩分子分母同步减--13371463)\n  - [第 5 题｜除法放缩（倍数关系凑整）· 3083÷240.2](#第-5-题除法放缩倍数关系凑整--30832402)\n  - [第 6 题｜除法放缩（凑 1/6）· 91.9÷1.616](#第-6-题除法放缩凑-16--9191616)\n  - [第 7 题｜除法放缩（凑 800 / 750）· 23931÷0.7662](#第-7-题除法放缩凑-800--750--2393107662)\n  - [第 8 题｜除法放缩（分母即百化分）· 80976÷12551](#第-8-题除法放缩分母即百化分--8097612551)\n  - [第 9 题｜除法放缩（分母凑 200）· 565÷1893](#第-9-题除法放缩分母凑-200--5651893)\n  - [第 10 题｜除法放缩（错位相除）· 7775÷1096](#第-10-题除法放缩错位相除--77751096)\n  - [第 11 题｜除法放缩（减法凑整 + 错位相减）· 86.63÷225.61](#第-11-题除法放缩减法凑整--错位相减--866322561)\n  - [第 12 题｜除法放缩（凑 100）· 2427÷0.99](#第-12-题除法放缩凑-100--2427099)\n  - [第 13 题｜乘法放缩（调小乘数）· 2686.4×85.2%](#第-13-题乘法放缩调小乘数--26864852)\n  - [第 14 题｜除法放缩（多解法）· 10572.2÷37683.5](#第-14-题除法放缩多解法--105722376835)\n  - [第 15 题｜除法放缩（分母凑 1250）· 27007.4÷1.225](#第-15-题除法放缩分母凑-1250--2700741225)\n  - [第 16 题｜加法估算 · 2013-2022 年进出口总额合计](#第-16-题加法估算--2013-2022-年进出口总额合计)\n  - [第 17 题｜平均数（盈亏相抵）· 平均每季度良好或稳定占比](#第-17-题平均数盈亏相抵--平均每季度良好或稳定占比)\n  - [第 18 题｜直接加（分组估算）· S省\"四上\"企业负债](#第-18-题直接加分组估算--s省四上企业负债)\n  - [第 19 题｜平均数（盈亏相抵）· 铁矿石月均产量](#第-19-题平均数盈亏相抵--铁矿石月均产量)\n  - [第 20 题｜均值 vs 中位数（盈亏判断）· 人均可支配收入](#第-20-题均值-vs-中位数盈亏判断--人均可支配收入)\n  - [第 21 题｜环比增量（先算当月均值）· 一带一路新签合同额](#第-21-题环比增量先算当月均值--一带一路新签合同额)\n  - [第 22 题｜倍数（先定位年份）· 跨境电商进出口差值](#第-22-题倍数先定位年份--跨境电商进出口差值)\n  - [第 23 题｜同比增速（矛盾面求占比）· 出口跨境 B2C](#第-23-题同比增速矛盾面求占比--出口跨境-b2c)\n  - [第 24 题｜比重（总量×占比）· 政府采购公开招标金额](#第-24-题比重总量占比--政府采购公开招标金额)\n  - [第 25 题｜部分差（比重差合并）· 第三产业比第二产业高多少](#第-25-题部分差比重差合并--第三产业比第二产业高多少)\n- [本讲知识点总表](#本讲知识点总表)\n- [速算口诀与解题流程](#速算口诀与解题流程)\n- [易错点与陷阱清单](#易错点与陷阱清单)\n- [老师金句](#老师金句)\n\n---\n\n## 本集方法论总览\n\n本集是第十讲「放缩运算」的**课后作业逐题解析**，共 **25 道题**。老师全程用「乘法放缩 / 除法放缩」的口算思路串讲，最后给出三条总原则。\n\n> **（收尾原话）** \"这个就是我们今天放缩运算的课后作业，大家注意**乘法放缩、除法放缩**，主要两个原则：\n> ① 一个是你尽量少动，你不要动太多，你稍微少动一点点。\n> ② 第二个是你另外一边你不用动的很准，不需要很准，不需要特别准，因为你本身动的就很少。\"\n> **③** \"如果本来这个式子的分子分母，或者说这里的乘法工作里面有已经比较整的了，整数可以先保留整数，你就给它保留下来。最后算算完了再去调就行，你什么时候调都行。\"\n\n**乘法放缩** 核心模型：\n\n```\nA × B  →  把其中一个因子凑成\"百化分\"好算的数（如 444≈4/9、125=1/8、250=1/4）\n         该因子动了 x%，另一个因子同步补 x%（补的方向相反）\n         动的越小，结果越稳\n```\n\n**除法放缩** 核心模型：\n\n```\nA ÷ B  →  分母凑整（凑百化分 / 凑整十整百），分子\"象征性\"同步调\n         分母动了 x%，分子没动 → 结果上补/减 x%\n         ÷9、÷11 用\"错位相加 / 错位相减\"，结果天然偏小约 1%，要补回来\n```\n\n**五个必备\"百化分\"锚点**（本集反复用到）：\n\n| 分数 | 小数 | 本集对应题 |\n|---|---|---|\n| `4/9` | 0.444… | 第 1、14 题 |\n| `1/8` | 0.125 | 第 8、15、25 题 |\n| `1/7` | 0.1428… | 第 4、21 题 |\n| `1/6` | 0.1666… | 第 6 题 |\n| `2/9` | 0.222… | 第 11 题 |\n| `1/4` | 0.25 | 第 5、13、25 题 |\n| `分母 366 = 3/11` | — | 第 14 题 |\n\n**「错位相加 / 错位相减」口诀**（÷9、÷11 专用，老师本集反复强调）：\n\n```\n÷9   → 错位相加：N + N/10（如 2320 → 2320 + 232 = 2552，≈ N × 0.11）\n÷11  → 错位相减：N − N/10（如 427 → 427 − 42 = 385，≈ N × 0.09）\n两位错位都只保留两位，结果天然偏小约 1%\n→ 算完记得把偏小的这 1% 补回来\n```\n\n---\n\n## 例题精讲\n\n### 第 1 题｜乘法放缩 · 561.4×45.8%\n\n**【题干原文】**\n\n> 1、561.4×45.8%=（ ）\n> A.250.8　B.257.1　C.284.1　D.516.4\n\n**【材料数据】** 纯计算题，无材料。关键数字：`561.4`、`45.8%`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 乘法放缩（乘法凑百化分） |\n| 定位数据 | `561.4 × 45.8%` |\n| 列式 | `561.4 × 45.8% ≈ 561 × 458`（丢掉百分号与小数点，全保留三位） |\n| 放缩步骤 | 458 往 `444（≈4/9×1000）` 上靠：减 14（约 −3%）；左边 561 补 3% → 约 580；`580 × 4/9` |\n| 结论 | `2320 ÷ 9` 错位相加得 255.2，偏小 1% → 257.2 ≈ **257.1**，选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n561 × 458\n   ↓ -14（约占 3%）\n 444   ← 444 ≈ 4/9 的好算数\n+3% ↑\n580 × 4/9 = 2320 ÷ 9\n错位相加：2320 + 232 = 2552 → 255.2\n（÷9 的错位相加结果偏小约 1%）→ 255.2 + 2 ≈ 257.2\n→ 选 B（257.1）\n```\n\n**【选项原文】**\n- A.250.8\n- B.257.1\n- C.284.1\n- D.516.4\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第一题这是一个乘法的运算，乘法的运算呢，首先我们先调整一下位数。**不要把这个什么百分号牵扯进来去干扰你的运算**，直接我们就全保留三位，把它想象成 561 乘了一个 458。\"\n- \"那这个 458 这个数，它离百化分**九分之四**是比较靠近的。`9/4` 是 0.444…，所以我们可以有一步想法，就是把这个 458 去调整为 444。这样子的话，我就不用算那么多位了，什么三位乘三位，位数太多了，我把它转化成一个九分之四。\"\n- \"那把 458 变成 444，大概就减了个 14，大概是上面这个东西的 3%。减掉了百分之三左右，所以左边这个数，我们为了让这个结果比较准确，我们也给他把这个少的百分之三补上来。**561 的 3% 就是 15~16**，所以加起来大概是 580 左右。\"\n- 结果比对：\"算出来这个 2552，其实就对应的选项里面应该是 255.2，在这个 A 和 B 之间……**我们要记得除以九或者除以十一，这个错位相加、错位相减，它算出来的结果都是偏小百分之一的**。所以它的准确值应该还要再加个 2，是 257.2，所以选择 B。\"\n- **对比解法（老师演示后否掉）**：\"有同学可能也要说，老师，我能不能说把这个数我就想成百分之五十，我没有往九分之四上去想，我就给它凑成 500？大概加了个 42……大概加了个 10% 不到，我把左边 A 减个 10% 不到，减个它的百分之十是 56，那我减个 51……五百一乘以五百等于二五五，这样也能算到这个 B 选项。但这样子你会发现就相对来说没有那么特别准确了，**因为你这个动的呢就有点多，这种乘法放缩或者说除法放缩，你动的越多越越容易控不准就越危险**。\"\n- **陷阱类型**：无（纯计算）。考点是\"**动小不动大**\"——本题 A、B 选项差距不大，宜往 444（动 3%）上靠，而不是往 500（动近 10%）上靠。\n\n---\n\n### 第 2 题｜除法放缩 · 6279÷853\n\n**【题干原文】**\n\n> 2、6279÷853=（ ）\n> A.10.3　B.9.3　C.8.4　D.7.4\n\n**【材料数据】** 纯计算题。关键数字：`6279`、`853`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑整到 900） |\n| 定位数据 | `6279 ÷ 853` |\n| 列式 | `6279 ÷ 853`，853 附近没有合适的百化分 → 直接凑整 `853 + 47 = 900` |\n| 放缩步骤 | 分子凑整 `6279 → 6300`；`6300 ÷ 900 = 7`；分母放大约 5%，分子未同步加 → 结果补 5% 不到 |\n| 结论 | `7 × (1 + 5%) ≈ 7.35 → 7.33`，选 **D** |\n\n**【速算演示】**（画面板书）\n\n```\n6279 ÷ 853\n 853 + 47 → 900      （分母 +约 5%）\n6279 + 21 → 6300    （分子几乎没动，连 1% 都不到）\n6300 ÷ 900 = 7\n结果补上分母多出的 5%：7 + 7×5% = 7.35 → 7.33\n→ 选 D（7.4）\n\n【老师补充的\"先加分子\"慢解法】\n6300 + 5% ≈ 6600\n6600 ÷ 900 → 66/9 → 错位相加 → 7.26\n偏小 1% → +7 → 7.33\n```\n\n**【选项原文】**\n- A.10.3\n- B.9.3\n- C.8.4\n- D.7.4\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"这是一个除法计算。除法计算的话，如果我们完全保留下来，这个就位数太多了……所以我们就希望把这个**分母位数降低**。那这个 853 它附近呢没有什么很合适的那种常用的百化分，所以我们选择**凑整**给它的分母加个 47。\"\n- \"那这时候就两种算法了，一种算法就是我先保留上面，我这个不怎么管，我上面呢，我就随便选个 6300 给他凑个整，下面呢除个 900。**63 除以 9，这个太好算了呀，不就是 7 吗？** 这样是不是特别快？\"\n- \"七的话，你说选哪个呢？肯定选 D 啊。**为什么选 7.4 呢？因为我给分母变大了大概百分之五，按道理来说我这个分子也应该去增加 5% 的。但是很明显，我这 6279 到 6300，我是没有加这么 5% 的，只加了连 1% 都不到。所以我的计算结果上应该要去补这个 5% 不到。**\"\n- **方法论金句**：\"因为这个数 6279 本身已经比较靠近一个整数 6300 了，所以就不先去把它的分子去严格的去加这个百分之五。你硬要去加也不是不能加，但是我觉得这个有时候不好，没有那么快。**你先算出来，再结合你的一个误差去观察选项，有时候往往会更快一点。**\"\n- **陷阱类型**：无（纯计算）。考点：先算\"整数解\"，再用误差看选项。\n\n---\n\n### 第 3 题｜除法放缩 + 量级陷阱 · 16.0万亿÷5055.9万\n\n**【题干原文】**\n\n> 3、16.0万亿÷5055.9万≈（ ）万\n> A.3.2　B.16.9　C.28.9　D.31.6\n\n**【材料数据】** 纯计算题。关键数字：`16.0万亿`、`5055.9万`，结果单位为**万**。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩 + **量级判断**（万 / 亿 单位换算） |\n| 定位数据 | `16.0万亿 ÷ 5055.9万` |\n| 列式 | 丢掉位数只看有效数字：`16 ÷ 505 ≈ 16 ÷ 500` |\n| 放缩步骤 | 分母 `505 → 500`（减 5，约 −1%），分子不动 → 结果 `32` 再减 1% → `31.7` |\n| 量级判断 | 16 万亿 ÷ 0.5 万亿 ≈ 32；结果单位是\"万\" → `31.6 万` |\n| 结论 | 选 **D**（不是 A！） |\n\n**【速算演示】**（画面板书）\n\n```\n16 / 505 ≈ 16 / 500 = 32  （\"除以5等于乘以2\"，16÷5=3.2 → 32）\n分母减了 1%，分子没减 → 结果减 1% → 31.7\n判量级：16万亿 ÷ 5000多万 = 16万亿 ÷ 0.5万亿 ≈ 32（万）\n→ 选 D（31.6），不是 A（3.2）\n```\n\n**【选项原文】**\n- A.3.2\n- B.16.9\n- C.28.9\n- D.31.6\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"16 除以 5055 就除 505 吧？**是不是跟刚一样的道理？** 这个分母三位数嫌多，我嫌它烦，我把这个五给它减掉，把它变成五百。500 是不是少了个 1%？先不管，因为上面这个数很整。16 除以 5 等于乘以 2……就等于 32。这个结果它应该要往下再减个百分之一。就变成 31.7。\"\n- **量级陷阱（本集最重点的提醒之一）**：\"这个时候要稍微注意一下，**不要看那个 31.7 说 A，那我就直接 D 走了。你要注意这个 A**，因为我们一般在做这种乘除运算的时候，**我们是不怎么管位数的**。你算出来这个 31.7，它也可能是 3.17，也可能是 317。这个选项里面它的 A 跟 D 属于是那种**有效数字是一样的选项，它只是位数不一样**……因为它可以是 3.16，四舍五入过来的。\"\n- \"所以这个叫一定要小心它的存在了一个**十倍的这种量级的一个区分**。所以你还要再大概看一下这个地方除下来应该是几十万还是几万。\"\n- 老师口述判量级过程：\"那我们先把万消掉……就相当于是十六万万，除以 5055 等于多少万？那有一个万先跟那个最后的单位的万消掉。那 16 万除以五千五千的话其实就是零点五万，[万跟万再消掉] 16 除以 0.5，应该是 32 左右。所以选择 D，**所以选择 D 不是 A，是这样才选这个 D 的。**\"\n- **兜底验证法**：\"或者说你带入验证一下……如果是这个三万，三万乘五千万该是多少万亿？3 乘 5000 等于 15000，所以算下来是 1.5 万亿。可是实际它是用 16 万亿去除的，是它的 10 倍，所以应该选那个 3.2 的 10 倍，31.6。\"\n- **陷阱类型**：**单位陷阱 / 量级陷阱**（有效数字相同的选项，必须靠量级区分）。\n\n---\n\n### 第 4 题｜除法放缩（分子分母同步减）· 133.7÷1463\n\n**【题干原文】**\n\n> 4、133.7÷1463=（ ）\n> A.91.4　B.95.6　C.100.2　D.104.3\n\n**【材料数据】** 纯计算题。关键数字：`133.7`、`1463`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `143 ≈ 1000/7`） |\n| 定位数据 | `133.7 ÷ 1463` |\n| 列式 | 保留三位 `133 ÷ 146`；146 靠近 `143（≈1/7 的量级）`，分母减 3 |\n| 放缩步骤 | 分子比它小一点，同步减 2（不必精确减 2.x）→ `131 ÷ 143`；`÷143 ≈ ×7/1000` |\n| 结论 | `131 × 7 = 917` → `91.7`，选 **A**（91.4） |\n\n**【速算演示】**（画面板书）\n\n```\n133.7 / 1463  →  133 / 146\n146 靠近 143（≈ 1000/7），分母 -3\n分子比它小一点，象征性 -2（不必硬减 2.x）\n131 / 143\n÷143 = ×7 ÷1000\n131 × 7 = 917\n→ 91.7，选 A（91.4）\n```\n\n**【选项原文】**\n- A.91.4\n- B.95.6\n- C.100.2\n- D.104.3\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- **老师对\"三位截断\"的取舍**：\"当然，这个地方你如果说去三位也不是不可以。这样也可以，但从我个人的习惯角度来说，我是不喜欢这样的。因为我会觉得它跟除法放缩有一个原理有点违背，就是你在分母上相当于是减了个七，分子上减了个三……**可是明明你的分子比分母是要小的，可是你上面就减多了，这样会有点违背这个原则。** 但是如果选项差距相对不是那么特别小……差了两三个点、五个点左右的，也还能接受的情况下，就是你动的又很小，这种也可以不管。\"\n- 正式操作：\"分母上这个 146，它是非常靠近我们常用的百化分**七分之一**的，所以直接减三。上面呢给它减个二，因为上面比它小一点，我就象征性的减小一点，也没必要说硬要去减个什么二点几，没必要，那就 131 除以 143，除以 143 等于乘以七。131×7 = 917，所以选择 A（914）。\"\n- **误差可控的论证**（金句）：\"就是因为它这个选项差距有百分之五左右的。而我们这个动的这些东西，因为这个 3 啊这个 2 呀，其实只占了这个分子分母**百分之一百分之二**的样子。就算我们这个动的不是那么特别准，下面减了个 2%，上面减了个 1.5%，存在 0.5% 的一个误差吧……但是我的选项间的差距有百分之五，我怕你这点吗？我不怕。**所以除法放缩，你只要你动的小，你就不用刻的很准，不用控的很准。**\"\n- **陷阱类型**：无（纯计算）。考点：分母凑\"1/7\"；\"动的越小，越可以放松精度\"。\n\n---\n\n### 第 5 题｜除法放缩（倍数关系凑整）· 3083÷240.2\n\n**【题干原文】**\n\n> 5、3083÷240.2（ ）\n> A.10~12　B.12~14　C.14~16　D.16~18\n\n**【材料数据】** 纯计算题。关键数字：`3083`、`240.2`。选项为**区间型**。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `250 = 1/4` 的量级） |\n| 定位数据 | `3083 ÷ 240.2` |\n| 列式 | 保留三位 `308 ÷ 240`；分母 240 靠近 250 |\n| 放缩步骤 | 分母 `240 + 10 → 250`；分子\"象征性\"加 12（比 10 多一点）→ `320 ÷ 250`；250 即\"×4\" |\n| 结论 | `320 × 4 = 1280` → `12.8`（画面又记 `310/250 = 12.4`）→ 落在 **12~14**，选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n3083 / 2402  →  308 / 240\n分母 240 + 10 → 250（1/4 的量级）\n分子 308 + 12 → 320（加一个\"比 10 多一点\"的数，顺手凑整）\n320 / 250 = 320 × 4 / 1000 = 12.8   （画面另记 310/250 = 12.4）\n→ 落在 12~14，选 B\n```\n\n**【选项原文】**\n- A.10~12\n- B.12~14\n- C.14~16\n- D.16~18\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"你也可以写 308 除 240。那时候分母上它是比较靠近 250 那个百化分位置嘛，1/4，给分母上选择加 10。那上面呢我就象征性的**加个十二**，因为这个上面加个十几，比加那个十多一点的数，正好能凑成，那就先加了，变成三百二除以二百五，除以二百五呢就是四分之一，就是乘以四等于幺二八，所以在十二到十四之间。\"\n- **方法论**：\"这种就是属于是你加一个，他们本身就已经**倍数关系比较明显**（就是一倍多一点点），你加个一倍多一点点能凑整的时候就先凑。不然的话你去什么，我先去把它看到一个 310，我先不加那么多，我就乘个 4，想着就是我只调分母不怎么调分子，那乘个 4 之后变成 124，你还得再去想，我本来下面这个大概是加了个百分之二……那我这边再补个百分之四也麻烦。**索性就加个跟他差不多的、多一点点的凑个整就好了。**\"\n- **陷阱类型**：无（纯计算）。考点：分子分母\"同步凑整\"，利用已有倍数关系。\n\n---\n\n### 第 6 题｜除法放缩（凑 1/6）· 91.9÷1.616\n\n**【题干原文】**\n\n> 6、91.9÷1.616=（ ）\n> A.48.75　B.56.87　C.66.85　D.70.23\n\n**【材料数据】** 纯计算题。关键数字：`91.9`、`1.616`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `1/6`） |\n| 定位数据 | `91.9 ÷ 1.616` |\n| 列式 | 保留三位 `919 ÷ 162`；162 靠近 `166（≈1000/6）` |\n| 放缩步骤 | 分母 `162 + 4 → 166`（也可 +5 → 167，影响不大）；分子大概是分母的 6 倍不到 → 加 21 → `940`；`÷166 ≈ ×6/1000` |\n| 结论 | `940 × 6 = 5640` → `56.4`（画面另有 `92÷166 → 92×6 = 552` 的写法）→ 选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n91.9 / 1.616  →  919 / 162\n分母 162 靠近 166（≈ 1/6 的量级）\n分母 +4 → 166（+5 → 167 也可以，影响不大）\n分子 919 大概是它的 6 倍不到 → +21 → 940\n940 / 166  ≈  940 × 6 / 1000 = 5.64  →  56.4\n（画面另一写法：92 / 16.6 → 92 × 6 = 552 → 55.2）\n→ 选 B（56.87）\n```\n\n**【选项原文】**\n- A.48.75\n- B.56.87\n- C.66.85\n- D.70.23\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 6 题，91.9 出个 162 左右。我们就给分母去加个 4。因为 162 比较靠近 166 这个**六分之一**这个地方。当然，你也可以选择加 5 变成 167，这个影响不大。因为 `16/6 = 2.666…`，所以按道理来说，你应该加的是 4.666。但你说这个东西跟加 4 加 5 呢，其实差距都是比较小的，影响都是不大的，所以你加 4 加 5 都可以。**看个人习惯吧。**\"\n- \"162，我给它加个 4，上面呢大概是它的五倍多、六倍不到，五四五二十，所以加个二十一，那么加二十一呢，这样就能凑整了嘛。**所以有时候你这个二十一呢，你也不用去具体的把它写出来是二十一，你只需要知道你要加个二十多一点**，那我就看到 920 加二十变成 940，你只要知道你要是凑这个整而已。所以这 20 你不用写，你就在脑海面想一下，大概是 6 倍左右，24，那我就凑个 940 的整，我不在意那个位数，那么一点点的差距影响比较小，百分之一千分之几的那种感觉，无所谓。\"\n- 结算法：\"下面除了个 166，就是除了个 6 分之一，除 6 分之一等于乘以 6，所以 94 乘以 6，[等于 56]4。所以选择 B（56.87）。\"\n- **保守解法（老师也演示了）**：\"或者胆子稍微大一点的同学，就我觉得 919 离这个 920 已经很整了，我不想动这个分子了，我就先把它[当] 920 乘[除以] 162……然后下面呢把 162 想成 166，直接拿 92 去乘以 6 [除以 100]……[得] 55.2。那当我的分母只是从这个 162 左右变成了 166，加了三四个点，我分子基本上没怎么动，那我的结果在这个 55.2 上，也只要加了三四个点，怎么可能加到 C 或者 D 呢？太远了吧，所以只能选 B。\"\n- **陷阱类型**：无（纯计算）。考点：分母凑 1/6，分子\"凑整即可\"不必精算。\n\n---\n\n### 第 7 题｜除法放缩（凑 800 / 750）· 23931÷0.7662\n\n**【题干原文】**\n\n> 7、23931÷0.7662=（ ）\n> A.15.441　B.23.931　C.31.233　D.45.023\n\n> （画面数字较小：题干分子显示为 `23931`、老师口读作\"2391\"；结合选项与答案 `31.233`，此处为同一量级的数，小数点显示不清。）\n\n**【材料数据】** 纯计算题。关键数字：`23931`、`0.7662`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑整到 800 或 750） |\n| 定位数据 | `23931 ÷ 0.7662` |\n| 列式 | 分子几乎不动（\"非常靠近两万四\"）→ 想成 `24 ÷ 766` |\n| 放缩步骤 | ① 766 → 800（+34，约 +5% 不到）；`24 ÷ 800 = 0.03 → 30`；结果补 5% 不到 → `31.5`。② 766 → 750（−16，约 −2%）；`24 ÷ 750 = 0.032`，即 `24 × 4/3 = 32`，再 −2% → `31.4` |\n| 结论 | 两路都落在 31 附近，选项只有 **31.233** 够近 → 选 **C** |\n\n**【速算演示】**（画面板书）\n\n```\n【路子① 往 800 凑】\n24 / 766  →  24 / 800 = 0.03 → 30\n分母 +34（+5% 不到），分子没动 → 结果补 5% 不到\n30 + 1.5 = 31.5\n→ 选 C（31.233）\n\n【路子② 往 750 凑】\n24 / 766  →  -16  →  24 / 750 = 24 × 4/3 = 32\n分母减了约 2% → 结果减 2% ≈ 0.6 → 31.4\n→ 一样选 C\n```\n\n**【选项原文】**\n- A.15.441\n- B.23.931\n- C.31.233\n- D.45.023\n\n**【答案】** ✅ **C**\n\n**【解析】**\n- 老师原话：\"第七[题]。那这个地方就也是类似的，这个分子你是基本上不怎么要动的，因为它非常靠近两万四了，你就想成 24 除以 766。那 766 这个数不好除啊，我们要把它凑整吧。\"\n- **路子①**：\"凑整一种思路呢，是把它变成 800。24 除以 800 可以吧？这样快吧？[得] 30。因为选项这边都是十几、二十几、三十几、四十几嘛，所以 30 左右，那不就 C 走了吗？**因为这个 A、B、D 和这个 C 这个三十，它这个差距太大了。我这里算了个 30，你总不能要我去选 45 吧？总不能要我去选 23，或者说 15 吧？离得有点太远了吧。**\"\n- \"我分母刚没动那么多呀，我[分母]只不过是加了个 34，加了个百分之五都不到，怎么可能会选到这个 A、B、D 上去呢？所以直接 C 走了。\"\n- \"如果你要算准确一点……那你想，刚刚我分母是加了个 5% 不到，那我分子也应该加个百分之五不到，30 的 5% 是 1.5，1.5 不到，就会变成 31.5 不到，所以选 C。\"\n- **路子②（备选锚点）**：\"或者你也可以把这 766 想成 750，这个呢有时候也会用得上，其实这个题目呢不好用。750 的话就是四分之三，除以四分之三等于乘以三分之四，相对没有刚 800 那么快吧，乘以三分之四的话就会变成 32。也一样能选到这个 C。我刚刚分母减了个 16，减了大概 2%，那我这个结果也应该减 2%，减个 0.6 左右，31.4。\"\n- **陷阱类型**：无（纯计算）。考点：**选项差距大时可直接\"一刀切\"选最近的区间**（30 → C），不必精算。\n\n---\n\n### 第 8 题｜除法放缩（分母即百化分）· 80976÷12551\n\n**【题干原文】**\n\n> 8、80976÷12551=（ ）\n> A.6.5　B.6.7　C.6.9　D.7.1\n\n**【材料数据】** 纯计算题。关键数字：`80976`、`12551`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母本身就是百化分 `125 = 1/8`） |\n| 定位数据 | `80976 ÷ 12551` |\n| 列式 | 胆子大：保留三位 `809 ÷ 125`；`125 = 1/8` → `×8` |\n| 放缩步骤 | `809 × 8 = 6472` → `6.472`；被省掉的 `8097→809`（少 1% 不到）、`1255→1250`（少 0.4%），影响极小 |\n| 精算对照 | 保四位：`8097 − 37 = 8060`；分母 `1255 − 5 = 1250`；`8060 × 8 / 10000 = 6.448` |\n| 结论 | 粗算 6.472、精算 6.448，都因四舍五入选 **A**（6.5） |\n\n**【速算演示】**（画面板书）\n\n```\n【粗算（推荐）】\n80976 / 12551  →  809 / 125\n125 = 1/8  →  ×8\n809 × 8 = 6472  →  6.472\n→ 选 A（6.5）\n\n【精算（不放心时）】\n8097 / 1255\n8097 - 37 → 8060\n1255 - 5  → 1250\n8060 × 8 = 64480 → 6.448\n→ 还是选 A\n```\n\n**【选项原文】**\n- A.6.5\n- B.6.7\n- C.6.9\n- D.7.1\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 老师原话：\"这题也是一个除法运算。这题如果胆子大一点的同学呢，你就直接保留三位，809 除以 125。那这个分母上呢，**它本身就已经直接是一个百化分的那个数了**。125 呢，就等于八分之一，除以八分之一等于乘以八，809 乘以八……算出来 6.472。这样就可以直接选 A 了。\"\n- \"因为你最后省掉的这两个其实影响非常小。这个 1255，你把它写成 1250，就相当于减了个 5，它连 1% 都没有，只有 0.4%。上面这个 8097，你可以写成 809，也不过也就少了 1% 不到。对这个影响是非常小的。**基本上你直接保留个三位，这样一除就出来了。**\"\n- **精算演示**：\"如果有的人你要算细一点……如果你保留四位，也其实也还好。下面这个减个五，上面大概是七倍左右吧，七倍不到五七三十五，那减个三十七吧……减个 37，变成 806，这个时候分母上是 1250，是八分之一，再乘以八，这样就相对准一点，6.448。**但是你看这不还是选 A 吗？因为其实整体前后的这个影响并不大，那最后还是会因为四舍五入选到这个 A 上面去。所以反而表现得好像没那么准的。**\"\n- **陷阱类型**：无（纯计算）。考点：**分母已是百化分时，直接三位截断**。\n\n---\n\n### 第 9 题｜除法放缩（分母凑 200）· 565÷1893\n\n**【题干原文】**\n\n> 9、565÷1893=（ ）\n> A.30%　B.33%　C.36%　D.39%\n\n**【材料数据】** 纯计算题。关键数字：`565`、`1893`。选项为百分数。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 200） |\n| 定位数据 | `565 ÷ 1893` |\n| 列式 | 取 `189`；189 附近无合适百化分 → 凑到 `200` |\n| 放缩步骤 | 分母 `189 + 11 → 200`；分子约为分母 3 倍 → `+33 → 598`；`598 ÷ 200 = 2.99` |\n| 结论 | `2.99 → 29.9%` → 选 **A**（30%） |\n\n**【速算演示】**（画面板书）\n\n```\n565 / 189  →  凑整到 200\n分母 +11 → 200\n分子大概是 3 倍：18×3=54，14 跟 56 比较近 → 17；或 199×3=57 跟 565 近\n分子 +33 → 598\n598 / 200 = 2.99 → 29.9%\n→ 选 A（30%）\n```\n\n**【选项原文】**\n- A.30%\n- B.33%\n- C.36%\n- D.39%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 老师原话：\"第 9 题，565 除以 1893。可以就取个 189。然后分母上给它凑整，它附近没有那么特别近的比较合适的百化分的位置，那我们就给它凑到两百。相当于分母加了 11，那分子大概是 3 倍左右。\"\n- **怎么快速看出\"3 倍\"**：\"哎，这个三倍怎么快速的看出来呢？**18 乘以 3 是 54 嘛，18 乘以 3.5，14 跟 56 比较近了，或者把它想成 199 乘以 3 是 57，跟这个 565 也比较近。** 所以下面加 11，上面又加 33，变成 598，598 除以 2 等于 2.99，所以算下来是 29.9%，也就是选 A，30%。\"\n- **另一路（反应快）**：\"要是反应快一点的，就有同学会觉得，哎，这 1893 它离这个 1900 已经非常近了，然后注意到 565 跟那个 19，那 19 乘以 3 正好是 570，也跟这个 565 又非常近，正好两个都是往上涨一点，可以直接用 19 乘以 3 等于 57，A 就走了。\"\n- **为什么排除 B（33%）**：\"不可能选到这个 33 的，因为 33 比这个 30 其实是大了 10% 的。**只是看它的数值，三十到三十三是差了百分之十的，而我们刚刚这种想法是不存在这种百分之十的差距的，都是在百分之一左右、百分之一以内的一个调整。**\"\n- **陷阱类型**：无（纯计算）。考点：用\"倍数关系\"预判调整量，排除差距过大的选项。\n\n---\n\n### 第 10 题｜除法放缩（错位相除）· 7775÷1096\n\n**【题干原文】**\n\n> 10、7775÷1096=（ ）\n> A.5.5　B.6.8　C.7.1　D.7.3\n\n**【材料数据】** 纯计算题。关键数字：`7775`、`1096`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `1111 ≈ 1000×1/0.9`） |\n| 定位数据 | `7775 ÷ 1096` |\n| 列式 | 分母直接写 `1111`（只加一点点，`1111` 与 1096 很接近） |\n| 放缩步骤 | 分子不动；`7775 ÷ 1111 ≈ 7.14`（\"777 除 111 就是 7\"）；分母从 1096 加到 1111 约 +2% → 结果补 2% |\n| 结论 | `7 × (1 + 2%) = 7.14` → 选 **C**（7.1） |\n\n**【速算演示】**（画面板书）\n\n```\n7775 / 1096  →  7775 / 1111\n777 / 111 = 7   （非常整）\n分母 1096 → 1111，加了 20 多，约 +2%\n分子没加 → 结果补 2%\n7 × (1 + 2%) = 7.14\n→ 选 C（7.1）\n```\n\n**【选项原文】**\n- A.5.5\n- B.6.8\n- C.7.1\n- D.7.3\n\n**【答案】** ✅ **C**\n\n**【解析】**\n- 老师原话：\"第 10 题，7775 除以 1096。这个分母上的 1096 呢，可以把它直接写成 1111。直接加一点点，因为这个 1111 就[跟它]非常近。\"\n- \"那这时候我们要不要考虑它到底加了多少，以及这个分子上到底加多少呢？**也不用**，因为我们发现这个 7775 除 1111 本身就非常好除。对吧？如果我保留分子不动，直接除出来的不就是七嘛，777 除 111 [等于 7]。\"\n- \"你出完七之后，你再去判断我到底选 B 还是选 C 还是选 D，这个[就]加了小数点。就是看你这个分母到底动了多少，从 1096 变成 1111，大概加了个 20 多，大概就是 1096 的 2%。所以你分母加了 2%，本来应该分子加 2% 的，但是你没有加，那我就在最终的结果上去把这个 2% 给它补回来。7.14 [× 1.02 ≈ 7.1427]，所以选 C。\"\n- **陷阱类型**：无（纯计算）。考点：先得\"整数 7\"，再用分母的 +2% 修正。\n\n---\n\n### 第 11 题｜除法放缩（减法凑整 + 错位相减）· 86.63÷225.61\n\n**【题干原文】**\n\n> 11、86.63÷225.61=（ ）\n> A.0.34　B.0.38　C.1.34　D.1.35\n\n**【材料数据】** 纯计算题。关键数字：`86.63`、`225.61`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `222 ≈ 2/9×1000`）+ 错位相减 |\n| 定位数据 | `86.63 ÷ 225.61`；选项有 0.3x 与 1.3x 两组 |\n| 列式 | 取 `866 ÷ 225`；225 靠近 `222（≈2/9）` → 分母 −3 |\n| 放缩步骤 | 分子约为分母 4 倍 → −12 → `854`；`854 ÷ 222 = 854 ÷ 2 ÷ 111 = 427/111`；错位相减 `427 − 42 = 385` |\n| 结论 | `385 → 0.385` → 选 **B**（0.38） |\n\n**【速算演示】**（画面板书）\n\n```\n866 / 225\n -12 → 854        （分子 ≈ 4 倍）\n -3  → 222        （222 ≈ 2/9×1000）\n854 / 222 = 854 ÷ 2 ÷ 111 = 427 / 111\n错位相减：427 − 42 = 385\n385 → 0.385\n→ 选 B（0.38）\n\n【另一路（奔放版）】\n866 / 225  → 放弃分母百化分，直接把 225 当 200（−25，约 −10% 多）\n分子同步 −90 → 776\n776 / 200 = 3.88 → 0.388\n→ 一样选 B\n```\n\n**【选项原文】**\n- A.0.34\n- B.0.38\n- C.1.34\n- D.1.35\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 11 题，866 除以 225。225 呢，它是比较靠近九分之二的，所以精准一点的话，我们就给它下面减个三，上面大概四倍减个十二，上面变成 854，下面除以 222，除以 222 就是除以 2 乘以 111，先除个二，先把它变成 427 除 111，就可以直接错位相减，[427] 减掉 42 就会等于 [385]，[0.385] 就可以选择 B 了。\"\n- **关键细节（错位相减只取两位）**：\"这个地方呢有一点要讲的就是，比如我为什么错位相减的时候，我没有去减 42.7，我是直接减 42。**因为本身除以 11、除以 9，它都会让结果偏小 1%。** 除以 111 呢，虽然说不会偏要百分之一，只会偏要百分之零点一，但整体这种错位相加、错位相减都是会让结果偏小。那既然结果会偏小，你多减个这零点七，你后面偏向量要再补一点上来，那我干脆就不减它了。所以一般错位相加或者错位相减，如果我想省点计算，**我会选择把这个最后这一位给它省略掉**。虽然可能会有点影响，但一般来说影响比较小，基本上忽略不计。\"\n- **奔放解法**：\"后面这个题目他看到这个 866 除以 225，我们也可以有另外一种想法。我觉得[除以]9 跟这儿这个东西还嫌麻烦，我觉得选项间的差距还是挺大的……这个不可能是 C、D，因为你[这]出来了，肯定是小于一的。所以 A、B 差距有百分之十以上，我这边稍微开放一点，稍微奔放一点。我直接把分母上的 225，我选成两百。减个 25，减个百分之十多一点，那上面我也减个百分之十多一点，减个 90，不就好了吗？变成 776。776 除以 2 等于 388。也能选到 0.38。\"\n- **陷阱类型**：无（纯计算）。考点：分母凑\"2/9\"；错位相减**保留两位即可**（因为结果天然偏小，可省去小数点后的位）。\n\n---\n\n### 第 12 题｜除法放缩（凑 100）· 2427÷0.99\n\n**【题干原文】**\n\n> 12、2427÷0.99=（ ）\n> A.3049　B.2451　C.2472　D.3075\n\n**【材料数据】** 纯计算题。关键数字：`2427`、`0.99`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 100） |\n| 定位数据 | `2427 ÷ 0.99`，即 `2427 ÷ 99` |\n| 列式 | 0.99 离整数 1（分母 100）太近 → 直接凑到 100 |\n| 放缩步骤 | 分母 `99 → 100`（+1%）；分子同步 +1% → `2427 + 24 = 2451`；`2451 ÷ 100 × 100 = 2451` |\n| 结论 | 选 **B**（2451） |\n\n**【速算演示】**（画面板书）\n\n```\n2427 / 0.99 = 2427 / 99\n分母凑到 100（+约 1%）\n分子同步 +1%：2427 + 24 = 2451\n2451 / 100 = 24.51 → 2451\n→ 选 B（2451）\n```\n\n**【选项原文】**\n- A.3049\n- B.2451\n- C.2472\n- D.3075\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 12 题，2427 除以 0.99，就除以 99 嘛。这时候我们可以把分母直接凑到一百上去，**因为它离这个整数一百太近了**。相当于给分母增加了百分之一左右，那分母增加了百分之一，分子呢也应该增加个百分之一左右。上面呢就该增加 24，就变成 2451，2451 除以 100，不就是 2451 吗？所以选 B。\"\n- **陷阱类型**：无（纯计算）。考点：分母凑\"整数 100\"，分子同步 +1%。\n\n---\n\n### 第 13 题｜乘法放缩（调小乘数）· 2686.4×85.2%\n\n**【题干原文】**\n\n> 13、2686.4×85.2%=（ ）\n> A.1850　B.1984　C.2103　D.2295\n\n**【材料数据】** 纯计算题。关键数字：`2686.4`、`85.2%`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 乘法放缩（挑**好凑的那个因子**动） |\n| 定位数据 | `2686.4 × 85.2%` |\n| 列式 | 保留三位 `268 × 852` |\n| 放缩步骤 | 852 站在 800 与 900 正中间、不好凑，改从 268 下手：`268 − 18 → 250`；852 约为 268 的 3 倍 → `+54 → 906/910`；250 即\"×4 ÷1000\" |\n| 结论 | `250 × 910 = 227500` → `227.5` → 约 2288，选 **D**（2295） |\n\n**【速算演示】**（画面板书）\n\n```\n268 × 852\n 268 − 18 → 250      （250 = 1/4 × 1000，好算）\n 852 + 54 → 906/910   （852 ≈ 268 的 3 倍，3 × 18 = 54）\n250 × 910 = 227500\n250 = 1000 / 4  →  910 ÷ 4 = 227.5\n→ 约 227.5（×10 = 2275）→ 取最近的有效数，选 D（2295）\n```\n\n**【选项原文】**\n- A.1850\n- B.1984\n- C.2103\n- D.2295\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"第 13 题，这个乘法，这样的我们保留三位，286[66] 乘以 852。这个式子 286 乘以 852，这个 852 的数呢，**它是不太好凑整的，它离九百、离这个八百，它正好都在中间这个位置上，站在比较偏中间的位置。而 800 跟 900 之间也没有什么其他的百化分的位置好凑**。\"\n- \"但是这个 268 相对于它来说就好凑一点了。因为 268 你可以把它变小一点点，变成 250，这样的好[算]。268 变成 250，减了个 18。那 852 大概是 268 的 3 倍左右，所以这边加个 18 的 3 倍 54 左右，就会变成 910 左右。\"\n- \"就变成 250 乘以 912[→910]，250 呢它是四分之一，所以直接 912 除以 4，除以 4 的话就等于 213[→228]，[→228] 除以 4 的话，[≈22.7]……所以选择 D（2295）。\"\n- **陷阱类型**：无（纯计算）。考点：**两个因子都不好凑时，挑\"离整十整百更近、更好动\"的那个下手**（此处动 268，不动 852）。\n\n---\n\n### 第 14 题｜除法放缩（多解法）· 10572.2÷37683.5\n\n**【题干原文】**\n\n> 14、10572.2÷37683.5=（ ）\n> A.28.1%　B.27.5%　C.26.3%　D.22.8%\n\n**【材料数据】** 纯计算题。关键数字：`10572.2`、`37683.5`。选项差距很小（相邻约 0.6%～2%）。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母可往 **366 / 333 / 400** 三个方向凑） |\n| 定位数据 | `10572.2 ÷ 37683.5` |\n| 列式 | 四舍五入取三位：`1057 ÷ 3768 → 106 ÷ 377` |\n| 放缩步骤 | 见下方三条路线 |\n| 结论 | 三条路线都指向 **28.1%**，选 **A** |\n\n**【速算演示】**（画面板书：三种做法）\n\n```\n【做法一：分母凑 366（= 3/11×1000）】\n106 / 377   分母 −11 → 366\n分子（1060）约 3 倍不到 → −30 → 1030\n1030 / 366 = 1030 × 11 / 3 ÷ 1000 → 11330/3 ≈ 3777 … \n（老师板书写法）1030 / 366 = 1030 ÷ 3/11 = 1030 × 11/3 → 用 3090 ÷ 11\n3090 − 309 = 2781 → 27.8\n÷11 的错位相减偏小 1% → 27.8 + 0.28 = 28.1\n→ 选 A\n\n【做法二：分母凑 333】\n106 / 377   分母 −44 → 333\n分子 3 倍不到 → −120 → 94  （如误减 13 → 93 × 3 = 27.9，落在两选项中间）\n94 / 333 = 94 × 3 = 282 → 28.2\n→ 选 A\n\n【做法三：分母凑 400】\n106 / 377   分母 +23 → 400\n分子 3 倍不到 → +69 不到，取 +60 → 1120\n1120 / 4 = 280 → 28.0\n→ 选 A\n```\n\n**【选项原文】**\n- A.28.1%\n- B.27.5%\n- C.26.3%\n- D.22.8%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 老师原话：\"第 14 题，这是个除法，1057 除以 3768，可以都四舍五入，把它凑三位，106 除以 377。那这个 377 呢，你可以有两种想法。一种想法是我谨慎一点，我就给它调成 366，366 也是我们常说的一个相对好算的一个比较复杂的百分[数]，三分之十一[的量级]，可以这么做。你也可以把它挪远一点，为了快，把它变成 333，或者说也可以把它凑成变成 400，**都是可以的**。\"\n- **做法一细节**：\"下面减 11，上面大概 1/3 不到……1060 大概就是 377 的 3 倍左右，3 倍不到吧。那上面呢就减个 30，变成 1030，就会变成 1030 除以 366，除以 366 呢就除以 3/11，等于乘以 3 [除以 11]，就是 3090 除 11，等于错位相减减 309，最后等于 2781，就是 27.8。\"\n- **精度说明**：\"就是这个 27.8 这个位置就尴尬了，正好在 A 跟 B 的中间。那我们就不要忘了，你刚刚是除了个 11，**除 11、除 9，这个错位加减都会让结果偏小 1%**，所以你还要在这个 27.8 的基础上再加个 0.28 左右，就会变成 28.1，所以选择 A。\"\n- \"这个题目就是选项差距相对来说是近一点的，只差了百分之零点六，大概占他们的百分之二左右。不差不多有百分之二左右的误差，差距这个精度要求还是比较高的。**所以计算的时候一定要特别小心你在计算中出现的这些误差，尤其是这种明显的好加的这种百分之一，尽量给它加上去。**\"\n- **做法二**：\"把分母变成 333，相当于是分母减了四十四，上面[是它的]三倍不到。44 三倍是 132，三倍不到的话，那我减个大概，可能 120 左右吧，减个 120 变成 94，然后 94 除以 33[3] 等于乘以 3，94 乘以 3，[= 282]，28.2，这样也可以。\"\n- **老师教的\"回看误差\"技巧**：\"或者可能有多人说，哎，老师，你怎么知道减 12 呢？我万一说减了个 13，不就容易错了吗？减了个 13 变成了 93，93 乘以 3 变成了 27.9，我算了个 27.9 出来，在 A 跟 B 的中间，我不确定选 A 还是选 B 怎么办？**这个时候你就回头去看你刚刚的操作过程中可能出现误差的地方，就在于这里，减这个 13 到底是减多了还是减少了就行。** 你算下来是个 2.8 倍的意思，就是这个 1060 除 3……意味着你这种式子它是上面是下面的 2.8 倍。可是你这个 13 距离这个 3 倍是太近了，44 的 3 倍是 132，你减个 13[2]，是不是特别近，比这 2.8 倍还要近，说明你减多了，说明你的 93 小了，93 小到了 27.9 就小了，你就应该选一个比 27.9 大一点的 28.1。**这样去分析一下你这个过程中出现的误差，就能选到更准确的那个答案上去。**\"\n- **做法三**：\"如果把它变成 400，相当于是分母上加了个 23，上面是 3 倍不到加 69 不到，我加个 60，变成 1120，1120 除以 4，112 除以 4 等于 28，正好，所以选择 A。\"\n- **陷阱类型**：**精度陷阱 / 选项过近陷阱**（相邻选项仅差约 2%，必须补回那 1%）。\n\n---\n\n### 第 15 题｜除法放缩（分母凑 1250）· 27007.4÷1.225\n\n**【题干原文】**\n\n> 15、27007.4÷1.225=（ ）\n> A.22046.9　B.22320.2　C.23589.3　D.25240.6\n\n**【材料数据】** 纯计算题。关键数字：`27007.4`、`1.225`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 除法放缩（分母凑 `1.25 = 1/8×10`） |\n| 定位数据 | `27007.4 ÷ 1.225` |\n| 列式 | 保留分子 2700（很整，不动它）；分母 1225 → 1250 |\n| 放缩步骤 | 分母 `1225 + 25 → 1250`（约 +2%）；`1250 = 1/8 × 10⁴` → `2700 × 8 / 10⁴`；`27 × 8 = 216 → 2160`；因分母放大 2%，结果补 2% |\n| 结论 | `2160 + 2% ≈ 2202/2204（即 2.204×10⁴）` ≈ `22046.9`，选 **A** |\n\n**【速算演示】**（画面板书）\n\n```\n27007.4 / 1.225\n→ 2700 / 1225\n分母 1225 + 25 → 1250   （≈ +2%）\n路子A：分子同步 +50 多一点 → 取 2760\n        2760 / 1250 ，1250 = 1/8 → ×8\n        276 × 8 = 2208\n路子B（更快）：分子不动 2700\n        2700 / 1250 × 8：27 × 8 = 216 → 2160\n        分母加了约 2%，分子没加 → 结果补 2%\n        2160 + 2160×2% ≈ 2202 → 2204\n→ 与 A（22046.9）同量级，选 A\n```\n\n**【选项原文】**\n- A.22046.9\n- B.22320.2\n- C.23589.3\n- D.25240.6\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 老师原话：\"第 15 题，270[07.4] 除以 1225[1.225]。1225 呢，它比较靠近的呢就是 1250，所以我们给分母去加一个二十五。那上面呢，我们给它扣个零，这样倍数好看一点。上面是两倍多，加个 50 多一点，再加 60，就变成 2760 除以 1250。1250 是八分之一，就乘以 8 → 276 乘以 8 → 2208。所以选 [A]。\"\n- **更快的路子（老师推荐）**：\"那如果要快一点呢，就是我们保留这个分子 2700，比较整，我们不去动它，我们就先把它想成 2700 除以 1250 乘以 8 嘛，那就 27 乘以 8，[= 216 → ]2160。这个结果 2160 明显不对，跟 [选项] 都差的比较多嘛。那我们要把它调回去，**误差在哪？误差在于你给分母上加了个 25，大概就加了个 2%。你分子没加呀，所以你的结果上就要去加这个百分之二。你要给这结果加百分之二，2160 的百分之二就是加个 42，就会变成 2202。** 结果一样的吧，2202，你[就]选 [A]。\"\n- **方法论金句**：\"**误差你在哪个地方调都可以，只要你调的结果影响是一样的、是准确的就可以了。你可以在分子上调，也可以算完了再调。**\"\n- **陷阱类型**：无（纯计算）。考点：分子很整就**先不动分子**，最后统一在结果上补误差。\n\n---\n\n### 第 16 题｜加法估算 · 2013-2022 年进出口总额合计\n\n**【题干原文】**\n\n> 16、2013-2022年，中国与共建国家进出口总额合计约为：\n> A.至少20万亿美元\n> B.在17-20万亿美元之间\n> C.在14-17万亿美元之间\n> D.至多14万亿美元\n\n**【材料数据】**\n\n> 图表标题：**2013-2022年，中国与共建国家进出口总额及其占中国外贸总值比重**\n> 纵轴：`进出口总额（万亿美元）`（柱）+ `占比（%）`（折线）\n> 横轴：2013 年 ～ 2022 年（10 年）\n\n| 年份 | 进出口总额（万亿美元，柱） |\n|---|---|\n| 2013 | 1.63 |\n| 2014 | 1.74 |\n| 2015 | 1.54 |\n| 2016 | 1.42 |\n| 2017 | 1.63 |\n| 2018 | 1.88 |\n| 2019 | 1.94 |\n| 2020 | 1.93 |\n| 2021 | 2.53 |\n| 2022 | 2.84 |\n\n> （画面折线\"占比\"数值依次为：39.2、40.3、38.9、38.6、30.6、30.6、40.6、42.4、41.4（画面显示如此）、45.4，本题不需要用到。）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 加法估算（两两分组 + \"借零凑整\"） |\n| 定位数据 | 10 根柱子的高度 |\n| 列式 | 1.63 + 1.74 + 1.54 + 1.42 + 1.63 + 1.88 + 1.94 + 1.93 + 2.53 + 2.84 |\n| 估算步骤 | 两两一组\"有借有还\"：1.7+1.7 / 1.5+1.4 / 1.6+1.9 / 1.9+2.0 / 2.5+2.8 |\n| 结论 | `3.4 + 3 + 3.5 + 3.9 + 5.3 = 19.1` → 落在 **17~20**，选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n两两一组，凑整估算（有借有还）：\n 1.63 + 1.74 ≈ 1.7 + 1.7 = 3.4   （把 0.04 借过去）\n 1.54 + 1.42 ≈ 1.5 + 1.4 ≈ 3.0   （尾巴往下带一点）\n 1.63 + 1.88 ≈ 1.6 + 1.9 = 3.5   （借 0.03 给 1.88）\n 1.94 + 1.93 ≈ 1.9 + 2.0 = 3.9   （借给 1.94 凑成 2）\n 2.53 + 2.84 ≈ 2.5 + 2.8 = 5.3   （前四组借了不少，最后一组\"还账\"，0.03 与 0.04 都不要了）\n合计 ≈ 3.4 + 3 + 3.5 + 3.9 + 5.3 = 19.1\n→ 落在 17~20 万亿美元，选 B\n```\n\n**【选项原文】**\n- A.至少20万亿美元\n- B.在17-20万亿美元之间\n- C.在14-17万亿美元之间\n- D.至多14万亿美元\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 16 题，一些加减法的运算。从 13 年到 22 年，这 10 年，这[10 个]进出口总额[柱子的和]加起来应该是多少？那一种方式就是我们老老实实的加，一个一个加，我怕错，我不敢用什么方法，我就去加。**那加的时候也是有一点技巧的，就是你不要去一个个的死加。稍微的估一点，带一点估，我两个两个的一起估。**\"\n- \"1.63 加 1.74，他们后面是不是都有小尾巴，加起来也快……所以你可以选择把它想成一点七加一点七，相当于凑一下，我把我的零点零四借给你，把你借成一点七左右，它们俩加起来就是三点四。\"\n- \"1.5 加 1.4，我就算成 3，小尾巴[不看了]……1.6 加 1.8 就想成了一点六加一点九，把这 0.03 借给你了[，得] 3.5。后面[1.94] 加[1.93]，借给你变成 2，[得] 3.9。在后面 2.5 加 2.8 [得] 5.3。\"\n- **\"有借有还\"的关键**：\"这个地方，你怎么不把这个 0.03 借给这个 0.04 变成 1 了呢？因为我注意到我们刚刚这四组里面，其实出现了很多次的就是把这种什么 0.07 当做 0.1，0.06 当做 0.1，都有这种往上涨一点点的意思。那我就索性这个地方的 0.03 和 0.04 走不要了，扔给你们，**相当于是有借有还。我前面这四组里面有三组都相对来说借了一点，那我最后一组我就替他们还了，这样子的话，结果就更准一点。**\"\n- \"三点四加三加三点五加起来是九点九，再加 3.9 就是 13.8，再加 5.3 就是 19.1，所以选择 B 选项，在 17 到 20 之间。\"\n- **范围型题目方法论（金句）**：\"这种范围型的题目，就是它不是那种四个选项对应四个数的题目。**大家一定要注意，这个题目的精度要求是高还是低，主要看的是你估算下来的结果距离它这个选项之间的边界近还是远。** 如果你估个 19.1 不碍事，因为你离这个 20 还差 0.9 呢。我们刚刚的这个运算都是对于那种 0.1 的估算，影响很小，不至于影响到这 0.9。\"\n- \"但是，如果你这里估下来，假如算下来是个 19.9，那就出问题了。因为 19.9 离 20 很近，你就**要考虑是不是你刚刚的估算导致出现了那 0.1、0.2 的误差**，把一个本来在二十上面一点点的数变小了 0.1、0.2 变成了 19.9，这就要小心了。在这个题目还好，没有那么近。\"\n- **第二解法（平均数法，老师也讲了）**：\"还有一种方法就是这种求和。如果你注意到有很多数，它比较接近、比较靠近，可以从平均数的角度来考虑一下。这十年他们的平均数大概在哪儿，然后乘个十就好了。我们注意到 18、19、20 这三年，相对于在这十年里面是一个**比较靠近中间值且比较靠近**的数，对不对？所以我们就以这三个数的大概的平均值 **1.9** 作为一个假想的平均数。\"\n- \"其他比较少的这部分和比他多的这部分到底比这个平均数多了多少、少了多少？能不能够真正的盈亏相抵？如果真的盈亏相抵了，那平均值就是 1.9；如果赢的部分更多，说明平均值大于 1.9，反之则小于 1.9。\"\n- \"比 1.9 少的部分：少 0.3、0.2、0.4、0.5……这个地方就至少 0.2，这里也是有借有还。因为我们刚刚在这边算的时候，全是把它们当做 1.6、1.7、1.5、1.4 在写的，都让这个结果偏小了，那我最后这边写的时候，我要把它偏大一点，我把它写成一点七，这样子才不会导致一个整体的偏移太夸张的情况。**就好像那种分子分母那种去给它修正误差一样。**\"\n- \"0.3 + 0.2 = 0.5，0.5 + 0.5 = 1.0，1.0 + 0.4 = 1.4，1.4 + 0.2 = 1.6，总共大概小了 1.6。右边这边呢比 1.9 后面多了 0.6，[再]多了一点六……因为这个[2.84]我们刚刚把它想成 2.5，才会是多 0.6，那[为了抵消]另外一边就把它想大一点，2.9。**家访[加减]嘛，就是要一边大另外一边就要小，一边小另外一边就要大，有借有还。** 1.6 [和] 1.6 非常完美，所以它的平均值就是 1.9。少的部分、多的部分正好抵消掉了，平均值 1.9，那总和就是 19，所以选择 B。\"\n- **陷阱类型**：**范围陷阱（边界过近）**——估算精度要求取决于结果离边界的远近。\n\n---\n\n### 第 17 题｜平均数（盈亏相抵）· 平均每季度良好或稳定占比\n\n**【题干原文】**\n\n> 17、2015-2016年，平均每季度大约有多少企业认为自身综合经营状况良好或稳定？\n> A.77.2%　B.78.3%　C.79.6%　D.82.8%\n\n**【材料数据】**\n\n> 图表标题：**2014年4季度以来小微服务业经营平稳面状况**（单位：%）\n> 横轴：2014年4季度 → 2016年4季度（共 9 个季度）\n\n| 季度 | 2014Q4 | 2015Q1 | 2015Q2 | 2015Q3 | 2015Q4 | 2016Q1 | 2016Q2 | 2016Q3 | 2016Q4 |\n|---|---|---|---|---|---|---|---|---|---|\n| 占比（%） | 76.7 | 79.5 | 77.2 | 78.2 | 76.2 | 77.9 | 76.5 | 81.1 | 79.5 |\n\n> **注意**：题目问的是 **2015-2016 年**（共 8 个季度），即去掉 2014Q4 的 `76.7`，只用后 8 个数：`79.5、77.2、78.2、76.2、77.9、76.5、81.1、79.5`。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 平均数（假设平均值 → 盈亏相抵） |\n| 定位数据 | 2015Q1～2016Q4 共 8 个数 |\n| 列式 | 排序 `76.2、76.5、77.2、77.9、78.2、79.5、79.5、81.1`，中间两项 `77.9` 与 `78.2` |\n| 估算步骤 | 假设平均值 `78`；多的部分合计 `6.1`，少的部分合计 `4.1`，净 +2.0；摊到 8 个季度：`2 ÷ 8 = 0.25` |\n| 结论 | `78 + 0.25 = 78.25 ≈ 78.3`，选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n中位数定位：8 个数，中间两项 77.9 与 78.2 → 假设平均数 = 78\n比 78 多的部分合计 ≈ 6.1\n比 78 少的部分合计 ≈ 4.1\n净多 = 6.1 − 4.1 = 2\n2 ÷ 8 = 0.25\n78 + 0.25 = 78.25 ≈ 78.3\n→ 选 B\n```\n\n**【选项原文】**\n- A.77.2%\n- B.78.3%\n- C.79.6%\n- D.82.8%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 17 题：平均每[季度]有多少企业……认为自己是良好或者稳定的，就是[问]经营平稳[面]状况呢？在 15 年到 16 年里面……这一共 8 个数据、8 个季度。现在我们把这八个季度取一个他们的平均值。\"\n- \"去平均值的话，我们就去找他的中间项，找他的中位数，相对来说，**这个 78 跟 77.9 是个比较靠中间的位置。因为在这 8 个数里，有 3 个比他们大，有 3 个比他们小。所以我们假设它的平均数是 78。**\"\n- \"按 78 来算，多的比它多多少呢？少的比它少多少呢？多的[部分]多一点（画面显示为 5.5、6.1、1.5 一组）；少的比较少 0.8、1.8、1.5。多的部分加起来是 6.1，少的部分加起来是 4.1。所以整体它的平均数应该比这七十八高一点。\"（此处板书数字较小，画面显示为\"5.5、6.1、1.5 / 0.8、1.8、1.5\"，转写为\"5.3、1点五 / 0.8、1.8、1.5\"，以画面为准。）\n- \"中间这两个就不用管了吧，[因为]中间这两个他们加起来平均数，基本上就是七十八，基本上没什么盈亏。所以要比这 78 高多少呢？**是 78.3 还是 79.6 呢？哎，高不到这么多吧。因为你这个只是总和加起来多了个 2，你总共多出来这个 2，你要平摊到这 8 个季度上去，每个季度只能多 0.25。所以是在 78 的基础上加 0.25，78.3。**\"\n- **最关键的纠错点**：\"就是你这里这个 6.1 比这个 4.1 多的、比这个少的部分，多出来这个 2，**它不是[平均数]多了个 2，是总和多了个 2。按平均数还得除以 8。**\"\n- **陷阱类型**：**「总和 / 平均数」概念陷阱**（多出来的 2 是总和差，必须 ÷8 才是平均数的增量）。\n\n---\n\n### 第 18 题｜直接加（分组估算）· S省\"四上\"企业负债\n\n**【题干原文】**\n\n> 18、2015年S省\"四上\"企业总计负债约多少万亿元？\n> A.9　B.12　C.14　D.16\n\n**【材料数据】**\n\n> 表：**2015年S省\"四上\"企业资产及负债状况**（单位：亿元）\n\n| \"四上\"企业 | 资产总计 | 负债总计 |\n|---|---|---|\n| 规模以上工业企业 | 107061.7 | **56888.8** |\n| 资质等级建筑业企业 | 16566.2 | **9840.8** |\n| 房地产开发企业 | 46749.1 | **35200.6** |\n| 限额以上批发和零售业企业 | 17536.8 | **12584.6** |\n| 限额以上住宿和餐饮业企业 | 1211.0 | **888.9** |\n| 规模以上服务业企业 | 46939.4 | **26358.9** |\n| 其中：交通运输、仓储和邮政业 | 9600.7 | 5651.2 |\n| 　信息传输、软件和信息技术服务业 | 3218.5 | 1762.5 |\n| 　租赁和商务服务业 | 27332.3 | 15029.8 |\n| 　科学研究和技术服务业 | 2607.5 | 1432.9 |\n| 　水利、环境和公共设施管理业 | 2120.4 | 1221.4 |\n| 　居民服务、修理和其他服务业 | 132.6 | 87.2 |\n| 　教育 | 138.8 | 68.4 |\n| 　卫生和社会工作 | 270.7 | 179.1 |\n| 　文化、体育和娱乐业 | 994.4 | 568.0 |\n| 　房地产服务业 | 523.5 | 358.3 |\n\n> 注：\"四上\"企业包含表中所列 **6 个一级分类**；资产负债率=负债/资产，所有者权益=资产-负债。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求和（6 个**一级分类**相加） |\n| 定位数据 | 前 6 行的\"负债总计\"（画面红圈圈出的 6 个数） |\n| 列式 | 56888.8 + 9840.8 + 35200.6 + 12584.6 + 888.9 + 26358.9 |\n| 估算步骤 | 分组\"借零\"凑整：56888.8+9840.8≈66700；35200.6+12584.6≈48000（实为 47785.2）；888.9+26358.9≈27200 |\n| 结论 | `66700 + 48000 + 27200 ≈ 141900`（亿元）= **14.19 万亿** → 选 **C**（14） |\n\n**【速算演示】**（画面板书）\n\n```\n【一级分类识别】前 6 行是一级分类，下面\"其中\"的 10 行是二级分类，不重复计入！\n\n56888.8 + 9840.8 ≈ 66700   （从 56888.8 借 100 多给 9840.8，把它凑到 10000）\n35200.6 + 12584.6 ≈ 48000  （实为 47785.2）\n 888.9 + 26358.9 ≈ 27200   （借 100 给 888.9）\n→ 66700 + 48000 + 27200 = 141900（亿元）\n141900 亿 = 14.19 万亿\n→ 选 C（14）\n```\n\n**【选项原文】**\n- A.9\n- B.12\n- C.14\n- D.16\n\n**【答案】** ✅ **C**\n\n**【解析】**\n- 老师原话：\"第 18 题，这[问]'四上'企业总计负债多少万亿？四上企业是哪几个企业呢？**是有六个一级分类，一级分类指的就是前面这六个**，这叫一级分类。后面这边呢叫**二级分类**，是在这个一级分类的一个分支……如果你再在比如说房地产服务业里面再分，就叫三级分类了。\"\n- \"所以就是上面这六个，把他们这负债总额这六个数加起来，这六个数呢，就属于是**偏差比较大**的了。有大有小，大的五万多，小的才几百。**这种数据就不适合用前面那种平均数的思考方式。那种平均数思考一般是数据波动不大，都离平均数比较近。** 我只是先估一个大概的，差不多的，看看他们分别多的少的，小的部分、多的部分都比较小，好算。如果数字偏离太大了，你去找中间数比较麻烦，你要算的数减下来的数加起来的数都很大，不好算。\"\n- \"所以这边我们就老老实实直接加，加的时候稍微估算一下。如果这两个加的时候，我就从上面这个五万六[56888.8]借个一百多给他[9840.8]，给他省了一万，变成 66000[≈66700]，我算 700 也可以。下面两个再加加起来是 47700 多，也就算了 48000。最后这两个一加，我再借 100 给他，给上面这个 888 就会变成 27200。\"\n- \"然后这样加起来……7 + 2 = 9，在 900 前面；6 + 4 + 6 = 16……算下来是 141900，所以就是 14.19 万亿，选择 C。\"\n- **陷阱类型**：**范围 / 口径陷阱**（\"四上\"企业只算 6 个**一级分类**，二级分类不重复计入）。\n\n---\n\n### 第 19 题｜平均数（盈亏相抵）· 铁矿石月均产量\n\n**【题干原文】**\n\n> 19、2023年，平均每个月铁矿石产量约为：\n> A.7600万吨以下\n> B.7600万~8000万吨\n> C.8000万~8400万吨\n> D.8400万吨以上\n\n**【材料数据】**\n\n> 图表标题：**2023年1-12月全国铁矿石产量及增长率**\n> 柱：`产量（万吨）`；折线：`同比增长率（%）`\n\n| 时间 | 1-2月 | 3月 | 4月 | 5月 | 6月 | 7月 | 8月 | 9月 | 10月 | 11月 | 12月 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 产量（万吨） | 15035 | 8640 | 7510 | 7760 | 8516 | 8571 | 8633 | 8437 | 8645 | 8577 | 8603 |\n| 同比增长率（%） | 3.7 | −4.8 | 0.7 | −2.9 | 1.8 | 8.0 | 1.3 | −0.9 | 29.8 | −6.6 | 0.4 |\n\n> **关键**：`15035` 是 **1-2 月合并**的产量，不能当一个\"月产量\"看，要拆成\"1 月 7500、2 月 7500\"。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 平均数（把\"1-2 月合并数\"拆成两月） |\n| 定位数据 | 12 个月的产量；`15035` 视为两个月各约 7517 |\n| 列式 | 假设平均值 8000，看\"亏多少 / 赢多少\" |\n| 估算步骤 | 亏：1-2 月拆成两个 7500 → 各亏 500（共 1000）；3 月亏 240 → 合计亏约 1740。赢：8640、8500、8500、8500、8600 等，每项多 500~600 |\n| 结论 | 赢的部分随便一加就超过 1740 → 均值 > 8000 → 落在 **8000万~8400万吨**，选 **C** |\n\n**【速算演示】**（画面板书）\n\n```\n最小值 7500（1-2 月拆半年），最大值 8645 — 均值必在 7500~8645 之间\n先排除 A（7600 以下）、D（8400 以上）：比 8400 多的只有极少数月，且多一两百；比 7600 小的只有 3 个月，且只小 100 左右\n关键：均值到底超没超 8000（超 8000 选 C，不足选 B）\n假设平均值 = 8000：\n  亏：7500 亏 500、7500 亏 500（共 1000）；7760 亏 240 → 合计 ≈ 1740\n  赢：8640 多 600 多、8500 多 500、8500 多 500……（后面一加轻松超过 1740）\n→ 平均值 > 8000 → 选 C（8000万~8400万吨）\n```\n\n**【选项原文】**\n- A.7600万吨以下\n- B.7600万~8000万吨\n- C.8000万~8400万吨\n- D.8400万吨以上\n\n**【答案】** ✅ **C**\n\n**【解析】**\n- 老师原话：\"第 19 题，2023 年，平均每个月的铁矿石产量是多少？这边一共十二个月，他把这数据都给你了……那这几个月呢，它整体它的每个月的数呢，其实是**差不太多**的。\"\n- **拆月技巧（关键）**：\"你不要看这个 15000[15035] 说，老师这一万五比他们高这么多，这不属于你刚刚说的那个数的偏离比较大吗？不建议用吗？**其实不是的。因为这个 15035 是两个月的，你可以把这个 1-2 月看作平均值为 7500 的情况。相当于 1 月 7500、2 月 7500**，和后面的这些数凑在一起的，这样子就觉得他们是比较平均的了。\"\n- \"那相当于是七千五、七千五、七千五[……]然后剩下的就开始到八千多了，八四、八五、八六，这样子的八千六的样子。所以他们的平均数大概在八千附近。应该在[肯定]是在 7500 到 8600 之间的，因为这是他们的最小值和最大值。\"\n- **先排除**：\"那我们就已经可以相对来说把一些比较明显不可能的，比如说像 A、像 D，明显不可能吧。因为你八千四百万吨以上都没有几个，就只有几个月；比如说有几个月比这八千四多，但多了很少，只多了一百多或者两百多，但是少的部分却比它少了很多，都是少好几百了，所以说八千四明显偏高了。七千六呢有点[偏]小了，比七千六小了，只有这三个月，而且小的很少，就小一百左右。\"\n- \"所以关键点就在于，到底在这个 B、C 里面，它的平均值有没有超过这个八千？超过八千就选 C，低于八千就选 B。所以我们就假设这个平均值是八千……以八千来看，赢多少亏多少。\"\n- \"先把亏的部分写一下吧，因为一到二月它本身就是亏的，从它开始算的，7500 比 8000 都是少 500，500 加 500，这边一共少 1000。7760 少 240……那也就一共少了一千七百四。比八千多的多多少呢？8640、8500、8500、8500、8600，这分别多了 600 多、500 多、500 多。**其实写到这边就基本上不用写了吧，因为发现这后面一加随随便便加起来都能超过这个 1740。所以平均值肯定超过 8000，选择 C 选项。**\"\n- **陷阱类型**：**数据陷阱**（1-2 月合并数必须拆成两个月看）。\n\n---\n\n### 第 20 题｜均值 vs 中位数（盈亏判断）· 人均可支配收入\n\n**【题干原文】**\n\n> 20、2018-2022年，全国居民人均可支配收入的五年均值大于这五年的中位数\n> A.正确　B.错误\n\n**【材料数据】**\n\n> 图表标题：**图1 2018-2022年全国居民人均可支配收入及同比实际增速**（单位：元）\n\n| 年份 | 2018 | 2019 | 2020 | 2021 | 2022 |\n|---|---|---|---|---|---|\n| 全国居民人均可支配收入（元） | 28228 | 30733 | 32189 | 35128 | 36883 |\n| 同比实际增速（%） | 6.5 | 5.8 | 2.1 | 8.1 | 2.9 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 均值 vs 中位数比较（只需判断大小，不算具体值） |\n| 定位数据 | 5 个收入数：28228、30733、32189、35128、36883 |\n| 列式 | 中位数 = 从小到大第 3 个 = `32189`；假设均值 = 32189，看盈亏 |\n| 估算步骤 | 比 32189 多：35128（+2939）、36883（+4694）≈ +7633；比 32189 少：30733（−1456）、28228（−3961）≈ −5417 |\n| 结论 | 多 7633 > 少 5417 → 均值 > 中位数 → 判断\"正确\"，选 **A** |\n\n**【速算演示】**（画面板书）\n\n```\n中位数：5 个数排序 28228、30733、32189、35128、36883 → 第 3 个 = 32189\n假设平均数 = 32189（即中位数位置），做盈亏比较：\n  赢：35128 多 ≈ 3 千；36883 多 ≈ 4.7 千 → 合计 ≈ +7.7 千\n  亏：30733 少 ≈ 1.4 千；28228 少 ≈ 4 千 → 合计 ≈ −5.4 千\n赢的比亏的多 → 平均值 > 中位数 32189\n→ \"正确\"，选 A\n```\n\n**【选项原文】**\n- A.正确\n- B.错误\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 老师原话：\"第 20 题，18 到 22 年这五年的人均可支配收入的平均值大于中位数。**中位数才好找了，直接找 1、2、3、4、5 里面谁排第三就好了。** 排在中间位置的是 32189，它正好是由小到大，最小的、第二小的、第三小的、第四小的、第五小的，中间的是它。\"\n- \"就是说这个平均值有没有大于这个 32189 呢？**我只要判断平均值比较大还是比较小就好了，我不要算准一个准确的值，所以其实也只是判断。** 盈亏关系：假设这个平均值就是这个 32189。比它多的这两个数和比较少的这两个数，是赢的多还是亏的多？\"\n- \"赢的话，这边多 3000，后面多 4.7 千，一共大概多了 7.7 千；然后前面呢少了一点 4 千，少了这边少了个四千左右，[合] 只少了五点四千[→5.4 千]。所以整体是赢的，[赢的]那部分比较多，所以平均值实际上比这个中位数 32189 要高，所以这个是正确的，选择 A。\"\n- **陷阱类型**：**概念陷阱（均值 / 中位数）**——题目只问\"大于\"，无需精算，盈亏比较即可。\n\n---\n\n### 第 21 题｜环比增量（先算当月均值）· 一带一路新签合同额\n\n**【题干原文】**\n\n> 21、2022年3月份我国在\"一带一路\"沿线国家对外承包工程业务**平均每份新签合同额**的环比增量在以下哪个范围内？（ ）\n> A.不到1亿元\n> B.1亿元~1.5亿元之间\n> C.1.5亿元~2亿元之间\n> D.超过2亿元\n\n**【材料数据】**\n\n> 表：**2022年1-3月我国在\"一带一路\"沿线国家对外承包工程业务情况**\n> （表头：时间｜累计完成营业额(亿元)｜同比增速(%)｜累计新签合同(份)｜累计新签合同额(亿元)｜同比增速(%)）\n\n| 时间 | 累计完成营业额（亿元） | 同比增速（%） | 累计新签合同（份） | 累计新签合同额（亿元） | 同比增速（%） |\n|---|---|---|---|---|---|\n| 1月 | 282.3 | −15.7 | 295 | 574.8 | 27.5 |\n| 2月 | 649.3 | −4.3 | 812 | 1103.9 | 16.9 |\n| 3月 | 1014.2 | −11.9 | 959 | 1564.7 | −23.0 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 环比增量（**累计值先折算\"当月值\"**，再算\"平均每份\"） |\n| 定位数据 | 累计新签合同额（亿元）、累计新签合同（份）——两列的 2 月、3 月行 |\n| 列式 | 3 月当月合同额 = 1564.7 − 1103.9；3 月当月份数 = 959 − 812；2 月同理 |\n| 放缩步骤 | 420/147 型 → 分母凑 `143 ≈ 1000/7`；2 月 `530/517` 先提整数 1 |\n| 结论 | 3 月均值 ≈ 3.15 亿元/份，2 月均值 ≈ 1.02 亿元/份，环比增量 ≈ **2.13** → 选 **D** |\n\n**【速算演示】**（画面板书）\n\n```\n【先折\"当月值\"】\n3 月当月合同额 = 1564.7 − 1103.9 = 460.8 ≈ 461 亿元\n3 月当月份数   = 959 − 812 = 147 份\n2 月当月合同额 = 1103.9 − 574.8 = 529.1 ≈ 530 亿元\n2 月当月份数   = 812 − 295 = 517 份\n\n【3 月均值】\n461 / 147  → 分母凑 143（≈1000/7，−4）：分子 −11 → 450 / 143\n450 / 143 = 450 × 7 / 1000 ≈ 3.15 亿元/份\n\n【2 月均值】\n530 / 517 = 1 + 13/517 ≈ 1 + 0.02 = 1.02 亿元/份\n（先提出整数 1，剩下的 13/517 才好算：13 约为 517 的 2%）\n\n【环比增量】\n3.15 − 1.02 = 2.13 > 2 亿元\n→ 选 D（超过2亿元）\n```\n\n**【选项原文】**\n- A.不到1亿元\n- B.1亿元~1.5亿元之间\n- C.1.5亿元~2亿元之间\n- D.超过2亿元\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"第 21 题，2[2022]年 3 月份平均每份新签合同额的环比增量在以下哪个范围？就我们把这个 3 月份的平均值想出来、2 月份的平均值想出来，然后[做差]。\"\n- **累计值折当月**：\"上面给的数据是给了一个三月份的**累计**新签合同和累计新签合同额。它是个累计值，你要算当月的一个平均值的话，你就要有当月的合同额和当月到底多少份。那你就要把当月的[算]出来，**把三月的累计减掉二月的累计，减下来就是当月的**。因为三月累计意味着就是一到三月一共是一千五百多，二月累计就是一到二月一共是一千一百多，一到三[月]把一到二[月]减掉，就剩三月了。\"\n- \"3 月一共是：`1564 − 1103 = 461` 亿元，这个就是 3 月的合同额。你要看他的平均值，你还需要知道他这个月到底签了多少份呢？同样的，拿这个累计签的合同数据减 [959]，减掉 812，减下来是 147，就是 147 份。那平均每份就是 `461 除以 147`。\"\n- \"那你就会直接先开始算下来，[477] 把分母 147 先写成 143，因为 143 是一个七分之一，好算，减个四，上面大概三倍左右吧，三倍多吧，三四一十二，我减个十一吧，凑个整就行了[，得 450]，然后四十五[乘]个七 [÷1000] → [3.15]，所以平均下来应该是在 3.15 亿元每份。\"\n- **2 月均值**：\"2 月份同理，我们把 2 月份的当月的合同额先减出来，`1103 减掉 574`，减下来就是 530 左右。合同数就是它 `812 减 295` 等于 517，所以它的平均值是 `530 除以 517`，这个非常靠近 1 比 1 多一点点。所以我们先把 1 提出来，就等于 `1 加上 13 除以 517`，这种比较整的数明显就是好算的数先提出来。\"\n- **为什么\"先提整数\"**：\"把这整数先提出来，剩下的部分你就更好算了一点。**因为你要你这个乘除的计算对象小了，你本来是算这个一零几的结果，你现在只算后面那个零点零几了，计算对象小了，你的这个误差就可以很随便的去控了。** 十三除这个 517，……一千三大概是 517 的二点几倍吧，所以算下来应该是一点零二，百分之二左右。或者你可以想，13 就是 517 的百分之二嘛，百分之一是 5[.17]……所以有一点零二。\"\n- \"那三点一三是三月份的[均值]，一点零二是二月份的[均值]，做差等于 2.13，所以比这个两亿元稍微高一点点，选择 D。\"\n- **陷阱类型**：**时间陷阱 / 累计值陷阱**（表格给的是累计值，必须先折算成\"当月值\"再做环比）。\n\n---\n\n### 第 22 题｜倍数（先定位年份）· 跨境电商进出口差值\n\n**【题干原文】**\n\n> 22、2013~2018年间，我国跨境电商**进口与出口规模相距最大的年份，其差值约为相距最小年份的几倍**？（ ）\n> A.3.4倍　B.3.1倍　C.2.6倍　D.2.3倍\n\n**【材料数据】**\n\n> 图表标题：**2013~2018年我国进出口跨境电商交易规模及出口跨境电商交易规模中B2B业务占比**\n> 图例：`出口规模`（白柱）、`进口规模`（黑柱）、`出[口]跨境电商交易规模中B2B业务占比`（折线）\n> 图下文字：**跨境电子商务市场结构分为B2B（商对商）和B2C（商对客）两种模式。**\n\n| 年份 | 出口规模（白柱，万亿元） | 进口规模（黑柱，万亿元） | 差值 |\n|---|---|---|---|\n| 2013 | 2.70 | 0.45 | **2.25**（最小） |\n| 2014 | 3.57 | 0.63 | 2.94 |\n| 2015 | 4.50 | 0.90 | 3.60 |\n| 2016 | 5.50 | — | — |\n| 2017 | 6.30 | 1.76 | 4.54 |\n| 2018 | 7.10 | 1.90 | **5.20**（最大） |\n\n> 折线（出口跨境电商交易规模中 B2B 业务占比，%）：85.9、84.9、84.0、81.8、81.0、80.3。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 倍数（**先按条件定位年份**，再算比值） |\n| 定位数据 | 逐年\"出口 − 进口\"，取最大 / 最小 |\n| 列式 | `5.20 ÷ 2.25` |\n| 放缩步骤 | `520 ÷ 22`；分母 −3 → 22[0]；`520 ÷ 2 = 260`，`260 ÷ 11` 错位相减 |\n| 结论 | `260 − 26 = 234` → `2.34 ≈ 2.3` → 选 **D** |\n\n**【速算演示】**（画面板书）\n\n```\n逐年做差：\n2013: 2.70 − 0.45 = 2.25   ← 最小\n2014: 3.57 − 0.63 = 2.94\n2015: 4.50 − 0.90 = 3.60\n2016: 5.50 − [1.20] ≈ 4.30\n2017: 6.30 − 1.76 = 4.54\n2018: 7.10 − 1.90 = 5.20   ← 最大\n最大 / 最小 = 5.20 / 2.25 → 520 / 225 → 520 / 22（分母 -3）\n520 ÷ 2 = 260\n260 ÷ 11 → 错位相减：260 − 26 = 234\n234 → 2.34 → 约 2.3 ≈ 2.32\n→ 选 D（2.3倍）\n```\n\n**【选项原文】**\n- A.3.4倍\n- B.3.1倍\n- C.2.6倍\n- D.2.3倍\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"第 22 题，在 13 到 18 年间，跨境电商进口跟出口规模相距最大的年份，它的差值是相距最小年份的几倍？**前面找差距最大，其实就是一个定位，要通过这个条件，先找到他问的这个年份到底是哪一年。** 进出口规模是……出口是白，进口是黑，它们的差距相差最大，就是直接拿大的减小的。\"\n- \"`2.7 − 0.45 = 2.25`，后面做差等于 2.94，再做差，这个地方是 3.6，[然后] 4.3、4.54，最后有 5.2，所以最大的是 18 年……它这个差值 5.2，比相距最小年份[13 年] 2.25。它的差值是几倍，是这个 2.25 的几倍，所以就要算这个 5.2 除以 2.25 是多少。\"\n- \"这个地方可以直接五百二十除以二二。**下面虽然减了三，上面我先不动，为什么上面先不动？因为上面这个我觉得除以二本身就已经很好除了**，除以这个 22 很好除，[除得很整]，先不动，我最后再去调这个差不多百分之一的误差嘛。除以 2 等于 260，260 除以 11 等于错位相减，260 减 26 等于 234。\"\n- \"如果就算想写的再准确一点，那我刚刚我这个分母少了 1%，我的分子是不是应该也少 1% 啊？……我最后少个百分之一，变[成 23]……[234] 减个 2 左右，就[是] 232，2.32 倍更准一点。但很多说的这个[选项]里面，你就调这么一点点，对于这个结果的影响也是一点点。那选项差距不是这么一点点，你就不会怕这个一点点。\"\n- **重要提示**：本集画面中老师给本题标出的答案是 **D**（板书在 D 旁打了勾、并在 D.2.3倍 下划线）；转写文字里出现了\"选 B\"的口误（B 选项是 3.1 倍，与算得的 2.32 不符），**以画面为准，答案为 D.2.3倍**。\n- **陷阱类型**：**定位陷阱**（必须先按\"差距最大 / 最小\"筛出年份，再算倍数）。\n\n---\n\n### 第 23 题｜同比增速（矛盾面求占比）· 出口跨境 B2C\n\n**【题干原文】**\n\n> 23、2018年，我国出口跨境B2C电商交易规模同比约增长了（ ）。\n> A.14%　B.17%　C.20%　D.23%\n\n**【材料数据】** 同第 22 题图表。\n\n> 图例：`出口规模`（白柱）、`进口规模`（黑柱）、`出口跨境电商交易规模中B2B业务占比`（折线）\n> 图下文字：**跨境电子商务市场结构分为B2B（商对商）和B2C（商对客）两种模式。**\n\n| 年份 | 出口规模（万亿元） | B2B 占比（折线，%） | B2C 占比（= 100% − B2B，%） |\n|---|---|---|---|\n| 2017 | 6.30 | 81.0 | **19.0** |\n| 2018 | 7.10 | 80.3 | **19.7** |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 同比增速（**先用\"矛盾面\"求出 B2C 占比**，再算增速） |\n| 定位数据 | 2017、2018 的出口规模；折线的 B2B 占比 |\n| 列式 | 2018 B2C 规模 = `7.10 × (100% − 80.3%)`；2017 B2C 规模 = `6.30 × (100% − 81.0%)` |\n| 放缩步骤 | `7 × 19.7% = 1.379`；`6.3 × 19% = 1.197`；增速 = `(1.4 − 1.2)/1.2` |\n| 结论 | `0.2 ÷ 1.2 = 1/6 = 16.7% ≈ 17%` → 选 **B** |\n\n**【速算演示】**（画面板书）\n\n```\n【B2C 占比 = 矛盾面】\n市场结构只有 B2B 与 B2C 两种 → B2C 占比 = 100% − B2B 占比\n2018 年：B2B 80.3% → B2C = 19.7%    （画面写作 19.7%）\n2017 年：B2B 81.0% → B2C = 19%      （画面写作 19%）\n\n【两年 B2C 规模】\n2018： 7.1 × 19.7%  → 71 × 19.7 → 分子凑 700、分母凑 200\n        700 × 200 = 141000 → 1.4（画面得 1.4）\n2017： 6.3 × 19%    → 63 × 19 → 60 × 21.2 记作 1.2\n\n【增速】\n(1.4 − 1.2) / 1.2 = 0.2 / 1.2 = 1/6 = 16.7% ≈ 17%\n→ 选 B\n```\n\n**【选项原文】**\n- A.14%\n- B.17%\n- C.20%\n- D.23%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 23 题，一八年的时候，出口跨境里面 B2C 的电商交易规模，它的增速是多少？那我先要知道一八年它 B2C 的这个交易规模到底是多少？除了进出口规模总值以外，这个表里面还有一个东西叫做 b to b 的业务占比百分之[8]0.3，那这是 b to b，**不是这个 b to c**。怎么办呢？\"\n- **矛盾面求占比（关键）**：\"你看这边还有一段文字，给了你一个补充，**就整个这个[跨境]商务市场结构就分两种，一种是 B2B，一种是 B2C。那这个 B2C 就是 B2B 的矛盾面。通过矛盾面给的数据，B2B 是 80.3%，那么 B2C 就是 19.7%**，剩下的部分。所以一八年的量呢，就是出口……出口是这个白的吧，就是 7.1 里面的百分之 19.7 是这个一八年的量。\"\n- \"那相比同比增长多少？我需要找到一七年的时候，出口是 6.3，里面有百分之十九是这个 B2C 的。你知道这两个值之后，就能算他们的同比增速了。\"\n- \"上面写一下，就把它想成 `71 乘以 19.7`……这个 200 [19.7] 太近了，直接加个 3，变成 200。左边大概 3.5 倍，这就减个 3，乘以 3.5，减个 10，变成 700。700 乘以 200 正好很整，14 开头，所以这里算下来就是 1.4。**肯定跟你这个计算机按下的结果基本上是没有什么差距的。因为这边的加 3、减 10，太凑巧了，真的很巧。**\"\n- \"然后在这里，`6.3 乘 19`，你也可以一样这样来一次。这边加 19[→19]，这边加 1，那 63 这边就要减 3，`60 乘以 20` [≈ 1.2]。那从 1.2 涨到了 1.4，涨了 0.2。`0.2 除以 1.2 等于 1/6`，1/6 等于 16.7%，所以是 17%，选择 B。\"\n- **陷阱类型**：**概念陷阱 / 口径陷阱**（B2C 需借\"矛盾面\"由 B2B 反推，且占比是对\"出口规模\"而言）。\n\n---\n\n### 第 24 题｜比重（总量×占比）· 政府采购公开招标金额\n\n**【题干原文】**\n\n> 24、2018年全国政府采购规模增幅趋缓，采购规模达35861.4亿元，较上年增长11.7%，公开招标、邀请招标、竞争性谈判、竞争性磋商、询价、单一来源采购分别占全国政府采购规模的70.5%、1.1%、3.6%、5.3%、2.3%和11.8%。\n> 2018年全国政府采购**公开招标合同金额**约为（ ）亿元。\n> A.24565.8　B.25282.3　C.25703.0　D.26488.6\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2018 年全国政府采购规模 | 35861.4 亿元 |\n| 比上年增长 | 11.7% |\n| 公开招标占全国政府采购规模比重 | **70.5%** |\n| （其余：邀请招标 1.1%、竞争性谈判 3.6%、竞争性磋商 5.3%、询价 2.3%、单一来源采购 11.8%） | — |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 比重（已知总量与占比，求部分量） |\n| 定位数据 | 总量 `35861.4` 亿元；公开招标占比 `70.5%` |\n| 列式 | `35861.4 × 70.5%` → 保留三位 `358 × 705` |\n| 放缩步骤 | 分母（705）减 5（约 −1%）；分子 358 加 2.5 左右 → 加 2 → `360 × 700` |\n| 结论 | `36 × 7 = 252` → `25200` 出头 → 选 **B**（25282.3） |\n\n**【速算演示】**（画面板书）\n\n```\n35861.4 × 70.5%  →  358 × 705\n705 离 700 很近 →  减 5（约 -1%）\n358 大概[要]加[它]的一半[左右对应]，加个 2 → 360\n360 × 700 = 252000 → 252\n→ 选 B（25282.3）\n```\n\n**【选项原文】**\n- A.24565.8\n- B.25282.3\n- C.25703.0\n- D.26488.6\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 老师原话：\"第 24 题：18 年全国政府招[采]购的公开招标合同金额是多少？开头呢，先给了我们一八年整个的一个采购规模是 35861[.4]，但它并不是公开招标的。再找哪边谈到公开招标，在这儿——公开招标的这个规模，**它占了全国所有的采购规模的比重呢，是百分之七十点五**。\"\n- **口径识别（关键）**：\"1、2、3、4、5、6 种，6 个占比，他们是一一对应的。**那前面这第一个就对应的是第一个占比 70.5%。** 又给了你一个总共的规模，还给了你一个问了这个东西在其中的一个占比，那么这个量就直接拿这个总量 358 去乘这个 70.5%。\"\n- \"那就想着直接 `358 乘 705`。把 705 减个 5。[那 358 大概它的一半，就加个 2.5，那就加个 200？不对，]加个 2，变成 360，360 乘以 700。[`36 × 7 = 252`]，[得] 252。B 走人，你很准吧？252。\"\n- **误差说明**：\"为什么还要差个 82 呢？因为我这个[705]本身也少了一点点，少算了一点点嘛，所以这个结果还是会偏小一点的。而且我加[358]不也加小了，本来应该加二点五的结果，加了个二。\"\n- **陷阱类型**：**对应关系陷阱**（6 个占比与 6 个采购方式一一对应，公开招标 = 第一个占比 70.5%）。\n\n---\n\n### 第 25 题｜部分差（比重差合并）· 第三产业比第二产业高多少\n\n**【题干原文】**\n\n> 25、2022年全省实现地区生产总值87435.1亿元，按不变价格计算，比上年增长3.9%。分产业看，第一产业增加值6298.6亿元，增长4.3%，三次产业结构为7.2：40.0：52.8。\n> 2022年，第三产业增加值比第二产业增加值大约高：\n> A.39870.4亿元　B.28678.7亿元　C.12130.7亿元　D.11191.7亿元\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2022 年全省地区生产总值 | 87435.1 亿元 |\n| 比上年增长（不变价） | 3.9% |\n| 第一产业增加值 | 6298.6 亿元（增长 4.3%） |\n| 三次产业结构 | 7.2 : 40.0 : 52.8（合计 100%） |\n| 第二产业占比 | 40.0% |\n| 第三产业占比 | 52.8% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 部分差（**先合并比重差，再乘总量**） |\n| 定位数据 | 总量 `87435.1`；三产占比 52.8%、二产占比 40.0% |\n| 列式 | `87435.1 × 52.8% − 87435.1 × 40.0% = 87435.1 × (52.8% − 40.0%) = 87435 × 12.8%` |\n| 放缩步骤 | `874 × 128`；128 减 3 凑 `125（=1/8 × 1000）`；874 加 21 左右 → `895`；`895 ÷ 8` |\n| 结论 | `895 × 125 = 111875` → `11191.7` → 选 **D** |\n\n**【速算演示】**（画面板书）\n\n```\n【先合并比重差，再乘总量】\n87435 × 52.8% − 87435 × 40%\n= 87435 × (52.8% − 40%)\n= 87435 × 12.8%\n→ 874 × 128\n\n128 减 3 → 125（125 = 1/8 × 1000）\n874 加 21 左右（约 7 倍）→ 895\n895 × 125 = 895000 / 8 = 111875\n→ 111.875（×100）≈ 11191.7\n→ 选 D\n```\n\n**【选项原文】**\n- A.39870.4亿元\n- B.28678.7亿元\n- C.12130.7亿元\n- D.11191.7亿元\n\n**【答案】** ✅ **D**\n\n**【解析】**\n- 老师原话：\"第 25 题：22 年第三产业增加值比第二产业增加值高多少？先告诉你整个地区生产总值，这是第二产业、第三产业的总体的量。所有的 GDP 在所有的 GDP 里面呢，还分为第一、第二、第三。第一的有这么多，还告诉你三次产业结构是 7.2 比 40 比 52.8，**这个其实就是他们三个的占比**。第一产业占了 7.2%，你看他们三个加起来正好是 100%，第二产业占了 40%，第三产业占了 52.8%。\"\n- **核心技巧（部分差 → 比重差合并）**：\"有了第二产业跟第三产业的占比了，那它们的量就有了。第三产业呢就是 `87435 乘以 52.8%`，第二产业呢是 `87435 乘以 40%`，问上面的比下面的多多少，做差，**做差就可以合并，同理项就直接是 `87435 乘以 (52.8% − 40%)`**。所以我们在算这种部分差的时候，**可以直接先把他们的比重差算出来**，我是 52.8，他是 40，那我就比你多了 12.8%。我的比你多的量也是这 12.8%，所以就是 `874 乘以 128`。\"\n- \"右边减 3，把它凑成 125，125 是 1/8。那[左边]大概加了 7 倍，加到 21 左右，那就 895。895 乘以 125[→] 是八分之一[的量级]，除以 8 等于 11 开头。直接 D 走了。大概 112 左右。8 × 11 = 88，那剩个 15，[≈ 11191.7] 左右，所以[选] D。\"\n- **陷阱类型**：**计算对象陷阱**（部分差不必分别算两遍，**先合并比重差再乘总量**，一步到位）。\n\n---\n\n## 本讲知识点总表\n\n| 题号 | 主题 | 速算锚点 / 方法 | 答案 |\n|---|---|---|---|\n| 1 | 乘法放缩 | `458 → 444 ≈ 4/9`，另一边补 3% | B |\n| 2 | 除法放缩 | 分母凑 `900`，先出整数 7，再补 5% | D |\n| 3 | 除法放缩 + 量级 | `16 ÷ 500 = 32`，再判\"万\"的量级 | D |\n| 4 | 除法放缩 | 分母凑 `143 ≈ 1000/7`，分子分母同步减 | A |\n| 5 | 除法放缩 | 分母凑 `250 = 1/4`，分子凑整 | B |\n| 6 | 除法放缩 | 分母凑 `1/6`，分子\"凑整即可\" | B |\n| 7 | 除法放缩 | 分母凑 `800`（或 750），选项差距大可直接切 | C |\n| 8 | 除法放缩 | 分母本身即 `125 = 1/8` | A |\n| 9 | 除法放缩 | 分母凑 `200`，用倍数关系预判调整量 | A |\n| 10 | 除法放缩 | 分母凑 `1111`，先出整数 7 | C |\n| 11 | 除法放缩 | 分母凑 `222 ≈ 2/9` + 错位相减（保留两位） | B |\n| 12 | 除法放缩 | 分母凑整数 `100`，分子同步 +1% | B |\n| 13 | 乘法放缩 | 两个因子都不好凑 → 挑更好动的那个（268 → 250） | D |\n| 14 | 除法放缩 | 分母可往 `366 / 333 / 400` 三方向凑；错位相减补 1% | A |\n| 15 | 除法放缩 | 分母凑 `1250 = 1/8×10⁴`；分子很整就先不动 | A |\n| 16 | 加法估算 | 两两分组 + \"有借有还\"；范围题看离边界远近 | B |\n| 17 | 平均数 | 假设平均数 → 盈亏相抵；**总和差 ÷ 8** | B |\n| 18 | 直接加 | 只加 6 个一级分类；分组\"借零\"凑整 | C |\n| 19 | 平均数 | 1-2 月合并数先拆成两个月；假设 8000 看盈亏 | C |\n| 20 | 均值 vs 中位数 | 中位数 = 第 3 个；盈亏判断即可 | A |\n| 21 | 环比增量 | 累计值折当月值；先提出整数 1 再算小数 | D |\n| 22 | 倍数 | 先定位年份（差最大 / 最小），再算比值 | D |\n| 23 | 同比增速 | B2C 占比 = 100% − B2B（矛盾面） | B |\n| 24 | 比重 | 6 个占比与 6 种方式一一对应；总量 × 占比 | B |\n| 25 | 部分差 | 先合并比重差（52.8% − 40.0% = 12.8%）再乘总量 | D |\n\n---\n\n## 速算口诀与解题流程\n\n### 一、乘法放缩\n\n```\n① 丢掉百分号与小数点，全保留三位（如 561.4×45.8% → 561 × 458）\n② 挑一个因子往\"百化分\"上凑（4/9、1/6、1/8、1/4、3/4 …）\n③ 另一个因子按\"相同百分比、相反方向\"补回来\n④ 动的越小，结果越稳；两个都不好凑时，挑\"更好动\"的那个下手\n⑤ 整数因子很整 → 先不动它，最后再统一补误差\n```\n\n### 二、除法放缩\n\n```\n① 分母位数太高 → 先把它降下来（凑百化分 / 凑整十整百）\n② 分子\"象征性\"同步调（不必精准）：分母动 x%，分子没动 → 结果补/减 x%\n③ 分子本身很整（如 6300、2700、920）→ 先别动，最后统一调\n④ 遇到 ÷9、÷11：\n     ÷9  → 错位相加：N + N/10\n     ÷11 → 错位相减：N − N/10\n     两者结果天然偏小约 1% → 算完把 1% 补回来\n⑤ 错位加减可以只保留两位（如 427 减 42，不减 42.7），省时且误差很小\n⑥ 选项差距大（如 30 落在 15/23/30/45 中）→ 可直接\"一刀切\"选最近的\n```\n\n### 三、加减法估算\n\n```\n① 不要一个个死加，两两一组\"带估\"\n② \"有借有还\"：把小数尾巴借给别人凑整，但整体上要还账\n   （前几组都往大里估了，最后一组就往下压一点）\n③ 求和也可以从\"平均数\"角度：找一个靠近中间的值当假想平均数，\n   看多的部分与少的部分能否盈亏相抵\n```\n\n### 四、范围型 / 平均数型题目\n\n```\n范围型：\n  精度要求高不高，看\"估算结果离选项边界近还是远\"\n  离边界远（如 19.1 离 20 差 0.9）→ 放心估\n  离边界近（如 19.9 离 20 只差 0.1）→ 必须回查估算误差\n\n平均数型（盈亏相抵）：\n  ① 取一个\"假想平均数\"（靠近中位数 / 中间值）\n  ② 统计\"多的部分合计\"与\"少的部分合计\"\n  ③ 净差 ÷ 个数 = 平均数的增量\n     ⚠️ 净差是\"总和差\"，必须除以个数才是平均数的变化\n```\n\n### 五、材料题通用四步\n\n```\n① 定位：先按题干条件筛出\"年份 / 分类\"\n② 口径：确认是累计值还是当月值、是一级还是二级分类、占比对应哪一个\n③ 列式：能合并的先合并（如部分差 → 比重差）\n④ 速算：套上面的乘法 / 除法放缩\n```\n\n---\n\n## 易错点与陷阱清单\n\n| 陷阱类型 | 涉及题号 | 具体表现 |\n|---|---|---|\n| **量级 / 单位陷阱** | 第 3 题 | 有效数字相同的选项（3.2 与 31.6），只差位数；必须判\"万 / 亿\"量级 |\n| **\"总和差\"当\"平均数差\"** | 第 17 题 | 净多 2 是总和差，必须 ÷8 才是平均值增量 |\n| **口径陷阱（一级 / 二级分类）** | 第 18 题 | \"四上\"企业只加 6 个一级分类，二级分类不重复计入 |\n| **数据陷阱（合并数）** | 第 19 题 | `15035` 是 1-2 月合并值，要拆成两个 7500 |\n| **时间 / 累计值陷阱** | 第 21 题 | 表给的是\"累计值\"，必须相减折出\"当月值\"再算环比 |\n| **定位陷阱** | 第 22 题 | 先按\"差距最大 / 最小\"筛年份，再算比值 |\n| **概念陷阱（矛盾面）** | 第 23 题 | B2C 占比要由 B2B 反推（100% − B2B） |\n| **对应关系陷阱** | 第 24 题 | 6 个占比与 6 种采购方式一一对应 |\n| **计算对象陷阱** | 第 25 题 | 部分差先合并比重差，不必算两遍 |\n| **范围陷阱（边界过近）** | 第 16、19 题 | 结果离选项边界太近时，必须回查估算误差 |\n| **错位加减的 1% 偏差** | 第 1、11、14、22 题 | ÷9、÷11 的错位加减结果天然偏小 1%，要补回来 |\n| **\"动得越多越危险\"** | 第 1、4 题 | 放缩幅度大 → 结果控不准；选项差距小时尤其危险 |\n\n---\n\n## 老师金句\n\n> ⭐ \"**不要把这个什么百分号牵扯进来去干扰你的运算**，直接我们就全保留三位。\"\n\n> ⭐ \"这种乘法放缩或者说除法放缩，**你动的越多越容易控不准，就越危险**。所以这个地方 A、B 的选项差距还不是那么大的时候，我建议还是动小一点……这样比较稳妥、比较安全。\"\n\n> ⭐ \"**你先算出来，再结合你的一个误差去观察选项**，有时候往往会更快一点。\"\n\n> ⭐ \"所以除法放缩，**你只要你动的小，你就不用刻的很准，不用控的很准。**\"\n\n> ⭐ \"**所以选择 D 不是 A，是这样才选这个 D 的。** 要稍微分析一下这个量级的，不然有的问题可能会错掉的。\"（第 3 题）\n\n> ⭐ \"**误差你在哪个地方调都可以，只要你调的结果影响是一样的、是准确的就可以了。你可以在分子上调，也可以算完了再调。**\"（第 15 题）\n\n> ⭐ \"**大家一定要注意，这个题目的精度要求是高还是低，主要看的是你估算下来的结果距离它这个选项之间的边界近还是远。**\"（第 16 题）\n\n> ⭐ \"**多出来这个 2，它不是个平均数的多了个 2，是总和多了个 2。按平均数还得除以 8。**\"（第 17 题）\n\n> ⭐ \"**这个时候你就回头去看你刚刚的操作过程中可能出现误差的地方**……这样去分析一下你这个过程中出现的误差，就能选到更准确的那个答案上去。\"（第 14 题）\n\n> ⭐ \"**一般错位相加或者错位相减，如果我想省点计算，我会选择把这个最后这一位给它省略掉。**\"（第 11 题）\n\n> ⭐ \"**有借有还**——我前面这四组里面有三组都相对来说借了一点，那我最后一组我就替他们还了，这样子的话，结果就更准一点。\"（第 16 题）\n\n> ⭐ \"**误差在哪里调都可以**；比如说这个分母加了 2%，本来应该分子加 2% 的，但是你没有加，那我就在最终的结果上去把这个 2% 给它补回来。\"\n\n> ⭐ \"这个就是我们今天放缩运算的课后作业。主要两个原则：**① 尽量少动；② 另外一边不用动得很准。** 第
