选 B） |\n| `g_013` | f_0109–f_0117 | 第 15 题答案 B；第 16 题材料（2020 年电子商务） |\n| `g_014` | f_0118–f_0126 | 第 16 题（四类增量比较，选 A） |\n| `g_015` | f_0127–f_0135 | 第 16 题结束；第 17 题（2023 年前三季度 Z 省） |\n| `g_016` | f_0136–f_0144 | 第 17 题（早稻 77/9.6、水果 530/3.7、猪牛 88/9.6、水产 386/6.2） |\n| `g_017` | f_0145–f_0153 | 第 17 题（选 D）；第 18 题材料表（G 省进口商品）出现 |\n| `g_018` | f_0154–f_0162 | 第 18 题（单价跌幅比较，选 C） |\n| `g_019` | f_0163–f_0171 | 第 18 题收尾；第 19 题（市政设施投资 / 到位资金） |\n| `g_020` | f_0172–f_0180 | 第 19 题（2.67/2.66 = 1.005 → 补 10% → 1.1，选 A）；第 20 题（快递异地 / 同城） |\n| `g_021` | f_0181–f_0186 | 第 20 题（700/150 = 14/3 = 4.67，选 C）；第 21 题（G 市地区生产总值表，本集结束） |\n\n> 换算规则：第 m 张网格 `g_{m:03d}.jpg` 的第 k 格（左→右、上→下）= `frames\\f_{9*(m-1)+k:04d}.jpg`。\n\n### 1.2 本集题目速览\n\n| 题号 | 材料主题 | 题型 | 答案 |\n|---|---|---|---|\n| 第 10 题（对照回顾） | 2016 年该市本级主要预算支出项目 | 增量倍数 | **B** |\n| 第 11 题 | 2021 年上半年 S 市社会消费品零售额 | 增量倍数（增量比） | **C** |\n| 第 12 题 | 2023 年一季度全国居民收支（问 2022 年一季度） | 基期比 | **C** |\n| 第 13 题 | 2021 年 B 市城市客运总量 | 基期差 | **B** |\n| 第 14 题 | 2021 年 1-9 月我国机床工具进出口 | 基期差（顺逆差判断） | **A** |\n| 第 15 题 | 2019 年一季度邮政寄递服务收入 | 基期差（一季度 − 3 月） | **B** |\n| 第 16 题 | 2020 年电子商务四类指标 | 增量最大比较 | **A** |\n| 第 17 题 | 2023 年前三季度 Z 省主要产品产量 | 增量最大比较 | **D** |\n| 第 18 题 | 2020 年 G 省进口商品单价 | 平均数增量比较 | **C** |\n| 第 19 题 | 2022 年市政设施投资与到位资金（问 2021 年末） | 基期比 | **A** |\n| 第 20 题 | 2020 年全国快递（问 2019 年） | 基期比 | **C** |\n| 第 21 题 | 2019 年 G 市地区生产总值 | 基期差 | 本集未讲完，续 P18 |\n\n> ⭐ 本集是「作业解析集」，共 **11 道正题（第 11～21 题）**＋ 1 道对照回顾题（第 10 题），一题不落全部覆盖。\n\n---\n\n## 二、核心方法\n\n### 2.1 一句话总纲\n\n```\n凡是\"两个量相除 / 相减\"的比较问题，\n先看现期（限期）比，再看增速比，\n谁增速低就给谁\"补\"，补完再定答案。\n```\n\n### 2.2 五大套路速查\n\n| 编号 | 场景 | 公式（写成代码形式） |\n|---|---|---|\n| ① | 已知现期比、求基期比 | `基期比 = 现期比 × (1 + r_分母) / (1 + r_分子)`，即给**增速低**的一方补 |\n| ② | 已知现期比、求增量比 | `增量比 ≈ 现期比 ÷ 增速比 × (1 + r_分母) / (1 + r_分子)` |\n| ③ | 求基期差（两量之差） | `基期差 = 现期差 − Δ_被减数 + Δ_减数`（先减再加） |\n| ④ | 求基期差（拉平增长率法） | 把增速低的一方\"拉平\"到高的一方，做差后再统一除 `(1 + r_高)` |\n| ⑤ | 比较某量的增量谁最大 | 比较 `现期倍数` 与 `增速倍数`；若 `现期倍数 > 增速倍数`，则**现期大的一方增量大** |\n\n### 2.3 老师本集反复强调的两条铁律\n\n> **补，永远是给增速低的那一方补。**\n>\n> **比较增量时：如果它现期大、增速也大，那就\"大大的大了\"，不用比；**\n> **正因为\"现期大但增速小\"，才需要去比这个倍数关系。**\n\n> 什么时候会打破\"现期大就增量大\"？老师补充：\n> 「除非某种特殊情况，增速是负的时候……比如 37 和 −4.5、5000 和 −22，这个时候就特殊一点。\n> 虽然它的现期大，但你要补给增速低的补，这时候你就会给 −22 那一组去补，不会给 37 这一组补。\n> 一般来说，遇到很少很少有题目会问这种增速小于零的减少量最大。\n> 但只要你记牢一个原则：**补这个东西、补这个增长率，永远是给增速低的补**，就不会出错了。」\n\n---\n\n## 三、例题精讲\n\n### 第 10 题（对照回顾）｜2016 年该市本级主要预算支出\n\n> 说明：本题已在 P16（上）讲过，本集 **f_0015～f_0019（约 120 s～152 s）** 画面再次出现该题（已带完整板书与答案标记），\n> 老师此时口述的是「**这两个题**」的对比总结（见下方【老师原话】），本题内容据画面完整抄录。\n\n**【题干原文】**\n\n> 10.2016 年该市教育支出同比增量约是医疗卫生的多少倍？\n>\n> A.4　　B.7　　C.10　　D.14\n\n**【材料数据】** 表 2　2016 年该市本级主要预算支出项目完成情况\n\n| 支出项目 | 支出金额（亿元） | 同比增速（%） |\n|---|---|---|\n| 一般公共服务 | 6.37 | 31.0 |\n| 公共安全 | 4.77 | 37.3 |\n| **教育** | **6.03** | **51.7** |\n| 科学技术 | 1.11 | 181.0 |\n| 文化体育与传媒 | 1.29 | 35.8 |\n| 社会保障和就业 | 2.63 | 26.7 |\n| **医疗卫生** | **2.28** | **14.4** |\n| 节能环保 | 6.68 | 567.0 |\n| 城乡社区事务 | 2.57 | 48.7 |\n| 农林水事务 | 4.02 | 34.5 |\n| 交通运输 | 2.58 | 10.8 |\n| 资源勘探电力信息等事务 | 4.70 | 67.8 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 增长量倍数比较（增量比） |\n| 定位数据 | 教育 6.03 亿元 / 51.7%；医疗卫生 2.28 亿元 / 14.4% |\n| 列式 | `增量比 = 教育增量 ÷ 医疗卫生增量` |\n| 速算步骤 | 51.7% ≈ 1/2 → 现期 3 份 → `Δ教育 = 6.03 ÷ 3 ≈ 2.0`；14.4% ≈ 1/7 → 现期 8 份 → `Δ医疗卫生 = 2.28 ÷ 8 ≈ 0.3`（板书写作 `Δ = 2.28/8 = 0.3`） |\n| 结论 | `2.0 ÷ 0.3 ≈ 6.7 ≈ 7` → 选 B |\n\n代码块版速算：\n\n```\n教育：   51.7% ≈ 1/2   → 现期 3 份 → Δ = 6.03 ÷ 3 = 2.0\n医疗卫生：14.4% ≈ 1/7   → 现期 8 份 → Δ = 2.28 ÷ 8 = 0.3\n增量比 = 2.0 ÷ 0.3 ≈ 6.7 → 7\n```\n\n**【选项原文】** A.4　　B.7　　C.10　　D.14\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- B 正确：两个增量一算，`2.0 / 0.3 ≈ 6.7`，四舍五入就是 7。\n- A（4）、C（10）、D（14）均与实算量级不符，为干扰项。\n- 陷阱类型：**概念陷阱**——问的是「**同比增量**约是……的多少倍」，不是「现期值」的倍数，若直接拿 6.03 ÷ 2.28 ≈ 2.6 去凑选项就全错。\n- 该题与第 11 题同属「**两个增速差距比较大**」的类型（本题增速差 51.7% − 14.4% = 37.3 个百分点；第 11 题增速差 54.0% − 28.4% = 25.6 个百分点）。\n\n**【老师原话（本集 f_0015–f_0019 期间的总结）】**\n\n> 「**这两个题**可能你会感觉好像第一种方式你平常用的不太熟，在这个情况下好像对比起来也没有太大的优势，可能会有点让你不太想去念（练）这个方法，**但是还是要念（练）的**。\n> 因为**这两个题都属于是增速差距比较大的时候，就会导致那个限期比跟增速比带来的误差相对大一点，需要补**。\n> 但是很多有其他的题目，有的它增速差距并没有那么大。比如说百分之十、百分之五，那它的增速的倍数就相对还是比较好估出来的，而且误差又比较小。\n> 这个时候那种方法就会比较快一点。」\n\n---\n\n### 第 11 题｜2021 年上半年 S 市社会消费品零售额\n\n**【题干原文】**\n\n> 11.2021 年上半年，全市社会消费品零售总额 9048.44 亿元，比去年同期增加了 2104.14 亿元。分行业看，批发和零售业零售额 8287.13 亿元，同比增长 28.4%；住宿和餐饮业零售额 761.31 亿元，同比增长 54.0%。\n>\n> 2021 年上半年，S 市批发和零售业零售额同比增量约是住宿和餐饮业的多少倍？\n>\n> A.3　　B.5　　C.7　　D.9\n\n**【材料数据】**\n\n| 项目 | 数值 | 同比增长 |\n|---|---|---|\n| 全市社会消费品零售总额 | 9048.44 亿元 | 比去年同期增加 2104.14 亿元 |\n| 批发和零售业零售额（分子） | 8287.13 亿元 | 28.4% |\n| 住宿和餐饮业零售额（分母） | 761.31 亿元 | 54.0% |\n\n> 说明：`8287.13 + 761.31 = 9048.44`，与总额完全吻合，可交叉验证数据无误。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 增长量倍数比较（增量比），两个增速差距大 → 需要补 |\n| 定位数据 | 分子 = 批发和零售业 8287.13（28.4%）；分母 = 住宿和餐饮业 761.31（54.0%） |\n| 列式 | `增量比 = 现期比 ÷ 增速比 × 补正系数`，补正系数 = `(1 + r_分) / (1 + r_母)` |\n| 速算步骤（方式一：限期比 ÷ 增速比 + 补） | 现期比 ≈ `8287 ÷ 761 ≈ 11`；增速比 = `54.0% ÷ 28.4% ≈ 1.9 ≈ 2`；`11 ÷ 2 = 5.5`；再给**增速低的分子（批发零售）**补，乘 `(1+54.0%)/(1+28.4%) = 1.54/1.284 ≈ 1.2`；`5.5 × 1.2 = 6.6` → 6.6 四舍五入取 7 |\n| 速算步骤（方式二：份数法算增量） | 28.4% ≈ 2/7 → 7 份基期 + 2 份增量 = 9 份现期 → `Δ分子 = 8287.13 × 2/9 ≈ 1800`；54.0% ≈ 1/2 → 2 份基期 + 1 份增量 = 3 份现期 → `Δ分母 = 761.31 ÷ 3 ≈ 270`；`1800 ÷ 270 = 6.67` |\n| 结论 | ≈ 6.7 → 选 C（7） |\n\n代码块版速算：\n\n```\n【方式一】限期比 ÷ 增速比，再补\n  现期比 = 8287.13 ÷ 761.31 ≈ 11\n  增速比 = 54.0% ÷ 28.4% ≈ 1.9 ≈ 2\n  增量比 ≈ 11 ÷ 2 = 5.5\n  补（给增速低的批发零售补）：\n      5.5 × (1 + 54.0%) / (1 + 28.4%)\n    = 5.5 × 1.54 ÷ 1.284\n    ≈ 5.5 × 1.2 = 6.6  → 7\n\n【方式二】份数法直接算两个增量\n  批发零售：28.4% ≈ 2/7  → 9 份现期，增量占 2 份\n      Δ = 8287.13 × 2/9 ≈ 1800\n  住宿餐饮：54.0% ≈ 1/2  → 3 份现期，增量占 1 份\n      Δ = 761.31 ÷ 3，把 761 上调到 810 更好算 → 810 ÷ 3 = 270\n      （为什么上调：把 54.0% 降到 50% 看，现期就该相应往上抬一点）\n  增量比 = 1800 ÷ 270 = 180 ÷ 27 = 6.67 ≈ 7\n```\n\n**【选项原文】** A.3　　B.5　　C.7　　D.9\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- C 正确：两种算法的结论一致，`6.6 / 6.67` 都落到 7。\n- **B（5）是最典型的陷阱**：它正是「现期比 ÷ 增速比」**没补**的那一步结果 `11 ÷ 2 = 5.5`。老师原话：「这两个题都属于是增速差距比较大的时候，就会导致那个限期比跟增速比带来的误差相对大一点，**需要补**。」\n- A（3）、D（9）与实算量级不符。\n- 陷阱类型：**补正漏项（概念陷阱）**——增速差 25.6 个百分点属于「差距比较大」，必须补，不补就会掉进 5.5 这个坑。\n- 补的方向：**给增速低的一方（批发和零售业 28.4%）补**，因为它的增速低。\n\n**【老师原话】**\n\n> 「给谁补呢？**就要给分子去补了**。因为分子的增速低……就是我们这个十一倍的这个主体八千二这个主体，分子这个批发跟零售业，给批发跟零售业去补。\n> 所以你要是用它去乘以一加大概百分之二十附近，那这个一加就会到七这里了，所以选择 C 选项。大概加了 1.16，6.4（6.6）四舍五入变成 7。」\n\n> 「或者就是算增速、算增量，就是把它看作七分之二去算。增速是 2/7，相当于 7 份的机器（基期）加了 2 份，变成 9 份，\n> 那增量就是限期的 2/9，等于 8287 乘以 2/9。8200 除以 9 的话大概是在 900 左右、900 出头，那在这里就是 1800 出头一点。\n> 另外一个增量呢，把它近似的看作二分之一，那就是增量，就是限期除以三，大概就八百除三左右吧，**八百一或者八百都行，八百一好算一点**。\n> 为什么是八百一，不是七百六十一呢？因为我们把五十四降到五十，那这个七百六十一也往上涨几个点。」\n> （故 `Δ = 810 ÷ 3 = 270`）\n\n> 「然后增量比就是 1800 除以 270，这个大概算一下，也能算出来是在 7 倍左右……**二十七分之十八其实就是三分之二，等于六点六六倍**。结果还是一样的。」\n\n---\n\n### 第 12 题｜2023 年一季度全国居民收支\n\n**【题干原文】**\n\n> 12.2022 年一季度城镇居民人均可支配收入是农村居民人均可支配收入的（ ）倍。\n>\n> A.2.78　　B.2.54　　C.2.39　　D.2.35\n\n**【材料数据】** 表　2023 年一季度全国居民收支主要数据（列名：绝对量（元）／同比增长（%））\n\n| 指标 | 绝对量（元） | 同比增长（%） |\n|---|---|---|\n| （一）全国居民人均可支配收入 | 10870 | 5.1 |\n| 　按常住地分：城镇居民 | **14388** | **4.0** |\n| 　　　　　　　农村居民 | **6131** | **6.1** |\n| 　按收入来源分：工资性收入 | 6163 | 5.0 |\n| 　　　　　　　　经营净收入 | 1834 | 5.8 |\n| 　　　　　　　　财产净收入 | 958 | 4.1 |\n| 　　　　　　　　转移净收入 | 1915 | 5.1 |\n| （二）全国居民人均可支配收入中位数 | 8895 | 4.6 |\n| 　按常住地分：城镇居民 | 12175 | 3.9 |\n| 　　　　　　　农村居民 | 4864 | 5.6 |\n| （三）全国居民人均消费支出 | 6738 | 5.4 |\n| 　按常住地分：城镇居民 | 8303 | 4.8 |\n| 　　　　　　　农村居民 | 4629 | 5.5 |\n| 　按消费类别分：食品烟酒 | 2128 | 2.1 |\n| 　　　　　　　　衣着 | 438 | −3.3 |\n| 　　　　　　　　居住 | 1560 | 8.7 |\n| 　　　　　　　　生活用品及服务 | 370 | 3.9 |\n| 　　　　　　　　交通通信 | 824 | 4.1 |\n\n> 本题只需「城镇居民 14388（4.0%）」与「农村居民 6131（6.1%）」两组数。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期比问题（材料给 2023 年一季度，问 2022 年一季度） |\n| 定位数据 | 城镇 14388（+4.0%）；农村 6131（+6.1%） |\n| 列式 | `基期比 = 现期比 × (1 + r_农) / (1 + r_城) = (14388 ÷ 6131) × (1.061 ÷ 1.040)` |\n| 速算步骤 | ① 现期比 = `14388 ÷ 6131 ≈ 2.35`；② 增速差 6.1% − 4.0% = 2.1 个百分点 → 给**增速低的城镇**补约 2%；③ `2.35 × 1.02 ≈ 2.397 ≈ 2.39` |\n| 老师更快的一步法 | 把分母 6131「退 2%」正好凑到 6000，分子 14388 近似 14400 → `14400 ÷ 6000 = 2.4`，看选项最接近 **2.39** |\n| 结论 | 2.39 → 选 C |\n\n代码块版速算：\n\n```\n【主线】先算现期比，再补 2%\n  现期比 = 14388 ÷ 6131 ≈ 2.35   ← 这就是选项 D.2.35（陷阱）\n  补正  = (1 + 6.1%) ÷ (1 + 4.0%) ≈ 1.02\n  基期比 = 2.35 × 1.02 ≈ 2.397 → 2.39\n\n【一步法】先凑整再算\n  6131 退 2% → ≈ 6000\n  14388 ≈ 14400\n  14400 ÷ 6000 = 2.4 → 看选项取 2.39\n\n【先算后补的写法】\n  14388 − 28 = 14360；6131 − 13 = 6118\n  143.6 ÷ 6.118 ≈ 23.5 → 现期比 2.35\n  再把下面（农村）多给的那 2% 收回来 → 2.39\n```\n\n**【选项原文】** A.2.78　　B.2.54　　C.2.39　　D.2.35\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- C 正确：现期比 2.35 补正 2% 后约 2.40，选项中最接近 **2.39**。\n- **D（2.35）是陷阱项**，也正是板书上被框出来、旁边标注「现期」的那个数——它就是**没补正的现期比**。\n- A（2.78）、B（2.54）量级偏大。老师原话：「有的时候这个出题就会在题目里面给你搞一个这样的限期比（现期比），所以说你如果胆子大一点，你看得出来这个是比 2.4 小一点的，因为（2.35）是限期比。我们在这个限期比的基础上，怎么样去给它补了两个点？变成了 2.39 了。」\n- 陷阱类型：**时间陷阱 + 概念陷阱**——问的是 2022 年（基期），材料给的是 2023 年（现期），必须补。\n- 补谁：**给增速低的城镇（4.0%）补**，所以是乘 `1.02`（大于 1），而不是除。\n\n**【老师原话】**\n\n> 「12 题是个机器（基期）比问题……找到这两组数据线（列），城镇跟农村的人均可支配收入。\n> 他们的机（基）期比主要关键点，就是要看你差了两个点。给谁补？在哪儿补？\n> ……要么是给这个分数低的分子去补百分之二，要么是拿下面这个去退百分之二，要么就你算完之后再去整理补百分之二。哪一个方便呢？哪一个能更整呢？\n> 那个分子上补百分之二，没有什么影响，它还是一个三位数……如果是算的话，现在这个数它也不是一个很整数，所以**我会选择给下面这个六千一百三去给它退 2%**……就基本上正好到了 6000。上面的是 14，就在 144 吧。144 稍微（比 143.88）大那么一丢丢，那 144 除以 6 → 2.4，所以选择 C 2.39。稍微有那么 0.01 的误差，就是因为我们把 143.88 写成了 144。」\n\n> 「或者如果你非要说我非想先算再补也是可以的。你把上面这个应该减了十三，上面这个大概两倍多，减个 26 到减 28……然后先算一下 143.6 ÷ 6.118 ≈ 2.35，这个 2.35 正好就是现期比。」\n\n---\n\n### 第 13 题｜2021 年 B 市城市客运总量\n\n**【题干原文】**\n\n> 13.2021 年 B 市全市城市客运总量为 55.8 亿人次，同比增长 29.9%。其中公共汽电车客运量为 23 亿人次，同比增长 25.8%；轨道交通客运量为 30.7 亿人次，同比增长 33.7%；巡游出租汽车客运量为 2.1 亿人次，同比增长 23.1%。\n>\n> 2020 年 B 市全市轨道交通客运量比公共汽电车多（ ）。\n>\n> A.不到 3 亿人次\n> B.3～6 亿人次之间\n> C.6～9 亿人次之间\n> D.超过 9 亿人次\n\n> 数据自检：`23 + 30.7 + 2.1 = 55.8`，与「全市城市客运总量 55.8 亿人次」完全吻合。\n\n**【材料数据】**\n\n| 出行方式 | 2021 年客运量（亿人次） | 同比增长（%） |\n|---|---|---|\n| **城市客运总量** | **55.8** | **29.9** |\n| 公共汽电车（减数） | 23 | 25.8 |\n| 轨道交通（被减数） | 30.7 | 33.7 |\n| 巡游出租汽车 | 2.1 | 23.1 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期差问题（2021 年为现期，问 2020 年两量之差） |\n| 定位数据 | 轨道交通 30.7（33.7%）、公共汽电车 23（25.8%） |\n| 列式（方式一） | `基期差 = 现期差 − Δ₁ + Δ₂`（先减再加） |\n| 列式（方式二） | 拉平增长率：把公共汽电车拉平到轨道增速，再做差，最后除以 `(1 + 33.7%)` |\n| 速算步骤（方式一） | 现期差 = `30.7 − 23 = 7.7`；轨道增量：33.7% ≈ 1/3 → `Δ₁ = 30.7 ÷ 4 ≈ 7.7`；汽电车增量：25.8% ≈ 1/4 → `Δ₂ = 23 ÷ 5 = 4.6`（用 `23 × 1/5`）；`7.7 − 7.7 + 4.6 = 4.6` |\n| 速算步骤（方式二） | 增速差 `33.7 − 25.8 = 8.8`，`8.8 ÷ 1.25 ≈ 7` → 约补 6 个点，`23 × (1+6%) ≈ 24.4`，取 24.5；`30.7 − 24.5 = 6.2`；`6.2 ÷ 1.337 = 6.2 − 1.5 = 4.7` |\n| 结论 | 4.6 亿人次 → 落在 3～6 亿人次之间 → 选 B |\n\n代码块版速算：\n\n```\n【方式一】基期差 = 现期差 − Δ₁ + Δ₂\n  现期差 = 30.7 − 23 = 7.7\n  轨道交通增量：33.7% ≈ 1/3 → Δ₁ = 30.7 ÷ 4 ≈ 7.7\n  汽电车增量：  25.8% ≈ 1/4 → Δ₂ = 23 ÷ 5 = 4.6\n  基期差 = 7.7 − 7.7 + 4.6 = 4.6  → 3～6 之间\n\n【方式二】拉平增长率\n  增速差 33.7% − 25.8% = 8.8 个百分点\n  8.8 ÷ 1.25 ≈ 7 → 给公共汽电车补约 6 个点\n  23 × (1 + 6%) ≈ 24.4，取整 24.5\n  30.7 − 24.5 = 6.2      ← 注意这不是基期差\n  6.2 ÷ (1 + 33.7%) = 6.2 ÷ 1.337\n     33.7% ≈ 1/3，除以 4/3 等价于减掉自身的 1/4\n     = 6.2 − 1.5 = 4.7\n```\n\n**【选项原文】** A.不到 3 亿人次　B.3～6 亿人次之间　C.6～9 亿人次之间　D.超过 9 亿人次\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- B 正确：两种方法分别得 4.6 与 4.7，都稳定落在「3～6 亿人次之间」。\n- **D（超过 9 亿人次）是陷阱项**：对应的正是 `基期差` 算错方向——若把被减数的增量当成「加」、把减数的增量当成「减」（符号搞反），`7.7 + 7.7 − 4.6 = 10.8`，就会误选 D。\n- C（6～9 亿）对应的是**拉平后但还没除以 (1+33.7%) 的 6.2**，属「拉平最后一步漏除」的陷阱。\n- A（不到 3 亿）与实算不符。\n- 陷阱类型：**符号陷阱 + 单位陷阱（亿人次）**。\n\n**【老师原话】**\n\n> 「13.（20）20 年，就是机（基）期交通、轨道交通的客运量比公共汽电车多多少，这是个机（基）期差问题……\n> 算这个机（基）期差呢，主要是两种方式，一种是**先减再加**，就是 `机期差 = 限期差，先减，再加`；\n> 或者是把那个限期拉平了之后做差……**拉平增长率**。\n> 就一种是看增量，如果增量好估，就用上面这种方式；如果增量相对不那么好估，但是拉平很好拉，就用下面这个方式。」\n\n> 「那上面这个题目呢，增量是比较好估的，25%、33.7%，这个四分之一、三分之一，**我不去估它的增量，我都有点不好意思了**，所以我们可以用上面这个。」\n\n> 「（方式二）……然后做差 30.7 减 24.5 是 6.2。**这个不是机器（基期）差啊，机器差的话还要在它的基础上再除一个 1.337。**\n> 那除一点三三七怎么处理呢？你可以把它想成一加上百分之三十三嘛，相当于一个限期是 6.2 的东西，要在增速 33% 的基础上去算它的基期，\n> 那就是可以用份数法去调整，等于 6.2 减掉它的四分之一，因为它的增速是三分之一。减掉了四分之一，减掉 1.5 变成 4.7，结果是一样的。」\n\n---\n\n### 第 14 题｜2021 年 1-9 月我国机床工具进出口\n\n**【题干原文】**\n\n> 14.2021 年 1—9 月，我国机床工具进出口总额 242.6 亿美元，同比增长 32.8%。其中，机床工具商品进口 105.2 亿美元，同比增长 23.7%；出口 137.4 亿美元，同比增长 40.8%。\n>\n> 2020 年 1—9 月，我国机床工具贸易状况为：\n>\n> A.顺差 10 亿美元以上\n> B.顺差不到 10 亿美元\n> C.逆差 10 亿美元以上\n> D.逆差不到 10 亿美元\n\n**【材料数据】**\n\n| 项目 | 2021 年 1-9 月（亿美元） | 同比增长（%） |\n|---|---|---|\n| 机床工具进出口总额 | 242.6 | 32.8 |\n| 　其中：进口 | 105.2 | 23.7 |\n| 　　　　出口 | 137.4 | 40.8 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期差（判断顺差 / 逆差及其规模） |\n| 定位数据 | 出口 137.4（40.8%）、进口 105.2（23.7%） |\n| 列式（方式一） | 先按现期判方向：`137.4 > 105.2` → 出口大 → 现期是**顺差**；`基期差 = 现期差 − Δ_出口 + Δ_进口` |\n| 列式（方式二） | 拉平增长率：把进口拉平到出口的 40.8% 水平，做差后再除 `(1 + 40.8%)` |\n| 速算步骤（方式一） | 现期差 = `137.4 − 105.2 = 32.2`；出口增量：`137.4 × 40.8% ÷ 1.408 = 137.4 × 2/7 ≈ 40`（把 137.4 ≈ 140，`140 ÷ 7 × 2 = 40`）；进口增量：23.7% ≈ 1/4 → `105.2 ÷ 5 ≈ 20`；`32.2 − 40 + 20 = 12.2` |\n| 速算步骤（方式二） | 增速差 `40.8 − 23.7 = 17`，`17 ÷ 1.23 ≈ 14` → 给进口补约 14% → `105.2 × 1.14 ≈ 120`；`137 − 120 = 17`；`17 ÷ 1.4 ≈ 12` |\n| 结论 | 顺差约 12 亿美元，**大于 10 亿美元** → 选 A |\n\n代码块版速算：\n\n```\n【方式一】先减再加\n  现期差 = 137.4 − 105.2 = 32.2 （出口大 → 顺差方向）\n  出口增量：40.8% ≈ 2/5 → Δ = 现期 × 2/7\n      把 137.4 看成 140（分母 40.8 看成 5/20 变小，\n      对应限期要变大一点才好算）\n      140 ÷ 7 × 2 = 40\n  进口增量：23.7% ≈ 1/4 → Δ = 105.2 ÷ 5\n      把 105.2 看成 100（放大），结果 ÷5 = 20\n  基期差 = 32.2 − 40 + 20 = 32.2 − 20 = 12.2  → 顺差 12.2 亿\n\n【方式二】拉平增长率\n  增速差 = 40.8% − 23.7% = 17 个百分点\n  17 ÷ 1.23 ≈ 14 → 给进口（增速低的一方）补约 14%\n  105.2 × 1.14 ≈ 120       （不用算得特别准）\n  137 − 120 = 17\n  17 ÷ (1 + 40.8%) = 17 ÷ 1.4 ≈ 12 > 10  → 顺差 10 亿美元以上\n```\n\n**【选项原文】** A.顺差 10 亿美元以上　B.顺差不到 10 亿美元　C.逆差 10 亿美元以上　D.逆差不到 10 亿美元\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- A 正确：现期就是顺差（出口 137.4 > 进口 105.2），把增量修正后基期差仍为正，且约 12.2 亿美元 > 10 亿美元。\n- **B（顺差不到 10 亿美元）陷阱**：若只做「现期差 32.2 减去出口增量 40」得 `−7.8`，会误以为变成逆差而乱选；正确做法是 `− Δ_出口 + Δ_进口`，**减数（进口）的增量要加回来**。\n- C、D 的「逆差」方向错误：基期差为正（12.2），仍是顺差。\n- 陷阱类型：**符号陷阱（顺逆差方向）**。判方向口诀——「机器（基期）的时候，出口大于进口就是顺差，进口大于出口就是逆差」。\n- 老师补充的方法优势：「很多时候你去算到这样的一个东西，去除以这个一加高的这个增速的时候，**结合选项，你不需要把它具体多少算出来，也能看出来该选哪个**。」\n\n**【老师原话】**\n\n> 「第 14 题。也是一个继续（基期）差问题。贸易状况是顺差还是逆差，就看出口进口谁高、高多少。**只要（看）机器（基期）的时候，出口大于进口就是顺差，如果是进口大于出口，那就是逆差。**」\n\n> 「那用哪一种方式呢？二十三点七还是比较好估增量的，但这个百分之四十吧，估增量吧，有点烦，能把它看到五分之二，但是五分之二这个数据它并不是一个非常快（捷）能算资料的方式……那我都试一下吧，都给你们来搞一下吧。」\n\n> 「为什么是 14 呢？因为 40.8，我把它想成了 5/20 变小，那左边这个叫限期就要变大，那除以（分母）是不是要除以 7 变大一点，那就到 14，既整又好算。14 除 7 正好是 2，20 乘以 2 是 40。」\n\n---\n\n### 第 15 题｜2019 年一季度邮政寄递服务收入\n\n**【题干原文】**\n\n> 15.2018 年 1～2 月，我国邮政寄递服务的收入约为多少亿元？\n>\n> A.44　　B.65　　C.82　　D.103\n\n**【材料数据】** 表　2019 年一季度邮政行业业务状况及同比增速\n\n| 指标 | 一季度·数量 | 一季度·增速（%） | 3 月·数量 | 3 月·增速（%） |\n|---|---|---|---|---|\n| 邮政行业业务收入（亿元） | 2173.9 | 19.5 | 799.1 | 19.4 |\n| 　其中：**邮政寄递服务（亿元）** | **110.4** | **7.4** | **37.1** | **−1.6** |\n| 　　　　快递业务（亿元） | 1543.0 | 21.4 | 596.0 | 23.0 |\n| 邮政行业业务总量 | — | — | — | — |\n| 邮政寄递服务（万件/万份/万笔） | 601950.3 | 1.3 | 212252.2 | 0.4 |\n| 　其中：函件（万件） | 62454.9 | −20.3 | 23056.1 | −21.3 |\n| 　　　　包裹（万件） | 588.1 | −12.3 | 188.9 | −10.8 |\n| 　　　　订销报纸（万份） | 419883.0 | −2.5 | 148143.5 | −1.7 |\n| 　　　　订销杂志（万份） | 20005.9 | −4.5 | 6980.0 | −4.9 |\n| 　　　　汇兑（万笔） | 498.9 | −32.3 | 157.1 | −32.1 |\n| 快递业务（万件） | 1214633.0 | 22.5 | 486392.8 | 23.3 |\n| 　其中：同城（万件） | 235701.3 | −0.2 | 90111.2 | 1.2 |\n| 　　　　异地（万件） | 949709.7 | 30.3 | 384996.5 | 30.6 |\n| 　　　　国际/港澳台（万件） | 29222.0 | 8.9 | 11285.2 | 7.5 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期差问题（材料只给一季度和 3 月，1～2 月要「一季度 − 3 月」） |\n| 定位数据 | 邮政寄递服务收入：一季度 110.4 亿元（+7.4%）；3 月 37.1 亿元（−1.6%） |\n| 列式 | `2018 年 1-2 月 = 2018 年一季度 − 2018 年 3 月 = 110.4 ÷ 1.074 − 37.1 ÷ 0.984` |\n| 速算步骤（拉平增长率法） | 把增速低的 3 月（−1.6%）拉平到一季度的 7.4%：增速差 `7.4 − (−1.6) = 9` 个百分点，还要再除掉 `(1 − 1.6%)` 略放大一点 → 约补 10% → `37.1 × 1.10 ≈ 40`；`110.4 − 40 ≈ 70`；`70 ÷ 1.074 ≈ 65` |\n| 结论 | 约 65 亿元 → 选 B |\n\n代码块版速算：\n\n```\n【拉平增长率】\n  一季度：110.4 亿元，增速 +7.4%\n  3 月  ：37.1  亿元，增速 −1.6%\n  增速差 = 7.4% − (−1.6%) = 9 个百分点，\n  因为还要再除以 (1 − 1.6%) 会放大一点点 → 补约 10%\n  37.1 × 1.10 ≈ 40\n  110.4 − 40 ≈ 70        ← 拉平后的 2019 年 1-2 月口径\n  70 ÷ (1 + 7.4%) ≈ 65   ← 再退成 2018 年基期\n```\n\n**【选项原文】** A.44　　B.65　　C.82　　D.103\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- B 正确：`110.4/1.074 − 37.1/0.984 = 102.8 − 37.7 ≈ 65.1`。\n- **D（103）是陷阱项**：`110.4 ÷ 1.074 ≈ 102.8`，正是「**只算了 2018 年一季度、忘了减去 3 月**」的结果，属**时间陷阱**（题目问的是 1～2 月，不是一季度）。\n- C（82）方向不对（把 1-2 月当成用别的口径算）。\n- A（44）与实算量级不符。\n- 陷阱类型：**时间陷阱（一季度 vs 1-2 月）+ 负增长率陷阱（3 月是 −1.6%，要除以小于 1 的数）**。\n- 老师提醒：这题「负百分之一点六乘这个什么三十七，你又划出一层也没有那么特别好算」，所以**改用拉平增长率**更快。\n\n**【老师原话】**\n\n> 「15 题：18 年 1-2 月的邮政寄递服务的收入是多少？那限期（材料）是 19 年……而且他给的数据，一个是一季度的数据，一个是 3 月份的数据，**他没有给 1-2 月份。那 1-2 月份怎么算呢？1-2 月份就要拿 1-3 月份的，把 3 月份的给它减掉就好了，这就是个基期差问题。**」\n\n> 「（拉平）给增速低的这个 37.1 补上它差的这个增长率，差了大概 10 个百分点……那我就算给你补 10 个点不到，那 37 补 10 个点不到，给它加个百分之十不到，就是不到差了一点，正好基本上算四十。\n> 那一百一减四十，减掉这个拉平之后的这个量，剩七十，再除以一加上百分之七点四，那你看七十除以一加百分之七点四，不就是六十五吗？」\n\n> 「所以这种方法如果熟练了以后，**在这种增速相对比较靠近、比较好估、比较好去拉平的时候，特别顺、特别快**，直接就（在）我的脑海中就是一个 1.1（一加百分之十）……不用动它 37，要往上稍微补一点，那就算你减 43、17 变成 40 之后，111 减 40 = 70，再除一点点变成 B（65），非常快。」\n\n---\n\n### 第 16 题｜2020 年电子商务四类指标\n\n**【题干原文】**\n\n> 16.2020 年，全国电子商务交易额达 37.21 万亿元，同比增长 4.5%。其中，商品类电商交易额 27.95 万亿元，服务业电商交易额 8.08 万亿元，合约类电商交易额 1.18 万亿元。\n>\n> 全国网络零售额达 11.76 万亿元，同比增长 10.9%。其中，实物商品网络零售额达 9.76 万亿元，同比增长 14.8%。分地区情况来看，东部、中部、西部和东北地区网络零售额占全国比重分别为 84.54%、8.37%、5.68%、1.41%，除中部地区外其余地区占比均同比提高。\n>\n> 农村网络零售额达 1.79 万亿元，同比增长 8.9%。农产品网络零售额达 4158.9 亿元，同比增长 26.2%。分品类看，零售额排在前三位的品类分别是休闲食品、粮油和滋补食品，分别占农产品网络零售额的 19.8%、14.6% 和 11.3%。\n>\n> 跨境电商进出口总额达 1.69 万亿元，同比增长 31.3%。其中，出口商品总额达 1.12 万亿元，同比增长 40.1%。\n>\n> 电子商务服务业营收规模达 5.45 万亿元，同比增长 21.9%。其中，电子商务交易平台服务营收规模达 1.15 万亿元，同比增加 0.31 万亿元。\n>\n> 2020 年，以下各类型中同比增长最多的是（ ）。\n>\n> A.全国电子商务交易额\n> B.农村网络零售额\n> C.跨境电商进出口总额\n> D.电子商务服务业营收规模\n\n**【材料数据】**\n\n| 选项 | 指标 | 2020 年数值 | 同比增长 |\n|---|---|---|---|\n| A | 全国电子商务交易额 | 37.21 万亿元 | 4.5% |\n| B | 农村网络零售额 | 1.79 万亿元 | 8.9% |\n| C | 跨境电商进出口总额 | 1.69 万亿元 | 31.3% |\n| D | 电子商务服务业营收规模 | 5.45 万亿元 | 21.9% |\n\n（其他参考数据：商品类电商交易额 27.95 万亿元；服务业电商交易额 8.08 万亿元；合约类电商交易额 1.18 万亿元；全国网络零售额 11.76 万亿元＋10.9%；实物商品网络零售额 9.76 万亿元＋14.8%；农产品网络零售额 4158.9 亿元＋26.2%；出口商品总额 1.12 万亿元＋40.1%；电商交易平台服务营收 1.15 万亿元。）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「谁的同比增长量最多」——增量大小比较 |\n| 定位数据 | 见上表 A/B/C/D 四组「现期值 + 增速」 |\n| 列式 | 不要硬算四个增量，改为比较 `现期倍数` 与 `增速倍数`。增量比 ≈ `现期比 ÷ 增速比`，并给**增速低**的一方补 |\n| 速算步骤 | ① A vs B：现期比 `37.21 ÷ 1.79 ≈ 20.8` 倍，增速比 `8.9 ÷ 4.5 ≈ 1.98` 倍 → **B 淘汰**；② A vs C：现期比 `37.21 ÷ 1.69 ≈ 22` 倍，增速比 `31.3 ÷ 4.5 ≈ 7` 倍 → **C 淘汰**；③ A vs D：现期比 `37.21 ÷ 5.45 ≈ 6.8` 倍，增速比 `21.9 ÷ 4.5 ≈ 4.9` 倍 → **D 淘汰** |\n| 结论 | 三组都是「现期倍数 > 增速倍数」→ 现期大的 A 增量最大 → 选 A |\n\n代码块版速算：\n\n```\n【比较表】现期倍数 vs 增速倍数\n       现期      增速      现期比       增速比      判定\nA  37.21 万   4.5%       —           —          —\nB   1.79 万   8.9%    37.21/1.79    8.9/4.5     20.8 > 1.98 → B 淘汰\n                       ≈ 20.8        ≈ 1.98\nC   1.69 万   31.3%   37.21/1.69    31.3/4.5    22  > 7     → C 淘汰\n                       ≈ 22          ≈ 7\nD   5.45 万   21.9%   37.21/5.45    21.9/4.5    6.8 > 4.9   → D 淘汰\n                       ≈ 6.8         ≈ 4.9\n结论：A 全国电子商务交易额增量最大\n```\n\n**【选项原文】** A.全国电子商务交易额　B.农村网络零售额　C.跨境电商进出口总额　D.电子商务服务业营收规模\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- A 正确：三组两两比较，A 的「现期倍数」始终大于「增速倍数」，因此 A 的增量最大。\n- B 淘汰：农村增速虽高于 A，但**很有限**——`8.9% 只有 4.5% 的两倍`，而现期 `37.21 却是 1.79 的好几十倍`。\n- C 淘汰：`31.3 是 4.5 的六七倍到七八倍`，而 `37.21 是 1.69 的二十多倍`。\n- D 淘汰：`37.21 是 5.45 的七倍左右`，而 `21.9% 只有 4.5% 的五倍`。\n- 陷阱类型：**范围陷阱**（材料里数字很多，要抓准四个选项对应的那四个指标）+ **概念陷阱**（问「同比增长**量**最多」，不是「增长**率**最多」；若只看增速会误选 C 的 31.3%）。\n\n**【老师原话】**\n\n> 「第 16 题。比较一下这四个谁的增量最多，先把这四个数据找出来：电子商务交易额在这儿，农村网络零售额……农村网络零售的话是在这儿，然后再是跨境电商进出口总额，还有电子商务服务营收规模。底下这四个现（在）增量最大。」\n\n> 「那增量最大，先看看基本的有没有什么**大则大、小则小**的那种能排掉的……就是暂时看是没有那种明显的现期最大、增速也最大的，所以一下子排是排不掉的。\n> 那我们就一个个去比……有没有其他哪一个增速的优势，能把它的限期的优势给它对冲掉的？」\n\n> 「所以一般你在比较这个的时候，都是因为**它限期大，但是它增速小**，你才会去跟人家去这样去比这个倍数关系。\n> 而**我们补都是要给增速低的去补的，所以只要它的限期比增速比高，那肯定是限期大的那个增量大**。\n> 而且补也都是给这个限期大的，不（对），因为限期大的，它的增速低，增速低你才要给他补的嘛。\n> 如果它限期大、增速还大，那也还都没什么好比的，那就**大大的大了**。」\n\n---\n\n### 第 17 题｜2023 年前三季度 Z 省主要产品产量\n\n**【题干原文】**\n\n> 17.2023 年前三季度，Z 省生产总值 59182 亿元，按不变价格计算，同比增长 6.3%。农林牧渔业增加值同比增长 4.0%。早稻产量 76.9 万吨，增长 9.6%；水果产量 530 万吨，增长 3.7%；猪牛羊禽肉类产量 88.3 万吨，增长 9.6%；牛奶产量增长 6.2%；禽蛋产量增长 14.9%；生猪出栏 687.6 万头，增长 9.9%；水产品产量 386.1 万吨，增长 6.2%。\n>\n> 2023 年前三季度，Z 省的下列产业产量同比增长量最多的是（ ）。\n>\n> A.早稻\n> B.水果\n> C.猪牛羊禽肉类\n> D.水产品\n\n**【材料数据】**\n\n| 选项 | 指标 | 2023 年前三季度产量 | 同比增长 |\n|---|---|---|---|\n| A | 早稻 | 76.9 万吨 | 9.6% |\n| B | 水果 | 530 万吨 | 3.7% |\n| C | 猪牛羊禽肉类 | 88.3 万吨 | 9.6% |\n| D | 水产品 | 386.1 万吨 | 6.2% |\n\n（其他参考数据：Z 省生产总值 59182 亿元＋6.3%；农林牧渔业增加值＋4.0%；牛奶产量＋6.2%；禽蛋产量＋14.9%；生猪出栏 687.6 万头＋9.9%。）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「谁的同比增长量最多」——增量大小比较 |\n| 定位数据 | 早稻 76.9/9.6%；水果 530/3.7%；猪牛羊禽肉 88.3/9.6%；水产品 386.1/6.2% |\n| 列式 | 比较 `现期倍数` 与 `增速倍数`；现期倍数 > 增速倍数者增量大。补永远给增速低的一方 |\n| 速算步骤 ① 排除 A | 早稻与猪牛羊禽肉**增速完全相同（都是 9.6%）**，但早稻现期 76.9 \u003c 88.3 → 早稻增量小，**A 淘汰** |\n| 速算步骤 ② 排除 C | 水果 vs 猪牛羊禽肉：现期 `530 ÷ 88.3 ≈ 6.0` 倍，增速 `9.6 ÷ 3.7 ≈ 2.6` 倍（连 3 倍都不到）→ 现期优势太明显，**C 淘汰** |\n| 速算步骤 ③ 比较 B、D | 水果 vs 水产品：增速 `6.2 ÷ 3.7 = 1.68`，**超过 1.5 倍**（3.7 要补 2.5 个点才到 6.2，加了超过自身的一半）；现期 `530 ÷ 386.1 = 1.37`，**不到 1.5 倍**（386 加 144 就到 530，没到一半）。增速优势（>1.5）> 现期优势（\u003c1.5）→ **D 胜** |\n| 结论 | 水产品增量最大 → 选 D |\n\n代码块版速算：\n\n```\n【第一步】排掉早稻（A）\n  早稻  76.9 万吨 / 9.6%\n  猪牛羊 88.3 万吨 / 9.6%   ← 增速相同\n  增速相同则现期大者增量大 → 88.3 > 76.9 → A 淘汰\n\n【第二步】B（水果）vs C（猪牛羊禽肉）\n  现期比 = 530 ÷ 88.3 ≈ 6.0 倍\n  增速比 = 9.6 ÷ 3.7 ≈ 2.6 倍  （连三倍都不到）\n  现期优势压倒增速优势 → C 淘汰\n\n【第三步】B（水果）vs D（水产品）\n  增速比（D/B）= 6.2 ÷ 3.7 = 1.68   > 1.5\n      3.7 要涨到 6.2 需加 2.5，超过自身一半 → 超过一点五倍\n  现期比（B/D）= 530 ÷ 386.1 = 1.37  \u003c 1.5\n      386 要涨到 530 只需加 144，没到自身一半 → 小于一点五倍\n  两边跟 1.5 的距离都还比较明显，不贴边；\n  且两者增速差只有两三个点，补也于事无补\n  → 增速高的 D（水产品）增量最大\n```\n\n**【选项原文】** A.早稻　B.水果　C.猪牛羊禽肉类　D.水产品\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- D 正确：水产品的「增速倍数 1.68」超过了它与水果的「现期倍数 1.37」，增速优势胜出。\n- A 淘汰：与 C 增速同为 9.6%，现期更小，增量必然更小（**「小则小」直接排掉**）。\n- B 淘汰：虽然现期 530 万吨最大，但增速只有 3.7%，被 D 的增速优势反超。\n- C 淘汰：与 B 相比现期倍数（6.0）远大于增速倍数（2.6）。\n- 陷阱类型：**概念陷阱（增长率 vs 增长量）+ 范围陷阱（材料里还有牛奶、禽蛋、生猪出栏等无关指标）**。特别注意：材料中「牛奶产量增长 6.2%」与「水产品产量 386.1 万吨，增长 6.2%」增速相同，不要看串行。\n- 老师提醒的判定要领：**当两边倍数关系跟 1.5 的距离都比较明显（不贴边）时，可以放心用「倍数比 1.5」快速判定**。\n\n**【老师原话】**\n\n> 「第 17 题，比较这四个增量谁最大，把他们的限期、增速都给他找出来……水果、猪牛羊（禽肉类）、水产品这四个。\n> 然后先看看有没有那种明显现期最大、增速也大的——限期最大的话是这个水果产量，那它增速是三点七，是最低的；增速最高的呢是这两个 9.6，但它们的现期呢又是非常小的。\n> 所以我们就要大体去看一下它们一个倍数关系了。」\n\n> 「我写一下：77（早稻 76.9）9.6；530　3.7；88（猪牛羊 88.3）9.6；386　6.2。」\n\n> 「那可以先把哪一个排掉？先把早稻排掉。因为找到的增速跟主流（猪牛羊禽肉）增速是一样的，但它限期小，所以它的量就小。早稻已经可以排掉了。」\n\n> 「那我们再比较 B 跟 D。530 是 386 的多少倍？3.7 是 6.2 的多少倍？3.7 要到 6.2 的话，它需要加 2.5，加了超过自己的一半了，他就已经超过一点五倍了，而且超过的还不少。\n> 而 530 和 386 相比，386 想要到 530 只需要加 144，是没有到一半的，是小于一点五倍的。\n> 一个大于一点五倍，一个小于一点五倍，而且他们跟这个一点五的距离还是相对比较明显，不是那种靠的特别近的。\n> 而他们的增速差距又比较小，只差那么两三个点，你补也于事无补。\n> 所以增速高的、大于一点五的这个倍数，**D 选项它的增量是最大的，选择 D 选项**。」\n\n---\n\n### 第 18 题｜2020 年 G 省进口商品单价\n\n**【题干原文】**\n\n> 18.与上年相比，2020 年 G 省进口商品中单价下跌最多的是（ ）。\n>\n> A.原油　　B.天然气　　C.钢材　　D.成品油\n\n**【材料数据】** 表　2020 年 G 省主要商品进口数量、金额及其增长速度\n\n| 商品名称 | 单位 | 数量 | 比上年增长（%） | 金额（亿元） | 比上年增长（%） |\n|---|---|---|---|---|---|\n| 大豆 | 万吨 | 10033 | 13.3 | 2743 | 12.5 |\n| 食用植物油 | 万吨 | 983 | 3.1 | 515 | 17.7 |\n| 铁矿砂及其精矿 | 万吨 | 117010 | 9.5 | 8229 | 17.8 |\n| 煤及褐煤 | 万吨 | 30399 | 1.5 | 1411 | −12.1 |\n| **原油** | 万吨 | **54239** | **7.3** | **12218** | **−26.8** |\n| **成品油** | 万吨 | **2835** | **−7.2** | **818** | **−30.4** |\n| **天然气** | 万吨 | **10166** | **5.3** | **2315** | **−19.4** |\n| 初级形状的塑料 | 万吨 | 4063 | 10.1 | 3628 | −1.2 |\n| 纸浆 | 万吨 | 3063 | 12.7 | 1088 | −7.6 |\n| **钢材** | 万吨 | **2023** | **64.4** | **1165** | **19.8** |\n| 未锻轧铜及铜材 | 万吨 | 668 | 34.1 | 2988 | 33.4 |\n| 集成电路 | 亿个 | 5435 | 22.1 | 24207 | 14.8 |\n| 汽车包括底盘 | 万辆 | 93 | −11.4 | 3242 | −3.5 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 平均数（单价）的增量比较——单价 = 金额 ÷ 数量 |\n| 定位数据 | 见上表加粗四行 |\n| 列式 | 现期单价 = `金额 ÷ 数量`；**平均数的增长率** `r = (r_金额 − r_数量) ÷ (1 + r_数量)`；单价减少量 = `现期单价 × |r| ÷ (1 + r)` |\n| 速算步骤 | ① 算各自现期单价：原油 `12218 ÷ 54239 ≈ 0.2`；天然气 `2315 ÷ 10166 ≈ 0.23`；钢材 `1165 ÷ 2023 ≈ 0.5 几`；成品油 `818 ÷ 2835 ≈ 0.3 不到`。② 算各自平均增长率：原油 `(−26.8% − 7.3%) ÷ 1.073`；天然气 `(−19.4% − 5.3%) ÷ 1.053`；钢材 `(19.8% − 64.4%) ÷ 1.644`；成品油 `(−30.4% + 7.2%) ÷ (1 − 7.2%)` |\n| 结论 | 钢材（C）现期单价 0.5 几，约为其余三者（0.2、0.23、0.3 不到）的**两倍**，而跌幅都在二三十个点、差不了多少 → 钢材的减少量最大 → 选 C |\n\n代码块版速算：\n\n```\n【第一列】现期单价 = 金额 ÷ 数量\n  原油   ：12218 ÷ 54239  ≈ 0.2   （12000 ÷ 54000）\n  天然气 ：2315  ÷ 10166  ≈ 0.23\n  钢材   ：1165  ÷ 2023   ≈ 0.5 几（116 ÷ 2023 略高）\n  成品油 ：818   ÷ 2835   ≈ 0.3 不到（28 × 3 = 84，0.3 小一点点）\n\n【第二列】单价的平均增长率\n            = （金额增速 − 数量增速）÷（1 + 数量增速）\n  原油   ：(−26.8% − 7.3%)  ÷ 1.073 = −34% ÷ 1.073\n  天然气 ：(−19.4% − 5.3%)  ÷ 1.053 = −24.7 ÷ 1.053\n  钢材   ：( 19.8% − 64.4%) ÷ 1.644 = −44 ÷ 1.64\n           1.64 ≈ 1/6 → 等价于 ×6：−44 × 6/10 ≈ −26%\n  成品油 ：(−30.4% + 7.2%)  ÷ (1 − 7.2%) = −23.2 ÷ 0.928 ≈ −25%\n\n【比较】谁的减少量最多？\n  单价量级：0.2 、0.23 、0.5 几 、0.3 不到\n            → 钢材几乎是其他三者的两倍\n  跌幅    ：都在二三十个点，差不了多少（−32%、−23%、−27%、−25%）\n  → 限期（现期）优势太明显，增速又不占劣势\n  → 钢材（C）的减少量最大\n```\n\n**【选项原文】** A.原油　B.天然气　C.钢材　D.成品油\n\n> 注：选项 C 画面显示为「钢材」（转写中记为「同材」，属同音字误差，以画面为准）。\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- C 正确：钢材单价从 2019 年到 2020 年跌幅约 26%～27%，而它的现期单价（0.5 几）是其余三项（0.2、0.23、0.3 不到）的两倍左右，因此**减少量最大**。\n- A、B、D 淘汰：这三项的单价的跌幅与钢材相近（都在二三十个点），但单价量级只有钢材的一半左右，减少量自然小。\n- 陷阱类型：**概念陷阱（单价 = 金额 ÷ 数量，是「平均数」；比的是「减少量」不是「减少率」）+ 单位陷阱（数量单位是万吨、金额单位是亿元，测算出的单价是「亿元/万吨」）**。\n- 老师提醒：比较时「有的时候可能还做一些增速的微调」——例如「−44 ÷ 1.64」中 1.64 ≈ 1/6，「稍微看着就是说分母太大了，那你把它调一下嘛，1.64 是六分之一，等于乘以 6，44 乘以 6，也有 −26% 了」。\n\n**【老师原话】**\n\n> 「第 18 题：跟上年相比，这四个哪一个单价下跌最多？**单价是什么？单价就是金额除以数量**，这是一个平均数的增量比较的问题。\n> 那它只要是增量比较，你就还是去看它的限期跟增速到底是一个什么样的关系就好了，大概的关系。」\n\n> 「（成品油）限期 800 除以 2800 的话，这个基本上就是三倍不到、零点二几。因为 28 乘以 3 是 84，0.3 小一点点。\n> 然后它的增速呢，负三十点四减掉负七点二的话呢，是负的二十三点二，除以一减百分之七点二就是除以零点九二八。」\n\n> 「我们先要比较这四组数，他们谁的减少量最多……**0.5 这个太大了，0.2、0.23、0.5 基本上是两倍了**，哪怕就这 0.3 不到，这 0.5 几也（是）两倍不到的。\n> 而增速上来说，他们其实都差不太多，都是跌了二三十个点……所以它这个**限期优势太明显，增速呢又不占什么劣势**，所以（钢）材的这个减少量就是最大的。」\n\n---\n\n### 第 19 题｜2022 年市政设施投资与到位资金\n\n**【题干原文】**\n\n> 19.2022 年，全国市政设施固定资产投资 2.66 万亿元，同比下降 3.13%；全国市政设施实际到位资金合计 2.67 万亿元，同比下降 12.91%。\n>\n> 2021 年末，全国市政设施实际到位资金约是全国市政设施固定资产投资的多少倍？（ ）\n>\n> A.1.1　　B.1.5　　C.1.9　　D.2.3\n\n**【材料数据】**\n\n| 项目 | 2022 年数值 | 同比增速 |\n|---|---|---|\n| 全国市政设施固定资产投资 | 2.66 万亿元 | −3.13% |\n| 全国市政设施实际到位资金合计（分子） | 2.67 万亿元 | −12.91% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期比问题（材料 2022 年，问 2021 年末） |\n| 定位数据 | 到位资金 2.67（−12.91%）；固定资产投资 2.66（−3.13%） |\n| 列式 | `基期比 = 现期比 × (1 + r_固投) ÷ (1 + r_到位)` |\n| 速算步骤 | ① 现期比 = `2.67 ÷ 2.66 = 1.005 ≈ 1`（两个数几乎一样）；② 增速差 = `12.91% − 3.13% ≈ 9.78` 个百分点 ≈ 10 个百分点 → 给**增速低的到位资金**补约 10%；③ `1 × (1 + 10%) = 1.1` |\n| 结论 | 约 1.1 倍 → 选 A |\n\n代码块版速算：\n\n```\n【思路】现期比太好算 → 算完再补\n  现期比 = 2.67 ÷ 2.66 = 1.005 ≈ 1\n  增速差 = −3.13% − (−12.91%) = 9.78 ≈ 10 个百分点\n  补给增速低的一方（实际到位资金）\n  → 1 × (1 + 10%) = 1.1\n\n【精确校验（供理解，不需在考场上做）】\n  2021 年到位资金 = 2.67 ÷ (1 − 12.91%) = 2.67 ÷ 0.8709 ≈ 3.07\n  2021 年固定资产投资 = 2.66 ÷ (1 − 3.13%) = 2.66 ÷ 0.9687 ≈ 2.75\n  两者之比 ≈ 3.07 ÷ 2.75 ≈ 1.12 → 1.1\n```\n\n**【选项原文】** A.1.1　　B.1.5　　C.1.9　　D.2.3\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- A 正确：现期比接近 1，补上约 10 个百分点后是 1.1，选项中最接近。\n- B（1.5）、C（1.9）、D（2.3）都远大于实算值，属干扰项。\n- 陷阱类型：**时间陷阱（材料 2022 年、问 2021 年末）+ 负增长率陷阱（两边都是下降，容易看成本身数值相除就完事）**。\n- 老师提醒的时机判断：**「什么时候补？你可以在过程中补，也可以算完了再补。那这个地方是什么时候补呢？肯定算完了再补，因为这个现期比太简单了。」**\n\n**【老师原话】**\n\n> 「第 19 题。（20）21 年末是多少倍？这是一个基期比问题。把这个对应的数据找到：实际到位资金在这儿，固定资产投资在这儿。\n> 好，这个基期比就是要去补……什么时候补？你可以在过程中补，也可以算完了再补。那这地方是什么时候补呢？**肯定算完了再补，因为这个现期比太简单了。**\n> 限期比 2.67 除以 2.66，就是一嘛。你大不了你写个 1.005、1.00 几，不就是一嘛。\n> 现期比是一，给谁补？**给 2.67 补，因为它的增速低**，低几个点要补几个点，大概 10 个点左右。\n> 所以一给它补 10%，那不就 1.1 吗？」\n\n---\n\n### 第 20 题｜2020 年全国快递\n\n**【题干原文】**\n\n> 20.2020 年，全国快递服务企业业务量累计完成 833.6 亿件，同比增长 31.2%；业务收入累计完成 8795.4 亿元，同比增长 17.3%。其中，同城业务量累计完成 121.7 亿件，同比增长 10.2%；异地业务量累计完成 693.6 亿件，同比增长 35.9%；国际/港澳台业务量累计完成 18.4 亿件，同比增长 27.7%。\n>\n> 2019 年，全国快递服务企业中，异地快递业务量约是同城业务量的（ ）倍。\n>\n> A.5.7　　B.5.3　　C.4.6　　D.4.2\n\n**【材料数据】**\n\n| 项目 | 2020 年累计完成 | 同比增长 |\n|---|---|---|\n| 快递服务企业业务量 | 833.6 亿件 | 31.2% |\n| 快递业务收入 | 8795.4 亿元 | 17.3% |\n| 　其中：同城业务量（分母） | 121.7 亿件 | 10.2% |\n| 　　　　异地业务量（分子） | 693.6 亿件 | 35.9% |\n| 　　　　国际/港澳台业务量 | 18.4 亿件 | 27.7% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期比问题（材料 2020 年，问 2019 年） |\n| 定位数据 | 异地 693.6（35.9%）；同城 121.7（10.2%） |\n| 列式 | `基期比 = 现期比 × (1 + r_同城) ÷ (1 + r_异地)` |\n| 速算步骤（方式一：先补后除） | 增速差 `35.9 − 10.2 = 25.7` 个百分点，`25.7 ÷ 1.1 ≈ 23` → 给增速低的同城补约 20 多个点（121.7 的 20% 是 24 左右）→ `121.7 + 24 多 ≈ 150`；分子 693.6 近似看 700；`700 ÷ 150 = 7 ÷ 1.5`，把 1.5 看成 3/2 → `7 × 2/3 = 14/3 ≈ 4.67` |\n| 速算步骤（方式二：先除后补） | 现期比 = `693.6 ÷ 121.7`，放缩成 `700 ÷ 125 = 5.6`（125 看成 1/8，即 `7 × 8 = 56`）；再除以 `1.2`：`5.6 ÷ 1.2 = 56 ÷ 12 = 14/3 ≈ 4.67` |\n| 结论 | ≈ 4.67 → 选 C（4.6） |\n\n代码块版速算：\n\n```\n【方式一】先把分母补成一个整位置，再算\n  增速差 = 35.9% − 10.2% = 25.7 个百分点\n  25.7 ÷ 1.1 ≈ 23 → 补 20 多个点\n  121.7 的 20% ≈ 24 → 121.7 + 24 多 ≈ 150\n  分子 693.6 ≈ 700\n  700 ÷ 150 = 7/1.5\n  1.5 = 3/2 → 7 × 2/3 = 14/3 ≈ 4.67\n\n【方式二】先把现期比算成好认的数，再补\n  693.6 ÷ 121.7 放缩为 700 ÷ 125\n  125 = 1/8 → 700 ÷ (1/8) = 700 × 8 = 56 → 5.6\n  再补：5.6 ÷ 1.2 = 56 ÷ 12 = 14/3 ≈ 4.67\n```\n\n**【选项原文】** A.5.7　　B.5.3　　C.4.6　　D.4.2\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- C 正确：两条路线都收敛到 `14/3 ≈ 4.67`，最接近选项 4.6。\n- **A（5.7）是陷阱项**：它正是**没补正的现期比 `693.6 ÷ 121.7 ≈ 5.70`**——若忘了这是「问 2019 年」，直接拿 2020 年两个数相除就会误选 A。板书上把 693.6 与 121.7 都圈了出来，提醒这是要处理的现期比。\n- B（5.3）、D（4.2）与实算不符。\n- 陷阱类型：**时间陷阱（2020 年 → 2019 年基期）**。\n- 老师提醒：「**给增速率的补，补上一个比较整的位置之后，好算一点**」。\n\n**【老师原话】**\n\n> 「第 20 题：19 年，（异地）是同城的多少倍？这还是一个基期比问题。\n> 那基期比问题呢，先把他们的限期（现期）、增速找到，然后看一下他们的一个增速关系：10.2 和 35.9，是需要给 10.2 这个去补的。」\n\n> 「补多少个点呢？我们可以先补，因为我们感觉就是这个六百九十三，你如果直接去除这个一百二十一，也不是那么可以方便、或者说很直接出结果的那种，\n> 那就**先补了再说，先补把它补到凑到一个相对来说比较好算的整（数）**……\n> 35.9 减 12.5 左右，再除以 1.1，大概要给他补 22 个点的样子，20 多个点。\n> 那 121 的 20 个点是 24，那再补 24 多一点，那我就可以把它补到……给他加个 24 多，也能补到 150。\n> 所以它的基期比基本上就是 700 除以 150。这 693.6 就近似的看到 700 了，然后刚刚那个 121 给它补 20 多一点，我就近似的把它调整到一个 150 的样子，这样好算一点。\n> 那 7 除以 15，15 呢，你可以看作 2 分之 3，也就 7 乘以 3 分之 2 等于 14 除以 3，等于 4.67，所以是 4.6 倍。」\n\n> 「或者你可能觉得我这个 693 除 121，那我觉得这 121 还是挺好看的，我可以简单的把它放缩成 700 除以 125 这样子。\n> 它的这个现期比，就 7 除以 125 的话，125 看成八分之一，除以八分之一等于乘以八，七八五十六，现期的五点六倍很好看出来。\n> 然后我在它的基（期）……我分母上刚不是没补、没补那个 120（百分之二十）嘛，我再用 5.6 去除以 1.2 不就好了吗？\n> 5.6 除以 1.2 就是 56 除以 12，上下呢它都是一个四的倍数，也就是三分之十四，还是 4.67，这样也可以。」\n\n---\n\n### 第 21 题｜2019 年 G 市地区生产总值\n\n> ⚠️ **本集只讲到本题开头**（老师刚提出「三种想法」就下课了），完整解法见 **P18（下）**。\n> 下面把画面（f_0183～f_0186）里能看到的题干、表格与老师口述的开头部分完整保留。\n\n**【题干原文】**\n\n> 21.表格为 2019 年数据，则 2018 年，G 市地区生产总值中第一产业与第二产业的绝对量差额最接近（ ）亿元。\n>\n> A.1335　　B.1310　　C.1280　　D.1230\n\n**【材料数据】**\n\n| 指标 | 绝对量（亿元） | 同比增长（%） |\n|---|---|---|\n| 地区生产总值 | 4039.60 | 7.4 |\n| **按产业分** | | |\n| **第一产业** | **161.34** | **5.6** |\n| **第二产业** | **1496.67** | **8.2** |\n| 第三产业 | 2381.59 | 7.0 |\n| **按行业分** | | |\n| 农林牧渔业 | 172.61 | 5.6 |\n| 工业 | 869.00 | 6.5 |\n| 建筑业 | 627.67 | 11.0 |\n| 交通运输、仓储和邮政业 | 256.85 | 7.2 |\n| 批发和零售业 | 264.42 | 5.9 |\n| 住宿和餐饮业 | 86.13 | 5.8 |\n| 金融业 | 482.36 | 5.9 |\n| 房地产业 | 269.97 | 4.9 |\n\n> 画面核对：第一产业 161.34（5.6%）与第二产业 1496.67（8.2%）在板书中被红笔框出。\n> 画面右上角另有一处红色手写标记（转写未提及，疑为草稿痕迹，此处不作解读）。\n\n**【解题拆解（本集已讲部分）】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 基期差问题——「给今年数据，问去年两个数的一个差」 |\n| 定位数据 | 第二产业 1496.67（8.2%）；第一产业 161.34（5.6%） |\n| 列式 | 差额 = **拿大的减小的**，即 `第二产业基期 − 第一产业基期` |\n| 三种想法（老师本集只讲到这里） | ① 如果增速比较靠近 → **拉平统一除**；② 如果增速比较适合 → **「画出一层」（化除为乘）**；③ 第三种 —— **本集未讲，留到 P18（下）** |\n| 结论 | 本集未给出答案 |\n\n**【选项原文】** A.1335　　B.1310　　C.1280　　D.1230\n\n**【答案】** 本集未讲完（顺延至 P18）\n\n**【老师原话（本集结尾）】**\n\n> 「第 21 题，表格给我们的是 2019 年的数据。然后他问的是 18 年的时候，第一产业和第二产业它们绝对量的差值、差额最接近哪个数值、哪个选项？\n> **这就是一个典型的基期差问题了，给今年数据，问去年两个数的一个差。**」\n\n> 「我们先把他们对应的（现期）增速找到吧，第一产业在这儿，第二产业在这儿。差额就是拿大的减小的，拿这个第二产业，它的基期去减第一产业的基期。」\n\n> 「那么在算基期差的时候，我们主要有三种想法。一种想法是如果增速比较靠近，我们可以去拉平、统一除。\n> 第二种呢，如果他们的增速比较适合，像画出一层（化除为乘）……」\n\n> （此处本集结束，第三种想法及本题答案见 **P18（下）**。）\n\n---\n\n## 四、本讲知识点总表\n\n| 模块 | 核心公式（代码形式） | 适用题干特征 | 本集对应题号 |\n|---|---|---|---|\n| 基期比 | `基期比 = 现期比 × (1 + r_分母) ÷ (1 + r_分子)` | 「**去年** A 是 B 的多少倍」；材料给今年 | 第 12、19、20 题 |\n| 增量比 | `增量比 ≈ 现期比 ÷ 增速比 × (1 + r_分母) ÷ (1 + r_分子)` | 「A 的**同比增量**约是 B 的多少倍」 | 第 10、11 题 |\n| 基期差（先减再加） | `基期差 = 现期差 − Δ_被减数 + Δ_减数` | 「去年 A 比 B 多/少多少」且**增量好估** | 第 13、14 题 |\n| 基期差（拉平增长率） | 拉平到高增速后做差，再 `÷ (1 + r_高)` | 「去年 A 比 B 多/少多少」且**拉平好拉** | 第 13、14、15 题 |\n| 平均数增长率 | `r = (r_分子 − r_分母) ÷ (1 + r_分母)` | 单价 / 单位面积 / 人均 / 比重型指标 | 第 18 题 |\n| 增（减）量最大值比较 | 比 `现期倍数` 与 `增速倍数`；现期倍数大的一侧增量大 | 「下列……同比增长量最多的是」 | 第 16、17、18 题 |\n| 顺逆差判断 | 出口 > 进口 = 顺差；进口 > 出口 = 逆差（**以基期为准判断**） | 「贸易状况为」 | 第 14 题 |\n| 部分与整体的拆分 | `部分基期 = (部分现期) ÷ (1 + r)`，两期相减得「某几个月的量」 | 材料只给「一季度 + 3 月」，问「1～2 月」 | 第 15 题 |\n\n### 4.1 「补」的方向速查表\n\n| 情形 | 补谁 | 乘还是除 | 例 |\n|---|---|---|---|\n| 求基期比 / 增量比时两个增速不同 | **补增速低的一方** | 一律用「乘」（因为相当于把对方按低增速折算） | 第 11、12、19、20 题 |\n| 拉平增长率做基期差 | 把**增速低**的一方抬到高增速 | 乘 `(1 + r_高) ÷ (1 + r_低)` | 第 13、14、15 题 |\n| 比较增量大小 | **补增速低的一方** | 判 `现期倍数` 与 `增速倍数` 谁大 | 第 16、17 题 |\n| 增速为负（减少量比较） | 仍补**增速低**（即跌得多的那一方） | 同上 | 老师口述的特殊情形（本集未出题） |\n\n---\n\n## 五、速算口诀与解题流程\n\n### 5.1 口诀\n\n```\n① 比值题：先算现期比，再给增速低的补；\n         增速差大必须补，差小可以直接比。\n\n② 差值题：先减再加不迷路，\n         减数增量加回来，被减增量减出去；\n         增量不好估，改走拉平统一除。\n\n③ 比较题：现期倍数对增速倍数，\n         现期大的一方赢；现期大增速也大，那就\"大大的大了\"。\n\n④ 单价题：单价 = 金额 ÷ 数量，\n         平均增长率 = (金额增速 − 数量增速) ÷ (1 + 数量增速)。\n\n⑤ 顺逆差：以基期为准看方向，出口大为顺、进口大为逆。\n\n⑥ 缺数据：一季度减 3 月 = 1-2 月，部分与整体做减法。\n```\n\n### 5.2 标准解题流程\n\n```\n第 1 步  读题干末句，锁定\"问什么\"：\n          比值？差值？是比较谁最大？还是判方向？\n第 2 步  定位材料中对应的两（组）数：现期值 + 同比增速。\n第 3 步  判断是\"现期\"还是\"基期\"（材料年份 vs 题干年份）。\n第 4 步  【比】先算现期比；【差】先算现期差。\n第 5 步  看两方增速差：\n          ≤ 约 5 个百分点 → 直接比，误差小；\n          ≥ 约 10 个百分点 → 一定要\"补\"。\n第 6 步  补的对象永远是\"增速低的那一方\"。\n第 7 步  凑整优先：把分母 / 减数拉成一个好算的整数\n          （如 6131 → 6000、121.7 → 150、37.1 → 40）。\n第 8 步  结合选项定答案，能\"看\"出来的就不算到底。\n```\n\n### 5.3 常用分数↔百分数换算（本集实际用到）\n\n| 分数 | 百分数 | 本集出处 |\n|---|---|---|\n| 2/7 | ≈ 28.6% | 第 11 题（28.4%） |\n| 1/2 | 50% | 第 11 题（54.0%） |\n| 1/3 | 33.3% | 第 13 题（33.7%） |\n| 1/4 | 25% | 第 13 题（25.8%） |\n| 2/5 | 40% | 第 14 题（40.8%） |\n| 1/7 | ≈ 14.3% | 第 10 题（14.4%） |\n| 1/6 | ≈ 16.7% | 第 18 题（1.64 ≈ 1/6） |\n| 1/8 | 12.5% | 第 20 题（125 = 1/8） |\n| 3/2 | 1.5 | 第 17、20 题 |\n\n---\n\n## 六、易错点与陷阱清单\n\n| 序号 | 陷阱类型 | 具体表现 | 本集题号 | 正确做法 |\n|---|---|---|---|---|\n| 1 | 时间陷阱 | 材料 2023 年，问 2022 年 | 第 12 题 | 必须补正 2%，答案 2.39 而非 2.35 |\n| 2 | 时间陷阱 | 材料 2022 年，问 2021 年末 | 第 19 题 | 补约 10 个百分点，答案 1.1 |\n| 3 | 时间陷阱 | 材料 2020 年，问 2019 年 | 第 20 题 | 现期比 5.7（选项 A）不是答案 |\n| 4 | 时间陷阱 | 问「1～2 月」，材料只给「一季度」和「3 月」 | 第 15 题 | 一季度减 3 月；103（基期一季度）不是答案 |\n| 5 | 补正漏项 | 现期比 ÷ 增速比 = 5.5，忘了补 20% | 第 11 题 | 5.5 × 1.2 = 6.6 → 7 |\n| 6 | 符号陷阱 | 基期差 `32.2 − 40` 忘了把减数增量加回来 | 第 14 题 | `32.2 − 40 + 20 = 12.2` |\n| 7 | 符号陷阱 | 基期差符号搞反 → 误判成逆差 / 十几亿 | 第 13 题 | `7.7 − 7.7 + 4.6 = 4.6`，不乱方向 |\n| 8 | 拉平漏除 | 拉平后做差得 6.2 就直接当基期差 | 第 13 题 | 还要 `÷ (1 + 33.7%)` → 4.7 |\n| 9 | 概念陷阱 | 问「增长量最多」却去比「增长率」 | 第 16、17、18 题 | 要算 `现期 × r ÷ (1+r)` 或比倍数关系 |\n| 10 | 概念陷阱 | 问「增量」却算「现期值」的倍数 | 第 10 题 | 先算两个增量再相除 |\n| 11 | 概念陷阱 | 单价 = 金额 ÷ 数量，是平均数问题 | 第 18 题 | 用平均数增长率公式 |\n| 12 | 负增长率 | 3 月增速 −1.6%，除数是 `(1 − 1.6%)` | 第 15 题 | 拉平补 10% 后 `110.4 − 40 ≈ 70` |\n| 13 | 负增长率 | 两边都在下降（−3.13%、−12.91%） | 第 19 题 | 差值是 9.78 个百分点，别丢符号 |\n| 14 | 看串行 | 材料里「牛奶产量增长 6.2%」与「水产品 386.1 万吨，增长 6.2%」 | 第 17 题 | 对准选项对应的指标再取数 |\n| 15 | 范围陷阱 | 材料数字很多，选项只对应其中四个 | 第 16、18 题 | 先圈出选项对应的四个指标 |\n| 16 | 凑整方向 | 分母变小，分子要相应变大（反之亦然） | 第 12、14、20 题 | 如 6131 退 2% → 6000，分子 14388 → 14400 |\n\n---\n\n## 七、老师金句\n\n> ⭐ 「**补这个东西、补这个增长率，永远是给增速低的补就好了，就不会出错了。**」\n\n> ⭐ 「**只要它的限期比增速比高，那肯定是限期大的那个增量大。**」\n\n> ⭐ 「**如果它限期大、增速还大，那也还都没什么好比的，那就大大的大了。**」\n\n> ⭐ 「**这两个题都属于是增速差距比较大的时候，就会导致那个限期比跟增速比带来的误差相对大一点，需要补。**」\n\n> 「这两个题可能你会感觉好像第一种方式你平常用的不太熟，在这个情况下好像对比起来也没有太大的优势，可能会有点让你不太想去念（练）这个方法，**但是还是要念（练）的**。」\n\n> 「25%、33.7%，这个四分之一、三分之一，**我不去估它的增量，我都有点不好意思了**。」\n\n> 「**这个不是基期差啊，基期差的话还要在它的基础上再除一个 1.337。**」\n\n> ⭐ 「所以这种方法如果熟练了以后，**在这种增速相对比较靠近、比较好估、比较好去拉平的时候，特别顺、特别快**，直接就（在）我的脑海中就是一个 1.1，不用动它 37，要往上稍微补一点……非常快。」\n\n> ⭐ 「这个方法有时候还有个优势，就是很多时候你去算到这样的一个东西，去除以这个一加高的这个增速的时候，**结合选项，你不需要把它具体多少算出来，也能看出来该选哪个**。」\n\n> 「**现期比是一，给谁补？给增速低的补，低几个点要补几个点。**」\n\n> 「**给增速率的补，补上一个比较整的位置之后，好算一点。**」\n\n> 「什么时候补？你可以在过程中补，也可以算完了再补。**肯定算完了再补，因为这个现期比太简单了。**」\n\n> 「**单价就是金额除以数量**，这是一个平均数的增量比较的问题。」\n\n> 「**这就是一个典型的基期差问题了，给今年数据，问去年两个数的一个差。**」\n\n> 「一般来说，遇到很少很少有题目会问这种增速小于零的这种减少量最大。**但只要你记牢一个原则：补这个增长率，永远是给增速低的补，就不会出错了。**」\n\n---\n\n## 附：本集未讲完 / 需衔接的内容\n\n| 事项 | 说明 |\n|---|---|\n| 第 21 题答案 | 本集只讲到「三种想法」的前两种（拉平统一除、化除为乘），答案与第三种想法见 **P18（下）** |\n| 第 21 题题干 | 画面显示为「G 市地区生产总值」（转写记为「G 地区」，以画面为准） |\n| 第 10 题 | 已在 P16（上）讲完，本集（f_0015～f_0019）画面再次出现，作为「两个题都属于增速差距比较大」的对照 |\n| 第 11 题开头 | 本集从第 11 题的**下半段**讲起（「给谁补呢？就要给分子去补了」），该题前半段见 **P16（上）** |\n\n","outline":[{"level":2,"text":"一、本集题目地图","id":"一本集题目地图"},{"level":3,"text":"1.1 网格图 → 题号对照表","id":"11-网格图-题号对照表"},{"level":3,"text":"1.2 本集题目速览","id":"12-本集题目速览"},{"level":2,"text":"二、核心方法","id":"二核心方法"},{"level":3,"text":"2.1 一句话总纲","id":"21-一句话总纲"},{"level":3,"text":"2.2 五大套路速查","id":"22-五大套路速查"},{"level":3,"text":"2.3 老师本集反复强调的两条铁律","id":"23-老师本集反复强调的两条铁律"},{"level":2,"text":"三、例题精讲","id":"三例题精讲"},{"level":3,"text":"第 10 题（对照回顾）｜2016 年该市本级主要预算支出","id":"第-10-题对照回顾2016-年该市本级主要预算支出"},{"level":3,"text":"第 11 题｜2021 年上半年 S 市社会消费品零售额","id":"第-11-题2021-年上半年-s-市社会消费品零售额"},{"level":3,"text":"第 12 题｜2023 年一季度全国居民收支","id":"第-12-题2023-年一季度全国居民收支"},{"level":3,"text":"第 13 题｜2021 年 B 市城市客运总量","id":"第-13-题2021-年-b-市城市客运总量"},{"level":3,"text":"第 14 题｜2021 年 1-9 月我国机床工具进出口","id":"第-14-题2021-年-1-9-月我国机床工具进出口"},{"level":3,"text":"第 15 题｜2019 年一季度邮政寄递服务收入","id":"第-15-题2019-年一季度邮政寄递服务收入"},{"level":3,"text":"第 16 题｜2020 年电子商务四类指标","id":"第-16-题2020-年电子商务四类指标"},{"level":3,"text":"第 17 题｜2023 年前三季度 Z 省主要产品产量","id":"第-17-题2023-年前三季度-z-省主要产品产量"},{"level":3,"text":"第 18 题｜2020 年 G 省进口商品单价","id":"第-18-题2020-年-g-省进口商品单价"},{"level":3,"text":"第 19 题｜2022 年市政设施投资与到位资金","id":"第-19-题2022-年市政设施投资与到位资金"},{"level":3,"text":"第 20 题｜2020 年全国快递","id":"第-20-题2020-年全国快递"},{"level":3,"text":"第 21 题｜2019 年 G 市地区生产总值","id":"第-21-题2019-年-g-市地区生产总值"},{"level":2,"text":"四、本讲知识点总表","id":"四本讲知识点总表"},{"level":3,"text":"4.1 「补」的方向速查表","id":"41-补的方向速查表"},{"level":2,"text":"五、速算口诀与解题流程","id":"五速算口诀与解题流程"},{"level":3,"text":"5.1 口诀","id":"51-口诀"},{"level":3,"text":"5.2 标准解题流程","id":"52-标准解题流程"},{"level":3,"text":"5.3 常用分数↔百分数换算（本集实际用到）","id":"53-常用分数百分数换算本集实际用到"},{"level":2,"text":"六、易错点与陷阱清单","id":"六易错点与陷阱清单"},{"level":2,"text":"七、老师金句","id":"七老师金句"},{"level":2,"text":"附：本集未讲完 / 需衔接的内容","id":"附本集未讲完-需衔接的内容"}]},{"id":"P18","title":"拉长平均率·课后作业解析（下）","full":"第6课 拉长增长率课后作业解析（下）","lect":"","dur":"18:24","sec":1104,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 18 集\n\n# 第6课 拉长增长率课后作业解析（下）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 18 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=18`\n> **时长**：18 分 24 秒\n> **本集主题**：**「拉长增长率」课后作业解析（下）——第 21~25 题逐题精讲**\n> **配套分集**：本集与第 16 集（上）、第 17 集（中）同属「第 6 课 · 拉长增长率」一课，本集接续讲**基期差 / 基期和**类题目。\n\n---\n\n## 目录\n\n- [一、开场回顾：求「基期差」的三条路](#一开场回顾求基期差的三条路)\n- [二、本集题目总览](#二本集题目总览)\n- [三、例题精讲](#三例题精讲)\n  - [第 21 题｜G市地区生产总值 · 第一产业与第二产业绝对量差额](#第-21-题g市地区生产总值--第一产业与第二产业绝对量差额)\n  - [第 22 题｜2017 年全国规模以上文化及相关产业营业收入](#第-22-题2017-年全国规模以上文化及相关产业营业收入)\n  - [第 23 题｜某市 2022 年工业六大行业主要经济指标](#第-23-题某市-2022-年工业六大行业主要经济指标)\n  - [第 24 题｜沪市与深市上市公司营业收入（基期和）](#第-24-题沪市与深市上市公司营业收入基期和)\n  - [第 25 题｜2021 年 1—8 月进出口与贸易顺差](#第-25-题2021-年-18-月进出口与贸易顺差)\n- [四、本讲知识点总表](#四本讲知识点总表)\n- [五、速算口诀与解题流程](#五速算口诀与解题流程)\n- [六、易错点与陷阱清单](#六易错点与陷阱清单)\n- [七、老师金句](#七老师金句)\n\n---\n\n## 一、开场回顾：求「基期差」的三条路\n\n> 本集开头老师先收尾上一题的思路，把「基期差」的三种做法完整复述了一遍。\n\n**板书要点（黑板口述整理）：**\n\n```text\n求基期差（基期 A − 基期 B）的三条路：\n\n路①  拉平增长率\n      —— 给增速比较低的那个去补上相差的增速，\n         补完再一起做差、再统一除以 (1 + 统一后的增速)。\n\n路②  先减后加（限期差 − 前面的增量 + 后面的增量）\n      —— 前提：能比较快速、大概地估出增量。\n\n路③  两个都不符合 → 分别放缩\n      —— 把它们的基期分别算出来，直接「基期 − 基期」，\n         拿限期除以 (1 + 增速) 把它们算出来。\n```\n\n> ⭐ **老师原话（转写，画面无对应板书，为口播）**：\n> 「如果两个增速可以比较快速、大概地估出增量的时候，我们可以去**先减后加**求基期差，等于限期差，先减掉前面的增量，再加上后面的增量。」\n> 「第三就是如果两个都不符合，那我们就**分别放缩**，把它们的基期算出来，直接算基期减基期；直接拿那个限期除以（1+增速），把它们算出来。」\n\n> ⭐ **本集第 21 题是「两种思路都能做」的样板题**：\n> 「这个题目它这个增速的特点呢，就是**既符合条件一，也符合条件二**的，你用拉平也能做，用下面这个估增量也好做。就是离得又近，而且也都比较适合用画出一层（化除为一层，即『化除为乘』式的提前修正），所以两种思路都可以。」\n\n---\n\n## 二、本集题目总览\n\n| 题号 | 材料主题 | 题型 | 已知增速 | 答案 |\n|:---:|:---|:---|:---|:---:|\n| 第 21 题 | G市 2019 年地区生产总值（三次产业 + 分行业） | 基期差（相减） | 5.6% 与 8.2% | ✅ **D** |\n| 第 22 题 | 2017 年全国规模以上文化及相关产业营业收入 | 基期差（最快 − 最慢） | 34.6% 与 3.7% | ✅ **B** |\n| 第 23 题 | 某市 2022 年工业六大行业主要经济指标 | 基期差（总体 − 部分） | 1.9% 与 5.6% | ✅ **C** |\n| 第 24 题 | 2018 年上半年沪市、深市上市公司营业收入 | 基期和（相加） | 11% 与 17.24% | ✅ **B** |\n| 第 25 题 | 2021 年 1—8 月我国进出口总值 | 基期差（出口 − 进口＝顺差） | 23.8% 与 21.8% | ✅ **D** |\n\n> ⚠️ **注意**：第 25 题的增速要用「**比 2019 年同期增长**」的那一组（23.8% / 21.8%），**不是**「同比增长」的那一组（23.2% / 24.4%）。这是本集最大的一个**时间陷阱**。\n\n---\n\n## 三、例题精讲\n\n### 第 21 题｜G市地区生产总值 · 第一产业与第二产业绝对量差额\n\n**【题干原文】**（画面逐字照抄）\n\n> 21. 表格为 2019 年数据，则 2018 年，G市地区生产总值中第一产业与第二产业的绝对量差额最接近（　）亿元。\n>\n> A. 1335　　B. 1310　　C. 1280　　D. 1230\n\n**【材料数据】**（g_001 第 1 格 = `frames/f_0001.jpg`，画面完整表格）\n\n| 指标 | 绝对量（亿元） | 同比增长（%） |\n|:---|---:|---:|\n| 地区生产总值 | 4039.60 | 7.4 |\n| **按产业分** | | |\n| 第一产业 | 161.34 | 5.6 |\n| 第二产业 | 1496.67 | 8.2 |\n| 第三产业 | 2381.59 | 7.0 |\n| **按行业分** | | |\n| 农林牧渔业 | 172.61 | 5.6 |\n| 工业 | 869.00 | 6.5 |\n| 建筑业 | 627.67 | 11.0 |\n| 交通运输、仓储和邮政业 | 256.85 | 7.2 |\n| 批发和零售业 | 264.42 | 5.9 |\n| 住宿和餐饮业 | 86.13 | 5.8 |\n| 金融业 | 482.36 | 5.9 |\n| 房地产业 | 269.97 | 4.9 |\n\n> ⚠️ 注意：题目问的是「**按产业分**」的第一产业与第二产业，下面的「**按行业分**」那一整块（农林牧渔业…房地产业）**与本题无关**，不要误取。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|:---|:---|\n| 题型识别 | **基期差**（问 2018 年两个量的绝对量差额；给的是 2019 年数据） |\n| 定位数据 | 第一产业 `161.34` 亿元、增速 `5.6%`；第二产业 `1496.67` 亿元、增速 `8.2%` |\n| 列式 | 基期差 = `1496.67/(1+8.2%) − 161.34/(1+5.6%)` |\n| 速算路径 | 两条路都行：**路①拉平增长率** 或 **路②先减后加**（两增速离得近、也都适合提前修正） |\n| 结论 | 约 `1228~1231` → 最接近 **1230** → **D** |\n\n---\n\n#### 解法一（老师首选）：拉平增长率 → 先拉平，再统一除\n\n> ⭐ **老师原话**：「拉平就是给增速比较低的去补上相差的一个增速。**注意这个相差不是一个简单的做差，是算他们的平均数增长率**。只是有的时候这个分母上那个影响太小，我们可以近似地看成他们的差值。」\n\n**第 1 步：算需要补的增速差**\n\n```text\n两个增速差 = 8.2% − 5.6% = 2.6%\n严格应为：2.6% ÷ (1 + 5.6%) ≈ 2.5%\n```\n\n> ⭐ 老师原话：「他们增速大概差了百分之二点六。但其实应该是百分之二点六除以一加上百分之五点六，所以你可以给它补两个多点，不用算那么细，大概给它补两个多点就行。」\n\n**第 2 步：给增速低的「第一产业」补增速，同时把它的限期值「补大」**\n\n```text\n第一产业：161.34 → 补 2 点几个百分点\n          ≈ 161.34 × (1 + 2%多) ≈ 165     （板书：165）\n第二产业：1496.67 不动，就近取整 → 1497   （板书：1497）\n补完后两者增速统一为 8.2%\n```\n\n> ⭐ 老师原话：「补百分之二多一点…那就算一百六十五，就给它多一点凑到一百六十五上。另外一个数量是 1496.67，等于 1497。」\n\n**第 3 步：做差**\n\n```text\n1497 − 165 = 1332        （板书：1332）\n```\n\n> ⭐ 老师原话：「在补齐了这个增速之后，就是你去做差，得到 1332。结果是两个人的基期都统一涨了百分之八点二。那么都变成了 8.2% 涨上来的，所以这个差值也提高了 8.2%。」\n\n**第 4 步：统一除以 `(1 + 8.2%)`——用「提前修正 + 化除为乘」**\n\n```text\n基期差 = 1332 ÷ (1 + 8.2%)\n       ≈ 1332 − 1300 × 8%          ← 提前修正：把被乘的 1332 适当调小成 1300\n       = 1332 − 104\n       = 1228                       （板书：= 1228）\n```\n\n> ⭐ **「提前修正」的原理（老师逐字讲）**：\n> 「这个地方呢，就是我们做了**提前修正**。因为如果你直接用 1332 去乘这个 8.2% 的话，结果比这个实际的增量会偏高 8.2%。那么就把这个限期、增速都适当的调小一点，把这个误差调小一点，这样你也可以凑成好算一点。」\n> （即：`1332 × 8.2% = 109.2`，比真实增量偏高；用 `1300 × 8% = 104` 更贴近真实增量。）\n\n**第 5 步：不列最后一步，用选项反代验证（效率最高的做法）**\n\n> ⭐ **老师原话（本集最重要的提速技巧）**：\n> 「当然很多时候其实你会觉得好像感觉算的也挺麻烦的。但是其实很多时候你把这个式子列出来，你会发现你**观察一下选项就能选出来了**。」\n\n```text\n要在 1332 的基础上往下推掉 8.2%（≈ 106）：\n\nB. 1310 → 与 1332 只差 22，才两三个点，太近 ✗\nC. 1280 → 与 1332 只差 52，也就四个点，太近 ✗\nD. 1230 → 与 1332 差约 102，接近 10 个点 ≈ 8%，对得上 ✓\n```\n\n> ⭐ 老师原话：「你要在 1332 的基础上推多少个点？8 个点。可能是 B 吗？131，这是不是太近了？才两三个点。可能是 C 吗？距离 1332 才差了 52，也就四个点。所以这时候你可以用**代入去反验证的方法**…会发现明眼这个 B、C 太小的，距离太小了…只能选 D，只有 D 跟那个 1332 差了接近 10 个点，差不多 8%。」\n> ⭐ 「**这样你就不需要去算这最后一步了，这样你拉平增长率、算基期差的效率才能提到最高。**」\n\n---\n\n#### 解法二：先减后加（限期差 − 第二产业增量 + 第一产业增量）\n\n**第 1 步：先算限期差**\n\n```text\n1496.67 − 161.34 = 1335.33 ≈ 1335        （板书：1335）\n```\n\n> ⚠️ **老师特意点名**：`1335` 就是 **A 选项**，\n> 「这个其实就是 A 选项，A 选项其实就是个**限期差**，专门用来**坑那些没注意时间**的。」（**时间陷阱**）\n\n**第 2 步：先减掉「第二产业」的增量**\n\n> 老师讲：因为你是拿 1497 去减的 161，所以先算 1497 的增量。算的时候跟上面一样，**先提前修正**。\n\n```text\n第二产业增量 ≈ 1400 × 8% = 112          （板书：1400×8%）\n1335 − 112 = 1223                       （板书：1335 − 112 = 1223）\n```\n\n> ⭐ 老师原话：「这种题目相对比较复合的题目，它的**计算精度要求是不太高的**。」\n\n**第 3 步：再加上「第一产业」的增量**\n\n> ⭐ 老师原话：「有些时候后面这个增量你可以不用急着算，你可以**先减，尤其是你后面这个东西它比较小的时候，影响特别小，先减了再说**。减下来你会发现就只剩 1223 了，然后再加个增量，这个增量能大到哪去？161 的 5.几%，就那么不到十的一个增量嘛，怎么可能会涨到 B、C 呢？所以 **D 走人**。」\n\n```text\n第一产业增量 ≈ 161 × 5.6% ≈ 9\n1223 + 9 ≈ 1231                         （板书：1223+ → 1231）\n```\n\n> ⭐ 老师原话：「它的增量呢大概就是一百五乘以百分之五点六，差不多就是八点四的样子。乘相当于乘这个一点五嘛…所以加个八左右，变成 1231。」\n\n**【选项原文】**\n\n> A. 1335　　B. 1310　　C. 1280　　D. 1230\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n| 选项 | 判定 | 说明 |\n|:---:|:---:|:---|\n| A. 1335 | ✗ | **限期差**（`1496.67 − 161.34 = 1335.33`）。**陷阱类型：时间陷阱**——问 2018 年却直接算了 2019 年的差 |\n| B. 1310 | ✗ | 与 1332 只差 22，即只降了 1.7%，远不够 8.2% 的降幅。**陷阱类型：干扰项（降幅不足）** |\n| C. 1280 | ✗ | 与 1332 只差 52，即只降了 3.9%，仍不足 8.2% 的降幅。**陷阱类型：干扰项（降幅不足）** |\n| D. 1230 | ✅ | 拉平后 `1497 − 165 = 1332`，再 `1332 ÷ (1+8.2%) ≈ 1228`；先减后加 `1335 − 112 + 9 ≈ 1231`。两条路都指向约 1230 |\n\n> ⭐ **老师收束**：「这就是**拉平增长率——先拉平、再统一除**。」「做基期差主要用的比较快的两种方法就是这两个。」\n\n> ⚠️ **转写与画面差异**：转写把 1335 写成「1335」，与画面一致；转写中「机器/机期」应为画面/术语中的「**基期**」，「限期」应为「**现期**」。\n\n---\n\n### 第 22 题｜2017 年全国规模以上文化及相关产业营业收入\n\n**【题干原文】**（画面逐字照抄）\n\n> 22. 2017 年增长最快和增长最慢的规模以上文化及相关产业，他们 2016 年的营业收入相差约（　）亿元。\n>\n> A. 5936　　B. 953　　C. 4984　　D. 2822\n\n**【材料数据】**（`grids/g_005.jpg` 第 2 格 = `frames/f_0038.jpg`，画面完整表格）\n\n**2017 年全国规模以上文化及相关产业企业营业收入情况**\n\n| 指标 | 绝对额（亿元） | 比上年增长（%） |\n|:---|---:|---:|\n| 总计 | 91950 | 10.8 |\n| **分产业数据** | | |\n| 新闻出版发行服务 | 3566 | 7.2 |\n| 广播电视电影服务 | 1749 | 6.1 |\n| 文化艺术服务 | 434 | 17.1 |\n| **文化信息传输服务** | **7990** | **34.6** ← 增长最快 |\n| 文化创意和设计服务 | 11891 | 8.6 |\n| 文化休闲娱乐服务 | 1545 | 14.7 |\n| 工艺美术品的生产 | 16544 | 7.5 |\n| 文化产品生产的辅助生产 | 9329 | 6.4 |\n| 文化用品的生产 | 33065 | 11.4 |\n| **文化专用设备的生产** | **5168** | **3.7** ← 增长最慢 |\n| **分地区数据** | | |\n| 东部地区 | 68710 | 10.7 |\n| 中部地区 | 14853 | 11.1 |\n| 西部地区 | 7400 | 12.3 |\n| 东北地区 | 988 | −0.9 |\n\n> 注：1. 表中速度均为未扣除价格因素的名义增速。\n> 　　2. 表中部分数据因四舍五入的原因，存在总计与分项合计不等的情况。\n\n> ⚠️ **老师特别提醒（范围陷阱）**：「我们先要把最快最慢的找到，**注意找到是什么，是产业啊，不是这个地区，所以这个部分（分地区数据）你是不用管的**。」\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|:---|:---|\n| 题型识别 | **基期差**（问 2016 年两个产业的营业收入之差）；同时**先要定位「最快 / 最慢」** |\n| 定位数据 | 最快：文化信息传输服务 `7990` 亿元、`34.6%`；最慢：文化专用设备的生产 `5168` 亿元、`3.7%` |\n| 列式 | 基期差 = `7990/(1+34.6%) − 5168/(1+3.7%)` |\n| 速算路径 | **路②先减后加**（两增速离得太远，拉平不太合适，但也能做，老师最后补讲） |\n| 结论 | 约 `947` → **B. 953** |\n\n> ⭐ **老师原话**：「那这个增速呢就**离得很远了**。那这个地方如果你用那个拉平增长率呢，可能效果没有那么好。当然也不是不行，我最后一个给你。而这两个增速呢，它也就正好比较适合用我们的估算，一个是**百化分**。」\n\n---\n\n#### 解法一（老师首选）：先减后加\n\n**第 1 步：分别估两个增量**\n\n```text\n上面（文化信息传输服务，7990，34.6%）：\n    34.6% ≈ 33.3% = 1/3\n    → 增量 = 限期 × [增速/(1+增速)] = 7990 × 1/4 ≈ 2000   （板书：Δ ≈ 2000）\n```\n\n> ⭐ 老师原话：「上面的 34.6 就约等于 33.3，就是 1/3，可以估算它的增量大概就是…增速是 1/3，增量就是限期的 1/4，直接 8000 除以 4，2000。」\n\n```text\n下面（文化专用设备的生产，5168，3.7%）：\n    5168 → 提前修正到 5000   （板书：5168 → 5000）\n    5000 × 3.7% = 185        （板书：5000 × 3.7% = 185）\n```\n\n> ⭐ **老师原话（提前修正）**：「如果你直接拿 5168 乘以 3.7%，位数又多，还会偏大 3.7%。那 5168 它的一个整数 5000 很近，所以我们可以选择**先提前修正这个限期**，把它退 3.7 个点，退到一个近似的基期上去，大概在 5000 的样子，5000 乘以 3.7%，这样就比较准了。」\n\n**第 2 步：先算限期差，再「先减再加」**\n\n```text\n限期差 = 7990 − 5168 = 2822              （板书：2822）\n```\n\n> ⚠️ **陷阱点名**：`2822` 就是 **D 选项**。「这是个**限期差**」（**时间陷阱**）。\n\n```text\n基期差 ≈ 2822 − 2000 + 185\n       = 822 + 185 = 1007               （板书：= 822 + 185 = 1007）\n```\n\n**第 3 步：发现「2000」估偏小，回补 60**\n\n```text\n2000 是拿 34.6% 当成 33.3% 算的，结果偏小；\n准确来说上面增量应在 2060 左右 → 多减 60\n基期差 ≈ 2822 − 2060 + 185 ≈ 947         （板书：≈ 947）\n```\n\n> ⭐ 老师原话：「像刚刚比如说这个 2000，这个呢就算的有点偏小了。我们是直接把这个 34.6 当做了 33.3，结果就会偏小。准确来说，应该是 2060 左右，所以这个地方应该再多减个 60。再减个 60，差不多 940 多，这就差不多了。」\n\n**第 4 步：不算最后一步，用「增量比较大小」直接锁定**\n\n> ⭐ **老师原话（本集核心思想之一）**：\n> 「然后从这个题我们可以发现，很多时候**先减后加，它就好像我们刚刚那个拉平增长率一样**，有时候你并不需要把最后一步算的很准确。」\n> 「限期差 2822 是不是很好算，已经对到这个 D 上面来了。然后你稍微再分析一下，你要减的这个部分和要加的这个部分，它们的增量是什么关系呢？**你是要减一个大的数，再加一个明显小得多的数。**这个就可以运用到我们这节课学过的**增量比较大小关系**。**限期又大，增速又大，大的还这么多，所以增量也是上面这个大。**你要减个大的，再加个小的，所以**结果只会比 2822 还小**。那我们就只能选择 B。」\n\n```text\n决策链（不用精算）：\n  基期差 = 2822 − 大增量 + 小增量 \u003c 2822\n  剩下的选项：C.4984（太大）、B.953（唯一明显小于 2822 且合理的）\n  → 只能选 B\n```\n\n---\n\n#### 解法二（老师补讲）：拉平增长率\n\n```text\n给增速较低的 3.7% 补增速：\n    增速差 = 34.6% − 3.7% = 31（个百分点）\n    严格换算：31% ÷ 1.037 ≈ 30 个点左右\n    5168 补 30 个点 ≈ 1500 多 → 5168 + 1500 ≈ 6700   （板书：5168 + 1500 → 6700）\n\n做差：\n    7990 − 6700 = 1290                                （板书：1290）\n\n统一除：\n    1290 ÷ 1.346 \u003c 1000                               （板书：1290/1.346 \u003c 1000）\n```\n\n> ⭐ 老师原话：「那如果这个题目用拉平呢，就不是那么好做，当然也不是不能做。我们就给增速比较低的这个 3.7% 的限期去补上，大概 30 个点。增速差是 31 嘛，31 除以 1.037，差不多就是 30 个点左右。5168 的 30 个点就是 1500 多，加起来就变成了 6600 多、6700 左右，然后我们做差 7990 减去 6700 等于 1290，然后在 1290 的基础上再除以 1.346，就**很明显它是小于 1000 的**，所以选择 B，**拉平也能做**。」\n> 「其实你要补的东西多，有的时候误差可能会大一点，但题目就还好，因为题目它的**选项差距实在太大了**。」\n\n**【选项原文】**\n\n> A. 5936　　B. 953　　C. 4984　　D. 2822\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n| 选项 | 判定 | 说明 |\n|:---:|:---:|:---|\n| A. 5936 | ✗ | 数量级明显偏大，两个产业的现期值本身就只有 7990 与 5168，基期差不可能到 5936。**陷阱类型：数量级干扰** |\n| B. 953 | ✅ | 先减后加：`2822 − 2060 + 185 ≈ 947`；拉平：`(7990 − 6700) ÷ 1.346 ≈ 958 \u003c 1000`。两条路都指向 B |\n| C. 4984 | ✗ | 与 5168 接近，属于「拿单个产业的现期值当结果」的干扰。**陷阱类型：概念陷阱** |\n| D. 2822 | ✗ | **限期差**（`7990 − 5168 = 2822`）。**陷阱类型：时间陷阱** |\n\n> ⚠️ **范围陷阱双重提醒**：①必须取「分产业数据」块内的行，不能取「分地区数据」块；②「增长最慢」在本表中是 `3.7%`（文化专用设备的生产），虽然东北地区是 `−0.9%`，但它属于**分地区数据**、且不属于「产业」，不能选。\n\n> ⚠️ **转写与画面差异**：转写中的「县期差 / 现金差」= 画面中的「**限期差**（现期差）」；「百花村 / 百划分 / 画出一层」= 画面/术语中的「**百化分 / 化除为乘式的提前修正**」；转写「签下来呢就是 18.5185」对应画面上 `5000 × 3.7%` 的结果 **185**。\n\n---\n\n### 第 23 题｜某市 2022 年工业六大行业主要经济指标\n\n**【题干原文】**（画面逐字照抄）\n\n> 23. 2021 年，除六大行业外的 2000 万元以上工业实现利润约为（　）。\n>\n> A. 18.86 亿元　　B. 20.58 亿元　　C. 23.58 亿元　　D. 27.86 亿元\n\n**【材料数据】**（`grids/g_008.jpg` 第 3 格 = `frames/f_0066.jpg`，画面完整表格）\n\n**某市 2022 年工业六大行业主要经济指标表**\n\n| 行业名称 | 工业总产值 实绩（亿元） | 同比±% | 其中：2000万元以上工业 企业数（家） | 产值（亿元） | 同比±% | 利润（亿元） | 同比±% |\n|:---|---:|---:|---:|---:|---:|---:|---:|\n| 生物医药制造业 | 678.79 | 28.1 | 178 | 245.58 | 4.1 | 15.51 | −1.1 |\n| 电子信息产品制造业 | 51.17 | 13.3 | 26 | 47.58 | 10.6 | 4.47 | 9.6 |\n| 铜加工及新型材料业 | 585.96 | 24.8 | 92 | 437.65 | 25.0 | 28.59 | 27.3 |\n| 机电装备制造业 | 552.06 | 13.7 | 171 | 366.02 | 11.1 | 23.93 | −0.2 |\n| 纺织服装业 | 536.02 | 4.0 | 181 | 296.32 | −1.0 | 17.98 | 0.5 |\n| 环保新能源产业 | 144.22 | 17.0 | 37 | 140.78 | 15.2 | 7.94 | −13.2 |\n| **六大行业合计** | **2548.22** | **13.9** | **685** | **1569.93** | **11.4** | **98.43** | **5.6** |\n| **工业企业合计** | **2922.89** | **8.8** | **797** | **1903.02** | **11.0** | **119.01** | **1.9** |\n\n> ⭐ **老师读题定位（逐字）**：「所有的 2000 万元以上的工业呢，在这儿（工业企业合计）。这所有的其中有一部分是六大行业的，就是上面的六大行业的合计。然后下面是包括了其他的那些小行业，一共的总计。**我们只看这个部分的利润。**」\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|:---|:---|\n| 题型识别 | **基期差**（问 2021 年；材料是 2022 年）；且是「**总体 − 部分**」型 |\n| 定位数据 | 工业企业合计利润 `119.01` 亿元、增速 `1.9%`；六大行业合计利润 `98.43` 亿元、增速 `5.6%` |\n| 列式 | 基期差 = `119.01/(1+1.9%) − 98.43/(1+5.6%)` |\n| 关键判断 | 题干时间是 **2021 年**，材料是 **2022 年** → 必须做基期差，把六大行业「踢出去」 |\n| 速算路径 | 两增速靠近，**拉平**最简单；**先减后加**也可以 |\n| 结论 | 约 `23.3` → **C. 23.58** |\n\n> ⭐ **老师原话**：「现在他问的是 21 年，题干时间是 22 年，所以就是个基期差问题，要把这个六大行业给它踢出去，减掉除了它以外的部分。」\n\n---\n\n#### 解法一（老师首选）：拉平增长率\n\n```text\n第 1 步：给增速较低的 119.01（1.9%）补增速\n    两增速差 = 5.6% − 1.9% = 3.7 个百分点\n    119 补 3 点几个百分点 ≈ 补到 123        （板书：119 → 123，增速补到 5.6%）\n\n第 2 步：做差\n    123 − 98.4 = 24.6                        （板书：24.6）\n\n第 3 步：统一除以 (1 + 5.6%)\n    24.6 ÷ 1.056 ≈ 23.3                      （板书：24.6/(1+5.6%)）\n```\n\n> ⭐ 老师原话：「拉平的话，因为这个地方**增速比较靠近，拉平很简单**，你拉个三个多点就好了，给这个增速低的 119 补三个多点。就是补个四左右，一百一十九乘以百分之三点几，大概在四的样子。因为如果你节省（按）百分之三的话，是三点六左右，那再多一点嘛，四不需要算的很准确啊。所以算完之后，它就变成了一个一百二十三、增速百分之五点六的这样的一个值，这样子它的基期是保持不变的。另外一个数量是九十八点四，增速也是百分之五点六。那我们先给这两个做差，做差得到了二十四点六。」\n\n**第 4 步：不算最后一步，用选项排除（关键提速）**\n\n> ⭐ **老师原话**：「然后在它的基础上除以一加上百分之五点六，那这个就很明显了吧。首先你不可能比较…24.6，A 线排除，小了，小几个点，只能小 5 个点左右。那怎么可能是 A 跟 B 呢？你光是这个 B，20 到 24，就起码将近 20 个点，我这里只有 5 个点的差距，所以 **C 走人（选 C）**。」\n\n```text\n24.6 ÷ 1.056 只会比 24.6 小 5 个点左右 ≈ 23.3\nA. 18.86 → 比 24.6 小约 23%，差得太远 ✗\nB. 20.58 → 比 24.6 小约 16%，同样太远 ✗\nC. 23.58 → 比 24.6 小约 4%，正好对应「小 5 个点左右」 ✓\n```\n\n> ⭐ **老师原话（拉平法的最大优势）**：「那**拉平最好这个优点就是很多时候你最后一步并不需要算**。观察选项去验证、排除就可以了。你要做的只是给他补一下，补那么靠近的那么几个点，你只要算一个这个四，那不就很简单吗？然后再一步做差呗，做差又没什么难度啊。」\n\n---\n\n#### 解法二：先减后加\n\n**第 1 步：限期差**\n\n```text\n119.01 − 98.43 = 20.58 ≈ 20.6             （板书：119 − 98.4 = 20.6）\n```\n\n> ⚠️ **陷阱点名**：`20.58` 就是 **B 选项**，这是**限期差**（**时间陷阱**）。\n\n**第 2 步：先减掉「工业企业合计」的增量**\n\n```text\n工业企业合计增量 ≈ 119 × 1.9% ≈ 2.2 ≈ 2   （板书：119 × 1.9% = 2）\n```\n\n**第 3 步：再加上「六大行业合计」的增量**\n\n```text\n六大行业增量 ≈ 90 × 5.6% ≈ 5              （板书：90 × 5.6% = 5）\n```\n\n> ⭐ 老师原话：「这个的增量呢也是可以画面出来的（化除为乘），就看作比如大概九十左右乘以百分之五点六，先提前把这个限期调小一点，把这个误差百分之五点六先给它去掉。当然这个九十调得这也太小了，但无所谓吧，也差不太多，六九五十四，大概在五左右，不需要算的很准。」\n\n**第 4 步：合成**\n\n```text\n基期差 = 20.6 − 2 + 5 = 23.6              （板书：119−98.4 = 20.6 − 2 + 5 = 23.6）\n```\n\n> ⭐ 老师原话：「那 20.6 − 2 + 5 就是加 3，等于 23.6，所以选择 C。」\n\n> ⭐ **关于误差的说明（老师原话）**：「因为其实这个误差是很大的——**不是我们计算误差很大，是选项之间的差距是很大的**。你这个二十点六已经算出来是现期差了，你只需要判断你到底是要再加个三变成 C，还是要再加个七变成 D。你说这个三跟七你能算不明白吗？你能把这个什么减二加五搞出来一个四的误差吗？**搞不出来那么多的。**」\n\n**【选项原文】**\n\n> A. 18.86 亿元　　B. 20.58 亿元　　C. 23.58 亿元　　D. 27.86 亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n| 选项 | 判定 | 说明 |\n|:---:|:---:|:---|\n| A. 18.86 亿元 | ✗ | 比限期差 20.58 还小。因为六大行业增速（5.6%）高于总体增速（1.9%），其基期占比更大，差额应当**变大**，不可能变小。**陷阱类型：方向陷阱** |\n| B. 20.58 亿元 | ✗ | **限期差**（`119.01 − 98.43 = 20.58`）。**陷阱类型：时间陷阱** |\n| C. 23.58 亿元 | ✅ | 拉平：`(123 − 98.4) ÷ 1.056 ≈ 23.3`；先减后加：`20.6 − 2 + 5 = 23.6`。两条路都指向 C |\n| D. 27.86 亿元 | ✗ | 需要「再加个七」才到，实际上增量差只有 5 − 2 = 3 的量级。**陷阱类型：增量估计过大** |\n\n> ⚠️ **概念陷阱提醒**：题干「除六大行业**外**的 2000 万元以上工业」＝「工业企业合计 − 六大行业合计」，属于**总体减部分**；不要误取成「六大行业合计」或「工业企业合计」本身。\n\n> ⚠️ **转写与画面差异**：转写「二十点六已经算出来是信息差了」中的「信息差」应为画面/术语中的「**现期差（限期差）**」；转写「那20.6-2+5就是加323.6」应为 **「那 20.6 − 2 + 5 就是加 3，等于 23.6」**（画面板书即 `= 23.6`）。\n\n---\n\n### 第 24 题｜沪市与深市上市公司营业收入（基期和）\n\n**【题干原文】**（画面逐字照抄）\n\n> 24. 2018 年上半年，沪市上市公司共计实现营业收入 15.4 万亿元，同比增长 11%；净利润 1.6 万亿元，同比增长 14%。深市上市公司合计实现营业总收入 5.41 万亿元，同比增长 17.24%；合计实现净利润 3963.50 亿元，同比增长 16.86%。\n>\n> 2017 年上半年，沪市和深市上市公司共计实现营业收入约多少万亿元？\n>\n> A. 17.5　　B. 18.5　　C. 19.5　　D. 20.5\n\n**【材料数据】**（`grids/g_010.jpg` 第 8 格 = `frames/f_0089.jpg`）\n\n| 指标（2018 年上半年） | 营业收入 | 营业收入同比增速 | 净利润 | 净利润同比增速 |\n|:---|---:|---:|---:|---:|\n| 沪市上市公司 | 15.4 万亿元 | 11% | 1.6 万亿元 | 14% |\n| 深市上市公司 | 5.41 万亿元 | **17.24%** | 3963.50 亿元 | 16.86% |\n\n> ⚠️ **数据取舍陷阱**：题目问的是「**营业收入**」，所以**净利润（1.6 万亿 / 3963.50 亿）及其增速（14% / 16.86%）是完全无关的干扰数据**，只用营业收入与营业收入增速。\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|:---|:---|\n| 题型识别 | **基期和**（问 2017 年上半年两个市场营业收入之和） |\n| 定位数据 | 沪市 `15.4` 万亿元、`11%`；深市 `5.41` 万亿元、`17.24%` |\n| 列式 | 基期和 = `15.4/(1+11%) + 5.41/(1+17.24%)` |\n| 速算路径 | 两增速只差 6 个点，**拉平**与**先减后加**都合适 |\n| 结论 | 约 `18.5` → **B. 18.5** |\n\n> ⭐ **老师原话**：「这是一个**基期和**，要把它们加起来。基期和也可以用我们刚刚讲的那些拉平增长率、然后退增量的方法去解。那这里的增速两种方法其实都蛮合适的，因为一方面他们离得近，只差了六个点；一方面他们也都是适合的（百化分附近），这两种方法都行。」\n\n---\n\n#### 解法一（老师首选）：拉平增长率\n\n**第 1 步：算出要补的增速**\n\n```text\n17.24% − 11% = 6.24（个百分点）\n换算成「平均数增长率」：6.24% ÷ (1 + 11%) ≈ 5.6% → 取 6 个点左右\n                                          （板书：17.24 − 11 = 6.24，/1+11% ≈ 6%）\n```\n\n> ⭐ 老师原话：「那我们先用拉平来算，先给这个增速比较低的十五点四补多少。上来补 17.24 减 11%，再去除以 1+11%，就大概是 6 个点左右。因为上面减下来是 6.24，6.24 除以 1.1 左右，它虽然 6 不到，但我们不需要算那么细。」\n\n**第 2 步：把沪市限期值「补大」**\n\n```text\n沪市：15.4 → 15.4 + 15.4 × 6% ≈ 15.4 + 0.9 = 16.3      （板书：16.3）\n深市：5.41 → 5.4（就近取整）                            （板书：5.4）\n```\n\n> ⭐ 老师原话：「就六个点左右，你就知道是加六个点不到，那十五点四的六个点不到，我就直接拿十五乘以六，就是九十，就加零点九。那加上 0.9 就变成 16.3。」\n\n**第 3 步：求和（此时是「统一增速下的现期和」）**\n\n```text\n16.3 + 5.4 = 21.7                                       （板书：16.3 + 5.4 = 21.7）\n```\n\n> ⭐ 老师原话：「16.3 和 5.4，这时候就能把它们俩加起来了。先算一个这样的一个限期和，加起来是 21.7。这个限期和是在大家的基期同时增长了 17.24% 涨上来的，所以你要整体一起除一个 1 加 17.24%。」\n\n**第 4 步：用「份数法」快速除**\n\n```text\n17.24% ≈ 1/6\n→ 增量 ≈ 现期 ÷ 7\n基期和 = 21.7 − 21.7 ÷ 7\n       = 21.7 − 3.1\n       = 18.6                                            （板书：= 21.7 − 21.7/7 − 3.1 = 18.6）\n```\n\n> ⭐ **老师原话（份数法 vs 放缩）**：「那这个时候你可以用**份数法**。就是这是个限期、这是个增速，连单位基期增速呢，这个十七点二四，它是约等于六分之一的，所以增量就应该是约等于限期的七分之一，所以直接 21.7 减掉 21.7 除以 7，就是减了个 3.1，减下来是 18.6，所以选择 B。」\n\n**第 5 步：放缩法（另一条路，老师也演示了）**\n\n```text\n21.7 ÷ 1.1724\n分母 1.1724 减 6 → 1.11；分子 21.7（写 217）减 11 → 206\n206 ÷ 111 ≈ 1.86  → 18.6                               （板书：206/111 → 18.6）\n```\n\n> ⭐ 老师原话：「除以一一七这样除也可以。除的时候你给下面减个六，上面大概两倍不到，减个十一，上面变成二零六，除个幺幺，除幺幺等于错位相减，减二十幺，八六也可以。」\n> ⭐ **效率对比**：「不过当这样的放缩，你会觉得好像写的也挺快的。但如果你份数法的这种…比较灵活、比较快、比较熟练的话，它的速度肯定会比这个放缩要快。**因为份数法是搞熟练点这个东西，我是不需要去写这个东西的，不需要去列式子的**，直接 21.7 减掉它的七分之一嘛，因为增速是六分之一嘛，那它的七分之一 3.几一减就能看到这个 B 了。」\n\n---\n\n#### 解法二：先减后加（把两个增量分别退掉）\n\n```text\n第 1 步：限期和 = 15.4 + 5.41 = 20.81 ≈ 20.8          （板书：20.8）\n\n第 2 步：减掉沪市的增量\n    沪市增速 11% ≈ 1/9  → 增量 = 限期 ÷ 10\n    → 15.4 ÷ 10 = 1.54                                  （板书：− 1.54）\n\n第 3 步：减掉深市的增量\n    深市增速 17.24% ≈ 1/6 → 增量 = 限期 ÷ 7\n    → 5.41 ÷ 7 ≈ 0.8                                    （板书：− 0.8）\n\n第 4 步：合成\n    20.8 − 1.54 − 0.8 = 20.8 − 2.34 = 18.46 ≈ 18.5      （板书：= 18.5）\n```\n\n> ⭐ 老师原话：「我们可以把他们的增量退掉。先算他们的限期和加起来是 20.8，然后把第一个的增量退掉。因为你这个 15.4 它偏高，高了多少呢？高了它限期的大概十分之一。为啥是十分之一呢？因为增速是九分之一——**九加一等于十**，增速是基期的九分之一，就是限期的十分之一。好，所以要先减个 1.54 多出来的增量，然后后面这个增速是六分之一的增量，就是限期的七分之一，除以 7，5.41 再减个 0.8 左右。对于 20.8 − 2.34，接下来就是 18.5 左右，所以选择 B。」\n\n> ⭐ **口诀**：「**增速是基期的几分之一，增量就是现期的（n+1）分之一。**」（增速 1/9 → 增量 = 现期/10；增速 1/6 → 增量 = 现期/7）\n\n**【选项原文】**\n\n> A. 17.5　　B. 18.5　　C. 19.5　　D. 20.5\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n| 选项 | 判定 | 说明 |\n|:---:|:---:|:---|\n| A. 17.5 | ✗ | 偏小。基期和只在 20.8 的基础上退掉 2.34 的增量，退不到 3.3。**陷阱类型：降幅过大** |\n| B. 18.5 | ✅ | 拉平：`(16.3+5.4) ÷ 1.1724 = 21.7 − 3.1 = 18.6`；先减后加：`20.8 − 1.54 − 0.8 = 18.46` |\n| C. 19.5 | ✗ | 只退了 1.3，比实际增量 2.34 小得多。**陷阱类型：降幅不足** |\n| D. 20.5 | ✗ | 接近限期和 20.8，属于「直接拿现期和作答」。**陷阱类型：时间陷阱** |\n\n> ⚠️ **单位陷阱提醒**：沪市是「**万亿**元」（15.4），深市是「**万亿**元」（5.41），但深市净利润是「**亿**元」（3963.50）。虽然本题净利润用不上，但读材料时务必区分「万亿元」与「亿元」。\n\n> ⚠️ **转写与画面差异**：转写「除以 7856 再减个 0.8 左右」应为 **「除以 7，5.41 再减个 0.8 左右」**（画面板书 `− 0.8`，且 5.41 ÷ 7 ≈ 0.77）。转写「他其实是离得近，只差了六个点」「上来补17.24减11%」与画面一致。\n\n---\n\n### 第 25 题｜2021 年 1—8 月进出口与贸易顺差\n\n**【题干原文】**（画面逐字照抄）\n\n> 25. 2021 年 1—8 月，我国进出口总值 24.78 万亿元人民币，同比增长 23.7%，比 2019 年同期增长 22.8%。其中，出口 13.56 万亿元，同比增长 23.2%，比 2019 年同期增长 23.8%；进口 11.22 万亿元，同比增长 24.4%，比 2019 年同期增长 21.8%。\n>\n> 2019 年 1—8 月，我国贸易顺差在以下哪个范围内？（　）\n>\n> A. 不到 0.5 万亿元\n> B. 0.5 ~ 1.0 万亿元\n> C. 1.0 ~ 1.5 万亿元\n> D. 1.5 万亿元以上\n\n**【材料数据】**（`grids/g_013.jpg` 第 6 格 = `frames/f_0114.jpg`）\n\n| 指标（2021 年 1—8 月） | 金额 | 同比增长 | 比 2019 年同期增长 |\n|:---|---:|---:|---:|\n| 进出口总值 | 24.78 万亿元 | 23.7% | 22.8% |\n| **出口** | **13.56 万亿元** | 23.2% | **23.8%** |\n| **进口** | **11.22 万亿元** | 24.4% | **21.8%** |\n\n> ⚠️ **本题最大的陷阱（时间陷阱）**：题目问的是 **2019 年 1—8 月**，所以增速必须取「**比 2019 年同期增长**」那一列：\n> - 出口：`23.8%`\n> - 进口：`21.8%`\n>\n> **不能**用「同比增长」那一列的 `23.2%` / `24.4%`（那是「2021 年比 2020 年」）。\n\n> ⭐ **老师原话（逐字）**：「顺差就是出口减进口，因为卖东西卖得给别人的比较多，能赚别人的钱，赚的钱也比较多，那就心里就顺嘛。总之我在卖给你，你卖给我没卖多少东西，你没赚到我的钱，我赚到你的钱了。」\n> ⭐ 「**这个增速呢不是百分之二十三点二，这个是同比增速，是跟 2020 年相比**。这是 21 跟 20 相比，我们要找的基期是 19，再往后找，在这儿呢是 **21 年比 19 年增长了 23.8%**，这个才是它的增速。」\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|:---|:---|\n| 题型识别 | **基期差**（求 2019 年 1—8 月的贸易顺差） |\n| 概念转换 | 顺差 = **出口 − 进口** |\n| 定位数据 | 出口 `13.56` 万亿元、`23.8%`；进口 `11.22` 万亿元、`21.8%` |\n| 列式 | 基期顺差 = `13.56/(1+23.8%) − 11.22/(1+21.8%)` |\n| 速算路径 | 两增速只差 2 个点，**非常靠近 → 直接拉平**；先减后加也可以 |\n| 结论 | 约 `1.76`（拉平）/ `1.64`（先减后加）→ 均 **> 1.5** → **D** |\n\n---\n\n#### 解法一（老师首选）：拉平增长率\n\n**第 1 步：算要补的增速**\n\n```text\n23.8% − 21.8% = 2%（个百分点）\n严格换算：2% ÷ (1 + 21.8%) ≈ 1.6%，即「2 个点不到」\n```\n\n> ⭐ 老师原话：「那这个就属于**很靠近的，非常靠近，所以可以直接拉平**，拉大概百分之二不到。给谁拉？给增速比较低的，这个拉给它，拉上去两个、两个点不到。」\n\n**第 2 步：给进口「补大」**\n\n```text\n进口：11.22 → 11.22 + 11.22 × 2% ≈ 11.22 + 0.2 ≈ 11.4   （板书：11.22 → 11.4）\n出口：13.56 不动\n```\n\n> ⭐ 老师原话：「就给他加个零点二，变 11.4 左右，左边呢是 13.56。」\n\n**第 3 步：做差**\n\n```text\n13.56 − 11.4 = 2.16                                       （板书：13.56 − 11.4 = 2.16）\n```\n\n**第 4 步：统一除以 `(1 + 23.8%)` —— 放缩**\n\n```text\n2.16 ÷ 1.238 ≈ 2.20 ÷ 1.25\n             = 2.20 × 0.8\n             = 1.76                                       （板书：2.16/1.238 ≈ 2.20/1.25 = 1.76）\n```\n\n> ⭐ 老师原话：「这个结果是大家整体都涨了 23.8% 涨上来的，所以再除以 1.238。那这边就可以直接放缩了，因为分母上这个 1.238，它非常靠近那个百化分**八分之一**，就可以把它近似的看作 2.20 除以 1.25，简简单单粗略地给它放缩一下。这个地方不用算得很准确，因为选项你还不知道它要不要你算那么准呢，先粗略一点。」\n> ⭐ 「除以 1.25 等于**乘以 0.8**……就比如 2.2 乘以 0.8 等于 1.76，算出来个 1.76。」\n\n**第 5 步：用选项边界判断误差是否可接受**\n\n> ⭐ **老师原话（极重要的一种应考心态）**：「你看，离这个 C 和 D 的**边界 1.5 就很远，差了挺多的**，所以你就不用担心你刚才计算的误差会不会导致你把 C 错选成 D。**你不可能把一个 1.5 算成什么 1.76 的**，因为刚刚的计算中没有那么大的误差，我只调了一那么一点点。所以选择 D 选项。」\n\n---\n\n#### 解法二：先减后加\n\n**第 1 步：限期差**\n\n```text\n13.56 − 11.22 = 2.34                                      （板书：2.34）\n```\n\n**第 2 步：减掉出口增量**\n\n```text\n出口增速 23.8% ≈ 1/4  → 增量 = 限期 ÷ 5\n13.56 ÷ 5 = 2.712 ≈ 2.7                                  （板书：≈ 2.7）\n```\n\n> ⭐ 老师原话：「这个增速呢比较靠近四分之一，所以拿限期除以五，除以五的话，就是 2.7。」\n\n**第 3 步：加上进口增量**\n\n```text\n进口增速 21.8%，调小成 20% = 1/5 → 增量 = 限期 ÷ 6\n同时把进口限期 11.22 顺手调上去 → 12\n12 ÷ 6 = 2                                                （板书：11.22 → 12，÷6 = 2）\n```\n\n> ⭐ 老师原话：「后面呢，这个比较靠近百分之二十，比较靠近五分之一，要除以六。但这边注意，你把这个二十一点八调成了二十，调小了那么一点点，那我就把限期也适当的顺手调上去，调成 12，这样除也好除。所以再加个二。」\n\n**第 4 步：合成**\n\n```text\n2.34 − 2.7 + 2 = 2.34 − 0.7 = 1.64                        （板书：= 1.64）\n1.64 > 1.5  →  D\n```\n\n> ⭐ **误差方向说明（老师原话）**：「这种 2.7 除以五，我为什么没调呢？因为 13.56 除以五本身就已经比较好，所以就没怎么去动它。你只要记得**你这种 2.7 偏大就行**。2.7 偏大，所以这个结果就会**偏小**。你要选一个比 1.64 稍微大一点点的数，但还是会选在这个 D 里面，所以就无关紧要了。」\n\n**【选项原文】**\n\n> A. 不到 0.5 万亿元\n> B. 0.5 ~ 1.0 万亿元\n> C. 1.0 ~ 1.5 万亿元\n> D. 1.5 万亿元以上\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n| 选项 | 判定 | 说明 |\n|:---:|:---:|:---|\n| A. 不到 0.5 万亿元 | ✗ | 与 1.76 相差 3 倍以上，量级不符 |\n| B. 0.5 ~ 1.0 万亿元 | ✗ | 仍是量级不符 |\n| C. 1.0 ~ 1.5 万亿元 | ✗ | **本题最诱人的干扰项**——计算结果 1.76 或 1.64 都明显越过了 1.5 的上界。**陷阱类型：范围边界陷阱** |\n| D. 1.5 万亿元以上 | ✅ | 拉平：`(13.56 − 11.4) ÷ 1.238 ≈ 2.20 × 0.8 = 1.76`；先减后加：`2.34 − 2.7 + 2 = 1.64`。两条路都 > 1.5 |\n\n> ⚠️ **时间陷阱（本题核心）**：必须用「比 2019 年同期增长」的 `23.8% / 21.8%`。如果误用「同比增长」的 `23.2% / 24.4%`，算出来的就不是 2019 年的顺差。\n>\n> ⚠️ **概念陷阱**：题目问的是「**贸易顺差**」，必须先自己写出「**顺差 = 出口 − 进口**」，材料里不会直接给顺差。\n\n> ⚠️ **转写与画面差异**：\n> - 转写「进口11.22申诉」应为画面中的「**进口 11.22 万亿元**」（「申诉」为转写噪声）。\n> - 转写「除以 1.25 等于除以八分之一，等于乘以八」是口误，画面/数学上是 `÷1.25 = ×0.8`（即 `×8/10`），`2.2 × 0.8 = 1.76`。\n> - 转写「所以选择 D 选项」与画面 `frames/f_0138.jpg` 上打勾的 **D** 一致。\n\n---\n\n## 四、本讲知识点总表\n\n| 序号 | 知识点 | 核心内容 | 本集对应题目 |\n|:---:|:---|:---|:---|\n| 1 | **基期差三条路** | ①拉平增长率 ②先减后加（估增量）③分别放缩算基期再相减 | 第 21~23、25 题 |\n| 2 | **基期和** | 与基期差同源：先拉平求和，再统一除以 `(1+统一增速)` | 第 24 题 |\n| 3 | **拉平增长率的「补」** | 给**增速较低**的一方补上「增速差 ÷ (1+低增速)」，同时把它的**限期值同比补大** | 第 21、22、23、24、25 题 |\n| 4 | **拉平后的统一除** | 补完后两者增速统一，先做差/求和，再整体除以 `(1 + 统一增速)` | 第 21、23、24、25 题 |\n| 5 | **提前修正（化除为乘）** | 用 `限期 − 限期×增速` 近似 `限期 ÷ (1+增速)`；被乘的限期应**适当调小**以抵消偏高误差 | 第 21、22、23 题 |\n| 6 | **份数法** | 增速 ≈ `1/n` → 增量 ≈ 现期 ÷ `(n+1)` → 基期 = 现期 − 增量 | 第 24 题 |\n| 7 | **百化分** | `34.6% ≈ 1/3`、`23.8% ≈ 1/4`、`21.8% ≈ 1/5`、`17.24% ≈ 1/6`、`11% ≈ 1/9`、`1.238 ≈ 8/5 的反向`（此处用于 `÷1.25 = ×0.8`） | 第 22、24、25 题 |\n| 8 | **增量比较大小** | 限期又大、增速又大 → 增量一定大；据此可判断「减大的、加小的 → 结果变小」 | 第 22 题 |\n| 9 | **选项反代验证** | 只要算出「限期差」和「要退掉的百分点数」，直接代入 ABCD 比距离，不必算完最后一步 | 第 21、23 题 |\n| 10 | **范围取值** | 看清题干问的是「产业」还是「地区」、是「合计」还是「除某部分外」 | 第 22、23 题 |\n| 11 | **时间对齐** | 题干问的年份决定用哪一组增速（尤其「同比增长」vs「比前年同期增长」） | 第 21、23、25 题 |\n\n---\n\n## 五、速算口诀与解题流程\n\n### 5.1 口诀\n\n```text\n【基期差·三选一】\n  拉平优先，先减后加次之，都不行才分别放缩。\n\n【拉平口诀】\n  低增速的补差额，补完限期一起涨；\n  先做差，再统一除，除完看选项就收工。\n  补的量 = 增速差 ÷ (1 + 低增速)，不是简单相减。\n\n【先减后加口诀】\n  限期差 → 减前面（大）的增量 → 加后面（小）的增量。\n  后面那个小，可以\"先减了再说\"，增量最后再估。\n\n【百化分 / 份数法口诀】\n  增速 1/3 → 增量 = 限期 ÷ 4\n  增速 1/4 → 增量 = 限期 ÷ 5\n  增速 1/5 → 增量 = 限期 ÷ 6\n  增速 1/6 → 增量 = 限期 ÷ 7\n  增速 1/9 → 增量 = 限期 ÷ 10\n  即：增速是基期的 1/n，增量就是现期的 1/(n+1)。\n\n【提前修正口诀】\n  化除为乘，限期先退一个自身的增速，再去乘，误差最小。\n\n【误差与选项口诀】\n  不用算准，只要判断\"该加 3 还是该加 7\"；\n  选项之间差距大，计算误差就无关紧要。\n```\n\n### 5.2 解题流程（基期差 / 基期和 通用）\n\n```text\nStep 1  看时间\n        题干年份 vs 材料年份 → 确认是\"基期\"问题（差 or 和）\n\nStep 2  看范围 / 概念\n        · 是\"产业\"还是\"地区\"？\n        · 是\"合计\"还是\"除某部分外\"？\n        · 是自己写公式的量吗？（如顺差 = 出口 − 进口）\n\nStep 3  挑增速\n        · 一定要与题干年份对齐（\"同比\" ≠ \"比 2019 年同期\"）\n        · 基期差取两个量；基期和取两个量\n\nStep 4  选路径\n        · 两增速接近（差 3 个点以内）→ 优先【拉平】\n        · 能快速估出增量 → 【先减后加】\n        · 都不行 → 【分别放缩求基期再相减】\n\nStep 5  速算\n        拉平：补 → 差/和 → ÷(1+统一增速)（份数法或放缩或提前修正）\n        先减后加：限期差 → −大增量 → +小增量\n\nStep 6  收敛\n        能用选项距离反代就反代，能靠\"增量大小关系\"定性判断就定性判断，\n        把最耗时的最后一步省掉。\n```\n\n---\n\n## 六、易错点与陷阱清单\n\n| 陷阱类型 | 具体表现 | 本集出处 | 破解办法 |\n|:---|:---|:---|:---|\n| **时间陷阱** | 问 2018 年却用 2019 年的差直接作答 | 第 21 题 A（`1335`）；第 22 题 D（`2822`）；第 23 题 B（`20.58`）；第 24 题 D（`20.5`） | 先写「基期」二字再动笔；凡是「选项里有一个等于现期差/现期和的」，几乎必是陷阱 |\n| **时间陷阱（增速错位）** | 题干问 2019 年，材料同时给「同比增长」和「比 2019 年同期增长」两组增速 | 第 25 题 | 严格按题干年份选那一列增速，看清「比 X 年同期」 |\n| **范围陷阱** | 表格分「分产业数据」和「分地区数据」两块 | 第 22 题 | 题干问产业，就只在产业块内找最快/最慢（东北地区 −0.9% 不可选） |\n| **概念陷阱（总体减部分）** | 「除六大行业**外**的 2000 万元以上工业」 | 第 23 题 | 读成「合计 − 六大行业合计」，不能取错行 |\n| **概念陷阱（自己写公式）** | 「贸易顺差」材料不直接给 | 第 25 题 | 先默写「顺差 = 出口 − 进口」，再套数据 |\n| **数据取舍陷阱** | 材料同时给营业收入和净利润 | 第 24 题 | 题干问营业收入，净利润及其增速（1.6 万亿 / 3963.50 亿 / 14% / 16.86%）全部不看 |\n| **单位陷阱** | 同一段材料里既有「万亿元」又有「亿元」 | 第 24 题 | 沪市 15.4 **万亿元**、深市 5.41 **万亿元**，而深市净利润是 3963.50 **亿元** |\n| **补增速算错** | 把「增速差」当成要补的量，忘了除以 `(1+低增速)` | 第 21、22、24、25 题 | 记住：**补的量 = 增速差 ÷ (1 + 低增速)**，只是分母影响小时可近似 |\n| **提前修正方向错** | 用大数去乘增速，导致增量偏高 | 第 21 题 | 用 `限期 × 增速` 估增量时，先把限期**适当调小**（如 `1332 → 1300`、`1497 → 1400`、`5168 → 5000`、`119 → 90`） |\n| **降幅不足 / 过大** | 算出「该退 8.2%」却选了只退 2~4% 的选项 | 第 21 题 B/C；第 24 题 A | 先估出「要退掉的百分点数」，再与选项距离对照 |\n| **只看单项数据** | 选项里出现「其中一个量的现期值」 | 第 22 题 C（`4984`，与 `5168` 同量级） | 明确所求是「差」不是「某个量本身」 |\n| **范围边界陷阱** | 答案落在区间选项的边界附近 | 第 25 题 C（`1.0~1.5`）vs D（`1.5 以上`） | 算出 1.64 / 1.76 均明显越过 1.5，且误差量级远小于到边界的距离，可放心选 D |\n\n---\n\n## 七、老师金句\n\n> ⭐ **「拉平就是给增速比较低的去补上相差的一个增速。注意这个相差不是一个简单的做差，是算他们的平均数增长率。」**\n\n> ⭐ **「这样你就不需要去算这最后一步了，这样你拉平增长率、算基期差的效率才能提到最高。」**\n\n> ⭐ **「很多时候先减后加，它就好像我们刚刚那个拉平增长率一样，有时候你并不需要把最后一步算得很准确。」**\n\n> ⭐ **「你要减的这个部分和要加的这个部分，它们的增量是什么关系呢？你是要减一个大的数，再加一个明显小得多的数。限期又大，增速又大，大的还这么多，所以增量也是上面这个大。」**（增量比较大小关系）\n\n> ⭐ **「先减，尤其是你后面这个东西它比较小的时候，影响特别小，先减了再说。」**\n\n> ⭐ **「这种题目相对比较复合的题目，它的计算精度要求是不太高的。」**\n\n> ⭐ **「那拉平最好的优点就是，很多时候你最后一步并不需要算，观察选项去验证、排除就可以了。」**\n\n> ⭐ **「你能把这个什么减二加五搞出来一个四的误差吗？搞不出来那么多的。」**\n\n> ⭐ **「不是我们计算误差很大，是选项之间的差距是很大的。」**\n\n> ⭐ **「离这个 C 和 D 的边界（1.5）就很远，差了挺多的，所以你就不用担心你刚才计算的误差会不会导致你把 C 错选成 D。」**\n\n> ⭐ **「份数法……我是不需要去写这个东西的，不需要去列式子的，直接 21.7 减掉它的七分之一，因为增速是六分之一嘛。」**（熟练后份数法比放缩快）\n\n> ⭐ **「先提前修正这个限期，把它退 3.7 个点，退到一个近似的基期上去。」**（提前修正的精髓）\n\n> ⭐ **「顺差就是出口减进口，因为卖东西卖得给别人的比较多，能赚别人的钱……那就心里就顺嘛。」**\n\n---\n\n## 附录：网格图 ↔ 帧号 ↔ 题目 对照表\n\n| 网格 | 帧号区间 | 主要内容 |\n|:---:|:---|:---|\n| `g_001.jpg` | f_0001 – f_0009 | 第 21 题材料（G市 2019 年三次产业表）；给出「拉平 / ①②」提示，圈出 161.34 与 1496.67 |\n| `g_002.jpg` | f_0010 – f_0018 | 第 21 题拉平：`161.34 → 165`、`1496.67 → 1497`、`1332`、`+8.2%`、`(1332)/(1+8.2%) ≈ 1332 − 1300×8%` |\n| `g_003.jpg` | f_0019 – f_0027 | 第 21 题收尾：`1332×8.2%`、`= 1332 − 104 = 1228`、`1332/1.082`；答案 **D** |\n| `g_004.jpg` | f_0028 – f_0036 | 第 21 题法②先减后加：`1335 − 112 = 1223`、`1400×8%`；选 **D** |\n| `g_005.jpg` | f_0037 – f_0045 | 第 21 题收尾；**第 22 题材料**（2017 文化及相关产业表）；定位 `7990 / 34.6%`、`5168 / 3.7%`；`Δ ≈ 2000` |\n| `g_006.jpg` | f_0046 – f_0054 | 第 22 题：`5168 → 5000 × 3.7% = 185`；`Δ = 2822 − 2000 + 185 = 822 + 185 = 1007 → 947`；答案 **B** |\n| `g_007.jpg` | f_0055 – f_0063 | 第 22 题先减后加收尾 + 拉平：`5168 + 1500 → 6700`、`7990 − 6700 = 1290`、`1290/1.346 \u0 题2023-年--该市牛羊禽肉产量--增速高精度要求)\n- [七、第七课分式混合总结（板书小结页）](#七第七课分式混合总结板书小结页)\n  - [7.1 线段反比（左栏，逐字）](#71-线段反比左栏逐字)\n  - [7.2 拉平与混合（右栏，逐字）](#72-拉平与混合右栏逐字)\n- [八、第六部分：拉平增长率的补充（多对象整体拉平 / 机器和差的退与补）](#八第六部分拉平增长率的补充多对象整体拉平--机器和差的退与补)\n  - [第 13 题｜2022 年 · 全国规模以上文化及相关产业企业 · 营业收入排名第 4 的行业类别](#第-13-题2022-年--全国规模以上文化及相关产业企业--营业收入排名第-4-的行业类别)\n  - [第 14 题｜S 省工业用电量 · 2022 年第四季度环比增速](#第-14-题s-省工业用电量--2022-年第四季度环比增速)\n  - [第 15 题｜2019 年 · 全国进口煤炭 · 2018 年第一、二季度进口量（基期和差）](#第-15-题2019-年--全国进口煤炭--2018-年第一二季度进口量基期和差)\n  - [第 16 题｜2009 年 · 某省农林牧渔业增加值 · 四个产业总增加值（基期和差 · 多对象退）](#第-16-题2009-年--某省农林牧渔业增加值--四个产业总增加值基期和差--多对象退)\n- [九、总结提炼](#九总结提炼)\n  - [9.1 本讲知识点总表](#91-本讲知识点总表)\n  - [9.2 速算口诀与解题流程](#92-速算口诀与解题流程)\n  - [9.3 易错点与陷阱清单](#93-易错点与陷阱清单)\n  - [9.4 老师金句](#94-老师金句)\n\n---\n\n## 一、混合定量总纲\n\n> 这一节课我们讲的是**混合定量**。前面的课我们讲了线段混合的定性和一些基本做法，这一节的重点是**定量计算**——就是当定性排不掉选项的时候，我们怎么把这个具体的数算出来。\n\n### 1.1 定性三原则（板书原文）\n\n板书画面（`f_0003`）：\n\n| 分类 | 内容 |\n| --- | --- |\n| **定性** | ①混合后位于两部分**之间** |\n| **定性** | ②**靠近分母大的一侧** |\n| **定量** | ③根据**分母反比**确定线段距离比、确定混合后具体位置 |\n\n> 我们先定性，先确定好在两个增速之间，然后离基期比较大的那一方比较近。\n> 那如果我们光是靠定性，还没有办法把这个答案给它选出来，我们要去精算，把这个增速给它算出来怎么办呢？这就涉及到定量。\n\n### 1.2 定量的两条注意（板书原文）\n\n板书画面（`f_0003`）：\n\n```\n①增速差距 ≤ 20% 时，一般可以用现期比代替基期比先大致估算\n②增速差距 > 20% 时，需要特别注意增速差距带来的影响，必要时通过基期比计算\n```\n\n> 增速的混合，是要用**基期的反比**。但是很多题目它不会直接把基期给你，我们很难有这个基期比，或者我们要去算了，对不对？所以有些时候如果说增速差距不大的时候，我们可以用**现期比**来代替一下，用现期比去适当地代替基期比。\n\n### 1.3 计算原理：分母反比定距离比\n\n板书标注（`f_0010`）：老师在\"**分母反比**\"四个字下面画了两道横线，并圈注了「**基期反比**」（\"反比\"两字加圈），上方批注「**现期**」二字。\n\n> 这是涉及到定量的主要，就是要根据**分母的反比**，就是增速的对应，它基期的反比，确定这个分式混合的**线段距离的比**。从而再从两部分一共有多少的增速差，然后去把它们按照那个比例分下去，就能知道混合后的那个增速的具体位置了。\n\n核心关系（增速场景）：\n\n```\n增速的分母 = 基期值\n距离比 = 分母的反比 = 基期比的反比\n即：若两部分基期比为 a : b，则线段距离（到混合点的距离）比为 b : a\n```\n\n代码块小结：\n\n```\n部分A基期 : 部分B基期 = a : b\n则  A到混合点的距离 : B到混合点的距离 = b : a\n两部分增速差 Δ = r(大) − r(小)\n混合增速 = 一侧增速 ± 按距离占比分到的 Δ 份额\n```\n\n### 1.4 核心争议：现期比能不能代替基期比\n\n> 有时候很多时候是没问题的，因为分式混合的题，它往往**选项的精度要求也不高**。就好比那种平均的增长率，它是一种比较偏\"负荷\"一点的题（转写不清），它不会考虑那种很精确很精确的计算。\n\n> 那什么叫不大呢？其实往常我一般是不会给你们去什么定个性的、定个百分之二十这个量的。只是我这个感觉吧，是我个人的感觉。**硬要说的话，就什么时候能用现期比代替基期比，这是没有一个明确的标准的。**\n\n> 为什么呢？你现期比和基期比的差距，我哪怕就只有百分之一……我觉得这个差距还不够小吗，我怎么不能用现期比去代替基期比呢？**那万一你的选项差距很近呢？**你选项一个是百分之二点一，一个是百分之二点二，然后你两边的增速一个是负的百分之三十和一个正的百分之四十，要你去算到底是二点一还是二点二，那百分之一的影响就会导致你的结果错了，对不对？\n\n> 所以什么时候能代替它，其实没有一个标准的一个结果，没有一个标准的答案，你主要是看**选项到底要你算的多细**，以及你这个现期比跟基期比之间，这个误差到底大概有多少。你要综合地去判断。\n\n⭐ 老师金句：\n\n> **你做题的时候一定要\"误差在心中\"。**就是你拿这个现期比去代替基期比的时候，你只要知道你这个结果大概有几个点的误差，你就不要怕，你先算下去，你算出来这个结果跟选项对比一下，看看你刚刚那个几个点的误差，会不会导致你这个结果可能选错。如果那几个点的误差根本不足以导致你的结果选错，那无所谓。\n\n> 也就好像我这三十跟四十混，如果剩两个选项呢，一个是百分之十，一个是百分之二十，就差那么多了，我这一个点怎么了，我不就无所谓了吗？但是要是我这个误差不是一个点，是三十个点，那就很有影响的对不对？\n\n**初学者经验值（老师建议）**：\n\n| 情形 | 建议 |\n| --- | --- |\n| 两侧增速**直接相减**（即增速差）在 **20 个点以内** | 一般来说问题不会太大，可以用现期比代替基期比 |\n| 增速差在 **20~30 点、30~40 点、40~50 点** | ⚠️ **一定要特别小心**，出题人很容易在那个地方给你设坑 |\n\n> 一般来说这种分式混合的题，你有个十几二十个点的误差，那个比值、基期比有个十几二十个点的误差，往往问题不大。但如果你的增速差距超过 20 的、30~40 个点、40~50 个点，就一定要特别小心，一定要特别小心。\n\n> 此处说的\"差距\"就是**各自的差距**，也就是 `r₁ − r₂`，肯定是各自的差距嘛。你要是都知道混合差距了，那你还算什么呀？怎么可能是各自跟混合增速的差距呢？你现在算的**就是在算这个混合增速**嘛。\n\n> 当然你全把它算成基期比肯定是更没有问题的，但是你那样肯定也更浪费一点时间嘛，有些时候你不需要去算基期比的。\n\n---\n\n## 二、第一部分：增速的混合\n\n### 第 1 题｜2021 年 · 全国电信业务 · 数据及互联网业务总收入增速\n\n**【题干原文】**（画面 `f_0045`，逐字）\n\n> 2021 年全国电信业务实现收入 1.47 万亿元，比上年增长 8.0%，增速同比提高 4.1 个百分点。其中，固定数据及互联网业务实现收入 2601 亿元，比上年增长 9.8%；移动数据及互联网业务实现收入 6409 亿元，比上年增长 3.3%。\n>\n> 2021 年全国数据及互联网业务**总收入**的同比增长率是（　）。\n\n**【材料数据】**\n\n| 项目 | 收入（亿元） | 同比增长率 |\n| --- | --- | --- |\n| 全国电信业务实现收入 | 14700（1.47 万亿） | 8.0% |\n| 固定数据及互联网业务 | 2601 | 9.8% |\n| 移动数据及互联网业务 | 6409 | 3.3% |\n| 数据及互联网业务**总收入** | 2601 + 6409 = 9010 | **待求** |\n\n> 补充信息（干扰项）：全国电信业务增速 8.0%，**增速同比提高 4.1 个百分点**（这是\"增速的变化\"，与本题求解无关）。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 增速混合（A 与非 A）。数据及互联网收入 = 固定数据及互联网 + 移动数据及互联网 |\n| **定位数据** | 固定 2601 亿元、9.8%；移动 6409 亿元、3.3% |\n| **列式** | 混合物在 3.3% ~ 9.8% 之间；距离比 = 基期比的反比 |\n| **速算步骤** | ①定性：位于 3.3% 与 9.8% 之间，且靠近量大的一侧（移动 6409 更大 → 靠近 3.3%）；②定量：现期比 6400 ÷ 2600 ≈ 2.5 倍，即约 `2.5 : 1` ≈ `5 : 2`；③距离比反过来 = `2 : 5`；④总距离 = 9.8% − 3.3% = 6.5%；⑤ 6.5% 按 2 : 5 拆成 7 份，每份 ≈ 0.9%，靠 3.3% 一侧的分得 2 份 = 1.8%；⑥ 3.3% + 1.8% = **5.1%** |\n| **结论** | 混合增速 ≈ 5.1%，选 **B** |\n\n**板书速算还原（画面 `f_0065`）**：\n\n```\n6400 ÷ 2600 = 2.5 倍（不到）\n\n（更精细的写法）(64/26 − 1) = 2.46 倍\n```\n\n```\n距离拆分：\n   3.3%  ├──── 1.8 ────┤──── 4.7 ────┤  9.8%\n                    6.5%（总距离）\n   （板书另写：6.5% ÷ 7 份 = 0.9%/份，3.3% + 2×0.9% = 5.1%）\n```\n\n> 老师原话：\n> 64 除 26 一般都会怎么算呢？两倍多呗，2.5 倍左右。没有人算很细，你见过谁去算这个东西？说算分式混合，还在那边 64 除个 26，这减一上面减二点五上面，大概 61.5 除以 25 等于乘以 4 等于 2.46 倍，会有人这么做吗？不会，因为我说过这种题目它的**精度要求往往不高**。你不要搞这么复杂，你搞这么复杂没有意义，二点五倍不到，对不对？其实我这思想二点五倍都已经算是比较准的了。\n\n**【选项原文】**\n\n- A. 4.5%\n- B. 5.1%\n- C. 6.2%\n- D. 7.0%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 第一步定性：混合增速一定在 3.3% 与 9.8% 之间，因为 6409 > 2601（现期量大、且两边增速差不大时基期也大），所以混合增速**靠近 3.3% 一侧**。\n- 用现期比 6400 : 2600 ≈ 2.5 : 1（= 5 : 2），故距离比 = 2 : 5。总距离 9.8% − 3.3% = 6.5%，拆 7 份，每份 ≈ 0.93%，靠近 3.3% 的一侧分得 2 份 ≈ 1.8%，结果 ≈ 5.1%。\n- 两边增速差只有 9.8% − 3.3% = **6.5 个百分点**，远小于 20 点，所以**用现期比代替基期比是安全的**。\n- A（4.5%）偏小、C（6.2%）偏大、D（7.0%）更偏大，均被排除。\n- **陷阱类型**：概念陷阱。材料里\"增速同比提高 4.1 个百分点\"是干扰信息，与\"两部分混合\"无关；不要把 8.0% 的电信业务整体增速混进来。\n\n> 老师提醒：\n> 就是你看似好像这个选项的差距好像不大，怎么好像才百分之一点一？但你要注意你是怎么做，你是在这个**百分之六点五**里面去拆，你只是把这个六点五拆成了 1.8 和 4.7。\n> 那 B、C 选项呢？你看虽然只差一点一样，但是跟这个比例关系是**天壤之别**的。如果你是 6.2 这个位置，6.2 跟 3.3 差的是 2.9，6.2 跟 9.8 差的是 3.6，你说这种的比例关系，其实差距是非常大的。\n> **分式混合，你不要去光看这个什么选项跟选项说差了什么百分之多少，没有用。你要看的是总距离和他们这个位置代表了两边的比例的一个关系。**\n\n---\n\n### 第 2 题｜2015 年上半年 · 全国水产品 · 非养殖水产品产量变化\n\n**【题干原文】**（画面 `f_0081`，逐字）\n\n> 2015 年上半年全国水产品产量 2700.09 万吨，同比增长 3.20%，其中养殖水产品产量 2114.38 万吨，同比增长 4.13%。\n>\n> 2015 年上半年，**非养殖**水产品产量与上年同期相比的变化最接近以下哪个数字？\n\n**【材料数据】**\n\n| 项目 | 产量（万吨） | 同比增长率 |\n| --- | --- | --- |\n| 全国水产品产量 | 2700.09 | 3.20% |\n| 其中：养殖水产品产量 | 2114.38 | 4.13% |\n| 非养殖水产品产量 | 2700.09 − 2114.38 ≈ 585.71（老师口算取 600 / 2100 / 600） | **待求** |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 增速混合，且是\"已知整体和一部分，求另一部分\"（A 与非 A） |\n| **定位数据** | 水产品整体 2700（3.2%）、养殖 2100（4.13%）、非养殖 ≈ 600 |\n| **列式** | 非养殖增速 = 整体与养殖两部分混合的结果 → 必在 3.2% 与 4.13% 之外（比 3.2% 小） |\n| **速算步骤（法一：现期比）** | ①定性：非养殖增速 \u003c 3.2%，排除 C、D；② 2700 − 2100 = 600，养殖 : 非养殖 = 2100 : 600 = 3.5 : 1 → 距离比 = 1 : 3.5（即 2 : 7）；③右边距离（4.13% − 3.2%）= 0.93% ≈ 1%；④左边距离 = 3.5 × 1% = 3.5%；⑤ 3.2% − 3.5% = **−0.3%** ≈ 0，选 **B** |\n| **速算步骤（法二：代入）** | 把 A（−20%）代入：左边距离 23.2，右边距离 0.9，距离比 ≈ **25 : 1** → 养殖基期是非养殖的 25 倍，而两者现期只有 3.5 倍，太夸张 → A 排除；带 B：0.32 → 左边 3.2、右边 0.93 倍多——两边基期比 3 倍多，与现期比 3.5 倍很接近，**挺合适** |\n| **结论** | 选 **B（0%）** |\n\n**板书速算还原（画面 `f_0100`）**：\n\n```\n      水          养\n    3.2%         4.13%\n  ┌──┴──┐\n -20%  23.2  ÷  0.9  →  25 倍（圈出）\n                         2.5\n（右侧：养殖 2114.38 圈注 → 记作 600／2100）\n```\n\n```\n法一：2700 − 2100 = 600\n      2100 : 600 = 3.5 : 1\n      距离比 = 1 : 3.5  →  写作 2 : 7\n      右边距离 = 0.93% ≈ 1%\n      左边距离 = 3.5 × 1% = 3.5%\n      3.2% − 3.5% = −0.3%  → 选 B\n```\n\n> 老师原话（法一）：\n> 先定性，我们可以直接确定这个非养殖的，它一定比这 3.2% 小，先把 CD 排除。现在我们剩一个 A、剩一个 B。\n> 第二步确定一下它离得近还是离得远，但这个时候第二步其实就没太大用了，因为你不管是零还是负二十，它都远，这两个都远，所以你直接跳过第二步。\n> 那怎么办？我们去看一下量的关系，2700、2100，这儿是 2100，说明非养殖的是 600。那我们先拿这个现期比先算一下，600、2100 是不是 3.5 倍？3.5:1，增量的比就 7:2，说明他们的距离比是 7 比 2，那确定比就是 2 比 7。那右边的距离我有吧，右边的距离是百分之零点九三，除以二是 0.46……其实我写个百分之一就够了。两份是 1%，一份就是 0.5%，那 7 份就是 3.5%。所以左边的距离应该要达到 3.5%，右边的账是 1%，这样才是一个 3.5:1 : 1:3.5 这种关系。\n> 那 3.2 减掉 3.5 就是负的 0.3，所以选择这个 B，就这么做呢，他也能做。\n\n> 老师原话（法二 · 代入）：\n> 有同学说感觉好像有点麻烦了，为什么这个地方就显得麻烦了呢？你现在是不是就剩两个选项了？剩两个选项的时候，你其实很多时候带入一下观察一下……你带个负百分之二十，左边距离 23.2，右边距离 0.9，你这基期比到多少了？到 25 倍了。增速比、这个距离比基本上二十五比一，说明基期比是一比二十五。你这个养殖的基期可能是非养殖的 25 倍吗？你非养殖的限期是多少？限期是 600。25 倍是不是太夸张了？所以这个 A 明显不可能，那只能 B 嘛，你带一个行就选，不行就排呗。\n> 你要是带 B：0.32、4.1，左边 3.2、右边 0.93，倍多吧。你说他们俩的基期比三倍多合不合适？是不是挺合适的呀？**增速差距又不大，现期比三倍多，那基期比也三倍多。**\n> 这个题目你还是在估什么基期比那太麻烦了，没必要。因为有两个明显是陪跑上的，先滚的；那剩下两个呢，又差距很大，或者就是带入进去很明显能排的，你直接去排嘛。**错的给他排掉不就好了，那剩下的不就是对了吗？**\n\n**【选项原文】**\n\n- A. −20%\n- B. 0%\n- C. 5%\n- D. 10%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 定性：非养殖增速必然 **小于** 整体增速 3.2%（因为养殖那一部分增速 4.13% 高于整体），C（5%）、D（10%）直接排除。\n- 定量（现期比法）：养殖 2100 : 非养殖 600 = 3.5 : 1，距离比反之为 2 : 7；右侧距离 0.93% ≈ 1%，左侧距离 = 3.5 × 1% = 3.5%；3.2% − 3.5% = −0.3%，最接近 0%。\n- 定量（代入法）：把 −20% 代入，距离比 23.2 : 0.9 ≈ 25 : 1，对应基期比 1 : 25，与现期 3.5 : 1 完全不相容 → 排除 A。\n- **陷阱类型**：范围陷阱 + 计算陷阱。本题两个选项都在合理区间外（A、B 都\"远\"），必须靠定量区分；不需要算到 0.46% 这么细，写 1% 即可。\n- 老师补充：此题答案正好是 0%，是因为\"非养殖\"这一部分的量相对小，权重低，所以整体增速几乎由养殖决定。\n\n> 老师原话（关于凑整）：\n> 有人问为什么是 7:2？那 1:3.5 不就是 2:7 嘛。我只是有的时候我分数法的话，我习惯把他们凑个整，能凑的我顺手就凑了一下。\n\n---\n\n### 第 3 题｜2020 年 · 互联网业务收入 · 东部地区除五省市外\n\n**【题干原文】**（画面 `f_0117`，逐字）\n\n> 2020 年，互联网业务累计收入居前 5 名的广东、北京、上海、浙江和江苏共完成互联网业务收入 10706 亿元，同比增长 15.1%，增速超过全国平均水平 2.6 个百分点；东部地区互联网业务收入 11227 亿元，同比增长 14.8%。\n>\n> 2020 年，东部地区**除**广东、北京、上海、浙江和江苏**之外**的省市互联网业务收入约比 2019 年：\n\n**【材料数据】**\n\n| 项目 | 2020 年收入（亿元） | 同比增长率 |\n| --- | --- | --- |\n| 东部地区互联网业务收入 | 11227 | 14.8% |\n| 居前 5 名（广东、北京、上海、浙江、江苏）合计 | 10706 | 15.1% |\n| 东部地区除前 5 名之外 | 11227 − 10706 ≈ 521 | **待求** |\n\n> 干扰信息：前 5 名增速\"超过全国平均水平 2.6 个百分点\"——与本题无关。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 增速混合（A 与非 A），已知整体与一部分，求剩余部分增速 |\n| **定位数据** | 东部 11227（14.8%）、前 5 名 10706（15.1%）、剩余 ≈ 521 |\n| **列式** | 剩余部分增速必 **小于** 14.8% |\n| **速算步骤（①现期比）** | ①定性：小于 14.8% → 排除 B（增长 19%）；②现期比：10706 ÷ 521 ≈ **20 倍**；③距离比 = 1 : 20，右边距离 = 15.1% − 14.8% = 0.3%，左边距离 = 0.3% × 20 = 6%；④ 14.8% − 6% = **8.8%**，与选项 A（9%）很近 |\n| **速算步骤（②代入 · 二分法）** | 剩 A（9%）、C（−9%）、D（−19%）三个都\"远\"，取中间值 **−9%** 代入：左边距离 14.8 −（−9）= 23.8，右边距离 0.3，距离比 ≈ **80 倍** → 基期比不可能 80 倍（现期比才 20 倍）→ 说明 −9% 太远，应选更近的 **9%** → A |\n| **结论** | 选 **A（增长 9%）** |\n\n**板书速算还原（画面 `f_0123`、`f_0127`）**：\n\n```\n                东部                剩下\n              11227                521\n              14.8%                 ?\n        ┌──────────┬──────────┐\n      广东…                              两种思路：\n      10706                          ① 现期比\n      15.1%                          ② 代 入\n        └── 0.3% ──┘\n                    0.3% × 20\n        → 6%  →  14.8% − 6% = 8.8%  ≈ 9%\n```\n\n```\n代入法（二分思维）：\n   15.1%              14.8%              −9%\n     └──── 0.3 ────┴──────── 23.8 ────────┘\n   距离比 ≈ 80 倍 → 基期比不可能是 80 倍 → −9% 太远\n   → 该选更近的 +9%\n```\n\n> 老师原话：\n> 这也是个 A 跟非 A 的关系吧，就是一个整体，把其中一部分去掉，剩下的增速。\n> 那首先我们先干嘛？先定性，先确定好，它肯定是小于百分之十四点八的。那像这个 B 就可以排掉了，不可能是这个十九。\n> 那剩下三个呢，好像暂时一下子排不掉，因为剩下的三个都是远的：百分之九、负百分之九、负百分之十九，三个都远。\n> 那现在的业务就是两种正常的思路：一种思路，现期比例先估一下，先试着估一下，看看能不能大概地选出来；第二种思路就是代入。\n> 我先给你们演示一下第一种思路，我们先用现期比估一下……那一万零七百是五百二十一的二十倍吧，这个好简单吧。那现期比是二十倍，说明增速距离是对方的二十分之一，这是百分之零点三的距离。那右边是不是要乘二十？百分之零点三乘二十，不要有人在问我这个二十哪来了啊。\n> `0.3% × 20 = 6%`；`14.8% − 6% = 8.8%`。这不这么好吗？百分之八点八跟百分之九就很近，那跟人家负九啊、负十九啊差那么远，那这个 A 就直接走了嘛，对不对？\n> 为什么还这么正好呢？因为正好是百分之九的话，跟百分之十五点一，它增速差距比较小，那我们刚刚的这个二十倍的现期比它的误差就小，**误差小才会导致算得这么准**。\n\n> 老师原话（代入法 · 为什么要带中间值）：\n> 第二种思路就是代入，这个时候带入你会带哪一个呢？百分之九、负百分之九、负百分之十九，这三个你带哪一个？我会带负百分之九。为啥？在它这个就是一种**二分法**的思维，就是你取这一段的中间去想。因为如果你带这个负百分之九正好，那就它小了，那就上面的；大了，那就下面的。就是做中间，它就比较好判断，到底是左边还是右边还是中间。\n> 好，所以我们带这个负百分之九……你看这边距离是多少？0.3；右边距离是多少？23.8，这得多少倍了？这一下子是不是 80 倍了？我的妈呀，你这个基期比怎么可能八十倍啊？你现期才二十倍啊，你搞了个基期比、搞了个八十倍出来，你这个拉平增速我利率拉多少啊？你哪拉得动那么多呀？不对吧。\n> 说明什么？说明这个负百分之九这个地方太远了。你要太远了，才会导致这个八十倍太大了。那既然负九远呢，我不就该选个近一点的百分之九吗？所以选择 A。\n\n**【选项原文】**\n\n- A. 增长 9%\n- B. 增长 19%\n- C. 减少 9%\n- D. 减少 19%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- 定性：剩余部分增速一定小于整体增速 14.8%，B 排除。\n- 现期比法：10706 : 521 ≈ 20 : 1，距离比 1 : 20；右侧距离仅 0.3%，左侧距离 = 6%；14.8% − 6% = 8.8% ≈ 9%。\n- 代入法（二分）：剩 A/C/D 都\"远\"，取中间值 −9% 代入，得距离比 23.8 : 0.3 ≈ 80 : 1，基期比不可能是 80 倍 → −9% 太远，只能往近的走，选 +9%。\n- 两种思路都很快。此题能算得准，是因为两边增速差小（15.1% − 14.8% = 0.3%），**现期比代替基期比的误差极小**。\n- **陷阱类型**：范围陷阱 + 选项对立陷阱。C、D 是\"减少\"的方向陷阱（诱导忘记定向），A、B 是\"近/远\"的定量陷阱。\n\n---\n\n## 三、第二部分：其他混合\n\n> 板书标题页：`03 其他混合`（画面 `f_0150`）\n>\n> 老师原话：\n> 下一部分是一些其他类型的一些混合。就是除了增速以外，其他的分式不也是可以混合的吗？那我们就来看看其他分式，我们怎么混合，要注意一些什么东西。\n\n### 第 4 题｜2019 年底 · 广东省城镇化率 · 除珠三角九市外\n\n**【题干原文】**（画面 `f_0162`，逐字）\n\n> 截至 2019 年底，广东省常住人口 11521 万人，比上年底增加 175 万人，其中，珠三角九市常住人口为 6447 万人。全省城镇化率（城镇常住人口占常住人口的比重）为 71.4%，同比提高 0.70 个百分点。其中，珠三角九市的城镇化率为 86.28%。\n>\n> 2019 年底除珠三角九市外，广东省其他地区的城镇化率：\n\n**【材料数据】**\n\n| 项目 | 常住人口（万人） | 城镇化率 |\n| --- | --- | --- |\n| 广东省全省 | 11521 | 71.4%（同比提高 0.70 个百分点） |\n| 其中：珠三角九市 | 6447 | 86.28% |\n| 其他地区（差值） | 11521 − 6447 = **5074** | **待求** |\n\n> 干扰信息：常住人口比上年底增加 175 万人；城镇化率同比提高 0.70 个百分点。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | **比率（比重型分式）的混合**。城镇化率 = 城镇常住人口 / 常住人口，分母是**常住人口**（不是基期！） |\n| **定位数据** | 全省 11521 万人（71.4%）、珠三角 6447 万人（86.28%） |\n| **找分母** | 城镇化率的分母 = 常住人口 → 直接找常住人口，**不要去找基期人口**；其他地区人口 = 11521 − 6447 = 5074 |\n| **列式** | 分母比 6447 : 5074 ≈ 1.3 倍（不到）→ 距离比 = 1 : 1.3 |\n| **速算步骤** | ①定性：其他地区城镇化率必 **低于** 71.4%；②左边距离 = 86.28% − 71.4% = 14.88% ≈ 14%；③右边距离 = 14% × 1.3 = 18.2%；④ 71.4% − 18.2% = **53.2%** |\n| **结论** | 在 **50% 至 60% 之间**，选 **C** |\n\n**板书速算还原（画面 `f_0162`、`f_0173`、`f_0174`）**：\n\n```\n       广东              其他\n      71.4%              ?\n     11521            5074（= 11521 − 6447）\n\n       珠三角\n      86.28%\n       6447\n```\n\n```\n6447 : 5074 ≈ 1.3 倍（不到）\n距离比 = 1 : 1.3\n14% × 1.3 = 18.2%\n71.4% − 18.2% = 53.2%   →  在 50% 至 60% 之间\n```\n\n> 老师原话（找分母，不要找基期）：\n> 你看这个问法跟刚刚那个题目是不是其实还是很像的？刚刚的题目问的是除了这几个地区以外的东部地区的其他省市的增速，现在问的不是增速了，是城镇化率。还是一样的吗？就是 A 跟非 A 加起来是整个广东省，只是他把问的那个东西换掉了嘛，他没有问增速嘛，他问的是城镇化率嘛。那既然他还是分式，**它的原理就还是一样的**。\n> 首先我们先定性，它肯定比这个七十一点四要低。那不行，那 ABCD 都是比七十一点四要低。\n> 那定量看远近吧，其实也没什么好看的……我们刚刚增速看远近看的是什么？看的基期谁大谁小，对不对？那这个地方你还看基期吗？\n> **有同学他做这种题目还要问老师，这个地方他没给我基期，我怎么算？**他有什么比？我没有基期比，你说要我去找基期比的，我怎么找不到？\n> 你要你什么时候去找基期比、什么时候就要看基期比？**基期比它是准的**，是增速——为什么增速的时候要看基期比？因为**增速的分母是基期**。那这个地方城镇化率，**它的分母又不是基期**，你找基期干嘛呢？\n> 城镇化率是什么？是城镇常住人口占常住人口的比重，所以**它的分母是所有的常住人口**，城镇和农村的所有常住人口。\n> 我再问一遍，我要不要去算这个基期？我要不要用这个 11521 去减这个 175，减出来什么 11346？我需不需要它？**不要，跟它没关系，跟它没任何关系，你找的就是分母。**\n> 所以珠三角的直接给你了 6447，那其他的最好就用这个 11521 减掉它，`11521 − 6447 = 5074`。\n\n> 老师原话（算距离）：\n> 我们先看什么？看它的比，六千四比这个五千多少倍？一点几倍吧，一点三倍不到吧。那分母比是 1.3 倍不到，说明**距离比要反过来**，对方这个距离是 1.3 倍不到。\n> 我左边的距离是 14%，说明右边的距离就是大概在 `14% × 1.3`。`14 × 1.3 = 18.2`，所以他这边的城镇化率大概是 18.2%。\n> 那 `71.4 − 18.2 = 53.2`，所以在 50 到 60 之间。\n\n> 老师原话（考试不用画）：\n> 考试的时候要不要这么画出来啊？考试的时候不需要，考试我这么画出来，是我怕你不懂。你刚开始的时候，你要把这个关系先想正确了，等你熟悉了之后，就不需要画出来了，你就大概看一看他们的倍数关系，就能把这个东西写出来，然后去做差就和了。\n\n> 老师原话（关于\"带 50\"）：\n> 能不能直接带 50？你带 50 你没什么理由啊，你为什么不带 40 呢？为什么非要带 50 呢？你就那么确定是在这个 CD 之间吗？那不还是要先估吗？那你干嘛不直接估呢？等你熟了之后，你不要每次都画呀，你每次都画，那浪费时间。\n> **又有人在问基期，怎
