期值**（2015 年） |\n| 定位数据 | 限期 30 毫克/立方米，r = −34.8% |\n| 方法选择 | 增速远离 10%、也不靠近 1/n 的整齐值，但 −34.8% ≈ −1/3，仍用**份数思想** |\n| 分数法 | −34.8% ≈ −33.3% = `−1/3`，则 `n − 1 = 3 − 1 = 2`，**减少量 ≈ 现期 ÷ 2 = 15** |\n| 求基期 | `30 + 15 = 45` |\n| 定性判断 | 把 34.8% 当作 33.3% 算 ⇒ 减少量 15 **偏小** ⇒ 基期 45 **偏小** |\n| 修正（提前修正） | 增速 34.8% → 33.3%（少 1.5），现期 30 → 31.5（加 1.5）→ `31.5 ÷ 2 = 15.7` → `30 + 15.7 = 45.7` |\n| 选答案 | **C.46 毫克/立方米** |\n\n画面板书（左：现期修正；右：增速修正）：\n\n```\n30                 （现期，被圈出）\n31.5               （提前修正后的现期：30 + 1.5）\n31.5 ÷ 2 = 15.7\n\n−34.8%             （增速）\n  −1.5\n−33.3 = −1/3\n\n3 − 1 = 2\n\n(15)               （减少量，被圈出）\n```\n\n> （画面另有一处 `15.7 → 45.7` 的结对写法，即 `30 + 15.7 = 45.7`。）\n\n**【选项原文】**\n\n> A. 38 毫克/立方米　　B. 42 毫克/立方米　　C. 46 毫克/立方米　　D. 49 毫克/立方米\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **方法（份数法 + 定性 + 提前修正）**：\n  > 老师原话：\"限期是多少？限期是 30，增速是 −33.8（画面为 −34.8%）。在这个地方，他问基期，你不用管他去问什么基期还是增量，你就告诉我你要去做这个基期或者增量的计算，现在三种方法里面让你挑，你会挑哪一个？——**对，份数嘛，直接约等于负三分之一。所以它的变化量就差不多是限期的二分之一，3 − 1 = 2。15 加起来就 46，加起来 45。**\"\n- **方向别搞反**：\n  > \"然后你是把 34.8 当做 33.3 算的，这个对应的 15 这个减少量是**偏小**的，所以你要让这个 15 稍微**变大**一点点，但大多少大得很有限，**不可能大到 49 这边去的**。\"\n- **修正幅度怎么估**：\n  > \"这个增速才差了 1.5%。你有时候如果这个比例搞不清楚，就想是不是增速才差 1.5%？万用那个基期乘以 1.5% 去加，是不是加不到 49 啊？45 跟 49 差了 4 呢，因为加差不多 10% 呢，所以只能加到 46。\"\n- **提前修正的写法（画面）**：\n  > \"这里限期是 30……增的是负的 34.8%，我们不是把 34.8 变成 33.3 嘛，少了个 1.5，对不对？就少了 1.5，**那这边我就给他（现期）加个 1.5**，这三十跟三十一基本上是一样大的吧。`31.5 ÷ 2`（因为这增速是负的 1/3，3 − 1 = 2），增量是现期的二分之一，除以 2 等于 15.7，那你 30 加个 15.7 等于 45.7，所以选 46。\"\n- **口诀提醒**：\n  > ⭐ \"**看绝对值，你不要晕，你看绝对值就好了。你要把 34.8 变成了 33.3，就是变小了，你要让这个数从 15 变大到多少，就相当于从 33.3 变大到 34，我就要把 15 怎么变大到这个准确的 16 上去。**\"\n  > ⭐ \"**登录（增速）靠近 n 分之一的，你用这个份数（法）绝对是最快的。太快是毫无疑问，但有时候准不准，把他就另说了。**\"\n- 陷阱类型：**无关信息陷阱**（\"优良天数占比 87.5%、提高 6.3 个百分点\"是干扰项）+ **正负号陷阱**（负增长时\"减少量\"要**加**回现期）。\n\n---\n\n### 第 4 题｜2019 年 1-8 月 · 西部地区房地产开发投资增量\n\n**【题干原文】**\n\n> 2019 年 1-8 月，东部地区房地产开发投资 44857 亿元，同比增长 8.8%，增速比 1-7 月回落 0.4 个百分点；中部地区投资 17809 亿元，增长 9.8%，增速加快 0.3 个百分点；西部地区投资 18506 亿元，增长 16.0%，增速加快 0.9 个百分点；东北地区投资 3418 亿元，增长 9.7%，增速回落 1.3 个百分点。\n> 2019 年 1-8 月，西部地区投资比去年同期增加约（　）亿元。\n\n**【材料数据】**\n\n| 地区 | 2019 年 1-8 月投资额（亿元） | 同比增长率 | 增速变化 |\n|---|---|---|---|\n| 东部地区 | 44857 | 8.8% | 比 1-7 月**回落 0.4** 个百分点 |\n| 中部地区 | 17809 | 9.8% | 增速**加快 0.3** 个百分点 |\n| **西部地区** | **18506** | **16.0%** | 增速**加快 0.9** 个百分点 |\n| 东北地区 | 3418 | 9.7% | 增速**回落 1.3** 个百分点 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**同比增量** |\n| 定位数据 | 西部地区，现期 18506 亿元，r = 16.0% |\n| 方法选择 | 16.0% 非常靠近 16.7% = `1/6`，用**份数思想** |\n| 分数法 | 直接 `18506 ÷ 7`，画面竖式得 **2643**（正好等于选项 B！） |\n| 定性判断 | 实际 16.0% **小于**假想的 16.7% ⇒ 实际增量 **小于** 2643 |\n| 修正幅度 | `0.7 / 16.7 ≈ 4.2%` ⇒ 减约 4% ⇒ `2643 × (1 − 4%) ≈ 2552` |\n| 选答案 | **C.2552** |\n\n画面板书（竖式）：\n\n```\n18506 ÷ 7 = 2643\n      2643\n  7 ) 18506\n      14\n       45\n       42\n        30\n        28\n         20\n\n16.7% → 2643\n16%   → ？   （下面写 164 / 16，意思是减 4%）\n\n18506/7 = 2640          （画面另一处写 2640）\n```\n\n**【选项原文】**\n\n> A. 2812　　B. 2643　　C. 2552　　D. 2313\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **这是本集的\"经典陷阱题\"**：\n  > 老师原话：\"那这个地方我们还是用分数法吧，因为增速百分之十六，它是非常靠近六分之一的。所以我们就直接限期除以七……185 除以 7，**算下它的增量，就大概是 2640 左右**。\"\n  > \"**但是这时候你说你能选这个 B 吗？能不能选这个 B？这就是个很经典的陷阱呢！**你除了七发现正正好好这个数跟这个 B 选项正巧呢，我看它这 2643，它真的是一点不差。你看四七二十八，我再往后算一点，正好是算到 2643，**它就给你放在这了，它就是专门等着你跳进来的**。\"\n- **正确做法**：\n  > \"肯定不能用 2643，因为你的增速是 16%，比你假想的那个 1/6、那个 16.7% 要**小**。所以你要选一个比 2643 稍微小那么一丢丢的。\"\n- **排除 D 的依据（比例思维）**：\n  > \"2552 也不可能小到这个 2313 这边来的。因为他们这个差距没有那么大。就好像一个 16.7，它对应 2643，那 16 它应该对应多少？不可能到 2313，因为 2313 跟 2643 之间差了有 300 多，差了有 10%。**你说这个 16.7 跟 16 能差 10% 那么多吗？是不是差不了那么多？他们俩只差了大概百分之四到百分之五左右。**\"\n- **修正幅度怎么算出来**：\n  ```\n  0.7 ÷ 16.7 ≈ 4.2%\n  2643 × 4% ≈ 100\n  2643 − 100 ≈ 2552\n  ```\n  > 老师原话：\"减个大概百分之四、百分之五的样子就行了。因为这零点七占这个十六点七的百分之一，不就一点六嘛，一点六乘以几大概是零……大概是七啊，整个五不到嘛，四点几嘛，那就差个百分之四嘛。`0.7/16.7`，百分之 4.2，这么来的。\"\n  > \"**这个比你感觉有个感觉呗。知道怎么调了没？减个大概百分之四、百分之五的样子就行了。**\"\n- 陷阱类型：**\"答案陷阱\"（正算值恰好是错误选项）** + **概念陷阱**（16% 与 16.7% 的大小方向）。\n- 老师定调：\"**登录（增速）靠近 n 分之一的，你用份数绝对是最快的，毫无疑问。**\"\n\n---\n\n### 第 5 题｜2021 年 1-9 月 · 我国机床工具对美国出口额\n\n**【题干原文】**\n\n> 从出口去向来看，2021 年 1～9 月出口去向前三位分别是：美国 17.5 亿美元，同比增长 27.4%；越南 10.5 亿美元，同比增长 35.4%；印度 8.8 亿美元，同比增长 67.8%。\n> 2021 年 1～9 月，我国机床工具对美国出口额同比约增长多少亿美元？\n\n**【材料数据】**\n\n| 出口去向 | 出口额（亿美元） | 同比增长率 |\n|---|---|---|\n| **美国** | **17.5** | **27.4%** |\n| 越南 | 10.5 | 35.4% |\n| 印度 | 8.8 | 67.8% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**同比增量** |\n| 定位数据 | 美国：现期 17.5 亿美元，r = 27.4% |\n| 方法选择 | 27.4% 靠近 25% = `1/4`，用**份数思想 + 提前修正** |\n| 提前修正 | 增速 27.4% → 25%（调小）；现期 17.5 调大约 10% → **19** |\n| 分数法 | `19 ÷ (4+1) = 19 ÷ 5 = 3.8` |\n| 备选（不修正） | `17.5 ÷ 5 = 3.5`，偏小，往上抬一点 → 3.8 |\n| 选答案 | **D.3.8** |\n\n画面板书：\n\n```\n17.5   ↑ +10%  →  19\n27.4%  ↓        →  25% = 1/4\n\n19/5 = 3.8\n\n17.5/5 = 3.5   （被圈出）\n\n选项 D.3.8 被勾选，题号左侧写 D\n```\n\n**【选项原文】**\n\n> A. 1.9　　B. 2.3　　C. 3.1　　D. 3.8\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **思路**：\n  > 老师原话：\"那限期 17.5%，增速 27.4%（画面为 17.5 亿美元、27.4%）。这里算基期，或者说算增量。我们要根据这个增速，比较靠近 25%，我们就用份数法。**那百分之二十五，我能不能顺手把这个地方（现期）调一下？**\"\n- **提前修正（第一种方案）**：\n  > \"这个调就跟你做什么除（法）放缩、乘法放缩是一样的。你可以看倍数，也可以看比例。**你把 27.4 变成了 25，基本上就少了个 10%；我把这边（现期）也加了 10%，19。**19 这是 1/4 增量，就是 `19 除以 5 = 3.8`。\"\n- **不修正（第二种方案）**：\n  > \"或者你也可以，我就先除，因为我觉得除以五，你这 17.5 除以 5 也好，等于 3.5。**那 3.5 它是偏小的，我要往上涨一点，3.8，对，也可以。两种方案都可以，也就纯看你想不想把它凑到个整而已。**\"\n- **核心心法**：\n  > ⭐ \"**你要是记得这张（方法），反正要调高，你可以在过程中调，也可以在结果上调，在哪调都可以，就是主打一个字——灵活。跟放缩的原理是一样的，就跟乘法放缩是一样的。**\"\n- **误差容忍度**：\n  > \"不要担心误差大，因为分数（法），我说了，就是你不要用在那种选项差距很小的情况下，它本来就是用来快算估算的。\"\n- 陷阱类型：**近义词干扰**（材料还给了越南、印度两组数，都是干扰项）+ **单位一致**（亿美元→亿美元）。\n\n---\n\n### 第 6 题｜2019 年第一季度 · 131 家证券公司代理买卖证券业务净收入\n\n**【题干原文】**\n\n> 2019 年第一季度，131 家证券公司代理买卖证券业务净收入（含席位租赁）221.49 亿元，同比增长 13.77%。\n> 2018 年第一季度，131 家证券公司代理买卖证券业务净收入（含席位租赁）约为：\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 时间 | 2019 年第一季度 |\n| 公司数量 | 131 家证券公司 |\n| 代理买卖证券业务净收入（含席位租赁）（现期） | 221.49 亿元 |\n| 同比增长率 | 13.77% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**基期值** |\n| 关键判断 | \"**他虽然说算的是一个基期，但是我们到底是算增量还是算基期，是根据这个增速的特点来的**\"——只要增速符合化除为乘或分数法，就先把增量估出来再去减 |\n| 定位数据 | 限期 221.49 亿元，r = 13.77% |\n| 方法选择 | 13.77% 靠近 14.3% = `1/7` |\n| 提前修正 | 增速 13.77% → 14.3%（调大）；现期 221.49 → **210**（调小，约减 11） |\n| 分数法 | `210 ÷ (7+1) = 210 ÷ 8 = 105 ÷ 4 = 26.25 ≈ 26` |\n| 求基期 | `221 − 26 = 195` → 选 **C.194.7 亿元** |\n\n画面板书：\n\n```\n221.49  ↓ −11  →  210\n\n13.7  +6  →  14.3  = 1/7\n\n210/8 = 105/4 = 26\n\n221\n 26\n194.7\n```\n\n**【选项原文】**\n\n> A. 184.6 亿元　　B. 190.1 亿元　　C. 194.7 亿元　　D. 204.2 亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **先判断\"求什么\"**：\n  > 老师原话：\"这里问：2018 年它是多少？就是问基期问题。它的限期是 221.49，增速是 13.77%。**他虽然说算的是一个基期，但是我们到底是算增量还是算基期，是根据这个增速的特点来的**——只要这个增速符合化除为乘或者说分数法，我们就先把增量估出来再去减就好了。\"\n- **定分数 + 提前修正**：\n  > \"那这个地方十三点七七，我们可以把它往哪放？比较近的是不是 14.3？它相对比较近吧。**我们现在是不是把这个增速调大了一点？那现期我们就对应调小一点吧。**我们把它想成 13.7 变成了 14.3，加了个 6（即 +0.6）。那这边（现期）减个八、减个九、减个十一，甚至都行，**我就拿二百一可不可以？**\"\n- **计算**：\n  > \"`21 ÷ 8` 等于这个，你就稍微除一下吧，也就 `105 ÷ 4`，等于 **26.25**。26 左右，所以它的基期就是 `221 − 26 = 195`。\"\n- **不必再精修**：\n  > \"**那这个地方你就不用去给它调的很细，因为这本身你就动的不多，动的不多，误差影响就很小，不用算的那么细，这个跟放缩就是一样的。**\"\n- 陷阱类型：**时间陷阱**（问 2018 年，要用 2019 年数据倒推）+ **净收入口径**（\"含席位租赁\"是括号备注，不要漏读）。\n\n---\n\n### 第 7 题｜2017 年 · 某市服务业小微样本企业缴纳增值税\n\n**【题干原文】**\n\n> 2017 年某市调查总队对全市服务业小微企业的抽样调查显示，2017 年全市服务业小微样本企业缴纳增值税 2.3 亿元，比上年增长 11.6%。\n> 2017 年该市服务业小微样本企业缴纳增值税比上年增加：\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 年份 | 2017 年 |\n| 缴纳增值税（现期） | 2.3 亿元 |\n| 比上年增长 | 11.6% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**同比增量**（\"比上年增加\"） |\n| 定位数据 | 限期 2.3 亿元，r = 11.6% |\n| 方法选择 | 11.6% 靠近 11.1% = `1/9`，用**份数思想 + 提前修正** |\n| 提前修正 | 增速 11.6% → 11.1%（−0.5 个百分点）；现期 2.3 → **2.4**（+0.1） |\n| 分数法 | `n = 9` ⇒ `2.4 ÷ (9+1) = 2.4 ÷ 10 = 0.24` |\n| 选答案 | **C.0.24 亿元** |\n\n画面板书：\n\n```\n2.3   11.6%\n +1     −5\n2.4   11.1%\n\n9 + 1 = 10\n\nΔ = 2.3/10 = 0.23\n\n 2.4\n ────  = 0.24\n  10\n\n0.24\n −5%\n0.23\n```\n\n**【选项原文】**\n\n> A. 0.11 亿元　　B. 0.15 亿元　　C. 0.24 亿元　　D. 0.34 亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **定分数**：11.6% 最靠近 `1/9`（11.1%），所以 `n = 9`，`n + 1 = 10`。\n- **提前修正（画面）**：\n  ```\n  增速：11.6% → 11.1%（−0.5 个百分点，即画面写的\"−5\"）\n  现期：2.3   → 2.4  （+0.1，即画面写的\"+1\"）\n  ```\n  > 老师原话（讲\"再举一个例子\"时）：\"本来是 2.3、11.6 的，我们把它看成了一点一（11.1%）……这边减了个 5，这个地方我给他加个（0.1），`2.4 除以 10` 等于 **0.24**。\"\n- **结果**：`Δ = 2.4 ÷ 10 = 0.24` 亿元 → **C**。\n- **验证**：不用分数法直接算 `2.3 × 11.6% ÷ 1.116 = 0.2668 ÷ 1.116 ≈ 0.239` 亿元，与 0.24 完全吻合。\n- 陷阱类型：**量级陷阱**（A.0.11 恰是\"11.6% 的一半\"左右的错误量级；B.0.15、D.0.34 为干扰量级）+ **\"增值税\"口径**（材料说的是\"缴纳增值税\"，不是营业税）。\n\n---\n\n## 五、本讲知识点总表\n\n| 模块 | 内容 | 要点 |\n|---|---|---|\n| 分数法·修正公式 | `实际Δ ≈ 算Δ + 算Δ × ((r − 1/n)/(1/n))` | 判断方向的依据：`r > 1/n` ⇒ 实际Δ > 估算Δ |\n| 分数法·\"零误差\"式 | 上式的修正项**再除 `(1+r)`** | 只在\"想弄明白原理\"时用，考场上**不用** |\n| 修正公式推导 | 两个增量做差→通分→提公因式 | `= (现期×r₂)/(1+r₂) × (r₁−r₂)/r₂ / (1+r₁)` |\n| 提前修正（过程修正） | 增速与现期**反方向**同步调 | 增速调大→现期调小；增速调小→现期调大 |\n| 提前修正的宗旨 | **凑整** | \"不是为了真的去调它，是为了凑整\" |\n| 三板斧·适用范围 | 增速 ≤10% → 化除为乘；增速 ≈ 1/n → 分数法；都不沾 → 放缩 | 差一两个点、两三个点内才算\"靠近\" |\n| 三板斧·优缺点 | 化除为乘：又快又准（范围窄）／分数法：最快（算不准）／放缩：精准（不够快） | 三者注意点都是\"凑整为主\" |\n| 增量/基期的选择 | \"算增量还是算基期，是根据增速的特点来的\" | 增速适合分数法，就先估增量再减出基期 |\n| 假设代入 | 先假设一个增量，倒推现期，再乘增速验证 | 专治\"选项特别近\" |\n| 结果修正 vs 过程修正 | 整就直接算完再调；不整就调完再算 | \"怎么快怎么来\" |\n\n---\n\n## 六、速算口诀与解题流程\n\n**口诀**\n\n```\n增速小十（≤10%）  →  化除为乘\n增速近 n 分之一    →  份数思想\n两者都不沾         →  放缩法\n\n分数法三句：\n  找分数（1/n） → 判断大小（r 与 1/n 谁大） → 反方向凑整\n\n提前修正两句：\n  增速调大，现期调小\n  增速调小，现期调大\n\n方向口诀：\n  正增速算绝对值要「减」，负增速算绝对值要「加」——别搞反！\n```\n\n**标准解题流程（求增量 / 求基期）**\n\n```\n第一步  读增速 r，判断用哪一\"斧\"\n        ├ r 或变化率 ≤ 10%      → 化除为乘\n        ├ r ≈ 1/n（差 1~3 个点） → 份数思想\n        └ 都不沾                → 放缩法\n\n第二步  （份数法）把 r 写成 1/n，先顺手判断现期能不能凑整\n        ├ 能凑整 → 提前修正（r 与现期反方向调），再算\n        └ 不能整 → 直接算，算完在结果上调\n\n第三步  算增量\n        正增速：Δ ≈ 现期 ÷ (n+1)\n        负增速：变化量 ≈ 现期 ÷ (n−1)，基期 = 现期 + 变化量\n\n第四步  定性定方向\n        r 调大了 → 算出的增量偏大 → 基期偏小 → 往大选\n        r 调小了 → 算出的增量偏小 → 基期偏大 → 往小选\n\n第五步  对照选项；若选项特别近 → 改用「假设代入」或「放缩」\n```\n\n---\n\n## 七、易错点与陷阱清单\n\n| # | 陷阱 / 易错点 | 说明 | 本集对应 |\n|---|---|---|---|\n| 1 | **\"算出来的数正好是选项\"** | 用 16.7% 算 18506÷7 = 2643，正好是 B 选项，\"它就是专门等着你跳进来的\" | 第 4 题 |\n| 2 | **方向搞反** | 增速被调大 ⇒ 增量偏大 ⇒ 基期偏小，选大的；反之选小的 | 第 2、4 题 |\n| 3 | **负增长时加减搞反** | 负增速时\"变化量\"要**加回**现期才是基期 | 第 3 题 |\n| 4 | **时间陷阱（隔年）** | 问 2019 年要用 15.9%（比 2019 年增长），不是 10.9%（同比） | 第 2 题 |\n| 5 | **无关信息干扰** | \"优良天数占比 87.5%、提高 6.3 个百分点\"与 PM2.5 浓度无关 | 第 3 题 |\n| 6 | **多组并列数据干扰** | 出口去向给了美/越/印三组，只取美国 | 第 5 题 |\n| 7 | **过度追求精度** | 分数法不是精算，90% 精度只需一分力，99.9% 精度要十成力 | 衔接回顾、全课 |\n| 8 | **在结果上死抠误差** | \"绝大多数时候、99% 的情况下都没必要\"再除 `(1+r)` | 第 2 题 |\n| 9 | **凑整凑过头** | 930 这种\"本身就比较整\"的数，就不要硬凑；\"胆子太大，误差就太大了\" | 第 2 题（提前修正演示） |\n| 10 | **单位为 0.1 的凑整** | 2.3 → 2.4 是\"+1\"（即 +0.1）；11.6% → 11.1% 是\"−5\"（即 −0.5 个百分点） | 第 7 题 |\n\n---\n\n## 八、老师金句\n\n> ⭐ \"分数法，我建议大家就是把它当做**快速的估算**，千万不要把分数法当做**精算**。如果你用来精算的话，得不偿失。\"\n\n> ⭐ \"你只要花**一分的力**，你就可以算出来**百分之九十的精准度**；但是如果你想把它变成**百分之九十九点九**的精准度，你需要花**十成的力**，太不划算了。\"\n\n> ⭐ \"**增速调高了，现期对应调小一点，凑个整；增速调低了，现期就对应的扩大一点，凑个整。**\"\n\n> ⭐ \"核心目标就是一个词——**凑整**。只要整你就不要去调，你算完了再调；如果不够整就先调，调整了再算。**怎么快怎么来。**\"\n\n> ⭐ \"**要调高，你可以在过程中调，也可以在结果上调，在哪调都可以，就是主打一个字——灵活。**\"\n\n> ⭐ \"**你应该先判断，先定性，先判断大小。**\"\n\n> ⭐ \"看**绝对值**，你不要晕，你看绝对值就好了。\"\n\n> ⭐ \"**这就叫经典的陷阱——它就给你放在这了，它就是专门等着你跳进来的。**\"\n\n> ⭐ \"前面两个（化除为乘、分数法）等你念熟了之后，特定的情况你是**根本不需要去动笔**的，你口算就能算出来。\"\n\n> ⭐ \"三板斧。两边都不沾，不就放缩吗？我总共也讲了三种方法呀——增速小化除为乘，增速靠近 n 分之一分数法，两个都不沾，那他们俩都不用，那我就用放缩呗。放缩它本质上也就是一种直除，或者说直接乘的一个省时替代而已。**不存在什么打不打架，没有什么打架的东西。**\"\n\n> ⭐ \"我随便说一下这个式子怎么来的……**这个部分你想听可以听，不想听你直接可以不听。**\"\n\n> ⭐ \"**这个（修正的最后一步）你上到考场你是用不到的**，但我就在这边讲一下，因为不然你以后用到分数法的时候，你会有疑惑……那个东西我拿出来，主要还是为了**去解惑**。有的人他学这个东西学的一知半解的，容易出问题。\"\n\n> ⭐ \"**分数法的优点是快，太快了**；放缩法的优点是**精准**；化除为乘的优点是**又快又准**——缺点吧，我暂时还没想出来，硬要说缺点，可能就是适用范围有点窄。\"\n\n---\n\n## 附录：画面出现但本集未展开讲解的题目\n\n> 说明：本集第 6 帧（约 40 秒处）画面出现下列题目，停留约 8 秒，**板书无任何批注，转写中也无对应讲解内容**，故仅照录画面原文备查，不做解法推断。\n\n**【画面原文】**\n\n> 《2017 年全国科技经费投入统计公报》数据显示，2017 年我国科技经费投入总量为 17606.1 亿元，比上年增长 12.3%。\n> 2017 年，我国科技经费投入比上年增加（　）亿元\n\n> A. 1302　　B. 1557　　C. 1766　　D. 1928\n\n（注：该题画面仅出现一次，老师在本集中未讲解，故不列入例题精讲。）\n","outline":[{"level":2,"text":"一、开篇：分数法的\"修正\"——为什么老师说\"用的不多\"","id":"一开篇分数法的修正为什么老师说用的不多"},{"level":3,"text":"1.1 修正公式回顾（板书）","id":"11-修正公式 98%→22.22% = 2/9`、`15.19→15.7`、`9+2=11`） |\n| `g_011.jpg` | f_0091 – f_0099 | 第 3 题 `31.4/11 ≈ 2.85` + 第 4 题题干 |\n| `g_012.jpg` | f_0100 – f_0108 | 第 4 题（`1262×6.4%/1.064`、`6.4−6.4×6.4 = 0.4%`、`126×6%`、`756`） |\n| `g_013.jpg` | f_0109 – f_0117 | 第 5 题（`17.5 +1.7 → 19`、`27.4%→25%=1/4`） |\n| `g_014.jpg` | f_0118 – f_0126 | 第 5 题收尾（`Δ = 19/5 = 3.8`、`18 → 3.6`）+ 第 6 题题干 |\n| `g_015.jpg` | f_0127 – f_0135 | 第 6 题（`128/9`、`1408 +14 → 1422`）+ 第 7 题题干 |\n| `g_016.jpg` | f_0136 – f_0144 | 第 7 题（`32×4.7 → 30×50 = 1500`、`32189−1500=30689`） |\n| `g_017.jpg` | f_0145 – f_0153 | 第 7 题收尾（选项差距 `800 / 1400`）+ 第 8 题（`3460×2% = 70`） |\n| `g_018.jpg` | f_0154 – f_0162 | 第 9 题（表格 + `582 / 52.4%`、`600 / 50% = 1/2`） |\n| `g_019.jpg` | f_0163 – f_0171 | 第 9 题（`Δ = 600/3 = 200`、`600−200` vs `582−200` 对比） |\n| `g_020.jpg` | f_0172 – f_0180 | 第 10 题（柱状图 + `r = 增/基 = 2.37/1.43 = 2.37×7`） |\n| `g_021.jpg` | f_0181 – f_0189 | 第 10 题补充（`现/基 = 1+r = 3.8/1.43`）+ 第 11 题题干 |\n| `g_022.jpg` | f_0190 – f_0198 | 第 11 题法一（`−16.6% ≈ −1/6`、`6−1=5`、`Δ = 19/5 = 3.8`、`22.8 / 19`） |\n| `g_023.jpg` | f_0199 – f_0207 | 第 11 题法二（`21 = 19/(1−16%) = 23`、`23/22 = 1/(1−16%) = 1/0.84 ≈ 1.2`） |\n| `g_024.jpg` | f_0208 – f_0216 | 第 12 题题干（1 月 / 2 月 / 1-2 月三段材料） |\n| `g_025.jpg` | f_0217 – f_0225 | 第 12 题定位（`3927.9 + 5780.5 = 9708`、`−4.7%`） |\n| `g_026.jpg` | f_0226 – f_0234 | 第 12 题收尾（`9708 × −5% = −485`、`10193`，圈 C） |\n| `g_027.jpg` | f_0235 – f_0239 | 第 13 题（`61.5→60`、`4.35%→4.5%`、`60×4.5% = 2.7`，圈 B） |\n\n> 换算规则：第 m 张网格 `g_{m:03d}.jpg` 的第 k 格（左→右、上→下）= `frames\\f_{9*(m-1)+k:04d}.jpg`。\n\n---\n\n## 本集核心方法论：算增量还是算基期？\n\n老师在**第 1 题开篇**先把\"基期计算\"的两种思路完整过了一遍，这是整集的纲：\n\n> \"基期计算一般会给我们一个**现期**、给我们一个**增速**。那计算基期呢，我们主要是要掌握**两种思路**：\n> 一种思路是 **基期 = 现期 ÷ (1 + 增速)**；\n> 还有一种是 **基期 = 现期 − 增量**。\n> 然后我们到底选择哪种思路，主要就是看**这个增量好不好估**。\n> 如果这个增量好估，很明显**减法比除法要来得快**。\n> 如果这个增量没有那么好估，容易估得不准、或者说估得比较慢，那可能你就更适合用上面这种方式，直接算一个除法，用**放缩**算一下就好了。\"\n\n```\n思路一（除法）：基期 = 现期 ÷ (1 + r)\n思路二（减法）：基期 = 现期 − Δ      其中 Δ = 现期 × r ÷ (1 + r) ≈ 现期 × r（小 r 时）\n```\n\n> \"看增量好不好估，我们就看它的**增速**。如果它的增速很适合用**百化分**、或者说**分数法**这种很特殊位置的增速，你算它的增量非常快，只要你掌握熟练之后，估起来是非常快的。**增量估得快了，你这个基期减下来出来就快了。**\"\n\n**本集\"增速 → 方法\"选择表**（老师逐题现场演示的对应关系）：\n\n| 增速特征 | 首选方法 | 本集对应题 |\n|---|---|---|\n| `r ≈ 1/4、1/2、1/7、1/8` 等百化分特殊值 | 分数法（份数法）直接出增量 | 第 2、3、5、6、9、11 题 |\n| `|r| \u003c 10%`（尤其 6%～7% 这种\"能提前修正\"的位置） | 化除为乘估增量，再减 | 第 1、4、7、8、12、13 题 |\n| 增速本身很小（1%～5%） | 化除为乘，甚至直接\"现期 × 增速\" | 第 7、8 题 |\n| 算增速（不是算增量） | 优先用 `现期 ÷ 基期 = 1 + r`，保留整数 | 第 10、11 题 |\n\n> ⭐ **老师的核心提醒**：\"我们在算基期、算增量的时候，大家就一定要记得我们是**根据它的增速的特点去选择的**。如果它的增速适合**化除为乘**跟**分数法**比较快，那就直接去估增量再去做处理；如果不太适合用这两个方法，就去用**放缩**，就直接算基期。\"\n\n---\n\n## 例题精讲\n\n### 第 1 题｜2021 年数据 · 城市供水总量基期\n\n**【题干原文】**\n\n> 1.2021 年，全国城市供水总量 673.34 亿立方米，同比增长 6.96%；城市供水管道长度 105.99 万公里，同比增长 5.26%；人均日生活用水量 185.03 升；供水普及率 99.38%，比上年增加 0.39 个百分点。\n>\n> 2020 年，全国城市供水总量约为：\n> A.600 亿立方米　B.620 亿立方米　C.630 亿立方米　D.724 亿立方米\n\n**【材料数据】**\n\n| 指标 | 2021 年数值 | 同比增速 |\n|---|---|---|\n| 全国城市供水总量 | 673.34 亿立方米 | 增长 6.96% |\n| 城市供水管道长度 | 105.99 万公里 | 增长 5.26% |\n| 人均日生活用水量 | 185.03 升 | — |\n| 供水普及率 | 99.38% | 比上年增加 0.39 个百分点 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 已知现期 + 增速，求基期（**基期计算**） |\n| 定位数据 | 现期 `673.34`（≈673）亿立方米，`r = 6.96%`（→ 7%） |\n| 方法选择 | 增速 6.96% 属于\"低增速、可提前修正\"，走**减法路线**：基期 = 现期 − 增量 |\n| 列式 | `Δ ≈ 现期 × r = 673 × 6.96%` |\n| 速算步骤 | ① 分母化整：`670 × 7%`；② `67 × 7 = 469` → `Δ ≈ 46.9 ≈ 47`；③ `673 − 47 = 626`；④ **误差修正**：用现期代替基期使 Δ 偏大 7% → 结果偏小，须取一个比 626 大的数；⑤ `47 × 7% ≈ 3.4`（板书用 `50 × 7% = 3.5` 口算），`626 + 3.4 = 629.4` |\n| 结论 | 最接近 **C.630 亿立方米** |\n\n**【速算演示】**（画面板书）\n\n```\n基 = 现 ÷ (1 + r)\n基 = 现 − Δ\n\nΔ = 基 × r  →（用现期代替基期）→  Δ = 现 × r\n\n673 × 6.96% = 670 × 7%\n67 × 7 = 469   →   Δ ≈ 46.9 ≈ 47\n\n673 − 47 = 626      ←（板书在 626 上划掉：这样直接选 C 有问题）\n误差方向：673 用的是\"现期\"，比真正的基期大 7%\n         → 乘出来的 47 偏大\n         → 减掉的数变大\n         → 结果偏小（板书标\"小\"）\n要选一个比 626 偏大的数\n\n多减的部分补回来：47 × 7% ≈ 3.4（板书 50 × 7% = 3.5 口算）\n626 + 3.4 = 629.4   →  C.630\n```\n\n**【选项原文】**\n\n- A.600 亿立方米\n- B.620 亿立方米\n- C.630 亿立方米\n- D.724 亿立方米\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 老师在题干上只圈了两个数：`673.34`（现期）和 `6.96%`（增速），其余指标（管道长度、人均用水量、普及率）都是**干扰信息**（范围陷阱）。\n- **本题的坑不在算，而在\"误差方向\"**。老师原话：\n  > \"肯定有同学说，老师，你说选离 626 最近的 630，那要是万一我算偏了一点，算到 625 上，那我左右不就是不知道选 B 还是选 C 了吗？\n  > 所以其实这个地方，你写下 626 的时候，你直接这样根据最近去选 C 选项，**其实是有问题的**。因为你的计算过程中是有一部这种天生带有误差的处理——你把基期换成了现期，它本身就带有误差，这个误差你在脑海中**一定要记得**。\"\n- 误差链条（老师完整推导）：\n  > \"你算的这个 47 它是**偏大**的，这个 673 是比它本来应该作为乘法里面的那一步的基期要大 7% 的。现期比基期大 7%，就会导致你乘下来得到的这个增量 47 也是大了 7%。**你减的数变大了，就会导致你最后算出来的数变小了**。\"\n  > \"但不是说它小 7%，这时候就要看**量**了。因为它们经过了一个减法的处理。所以我们要选一个比 626 大一点的数，所以选择 C 选项 630。\"\n- 补偿量的口算：\n  > \"多减了多少？7 个点，47 的 7 个点是 3 点几，50 乘以 7% 嘛，三点五左右，三点四的样子吧。三点四加 626 就是 629.4，就跟 630 差不多了吧。\"\n- **陷阱类型**：① 概念陷阱（把\"增量 = 基期 × 增速\"里的基期直接用现期代替）；② 误差方向陷阱（减法放大误差 → 必须往反方向修正）；③ 范围陷阱（材料里其余三个指标与本题无关）。\n\n---\n\n### 第 2 题｜2020 年数据 · 实物商品网上零售额增量\n\n**【题干原文】**\n\n> 2.受疫情影响，2020 年全国社会消费品零售总额 391981 亿元，同比下降 3.9%，居家消费需求明显增长，\"宅经济\"带动新型消费模式加快发展。2020 年，全国网上零售额比上年增长 10.9%，增速比前三季度加快 1.2 个百分点。其中实物商品网上零售额增长 14.8%，占社会消费品零售总额的比重为 24.9%。\n>\n> 与 2019 年相比，2020 年全国实物商品网上零售额约增长（　）万亿元。\n> A.1.26　B.2.26　C.3.26　D.4.26\n\n**【材料数据】**\n\n| 指标 | 数值 / 增速 |\n|---|---|\n| 全国社会消费品零售总额（2020 年） | 391981 亿元（= 39.1981 万亿） |\n| 社会消费品零售总额同比 | 下降 3.9% |\n| 全国网上零售额同比 | 增长 10.9%（增速比前三季度加快 1.2 个百分点） |\n| 实物商品网上零售额同比 | 增长 14.8% |\n| 实物商品网上零售额占社会消费品零售总额比重 | 24.9% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量**（但不是直接给现期，要先算现期） |\n| 定位数据 | 总量 `391981` 亿元、占比 `24.9%`、增速 `14.8%` |\n| 方法选择 | 增速 14.8% 贴近百化分 `1/7 = 14.3%` → 走**分数法（份数法）** |\n| 列式 | 现期 = 总量 × 比重；Δ = 现期 ÷ (7 + 1)（因为 `r = 1/7`） |\n| 速算步骤 | ① `39 万亿 × 24.9%` → 把 24.9% 凑成 `25% = 1/4`（因 39.1981 已提前缩成 39，误差已抵掉）；② `39 ÷ 4 = 9.75`（万亿元）；③ 把 `9.75` 往上调成整 `10`，把 `14.8%` 往下调成 `14.3% = 1/7`；④ 增速 1/7 → 基期 7 份、增量 1 份、现期 8 份；⑤ `Δ = 10 ÷ 8 = 1.25` |\n| 结论 | 最接近 **A.1.26 万亿元** |\n\n**【速算演示】**（画面板书）\n\n```\n先求现期：实物商品网上零售额 2020 年\n   39 万 × 24.9%  =  39 × 25%  =  39 × 1/4  =  9.75（万亿元）\n\n再用分数法求增量：\n   9.75   ←→  10      （板书在 9.75 处标\"大\"，往上调成 10）\n   14.8%  ←→  14.3% = 1/7（板书标\"小\"，往下调成 1/7）\n\n   增速 = 1/7  →  基期 7 份 ＋ 增量 1 份 ＝ 现期 8 份\n   Δ = 10 ÷ 8 = 1.25   →  A.1.26\n```\n\n**【选项原文】**\n\n- A.1.26\n- B.2.26\n- C.3.26\n- D.4.26\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **第一步：题型转换**。老师原话：\n  > \"看到这个增速，我就想到这里，我估计要用**份数法**了。那现在差什么？差一个**现期**。现期在这儿，他没有直接给你现期是多少，给的是**占全社会……的比重是 24.9%**。\"\n  > \"因为全社会你这个消费品它并不是只有实物商品的，也不是只有网上零售的，它还有线下零售嘛。它的比重是 24.9%，其中只有 24.9% 是它，所以要先根据这个比重去把它算出来。\"\n- **第二步：为什么可以直接用 39 乘，不用再调**：\n  > \"249 位数太多对吧？那我们就把它处理成 **25%，25% 还正好是 1/4**，就非常好用。那既然我把 249 变大了，那左边这个数就要变小……**不用**！因为你刚刚本身就是把 39.1981 变小成了 39，写在这一个整数，那就相当于**我已经提前把这误差调过了**。直接 39 乘以 1/4。\"\n- **第三步：方向与幅度**。老师把 `9.75 → 10`（调大）与 `14.8% → 14.3%`（调小）**同时进行**，理由是\"上下这两组数，它们的增量基本上是差不太多的，没有多少误差\"。\n- **第四步：为什么敢这么\"糙\"**（全集的第一个关键判断）：\n  > \"肯定有同学担心说，老师，你这个 9.75 变成 10 这一步我不敢……这个变大的比例跟你右边 14.8 变成 14.3 这个比例是否一样？那我告诉你，**他们肯定不一样**。但是我不完全不担心。为什么不担心呢？因为**我本身我动的就比较小**，就动了那么一点点，就动了那么几个点，百分之十都没有吧。而它的**选项之间的差距是非常大**的——1.26、2.26、3.26、4.26，都基本上是**翻倍的**这种感觉了。所以算得很粗糙，你都不可能选到 B、C、D 上面去，差太远了。\"\n  > \"所以一般只要是这种**选项精度要求没有那么特别高**的，你在做分数法的微调、提前调整的时候不用太在意，你有变大变小这个凑着这个地方整。只要你别动太多，它误差一般都是在题目可控的范围内的。\"\n  > \"而**如果选项的精度要求特别高**，那我可能就不太敢用这种方法了。因为这种方法如果选项的精度要求特别高，你就要把它控得特别准，计算量就太大，就很麻烦，可能还不如老老实实地去把它的基期给除出来，再去减增量。\"\n- **陷阱类型**：① 概念陷阱（\"占社会消费品零售总额的比重\" → 必须先乘总量才能得现期，直接用 24.9% 当增速就错）；② 单位陷阱（材料是\"亿元\"，题目问\"万亿元\"）；③ 范围陷阱（\"全国网上零售额\" ≠ \"实物商品网上零售额\"）。\n\n---\n\n### 第 3 题｜2018 年数据 · 租赁和商务服务业新登记企业增量\n\n**【题干原文】**\n\n> 3.2018 年，全省新登记企业最集中的三个行业分别是批发和零售业、租赁和商务服务业、制造业，新登记企业数分别为 36.14 万户、15.19 万户、9.25 万户，分别同比增长 0.23%、增长 22.98%、下降 6.8%。\n>\n> 2018 年，B 省租赁和商务服务业新登记企业数较上年增加约（　）万户。\n> A.2.8　B.3.8　C.4.8　D.5.8\n\n**【材料数据】**\n\n| 行业 | 新登记企业数（万户） | 同比增长 |\n|---|---|---|\n| 批发和零售业 | 36.14 | 增长 0.23% |\n| **租赁和商务服务业** | **15.19** | **增长 22.98%** |\n| 制造业 | 9.25 | 下降 6.8% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量**（给了现期 + 增速） |\n| 定位数据 | 三行数据的**中间那一行**：`15.19` 万户，增速 `22.98%` |\n| 方法选择 | `22.98%` 极靠近百化分 `25% = 1/4` → **分数法** |\n| 列式 | `Δ = 现期 ÷ (4 + 1) = 15 ÷ 5` |\n| 速算步骤 | ① 增速调大：`22.98% → 25%`；② 现期调小：`15.19 → 15`；③ `25% = 1/4` → 基期 4 份 + 增量 1 份 = 现期 5 份；④ `Δ = 15 ÷ 5 = 3` |\n| 结论 | 最接近 **A.2.8 万户** |\n\n**【速算演示】**（画面板书 · 快解法）\n\n```\n15.19        22.98%  ↗ 25% = 1/4\n  ↓           （增速调大 ~8%）\n 15\n              Δ = 15 ÷ (4+1) = 15 ÷ 5 = 3\n              （实际增量比 3 略小 → 选 A.2.8）\n```\n\n**【速算演示】**（画面板书 · 若要更准的补算）\n\n```\n15.19  →  15.7      （往下调小约 3%，补回来）\n22.98% →  22.22% = 2/9\n份数：基期 9 份 ＋ 增量 2 份 ＝ 现期 11 份\nΔ = 15.7 ÷ 11 × 2 = 31.4 ÷ 11 ≈ 2.85\n   （错位相减：314 − 31 = 283  → 2.83）\n→ 更贴近 A.2.8\n```\n\n**【选项原文】**\n\n- A.2.8\n- B.3.8\n- C.4.8\n- D.5.8\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- 老师在本集开头宣示节奏：\n  > \"第三题后面就要开始稍微加快一点进度了，加快点速度了。前面基本上是把这个怎么算增量，再给大家再过了一遍。\"\n- **定位是本题第一坑**：材料给了三行（批发和零售业 / 租赁和商务服务业 / 制造业），题干问的是**第二个**行业。\n  > \"租赁和商务服务业在这儿，上面这三个行业的一二三，这是第二个，所以对应了它的现期跟增速，也是后面这些数的**中间这个数**。\"\n- **为什么敢把 22.98% 直接当 25% 用**：\n  > \"选项的差距它还是很大，2.8、3.8 差个 1，差了**超过 30%** 的这么大的差距。我就算把 23 变成 25，我就算**不动左边那个东西**，这个误差也没到 10%，所以完全不怕。\"\n  > \"25% 是四分之一，增量就是现期除以五等于 3。你看我就算算个 3，我就算这个 15 调小的幅度不够，就小了那么一个点，小的有点太少了，**无所谓，压根没有多大影响**。3.8 是不是还特别远？\"\n- **有没有更精细的替代方案？** 有，但本题不必：\n  > \"或者有同学说，老师，这个题为什么你不把这个 22.98% 看成 **2/9** 进行计算呢？因为 **25% 好算**，选项差距又很大，足够支撑我去用这么大的一个调整的方式去做。\"\n  > \"如果选项差距很小，如果这个地方不是 2.8、3.8，而是 3，那这个地方我可能就不敢去把它变成 25% 了。我就会把它想成 2/9 —— 把 15.19 想成 15.7，增速想成 22.22%。那左边这个既然是调小了一点，我就稍微把它调大一点……大概加三个点左右，加个 0.5 左右，变成 15.7，然后这个增速是 2/9。九份之后就意味着基期是九份，加了两份变成现期的十一份，所以增量就是现期除以十一再乘以二：15.7 ÷ 11 × 2 = 31.4 ÷ 11，再错位相减，314 − 31 = 283，这样就相对准很多了。\"\n  > \"但是这个题目就还是像我刚说的，**选项差距太大**，所以我就敢把这个 23 直接当做 25 用。你要是换成 2/9，你要先乘二再除十一，你说乘二除十一和除五哪个快？肯定直接除五快嘛。所以就大胆一点，把它变成 25 就好了。\"\n- **陷阱类型**：① 定位陷阱（三行数据必须找第二行）；② 精度陷阱（选项差距大 → 可以粗调；差距小 → 必须换 `2/9`）。\n\n---\n\n### 第 4 题｜2017 年数据 · 电信业务收入增量（化除为乘）\n\n**【题干原文】**\n\n> 4.2017 年，我国电信业务收入 12620 亿元，比上年增长 6.4%，增速同比提高 1 个百分点。\n>\n> 2017 年我国电信业务收入同比增加了大约（　）亿元。\n> A.681　B.759　C.808　D.818\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 我国电信业务收入（2017 年） | 12620 亿元 | 比上年增长 6.4%（增速同比提高 1 个百分点） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量**（现期 + 增速齐全） |\n| 定位数据 | 现期 `12620`（→ `1262`），`r = 6.4%` |\n| 方法选择 | `r \u003c 10%` 且 6.4% 正好在\"能提前修正\"的位置 → **化除为乘** |\n| 列式 | `Δ = 现期 × r ÷ (1 + r) = 1262 × 6.4% ÷ 1.064` |\n| 速算步骤 | ① 把 `1 ÷ 1.064` 化除为乘 → `≈ 1 − 6.4%`；② `6.4% × (1 − 6.4%) = 6.4% − 6.4%×6.4%`；③ `6.4 × 6.4 ≈ 36`（九九表 6636），当 `0.4%` 用（36 很靠近 40）；④ `6.4% − 0.4% = 6%`；⑤ `1262 × 6% ≈ 75.7` → **757.2 亿元** |\n| 结论 | 最接近 **B.759 亿元** |\n\n**【速算演示】**（画面板书）\n\n```\n原来：Δ = 现期 ÷ (1 + r) × r\n现在把 r 挪到分母上，先除 1.064：\n\n  1262 × 6.4% / 1.064\n= 1262 × 6.4% × (1 − 6.4%)         （1 ÷ 1.064 ≈ 1 − 6.4%）\n= 1262 × (6.4% − 6.4% × 6.4%)\n= 1262 × (6.4% − 0.4%)             （6.4×6.4 = 36 → 记 0.4%）\n= 1262 × 6%\n\n1262 × 6% = 75.72   →  757.2 亿元   →  B.759\n\n更胆大：1262 直接当 125 → 125 × 6 = 750，一样落在 B\n板书另记：126 × 6 = 756\n```\n\n**【选项原文】**\n\n- A.681\n- B.759\n- C.808\n- D.818\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **本题是\"化除为乘\"的标准演示**，老师把整条推导写得很完整：\n  > \"17 年它的增量是多少？现期增速，算增量怎么算？看它的增速的特点——增速小于 10%，所以我们用**化除为乘**。\"\n  > \"如果你直接用 1262 去乘以 6.4% 的话，结果会偏大……而这个 6.4%，它又正好是基本上就在我们那种**能提前修正**的增速的位置上，索性就直接把它缩小六个点，变成 6%。\"\n  > \"其实就是，你本来你这个增量不是这么算吗？先用现期除以一个 1+增速得到基期，再去乘这个 6.4%。**我只不过是把这个东西挪在了它下面**，让它先除了个 1.064，把 1.064 去化除为乘，变成 1 − 6.4%，也就是 6.4% 减去 6.4% 乘以 6.4%。\"\n  > \"那这个东西呢，基本上就是一个 6.4 乘 6.4，直接用一个九九乘法表里面 **6636**，去当个 **0.4%** 就好了，36 就很靠近 40 嘛。这样把百分号全写上吧，一减就 **6%** 就好了。126 乘以 6%，这样它的增量就能出得比较快了。\"\n- **快速校验法（老师给的\"胆大版\"）**：\n  > \"126 乘以 6，57756（口算 `126×6 = 756`），选择 B 选项 759，基本上差不多。\"\n  > \"你要胆子大一点，说哎，我发现其实这个选项差距也不小，你还可以更快一点，就是我拿这个……我都甚至我都不想把它当 126 了，我就当 **125**，因为 125 乘以 6 很快，125 乘以 6 就是 **750**。\"\n- **陷阱类型**：① 概念陷阱（`Δ = 现期 × r ÷ (1+r)`，不是 `现期 × r`；两者差 6.4%，在本选项差距下才敢忽略）；② 范围陷阱（\"增速同比提高 1 个百分点\"是干扰条件，与本题无关）。\n\n---\n\n### 第 5 题｜2021 年 1-9 月 · 机床工具对美出口额增量\n\n**【题干原文】**\n\n> 5.从出口去向来看，2021 年 1～9 月出口去向前三位分别是：美国 17.5 亿美元，同比增长 27.4%；越南 10.5 亿美元，同比增长 35.4%；印度 8.8 亿美元，同比增长 67.8%。\n>\n> 2021 年 1～9 月，我国机床工具对美国出口额同比增长约多少亿美元？\n> A.1.9　B.2.3　C.3.1　D.3.8\n\n**【材料数据】**\n\n| 出口去向 | 出口额（亿美元） | 同比增长 |\n|---|---|---|\n| **美国** | **17.5** | **27.4%** |\n| 越南 | 10.5 | 35.4% |\n| 印度 | 8.8 | 67.8% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量** |\n| 定位数据 | 美国 `17.5` 亿美元，增速 `27.4%` |\n| 方法选择 | `27.4%` 靠近 `25% = 1/4` → **分数法** |\n| 列式 | 增速 = 1/4 → 基期 4 份 + 增量 1 份 = 现期 5 份 → `Δ = 现期 ÷ 5` |\n| 速算步骤（精一点） | ① 增速调小：`27.4% → 25%`，降幅 `2.4 / 27.4 ≈ 10%`；② 现期相应**调大** 10%：`17.5 × 1.1 = 19.25`，取 `19`（板书 `17.5 + 1.7 = 19.2 → 19`）；③ `Δ = 19 ÷ 5 = 3.8` |\n| 速算步骤（快一点） | 现期只调到 `18`，`Δ = 18 ÷ 5 = 3.6`，仍落在 D |\n| 结论 | **D.3.8 亿美元** |\n\n**【速算演示】**（画面板书）\n\n```\n精一点（左大右小，同步约 10%）：\n   17.5  ↗  19        （17.5 + 1.7 = 19.2 → 取 19，涨不到 10%）\n   27.4% ↘  25% = 1/4 （降了 2.4，约 10%）\n   Δ = 19 ÷ 5 = 3.8\n\n快一点：\n   17.5  ↗  18\n   27.4% ↘  25%\n   Δ = 18 ÷ 5 = 3.6   →  仍然选 D.3.8\n```\n\n**【选项原文】**\n\n- A.1.9\n- B.2.3\n- C.3.1\n- D.3.8\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **本题是\"调整幅度与精度的取舍\"最典型的演示**：\n  > \"根据这个增速的特点，这个增速呢，它是比较靠近 25% 的，所以我们把它变小，变成 25%。那既然它变小了，**另外一端就要变大**。变大了多少呢？这个时候就看你想让这个结果够不够精。\"\n  > \"如果你想精一点，27.4 变成 25 是减了 2.4，基本上是 10% 左右，那我这边也加 10%，把它变成 19，加个 1.7，取个 19 的整……增速 25% 是四分之一，所以增量就是现期除以五等于 3.8，这样就准。\"\n  > \"那如果我感觉选项差异其实也挺大的，或者说我就想先估一下，看看……我把它当百分之二十五之后，我知道它变小了，另外变大一点之后，刚刚变小了、幅度也不多，我就算个 18，那 18 继续除以五等于 3.6。那 3.6，我还是会选到 D 啊，ABC 离得那么远，怎么可能是他们呢？\"\n  > \"**这就是准一点和快一点，其实都只是看你想它有多准而已。**\"\n- **如何自查\"偏大还是偏小\"**（老师现场演示\"不用返工\"的办法）：\n  > \"而且你也不用太担心，你说会不会我这样算的，万一说还要返工，那是不是麻烦？也不麻烦，你只要分辨一下，你这个 **18 到底是小了还是大了**就好了。很明显，你这个 17.5 到 18 增长的幅度太低了，你这右边这个 27.4 到 25 小了 10%，左边这个明显没有到 10%，差挺多的。所以你算到 3.6，它**绝对是偏小的**。\"\n- **陷阱类型**：① 定位陷阱（三行数据取第一行\"美国\"）；② 方向陷阱（增速调小 → 现期必须调大，不可同向调）。\n\n---\n\n### 第 6 题｜2020 年数据 · 互联网企业业务收入增量\n\n**【题干原文】**\n\n> 6.2020 年，我国规模以上互联网和相关服务企业（以下简称互联网企业）业务收入 12838 亿元，同比增长 12.5%，增速低于上年同期 8.9 个百分点。\n>\n> 2020 年，互联网企业业务收入同比约增长了：\n> A.1187 亿元　B.1309 亿元　C.1426 亿元　D.1605 亿元\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 规模以上互联网和相关服务企业业务收入（2020 年） | 12838 亿元 | 同比增长 12.5%（增速低于上年同期 8.9 个百分点） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量** |\n| 定位数据 | 现期 `12838` 亿元，`r = 12.5%` |\n| 方法选择 | `12.5% = 1/8`，是\"白送\"的百化分 → **分数法 + 错位相加** |\n| 列式 | 增速 = 1/8 → 基期 8 份 + 增量 1 份 = 现期 9 份 → `Δ = 12838 ÷ 9` |\n| 速算步骤 | ① 错位相加求 `128 ÷ 9`：`128 + 12.8 = 140.8`（记 `1408`）；② 再错一位：`140.8 + 1.408 ≈ 142.2`（记 `1422`）；③ 板书即得 `Δ ≈ 1422 亿元`；④ 实际 `12838 ÷ 9 ≈ 1426.4` |\n| 结论 | 选 **C.1426 亿元** |\n\n**【速算演示】**（画面板书）\n\n```\n12.5% = 1/8\n分母 8 份 ＋ 分子 1 份 ＝ 9 份\nΔ = 12838 ÷ 9\n\n错位相加（÷9 专用）：\n      128\n    ÷   9\n   ——————————\n      128\n    ＋ 12.8\n   ——————————\n     140.8   → 记 1408\n    ＋  1.408→ 记 14\n   ——————————\n     142.2   → 记 1422\n    （实际 12838 ÷ 9 ≈ 1426）  →  C.1426\n```\n\n**【选项原文】**\n\n- A.1187 亿元\n- B.1309 亿元\n- C.1426 亿元\n- D.1605 亿元\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **\"白送\"的增速**：\n  > \"这里它的增速给的就是非常好的一个增速，**12.5% 就是八分之一**，再不用分数法就有点太浪费这个数据了。直接用它的现期除以九就好了。\"\n- **错位相加的熟练度要求**：\n  > \"当你熟了错位相加之后，这种式子**就不用写了**。增速是八分之一，增量就是现期除以九。除以九，这些错位相加，直接在我脑海中就是蹦了一个 128 加 128，变成 140.8。那错位相加最后得到 1408。\"\n- **为什么答案是 1426 而不是 1408 / 1422**：\n  > \"1408 是**偏小 1%** 的，所以准一点的话，你可以把这个 14 再加上去，一加就能得到 1422 了，距离这个 1426 就更近了。为什么还会有一点点误差呢？因为它实际是 **12838**，它不是 12800，这个地方有个误差，你把这个东西也再加一下，就完全准了。\"\n- **陷阱类型**：① 概念陷阱（`Δ = 现期 ÷ (8+1)`，除数是 9 而不是 8——因为现期已经是\"8 份 + 1 份\"）；② 范围陷阱（\"增速低于上年同期 8.9 个百分点\"为干扰条件）。\n\n---\n\n### 第 7 题｜2020 年数据 · 居民人均可支配收入基期\n\n**【题干原文】**\n\n> 7.2020 年全国居民人均可支配收入 32189 元，比上年增长 4.7%\n>\n> 2019 年全国居民人均可支配收入为（　）。\n> A.31527 元　B.30744 元　C.32189 元　D.27540 元\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 全国居民人均可支配收入（2020 年） | 32189 元 | 比上年增长 4.7% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**基期** |\n| 定位数据 | 现期 `32189` 元，`r = 4.7%` |\n| 方法选择 | `r \u003c 10%` → **化除为乘**，走\"现期 − 增量\"路线 |\n| 列式 | `Δ ≈ 现期 × r = 32 × 4.7%`；基期 = `32189 − Δ` |\n| 速算步骤 | ① 口算在脑海中：`32 × 47`（丢掉小数点与百分号）；② 不好算 → **乘法放缩**成 `30 × 50 = 1500`；③ `32189 − 1500 = 30689`；④ 与选项对照 |\n| 结论 | 最接近 **B.30744 元** |\n\n**【速算演示】**（画面板书）\n\n```\n不直接算基期，先估增量：\n   32 × 4.7\n   ↓  乘法放缩（一变一补）\n   30 × 50 = 1500          ← Δ ≈ 1500\n   （4.7% 比 5% 小一点 → 实际增量比 1600 略小，1500 合理）\n\n基期 = 现期 − 增量 = 32189 − 1500 = 30689   →  B.30744\n```\n\n**【选项原文】**\n\n- A.31527 元\n- B.30744 元\n- C.32189 元\n- D.27540 元\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **本题的核心不是算，而是\"为什么可以这么粗糙\"** —— 老师借此把\"直接误差 / 间接误差\"讲透：\n  > \"这时候肯定有同学会疑问，这时候你怎么不管这个误差了呢？你直接拿现期乘增速算出来这个增量，它不是会偏大 4.7 个点吗？你不要把这 4.7 个点去掉吗？我看选项之间的差距也没有那么大呀，为什么你说选项差距很大呢？\"\n  > \"这个涉及到我第一节课说的**误差：直接误差跟间接误差的一个关系**。我们的计算对象是谁？我们在算的这个东西是什么？是**增量**，它的量只有 1500。是这个 1500 这个东西，它有误差 4.7 个百分点。而选项里面这个东西是谁？是**基期**，是三万多，它们之间的差距是多少？好几百、八百、1400 甚至这边好几千。\"\n  > \"或者你说 A 跟 C 之间 600，它们的差距是好几百，而我算的这个东西是 1500，它只有 4% 左右，4% 才多少？才几十。**这几十的误差能影响它们几百的差距吗？影响不到，所以压根不用管。**\"\n  > ⭐ \"因为我知道**我计算的对象是一个很小的对象**，它就算有那么点误差，那种百分比的误差，经过这种很小的数的控制下，它的误差就会非常小。所以这也是我解释**为什么在增速低的时候，我们要去算增量，再去算基期，而不是直接去算基期**。因为这样你计算对象很小，误差就会很小，你的施展的空间就会很大。\"\n- 板书在 A、B 两项下面画了标记线并写 `800` / `1400`，即两两选项之间的绝对差距，用来验证\"1500 的量级误差几十，根本影响不到几百的差距\"。\n- **陷阱类型**：① 概念陷阱（低增速时优先\"现期 − 增量\"而非\"现期 ÷ (1+r)\"）；② 误差量级陷阱（只比较\"误差的绝对量\"与\"选项差距的绝对量\"，而不是比较百分比）。\n\n---\n\n### 第 8 题｜2022 年数据 · 海水产品产量增量（范围题）\n\n**【题干原文】**\n\n> 8.2022 年，全国海水产品产量 3459.53 万吨，同比增长 2.1%。\n>\n> 2022 年，全国海水产品产量同比增长（　）。\n> A.小于 40 万吨　B.40 万吨到 60 万吨\n> C.60 万吨到 80 万吨　D.超过 80 万吨\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 全国海水产品产量（2022 年） | 3459.53 万吨 | 同比增长 2.1% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量**，但选项是**范围**（区间） |\n| 定位数据 | 现期 `3459.53`（≈3460）万吨，`r = 2.1%` |\n| 方法选择 | 增速很小 → **化除为乘**，甚至可当作 `现期 × 增速` |\n| 列式 | `Δ ≈ 3460 × 2%` |\n| 速算步骤 | `3460 × 2% = 69.2 ≈ 70`（画面板书写作 `3460 × 2%`，结果圈 `70`） |\n| 结论 | `60 \u003c 70 \u003c 80` → **C.60 万吨到 80 万吨** |\n\n**【速算演示】**（画面板书）\n\n```\nΔ ≈ 现期 × 增速 = 3460 × 2% = 70\n        ↓\n   60 ←—— 70 ——→ 80\n   （板书把 60 / 80 两个分界点写在 70 两侧）\n```\n\n**【选项原文】**\n\n- A.小于 40 万吨\n- B.40 万吨到 60 万吨\n- C.60 万吨到 80 万吨\n- D.超过 80 万吨\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 老师原话：\n  > \"第八题同理……这个直接让你算增量，根据它的特点去算，直接化除为乘，因为这增速很小，所以就是 3460 乘以 2%。\"\n  > \"算出来的一个 70，所以选择 C 选项。这个 70 呢，它是**偏大 2%** 的，但是**无所谓**，因为 70 跟其他选项之间差了有 10 的量。它们差了 10 这么多，你只相差……你这个误差只有 2%，2% 才 1 点几；它跟 60、80 之间差的只有 10 几。差太多了。\"\n- **范围题的思路**：只要估出的数落在区间内即可，不需要精确值，因此可以直接\"一刀切\"。\n- **陷阱类型**：① 选项形式陷阱（区间型选项，只比大小不比精确值）；② 概念陷阱（`Δ = 现期 × r` 严格说应再除 `(1+r)`，此处偏差 2%，区间宽度 20，无风险）。\n\n---\n\n### 第 9 题｜2015 年数据 · 谷物及谷物粉进口金额增量（重难点）\n\n**【题干原文】**\n\n> 9、2015 年，谷物及谷物粉的进口金额比上一年增加约多少亿元？\n> A.170　B.200　C.230　D.260\n\n**【材料数据】**\n\n表头：**2015 年主要商品进口数量、金额及其增长速度**\n\n| 商品名称 | 数量（万吨） | 比上年增长（%） | 金额（亿元） | 比上年增长（%） |\n|---|---|---|---|---|\n| **谷物及谷物粉** | **3270** | **67.6** | **582** | **52.4** |\n| 大豆 | 8169 | 14.4 | 2157 | −12.8 |\n| 食用植物油 | 676 | 4.1 | 311 | −14.5 |\n| 铁矿砂及其精矿 | 95272 | 2.2 | 3574 | −37.7 |\n| 氧化铝 | 465 | −11.8 | 101 | −14.2 |\n| 煤（包括褐煤） | 20406 | −29.9 | 749 | −45.2 |\n| 原油 | 33550 | 8.8 | 8333 | −40.5 |\n| 成品油 | 2990 | −0.3 | 886 | −38.5 |\n| 初级形状的塑料 | 2610 | 2.9 | 2793 | −11.8 |\n| 纸浆 | 1984 | 10.4 | 792 | 6.9 |\n| 钢材 | 1278 | −11.4 | 889 | −19.2 |\n| 未锻轧铜及铜材 | 481 | −0.3 | 1804 | −17.4 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增量**（表格定位题） |\n| 定位数据 | \"谷物及谷物粉\"行的**金额=582 亿元**、**比上年增长=52.4%** |\n| 方法选择 | `52.4%` 极靠近百化分 `1/2 = 50%` → **分数法** |\n| 列式 | 增速 = 1/2 → 基期 2 份 + 增量 1 份 = 现期 3 份 → `Δ = 现期 ÷ 3` |\n| 速算步骤 | ① 增速调小：`52.4% → 50% = 1/2`；② 现期相应**调大**：`582 → 600`；③ `Δ = 600 ÷ 3 = 200` |\n| 结论 | **B.200 亿元** |\n\n**【速算演示】**（画面板书）\n\n```\n   582   ↗  600      （现期调大：582 + 18 ≈ 600）\n   52.4% ↘  50% = 1/2 （增速调小：降 2.4，约 4.5%）\n\n   份数：基期 2 份 ＋ 增量 1 份 ＝ 现期 3 份\n   Δ = 600 ÷ 3 = 200      （画面把 200 圈出）\n\n   ★ 陷阱自检（老师在画面下方特意演示）：\n      600 − 200 = 400   ←（划掉，这是\"假设的跳板\"）\n      582 − 200 = 382   ←（打勾，这才是真正的基期）\n```\n\n**【选项原文】**\n\n- A.170\n- B.200\n- C.230\n- D.260\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 老师原话：\n  > \"谷物和谷物粉的进口金额的增量是多少？……像增量，这个增速的特点是靠近**百化分**位置，这个 52.4% 非常靠近，约等于 50%。所以相当于是我们希望把这个 582、52.4% 这组数据去变成一个增速是 **50%** 的增量去计算。\"\n  > \"那 50%，我把增速变小了，那我这边的现期就适当把它调大一点，600 碍不碍事？**不碍事**。因为选项差距大，起码十几个点，我这边动来动去的都是在几个点的范围。\"\n  > \"那 600 的现期、50% 的增速，它的增量就是现期除以 3。因为两份，加了他的一半加了一份，变成现期的三份。基期加增量得到现期，就 600 除以 3 等于 200。\"\n- ⭐ **本题最有价值的提醒 —— \"跳板\"不能拿来算基期**：\n  > \"这边再提醒一下，防止有的同学容易犯迷糊。我算出来这样是 200 了。如果这时候我想算它的**基期**是多少，是 `600 − 200`，还是 `582 − 200`？\"\n  > \"其实是**下面这个**。因为这个 200、这个 600，它只是我们**假设出来的一个跳板**，去算一个相同的增量。我们是在控制这个现期跟增速的大小关系，控制什么东西？控制它们算出来的**增量不变**。我们算的这个增量是差不多的。\"\n  > \"所以它实际的基期，你要用**实际的现期**去减掉它的一个**实际的增量**，才能算出来这个基期 **382**。你可别这样子说：老师，以后我去算增量、算基期的时候我也这么去做，然后把一个 600 减 200 算出来个基期 400，怎么不对？因为你这个 200 它只是相当于找了个跳板，只是这组数据它的增量也正好跟上面的一模一样而已——也不能叫一模一样，基本上没多少差距而已。**你只是借助这个跳板去算了个近似的增量。**\"\n- **陷阱类型**：① 定位陷阱（表中共 12 行商品，且\"数量/金额\"\"比上年增长/金额增长\"四列并排，极易看错列）；② **跳板陷阱**（用凑整后的 600 − 200 求基期，正确做法必须用 582 − 200 = 382）；③ 概念陷阱（题干问\"增加约多少亿元\"= 增量，不是求基期）。\n\n---\n\n### 第 10 题｜2011-2018 年 · 保险行业原保险保费收入增速\n\n**【题干原文】**\n\n> 10.与 2011 年相比，2018 年中国保险行业原保险保费收入约增长了：\n> A.143%　B.166%　C.173%　D.182%\n\n**【材料数据】**\n\n柱状图标题：**2011～2018 年中国保险行业原保险保费收入（单位：万亿元）**\n\n| 年份 | 2011 | 2012 | 2013 | 2014 | 2015 | 2016 | 2017 | 2018 |\n|---|---|---|---|---|---|---|---|---|\n| 原保险保费收入（万亿元） | **1.43** | 1.55 | 1.72 | 2.02 | 2.43 | 3.09 | 3.66 | **3.80** |\n\n（纵轴刻度：0 / 0.5 / 1 / 1.5 / 2 / 2.5 / 3 / 3.5 / 4）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增速**（间隔 7 年的累计增长） |\n| 定位数据 | 2011 年 `1.43`、2018 年 `3.80`（图中 2011 与 2018 两根柱被圈出） |\n| 列式（法一） | `r = 增量 ÷ 基期 = (3.80 − 1.43) ÷ 1.43 = 2.37 ÷ 1.43` |\n| 速算步骤（法一） | `1.43 ≈ 1/7` → `2.37 ÷ (1/7) = 2.37 × 7 = 16.59` → `165.9%` |\n| 列式（法二，老师推荐） | `现期 ÷ 基期 = 1 + r` → `3.80 ÷ 1.43 = 3.8 × 7 = 26.6` → `r = 2.66 − 1 = 1.66 = 166%` |\n| 结论 | **B.166%** |\n\n**【速算演示】**（画面板书）\n\n```\n法一（先算增量）：\n   r = 增 / 基 = (3.80 − 1.43) / 1.43 = 2.37 / 1.43\n   1.43 正好是 1/7  →  r = 2.37 × 7 = 16.59  →  165.9%\n\n法二（保留整数，老师更推荐）：\n   现 / 基 = 1 + r\n   3.8 / 1.43 = 3.8 × 7 = 26.6\n   1 + r = 2.66  →  r = 166%\n```\n\n**【选项原文】**\n\n- A.143%\n- B.166%\n- C.173%\n- D.182%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **为什么\"算增速\"要先想 `现期 ÷ 基期`**：\n  > \"增速的计算，一般来说，我们都是用**增量除以基期**，对吧？所以我们先把资料减出来，3.8 减 1.43 减下来呢是 2.37。基期呢就是 1.43，这个基期凑得好，**1.43 正好是 1/7**，所以就等于 2.37 除以 1/7，等于乘以 7。\"\n  > \"那我们把 2.37 乘以 7 算一下就好了，7749，3721（口算 237×7 = 1659），所以它的增速就是 165.9%，所以选择 B，166%。\"\n- ⭐ **法二（更优）的理由**：\n  > \"那这样处理呢，它其实**并不是这个题目最好的一个处理方式**，为什么呢？因为增速除了用这个增量除以基期以外，还有一种方式，就是我们可以算**倍数**——**现期除以基期，它是等于 1 + 增速的**。为什么要还要加个一呢？因为这样子我们可以**保留 3.8 这个偏整一点的数**。不然你去把这个增量减出来，是把分子从 3.8 变成了 2.37，**把两位数变成了三位数，就在无形中增加了你的计算量**。\"\n  > \"所以我们尽量保留它的整数，那 3.8 跟刚刚一样，直接乘个 7，3.8 × 7 = 26.6，就算出来这个 1 + 增速是 2.66，那它的增速就是减掉这个 1，1.66，这样**就更快一点**。\"\n- **陷阱类型**：① 答非所问陷阱（题目问增速，不能算成增量或倍数，`1 + r = 2.66` 要减 1）；② 计算量陷阱（先减增量把两位数变三位数，反而变慢）。\n\n---\n\n### 第 11 题｜2022-2023 年 · 批准用海面积增速（同比挂钩技巧）\n\n**【题干原文】**\n\n> 11.2022 年，全年批准用海面积 19.0 万公顷，同比下降 16.0%。\n>\n> 若 2023 年全年批准用海面积与 2021 年持平，那么 2023 年批准用海面积比上年（　）。\n> A.下降 16%　B.上升 16%　C.下降 19%　D.上升 19%\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 全年批准用海面积（2022 年） | 19.0 万公顷 | 同比下降 16.0% |\n| 2023 年全年批准用海面积 | 与 2021 年持平（假设） | 待求（相对 2022 年） |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**增速**（跨年\"挂钩\"型） |\n| 定位数据 | 2022 年 `19.0`，`r₂₀₂₂ = −16.0%`；条件：2023 年 = 2021 年 |\n| 列式 | 先求 2021 年，再求 2023 年比 2022 年的增速 |\n| 速算步骤（法一 · 老实算） | ① `−16.0% ≈ −1/6`；② 基期 6 份，减 1 份，现期 5 份 → 变化量 = `19 ÷ 5 = 3.8`；③ 2021 年 = `19 + 3.8 = 22.8`；④ 2023 年 = 2021 年 = `22.8`；⑤ 2022 年 = `19`；⑥ `r = (22.8 − 19) ÷ 19 = 3.8 ÷ 19 = 20%` |\n| 速算步骤（法二 · 秒杀） | `2021 = 19 ÷ (1 − 16%)`；`2023 ÷ 2022 = [19 ÷ (1−16%)] ÷ 19 = 1 ÷ (1 − 16%) = 1 ÷ 0.84 ≈ 1.2` → 增速约 19% |\n| 速算步骤（法三 · 纯逻辑秒杀） | ① 2021、2023 一定比 2022 高 → 排除\"下降\"；② 跌 16% 是拿\"2021 年的量\"跌的，涨回来是拿\"2022 年更小的量\"涨的 → 涨的幅度**必须大于 16%** → 排除 16% |\n| 结论 | **D.上升 19%** |\n\n**【速算演示】**（画面板书）\n\n```\n法一（份数法 + 硬算）：\n   −16.0% ≈ −16.6% = −1/6\n   基期 6 份 − 1 份 = 现期 5 份\n   变化量 = 19 ÷ 5 = 3.8\n   21 年：19 + 3.8 = 22.8\n   23 年：22.8（与 21 年持平）\n   22 年：19\n   r = (22.8 − 19) ÷ 19 = 3.8 / 19 = 20%   →  D\n\n法二（比值法，零硬算）：\n   21 = 19 ÷ (1 − 16%)\n   23 / 22 = [19 ÷ (1 − 16%)] ÷ 19 = 1 / (1 − 16%) = 1 / 0.84 ≈ 1.2\n   →  增速 ≈ 19%   →  D\n\n法三（纯逻辑）：\n   21、23 年一定高于 22 年 → 不可能是下降（排 A、C）\n   跌 16 个点是拿\"21 年\"的量跌的，涨回来是拿\"更小的 22 年\"的量涨的\n   →  涨幅必须超过 16%  →  排除 B  →  直接 D\n```\n\n**【选项原文】**\n\n- A.下降 16%\n- B.上升 16%\n- C.下降 19%\n- D.上升 19%\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **法一（老实算）**：\n  > \"这个增速是很靠近**负的 16.6%，就是负的六分之一**。如果用分数法，6 份减了一份，6 份减 1 份得到现期的 5 份，所以增量就是现期除以 5——或者说这个不是增量，这个是**变化量**，就是 3.8，所以它的基期是 19 加 3.8 等于 **22.8**。那 21 年是 22.8，说 23 年也是 22.8，那么比 22 年的 19 增长多少呢？22.8 比这个 19 是多了 3.8，那么增速就是 3.8 除以 19 等于 **20%**，所以上升了 20%，所以选择 D 选项上升 19%，最靠近。\"\n- ⭐ **法二（本题最优解 —— 比值直接消掉绝对量）**：\n  > \"这样子其实倒也没有多大问题，但这个题目就**很浪费时间**了。因为其实我们**压根不需要去把它们的具体数值去算出来**。因为你会发现，你在算这个增量、或者说算这个基期的时候，是不是每个式子里面其实都有一个 **19**，然后你算这个增速的时候，除的也是个 19，所以其实它是**可以完全抵消掉**的。\"\n  > \"因为你看 21 年它是等于 `19 ÷ (1 − 16%)`，那它也就等于 23 年。那你要算 23 年比 22 年高百分之多少，你一定要去拿具体的数值做差吗？你就不能直接拿 23 年除以 22 年吗？那就是 `19 ÷ (1 − 16%) ÷ 19`，出来的是个什么？出来的是个 `1 + 增速`。那 19 跟 19 就消掉了，所以它们之间的比值就是 `1 : (1 − 16%)`，也就是 `1 ÷ 0.84`，约等于 1.2 左右，1.2 不到，所以是 19%。\"\n  > ⭐ \"**所以在这种题目里面，其实 22 年的量到底是多少数没有关系的，不重要的。它的量哪怕就是一，哪怕是二，哪怕是零点一，它们 21、22、23 这三年之间的比值关系永远是不变的。**\"\n- **法三（纯逻辑秒杀）**：\n  > \"这边其实还有一个小技巧……他告诉我们，22 年比 21 年跌了 16%，然后 23 年跟 21 年是一样的，问要再涨多少。其实可以**直接秒杀**：因为 21 年、23 年肯定比 22 年高，那不可能是下降；那涨是 16% 吗？也不可能是 16%。因为如果你跌了 16 个点下来，你想涨回去，你是不可能只涨 16 个点就能涨到的。为什么呢？因为你本来跌这 16 个点的时候，是拿什么东西乘的？16 是拿 21 年这个东西乘以 16% 减掉的。然后你涨的时候，涨的这个量是谁带来的？是拿 **22 年的量**去乘以那个增速的，而 22 年的量是比 21 年的量要小的，**这里面增速就一定要比 16% 要大**。所以 B 也不可能，所以可以直接选 D。\"\n- **陷阱类型**：① 概念陷阱（\"与上年相比\"的年是 2022 年，不是 2021 年）；② 单位/基数陷阱（下跌基数大、上涨基数小，涨跌幅不对称）；③ 计算量陷阱（用\"老实算\"会白算一堆绝对量）。\n\n---\n\n### 第 12 题｜2014 年 1-2 月 · 银行间债券市场累计发行债券基期\n\n**【题干原文】**\n\n> 12.2014 年 1 月份，债券市场发行债券 4041.7 亿元，同比减少 24.8%，环比减少 27.1%。其中，银行间债券市场发行债券 3927.9 亿元，环比减少 19.6%。2 月份，债券市场发行债券 5880.9 亿元，同比增加 15.7%。其中，银行间债券市场发行债券 5780.5 亿元，环比增加 47.2%。\n>\n> 1-2 月，债券市场累计发行债券同比减少 5.1%，其中，银行间债券市场累计发行债券同比减少 4.7%。\n>\n> 2013 年 1-2 月银行间债券市场累计发行债券约多少亿元？\n> A.9187　B.9830　C.10187　D.11230\n\n**【材料数据】**\n\n| 时间 | 口径 | 金额（亿元） | 同比 | 环比 |\n|---|---|---|---|---|\n| 2014 年 1 月 | 债券市场发行债券 | 4041.7 | 同比减少 24.8% | 环比减少 27.1% |\n| 2014 年 1 月 | 其中：银行间债券市场发行债券 | 3927.9 | （未给） | 环比减少 19.6% |\n| 2014 年 2 月 | 债券市场发行债券 | 5880.9 | 同比增加 15.7% | （未给） |\n| 2014 年 2 月 | 其中：银行间债券市场发行债券 | 5780.5 | （未给） | 环比增加 47.2% |\n| 2014 年 1-2 月 | 债券市场累计发行债券 | （未给） | 同比减少 5.1% | — |\n| 2014 年 1-2 月 | 其中：银行间债券市场累计发行债券 | **待求现期** | **同比减少 4.7%** | — |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**基期**（非\"累计值现成给\"型，需自己加总现期） |\n| 定位数据（现期） | 1 月银行间 `3927.9` + 2 月银行间 `5780.5` → `9708.4 ≈ 9708`（画面板书 `9708`） |\n| 定位数据（增速） | 只取最后一段的**同比**：`−4.7%`（\"1-2 月……银行间债券市场累计发行债券同比减少 4.7%\"） |\n| 方法选择 | `|r| \u003c 10%` → **化除为乘** |\n| 列式 | `Δ ≈ 现期 × r = 9708 × (−5%)`；基期 = `9708 − Δ` |\n| 速算步骤 | ① `4.7%` 不整，往上凑成 `5%`；② `9700 × (−5%) = −485`（板书 `97 × 5 = 485`）；③ 基期 = `9708 − (−485) = 9708 + 485 = 10193` |\n| 结论 | **C.10187 亿元** |\n\n**【速算演示】**（画面板书）\n\n```\n现期 = 3927.9（1 月银行间） + 5780.5（2 月银行间） = 9708.4 ≈ 9708\nr   = −4.7%（1-2 月银行间累计同比）\n\n|r| \u003c 10%  →  化除为乘：\n\n   9708 × (−5%) = −485     （板书：9700 × −5% = −485）\n   ← 板书先写 −4.7%，再划掉改成 −5%\n\n基期 = 现期 − 增量 = 9708 − (−485) = 9708 + 485 = 10193\n       板书写作：10193   →   C.10187\n\n更粗的版本（选项差距三四百，够用）：\n   10000 × (−5%) = 500\n   9708 + 500 = 10208   →  仍选 C\n```\n\n**【选项原文】**\n\n- A.9187\n- B.9830\n- C.10187\n- D.11230\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- ⭐ **本题的核心是\"材料定位\"，老师在画面上把三段材料逐句划掉，演示排除过程**：\n  > \"这是一个**基期问题**，先找一下对应的这个数据，它有没有给我们一个现期、增速之类的……题目问的时间，可能是 14 年的一月份。银行间债券在这儿给了一个一月份的量，然后这边后面这个增速**它不是同比增速，这是个环比增速**。\"\n  > \"环比增速是跟上一个时间点相比，它这个时间点是一月份这一个月，那它的环比就是跟上一个月十二月份去比，**一三年的十二月份**，这个时候我们不需要的增速**用不到**。而且这个时间也只是一月份，他问我们的是**一到二月**的。\"\n  > \"还在跟二月份有关，二月份在这儿……也是一个发行增速，那这增速**用不上**，我们现在只有它们的现期。那怎么办呢？继续往下找，又给了个一到二月份，银行间债券市场……给了一个**同比增速**，**这才是我们所需要的**——一四年跟一三年相同时间之间的一个增长情况，减少了 4.7%。\"\n  > \"现在我们现期、增速就有了。现期要把这两个月的给它加起来，加起来之后，我们可以得到它的现期是 **9708**。\"\n- **为什么 `4.7%` 要往上调成 `5%`**：\n  > \"它的增速的绝对值小于 10%，所以用化除为乘……因为如果你直接拿这个现期乘增速，它的结果会**偏小** 4.7%，那既然本来就偏小，这个 4.7% 又不整，那我们就索性把它**往上调整，调成 5%**，既调了误差又好算。\"\n- **\"胆大版\"（选项差距大时的口算）**：\n  > \"或者胆子大一点的同学可能会发现，这个选项间的差距其实很大的，差了三四百。我们这个计算对象只是四百多……其实就可以很快地脱口而出一个 `10000 × (−5%) = 500`，它的变化量绝对是在 500 附近。所以 9708 加上 500，变成一万零两百，也能选到 C。\"\n- **陷阱类型**：① **时间/口径陷阱**（1 月的\"环比 −19.6%\"、2 月的\"环比 +47.2%\"、\"同比 +15.7%\"全部是诱饵，只有\"1-2 月银行间累计同比 −4.7%\"可用）；② 范围陷阱（题目问\"银行间债券市场\"，不能取\"债券市场\"的 4041.7 / 5880.9）；③ 单位陷阱（各数单位均为\"亿元\"）。\n\n---\n\n### 第 13 题｜2020 年底 · 基层群众性自治组织减少量\n\n**【题干原文】**\n\n> 13.截止 2020 年底，全国基层群众性自治组织共计 61.5 万个，同比减少 4.35%。\n>\n> 2020 年，全国基层群众性自治组织较上年减少（　）万个。\n> A.1.4　B.2.8　C.4.2　D.5.6\n\n**【材料数据】**\n\n| 指标 | 数值 | 增速 |\n|---|---|---|\n| 全国基层群众性自治组织（截至 2020 年底） | 61.5 万个 | 同比减少 4.35% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求**减少量**（即负增量） |\n| 定位数据 | 现期 `61.5` 万个，`r = −4.35%` |\n| 方法选择 | 增速很小 → **化除为乘**，且因为 `r \u003c 0`，凑整方向必须**往上调** |\n| 列式 | `Δ ≈ 现期 × r = 60 × 4.5%` |\n| 速算步骤 | ① 现期凑整：`61.5 → 60`；② 增速往上凑整：`4.35% → 4.5%`；③ `60 × 4.5% = 2.7` |\n| 结论 | 最接近 **B.2.8 万个** |\n\n**【速算演示】**（画面板书）\n\n```\n   61.5  →  60        （位数多，凑整；板书将 61.5 圈出）\n   4.35% →  4.5%      （增速小于 0，凑整方向往上调）\n\n   减少量 ≈ 60 × 4.5% = 2.7   →   B.2.8\n\n（板书另注：6 × 45 = 270  →  2.7）\n```\n\n**【选项原文】**\n\n- A.1.4\n- B.2.8\n- C.4.2\n- D.5.6\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 老师原话：\n  > \"第 13 题……它的**减少量**、现期、增速，减少量就直接化除为乘。因为这增速比较小嘛，化除为乘的时候呢可以稍微要**凑整**。\"\n  > \"因为 61.5 我觉得位数还是比较多的，那**凑整的方向一定是要往上要变大**——因为它的增速是小于零的，变大到哪儿呢？**4.5** 嘛。用 60 乘以 4.5 就行。\"\n  > \"为什么这边不写 61.5？**无所谓，选项差距这么大。** 6 乘 45 等于 2.7，所以选择 B 选项。\"\n- **凑整方向的内在逻辑**（与第 12 题同源）：`r \u003c 0` 时，`现期 × |r|` 会**偏小**（真实减少量是它再除以 `1 − |r|`，会变大），所以要**往上调**增速，把偏小的那部分补回来。同时把 `61.5 → 60` 的小幅下调也一并\"还\"回去，两个方向的调整互相抵消。\n- **陷阱类型**：① 概念陷阱（题目问\"减少量\"，取绝对值比选项，不要写成负数或算成\"增长量\"）；② 方向陷阱（`r \u003c 0` 时凑整方向是**往上**，与 `r > 0` 时相反）；③ 精度陷阱（两个数同时调整，方向相反、幅度相近，误差自然抵消）。\n\n---\n\n### 第 14 题｜本集结尾仅一句带过（画面未展开）\n\n> 转写末尾仅有：\"**14 题。**\"\n\n本集视频在第 13 题讲完后**即为结束**（视频总长 31 分 52 秒，最后一帧 `f_0239.jpg` 仍在第 13 题板书上），第 14 题的题干、材料与讲解**未在本集出现**，应衔接**第 10 集《快速估算课后作业解析（下）》**。\n\n---\n\n## 本讲知识点总表\n\n| 题号 | 材料主题 | 题型 | 增速特征 → 方法 | 速算锚点 | 答案 |\n|---|---|---|---|---|---|\n| 1 | 2021 全国城市供水总量 | 求基期 | 6.96% → 化除为乘（算增量再减） | `673 × 6.96% = 670 × 7%` → 47；`673 − 47 = 626`；`+3.4 → 629.4` | C |\n| 2 | 2020 实物商品网上零售额 | 求增量（先求现期） | 14.8% → 分数法 | `39万 × 24.9% ≈ 39 × 1/4 = 9.75`；`Δ = 10/8 = 1.25` | A |\n| 3 | 2018 B 省租赁和商务服务业 | 求增量 | 22.98% → 分数法 | `15.19 → 15`，`22.98% → 25% = 1/4`，`Δ = 15/5 = 3` | A |\n| 4 | 2017 我国电信业务收入 | 求增量 | 6.4% → 化除为乘 | `6.4% − 6.4%×6.4% ≈ 6%`；`1262 × 6% = 75.7` | B |\n| 5 | 2021 1-9 月机床工具对美出口 | 求增量 | 27.4% → 分数法 | `27.4% → 25% = 1/4`，`17.5 → 19`，`Δ = 19/5 = 3.8` | D |\n| 6 | 2020 互联网企业业务收入 | 求增量 | 12.5% = 1/8 → 分数法 + 错位相加 | `Δ = 12838 ÷ 9`；`1408 + 14 → 1422` | C |\n| 7 | 2020 居民人均可支配收入 | 求基期 | 4.7% → 化除为乘（算增量再减） | `32 × 4.7% ≈ 30 × 50 = 1500`；`32189 − 1500 = 30689` | B |\n| 8 | 2022 全国海水产品产量 | 求增量（区间选项） | 2.1% → 化除为乘 | `3460 × 2% = 70`（60 与 80 之间） | C |\n| 9 | 2015 谷物及谷物粉进口金额 | 求增量（表格定位） | 52.4% → 分数法 | `52.4% → 50% = 1/2`，`582 → 600`，`Δ = 600/3 = 200` | B |\n| 10 | 2011-2018 保险行业保费收入 | 求增速 | 用 `现期/基期 = 1+r` 保留整数 | `3.8/1.43 = 3.8 × 7 = 26.6 → 166%` | B |\n| 11 | 2022-2023 批准用海面积 | 求增速（挂钩型） | `−16% ≈ −1/6` 分数法 / 比值法 | `23/22 = 1/(1−16%) = 1/0.84 ≈ 1.2` | D |\n| 12 | 2014 1-2 月银行间债券累计发行 | 求基期 | `|−4.7%| \u003c 10%` → 化除为乘 | `3927.9 + 5780.5 = 9708`；`9708 × (−5%) = −485`；`9708 + 485 = 10193` | C |\n| 13 | 2020 年底基层群众性自治组织 | 求减少量 | `−4.35%` → 化除为乘（往上凑整） | `61.5 → 60`，`4.35% → 4.5%`，`60 × 4.5% = 2.7` | B |\n\n---\n\n## 速算口诀与解题流程\n\n### 一、先问一句：\"这个题要算增量，还是要算基期？\"\n\n```\n① 只要增速好估（百化分 / 分数法的特殊位置）\n     → 走减法：基期 = 现期 − 增量\n     → 分数法出增量：Δ = 现期 ÷ (分母 + 1)\n         r = 1/4 → Δ = 现期 ÷ 5\n         r = 1/2 → Δ = 现期 ÷ 3\n         r = 1/7 → Δ = 现期 ÷ 8\n         r = 1/8 → Δ = 现期 ÷ 9\n② 增速不好估（不靠近百化分）\n     → 走除法：基期 = 现期 ÷ (1 + r)，用放缩算\n③ 求增速（不是求增量）\n     → 优先用：现期 ÷ 基期 = 1 + 增速（保留整数，少算一步）\n```\n\n> ⭐ 老师原话：\"如果它的增速适合**化除为乘**跟**分数法**比较快，那就直接去估增量再去做处理；如果不太适合用这两个方法，就去用什么**放缩**，就直接算基期。**根据增速的特点进行选择。**\"\n\n### 二、分数法（份数法）三步走\n\n```\n① 把增速凑成百化分：22.98%→25%、52.4%→50%、14.8%→14.3%(1/7)、12.5%→1/8\n② 另一端（现期）反向调整，凑成好算的整数（15.19→15、582→600、9.75→10）\n③ 增速 = 1/n  →  基期 n 份 ＋ 增量 1 份 ＝ 现期 (n+1) 份\n     Δ = 现期 ÷ (n + 1)\n```\n\n### 三、化除为乘（低增速专杀）\n\n```\nΔ = 现期 × r ÷ (1 + r)\n  = 现期 × r × (1 − r)        （1 ÷ (1 + r) ≈ 1 − r）\n  = 现期 × (r − r²)\n  ← r² 用九九乘法表近似：6.4×6.4 = 36 → 记 0.4%\n  例：6.4% − 0.4% = 6%  →  1262 × 6% = 75.7\n```\n\n**凑整方向铁律（本集第 1、12、13 题反复验证）：**\n\n| 情况 | `现期 × r` 的偏向 | 凑整方向 |\n|---|---|---|\n| `r > 0`（增长） | 偏**大**（真实 Δ 要再除 `1+r`） | 现期取整后，结果要**选偏大**的 / 或把 r 往下凑 |\n| `r \u003c 0`（下降） | 偏**小**（真实减少量要再除 `1−|r|`） | 把 `|r|` **往上**凑（4.7%→5%、4.35%→4.5%） |\n\n### 四、错位相加（÷9 专用）\n\n```\na ÷ 9   →   错位相加：a + a/10 + a/100 + …\n            例：128 ÷ 9 → 128 + 12.8 = 140.8 → 1408\n                       再 +1.408 → 142.2 → 1422\n            结果天然偏小约 1%，可用\"补一位\"修正\n```\n\n### 五、三大自检动作\n\n```\n① 自检方向：我这一步是\"调大\"还是\"调小\"了？结果会偏大还是偏小？\n② 自检量级：误差的绝对量（几十）与选项差距的绝对量（几百）比一比，够了就不用管\n③ 自检定位：题目问的年份 / 口径 / 累计还是单月，材料给的增速是同比还是环比\n```\n\n---\n\n## 易错点与陷阱清单\n\n| 编号 | 陷阱类型 | 具体表现 | 本集出处 | 正确做法 |\n|---|---|---|---|---|\n| 1 | 概念陷阱 | 把 `Δ = 基期 × r` 直接写成 `现期 × r` 而不修正误差方向 | 第 1 题 | 现期比基期大 → 增量偏大 → 结果偏小 → 必须取比 626 大的数 |\n| 2 | 概念陷阱 | 忘了 `Δ = 现期 ÷ (n+1)`，误用 `÷n` | 第 2、3、6、9 题 | 增速 1/n → 基期 n 份 + 增量 1 份 = 现期 (n+1) 份 |\n| 3 | 概念陷阱 | 只看到\"比重 24.9%\"就当作增速用 | 第 2 题 | 先 `总量 × 比重` 求出现期，再用增速求增量 |\n| 4 | 单位陷阱 | 材料给\"亿元\"，题目问\"万亿元\" | 第 2 题 | 39 万亿 × 1/4 = 9.75 万亿 |\n| 5 | 定位陷阱 | 三行行业数据找不到\"第二个\" | 第 3 题 | 题干点名\"租赁和商务服务业\"→ 取中间一行 |\n| 6 | 精度陷阱 | 选项差距小时仍用粗调（15 → 25%） | 第 3 题 | 差距小就用 `2/9 + 15.7 + 11 份` 精算 |\n| 7 | 计算量陷阱 | 先减增量把两位数变三位数 | 第 10 题 | 用 `现期 ÷ 基期 = 1 + r` 保留整数 |\n| 8 | 答非所问陷阱 | 算出 `1 + r = 2.66` 直接当答案 | 第 10 题 | 要减 1，`r = 166%` |\n| 9 | **跳板陷阱** | 用假设值算基期：`600 − 200 = 400` | 第 9 题 | 必须用实际现期减实际增量：`582 − 200 = 382` |\n| 10 | 时间/口径陷阱 | 1 月环比、2 月环比、2 月同比全都用上 | 第 12 题 | 只用\"1-2 月累计同比 −4.7%\"；环比口径与本题无关 |\n| 11 | 范围陷阱 | 取\"债券市场\"而非\"银行间债券市场\" | 第 12 题 | 题目问\"银行间\"，只取 3927.9 + 5780.5 |\n| 12 | **方向陷阱** | `r \u003c 0` 时把增速往下凑整 | 第 12、13 题 | `r \u003c 0` 时 `现期 × |r|` 偏小 → 需**往上**凑（4.7%→5%、4.35%→4.5%） |\n| 13 | 基数不对称陷阱 | 跌 16% 后以为涨 16% 就能回到原位 | 第 11 题 | 跌幅基数大、涨幅基数小 → 涨幅必须大于 16% |\n| 14 | 计算量陷阱 | 跨年挂钩题硬把每一年的绝对量算出来 | 第 11 题 | 直接 `23/22 = 1/(1−16%)`，绝对量天然抵消 |\n| 15 | 区间选项陷阱 | 区间题仍追求精确值 | 第 8 题 | 只需判断落在哪一段（70 落在 60～80） |\n| 16 | 干扰条件陷阱 | 把\"增速比前三季度加快 1.2 个百分点\"\"增速同比提高 1 个百分点\"\"增速低于上年同期 8.9 个百分点\"当有用条件 | 第 2、4、6 题 | 这些与本题所问指标无关，直接跳过 |\n\n---\n\n## 老师金句\n\n⭐ **关于\"算增量还是算基期\"：**\n> \"基期计算一般会给我们一个现期、一个增速。计算基期主要是两种思路：基期 = 现期 ÷ (1 + 增速)；基期 = 现期 − 增量。到底选择哪种思路，主要就是看**这个增量好不好估**。如果这个增量好估，很明显**减法比除法要来得快**。\"\n\n⭐ **关于误差方向（第 1 题）：**\n> \"你算的这个 47 它是**偏大**的……**你减的数变大了，就会导致你最后算出来的数变小了**。但不是说它小 7%，这时候就要看**量**了。因为他们经过了一个减法的处理。\"\n\n⭐ **关于\"调整幅度看选项\"（第 2 题）：**\n> \"**我本身动的就比较小**，就动了那么一点点，就动了那么几个点，百分之十都没有吧。而它的这个**选项之间的差距是非常大**的，都基本上是翻倍的这种感觉了。所以算得很粗糙，你都不可能选到 B、C、D 上面去，差太远了。\"\n\n⭐ **关于\"直接误差 vs 间接误差\"（第 7 题）：**\n> \"我们的计算对象是什么？是**增量**，它的量只有 1500……而选项里面这个东西是谁？是基期，是三万多，他们之间的差距是好几百。**这几十的误差能影响他们几百的差距吗？影响不到，所以压根不用管。**\"\n> \"这也是我解释**为什么在增速低的时候，我们要去算增量、再去算基期**，而不是直接去算基期。因为这样你计算对象很小，误差就会很小，你的施展的空间就会很大。\"\n\n⭐ **关于\"跳板\"（第 9 题）：**\n> \"这个 600 它只是我们**假设出来的一个跳板**，去算一个相同的增量。……所以它实际的基期，你要用**实际的现期**去减掉它的一个**实际的增量**，才能算出来这个基期 382。**你只是借助这个跳板去算了个近似的增量。**\"\n\n⭐ **关于\"保留整数\"（第 10 题）：**\n> \"现期除以基期，它是等于 1 + 增速的。为什么要还要加个一呢？因为这样子我们可以**保留 3.8 这个偏整一点的数**。不然你去把这个增量减出来，是把分子从 3.8 变成了 2.37，**把两位数变成了三位数，就在无形中增加了你的计算量**。\"\n\n⭐ **关于\"绝对量不重要\"（第 11 题）：**\n> \"**其实 22 年的量到底是多少数没有关系的，不重要的。它的量哪怕就是一、哪怕是二、哪怕是零点一，它们 21、22、23 这三年之间的比值关系永远是不变的。**\"\n\n⭐ **关于\"准与快\"（第 5 题）：**\n> \"**这就是准一点和快一点，其实都只是看你想它有多准而已。**\"\n\n⭐ **关于节奏（第 3 题）：**\n> \"第三题后面就要开始稍微加快一点进度了，加快点速度了。前面基本上是把这个怎么算增量，再给大家再过了一遍。\"\n","outline":[{"level":2,"text":"本集题目总览（网格 → 题号 → 考点 对照表）","id":"本集题目总览网格-题号-考点-对照表"},{"level":2,"text":"本集核心方法论：算增量还是算基期？","id":"本集核心方法论算增量还是算基期"},{"level":2,"text":"例题精讲","id":"例题精讲"},{"level":3,"text":"第 1 题｜2021 年数据 · 城市供水总量基期","id":"第-1-题2021-年数据-城市供水总量基期"},{"level":3,"text":"第 2 题｜2020 年数据 · 实物商品网上零售额增量","id":"第-2-题2020-年数据-实物商品网上零售额增量"},{"level":3,"text":"第 3 题｜2018 年数据 · 租赁和商务服务业新登记企业增量","id":"第-3-题2018-年数据-租赁和商务服务业新登记企业增量"},{"level":3,"text":"第 4 题｜2017 年数据 · 电信业务收入增量（化除为乘）","id":"第-4-题2017-年数据-电信业务收入增量化除为乘"},{"level":3,"text":"第 5 题｜2021 年 1-9 月 · 机床工具对美出口额增量","id":"第-5-题2021-年-1-9-月-机床工具对美出口额增量"},{"level":3,"text":"第 6 题｜2020 年数据 · 互联网企业业务收入增量","id":"第-6-题2020-年数据-互联网企业业务收入增量"},{"level":3,"text":"第 7 题｜2020 年数据 · 居民人均可支配收入基期","id":"第-7-题2020-年数据-居民人均可支配收入基期"},{"level":3,"text":"第 8 题｜2022 年数据 · 海水产品产量增量（范围题）","id":"第
