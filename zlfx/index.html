边超过四了，四多一点，也能看出来。\n\n**（2）741/709 VS 677/656（基准线 = 1，都在 1 上方）**\n\n```\n741/709 − 1 = 32 / 709\n677/656 − 1 = 21 / 656\n\n32 / 709  >  21 / 656\n⇒ 左边比「1」多出来的部分更多 ⇒ 左边更大\n⇒ 741 / 709  >  677 / 656\n```\n\n> 那么看下面这一个，741 除以 709，跟 677 除以 656，它们都是比 1 多一点的，所以我们统一减个 1，我们不要用 1 来减它们了，我们统一把它们比 1 多出来的部分给它减掉，剩的是 32 除以 709，右边剩的是 21 除以 656。你看这样是不是一下大小关系也很容易看出来了？32 比 21 多了起码 50%，那说明左边这个比 1 多出来的部分要多更多，说明左边大。\n\n> 这有什么好乱的？你要是都觉得乱，我觉得你应该不要去逃避它，应该想的是我应该把它理顺过来。这又不是什么奇怪的偏门，**它本身就是从数字大小关系上去推理出来的一个方法。**\n\n> 那我反正是觉得这种就是它本身离这些很特殊的数很近的时候，这种你统一把它们去减掉某一个固定的值的时候，把他们的这个差距给它放大，是很明显的一种思路。**你甚至很多时候都不需要怎么计算的。**\n\n**（3）514/1180 VS 326/656（基准线 = 1/2，都在 1/2 下方）**\n\n```\n基准线 1/2：\n分母 1180 的一半 = 590；590 − 514 = 76  → 左边离 1/2 还差 76 / 1180\n分母 656 的一半 = 328；328 − 326 = 2    → 右边离 1/2 只差 2 / 656\n\n右边离 1/2 只差 2/656，比左边近得多 ⇒ 右边更大\n⇒ 514 / 1180  \u003c  326 / 656\n```\n\n> 来第三个例子。514 除 1180 跟 326 除以 656，就是离 1/2 就很近。我直接去除吧，或者说直接去算吧，就比较麻烦；你去看什么分子和分母增长速率也挺麻烦的，直接把它们去减掉二分之一。\n\n> 减二分之一的时候，你就去给分子去减掉分母的一半，分母 1180 的一半是 590。发现不对，不是减 1/2……因为他们比 1/2 要小，所以呢拿 1/2 来减，他们分母的一半是 590，说明左边离这个 1/2 还差 76/1180。那右边分母的一半是 328，他离这个二分之一就只差 2/656……那右边这个离二分之一就很近，离得就特别近，比左边那个近多了吧？它离二分之一更近，所以它更大。\n\n> 也可以。有没有可以把右边乘 2？当然也可以，就是分子和分母的元素整理，把它们去乘个 2，右边的就变成 1312……分母上变、分子上变成 652。没什么意义，但这样子你看这边加了个 138，分母上加了个 132，也能看得出来，分子涨得更多，所以这边更大。就是你用那个差分法，这个题目肯定也能做。\n\n> 就是把它扩大两倍，让他们离得近一点，你就看他们这个分子分母的一个差距。\n\n**（4）314/3065 VS 481/4722（基准线 = 1/10，都在 1/10 上方）**\n\n```\n基准线 1/10：\n左边：分母 3065 的 1/10 ≈ 306，314 − 306 = 8   → 8 / 3065\n右边：分母 4722 的 1/10 ≈ 472，481 − 472 = 9   → 9 / 4722\n\n分子差不多（8 与 9），但右边分母 4722 比 3065 大太多\n⇒ 8 / 3065  >  9 / 4722  ⇒ 左边比 1/10 高出更多 ⇒ 左边更大\n```\n\n> 这种离什么二分之一啊、一啊、什么三分之一啊、十分之一啊、五分之一啊比较近的时候，你去把它们统一减掉，很快的。那这个就是离十分之一很近嘛，我给上面减个 306，把 1/10 统一减掉，这边还剩 8/3065；然后把右边这个我也减个它的十分之一，减个 472，剩个 9 除以 4722。\n\n> 这个时候就明显看出来了吧，**8 除以 3065 是比 9 除以 4722 要大的**。因为它们分子是差不太多的，但是分母上右边这个分母比 3065 大太多了。**分子涨得慢、分母长得快，所以它会变小**，所以是小的。所以左边更大，因为左边比那个十分之一高出来的部分要大一点。\n\n> 比如说这个就是拆分，确实也是拆分，但是还是稍微有点不一样的。因为如果你只是从拆分的角度去理解的话，你每次只会减什么东西呢？你只会减分母乘 0.1、乘 0.2、乘 0.3。但是相当于我把这个东西给你拓宽了一下，**你不光可以去减掉分母的 0.3、0.2、0.4 什么的，也可以减掉分母的三分之一、分母的四分之一**，对不对？你不会拆分的时候，你会去拆个什么乘 0.25 对不对？你不会去拆这个东西的。但如果它这个数本身离 1/4、1/3 很近，那你就是减掉分母的 1/4、1/3 就好了。**所以它的原理、它的核心都是因为是离某个你常用且好算的值很近的时候才这样子的。**\n\n**「基准线方向」辨析（有同学提问，老师专门解释）**\n\n> 有同学问，怎么有的时候大的更大、小的更大，你要看谁减谁呀？比如说刚刚这个地方，我们是看他们到二分之一的距离，是距离，他们在下面，他们这个 A 和这个 B 在这个二分之一的下面，**这个时候距离大的反而就小了**。而下面这个题目，它们是在十分之一的上面，**这个时候，他们离十分之一谁越大，谁就越大**。\n\n> 就是给他们画这条线嘛，就是**基准线法**嘛，一条线，你看他们的线的哪个方向、在哪个位置。**都在上面，那谁离得远谁就大；都在下面，谁离得近谁更大。**\n\n---\n\n## 五、例题精讲（比较大小类）\n\n### 例题 2｜2012 年全省各市及义乌市 GDP 初步核算数据 · 第二产业增加值占 GDP 比重\n\n#### 【题干原文】\n\n> 2012 年全省各市及义乌市 GDP 初步核算数据\n>\n> 第二产业增加值占 GDP 的比重最高的是：\n> A. 湖州市　　B. 宁波市\n> C. 嘉兴市　　D. 绍兴市\n\n#### 【材料数据】（画面 f_0345 / f_0365 逐字抄录）\n\n| 地区 | GDP（亿元） | 第一产业（亿元） | 第二产业（亿元） | 第三产业（亿元） | GDP 可比价增速(%) | 第一产业(%) | 第二产业(%) | 第三产业(%) |\n|---|---|---|---|---|---|---|---|---|\n| 全省 | 34606.30 | 1669.49 | 17312.37 | 15624.44 | 8.0 | 2.0 | 7.3 | 9.3 |\n| 杭州 | 7803.98 | 255.93 | 3626.88 | 3921.17 | 9.0 | 2.5 | 8.5 | 10.1 |\n| 宁波 | 6524.70 | 269.97 | 3516.73 | 2738.00 | 7.8 | 1.6 | 6.0 | 10.9 |\n| 温州 | 3650.06 | 112.90 | 1843.06 | 1694.10 | 6.7 | 1.2 | 6.0 | 8.0 |\n| 嘉兴 | 2884.94 | 150.05 | 1620.82 | 1114.07 | 8.7 | 1.1 | 8.4 | 10.2 |\n| 湖州 | 1661.97 | 123.31 | 888.20 | 650.46 | 9.7 | 2.5 | 10.7 | 9.6 |\n| 绍兴 | 3620.10 | 184.72 | 1949.07 | 1486.31 | 9.7 | 2.9 | 9.7 | 10.8 |\n| 金华 | 2700.12 | 134.44 | 1344.66 | 1221.02 | 10.2 | 4.0 | 10.2 | 10.9 |\n| 义乌 | 802.94 | 21.10 | 334.15 | 447.69 | 10.2 | 3.9 | 10.1 | 10.5 |\n| 衢州 | 982.75 | 79.85 | 531.91 | 370.99 | 8.7 | 3.1 | 8.7 | 10.0 |\n| 舟山 | 851.95 | 83.05 | 385.42 | 383.48 | 10.2 | 5.5 | 12.3 | 9.1 |\n| 台州 | 2927.34 | 201.12 | 1435.04 | 1291.18 | 7.5 | 2.5 | 7.1 | 8.6 |\n| 丽水 | 885.17 | 79.35 | 446.09 | 359.73 | 10.5 | 3.6 | 12.6 | 9.6 |\n\n老师在画面右侧写下的四个分式（红笔，画面 f_0345）：\n\n```\n351 / 652  （宁波）   162 / 288  （嘉兴）\n888 / 1661 （湖州）   195 / 362  （绍兴）\n```\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 比重最高（第二产业增加值 ÷ GDP），四个分式比较大小 |\n| 定位数据 | 宁波、嘉兴、湖州、绍兴四市「GDP」与「第二产业（绝对值）」两列 |\n| 列式 | `第二产业增加值 / GDP` |\n| 关键观察 | 四个分式**都在 1/2 附近**，没有差距特别大的数 |\n| 统一处理 | 全部**减去二分之一**，去看各自离 1/2 有多远 |\n| 演算（画面 f_0365） | 宁波：分母 652 的一半 = 326，351 − 326 = **25 / 652 ≈ 4%**；嘉兴：分母 288 的一半 = 144，162 − 144 = **18 / 288 ≈ 6%**；湖州：分母 1661 的一半 ≈ 830，888 − 830 = **58 / 1661 ≈ 4%**；绍兴：分母 362 的一半 = 181，195 − 181 = **14 / 362** |\n| 排除 | 绍兴分子 14 比嘉兴 18 还小、分母 362 却比 288 大 ⇒ 绍兴直接排除（不可能最高） |\n| 结论 | 嘉兴 18/288 ≈ 6% 最大 ⇒ 第二产业增加值占 GDP 比重最高的是嘉兴 |\n\n#### 【选项原文】\n\n- A. 湖州市\n- B. 宁波市\n- C. 嘉兴市\n- D. 绍兴市\n\n#### 【答案】\n\n✅ **C（嘉兴市）**\n\n#### 【解析】\n\n> 他问：第二产业增加值占 GDP 比重最高的是哪一个城市？就是这下面四个选项：湖州、宁波、嘉兴、绍兴。找他们对应的第二产业占 GDP 的比重。这四个城市，它们对应的比重分别是：351 除以 652，这是宁波的；嘉兴的就是 162 除以 288；湖州的就是 88.8 除以 1661；然后那个绍兴的就是 1949，就 195 除以 362。\n\n> 比较这四个分式，比较大小……那你在写的时候有没有注意到这四个数他们好像都挺近的，都在大概哪儿？对，都在二分之一附近。他没有那种很明显的跟大家说，比如说差距特别大的那种数。所以我们就**统一地去减掉大家的二分之一**，去看看他们分别离二分之一有多远，这样的倍数关系会更明显。\n\n> 那宁波这边分子要减多少啊？减 326，它就会变成 25 除以 652。嘉兴这边呢，分子就要减 144，变成 18 除以 288。湖州这个分子就要减 83 左右，就会变成 58 除以 1661。绍兴要给分子减 181，就会变成 14 除以 362。\n\n> 现在我要找哪一个最高，那有一些很明显已经不可能最高了，是不是就可以排除掉了？比如说绍兴，它的分子已经比旁边这个嘉兴要小、份额还大，对不对？现在绍兴一下子就能排掉了。**你只要把他们大家都有的这部分给它减掉，剩下的部分呢，他们的大有差距呢，就相对来说是比较明显的了。**\n\n> 那这三个里面谁更大谁更小，你就可以大概地去估一下了。因为一般这种时候你已经把大家一个很主要的一个主体百分之五十全挖掉了，那剩下的部分它往往差距是比较大的，你简单去估一下就可以了。\n\n> 那 25 除以 652 是不是大概在百分之四附近？18 除以 288 大概是 6% 附近，58 除以 1661 是不是 4% 附近？所以这个 162 除以 288 就是这个嘉兴，它的占比是最高的，所以我们选择 **C**。\n\n> 你减一半能花多少功夫？比你这四个一个个除出来快多了吧。你这四个分式一个是百分之五十四，一个百分之五十六，一个百分之五十四，也有大概有差不多百分之五十四，你真去把它算出来去比的话也不好算的，你看差距其实真的很小的。一般来说，你把他们这个统一的主体给它剪掉之后，剩下的部分就是比较好算的，比较好、明显就看出来了。\n\n> 考试的时候要不要写出来？**你记不住，你就写；你记得住，你就不用写嘛。** 我这个地方口算快速，我随便估的呀，我就只看到这个六，四六二十四，我这个地方 288，我就看到三百嘛，三六一十八嘛。因为我知道我已经把他们主要的部分全去掉了，那剩下的部分他们不可能说靠得特别近的了。**要是我已经去掉了百分之五十那么多，剩的这种个位数，他还靠得特别近，那这个题目他给谁做呀？**\n\n> 还有一点要问清楚：**「增加值」不是「增量」**，它本身就是你把它理解成它就相当于是个现期值，是这个第二产业今年它生产了多少的产量、多少的值，就叫做第二产业的一个增加值，就是这个绝对值这个东西。\n\n**陷阱类型**：概念陷阱（「增加值」≠「增量」）+ 范围陷阱（表中 13 行，题目只问 4 个城市）\n\n---\n\n## 六、第二板块：增速比较大小的特殊技巧\n\n板书（画面 f_0380 / f_0396）：\n\n> **增速比较大小**\n>\n> 根据差分法，比较增速大小时，可以得到下述结论：\n>\n> **相邻年份增速比较，只有后一年增量比前一年增量高出的比例 ≥ 前一年增速，后一年增速才能 ≥ 前一年增速。**\n>\n> **要想增速不降低，增量跟着上「楼梯」。**\n\n> 那第二块呢是关于我们特定的题型，对于增速比较大小的时候，一些小的技巧去帮助你来提速的。\n\n> 比较增速大小，我们还是以前面的这种分式比较大小的逻辑去做一个基本的框架，只是在这个框架上稍微有一点点……就是一个小结论。就是我们在比较增速大小的时候，相对于相邻增速的比较：**如果你希望后一年的增速不低于前一年，那么它后一年的增量就必须要比前一年的增量高出的比例，要能起码能够大于等于前一年的增速。**\n\n> 这个感觉读起来听起来有点绕，是吧？所以我来一个这种具体的数值来给你演示一下什么意思。\n\n### 「利滚利」原理与结论\n\n**演示图表（画面 f_0380 / f_0396）**\n\n> 2012~2016 年年末固定互联网宽带接入用户和移动宽带用户数（万户）\n\n| 年份 | 固定互联网宽带接入用户（万户） | 移动宽带用户（万户） |\n|---|---|---|\n| 2012 | 17518 | 23280 |\n| 2013 | 18891 | 40161 |\n| 2014 | 20048 | 58254 |\n| 2015 | 25947 | 70611 |\n| 2016 | 29721 | 94075 |\n\n老师在画面上取移动宽带用户数的前三位并逐段做差（画面 f_0396 红笔）：\n\n```\n232 → 401   增量 +169\n401 → 582   增量 +181\n582 → 706   增量 +124\n706 → 940   增量 +236\n\nr₁₃ = 169 / 232\nr₁₄ = 181 / 401\n```\n\n> 比如说我如果要去比较一三、一四、一五、一六，我去比较这四个年份的增速。然后我们第一步是干嘛？**我们第一步先去把它们增量给它减出来**。为什么去减这个增量呢？因为你增速它也是个分式比较嘛，增速等于**增量除以基期**，对不对？那基期都是在表上直接能看到的，增量你是没有办法一眼看到的，所以第一步你应该先把增量减出来。\n\n> 那你先把一三年增量减出来吧，它的增量大概是 169，我们就取他的前三位。232 + 169 = 401，对不对？好，然后 401 变成 582，加的是多少？加了个 181。好，等这个减出来的时候，我就知道，**14 年的增速肯定是没有 13 年的高了。**\n\n> 为什么我会这么直接地判断出来 14 年的增速没有 13 年的高呢？那你看 14 年的增速是多少？是 181 除以 401，401 我都取了三位；13 年的增速呢，是 169 除以 232。我们比较分式大小，根据我们平均数增长率的结论，是不是看分子分母谁长得快？那分母它从 232 涨到 401 涨了多少？涨了，那不就是 169 除以 232 吗？那如果你希望这个 14 年的增速就这个分式，如果希望它能比 13 年的增速大于等于它，起码不比它低，你是不是需要你这个分子也能按照这个增速来涨？**起码你上面这个分子的增速也要大于等于分母上的 169 除以 232 吧？**\n\n> 这就是我们想推出来的结论：**你后一年的增速，你要能起码保证它的增量在前一年的增量的基础上，要能涨这么个增速。** 就是我这个地方，它不应该是一八一，它起码得是\n\n```\n169 × (1 + 169/232)\n```\n\n> 他才能够保持一个增速不变。\n\n**换一种讲法（老师第二次解释）**\n\n> 我这个地方是不是加了个 169，不看后两位，13 年的增速就是 169 除以 232，对吧？那一四年的增速是什么呢？是它的增量除以 401。这个 401 是哪来的？是 232 加上 169，就是这个 232 乘以 `(1 + 169/232)`。我一四年它的分母这个基期，它已经比这个一三年的基期（就一二年这个值）提高了这样一个增速了，**我的分子它起码也要提高这样一个增速，他才能让这个分式不比对方分数小**。它这个增量就起码也得是\n\n```\n169 × (1 + 169/232)\n```\n\n> 这样一个关系明白吗？它起码增量要能达到这个地方，它的增速才能跟 13 年的持平。\n\n**再拿最简单的小数字讲一遍（老师第三次解释）**\n\n> 比如说我的基期是 10，现期是 11，哎，我是不是涨了个 1？我的增速是不是 10%？那如果到了下一年，我这增量起码是加多少，我才能起码说保持这个增速不变、或者说增速要比这个高？我这边起码要加 **1.1**，就到 12.1，这样才可以，这样你的增速是不是也是 10%？\n\n> 如果你这个量比 1.1 小，比如说你也就加了个 1.05，那肯定不行，因为你 1.05 比这个 1 高，只高了 5 个点，而你这个 1 起码占了这个 10 的十个点，那你这个就涨少了，就意味着你后一年的那个分子增速涨少了，那你这个增速不就低了吗？\n\n> 懂了吗？**就是如果你的增速是保持不变的，你的增量都起码是等比例扩大的。那如果你的增量都没达到等比例扩大，不就说明你的增速下降了吗？下滑了吗？**\n\n**应用到四段增量上**\n\n```\n232 → 401  （+169）     → 13 年增速 = 169/232\n401 → 582  （+181）     → 181 太小，没达到 169×(1+169/232)，14 年增速 \u003c 13 年增速\n582 → 706  （+124）     → 增量不但没等比例扩大，还缩小了 ⇒ 15 年增速更低\n706 → 940  （+236）     → 236 远大于 124，几乎翻倍 ⇒ 16 年增速 > 15 年增速\n```\n\n> 能干嘛？能做的事情就是我把这个地方剪出来，这是 169，我再把这剪出来，这是 181。**我是不需要去念什么式子的，我不需要去写什么 181 除 401，我不用去动笔写下来**说右边是个 181 就是 401，这边是个 169 除以 232，写下来再发现，哦，不对，这个分子好像太小了，又有啥要写的呢？\n\n> 因为你前面 232 涨到 401 涨 169，这本身就是一个很大的增长了，你后面才加个 181，有什么好加的？这个东西就太小了。明白吗？**这个增量提高得太小了，导致这个增速其实是没有之前大的。**\n\n> 哎，再往后写 582、706 涨了多少？124。要写吗？你也不用写。你增量你甚至都没扩大。你想保持增速不下滑，你的增量就要跟着等比例扩大。你现在不但没有等比例扩大，你还缩小了。\n\n> 那这个地方要比如说要到多少，一五年的增速才能不比一四年的增速低呢？他起码得是\n\n```\n181 + 181 × (181/401)\n```\n\n> 这个地方你可以大概估一下，比如说我这个 181 是这个 401 的大概 45%，所以我这个地方的增量，它起码得是 181 加上 181 的 45%，它才能够保持增速不变。**我现在只有 124，所以没啥好说的，你这个肯定低啊。**\n\n> 再往后看，706 涨到 940，涨到多少？涨到 236。那这个 16 年的增速肯定就比 15 年的增速要高，因为我这个增量 236 比这个 124 大很多，已经基本上快翻倍了。**你前面这个增速能到翻倍吗？你这个增速有翻倍那么大的影响吗？没有那么大的影响，那我这个增量能提高那么多，就说明我的增速高了呀。**\n\n> 对，**如果你的增速保持不变，你这个增量就像利滚利一样**，从 10 变成 11，我每次涨百分之十，这边我先加个 1，然后再涨百分之十变成 12.1，我这个地方就要是加一个 1.1，我这边再涨百分之十变成 13.31，我这边就要加 1.21，我的这个增量也会不断地去等比例扩大。\n\n> 就是你的基期在不断地增大，但是你这个增量增长的幅度没跟得上，**所以你的增速就下滑了。**\n\n**「利滚利」数字演示（画面 f_0451~f_0468）**\n\n```\n10   →  11      （增量 +1，增速 r = 1/10 = 10%）\n11   →  12.1    （增量 +1.1，增速仍是 10%）\n12.1 →  13.31   （增量 +1.21，增速仍是 10%）\n```\n\n> 对，就是**利滚利**。从 10 变成 11，我每次涨百分之十，这边我先加个 1；然后再涨百分之十变成 12.1，我这个地方就要是加一个 1.1；我这边再涨百分之十变成 13.31，我这边就要加 1.21，我的这个增量也会不断地去等比例扩大。\n\n> 大家要注意的一个点是这种问题：**我们这种思路只有相邻的年份，你可以这么去比较，只有相邻的比较。**\n\n> 13 跟 16 年就不好比了。因为 13 跟 16 年，他们的基期没有那种简单的直接的增速关系。比如你要比 13 跟 16 年，你把 13 年的增量减出来，是个 169，然后 15 年到 16 年这边涨了个 236，这个你不好比，因为 236 的基期是 706，169 的基期是这个 232，他们这个基期跟基期之间是发生了什么样的变化是没有那么直接的。**所以不相邻的地方，你就不要用这个办法去比了。**\n\n> 如果不相邻的，就结合你前面的那个分式比较的方法去，要么就是好算的，你就给它算出来；不好算的比较近的，你去差分去比较。**不要强行去用这个东西**，没有必要。你要是培养起来这种利滚利的感觉，然后你去捡这种资料的时候，你就能够比较快速地去把一些明显不可能给它排掉。\n\n**关于「斜率」的提问**\n\n> 能不能用斜率？**不可以。** 这个我在前面有讲过，这种柱状图的**斜率不是增速，斜率是增量**。\n\n```\n斜率 = 这两个柱子的差 ÷ 这两个柱子之间的距离\n柱子的距离是恒定的（可看作 1）\n⇒ 斜率其实只是增量，它不是增速\n```\n\n---\n\n### 例题 3｜2016 年与 2015 年相比 · 我国新闻出版产业营业收入\n\n#### 【题干原文】\n\n> 2016 年与 2015 年相比，我国新闻出版产业营业收入：\n> A. 增量提高、增速变大　　B. 增量减少、增速变大\n> C. 增量提高、增速变小　　D. 增量减少、增速变小\n\n#### 【材料数据】（画面 f_0475 逐字抄录）\n\n图：我国新闻出版产业和数字出版业营收增长情况（单位：亿元）\n\n| 年份 | 数字出版业营业收入（亿元） | 新闻出版业营业收入（亿元） |\n|---|---|---|\n| 2012 年 | 1935.5 | 16635.3 |\n| 2013 年 | 2540.6 | 18246.4 |\n| 2014 年 | 3387.7 | 19967.1 |\n| 2015 年 | 4403.5 | 21655.9 |\n| 2016 年 | 5720.8 | 23595.8 |\n\n> 说明：题目问的是**新闻出版营业收入**，即图中后面斜线的灰柱子（2015 年、2016 年两个柱子在画面上被红笔圈出）。画面在 2015、2016 两根柱子上方手写标注 `+1700`（后被划掉）与 `1940`，并标 `\u003c10%` / `>10%`。\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 增量变化 + 增速变化的双问（相邻年份增速比较） |\n| 定位数据 | 新闻出版业营业收入：2014 年 19967.1、2015 年 21655.9、2016 年 23595.8 |\n| 第一步：算增量 | 2015 年增量 = 21655.9 − 19967.1 ≈ **1700**；2016 年增量 = 23595.8 − 21655.9 ≈ **1940** |\n| 判增量 | 1940 > 1700 ⇒ **增量提高** ⇒ 排除 B、D |\n| 第二步：比增速（相邻年份） | 2015 年增速 = 1700/19967 \u003c 10%；2016 年要维持增速不变，增量起码要涨 10% 不到 |\n| 判增速 | 实际 1940 比 1700 大得多（远超 10%）⇒ **超额完成，增速变大** |\n| 结论 | 增量提高、增速变大 |\n\n#### 【选项原文】\n\n- A. 增量提高、增速变大\n- B. 增量减少、增速变大（画面画 ✗）\n- C. 增量提高、增速变小\n- D. 增量减少、增速变小（画面画 ✗）\n\n#### 【答案】\n\n✅ **A（增量提高、增速变大）**\n\n#### 【解析】\n\n> 这个 2016 年跟 2015 年相比，我国新闻出版产业它的营业收入增量怎么样、增速怎么样？来找一下 16 年在这儿。新闻出版营业收入就是后面这个斜线的灰柱子。那我们先把比较简单的增量去给它减出来，可以吧？\n\n```\n2015 年增量：21655 − 19967 ≈ 1700\n2016 年增量：23595 − 21655 ≈ 1940\n```\n\n> 15 年的增量是 21655 减 19967，约 1700，1700 的增量。15 年到 16 年的增量是 1940，可以吧。那这个增量很明显是提高的，**先把 B、D 排除**。\n\n> 然后它还有我们比什么呢？16 年跟 15 年相比，它的增速是发生什么变化？就是看 15 年的这个增速和 16 年的增速的比较，就是个**相邻时间的一个比较**。相邻时间的增速比较，你就可以用刚刚那种**利滚利**的感觉，你就想想看，你就直接看什么？你看它这个增量，它有没有超过那个等比例变化？\n\n> 你 1700 是 19000 的多少？是不是只有百分之十不到？你前面的增速只有不到 10%，我后面 1940 比 1700 大得多，已经大了，远远不止 10% 了。就这 1940 跟这 1700 的差距，已经超过了他之前的这个占基期的这个比重，所以这个 1940 它是**超额完成的目标**，超额完成，说明它的增速更大，所以 16 年增速变高。\n\n```\n15 年增速 = 17   / 19967   —— 分子只要涨不到 10% 就能持平\n16 年增速 = 1940 / 21655   —— 实际分子涨了 240，远不止 10%\n⇒ 16 年增速提高\n```\n\n> 就你 15 年的时候，你的增速是 17 除以 19967，16 年的增速呢是 1940 除以 21655，那分母这个东西其实就是左边这个分子，只涨了不到 10%，而分子呢加了是 240，已经不止 10% 了，所以它的增速可能提高的。虽然这个东西的原理跟我们前面讲的分式比较大小里面那个差分是没什么区别的，只是把它更概念化了一点。**这样你去做的时候就不需要每次去都去列个式子。**\n\n> 对，其实本质上就是分式比较，只不过就是把这个操作呢相对来说给你简化一点点，不需要你去动那个笔，直接去看那个表上有了这些数字的关系就可以了。\n\n**陷阱类型**：概念陷阱（「增量」与「增速」两个问题混为一谈，四个选项就是二者的四种组合）\n\n---\n\n### 例题 4｜2018~2021 年 · 我国数字经济市场规模同比增速最快\n\n#### 【题干原文】\n\n> 2018~2021 年，我国数字经济市场规模同比增速最快的是：\n> A. 2018 年　　B. 2019 年　　C. 2020 年　　D. 2021 年\n\n#### 【材料数据】（画面 f_0500 / f_0520 逐字抄录）\n\n图：2016~2021 年我国数字经济市场规模（单位：万亿元）\n\n| 年份 | 市场规模（万亿元） | 环比增量（画面手写） |\n|---|---|---|\n| 2016 年 | 22.6 | — |\n| 2017 年 | 27.2 | — |\n| 2018 年 | 31.3 | +4.1 |\n| 2019 年 | 35.8 | +4.5 |\n| 2020 年 | 39.2 | +3.4 |\n| 2021 年 | 45.5 | +6.3 |\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 同比增速最快（连续年份增速比较，用「利滚利」思路先筛） |\n| 第一步：算增量 | 2018 年 +4.1；2019 年 +4.5；2020 年 +3.4；2021 年 +6.3 |\n| 直接排除 2020 年 | 增量不但没等比例扩大，反而**往后退了**（4.5 → 3.4），基期变大、增量还变小 ⇒ 增速必低 |\n| 直接排除 2019 年 | 增量从 4.1 涨到 4.5 只涨了 0.4，占 4.1 不到 10%；而 2018 年本身增速已超 10%（4.1/27.2 > 10%）⇒ 没有滚起来 |\n| 只需比 2018 与 2021 | 2018 年增速 = 41/272；2021 年增速 = 63/392 |\n| 速算步骤 | 把左边等比扩大 1.5 倍：41 × 1.5 = 61.5，272 × 1.5 = 408 |\n| 结论 | 61.5/408 与 63/392 相比：**分子小、分母大** ⇒ 左边小 ⇒ 2021 年增速更快 |\n\n#### 【选项原文】\n\n- A. 2018 年\n- B. 2019 年\n- C. 2020 年\n- D. 2021 年\n\n#### 【答案】\n\n✅ **D（2021 年）**\n\n#### 【解析】\n\n> 18 年到 21 年我国数字经济市场规模同比增速最快的是 18、19、20、21 这 4 年，哪一年增速最快？那第一步我们还是去减增量。你先要把比较直观的跟分子有关的这个增量给它减出来：18 年的增量呢是 4.1，19 年的增量呢是 4.5，20 的增量 4 都不到，才 3.4，21 年的时候是增加了 6.3。\n\n> 好，这里面有没有什么年份可以不用看的？18、19、20、21，有没有什么年份是你不需要去计算、不需要去列式子，你光是看它这个增量的大小关系，你就能看得出来？\n\n> 二零年这个是最简单的，这二零年肯定不行，因为它不光没有等比例扩大，它甚至它还往后退了。我们大家都在欣欣向荣，我们的基期都在越来越大，结果你二零年，你这个增量还小了，咋回事啊？**我给了你更优越的这个条件啊，你居然没有涨出来更多的增量，是不是说明你的增速低了呀？**\n\n> 那除了二零年呢？19 也不用看吧，19 有啥好看的呢？4.1 到 4.5 才涨了多少啊？你前面这个 4.1 占 27.2，你这个 18 年它本身都已经涨了 10% 多了，你增量你都没涨到 10% 哎，才涨了个 0.4，除 4.1 不到 10%，所以这个 19 也不用看，**它也没有利滚利起来，它没滚得起来**。它这个增量没有涨到等比例扩大，所以你只要比较 18 年跟 21 年的增速就可以了。\n\n> 所以这个题目你就只是比较 **41 除以 272** 和 **63 除以 392**。看他们俩哪个大哪个小，那这两个呢其实也还是比较近的。\n\n**画面两条思路（f_0520）**\n\n```\n思路一（直接算）：他们好像离 1.5 倍 / 15% 挺近的，看看分别比 15% 多多少\n        272 加约 136 → 408，对应分子 41 + 20.5 ≈ 61.5（离 15% 非常近）\n        右边 63/392：60/400 就是 15%，明显比 15% 高 ⇒ 右边更大\n\n思路二（差分 / 等比扩大拉近）：\n        41 / 272   ── 上下同 ×1.5 ──▶  61.5 / 408   （分子 +20.5，分母 +136）\n        61.5 / 408  \u003c  63 / 392     （右边分子大、分母小）\n        ⇒ 2021 年增速更高\n```\n\n> 如果你不想算，你只想比，也没办法比，比了半天没必要的，想一想方法，其实很多。第一种我就算呗。我发现他们好像离 1.5 倍或者说百分之十五挺近的，那我就看看他们分别比百分之十五多多少。27.2，我给它加个 50%……272 乘以 15% 是加一（半）……加 136 变成 408，而这边呢是 410，就相当于是离这个 15% 是非常非常近的。而右边这个它就明显比 15% 高了，因为 60 除以 400 是 15%。所以这个明显大于它，那我们能看出来右边的更大，但就依赖于计算。\n\n> 好，我们如果想不计算用差分法，你直接做差吗？直接做差，你虽然也可以，但是我感觉这并不是一个特别熟练的用差分法的人会做出来的事情。因为 41 除以 272 和 63 除以 392，是有一个相对比较明显的倍数关系的。**你可以把左边那个上下都多加 50%**，左边那个就变成分子 61.5，分母就变成加 136，变成 408，这不就明显了吗？因为这样，你就发现，原来右边的是**分子大、分母小**，所以 21 年的增速更高。\n\n> 你看等你把他们分子分母一拉近了，拉近了之后，你会发现他们那个差值的那个比值就被你一下子放大了很多倍，一下就能看出来了。**为什么我会把左边的去把它变成 1.5 倍呢？因为这样你才能离右边的分子分母离得更近。你距离越近，你的对比越明显。** 强调 1.5 倍之后，就发现这个对比就太明显了，明显右边更大。\n\n**陷阱类型**：时间陷阱（问 2018~2021，图中却给了 2016~2021）+ 概念陷阱（同比增速 ≠ 增量大）\n\n---\n\n### 例题 5｜2012~2015 年 · 福建省全部工业增加值增速最快\n\n#### 【题干原文】\n\n> 图 1　2011~2015 年福建省全部工业增加值\n>\n> 2012~2015 年，福建省哪一年的全部工业增加值的增速最快？（　）\n> A. 2015 年　　B. 2014 年　　C. 2013 年　　D. 2012 年\n\n#### 【材料数据】（画面 f_0532 / f_0538 逐字抄录）\n\n图 1　2011~2015 年福建省全部工业增加值（纵轴单位：亿元）\n\n| 年份 | 全部工业增加值（亿元） | 同比增量（画面手写） |\n|---|---|---|\n| 2011 年 | 7674.09 | — |\n| 2012 年 | 8541.94 | +87 |\n| 2013 年 | 9455.42 | +91 |\n| 2014 年 | 10426.71 | +97 |\n| 2015 年 | 10974.42（画面显示为 1093?.42，末位不清；增量标注 +55，对应 1097 − 1042 = 55） | +55 |\n\n> 说明：老师在画面上以**前三位**取数做增量，即 767 → 854 → 945 → 1042 → 1097。\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 哪一年增速最快（连续年份增速比较） |\n| 第一步：算增量 | 12 年 +87；13 年 +91；14 年 +97；15 年 +55 |\n| 直接排除 2015 年 | 增量不但没等比例扩大，反而**下滑**（97 → 55），基期还在变大 ⇒ 增速必最低 |\n| 直接排除 2014 年 | 13 年增速 = 91/854，已超过 10%；要维持增速，14 年增量起码要比 91 再涨 10%，实际只到 97（只多了 6）⇒ 14 年增速 \u003c 13 年增速 |\n| 同理排除 2013 年 | 12 年增速 = 87/767，超过 10%；要维持，13 年增量起码要比 87 再涨 10%，实际只到 91 ⇒ 13 年增速 \u003c 12 年增速 |\n| 结论 | `r₁₂ > r₁₃ > r₁₄`（15 年更不谈）⇒ 2012 年增速最快 |\n\n#### 【选项原文】\n\n- A. 2015 年\n- B. 2014 年\n- C. 2013 年\n- D. 2012 年\n\n#### 【答案】\n\n✅ **D（2012 年）**\n\n#### 【解析】\n\n> 12 年到 15 年，哪一年的增速最快？第一步，我们就是先把他们的增量减出来。767 到 854 是增加了 87，然后 854 到 945 是增加了 91，那一三年到一四年是增加了 97，然后 1042 到 1097 是加了 55。\n\n> 好，那 12、13、14、15 这几年里面，有没有哪些年份是你不需要去看的？你压根都不需要去看，你就知道他肯定不行，他这个增速肯定不可能是最高的。最明显的对，肯定是一五年，因为这一五年，它增量不光没有等比例扩大，**甚至还下滑了**。\n\n> 那一二、一三、一四里面还有没有哪个是不需要看的呢？再想一想。对，13、14 其实你都不需要看。你就是让他跟前面的去比。你看你 87 是 767 的，超过百分之十了吧？那你一三年，你想要保持增速不变，你是不是起码比 87 要加百分之十？你才到 91，怎么好意思呢？**你基期扩大了 10%，结果你的增量才涨了那么一丢丢**，你对得起什么给你的信任吗？\n\n> 哎，给你这么好的条件，我去年给人家一二年才给了 767，人家给我涨到 87；我今年给了你 854，你再给我涨到 91 上来，你好意思吗？是不是不好意思？\n\n> 一四年他行吗？他也不行。你直接跟 13 年去比，你会发现他也涨得少啊。你前面 13 年本来就不行，但你 13 年也还好，91 是不是有 854 的 10%？请问你这个 97 有涨到 10% 吗？才加了个 6，也太少了吧！说明 14 年的增速比 13 年的还要低，13 年的增速比 12 年的还要低，那 15 年更不谈了，已经是惨绝人寰了。\n\n> 所以他们就是这样一个增速关系，你看这样看是不是就特别明显。所以**一二年是增速最高的**。\n\n> 就是你想要起码保持你的增速没有比前一年低的话，**你的增量是起码要等比例扩大的**。\n\n**陷阱类型**：时间陷阱（图给 2011~2015，问 2012~2015）+ 概念陷阱（增量最大 ≠ 增速最快）\n\n---\n\n## 七、第三板块：A 与非 A 比较\n\n章节封面（画面 f_0550）：\n\n> **03　A 与非 A**\n\n板书（画面 f_0555 / f_0565 / f_0594）：\n\n> **A 与非 A 分式比较**\n>\n> ```\n> 现期 = 基期 + 增量\n> 全体 = 男性 + 女性\n> 收入 = 成本 + 利润\n> ……\n> ```\n>\n> **部分与整体在比较比值大小上存在一致性：**\n>\n> ```\n> 男性人数 / 全体人数 越大， 男性人数 / 女性人数 越大\n> 增量 / 现期 越大， 增量 / 基期 越大（增速同正负时）\n> ```\n\n> 来大家看今天这个最后一个部分，**A 与非 A**，就是一个两个部分加起来的矛盾关系的分式的比较。就是有很多一些概念，它就是像这种 A 等于 B 加 C 这种感觉：现期它等于基期加增量，全体等于男性加女性，收入等于成本加利润。然后这种情况，他们的部分与整体在比较比值的大小上存在一致性。\n\n> 什么叫部分与整体在比较比值大小上的一致性呢？\n\n### 7.1 最贴近现实的讲法：两个班的男女比\n\n> 我先来一个这个三个里面一个最贴合现实的一个最好理解的方式。如果我要去比较两个班哪个班的**男生人数除以女生人数**更大，就比哪个班的男女比比较高，你需要去把他们男生女生全算出来吗？不一定。**你只要看男生占这个全体全班人数的比重是不是就可以了。**\n\n画面上老师举的具体例子（f_0565）：\n\n```\n甲班：男生占 45% （女生即 55%）\n乙班：男生占 54% （女生即 46%）\n\n甲班男女比 = 45 / 55\n乙班男女比 = 54 / 46\n⇒ 乙班男女比高  （画面旁注：「乙吧」）\n```\n\n> 我说甲班，他们班有百分之四十五的男的；乙班，他们班有 54% 的男的。你说甲班乙班哪个班，他那个男生除以女生，男女比最高？甲班高还是乙班高？这个不用我说吧，是不是肯定乙班高啊？这不很明显吗？你 54% 是男的，那不就 46% 是女的吗？45% 是男的，那不就 55% 是女的吗？那你 54 除以 46 肯定是大于 45 除以 55 的嘛。\n\n> 这个就叫做**部分与整体的比较、比值上存在一致性**，就是我只需要去比较这个部分（男）除以整体（全班）谁大谁小，我就能知道它们男除以女谁大谁小。**部分与整体的比值和部分跟部分的比值，它们的大小比较是存在一致性的。**\n\n### 7.2 一致性原理的证明（板书推导）\n\n> 这个其实也很好证明。我要比较男生人数占群体人数的一个谁大谁小，那我把这个比如男生叫 a、女生叫 B。\n\n```\n要比较： a / (a + B)   与   小a / (小a + 小B)\n\n取倒数：\n(a + B) / a = 1 + B / a\n(小a + 小B) / 小a = 1 + 小b / 小a\n\n若 a / B > 小a / 小b，则取倒数后 B / a \u003c 小b / 小a\n⇒ 1 + B/a  更小  ⇒  (a+B)/a 更小\n⇒ 再取一次倒数（还原），大小关系又翻回来 ⇒ 大小关系一致\n\n另一写法（上下同除 a）：\na / (a + B)   = 1 / (1 + B/a)\n小a / (小a + 小B) = 1 / (1 + 小b/小a)\n⇒ a/b 越大 → 分母上的 b/a 越小 → 整个分式越大\n```\n\n> 我们把这个取个倒数，它就变成 (a+b)/a，就等于 1 加上 B 除以 A；或者这边右边的就变成了 1 加上小 b 除以小 a。有没有发现，只要你认为 a 除以 b 如果说大于这个小 a 除以小 b，是不是就说明大 B 除以大 a 就小于小 b 除以小 a？对不对？你给他取了个倒数，对吧？**你三大于二，那三分之一肯定小于二分之一，取倒数这个大小关系就反过来了吧。** 那既然我这个小，那上面这个就也小；那上面这个小，我给他又取了个倒数回去，是不是就大，所以它这个大小性是一致的，大小关系也是一致的。\n\n> 或者你可以更简单一点，我可以把左边那个式子写成上下同除个 a：`1 / (1 + B/a)`，右边就是 `1 / (1 + 小b/小a)`。所以这个时候你的 a 除以 b 它越大，分母上的 b 除以 a 就越小，分母上的越小，那我这个整体它就越大。**所以又一次证明了这两者是存在一个大小的一致性的。**\n\n### 7.3 最常用之处：增速的比较大小\n\n板书（画面 f_0594）：\n\n```\n增量 / 现期  大    ⇒    r = 增量 / 基期  大\n```\n\n> 但是男女人数的比较，并不是这类思想最常用的地方，**最常用的地方其实是增速的比较大小。**\n\n> 因为你现期等于基期加增量，那我们在比较增速大小的时候，是不是就是拿这个增量除以基期去比较谁的增量除以基期大？那增量除以基期是不是就像我们刚刚这里的男性跟女性的比值，两个部分的比值？那根据我们刚的结论，我们现在是不是就可以直接去看什么？**我直接去看增量除以现期谁大谁小。**\n\n> 对，你可以直接看资料，注意现期。这个大的，那它的增速（增量除以基期）也就大。\n\n### 7.4 ⚠️ 使用条件（老师反复强调的两个限制）\n\n> 当然这个大小比较一定要注意，**这只是一个大小的比较，并不能代表它的具体值。** 你千万不要说老师说的这个增量除以现期跟增量除以基期是一样的，他问我增速，我就拿增量除以现期吧。**不对，这个我们说的只是比较大小，并不是说这两个值可以互相替换。**\n\n> **而且这个办法你只有在两个增速是同正负的时候，才能这么去比。** 两个都是正增速、两个都是负增速，你去这么比都是没问题的，就是看一个绝对值的关系。**但如果他们是一正一负的，你这样就可能出现问题了。**\n\n**老师举的反例（画面 f_0594 一带）**\n\n```\n一个：现期 10000，增量 200       → 200 / 10000\n一个：现期 9900，增量 −200       → 相当于 200 / (9900 − 200)，即 200 / 9700 量级\n\n若直接看「增量 ÷ 现期」：下面（9900）这个大，所以它的变化率大 —— 这就错了\n因为它的变动方向相当于不一样了：\n   一个是 200 / (10000 − 200) = 200 / 9800\n   一个是 200 / (9900 + 200) = 200 / 10100\n```\n\n> 如果是一正一负，就可能有问题了。比如说如果我一个现期一万增量两百，一个（现期）9900（增量）−200，谁的变化率大呀？也不能直接看一个什么增量除以现期，就说下面是 200 除以 99，上面是 200 除以 10000，下面这个大，所以它的变化率大，**那就错了**。你这个一正一负的时候是不一样的，因为它的变动方向相当于不一样了。**方向都是一样的，都是正的或者负的，都可以用这种方法。**\n\n---\n\n### 例题 6｜2021 年 · 快递业务量同比增速最快\n\n#### 【题干原文】\n\n> 2021 年，中国快递业务量达 1083 亿件，同比增长 29.92%。其中，国际/港澳台业务量 21 亿件，较 2020 年增加了 2.6 亿件；同城业务量 141.1 亿件，较 2020 年增加了 19.4 亿件；异地业务量 920.8 亿件，较 2020 年增加了 227.2 亿件。\n>\n> 2021 年，快递业务量同比增速最快的是（　）。\n> A. 国际/港澳台　　B. 同城　　C. 异地　　D. 无法判断\n\n#### 【材料数据】\n\n| 业务类型 | 2021 年业务量（亿件） | 较 2020 年增加（亿件） |\n|---|---|---|\n| 中国快递业务量（合计） | 1083 | 同比增长 29.92% |\n| 国际/港澳台 | 21 | 2.6 |\n| 同城 | 141.1 | 19.4 |\n| 异地 | 920.8 | 227.2 |\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 同比增速最快（可套用 A 与非 A 一致性：直接看 `增量 / 现期`） |\n| 定位数据 | 三类业务的 2021 年业务量 + 增量 |\n| 列式（画面 f_0612） | 国际/港澳台 `2.6 / 21`；同城 `19.4 / 141`；异地 `227 / 920` |\n| 速算 | 2.6/21 ≈ 12% 多一点；19.4/141 没到 20%（141 的 20% 要到 28.2）；227/920 ≈ 24.7%，接近四分之一 |\n| 结论 | 异地 > 20% 且接近 25%，明显最大 |\n\n#### 【选项原文】\n\n- A. 国际/港澳台\n- B. 同城\n- C. 异地（画面打 ✓）\n- D. 无法判断\n\n#### 【答案】\n\n✅ **C（异地）**\n\n#### 【解析】\n\n> 21 年这个快递业务量，它的同比增速，下面这四个哪个更快？来看这个题目给了什么：国际港澳台业务量 21 亿件，增加了 2.6；同城 141，增加了 19.4；异地 920.8，增加了 227。好，那我们来比较这三个，谁的增速快？\n\n> 现在我们就知道**你不需要去减基期了，你以前去减基期，那些步骤全是在浪费时间**。直接国际就是 2.6 除以 21，同城就是 19.4 除以 141，异地就是 227 除以 920，谁大呀？你这样看是不是就能看出来了，就很明显了吧？\n\n> 只有这个**异地**超过了 20%，国际港澳台的才 10 多一点，同城的嘛也没到 20%（141 的 20% 要到 28.2），只有这个 227 除以 920，他已经超过了 20%，大概快 25% 了吧，四分之一左右。\n\n> 你看这样你就不用去减基期了，相当于给你省一步。相当于本来这个题目其实就是一道很简单的，你拿这两个数值去比，看两个分式谁大谁小，本来就只要个二十秒的事情；你要是再去减一遍基期，可能就变成三十秒四十秒了，就会浪费你一些时间。\n\n**陷阱类型**：时间陷阱（用「较 2020 年增加」= 增量，直接配现期，不必再求基期）+ 概念陷阱（D 项「无法判断」是干扰；本题三类同为正增长，可直接比大小）\n\n---\n\n### 例题 7｜2020 年 · 种植面积同比增速最快\n\n#### 【题干原文】\n\n> 2020 年，全年粮食种植面积 11677 万公顷，比上年增加 70 万公顷。其中，稻谷种植面积 3008 万公顷，增加 38 万公顷；小麦种植面积 2338 万公顷，减少 35 万公顷；玉米种植面积 4126 万公顷，减少 2 万公顷。棉花种植面积 317 万公顷，减少 17 万公顷。油料种植面积 1313 万公顷，增加 20 万公顷。糖料种植面积 157 万公顷，减少 4 万公顷。\n>\n> 2020 年全年，种植面积同比增速最快的是（　）。\n> A. 稻谷　　B. 小麦　　C. 油料　　D. 糖料\n\n#### 【材料数据】\n\n| 品种 | 2020 年种植面积（万公顷） | 比上年增减（万公顷） |\n|---|---|---|\n| 粮食（合计） | 11677 | +70 |\n| 稻谷 | 3008 | +38 |\n| 小麦 | 2338 | −35 |\n| 玉米 | 4126 | −2 |\n| 棉花 | 317 | −17 |\n| 油料 | 1313 | +20 |\n| 糖料 | 157 | −4 |\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 同比增速最快（选项里有正有负 → 先排负的） |\n| 第一步：排负 | 小麦（−35）、糖料（−4）是减少的，是负增速，**先 pass 掉** |\n| 第二步：只比两个 | 稻谷 `38 / 3008`；油料 `20 / 1313` |\n| 速算（画面 f_0690） | 油料上下同 ×2 → `40 / 2626`；40/2626 明显大于 38/3008（分子大、分母小） |\n| 结论 | 油料增速最快 |\n\n#### 【选项原文】\n\n- A. 稻谷\n- B. 小麦（画面画 ✗）\n- C. 油料（画面打 ✓）\n- D. 糖料（画面画 ✗）\n\n#### 【答案】\n\n✅ **C（油料）**\n\n#### 【解析】\n\n> 问：20 年全年下面这四个谁的增速最快？这个就找稻谷 3008 增加 38，小麦 2338 减少 35，油料 1313 增加 20，糖料 157 减少 4。那首先他问的是增速最快，**这是带正负的比较的**。那你就应该怎么样，先把减少的先 pass 掉，小麦跟糖料肯定就不用看了，因为他们是负的。\n\n> 所以就说你只要比较稻谷跟油料。稻谷直接拿增量除以现期，这个油料就拿 20 除以 1313。明显吗？谁大谁小？**C 更大吧**。为什么我们可以直接看出来？直接把油料的就可以放成两倍嘛，相当于 40 除以 2626，你把它的分子分母拉近，拉近就好比了。40 除以 2626 肯定比 38 除以 3008 要来得大嘛。\n\n**延伸问法一：如果问「降幅」最大**\n\n> 有人问那负的怎么比较？如果比如说我们看这两个负的，小麦跟糖料，我先不问他们的同比增速最快，我问谁的同比**降幅**最大。一样的，只要是同正负的，他们都是负的，那就 35 除以 2338 和 4 除以 157。\n\n```\n小麦降幅：35 / 2338\n糖料降幅：4 / 157  ── 上下同 ×10 ──▶  40 / 1570\n⇒ 40/1570 明显更大 ⇒ 糖料的降幅更大\n```\n\n> 一样的，你就直接这么去比就行了，没什么问题的，不用怕。然后你把这边变成 40 除以 1570，那这样的你看是不是明显糖料的减少的降幅更大。\n\n**延伸问法二：如果问「变化幅度」（正负都有）**\n\n> 如果变化幅度，你就把它集体加过去吧。变化幅度，如果他问的是变化，那你就**老老实实的，把他基期给我加回去**。也不要给我去冒风险。\n\n```\n稻谷（增）：分子 38，基期 = 3008 − 38 = 2970   → 38 / 2970\n小麦（减）：分子 35，基期 = 2338 + 35 = 2373   → 35 / 2373\n油料（增）：分子 20，基期 = 1313 − 20 = 1293   → 20 / 1293\n糖料（减）：分子 4， 基期 = 157 + 4  = 161    → 4 / 161\n```\n\n> 这是增加的，就是 2970。小麦呢就是 35 除以 2373，油料是 20 除以 1293，糖料 4 除以 161。然后你这样去比较，就是他如果是问的这种变化、又有正有负，本身你碰到这种题目的概率其实就比较低，就算碰到了你就给了呗，那我哪里没招了，那我就老老实实，我就给你把它的变化率怎么写的，我就给你写出来再去比。\n\n> 对呀，不是说变化减掉，我是把他们基期减出来。你 3008 增量是 38，你基期不就是 3008 减 38 吗？你这个地方是减少了 35，那么基期就在现期的基础上去加个 35；你这个 1313 是增加了二十得到的，那你的基期就是减二十啊；这个 157 是减少了 4 得到的，那你要找基期，不是要把这个 4 给它加回去吗？**这得算基期啊。**\n\n> 然后去比较这四个，看谁大谁小，大概应该也能看得出来吧。**这个大一点的，它已经有了百分之二以上了，其他的都明显没有到百分之二。**\n\n**画面上的「变化幅度」反例演示（f_0690 红笔）**\n\n```\n1000 → 1200  （涨 200）   ：200 / 1000\n 900 →  700  （减 200）   ：200 / 900\n\n若直接拿「变化量 ÷ 现期」：1000 与 900 相比，看起来小的那个变化率大\n但实际上变动方向不一样：\n    一个是 200 / (1200 − 200) = 200 / 1000\n    一个是 200 / (700  + 200) = 200 / 900\n⇒ 方向不一致时不能直接比\n```\n\n**陷阱类型**：概念陷阱（「增速」/「降幅」/「变化幅度」三种问法）＋ 符号陷阱（有正有负必须先排除异号，或老老实实还原基期）\n\n---\n\n### 例题 8｜2012~2015 年 · 社会组织接收社会捐赠款占总捐赠款比重\n\n#### 【题干原文】\n\n> 表：2011~2014 年社会捐款和社会捐赠衣被情况\n>\n> 2015 年全年共接收社会捐赠款 654.5 亿元，其中：民政部门接收社会各界捐款 44.2 亿元，各类社会组织接收捐款 610.3 亿元。\n>\n> 2012~2015 年社会组织接收社会捐赠款占总捐赠款的比重最高的是：\n> A. 2012 年　　B. 2013 年　　C. 2014 年　　D. 2015 年\n\n#### 【材料数据】（画面 f_0645 逐字抄录）\n\n| 年份 | 民政部门接收社会捐赠款（亿元） | 社会组织接收社会捐赠款（亿元） | 民政部门接收捐赠衣被（万件） |\n|---|---|---|---|\n| 2011 | 96.6 | 393.6 | 2918.5 |\n| 2012 | 101.7 | 470.8 | 12538.2 |\n| 2013 | 107.6 | 458.8 | 10405.0 |\n| 2014 | 79.6 | 524.9 | 5244.5 |\n| 2015 | 44.2 | 610.3 | （文字给出，总量 654.5 亿元） |\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 比重最高（A 与非 A 型：`社会组织 / (社会组织 + 民政部门)`） |\n| 陷阱 | 表中**没给总捐款额**，逼你去把两部分加总再算比重 |\n| 正解思路 | 不求总量，**直接看两部分之比**：`社会组织接收款 / 民政部门接收款` 谁大谁小 |\n| 列式（画面 f_0665 / f_0740） | 2012：`470 / 101`（≈4.7）；2013：`458 / 107`（≈4.3）；2014：`524 / 79`（≈6.6）；2015：`610 / 44`（≈13.8） |\n| 排除 | 2012、2013 两个分式被画 ✗ 排除；2014 虽高（524/79）仍远小于 2015 |\n| 结论 | 2015 年 610/44 分子大、分母小，**一边倒最大** ⇒ 2015 年比重最高 |\n\n#### 【选项原文】\n\n- A. 2012 年（画面画 ✗）\n- B. 2013 年（画面画 ✗）\n- C. 2014 年（画面画 ✗）\n- D. 2015 年（画面画 ✓）\n\n#### 【答案】\n\n✅ **D（2015 年）**\n\n#### 【解析】\n\n> 他问你 2012 年到 2015 年这四年哪一年社会组织接受社会捐款占总捐款的比重最高？好，这个地方它不是问你增速了，但是你要一定要记住，**不光是增速，只要是符合这种 A 和非 A 关系的，都可以去想。**\n\n> 一二年到一五年，社会组织接收社会捐款额这边有吧，总捐款额什么呢？**他没给。** 他没有给你总捐款额呀。那你这个时候你还要不要加？说哦，我把他们的那个总额全加起来：一二年加起来是 572，这加起来是 566，这儿加起来是 604，然后我再去看，这是 471 除以 572，这是 458 除以 566，这是 524 除以 604。他好像是想让你这么去比对吧？\n\n> **但我们需要这么去比吗？我要上他的当吗？** 他问我占总捐款额，我就要去算总捐款额呀？干嘛呢？\n\n> 他问你哪个班男生占全班人数的比重最高，你非得去把男生女生加起来？你**直接去算男女比**呗，你**直接去算社会组织接收社会捐款额和民政的比值**不就好了吗？\n\n> 47 是 10 的几倍？4.7 倍，这个明显（不够），4.7 排除；这个（2014）还挺高的，500 相当于是 524 除以 80。好，但别着急，你再看看，什么还有个 15 年没看呢？**15 年在这儿，别把 15 年漏了，它是 4 年 1234。** 61 除以 44，哎呦，刚刚我前面的 4.7 我都白算，发现了吧？61 除以 44，这太大了！比上面这三个，都是它的分子更大、分母更小，**所以一五年就是比重最高的**。\n\n> 你看你只要明白这个道理之后，这个题目你根本不需要去做什么求和，你直接去看一下这两个部分的比值，一下就能看出来了。**你算都不用算，你看一眼就能看出来就是一五年。**\n\n> **三个部分、三个部分，那你就把剩下两个部分加起来。** 如果说是 A、B、C，问你哪一个 A 除以 A 加 B 加 C 最高，那你就看什么？你看 A 除以（B + C），**你加两个总比加三个来得快吧**？明白吗？**就是把非 A 的部分加起来**，A 与非 A 的有哪些，你就把它加起来，你不需要把它全加起来。\n\n**陷阱类型**：范围陷阱（表中只到 2014 年，2015 年数据在文字里，容易漏看）＋ 概念陷阱（「总捐赠款」未给，诱导你去做无谓求和）\n\n---\n\n## 八、本讲知识点总表\n\n**课程最后一页总结（画面 f_0680 逐字抄录）**\n\n> **第八课 分式比较大小总结**\n\n| 板块 | 要点 |\n|---|---|\n| **差分法** | ① 横向对比，分子分母增长情况\u003cbr>② 纵向对比，混合的差值偏小 / 偏大\u003cbr>③ 便于计算时，直接计算或者基准线法 |\n| **增速比较大小** | ① 增速要想不低于上年，增量起码需要等比例增长\u003cbr>② 只可以相邻年份比较 |\n| **A 与非 A 分式比较** | 部分与整体在比较比值大小上存在一致性\u003cbr>`增量/现期` 越大，`增量/基期` 越大 |\n\n**完整方法体系速查**\n\n| 情形 | 方法 | 操作 | 结论方向 |\n|---|---|---|---|\n| 分子分母**不同边** | 定性判断 | 看谁分子大、谁分母小 | 分子大且分母小者更大（僧多粥少） |\n| 同边·好算 | ①直接计算 | 就近凑整（如 493→500、1231→1250），放缩 / 错位相减 / 错位相加 | 直接比出结果 |\n| 同边·都离某值近 | ④基准线法 | 统一减掉那个「常用好算的值」（1、1/2、1/3、1/4、1/5、1/10…），看距离 | 都在基准线**上方**：谁离得远谁大；都在**下方**：谁离得近谁大 |\n| 同边·两分式很近 | ②平均数增速比较（横） | 分子分母分别做差，看 `Δ分子/原分子` 与 `Δ分母/原分母` | 分子涨得快 ⇒ 分式变大 |\n| 同边·两分式很近 | ③分式混合比较（纵） | 把小的当原溶液，差值部分当加入的溶液 | 加入的浓度更高 ⇒ 混合后变大 |\n| 分子分母差很远 | 等比扩大拉近 | 把小的一个整体乘 10、乘 11、乘 1.5… | 距离越近，对比越明显 |\n| 相邻年份增速比较 | 利滚利 | 先求增量；看增量有没有等比例扩大 | 增量等比例扩大 ⇒ 增速不下滑 |\n| A 与非 A | 一致性 | 看 `部分/整体` 或 `增量/现期` | 与 `部分/部分`、`增量/基期` 大小一致（**须同正负**） |\n\n---\n\n## 九、速算口诀与解题流程\n\n**口诀**\n\n> **分子分母不同边，分子大、分母小者更大。**\n>\n> **僧多粥少**——钱又少、人又多，人均一定低。\n>\n> **分子涨得快，分数就变大；分母涨得快，分数就变小。**\n>\n> **差分法：横向看比例，纵向看浓度。**\n>\n> **往低浓度里倒高浓度，浓度必升；往高浓度里倒低浓度，浓度必降。**\n>\n> **都在基准线上方，谁离得远谁大；都在基准线下方，谁离得近谁大。**\n>\n> **要想增速不降低，增量跟着上「楼梯」（等比例增长）。**\n>\n> **增量比现期，就等同于增量比基期**（同正负时，只比大小，不换数值）。\n>\n> **考试的时候：你记不住就写，记得住就不用写。**\n\n**标准解题流程**\n\n```\n第 0 步：判断分子分母是否同边\n        ├─ 不同边 → 直接定性结论，秒杀\n        └─ 同边   → 进入定量比较\n\n第 1 步：看分式好不好算\n        ├─ 好算 / 离某个常用好算的值很近 → 直接计算 或 用基准线法减去那个值\n        └─ 不好算且两个分式很近         → 差分法\n\n第 2 步：差分法\n        ├─ 横向：分子分母分别做差 → 比 Δ分子/原分子 与 Δ分母/原分母（平均增速）\n        └─ 纵向：小的当原溶液 → 看差值部分是更高浓度还是更低浓度（分式混合）\n        └─ 若两边分子分母相差很远 → 先等比扩大拉近（×10、×11、×1.5）\n\n第 3 步：增速比较大小题型\n        ├─ 先求增量\n        ├─ 光看增量能否等比例扩大就能排掉一批年份\n        └─ 只剩相邻年份之间用「利滚利」判断；不相邻的回头用差分法\n\n第 4 步：A 与非 A 题型\n        ├─ 看清问的是「部分/整体」还是「部分/部分」\n        ├─ 直接看 增量/现期（增速）、部分/整体（比重），不必求和\n        └─ 检查是否同正负；异号时老老实实还原基期\n```\n\n---\n\n## 十、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 说明 | 老师原话 |\n|---|---|---|---|\n| 1 | **降序 / 升序看反** | 降序 = 由大到小；升序 = 由小到大 | 「降序是由大到小降……像滑滑梯一样降下来」 |\n| 2 | **「增加值」≠「增量」** | 第二产业增加值是**绝对值（现期值）**，不是增量 | 「它本身就是……现期值」 |\n| 3 | **分子分母同边时直接套定性结论** | 同边时无法定性，必须定量 | 「要定量了」 |\n| 4 | **忘记「方法有适用性」** | 好算就直接算，别硬用差分法；不好算别硬算 | 「不要舍近求远」「方法都是有它的一个适用性的」 |\n| 5 | **差分时用百分比估代替原始差值** | 百分比会带来误差 | 「你这个做差是没有误差的」 |\n| 6 | **分子分母差得远还硬做差** | 应先等比扩大拉近 | 「若分子分母都相差很远，可以等比例扩大拉近」 |\n| 7 | **基准线方向搞混** | 上方：远者大；下方：近者大 | 「都在上面，那谁离得远谁就大；都在下面，谁离得近谁更大」 |\n| 8 | **增速比较用不相邻年份** | 只有相邻年份的基期关系才是直接的 | 「13 跟 16 年就不好比了」 |\n| 9 | **把柱状图的斜率当增速** | 斜率 = 增量 ÷ 恒定柱间距 = 增量 | 「斜率是这两个柱子的差除以这两个柱子之间的距离」 |\n| 10 | **把 `增量/现期` 当成增速的值** | 只用于**比大小**，不能替换具体值 | 「这并不是说这两个值可以互相替换」 |\n| 11 | **一正一负还用 `增量/现期` 比大小** | 方向不一致会出错 | 「如果是一正一负，就可能有问题了」 |\n| 12 | **「变化幅度」直接用增量比现期** | 必须老老实实把基期还原（增要减、减要加） | 「这得算基期啊」 |\n| 13 | **问「比重最高」就去求总量** | 表中没给总量的，直接比两部分比值 | 「我要上他的当吗？」 |\n| 14 | **漏看文字里的年份** | 表格只到 2014 年，2015 年在文字里 | 「别把 15 年漏了，它是 4 年 1234」 |\n| 15 | **只问四个城市却去算全表** | 材料给了十几个地区，题干只问四个 | 例题 2 的表格有 13 行，题干只问 4 市 |\n\n---\n\n## 十一、老师金句\n\n> ⭐ **后面两个算技巧，前面算是我们今天的一种算法。**\n\n> ⭐ **僧多粥少。** 分的人太多了，粥又少了。本来就已经少了，你要分给那么多人，他这个平摊到每个人身上的还能多吗？\n\n> ⭐ **降序是由大到小降……像滑滑梯一样降下来。**\n\n> ⭐ **这种本身就是算已经比较好算的时候，你就直接给我把它算出来就好了。**\n\n> ⭐ **不要舍近求远。方法都是有它的一个适用性的。**\n\n> ⭐ **分子涨得快，分数就变大。** 就相当于人，你这个钱涨得比你人涨得快，那你的这个人均收入肯定提高。\n\n> ⭐ **乘 11 是为了离得更近，你离得越近，你那个误差就越好去比较。**\n\n> ⭐ 这种原理就好像比较两个人个子谁高谁低：都是「一米七几」的时候你感觉差不多高，但**统一减掉个一米七，就只看个三厘米跟四厘米，一下感觉这四厘米比三厘米要直接高了很多**。你把你专注去看的这个量变小了，他们的差距就会被放大，倍数就会被放大。\n\n> ⭐ **你以它具体的值来判断，比你用什么百分比去把它算出来，相对来说更可靠一点。因为你这个做差是没有误差的。**\n\n> ⭐ 你往一个 1/3 浓度的溶液里面去倒了个 1/2 左右浓度的溶液，**它的浓度会提高啊！**\n\n> ⭐ **你甚至很多时候都不需要怎么计算的。**\n\n> ⭐ 你要是都觉得乱，我觉得你应该**不要去逃避它**，应该想的是我应该把它理顺过来。\n\n> ⭐ **都在上面，那谁离得远谁就大；都在下面，谁离得近谁更大。**\n\n> ⭐ **你减一半能花多少功夫？** 比你这四个一个个除出来快多了吧。\n\n> ⭐ 我这个地方口算快速，我随便估的呀……因为我知道我已经把他们主要的部分全去掉了，那剩下的部分他们不可能说靠得特别近的了。**要是我已经去掉了百分之五十那么多，剩的这种个位数，他还靠得特别近，那这个题目他给谁做呀？**\n\n> ⭐ **考试的时候要不要写出来？你记不住，你就写；你记得住，你就不用写嘛。**\n\n> ⭐ **你要是培养起来这种利滚利的感觉**，然后你去捡这种资料的时候，你就能够比较快速地去把一些明显不可能给它排掉。\n\n> ⭐ 我给了你更优越的这个条件啊，你居然没有涨出来更多的增量，**是不是说明你的增速低了呀？**\n\n> ⭐ 你基期扩大了 10%，结果你的增量才涨了那么一丢丢，**你对得起什么给你的信任吗？**\n\n> ⭐ 所以一二年是增速最高的。他们就是这样一个增速关系，你看这样看是不是就特别明显。\n\n> ⭐ **以前你去减基期，那些步骤全是在浪费时间。**\n\n> ⭐ 他问我占总捐款额，我就要去算总捐款额呀？干嘛呢？**我要上他的当吗？**\n\n> ⭐ **你算都不用算，你看一眼就能看出来就是一五年。**\n\n> ⭐ 如果说是 A、B、C，问你哪一个 A 除以（A + B + C）最高，那你就看 A 除以（B + C），**你加两个总比加三个来得快吧。**\n\n> ⭐ **不要什么地方就是硬要去用。** 好了，那我们今天这课就上到这边了。拜拜。\n\n---\n\n> **全合集到此结束（共 21 集）。**\n\n","outline":[{"level":2,"text":"一、开篇：为什么还要学分式比较大小","id":"一开篇为什么还要学分式比较大小"},{"level":2,"text":"二、本讲三大知识板块","id":"二本讲三大知识板块"},{"level":2,"text":"三、第一步：先看分子分母是否同边","id":"三第一步先看分子分母是否同边"},{"level":3,"text":"3.1 分子分母大小不同边时","id":"31-分子分母大小不同边时"},{"level":3,"text":"例题 1｜2019~2021 年我国人口男女性别比降序排列","id":"例题-120192021-年我国人口男女性别比降序排列"},{"level":2,"text":"四、分子分母大小同边时：四种定量比较法","id":"四分子分母大小同边时四种定量比较法"},{"level":3,"text":"① 直接计算","id":"直接计算"},{"level":3,"text":"② 平均数增速比较（差分法之一·横向比较）","id":"平均数增速比较差分法之一横向比较"},{"level":3,"text":"③ 分式混合比较（差分法之二·纵向比较）","id":"分式混合比较差分法之二纵向比较"},{"level":3,"text":"④ 基准线法（统一减去某个常用好算的值）","id":"基准线法统一减去某个常用好算的值"},{"level":2,"text":"五、例题精讲（比较大小类）","id":"五例题精讲比较大小类"},{"level":3,"text":"例题 2｜2012 年全省各市及义乌市 GDP 初步核算数据 · 第二产业增加值占 GDP 比重","id":"例题-22012-年全省各市及义乌市-gdp-初步核算数据-第二产业增加值占-gdp-比重"},{"level":2,"text":"六、第二板块：增速比较大小的特殊技巧","id":"六第二板块增速比较大小的特殊技巧"},{"level":3,"text":"「利滚利」原理与结论","id":"利滚利原理与结论"},{"level":3,"text":"例题 3｜2016 年与 2015 年相比 · 我国新闻出版产业营业收入","id":"例题-32016-年与-2015-年相比-我国新闻出版产业营业收入"},{"level":3,"text":"例题 4｜2018~2021 年 · 我国数字经济市场规模同比增速最快","id":"例题-420182021-年-我国数字经济市场规模同比增速最快"},{"level":3,"text":"例题 5｜2012~2015 年 · 福建省全部工业增加值增速最快","id":"例题-520122015-年-福建省全部工业增加值增速最快"},{"level":2,"text":"七、第三板块：A 与非 A 比较","id":"七第三板块a-与非-a-比较"},{"level":3,"text":"7.1 最贴近现实的讲法：两个班的男女比","id":"71-最贴近现实的讲法两个班的男女比"},{"level":3,"text":"7.2 一致性原理的证明（板书推导）","id":"72-一致性原理的证明板书推导"},{"level":3,"text":"7.3 最常用之处：增速的比较大小","id":"73-最常用之处增速的比较大小"},{"level":3,"text":"7.4 ⚠️ 使用条件（ <script>/* ============================================================
 * md.js — 轻量 Markdown 渲染器（零依赖 / 可离线）
 * 支持：标题、表格、引用（含嵌套表格）、有序/无序列表（含嵌套）、
 *       围栏代码块、分隔线、段落，以及行内 **粗体** *斜体* ~~删除~~
 *       `代码` [链接](url) 裸链接 <br>（唯一放行的原始 HTML）
 * ============================================================ */
(function (global) {
  'use strict';

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return ESC[c]; });
  }

  /* 中文（全角）字符之间拼接不加空格，避免出现"断 句 空 格" */
  function isWide(ch) {
    return /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef\u2018-\u201f\u2014\u2026]/.test(ch);
  }
  function smartJoin(a, b) {
    if (!a) return b || '';
    if (!b) return a;
    return (isWide(a.slice(-1)) && isWide(b.charAt(0))) ? a + b : a + ' ' + b;
  }

  /* GitHub 风格锚点（与笔记内已有 TOC 链接保持一致） */
  function slug(text) {
    return String(text)
      .toLowerCase()
      .replace(/`+/g, '')
      .replace(/\*\*|\*|~~/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[^\w\u4e00-\u9fff\s-]/g, '')
      .replace(/^\s+|\s+$/g, '')
      .replace(/\s+/g, '-');
  }

  /* ---------------- 行内 ---------------- */
  function inline(text) {
    var codes = [];
    var t = String(text);

    // 1) 先抽出行内代码，避免其中的符号被当语法
    t = t.replace(/`([^`]+)`/g, function (m, a) {
      codes.push(a);
      return '\u0001C' + (codes.length - 1) + '\u0001';
    });
    // 2) 放行 <br>
    t = t.replace(/<\s*br\s*\/?\s*>/gi, '\u0001B\u0001');
    // 3) 转义
    t = esc(t);
    // 4) 链接
    t = t.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (m, txt, href) {
      var ext = /^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + href + '"' + ext + '>' + txt + '</a>';
    });
    // 5) 粗体 → 删除线 → 斜体
    t = t.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
    t = t.replace(/(^|[^*\w])\*([^\s*][^*\n]*?)\*(?!\*)/g, '$1<em>$2</em>');
    // 6) 裸链接
    t = t.replace(/(^|[\s(（])(https?:\/\/[^\s<>()（）]+)/g, function (m, p, u) {
      return p + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
    // 7) 还原
    t = t.replace(/\u0001C(\d+)\u0001/g, function (m, idx) {
      return '<code class="md-inline-code">' + esc(codes[+idx]) + '</code>';
    });
    t = t.replace(/\u0001B\u0001/g, '<br>');
    return t;
  }

  /* ---------------- 行判定 ---------------- */
  function headingOf(l) { return /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l); }
  function isFence(l) { return /^\s*(```+|~~~+)/.test(l); }
  function isHr(l) { return /^\s*([-*_])(\s*\1){2,}\s*$/.test(l); }
  function isQuote(l) { return /^\s{0,3}>/.test(l); }
  function ulOf(l) { return /^(\s*)([-*+])\s+(.*)$/.exec(l); }
  function olOf(l) { return /^(\s*)(\d+)[.)]\s+(.*)$/.exec(l); }
  function indentOf(l, tab) {
    var m = /^[ \t]*/.exec(l)[0];
    return m.replace(/\t/g, tab || '    ').length;
  }

  function splitRow(l) {
    var s = l.replace(/^\s+|\s+$/g, '');
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.slice(-1) === '|') s = s.slice(0, -1);
    var cells = [], cur = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c === '\\' && s.charAt(i + 1) === '|') { cur += '|'; i++; continue; }
      if (c === '|') { cells.push(cur.replace(/^\s+|\s+$/g, '')); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur.replace(/^\s+|\s+$/g, ''));
    return cells;
  }

  function isTableSep(l) {
    if (typeof l !== 'string') return false;
    var cells = splitRow(l);
    if (cells.length < 1) return false;
    if (cells.length < 2 && l.indexOf('|') < 0) return false;
    for (var i = 0; i < cells.length; i++) {
      if (!/^:?-{2,}:?$/.test(cells[i])) return false;
    }
    return true;
  }

  function alignOf(sep) {
    var a = [];
    var cells = splitRow(sep);
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (/^:-+:$/.test(c)) a.push('center');
      else if (/^-+:$/.test(c)) a.push('right');
      else a.push(null);
    }
    return a;
  }

  /* ---------------- 列表 ---------------- */
  function parseList(lines, start, n) {
    var baseIndent = indentOf(lines[start]);
    var firstIsUl = !!ulOf(lines[start]);
    var tag = firstIsUl ? 'ul' : 'ol';
    var startAttr = '';
    if (!firstIsUl) {
      var num = parseInt(olOf(lines[start])[2], 10);
      if (num && num !== 1) startAttr = ' start="' + num + '"';
    }
    var i = start;
    var html = '<' + tag + ' class="md-list"' + startAttr + '>';

    while (i < n) {
      var l = lines[i];
      if (/^\s*$/.test(l)) {
        var j = i;
        while (j < n && /^\s*$/.test(lines[j])) j++;
        var nx = lines[j];
        if (nx === undefined) break;
        if ((ulOf(nx) || olOf(nx)) && indentOf(nx) >= baseIndent) { i = j; continue; }
        break;
      }
      var um = ulOf(l), om = olOf(l);
      if (!um && !om) break;
      if (indentOf(l) < baseIndent) break;
      if (indentOf(l) > baseIndent) {           // 意外缩进：当同级处理
        // 交给内层循环处理（此处直接放宽）
      }
      var text = um ? um[3] : om[3];
      i++;
      var item = inline(text);

      var guard = 0;
      while (i < n && guard++ < 500) {
        if (/^\s*$/.test(lines[i])) {
          var k = i;
          while (k < n && /^\s*$/.test(lines[k])) k++;
          if (k < n && (ulOf(lines[k]) || olOf(lines[k])) && indentOf(lines[k]) > baseIndent) { i = k; continue; }
          break;
        }
        if (ulOf(lines[i]) || olOf(lines[i])) {
          if (indentOf(lines[i]) > baseIndent) {
            var sub = parseList(lines, i, n);
            item += sub.html;
            i = sub.next;
            continue;
          }
          break;
        }
        if (headingOf(lines[i]) || isHr(lines[i]) || isFence(lines[i])) break;
        if (indentOf(lines[i]) > baseIndent) {
          item = smartJoin(item, inline(lines[i].replace(/^\s+|\s+$/g, '')));
          i++;
          continue;
        }
        break;
      }
      html += '<li class="md-li">' + item + '</li>';
    }
    html += '</' + tag + '>';
    return { html: html, next: i };
  }

  /* ---------------- 主渲染 ----------------
   * opts 可传：true（旧写法，等价于 {nested:true}）
   *            { nested: true, idPrefix: 'p12-' }
   * idPrefix 用于把多篇笔记合并进同一页面时避免标题 id 冲突。
   */
  function render(md, opts) {
    var nested = false, idPrefix = '';
    if (opts === true) nested = true;
    else if (opts && typeof opts === 'object') {
      nested = !!opts.nested;
      idPrefix = opts.idPrefix || '';
    }
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
    var n = lines.length;
    var out = [];
    var outline = [];
    var used = {};
    var i = 0;

    function uniq(base) {
      base = base || 'sec';
      if (!used[base]) { used[base] = 1; return base; }
      used[base]++;
      return base + '-' + used[base];
    }

    while (i < n) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      /* 围栏代码块 */
      var fm = /^\s*(```+|~~~+)\s*([\w+#-]*)\s*$/.exec(line);
      if (fm) {
        var tick = fm[1].charAt(0);
        var closeRe = new RegExp('^\\s*' + tick + tick + tick);
        var lang = fm[2];
        var buf = [];
        i++;
        while (i < n && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
        if (i < n) i++;
        out.push('<pre class="md-pre">' + (lang ? '<span class="md-pre-lang">' + esc(lang) + '</span>' : '') +
          '<code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      /* 分隔线 */
      if (isHr(line)) { out.push('<hr class="md-hr">'); i++; continue; }

      /* 标题 */
      var hm = headingOf(line);
      if (hm) {
        var lvl = hm[1].length;
        var raw = hm[2];
        var id = idPrefix + uniq(slug(raw));
        outline.push({
          level: lvl,
          text: raw.replace(/\*\*/g, '').replace(/`/g, '').replace(/~~/g, ''),
          id: id
        });
        out.push('<h' + lvl + ' id="' + id + '" class="md-h md-h' + lvl + '">' + inline(raw) + '</h' + lvl + '>');
        i++;
        continue;
      }

      /* 引用块（内部可含表格/列表/标题） */
      if (isQuote(line)) {
        var qbuf = [];
        while (i < n) {
          if (isQuote(lines[i])) {
            qbuf.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
            i++;
          } else if (/^\s*$/.test(lines[i]) && isQuote(lines[i + 1] || '')) {
            qbuf.push('');
            i++;
          } else break;
        }
        out.push('<blockquote class="md-quote">' + render(qbuf.join('\n'), { nested: true, idPrefix: idPrefix }).html + '</blockquote>');
        continue;
      }

      /* 表格 */
      if (line.indexOf('|') >= 0 && isTableSep(lines[i + 1])) {
        var aligns = alignOf(lines[i + 1]);
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < n && !/^\s*$/.test(lines[i]) && lines[i].indexOf('|') >= 0) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        var th = '';
        for (var c = 0; c < head.length; c++) {
          var st = aligns[c] ? ' style="text-align:' + aligns[c] + '"' : '';
          th += '<th' + st + '>' + inline(head[c]) + '</th>';
        }
        var tb = '';
        for (var r = 0; r < rows.length; r++) {
          var tds = '';
          for (var c2 = 0; c2 < head.length; c2++) {
            var st2 = aligns[c2] ? ' style="text-align:' + aligns[c2] + '"' : '';
            tds += '<td' + st2 + '>' + inline(rows[r][c2] === undefined ? '' : rows[r][c2]) + '</td>';
          }
          tb += '<tr>' + tds + '</tr>';
        }
        out.push('<div class="table-wrap"><table class="md-table"><thead><tr>' + th +
          '</tr></thead><tbody>' + tb + '</tbody></table></div>');
        continue;
      }

      /* 列表 */
      if (ulOf(line) || olOf(line)) {
        var res = parseList(lines, i, n);
        out.push(res.html);
        i = res.next;
        continue;
      }

      /* 段落 */
      var buf2 = [line];
      i++;
      while (i < n) {
        var cur = lines[i];
        if (/^\s*$/.test(cur)) break;
        if (headingOf(cur) || isQuote(cur) || isFence(cur) || isHr(cur)) break;
        if (ulOf(cur) || olOf(cur)) break;
        if (cur.indexOf('|') >= 0 && isTableSep(lines[i + 1])) break;
        buf2.push(cur);
        i++;
      }
      var para = '';
      for (var q = 0; q < buf2.length; q++) para = smartJoin(para, buf2[q].replace(/^\s+|\s+$/g, ''));
      out.push('<p class="md-p">' + inline(para) + '</p>');
    }

    return { html: out.join('\n'), outline: nested ? [] : outline };
  }

  global.MDRender = {
    render: render,
    inline: inline,
    slug: slug,
    esc: esc
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ============================================================
 * app.js — 知识库前端（零依赖 / 可离线）
 * 侧栏章节目录 · 全文搜索 · 右侧大纲 · 阅读进度 · 明暗主题
 * ============================================================ */
(function () {
  'use strict';

  var KB = window.KB;
  var NOTES = [];
  var BY_ID = {};
  KB.groups.forEach(function (g) {
    g.items.forEach(function (n) {
      n.group = g.name;
      n._idx = NOTES.length;
      NOTES.push(n);
      BY_ID[n.id] = n;
    });
  });

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------------- 本地存储 ---------------- */
  var LS_READ = 'pd_kb_read_v1', LS_LAST = 'pd_kb_last_v1', LS_THEME = 'pd_kb_theme_v1';
  function readMap() { try { return JSON.parse(localStorage.getItem(LS_READ) || '{}'); } catch (e) { return {}; } }
  function markRead(id) {
    try { var m = readMap(); m[id] = 1; localStorage.setItem(LS_READ, JSON.stringify(m)); } catch (e) {}
  }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------------- 通用：清理 Markdown ---------------- */
  function cleanMd(s) {
    s = String(s).replace(/^\s*\|/, '|');
    if (s.indexOf('|') >= 0) s = s.replace(/\|/g, ' · ');
    return s
      .replace(/^\s*[>#*+\-—]{1,6}\s*/, '')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/<\/?br\s*\/?>/gi, ' ')
      .replace(/\*\*|~~|`/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function highlightSnippet(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      if (!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = out.replace(re, '<mark class="hl">$1</mark>');
    });
    return out;
  }

  /* ================= 侧栏 ================= */
  function buildSidebar() {
    var nav = $('#nav');
    var read = readMap();
    var html = '';
    KB.groups.forEach(function (g, gi) {
      html += '<div class="grp" data-g="' + gi + '">' +
        '<button class="grp-h" type="button"><span class="grp-n">' + esc(g.name) + '</span>' +
        '<span class="grp-c">' + g.items.length + '</span><i class="chev"></i></button>' +
        '<div class="grp-b">';
      g.items.forEach(function (n) {
        html += '<a class="item' + (read[n.id] ? ' is-read' : '') + '" data-id="' + n.id + '" href="#' + n.id + '" title="' +
          esc(n.full || n.title) + '">' +
          '<span class="pn">' + n.id + '</span>' +
          '<span class="nm">' + esc(n.title) + '</span>' +
          (n.dur ? '<span class="dm">' + n.dur + '</span>' : '') +
          '</a>';
      });
      html += '</div></div>';
    });
    nav.innerHTML = html;

    nav.addEventListener('click', function (e) {
      var h = e.target.closest('.grp-h');
      if (h) { h.parentNode.classList.toggle('closed'); return; }
      var a = e.target.closest('.item');
      if (a) { e.preventDefault(); open(a.getAttribute('data-id')); closeDrawer(); }
    });
    nav.addEventListener('contextmenu', function (e) {
      var a = e.target.closest('.item');
      if (a) { e.preventDefault(); a.classList.remove('is-read'); var m = readMap(); delete m[a.getAttribute('data-id')]; ls(LS_READ, JSON.stringify(m)); }
    });
  }

  function syncSidebarActive(id) {
    $$('#nav .item').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-id') === id); });
    var cur = $('#nav .item.active');
    if (cur) {
      var grp = cur.closest('.grp');
      if (grp) grp.classList.remove('closed');
      var box = $('#sidebar'), cr = cur.getBoundingClientRect(), br = box.getBoundingClientRect();
      if (cr.top < br.top + 60 || cr.bottom > br.bottom - 20) {
        box.scrollTop += (cr.top - br.top) - box.clientHeight / 2 + 30;
      }
    }
  }

  /* ================= 内容渲染 ================= */
  var currentId = null;
  var renderedKey = null;   // 已渲染的 hash key，避免 hashchange 造成重复渲染

  function collapseNativeToc(article) {
    $$('h2', article).forEach(function (h) {
      if (h.textContent.replace(/\s/g, '') !== '目录') return;
      var box = document.createElement('div');
      box.className = 'native-toc';
      var n = h.nextElementSibling;
      while (n && n.tagName !== 'H2') { var nx = n.nextElementSibling; box.appendChild(n); n = nx; }
      if (!box.children.length) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toc-toggle';
      var setLabel = function () { btn.innerHTML = '<i class="chev"></i>' + (box.hidden ? '本讲完整目录' : '收起完整目录'); };
      box.hidden = true; setLabel();
      btn.addEventListener('click', function () { box.hidden = !box.hidden; btn.classList.toggle('open', !box.hidden); setLabel(); });
      h.after(btn);
      btn.after(box);
    });
  }

  function buildToc(note) {
    var body = $('#tocbody');
    var items = (note.outline || []).filter(function (o) { return o.level >= 2 && o.level <= 3; });
    if (!items.length) { $('#toc').classList.add('empty'); body.innerHTML = ''; return; }
    $('#toc').classList.remove('empty');
    body.innerHTML = items.map(function (o) {
      return '<a class="toc-i lv' + o.level + '" href="#' + o.id + '">' + esc(o.text) + '</a>';
    }).join('');
    body.parentNode.scrollTop = 0;
  }

  var tocHandler = null;
  function bindTocScroll() {
    if (tocHandler) window.removeEventListener('scroll', tocHandler);
    var links = $$('#tocbody .toc-i');
    if (!links.length) return;
    var targets = links.map(function (a) { return document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))); });
    tocHandler = function () {
      var y = window.scrollY + 120, idx = -1;
      for (var i = 0; i < targets.length; i++) {
        if (targets[i] && targets[i].offsetTop <= y) idx = i; else if (targets[i]) break;
      }
      links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
    };
    window.addEventListener('scroll', tocHandler, { passive: true });
    tocHandler();
  }

  function open(id, anchor, terms) {
    var note = BY_ID[id];
    if (!note) { renderHome(); return; }
    currentId = id;
    renderedKey = '#' + id + (anchor ? '/' + anchor : '');
    if (location.hash !== renderedKey) location.hash = renderedKey;
    $('#doc').innerHTML = '<div class="doc-inner"><div class="doc-head">' +
      '<div class="dh-top"><span class="badge">' + note.id + '</span>' +
      (note.lect ? '<span class="dh-lect">' + esc(note.lect) + '</span>' : '') +
      (note.dur ? '<span class="dh-dur">时长 ' + note.dur + '</span>' : '') +
      (note.url ? '<a class="dh-link" href="' + note.url + '" target="_blank" rel="noopener">原视频</a>' : '') +
      '</div>' +
      '<h1 class="dh-title">' + esc(note.full || note.title) + '</h1>' +
      (note.theme ? '<p class="dh-theme">' + esc(note.theme) + '</p>' : '') +
      '</div></div>';

    var res = window.MDRender.render(note.md);
    var art = $('.doc-inner');
    var holder = document.createElement('div');
    holder.className = 'md-body';
    holder.innerHTML = res.html;
    art.appendChild(holder);

    // 去掉笔记自带的 H1（课程信息与标题已在头部统一展示）
    $$('h1', holder).forEach(function (h) { h.remove(); });

    // 表格横向滚动
    $$('table', holder).forEach(function (t) {
      if (!t.parentNode.classList.contains('table-wrap')) {
        var w = document.createElement('div'); w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      }
    });

    collapseNativeToc(holder);

    // 内部的 #锚点 链接
    holder.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var target = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
      if (target) window.scrollTo({ top: target.offsetTop - 84, behavior: 'smooth' });
    });

    buildToc(note);
    bindTocScroll();
    markRead(id);
    var si = $('#nav .item[data-id="' + id + '"]');
    if (si) si.classList.add('is-read');
    syncSidebarActive(id);
    ls(LS_LAST, id);
    renderPager(note);
    $('#toc').style.visibility = '';
    document.body.classList.remove('is-home');
    // 切换笔记时立即回到顶部（不要被全局 scroll-behavior:smooth 拖成长动画）
    var de = document.documentElement;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { de.style.scrollBehavior = ''; });

    if (terms && terms.length) {
      var n = highlightIn(holder, terms);
      if (n) {
        var first = holder.querySelector('mark.hl');
        if (first) setTimeout(function () { window.scrollTo({ top: Math.max(0, first.offsetTop - 120), behavior: 'smooth' }); }, 60);
      }
    } else if (anchor) {
      var t = document.getElementById(decodeURIComponent(anchor));
      if (t) setTimeout(function () { window.scrollTo({ top: t.offsetTop - 84, behavior: 'smooth' }); }, 30);
    }
    document.title = note.id + ' ' + note.title + ' · 判断推理知识库';
  }

  function highlightIn(root, terms) {
    if (!terms || !terms.length) return 0;
    var re = new RegExp('(' + terms.map(function (t) {
      return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|') + ')', 'gi');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = node.parentNode;
        if (p && /^(SCRIPT|STYLE|MARK)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
        re.lastIndex = 0;
        return re.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    var count = 0;
    nodes.forEach(function (node) {
      var frag = document.createDocumentFragment();
      var parts = node.nodeValue.split(re);
      parts.forEach(function (p, i) {
        if (i % 2 === 1) { var m = document.createElement('mark'); m.className = 'hl'; m.textContent = p; frag.appendChild(m); count++; }
        else if (p) frag.appendChild(document.createTextNode(p));
      });
      node.parentNode.replaceChild(frag, node);
    });
    return count;
  }

  function renderPager(note) {
    var i = note._idx, p = NOTES[i - 1], n = NOTES[i + 1];
    $('#pager').innerHTML =
      (p ? '<a class="pg" href="#' + p.id + '" data-id="' + p.id + '"><span>上一讲</span><b>' + p.id + ' ' + esc(p.title) + '</b></a>' : '<span class="pg disabled"></span>') +
      (n ? '<a class="pg next" href="#' + n.id + '" data-id="' + n.id + '"><span>下一讲</span><b>' + n.id + ' ' + esc(n.title) + '</b></a>' : '<span class="pg disabled"></span>');
  }

  /* ================= 首页 ================= */
  function renderHome() {
    currentId = null;
    renderedKey = '';
    document.body.classList.add('is-home');
    $('#toc').style.visibility = 'hidden';
    $('#pager').innerHTML = '';
    $$('#nav .item').forEach(function (a) { a.classList.remove('active'); });
    var h = Math.round(KB.meta.totalSec / 3600 * 10) / 10;
    var last = ls(LS_LAST);
    var read = readMap();
    var readCount = NOTES.filter(function (n) { return read[n.id]; }).length;

    var html = '<div class="doc-inner home">' +
      '<div class="hero">' +
      '<h1>' + esc(KB.meta.title) + '</h1>' +
      '<p class="hero-sub">' + esc(KB.meta.subtitle || '') + (KB.meta.teacher ? ' · ' + esc(KB.meta.teacher) : '') + '</p>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + KB.meta.totalEp + '</b><span>篇笔记</span></div>' +
      '<div class="stat"><b>' + h + '</b><span>小时视频</span></div>' +
      '<div class="stat"><b>' + KB.groups.length + '</b><span>个模块</span></div>' +
      '<div class="stat"><b>' + readCount + '/' + KB.meta.totalEp + '</b><span>已读进度</span></div>' +
      '</div>' +
      (last && BY_ID[last] ? '<button class="btn primary" id="hContinue">继续上次：' + last + ' ' + esc(BY_ID[last].title) + '</button>' : '') +
      (KB.meta.course ? '<p class="hero-src">笔记来源：' + esc(KB.meta.course) + '</p>' : '') +
      '</div>' +
      '<div class="kbd-tips"><b>快捷键</b> ' +
      '<kbd>/</kbd><kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索 &nbsp;·&nbsp; <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 上一讲/下一讲 &nbsp;·&nbsp; <kbd>Esc</kbd> 关闭搜索 &nbsp;·&nbsp; 右键侧栏条目可取消已读</div>';

    KB.groups.forEach(function (g, gi) {
      var secs = g.items.reduce(function (a, b) { return a + b.sec; }, 0);
      html += '<section class="ghome"><h2><i>' + String(gi + 1).padStart(2, '0') + '</i>' + esc(g.name.replace(/^\d+\s*·\s*/, '')) +
        '<em>' + g.items.length + ' 讲 · ' + Math.round(secs / 60) + ' 分钟</em></h2><div class="chips">';
      g.items.forEach(function (n) {
        html += '<a class="chip' + (read[n.id] ? ' is-read' : '') + '" href="#' + n.id + '" data-id="' + n.id + '">' +
          '<span class="cp">' + n.id + '</span>' + esc(n.title) + '<span class="cd">' + n.dur + '</span></a>';
      });
      html += '</div></section>';
    });

    var _howto = (KB.meta && KB.meta.howto) || [
      ['按模块学：', '左侧目录按课程模块组织，和上课顺序一致，可整块顺读。'],
      ['全文搜索：', '直接搜考点名或关键词（如「增速」「比重」「百分点」），会列出所有讲过的位置和原文片段。'],
      ['查模板：', '每讲结尾都有「知识点总表 / 口诀与流程 / 易错点清单」，复习时只看这些表即可。'],
      ['追进度：', '打开过的讲会自动标记为已读，右侧可取消。']
    ];
    html += '<section class="ghome"><h2><i>用</i>怎么用这个知识库</h2><ul class="howto">' +
      _howto.map(function (it) {
        var b = Array.isArray(it) ? it[0] : (it.b || ''), t = Array.isArray(it) ? it[1] : (it.text || '');
        return '<li><b>' + esc(b) + '</b>' + esc(t) + '</li>';
      }).join('') +
      '</ul></section>';

    html += '</div>';
    $('#doc').innerHTML = html;
    var cb = $('#hContinue');
    if (cb) cb.addEventListener('click', function () { open(last); });
    document.title = KB.meta.title;
  }

  /* ================= 搜索 ================= */
  var idxReady = false;
  function buildIndex() {
    if (idxReady) return;
    NOTES.forEach(function (n) {
      n._lines = n.md.split('\n');
      n._lc = n.md.toLowerCase();
    });
    idxReady = true;
  }

  function doSearch(q) {
    buildIndex();
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var res = [];
    NOTES.forEach(function (n) {
      var ok = true;
      for (var i = 0; i < terms.length; i++) if (n._lc.indexOf(terms[i]) < 0) { ok = false; break; }
      if (!ok) return;
      var hits = [], total = 0;
      for (var j = 0; j < n._lines.length; j++) {
        var L = n._lines[j].toLowerCase(), best = 0;
        for (var k = 0; k < terms.length; k++) if (L.indexOf(terms[k]) >= 0) best++;
        if (best > 0) { total += best; hits.push({ line: j, text: cleanMd(n._lines[j]), score: best }); }
      }
      hits.sort(function (a, b) { return b.score - a.score; });
      res.push({ note: n, score: total, hits: hits.slice(0, 4) });
    });
    res.sort(function (a, b) { return b.score - a.score || a.note._idx - b.note._idx; });
    return res;
  }

  var searchSeq = 0;
  function runSearch(q) {
    var box = $('#results');
    if (!q.trim()) { box.hidden = true; box.innerHTML = ''; return; }
    var seq = ++searchSeq;
    var res = doSearch(q);
    if (seq !== searchSeq) return;
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var maxLine = 86;
    var html = '<div class="rs-head">找到 <b>' + res.length + '</b> 篇相关笔记（共 ' + NOTES.length + ' 篇）· <span class="rs-q">' + esc(q) + '</span><button class="rs-x" type="button">关闭 Esc</button></div>';
    if (!res.length) {
      html += '<div class="rs-empty">没有找到包含「' + esc(q) + '」的内容。试试更短的词，例如「他因」「秒杀」「两难」。</div>';
    } else {
      html += '<div class="rs-list">';
      res.slice(0, 40).forEach(function (r) {
        html += '<div class="rs-item"><a class="rs-title" href="#' + r.note.id + '" data-id="' + r.note.id + '">' +
          '<span class="badge">' + r.note.id + '</span><b>' + esc(r.note.title) + '</b>' +
          '<span class="rs-g">' + esc(r.note.group.replace(/^\d+\s*·\s*/, '')) + '</span>' +
          '<span class="rs-c">' + r.score + ' 处</span></a>';
        html += '<div class="rs-snips">';
        r.hits.forEach(function (hh) {
          var t = hh.text;
          var pos = -1;
          for (var k = 0; k < terms.length && pos < 0; k++) pos = t.toLowerCase().indexOf(terms[k]);
          if (pos < 0) pos = 0;
          var start = Math.max(0, pos - 30);
          var snip = (start > 0 ? '…' : '') + t.slice(start, start + maxLine) + (t.length > start + maxLine ? '…' : '');
          html += '<div class="rs-snip" data-id="' + r.note.id + '" data-line="' + hh.line + '">' + highlightSnippet(snip, terms) + '</div>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    }
    box.innerHTML = html;
    box.hidden = false;
  }

  function closeSearch() {
    $('#results').hidden = true;
    $('#q').value = '';
  }

  /* ================= 路由 ================= */
  function route() {
    var h = location.hash;
    if (!h) { if (renderedKey !== '') renderHome(); return; }
    if (h === renderedKey) return;
    var seg = decodeURIComponent(h.slice(1)).split('/');
    if (BY_ID[seg[0]]) open(seg[0], seg[1] || null);
    else renderHome();
  }

  /* ================= 初始化 ================= */
  function init() {
    buildSidebar();
    var bt = $('#brandTitle'), bs = $('#brandSub'), lg = $('.logo');
    if (bt && KB.meta.title) bt.textContent = KB.meta.title;
    if (lg && KB.meta.title) lg.textContent = KB.meta.title.replace(/[·・\s.].*$/, '').slice(0, 1);
    if (bs && KB.meta.subtitle) bs.textContent = KB.meta.subtitle;
    if (ls(LS_THEME) === 'dark') document.body.classList.add('dark');

    $('#brand').addEventListener('click', function () { location.hash = ''; renderHome(); });

    $('#btnHome').addEventListener('click', function () { location.hash = ''; renderHome(); });

    $('#btnExpand').addEventListener('click', function () {
      var any = $$('#nav .grp').some(function (g) { return g.classList.contains('closed'); });
      $$('#nav .grp').forEach(function (g) { g.classList.toggle('closed', !any); });
      $('#btnExpand').textContent = any ? '收起目录' : '展开目录';
    });

    $('#btnTheme').addEventListener('click', function () {
      document.body.classList.toggle('dark');
      ls(LS_THEME, document.body.classList.contains('dark') ? 'dark' : 'light');
      $('#btnTheme').textContent = document.body.classList.contains('dark') ? '浅色' : '深色';
    });
    $('#btnTheme').textContent = document.body.classList.contains('dark') ? '浅色' : '深色';

    $('#btnPrint').addEventListener('click', function () { window.print(); });

    $('#btnMenu').addEventListener('click', function () { document.body.classList.toggle('drawer'); });

    var q = $('#q'), timer = null;
    q.addEventListener('input', function () {
      clearTimeout(timer);
      var v = q.value;
      timer = setTimeout(function () { runSearch(v); }, 130);
    });
    q.addEventListener('focus', function () { if (q.value.trim()) runSearch(q.value); });

    $('#qclear').addEventListener('click', function () { closeSearch(); q.focus(); });

    $('#results').addEventListener('click', function (e) {
      if (e.target.closest('.rs-x')) { closeSearch(); return; }
      var t = e.target.closest('[data-id]');
      if (!t) return;
      var id = t.getAttribute('data-id');
      var terms = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
      $('#results').hidden = true;
      open(id, null, terms);
    });

    $('#pager').addEventListener('click', function (e) {
      var a = e.target.closest('a[data-id]');
      if (a) { e.preventDefault(); open(a.getAttribute('data-id')); }
    });

    $('#doc').addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a || a.closest('#nav')) return;
      var id = decodeURIComponent(a.getAttribute('href').slice(1)).split('/')[0];
      if (BY_ID[id] && !document.getElementById(id)) { e.preventDefault(); open(id); }
    });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea';
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); return; }
      if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); return; }
      if (e.key === 'Escape') { if (!$('#results').hidden) closeSearch(); else if (typing) q.blur(); return; }
      if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && currentId) {
        e.preventDefault();
        var i = BY_ID[currentId]._idx + (e.key === 'ArrowRight' ? 1 : -1);
        if (NOTES[i]) open(NOTES[i].id);
      }
    });

    window.addEventListener('hashchange', route);
    route();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  function closeDrawer() { document.body.classList.remove('drawer'); }
})();
</script>
</body>
</html>
