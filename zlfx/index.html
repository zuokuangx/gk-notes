的定性判断（先定性，再定量）\n\n画面公式（板书）：`r = r₁ + r₂ + r₁ × r₂`\n\n> ⭐ 注意：我这边说的不是**放大**，不是说变大，是**提高**。为什么不说放大说提高？因为他这个不是什么绝对值的大小，是他这个**量在提高**。\n\n### 4.1 结论一：r₁、r₂ 同正负 → 结果比 r₁ + r₂ **提高**\n\n> 当 r₁ 和 r₂ 它们是同正负的时候，你想想看，这个 r₁ × r₂ 会怎么样？它是不是一定会大于零啊？要么两个都是正的，正的乘正的大于零；负的和负的乘起来还是大于零。所以它的结果肯定就会比你这个 r₁ + r₂ **提高**。\n\n```\nr₁、r₂ 同正负  ⟹  r₁ × r₂ > 0  ⟹  r = (r₁ + r₂) + 正数  ⟹  比 r₁+r₂ 更高\n```\n\n### 4.2 结论二：r₁、r₂ 一正一负 → 结果比 r₁ + r₂ **降低**\n\n> 那如果另外一种情况呢，他们一正一负的时候，那就会结果会比他们俩的和要降低。因为一正一负，他们俩乘起来肯定就是小于零的。你加了一个小于零的数，不就往下降了吗？\n\n```\nr₁、r₂ 一正一负  ⟹  r₁ × r₂ \u003c 0  ⟹  r = (r₁ + r₂) + 负数  ⟹  比 r₁+r₂ 更低\n```\n\n### 4.3 结论三：其中一个增速很小时 → 乘积项几乎可忽略\n\n板书（画面原样）：**③ 当 r₁ 或 r₂ 很小时，主要看 r₁ + r₂，而 r₁ × r₂ 的影响几乎可以只考虑正负影响。**\n\n```\nr₁ 或 r₂ 很小  ⟹  r ≈ r₁ + r₂（乘积项只用来定正负方向，不用精算）\n```\n\n> 就是如果这两个增速都很小的时候、或者其中有一个很小的时候，他们影响是几乎可以忽略不计的。你就只考虑**正负影响**，你要注意这一点，你不要去算得太清楚，你要注意一下选项差距。\n\n### 4.4 老师用的「涨停板」比喻\n\n> 就比如说你今天吃了一个涨停板 10%，明天又吃了一个涨停板 10%，那你合起来难道你只涨到 20% 吗？不对啊，你会涨 21%。\n> 如果你今天吃了个跌停，跌了个 10%，明天又吃个跌停，又减少 10%，你会跌 20% 吗？不会啊，你只会跌 19%，它也会往上提一点。\n> ⭐ **你哪怕就是吃十个跌停，你也不可能跌成零的，它始终会给你保留一点**，它是这种感觉。因为这 10 个跌停不是 10 × 10 = 负 100%，不会的，因为它会有不断的小尾巴在往上加。\n\n```\n＋10% 后 ＋10%  →  1.1 × 1.1 = 1.21  →  +21%（不是 +20%）\n−10% 后 −10%  →  0.9 × 0.9 = 0.81  →  −19%（不是 −20%）\n```\n\n> 这个「涨」它有这个样子：涨得比这种直线要高。\n\n---\n\n## 五、低增速累积估算方式（含提前修正的雏形）\n\n画面板书（原样）：\n\n```\n低增速累积估算方式：\na% 与 b% 累积结果 = a + b + (a × b) / 100\n```\n\n> 有的同学说，老师，我有时候会分不清楚那个小数点应该点在哪儿，就主要就是后面那两个相乘。教大家一个技巧：**就你不用去管这个百分号。**\n\n以第 3 题为例（`r₁ = 2.08%`，`r₂ = 6.45%`）：\n\n```\n第一步：先不管百分号，直接把数值相加        2.08 + 6.45 = 8.53\n第二步：两个数值相乘，用乘法放缩           2.08 × 6.45 ≈ 2 × 6.5 = 13\n第三步：把乘积除以 100（相当于还回一个%）    13 / 100 = 0.13\n第四步：相加                              8.53 + 0.13 = 8.66\n第五步：整体套一个百分号                    8.66%\n```\n\n> 2.08 乘以 6.45，我们先知道一个乘法放缩，就是 2 乘 6.5 左右吧，就是 13；13 除以 100 是 0.13；那就是 8.53 加 0.13 等于 8.66。这样你就不用担心你分不清这个小数点该点在哪儿、会不会点错，然后导致结果出错的问题了。\n\n> 为什么可以这么做呢？就相当于是我们把它整体扩大了 100 倍 —— 本来是 2.08% 加上 6.45% 加上他们俩相乘，然后我把它整体乘了个 100 倍，或者就把这百分号提出来了。相当于 2.08 加上 6.45，再加上这边我提到一个百分号，刚才剩一个百分号，一个百分号又是个 100，2.08 乘以 6.45（再除以 100）。这样子你就先把它的值加起来，加了之后加上它俩相乘除以百，然后整体再给它套一个百分号就行了。\n\n> ⭐ **这样你就好点了，这种问题一般在这种小的增速上特别好用**，因为你小的增速你就好乘嘛。\n\n**验算示例（画面）**：\n\n```\n(2.08 + 6.45 + (2.08 × 6.45)/100) %\n= (2.08 + 6.45 + 0.13) %\n= 8.66%\n```\n\n---\n\n## 六、高增速累积：倍化与百化分两种思路\n\n> 如果是大一点的，你可以用一些百化分。比如说如果这个题目是什么百分之二十五跟百分之二十八累积，那这个时候你就不要这么去算了 —— 这边写了低增速的（估算）方式，低增速这么做（好一点）；如果是高增速的，25 乘 28，你可能没有那么好算。\n\n板书（画面右下角标注）：`25%  28%`\n\n```\n高增速做法一（百化分）：\n25% ≈ 1/4\n53 + (1/4) × 28 = 53 + 7 = 60     → 约 60%\n\n（即：先加起来 25 + 28 = 53，再把其中一个化成百化分去乘另一个）\n```\n\n> 你把它当做四分之一，你先加起来是 53，再加上四分之一乘以 28，加上 7，合起来就是 60，这样子可能就会快一点。\n> 如果是这种百分之几十的，你就想想它大概靠近一个什么百分比，四分之一、三分之一还是二分之一，大概估一下，会更快一点。\n\n板书（第 10 组练习）：`120.4% 24.5% → 144.9%`，`1.2 × 24.5`\n\n```\n高增速做法二（倍化）：\n把 120% 看成 1.2 倍\n24.5 × 1.2 ≈ 24.5 + 它自己的 20% ≈ 24.5 + 5 = 约 30\n144.9 + 30 = 174.9 ≈ 175%\n```\n\n> 这种很大的时候，你可以往倍数的角度去想一想：百分之一百二，我能不能看成一点二倍，这样是不是好算？你就把 24.5 乘以 1.2 倍，加它的 20%，大概 30 左右。\n> 或者把它当做四分之一，一百二除以四等于三十，也可以，因为它靠近一个百化分。就这是两种思路。\n\n> ⭐ 一种思路：如果有百化分的，你可以把它转换成百化分；或者说如果这种很大的、百分之一百多的，你就当一点几倍去乘。\n\n**高增速累积小结表**：\n\n| 情形 | 处理方式 | 示例 |\n| --- | --- | --- |\n| 两个都是百分之几（低增速） | 数值直接相加 + 数值相乘÷100 | `2.08 + 6.45 + (2.08×6.45)/100 = 8.66` |\n| 两个都是百分之几十（中高增速） | 其中一个找百化分（1/4、1/3、1/2）估计 | `25 + 28 → 53 + (1/4)×28 = 60` |\n| 两个都是百分之一百多（高增速） | 把大数看成「一点几倍」，或大数找百化分 | `120.4 + 24.5 = 144.9`，`24.5 × 1.2 ≈ 30` |\n\n---\n\n## 七、「收窄」与「回落」的概念辨析\n\n> 这边又涉及到一个知识点，收窄、扩大这是什么意思？为什么叫「窄」？这个字也很有意思，就跟我刚说「提高」一样的 —— 「高」就要从像画一个坐标轴一样，从低往高了走；说「窄」就是它的**绝对值变小了**。\n\n> 为什么会用「窄」这个词呢？对，就像腰围一样。中间这是个百分之零这个位置，那我去年的时候如果是负的 26%，今年变成了负的 24%，你把这个东西想的像一个腰一样，它是不是**变窄**了呀？以前这个负 26 到零的距离，这个腰围是 26；现在这个腰围只剩 24 了，所以它**收窄**了 —— 这个意思叫「收窄」，就是**距离 0% 更近了**。\n\n| 词 | 含义 | 与 0% 的距离 | 例 |\n| --- | --- | --- | --- |\n| **收窄** | 负增速的绝对值变小（离 0 更近） | 变近 | 上年 −26% → 今年 −24.4%，收窄 1.6 个百分点 |\n| **扩大** | 负增速的绝对值变大（离 0 更远） | 变远 | 反向操作 |\n| **回落** | 单纯的「从上往下」，从正到负、从大到小 | 不强调与 0 的距离 | 上年 +1.1% → 今年 −15.5%，回落 16.6 个百分点 |\n\n> 主要讨论是他们到零的距离对不对？距离从宽变成窄，那「回落」呢，就是单纯的从上往下，从正到负、从上往下、从大到小这样下来的，就之前你不知道这个动作在哪，反正他从去年调了 16.6 个百分点下来，变成了今年的 −15.5%。\n\n**求上年增速的两种操作**：\n\n```\n已知「今年增速」和「收窄/回落」的百分点\n\n收窄 → 上年增速的绝对值 = 今年降幅 + 收窄的百分点（负得更多）\n        例：今年 −24.4%，降幅收窄 1.6 个百分点 → 上年 −26%\n\n回落 → 上年增速 = 今年增速 + 回落的百分点（加回去）\n        例：今年 −15.5%，增速比上年同期回落 16.6 个百分点 → 上年 +1.1%\n```\n\n> 所以去年的（增速）就是直接加回落，其实就「减」的意思，你把它加回去，加个 16.6，变成了 1.1。\n\n**坐标轴地图法（板书）**：\n\n```\n        −26%      −24.4%         0%\n   ──────●──────────●────────────┼─────→\n         收窄 1.6 个百分点（腰围从 26 变成 24.4）\n```\n\n```\n        +1.1%                   0%       −15.5%\n   ───────●────────────────────┼──────────●─────→\n          回落 16.6 个百分点（从上往下掉）\n```\n\n---\n\n## 八、增速拆分的计算模式（平均数增长率的估算）\n\n画面公式（板书）：`r = (r₁ − r₂) / (1 + r₂)`\n\n> 这个拆分它也是有计算小技巧的，不然的话每次都来一个除法，麻烦死了。\n\n> 我们有没有注意到一个点，你看 `r = (r₁ − r₂) ÷ (1 + r₂)`。我随便拿个数来举个例子，比如说 8%、5%，如果这是 r₁，这是 r₂ —— 我们先根据我们的运算步骤来讲，第一步是不是应该先做个差？8% − 5% = 3%，是不是在你脑海中是能够瞬间成型的？你不需要去写什么 8% 减 5%。\n\n> 好，然后怎么算它的平均数增长率来着？还要再除一个 `1 + 5%`。那这个式子我怎么感觉这么眼熟呢？一个什么东西，除了个 `1 + 5%`，这个东西像什么？**他是不是就像是一个现期除以（1 + 增速）**？所以这不就相当于算基期一样吗？\n\n### 8.1 核心转化：把 `(r₁−r₂)/(1+r₂)` 看成「现期 ÷ (1 + r)」\n\n画面板书（原样）：\n\n```\n（r₁ − r₂）/（1 + r₂）  转化为   现期 /（1 + r）= 基期   的计算模式\n如果 r₂ ≤ 10%，则化除为乘\n如果 r₂ 靠近百化分增速，则份数思想\n如果 1 + r₂ 较大、不靠近百化分增速，则粗略放缩估算\n```\n\n> 算这个百分之三，它在百分之五的增速的情况下，你不用考虑这个百分号，也就算「现期是三的时候，它的增速是百分之五，它的基期是多少」。根据增速的不同，去选择不同的计算方式 —— **三板斧又来了**。\n\n| r₂ 的特征 | 选用的速算方法 | 板书原话 |\n| --- | --- | --- |\n| `r₂ ≤ 10%` | **化除为乘**：`÷(1+r) ≈ ×(1−r)` | 「如果 r₂ ≤ 10%，则化除为乘」 |\n| r₂ 靠近百化分增速 | **份数思想**（1/3、1/4、1/5、1/8…） | 「如果 r₂ 靠近百化分增速，则份数思想」 |\n| `1 + r₂` 较大、不靠近百化分 | **粗略放缩估算**（比如除以 8、除以 9） | 「如果 1+r₂ 较大、不靠近百化分增速，则粗略放缩估算」 |\n\n### 8.2 三个口头演示（画面数值）\n\n```\n① 8% 与 5%：\n   先做差：8% − 5% = 3%\n   3% ÷ (1 + 5%) → 3% × (1 − 5%) = 3% − 0.15% = 2.85%\n\n② 10.8% 与 27%：          （画面标注 “27%  10.8%”）\n   先做差：27% − 10.8% = 16.2%\n   16.2% ÷ (1 + 10.8%) → 相当于 1/9，直接 16.2% − 1.6% = 14.6%\n\n③ 34.3% 与 50%：          （画面标注 “50%  34.3%”）\n   先做差：50% − 34.3% = 16.7%\n   16.7% ÷ (1 + 34.3%) → 把 34.3% 看作 1/3，减少量 ≈ 现期的 1/4 = 15.7% 的 1/4 ≈ 4%\n   16.7% − 4% = 12.7%（老师口算口误说成 13.7%，当堂更正：16.7 − 4 = 12.7）\n```\n\n> ⭐ **平均数增长率没有那种精算题。** 使用到平均数增长率的题目也不是精算题。\n> 不用补差，因为这种东西平均的增长率，它的计算精度要求不会很高的，你大概估个什么 14.6、14.5、14.7 都行，不影响。**不要管那么一点点小的误差了。**\n\n> 如果都不靠近，你就可以放缩算嘛，要么你就粗略的稍微估算估算。\n\n### 8.3 「化除为乘」的由来\n\n> 首先第一步能不能明白为什么化除为乘？就是把这个当作除以 `1 + 增速`。除这个我们之前讲过的 —— 现期除以 `1 + 增速`，那么上下同乘一个「1 减增速」，下面是一减 r 平方，上面是现期除以（1 − r），因为增速比较小，基本上忽略不计。\n> ⭐ **只要小于百分之十的时候，你这么算，误差是不超过百分之一的。**\n\n```\n现期 / (1 + r)  =  [现期 × (1 − r)] / [(1 + r)(1 − r)]\n               =  [现期 × (1 − r)] / (1 − r²)\nr 很小时 r² → 0，故 ≈ 现期 × (1 − r)\n```\n\n### 8.4 ⭐ 关键细节：提前修正\n\n以第 6 题为例，板书（画面原样）：\n\n```\n1.8% / (1 + 5.2%)  =  1.8% × (1 − 5%)\n                   =  1.8% − 0.09%\n                   =  1.71%\n```\n\n> 那为什么我这边不写 5.2、写 5？这边是第二个细节。这个叫什么？对，这个叫**提前修正**。\n> ⭐ 你如果直接把这个 1.8% 乘以 5.2%，当做这个增量的话，那么它这个结果会偏高 5.2%；那我们就把这个 5.2%，现在（提前）在这个增速上，正好给它调下去了。所以它准确的平均增长量就是 1.8% 减掉 0.09% 等于 1.71%，就是基本上没有任何一点点误差的，这样子你就计算上去特别踏实。\n> 因为这种各种估算技巧，它的误差我们都搞得是一清二楚的。\n\n> 那有的时候，如果说是 1.8% 除以 `1 + 8.6%` 咋写？直接 `1.8% × (1 − 8%)`，对不对？百分之 8.7 是不是也是一样的？百分之 8.8 是不是也可以这样子？百分之 9.9、9.8 是不是也可以这样？百分之 7.5 是不是也可以这样子？都是用到我们之前学的那个**化除为乘**就好了。\n\n| 除数 | 写成分解形式 | 说明 |\n| --- | --- | --- |\n| `1 + 5.2%` | `× (1 − 5%)` | 把 5.2% 提前修正为 5%（不重复计算已含在分子的部分） |\n| `1 + 8.6%` | `× (1 − 8%)` | 同上 |\n| `1 + 8.7%` / `1 + 8.8%` | `× (1 − 8%)` | 同上 |\n| `1 + 9.8%` / `1 + 9.9%` | `× (1 − 9%)` | 同上 |\n| `1 + 7.5%` | `× (1 − 7%)`（或按百化分 1/13 处理） | 同上 |\n\n### 8.5 一正一负时「变大/变小」看分母（重要澄清）\n\n> 有同学问，老师你今天不是说一正一负应该要降低吗？怎么你这个做差之后 16.2 之后，你是提高了呢？\n> ⭐ **我们刚刚说的一正一负降低，是「增速的累积」的时候**，是 `r₁ + r₂ + r₁ × r₂` 这个关系的时候，一正一负是降低 —— 那是**乘积增长率**。\n> **不是平均数增长率。** 平均数增长率变大变小，你看的是**分母**：分母上如果是个 `1 + 负增速`，那就会变高，这里就会变大 —— 因为你除了一个比 1 小的数，除了个零点几，肯定会变高。如果你是除一个 `1 + 正增速` 的数，那肯定就会降低。\n\n```\n平均数增长率 r = (r₁ − r₂) / (1 + r₂)\n\nr₂ 为负（分母 1 + r₂ \u003c 1）  →  整体被「除小」→ 结果变高\nr₂ 为正（分母 1 + r₂ > 1）  →  整体被「除大」→ 结果变小\n```\n\n> ⭐ 这是一个定性：**（分母是）负增速就会导致这个结果变高，分母（是）正增速就会导致结果变小。**\n\n---\n\n## 九、例题精讲\n\n### 第 1 题｜2021 年 1-2 月全国商品房销售面积（间隔倍数反推）\n\n**【题干原文】**\n\n> 2021 年 1-2 月，全国房地产开发投资 13986 亿元，同比增长 3873 亿元，房屋施工面积 770629 万平方米，同比增长 11.0%。商品房销售面积 17363 万平方米，同比增长 1.05 倍，比 2019 年 1-2 月增长 23.3%，商品房销售额 19151 亿元，同比增长 1.33 倍，比 2019 年同期增长 49.6%。\n>\n> 2020 年 1-2 月，全国商品房销售面积同比增长（ ）。\n>\n> A.-40.0% 　 B.-32.5% 　 C.40% 　 D.17.2%\n\n**【材料数据】**\n\n| 指标 | 2021 年 1-2 月数值 | 同比（vs 2020 年同期） | 比 2019 年同期 |\n| --- | --- | --- | --- |\n| 全国房地产开发投资 | 13986 亿元 | 增长 3873 亿元 | — |\n| 房屋施工面积 | 770629 万平方米 | 增长 11.0% | — |\n| 商品房销售面积 | 17363 万平方米 | 增长 1.05 倍 | 增长 23.3% |\n| 商品房销售额 | 19151 亿元 | 增长 1.33 倍 | 增长 49.6% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 间隔关系反推：已知 2021 对 2019 的增长、2021 对 2020 的增长，求 2020 对 2019 的增长 |\n| 定位数据 | 销售面积：2021 vs 2019 增长 23.3% → 倍数 `1.23`；2021 vs 2020 增长 1.05 倍 → 倍数 `2.05` |\n| 列式 | `1 + r = (1 + r₁) × (1 + r₂)`；拆开即 `1 + r₂ = (1 + r) ÷ (1 + r₁) = 1.23 ÷ 2.05` |\n| 速算步骤 | `1.23 ÷ 2.05 ≈ 0.6`（倍） |\n| 结论 | `0.6 − 1 = −0.4` → 增速为 **−40%** |\n\n```\n1 + r  = 1.23            （2021 年 1-2 月 vs 2019 年 1-2 月，销售面积）\n1 + r₁ = 2.05            （2021 年 1-2 月 vs 2020 年 1-2 月，「增长 1.05 倍」即 2.05 倍）\n\n1 + r₂ = 1.23 ÷ 2.05 = 0.6 倍\nr₂     = 0.6 − 1 = −0.4 = −40%\n```\n\n**【选项原文】** A.-40.0% 　 B.-32.5% 　 C.40% 　 D.17.2%\n\n**【答案】** ✅ A\n\n**【解析】**\n- 「同比增长 1.05 倍」不是「增长 1.05」，倍数是 `1 + 1.05 = 2.05`，这是本类题的**概念陷阱**——把「增长几倍」当成「增速是百分之几」。\n- 同理「比 2019 年 1-2 月增长 23.3%」→ 倍数是 1.233 ≈ 1.23。\n- ⭐ **画面反复圈划提醒：求出的是「倍数」，必须减 1 才是增速。** 老师原话：「刚刚那个『是多少倍』跟『增长』的关系，人要记得减个一，是 0.6 倍，不能说它增速是 60%，减个一 —— 增长了负的 0.4 倍，就是增速是负 40%。」\n- 陷阱类型：**时间陷阱（2021/2020/2019 三段）+ 概念陷阱（倍 vs 增速）**。\n\n---\n\n### 第 2 题｜2014 年全国棉花单位面积产量（平均数增长率）\n\n**【题干原文】**\n\n> 2014 年全国棉花播种面积 4219.1 千公顷，比 2013 年减少 2.9%。棉花总产量 616.1 万吨，比 2013 年减产 2.2%。\n>\n> 2014 年全国棉花单位面积产量比上年约：\n>\n> A.提高了 5.1% 　 B.提高了 0.7% 　 C.降低了 5.1% 　 D.降低了 0.7%\n\n**【材料数据】**\n\n| 指标 | 2014 年数值 | 比上年 |\n| --- | --- | --- |\n| 棉花播种面积 | 4219.1 千公顷 | 减少 2.9% |\n| 棉花总产量 | 616.1 万吨 | 减产 2.2% |\n| 单位面积产量 | = 总产量 ÷ 面积 | 待求 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 「单位面积产量」是平均数 → 平均数增长率（`a = b ÷ c` 结构） |\n| 定位数据 | 分子总产量增速 `r₁ = −2.2%`；分母面积增速 `r₂ = −2.9%` |\n| 列式 | `r = (r₁ − r₂) ÷ (1 + r₂) = (−2.2% − (−2.9%)) ÷ (1 + (−2.9%))` |\n| 速算步骤 | 减负变加：`−2.2 + 2.9 = 0.7`；分母 `1 − 2.9% = 0.971`；`0.7 ÷ 0.971 > 0.7%` |\n| 结论 | 为正 → 提高；数值只可能是 0.7%（不可能到 5.1%） |\n\n```\n单位面积产量 = 总产量 ÷ 面积      （板书：单位面积产量 = 总产量/面积）\nA = B ÷ C                         （板书标注）\n\nr = (r₁ − r₂) / (1 + r₂)\n  = (−2.2% − (−2.9%)) / (1 + (−2.9%))\n  = 0.7% / 0.971\n  = 0.7/0.971  → 略大于 0.7%\n```\n\n**【选项原文】** A.提高了 5.1% 　 B.提高了 0.7% 　 C.降低了 5.1% 　 D.降低了 0.7%\n\n**【答案】** ✅ B\n\n**【解析】**\n- 分子分母**同负**，做差得正 → 单位面积产量**提高**，先排除 C、D（两个「降低」）。\n- `0.7% ÷ 0.971` 虽然比 0.7% 略大，但**变大得极小**，会被四舍五入抹掉，所以只能是 0.7% 而不会是 5.1%。\n- 老师原话：「有些同学不要说光看一个什么大小就一定会把 0.7 给它排掉，不一定的 —— 因为它这个变大的幅度太小了，提高的那个量太小了，被它四舍五入舍掉了。你这想到哪去才能到这个 5.1 啊？你得乘个六什么的，乘个七都还不够。」\n- 陷阱类型：**概念陷阱（「单位面积产量」到底是产量÷面积）+ 数量级陷阱**。\n\n**「后÷前」口诀板书（画面原样）**：\n\n```\n平均每平方米产量   →   后 ÷ 前\n人均收入 = 收入 / 人数\n平均每人得分 = 得分 / 人数\n```\n\n---\n\n### 第 3 题｜2014 年国家下拨农村义务教育经费（低增速累积）\n\n**【题干原文】**\n\n> 2014 年，国家下拨农村义务教育经费保障资金为 878.97 亿元，2013、2014 年依次增长 2.08%、6.45%\n>\n> 与 2012 年相比，2014 年国家下拨农村义务教育经费保障资金增长（ ）%。\n>\n> A.6.45 　 B.7.38 　 C.8.53 　 D.8.66\n\n**【材料数据】**\n\n| 指标 | 数值 |\n| --- | --- |\n| 2014 年下拨资金 | 878.97 亿元 |\n| 2013 年增速 | 2.08% |\n| 2014 年增速 | 6.45% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 增速的累积（间隔增长率）：2012 → 2013 → 2014 两段连续增长 |\n| 定位数据 | `r₁ = 2.08%`，`r₂ = 6.45%` |\n| 列式 | `r = r₁ + r₂ + r₁ × r₂` |\n| 定性 | 两个都是正的 → 结果一定比 `r₁ + r₂` **高** |\n| 速算步骤 | 先加：`2.08 + 6.45 = 8.53`；后乘：`2.08 × 6.45 ≈ 2 × 6.5 = 13`，`13/100 = 0.13` |\n| 结论 | `8.53 + 0.13 = 8.66` |\n\n```\nr = r₁ + r₂ + r₁ × r₂\n\n第一步（运算顺序：先加）   2.08 + 6.45 = 8.53\n第二步（定性）             两个都为正，乘积为正 → 结果 > 8.53  →  只能选比 8.53 大的\n第三步（凑整 / 定量）       2.08 × 6.45 ≈ 2 × 6.5 = 13 → 13/100 = 0.13\n第四步                     8.53 + 0.13 = 8.66\n```\n\n**【选项原文】** A.6.45 　 B.7.38 　 C.8.53 　 D.8.66\n\n**【答案】** ✅ D\n\n**【解析】**\n- ⭐ **定性秒杀**：两个增速同为正，乘积项必为正 → 结果一定**大于** `8.53`。选项中比 8.53 大的**只有 D（8.66）**，连乘积都不用算。\n- 老师原话：「所以这个题目你会发现，比 8.53 高的只有一个 8.66。那你就不需要算这个东西了吧，我压根连看都懒得看上了。我两个一加 8.53 一看选项，哦，D 走了。」\n- 若需要精确算，用「低增速累积估算方式」`a + b + (a×b)/100`，且**不用管百分号，最后整体套一个%**。\n- 陷阱类型：**计算陷阱（忘了加乘积项）**。\n- 高增速时的对照：若换成 `25%` 与 `28%`，则不要硬乘，改为 `53 + (1/4)×28 = 60`（百化分）。\n\n---\n\n### 第 4 题｜2016 年东北地区民间固定资产投资（降幅收窄）\n\n**【题干原文】**\n\n> 2016 年，东北地区民间固定资产投资额 21608 亿元，比上年下降 24.4%，降幅收窄 1.6 个百分点。\n>\n> 与 2014 年相比，东北地区 2016 年民间固定资产投资额增长（ ）。\n>\n> A.-44.1% 　 B.-50.4% 　 C.-52.9% 　 D.-56.7%\n\n**【材料数据】**\n\n| 指标 | 数值 |\n| --- | --- |\n| 2016 年民间固定资产投资额 | 21608 亿元 |\n| 2016 年增速 | −24.4% |\n| 降幅变化 | 收窄 1.6 个百分点 → 2015 年增速 = −26% |\n| 所求 | 2014 年 → 2016 年的累积增速 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 增速的累积（间隔增长率）+ 「收窄」概念转化 |\n| 定位数据 | 先由「收窄」推出上年增速：`−(24.4 + 1.6) = −26%` |\n| 列式 | `r = r₁ + r₂ + r₁ × r₂`，`r₁ = −26%`（2015），`r₂ = −24.4%`（2016） |\n| 定性 | 两个都是负的 → **负负得正**，乘积为正 → 结果比 `r₁ + r₂` **提高** |\n| 速算步骤 | 先加：`−26% + (−24.4%) = −50.4%`；乘积为正 → 往上提 |\n| 结论 | 在 −50.4% 之上 → 只能是 **−44.1%**（其余三个都比 −50.4% 更低） |\n\n```\n坐标轴地图法（板书）：\n   −26%      −24.4%          0%\n ────●─────────●──────────────┼────→\n      收窄 1.6 个百分点\n\n两年增速：  −26%   −24.4%\n先加：     −26 + (−24.4) = −50.4%\n负负得正 → 结果往上提 → −44.1%\n```\n\n**【选项原文】** A.-44.1% 　 B.-50.4% 　 C.-52.9% 　 D.-56.7%\n\n**【答案】** ✅ A\n\n**【解析】**\n- ⭐ **定性秒杀**：两个增速都是负的，`r₁ × r₂ > 0`，结果一定**高于** `r₁ + r₂ = −50.4%`。四个选项中只有 A（−44.1%）高于 −50.4%，直接选 A。\n- 「收窄」是**绝对值变小、离 0 更近**：今年 −24.4%，收窄 1.6 个百分点 → 上年是 −26%。**不是** −24.4% + 1.6% 方向搞反。\n- 老师原话：「然后我们（选）A 可以走了，为什么可以直接走 A 了呀？因为他们两个都是负的，负负会得正，正还会让这个增速提高，会继续往上走，变成负的 44.1%。」\n- 陷阱类型：**概念陷阱（收窄的方向）+ 计算陷阱（漏掉乘积项）**。\n\n---\n\n### 第 5 题｜2019 年 1-8 月房地产开发企业土地成交额（乘积增长率）\n\n**【题干原文】**\n\n> 2019 年 1-8 月，房地产开发企业土地购置面积 12236 万平方米，同比下降 25.6%，每平方米土地价格同比上涨 4.5%，土地成交额 6374 亿元。\n>\n> 2019 年 1-8 月，房地产开发企业土地成交额与去年同期相比增长约：\n>\n> A.-17% 　 B.-22% 　 C.-27% 　 D.1.2%\n\n**【材料数据】**\n\n| 指标 | 数值 | 同比 |\n| --- | --- | --- |\n| 土地购置面积 | 12236 万平方米 | 下降 25.6% |\n| 每平方米土地价格（单价） | — | 上涨 4.5% |\n| 土地成交额 | 6374 亿元 | 待求 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 成交额 = 面积 × 单价 → **乘积增长率** |\n| 定位数据 | 面积增速 `r₁ = −25.6%`；单价增速 `r₂ = 4.5%` |\n| 列式 | `r = r₁ + r₂ + r₁ × r₂` |\n| 定性 | 一正一负 → `r₁ × r₂ \u003c 0` → 结果比 `r₁ + r₂` **降低** |\n| 速算步骤 | 先加：`−25.6 + 4.5 = −21.1`；把 25.6% 看成 `1/4`，`(−1/4) × 4.5% ≈ −1.1%` |\n| 结论 | `−21.1% + (−1.1%) = −22.2%` → 选 −22% |\n\n```\n成交额 = 面积 × 单价        （板书：成交额 = 面积 × 单价）\nr = r₁ + r₂ + r₁ × r₂\n  = (−25.6%) + 4.5% + (−25.6% × 4.5%)\n\n先加： −25.6 + 4.5 = −21.1%\n后乘： 25.6% ≈ 1/4  →  (−1/4) × 4.5% = −1.1%\n      −21.1% + (−1.1%) = −22.2%  →  ≈ −22%\n```\n\n**【选项原文】** A.-17% 　 B.-22% 　 C.-27% 　 D.1.2%\n\n**【答案】** ✅ B\n\n**【解析】**\n- 一正一负 → 结果是**比 −21.1% 更低**的负数，先把正的 D（1.2%）排除。\n- A（−17%）比 −21.1% 还高，方向反了，排除。\n- ⭐ 关键在选项差距：`−27%` 太夸张了。老师原话：「你这个增速才 4.5%，你要拿一个什么 4.5 乘一个 25.6，肯定更小，怎么可能跌到 27 去呢？你连滚带爬，你都滚不到那边去啊。所以只能选 22。」\n- 陷阱类型：**计算陷阱（一正一负的方向）+ 数量级陷阱**。\n\n---\n\n### 第 6 题｜2017 年 A 省平均每人次客运旅客运输距离（平均数增长率）\n\n**【题干原文】**\n\n> 2017 年，A 省完成客运总量 148339 万人次，同比增长 5.4%，增幅比前三季度提高 0.2 个百分点，比上年提高 0.5 个百分点；完成旅客周转总量 4143.84 亿人公里，增长 7.7%，增幅比前三季度提高 0.7 个百分点，比上年提高 1.8 个百分点。\n>\n> 2017 年前三季度，A 省平均每人次客运旅客运输距离（旅客周转量÷客运总量）同比\n>\n> A.下降了不到 2%\n> B.下降了 2%以上\n> C.上升了不到 2%\n> D.上升了 2%以上\n\n**【材料数据】**\n\n| 指标 | 2017 年全年 | 全年同比 | 比前三季度提高 | 比上年提高 |\n| --- | --- | --- | --- | --- |\n| 客运总量 | 148339 万人次 | 增长 5.4% | 0.2 个百分点 | 0.5 个百分点 |\n| 旅客周转总量 | 4143.84 亿人公里 | 增长 7.7% | 0.7 个百分点 | 1.8 个百分点 |\n\n**由材料倒推前三季度增速**：\n\n```\n旅客周转量（分子）前三季度增速 = 7.7% − 0.7% = 7%       （全年比前三季度提高 0.7 个百分点）\n客运总量（分母）前三季度增速   = 5.4% − 0.2% = 5.2%     （全年比前三季度提高 0.2 个百分点）\n```\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 「平均每人次运输距离」= 旅客周转量 ÷ 客运总量 → 平均数增长率 |\n| 定位数据 | `r₁ = 7%`（分子，周转量），`r₂ = 5.2%`（分母，客运量）—— **注意是「前三季度」而非全年** |\n| 列式 | `r = (r₁ − r₂) / (1 + r₂) = 1.8% / (1 + 5.2%)` |\n| 定性 | 分子增速 > 分母增速 → 比值为正 → **上升**；且一定小于 1.8% → 只能是「上升了不到 2%」 |\n| 速算步骤 | 化除为乘：`1.8% × (1 − 5%) = 1.8% − 0.09% = 1.71%` |\n| 结论 | 上升约 1.71% → 选 C |\n\n```\n1 + r = (1+r₁)(1+r₂)     （板书右侧关系式）\nr = (r₁ − r₂) / (1 + r₂)\n\nr₁ = 7%      （旅客周转量，前三季度）\nr₂ = 5.2%    （客运总量，前三季度）\n\nr = 1.8% / (1 + 5.2%)\n  = 1.8% × (1 − 5%)        ← 化除为乘 + 提前修正（5.2% → 5%）\n  = 1.8% − 0.09%\n  = 1.71%\n```\n\n**【选项原文】** A.下降了不到 2% 　 B.下降了 2%以上 　 C.上升了不到 2% 　 D.上升了 2%以上\n\n**【答案】** ✅ C（画面勾选 C，A、B 被划掉）\n\n**【解析】**\n- ⭐ **定性秒杀**：`r₁ = 7% > r₂ = 5.2%` → 分子涨得比分母快 → 比值**上升**，先把 A、B（下降）排除。\n- 又因为结果一定**小于 1.8%**，达不到 2%，所以「上升了 2%以上」的 D 也排除，只能是 **C**。\n- 老师原话：「那其实这个地方你甚至就不需要去算了。因为你这个数算下来肯定是首先是个正的，它不可能下降；然后它上升也不可能到二以上的，因为它肯定小于 1.8，所以可以选那个 C。」\n- 陷阱类型：**时间陷阱（全年 vs 前三季度）+ 范围陷阱（增幅比前三季度提高 X 个百分点，要减回去）**。\n\n**【本题的「提前修正」细节（画面重点）】**\n\n> 那为什么我这边不写 5.2、写 5？这个叫**提前修正**。你如果直接把这个 1.8% 乘以 5.2%，当做这个增量的话，那么它这个结果会偏高 5.2%；那我们就把这个 5.2%，提前在增速上正好给它调下去了。所以它准确的平均增长量就是 `1.8% − 0.09% = 1.71%`，基本上没有任何一点点误差。\n>\n> 讲（别人）也看不明白，以为这个 5.2 怎么写成 5 了呢？是不是我打漏了两个字啊，还是简化计算啊？其实是有细节在的。\n\n---\n\n### 第 7 题｜2023 年 1-7 月规上工业企业利润总额（小增速忽略乘积）\n\n**【题干原文】**\n\n> 2023 年 1-7 月份，全国规模以上工业企业实现利润总额 39439.8 亿元，同比下降 15.5%，增速比上年同期回落 16.6 个百分点。\n>\n> 2023 年 1-7 月份，全国规模以上工业企业实现利润总额约比 2021 年 1-7 月份（ ）。\n>\n> A.下降了 14.6%\n> B.增长了 14.6%\n> C.下降了 31.5%\n> D.增长了 31.5%\n\n**【材料数据】**\n\n| 年份区间 | 增速 | 来源 |\n| --- | --- | --- |\n| 2021 → 2022（上年同期增速） | +1.1% | 由「今年 −15.5%，增速比上年同期回落 16.6 个百分点」加回：`−15.5 + 16.6 = 1.1` |\n| 2022 → 2023 | −15.5% | 材料直接给出 |\n| 2023 年 1-7 月利润总额 | 39439.8 亿元 | 材料 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 增速的累积（间隔增长率）+ 「回落」概念转化 |\n| 定位数据 | `r₁ = +1.1%`（21→22），`r₂ = −15.5%`（22→23） |\n| 列式 | `r = r₁ + r₂ + r₁ × r₂` |\n| 定性 | 一正一负 → 结果比 `r₁ + r₂` **降低**（但降低得极少） |\n| 速算步骤 | 先加：`1.1 + (−15.5) = −14.4`；乘积项 `1.1 × 15.5 / 100 ≈ 0.17`，太小，忽略 |\n| 结论 | ≈ −14.57% → 选 **−14.6%** |\n\n```\n板书（画面）：\n  21 —— 22 —— 23\n      +1.1%   −15.5%\n      ─────────────────\n      先加： −14.4%\n\nr = 1.1% + (−15.5%) + 1.1% × (−15.5%)\n  ≈ −14.4% − 0.17%\n  ≈ −14.6%\n```\n\n**【选项原文】** A.下降了 14.6% 　 B.增长了 14.6% 　 C.下降了 31.5% 　 D.增长了 31.5%\n\n**【答案】** ✅ A（画面在 A 上打勾）\n\n**【解析】**\n- ⭐ 本类题的关键是**「回落」要加回去**：`−15.5% + 16.6 个百分点 = +1.1%`。上年（2022 年 1-7 月）是**正增长 1.1%**。\n- 一正一负 → 结果**略低于** −14.4%，只能是 A（−14.6%）。老师原话：「他们是一正一负，肯定要往下取，往下取取多少？太小了，取一点点就好了，取个（一点点）就直接走了，因为这 31.5 太大了。」\n- C（−31.5%）是把两年的降幅直接相加（`−15.5 − 16.6`）的**典型错解**，属于概念理解错误：回落 16.6 个百分点意味着去年是 +1.1%，不是降幅再扩大 16.6。\n- ⭐ **本类题适用「③ 当 r₁ 或 r₂ 很小时，主要看 r₁+r₂，而 r₁×r₂ 的影响几乎可以只考虑正负影响」**：1.1% 很小，乘积项只起「方向」作用。\n- 陷阱类型：**概念陷阱（回落方向）+ 时间陷阱（三年跨度）**。\n\n---\n\n### 第 8 题｜2014 年某区第三产业平均每名从业人员创造利润\n\n**【题干原文】**\n\n> 2014 年某区限额以上第三产业单位共 674 家，实现收入 1059.1 亿元，同比增长 4.5%；实现利润总额 13.5 亿元，同比增长 11.9%；从业人员达到 58631 人，同比下降 4.3%。\n>\n> 2014 年该区限额以上第三产业单位平均每名从业人员创造的利润比上年约\n>\n> A.下降了 7%\n> B.下降了 17%\n> C.上升了 7%\n> D.上升了 17%\n\n**【材料数据】**\n\n| 指标 | 数值 | 同比 |\n| --- | --- | --- |\n| 单位数 | 674 家 | — |\n| 实现收入 | 1059.1 亿元 | 增长 4.5% |\n| 实现利润总额 | 13.5 亿元 | 增长 11.9% |\n| 从业人员 | 58631 人 | 下降 4.3% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 「平均每名从业人员创造的利润」= 利润总额 ÷ 从业人员数 → 平均数增长率 |\n| 定位数据 | `r₁ = 11.9%`（利润），`r₂ = −4.3%`（从业人员）；**限期量（1059.1 亿元等）不用看** |\n| 列式 | `r = (11.9% − (−4.3%)) / (1 + (−4.3%)) = 16.2% / (1 − 4.3%)` |\n| 定性 | 分子增速 > 分母增速 → 为正 → 上升；`16.2% ÷ (小于1的数)` 会比 16.2% 更大 |\n| 速算步骤 | 化除为乘 + 提前修正：`16.2% × (1 + 4.3%) = 16.2% + 16.2% × 4.3%`；`16.2 × 0.043 ≈ 0.729` |\n| 结论 | `16.2% + 0.729% = 16.93%` → 上升约 17% |\n\n```\n平均每名从业人员创造的利润 = 利润 / 从业人员   （板书）\nr₁ = 11.9%\nr₂ = −4.3%\n\nr = 16.2% / (1 − 4.3%)\n  ≈ 16.2% + 16.2% × 4.3%      ← 除以 (1 − r) 即乘以 (1 + r)\n  = 16.2% + 0.729%\n  = 16.93%\n```\n\n**画面速算细节（板书）**：\n\n```\n8.1 × 9\n──────── = 0.729        （把 16.2% × 4.3% 拆成「8.1×9」，9 的倍数好算）\n   45%                    （画面标注的 45% 对应 4.5% 量级）\n```\n\n> 就大概乘以百分之四点五，那就是 16.2 加上这个 `16.2 × 45`，这个 45 是 9 的倍数，这个东西也挺好用的，你可以把它想成 `8.1 × 9 × 0.001`，等于 0.729，这样子就非常准了。\n\n**【选项原文】** A.下降了 7% 　 B.下降了 17% 　 C.上升了 7% 　 D.上升了 17%\n\n**【答案】** ✅ D（画面在 D 上打勾）\n\n**【解析】**\n- 分子（利润 +11.9%）增速**大于**分母（从业人员 −4.3%）增速 → 比值**上升**，先排除 A、B。\n- 数值约 16.93%，接近 17% 而不接近 7%，选 D。\n- ⭐ 老师提醒：**不要算得太细**。「可能有的同学会觉得，老师，我好像不需要搞得这么花里胡哨的吧，我需要算这么准确吗？我算个什么十六点二，我不就能知道了吗？就是我讲这个东西呢，我写肯定要写的准确一点，但是你们在考虑的时候，你们也是不需要考虑这么细的 —— 因为很多时候只需要大概的去估一下，涨四个多点，你心里知道是多少，但你不一定要算那么多。**观察能出来的东西肯定是最好的。**」\n- 陷阱类型：**分母是负增速时方向判断（负增速导致结果变高）+ 数量级陷阱（17% vs 7%）**。\n\n---\n\n### 第 9 题｜2018 年上半年快递业务平均每件收入\n\n**【题干原文】**\n\n> 据统计数据显示，2018 年上半年，全国快递服务企业业务量累计完成 220.8 亿件，同比增长 27.5%；业务收入累计完成 2745 亿元，同比增长 25.8%。\n>\n> 与上年同期相比，2018 年上半年全国快递企业每件业务获得的收入约（ ）。\n>\n> A.上升了 1.5% 　 B.下降了 1.5% 　 C.上升了 1.3% 　 D.下降了 1.3%\n\n**【材料数据】**\n\n| 指标 | 2018 年上半年 | 同比 |\n| --- | --- | --- |\n| 业务量累计完成 | 220.8 亿件 | 增长 27.5% |\n| 业务收入累计完成 | 2745 亿元 | 增长 25.8% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 「每件业务获得的收入」= 收入 ÷ 业务量 → 平均数增长率 |\n| 定位数据 | 分子收入增速 `r₁ = 25.8%`；分母业务量增速 `r₂ = 27.5%` |\n| 列式 | `r = (25.8% − 27.5%) / (1 + 27.5%) = −1.7% / (1 + 27.5%)` |\n| 定性 | 分子增速 \u003c 分母增速 → 为负 → **下降**，排除 A、C |\n| 速算步骤 | 化除为乘 / 份数思想：`1.7% ÷ 1.275`；把 `1.275` 当作「除以 5 左右」→ `1.7 − 1.7/5 = 1.7 − 0.34 = 1.36` |\n| 结论 | 约 −1.3% → 选「下降了 1.3%」 |\n\n```\n每件业务获得的收入 = 收入 / 业务量       （板书）\nr₁ = 25.8%（收入）\nr₂ = 27.5%（业务量）\n\n做差：25.8 − 27.5 = −1.7%       （板书：只看「高低关系」，永远拿大数减小数）\nr = −1.7% / (1 + 27.5%)\n\n≈ 1.7 − 1.7/5 = 1.7 − 0.35 = 1.35   →  约 1.3%\n（画面另有写法：−1.7% ÷ (1 + 27.5%) → 1.7 ÷ (9/4)；17/8 → 1.36）\n```\n\n**【选项原文】** A.上升了 1.5% 　 B.下降了 1.5% 　 C.上升了 1.3% 　 D.下降了 1.3%\n\n**【答案】** ✅ D（画面把 A、C 划掉）\n\n**【解析】**\n- 秒判方向：`25.8% \u003c 27.5%`（分子涨得慢）→ 比值**下降**，排除 A、C。\n- 剩下 B（−1.5%）与 D（−1.3%），速算 `1.36 ≈ 1.3` → 选 D。\n- ⭐ 老师强调**做差时只看「高低位置」**：「做差的时候，你我如果觉得你想要快，一点也不要去真的去做差。你去在一个（坐标）做法里面去想，25.8 跟这 27.5 是什么关系，高低上是什么关系，它比它低、低多少，你就拿大的减小的、低一点七。所以直接出一个负的 1.7%。**这个有时候在一些负增数的减少上计算上是很有用的，是很快的。** 你就想到这个高低关系、高低位置。」\n- ⭐ 为什么「除以 5」也可以：「直接把（1.7）除以 5 左右，1.7 减了 0.3 几……把这个东西当做一个四分之一。我觉得除以五可能比你这个（1.7）乘以（某个百化分）要快，因为除以五我是可以直接当乘以二的（减个零点三五）。」\n- 陷阱类型：**分子分母定位陷阱（谁是 r₁ 谁是 r₂）+ 大小比较陷阱（1.5% vs 1.3%）**。\n\n---\n\n### 第 10 题｜2020 年 H 省秋粮玉米和稻谷亩产\n\n**【题干原文】**\n\n> 2020 年，H 省秋粮玉米和稻谷的市场平均交易价格分别为 2.34 元/公斤和 2.74 元/公斤，分别比上年上涨 28.6% 和 8.7%。按此价格测算，2020 年全省农户种植玉米、稻谷扣除成本前的产值分别为 957.1 元/亩、1520.7 元/亩，分别比上年增长 33.4%、8.9%。\n>\n> 2020 年，H 省秋粮玉米和稻谷的亩产（每亩产值平均交易价格）与上年相比：\n>\n> A.仅稻谷亩产高于上年水平\n> B.仅玉米亩产高于上年水平\n> C.两者亩产均高于上年水平\n> D.两者亩产均低于上年水平\n\n> 🔎 **画面备注**：括号里的关系式是老师自己加到 PPT 上的（原题没给这个公式）。老师原话：「其实这个题目他没有给这个公式，我是把这个公式给你们载在上面的。我加的时候是不是少加了一个除哦，我复制上来的时候复制少了一个除法。」（画面显示为「每亩产值平均交易价格」，转写不清处为中间是否有一个除号）\n\n**【材料数据】**\n\n| 品种 | 市场平均交易价格 | 价格比上年 | 扣除成本前产值 | 产值比上年 |\n| --- | --- | --- | --- | --- |\n| 玉米 | 2.34 元/公斤 | 上涨 28.6% | 957.1 元/亩 | 增长 33.4% |\n| 稻谷 | 2.74 元/公斤 | 上涨 8.7% | 1520.7 元/亩 | 增长 8.9% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 亩产 = 产值 ÷ 单价（画面板书「亩产 = 亩产值/单价」），也是「产量 ÷ 面积」；比值变化判断 |\n| 定位数据 | 玉米：`r₁ = 33.4%`（产值），`r₂ = 28.6%`（单价）\u003cbr>稻谷：`r₁ = 8.9%`（产值），`r₂ = 8.7%`（单价） |\n| 列式 | 只需比较 `r₁` 与 `r₂` 的大小（分子增速 > 分母增速则比值提高） |\n| 速算步骤 | 玉米：`33.4% > 28.6%` → 提高；稻谷：`8.9% > 8.7%` → 提高 |\n| 结论 | 两者的亩产**均高于**上年水平 |\n\n```\n亩产 = 亩产值 / 单价 = （板书原样）\n       亩产值\n亩产 = ────────\n        单价\n\n       产量\n   = ────────     （产量 ÷ 面积，另一个更常用的口径）\n       面积\n\n玉米： 产值增速 33.4%  >  单价增速 28.6%  →  亩产提高\n稻谷： 产值增速 8.9%   >  单价增速 8.7%   →  亩产提高\n      （8.9% − 8.7% = 0.2%，虽极小但为正，故仍为「提高」）\n\n玉米亩产增速 ≈ (33.4% − 28.6%) / (1 + 28.6%) = 4.8% / 1.286 ≈ 3.7% > 0\n稻谷亩产增速 ≈ (8.9% − 8.7%) / (1 + 8.7%)   = 0.2% / 1.087  ≈ 0.18% > 0\n```\n\n**【选项原文】** A.仅稻谷亩产高于上年水平 　 B.仅玉米亩产高于上年水平 　 C.两者亩产均高于上年水平 　 D.两者亩产均低于上年水平\n\n**【答案】** ✅ C（画面仅写出算式与「亩产 = 亩产值/单价 = 产量/面积」的板书；转写在片尾中断，未点选选项。按本讲「分子增速 > 分母增速 → 比值提高」的结论可推得 C）\n\n**【解析】**\n- ⭐ 这是**比值变化关系**的直接应用：亩产是「产值 ÷ 单价」，看谁涨得快。\n- 玉米产值增速（33.4%）> 单价增速（28.6%），亩产提高；稻谷产值增速（8.9%）> 单价增速（8.7%），亩产提高 → 两者都高于上年。\n- 老师补充了两个口径：「国产（亩产）它还可以等于另外一个公式，其实另外一个公式用的还多一点，就是每亩的产量，不就是产量除以面积吗？这个是用的相对多一点的。但这个题目它没有给产量跟面积的增速，只能从这个角度（产值÷单价）去理解。」\n- 单位换算提示（板书）：**单价 2.34 元/公斤、产值 957.1 元/亩** —— 「每亩产值 ÷ 单价 = 亩产」，本质上就是单位相消。\n- 陷阱类型：**概念陷阱（「亩产」的两种口径）+ 数值极接近陷阱（8.9% vs 8.7%，差 0.2 个百分点仍然算「提高」）**。\n\n---\n\n## 十、课堂练习：两组 r₁/r₂ 快速估算表\n\n### 10.1 第一组：增速的累积—练习（画面 10 组）\n\n画面板书（`r = r₁ + r₂ + r₁ × r₂`，题面只给 r₁、r₂，要求口算 r）：\n\n| # | r₁ | r₂ | 画面答案 r | 画面/口述速算过程 |\n| --- | --- | --- | --- | --- |\n| 1 | 2.1% | 2.7% | 约 4.85% | `2.1 + 2.7 = 4.8`；`2.1 × 2.7 ≈ 5`（数值相乘直接÷100）→ `4.8 + 0.05` |\n| 2 | 27.7% | 31% | 约 66.7% | 先加 `58.7`；把其中一个凑百化分（27.7% 看成 1/4、31% 看成 32%，`25%×32% ≈ 8%`；或 31% 看成 33%、27.7% 看成 27%，`33×27 ≈ 9%`），估 `+8%` 或 `+9%` |\n| 3 | 34.3% | 5.8% | 42.1% | `34.3 + 5.8 = 40.1`；34.3% ≈ 1/3，5.8% 凑成 6% → `40.1 + 2% = 42.1%`（画面标注 1/3、6%、40.1%、+2%） |\n| 4 | −4.8% | −3.7% | −8.3% | `−8.5%`；乘积 `5 × 4 = 20`，`20/100 = 0.2`，负负得正 → `−8.5 + 0.2 = −8.3` |\n| 5 | −24.2% | −18.3% | −38% | `−42.5%`；乘积找 1/4（24.2%≈1/4），`24.2 × 18.3 ≈ 4.5`，负负得正 → `−42.5 + 4.5 = −38` |\n| 6 | −51.6% | −10.8% | −57% | 板书 `−62.4% + 5.5% = −57%`；乘积 `51.2 × 10.8 / 100 ≈ 5.5`，负负得正 |\n| 7 | 5.4% | −2.5% | 2.75% | `5.4 + (−2.5) = 2.9`；乘积 `5.4 × 2.5 ≈ 13.5`，一正一负取负 → `2.9 − 0.135 ≈ 2.75` |\n| 8 | 7.9% | −18.1% | −11.8% | `7.9 − 18.1 = −10.2`；乘积约 `−1.6`（8 × 2 估）→ `−10.2 − 1.6 = −11.8` |\n| 9 | 40.2% | −30.5% | −2.3% | `40.2 − 30.5 = 9.7`；乘积 `40 × 30 = 12`（直接三四一十二）→ `9.7 − 12 = −2.3` |\n| 10 | 120.4% | 24.5% | 约 175% | `120.4 + 24.5 = 144.9`；把 1.2 当「1.2 倍」：`24.5 × 1.2 ≈ 30`（或 120/4 = 30）→ `144.9 + 30 ≈ 175` |\n\n**老师逐条原话（保留）**：\n\n> 首先第一个如果一个增速 2.1、一个增速是 2.7，那他们的增速累计起来是多少呢？`2.1 + 2.7 = 4.8`。加了之后，他俩相乘的时候咋写？直接拿 2.1 乘以 2.7，大概就是 5 左右，那就 `4.85`。懂吗？**你不要去想什么百分之二点一百分之二点七是乘以多少了，直接它俩相乘除一百。**\n\n> 再来第二组，`27.7 + 31`，这个时候这两个增速是不是大一点呢？大一点。我们步骤还是不变的，先加，加起来是 `58.7`。然后他俩相乘，这个时候你就不一定需要去什么想他们两个数值相乘的，你可以把其中某一个想成百化分，看看能不能在成积的时候凑一凑百化分、估一估。比如说把 31% 想成三分之一，它变小的；另外一个变大，百分之三十二加百分之八可以不？这是不是一种思路？或者我把这个想成百分之三十三，这边变小一点百分之二十七，反正估嘛，我也不差这百分之一。就大概的估一下，加个百分之八或者是加个百分之九，所以大概在百分之 66.7 的样子。\n\n> 再来第三组，一个大一个小，步骤还是不变，先加起来是 `40.1`。然后他俩相乘，他（34.3%）有没有比较好算的数？这个数比较好吧，它是一个三分之一左右，把它看成三分之一，那这边就看到百分之六呗（把 5.8 凑成 6）。因为我把 34.3 变小了，那我索性把（另一个）变成 6%，正好往上凑整。所以它的累积起来增速应该是百分之 `42.1`。\n\n> 然后再来与他们俩相加，加起来是负的 `8.5`，对吧？然后你先不要管正负号，你就先考虑他们的绝对值。先怎么样先乘，成的时候就大概的估一下。**你不要算那么细啊，这个你千万不要算那么细。** 说我把 4.8 变成 5，这个地方 3.7 呢，我也减个 2 变成 3.5，再预存，没必要，没必要，千万不要这样子，你不要本末倒置 —— ⭐ **它的增速很小，它的影响就很小，随便估。** 你就直接 `5 × 4 = 20`，`20/100 = 0.2`，够了，你算个 0.2 不就够了吗？你非要算个什么 0.19、0.18，有什么意义呢？没有意义。所以 `−8.5 + 0.2 = −8.3`。\n\n> 好再来，两个负的、还有大一点的怎么办？一加起来是负的 `42.5`。然后大一点的，你就找它旁边有没有百化分 —— 这是一个四分之一，`24.2 × 18.3 ≈ 4.5`。这时候他们是负负得正，加 4.5，会提高，那 `−42.5` 往上提 4.5 个点，就会变成负的 `38`。\n\n> 好再来，加负的 `62.4%`？（即 −51.6% 与 −10.8%）加什么，再加一个负百分之（十点八），就是（约）一半？`10.8`（的一半）… 负负得正，加个 5.4、5.5 左右，把它往上提 5.4 个点左右，就会变成负的 `57` 左右。\n\n> 继续，一正一负，加起来是 `2.9`（5.4 与 −2.5）。然后他俩相乘，大概 `5 × 2.几` 就是十几吧，十几除以 100 就是 0.1 几。这时候要怎么样？一正一负会降低，就减 0.1 几，所以大概在 `2.75` 左右。\n\n> `7.9` 与 `−18.1`，加起来是 `−10.2`。然后一正一负会降低多少呢？8 和 18，你可以把它百分之八大概乘那个负的百分之二（——即乘个百分之二十，这个二十呢就五分之一），随便估一下，负 `1.6` 左右。这就变成负的 `11.8%`。没错吧？**大家准确一点，肯定应该是比这个 11.8 这个数值要小一点的**，因为我刚把这个 7.9 跟 18.1 都扩大了，变成了 8 跟 20。\n\n> 再来，先加，反正统一都是先把两个加起来，加起来是 `9.7`（40.2 与 −30.5）。然后一正一负就要减少多少呢？这个时候就可以直接这两个比较整，你可以乘一下 `40 × 30`，这个好乘，它周围呢也没有那种很好用的那种百化分，或者你也没必要用，因为它本身就很整的，直接三四一十二（`12%`）。减去 `12%`，那就是负的 `2.3`。\n\n> 继续，这种特别大的增速，第一步先加 `144.9%`（120.4 与 24.5）。然后这种很大的怎么办呢？很大的时候，你可以往倍数的角度去想一想：百分之一百二，我能不能看成一点二倍，这样是不是好算？你就把 `24.5` 乘以 1.2 倍，加它的 20%，大概 `30` 左右。或者把它当做四分之一，`120 ÷ 4 = 30`，也可以，因为它靠近个百化分 —— 就这是两种思路。加 `30%` 左右，一家（约）`175%`。\n\n> ⭐ **小的数字要注意什么，大一点的数字可以注意什么：一正一负注意降低，同正同负注意提高。**\n\n### 10.2 第二组：增速的拆分—练习（画面 10 组）\n\n画面公式：`r = (r₁ − r₂) / (1 + r₂)`（题面只给 r₁、r₂，要求口算 r）：\n\n| # | r₁ | r₂ | 画面答案 r | 画面/口述速算过程 |\n| --- | --- | --- | --- | --- |\n| 1 | 4.7% | 6.3% | −1.5% | 做差 `4.7 − 6.3 = −1.6`；`(−1.6%)/(1.063) = 1.6 × (1 − 6%) = 1.6 − 0.096 = 1.5` → −1.5% |\n| 2 | 8.7% | 3.1% | 5.4% | 做差 `8.7 − 3.1 = 5.6`；`5.6 − 0.19 ≈ 5.4`（除以 1.031） |\n| 3 | 27.5% | 5.8% | 20% | 做差 `21.7%`；`21.7% / 1.058 ≈ 20.5 ≈ 20` |\n| 4 | 15.8% | 11.5% | 3.9% | 做差 `4.3`；`4.3 / 1.115 ≈ 4.3 / 1.12` → 约 3.9%（画面亦写 3.77%） |\n| 5 | −4.2% | −18.3% | +17.6% | 做差 `−4.2 − (−18.3) = 14.1`；`14.1/(1 − 18.3%)`；把 18.3% 看作 1/5 → 减少量 ≈ `14.1/4 ≈ 3.5` → `14.1 + 3.5 = 17.6`（画面亦写 17.5%；另有 `14/0.817 ≈ 7/4 = 1.75` 的放缩算法） |\n| 6 | −35.6% | −15.4% | −24% | 做差 `−20.2`；`−20.2/(1 − 15.4%)`，放缩成 `−20 ÷ 0.8 ≈ −24`（画面：`−20.2/(1−15.4%)`，另有 `20.2/0.846 ≈ 20/8.46 ≈ 24`） |\n| 7 | 5.4% | −2.5% | 8.1%（板书 8%） | 看高低：高 `7.9`；`7.9/(1 − 2.5%) ≈ 8`（下降 2.5%，结果往上抬一点点） |\n| 8 | 9.7% | −12.8% | 25.7% | 做差 `9.7 + 12.8 = 22.5`；把 12.8% 看成分母少「八分之一」→ 减少量 = 现期七分之一 → `22.5 + 22.5/7 ≈ 22.5 + 3.2 = 25.7` |\n| 9 | 56.2% | −20.7% | 约 100%（细算约 96%） | 做差 `56.2 + 20.7 = 76.9 ≈ 77`；`77/0.793` → 约等于 100%（画面另有 `77/80 = 1 − 3/80 ≈ 1 − 4% ≈ 96%`） |\n| 10 | 120.4% | 56.4% | 42% | 做差 `64`；`64/1.564 ≈ 70/1.66 = 7 × 6 = 42`（放缩到 70 与 1.66） |\n\n**老师逐条原话（保留）**：\n\n> 先做差，做差之后是负的 `1.6`。然后除以 `1.063`，稍微变小一点点，负一点五，行不行？为什么是负一点五？你想一下，就是相当于是一点六，少了它的大概六个点左右。就是 `1.6 × (1 − 6%)`，`1.6 − 0.096`，这样子的，就会变成 1.5。\n\n> 先做差，做差之后是 `5.6`，然后减`3.0156`的样子，`5.4` 对吧？这边就是「化除为乘」。\n\n> 先减，剪下来是 `21.7`，除以 `1.058`。这样一个关系，能不能直接赶紧给我估个 `20`，是不是差不多？**这边就不用算很细啊。** ⭐ **有的时候这个平均增长率千万不要算很细，因为我们后面用到平均数增长率的地方很多**，所以大家在算平均数增长率的时候一定要学会怎么去估算 —— 我们明天会有专门的一节课讲怎么用这个平均数增长率。\n\n> 有人问，这个地方不应该是负的减负的吗？**你不用管这个负号，你先把这个负号提出来再说。** 你就算后面这个东西，你就把它当一个正的数再算；你先不用管负号，先看它的绝对值，算完了之后再把这个负号整体还给它，对，你容易乱。\n\n> 这个地方叫「做差」，下面还继续了，`15.8 − 11.5 = 4.3`，然后除以 `1 + 11.5%`。脑海中要能直接写出来，相当于是 `4.3 除以 11`，直接**错位相减**，`4.3 ÷ 1.115` 凑一下就等于 `3.9`。\n\n> 再来，`−4.2`、`−18.3`，这就是我刚刚说的，也不用总去想什么谁减谁、谁减谁 —— **你看那个高低差距**。`−4.2` 跟 `−18.3`，谁高谁在上面？是不是（−4.2）在上面，它在上面，所以它肯定是**高的减低**的，减下来肯定是个正数，再加上个正的。正多少呢？`18.3` 减掉 `4.2`，减下来是 `14.1`。\n> 然后再除以 `1 + r`，就 `1 − 18.3%`。要么你就大概的估一估，有的时候你看这个选项精度，如果选项（差距大）或者说计算过程中你不需要算的很细，我就大概随便估个涨十几个点。虽然它只是个百分之十几，按道理不能用「化除为乘」（误差比较大），但如果选项精度要求比较低的话，你也可以化除为乘。\n> 如果你要算细一点，你可以把它当做一个大概在负五分之一左右的一个增速，那这个减少量就是现期的四分之一，大概在三点五左右，所以就是 `14.1 + 3.5 = 17.6`。**放缩当然也可以** —— 除以个 `1 − 18.3%`，就是除以 `0.817`，那我就把它当做 `14 除以 8`，`四分之七 = 1.75`，是不是也出来了 `17.5`，也很快。\n\n> `−35.6`、`−15.4`，前面这个增速是不是低一点？它低，那你这个减出来肯定是个负值，就是一个负的 `20.2`。这是个做差，然后你要除以 `1 + r`，就除以 `1 − 15.4%`。这个时候你要么就放缩：`20.2 除以 7`（或除以 8），给下面减个 4.6，上面大概四分之一不到，减个 12 左右吧，`8.46 → 19.2`，所以它就是负的 `24%`。\n> 或者也可以把这个 `15.4` 当做 `1/6` 左右，相当于是增速是负的六分之一，六份减一份变成五份，减少量是现期的五分之一，加了它的五分之一，`20 + 4 = 24`，就是 `−24%`。**注意我说的是绝对值。**\n\n> 继续，`5.4 − 2.5`，看 r₁ 比 r₂ 高多少，高了 `7.9`。然后除以 `1 − 2.5%`，直接给我上 `8`，这就化除为乘，往上涨大概两个多点，八出头。\n\n> 再来，高多少？高 `20`。`9.7` 加上 `12.8`，就是相当于是 `12.8 + 10 − 0.3 = 22.8 − 0.3 = 22.5`。先做差 `22.5`，然后除以 `1` 减去（12.8%）—— 这是减了个什么东西？**减了个八分之一**，对不对？那**减少量就是现期的七分之一**，所以就等于 `22.5 + 22.5/7 ≈ 22.5 + 3.2 = 25.7`。\n> 为啥是七分之一？因为这增速是负的八分之一啊！负的八分之一什么意思？八份减了一份（分子是七份）—— `1/(1−1/8) = 8/7`，即增加量是现期的七分之一。\n\n> 先做差下来是 `77`（增速差 77）。然后除以 `1 − 20.7%`。这个时候你也可以先看看它除了什么东西，除了个 `0.8` 左右的东西，直接约等于百分之百（除了个 `0.793`，跟百分百也差不了多少了）。\n> 那如果你要算得再细一点，要么你就直除；要么你把它看成一减去 `3/80`，大概就是一减去百分之四左右，所以是 `96%` 左右。这是一种**反向计算**的方式 —— ⭐ **如果你这个分式它比较靠近一个整数了、靠近 1 了、靠近 2 了，你可以先把这个一给它去掉，先把这个一给它提出来。**\n> 如果这个题目它的计算精度要求不高，你算个百分之九十六跟算个百分之百，结果是一样的，那你就没必要算到九十六。\n\n> 最后一个 `120.4`、`56.4`。做差之后是 `64`，然后除以 `1.564`。那这时候你要胆子大一点，直接我觉得 `42` 走了。知道这个 42 哪来的吗？两种操作：一种是胆量大点的 **放缩**，`64 ÷ 1.564 ≈ 70 ÷ 1.66 = 7 × 6 = 42`；或者把它看作二分之三，`64 ÷ (2/3) = 64 × 3/2 = 64 − 64/3 ≈ 64 − 21 ≈ 43`。\n> ⭐ **放缩、百化分，都是在这种「化除为乘」之外的时候比较好用的方法** —— 你看它有没有比较靠近的一些百化分、一加百分（几）或者它本身就是个百化分，或者把它去放缩成一个接近的百分数或整数上去思考。\n\n---\n\n## 十一、比值变化关系（平均数升降的判断）\n\n画面章节封面：**04 比值变化关系**\n\n画面板书（原样）：\n\n```\n人均得分（r） = 总得分（r₁） / 人数（r₂）\n\nr = (r₁ − r₂) / (1 + r₂)\n      ↑\n      > 0         ⟹   r₁ − r₂ > 0   ⟹   r₁ > r₂\n\n当分子增速 > 分母增速时，比值提高；\n当分子增速 \u003c 分母增速时，比值降低；\n当分子增速 = 分母增速时，比值不变。\n```\n\n> 平均数增长率，它也是个增长率，它只不过它的增长率的对象是谁呢？是那个**平均数**。所以我们可以根据这个平均数增长率的**大于零、小于零、等于零**来判断这个比值是**上升、下降还是不变**。\n\n> 那他什么时候高呢？我想要这个比值提高、想要这个平均数提高，我是不是要它这个增速大于零？那怎么才能大于零？`1 + r` 这个东西肯定是大于零的 —— 因为在我们资料分析的体系里面，增速他绝对不可能出现什么负的百分之一百二这种夸张的数值。\n> ⭐ 因为我们讨论的是正的值。我们去年赚一百块，今年赚八十块，就是个负的（百分之二十）；不可能说我去年赚一百、今年亏二十，让你去算这个增速的，就这种事情的。\n> 所以我们这个增速都是大于负百分之一百的，所以这个 `1 + r` 他是大于零的。\n> 你想要这个整体（平均数比值）的增速大于零，你就需要上面这个 `r₁ − r₂` 需要大于零，那你就需要 `r₁ 大于 r₂`。所以只要 `r₁ > r₂`，你也可以反过来推。\n\n```\nr = (r₁ − r₂) / (1 + r₂)\n\n分子 r₁ − r₂ > 0  ⟺  r₁ > r₂\n分母 1 + r₂ > 0   （资料分析中 r > −100%，恒成立）\n⇒ r > 0  ⟺  比值（平均数）提高\n```\n\n**老师用「人均收入」讲的故事（板书 `人均收入 = 收入/人数`）**：\n\n> 这个东西比如说大家最关心的收入问题，人均收入不是等于总收入除以人数吗？\n> 跟你说今年好，总的收入增长了 20% —— 我们在年会上报这个数据，很高兴，鼓掌，开心！今年的利润达到百分之二十了，开心吧。\n> 好，然后领导说，你别高兴得太早，虽然我们今年总收入增加了，但是今天我们招聘了很多编外、招聘了很多其他员工帮我们干活了，所以来平摊这个收入的人也变了。那心情一下就荡下去了 —— 跟我分钱的人分多了，是不是？这些人变多了怎么办好？那就关心这个人数他涨了多少嘛。\n\n板书（画面原样）：\n\n```\n人均收入 =  收入 +20%\n          ─────────────\n            人数 +10%        （画面用红圈圈出 +20% 与 +10%）\n```\n\n| 情形 | 人均收入变化 | 板书/原话 |\n| --- | --- | --- |\n| 收入 +20%，人数 +10%（分子>分母） | **提高** | 「因为你总收入的增速比人均的增速要快。虽然说人多了，但是我们今年总收入还是涨得更多，那还好，是不是我的人均收入还是可以提高的」 |\n| 收入 +20%，人数 +20%（分子=分母） | **不变** | 「那里白高兴一场，收入变高了，但人数也变多了，多的比例还是一样的，你平摊到每个人身上，这个钱是不是还是一样」 |\n| 收入 +20%，人数 +50%（分子\u003c分母） | **降低** | 「那完蛋，今天这里不就少了 —— 僧多粥少，来分这个东西的人（多），那你每个人这个钱是不是就少了呀」 |\n\n> ⭐ 这跟我们除法（的平均数增长率）说就一样的道理：**值（比值）不变，那你分子跟分母它就应该保持一个相同的（增速），上下多涨百分之二十，（比值）是不变的；涨了百分之（五十），分子只涨了百分之二十，那你分子是不是涨少了？**\n\n> 又有人问，这个 `1 + r` 会不会小于零？不会啊，我刚发了起码 20 秒的解释 —— 为什么不会？在资料分析里面你看不到，你不可能遇到这样的增速，没有这样的增速。我们讨论的全是正的值，负多少从正的变成负的，然后出现一个什么负的百分之多少的增速没有，他就不存在这种负 100% 多的增速。\n\n**「一正一负时变高/变低」的方向总结表**：\n\n| 场景 | 用哪条公式 | 方向 |\n| --- | --- | --- |\n| **乘积增长率**（`A = B × C`） | `r = r₁ + r₂ + r₁ × r₂` | 同正同负 → 提高；一正一负 → 降低 |\n| **平均数增长率**（`A = B ÷ C`） | `r = (r₁ − r₂) / (1 + r₂)` | 分母（`1 + r₂`）小于 1（即 r₂ 为负）→ 结果变高；分母大于 1（r₂ 为正）→ 结果变小 |\n\n> ⭐ **不要混：一正一负「降低」说的是乘积增长率；平均数增长率变大变小，你看的是分母。**\n\n---\n\n## 十二、本讲知识点总表\n\n| 序号 | 知识点 | 核心公式 / 结论 | 关键提醒 |\n| --- | --- | --- | --- |\n| 1 | 倍数与增速互化 | `倍数 = 1 + 增速` | 「增长 1.05 倍」倍数就是 2.05；求完倍数必须减 1 |\n| 2 | 增速的累积（间隔增长率） | `r = r₁ + r₂ + r₁ × r₂` | 运算顺序：**先加后乘** |\n| 3 | 增速的拆分（间隔反推） | `1 + r₂ = (1 + r) ÷ (1 + r₁)` | 与累积互为逆运算 |\n| 4 | 乘积增长率 | `A = B × C` 型 | 与增速累积公式完全相同 |\n| 5 | 平均数增长率 | `r = (r₁ − r₂) / (1 + r₂)` | `A = B ÷ C` 型；`r₁` 是分子增速，`r₂` 是分母增速 |\n| 6 | 同正同负 | `r₁ × r₂ > 0` → 结果比 `r₁ + r₂` **提高** | 「提高」不是「放大」，指数值方向 |\n| 7 | 一正一负 | `r₁ × r₂ \u003c 0` → 结果比 `r₁ + r₂` **降低** | 只适用于**乘积增长率** |\n| 8 | 小增速忽略 | `r ≈ r₁ + r₂`，乘积项只看正负 | 增速很小则影响很小 |\n| 9 | 低增速累积估算 | `a% 与 b% 累积 = a + b + (a×b)/100` | **不管百分号，最后整体套%** |\n| 10 | 高增速累积估算 | 百化分（1/2、1/3、1/4）或倍化（120% → 1.2 倍） | 25%×28% 不硬乘 |\n| 11 | 收窄 | 负增速绝对值变小，离 0 更近 | 上年增速 = −(今年降幅 + 收窄百分点) |\n| 12 | 回落 | 单纯的从上往下（正→负、大→小） | 上年增速 = 今年增速 + 回落百分点 |\n| 13 | 拆分转化 | `(r₁−r₂)/(1+r₂)` 看成「现期 ÷ (1 + r) = 基期」 | 套用三板斧 |\n| 14 | 拆分速算三选一 | `r₂ ≤ 10%` 化除为乘；靠近百化分用份数思想；`1 + r₂` 较大用放缩 | 画面板书原文 |\n| 15 | 化除为乘 | `现期/(1+r) ≈ 现期 × (1 − r)` | `r \u003c 10%` 时误差不超过 1% |\n| 16 | **提前修正** | 用 `1 − 5%` 而非 `1 − 5.2%` 做修正 | 避免重复计算，误差可控 |\n| 17 | 做差只看高低 | 永远拿**大数减小数**，先定方向再定数值 | 负号最后整体还给结果 |\n| 18 | 负增速分母 | 分母 `1 + r₂ \u003c 1` → 平均数增长率结果变高 | 与乘积增长率的「一正一负降低」区分 |\n| 19 | 比值变化关系 | `r₁ > r₂` ⟺ 比值提高；`r₁ = r₂` ⟺ 不变；`r₁ \u003c r₂` ⟺ 降低 | `1 + r₂` 恒大于 0 |\n| 20 | 「后÷前」口诀 | 平均每平方米产量、人均收入、平均每人得分 | 拿后面的除前面的 |\n\n---\n\n## 十三、速算口诀与解题流程\n\n### 13.1 三条口诀\n\n```\n【口诀一】增速累积：先加，再乘\n   r = r₁ + r₂ + r₁ × r₂\n   加是最重要的，乘积项小、影响小\n\n【口诀二】同正同负提高，一正一负降低\n   （这是「乘积增长率」的方向判断）\n\n【口诀三】平均数增长率看分母\n   分母 1 + r₂ 小于 1（r₂ 为负）→ 结果变高\n   分母 1 + r₂ 大于 1（r₂ 为正）→ 结果变小\n```\n\n```\n【口诀四】后÷前\n   平均每平方米产量 = 产量 ÷ 面积\n   人均收入 = 收入 ÷ 人数\n   平均每人得分 = 得分 ÷ 人数\n```\n\n### 13.2 增速累积题的解题流程\n\n```\n第 1 步  识别：是「A = B × C」型 / 问「与某年相比」的跨期增长\n第 2 步  定位：找出 r₁、r₂（注意「增长几倍」要换算成倍数）\n第 3 步  先加：算出 r₁ + r₂（运算顺序第一优先）\n第 4 步  定性：同正同负 → 往上取；一正一负 → 往下取；\n               有一个很小 → 乘积可忽略，只看正负\n第 5 步  定量（定性选不出时才做）：\n         低增速 → 数值相加 + 数值相乘 ÷ 100\n         中高增速 → 找百化分估\n         高增速 → 按倍数（1.2 倍）放大\n第 6 步  整体套一个百分号，核对选项\n```\n\n### 13.3 平均数增长率（拆分）题的解题流程\n\n```\n第 1 步  识别：问「平均」「人均」「每件」「单位面积」「亩产」等平均数的增速\n第 2 步  列关系：平均数 = 分子 ÷ 分母（用「后÷前」口诀定谁除谁）\n第 3 步  先做差：r₁ − r₂，只看高低位置，永远拿大数减小数，方向最后补\n第 4 步  定性：分子增速 > 分母增速 → 上升；反之下降\n               再结合分母正负，判断结果是变大还是变小\n第 5 步  定量（除以 1 + r₂），三选一：\n         ① r₂ ≤ 10%           → 化除为乘：× (1 − r)\n         ② r₂ 靠近百化分       → 份数思想：÷(1 − 1/n) → 加自身 1/(n−1)\n         ③ 1 + r₂ 较大不靠近   → 粗略放缩（÷8、÷9、÷7 等）\n         ④ 分式靠近 1 或 2     → 反向计算，把「1」先提出来\n第 6 步  括号里的百分号不用管，最后整体套回\n```\n\n### 13.4 「除以 (1 − 1/n)」的份数换算表（本讲高频）\n\n| 增速 r₂ | 写成分数 | `1 + r₂` | 换算关系 |\n| --- | --- | --- | --- |\n| −1/8 = −12.5% | −1/8 | 7/8 | 增加量 = 现期的 `1/7` |\n| −1/6 ≈ −16.7% | −1/6 | 5/6 | 增加量 = 现期的 `1/5` |\n| −1/5 = −20% | −1/5 | 4/5 | 增加量 = 现期的 `1/4` |\n| −1/4 = −25% | −1/4 | 3/4 | 增加量 = 现期的 `1/3` |\n| +1/9 ≈ +11.1% | 1/9 | 10/9 | 减少量 = 现期的 `1/10`（画面：16.2% 减 1.6%） |\n| +1/3 ≈ +33.3% | 1/3 | 4/3 | 减少量 = 现期的 `1/4` |\n\n> 为啥是七分之一？因为这增速是负的八分之一啊！八份减了一份变成（七份）……\n\n---\n\n## 十四、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 正确做法 | 出处 |\n| --- | --- | --- | --- |\n| 1 | 把「增长 1.05 倍」当成增速 105% | 倍数是 `1 + 1.05 = 2.05` | 第 1 题 |\n| 2 | 求出倍数后忘了减 1 | `0.6 倍 → 增速 −40%` | 第 1 题 |\n| 3 | 搞不清「单位面积产量」谁除谁 | 「后÷前」：产量 ÷ 面积 | 第 2 题、口诀 |\n| 4 | 看到 `0.7% ÷ 0.971` 就以为能到 5.1% | 变大极微小，会被四舍五入抹掉 | 第 2 题 |\n| 5 | 增速累积漏掉乘积项 `r₁ × r₂` | 先加后乘 | 第 3 题 |\n| 6 | 直接把 `8.53 + 8.53×?` 写错小数点 | **不管百分号，数值相乘 ÷ 100，最后整体套%** | 第 3 题 |\n| 7 | 「收窄」方向搞反 | 收窄 = 绝对值变小、离 0 更近；上年降幅 = 今年降幅 + 收窄百分点 | 第 4 题 |\n| 8 | 把「回落」当成降幅扩大 | 回落 = 从上往下；**上加回落**得上年增速（−15.5 + 16.6 = +1.1） | 第 7 题 |\n| 9 | 一正一负时忘了结果要**更低** | `−21.1%` 实际要降到 `−22.2%` | 第 5 题 |\n| 10 | 一正一负时选了个「更低得不合理」的选项 | 看选项差距，`−27%` 明显过头 | 第 5 题 |\n| 11 | 把「一正一负升高降低」误用到平均数增长率 | 乘积增长率看**乘积项正负**；平均数增长率看**分母** | 第 8 题、澄清段 |\n| 12 | 分子分母定位颠倒（谁当 r₁、谁当 r₂） | 先写清「平均数 = 谁 ÷ 谁」 | 第 9 题 |\n| 13 | 时间陷阱：问「前三季度」却用了「全年」数据 | 材料给「全年比前三季度提高 X 个百分点」→ **要减回去** | 第 6 题 |\n| 14 | 做差时被负号搞乱 | **先不管负号，看绝对值；先定高低方向，最后整体还给它** | 练习 5、6、8 |\n| 15 | 化除为乘时不修正、直接用原增速 | `1 + 5.2%` 写成 `×(1 − 5%)`（**提前修正**） | 第 6 题 |\n| 16 | 分式精度追求过高 | **平均数增长率没有精算题**，估到 14.5/14.7 即可 | 多处 |\n| 17 | 小增速时死算乘积 | 增速很小 → 影响很小，随便估（5 × 4 = 20 即可） | 练习第 4 组 |\n| 18 | 高增速时硬乘（25 × 28） | 换成百化分（1/4）× 28，或按 1.2 倍放大 | 练习第 2、10 组 |\n| 19 | 「亩产」只认「产量÷面积」 | 也可认「产值÷单价」，用题目给的数据口径 | 第 10 题 |\n| 20 | 两个增速差 0.2 个百分点就以为「没差别」 | 只要分子增速 > 分母增速，比值就是提高 | 第 10 题 |\n\n---\n\n## 十五、老师金句\n\n> ⭐ **它只是数字的一个运算关系，它跟它的具体的概念是什么是没有关系的。** 它不管是什么概念，你只要是 `a = b × c`，就都能用乘积增长率；只要是 `a = b ÷ c`，就都可以用平均增长率。\n\n> ⭐ **这个加是最重要的，乘的东西相对来说比较小，影响比较小。**\n\n> ⭐ **我能通过定性把这个选项选出来的，我就不要去算它的量了。**\n\n> ⭐ **我这边说的不是放大，不是说变大，是提高** —— 因为他这个不是什么绝对值的大小，是他这个量在提高。\n\n> ⭐ **你今天吃了一个涨停板 10%，明天又吃了一个涨停板 10%，那你合起来难道你只涨到 20% 吗？不对啊，你会涨 21%。**\n> ⭐ **你哪怕就是吃十个跌停，你也不可能跌成零的，它始终会给你保留一点。**\n\n> ⭐ **不用去管这个百分号** —— 先加起来，加上它俩相乘除以百，然后整体再给它套一个百分号就行了。\n\n> ⭐ **它的增速很小，它的影响就很小，随便估。你不要本末倒置。**\n\n> 什么「均前母后」？你自己想 —— 人均收入不是要收入除以人数吗？**不要被带歪**。就是拿后面的除前面的。\n\n> 这个叫**提前修正** —— 你如果直接把这个 1.8% 乘以 5.2%，那么它这个结果会偏高 5.2%；那我们就把这个 5.2% 提前在增速上正好给它调下去了。**误差我们都搞得是一清二楚的，这样子你就计算上去特别踏实。**\n\n> ⭐ **平均数增长率没有精算题。** 使用到平均数增长率的题目也不是精算题。\n\n> ⭐ **不用总去想什么谁减谁，你看那个高低差距** —— 谁高谁在上面，所以肯定是高的减低，减下来肯定是个正数。\n\n> ⭐ **如果你这个分式它比较靠近一个整数了、靠近 1 了、靠近 2 了，你可以先把这个一给它去掉，先把这个一给它提出来。**\n\n> ⭐ **不要混：一正一负「降低」说的是乘积增长率**，平均数增长率变大变小，你看的是**分母**。\n\n> 领导说你别高兴得太早，虽然我们今年总收入增加了，但是今天我们招聘了很多编外…… 那心情一下就荡下去了 —— **跟我分钱的人分多了**。\n> 更悲观一点，钱涨了百分之二十，结果人涨了百分之五十 —— 那完蛋，**僧多粥少**。\n\n> ⭐ **我们讨论的全是正的值**，我们去年赚一百块，今年赚八十块，就是个负的百分之二十；不可能说我去年赚一百、今年亏二十，让你去算这个增速的。所以在资料分析里面你看不到（`1 + r \u003c 0` 的增速）。\n\n> ⭐ **观察能出来的东西肯定是最好的。**\n\n> 你要胆子大一点 —— 直接就 `42` 走了。\n\n---\n\n> 📌 **本集为「第 5 课 增速的累积与拆分」中篇**，重点在**简化计算**；上篇（P11）建立公式体系，下篇（P13）将进一步讲平均数增长率的实际应用。\n","outline":[{"level":2,"text":"零、本集画面地图（网格 ↔ 内容对照）","id":"零本集画面地图网格-内容对照"},{"level":2,"text":"一、承接上集：倍数关系与增速关系的互化","id":"一承接上集倍数关系与增速关系的互化"},{"level":2,"text":"二、平均数增长率：谁除以谁（「后÷前」口诀）","id":"二平均数增长率谁除以谁后前口诀"},{"level":2,"text":"三、简化计算：三重取巧思路","id":"三简化计算三重取巧思路"},{"level":2,"text":"四、增速累积的定性判断（先定性，再定量）","id":"四增速累积的定性判断先定性再定量"},{"level":3,"text":"4.1 结论一：r₁、r₂ 同正负 → 结果比 r₁ + r₂ 提高","id":"41-结论一rr-同正负-结果比-r-r-提高"},{"level":3,"text":"4.2 结论二：r₁、r₂ 一正一负 → 结果比 r₁ + r₂ 降低","id":"42-结论二rr-一正一负-结果比-r-r-降低"},{"level":3,"text":"4.3 结论三：其中一个增速很小时 → 乘积项几乎可忽略","id":"43-结论三其中一个增速很小时-乘积项几乎可忽略"},{"level":3,"text":"4.4 老师用的「涨停板」比喻","id":"44-老师用的涨停板比喻"},{"level":2,"text":"五、低增速累积估算方式（含提前修正的雏形）","id":"五低增速累积估算方式含提前修正的雏形"},{"level":2,"text":"六、高增速累积：倍化与百化分两种思路","id":"六高增速累积倍化与百化分两种思路"},{"level":2,"text":"七、「收窄」与「回落」的概念辨析","id":"七收窄与回落的概念辨析"},{"level":2,"text":"八、增速拆分的计算模式（平均数增长率的估算）","id":"八增速拆分的计算模式平均数增长率的估算"},{"level":3,"text":"8.1 核心转化：把 (r₁−r₂)/(1+r₂) 看成「现期 ÷ (1 + r)」","id":"81-核心转化把-rr1r-看成现期-1-r"},{"level":3,"text":"8.2 三个口头演示（画面数值）","id":"82-三个口头演示画面数值"},{"level":3,"text":"8.3 「化除为乘」的由来","id":"83-化除为乘的由来"},{"level":3,"text":"8.4 ⭐ 关键细节：提前修正","id":"84-关键细节提前修正"},{"level":3,"text":"8.5 一正一负时「变大/变小」看分母（重要澄清）","id":"85-一正一负时变大变小看分母重要澄清"},{"level":2,"text":"九、例题精讲","id":"九例题精讲"},{"level":3,"text":"第 1 题｜2021 年 1-2 月全国商品房销售面积（间隔倍数反推）","id":"第-1-题2021-年-1-2-月全国商品房销售面积间隔倍数反推"},{"level":3,"text":"第 2 题｜2014 年全国棉花单位面积产量（平均数增长率）","id":"第-2-题2014-年全国棉花单位面积产量平均数增长率"},{"level":3,"text":"第 3 题｜2014 年国家下拨农村义务教育经费（低增速累积）","id":"第-3-题2014-年国家下拨农村义务教育经费低增速累积"},{"level":3,"text":"第 4 题｜2016 年东北地区民间固定资产投资（降幅收窄）","id":"第-4-题2016-年东北地区民间固定资产投资降幅收窄"},{"level":3,"text":"第 5 题｜2019 年 1-8 月房地产开发企业土地成交额（乘积增长率）","id":"第-5-题2019-年-1-8-月房地产开发企业土地成交额乘积增长率"},{"level":3,"text":"第 6 题｜2017 年 A 省平均每人次客运旅客运输距离（平均数增长率）","id":"第-6-题2017-年-a-省平均每人次客运旅客运输距离平均数增长率"},{"level":3,"text":"第 7 题｜2023 年 1-7 月规上工业企业利润总额（小增速忽略乘积）","id":"第-7-题2023-年-1-7-月规上工业企业利润总额小增速忽略乘积"},{"level":3,"text":"第 8 题｜2014 年某区第三产业平均每名从业人员创造利润","id":"第-8-题2014-年某区第三产业平均每名从业人员创造利润"},{"level":3,"text":"第 9 题｜2018 年上半年快递业务平均每件收入","id":"第-9-题2018-年上半年快递业务平均每件收入"},{"level":3,"text":"第 10 题｜2020 年 H 省秋粮玉米和稻谷亩产","id":"第-10-题2020-年-h-省秋粮玉米和稻谷亩产"},{"level":2,"text":"十、课堂练习：两组 r₁/r₂ 快速估算表","id":"十课堂练习两组-rr-快速估算表"},{"level":3,"text":"10.1 第一组：增速的累积—练习（画面 10 组）","id":"101-第一组增速的累积练习画面-10-组"},{"level":3,"text":"10.2 第二组：增速的拆分—练习（画面 10 组）","id":"102-第二组增速的拆分练习画面-10-组"},{"level":2,"text":"十一、比值变化关系（平均数升降的判断）","id":"十一比值变化关系平均数升降的判断"},{"level":2,"text":"十二、本讲知识点总表","id":"十二本讲知识点总表"},{"level":2,"text":"十三、速算口诀与解题流程","id":"十三速算口诀与解题流程"},{"level":3,"text":"13.1 三条口诀","id":"131-三条口诀"},{"level":3,"text":"13.2 增速累积题的解题流程","id":"132-增速累积题的解题流程"},{"level":3,"text":"13.3 平均数增长率（拆分）题的解题流程","id":"133-平均数增长率拆分题的解题流程"},{"level":3,"text":"13.4 「除以 (1 − 1/n)」的份数换算表（本讲高频）","id":"134-除以-1-1n的份数换算表本讲高频"},{"level":2,"text":"十四、易错点与陷阱清单","id":"十四易错点与陷阱清单"},{"level":2,"text":"十五、老师金句","id":"十五老师金句"}]},{"id":"P13","title":"增速的累积与拆分（下）","full":"第5课 增速的累积与拆分（下）","lect":"","dur":"18:56","sec":1136,"theme":"增速的累积与拆分（下）——比值变化的实战应用（亩产/占比）＋\"环比的同比变化\"新考法＋第五课全课总结","url":"https://www.bilibili.com/video/BV15bGA6PEJL?p=13","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 13 集\n\n# 第5课 增速的累积与拆分（下）\n\n> **课程信息**\n> - 课程名称：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> - 本集位置：合集第 13 集（共 21 集）\n> - 视频地址：`https://www.bilibili.com/video/BV15bGA6PEJL?p=13`\n> - 时长：约 18 分 56 秒\n> - 本集主题：**增速的累积与拆分（下）——比值变化的实战应用（亩产/占比）＋\"环比的同比变化\"新考法＋第五课全课总结**\n> - 承接关系：本集是「增速的累积与拆分」的下篇，P11 为（上）、P12 为（中），三集合为一课\n\n---\n\n## 目录\n\n- [一、本集定位：从\"比值变化\"公式到实战](#一本集定位从比值变化公式到实战)\n- [二、比值变化在\"亩产\"题型中的应用](#二比值变化在亩产题型中的应用)\n  - [例题 1｜2020 年 H 省秋粮玉米和稻谷（亩产与上年相比）](#例题-12020-年-h-省秋粮玉米和稻谷亩产与上年相比)\n- [三、比值变化在\"占比\"题型中的应用](#三比值变化在占比题型中的应用)\n  - [例题 2｜2021 年前三季度文化及相关产业企业（占比提高的行业个数）](#例题-22021-年前三季度文化及相关产业企业占比提高的行业个数)\n- [四、\"环比的同比变化\"——冷门但重要的新考法](#四环比的同比变化冷门但重要的新考法)\n  - [4.1 题型长什么样](#41-题型长什么样)\n  - [4.2 核心推导：给\"环比增速\"加个 1，就变成比值](#42-核心推导给环比增速加个-1就变成比值)\n  - [4.3 数值验证（老师口述例子）](#43-数值验证老师口述例子)\n  - [4.4 三条判定结论（板书原文）](#44-三条判定结论板书原文)\n  - [例题 3｜2018 年 4—12 月接待入境游客次数（环比增速低于上年同期的月份数）](#例题-32018-年-412-月接待入境游客次数环比增速低于上年同期的月份数)\n  - [例题 4｜2016 年 3—12 月江苏规模以上光伏产业产值（环比增速低于上年同期的月份数）](#例题-42016-年-312-月江苏规模以上光伏产业产值环比增速低于上年同期的月份数)\n- [五、第五课总结（板书总结页原文）](#五第五课总结板书总结页原文)\n- [六、本讲知识点总表](#六本讲知识点总表)\n- [七、速算口诀与解题流程](#七速算口诀与解题流程)\n- [八、易错点与陷阱清单](#八易错点与陷阱清单)\n- [九、老师金句](#九老师金句)\n\n---\n\n## 一、本集定位：从\"比值变化\"公式到实战\n\n本集开头承接上一集（P12）的\"比值变化\"原理，继续用 **2020 年 H 省秋粮玉米和稻谷** 的材料，把\"分子增速 vs 分母增速\"的判定法落到具体的\"亩产\"概念上。\n\n> ⭐ **老师原话**：\"限期比值跟基期比值之间的关系，抓准它分子分母的增速大小关系就可以了。\"\n\n**比值变化判定法（本课反复使用的总纲）**\n\n```\n若 A 的增速 > B 的增速  →  比值 A/B 提高\n若 A 的增速 \u003c B 的增速  →  比值 A/B 降低\n若 A 的增速 = B 的增速  →  比值 A/B 不变\n```\n\n> **老师的通俗解释**\n> \"我今天有个东西是 a，还有个东西是 b。如果 a 的增速比 b 的增速高，a 跟 b（的比值）是不是就提高？\"\n> \"我再问你 a 除以 b 减一，大家都是固定减一，是不是也会提高？\"\n\n**老师给出的两条\"同源\"提醒**\n\n| 说法 | 内容 |\n| --- | --- |\n| 增速与倍数的关系 | 增速就是倍数减一，倍数就是增速加一 |\n| 一体化结论 | 增速跟倍数是**一体**的，增速跟比值关系也是**一体**的：比值提高，增速也提高；比值降低，增速也降低 |\n\n---\n\n## 二、比值变化在\"亩产\"题型中的应用\n\n### 概念铺垫：亩产、亩产值、单价三者的换算（板书）\n\n老师在黑板右上角画出的三量关系（板书原文）：\n\n```\n亩产 = 亩产值 / 单价\n\n亩产 = (元/亩) ÷ (元/公斤) = 公斤/亩\n```\n\n推导链（板书）：\n\n```\n元/亩\n────────  =  元/公斤  ⇒  亩产 = 亩产值 ÷ 单价\n元/公斤\n```\n\n以及等价形式（板书）：\n\n```\n亩产 = 产量 / 面积            （亩产的定义式）\n亩产值 = 亩产 × 单价\n```\n\n> ⭐ **老师原话（\"过日子\"讲法）**\n> \"什么叫亩产值？我一亩地卖多少钱？什么单价是我一公斤卖多少钱？那我怎么算出来这个一亩卖多少钱？那是不是要看你这一亩有多少的产量？拿你的一亩多少的产量去乘以你的单价，你才能把这个一亩的产量转化成钱，对不对？\"\n> \"你一亩种了 100 公斤，100 公斤/亩，然后这每公斤能有多少的钱？这样一乘就是每亩的产值。\"\n> \"所以就是**亩产等于亩产值除以单价，亩产值等于亩产乘以单价**。\"\n> \"哎，以前没跟家里面去卖过稻子吗？一亩产了八百斤，一斤两块钱。一亩的 800 斤乘以 1 斤 2 块钱，那一亩就是 1600，这不就是每亩的产值吗？\"\n\n**⚠️ 老师对 PPT 的更正（重要提醒）**\n\n> ⭐ **老师原话**：\"不是，我这个地方是少了一个符号，我在你看讲义上是这么写的，讲义上是直接把谁除谁写给你的。我这边是少了个符号，因为我把它转换成分数的形式。\"\n> \"什么讲义要改一下——讲义上是对的，是我把那个复制到这个 PPT 上来的时候少了一个符号，少了个除的符号。**PPT 错的，PPT 这个两个公式错的。**\"\n\n> 📌 笔记附注：板书中\"亩产 = 亩产值 ÷ 单价\"这一关系在板书里以**分数形式**呈现，PPT 上因漏掉除号显示为连乘形式。**以讲义为准，正确关系是\"亩产 = 亩产值 ÷ 单价\"**。\n\n---\n\n### 例题 1｜2020 年 H 省秋粮玉米和稻谷（亩产与上年相比）\n\n#### 【题干原文】\n\n> 2020 年，H 省秋粮玉米和稻谷的市场平均交易价格分别为 2.34 元/公斤和 2.74 元/公斤，分别比上年上涨 28.6% 和 8.7%。按此价格测算，2020 年全省农户种植玉米、稻谷扣除成本前的产值分别为 957.1 元/亩、1520.7 元/亩，分别比上年增长 33.4%、8.9%。\n>\n> 2020 年，H 省秋粮玉米和稻谷的亩产（每亩产值平均交易价格）与上年相比：\n> A. 仅稻谷亩产高于上年水平\n> B. 仅玉米亩产高于上年水平\n> C. 两者亩产均高于上年水平\n> D. 两者亩产均低于上年水平\n\n（板书标题：**比值的变化**；题干关键词被老师圈出：\"市场平均交易价格\"\"产值\"\"亩产（每亩产值平均交易价格）\"）\n\n#### 【材料数据】\n\n| 品种 | 市场平均交易价格（元/公斤） | 价格比上年上涨 | 扣除成本前产值（元/亩） | 产值比上年增长 |\n| --- | --- | --- | --- | --- |\n| 玉米 | 2.34 | 28.6% | 957.1 | 33.4% |\n| 稻谷 | 2.74 | 8.7% | 1520.7 | 8.9% |\n\n#### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 比值（平均数）变化判定——判断\"亩产\"比上年提高还是降低 |\n| 概念转换 | 亩产 = 亩产值 ÷ 单价。把\"亩产\"看成比值 `A/B`，其中 A = 亩产值，B = 单价 |\n| 定位数据 | 分子 A（亩产值）的增速、分母 B（单价）的增速 |\n| 判定规则 | 分子增速 > 分母增速 ⇒ 比值（亩产）提高 |\n| 速算步骤 | 玉米：33.4% > 28.6%；稻谷：8.9% > 8.7% |\n| 结论 | 玉米亩产提高，稻谷亩产提高 ⇒ 两者均高于上年水平 |\n\n**老师的判读过程（板书数字）**\n\n```\n玉米：分子增速 33.4%   >   分母增速 28.6%   ⇒ 亩产提高\n稻谷：分子增速  8.9%   >   分母增速  8.7%   ⇒ 亩产提高\n```\n\n> ⭐ **老师原话**\n> \"好，然后我们来看一下，现在就要看什么，看这个玉米的产值的增速和平均价格的增速对不对？玉米，产值在这儿，增速是 33.4，平均价格增速是 28.6%。然后那我现在要算它的增速是多少——我只是要判断它是提高还是降低，我们就只要看分子增速和分母增速的大小关系。只要分子增速比分母增速高，那么它这个平均数就是提高，所以玉米是提高。\"\n> \"好，那么再看谁还剩一个稻谷，它的每亩产值的增速是 8.9，它的平均交易价格的增速是 8.7。它的分子增速还是比分母的增速要高，所以它的平均价格也一样会提高，所以这**两个都高于上年水平**。\"\n> \"没有那么绕的——就什么产值每亩多少产值，就是你一亩能卖多少钱。这边给的是单价，这边问的是每亩的产量，也不就是每亩产多少乘这个单价能算每亩的多少钱吗？\"\n\n#### 【选项原文】\n\n> A. 仅稻谷亩产高于上年水平\n> B. 仅玉米亩产高于上年水平\n> C. 两者亩产均高于上年水平\n> D. 两者亩产均低于上年水平\n\n#### 【答案】\n\n✅ **C（两者亩产均高于上年水平）**\n\n#### 【解析】\n\n- **A 项错误**：漏掉了玉米。玉米的亩产值增速 33.4% 明显高于其价格增速 28.6%，玉米亩产同样在提高，\"仅稻谷\"的范围表述不成立（**范围陷阱**）。\n- **B 项错误**：漏掉了稻谷。稻谷亩产值增速 8.9% 高于价格增速 8.7%，稻谷亩产也在提高，\"仅玉米\"不成立（**范围陷阱**）。\n- **D 项错误**：方向完全相反。两项的分子增速都大于分母增速，均值只会提高，不会降低（**方向陷阱**）。\n- **C 项正确**：玉米 33.4% > 28.6%、稻谷 8.9% > 8.7%，两者的\"分子增速 > 分母增速\"都成立，故两者亩产均高于上年水平。\n- **陷阱类型**：本题最大的坑不是算，而是**\"概念转换\"**——必须先把\"亩产\"还原为 `亩产值/单价` 这个比值关系，才能用分子分母增速比对；若不转换概念去硬算亩产，计算量会急剧膨胀。\n\n---\n\n## 三、比值变化在\"占比\"题型中的应用\n\n### 题型原理：比重提高 ⟺ 部分增速 > 总体增速\n\n老师说：\"跟上一年相比，这些行业类别里面有多少个行业，它占总的营业总收入的比重在提高。那这个比重它是什么比重？它不也是个分式吗？\"\n\n```\n某行业占比 = 该行业收入 / 全国营业总收入\n           = R1 / R2\n```\n\n判定（板书原文）：\n\n```\n（行业收入 R₁）/（总收入 R₂）\n        ↓\n      R₁ > R₂     ⇒ 占比提高\n```\n\n> ⭐ **老师原话**\n> \"怎么算一个东西占这个总数的比重，就是要这个行业的收入除以整个的总收入，对不对？在全国这么多的总收入里面，我们行业有多少？这是个占比吧。\"\n> \"好，这样我需要什么？需要这个占比增加要提高，那我就需要什么？我就需要我们行业收入的增速，就这个 R₁，要比这个总收的增速 R₂ 要高才行。\"\n> \"那这个行业类别里面这么多个行业，我要一个个比过去吗？你可能先把这个固定的总收入增速找到，固定的这个总的这 6.4 万家企业营业收入增速是 21.8%。所以你只要在这个行业里面能找到增速比这个百分之二十一点八高的就可以了。\"\n\n> 💡 **省力技巧**：**总体增速只算一次**，然后拿它当\"及格线\"，逐行扫一眼各行业增速即可，不必逐个求比重。\n\n---\n\n### 例题 2｜2021 年前三季度文化及相关产业企业（占比提高的行业个数）\n\n#### 【题干原文】\n\n> 据对全国 6.4 万家规模以上文化及相关产业企业调查，2021 年前三季度，上述企业实现营业收入 84205 亿元，按可比口径计算，同比增长 21.8%；两年平均增长 10.0%。\n>\n> 分行业类别营业收入情况：新闻信息服务 9847 亿元，同比增长 22.1%；内容创作生产 17693 亿元，同比增长 18.6%；创意设计服务 13787 亿元，同比增长 24.0%；文化传播渠道 9309 亿元，同比增长 30.1%；文化投资运营 359 亿元，同比增长 13.8%；文化娱乐休闲服务 916 亿元，同比增长 35.3%；文化辅助生产和中介服务 11441 亿元，同比增长 18.3%；文化装备生产 4880 亿元，同比增长 17.8%；文化消费终端生产 15974 亿元，同比增长 22.0%。\n>\n> 与上一年相比，2021 年前三季度分行业类别中，占全国 6.4 万家规模以上文化及相关产业企业营业总收入比重增加的行业个数是：（ ）\n> A. 3 个　　B. 4 个　　C. 5 个　　D. 6 个\n\n（板书标题：**比值的变化**；题干被圈出的关键词：\"与上一年相比\"\"占全国 6.4 万家规模以上文化及相关产业企业营业总收入比重增加\"）\n\n#### 【材料数据】\n\n**总体（分母）**\n\n| 指标 | 数值 |\n| --- | --- |\n| 全国规模以上文化及相关产业企业数 | 6.4 万家 |\n| 2021 年前三季度营业收入 | 84205 亿元 |\n| 同比增长（可比口径） | 21.8% |\n| 两年平均增长 | 10.0% |\n\n**分行业类别（9 个行业）**\n\n| 序号 | 行业类别 | 营业收入（亿元） | 同比增长 | 是否高于总体 21.8% |\n| --- | --- | --- | --- | --- |\n| 1 | 新闻信息服务 | 9847 | 22.1% | ✅ 高于 |\n| 2 | 内容创作生产 | 17693 | 18.6% | ❌ 低于 |\n| 3 | 创意设计服务 | 13787 | 24.0% | ✅ 高于 |\n| 4 | 文化传播渠道 | 9309 | 30.1% | ✅ 高于 |\n| 5 | 文化投资运营 | 359 | 13.8% | ❌ 低于 |\n| 6 | 文化娱乐休闲服务 | 916 | 35.3% | ✅ 高于 |\n| 7 | 文化辅助生产和中介服务 | 11441 | 18.3% | ❌ 低于 |\n| 8 | 文化装备生产 | 4880 | 17.8% | ❌ 低于 |\n| 9 | 文化消费终端生产 | 15974 | 22.0% | ✅ 高于 |\n\n> （附注：9 个行业营业收入之和 9847+17693+13787+9309+359+916+11441+4880+15974 = 84206 ≈ 84205 亿元，与总体吻合，说明总体就是这 9 个行业之和。）\n\n#### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 比值（比重）变化判定——数出\"占比提高\"的行业个数 |\n| 概念转换 | 占比 = 行业收入 / 营业总收入，分子是该行业收入、分母是总体收入 |\n| 定位数据 | 分母（总体）增速 = 21.8%（**只取一次**） |\n| 判定规则 | 分子增速（行业增速）> 分母增速（21.8%）⇒ 该行业占比提高 |\n| 速算步骤 | 逐个行业增速与 21.8% 比大小（`22.1`✔ `18.6`✘ `24.0`✔ `30.1`✔ `13.8`✘ `35.3`✔ `18.3`✘ `17.8`✘ `22.0`✔） |\n| 计数 | 高于 21.8% 的行业：新闻信息服务、创意设计服务、文化传播渠道、文化娱乐休闲服务、文化消费终端生产 = **5 个** |\n| 结论 | 5 个 ⇒ 选 C |\n\n**老师的口算过程（逐个数）**\n\n```\n总体增速 = 21.8%（及格线）\n22.1 > 21.8  → 第 1 个\n24.0 > 21.8  → 第 2 个\n30.1 > 21.8  → 第 3 个\n35.3 > 21.8  → 第 4 个\n22.0 > 21.8  → 第 5 个\n（18.6、13.8、18.3、17.8 均低于 21.8%，不计）\n```\n\n> ⭐ **老师原话**\n> \"那这个比重它是什么比重？它不也是个分式吗？……这是个占比吧。\"\n> \"简单吧，听简单的是吧？……是不是只要比总体的增速高，那我的占比平均数就会提高。\"\n\n#### 【选项原文】\n\n> A. 3 个　　B. 4 个　　C. 5 个　　D. 6 个\n\n#### 【答案】\n\n✅ **C（5 个）**\n\n#### 【解析】\n\n- **A、B 项错误（少计）**：常见错法是漏看某个\"擦边高\"的行业。本题有 3 个行业是\"贴线高\"——新闻信息服务 22.1%、文化消费终端生产 22.0%，仅比 21.8% 高出 0.3 和 0.2 个百分点，**极易被肉眼扫掉**（**精度陷阱 / 临界值陷阱**）。\n- **D 项错误（多计）**：容易把\"文化投资运营 13.8%\"误看成\"35.8%\"或\"35.9%\"而多算一个；该行业营业收入仅 359 亿元，增速为 13.8%，**明显低于**总体 21.8%，占比是下降的（**数字误读陷阱**）。\n- **C 项正确**：22.1%、24.0%、30.1%、35.3%、22.0% 共 5 个行业增速高于总体 21.8%，占比提高。\n- **陷阱类型**：**精度/临界值陷阱**（22.0%、22.1% 与 21.8% 极度接近）＋ **干扰信息陷阱**（\"两年平均增长 10.0%\"和各单位营业收入的具体数值都是干扰项，本题完全不需要用到）。\n\n> 📌 **老师的解决思路总结**：\n> \"跟上一年相比……我就需要这个占比增加、要提高，那我就需要行业收入的增速 R₁ 要比总收的增速 R₂ 要高才行。\"\n\n---\n\n## 四、\"环比的同比变化\"——冷门但重要的新考法\n\n> ⭐ **老师原话（定调）**\n> \"再来一个，这个属于是近几年稍微冒出来一种稍微冷门一点的考法。但是我觉得这个考法你可以多理解，其实也不难，一样的。这个考法叫做**环比的同比变化**，读起来比较绕，但其实还好。\"\n\n### 4.1 题型长什么样\n\n老师口述的抽象模型：\n\n> ⭐ **老师原话**\n> \"就是比如说我给你一个数值，我告诉你今年四月份我的同比增速比如说百分之五，5 月份我的同比增速，我标一下同（比），是 10%。现在我问你，我五月份的**环比增速**他是提高了呢还是降低了呢？\"\n\n板书原文：\n\n```\n4月   r同 = 5%\n5月   r同 = 10%\n        ↓\n     r 5月环比  ↑ ？ ↓ ？\n```\n\n> **老师对考生的提醒**\n> \"有些人说记公式就好，套路题记公式确实可以。但我建议这种问题你要研究明白了，为什么？这个对你学习明天的课程有一定的帮助。\"\n> \"我怎么根据这两个同比增速，去看这个环比增速变高还是变低呢？\"\n\n### 4.2 核心推导：给\"环比增速\"加个 1，就变成比值\n\n> ⭐ **老师原话（推导的思路起点）**\n> \"我们刚刚前面学的是什么？我们前面学的是不是通过分子分母增速的大小关系去判定一个比值的增加还是降低，对不对？那这边环比增速它也不是比值呀，它是个增量除以基期，我现在有的增速是四月跟五月的比值，怎么办呢？\"\n> \"它不是比值，但是它有个亲戚跟它是个比值关系。**你能不能给它加个一？** 你是不是这个环比增速跟那个一加环比增速，他们的变大变小的情况是一样的？我只要这个一加环比增速提高，我的环比增速是不是提高？我只要这个一加环比增速降低，我的环比增速就降低，对不对？\"\n> \"那我们为什么要加一呢？**因为加一之后它才是个比值。**\"\n\n**第一步：加 1 变成\"环比倍数\"（板书原文）**\n\n```\n1 + r环比 = 5月 / 4月 = 环比倍数\n\n即：环比倍数 = 当月(r₁) / 上月(r₂)\n```\n\n**第二步：把 5 月/4 月套进\"比值变化\"框架（板书原文）**\n\n```\nA / B ，r_A > r_B  ⇒  A/B ↑\nA / B − 1        ⇒  也↑\n\n把 A 换成 5 月，B 换成 4 月：\n  A/B = 5月/4月 = 1 + r环\n  ⇒ r5月同 > r4月同  ⇒  (A/B) ↑  ⇒  r环 ↑\n```\n\n板书逐句（画面原文）：\n\n```\n       A 5月\n=  ────────\n       B 4月\n\nr 5月同 > r 4月同\n\n1 + r环 = A/B  ↑\n\nA/B − 1  ↑\n```\n\n> ⭐ **老师原话（收口）**\n> \"今天有个东西是 a，还有个东西是 b。如果 a 的增速比 b 的增速高，a 跟 b（的比值）是不是就提高？……好，我再问你 a 除以 b 减一，大家都是固定减一，是不是也会提高？\"\n> \"那我们先把 a 换成 5 月，B 换成 4 月……A 除 B 是什么？A 除 B 是不是就是一加五月的环比增速？所以**只要五月的增速比四月的同比增速要高，那么这个环比增速就会提高**。\"\n> \"增速跟倍数，它们是一体的，增速跟这个比值关系是一体的。增速就是倍数减一，倍数就是增速加一。所以你只要这个比值提高了，你的增速也会提高；比值降低了，你的增速也会降低。\"\n\n### 4.3 数值验证（老师口述例子）\n\n老师用一组具体数字来验证上面的推理（板书数字）：\n\n| 年份 | 4 月数值 | 5 月数值 | 环比倍数 | 说明 |\n| --- | --- | --- | --- | --- |\n| 24 年（2024） | 10 | 20 | `20 / 10 = 2` | 基期 |\n| 25 年（2025） | 10.5（涨 5%） | 22（涨 10%） | `22 / 10.5 ≈ 2.10` | 分子涨得快 |\n\n板书标注：`10 →(100%)→ 20`；`10.5 →(>100%)→ 22`；`环比 = 2 = 20/10`；`= (22)/10.5`\n\n> ⭐ **老师原话（逐句还原）**\n> \"比如说我举个数值的例子来解释为什么它这个环比倍数提高。去年的时候是 10……这个四月份五月的分呢，五月份的时候就去年，这是比如说二四年，5 月份的时候是 20，这是他们的环比倍数，是不是 2？\"\n> \"今年 25 年的时候，4 月份涨了 5%，变成 10.5；五月份的时候变成了 21 哦，5%、22%、22% 涨到 10%，变成 22%。他们的环比倍数是什么？就变成了 22 除以 10.5。本来是 20 除以 10 这个关系，现在……\"\n> \"分子是不是涨得快一点？22 比 20 涨了 10%。10 到 10.5 涨了 5%，所以这个环比倍数提高了。那环比倍数提高了，环比增速不就跟着提高了吗？\"\n> \"本来这个环比增速是百分之百。现在是 11.5 除以 10.5，超过 100%。对吧？22 − 10.5 是 11.5 除以 10.5，就超过 100% 了。\"\n> \"所以，只要**当月的同比增速**，就当月环比倍数的分子，比上个月的同比增速（高）……那么分子增速高于分母增速，那么他们这个比值环比倍数就在提高，环比倍数提高，那么这个环比增速也会跟着提高，因为环比增速就等于环比的这个倍数（减 1）。\"\n\n听写中的一句板书文字（画面显示为）：\n```\n基期 10.5，限期 22，增量 11.5，增速 = 11.5 / 10.5\n```\n（笔记附注：此处\"限期\"应作\"现期\"；老师讲的是环比增速的求法，即 `环比增速 = 环比增量 ÷ 上月值`。）\n\n> ⭐ **老师原话（自评）**\n> \"我感觉今年这个问题已经讲得很清楚了。\"\n\n### 4.4 三条判定结论（板书原文）\n\n幻灯片正文（画面原文，每句下方均有红线下划线）：\n\n| 情形 | 结论（板书原文） |\n| --- | --- |\n| 当月同比增速 **>** 上月同比增速 | 则当月环比倍数同比提高，**环比增速同比提高**； |\n| 当月同比增速 **\u003c** 上月同比增速 | 则当月环比倍数同比降低，**环比增速同比降低**； |\n| 当月同比增速 **=** 上月同比增速 | 则当月环比倍数同比不变，**环比增速同比不变**。 |\n\n同页公式（板书原文）：\n\n```\n环比倍数 = 当月(r₁) / 上月(r₂)\n\nr = (r₁ − r₂) / (1 + r₂)\n```\n\n> ⭐ **老师的操作口诀（口语版）**\n> \"**当月增速低于上个月的增速，那么你这个环比倍数就会降，增速也会降低。**\"\n> \"只要你当月增速低于上个月的增速，那么你这个环比倍数就会降……所以就是**去 4 月到 12 月里面去找，有几个月它的同比增速比上个月低就好了**。\"\n\n> ⚠️ **转写里的一处口误（用画面与逻辑纠正）**\n> 转写中出现\"因为这个就是降低是低于上年同期，是要它的同比增速小于 0\"——这句在逻辑上不成立（判定用的是**当月同比与上月同比的大小关系**，与\"同比是否小于 0\"无关）。同段前后老师的正确表述为：\"只要你当月增速低于上个月的增速，那么你这个环比倍数就会降，增速也会降低\"，\"就需要它的分子当月的同比增速**小于上个月的同比增速**\"。**以画面与前后一致的表述为准。**\n\n---\n\n### 例题 3｜2018 年 4—12 月接待入境游客次数（环比增速低于上年同期的月份数）\n\n#### 【题干原文】\n\n> 2018 年 4—12 月，接待入境游客次数环比增速低于上年同期的月份个数为：\n> A. 2 个　　B. 3 个　　C. 5 个　　D. 6 个\n\n（板书标题：**环比的同比变化**；图表标题：**接待入境游客情况**；题干中被老师圈出的是\"**环比增速低于上年同期**\"，并在旁边写下转化式）\n\n#### 【材料数据】\n\n图表（柱状 + 折线）：左轴\"万人次\"（接待入境游客次数，柱），右轴\"%\"（同比增速，折线）\n\n| 月份 | 12 月（2017 年） | 2018 年 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 | 12 月 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 接待入境游客次数（万人） | 28.2 | 35.6 | 42.9 | 39.7 | 35.8 | 34.3 | 34.6 | 37.7 | 40.0 | 34.9 | 25.8 |\n| 同比增速（%） | −3.5 | 1.6 | 10.0 | 3.8 | 1.5 | 0 | 7.0 | 0.3 | 6.7 | −0.3 | −8.6 |\n\n> （画面表头第 1 列标注为\"12 月\"，第 2 列为\"2018 年 3 月\"，其后依次为 4 月～12 月；故第 1 列即上年 12 月数据。）\n\n#### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | \"环比的同比变化\"——求\"环比增速低于上年同期\"的月份个数 |\n| 概念转换 | 环比增速不是比值，**不能直接比**；要看它的\"亲戚\"环比倍数 |\n| 转化式（板书） | `环比倍数 ↓  ⇒  当月同比 \u003c 上月同比` |\n| 定位数据 | 折线（同比增速）上，找\"**本月点低于上月点**\"的月份 |\n| 数点规则 | 只需看折线**是否下行**；下行即满足 |\n| 结论 | 共 **6** 个月 ⇒ 选 D |\n\n**板书的转化与计数（画面原文）**\n\n```\n环比倍数 ↓   ⇒   当月同 \u003c 上月同\n\n（在 3—12 月同比数值上数下方的月份）\n1  2  3  4  5  6\n```\n\n**逐月核对表**\n\n| 月份 | 本月同比 | 上月同比 | 大小关系 | 是否计入 |\n| --- | --- | --- | --- | --- |\n| 4 月 | 10.0 | 1.6（3 月） | 10.0 > 1.6 | ✘（提高） |\n| 5 月 | 3.8 | 10.0（4 月） | 3.8 \u003c 10.0 | ✔ 第 1 个 |\n| 6 月 | 1.5 | 3.8（5 月） | 1.5 \u003c 3.8 | ✔ 第 2 个 |\n| 7 月 | 0 | 1.5（6 月） | 0 \u003c 1.5 | ✔ 第 3 个 |\n| 8 月 | 7.0 | 0（7 月） | 7.0 > 0 | ✘（提高） |\n| 9 月 | 0.3 | 7.0（8 月） | 0.3 \u003c 7.0 | ✔ 第 4 个 |\n| 10 月 | 6.7 | 0.3（9 月） | 6.7 > 0.3 | ✘（提高） |\n| 11 月 | −0.3 | 6.7（10 月） | −0.3 \u003c 6.7 | ✔ 第 5 个 |\n| 12 月 | −8.6 | −0.3（11 月） | −8.6 \u003c −0.3 | ✔ 第 6 个 |\n\n> ⭐ **老师原话（讲解全程）**\n> \"问：18 年 4—12 月份这个环比增速低于上年同期的月份是多少个？我们不要看环比增速，我们应该看什么？因为环比增速它不是个比值，不是个直接拿当年的（值）去相除的一个比值，所以我们应该看什么？**看环比倍数**。我们是看有几个月它跟上个月的比值（环比倍数）在降低。\"\n> \"那怎么样环比倍数才是降低了呢？就需要它的分子——**当月的同比增速小于上个月的同比增速**，能明白吧？\"\n> \"可能有同学不理解，怎么又扯到同比上来了？因为这个就是……你要讨论的是他们这个上当月这个分子跟这分母这两个月，他们的同比增速有个大小关系。所以就是**只要你当月增速低于上个月的增速，那么你这个环比倍数就会降，增速也会降低**。\"\n> \"因为去 4 月、5 月里面去找 4 到 12 月这几个月，**有几个月它的同比增速比上个月低就好了**。\"\n> \"四月份是多少？是十，有没有比三月份低？没有吧，它高，十大于一点六，所以他们之间的环比增速是提高的。然后我们从图上来看，从 1.6 变成了十是提高的，所以它的环比倍数，也就是它的环比增速都会提高。\"\n> \"那相对应的怎么样才能降低？3.8 比 10 要低，同比分子的同比比分母的同比低，那么整个这个平均值这个比值、这个环比倍数也会降低，那么这个环比增速也会降低。\"\n> \"所以我们只要找什么？我们只要找在这个图上有几个月，它前面的这条线是**降低**的就可以了。一个、两个、三个、四个、五个、六个，**D 走了**。\"\n> \"一个两个三个四个五个六个，**只有这六个月**，他们当月的同比增速比上个月的同比增速低，就他们这个环比倍数的分子的增速比分母的增速低，他们这个环比倍数在降低，他们的这个环比增速在跟着降低。\"\n\n#### 【选项原文】\n\n> A. 2 个　　B. 3 个　　C. 5 个　　D. 6 个\n\n#### 【答案】\n\n✅ **D（6 个）**\n\n#### 【解析】\n\n- **A、B 项错误（少计）**：只看\"同比为负\"或\"同比下落明显\"的月份就会漏计。本题第 6、7、9、11、12 月的下跌都很平缓，尤其 6 月（1.5←3.8）、9 月（0.3←7.0）属于\"温和下行\"，容易被忽略（**观察遗漏陷阱**）。\n- **C 项错误（少计 1 个）**：容易漏掉 **12 月**。12 月同比 −8.6% \u003c 11 月同比 −0.3%，虽然两个都是负数，但**负得更多也是\"下降\"**，仍然计入（**负数比较陷阱**）。\n- **D 项正确**：5、6、7、9、11、12 月共 6 个月，当月同比增速低于上月同比增速，故环比倍数同比降低、环比增速低于上年同期。\n- **陷阱类型**：**概念陷阱**（把\"环比增速的比较\"错当成\"同比增速的比较\"）＋ **负数比较陷阱**（11 月 −0.3 → 12 月 −8.6 仍属下降）＋ **折线读图陷阱**（需看折线的方向，而非柱子的高低）。\n\n> ⚠️ **易混点提示（老师课堂反复强调）**\n> 柱状图表示的是\"接待入境游客次数\"（万人），折线表示的是\"同比增速\"（%）。**判断本题只能看折线**，柱子高低与本题无关；柱子的升降反映的是绝对量的环比变化，不是同比增速的变化。\n\n---\n\n### 例题 4｜2016 年 3—12 月江苏规模以上光伏产业产值（环比增速低于上年同期的月份数）\n\n#### 【题干原文】\n\n> 2016 年 3—12 月，江苏规模以上光伏产业产值环比增速低于上年同期的月份个数为：\n> A. 2 个　　B. 3 个　　C. 5 个　　D. 8 个\n\n（图表标题：**图 1　2016 年 2-12 月江苏规模以上光伏产业产值同比增速**；板书标题：**环比的同比变化**）\n\n#### 【材料数据】\n\n图中折线各点的数值（纵轴单位：%）\n\n| 月份（2016 年） | 2 月 | 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 | 12 月 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 同比增速（%） | 21.1 | 16.4 | 20.2 | 19.7 | 20.9 | 14.7 | 4.9 | −9.1 | −6.2 | 0.0 | 9.9 |\n\n> 图中相邻点之间被老师用红色短斜线标注出\"**下行**\"的区段，用于计数。\n\n#### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 与例题 3 同型——\"环比的同比变化\"，求月份个数 |\n| 概念转换 | 环比增速低于上年同期 ⟺ 环比倍数同比下降 ⟺ **当月同比 \u003c 上月同比** |\n| 定位数据 | 折线相邻两点的升降（从 3 月起算，需与上月即 2 月比） |\n| 数点规则 | 数折线的\"**下降段**\"个数 |\n| 结论 | 共 **5** 个月 ⇒ 选 C |\n\n**逐月核对表**\n\n| 月份 | 本月同比 | 上月同比 | 大小关系 | 是否计入 |\n| --- | --- | --- | --- | --- |\n| 3 月 | 16.4 | 21.1（2 月） | 16.4 \u003c 21.1 | ✔ 第 1 个 |\n| 4 月 | 20.2 | 16.4（3 月） | 20.2 > 16.4 | ✘（提高） |\n| 5 月 | 19.7 | 20.2（4 月） | 19.7 \u003c 20.2 | ✔ 第 2 个 |\n| 6 月 | 20.9 | 19.7（5 月） | 20.9 > 19.7 | ✘（提高） |\n| 7 月 | 14.7 | 20.9（6 月） | 14.7 \u003c 20.9 | ✔ 第 3 个 |\n| 8 月 | 4.9 | 14.7（7 月） | 4.9 \u003c 14.7 | ✔ 第 4 个 |\n| 9 月 | −9.1 | 4.9（8 月） | −9.1 \u003c 4.9 | ✔ 第 5 个 |\n| 10 月 | −6.2 | −9.1（9 月） | −6.2 > −9.1 | ✘（提高） |\n| 11 月 | 0.0 | −6.2（10 月） | 0.0 > −6.2 | ✘（提高） |\n| 12 月 | 9.9 | 0.0（11 月） | 9.9 > 0.0 | ✘（提高） |\n\n**结论**：3、5、7、8、9 月共 **5** 个。\n\n> ⭐ **老师原话**\n> \"问三到十二月有几个月它的环比增速低于上月同期，直接找什么？找这些月有几个月，他前面那条线同比增速线是**降低**的就好了，是不是？好了吧。\"\n> \"所以像下一题，知道这个关系了，懂了这个结论了，你就不会忘了，你看到这种题目就会做了。\"\n\n（老师随即进入全课总结，本题在现场以直接数折线下降段的方式收尾，答案记为 **C**。）\n\n#### 【选项原文】\n\n> A. 2 个　　B. 3 个　　C. 5 个　　D. 8 个\n\n#### 【答案】\n\n✅ **C（5 个）**\n\n#### 【解析】\n\n- **A、B 项错误（少计）**：5 月的下降幅度极小（20.2 → 19.7，仅差 0.5 个百分点），肉眼若不仔细看会直接跳过（**微小变化陷阱**）。\n- **D 项错误（多计）**：错法的典型来源是把\"折线上每一个局部低谷\"都算进去，或把 10 月、11 月、12 月的**回升段**误当作\"低于上年同期\"（**方向误判陷阱**）。其中 10 月（−6.2 高于 9 月 −9.1）、11 月（0.0 高于 −6.2）都是在**从负值往上走**，属于\"提高\"而**不计入**（**负数比较陷阱**）。\n- **C 项正确**：3、5、7、8、9 月共 5 个月满足\"当月同比 \u003c 上月同比\"，即环比倍数同比下降、环比增速低于上年同期。\n- **陷阱类型**：**负数比较陷阱**（10 月 −6.2 比 9 月 −9.1 大，是上升）＋ **微小变化陷阱**（5 月仅差 0.5）＋ **概念陷阱**（\"低于上年同期\"比的是\"当月同比 vs 上月同比\"，不是\"同比是否为正\"）。\n\n---\n\n## 五、第五课总结（板书总结页原文）\n\n板书标题：**第五课增速累积与拆分总结**\n\n| 增速的累积 | 增速的拆分 | 比值变化关系 |\n| --- | --- | --- |\n| `r = r₁ + r₂ + r₁ × r₂` | `r = (r₁ − r₂) / (1 + r₂)` | `r = (r₁ − r₂) / (1 + r₂)` |\n| **应用场景**\u003cbr>① 乘积关系\u003cbr>② 时间累积关系 | **应用场景**\u003cbr>① 平均数关系\u003cbr>② 时间拆分关系 | 当分子增速 > 分母增速时，比值提高\u003cbr>\u003cbr>当分子增速 \u003c 分母增速时，比值降低\u003cbr>\u003cbr>当分子增速 = 分母增速时，比值不变 |\n| **计算注意点**\u003cbr>① 同高异低\u003cbr>② 小增速适当粗算 | **计算注意点**\u003cbr>① 先算差值\u003cbr>② 分母结合\"三板斧\"估算 | —— |\n\n> （板书上的红色强调：三栏标题\"增速的累积\"\"增速的拆分\"\"比值变化关系\"全部加下划线；\"乘积关系\"\"时间累积关系\"\"平均数关系\"\"时间拆分关系\"四行加下划线；拆分栏的公式 `r = (r₁ − r₂)/(1 + r₂)` 与\"分母结合'三板斧'估算\"被红色圆圈圈出；右侧\"分子增速 > / \u003c / = 分母增速\"三句全部加下划线。）\n\n### 老师的口头总结（本集收尾逐句）\n\n> ⭐ **老师原话**\n> \"今天的增速的累积与增速的拆分，基本的计算以及基本的限期与基期之间的比值的变化关系，就这么多。我们稍微来总结一下，我们看一下今天到底学了什么。\"\n> \"一个是怎么把增速累积起来，怎么把增速拆分下来，他们都是两种应用场景：一个是**乘积关系**，还有一个是**间隔增长率**、那个时间累积关系；一个是**平均数增长率**，一个是**时间拆分**，就增长率的关系。\"\n> \"然后就稍微注意一下计算的过程中，如果增速相同会提高，增速不同会降低。增速很小，你就适当简单粗算一下就好了。\"\n> \"真的拆分里面就是平均数增长率的公式。步骤记得**先算差值**，这个太重要，先算差值，先把主要的值差给它算出来；然后下面分母上的处理呢，就结合**三板斧**——化除为乘（直除法）、放缩法去处理，就会更快。\"\n> \"然后最后就是，结合这个平均增长率去判断一个比值变化概念的时候，就抓准它的**分子跟分母的一个增速关系**。\"\n> \"分子增速高，就是你每个人平均分到的钱多了。虽然你人多了，钱也多了，但你这个钱涨得比人多、钱涨得比人快，那这个人均收入还是在提高的。如果你钱涨得没有人涨得快，那你人均收入就降低。如果你的钱跟人的（钱的）增速是一样的，那么人均值就不变。\"\n\n> ⭐ **老师原话（下课与预告）**\n> \"明白了吧，今天又学这么多东西，其实就这么多，没有那么复杂。\"\n> \"明天估计两个、三个小时左右吧，应该三个小时不会太久。明天这节课稍微重要点，我待会赶紧把这个课件发上去，明天上午的时候大家有空一定要记得预习一下。拜拜，大家早点休息。\"\n> \"对，明天两点钟，**明天下午两点钟，不要跑空，明天是下午两点钟，不是晚上**，周末我们是下（午的课）……\"\n\n---\n\n## 六、本讲知识点总表\n\n| 序号 | 知识点 | 核心公式 / 结论 | 典型场景 |\n| --- | --- | --- | --- |\n| 1 | 三量关系（亩产/亩产值/单价） | `亩产 = 亩产值 / 单价`；`亩产值 = 亩产 × 单价`；`亩产 = 产量 / 面积` | 农业类材料中的\"亩产\" |\n| 2 | 比值变化判定 | 分子增速 > 分母增速 ⇒ 比值提高；\u003c ⇒ 降低；= ⇒ 不变 | 亩产、比重、人均值、单价等一切比值 |\n| 3 | 比重变化判定 | 部分增速 > 总体增速 ⇒ 比重提高 | \"比重提高的行业有几个\" |\n| 4 | 总体增速的复用 | 总体增速只求一次，当\"及格线\"逐行扫 | 多行业占比比较 |\n| 5 | 环比倍数 | `环比倍数 = 当月 / 上月 = 1 + r环比` | 环比与同比的联动 |\n| 6 | 环比的同比变化判定 | 当月同比 > 上月同比 ⇒ 环比倍数同比提高、环比增速同比提高；\u003c ⇒ 同比降低；= ⇒ 不变 | \"环比增速低于上年同期的月份有几个\" |\n| 7 | 环比倍数的等价公式 | `r = (r₁ − r₂) / (1 + r₂)`（r₁ 为当月同比、r₂ 为上月同比） | 同上 |\n| 8 | 增速的累积 | `r = r₁ + r₂ + r₁ × r₂`（间隔增长率） | 乘积关系 / 时间累积关系 |\n| 9 | 增速的拆分 | `r = (r₁ − r₂) / (1 + r₂)`（平均数增长率） | 平均数关系 / 时间拆分关系 |\n| 10 | 计算注意点 | 累积：同高异低；小增速适当粗算。拆分：先算差值；分母用\"三板斧\"估算 | 全部计算题 |\n\n---\n\n## 七、速算口诀与解题流程\n\n### 口诀 1｜比值变化一句话\n\n```\n分子快，比值升；\n分母快，比值降；\n一样快，比值平。\n```\n\n### 口诀 2｜环比的同比变化\n\n```\n环比增速不好比，先加 1 变环比倍数；\n当月同（比）大于上月同（比）→ 环比倍数涨、环比增速涨；\n当月同（比）小于上月同（比）→ 环比倍数降、环比增速降；\n\"环比增速低于上年同期\" ⇔ \"当月同比低于上月同比\" ⇔ 折线走\"下坡\"。\n```\n\n### 流程 A｜\"亩产 / 比重 / 人均\"类比值变化题\n\n| 步骤 | 动作 |\n| --- | --- |\n| ① | 写出比值关系式：`比值 = 分子 / 分母` |\n| ② | 找到分子的增速 r₁、分母的增速 r₂ |\n| ③ | 比较 r₁ 与 r₂ 的大小 |\n| ④ | r₁ > r₂ ⇒ 提高；r₁ \u003c r₂ ⇒ 降低；相等 ⇒ 不变 |\n| ⑤ | 若是\"数个数\"题，把总体增速当及格线，逐行扫一遍 |\n\n### 流程 B｜\"环比的同比变化\"题\n\n| 步骤 | 动作 |\n| --- | --- |\n| ① | 看到\"环比增速高于/低于上年同期\"，先翻译：**环比倍数同比升降** |\n| ② | 再翻译一次：**当月同比 vs 上月同比** |\n| ③ | 到折线图/增速表上，从题目起算月逐月与**上月**比大小 |\n| ④ | \"低于上年同期\" ⇒ 数**下降段**（当月值 \u003c 上月值）的个数 |\n| ⑤ | 特别注意：负数更大也是\"上升\"（如 −6.2 > −9.1），不计入 |\n\n### 流程 C｜增速拆分（平均数增长率）计算\n\n```\n第一步：先算差值  r₁ − r₂      ← 老师强调\"这个太重要\"\n第二步：分母 (1 + r₂) 结合\"三板斧\"估算\n        三板斧 = 化除为乘（直除法） / 放缩法（及其他估算技巧）\n第三步：得出 r\n```\n\n> ⭐ **老师原话**：\"步骤记得先算差值，这个太重要，先算差值，先把主要的值差给它算出来，然后下面分母上的处理呢，就结合三板斧——化除为乘（直除法）、放缩法去处理，就会更快。\"\n\n---\n\n## 八、易错点与陷阱清单\n\n| 序号 | 易错点 / 陷阱 | 具体表现 | 正确做法 |\n| --- | --- | --- | --- |\n| 1 | **概念陷阱：不会转换概念** | 例题 1 拿到\"亩产\"直接去算亩产 = 产值/单价的具体数值 | 先把\"亩产\"还原成 `亩产值 / 单价` 的比值形式，再比增速 |\n| 2 | **范围陷阱** | 例题 1 的 A/B 项用\"仅……\"缩小范围 | 逐个品种验证，两个都满足就要选\"两者\" |\n| 3 | **精度 / 临界值陷阱** | 例题 2 中 22.0%、22.1% 与总体 21.8% 只差 0.2～0.3 个百分点 | 逐行核对，别靠\"扫一眼感觉\" |\n| 4 | **数字误读陷阱** | 把\"文化投资运营 13.8%\"看成 35.8% | 看清位数与数字，13.8% \u003c 21.8%，不计入 |\n| 5 | **干扰信息陷阱** | 例题 2 的\"两年平均增长 10.0%\"及各行业收入绝对值 | 只取\"总体增速 21.8%\"和\"各行业增速\"两列即可 |\n| 6 | **概念混淆陷阱** | 把\"环比增速的比较\"当成\"同比增速的比较\" | 环比增速 → 加 1 变环比倍数 → 转成当月同比 vs 上月同比 |\n| 7 | **负数比较陷阱** | 例题 3 的 11 月 −0.3 → 12 月 −8.6；例题 4 的 9 月 −9.1 → 10 月 −6.2 | −8.6 \u003c −0.3 属\"下降\"（计入）；−6.2 > −9.1 属\"上升\"（不计入） |\n| 8 | **微小变化陷阱** | 例题 4 的 5 月 20.2 → 19.7（差 0.5） | 只要\"本月 \u003c 上月\"就计入，不以幅度大小为门槛 |\n| 9 | **读图陷阱** | 例题 3 图表中柱状（万人次）与折线（同比增速）并存 | 判\"增速升降\"只能看**折线**，柱子高低与本题无关 |\n| 10 | **起算月陷阱** | 例题 4 问\"3—12 月\"，3 月要与 2 月比 | 起算月的比较对象是它的**上一个月**，即使上月不在题目区间内也要用 |\n| 11 | **公式记忆陷阱** | 把\"增速拆分\"公式记成 `(r₁ − r₂)/r₂` 或漏掉分母的 1 | 拆分公式为 `r = (r₁ − r₂) / (1 + r₂)` |\n| 12 | **PPT 与讲义不一致** | 本集 PPT 上\"亩产\"的两个公式漏了除号 | **以讲义为准**：亩产 = 亩产值 ÷ 单价（老师课上已明确更正） |\n\n---\n\n## 九、老师金句\n\n> ⭐ \"增速跟倍数，它们是一体的，增速跟这个比值关系是一体的。**增速就是倍数减一，倍数就是增速加一。**\"\n\n> ⭐ \"什么叫亩产值？我一亩地卖多少钱？……**哎，以前没跟家里面去卖过稻子吗？一亩产了八百斤，一斤两块钱，那一亩就是 1600**，这不就是每亩的产值吗？\"\n\n> ⭐ \"**PPT 错的，PPT 这个两个公式错的**，讲义上是对的。\"（关于亩产公式漏除号）\n\n> ⭐ \"**总体增速只算一次**——你只要在这个行业里面能找到增速比这个百分之二十一点八高的就可以了。\"\n\n> ⭐ \"我们不要看环比增速，我们应该看什么？**看环比倍数。**\"\n\n> ⭐ \"它（环比增速）不是比值，但是它有个亲戚跟它是个比值关系。**你能不能给它加个一？因为加一之后它才是个比值。**\"\n\n> ⭐ \"所以只要**五月的增速比四月的同比增速要高，那么这个环比增速就会提高**。\"\n\n> ⭐ \"知道这个关系了、懂了这个结论了，你就不会忘了，你看到这种题目就会做了。\"\n\n> ⭐ \"**分子增速高，就是你每个人平均分到的钱多了。**虽然你人多了，钱也多了，但你这个钱涨得比人多、钱涨得比人快，那这个人均收入还是在提高的。如果你钱涨得没有人涨得快，那你人均收入就降低；如果钱跟人的（钱）增速一样，那么人均值就不变。\"\n\n> ⭐ \"步骤记得**先算差值**，这个太重要，先算差值，先把主要的值差给它算出来。\"\n\n> ⭐ \"今天又学这么多东西，**其实就这么多，没有那么复杂**。\"\n\n> ⭐ \"明天下午两点钟，**不要跑空，明天是下午两点钟，不是晚上**，周末我们是下（午的课）。\"\n\n---\n\n> **笔记校对说明**\n> - 本集全部题干、材料数字、选项、图表数值均按画面原帧逐字核对；转写中的同音字（如\"母产/亩产\"\"笔中/比重\"\"重速/增速\"\"计期/基期\"\"限期/现期\"）已按画面更正。\n> - 转写中\"同比增速小于 0\"一句与课堂前后逻辑及板书不一致，已在 4.4 节标注并给出正确表述。\n> - 例题 1、2、3 的答案在画面中有老师的圈划/书写标记；例题 4 老师以口头数折线下降段的方式收尾，画面左侧有手写答案字母标记，答案记为 C（5 个）。\n","outline":[{"level":2,"text":"一、本集定位：从\"比值变化\"公式到实战","id":"一本集定位从比值变化公式到实战"},{"level":2,"text":"二、比值变化在\"亩产\"题型中的应用","id":"二比值变化在亩产题型中的应用"},{"level":3,"text":"概念铺垫：亩产、亩产值、单价三者的换算（板书）","id":"概念铺垫亩产亩产值单价三者的换算板书"},{"level":3,"text":"例题 1｜2020 年 H 省秋粮玉米和稻谷（亩产与上年相比）","id":"例题-12020-年-h-省秋粮玉米和稻谷亩产与上年相比"},{"level":2,"text":"三、比值变化在\"占比\"题型中的应用","id":"三比值变化在占比题型中的应用"},{"level":3,"text":"题型原理：比重提高 ⟺ 部分增速 > 总体增速","id":"题型原理比重提高-部分增速-总体增速"},{"level":3,"text":"例题 2｜2021 年前三季度文化及相关产业企业（占比提高的行业个数）","id":"例题-22021-年前三季度文化及相关产业企业占比提高的行业个数"},{"level":2,"text":"四、\"环比的同比变化\"——冷门但重要的新考法","id":"四环比的同比变化冷门但重要的新考法"},{"level":3,"text":"4.1 题型长什么样","id":"41-题型长什么样"},{"level":3,"text":"4.2 核心推导：给\"环比增速\"加个 1，就变成比值","id":"42-核心推导给环比增速加个-1就变成比值"},{"level":3,"text":"4.3 数值验证（老师口述例子）","id":"43-数值验证老师口述例子"},{"level":3,"text":"4.4 三条判定结论（板书原文）","id":"44-三条判定结论板书原文"},{"level":3,"text":"例题 3｜2018 年 4—12 月接待入境游客次数（环比增速低于上年同期的月份数）","id":"例题-32018-年-412-月接待入境游客次数环比增速低于上年同期的月份数"},{"level":3,"text":"例题 4｜2016 年 3—12 月江苏规模以上光伏产业产值（环比增速低于上年同期的月份数）","id":"例题-42016-年-312-月江苏规模以上光伏产业产值环比增速低于上年同期的月份数"},{"level":2,"text":"五、第五课总结（板书总结页原文）","id":"五第五课总结板书总结页原文"},{"level":3,"text":"老师的口头总结（本集收尾逐句）","id":"老师的口头总结本集收尾逐句"},{"level":2,"text":"六、本讲知识点总表","id":"六本讲知识点总表"},{"level":2,"text":"七、速算口诀与解题流程","id":"七速算口诀与解题流程"},{"level":3,"text":"口诀 1｜比值变化一句话","id":"口诀-1比值变化一句话"},{"level":3,"text":"口诀 2｜环比的同比变化","id":"口诀-2环比的同比变化"},{"level":3,"text":"流程 A｜\"亩产 / 比重 / 人均\"类比值变化题","id":"流程-a亩产-比重-人均类比值变化题"},{"level":3,"text":"流程 B｜\"环比的同比变化\"题","id":"流程-b环比的同比变化题"},{"level":3,"text":"流程 C｜增速拆分（平均数增长率）计算","id":"流程-c增速拆分平均数增长率计算"},{"level":2,"text":"八、易错点与陷阱清单","id":"八易错点与陷阱清单"},{"level":2,"text":"九、老师金句","id":"九老师金句"}]},{"id":"P14","title":"增速的累积与拆分·课后作业解析","full":"第5课 增速的累积与拆分 · 课后作业解析","lect":"","dur":"48:24","sec":2904,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 14 集\n\n# 第5课 增速的累积与拆分 · 课后作业解析\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 14 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=14`\n> **时长**：约 48 分 24 秒\n> **本集主题**：**「增速的累积与拆分」课后作业逐题精讲（第 1~15 题全覆盖）**\n> —— 乘积（累积）增长率、间隔增长率、平均数增长率三大考点在作业中的实战识别与速算，\n> 以及「画除为乘 / 分数法 / 放缩 / 提前修正」三板斧在公式分母上的灵活运用。\n\n---\n\n## 目录\n\n- [一、本集主线：15 道作业题的考点分布](#一本集主线15-道作业题的考点分布)\n- [二、例题精讲（逐题全讲，一题不落）](#二例题精讲逐题全讲一题不落)\n  - [第 1 题｜2018 年全球茶叶产量 · 出口总额同比增速](#第-1-题2018-年全球茶叶产量--出口总额同比增速)\n  - [第 2 题｜2015 联考 · 新登记注册外商投资企业户均注册资本](#第-2-题2015-联考--新登记注册外商投资企业户均注册资本)\n  - [第 3 题｜社会消费品零售总额表 · 间隔增幅](#第-3-题社会消费品零售总额表--间隔增幅)\n  - [第 4 题｜东北地区民间固定资产投资额（间隔增长率反求基期）](#第-4-题东北地区民间固定资产投资额间隔增长率反求基期)\n  - [第 5 题｜城镇居民人均可支配收入（间隔增长率反求基期）](#第-5-题城镇居民人均可支配收入间隔增长率反求基期)\n  - [第 6 题｜2007-2012 年测绘服务总值倍数（间隔增长率·倍数视角）](#第-6-题2007-2012-年测绘服务总值倍数间隔增长率倍数视角)\n  - [第 7 题｜长江流域棉区棉花总产量同比变化](#第-7-题长江流域棉区棉花总产量同比变化)\n  - [第 8 题｜社会消费品零售总额月度累计表（三次变化累积求倍数）](#第-8-题社会消费品零售总额月度累计表三次变化累积求倍数)\n  - [第 9 题｜全国资助学前教育 · 每人次平均受资助额](#第-9-题全国资助学前教育--每人次平均受资助额)\n  - [第 10 题｜新设私营企业平均注册资本（金）倍数](#第-10-题新设私营企业平均注册资本金倍数)\n  - [第 11 题｜快递企业每件业务获得的收入](#第-11-题快递企业每件业务获得的收入)\n  - [第 12 题｜全国棉花单位面积产量](#第-12-题全国棉花单位面积产量)\n  - [第 13 题｜中药行业平均每个雇员创造的收益](#第-13-题中药行业平均每个雇员创造的收益)\n  - [第 14 题｜2013 比 2011 年快递业务量增长](#第-14-题2013-比-2011-年快递业务量增长)\n  - [第 15 题｜房地产开发企业到位资金（20 年增量）](#第-15-题房地产开发企业到位资金20-年增量)\n- [三、本讲知识点总表](#三本讲知识点总表)\n- [四、速算口诀与解题流程](#四速算口诀与解题流程)\n- [五、易错点与陷阱清单](#五易错点与陷阱清单)\n- [六、老师金句](#六老师金句)\n\n---\n\n## 一、本集主线：15 道作业题的考点分布\n\n> **老师说**：「一般来说在我们资料分析中，如果要你算增速，它一般就只有这几种考法。」\n\n**求增速的三大考法（板书归纳）：**\n\n```\n① 给现期/增量 → 用 增长量 ÷ 基期 直接算（最基本的，把这段变化的比例搞出来）\n② 乘积（累积）/间隔增长率 → 把几次变化合并起来 / 拆分出来\n   累积： r = r1 + r2 + r1 × r2\n   拆分： 已知整体增速 R 与其中一段 r2 → r1 = (R − r2) ÷ (1 + r2)\n③ 平均数增长率 → 分子增速 r1、分母增速 r2\n   r = (r1 − r2) ÷ (1 + r2)\n```\n\n> **老师说**：「要么就是用成绩（乘积）增长率，要么就是平均数增长率。一般来说，如果这个题目要我们去计算某个东西的增速，它往往就只会考这三种考点。」\n\n**15 道题归类表：**\n\n| 题号 | 对象 | 考点类型 | 列式 | 答案 |\n|:---:|---|---|---|---|\n| 1 | 出口总额同比增速 | 乘积（累积）增长率 | `r = 2.8% + 8.9% + 2.8%×8.9%` | A.12% |\n| 2 | 户均注册资本增速 | 平均数增长率 | `r = (23.87% − 5.76%) ÷ (1+5.76%)` | A.17% |\n| 3 | 18 年相对 16 年增幅 | 间隔（累积）增长率 | `r = 10.4% + 9.5% + 10.4%×9.5%` | A.20.9% |\n| 4 | 东北 2014 年投资额 | 间隔增长率反求基期 | `R = −24.4% + (−26%) + 26%×24.4%` | D.38624 亿元 |\n| 5 | 2013 年城镇居民收入 | 间隔增长率反求基期 | `R = 9% + 8.2% + 9%×8.2%` | C.2.6 |\n| 6 | 12 年是 06 年的几倍 | 间隔（倍数视角） | `倍数 = 1.11 × 2.4` | C.2.7 |\n| 7 | 长江流域棉花总产量增速 | 乘积（累积）增长率 | `r = −14.9% + (−3.6%) + 14.9%×3.6%` | D.18% |\n| 8 | 18 年是 15 年的几倍 | 三次变化累积 | `倍数 = 1.12 × 1.1 × 1.1` | C.1.4 |\n| 9 | 每人次平均受资助额增速 | 平均数增长率 | `r = (19.92% − 6.86%) ÷ (1+6.86%)` | B.12% |\n| 10 | 私营企业平均注册资本倍数 | 平均数增长率→倍数 | `倍数 = 1 + (213% − 39.7%) ÷ (1+39.7%)` | B.2.2 |\n| 11 | 每件业务获得收入 | 平均数增长率 | `r = (25.8% − 27.5%) ÷ (1+27.5%)` | D.下降 1.3% |\n| 12 | 单位面积产量增速 | 平均数增长率（分子分母先估增速） | `r = (−5% + 11%) ÷ (1−11%)` | D.上升 7.2% |\n| 13 | 平均每个雇员创造收益 | 平均数增长率 >0 的判定 | `r > 0 ⟺ r1 > r2` | C.3 |\n| 14 | 13 比 11 年快递业务量增长 | 间隔（累积）增长率 | `r = 54.8% + 61.6% + 54.8%×61.6%` | B.150% |\n| 15 | 20 年到位资金增量 | 间隔增长率拆分 + 增量 | `r20 = (12.6%−4.2%) ÷ (1+4.2%)` | C.14399.8 |\n\n> **老师说**：「这节课的课后作业就讲到这边。」\n\n---\n\n## 二、例题精讲（逐题全讲，一题不落）\n\n### 第 1 题｜2018 年全球茶叶产量 · 出口总额同比增速\n\n**【题干原文】**\n\n> 1.2018年全球茶叶产量585.6万吨，同比增长约3%，中国茶叶产量261.6万吨，同比增长0.7万吨。2018年，中国茶叶国内销售量为191万吨，同比增长5.1%，国内销售总额为2661亿元，出口量为36.5万吨，同比增长2.8%，出口总额为17.89亿美元（合人民币120亿元），同比增长（ ？ ）。\n>\n> 资料中\"（ ？ ）\"处应当填入的数值最可能是以下哪一个？\n>\n> A.12%　B.16%　C.20%　D.24%\n\n**【材料数据】**\n\n图表标题（画面原文）：**2013年-2018年我国茶叶出口量及出口均价走势图**\n\n| 年份 | 出口数量（万吨，柱） | 出口均价（千美元/吨，折线） |\n|:---:|---:|---:|\n| 2013 年 | 32.6 | 3.8 |\n| 2014 年 | 30.1 | 4.2 |\n| 2015 年 | 32.5 | 4.3 |\n| 2016 年 | 32.9 | 4.5 |\n| 2017 年 | 35.5 | 4.5 |\n| 2018 年 | 36.5 | 4.9 |\n\n（左侧纵轴：万吨，0~50；右侧纵轴：千美元/吨，0~6）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 求「出口总额」的增速，但只给了出口总额的**现期值**，没给增量、没给基期 → 不是直接算增速 → 走**乘积（累积）增长率** |\n| 定位数据 | `出口总额 = 出口量 × 均价`；出口量增速**直接给出 2.8%**；均价需自算：2017 年 4.5 → 2018 年 4.9 千美元/吨 |\n| 均价增速列式 | `均价增速 = (4.9 − 4.5) ÷ 4.5 = 0.4 ÷ 4.5 = 4/45 = 8/90 = 8.88% ≈ 8.9%` |\n| 累积列式 | `r = r1 + r2 + r1 × r2 = 2.8% + 8.9% + 2.8%×8.9%` |\n| 速算步骤 | ① 先加主项：`2.8 + 8.9 = 11.7`\u003cbr>② 尾巴：`2.8 × 9 = 25.2`，`÷100 = 0.25`（把 8.9 看成 9）\u003cbr>③ 合计：`11.7 + 0.25 = 11.95 ≈ 12%` |\n| 结论 | 选 12%，即 **A** |\n\n**老师说**（速算细节）：\n> 「增量是从 4.5 涨到 4.9，是涨了 0.4。增速就是增量除以基期，0.4 除以 4.5，就等于 4 除以 45，\n> ok，把下面这个想成 90，那 8 除以 90 就是百分之 8.88。」\n\n**老师的「短平快」思路（熟练后不必真算尾巴）**：\n> 「因为我们熟练之后也可以先看看选项，百分之十二、百分之十六、百分之二十、百分之二十四。\n> 这个成绩（乘积）增长率，它并不是简单的把两个增速相加，它要在加了之后，\n> 它们增速之间还有一个相互增幅的这种感觉。……这个百分之二点八它其实是非常非常小的，\n> 就两三个点太小了。所以你这个增速我们从四点五到四点九是能很明显的看出来它是小于 10% 的，\n> 那光是加起来也不会就是 12、13 个点。这 10% 再乘以 2%，就只有那么一丢丢，只有那么一点点，\n> 是不可能到 16、20、24 这么大的。所以只有 12，这个地方是可以四舍五入，差不多能到这个位置的。」\n\n**【选项原文】**\n\n- A.12%\n- B.16%\n- C.20%\n- D.24%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **A 正确**：出口总额是「量 × 均价」的乘积关系，两因素增速分别为 2.8% 与 8.9%，`2.8% + 8.9% + 0.25% ≈ 11.95%`，四舍五入 12%。\n- **B / C / D 错误**：乘积增长率的小尾巴只有 `2.8% × 8.9%` 量级的零点几个百分点。老师手算验证：「你 2.8 想要跟某个增速能乘积成 16%，那起码基本上要到 13% 附近才可以。13% 跟 2.8 加起来是 15.8，再加一点点小尾巴，凑个 16 左右。」而实际均价增速连 10% 都不到，所以只能到 12%。\n- **陷阱类型**：**概念陷阱**（把「乘积增长率」当成简单相加，或误把 4.9 当成均价增速）。**单位陷阱**：均价单位是「千美元/吨」，与出口量的「万吨」不是一回事，只有把两者分别化成「增速」才能相乘。\n- **板书要点**（画面红笔）：\n  ```\n  出口总额 = 出口量 × 均价\n  r = r1 + r2 + r1 × r2\n  均价 r = 0.4 / 4.5 = 4/45 = 8/90 = 8.8%\n  2.8% + 8.9% + 2.8% × 8.9% ≈ 11.95% → 12%\n  ```\n  （画面右侧还同时抄写了平均数增长率公式 `r = (r1 − r2)/(1 + r2)` 作为对照）\n\n---\n\n### 第 2 题｜2015 联考 · 新登记注册外商投资企业户均注册资本\n\n**【题干原文】**\n\n> 2.2014年，新登记注册外商投资企业3.84万户，同比增长5.76%。投资总额2763.31亿美元，同比增长15.05%；注册资本1796.39亿美元，同比增长23.87%。\n>\n> 2014年，新登记注册外商投资企业户均注册资本约比上年同期增长：\n>\n> A.17%　B.12%　C.8%　D.4%\n\n**【材料数据】**\n\n| 指标 | 2014 年数值 | 同比增速 |\n|---|---:|---:|\n| 新登记注册外商投资企业 | 3.84 万户 | 5.76% |\n| 投资总额 | 2763.31 亿美元 | 15.05% |\n| 注册资本 | 1796.39 亿美元 | 23.87% |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「户均注册资本」＝**平均值的概念**（一共多少资本 ÷ 一共多少户）→ 求平均值的增速 → **平均数增长率** |\n| 定位数据 | 分子＝注册资本，增速 `23.87%`（≈23.8%）；分母＝企业户数，增速 `5.76%`（≈5.7%）；投资总额 15.05% 是**干扰项** |\n| 列式 | `r = (分子增速 − 分母增速) ÷ (1 + 分母增速) = (23.8% − 5.7%) ÷ (1 + 5.7%)` |\n| 速算步骤 | ① 先做增速差：`23.8 − 5.7 = 18.1`\u003cbr>② 分母是 `1 + 5.7%`，增速小（5.7% \u003c 10%），用**画除为乘**：`18.1% × (1 − 5.7%)`\u003cbr>③ `≈ 18.1% − 18.1%×5.7% ≈ 18.1% − 1% ≈ 17%` |\n| 结论 | 选 17%，即 **A** |\n\n> **老师说**（为什么可以用画除为乘）：「然后这个地方我们在计算平均增长率的时候，在这个分母上有这种一加百分之多少的时候，也可以结合我们今天学的画除为乘，\n> 或者说分数法这种思想去进行快速运算，为什么呢？因为这种运算的式子，\n> 它其实跟我们之前学过的算基期不是一样的吗？我把上面看作现期，下面看作一个像增速一样的东西，一加增速。\n> 原理是不是一样的？」\n\n> **老师说**（误差提示）：「这个地方有一点点误差，因为画除为乘，如果你直接用现期乘这个增速当做它这个增量的话，会有误差的。\n> 但是很多时候平均增长率的计算不会有那么高的精度要求。这样你就避免除法，可以把它转化成乘法，\n> 运算起来可能会快一点，尤其是增速比较小的时候，运算的时候你不需要算得很准确。」\n\n**【选项原文】**\n\n- A.17%\n- B.12%\n- C.8%\n- D.4%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **A 正确**：户均＝资本/户数，`(23.87% − 5.76%) ÷ 1.0576 ≈ 17.1% ≈ 17%`。\n- **B / C / D 错误**：12%、8%、4%、都太小。老师强调：「不可能到十二的，因为十二呀、八呀、四啊，这些都太小了，需要 18 减掉很多才能变成这个 12、8、4」。\n- **陷阱类型**：**概念陷阱**（把「户均注册资本」误配成「投资总额 ÷ 户数」，投资总额 15.05% 是干扰）；**运算陷阱**（忘记分母 `(1 + r2)`，直接写 18.1%）。\n- **老师的短平快流程**：\n  ```\n  ① 识别是平均数增长率\n  ② 找分子、分母增速\n  ③ 先做增速差 ≈ 18%\n  ④ 分母要除一个 1.05x，画除为乘 → 减掉自身约 5 个点 ≈ 1%\n  ⑤ 得 17%\n  ```\n- **画除为乘的限制条件**：老师说「注意这个有限制条件的，至少在百分之十以内，这个是五个点，所以还是可以的」。\n\n---\n\n### 第 3 题｜社会消费品零售总额表 · 间隔增幅\n\n**【题干原文】**\n\n> 3.2018年社会消费品零售总额相对于2016年的增幅为（　）。\n>\n> A.20.9%　B.19.9%　C.10.4%　D.9.5%\n\n**【材料数据】**\n\n表头（画面原文）：**2016 年—2018 年部分商品零售额及同比增幅**\n\n| 类别 | 2016 年\u003cbr>（亿元） | 同比增幅\u003cbr>（%） | 2017 年\u003cbr>（亿元） | 同比增幅\u003cbr>（%） | 2018 年\u003cbr>（亿元） | 同比增幅\u003cbr>（%） |\n|---|---:|---:|---:|---:|---:|---:|\n| 社会消费品零售额 | 1443.39 | 9.9 | 1593.5 | 10.4 | 1744.9 | 9.5 |\n| 食品零售额 | 410.2 | 9.5 | 460 | 12.1 | 469.9 | 2.2 |\n| 日用品零售额 | 810.9 | 9.3 | 884.7 | 9.1 | 1015.2 | 14.8 |\n| 服装零售额 | 173 | 11.2 | 193 | 11.6 | 191.2 | −1.0 |\n| 其他零售额 | 49.2 | 7.4 | 55.7 | 13.2 | 68.6 | 23.2 |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「18 年相对于 16 年」跨了一年（中间隔 2017 年）→ **间隔增长率** |\n| 定位数据 | 要找中间的跳板：**17 年的同比增速 10.4%**（16→17），**18 年的同比增速 9.5%**（17→18） |\n| 关键提醒 | 「你不要去看这个 16 年的增速啊，16 年这个增速指的意思是 16 年相比于 15 年涨了多少。我们要找到 17 年相对于 16 年涨多少，就是 17 年的增速 10.4%。」 |\n| 列式 | `R = 10.4% + 9.5% + 10.4%×9.5%` |\n| 速算步骤 | ① 先加：`10.4 + 9.5 = 19.9`\u003cbr>② 尾巴约 1%：`10.4 × 9.5 ≈ 99 ÷ 100 ≈ 1`\u003cbr>③ `19.9 + 1 ≈ 20.9` |\n| 结论 | 选 20.9%，即 **A** |\n\n> **老师说**（秒杀思路）：「不过这个题目呢，当我们还是短平快的思路，先把这两个需要累积起来的增速先加起来，\n> 加起来之后得到 19.9，之后就可以直接秒 A 走人了。因为它们两个都是正的增速乘积，\n> 增长率后面还有个小尾巴，两个都是正的，合起来加起来之后还在变大一点点，所以选 A。」\n\n> **老师说**（小尾巴什么时候可以忽略）：「除非这两个增速都特别小，比如说百分之二，百分之一。\n> 如果答案一个是百分之三，一个百分之四，我们选哪个？选百分之三，因为他们后面加的那个小尾巴太小了，\n> 两个直接加起来百分之三，然后加个小尾巴，小尾巴只有百分之零点零二，这个呢就可能会根据四舍五入，\n> 因为四舍五入会直接舍掉，会变成就取证百分之三。」\n\n> **老师说**（命题人意图）：「不过这种情况相对来说比较少见，因为一般来说出题人想要考察这个成绩（乘积）增长率，\n> 它肯定是会让后面这个小尾巴起到相应的作用的。不然的话，他这题目不就等于白考嘛。\n> 有的人他可能不懂诚心（乘积）道理，他就知道一次涨到百分之二，一次涨了百分之一，加起来百分之三就走了，\n> 他可能都不知道，那将这个题目的设置的考察的目的就失去了。」\n\n**【选项原文】**\n\n- A.20.9%\n- B.19.9%\n- C.10.4%\n- D.9.5%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- **A 正确**：`19.9% + 10.4%×9.5% ≈ 19.9% + 0.99% = 20.89% ≈ 20.9%`（画面板书写作 `19.9% + 10.4% × 9.5% = 20.9%`）。\n- **B 错误**：19.9% 只写了主项相加，漏掉了 `r1 × r2` 的小尾巴。\n- **C / D 错误**：10.4% 与 9.5% 是**单年**增速（17 年、18 年的同比增速），题目问的是 18 年相对 16 年的两年累积增幅。\n- **陷阱类型**：**时间陷阱**（误用 16 年增速 9.9%，或误用单年增速）；**概念陷阱**（漏尾巴 / 把累积增长率当成简单相加）。\n- **板书要点**：画面画了一个「16 → 17 → 18」的时间轴，17 处标 `10.4%`、18 处标 `9.5%`，下方写 `19.9% + 10.4%×9.5%`。\n\n---\n\n### 第 4 题｜东北地区民间固定资产投资额（间隔增长率反求基期）\n\n**【题干原文】**\n\n> 4.2016年，东北地区民间固定资产投资额21608亿元，比上年下降24.4%，降幅收窄1.6个百分点。\n>\n> 东北地区2014年民间固定资产投资额为：\n>\n> A.28582亿元　B.29200亿元　C.35864亿元　D.38624亿元\n\n**【材料数据】**\n\n| 年份 | 民间固定资产投资额 | 同比变化 |\n|---|---|---|\n| 2016 年 | 21608 亿元 | 比上年下降 24.4%（降幅收窄 1.6 个百分点） |\n| 2015 年 | （待求） | 降幅比 2016 年大 1.6 个百分点 → **下降 26%** |\n| 2014 年 | （题目所问） | — |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 给 2016 年求 2014 年，中间隔 2015 年 → 先做**间隔增长率**，再把它当成「现期 + 增速」反求基期 |\n| 定位数据 | 2016 年增速 `−24.4%`；**降幅收窄 1.6 个百分点** → 2015 年降幅 = `24.4% + 1.6% = 26%`，即增速 `−26%` |\n| 列式 | `R = −24.4% + (−26%) + (−26%)×(−24.4%)` |\n| 速算步骤 | ① `−24.4 − 26 = −50.4`\u003cbr>② 尾巴负负得正：`26 × 24.4 ÷ 100 ≈ 25² ÷ 100 = 625 ÷ 100 ≈ 6`\u003cbr>③ `R = −50.4% + 6% ≈ −44.4% = −4/9`\u003cbr>④ 份数法：负 4/9 意味着 9 份减掉 4 份剩 5 份 = 21608\u003cbr>⑤ 4 份 = `21600 × 4/5 = 17280`（画面旁注 ≈17300）\u003cbr>⑥ 9 份 = `21600 + 17280 = 38880 ≈ 38600` |\n| 结论 | 选 38624 亿元，即 **D** |\n\n**「降幅收窄」概念讲解（老师说）**：\n> 「这个地方有个概念叫做降幅收窄，这个窄是什么意思呢？这里相当于一个增速的坐标轴，\n> 这儿是 0%，比如说这是百分之十，这是负百分之十，这样一个坐标轴，这个窄指的是什么？\n> 窄到百分之零的距离变窄了。比如说如果去年是负百分之十，今年变成了负百分之八，\n> 我们原来距离这个百分之零是有百分之十的距离的，现在只剩八的距离了。\n> 就好像人的腰围一样，从 10 英寸的腰围变成 8 英寸的腰围，那不就是收窄了吗？」\n\n> 「所以 16 年它的降幅是 24.4%，或者说它的增速是 −24.4%，到零的距离是 24.4，它是变窄了 1.6 了。\n> 说明去年 15 年它这个降幅，它到零的距离，也就是这个绝对值，要比现在 16 年这个要高 1.6，\n> 是 26%。它从 26 变成了 24.4，这才是变窄了 1.6。」\n\n**第二种做法（老实推两次基期，老师说）**：\n> 「或者这个题目呢其实我们也可以老老实实的，就根据他给了两次增速推两次不就好了吗？\n> 今年是 21600。增幅是负的 24.4%，那这个增速它正好很适合用百分数（分数），这不就约等于负的 1/4 吗？\n> 那就 4 份减了一份，变成了 3 份。3 份对应是 21600，那一份就是 7200。\n> 1 加 15 年的 28800 就出来了（21600 + 7200 = 28800）。\n> 这两万八千八是跌了多少下来的，跌了百分之二十六下来的。\n> 那是不是也基本上是负了四分之一？那四份减一份变成三份，\n> 我们继续把这个 15 年的 3 份给它加上去。15 年，这两万八千八的三分之一就是加了个九千六，\n> 那九千六就会变成三万八千四（28800 + 9600 = 38400），所以选择三万八千六这样也可以。」\n\n> **老师总结**：「所以如果大家遇到这种给你两年的增速、求间隔之前的这个基期的时候，\n> 如果它的这两个增速用成绩（乘积）增长率把它们累积成一次比较好算，就用刚刚第一种方法。\n> 如果把它累计起来，你觉得不好算，或者说它这个增速本身就直接去推基期，\n> 你推两次这种增速，它很适合百分数或者什么画除为乘能很快的把基期估出来，\n> 你直接估两次基期也可以很快，选哪一个就看哪个方法对于这个数字而言更方便。\n> 不要死板。」\n\n**【选项原文】**\n\n- A.28582 亿元\n- B.29200 亿元\n- C.35864 亿元\n- D.38624 亿元\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- **D 正确**：两次降幅 26% 与 24.4% 累积为 `−44.4%`，`21608 ÷ (1 − 44.4%) ≈ 21608 ÷ 0.556 ≈ 38863 ≈ 38600`；或分两次推：`21600 → 28800 → 38400`，与 D 最接近。\n- **A / B 错误**：2015 年值是 28800 左右（接近 B.29200），A.28582 亦为单年量级；题目问的是 **2014 年**。\n- **C 错误**：35864 介于两者之间，是「只推一次 + 部分累积」的错误结果。\n- **陷阱类型**：**时间陷阱**（问 2014 年却只退到 2015 年）；**概念陷阱**（「降幅收窄 1.6 个百分点」需先还原出去年降幅 26%）；**运算陷阱**（漏掉负负得正的小尾巴，或符号搞错）。\n- **板书**：画面画 `14 —— 15 —— 16` 时间轴，15 上标 `−26%`（标 28800），16 上标 `−24.4%`（标 21600），并写 `−50.4 + 6 ≈ −44.4%`、`−4/9`、`9−4=5`、`4/5 × 21600 = 17280`。\n\n---\n\n### 第 5 题｜城镇居民人均可支配收入（间隔增长率反求基期）\n\n**【题干原文】**\n\n> 5.2015年城镇居民人均可支配收入31195元，比上年增长8.2%，增长率比2014年下降0.8个百分点。\n>\n> 2013年，城镇居民人均可支配收入约为多少万元？\n>\n> A.1.9　B.2.2　C.2.6　D.3\n\n**【材料数据】**\n\n| 年份 | 城镇居民人均可支配收入 | 同比增速 |\n|---|---|---|\n| 2015 年 | 31195 元 | 8.2%（比 2014 年下降 0.8 个百分点） |\n| 2014 年 | （待求） | **9%**（= 8.2% + 0.8%） |\n| 2013 年 | （题目所问） | — |\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 给 2015 年求 2013 年，中间隔 2014 年 → **间隔增长率**再反求基期 |\n| 定位数据 | 14→15 增速 `8.2%`；「增长率比 2014 年下降 0.8 个百分点」→ 13→14 增速 `8.2% + 0.8% = 9%` |\n| 列式 | `R = 9% + 8.2% + 9%×8.2%` |\n| 速算步骤 | ① 先加：`9 + 8.2 = 17.2`\u003cbr>② 尾巴：`9 × 8.2 = 73.8 → ÷100 ≈ 0.7`\u003cbr>③ `R ≈ 17.9% ≈ 18%`\u003cbr>④ 15 年 `31195 ≈ 3.1 万`，扣掉 18%：把 18% 当 20% ≈ 1/5，则现期是 6 份、`3.1万 ÷ 6 ≈ 5 千`（画面写「大概 5000 左右」）\u003cbr>⑤ `3.1万 − 5千 = 2.6万` |\n| 结论 | 选 2.6，即 **C** |\n\n> **老师说**（为什么本集这份数据适合第一种方法）：「那这个题目呢，跟相比于上一个题目来说，它的增速就更适合用第一种方法，\n> 因为它的增速很小，增速成绩（乘积）增长率呢就不太需要考虑后面那个 r1×r2 了。」\n\n> **老师说**（选项差距大时的粗估）：「这里的选项差距也是非常大的。所以这个百分之十八，你也可以比较粗略一点，\n> 把它看去估计它的增量，用那个分数法快一点。因为分数法的优点就是快。\n> 把百分之十八我先当个百分之二十，这是不是就是五分之一啊？那限期它的增量就是限期除以 6，\n> 因为 5 分之 1 相当于 5 份加 1 份，变成了限期的 6 份。大概就是五千左右，\n> 所以三万一减五千等于两万六。这个选项差距已经算是很大的了，因为你相当于只是要看从三万一减多少减下去，\n> 变成选项是减一千呢，它的增量是一千呢，还是五千呢，还是九千呢？你说这一千、五千、九千这个还不够差距、\n> 还不够大吗？五千跟九千都快翻倍了。」\n\n> **老师说**（排除法）：「其实选项差距这么大的时候，当你能知道是 18%，其实这里面的选项，你假设的想一想，\n> 也能很快的把它排除掉。不可能是 3 啊，你 3 哪怕涨 10 个点，都 3.3 了，3 跟 3.1 之间距离太近了；\n> 1.9 跟 2.2 距离太远了，你 2.2 涨到 3.1，基本上要涨 50%。所以简单地选 C。」\n\n**【选项原文】**\n\n- A.1.9\n- B.2.2\n- C.2.6\n- D.3\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- **C 正确**：`31195 ÷ (1 + 18%) ≈ 31195 ÷ 1.18 ≈ 26436 元 ≈ 2.6 万元`。\n- **A / B 错误**：1.9 和 2.2 都偏小，等于要求 13→15 年涨 60% 以上，与实际 18% 不符。\n- **D 错误**：3 万元与 2015 年的 3.1 万几乎相等，意味着 13→15 年几乎零增长。\n- **陷阱类型**：**时间陷阱**（题目问 2013 年，不能只退一年到 2014 年）；**概念陷阱**（「增长率比 2014 年下降 0.8 个百分点」要**加回去**得到 9%，不是减）；**单位陷阱**（题干单位是「元」，选项单位是「万元」）。\n- **板书**：画面写 `13 —— 14 —— 15` 时间轴，并写 `17.2 + 0.7 = 18%`、`3.1万`、`20%: 5 → 5+1=6`、`3.1万 ÷ 6 ≈ 5千`。\n\n---\n\n### 第 6 题｜2007-2012 年测绘服务总值倍数（间隔增长率·倍数视角）\n\n**【题干原文】**\n\n> 6.2012年测绘服务总值约是2006年的（　）倍。\n>\n> A.2.2　B.2.4　C.2.7　D.3.3\n\n**【材料数据】**\n\n图表标题（画面原文）：**图1 2007-2012年测绘服务总值及增长速度情况**\n\n| 年份 | 测绘服务总值（亿元，柱） | 同比增速（%，折线） |\n|:---:|---:|---:|\n| 2007 年 | 30.93 | 11.0 |\n| 2008 年 | 36.77 | 18.9 |\n| 2009 年 | 45.07 | 22.6 |\n| 2010 年 | 50.74 | 12.6 |\n| 2011 年 | 64.79 | 27.7 |\n| 2012 年 | 74.92 | 15.6 |\n\n（左纵轴：亿元 0~150；右纵轴：% −10~30）\n\n**【解题拆解】**\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 「12 年是 06 年的多少倍」＝现期是基期的多少倍，与算增速同源（`倍数 = 1 + 增速`），且跨 2007 年中隔 → **间隔增长率（倍数视角）** |\n| 定位数据 | 题干数据里 07 年比 06 年增长 **11%**；07→12 年的增速需用当年值估算：画面用 `31 → 75`（2007 年 30.93 与 2012 年 74.92 取整） |\n| 列式（法一：增速合成） | `07→12 增速 = (75 − 31) ÷ 31 = 44/31 ≈ 142%`；`R = 11% + 142% + 11%×142% ≈ 153% + 15% = 168%`；`倍数 = 1 + 168% = 2.68 ≈ 2.7` |\n| 列式（法二：倍数直接相乘，老师推荐） | `倍数 = 1.11 × (75 ÷ 31) ≈ 1.11 × 2.4 = 2.664 ≈ 2.7` |\n| 速算步骤（法二） | ① 06→07 增长 11% ⇒ 07 年是 06 年的 `1.11` 倍\u003cbr>② `75 ÷ 31`：分母减 1（31→30）、分子减 3（75→72），`72 ÷ 30 = 2.4` ⇒ 12 年是 07 年的 `2.4` 倍\u003cbr>③ `1.11 × 2.4 ≈ 2.66` |\n| 结论 | 选 2.7 倍，即 **C** |\n\n> **老师说**（题型识别）：「
