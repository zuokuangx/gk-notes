么还有人在问基期？**那前面说了那么多没有人问他。\n\n**【选项原文】**\n\n- A. 小于 40%\n- B. 在 40% 至 50% 之间\n- C. 在 50% 至 60% 之间\n- D. 大于 60%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 关键：城镇化率的分母是**常住人口**（不是基期），所以做题要去找\"分母\"——题目已经给了全省常住人口 11521 和珠三角常住人口 6447，其余部分 = 5074。\n- 6447 : 5074 ≈ 1.3 : 1，距离比 = 1 : 1.3，故右侧距离 = 14 × 1.3 = 18.2%，71.4 − 18.2 = 53.2%，落在 50%~60%。\n- \"比上年底增加 175 万人\"\"同比提高 0.70 个百分点\"全是干扰项（时间陷阱的诱饵）。\n- **陷阱类型**：概念陷阱（错把\"基期\"当分母）+ 时间陷阱（175 万、0.70 个百分点都是干扰数据）。\n\n---\n\n## 四、第三部分：其他混合续（平均数、人数比、比重、基期比）\n\n> 老师原话（引入）：\n> 那我看这道题。A 市儿童，他休息日的日均使用电子产品用时是 108.2 分钟，工作日是 88.4 分钟。现在问这个 A 市儿童，它日平均使用电子产品用时是多少分钟？这个是不是混合？是不是分式的混合？它也是，因为你看这 108 跟这个 88 是什么东西？是日平均使用电子产品用时，**它也是个平均数**。他混，根据什么来混呢？**休息日跟工作日来混的**。休息日是两天，工作日是五天，它的混就要看天数的比。为什么要看天数的比？因为**它的分母上是天数**。\n\n### 第 5 题｜A 市儿童 · 日均使用电子产品用时（平均数混合）\n\n**【题干原文】**（画面 `f_0210`、`f_0223`，逐字）\n\n> A 市儿童休息日平均使用电子产品用时 108.2 分钟，工作日 88.4 分钟。\n>\n> A 市儿童日平均使用电子产品用时多少分钟？\n\n**【材料数据】**\n\n| 项目 | 日均用时（分钟） | 天数（分母） |\n| --- | --- | --- |\n| 休息日 | 108.2 | 2 天 |\n| 工作日 | 88.4 | 5 天 |\n| 日平均（加权） | **待求** | 7 天 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | **平均数混合**。日均用时 = 总用时 / 天数，分母是**天数** |\n| **定位数据** | 休息日 108.2 分钟（2 天）；工作日 88.4 分钟（5 天） |\n| **列式** | 分母（天数）比 = 2 : 5 → **距离比 = 5 : 2**（反比） |\n| **速算步骤（线段法）** | ①总距离 = 108.2 − 88.4 = 19.8；② 19.8 按 5 : 2 分 7 份，每份 = 19.8 ÷ 7 ≈ 2.8；③靠 88.4 一侧分得 2 份 = 2 × 2.8 = 5.6；④ 88.4 + 5.6 = **94** |\n| **速算步骤（直接加权）** | `(2 × 108.2 + 5 × 88.4) ÷ 7 = (216 + 442) ÷ 7 = 658 ÷ 7 ≈ 93.7 ≈ 94` |\n| **结论** | 选 **B（94）** |\n\n**板书速算还原（画面 `f_0223`）**：\n\n```\n （基₁ × r₁ + 基₂ × r₂）\n ───────────────────────\n      （基₁ + 基₂）\n\n        2 × 108.2 + 5 × 88.4\n      = ───────────────────\n                 7\n\n        216 + 442      658\n      = ─────────  =  ─────  = 93.x\n            7            7\n```\n\n```\n线段拆分：\n     19.8 ÷ 7 = 2.8\n     2 × 2.8 = 5.6\n   108.2 ├────────┼──────┤ 88.4\n      2 份       5 份\n```\n\n> 老师原话（为什么看天数）：\n> 休息日的日均使用电子产品是等于什么？等于你这两天用时除以这两天的总用时，对不对？然后 88.4 呢，是等于工作日五天，对这个电子产品上的总用时去除以这五天。所以它们的混合就要看它们**分母的反比**，也就是它们**天数的反比**。它们的用时除以天数，就是它们的日均用时。\n> 那 108.2 和 88.4 它们混的位置主要就是看它们的分母的比，分母的比是 2 比 5，所以距离的比就是 5 比 2。那总距离是多少？总距离是 20 左右，19.8。我们要把 19.8 拆成 5 份的两份，一共拆成 7 份，除以 7 就等于 2.8 吧。一份是 2.8，那两份就是 5.6。88.4 把这 5.6 给它加上去，90、94。所以我们选择 B。\n\n> 老师原话（直接算）：\n> 可以直接算的，怎么算？就是 `2 乘以 108 加上 5 乘以 88 除以 7`。上面这个是 216，下面是 440，上面就变成了 656 除以 7，等于……因为刚我这边少算了一点嘛，点 2 跟这个点 4 没了。\n> 当然可以直接乘，你前面的那些什么增速、什么浓度，你也可以乘，只是前面的题目里面你没有基期嘛，你要是有基期，`基期₁ × 增速₁ + 基期₂ × 增速₂`，再除以 `基期₁ + 基期₂`，你也是一样做。只是这个题目，它相当于把这个分母已经给你了，是很好直接算的。\n> 那你这么算，大家肯定也可以。因为本来这个分式混合，它就是从这种关系推出来的，就是从这个结果推出来的。\n\n> 老师原话（盈亏本质）：\n> 而且这个东西就跟盈亏关系也是一样的。我们数学、我们数量关系里面是不是也讲过，**其实线段混合它本质上就是盈亏的关系**，就是这些数跟数、大跟小的沉积的关系。本来就是盈亏，你看 108.2 跟这 94 差了 14.2，右边差了个 2.8，然后这 14.2 才一共是两天，他一共就多出来 28.4。这个人不是 2.8，这个地方是 5.6，这边 5.6，它每天是少 5.6，五天就一共少 28，这样它盈亏就比较相抵，盈亏相抵了才能到一个平均数 94。跟这个算的逻辑，什么都是一样的。\n\n> 老师金句：\n> 然后你这样一比一看，你看你有没有答案，你有答案你就选，要是选了之后他没给你分，你就跟他吵。**我就跟他吵，你说你这个儿童凭什么是双休？**\n\n**【选项原文】**\n\n- A. 91\n- B. 94\n- C. 98\n- D. 102\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 分母是天数 → 距离比 = 天数反比 = 5 : 2，混合物靠近天数多的一侧（工作日 88.4）。\n- 总距离 19.8，按 5 : 2 拆分：每份 2.8，靠 88.4 侧 2 份 = 5.6，88.4 + 5.6 = 94。\n- 直接加权验证：(2 × 108.2 + 5 × 88.4) ÷ 7 = 658 ÷ 7 ≈ 93.7 ≈ 94。\n- **陷阱类型**：概念陷阱。若有选项接近 \"98.3\"（108.2 与 88.4 的简单算术平均），那是\"忘了按权重（天数）加权\"的陷阱。\n\n---\n\n### 第 6 题｜2019 年 · A 市居民收入与消费 · 城镇居民与农村居民人数之比\n\n**【题干原文】**（画面 `f_0232`，逐字）\n\n> 2019 年，A 市居民人均可支配收入 28920 元，比上年增长 9.6%。按常住地分，城镇居民人均可支配收入 37939 元，农村居民人均可支配收入 15133 元。全市居民人均消费支出 20774 元，比上年增长 7.9%。按常住地分城镇居民人均消费支出 25785 元；农村居民人均消费支出 13112 元。全市居民恩格尔系数为 32.1%，比上年下降 0.2 个百分点。其中城镇为 31.2%，农村为 34.9%。\n>\n> 2019 年城镇居民与农村居民人数之比为？（　）\n\n**【材料数据】**\n\n| 指标 | 全市 | 城镇 | 农村 |\n| --- | --- | --- | --- |\n| 人均可支配收入（元） | 28920（+9.6%） | 37939 | 15133 |\n| 人均消费支出（元） | 20774（+7.9%） | 25785 | 13112 |\n| 恩格尔系数 | 32.1%（下降 0.2 个百分点） | 31.2% | 34.9% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 求**人数比**，但材料**没有给任何人数**——只能找\"分母是人数\"的分式（人均值） |\n| **思路** | 人均可支配收入 / 人均消费支出 / 恩格尔系数，三者的分母都与人数有关 → 用分式混合反推人数比 |\n| **①人均可支配收入法** | 取整：城镇 38000、全市 29000、农村 15200；城镇距混合点 = 38000 − 29000 = **9000**；农村距混合点 = 29000 − 15200 = **13800**；距离比 9 : 13.8 ≈ **2 : 3** → 分母（人数）比 = **3 : 2** |\n| **②人均消费支出法** | 取整：城镇 25800、全市 20800、农村 13200；城镇距混合点 = 5000；农村距混合点 = 7600；距离比 5000 : 7600 ≈ **2 : 3** → 人数比 = **3 : 2**（结论相同） |\n| **③恩格尔系数法（拔高）** | 全市 32.1%、城镇 31.2%、农村 34.9% → 左距离 0.9%、右距离 2.8% → 距离比 **1 : 3** → 分母（**总支出**）比 = **3 : 1**；而人均支出比 = 25800 : 13200 ≈ 2 : 1 → 人数 = 总支出 ÷ 人均支出 =（3 ÷ 2）：（1 ÷ 1）= **3 : 2** |\n| **结论** | 人数比 = 3 : 2，选 **B** |\n\n**板书速算还原（画面 `f_0250`、`f_0262`、`f_0280`）**：\n\n```\n①人均可支配收入：\n    城           A市          农\n   3.8w        2.9w        1.52w\n        └ 9000 ┘└ 13800 ┘\n        距离比  9 : 13.8  ≈  2 : 3\n        人数比           =  3 : 2\n```\n\n```\n②人均消费支出：\n   25800        20800        13200\n        └─ 5000 ─┘└─ 7600 ─┘\n              2   :   3\n        人数比 3 : 2\n```\n\n```\n③恩格尔系数：\n   食品支出 / 总支出  =  31.2%        32.1%        34.9%\n                         └ 0.9% ┘└ 2.8% ┘\n                          1  :  3\n             总支出比  3 : 1\n   人数 = 总支出 / 人均支出\n   人数比 = 3/2 : 1/1 = 3 : 2\n```\n\n> 老师原话（为什么要找人均值）：\n> 城镇居民跟农村居民的人数比是什么？那上面有没有给人数？那上面是不是一个跟人数有关的数据都没有？我看不到人数，没有现期，没有增速，我看不到，没有人数。\n> 那怎么办？那我们就只能去找**跟人数有关的数据**。那什么数据跟人数有关呢？**人均值呗**。人均值它的分母不就是人数吗？\n> 有分母有分式，我们要找的是**分母的比**，它给了分式的关系，那我们是不是就可以用分式混合了呀？对，所以一般这种问人数比的，他绝大多数都在考你这个分式混合。你只要找到这个分式，**分母是人数的就行了**。\n\n> 老师原话（为什么要凑整 / 整体平移）：\n> 整个居民人均可支配收入可以吧？它是由什么组成的？城镇的跟农村的混合的。城镇的是 37900，农村的是 15001（画面为 15133）……\n> 城镇的可支配收入，我们取个整，38000 左右吧。农村的 15200。那全市的城镇跟农村合起来，是不就是全市的？全市的就给取回去两万九。\n> 有没有同学知道我这种为什么写一万五千二？我没有写那个一万五千，我们为什么没有把它四舍五给他舍掉？这个跟我们上一节数量关系课上讲的一个东西是有关的。就是**线段混合，你可以整体一起往上移或者一起往下移，跟它的距离比、基期比、分布比都没有任何的影响，可以整体平移。**\n> 所以这个地方我把 37900、28900 都往上提了，那我这个 15100 我顺便也往上提一点，我也给他凑个整。\n\n> 老师原话（9 : 13.8 怎么看）：\n> 那距离比是？左边是 9000，右边是 13000（板书 13800），所以距离比就是 9 比 13.8，大概就是二比三的关系。这能看出来吧？9 乘以 1.5 是 13.5。\n> 二比三，那既然距离比是二比三，说明他们的那个分母，就人均收入的分母，是 3 比 2。他们的分母就是人数，所以他们的人数比就是 3 : 2。\n\n> 老师原话（换分式也能算）：\n> 那这个题目我拿消费支出能不能算？肯定也能算，也是一样的，也一样能算三比二。\n> 我要支出来给你算一遍：全市的、城镇的、农村的，也就 20800、25800、13200 可以吧。距离左边是 5000，城镇这边距离是 5000；农村这边的距离是 7600。他们的距离比试还是 2:3，说明他们的分母比就是 3 比 2。\n> 这边分母是不是还是人数？它是等于什么？人均消费支出等于你的总支出除以你的人数。**分式的距离比等于分母的反比。**\n\n> 老师原话（三比二怎么看出来的）：\n> 三比二怎么看出来的？熟嘛。50 是 25 的两倍，76 差不多是 25 的三倍，75 嘛。\n> 93.8（应为 13.8）怎么快速看出来的？你先减一下，13.8 减 9，减下来是 4.8，4.8 是不是差不多就是 9 的一半啊？\n\n> 老师原话（恩格尔系数也能做 · 拔高补充）：\n> 有同学问恩格尔系数能不能做？也能做，都能做。恩格尔系数：全市 32.1%、城镇 31.2%、农村 34.9%。我为什么这么肯定他能做呢？因为我知道恩格尔系数，**它肯定跟人也是有关的**。\n> 左边右边距离分别是多少？左边是 0.9%，右边是 2.8，对不对？好，可能他看到这边要笑了，老师翻车了，这不是二比三，这也不是三比二。别着急，这个地方算下来是什么距离比？是不是一比三？这个一比三说明他们的分母比是三比一吧。这个三比一是什么？是他们的分母，对不对？他们分母是什么？**恩格尔系数的分母是什么？是食品支出除以总支出。**\n> 所以我们从这个距离的一比三，我们能知道**城镇乡村他们的总支出的比是 3 比 1**。我有人均支出，我还算不出来人数吗？人均支出不在这吗？人均支出比是 2:1。所以**人数等于总支出除以人均，所以人数比就等于你总支出的比除以人均的比，就等于 3 除以 2 比上 1 除以 1，等于 3 比 2**。是不是也可以？跟人有关吗？在分母上，又能把它搞出来。\n> 当然这种后面这个东西你其实不用太去记了，我感觉应该不会有资料分析的出题人，他会去拿恩格尔系数去算人数比。他要是拿恩格尔系数去算人数比，这个题目的正确率我估计可能就百分之二十了。因为很多同学他可能说不知道怎么拿恩格尔系数去算人数比，这谁看得出来，很难看出。\n> 一般来说你就记得，**就拿这个人均收入、人均支出直接去看他们的分母，他们的分母是人数。找到分母上直接带有人数的均值，去看它混合的距离比就可以了。**\n\n**【选项原文】**\n\n- A. 2 : 3\n- B. 3 : 2\n- C. 3 : 4\n- D. 4 : 3\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 材料完全没有人数，只能用\"分母是人数\"的分式（人均收入 / 人均支出 / 恩格尔系数）。\n- 人均可支配收入：38000 / 29000 / 15200 → 距离 9000 : 13800 ≈ 2 : 3 → 人数比 = 3 : 2。\n- 人均消费支出：25800 / 20800 / 13200 → 距离 5000 : 7600 ≈ 2 : 3 → 人数比 = 3 : 2（互相印证，答案唯一）。\n- 恩格尔系数：距离 0.9% : 2.8% = 1 : 3 → 总支出比 3 : 1，再除以人均支出比 2 : 1 → 人数比 3 : 2。\n- **陷阱类型**：概念陷阱（不知道去\"分母\"里找人数）+ 单位陷阱（把\"元\"当比重）。注意：城镇 > 农村，所以人数比 3 : 2 意味着城镇人少（人多钱少的那一方权重小、离混合点远）。\n\n---\n\n### 第 7 题｜公共场所示范问卷 · 受访女性市民人数占比\n\n**【题干原文】**（画面 `f_0290`，逐字）\n\n> 对\"公共场所控烟条例修订及立法\"问题的调查结果显示：95.2% 的受访市民表示支持，2.9% 的表示不支持，1.9% 的表示无所谓；97.0% 的女性受访市民表示支持，92.7% 的男性市民表示支持。\n>\n> 本次调查中受访女性市民人数占受访总人数的比重是：\n\n**【材料数据】**\n\n| 项目 | 支持率 |\n| --- | --- |\n| 全体受访市民 | 95.2% |\n| 女性受访市民 | 97.0% |\n| 男性受访市民 | 92.7% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 求**人数占比** = 求人数比。分母是\"人数\"的分式是**支持率**（支持人数 ÷ 该类总人数） |\n| **定位数据** | 女性 97.0%、男性 92.7%、总体 95.2% |\n| **列式** | 左距离 = 97 − 95.2 = 1.8；右距离 = 95.2 − 92.7 = 2.5 → 距离比 1.8 : 2.5 = **18 : 25** → 人数比 = **25 : 18**（女性人数 25 份，男性 18 份）……⚠️ 见下方说明 |\n| **速算步骤** | 女性占总人数 = 25 ÷（25 + 18）= 25 ÷ 43 ≈ **58%**，选 **C** |\n| **结论** | 选 **C（58.1%）** |\n\n> 说明：板书把\"距离比 18 : 25\"与\"人数比 25 : 18\"对应写为 `18 : 25` 与 `95.2%` 混合下女 18 份 / 男 25 份关系，最终计算式为 `25 ÷ (25 + 18) = 25 ÷ 43`，即**女性人数占比为 25/43 ≈ 58%**。画面板书原文为 `= 25/(25+18)`、`= 25/43`、`女 97 / 1.8 / 18 / 25`、`男 92.7 / 2.5 / 18`、`18 : 25`。\n\n**板书速算还原（画面 `f_0305`、`f_0310`、`f_0315`）**：\n\n```\n女性支持率 = 女性支持人数 / 女性人数\n男性支持率 = 男性支持人数 / 男性人数\n                （分母 = 人数）\n\n        女         总        男\n      97.0%      95.2%     92.7%\n          └─ 1.8 ─┘└─ 2.5 ─┘\n            18   :   25\n   人数比：25 : 18\n\n   女性占比 = 25 ÷ (25 + 18) = 25 ÷ 43 ≈ 58%  → C\n```\n\n> 老师原话：\n> 他问的是什么呢？在本次调查中，受访女性的市民人数占总人数的比重是多少？这是个算一个人数占比。\n> 可能有的就想不到了，说这个地方没有人数，他也不是我人数比，咋回事呢？人数占总人数的占比，这不就是算人数比吗？你有人数比，你还不知道占总人数的占比吗？\n> 跟刚刚的题目是一样的，**你只要能算出来女性和男性的人数比，你就能知道女性在总人数里面的占比。**\n> 所以我们还是去找什么？找带有男性女性人数的分式，哪个是的？**支持率吧**。这不是支持率嘛。97% 的女性支持，92.7% 的男性支持。这个 97% 是支持率，就是你支持的女性除以女性的总人数；右边就是支持的男性除以男性的总人数。你看他们的分母是不是就是我们要找的？女性的人数跟男性的人数，你有他们的比例，你就能知道总人数的占比了吧。\n> 好，然后下面是找什么呢？找女性男性他们表示的支持率的总体情况。南边的总体情况在这儿 95.2%，所以女性 97%、男性 92.7% 混合起来之后是 95.2%，左右两边距离是 1.8，右边的距离是 2.5，所以距离比是 18:25。\n> 所以占总人数的比重就是 `25 除以总人数（25+18）= 25 除以 43`。这个大概算一下，25 除以 43，下面减 3，上面减个 1.8，也就二十三点二，除以 40，230 除以 4 就是 60 不到，所以选 C。对，到不了六，又差一点。\n\n> 老师原话（变式提问 · 一定要留意）：\n> 那如果这个题目，比如说他问的不是受访……这边也要注意一下，万一他换个问法，他创新了，**支持的女性市民人数占支持总人数的比重**咋办？他问的不是分母了，他问的是**分子**的占比了，咋整？\n> 如果他问的是分子——支持的女性市民人数……**你不是都有他们总人数的比了吗？你乘以 97% 呗**。这不就是他们的支持人数比吗？你乘个这百分数不就好了吗？你乘了这个百分之九十二点七，不就得到他的这个分子了吗？我以为想太多了。\n\n**【选项原文】**\n\n- A. 36.7%\n- B. 41.9%\n- C. 58.1%\n- D. 63.3%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 支持率的分母是\"该类受访者总人数\" → 支持率可以直接做线段混合。\n- 距离：女 97.0 − 95.2 = 1.8；男 95.2 − 92.7 = 2.5；距离比 1.8 : 2.5 = 18 : 25 → 人数比 = 25 : 18（女性人数更多，所以女性支持率更靠近总体支持率）。\n- 女性占总人数 = 25 ÷ 43 ≈ 58%，选 C。\n- **陷阱类型**：概念陷阱（看不到\"人数\"，想不到去找支持率的分母）+ 变式陷阱（问\"分子占比\"要先乘支持率）。\n- 变式：若问\"支持的女性市民人数占支持总人数的比重\"，则算式为 `25 × 97% ÷ (25 × 97% + 18 × 92.7%)`（画面 `f_0315` 板书即写 `25 × 97%`、`18 × 92.7%`）。\n\n---\n\n### 第 8 题｜2015 年 1—6 月 · 国内手机市场出货量 · 基期比\n\n**【题干原文】**（画面 `f_0323`，逐字）\n\n> 2015 年 1—6 月，国内手机市场出货量 2.37 亿部，同比增长 7.4%。其中，2G 手机增长 6.0%；3G 手机下降 90.6%；4G 手机增长 381.8%。第 1、2 季度国内手机市场出货量分别增长 6.7% 和 8.2%。\n>\n> 2014 年第 1 季度与第 2 季度国内手机市场出货量比值是多少？\n\n**【材料数据】**\n\n| 项目 | 同比增长率 |\n| --- | --- |\n| 2015 年 1—6 月国内手机市场出货量 | 2.37 亿部，+7.4% |\n| 其中：2G 手机 | +6.0% |\n| 其中：3G 手机 | −90.6% |\n| 其中：4G 手机 | +381.8% |\n| 第 1 季度 | +6.7% |\n| 第 2 季度 | +8.2% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 求**基期比**。只给增速、不给量 → 必然考\"分母与分式的混合成反比\"（增速的分母就是基期） |\n| **定位数据** | 一季度 6.7%、二季度 8.2%、上半年（混合）7.4% |\n| **列式** | 一季度与二季度混合成上半年 → 左距离 = 7.4 − 6.7 = 0.7；右距离 = 8.2 − 7.4 = 0.8 → 距离比 7 : 8 → **基期比 = 8 : 7** |\n| **速算步骤** | 一季度基期 : 二季度基期 = 8 : 7 → 比值 = 8 ÷ 7 ≈ **1.143** |\n| **结论** | 选 **C（1.14）** |\n\n**板书速算还原（画面 `f_0330`）**：\n\n```\n   6.7%        7.4%        8.2%\n        └─ 0.7 ─┘└─ 0.8 ─┘\n   （板书：6.7 / 7.4 / 8.2 ；0.7 / 0.8）\n\n   距离比 = 7 : 8\n   基期比 = 8 : 7\n   比值 = 8 ÷ 7 = 1.14\n```\n\n> 老师原话：\n> 他问你 2014 年一季度跟二季度这个手机市场出货量的比值多少？然后一看这个题目，第一季度第二季度手机市场出货量增长 6.7%、8.2%。哎呦，然后一看抓瞎了。他只给了增速，这不是个基期比的问法吗？\n> 这个基期比它只给增速，它没有给现期值，我怎么算得出来这个基期比？他都没给我什么现期比，我光有增速怎么算基期比啊？\n> 如果他真的什么信息都没给你，说明他在考察什么呢？就是考察**分母跟分式的混合成反比**。你去找他们俩混合的增速是什么情况就好了。因为这个增速的分母就是基期。\n> 这个跟有人问你人数比有什么区别吗？没有区别。问你人数比给你人均值，他不需要给你人数，给你人均值就好了。问你基期比，他也不给你量，他也是给你增速嘛，增速这个分式的分母不就是基期嘛。\n> 所以我们去找这个 6.7 和这个 8.2 混合的增速是什么？就是一季度跟二季度混合起来是什么？是一到六月上半年，增速是 7.4%。对，没有量，你就可以考虑他是不是在让你去算什么分母比。\n> 这个地方距离是 0.7，右边的距离是 0.8，距离比是 7:8，说明基期比是 8:7。就是第一季度的基期是 8，第二季度基期是 8 份的 7 份，所以比值就是 8 除以 7 等于 1.143。是的。\n> 所以我拿这几道题上来，主要就是带你稍微过一下，你知道他可能这么考你，要是考到了，你就赚到了。就是他会去问你题干里面存在的一些分式的分母的比值，他又不给你那些他问的东西的量的时候，你就要注意了，去找那些带有这些概念的这个分式，他在分母上呢，你就去找他。\n\n**【选项原文】**\n\n- A. 0.75\n- B. 0.88\n- C. 1.14\n- D. 1.81\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 一季度 + 二季度 = 上半年（1—6 月），三者构成混合关系。\n- 距离：7.4 − 6.7 = 0.7；8.2 − 7.4 = 0.8 → 距离比 7 : 8 → 基期比 8 : 7。\n- 8 ÷ 7 ≈ 1.143，选 C（1.14）。\n- 若误把距离比当成基期比，会算出 7 ÷ 8 = 0.875 ≈ 0.88（选项 B 就是为这种\"忘了反比\"设的坑）。\n- **陷阱类型**：概念陷阱（方向反了，把 7 : 8 直接当答案 → 误选 B）+ 范围陷阱（D 1.81 是把 7 : 8 反向再放大）。\n\n---\n\n### 第 9 题｜2014 年 · 全国居民人均可支配收入 · 城镇居民人数占比\n\n**【题干原文】**（画面 `f_0352`，逐字）\n\n> 2014 年全国居民人均可支配收入 20167 元，比上年增长 10.1%。按常住地分，城镇居民人均可支配收入 28844 元，比上年增长 9.0%；城镇居民按户人均可支配收入的中位数为 26635 元，增长 10.3%。农村居民人均可支配收入 10489 元，比上年增长 11.2%，农村居民按户人均可支配收入的中位数为 9497 元，增长 12.7%。\n>\n> 2014 年全国城镇居民人数占全国居民人数的比重是：\n\n**【材料数据】**\n\n| 项目 | 数值 | 同比增速 |\n| --- | --- | --- |\n| 全国居民人均可支配收入 | 20167 元 | 10.1% |\n| 城镇居民人均可支配收入 | 28844 元 | 9.0% |\n| 城镇居民按户人均可支配收入的中位数 | 26635 元 | 10.3% |\n| 农村居民人均可支配收入 | 10489 元 | 11.2% |\n| 农村居民按户人均可支配收入的中位数 | 9497 元 | 12.7% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 人数占比 → 先求人数比。找\"分母是人数\"的分式 = **人均可支配收入** |\n| **定位数据** | 城镇 28844（取整 2.89 万）、全国 20167（取整 2.02 万）、农村 10489（取整 1.05 万） |\n| **列式** | 城镇距混合点 = 28900 − 20200 = **8700**；农村距混合点 = 20200 − 10500 = **9700** → 距离比 **87 : 97** → 分母（人数）比 = **97 : 87** |\n| **速算步骤** | 城镇人数占比 = 97 ÷（97 + 87）= 97 ÷ 184 ≈ **52.7%** |\n| **结论** | 选 **C（52.7%）** |\n\n> ⚠️ 注意：板书取整用的是 `2.89万 / 2.02万 / 1.05万`（画面 `f_0352` 板书写 `2.89w`、`2.02w`、`1.05w`，下方写 `8700`、`9700`），答案不变。\n\n**板书速算还原（画面 `f_0352`、`f_0347`）**：\n\n```\n    城           全国          农\n   28800        20200        10500\n        └─ 8700 ─┘└─ 9700 ─┘\n          87   :   97\n   人数比  97 : 87\n\n   城镇占比 = 97 / (97 + 87) = 97 / 184 ≈ 52.7%\n```\n\n> 老师原话：\n> 这个题目难倒是不难，就跟我们刚刚做的那个人数比的问题是一样的，就是他问我们这个城镇占全国居民人数的比重，这题目做还是比较简单的。就是问人数比，他没有给人数，我们去找什么？找人均值。人均值在这——**人均可支配收入**。\n> 农村居民可支配收入也不需要去管后面那个增速，全国居民人均可支配收入有，是不是有这三个数，我们就能算了。\n> 所有的，是 20167。城镇是我给他凑一下整吧，也算那么多位数了。20200、28900、10500 可以吧？\n> 城镇跟混合后的这个结果的距离是 8700，农村混合后的距离是 9700，是的吧？他们的混合距离比是 87 : 97，那距离比就是他们分母的反比，他们的分母是人数，所以他们的人数比就是 97 : 87。\n> 那城镇的占比就是 97 除以（97 + 87），等于 97 除以 184。那这个还是比较能够看出来，容易看出来吧？它就是一半多一点吧。所以选择 C，52.7%。这个题目难不难？我们刚刚也学过了，都知道怎么做了。\n\n**【选项原文】**\n\n- A. 36.4%\n- B. 42.1%\n- C. 52.7%\n- D. 69.9%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 人均可支配收入的分母是人数 → 城镇 / 全国 / 农村三个数可以构成线段混合。\n- 距离：28900 − 20200 = 8700（城镇侧）；20200 − 10500 = 9700（农村侧）→ 距离比 87 : 97 → 人数比 97 : 87。\n- 城镇占比 = 97 ÷ 184 ≈ 52.7%。\n- 合理性检查：城镇人均收入高得多，但人数占比只有一半多（52.7%），符合\"人多钱少\"的常识。\n\n> ⭐ **本题最重要的陷阱：千万不要拿\"增速\"去混！**\n>\n> 老师原话：\n> 但是这个题目有些人他错在什么地方呢？**他去找这个东西了**，他说我知道做人数比是分式混合，一看全国、农村、城镇给增速了，他习惯性地拿增速去混了。那不对，一混你又混错了。\n> 你看：城镇 9.0%、农村 11.2%、全国 10.1%。`10.1 − 9.0 = 1.1`，`11.2 − 10.1 = 1.1`，距离比是 1 : 1。\n> 那这个一比一是什么呀？**这个题目他问你的是人数，你去找这个增速干什么呢？这个增速跟人数有什么关系？**\n> 有人说基期不是……这个\"一比\"啥也不是。它什么也不是。因为**这个百分之九和百分之十一点二，它们本身并不能混合，和百分之十点一之间是不存在混合关系的。**\n\n**为什么\"分式的分式\"不能再混合（核心原理）**：\n\n```\n人均可支配收入 = 总收入 / 总人数\n总收入 = 城镇收入 + 农村收入        ✔ 分子可直接相加\n总人数 = 城镇人数 + 农村人数        ✔ 分母可直接相加\n→ 所以人均可支配收入可以线段混合\n\n但是：\n全国人均可支配收入增速 = 全国人均增量 / 全国人均基期\n而  全国人均增量 ≠ 城镇人均增量 + 农村人均增量   ✘\n（人均值本身已经是混合出来的结果，增量不能直接相加）\n→ 所以\"人均值的增速\"不符合线段混合的推导逻辑\n```\n\n> 老师原话（原理）：\n> 我们再来想想看，我们刚刚说的混合是什么情况下能混合？为什么这个人均可支配收入它可以混？因为你这两分式，它的**分子分母都可以直接相加**。\n> 比如说人均可支配的是不是等于总收入除以总人数？总收入等于城镇的收入加农村的收入，对不对？总人数等于城镇的人数加上农村的人数。那你说这个增速它能这么算吗？\n> 你这个全国人均可支配收入增速等于什么？等于你全国人均的增量除以全国人均的基期，那你能说这个全国人均的增量，它等于城镇人均增量加农村人均增量吗？**不能。** 因为你这个人均值，它本身就是混合关系。\n> 现在能理解了吧？因为它**不能写成这种\"分子相加、分母相加做除法\"的形式**，所以它们就不符合线段混合的推导逻辑，那些推导的式子它算不下去。所以它就不符合线段混合关系。\n\n⭐ 老师金句：\n\n> **我有个说法，就叫做\"分式的分式，它就不符合线段混合关系\"。**\n> 你这个 10.1% 本身就是这个分式的增速了，你就不要去那么去想了。\n\n> 老师原话（定性都不行）：\n> 千万不要把这个增速还当做跟那个量有关系。它跟线段混合没有半毛钱关系，包括我说的再准确一点，**连什么定性它都定不下来**。\n> 就比如说，城镇人均增速 9%，农村人均增速 11.2%，你能不能说明全国的增速一定在 9% 跟 11.2% 之间？**其实这个甚至都是不可以的**，从数学上来讲，都是不一定的，不一定能推出它一定在 9 跟 11.2 之间。\n\n> 老师原话（甲部门乙部门 · 反例）：\n> 你要是不信，你以后有一道数量关系的题，两边刷题里面你能碰到，你会发现什么呢？举个例子：甲部门、乙部门。甲部门全是老头，乙部门全是年轻人。这是个很经典的例子，然后你把甲部门里面最年轻的两个人送到乙部门去。\n> 就是我甲部门把年轻的送出去了，我的平均年龄是不是上升了？**这部分（乙部门）的平均年龄是不是也上升？他们的总平均年龄是不是不变？**\n> 你这个增速大于零，这个增速大于零，你这个合起来增速怎么不变呢？就是因为**它们本身它就不符合线段混合关系**，所以它们整体的增速**可大可小**。\n> 所以千万千万不要再拿这种人均这种分式值的增速去算线段混合了，**你怎么算都是错的。**\n\n---\n\n## 五、第四部分：多对象混合的正确处理\n\n> 老师原话（引入）：\n> 好了，然后就来到我们今天最后一个环节了。这边还有一个题，这个题特殊一点，我放在这边单独讲一下。这个题也经常有人问，有同学问老师，这个题目我怎么用线段混合做不出来呢？会很奇怪。\n\n### 第 10 题｜2022 年 · 我国中式成药出口 · 第四季度出口金额同比增速（多对象）\n\n**【题干原文】**（画面 `f_0405`，逐字）\n\n> 2022 年第四季度，我国中式成药出口金额同比增速约为（　）。\n\n**【材料数据】**（画面表格原文，逐字抄录）\n\n**2022 年我国中式成药出口数量和金额**\n\n| 时间 | 出口数量（吨） | 同比增长（%） | 出口金额（万美元） | 同比增长（%） |\n| --- | --- | --- | --- | --- |\n| 2022 年 1-2 月 | 1741 | 0.5 | 5910 | 27.9 |\n| 2022 年 3 月 | 1427 | 83.9 | 6470 | 202.9 |\n| 2022 年 4 月 | 739 | −18.5 | 2070 | −35.2 |\n| 2022 年 5 月 | 897 | −7.3 | 2760 | 15.7 |\n| 2022 年 6 月 | 1128 | 52.9 | 3480 | 87.6 |\n| 2022 年 7 月 | 1112 | 9.1 | 2290 | 9.3 |\n| 2022 年 8 月 | 1100 | 8.4 | 3150 | 19.5 |\n| 2022 年 9 月 | 1197 | −1.4 | 2840 | −4 |\n| 2022 年 10 月 | 1019 | 2.9 | 2010 | −29.8 |\n| 2022 年 11 月 | 1259 | 31.9 | 3390 | 48.4 |\n| 2022 年 12 月 | 1242 | −0.5 | 3390 | −1.6 |\n\n> 本题求\"**第四季度出口金额**同比增速\"，即 10 月 + 11 月 + 12 月三个月**出口金额**的混合增速。三个月出口金额为 2010 / 3390 / 3390 万美元，对应增速 −29.8% / 48.4% / −1.6%。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 多对象（3 个）混合增速 |\n| **错误做法（老师当场演示）** | ①发现 11 月、12 月出口金额\"正好相等\"（都是 3390），于是直接取两者增速中间值 `(48.4 + (−1.6)) ÷ 2 = 46.8 ÷ 2 = 23.4`；②再用 23.4% 与 10 月的 `−29.8%`（对应 2010）混合 → **算错** |\n| **错在哪** | \"你拿的是两个**现期**在比，他们的**基期**差太多了。\"增速的距离比 = **基期**的反比，11 月 / 12 月虽然现期都是 3390，但增速 48.4% 与 −1.6% 天差地别，**基期比应为 2 : 3**（3390/1.484 : 3390/0.984 ≈ 2 : 3）。\\n> 老师原话：\"你要给他们的现期比一比一，给这个十二月份去补百分之五十。\" |\n| **正确做法** | **对象 ≥ 3 个时，不要用线段混合**，老老实实：①先算每个对象的**基期**；②再算每个对象的**增量**；③ `增量合计 ÷ 基期合计 = 总体增速` |\n| **结论** | 见讲义解析（老师未在视频里算完） |\n\n**正确做法流程（板书 `>2` · 画面 `f_0447`）**：\n\n```\n前提：混合对象 > 2 个（三个或三个以上）\n\n① 先把每个对象的基期算出来\n     基期 = 现期 ÷ (1 + 增速)\n② 再把每个对象的增量算出来\n     增量 = 现期 − 基期\n③ 增量合计 ÷ 基期合计 = 总体增速\n\n（有限期，现期相加还不好加吗？三个资料全算出来，一加就知道增速了）\n```\n\n> 老师原话：\n> 有人他这么做的，大家来看看他这个做法错在哪。他说，哎，2022 年第四季度，我国中式成药出口金额同比……那四季度嘛，就是十月十一月十二月对不对？你看三个东西，要把他们的增速混起来吧。你看三千三，正好相等，这个增速混合简单，去他们的中间值：48.4、负 1.6，先把他们俩混起来，混他们的平均值是 46.8 除以 2 = 23.4。再跟这个 2000 的百分之负的 29.8 去混，然后就算错了。\n> 这么多的问题，就是你拿的是两个现期在比，他们基期差太多了。**增速的距离比是等于基期的反比，他们基期差很多，差了 50 个点。准确来说，他们的基期比应该是 2:3。**\n> 因为这个二比三能不能很快地说出来？现在应该没问题。因为你要给他们的现期比一比一，给这个十二月份去补百分之五十。\n> 那这个题目怎么做呢？这三个东西怎么混的？难道我们要把基期比先算出来，说这边基期比是 2:3，然后我就把这个增速混一下，然后这个东西搞出来之后，我再去跟这个两千去算个基期比再去混一下？**不要。**\n> **这种涉及多个对象的，你只要这个对象大于二——有三个或者三个以上对象的，算他们的整体增速，你不要用混合，你就老老实实给我算它的基期，算它的增量**，你把它的增量算出来，去算它总体的增速就好了。你就统一地去把他们的资料算出来，你有限期，那现期相加还不好加吗？你只要把他们三个资料全算出来，一加不就知道增速了吗？这么做，这个题目就是这么做的。你要是用其他东西做的话，我觉得也麻烦，没办法。\n> 因为线段混合它本身就不是一个那种非常好的、去帮你去减少计算的东西。大家再回过头再看看，很多他考这个线段混合的东西呢，它都是给你专门设置的去考察的。他没有给你什么现期值啊，是不是他不给你什么总人数啊。甚至你看像这个题目，**你如果发现用线段混合还没有直接算来得快**。\n> 所以有些它没有那么\"线段混合\"的题——那种线段混合不是很简单很直接能出结果的那种题，你就老老实实地把它的资料给我算出来得了，真的。\n\n> 老师原话（讲义与作业说明）：\n> 这个算呢，要不要我在这边算一下？我感觉算这个东西吧，算三个资料，我也有点浪费客人的时间。你们要不就看一下那个解析，下那个增量怎么算呢？这不算了吧，有点浪费时间，因为搞得有点晚，我就再跟你强调一下。**你们可以直接看一下解析、讲义那边是怎么算的**，其实就行了。\n> 就是多对象的混合，**你不要想着搞什么线段混合了**，没必要，好算的，你就直接算就好了。你先把它增量算出来。\n\n**【选项原文】**\n\n- A. −6%\n- B. −2%\n- C. 2%\n- D. 6%\n\n**【答案】** （视频中未板书最终数值，老师明确让学员\"看讲义解析\"。板书记录的顺序为 **B → 田/ D 划掉 → C**，画面 `f_0446`、`f_0447` 可见老师在 B、C、D 上做记号，最终圈选 **C**，画面显示为 `C`）\n\n> ⚠️ 存疑标注：本题视频中**未完整演示计算过程**，只在表格上做了标记并最终圈出 **C（2%）**。若以画面圈选为准，答案为 **✅ C**。\n\n**【解析】**\n\n- 三个月出口金额分别为 2010、3390、3390 万美元，增速分别 −29.8%、48.4%、−1.6%。\n- 11 月与 12 月现期相等（都 3390），但增速一正一负，**基期比为 2 : 3**，不能直接取算术平均 23.4%。\n- 正确做法（多对象直接算）：\n\n```\n① 基期：\n   10 月基期 = 2010 ÷ (1 − 29.8%) = 2010 ÷ 0.702 ≈ 2863\n   11 月基期 = 3390 ÷ (1 + 48.4%) = 3390 ÷ 1.484 ≈ 2284\n   12 月基期 = 3390 ÷ (1 − 1.6%) = 3390 ÷ 0.984 ≈ 3445\n② 四季度出口金额（现期） = 2010 + 3390 + 3390 = 8790\n   四季度基期合计 ≈ 2863 + 2284 + 3445 = 8592\n③ 增速 = 8790 ÷ 8592 − 1 ≈ 2.3%  →  选 C（2%）\n```\n\n> 说明：上式中的具体数值为按题干数据推算的过程展示，**老师在视频中未逐步写出**（他只强调\"直接算增量\"的思路）。此处仅还原方法，不作为板书原文。\n\n- **陷阱类型**：概念陷阱（用现期比代替基期比 → 11、12 月误取平均）+ 方法陷阱（3 个对象还想用线段混合）。\n\n---\n\n## 六、第五部分：拉平增长率求准确基期比（精算）\n\n> 板书标题页（画面 `f_0442` 附近）：`04 混合与拉平`\n\n板书写在标题下方（画面 `f_0445`）：\n\n```\n定量 —— ① 现期比 → 不准\n        ② 代入 → 排除\n        ③ 基期比\n```\n\n| 定量方法 | 特点（板书 / 老师原话） |\n| --- | --- |\n| ① 现期比（代替基期比） | **快，但不太准** |\n| ② 代入选项 | **依赖排除选项**，选项排不掉时不好用 |\n| ③ 准确基期比（拉平） | **又准又不用一个个试**，但要算基期 |\n\n> 老师原话：\n> 最后一块呢就是相对来说主要还是对于定量计算的一个思路。有些时候你定量，我们前面讲的定量是什么？我们讲了两个：\n> 一个是**现期比**，我们用现期比去代替基期比去算，但这个方法有个缺点，就是**不太准**，相对来说不准，有时候还要控误差，心里面有点不踏实。但它也有它的优点，它的优点就是**快**，它优点是很快。很多时候你如果只是想简单地快速地估一下，用现期比代替基期比绝对是好的。但有时候你要算得准确的话，就不用这个办法了。\n> 还有我们刚说的第二种，**代入选项**。但是它的缺点呢就是，你要是选项一个都排不掉，四个选项全在那放着，你也不知道带哪一个，你要带了好多次吧，也挺麻烦的，对不对？**它依赖于排除选项。**你要是选项排的少，他这个方法就不好。\n> 那咋办呢？那我在定量上怎么去进一步地让它又准又不用一个个去试呢？那我们就用**准确的基期比**。就把它对应的基期比给它估出来，那么涉及到基期比的计算就涉及到有时候你就去**拉平**，把它基期搞出来不就好了吗？\n\n---\n\n### 第 11 题｜2023 年一季度 · 新疆外贸 · 进口值同比增速\n\n**【题干原文】**（画面 `f_0455`，逐字）\n\n> 2023 年一季度，新疆外贸进出口总值 680.7 亿元，同比增长 80.3%。其中，出口 584.7 亿元，同比增长 86.9%。\n>\n> 2023 年一季度，新疆外贸**进口值**同比增长约：\n\n**【材料数据】**\n\n| 项目 | 2023 年一季度（亿元） | 同比增长 |\n| --- | --- | --- |\n| 新疆外贸进出口总值 | 680.7 | 80.3% |\n| 其中：出口 | 584.7 | 86.9% |\n| 进口 | 680.7 − 584.7 = 96.0 | **待求** |\n\n> 老师说明：\"这个题目你们讲义上没有啊，我也把它放下来了，因为这个题目也是经常被人问的一道题，我顺便在这边也讲了，省得你们后面一个个问我了。\"\n\n**解题流程板书（画面 `f_0455`，逐字）**：\n\n```\n只给出整体与一部分的情况，无法直接判断两部分增速差距\n\n——通过拉平整体和部分增速，精确计算基期比得到精确增速的办法\n\n① 拉平\n② 作差\n③ 得基期比\n④ 计算增速\n```\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **难点** | 只给了整体（进出口 680.7，+80.3%）和一个部分（出口 584.7，+86.9%），**不知道进口的增速离 86.9% 远不远**，所以不敢用现期比代替基期比；选项也不好代 |\n| **思路** | **拉平整体与部分增速**，得到准确的基期比 |\n| **①拉平** | 把整体增速从 80.3% 拉到 86.9%（= 出口增速）。需补的百分点 = 6.6 ÷ 1.8 ≈ **4%**（即 `6.6% / (1 + 80.3%) ≈ 3.7% ≈ 4%`）；现值需增加 `680.7 × 4% ≈ 24` → `680.7 + 24 ≈ 705` |\n| **②作差** | 拉平后，出口 584.7 不变；进口 = 705 − 584.7 ≈ **121**（都对应 86.9% 的增速） |\n| **③得基期比** | `584.7 ÷ 121 ≈ 4.9 倍` → **出口 : 进口 ≈ 4.9 : 1** |\n| **④计算增速** | 出口侧距离 = 86.9 − 80.3 = 6.6%；进口侧距离 = 6.6% × 4.9 ≈ **32.4%**；进口增速 = 80.3% − 32.4% = **47.9% ≈ 48%** |\n| **结论** | 选 **C（48%）** |\n\n**板书速算还原（画面 `f_0481`）**：\n\n```\n  86.9% 环境下：\n   ┌─ 进出口 ─┬─ 出口 ─┬─ 进口 ─┐\n      705        584      121\n\n   6.6% ÷ 1.8 ≈ 4%    （补 4 个百分点）\n   680.7 × 4% ≈ 24   →  680.7 + 24 ≈ 705\n\n   584 : 121 ≈ 4.9 倍   （圈注「4.9倍」）\n\n   6.6% × 4.9 ≈ 32.4%\n   80.3% − 32.4% = 47.9%  ≈ 48%\n```\n\n**\"退\"的另一种做法（画面 `f_0505`）**：\n\n```\n680.7（86.9%）→ 退：给 584.7 从 86.9% 退到 80.3%\n   584.7 ÷ 1.066 ≈ 560（板书：584.7 − 24 ≈ 560）\n   680.7 − 560 = 120.7 ≈ 120\n   560 : 120 ≈ 4.7 倍（5 倍不到，4 倍多）\n```\n\n> 老师原话（为什么拉到 86.9%）：\n> 那我们来看这个题。你看还有这个数据，他问你进口值的增速是多少？好，现在我们不知道这个进口值增速跟这个出口值的增速有多大差距有多大，对，我不敢用现期比做，我选项也不好带。我要是 26、什么 32、48 全带过去也浪费时间咋办呢？我们就直接去给它硬算出来，我们就算，算也不慢。\n> 你看我们怎么算呢？我们直接给这个 680.7 给它拉平，我们把总体去拉平，把这个总量拉平，把 80.3 拉到 86.9。**我们为什么要把这个整体拉到 86.9%？** 因为如果你的进出口是 86.9% 了，出口我没动，出口是不是也是 86.9%？那进口的增速是多少？进口不也是 86.9 吗？**那这样大家增速都是一样的，大家的各种什么比值，现期比就是基期比。**是不是？\n\n> 老师原话（拉平计算）：\n> 所以我把总体拉上去，拉 6.6 除以 1.8，大概 4% 不到，可以吧。给他拉 4 个点不到，那 4、6、24，把它补成 705 左右。这个 705 就对应的是 86.9% 的增速，584 也对应的是 86.9% 的增速。那我减下来的 121。它也是对应的是 86.9% 的增速。\n> **基期比不就出来了吗？584 除以 121，五倍不到吧，四点九倍的样子。这个就是准确的基期比。**我们有了基期比，增速还不好算吗？\n> 80.3、86.9，增速差是 6.6%。这个地方 86.9、584，它是大的那方，它是 4.9 倍的，所以它的量大，它的距离就近。另外一边的距离是 6.6 的 4.9 倍。乘以五的话就是五六三十，百分之三十三，32.4 吧。那 80.3 减 32.4 等于 **47.9 ≈ 48%**（转写记为\"48.3\"，实为 80.3）。\n\n> 老师原话（\"退\"也可以，且结果一致）：\n> 有人问能不能退？当然可以退。680.7，这是 584.7，它的增速呢是 86.9%，这是 80.3%。给他退几个点，还是退 4 个点左右，退一加百分之四不到。那 4、6、24，`584.7 − 24 = 560`。这个差值 120，560 是 120 的多少倍？还是 4 点几倍，5 倍不到，4 倍多。就这个也是一样的，都一样的。\n\n> 老师原话（为什么出 1.8）：\n> 为啥出 1.8？**这个是我们前面拉平增长率那节课的内容，你可以再回去看一下。**\n\n> 老师原话（误差说明）：\n> 按道理倍数是不变的，这个地方可能有我计算上的误差吧。你可以自己拿计算器按一下，按道理来说它的基期比是不会变的。因为我这个地方毕竟是人算嘛，人算比不过天算，它肯定还是有一点点误差的。比如说这地方可能是什么 4.87 倍，这个地方可能算下来是个 4.79 倍，它们有一点点误差，这个也很正常的。**你拿计算器摁一下，肯定是没有差距的。**\n\n> 老师原话（为什么拉平更准）：\n> 我是为了让这个结果显得跟这个答案一样，这样你们才相信这个方法它是没有误差的。明白吗？就我这边给你们算的时候，就算得相对过分精细，其实考试的时候你不用算这么细。\n> 看到吧，**核心原理就是通过拉平去得到这个基期比**。拉平，你不一定非要拉这个出口跟进口，你也可以拉整体，你把整体都拉上去，大家的这个各自的这个比值也是一样的。\n\n**【选项原文】**\n\n- A. 26%\n- B. 32%\n- C. 48%\n- D. 56%\n\n**【答案】** ✅ **C**\n\n**【解析】**\n\n- 只有\"整体 + 一个部分\"，无法判断另一部分的增速，因此不能靠现期比估，也不会去一个个代入 → 用**拉平**求准确基期比。\n- 把整体 680.7（80.3%）拉平到 86.9%：需补 `6.6% ÷ 1.8 ≈ 4%`，现值加 `680.7 × 4% ≈ 24` → 705；进口 = 705 − 584 ≈ 121；出口 : 进口 ≈ 4.9 : 1。\n- 距离比反比：出口侧 → 混合点距离 = 6.6%；进口侧距离 = 6.6% × 4.9 ≈ 32.4%；进口增速 = 80.3% − 32.4% ≈ 47.9% ≈ 48%。\n- **陷阱类型**：方法陷阱（不拉平直接算很容易错）+ 范围陷阱（32% 与 56% 分别对应\"距离算反\"和\"忘记反向\"）。\n\n---\n\n### 第 12 题｜2023 年 · 该市牛羊禽肉产量 · 增速（高精度要求）\n\n**【题干原文】**（画面 `f_0495`，逐字）\n\n> 主要农产品中，猪牛羊禽肉产量 2.4 万吨，比上年增长 31.5%，其中猪肉产量 2.2 万吨，增长 40.0%。\n>\n> 2023 年该市牛羊禽肉产量比 2022 年（　）。\n\n**【材料数据】**\n\n| 项目 | 产量（万吨） | 同比增长 |\n| --- | --- | --- |\n| 猪牛羊禽肉合计 | 2.4 | 31.5% |\n| 其中：猪肉 | 2.2 | 40.0% |\n| 牛羊禽肉（差值） | 2.4 − 2.2 = 0.2 | **待求** |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **难点** | 牛羊禽肉只有 0.2 万吨（极小），增速很可能与 40% 差距极大 → **不敢用现期比**，必须**拉平求准确基期比** |\n| **为什么不能用现期比** | 现期比 `2.2 : 0.2 = 11 : 1`；若用现期比，右侧距离 = 8.5% × 11 = 93.5%，则 `40% − 93.5% = −53.5%`，直接算不出选项 |\n| **①拉平** | 两边增速 31.5% 与 40% 相差 8.5%；给**增速低的一侧（31.5%）补** `8.5% ÷ 1.315 ≈ 6.5%` |\n| **②作差** | 2.4 的 6.5% ≈ 0.156 → 拉平后的合计值 = 2.4 + 0.156 = 2.556；牛羊禽肉 = `2.4 + 2.4 × 6.5% − 2.2 = 0.2 + 0.156 = 0.356` |\n| **③得基期比** | `2.2 ÷ 0.356 ≈ 6.19 ≈ 6 倍` |\n| **④计算增速** | 距离 = `8.5% × 6 ≈ 51%`；牛羊禽肉增速 = `31.5% − 51% = −19.5% ≈ −20%` → 选 **下降 21.3%** |\n| **结论** | 选 **B** |\n\n**板书速算还原（画面 `f_0530`）**：\n\n```\n   2.4万 / 2.2万  →  31.5% / 40.0%\n\n   8.5% ÷ 1.315 ≈ 6.5%\n\n   2.4 + 2.4 × 6.5% − 2.2\n = 0.2 + 0.156\n = 0.356\n\n   2.4 × 65  →  12 × 13 = 156（凑整技巧：65 尾数带 5，乘 2 变 130；2.4 除 2 变 1.2）\n\n   2.2 ÷ 0.356 ≈ 6.19 ≈ 6 倍\n\n   8.5% × 6 = 51%\n   31.5% − 51% = −19.5% ≈ −20%   →  B（下降 21.3%）\n```\n\n> 老师原话（为什么这题必须精算）：\n> 在这个主要的农产品中，猪牛羊禽肉的产量 2.4 万吨，增速 31.5%；猪肉 2.2 万吨，增速 40%。这个题也是一道非常经典的题。就这个题，很多人他算不准，因为这个题**比上一道题的精度要求还高，很难算的**。\n> 我们看到这种题还是一样，就是他问猪牛羊禽肉的产量的增速，他只给了猪肉的增速 40%，我不知道这个牛羊禽肉的增速在哪儿，而且从选项来看，还很可能跟那个 40% 差距很大。很慌，我是不敢拿现期比去做的。\n> 你看现期比差距很大的，零点二，现期是不是 0.2？2.2 是 0.2 的多少倍？11 倍。然后看增速差距 8.5%，然后因为这大的，所以另外一边要远，另外一边远的话就要**乘十一**，不是除十一，乘十一的话加 8.5、93.5，一算哇，算了个九十三点五的增速。我的妈呀，减个九十三点五，减过去负的六十二。这直接都搞不出来了，对不对？\n\n> 老师原话（拉平步骤）：\n> 那咋办？如果你要用线段混合的方法去做，你就去把它的**基期比**给我搞出来，你搞那个现期比没有意义。\n> 补 31.5 跟 40 不也挺近的吗？这么近我干嘛不补呢？要补多少？因为就是这个地方，就是说因为这种你已经如果去用这种东西去算了，而且选项距离也明显不是那种特别远的时候，你最好就给我稍微算细一点，拉一下，拉几个点，`8.5 除以 1.315`，大概七个点不到六个点多，六点五个点吧。6%~7% 左右，给它补 6.5 左右。\n> 2.4 的 6.5% 是多少呢？0.15 吧。或者你不一定要先把它直接算出来，反正你现在要算的是什么？**你要算的是补完了之后这个猪牛羊禽肉的那个值，你要去做差。**就是 2.4 加上 2.4 乘以 6.5%，减去 2.2，对不对？\n> 那 2.4 跟 2.2 先减了 0.2，加后面这个东西。`24 乘以 65`，你可以把它看作 `12 乘以 13`，261、315、156，加了个 0.156。就变成 0.356。\n> **为什么等于 12 乘 13 呢？** 65 这个尾巴带 5 的，我上次跟你们讲过，**带 5 的你可以给它乘个 2，变成 130**，那左边正好是个偶数，24 除个 2 变成 12，这样你好算一点点。\n> 那这样子你就能用这个去算他们的基期比了，2.2 大概是 0.356 的多少倍呢？这样的你就准很多了，**六倍吧**。你哪怕没算出来这个 0.356，你知道是 0.15 多一点点，你也能看得出来。因为 35 乘以 6 是 210，这 210 除个 0.35 左右的数，就是个 6 倍吧。\n> 那这距离 `8.5% 乘以 6 等于 51%`，减去 51% 等于 **−20%**（选项为下降 21.3%）。\n\n> 老师原话（小结精算）：\n> 懂了吧？主要就是**拉平，然后你就能得到准确的基期比**。有了准确基期比，你剩下的不就好做了吗？比你直接用什么现期比踏实多了吧。\n> 但是这个前提是什么？前提是这个题目你相对来说需要一点精算。那前面很多题目你就不需要拉平嘛。比如说这种题，它本身增速就要么好带，本身增速差距又不大，9.8、3.3 差距又不大，现期比跟基期比差距不大的时候，你就不需要这么去搞。\n> 你像刚刚这种情况呢，就是比较特殊的，**你不那么搞就很容易算错的**。刚刚这个题目，你哪怕去算基期，很多人都可能算错，你要是不信，你有空你去算算基期，再去算这个增速，你会发现你很可能算错的。\n\n**【选项原文】**\n\n- A. 增长了 21.3%\n- B. 下降了 21.3%\n- C. 增长了 27.0%\n- D. 下降了 27.0%\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 牛羊禽肉现期仅 0.2 万吨（占比极小），若用现期比 11 : 1 会把距离放大 11 倍，得到 `−62%` 这种无选项结果 → 必须拉平。\n- 拉平：`8.5% ÷ 1.315 ≈ 6.5%`；`2.4 + 0.156 = 2.556`；牛羊禽肉拉平后 = `2.556 − 2.2 = 0.356`；基期比 = `2.2 : 0.356 ≈ 6 : 1`。\n- 距离 = `8.5% × 6 = 51%`；`31.5% − 51% = −19.5% ≈ −20%`，与选项\"下降 21.3%\"最接近 → B。\n- **陷阱类型**：方法陷阱（用现期比直接算不出选项）+ 单位陷阱（\"万吨\"与\"%\"混用）+ 方向陷阱（下降/增长）。\n\n---\n\n## 七、第七课分式混合总结（板书小结页）\n\n> 板书页标题：**第七课分式混合总结**（画面 `f_0534`、`f_0537`，本页停留约 1 分半）\n\n### 7.1 线段反比（左栏，逐字）\n\n```\n① 线段距离比 = 分母反比\n   增速距离比 = 基期反比\n\n② 先定性再定量\n\n③ 增速差距不大时（一般建议增速差值在 20% 之内）\n   才去用现期比代替基期比粗略估算\n\n④ 计算精度要求高时可以选择直接计算增量再计算增速\n```\n\n### 7.2 拉平与混合（右栏，逐字）\n\n```\n① 拉平增长率后可以得到准确基期比\n\n② 准确基期比即可计算准确增速\n\n③ 只有两部分增速差距大（题干数据或者结合选项判断）、\n   选项精度要求高时，才需要拉平计算，\n   优先还是定性分析、代入验证，避免不必要的计算。\n```\n\n> 老师原话（口头总结，转写对应位置）：\n> 那这个线段混合呢，你看从简单到难，其实就这样子的：**先定性学会定性，然后再学会怎么去定那个量**，以及还有识别它的各种题型考法，以及最后有的时候如果真的要精算，我怎么精算好一点。\n> 总结一下，今天就两个部分的内容，一个是线段反比，注意分式线段反比一定要注意是跟什么，**跟分母是反比**。我不是说你算基期错，是你算基期没有那么好算。这个题精度要求很高的，你可以去算算看，就算基期你算得准，肯定是对的，刚那道题只是你可能说算不准。而我拉平，我拉的东西少，我只拉了几个点，对整体的影响比较小，所以相对来说还算简单一点，会轻松一点。\n> 然后注意一定要直接跟分母的反比，**增速的分母就是基期，人均的分母就是人数**。\n> 做题的时候记得**三步走**，别上来全去算，要先定性再定量，定性确定不了的再去定量。\n> 然后基期这个增速两部分差距不大的时候，你可以用现期比去代替这个基期比去粗略进行一个估算。\n> 如果有的时候混合的对象太多了，或者说计算精度要求比较高了，你也可以选择直接去算增量，去算增速。**你不一定非要去线段混合**，你用你的三板斧，什么划除一乘、什么放缩，去把它给它算出来就好了。\n> 然后最后就是刚刚讲的那点拉平跟混合的利用。比如说如果你要精算的话，你可以拉平增长率去得到一个准确的基期比，通过准确的基期比来计算这个准确的增速。**但这个东西你千万不要说总去用，因为这个东西耗时间。**大部分题目你们也看到了，我甚至可以说，**分式混合百分之九十以上的题目是不需要用到刚刚那个方法的。**刚刚那个方法只是给你的一个补充，给你的一个**保险杠**。你万一说什么时候碰到了，我能保你这个地方你能做出来。千万不要说我什么地方我顺（手）算个什么基期比，那就浪费时间了。\n> **优先还是去定性分析、代入验证，避免不必要的计算，能快就快。**\n\n---\n\n## 八、第六部分：拉平增长率的补充（多对象整体拉平 / 机器和差的退与补）\n\n> 标题页（画面 `f_0550`）：`拉平增长率 —— 补充说明`\n> 目录页（画面 `f_0554`）：\n> - **壹　多对象拉平**（统一\"起跑线\"）\n> - **贰　基期和差拉平**（误差控制）\n\n> 老师原话（为什么要有这一节）：\n> 那这个分式混合呢就这么多。然后大家别急着走，我这个拉平增长率那边我给你们还有一点补充的东西，还记得吧？第六节课跟你们说的拉平增长率还有一点点的小补充，一丢丢的补充。\n> 就拉平增长率呢，我们前面第六节课也讲了一下，就是这个东西怎么用，大家也练了不少题了，应该还是有点自己的感悟了。然后有一些点是我上节课我没有直接给你点出来的。因为有的点如果我那个时候给你点出来，你肯定会乱，因为你光是一个从低补到高，你都有点不那么熟练了，偶尔再告诉你什么，你还能从高补到低，或者我还可以整体去拉，或者还可以整体跟部分的这个整体的去拉平，你一下子全乱了。所以这个地方我再给你补充一下，它还有一些特别要注意的一些点。\n> 主要一个是两个点：一个是**多个对象的拉平**。我们上一节课第六节课主要讲的都是两个对象之间，我算两个对象的基期比、算两个对象的基期和基期差。其实你**多个对象你同样也可以去拉平的，你只要统一大家的起跑线就可以了**。以及你在算机器和差，如果你用拉平的时候，你稍微注意一下这个误差的问题，怎么控制这个误差，我待会跟你讲。\n\n### 第 13 题｜2022 年 · 全国规模以上文化及相关产业企业 · 营业收入排名第 4 的行业类别\n\n**【题干原文】**（画面 `f_0557`，逐字）\n\n> 2022 年，全国规模以上文化及相关产业企业按行业类别分，营业收入排名第 4 的是（　）。\n\n> ⚠️ 年份存疑：题干为\"**2022 年**\"，而同一画面的表格标题为\"**2023 年**全国规模以上文化及相关产业企业相关指标情况\"（题目年份与表格年份在画面上不一致，转写中老师两次均读作\"2022 年\"）。\n\n**【材料数据】**（画面表格原文，逐字抄录）\n\n**2023 年全国规模以上文化及相关产业企业相关指标情况**\n\n| 指标 | 绝对值（亿元） | 同比增速（%） |\n| --- | --- | --- |\n| 营业收入 | 129515 | 8.2 |\n| 　其中：文化新业态 | 52395 | 15.3 |\n| **按产业类型分** | | |\n| 文化制造业 | 40962 | 0.6 |\n| 文化批发和零售业 | 20814 | 6.1 |\n| 文化服务业 | 67739 | 14.1 |\n| **按领域分** | | |\n| 文化核心领域 | 83978 | 12.2 |\n| 文化相关领域 | 45537 | 1.5 |\n| **按行业类别分** | | |\n| 新闻信息服务 | 17243 | 15.5 |\n| 内容创作生产 | 28262 | 10.7 |\n| 创意设计服务 | 21249 | 8.7 |\n| 文化传播渠道 | 14797 | 11.9 |\n| 文化投资运营 | 669 | 24.4 |\n| 文化娱乐休闲服务 | 1758 | 63.2 |\n| 文化辅助生产和中介服务 | 15468 | 0.4 |\n| 文化装备生产 | 6282 | −2.6 |\n| 文化消费终端生产 | 23787 | 3.3 |\n| **按区域分** | | |\n| 东部地区 | 101223 | 8.7 |\n| 中部地区 | 15394 | 3.6 |\n| 西部地区 | 11686 | 10.0 |\n| 东北地区 | 1210 | 5.4 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | **多对象整体拉平**（把 9 个行业类别统一拉到同一个增速，再比大小） |\n| **先粗排** | 文化投资运营 669、文化娱乐休闲服务 1758、文化装备生产 6282 三个明显太小，先排掉；内容创作生产 28262 明显最大（第一名），也不用管 |\n| **锁定候选** | 剩下 5 个：新闻信息服务 17243、内容创作生产 28262、创意设计服务 21249、文化传播渠道 14797、文化辅助生产和中介服务 15468（画面板书标 ①~⑤ 圈号） |\n| **统一拉到 15%** | ① 新闻信息服务 17243（15.5%）→ **不动**（≈15%）≈ 172（万→亿元量级记作 172）\\n② 创意设计服务 21249（8.7%）→ 补 ≈6.3% → **2.24**\\n③ 文化传播渠道 14797（11.9%）→ 补 ≈3.1% → **1.52**\\n④ 文化辅助生产和中介服务 15468（0.4%）→ 补 ≈15% → **154 + 23 = 177**\\n⑤ 文化消费终端生产 23787（3.3%）→ **2.3787 × 1.15 = 2.73** |\n| **排序** | 内容创作生产（≈2.8~2.9 万）> 文化消费终端生产（≈2.73 万）> 创意设计服务（2.24）> **文化辅助生产和中介服务（1.77）** > 新闻信息服务（1.72）> 文化传播渠道（1.52） |\n| **结论** | 排名第 4 = **文化辅助生产和中介服务**，选 **D** |\n\n**板书速算还原（画面 `f_0585`、`f_0587`）**：\n\n```\n拉到 15% 口径：\n\n ② 新闻信息服务      17243  (15.5%)  →  172      （基本不动）\n ① 内容创作生产      28262  (10.7%)  →  2.82w 拉平（补约 4.3%）\n ③ 创意设计服务      21249  ( 8.7%)  →  2.24     （补约 6.3%）\n ④ 文化传播渠道      14797  (11.9%)  →  1.52     （11.9 → +3.1）\n ⑤ 文化辅助生产和中介服务 15468 (0.4%) → 154 + 23 = 177（补约 15%）\n    文化消费终端生产  23787  ( 3.3%)  →  2.3787 × 1.15 = 2.73\n```\n\n> ⚠️ 说明：上表中\"拉到 15% 后的数值\"为**画面板书记录**（`172`、`2.24`、`1.52`、`154 + 23 = 177`、`2.3787 × 1.15 = 2.73`）；括号中的\"补百分之几\"为按题干数据可直接得到的增速差。\n\n> 老师原话（为什么先粗排）：\n> 那我们看一下，我说的资料分析里面不是行业那边不是一共很多个吗？一二三四五六七八九，九个行业要找你们排名第四的。那这九个你要是一个个先算出来，那肯定不行，对不对？\n> 那怎么办呢？那我们可以就先把什么呢？**先把明显不可能先排掉。**你像这个是不是不可能，这个太小了，它不可能第四，它可能第九。然后其他这边好多一万两万的这种一千的，哎，六千的，这三个是不是可以起码去排掉？我不用看这三个，我只要看剩下六个，对吧？\n> 那剩下六个里面，我要找排第四的，除了这些小的特别明显的排掉，那大的特别明显的是不是也可以排掉？比如说内容创作生产，它肯定是第一名，也不用管。好，然后剩下的一二三四五，这五个就算是感觉在差不多的范围内，他们因为增速有高有低，会可能出现一些排名次的变动，对不对？好，我们可以就整体地，我们就把这五个**全部拉平到一起**。\n> 有的同学说，那我不用算，你不算，你怎么知道他排第几，你不是在这四个里面排第四。**这些你都要去算的，不是你只要算选项里面的。**你选项里面算出来的排第四的就是第四吗？你其他的不算了？\n\n> 老师原话（算拉平值）：\n> 来，我们来看一下这五个，我们统一把它拉到，比如拉到这个百分之十五上来。\n> 这个 0.4 跟 15.5 呢，差 15 点，可以加 15%。154 的 15% 是多少？15 的平方是 225（即 1.5×15≈22.5）。我加个 23 变成 177.3，跟 15.5 差几个点。差十一二个点，加百分之十二，这个也挺高的，其实都不需要算了，**应该就两万五以上吧**。\n> 那第一名是 28000，第二名是 25000，第三名是有 22000。**第四名，文化辅助生产。所以选 D。**第五名就这个信息。\n\n> 老师原话（为什么拉平不怕粗算 · 核心）：\n> 这么比了，这是第六名，这样你要找第几名，你都好找，你不用一个个去比，你把大家整体去拉上去，全部拿到百分之十五，那谁是排第几就排第几，反正大家都是统一去退（补）嘛。**有误差不影响。**\n> 你这个 172 跟那个 177 之间差这么多呢？我这边只是把 154 去加了个 23，变成 177。**我拉平，我动的东西小，我只动 23。**你如果想变成 172 以下，你想变成 171，你只能加 17。**我拉这个东西，我还能把 23 跟 17 拉错吗？**\n> 懂了吗？**拉平的优点就在于你拉的只是在增速比较近的时候只差了几个点，你动的东西小，你算得就算粗略一点，你也不会算得有很大的误差。**\n\n> ⭐ 老师金句（本题的复盘）：\n> 这道题是 2025 浙江（画面/转写如此）那道题。**这道题也是我这几年考那么多场考试，应该有十来场考试了吧，资料分析唯一错的一道题。**在录的，当然就是没有想到、没有完善好这种完全去整体去拉平的这种思路，然后导致有个漏掉了。\n> 当时我没拿（整体拉平），当时我不知道还可以多个一起拉，当时我还停留在两个，两个比，我就在那比，然后我就忘了这个一万五千四了。因为我感觉一万五千四好像挺小的，我当时主要集中在比这个一万七千二和哪个身上去了，反正我没比它。但如果当时我知道我能整体拉的话，这道题我就不会错了。可惜。**所以可以整体大家一起拉。**\n\n**【选项原文】**\n\n- A. 新闻信息服务\n- B. 创意设计服务\n- C. 文化传播渠道\n- D. 文化辅助生产和中介服务\n\n**【答案】** ✅ **D**\n\n**【解析】**\n\n- 9 个行业类别中先排除明显过小的（669 / 1758 / 6282）与明显最大的（内容创作生产），剩下 5 个拉平比较。\n- 统一拉到 15%：172（新闻信息）、2.82w 拉平（内容创作，最大）、2.24（创意设计）、1.52（文化传播渠道）、1.77（文化辅助生产和中介服务 154+23）、2.73（文化消费终端生产）。\n- 排名：① 内容创作生产　② 文化消费终端生产　③ 创意设计服务　④ **文化辅助生产和中介服务**　⑤ 新闻信息服务。\n- 关键：文化辅助生产原值 15468 \u003c 新闻信息服务 17243，但增速只有 0.4% 而后者有 15.5%，**拉平后反超**（177 > 172）——这就是\"必须整体拉平、不能只比原值\"的考点。\n- **陷阱类型**：方法陷阱（只比现期值 → 误选 A）+ 范围陷阱（漏算 15468 这个\"看起来小\"的项）。\n\n---\n\n### 第 14 题｜S 省工业用电量 · 2022 年第四季度环比增速\n\n**【题干原文】**（画面 `f_0595`，逐字）\n\n> 2022 年第四季度，S 省工业用电量环比增速约为：\n\n**【材料数据】**（图表原文，逐字抄录）\n\n**图 2　2023 年 6-12 月 S 省工业用电量及累计同比增速**\n（柱：累计工业用电量（亿千瓦时）；折线：累计同比增速（%））\n\n| 月份 | 累计工业用电量（亿千瓦时） | 累计同比增速（%） |\n| --- | --- | --- |\n| 6 月 | 1036.2 | 3.6 |\n| 7 月 | 1215.1 | 3.6 |\n| 8 月 | 1396.0 | 3.8 |\n| 9 月 | 1566.2 | 3.6 |\n| 10 月 | 1742.2 | 4.1 |\n| 11 月 | 1925.0 | 4.7 |\n| 12 月 | 2122.4 | 4.8 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 用**累计值**求季度（环比）增速 → 多对象整体拉平 |\n| **常规做法（要算 3 个基期）** | ① `2122.4 ÷ 1.048 − 1566.2 ÷ 1.036` = 2022 年第四季度；② `1566.2 ÷ 1.036 − 1036.2 ÷ 1.036` = 2022 年第三季度；③ 再算环比 |\n| **拉平做法（板书路线）** | 把三个累计值统一拉到 **3.6%**（6 月、9 月的增速），即只把 12 月的 2122.4 往下退 1.2%\\n`2122.4 × 1.2% ≈ 25` → `2122.4 − 25 ≈ 2098` |\n| **作差** | 第四季度 = `2098 − 1566 = 532`；第三季度 = `1566 − 1036 = 530` |\n| **算环比** | 环比增量 = `532 − 530 = 2`；环比增速 = `2 ÷ 530 ≈ 0.38% ≈ 0.4%` |\n| **结论** | 选 **A（0.4%）** |\n\n**板书速算还原（画面 `f_0635`、`f_0625`）**：\n\n```\n① 拉平：2122.4 从 4.8% 退到 3.6%\n   1.2%  →  2122.4 × 1.2% ≈ 25\n   2122.4 − 25 ≈ 2098\n   （板书写：1.2% ／ −1.2%，2098）\n\n② 三个累计值（统一 3.6% 口径）：\n   1036       1566       2098\n        └ 530 ┘   └ 532 ┘\n          三          四\n\n③ 环比：532 − 530 = 2\n        2 ÷ 530 ≈ 0.4%   →  A\n```\n\n> 老师原话（为什么这题常规做法很难）：\n> 他在问什么？2022 年第四季度这个 S 省工业用电量的环比增速是多少啊？做过这道题的同学应该都知道，感觉很难算，为什么？**他给的是累计值。**\n> 这个四季度的环比增速，我要把去年的四季度算出来。那去年四季度怎么算？我要拿这个十二月的它的基期 2122.4 去除以 1.048，我要算到 2022 年的。就是一到十二。\n> 我给你减掉，这个九月份累计的基期 1566.2 除以 1.036，就这个二二年的一到三减掉它，我才能得到那个二二年的四季度，对不对？然后我要再拿二二年的一到三去减掉 22 年的一到六，1036.2 除以 1.036，才能得到 22 年的三季度。然后我有了 22 年的四季度和 22 年的三季度，我才能算他们这个环比增速。\n> 哎呦，我的妈呀，这算太难算了吧，**我要算一个、两个、三个，三个基期，再算一个环比增速。**\n\n> 老师原话（为什么拉平）：\n> 现在大家在学了，我们刚刚上一节课分式混合里面**整体跟局部的拉平**——比值关系之后，对这个题目有没有点想法？\n> 我们刚刚是不是整体拿（拉），我们可以把整体拉上去，也不影响他们两个部分的基期比跟现期比的相等。那我这边是不是也有这种整体跟局部的关系？这边我是不是有一到三、1-3 加 4 季度是不是就是 1-12？\n> 那我们就直接怎么样？我们直接也把他们这一季度、二季度、一到三季度、一到四季度，**全部拉到 3.6%**。\n> 第一，为什么是拉他们仨？因为**你要算的差值是他们**，你要算的东西是他们三个的差值：第二个减第一个得到三季度，第四个减第三个得到四季度（转写如此，实为\"12 月减 9 月得四季度，9 月减 6 月得三季度\"）。所以我要看他们三个。\n> 那为什么是要到 3.6？因为他们俩都是 3.6，只有你一个是 4.8，那肯定是你一个人下来快一点，不然的话你要让他们两个都上去，那是不是麻烦？最后又拉一个。\n> 我就把一个 2122 往下退 1.2%。我为什么可以这么做呢？因为我只要看比值，我跟它具体的量是多少，我不关心它的量是多少。\n> 退一点二，2122 的百分之一点二大概是多少？那不就是二十四，二十四左右吧。减个 24 变成 2098，对不对？\n> 那现在这个 1036、1566、2098，他们减出来的这个值，532，这两个值的比值关系，它就跟基期的对应的三季度、四季度的比值关系是一样的。所以它的环比增量就是 2，`2 ÷ 530 = 0.4%`。\n\n> 老师原话（为什么大家增速一样就可以随便加减）：\n> 你只要是跟这种基期有关的东西，你全部就能给它拉平，你管它是什么东西、跟什么东西呢？这不比刚刚那个算法简单太多了吗？\n> 这个题目看得懂吗？**知道为什么是往下退一点二个点，不影响吧？大家增速都是 3.6%。**\n> 那我这个 1036 跟 1566，比如说我拿这两个比，1566 比这个 1036，它是不是 23 年的前三季度和 23 年的前两个季度比？但我们知道他们增速是一样的呀，所以它就等于 22 年的一到三比上 22 年的一到二。那我如果把它减个一呢？我减个一，不就又变成了 22 年的三季度？**那就是你怎么变，你怎么减、怎么加，它都不影响，大家都是 3.6，都是 3.6。**\n> 我再换句话说，你还可以从分式混合的角度来理解。我 1-2 季度是不是增速是 3.6%？1-3 季度增速也是 3.6%，说明什么？说明我 3 季度增速是不是也是 3.6%？那我这边 1-3 是 3.6%，1-4 是 3.6%，我四季度的增速是不是还是 3.6%？所以他们这个差值的比就是他们基期的比。\n> **只要大家的增速都是一样的，大家都是众生平等。**除下来，怎么除、谁跟谁加起来去除、谁跟谁减下来去除、谁比谁，下来的结果都跟去年是一样的。\n\n> 老师原话（多对象拉平的适用范围）：\n> 这个就是用现阶段的机器（拉平）好了，就是一个**多对象的拉平**。就是你几个对象，你去比较大小、比值，甚至求和做差，几个东西都可以去拉平，拉到一起就行。\n> \"二除五百三\"什么意思？你基期五百三，现期五百三十二呀，**环比增量是 2 嘛**？这是增量，二是增量，二是环比增量。\n\n**【选项原文】**\n\n- A. 0.4%\n- B. 3.2%\n- C. 4.6%\n- D. 4.9%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n\n- 12 月累计（2122.4，4.8%）退到 3.6% 口径 ≈ 2098；9 月、6 月本身就是 3.6%，不用动。\n- 四季度 = 2098 − 1566 = 532；三季度 = 1566 − 1036 = 530。\n- 环比增量 2，环比增速 = 2 ÷ 530 ≈ 0.4%。\n- 若不拉平直接相减：556.2 ÷ 530 − 1 = 4.9%，正好是**选项 D**——这就是\"不拉平\"的陷阱。\n- **陷阱类型**：方法陷阱（不拉平直接相减 → 误选 D 4.9%）+ 概念陷阱（累计值 ≠ 当季值）。\n\n---\n\n### 第 15 题｜2019 年 · 全国进口煤炭 · 2018 年第一、二季度进口量（基期和差）\n\n**【题干原文】**（画面 `f_0667`，逐字）\n\n> 2019 年 7 月，全国进口煤炭 3289 万吨，同比增长 13.4%，比上月增加 579 万吨；2019 年 1—7 月，全国进口煤炭 18736 万吨，同比增长 7%。\n>\n> 2018 年，第一、二季度全国进口煤炭（　）。\n\n**【材料数据】**\n\n| 项目 | 数值 | 同比增速 |\n| --- | --- | --- |\n| 2019 年 7 月全国进口煤炭 | 3289 万吨（比上月增加 579 万吨） | 13.4% |\n| 2019 年 1—7 月全国进口煤炭 | 18736 万吨 | 7% |\n| 2018 年 7 月全国进口煤炭 | 3289 ÷ (1 + 13.4%) | — |\n| 2018 年 1—7 月全国进口煤炭 | 18736 ÷ (1 + 7%) | — |\n| 2018 年 1—6 月（第一、二季度） | 待求 = 1—7 月基期 − 7 月基期 | — |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | **基期和/差**的拉平（一减一，求基期差） |\n| **常规做法（往上补）** | 把增速低的 18736（7%）往高的 13.4% **补**：`6.4% ÷ 1.07 ≈ 6%`；然后 `18736`（补后）`− 3289`，再 `÷ (1 + 13.4%)` |\n| **推荐做法（往下退）** | 把 3289（13.4%）**退**到 7%：`3289 ÷ 1.06`（或直接减 6%）→ ≈ 3100（画面：减 180 ≈ 3109，取 3100） |\n| **作差** | `18736 − 3100 = 15636（板书记 156）` |\n| **再除** | `15636 ÷ 1.07 ≈ 14613`，但只需比选项：`156 ÷ 1.07 ≈ 146` |\n| **结论** | 与 **B（14610 万吨）** 最接近，选 **B** |\n\n**板书速算还原（画面 `f_0635`、`f_0640`）**：\n\n```\n（常规）补：\n   18736 ↑（7% 补到 13.4%，补约 6%）\n   3289\n   ÷ (1 + 13.4%)\n\n（推荐）退：\n   18736 不变\n   3289 ↓ 退 6%  →  3289 − 180 ≈ 3100\n   18736 − 3100 = 15636   （板书记 \"156\"）\n\n   156 ÷ 1.07 ≈ 146\n   选项：A 142 ／ B 146 ／ C 154 ／ D 158\n   → 只能是 B（14610）\n```\n\n> 老师原话（两种做法怎么选）：\n> 比如这道题，他问你 2018 年第一季度第二季度的进口煤炭量，他给的是一到七月份和七月份，这也是一个差值的问题吧，一到六就是一到六月份，要拿一到七减掉这个七月份，算他们的基期差。\n> 那常规做法呢，我们会怎么做？按照我们第六节课讲的是，我们要给增速低的这个 18736 去补上 `6.4% 除以 1.07`，大概 6%。然后再去减掉 3289，然后再去除以一加百分之十三点四，对不对？这是一种做法，这是我们把这个低的拉到高的。\n> 那其实我们第六节课也点过一个点：**其实你从高的往低的退，是不是也可以？**\n> 如果我们来退这个题目，你会是什么样的一个步骤呢？是会把这个 3289 去退百分之六。前面呢，18736 不变，然后分母上除以 1 加 7%。你会把它退 6%，变成 7%。\n> 那你说这个题目是用上面这个逻辑来做好，还是下面这个逻辑来做好？来比较一下他们的区别在哪。\n> 一个你在算 18000 的 6%，一个你只是算 3000 的 6%；一个你的分母要除 1.134，一个你分母只要除个 1.0 几。**是不是下面这个好？它有两个优势。**\n> 一个是这个地方**误差小、影响小**。因为你最后你要干嘛？为什么我只是说基期和差？因为你那个比值，你不管是上面补还是下面退，其实都是一样的结果。**但这个基期和差就不一样了，你算的是量，你要去求和，你要去做差，跟量的大小是有关的。**跟量的大小是有关的，**量的大小决定了你选项的那个精度，你好不好算**。所以既然这两个量级差得有点多，那我索性就调它（小的那个）。\n\n> 老师原话（怎么算得快）：\n> 退是怎么退？补呢，也是 `18736 × (1 + 6%)`；退就是 `3289 ÷ (1 + 6%)`。所以我们肯定选下面这个。下面这个你看我算优（势）非常快，我怎么算呢？\n> 因为我知道 3289 比较小，我退它。主要不是比较小，是**小了很多，它只有几分之一**。给它退六个点，因为我知道它小，我甚至这个六我都不想去除一点零了，我就直接减个百分之六，减个一百八，我就拿三千二去算了，我就三千二去算，减下来三千一。然后 `18700 − 3100`，`15600 ÷ 1.07`，往下退七个点，直接 B 走了。\n> 还真的比六个点更小，六个点更小有必要吗？**各位，有必要吗？**你怎么不去说，我这个 180 算得粗啊，真的有必要吗？\n> 为什么这个 156 除以 1.07，我能很快地锁定 B 呢？你看 A 是 142，跟 156 差多少？差了 10%。154 跟我谈的就一个点，158 还大了，那不只能是 B 吗？\n> **这个就是这种方法的好处，就是你注意到这个误差之后的好处。你不需要去调什么几千的数，你只要调个一百多的数。**你一百多，你就算差了、你就算错了，你把一百八你算成了二百八，那咋了？少个一百，影响大吗？你选项差个四百、五百的、六百的，你差这一百吗？\n> 懂了吧？**你要注意好你的乘除计算，它计算的对象是多大，你的选项又是什么样的，这样你做起来才能又快又准。**\n\n> 老师原话（退补的增速算法一样）：\n> 退增长率具体怎么算？就这个东西，又是除这个一点零几，或者说一点几，你到时候你看放缩或者说什么大概估吧，放缩估一下、划除一乘估一下之类的。\n> 退的增速怎么了？增速还是一个算法。还是 `13.4 − 7 除以 1.07`，就是 `6.4 除以 1.07`。**退跟补它那个增速都是一样的，只是一个是乘以 1 加增速，一个是除以 1 加增速。**这个就是我说一样的，我这边不还是百分之六吗？一样的，补也是补百分之六，退也是退百分之六。\n\n**【选项原文】**\n\n- A. 14221 万吨\n- B. 14610 万吨\n- C. 15447 万吨\n- D. 15836 万吨\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- 2018 年 1—6 月 = 2018 年 1—7 月 − 2018 年 7 月 = `18736/1.07 − 3289/1.134`。\n- 用\"退\"法：把小的 3289 从 13.4% 退到 7%，`3289 − 180 ≈ 3100`；`18736 − 3100 = 15636`；`15636 ÷ 1.07 ≈ 14613`。\n- **为什么退比补好**：① 1000 多量级的 6% 比 18000 量级的 6% 好算；② 分母从 1.134 变成 1.07，更简单；③ 基期和差算的是\"量\"，跟量的大小直接相关，动小的那个误差影响小。\n- **陷阱类型**：方法陷阱（挑错\"补/退\"对象 → 计算量爆炸）+ 单位陷阱（万吨）。\n- 选项对比：156 ÷ 1.07 ≈ 146 落在 B；A（142）差 10%，C（154）、D（158）都偏大。\n\n---\n\n### 第 16 题｜2009 年 · 某省农林牧渔业增加值 · 四个产业总增加值（基期和差 · 多对象退）\n\n**【题干原文】**（画面 `f_0690`，逐字）\n\n> 2009 年，某省国民经济平稳回升，民生状况不断改善，社会保持和谐稳定，农林牧渔业全面增长。农业增加值 1883.4 亿元，比上年增长 2.7%；林业增加值 71.3 亿元，比上年增长 9.8%；牧业增加值 691.1 亿元，比上年增长 5.2%；渔业增加值 459.8 亿元，比上年增加 6.1%；农林牧渔服务业增加值 121.0 亿元，比上年增长 10.1%。主要农牧产品质优量增。小麦和玉米全部实现优质化，无公害农产品、绿色食品和有机食品基地面积分别达到 800 万亩、1160 万亩和 51 万亩。畜牧产品产量稳定增长。\n>\n> 2008 年，除去农林牧渔服务业，该省农林牧渔四个产业的总增加值为多少亿元：\n\n**【材料数据】**\n\n| 产业 | 2009 年增加值（亿元） | 比上年增长 |\n| --- | --- | --- |\n| 农业 | 1883.4 | 2.7% |\n| 林业 | 71.3 | 9.8% |\n| 牧业 | 691.1 | 5.2% |\n| 渔业 | 459.8 | 比上年增加 6.1% |\n| （农林牧渔服务业） | 121.0 | 10.1%（**本题不计入**） |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n| --- | --- |\n| **题型识别** | 多对象**基期和**（求 2008 年四项合计） |\n| **常见错法** | 把 2.7%、5.2%、6.1% 全**补**到 9.8% —— 结果要给最大的 1883.4 乘一个最远的增速差，计算量爆炸（\"19 倍量级\"），得不偿失 |\n| **推荐做法：全部退到 2.7%** | ① 农业 1883.4（2.7%）→ **不动** = 1883\\n② 林业 71.3（9.8%）→ 退 ≈5 → **66**\\n③ 牧业 691.1（5.2%）→ 退 ≈15 → **677**\\n④ 渔业 459.8（6.1%）→ 退 ≈15 → **445** |\n| **求和** | `1883 + 66 + 445 + 677 = 3071` |\n| **再除** | `3071 ÷ 1.027 ≈ 2990`（用划除一乘：`3071 − 3071 × 2.7% ≈ 3071 − 83 = 2988`） |\n| **结论** | 与 **A（2989.1）** 最接近，选 **A** |\n\n**板书速算还原（画面 `f_0703`）**：\n\n```\n全部退到 2.7%：\n\n   农业    1883.4  (2.7%)  →  1883   （不动）\n   林业      71.3  (9.8%)  →    66   （退 ≈5）\n   渔业     459.8  (6.1%)  →   445   （退 ≈15，板书写 \"+3% → 445\"）\n   牧业     691.1  (5.2%)  →   677   （退 ≈15）\n\n   合计： 1883 + 66 + 445 + 677 = 3071\n          （板书记 3071）\n\n   3071 ÷ 1.027 ≈ 2990   （板书写 3071 / 1.027）\n   → 选 A（2989.1）\n```\n\n> 老师原话（为什么不能全补到最大的那个）：\n> 来这个题熟悉吧，你们那个模块作业上的那道题，现在再来回顾一下。\n> 你要算的是什么？除去服务业，其他四个产业的总增加值，除去服务业，其他四个就是农业、林业、渔业、牧业。\n> 现期增速，有些同学他去算这个题目，他去算基期和，他就去**补**，把 2.7 全补到 5.2，补到比如说把 2.7、5.2、6.1 全补到这个 9.8 上去了。就我觉得这个题目难算，**为什么会难算？因为你给这个最大的 1883 补了一个最远的增速差，是不是？**因为 2.7 跟 9.8 差了 7 个点，已经是这里面最大的了，你还给这个 1800 去乘……你看比这 71 大多少，比 400 大多少、比 600 大多少，对不对？\n> 所以既然他们的量级有明显差距，**我干嘛非要动这个 1800 呢？我给你们退呗。我让你们退下来，我让你们都退到两个多点。**\n\n> 老师原话（退的计算）：\n> 那我这边减 7.7（个百分点对应的量），71.3 减个 5、6。这边（牧业）减 2 个点，减个 14 到 677。这边（渔业）减 3 个点，三个点左右吧，三位数变成 445。\n> 然后这个时候，再把 1883 给你退完的 66、677、445 去加起来。3 加 7 是 10、11、21。12 加 8 得 20，这个还能上 23071（转写如此，实为 1883 + 66 + 445 + 677 = 3071）。\n> `3071 除以 1.027`。啊，301 的话跟 307 只差了两个点；A 的话是差三个点不到。对，这个增速大概是用了**划除一乘**，因为就几个点嘛，你就划除一乘一下呗。\n\n> 老师原话（误差与手感）：\n> 哎呀，你们退得慢还是不熟，你划除一乘本身就不熟，拉平又不熟。我两个都熟，我两条腿的，我能跑不过你没有腿的？你把这些练熟了，你把那两条腿都站起来，那么就（跑得快）了。\n> 没有那么多素材，我就是一个这 9.8 跟 2.7 差个 7，看不出来吗？那这个本身就两个 7，2.7、7.0，你还要去除什么 7 除以 1.027 吗？没必要啊，这个东西影响很小呀，划除一乘没什么影响的。\n> **本身问题动的东西就小，动的东西越小，你要算的东西呢就可以越粗，就可以越粗。**\n> 我没有什么速算的，我就随便估，那七七四十九，我就给他减个五（十）倍，我非得减 49、4.9 干什么呢？减个五，那我非要写个 66.3 干嘛呢？我就写个 66。那零点几几的差距在这个题目里面重要吗？**不重要。**\n\n**【选项原文】**\n\n- A. 2989.1\n- B. 3014.5\n- C. 3066.3\n- D. 3105.6\n\n**【答案】** ✅ **A**（画面在题干左侧手写字母 A）\n\n**【解析】**\n\n- 四个产业（农业、林业、牧业、渔业）都要算 2008 年（基期）值再加总。\n- 全部退到 2.7%（最小增速）：1883 / 66 / 445 / 677，合计 3071；`3071 ÷ 1.027 ≈ 2990` ≈ A（2989.1）。\n- 若选\"全补到 9.8%\"，则要给 1883.4 乘 `1.098/1.027`，计算量大且误差更大。\n- D（3105.6）正好是\"2009 年四项现值合计\"（1883.4 + 71.3 + 691.1 + 459.8 = 3105.6）——**忘记求基期**的陷阱。\n- **陷阱类型**：方法陷阱（补/退对象选错）+ 时间陷阱（D 是现期合计值）+ 概念陷阱（\"除去服务业\"的范围陷阱）。\n\n> 老师原话（结尾）：\n> 好了，今天要讲的就这么多。对吧？大家就好好再吸收一下，回顾一下。\n> 好了，那今天我们课就上到这边了。下课了。\n\n> 结尾补充（学生提问 · 老师答疑）：\n> ——\"服务也不用减掉？\"\n> ——\"**意思是不管这个服务业，他们本身就是五个并列的东西，一、二、三、四、五，是除去它，剩下四个加起来多少，是这个意思。**\"\n\n---\n\n## 九、总结提炼\n\n### 9.1 本讲知识点总表\n\n| 板块 | 核心结论 | 对应题号 / 页码 |\n| --- | --- | --- |\n| **混合定量总纲** | 定性：①在两部分之间 ②靠近分母大的一侧；定量：③按分母反比定距离比 | `f_0003` |\n| **增速混合** | 距离比 = **基期比的反比**；增速差 ≤20 点可用现期比代替基期比粗估 | 第 1~3 题 |\n| **比率（比重）混合** | 城镇化率的分母是**常住人口**，不是基期 | 第 4 题 |\n| **平均数混合** | 日均用时的分母是**天数**；直接加权 `(基₁r₁+基₂r₂)/(基₁+基₂)` | 第 5 题 |\n| **人数比 / 人数占比** | 材料没有人数 → 找\"分母是人数\"的分式：人均收入、人均支出、支持率；恩格尔系数需再换算 | 第 6、7、9 题 |\n| **基期比（只给增速）** | 增速的分母就是基期 → 找混合增速反推基期比 | 第 8 题 |\n| **分式的分式不能混合** | 人均值的增速不符合线段混合（分子分母不能直接相加） | 第 9 题陷阱 |\n| **多对象（≥3）混合** | 不要用线段混合，直接算基期 + 算增量 + 相除 | 第 10 题 |\n| **准确基期比（精算）** | 拉平整体与部分增速 → 作差 → 得基期比 → 算增速 | 第 11、12 题 |\n| **多对象整体拉平** | 统一拉到同一增速 → 直接比大小 / 做差，误差小 | 第 13、14 题 |\n| **基期和差拉平** | 优先\"退\"量级小的那个，不\"补\"量级大的 | 第 15、16 题 |\n| **定量三法** | ① 现期比（快、不准）② 代入（依赖排除）③ 基期比（准、稍慢） | `f_0445` |\n\n### 9.2 速算口诀与解题流程\n\n**① 线段混合（十字交叉）通用流程**\n\n```\n第一步  定性\n        ① 混合值一定位于两部分之间\n        ② 混合值靠近\"分母大\"的那一侧\n第二步  定量（先看选项精度）\n        距离比 = 分母的反比\n        ├─ 增速混合：分母 = 基期      → 距离比 = 基期比的反比\n        ├─ 比率混合：分母 = 总量（如常住人口）\n        ├─ 平均数混合：分母 = 份数（如天数）\n        └─ 支持率混合：分母 = 人数\n第三步  拆距离\n        总距离 = 高值 − 低值\n        按\"距离比\"的份数拆分，靠近哪边就从哪边加/减\n```\n\n**② 定量三法的选择**\n\n| 方法 | 何时用 | 口诀 |\n| --- | --- | --- |\n| **现期比代替基期比** | 两部分增速差 **≤ 20 个百分点**、选项精度要求不高 | \"误差在心中，先算再看选项\" |\n| **代入选项** | 已排除到只剩 2~3 个选项 | \"取中间值代入（二分法），看比例合不合适\" |\n| **拉平求准确基期比** | 增速差大（题干或选项判断）、选项精度要求高 | \"只给整体与部分，就把整体拉到部分的增速上\" |\n\n**③ 拉平增长率操作口诀**\n\n```\n多对象拉平：统一\"起跑线\"——把大家拉到同一个增速再比大小、做差\n     → 谁离目标增速最近就不动谁，只动差得多的那一个\n\n基期和差拉平：能\"退\"不\"补\"——优先动量级小的那个\n     补：低增速的量 × (1 + 增速差/(1+高增速))       → 对象大、分母丑\n     退：高增速的量 ÷ (1 + 增速差/(1+低增速))       → 对象小、分母美\n```\n\n**④ 判断\"能不能用现期比\"的三问**\n\n```\nQ1 两部分增速差多少？\nQ2 我的现期比与基期比大概差几个点？\nQ3 这几个点的误差，会不会让结果选错？\n    ——不会 → 放心算；会 → 乖乖拉平求准确基期比\n```\n\n### 9.3 易错点与陷阱清单\n\n| # | 陷阱 | 说明 | 对应题 |\n| --- | --- | --- | --- |\n| 1 | **方向陷阱** | 距离比是分母比的**反比**，忘反比就把答案算反 | 第 8 题（7:8 vs 8:7 → B 0.88） |\n| 2 | **分母找错** | 增速看基期、城镇化率看常住人口、日均值看天数、支持率看人数、人数比看人均值 | 第 4、5、6、7 题 |\n| 3 | **\"分式的分式\"仍在混合** | 人均值的**增速**不能线段混合，连定性都定不下来 | 第 9 题（9% / 11.2% / 10.1% 误混） |\n| 4 | **多对象硬套线段混合** | ≥3 个对象时应当直接算基期与增量 | 第 10 题（11、12 月现期相等却基期 2:3） |\n| 5 | **不拉平直接算** | 累计值直接相减得 4.9%，正确值 0.4% | 第 14 题（选项 D 就是陷阱） |\n| 6 | **补/退对象选错** | 给最大的量补最远的增速差 → 计算量爆炸 | 第 12、16 题 |\n| 7 | **忘记求基期** | 直接把现期合计当答案 | 第 16 题（D = 3105.6 为 2009 年合计） |\n| 8 | **时间 / 干扰信息** | \"增速同比提高 4.1 个百分点\"\"比上年底增加 175 万人\"\"增长 0.70 个百分点\"都是干扰 | 第 1、4 题 |\n| 9 | **范围陷阱** | \"除珠三角九市外\"\"除去农林牧渔服务业\"\"东部地区除五省市外\" | 第 3、4、16 题 |\n| 10 | **只看选项差距，不看比例关系** | 分式混合中\"选项只差 1 个点\"也可能对应完全不同的比例关系 | 第 1 题（6.2 vs 5.1） |\n| 11 | **机械记忆\"20% 标准\"** | 20% 只是老师给初学者的经验值，没有严格标准 | 总纲 1.4 |\n\n### 9.4 老师金句\n\n⭐ 关于误差意识：\n\n> **你做题的时候一定要\"误差在心中\"。**\n\n> 你只要知道你这个结果大概有几个点的误差，你就不要怕，你先算下去，你算出来这个结果跟选项对比一下，看看你刚刚那个几个点的误差，会不会导致你这个结果可能选错。如果那几个点的误差根本不足以导致你的结果选错，那无所谓。\n\n⭐ 关于分式混合的观察重点：\n\n> **分式混合，你不要去光看这个什么选项跟选项说差了什么百分之多少，没有用。你要看的是总距离和他们这个位置代表了两边的比例的一个关系。**\n\n⭐ 关于分母：\n\n> **做题的时候记得三步走，别上来全去算，要先定性再定量。**\n> **增速的分母就是基期，人均的分母就是人数。**\n\n⭐ 关于\"分式的分式\"：\n\n> **我有个说法，就叫做\"分式的分式，它就不符合线段混合关系\"。**\n\n> 包括我说得再准确一点，**连什么定性它都定不下来。**\n\n⭐ 关于多对象：\n\n> 有三个或者三个以上对象的，算他们的整体增速，**你不要用混合，你就老老实实给我算它的基期、算它的增量。**\n\n> 甚至你看像这个题目，**你如果发现用线段混合还没有直接算来得快。**\n\n⭐ 关于拉平：\n\n> **核心原理就是通过拉平去得到这个基期比。**\n\n> **只要大家的增速都是一样的，大家都是众生平等。**\n\n> **拉平的优点就在于你拉的东西小，你算得就算粗略一点，你也不会算得有很大的误差。**\n\n⭐ 关于精算方法的使用频率：\n\n> **分式混合百分之九十以上的题目是不需要用到刚刚那个方法的。**刚刚那个方法只是给你的一个补充，给你的一个**保险杠**。\n\n> **优先还是去定性分析、代入验证，避免不必要的计算，能快就快。**\n\n⭐ 关于计算与选项的关系：\n\n> **你要注意好你的乘除计算，它计算的对象是多大，你的选项又是什么样的，这样你做起来才能又快又准。**\n\n> **本身问题动的东西就小，动的东西越小，你要算的东西呢就可以越粗。**\n\n⭐ 幽默时刻：\n\n> **我就跟他吵，你说你这个儿童凭什么是双休？**（第 5 题 · 日均用时按 5 天工作日 + 2 天休息日加权）\n\n> 这道题也是我这几年考那么多场考试，应该有十来场考试了吧，**资料分析唯一错的一道题。**（第 13 题 · 文化企业排名）\n\n---\n\n> **本集完。** 下一集：第 20 集（第七课课后作业解析）。\n\n\n","outline":[{"level":2,"text":"一、混合定量总纲","id":"一混合定量总纲"},{"level":3,"text":"1.1 定性三原则（板书原文）","id":"11-定性三原则板书原文"},{"level":3,"text":"1.2 定量的两条注意（板书原文）","id":"12-定量的两条注意板书原文"},{"level":3,"text":"1.3 计算原理：分母反比定距离比","id":"13-计算原理分母反比定距离比"},{"level":3,"text":"1.4 核心争议：现期比能不能代替基期比","id":"14-核心争议现期比能不能代替基期比"},{"level":2,"text":"二、第一部分：增速的混合","id":"二第一部分增速的混合"},{"level":3,"text":"第 1 题｜2021 年 · 全国电信业务 · 数据及互联网业务总收入增速","id":"第-1-题2021-年-全国电信业务-数据及互联网业务总收入增速"},{"level":3,"text":"第 2 题｜2015 年上半年 · 全国水产品 · 非养殖水产品产量变化","id":"第-2-题2015-年上半年-全国水产品-非养殖水产品产量变化"},{"level":3,"text":"第 3 题｜2020 年 · 互联网业务收入 · 东部地区除五省市外","id":"第-3-题2020-年-互联网业务收入-东部地区除五省市外"},{"level":2,"text":"三、第二部分：其他混合","id":"三第二部分其他混合"},{"level":3,"text":"第 4 题｜2019 年底 · 广东省城镇化率 · 除珠三角九市外","id":"第-4-题2019-年底-广东省城镇化率-除珠三角九市外"},{"level":2,"text":"四、第三部分：其他混合续（平均数、人数比、比重、基期比）","id":"四第三部分其他混合续平均数人数比比重基期比"},{"level":3,"text":"第 5 题｜A 市儿童 · 日均使用电子产品用时（平均数混合）","id":"第-5-题a-市儿童-日均使用电子产品用时平均数混合"},{"level":3,"text":"第 6 题｜2019 年 · A 市居民收入与消费 · 城镇居民与农村居民人数之比","id":"第-6-题2019-年-a-市居民收入与消费-城镇居民与农村居民人数之比"},{"level":3,"text":"第 7 题｜公共场所示范问卷 · 受访女性市民人数占比","id":"第-7-题公共场所示范问卷-受访女性市民人数占比"},{"level":3,"text":"第 8 题｜2015 年 1—6 月 · 国内手机市场出货量 · 基期比","id":"第-8-题2015-年-16-月-国内手机市场出货量-基期比"},{"level":3,"text":"第 9 题｜2014 年 · 全国居民人均可支配收入 · 城镇居民人数占比","id":"第-9-题2014-年-全国居民人均可支配收入-城镇居民人数占比"},{"level":2,"text":"五、第四部分：多对象混合的正确处理","id":"五第四部分多对象混合的正确处理"},{"level":3,"text":"第 10 题｜2022 年 · 我国中式成药出口 · 第四季度出口金额同比增速（多对象）","id":"第-10-题2022-年-我国中式成药出口-第四季度出口金额同比增速多对象"},{"level":2,"text":"六、第五部分：拉平增长率求准确基期比（精算）","id":"六第五部分拉平增长率求准确基期比精算"},{"level":3,"text":"第 11 题｜2023 年一季度 · 新疆外贸 · 进口值同比增速","id":"第-11-题2023-年一季度-新疆外贸-进口值同比增速"},{"level":3,"text":"第 12 题｜2023 年 · 该市牛羊禽肉产量 · 增速（高精度要求）","id":"第-12-题2023-年-该市牛羊禽肉产量-增速高精度要求"},{"level":2,"text":"七、第七课分式混合总结（板书小结页）","id":"七第七课分式混合总结板书小结页"},{"level":3,"text":"7.1 线段反比（左栏，逐字）","id":"71-线段反比左栏逐字"},{"level":3,"text":"7.2 拉平与混合（右栏，逐字）","id":"72-拉平与混合右栏逐字"},{"level":2,"text":"八、第六部分：拉平增长率的补充（多对象整体拉平 / 机器和差的退与补）","id":"八第六部分拉平增长率的补充多对象整体拉平-机器和差的退与补"},{"level":3,"text":"第 13 题｜2022 年 · 全国规模以上文化及相关产业企业 · 营业收入排名第 4 的行业类别","id":"第-13-题2022-年-全国规模以上文化及相关产业企业-营业收入排名第-4-的行业类别"},{"level":3,"text":"第 14 题｜S 省工业用电量 · 2022 年第四季度环比增速","id":"第-14-题s-省工业用电量-2022-年第四季度环比增速"},{"level":3,"text":"第 15 题｜2019 年 · 全国进口煤炭 · 2018 年第一、二季度进口量（基期和差）","id":"第-15-题2019-年-全国进口煤炭-2018-年第一二季度进口量基期和差"},{"level":3,"text":"第 16 题｜2009 年 · 某省农林牧渔业增加值 · 四个产业总增加值（基期和差 · 多对象退）","id":"第-16-题2009-年-某省农林牧渔业增加值-四个产业总增加值基期和差-多对象退"},{"level":2,"text":"九、总结提炼","id":"九总结提炼"},{"level":3,"text":"9.1 本讲知识点总表","id":"91-本讲知识点总表"},{"level":3,"text":"9.2 速算口诀与解题流程","id":"92-速算口诀与解题流程"},{"level":3,"text":"9.3 易错点与陷阱清单","id":"93-易错点与陷阱清单"},{"level":3,"text":"9.4 老师金句","id":"94-老师金句"}]},{"id":"P20","title":"混合定量·课后作业解析","full":"第七课 混合定量 · 课后作业解析","lect":"","dur":"13:00","sec":780,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 20 集\n# 第七课 混合定量 · 课后作业解析\n\n> - **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> - **本集位置**：合集第 20 集（共 21 集）\n> - **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=20`\n> - **时长**：约 13 分（780 秒）\n> - **本集主题**：**混合定量·课后作业解析（4 道题全讲）**——增速混合、分式混合（均值混合）求人数比、混合定量的精确计算、以及「人均」类混合的前置条件辨析\n\n---\n\n## 目录\n\n- [第 1 题｜跨境电商交易规模·增速混合秒杀](#第-1-题跨境电商交易规模增速混合秒杀)\n- [第 2 题｜城乡居民人均消费支出·分式混合求人数比](#第-2-题城乡居民人均消费支出分式混合求人数比)\n- [第 3 题｜汽车产量 1-5 月增速·混合定量精确计算](#第-3-题汽车产量-1-5-月增速混合定量精确计算)\n- [第 4 题｜农村居民二·三产业纯收入·人均混合的前置条件](#第-4-题农村居民二三产业纯收入人均混合的前置条件)\n- [本讲知识点总表](#本讲知识点总表)\n- [速算口诀与解题流程](#速算口诀与解题流程)\n- [易错点与陷阱清单](#易错点与陷阱清单)\n- [老师金句](#老师金句)\n\n---\n\n## 第 1 题｜跨境电商交易规模·增速混合秒杀\n\n### 【题干原文】\n\n> 2021 年，中国跨境电商交易规模达 14.2 万亿元，占我国货物进出口总额的比例为 36.3%。其中出口跨境电商交易规模 11 万亿元，同比增速 13.4%；进口跨境电商交易规模 3.2 万亿元，同比增速 14.3%。2017-2022 年第一季度，中国跨境电商领域共发生 262 次投资，投资总金额 654.91 亿元。\n>\n> 2021 年，我国跨境电商交易规模同比增长：\n> A.12.8%　　B.13.4%　　C.13.6%　　D.14.3%\n\n### 【材料数据】\n\n| 指标 | 数值 | 同比增速 |\n| --- | --- | --- |\n| 跨境电商交易规模（整体） | 14.2 万亿元 | 未给出（本题所求） |\n| 其中：出口跨境电商交易规模 | 11 万亿元 | 13.4% |\n| 其中：进口跨境电商交易规模 | 3.2 万亿元 | 14.3% |\n| 占我国货物进出口总额比例 | 36.3% | （干扰数据） |\n| 2017-2022 年一季度投资 | 262 次 / 654.91 亿元 | （干扰数据） |\n\n### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 增速混合问题：整体（跨境电商交易规模）= 出口 + 进口，两个部分增速已知，整体增速未知 |\n| 定位数据 | 出口增速 `13.4%`、进口增速 `14.3%` |\n| 混合原理 | 混合之后的增速一定介于两个部分增速之间 |\n| 速算步骤 | 整体增速必在 `13.4%` 与 `14.3%` 之间 → 四个选项中只有 `13.6%` 落在这个区间 |\n| 结论 | 直接选 C，**零计算** |\n\n### 【选项原文】\n\n- A.12.8%\n- B.13.4%\n- ✅ C.13.6%\n- D.14.3%\n\n### 【答案】✅ C（13.6%）\n\n### 【解析】\n\n> 老师原话：**\"增速的混合的结果一定在这两个部分增速之间，所以一定在 13.4 和 14.3 之间，那只有 13.6，所以这题选 C 就可以走了。\"**\n\n- **A.12.8%**：低于两个部分增速的下界 13.4%，混合结果不可能比最小的部分还小，排除。\n- **B.13.4%**：恰好等于出口增速。混合结果只有在两个部分完全相等（权重相同且……）的极端讨论里才会贴边，本题出口 11 万亿 ≠ 进口 3.2 万亿，且 12.8% 也不等于 13.4%，排除。（画面板书：B 下画横线、C 打勾）\n- **C.13.6%** ✅：落在 13.4%~14.3% 之间，是唯一区间内的选项。\n- **D.14.3%**：等于进口增速，高于上界同理排除（板书 D 也有标记，作为区间端点提示）。\n- **陷阱类型**：**干扰数据陷阱**——\"占我国货物进出口总额的比例为 36.3%\"\"262 次投资、654.91 亿元\"与本题所求完全无关，考查你敢不敢不读后半段直接走人。\n- **考场定位**：这属于\"找到两个数据就应该直接把答案选出来\"的题，一分计算都不需要。\n\n> 老师原话：**\"这个题目在考场上遇到，就属于是这种没有任何计算，你找到两个数据，就应该直接把答案选出来的题目。\"**\n\n---\n\n## 第 2 题｜城乡居民人均消费支出·分式混合求人数比\n\n### 【题干原文】\n\n> 2022 年，全国居民人均消费支出 24538 元，比上年增长 1.8%。分城乡看，城镇居民人均消费支出 30391 元，增长 0.3%；农村居民人均消费支出 16632 元，增长 4.5%。\n>\n> 2022 年，我国城镇居民与农村居民人数之比最接近（　）。\n> A.2 : 3　　B.3 : 2　　C.3 : 4　　D.4 : 3\n\n### 【材料数据】\n\n| 指标 | 人均消费支出（元） | 同比增速 |\n| --- | --- | --- |\n| 全国居民（混合结果） | 24538 | 1.8% |\n| 城镇居民 | 30391 | 0.3% |\n| 农村居民 | 16632 | 4.5% |\n\n### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 问\"人数之比\"→ 考的是**分式混合（均值混合）**：人均消费支出是一个分式，其分母恰好是人数 |\n| 核心公式（板书） | `人均消费支出 = 消费支出 ÷ 人数` |\n| 混合关系（板书） | `(左距离 + 右距离) 距离比 = 分母反比 = 人数反比` |\n| 定位数据 | 城镇 30391、混合 24538、农村 16632（三个**人均值**本身，与增速无关！） |\n| 速算步骤 | 见下方代码块 |\n| 结论 | 人数比 ≈ 79 : 58 ≈ 80 : 60 = 4 : 3，选 D |\n\n**板书速算过程：**\n\n```\n城镇与混合的距离：30391 − 24538 ≈ 5800+\n农村与混合的距离：24538 − 16632 ≈ 7900+\n距离比 ≈ 58 : 79\n\n分母（人数）比 = 距离的反比 = 79 : 58（城镇 : 农村）\n看作 80 : 60（四舍五入）≈ 4 : 3\n```\n\n> 板书原文（线段图）：`支出/人数 = 30391 —— 24538 —— 16632`，下方标 `5800+`、`7900+`、`58,79`、`80 79:58 60`、`4 : 3`。\n\n### 【选项原文】\n\n- A.2 : 3\n- B.3 : 2\n- C.3 : 4\n- ✅ D.4 : 3\n\n### 【答案】✅ D（4 : 3）\n\n### 【解析】\n\n- **为什么找\"人均\"**：问人数之比，就要找**分母是人数的均值**——人均消费支出 = 总支出 ÷ 人数，分母正是人数。分式混合中，**距离比与分母成反比**，所以人均消费支出的距离比 = 人数的反比。\n- **A.2:3 / C.3:4**：把城镇、农村的位置或比值方向搞反——城镇人均 30391 离混合值 24538 更**近**（距 5800+），说明城镇是\"大头\"、人数更多，比值应是城镇 : 农村 ≈ 79 : 58 > 1，凡是城镇:农村小于 1 的方向都错。\n- **B.3:2（=9:6）**：距离反比约 79:58 ≈ 1.36，而 3:2 = 1.5，偏差过大；且本题最接近的整数比是 4:3 ≈ 1.33。\n- **D.4:3** ✅：79 : 58 四舍五入看作 80 : 60 即 4 : 3。\n- **陷阱类型 1（概念陷阱·本题最大陷阱）**：**千万不要把它当成增速混合**。0.3%、1.8%、4.5% 这三个增速之间虽然也构成混合关系，但**增速的分母是基期值**，和人数毫无关系。老师反复强调：\n\n> 老师原话：**\"这个题目尤其要注意的是，你千万不要把它理解成增速混合……增速的分母是基期，所以增速的距离比是基期的反比，和这个人数没有任何关系。\"**\n\n- **陷阱类型 2（概念陷阱·分式的分式）**：人均已经是分式（支出÷人数），人均的**增速**就是\"分式的分式\"（分子分母各有一个增速复合而成），它**不符合线段混合的关系**。板书在\"人均的分式\"上打了 ✗（画面：`人均/分式` 旁边一个大 ✗）。所以 4.5%、1.8%、0.3% 之间的距离比**什么都不代表**，不要用它去理解现期（限量）混合。\n\n> 老师原话：**\"4.5 和 0.3 和这个 1.8 之间的距离比代表了什么？什么都不代表。\"**\n> 老师原话：**\"千万千万不要再去用什么人均收入、人均支出的增速去看线段混合关系了，你只能抓这一个东西（人均值本身）。\"**\n\n- **适用前提**：这种\"单个数据、本身是分式\"的人均值可以用线段混合；但能用增速混合的前提是数据\"自身就是一个数、不是复合分式\"（如第 1 题的出口额、进口额）。\n\n---\n\n## 第 3 题｜汽车产量 1-5 月增速·混合定量精确计算\n\n### 【题干原文】\n\n> 2023 年 6 月，我国汽车产销分别完成 256.1 万辆和 262.2 万辆，同比分别增长 2.5% 和 4.8%。1-6 月，汽车产销分别完成 1324.8 万辆和 1323.9 万辆，同比分别增长 9.3% 和 9.8%。\n>\n> 2023 年 1-5 月，我国汽车产量较上年同期约增长：\n> A.6.2%　　B.11.1%　　C.15.3%　　D.18.8%\n\n### 【材料数据】\n\n| 指标 | 6 月 | 6 月增速 | 1-6 月 | 1-6 月增速 |\n| --- | --- | --- | --- | --- |\n| 汽车产量（万辆） | 256.1 | 2.5% | 1324.8 | 9.3% |\n| 汽车销量（万辆） | 262.2 | 4.8% | 1323.9 | 9.8% |\n\n### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 混合定量（限量/现期混合）：1-5 月增速未知，1-6 月 = 1-5 月 + 6 月，已知 6 月增速 2.5% 与 1-6 月增速 9.3%，求 1-5 月增速 |\n| 第一步·定方向 | 6 月 2.5%，混合结果 9.3% 在中间 → 1-5 月增速必然 **大于 9.3%** → 先排除 A（6.2%） |\n| 第二步·估距离 | 1-5 月是 5 个月、6 月只有 1 个月，1-5 月体量远大于 6 月 → 1-5 月离 9.3% 应该很近、6 月离 9.3% 很远（距 9.3% − 2.5% = 6.8%） |\n| 第三步·卡上界 | 若两者\"平分秋色\"（等权重），1-5 月增速 = 9.3% + 6.8% = **16.1%**；实际 1-5 月权重更大，所以其增速必须**小于 16.1%** → C（15.3%）太靠近 16.1%，排除 |\n| 第四步·二选一验算 | B（11.1%，距 9.3% 为 1.8%）vs D（18.8%……画面板书 C 被改为\"11.4%\"做演示）→ 比较**与混合中心的距离**：1.8 与 6.8 约为 4 倍关系，符合\"5 个月 : 1 个月\"的体量悬殊 → 选 B |\n| 结论 | ✅ B（11.1%） |\n\n**粗估过程（板书线段图）：**\n\n```\n(1-5月)  ——— 9.3%  —————— (6月)\n              |——— 6.8% ———|\n2.5% 与 9.3% 距离 6.8%\n若等距离（平分秋色）：9.3% + 6.8% = 16.1%\n1-5 月增速必须 \u003c 16.1%，且离 9.3% 很近\n11.1% 距 9.3% 仅 1.8%，6.8 ÷ 1.8 ≈ 4 倍，与\"5个月:1个月\"量级吻合 → B\n```\n\n> 板书：选项 A 打 ✗；C（15.3%）被打叉后旁边写了\"11.4%\"（用于演示\"若选项差距很近\"的情形）；最后 B（11.1%）与\"6%\"处圈画，左侧板书 `16.1% / 1.8% / 15.3% / (6.8%)`。\n\n**若选项差距很近时的精确算法（板书完整推导）：**\n\n> 老师原话：**\"一般题目基本上不要去算，只有那种精度很高的题，你再去算。\"**\n\n```\n第一步：算现期比\n  1-6 月产量 ÷ 6 月产量 = 1324 / 256 ≈ 13/25 = 5.2\n\n第二步：由现期比推基期比\n  现期比偏大不到 7%（增速差 9.3% − 2.5% = 6.8%，还要再除以 1.025）\n  按平均数增长率的处理思路：5.2 − 6% ≈ 4.9\n  → (1-6 月) 与 6 月的基期比 ≈ 4.9\n\n第三步：拆出 1-5 月与 6 月的基期比\n  1-6 = (1-5) + 6\n  (1-6) / 6 = (1-5)/6 + 1 = 4.9\n  → (1-5) / 6 = 3.9\n\n第四步：按基期比分配距离\n  9.3% 与 2.5% 的距离 = 6.8%\n  (1-5 月) 与 (1-6 月) 的距离 = 6.8 ÷ 3.9 ≈ 1.7\n  （除以 3.9 时：68/39 ≈ 1.75）\n  → 1-5 月增速 = 9.3% + 1.75% = 11.05% ≈ 11.1% ✅\n```\n\n> 老师原话：**\"至于为什么是 11.1，因为这里不是 4，是 3.9……如果是除以 3.9 的话，68 除以 39 差不多就是 1.75，它加个 1.75 的话，11.05 约等于 11.1，这样的精度就非常高了。\"**\n> 老师原话（提醒常见错误）：**\"有些同学，我把这个 1324 减这个 256，减出来个 1068，我看 1068 是 256 多少倍，那说明基期比是多少倍——这不对的，你这算的是现期比，现期跟基期是有差距的。\"**\n\n### 【选项原文】\n\n- A.6.2%\n- ✅ B.11.1%\n- C.15.3%\n- D.18.8%\n\n### 【答案】✅ B（11.1%）\n\n### 【解析】\n\n- **A.6.2%**：小于混合中心 9.3%，方向错误（1-5 月增速必须大于 9.3%），排除。\n- **B.11.1%** ✅：距 9.3% 仅 1.8 个百分点，与 6.8 个百分点约成 1 : 3.9，正好对应\"6 月 : 1-5 月\"约 1 : 3.9 的基期体量比，精确计算 11.05% ≈ 11.1%。\n- **C.15.3%**：距 9.3% 为 6 个百分点，与 6.8 几乎\"平分秋色\"，意味着 1-5 月和 6 月体量相当——但 5 个月对 1 个月不可能，排除。（老师点评：**\"C 跟 B 就完全不是一个量级的\"**）\n- **D.18.8%**：比\"等距离上界\"16.1% 还大，与体量关系矛盾，排除。\n- **陷阱类型**：\n  - **时间范围陷阱**：材料给的是\"6 月\"和\"1-6 月\"，问的是\"1-5 月\"——1-5 月 = 1-6 月 − 6 月，别直接拿 9.3% 或 2.5% 当答案。老师自己口算时都顺口说错（\"1-6 月份这个产量的增速是 2.5%——六月哦，不对，看错了，这是六月份的\"），说明这一步极易踩坑。\n  - **量纲陷阱（隐含）**：材料同时给了产量和销量两组数据，本题只问**产量**，别混用 262.2 / 1323.9 / 4.8% / 9.8%。\n\n---\n\n## 第 4 题｜农村居民二·三产业纯收入·人均混合的前置条件\n\n### 【题干原文】\n\n> 2011 年全国农村居民人均家庭经营二、三产业纯收入 702 元，其中，人均第二产业纯收入 193 元，增加 11 元；人均第三产业纯收入 509 元，增长 21.4%。人均财产性收入 229 元，增加 26 元。人均转移性收入 563 元，增长 24.4%。\n>\n> 2011 年全国农村居民人均家庭经营二、三产业纯收入比上年增长（　）。\n> A.6.0%　　B.16.7%　　C.13.7%　　D.21.4%\n\n### 【材料数据】\n\n| 指标 | 现期值（元） | 增量 / 增速 |\n| --- | --- | --- |\n| 人均家庭经营二、三产业纯收入（整体） | 702 | 所求 |\n| 其中：人均第二产业纯收入 | 193 | 增加 11 元 |\n| 其中：人均第三产业纯收入 | 509 | 增长 21.4% |\n| 人均财产性收入（干扰项） | 229 | 增加 26 元 |\n| 人均转移性收入（干扰项） | 563 | 增长 24.4% |\n\n### 【解题拆解】\n\n| 环节 | 内容 |\n| --- | --- |\n| 题型识别 | 二、三产业 = 第二产业 + 第三产业，人均二、三产业收入 = 人均第二产业 + 人均第三产业 → 可理解为**增速混合**问题 |\n| 第一步·补第二产业增速 | 第二产业只给增量 11 元，基期 = 193 − 11 = 182 → 增速 ≈ `11/182 = 6%`（估一下即可） |\n| 第二步·定区间 | 混合结果必在 `6%` 与 `21.4%` 之间 → A（6.0%）与 D（21.4%）恰是两端，排除 |\n| 第三步·看基期定靠向 | 第三产业基期（509 附近）明显大于第二产业基期（182）→ 混合结果应**更靠近 21.4%** |\n| 第四步·卡中点 | 板书：`7.7 —— 13.7 —— 7.7`，C 的 13.7% 恰好是 6%~21.4% 的**正中间**；比 13.7 更靠近 21.4% 的只有 B 的 16.7% |\n| 结论 | ✅ B（16.7%） |\n\n**板书速算过程：**\n\n```\n第二产业增速 ≈ 11 / 182 = 6%\n第三产业增速 = 21.4%\n混合区间：(6%, 21.4%)，排除 A、D\nC 13.7% 恰为中点：13.7 − 6 = 7.7，21.4 − 13.7 = 7.7\n基期更大的第三产业权重更大 → 混合值偏离中点、靠近 21.4% → 16.7%\n```\n\n### 【选项原文】\n\n- A.6.0%\n- ✅ B.16.7%\n- C.13.7%\n- D.21.4%\n\n### 【答案】✅ B（16.7%）\n\n### 【解析】\n\n- **A.6.0%**：等于第二产业端点值，混合结果不可能落在端点上（两端权重不均等），排除（板书 ✗）。\n- **B.16.7%** ✅：位于中点 13.7% 与 21.4% 之间、靠近 21.4%，符合\"第三产业基期大、权重占优\"的混合方向（板书 ✅）。\n- **C.13.7%**：恰为 6% 与 21.4% 的等距中点（两边距离都是 7.7），选它意味着两个部分基期相等——显然 182 ≠ 509，排除（板书 ✗）。\n- **D.21.4%**：等于第三产业端点值，排除（板书 ✗）。\n- **估算原则**：第二产业增速只给增量，估\"约 6%\"就够了，**不要**真去算 6.1% 还是 5.8%。\n\n> 老师原话：**\"复合型的问题，它一般 95% 以上的题，它的计算精度要求都不是太高的。所以你这里 6% 你大概估一下就好了……需要算细的时候再去算，你先估，估不出来了再去细算，不要浪费太多时间在算上。\"**\n\n- **核心辨析：为什么第 2 题不能用增速线段混合，而这题（人均）又可以？**\n\n> 老师原话：**\"因为这个地方它的人均分母是一样的。第二题农村跟城镇的分母是不一样的……根本原因是第二题的这两个数没法直接相加。\"**\n\n| 对比 | 第 2 题（不能用） | 第 4 题（能用） |\n| --- | --- | --- |\n| 数据性质 | 城镇人均 30391 + 农村人均 16632 ≠ 全国 24538 | 人均第二产业 193 + 人均第三产业 509 = 702 ✅ |\n| 原因 | 24538 本身已经是 30391 和 16632 的一次**现期混合**结果，两个分母（人数）不同，分子（总支出）不可直接相加 | 两部分人均的**分母（人数）相同**，分子（纯收入）可以直接相加 |\n| 结论 | 只能用人均值本身做**分式混合**（求人数比） | 可以直接用增速做**线段混合** |\n\n- **陷阱类型**：**干扰数据陷阱**——人均财产性收入 229 元（增 26 元）、人均转移性收入 563 元（增 24.4%）与\"家庭经营二、三产业\"无关；24.4% 就是用来勾你在 D 与 B 之间犹豫的。概念上还要防第 2 题讲过的\"分式的分式\"误区：这里能用混合，**不是因为**人均没问题，而是因为\"分母相同、可加\"这一前置条件被满足。\n\n---\n\n## 本讲知识点总表\n\n| 知识点 | 内容 | 对应题目 |\n| --- | --- | --- |\n| 增速混合·区间秒杀 | 混合增速必在两部分增速之间；选项只落一个 → 直接选，零计算 | 第 1 题 |\n| 分式混合（均值混合） | 均值 = 分子/分母；距离比 = 分母反比；求\"人数比\"就找分母是人数的均值 | 第 2 题 |\n| 分式的分式（人均的增速） | 人均已是分式，其增速是\"分式的分式\"，不符合线段混合，其距离比\"什么都不代表\" | 第 2 题 |\n| 增速混合的分母 | 增速混合的距离比 = **基期**反比，与人数、现期结构无关 | 第 2 题 |\n| 混合定量·方向与上界 | 小部分 + 混合中心 → 大部分必在中心另一侧；等权重上界 = 中心 ± 距离 | 第 3 题 |\n| 混合定量·精确计算 | 现期比 →（减增速差、除以 1+小增速）→ 基期比 → 拆\"整体=部分+部分\" → 按基期比分配距离 | 第 3 题 |\n| 现期比 ≠ 基期比 | 直接用\"现期差 ÷ 现期值\"当基期比是错的，现期与基期有差距 | 第 3 题 |\n| 人均混合的前置条件 | 两部分\"分母相同、分子可直接相加\"才能用增速线段混合；否则只能用人均值本身做分式混合 | 第 4 题 vs 第 2 题 |\n| 增量求增速再混合 | 只给增量时先估：`增速 ≈ 增量 / (现期 − 增量)`，粗估即可 | 第 4 题 |\n| 中点定位法 | 先算两端增速的中点，混合值偏向基期大的一方 | 第 4 题 |\n\n## 速算口诀与解题流程\n\n**混合问题通用流程（画面板书 + 口述整理）：**\n\n```\n1. 识别：整体 = 部分 A + 部分 B，且给了 A、B 的增速（或均值）\n   → 混合问题\n2. 定方向：混合结果必在 A、B 之间 → 先排除区间外的选项\n3. 看权重：基期（或分母）大的一侧，混合结果更靠近它\n   → 用中点 / 距离倍数关系排除\n4. 二选一仍不踏实 → 精确计算：\n   现期比 ≈ 整体现期 / 部分现期\n   基期比 ≈ 现期比 − 增速差（再除以 1 + 小增速）\n   \"整体/部分\" 基期比 − 1 = 另一部分与该部分的基期比\n   距离 = 两部分增速差 ÷ 基期比\n5. 验算精度要求高的题才算，95% 的混合题估一估就够\n```\n\n**口诀：**\n\n> **\"混合必在两者之间，靠近大的（基期大的一侧）。\"**\n> **\"分式混合：距离比 = 分母反比。\"**\n> **\"人均的增速是分式的分式，不符合线段混合。\"**\n> **\"先估估，估不出来了再去细算，不要浪费太多时间在算上。\"**\n\n## 易错点与陷阱清单\n\n| # | 陷阱 | 说明 | 出处 |\n| --- | --- | --- | --- |\n| 1 | 干扰数据 | 占比 36.3%、262 次投资 654.91 亿元；财产性收入、转移性收入——都与所求无关 | 第 1、4 题 |\n| 2 | 增速混合 vs 分式混合混淆 | 问人数比却拿 0.3%/1.8%/4.5% 的增速去算——增速分母是基期，与人数无关 | 第 2 题 |\n| 3 | 分式的分式 | 人均的增速不符合线段混合，其距离比\"什么都不代表\" | 第 2 题 |\n| 4 | 时间范围 | 给 6 月和 1-6 月，问 1-5 月；1-5 = 1-6 − 6，别拿错增速 | 第 3 题 |\n| 5 | 现期比当基期比 | 用\"现期差 ÷ 部分现期\"推倍数是错的，现期与基期有差距 | 第 3 题 |\n| 6 | 中点陷阱 | C 选项 13.7% 恰为中点（7.7 / 7.7），选它等于默认两部分基期相等 | 第 4 题 |\n| 7 | 产量/销量混用 | 一段材料两套数据，只问产量就别用销量的数 | 第 3 题 |\n| 8 | 精度浪费 | 复合型问题 95% 精度要求不高，估 6% 就别算 6.1%/5.8% | 第 4 题 |\n\n## 老师金句\n\n> ⭐ **\"这个题目在考场上遇到，就属于是这种没有任何计算，你找到两个数据，就应该直接把答案选出来的题目。\"**\n\n> ⭐ **\"4.5 和 0.3 和这个 1.8 之间的距离比代表了什么？什么都不代表。\"**\n\n> ⭐ **\"千万千万不要再去用什么人均收入、人均支出的增速去看线段混合关系了，你只能抓这一个东西。\"**\n\n> ⭐ **\"你看像一般这种题目，它的这个倍数差距太明显了……你看的是他们跟这个混合中心之间的距离。\"**\n\n> ⭐ **\"一般题目基本上不要去算，只有那种精度很高的题，你再去算。\"**\n\n> ⭐ **\"复合型的问题，95% 以上的题，它的计算精度要求都不是太高的。先估，估不出来了再去细算，不要浪费太多时间在算上。\"**\n\n> ⭐ **\"这不对的，你这算的是现期比，现期跟基期是有差距的。\"**\n\n> ⭐ **\"根本原因是第二题的这两个数没法直接相加……这是增速混合必须要满足的前置条件。\"**\n","outline":[{"level":2,"text":"第 1 题｜跨境电商交易规模·增速混合秒杀","id":"第-1-题跨境电商交易规模增速混合秒杀"},{"level":3,"text":"【题干原文】","id":"题干原文"},{"level":3,"text":"【材料数据】","id":"材料数据"},{"level":3,"text":"【解题拆解】","id":"解题拆解"},{"level":3,"text":"【选项原文】","id":"选项原文"},{"level":3,"text":"【答案】✅ C（13.6%）","id":"答案-c136"},{"level":3,"text":"【解析】","id":"解析"},{"level":2,"text":"第 2 题｜城乡居民人均消费支出·分式混合求人数比","id":"第-2-题城乡居民人均消费支出分式混合求人数比"},{"level":3,"text":"【题干原文】","id":"题干原文-2"},{"level":3,"text":"【材料数据】","id":"材料数据-2"},{"level":3,"text":"【解题拆解】","id":"解题拆解-2"},{"level":3,"text":"【选项原文】","id":"选项原文-2"},{"level":3,"text":"【答案】✅ D（4 : 3）","id":"答案-d4-3"},{"level":3,"text":"【解析】","id":"解析-2"},{"level":2,"text":"第 3 题｜汽车产量 1-5 月增速·混合定量精确计算","id":"第-3-题汽车产量-1-5-月增速混合定量精确计算"},{"level":3,"text":"【题干原文】","id":"题干原文-3"},{"level":3,"text":"【材料数据】","id":"材料数据-3"},{"level":3,"text":"【解题拆解】","id":"解题拆解-3"},{"level":3,"text":"【选项原文】","id":"选项原文-3"},{"level":3,"text":"【答案】✅ B（11.1%）","id":"答案-b111"},{"level":3,"text":"【解析】","id":"解析-3"},{"level":2,"text":"第 4 题｜农村居民二·三产业纯收入·人均混合的前置条件","id":"第-4-题农村居民二三产业纯收入人均混合的前置条件"},{"level":3,"text":"【题干原文】","id":"题干原文-4"},{"level":3,"text":"【材料数据】","id":"材料数据-4"},{"level":3,"text":"【解题拆解】","id":"解题拆解-4"},{"level":3,"text":"【选项原文】","id":"选项原文-4"},{"level":3,"text":"【答案】✅ B（16.7%）","id":"答案-b167"},{"level":3,"text":"【解析】","id":"解析-4"},{"level":2,"text":"本讲知识点总表","id":"本讲知识点总表"},{"level":2,"text":"速算口诀与解题流程","id":"速算口诀与解题流程"},{"level":2,"text":"易错点与陷阱清单","id":"易错点与陷阱清单"},{"level":2,"text":"老师金句","id":"老师金句"}]}]},{"name":"第 8 课 分式比较大小","items":[{"id":"P21","title":"分式比较大小","full":"第八课 分式比较大小","lect":"","dur":"106:24","sec":6384,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 21 集\n\n# 第八课 分式比较大小\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 21 集（共 21 集，本合集最后一集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=21`\n> **时长**：106 分 24 秒\n> **本集主题**：**分式比较大小**——分子分母是否同边的定性判断、分子分母同边时的四种定量比较法（①直接计算 ②平均数增速比较 ③分式混合比较 ④基准线法）、增速比较大小的相邻年份特殊技巧、A 与非 A 比较的一致性原理\n\n---\n\n## 目录\n\n- [一、开篇：为什么还要学分式比较大小](#一开篇为什么还要学分式比较大小)\n- [二、本讲三大知识板块](#二本讲三大知识板块)\n- [三、第一步：先看分子分母是否同边](#三第一步先看分子分母是否同边)\n  - [例题 1｜2019~2021 年我国人口男女性别比降序排列](#例题-120192021-年我国人口男女性别比降序排列)\n- [四、分子分母大小同边时：四种定量比较法](#四分子分母大小同边时四种定量比较法)\n  - [① 直接计算](#-直接计算)\n  - [② 平均数增速比较（差分法之一·横向比较）](#-平均数增速比较差分法之一横向比较)\n  - [③ 分式混合比较（差分法之二·纵向比较）](#-分式混合比较差分法之二纵向比较)\n  - [④ 基准线法（统一减去某个常用好算的值）](#-基准线法统一减去某个常用好算的值)\n- [五、例题精讲（比较大小类）](#五例题精讲比较大小类)\n  - [例题 2｜2012 年全省各市及义乌市 GDP 初步核算数据 · 第二产业增加值占 GDP 比重](#例题-22012-年全省各市及义乌市-gdp-初步核算数据--第二产业增加值占-gdp-比重)\n- [六、第二板块：增速比较大小的特殊技巧](#六第二板块增速比较大小的特殊技巧)\n  - [「利滚利」原理与结论](#利滚利原理与结论)\n  - [例题 3｜2016 年与 2015 年相比 · 我国新闻出版产业营业收入](#例题-32016-年与-2015-年相比--我国新闻出版产业营业收入)\n  - [例题 4｜2018~2021 年 · 我国数字经济市场规模同比增速最快](#例题-420182021-年--我国数字经济市场规模同比增速最快)\n  - [例题 5｜2012~2015 年 · 福建省全部工业增加值增速最快](#例题-520122015-年--福建省全部工业增加值增速最快)\n- [七、第三板块：A 与非 A 比较](#七第三板块a-与非-a-比较)\n  - [7.1 最贴近现实的讲法：两个班的男女比](#71-最贴近现实的讲法两个班的男女比)\n  - [7.2 一致性原理的证明（板书推导）](#72-一致性原理的证明板书推导)\n  - [7.3 最常用之处：增速的比较大小](#73-最常用之处增速的比较大小)\n  - [7.4 ⚠️ 使用条件（老师反复强调的两个限制）](#74-️-使用条件老师反复强调的两个限制)\n  - [例题 6｜2021 年 · 快递业务量同比增速最快](#例题-62021-年--快递业务量同比增速最快)\n  - [例题 7｜2020 年 · 种植面积同比增速最快](#例题-72020-年--种植面积同比增速最快)\n  - [例题 8｜2012~2015 年 · 社会组织接收社会捐赠款占总捐赠款比重](#例题-820122015-年--社会组织接收社会捐赠款占总捐赠款比重)\n- [八、本讲知识点总表](#八本讲知识点总表)\n- [九、速算口诀与解题流程](#九速算口诀与解题流程)\n- [十、易错点与陷阱清单](#十易错点与陷阱清单)\n- [十一、老师金句](#十一老师金句)\n\n---\n\n## 一、开篇：为什么还要学分式比较大小\n\n> 今天这一课课程量不是太大，主要是教大家怎么去快速比较一些距离比较近的分式。\n\n> 有的时候分式其实简单一点的还是比较好比较的很明显的。比如说我要是写个什么你 73 除以 37 跟什么 149 比 24，你说这两个分式大小，我要不要算？其实这个东西嘛，都不需要算的，你看都能看得出来哪个大哪个小，对不对？这很明显，这边两倍不到，这个地方起码好几倍了，一看就能看出来，对吧？\n\n板书示例（画面 f_0008）：\n\n```\n73 / 37   （≈ 1.97，两倍不到）\n149 / 24  （≈ 6.2，好几倍）\n```\n\n> 今天主要讲的是一些稍微难一点的，不是你一眼就能看出来的，怎么去把它快速比较出来谁大谁小呢？\n\n---\n\n## 二、本讲三大知识板块\n\n目录（画面 f_0006~f_0015）：\n\n| 序号 | 板块名称 | 板书补充（红笔） | 性质 |\n|---|---|---|---|\n| 壹 | 差分法 | 临近分式 | 本讲主要算法 |\n| 贰 | 增速比较大小 | 特殊技巧 | 特殊技巧型 |\n| 叁 | A 与非 A 比较 | 特殊技巧 | 特殊技巧型 |\n\n> 我们今天主要讲三个知识点，第一个知识点叫差分法，这个也是我们主要用在……比较两个距离很近的分式，对于很近分式的一个运用。\n\n> 然后第二个知识点是我们在比较增速大小，那里题型上有一些特殊的技巧。只是些特殊技巧，能够稍微帮助你快速排除一些不可能的选项，是一种特殊技巧型的。不过这个增速的比较……因为你增速它也是分式嘛，增速等于增量除以基期，所以它的基本的运算逻辑还是可以去依靠这个差分法的，也是建立在他身上的。\n\n> 然后第三个知识点是一个 A 与非 A 的比较，这个也算是一种特殊技巧，帮你去简化一些分式比较。就是有些东西你不需要去每个……用差分法把它完完整整的非常准确地给它算出来。\n\n> **后面两个算技巧，前面算是我们今天的一种算法。**\n\n---\n\n## 三、第一步：先看分子分母是否同边\n\n> 为了让这个东西说得全一点。虽然大家也都知道，但我还是要讲一下，不然有些同学他万一问：那老师这个分子分母大小要是怎么不一样的时候，我怎么办？\n\n> 我们分式比较大小呢，我们首先第一步应该去看**分子跟分母它的大小是否同边**。\n\n### 3.1 分子分母大小不同边时\n\n板书（画面 f_0027）：\n\n> **分子分母大小不同边时，分子大分母小者更大。**\n\n```\n480 / 175   VS   347 / 194\n```\n\n判断过程（画面红笔标注）：\n\n```\n480 > 347   （左边分子大）\n194 > 175   （右边分母大）\n⇒ 左边分子大、分母小，所以左边这个分式更大\n```\n\n> 你看分子是不是左边大？480 它大于 347，分母 194 它就大于 175，对吧？这个就叫做分子分母不同边。它并不是某一边分子又大、分母又大，让你不好比的，这种是非常好比的。**只要他们分子分母大小不同边，那么分子大的、或者说分母小的，它算出来结果就更大。**\n\n> 这个就好像什么呢？就是右边这个就叫什么情况，**僧多肉少、僧多粥少**。分的人太多了，粥又少了。本来就已经少了，你要分给那么多人，他这个平摊到每个人身上的还能多吗？\n\n> 所以这个分子分母大小不同边，那么分子大的这边，它的分式就大。左边钱又多人又少，右边钱又少人又多，换你你要去哪边？你肯定要去左边嘛，对吧？这就是最简单的情况。\n\n### 例题 1｜2019~2021 年我国人口男女性别比降序排列\n\n#### 【题干原文】\n\n> 表 1 2015 年~2021 年国内生产总值（亿元）、人口分布表（万人）\n>\n> 2019~2021 年，我国人口男女性别比按**降序**排列正确的是：\n> A. 2019年>2020年>2021年　　B. 2021年>2020年>2019年\n> C. 2020年>2019年>2021年　　D. 2020年>2021年>2019年\n\n#### 【材料数据】（画面 f_0036 / f_0045 逐字抄录）\n\n| 年度 | 国内生产总值（亿元） | 年末总人口（万人） | 男性人口（万人） | 女性人口（万人） | 城镇人口（万人） | 乡村人口（万人） |\n|---|---|---|---|---|---|---|\n| 2015 | 688858 | 138326 | 70857 | 67469 | 79302 | 59024 |\n| 2016 | 746395 | 139232 | 71307 | 67925 | 81924 | 57308 |\n| 2017 | 832036 | 140011 | 71650 | 68361 | 84343 | 55668 |\n| 2018 | 919281 | 140541 | 71864 | 68677 | 86433 | 54108 |\n| 2019 | 986515 | 141008 | 72039 | 68969 | 88426 | 52582 |\n| 2020 | 1013567 | 141212 | 72357 | 68855 | 90220 | 50992 |\n| 2021 | 1143670 | 141260 | 72311 | 68949 | 91425 | 49835 |\n\n> 注：题干中「2019~2021 年」三行在画面上被红笔圈出（数据来源年份）。\n\n老师在画面上写下的三个分式（红笔，画面 f_0045）：\n\n```\n19年： 72039 / 68969\n20年： 72357 / 68855     ← 被红圈圈出，旁边标「MAX」\n21年： 72311 / 68949\n```\n\n#### 【解题拆解】\n\n| 项目 | 内容 |\n|---|---|\n| 题型识别 | 比值大小排序（男女性别比 = 男性人口 ÷ 女性人口） |\n| 定位数据 | 2019、2020、2021 三年「男性人口」「女性人口」两列 |\n| 列式 | `性别比 = 男性人口 / 女性人口` |\n| 定性比较 | 2020 年分子最大（72357）、分母最小（68855）→ **分子大、分母小，分式必最大** |\n| 排除 | 2020 年最大 ⇒ 排除 A、B（A、B 把 2020 年排第二/第三） |\n| 再比 19 与 21 | 21 年分子 72311 > 19 年 72039，且 21 年分母 68949 \u003c 19 年 68969 ⇒ 21 年 > 19 年 |\n| 结论 | 2020年 > 2021年 > 2019年 |\n\n#### 【选项原文】\n\n- A. 2019年>2020年>2021年\n- B. 2021年>2020年>2019年\n- C. 2020年>2019年>2021年\n- D. 2020年>2021年>2019年\n\n#### 【答案】\n\n✅ **D**\n\n#### 【解析】\n\n> 觉得近那先看大小关系，谁的分子最大、谁家的钱最多，是不是 2020 年？这个钱最多他是最大的 72357。谁家的人最少？（分母最小）……那你看它的分母还是最小的，六八八五五，它分母还最小，那还有啥说的？他家钱又最多、人又最少，那他的人均值肯定最大，所以整体就是最大的。\n\n> 所以，20 年既然最大，那么我们就可以排除 A、B 了，20 年必须要放在最前面。然后我们再去比较 19 年和 21 年。\n\n> 72311 比 72039 大，68949 又比 68969 小，又符合我们刚刚说的钱多人少，分的大……让它平摊下来就更多，所以 21 年还要大于 19 年。20 最大，所以选择 D，20 大于 21 大于 19。\n\n**补充要点（老师顺带强调的）**\n\n> 所以在比较分式大小之前，肯定还要**先看他们分子到底谁大，分母谁大**。\n\n> **降序**是由大到小降，它叫降，再降低，由大的变成小的，像滑滑梯一样降下来。**升序**是由低到高。你应该操作过那个 Excel 表吧，Excel 表让你去排降序，排降序就是从上往下越来越小，排升序就是从上往下越来越大。\n\n> 一般的时候呢，我建议你写个三位，其实基本上就够了。在这个题目下相对特殊一点，它这个分子分母呢靠得很近，所以最好给它写全一点。\n\n**陷阱类型**：概念陷阱（「降序/升序」方向看反）+ 时间陷阱（题目只问 2019~2021 三年，表中却有 2015~2021 七年数据）\n\n---\n\n## 四、分子分母大小同边时：四种定量比较法\n\n板书大标题：**分子分母大小同边时**\n\n> 如果分子分母的大小同边呢？比如说下面这个情况 153 除以 493，跟 397 除以 1231，你看右边这个分式，它的分子又大、分母又大，就没有办法用我们刚刚的那种很直接的那种大小关系去判断去排除了。\n\n> 这个时候怎么办呢？这时候就肯定要跟它具体的量又有关系了。你要去稍微分析一下它的量是什么样的，你不能只是定性的，**要定量了**。\n\n> 那定量呢，我们主要有**四种办法**。第一种就直接算……第二个是平均数增速比较……第三种就是分式混合比较……然后最后一种办法……统一减掉这个值，去看跟这个值的距离来判断分式的大小关系。\n\n### ① 直接计算\n\n板书（画面 f_0063）：\n\n> **①直接计算**\n\n```\n153 / 493   VS   397 / 1231\n```\n\n> 就是最朴实无华的……这个好算，我就算了嘛，你说这个 153 除以 493 这不好算吗？算 15 除以 50 左右，你先估一下行不行？能估吧，他是不是就是三分之一出头？或者你说他是零点三多一点，是不是好算？\n\n> 那 397 除以 1231，你有没有觉得这 397 跟 400 很近？那 400 除以 1231，他这不就明显小于 1/3 吗？那一个大于三分之一、一个小于三分之一，那两边的大小关系是不是能判断出来了？\n\n> 我刚这个地方搞错了，有点迷糊了……其实不是四百五，它不用比那个三分之一大。它其实就是跟相对来说还是比较好的，我们把它想成 150 除以 500。\n\n> 就是感觉它跟 150 除以 500 是比较近的，所以我们就相对来说就把它大概地去估算一下，看一下它到底在 0.3 左右。首先我们肯定可以判断出来，它是比 0.3 要大一点点的。然后我再看这个地方，那这个地方呢，其实我感觉它好像是不是也是稍微大于 0.3 的？是不是都是 0.3 几？那都是 0.3 几，那我们直接拿 0.3 去比，肯定比不出来。那我们就要进一步，我们要去看看它到底是 0.3 几呢？我们就去算。\n\n**画面上的完整演算（f_0092 逐字抄录）**\n\n左边（给分母补成 500，好算）：\n\n```\n153 / 493  ── 分子 +2，分母 +7 ──▶  155 / 500 = 0.31\n（左侧另标：153/493 = 0.3+）\n```\n\n右边（给分母补成 1250，好算）：\n\n```\n397 / 1231 ── 分子 +6，分母 +19 ──▶  403 / 1250\n403 / 1250  →  403 × 8 = 3224  →  0.322\n（右侧标：> 0.3，且 = 0.322）\n```\n\n结论：\n\n```\n0.31 \u003c 0.322  ⇒  153 / 493  \u003c  397 / 1231\n```\n\n> 那算的时候，既然 150 除以 500 这么好算，我们把这 493 去给它变成 500，给下面去加个 7，那上面呢，我们知道三分之一左右、三分之一附近，上面我就加个 2，就变成 155 除以 500，就会是 0.31。\n\n> 那右边这个，我们就去看它是零点三几。我们可以把它的分母去加个 19，把它变成 1250，因为这个数我们就看出来了，它也很好算，它的分母上离我们常用的那些什么整数、或者百万分，它很近。下面要加 19，那上面加个 6，0.3 左右嘛，20 乘以 0.3 加个 6 左右，上面就变成 403，下面变成 1250。1250 除以 250 是不是等于乘以 8？那就 403 乘以 8，等于 3224，就能算出来，它其实大概是 0.322。所以左边是 0.31，右边是 0.32，那就是右边稍微大一点。\n\n> 这种本身就是算已经比较好算的时候，你就直接给我把它算出来就好了。可以稍微先随意一点的，这边加 7，这边加 2 变成 0.31，这边加 19，这边你哪怕加个 3 也行，340 除以 1250 是 0.32，你也能看得出来。但是其实一般我感觉用的不是特别多，因为你想遇到这种比较凑巧、比较好算的方式，不是那么特别好找的。\n\n**再来两组练手（画面 f_0098 / f_0110）**\n\n**（1）153 / 203 VS 517 / 711**\n\n```\n左边：153 / 203  ≈  150 / 200 = 3 / 4 = 0.75\n右边：517 / 711  ≈  500 / 700 = 0.715\n（画面右注：1/7 = 0.143，×5 = 0.715）\n⇒ 153 / 203  >  517 / 711\n```\n\n> 如果我看到这个情况，153 除以 203，和 517 除以 711 比哪个大哪个小？这两个呢，也算是比较好算的吧，因为它们的分母和分子的关系，就属于是你能直接看出来它大概是个零点几几倍，或者说是个几分之几比较好看的。\n\n> 203 分之 153，我可以把它约等于 4/3。这个看得懂吗？因为它的分母离那个整数 200 很近，分子离 150 又很近，我就近似地把它看作 200 分之 150，就是 3/4。那右边我们也根据**放缩**的思想，可以把它近似看作七分之五。\n\n> 比较靠近那四分之三是 0.75。7 分之 5 呢？1/7 是 0.143，0.143 乘以 5 是 0.715。所以它是 0.715，所以相对比较明显，就是左边会大一点。\n\n> 这里就是我们借助**放缩的思想**，我们知道我们把它看作四分之三跟七分之五，对它们的这个结果来说，影响不会很大。因为我分母没有动很多，我分母只是从 711 变成了 700，分子只是从 517 变成了 500，动得都很小，所以这对这个结果的影响就会非常小。\n\n**（2）513 / 1117 VS 36 / 85**\n\n```\n左边：513 / 1117 ── 分子 −3，分母 −7 ──▶ 510 / 1110 = 0.46\n（画面标：513/1117 被圈出，下面写 510/1110，再写 0.46）\n右边：36 / 85 ── 分子 +2，分母 +5 ──▶ 38 / 90 = 0.418\n（另一验证：85 × 0.46 = 39.1，说明分子要到 39.1 才够 0.46，而实际只有 36）\n⇒ 513 / 1117  >  36 / 85\n```\n\n> 那我们再看下面这种情况，513 除以 1117，这个你会觉得好算吧？因为分母上是一个你常用的百分数或者整数的附近，你不算它，你就觉得有点浪费了……所有时候可以把左边算出来，513 除以 1117 等于什么？**错位相减**，这样的就大概是 0.46。\n\n> 但右边这个吧，有没有觉得好像可能说不一定有那么好算？这种时候你可以用两种思路，一种是就算吧……你稍微随便估一下，下面加个 5，把它凑成 90，因为除以 9 是不是可以凑相加也好算。下面加个 5，上面的一半不到，我加个 2，那就 38 除以 90，除以 9，等于**错位相加**变成 0.418。所以你看这也能看得出来，还是左边这个明显大一点。\n\n> 或者还可以怎么样呢？或者如果你觉得一个好算、另外一个不是那么好算的时候，你可以把这个好算的先大概算出来，然后你去拿右边的去**代入验证**。你就看看这个 85 乘以 0.46 应该是多少。85 乘以 0.46，我会乘呢，我会把它变成 17 乘以 23（这边有个 5，我给它乘了个 2 变成 17，这边就除了个 2 变成 23），3 乘 17 就是 51，2 乘 17 就是 34，算出来是 391，说明什么？你拿这个 85 乘以 0.46，算出来是 391，说明 39.1 除以 85 它才是 0.46。你现在只有 36，分子上小了，分子太小了，它不够。那它不够，它不就小吗？所以左边的大。\n\n> 不过这块我觉得还是前面的一些计算上的一些知识点吧，不算什么很新的知识点。**就是分式它本身就比较好算的话，你就算**，不是说每次什么比较分式大小，都要用我们后面讲的那些什么差分法那个技巧去比的。\n\n> 就好像我们前面学的一些东西，你也一样要以这样的思路。我们前面不是还学了什么增量比较大小、增量比值。有同学说感觉我好像什么时候都拉平去做，都会觉得很麻烦。那就是因为什么呢？我也讲过，**如果这个增量它本身就比较好算了，你就给我把它增量直接算出来**……那这个地方有些题目它分式大小很容易就能看出来的，你也不要去用什么我们后面讲的那些技巧，你就直接把它搞出来就好了，**不要舍近求远**。\n\n> 我们的很多一些技巧是建立在它的增量不太好估、基期算起来太麻烦，或者说量太多了……或者说这个地方分式你直接去算吧，有点麻烦，那时候你再用我的什么技巧去比。**不要什么地方就是硬要去用，方法都是有它的一个适用性的。**\n\n### ② 平均数增速比较（差分法之一·横向比较）\n\n板书（画面 f_0135）：\n\n> **②平均数增速比较**\n>\n> 如同基期比 `A₁/B₁`、现期比 `A₂/B₂`，则\n\n```\nr₁ = (A₂ − A₁) / A₁     （分子的增速）\nr₂ = (B₂ − B₁) / B₁     （分母的增速）\n```\n\n> **分子涨得快，分式就变大；分母涨得快，分式就变小。**\n\n画面给出三组题：\n\n```\n495 / 277   VS   574 / 298       （第一组，分子分母都很近）\n340 / 183   VS   284 / 150       （第二组，题目反过来写）\n151 / 413   VS   12  / 37        （第三组，分子分母离得远，需等比扩大）\n```\n\n> 我们后面讲的两个方法呢，主要都是一个叫差分法。**差分法顾名思义，就是把它的分子分母去做差**，把它分开来。\n\n> 比如说我在比较这两个的时候，他们是不是也很近？而且我觉得除以 277 这个东西，我觉得有点烦，我不想去除它。分子分母很近，都差不多大，怎么办呢？我把它的分子分母去做差。495 与 574 相差 79，298 与 277 相差 21。\n\n> 然后我们用什么方法呢？第一种叫平均数增速比较，就是我们把这个分式 495 除以 277 看作是一个**基期比**。我一般习惯性把这种小的，你要把它看成一个基期比，就相当这是我们去年的，比如说这是我们 24 年的人均收入，495 块钱分给 277 个人。然后后面这个大一点的呢，它就是 25 年的人均收入，这就**现期比**。那我们去比较基期比跟现期比，他们谁大谁小，我们是不是看分子跟分母的增速，看分子长得快还是分母长得快，对不对？\n\n**第一组：495/277 VS 574/298（画面 f_0153）**\n\n```\n495 / 277  →  574 / 298\n分子：277 → ... 不对，分子 495 → 574，增加 79\n分母：277 → 298，增加 21\n\nr₁ = 79 / 495  > 10%   ✓\nr₂ = 21 / 277  \u003c 10%   ✗\n\n分子涨得快  ⇒  分式变大  ⇒  574 / 298 更大\n```\n\n> 那第一个例子情况就还算是比较好比较的。你看 79 大概是这个 495 的多少？是不是已经超过 10% 了？分母呢？你这个 277 到 298 才加了 21，都不到 10%。你分子长得快，你这个分式就提高嘛。所以分数提高了，那右边不就大嘛。\n\n> 对，就相当于人，你这个钱涨得比你人涨得快，那你的这个人均收入肯定提高。**分子涨得快，分数就变大**，所以右边就高。\n\n> 你也可以从出法方式角度去理解：你分母才涨了 10% 不到，那我如果希望这个分式大小不变，我也只需要这个分子去涨 10% 不到不就好了吗？结果分子涨了 10% 几，涨多了，那如果分子涨多了，结果不就变大了吗？\n\n板书（画面 f_0144/f_0153）红笔标注：\n\n```\n基期比：495 / 277  ↑79     现期比：574 / 298  ↑21\n（旁注：24 年人均收入 / 28 年人均收入）\n```\n\n**第二组：340/183 VS 284/150（画面 f_0162 / f_0172）**\n\n```\n340 / 183   VS   284 / 150\n把小的（284/150）当基期：\n分子：284 → 340，增加 +56\n分母：150 → 183，增加 +33\n\nr₁ = 56 / 284  \u003c 20%（约 20% 不到）\nr₂ = 33 / 150  = 22%  → 正好 20% 多\n⇒ 分母涨得多  ⇒ 分式变小  ⇒ 原来（左边 340/183）更大\n（画面标：左边更「大」，右侧写「变小」）\n```\n\n> 那我们来看第二个例子。他虽然反过来写了，但你还要记得，我们就把小的这个当基期，这样你就不容易去搞混了。\n\n> 284 涨到 340，涨了多少？涨了 56。分母呢，涨了 33。那这时候分子分母谁长得多？56 是 284 的多少？20% 不到吧。33 是 150 的多少？正好百分之二十吧。所以是不是分母长得多？分母长得多，它就要变小了。\n\n> 你看这样是不是就是说虽然他们这两个分式，你如果直接去除下来、直接算一下，心中会发现他们是很近的，但是如果你差分了，你把他的分子分母分别做个差，他们的大小关系就能看得相对来说清楚一点了。百分之二十……所以就是你分子涨得少、分母长得多，就会导致这个结果变小。既然变小了，那就是原来更大了。\n\n**第三组：151/413 VS 12/37（分子分母离得远 → 等比扩大拉近）**\n\n> 那刚刚这里都属于是分子分母相对比较近的时候。**要是这个分子分母离得比较远怎么办？** 你这个 151 除以 413，跟这个 12 除以 37，我们如果还是按照刚刚那样来做，会发现什么情况？\n\n```\n151 − 12 = 139\n413 − 37 = 376\n```\n\n> 那这个算这个增速就感觉怪麻烦的，虽然说不是不能做，你会发现 376 是 37 的 10 倍多，139 是 12 的 11 倍多，也能看得出来这个还是在变大的，但这样是不是就麻烦，你减的时候都减得感觉费劲。怎么办？\n\n> 我们可以去**等比例调整**，你去把这个 12 除以 37 乘个好乘的倍数，让它离这个 151/413 近一点。\n\n**画面演算（f_0198 逐字抄录）：**\n\n```\n× 10 后：\n151 / 413   VS   120 / 370\n分子 +31，分母 +43\n43 只占 370 的 11.6%（画面圈注），31 却是 120 的 25% 多\n⇒ 分子增速更高  ⇒ 左边 151/413 更大\n```\n\n> 把它变成比如 370 的 120 这样的话，它的分子你看就涨了 31，分母涨了 43，这样看是不是就看得出来了？这样一看就能看得出来，分子分母谁长得快了吧。这个 43 只有 370 的 11% 左右，31 是 120 的 20 几了，所以上面这个**分子增速更高**。分子涨得快，那么这个结果就会变大，所以左边这个 151 除以 413，它就更大。\n\n**（画面另一路演算：×11）**\n\n```\n× 11 后：\n12 × 11 = 132\n37 × 11 = 407\n151 / 413   VS   132 / 407\n分子 +19，分母 +6  → 分子涨得快，左边更大\n```\n\n> 那你补一位，肯定相对来说是比截一位来得更准确一点的。你乘 11 的问题是没有乘 10 这样直接、这样快。乘 11 的优点是肯定是离得更近。如果你是乘了 11，变成 132，373……37×11 = 407。这样子的话，分子涨了 19，分母只涨了 6，这样也很明显，分子涨得快。但主要是你这个乘 11 这一步，跟乘 10 去得到这个 370 和 120、和得到这个 407 和 132，肯定这个（乘 10）稍微快一点。但是后面减下来，肯定是乘 11 那个快一点……那至于总体来看谁快，那就要看具体数字了，都可以。\n\n> **乘 11 是为了离得更近，你离得越近，你把他们那个误差就越好去比较。**\n\n> 这块到底有没有感觉？就跟我们上节课讲那个拉平、说的那个补充的那一块，就是很多时候你去调整的时候，**你把你的计算对象搞小一点，你的计算上或者说比较上就会变得更清楚更简单。**\n\n> 这种原理就好像什么呢？就好像我再比较两个人个子谁高谁低。如果他们两个人都是一米七几，一个人一米七三，一个人一米七四，有可能我感觉差不多高。但如果你把他们统一去减掉个一米七，你就只看个三厘米跟四厘米，一下就感觉这四厘米比三厘米要直接高了很多的感觉，是不是就是这种感觉？\n\n> 就是说**你把你这个专注去看的这个量，只变成了这个 31 和这个 43 的关系，他们的差距就会被放大，倍数就会被放大。** 如果分子分母相差很远的话，这个时候你可以等比例扩大去拉近一下。拉近了之后，你就看到这个对象小了，他们的倍数感觉差距会被扩大的。\n\n**板书脚注（画面 f_0198）：**\n\n> **注：若分子分母都相差很远，可以等比例扩大拉近。**\n\n> 另外一个点：**数变化的过程其实和「差分法」没什么区别，只是把它更概念化了一点**，本质就是「分子分母的增速谁大谁小」。\n\n### ③ 分式混合比较（差分法之二·纵向比较）\n\n板书（画面 f_0207）：\n\n> **③分式混合比较**\n>\n> 如同 部分1：`A₁/B₁`　部分2：`(A₂ − A₁)/(B₂ − B₁)`　混合为整体：`A₂/B₂`\n\n> 然后第三种就是**分式混合比较**，也是差分法里面的第二种。刚刚我们那种就像一个横向在比，再看一个横向的比较；这个分式混合呢是一种**纵向的比较**。原理跟刚刚差不多的，操作步骤差不多的，都是直接去做差。\n\n**第一组：260/729 VS 226/656（画面 f_0212 / f_0235 逐字抄录）**\n\n```\n260 / 729   VS   226 / 656\n分子做差：260 − 226 = 34\n分母做差：729 − 656 = 73\n\n即： 260 / 729  =  34 / 73  +  226 / 656\n      （混合后整体 = 部分2 + 部分1）\n```\n\n> 还是你看 260 除以 729，跟 226 除以 656 去比，我又给它分子分母分别做差，分子做差是 34，分母做差是 729 减掉 656，差下来呢是 73。\n\n> 当然这个地方你用（平均增速）的做法做肯定也能做，因为这两个都是去解决这个分式比较大小一个比较快的办法。如果我们还用（平均增速）的办法，是不是也挺快的？34 是 226 的涨了百分之多少，差不多百分之十五吧。73 是不是这个 656 的？明显没有到 15%。所以明显是不是还是左边的大，因为你分子涨得更快。右边的小。\n\n> 好，那什么叫分式混合的比较呢？就是我们把这个小一点的 226/656 看作它一个**原来的一个浓度**，这是一个浓度，然后它跟一个 34/73 的另外一个浓度的溶液混在了一起，混成了 260/729。就是个溶液的混合。\n\n> 那容易的混合，你去想想这个过程，我往这个原来这个 A 里面倒了一杯这个 B 变成了这个 C，C 是不是要在 A 跟 B 的中间啊？C 是混合后的浓度吧，肯定在中间，对不对？那我现在只要判断你去加的这个 B，它到底是比 C 比 A 要大还是比它小，是不是就好了？\n\n> 就这 34 除以 73，它是大的呢还是小的呢？你只要能确定好一个方向，那这个 A、C、B 的整体的大小关系就全出来了。\n\n> 那 34 除以 73 跟那个 226 除以 656 相比，是不是明显大？因为 34 除以 73 已经非常靠近 1/2 了，226 除以 656 是不是才 1/3？你往一个 1/3 浓度里面的溶液里面去倒了个 1/2 左右浓度的溶液，它的浓度会提高啊！所以是 **B > C > A**。所以 C 就大于 A，就还是左边大。\n\n**画面红笔标注（f_0240）：**\n\n```\nA = 226 / 656 （≈ 1/3）\nB = 34 / 73   （≈ 1/2）\nC = 260 / 729 （混合后整体）\n⇒  A  \u003c  C  \u003c  B\n```\n\n> 右边小。你往里面滴了一滴浓度比较高的溶液，会导致它的浓度上升，所以左边更大。\n\n> 就把这个过程想成往这个溶液里面……你把这个数字比较小的当做原来的，把这个小的 226 当做原来的溶液，他们差分出来的部分，当做你加进去的、往这个小的里面加进去的。加进去之后，它是提高还是降低，你就能知道这个前后的大小关系。\n\n**第二组：574/2982 VS 495/2771（画面 f_0240 / f_0250）**\n\n```\n574 / 2982   VS   495 / 2771\n分子做差：574 − 495 = 79\n分母做差：2982 − 2771 = 211\n\n横向看（平均数增速）：\n79 / 495 > 10%      （分子涨了 10% 以上）\n211 / 2771 \u003c 10%    （分母涨了 10% 不到）\n⇒ 分子涨得更快 ⇒ 左边更大\n\n纵向看（分式混合）：\n79 / 211  ≈ 1/3 多一点 （画面圈注「三分之一」）\n495 / 2771 ≈ 1/5       （画面圈注「五分之一」）\n⇒ 往 1/5 浓度的溶液里倒进 1/3 浓度的溶液，浓度必然升高\n⇒ 574 / 2982 > 495 / 2771\n```\n\n> 好，然后我们再来看这个例子，逻辑上都是一样的，步骤上都是一样的，就是给他去做差。574 比 495 多了 79，然后再看 2982 比 2771 多了 211。然后你看什么，你要么横过来看，你看 79 涨了百分之多少，211 是涨了百分之多少。79 是 495 的 10% 以上，211 是 2771 的 10% 不到。所以让你直接弄这个平均增长率去看，你能看得出来分子涨得更快，分母长得更慢。既然你**分子涨得快，那分式它就会变大**，那就是左边大于右边。\n\n> 或者你也可以看，79 除以 211，这个面就有点大呀，你旁边的这个是 495 除以 2771，这个才多少啊？这个才五分之一左右，我已经三分之一不止了，那五分之一的一个浓度跟一个三分之一的浓度混起来，肯定会变大，所以左边的更大。\n\n**两种看法的关系（老师重点强调）**\n\n> 怎么样？我一般来说会更习惯用这个**平均数增速**的一个比较，我看它分子分母长的一个增速。因为我感觉这个好像来说因为平（均）增长率的运用吧，多一点，所以我对它熟悉一点。右边那个也不失为一种好办法，就是如果那个做差下来的东西，它本身的大小关系比较明显的话，你也可以这么看，都可以用。\n\n> 一句话，他们两个方法，到底用哪个方法？主要的区别在于**是横向去看一个大概的比例快，还是纵向去看它的一个值快**。其实就是横向跟竖向的一个区别。\n\n> 你平时增长率，你看你是看这个分子这边加了个 79，这边分母加了个 21，你如果觉得这个 79 或者说 21 占 277 这个比例，我觉得看得比较快，那你就横过来看。如果你觉得这个 79 除以 21 这个大小关系，我觉得看得比较快，我觉得这个四倍明显比这个大，这样也可以，懂吗？就都可以，你横向纵向都可以看，你个人习惯，他们没有一个本质上的优点或者优势或者劣势。**逻辑上都一样的，只是一个是竖过来的，一个是横过来的。**\n\n> 因为本质上他们其实都是**两步除法**嘛。第一个横过来的，你是不是要先算一下这个分子的一个占比，然后再算分母的占比，是不是两步除法？你竖过来，你是不是要算一下中间这个 79 除以 211 是大概是多少，以及这个 495 除以 2771 是多少？你是不是都是两步除法？都是两步，所以**没有谁快谁慢，都是一样的**。\n\n> 感觉一下哪个算起来更快，哪个也能一眼看出来大概是个什么样的一个位置，就可以了。这个肯定比你放缩快的，相对来说我觉得是比放缩快的。因为如果你要用放缩逻辑的话……你会这么做：2771 到 2982，你要这样子先做差，差了个 211，好，然后你分析 211 大概是 2771 的，比如说大概是 8%，然后你给上面这个也加 8%，变成 540，你看你是不是还是两步？乘除也是两步，没有必要。\n\n> **你这个减下来个 79，其实看也能看出来的，大概看就能看出来了。你以它具体的值来判断，比你用什么百分比去把它算出来，相对来说更可靠一点。因为你这个做差是没有误差的。**\n\n> 但是你去跟比如说像我刚刚那样子去估个什么百分之八，它可能就会存在一定的误差。所以我不建议这个地方你去用什么放缩，把它放（到）一个分母，然后分子也对应地去调整，看谁的分子大，这个没有意义。**你直接拿它做差下来的这个原始的值去比较，相对来说就是说没有误差，而且也很快。**\n\n> 那我们继续了。这个跟刚刚平均数增速的比较就是一样的——**如果差得远，你就给他们去等比例地扩大去拉近。**\n\n### ④ 基准线法（统一减去某个常用好算的值）\n\n板书（画面 f_0261）：\n\n> **④基准线比较**\n>\n> **当分式离某个常用且好算的值很近时，可以统一减去这个值，或者看到这个值的距离，判定分式大小关系。**\n\n画面四组题：\n\n```\n709 / 741   VS   656 / 677     （都离 1 很近，在 1 的下方）\n741 / 709   VS   677 / 656     （都比 1 多一点，在 1 的上方）\n514 / 1180  VS   326 / 656     （都离 1/2 很近）\n314 / 3065  VS   481 / 4722    （都离 1/10 很近）\n```\n\n> 最后一种办法，这种办法相对来说它的应用面也比较窄。就是有些时候你去比较这两个分式大小的时候，**如果这两个分式离某个常用而且很好算的值很近的时候，可以统一减掉这个值，去看跟这个值的距离来判断你分式的大小关系**，这样子就会来说更好算。\n\n> 这个例子呢就跟我们刚说的那个有点像。就你在比较 173 跟 174 的时候，虽然你现在直接看能看得出来，但你会发现，给他们如果都统一减个 170，剩下的 3 跟 4，他们这个倍数关系会更明显，大小差异会更明显。\n\n**（1）709/741 VS 656/677（基准线 = 1，都在 1 下方）**\n\n```\n1 − 709/741 = 32 / 741\n1 − 656/677 = 21 / 677\n\n32 / 741  >  21 / 677\n⇒ 左边离「1」更远 ⇒ 左边更小\n⇒ 709 / 741  \u003c  656 / 677\n```\n\n> 第一个这个 709 除以 741，和这个 656 除以 677。那这两个分式呢就属于是**离一都非常近**的是吧？都离一很近。那你就不要去算他们了，你就去算他们到一的距离。用一减掉，左边距离一的距离就是剩 32 除以 741，右边呢就是剩 21 除以 677。有没有发现，这样的他们差距一下子就明显了？\n\n> 本身，一是这么多的……里面占了 741 分之 32，这个 21/677（与 32/741）这两个部分的大小关系单拎出来看你是不怎么明显的，但如果你把这个差值部分拎出来，他们的倍数关系会更明显。\n\n> 这两个不用我说谁大谁小吧。32 就是他们到 1 的距离，32 除 741 是明显要大于右边这个 21 除以 677 的。那左边它这个减下来的差值更大，说明它到那个一的距离更远，**所以它是更小的**。左边更小，右边更大。\n\n> 看不出来这两个，你看不到谁大……这个就跟我们刚刚说的那个平均数那个做法一样，你看 21 到 32，你是不是要加 50% 左右？677 到 741，你是不是只要加 10% 左右？这个分子明显倍数更大呀，32 比 21 大多了，741 比 677 只大那么一点点。我说这个大很多、大一点点，大的是比例，明白吗？\n\n> 或者你也可以看什么呢？就是看他们这个倍数：32 除以 7 和 21 除以 6，7.4 吧、6.7，这也能看出来，右边这个都已经超过 3 了，刚到三、超过三一点，左
