原话）**：\n\n> 你就算累计起来了，就算因为这个方向的原因，两次这个截位把误差没有抵消、反而还累计了，也就百分之零点几，跟百分之零点几的一个累计，影响不大。所以我建议大家截三位保险一点。\n\n> （截三位时的四舍五入规则，画面板书）**截三位一般我是四舍五入**，不然的话，你把这个 1048 去截成个 104，误差肯定会比这个 105 要大一点，对吧？我一般会把它截成 **105**。\n\n> 刚才二十三点八是因为我提前备课的呀，我备过课的我直接就写了呀，我口算算不出来这个……我给你们讲题的嘛，我还在这给你们算呢，不浪费时间。\n\n---\n\n### 5.4 乘除误差（先看占比）\n\n> 所以大家在做乘除误差的时候，除了注意截位带来的影响，还要注意就是**乘除这个东西，这个运算的误差重点就是看它占比**。\n\n**关键对比（画面板书 + 老师口播）**：\n\n> 比如说我们刚算这个百分之二十三点八，22.9%、25.1%，我去分析这两个选项他们之间差距的时候，**我不会去做差的**。刚刚有同学有没有疑问，说老师这两个不是差的百分之二点二吗？你怎么说他们有百分之十的误差呢？\n> 因为**乘除计算的误差是占比不是量**，所以这个误差你应该看的是这个 2.2 占 22.9 占了多少，占了大概 10%，这是选项间的差距，是它一个**变化率**。所以在乘除运算过程中，**我们重点看的是它们的一个比例的差距，不要看量的差距**。\n\n**精度直觉对比（画面原文）**：\n\n> 就如同 1、2、3、4 与 1000、1002、1004、1006\n> 在乘除运算中，我们经常会遇到这种情况，哪一组的计算精度要求高？\n> 乘除运算中，误差重点看占比，看占原始数据的百分之多少。\n> 从差距上来说，1、2、3、4 > 1000、1002、1004、1006\n\n> 是右边的难算。因为他们的这个相差的比例小，左边这个相差比例太大了，哪怕 3 跟 4 都差了 33%，你右边这边只差 0.2%，这个才千分之二的精度。\n\n**例题（画面板书，非完整选择题）**：\n\n```\n1552 ÷ 1546 = （   ）\nA. 1    B. 2    C. 3    D. 4\n```\n\n> 如果我问你，是一还是二，还是三，还是四，你是不是表达一？太简单了，你这个怎么可能算得到二、怎么可能算得到三、怎么可能算得到四，差那么多呢？\n\n**变体（画面板书）**：\n\n```\n1552 ÷ 1546 = （   ）\nA. 1000    B. 1002    C. 1004    D. 1006\n（位数不重要，即：A. 1    B. 1.002    C. 1.004    D. 1.006）\n\n拆解：\n1552 ÷ 1546 = 1 + 6/1546 = 1 + 0.4% ≈ 1.004\n```\n\n> 这不就完蛋了吗？你说你只知道这个比一多一点点，那是比一多了千分之二，还是多了千分之四，还是多了千分之六呢？是不是就要算了？\n> 你不知道拆分了，有的同学他不知道拆分，他就要这样一算，上个一，然后怎么怎么样，就相对来说麻烦很多。\n\n> ⭐ **结论**：**乘除运算看误差、看选项距离，永远看的是比例。差距比例越大的，计算难度越低。**\n\n**板书（画面手写）**：\n\n```\n1 + 6/1546 = 1 + 0.4% ≈ 1.004\n```\n\n---\n\n### 例题 9｜1781×3%\n\n**【题干原文】**（画面逐字）\n\n> `1781×3%`\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 51.6 |\n| B | 52.1 |\n| C | 53.4 |\n| D | 54.6 |\n\n**【答案】** ✅ C（53.4）\n\n**板书（画面）**：\n\n```\n1800（1781 → 1800）\n18 × 3 = 54\n↑ 1%\n→ 54 − 0.54 = 53.4\n→ 选 C\n```\n\n画面另有推导（乘法误差原理的板书）：\n\n```\n1781 (1+1%) × 3\n   1800    × 3\n= 1781 (1+1%) × 3\n= 1781 × 3 × (1+1%)\n= C × (1+1%)  =\n```\n\n**老师讲解原话**：\n\n> 这是个乘法吧，左边位数是不是比较多？我想要快一点地把它先估出来。怎么做呢？我就直接先 18 乘以 3，我把它看成一千八行不行？18 乘以 3 是 54。那我们要**选个比 54 小的吧**，因为我是把 1781 想成了 1800 算的。\n> 那是 A 还是 B 还是 C 呢？怎么去判断呢？这时候你就看什么呢？**看比例**。你就想这个 1781 变成了 1800，变大了多少？……你就想它的百分之一是多少，因为这个明显没到百分之十的地步，它的百分之一是不是 17.8 啊？加下来是不是正好基本上就到了这个 1800 了呀，所以只是把它整体变大了**百分之一**。\n> 那一个数变大百分之一，在乘除运算里面就会导致结果也变大了百分之一。那既然这个 54 是变大了百分之一的，那你想要算到一个准确的结果，是不是应该让它**变小百分之一**？因为你要把变大的部分退回去嘛——**我多拿了你百分之一的钱，那我不得还给你吗？那你有借就要有还啊。** 扣 1%，扣 0.54，接下来就是 53.46，哎，没问题吧。\n\n> 什么叫\"变大百分之一\"是以谁为基期？你这个数变大百分之一，就比如说我这个地方相当于一千八百、一千七百八十一，它是相当于扩大了个一百分之一左右，才会得到这个一千八的。\n\n**【解析】**\n\n- 精确值 `1781 × 3% = 53.43`，与 C（53.4）一致。\n- 估算路径：`1800 × 3% = 54`（偏高 1%）→ `54 × (1 − 1%) = 53.46` → **C.53.4**。\n- **陷阱类型**：**方向陷阱**（放大后必须反向退回）+ **精度陷阱**（A 51.6 / B 52.1 / D 54.6 分别对应不同错误方向）。\n\n> ⚠️ **乘除误差的方向规则（画面先导页原文）**：\n> **乘法误差**：同方向则累积，不同方向则抵消。\n\n---\n\n### 例题 10｜25733×7.8%（动两个数）\n\n**【题干原文】**（画面逐字）\n\n> `25733×7.8%`\n\n**【选项原文】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 1884 | 划 |\n| B | 2007 | 圈选 |\n| C | 2140 | 划 |\n| D | 2280 | 划 |\n\n**【答案】** ✅ B（2007）\n\n**板书（画面）**：\n\n```\n= 26000 × 8% = 2080\n（25733 → 26000，+1%；78 → 80，+2%）\n合计 +3%   ← 画面标 \"+3%\"\n→ 2080 − 63 = 2017\n→ 选 B（2007）\n```\n\n画面另注：`先粗 → 细`；竖式 `2080` 上方标 `26`、`4`、`8`。数字 `121`、`71`、`80`、`78` 等为逐步标注。\n\n**老师讲解原话**：\n\n> 我现在只是动一个的比较简单，动两个呢？我这要是想把这两个是不是位数都有点多，五位数乘两位数，怎么搞？**不要怕，先粗，后续你又不是调不细。**\n> 我就直接当做 26000 × 8% 行不行？有同学还在 257 × 8 可以，但是说明你胆子没我大，我胆子比你大，我直接 26 × 8。26 乘 8，68、48、28、16，208，我算出来个 2080。\n> 那结果它是偏大的吧，我要选个比 2080 小的吧，那 C、D 先排了吧，那选 A 还是选 B 啊？那我不就得估一下我刚刚这个变大了多少吗？\n> 从 25733 变成 26000，大了多少？大了两百多，两百多是百分之一，对不对？78 变成 80，变大了多少？大概百分之二吧。一个变到百分之一、一个变到百分之二，在这种比较小的变化上，在我们这种控制得比较小的变化上，**你可以直接把它们加起来**，整体变到了 3%。那我现在把这百分之三退掉，在这种比较小的变化上，你退掉百分之三，你就直接减掉百分之三就好了，会有一点点误差，但这个误差无所谓。减 3% 减多少？减 60 多吧，63 左右，2017，是不是就选这个 B 了呀？\n> 这个肯定还是有一点点误差的，因为这边也不是 2%，应该接近 3% 了，在 2% 到 3% 之间。\n\n> ⚠️ **为什么这里是\"加\"不是\"乘\"？**\n> 后面你会讲到，后面也会学到的。这边你先不用管，你先去记，就记就好了，就是**直接加起来**。你先记，后面还会有课会讲到这边为什么是加不是乘——就在后面那个**增速的累计与拆分**的一些课上，就是**基期增长率、间隔增长率**那边。\n\n> ⚠️ **不要超过 10%**：\n> 多大的算小？我觉得**百分之十以内都算比较小的**。你尽量不要去动的超过百分之十。一般来说不管是现在这个运算方式也好，还是说后面我们在讲的一些速算技巧也好，我都不建议你去把一些数字调整得超过百分之十。**如果调整得超过了百分之十，很容易你控制不住这个误差。**\n\n**老师的关键补充（关于 7.8 与 78）**：\n\n> 为什么是 88 跟 90？因为整数的东西你更好理解嘛。我要写个 8.8，写个 9，说差了个 0.2，我问你 0.2 是 8.8 的多少，你说这个理解起来是麻不麻烦？**你干嘛要在意这个位数呢？不要在意位数，你位数不影响他们的一个比例关系。** 你 88 到 90 是差 2%，8.8 到 9 也是差 2%，900 也是差 2%。\n> 为什么这个你 7.8 跟 8 的占比差距和 78 和 80 的比例差距是一样的？是一样的。0.2 除 7.8 和 2 除 78 有区别吗？没有区别。大家都变，都变了 10 倍、都变了 100 倍，之间的比例差距是一样的。这样主要是为了不存在小数点的影响，都是一些整数，理解起来更好理解而已。\n\n**【解析】**\n\n- 精确值 `25733 × 7.8% = 2007.174`，与 B（2007）一致。\n- 估算路径：`26000 × 8% = 2080`（整体放大：26000/25733 ≈ +1%，80/78 ≈ +2.6%，合计约 +3.6%）→ 退回 3% 得 2017 → **B.2007**。\n- **排除**：C（2140）与 D（2280）都**大于**估算值 2080，而\"我们明明是往大了估的\"，故必错；A（1884）偏小太多。\n- **陷阱类型**：**方向陷阱**（两个数**同方向**变大，误差**累积**，必须一起退）。\n\n---\n\n### 例题 11｜1642.5×8.8%（不同方向抵消）\n\n**【题干原文】**（画面逐字）\n\n> `1642.5×8.8%`\n\n**【选项原文】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 122.4 | 划 |\n| B | 137.6 | 划 |\n| C | 144.5 | 圈选 |\n| D | 152.6 | 划 |\n\n**【答案】** ✅ C（144.5）\n\n**板书（画面）**：\n\n```\n1642.5 × 8.8%\n= 1600 × 9% = 144\n（1642.5 → 1600，变小 2%；\n  88 → 90，变大 2%）\n两者方向相反，正好抵消 → 144 很准\n→ 选 C\n\u003c 10%\n```\n\n**老师讲解原话**：\n\n> 那像刚刚那两个数，我们都是把它变大的，可以搞同方向相当累计起来了。那现在 1642.5 乘以 8.8%。1642，如果我们还是想保留两位，它是不是就应该是往下去？我们就可以把它写成什么一千六吧。8.8 呢？就是 9 吧。16 乘以 9 等于 144 吧。\n> 这个结果我能不能选这个 C 呢？可能说心里面还是有点怕的，因为这个 B 跟 D 感觉跟它也有点近，对不对？那我们就分析一下吧，不碍事，你不放心，你回头看一下。\n> 变化了多少？变化了 42，大概是一千六百四十二的多少呢？百分之二多一点。**怎么去判断它到底大概是百分之几？看原来这个数的百分之一，或者说百分之十是多少。** 1642 的百分之一是 16，你变了 42，问你 42 是 16 的几倍，是不是两倍多？那不就是百分之二吗？\n> 然后这个 8.8 变成了 9，又变化了多少呢？从 88 变成 90，增加了个 2，是不是也是百分之二多？**一个是变小 2%，一个是变大 2%，就基本上正好抵消掉了，所以这个一百四十四它就应该是很准的。所以选 C。**\n\n> ⭐ **乘法误差结论**：\n> **乘法误差，就是你把一个数变大，那它必然会导致结果也会变大；把一个数变小了，结果也会变小，你就注意好你的影响，主要看比例。**\n> **乘法，它不同方向的会抵消，同方向的会累积起来。**\n\n> **不要老去在意那些什么截两位截三位的。** 我只是说有的时候我去做一些除法的时候，我是更习惯去截一些三位的。我甚至有的时候我在去年讲课的时候，我截四位都很经常截。因为我觉得四位对我来说不是个什么很难计算的东西，我可以去把控好一个四位数的放缩变化，怎么去把它变成一个整的东西，加个什么十几、加个几十，我们不觉得麻烦。\n\n**【解析】**\n\n- 精确值 `1642.5 × 8.8% = 144.54`，与 C（144.5）一致。\n- 估算路径：`1600 × 9% = 144`（−2% 与 +2% 相互抵消）→ 144 → **C.144.5**。\n- **陷阱类型**：**方向陷阱**（两个数**反方向**变化，误差**抵消**，此时可以放心直接选）；B（137.6）与 D（152.6）是\"只动一个数、不退误差\"的产物。\n\n---\n\n### 例题 12｜50225÷731（除法：同向抵消）\n\n**【题干原文】**（画面逐字）\n\n> `50225÷731`\n\n**【选项原文】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 68.7 | 圈选 |\n| B | 71.3 | — |\n| C | 74.7 | — |\n| D | 75.1 | — |\n\n**【答案】** ✅ A（68.7）\n\n**板书（画面）**：\n\n```\n50225 ÷ 731\n≈ 5 / 7 = 71.4\n\n分子 50225 → 50000 （−0.5%）\n分母 731   → 700   （−4%）\n同方向抵消，净影响：分母缩小约 3.5%\n分母变小 → 结果变大 → 要把变大的部分退回去\n\n71.4 × 3.5% ≈ 2.8\n71.4 − 2.8 = 68.6\n→ 选 A（68.7）\n```\n\n画面手写：`50225/731 = 5/7 = 71.4`，旁注 `−0.5%`、`−4%`、`−31 ≈ 3`、`−3.5%`、`−2.8`、`68.6`；并写有竖式 `7114 / 6515 / 30` 等。\n\n**老师讲解原话**：\n\n> 除法误差会对结果有什么样的影响呢？……除法的话就是分子分母，**如果你是同方向的一个变化，是可以去抵消掉的，反方向的变化就会累积起来。**\n\n**除法误差原理（画面板书）**：\n\n```\na × (1+1%)\n-----------  =  a/b × (1+1%)\n     b\n\na\n-----------  =  a/b ÷ (1+1%)     （分母变大 → 结果变小）\nb × (1+1%)\n\n分子 ↑1%  分母 ↑1%  →  抵消\n分子 ↑1%  分母 ↓1%  →  累积（结果约变 2%）\n```\n\n> 就好像本来我 101 除 100 是 1.01 的，后来我让它的分母变大了，（101 除）101，这是不是 1？你看结果是不是变小了 100%？分子跟分母对整体的一个影响是一个**相反**的。所以他们俩如果同方向变化，反而正好可以抵消掉。\n\n**本题讲解（老师原话）**：\n\n> 好，那么大家回到这个式子了：50225 除以 731。位数很多吧，位数多怎么办？嫌它烦了，我们就想把一些位数给它去掉。\n> 你就简单讲得大一点，你就把它弄一个**七分之五**行不行？我胆子现在比你们的讲义上写的解析还大，我哪也懒得写上面什么 50225 了，我就七分之五。要是七分之五背得熟，也能知道七分之五是多少啊？……七分之五好算吧？七十点四！\n> 因为我们知道选项里面 71.3 跟它很近，我能不能直接选它呢？**能不能直接选？那肯定不能**。因为你刚这个 731 变成 7（即 700），明显你调得还是挺多的，调了多少？看比例，你用 731 相当于是变成了 700，相当于是减了 31，大概是 4%，对不对？分母变小了百分之四，分子呢？**百分之零点五吧**，变小 0.5%。\n> 一个 4%、一个 0.5%，他们是同方向的，是可以抵消的，所以实际上相当于是你只给这个分母可能缩小了 4% 不到、**3.5% 左右**吧。那你给分母变小了，就会导致结果变大了，那结果变大了三点五（个点），你要把这个三点五再给它退回去吧？要给他减百分之三点五左右。\n> 能理解，分子不变、分母变小，导致结果变大，那要把大的部分退回去。70 的 3.5% 大概是多少？减个 2 点几，大概也就当 4% 算吧，减个 2.8，就会变成 68.6。\n\n> 还有同学说这些直除更快，我给你讲这么多，是我在给你分析这个原理、在讲这个道理。**你直除再快，能快得过我？** 我看这个东西，我就看个七分之五，七分之五是七十点四，我这七分之五明显是下面小了几个点的，我要把这个几个点退回去，七十三太大了（应为 71.4 太大了），A 走了，我算我都不用算，我看到这个东西，我是十秒钟以内我就出来了。\n> 我还要在那列式子呢，还在这边什么 502 说个什么 73，没必要。我不用去冒什么风险，比如说上上不到七，那这题目再来个 67.1，你是不是还要继续算？你不还得算吗？\n\n**【解析】**\n\n- 精确值 `50225 ÷ 731 ≈ 68.71`，与 A（68.7）一致。\n- 分子分母**同方向变小**，误差相互抵消，净效果是分母相对更小 → 结果偏大 → 需向下修正。\n- **陷阱类型**：**方向陷阱**（除法中分子分母同向变化会抵消）+ **不修正陷阱**（直接选 71.4 附近会掉进 B.71.3）。\n\n---\n\n### 例题 13｜54428÷12\n\n**【题干原文】**（画面逐字）\n\n> `54428÷12`\n\n**【选项原文】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 4424 | — |\n| B | 4536 | 圈选 |\n| C | 5014 | — |\n| D | 5168 | — |\n\n**【答案】** ✅ B（4536）\n\n**板书（画面）**：\n\n```\n54428 / 12\n= 54 / 12\n= 18 / 4\n= 4.5     →  4500\n（实际 54428 ÷ 12 = 4535.67，比 4500 大）\n→ 选 B（4536）\n```\n\n**老师讲解原话**：\n\n> 54428 除 12，现在知道怎么搞了吗？**直接 54 除 12，不要怕**，后面这个 400 多没了会怎么样？你最后可以去消、可以去修正。\n> 12 分之 54 上下同除个 4，或者同先同除个 3 嘛，相当于 18 除以 4，就是 4.5，就是你直接这个 12 分之 54 就是 4500，对不对？\n> 那你要注意你这个\"四进五\"（4500）算下来是不是在 A、B 的中间？那选哪一个？实际的是 5.428 量级（即 4535.67），是不是比你这 4500 要大？所以你应该选一个比 4500 大的，你要选一个 B。\n\n> 如果说这个题目你先出了不行，他再变个 461，说那不行，我知道比 4500 大，那到底是 4536 还是 461 呢？你要看比例了：你相当于从 54428 减了个 428，减了个 1% 不到，所以把这个 1% 不到补回来，补个 45 不到，所以在 45（4500）以下？——**（画面显示为 4536，选 B；转写此处口播不清）**。\n\n> ⭐ **为什么可以直接加减？**\n> 原则上是不可以的，但是这个地方基本上是不用考虑这些误差的。我们后面会讲，暂时先讲不到那些东西，你先这么用，你先这么用就行了。一块一块来的，不用着急，现在你把这个东西搞得那么清楚，对于你这个计算来说没有太大的帮助。\n\n**【解析】**\n\n- 精确值 `54428 ÷ 12 = 4535.666…`，与 B（4536）一致。\n- 估算路径：丢掉位数 → `54 ÷ 12 = 4.5`（即 4500），结果在 A（4424）与 B（4536）之间；因**丢弃的是\"428\"（不到 1%），实际值应略大于 4500** → 选 B。\n- **陷阱类型**：**量级陷阱 + 精度陷阱**（A/B 只差 2%，必须靠\"截位方向\"修正）。\n\n---\n\n## 六、板块伍：计算对象\n\n> 那这样一个最后呢，我们再聊一个问题。刚刚前面的主要是要理解好，你再去调整一些数字，会**对最后的结果带来什么样一个影响，以及我们怎么去对应地消除这些影响**。\n> 在我们前面的题目都比较简单，简单在哪呢？都是**一步计算，都是算两个数**，都是对两个数间的一个运算。这个计算对象就是你这个选项的一个结果，你这个选项就是你这个计算的一个结果。\n> 那有时候我们是可以去选择，**把我们的计算对象换一换。**\n\n> ⭐ **核心结论**：\n> **你要去理解你的误差是由你的计算对象决定的。** 你的计算对象从这个地方改成了增量，你的误差就是由增量的百分比来决定；你的计算对象如果没有改成增量，还是算基期，那你的误差就会由基期的百分比来决定。\n\n---\n\n### 例题 14｜2024 年江苏省对非洲进出口总额增速\n\n**【题干原文】**（画面逐字）\n\n> 2024 年江苏省对非洲的进出口总额增长率是：\n\n**【材料数据】**（2020-2024 年江苏省对东盟、韩国、非洲进出口情况　单位：亿元）\n\n| 年份 | 东盟·出口额 | 东盟·进口额 | 韩国·出口额 | 韩国·进口额 | 非洲·出口额 | 非洲·进口额 |\n|---|---|---|---|---|---|---|\n| 2020 | 3820.3 | 2406.6 | 1838.1 | 2949.6 | 722.0 | 218.8 |\n| 2021 | 4419.2 | 2989.1 | 2085.4 | 3345.3 | 996.5 | 331.4 |\n| 2022 | 5095.6 | 3205.8 | 2418.2 | 3260.9 | 1051.6 | 405.1 |\n| 2023 | 5003.0 | 3141.5 | 2304.6 | 2770.3 | 1212.4 | 360.8 |\n| 2024 | 5816.9 | 3237.5 | 2455.3 | 3272.1 | 1466.9 | 457.9 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求**进出口总额的增长率** |\n| 定位数据 | 非洲列：2023 年出口 1212.4、进口 360.8；2024 年出口 1466.9、进口 457.9 |\n| 列式 | `r = (2024 总额 − 2023 总额) ÷ 2023 总额` |\n| 速算步骤 | 基期 2023：`1210 + 360 = 1570`；现期 2024：`1460 + 460 = 1920`；增长量 `1920 − 1570 = 350` |\n| 结论 | `350 ÷ 1570 ≈ 350 ÷ 1600 = 21.9%`，修正后 ≈ 22.4% → 选 D |\n\n**板书（画面）**：\n\n```\n2023（基期）：1210 + 360 = 1570\n2024（现期）：1460 + 460 = 1920\n增长量：1920 − 1570 = 350\n\nr = 350 / 1570\n  = 350 / 1600        （分母放大，影响约 2% → 结果偏小 2%）\n  ≈ 22%               （画面显示约 21%~22%；35 ÷ 16 上 2）\n  →  22% + 22 的 2% ≈ 22.4%\n→ 选 D（22.3%）\n```\n\n画面另注：`1460`、`+460`、`= 1920`；`1210`、`+360`、`= 1570`；`350/1600`、`21%`、`+2%`、`22.4%`。\n\n**老师讲解原话**：\n\n> 我会这样的，我会把它想成 1210 加 360，就给他们都到这个十位数上，因为这样我影响比较小嘛，就少了个个位数、少一点点，这样加起来是 1570。然后我们再把这个下面的加起来，下面这个加的时候，我会加成 1460 加上多少？加 460，**这个就是有借有还了**——我把一个 1466 变小了，那我顺手把右边这个变大了，这样他们一个这个误差可以抵消掉，等于 1920。所以它是从 1570 变成了 1920，增加了 350。\n> 所以它的增速就是 350 除以 1570。那这个地方去做除法的时候，我要是觉得除三位数、除个一千五百七嫌烦，我能不能就先把它想成，我就除一千六？我就除两位数估一下：35 除个 16，大概在 22% 左右。\n> 那这个结果呢，它是不准的，它是有一定的误差的。因为我们把它的分母扩大了大概百分之二左右，导致它的结果变小了百分之二了，所以我应该让这个 22 再增加百分之二。**这个加百分之二不是直接的**，在 22 的基础上是说\"22 加 2\"，不是的，**是加比例**，是 22 这个数的比例，是 22 的 2%，就是 0.44，所以它的结果是 22.4。\n> 所以选择 D。这里还这样呢，我既可以快也可以准。中间这个数字你想怎么动就可以怎么动，你已经只要把误差管理好了，**你就相当于是一个数字的魔术师，这个数字在你手上想变成什么数、想变成什么好算的数都可以变，变了之后你再对应去调这个误差就可以了。**\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 11.2% |\n| B | 14.9% |\n| C | 18.8% |\n| D | 22.3% |\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 精确计算：2023 年非洲进出口总额 `1212.4 + 360.8 = 1573.2`；2024 年 `1466.9 + 457.9 = 1924.8`；增长量 `351.6`；增长率 `351.6 ÷ 1573.2 ≈ 22.35%` → **D.22.3%**。\n- 排除 A/B/C：三者都在 19% 以下，而\"增长量 350 / 基期 1570\"已经逼近 22%。\n- **陷阱类型**：**范围陷阱**（表格里有东盟、韩国、非洲三组数据，必须只取\"非洲\"列）+ **概念陷阱**（\"进出口总额\"= 出口额 + 进口额，不能只看出/进口之一）。\n\n---\n\n### 例题 15｜2019 江苏事业 · 社会消费品零售总额\n\n**【题干原文】**（画面逐字）\n\n> （2019 江苏事业）2018 年全年实现社会消费品零售总额 2613.2 亿元，增长 9.1%\n> 2017 年，该市社会消费品零售总额约为（   ）亿元。\n\n**【材料数据】**\n\n| 年份 | 社会消费品零售总额 | 增速 |\n|---|---|---|\n| 2018 年（现期） | 2613.2 亿元 | 9.1% |\n| 2017 年（基期） | 所求 | — |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求**基期值**（\"约\"字提示可用估算） |\n| 列式 | `基期 = 现期 ÷ (1 + 增长率) = 2613.2 ÷ 1.091` |\n| 位数处理 | 位数不重要：`2613.2 ÷ 1.091` → `261 ÷ 1.09` → 直接看成 `261 ÷ 11` |\n| 速算步骤 | `261 ÷ 11 ≈ 23.7`（即 2372 亿元，注意此处为量级标记） |\n| 误差修正 | 把 `1.09` 看成 `11`（即 109→110）等于**把分母放大了约 1%**，结果偏小 1% → `2372 + 23 ≈ 2395` |\n| 结论 | 2395 → 选 B |\n\n**板书（画面）**：\n\n```\n= 2613.2 / 1.09\n= 261 / 1.09\n= 261 / 11          （位数不重要）\n  11 ) 261\n      22\n      ---\n       41\n       33\n       ---\n        80\n= 23.7  →  2372\n\n分母 109 → 110，扩大了 1%\n→ 结果偏小 1%  →  2372 + 23 ≈ 2395\n→ 选 B（2395.2）\n```\n\n**老师讲解原话**：\n\n> 机器嘛等于限期除以 1 加增速嘛，所以这个 17 年呢最后就会等于限期 261（即 2613.2）除以 109。\n> 那这个地方计算的时候怎么办呢？我们会不会觉得 109 很烦？我们想把它变成能不能直接除 11 啊，我就把它看到 110 行不行？**行，你除了之后，你去调误差不就好了吗？** 261 除 11 算出来个 23.7（即 2372）。\n> 那这个算出来你能不能直接选这个 C 呢？我们要分析好误差、理解好自己的误差、要记得自己的误差。你在刚刚的计算过程中你做了一件事情吧，你做了一次调整吧，你把 109 变成 110 了吧，你把分母扩大了 1/100 吧，分母扩大 1/100 会导致什么？会导致结果偏小 1/100 吧，所以你应该让这个结果**再增加 1/100** 对不对？加个 23 变成 2395，所以选 B 嘛。\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 2613.2 |\n| B | 2395.2 |\n| C | 2378.8 |\n| D | 2874.8 |\n\n**【答案】** ✅ B\n\n**【解析】**\n\n- 精确计算：`2613.2 ÷ 1.091 ≈ 2395.2` → **B**。\n- 排除 A（2613.2）：这是**2018 年现期值**，典型的\"现期/基期\"混淆。\n- 排除 D（2874.8）：比现期还大，而 2018 年是**增长** 9.1%，基期必然**小于**现期。\n- 排除 C（2378.8）：这是**没有做误差修正**的产物（2372 ≈ 2378.8），差一点点就是陷阱。\n- **陷阱类型**：**时间陷阱**（现期当基期）+ **方向陷阱**（分母放大后必须反向修正）。\n\n> ⭐ **本课定位的收束（老师原话）**：\n> 今天这第二节课主要还是为我们第三节课\"放缩运算\"去做一个准备的，相当于是一个理论基础。\n\n---\n\n### 例题 16｜2021 年全国城市供水总量（计算对象变小）\n\n**【题干原文】**（画面逐字）\n\n> 2021 年，全国城市供水总量 673.34 亿立方米，同比增长 6.96%。城市供水管道长度 105.99 万公里，同比增长 5.26%，人均日生活用水量 185.03 升；供水普及率 99.38%，比上年增加 0.39 个百分点。\n> 2020 年，全国城市供水总量约为：\n\n**【材料数据】**\n\n| 指标 | 2021 年数值 | 同比增长 |\n|---|---|---|\n| 全国城市供水总量 | 673.34 亿立方米 | 6.96% |\n| 城市供水管道长度 | 105.99 万公里 | 5.26% |\n| 人均日生活用水量 | 185.03 升 | — |\n| 供水普及率 | 99.38% | 比上年增加 0.39 个百分点 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求**基期值**（\"约\"字提示可估算） |\n| 常规列式 | `673.34 ÷ 1.0696`（约等于 `673 ÷ 1.07`） |\n| 常规算法的痛点 | 选项为 600 / 620 / 630（三个数只差 1%~3%），**精度要求太高**，稍偏 1%、2% 就会选错 |\n| 关键洞察 | **乘除运算的误差是比例**。与其算\"基期\"这个大数（≈630），不如把计算对象换成\"**增量**\"（只占基期的 7%），误差会被这个 7% 缩小 |\n| 换对象做法 | 随便找一个接近答案的数当基期（如 610）→ 算增量 `610 × 7% ≈ 42.7` → `673 − 43 = 630` |\n| 结论 | 选 C |\n\n**板书（画面）**：\n\n```\n常规：673 / 1.07\n\n换计算对象（算增量）：\n610 × 7% = 42.7\n673 − 43 = 630\n→ 选 C（630亿立方米）\n```\n\n画面另注：`673.34` 的 `7.` 被圈、\"分母增加\"、\"小一点\"、\"比例\"；`610×7%`、`42.7`、`673`、`43`、`630` 被圈出；并写有 `683 / 1.07 = 613`、`613`、`629`、`629`（不同尝试值）。\n\n**老师讲解原话**：\n\n> 如果常规的做法就是基期应该是等于限期 673 除以大概就是 7% 吧，跟 7% 没什么区别了，1.07 对不对？常规是这么做，这么做的话其实这个题目也不是说不能做，只是你会觉得感觉这个题目好像**选项的精度要求有点高**：六百二、六百三，我好像只要稍微算偏个那么百分之一百分之二，就容易算错了，对不对？如果答案是 620，我算偏大了 2%，变成 632；或者我算大了 1%，变成了 626，我是不是都可能选到 C 上面去？\n> 那怎么办呢？**乘除运算的误差是比例，是占比。如果我们能不能想一个办法，把我们的乘除的对象换小一点？** 我们不去算这么大的数，我们算个小一点的数，那就算我们计算过程中可能存在一定的误差，但因为误差是比例，它带来的误差的这个量是不是也小了？\n> 所以我们去算**增量**，因为增量它只占了基期的百分之七，**就算有误差，也会被这个 7% 缩小。**\n> 所以我们怎么办呢？我们就根据这个限期、增速以及这个选项的关系，**我们随便去找一个当基期无所谓**，660、662、663，你随便找个中间的，你哪怕找 610，免得我找个 662，你们说哎老师你知道这个是答案或者什么的，哎，我就按 610 行不行？610 乘 7% = 42.7，所以它的基期就是 673 − 42.7 ≈ 673 − 43 = 630，自己走了。\n\n**为什么这样也能做对（老师原话）**：\n\n> 我是拿六百一假设了一个基期，实际的基期我算出来是 630，这明明差了二十呀，怎么居然你最后还能算出来这个答案呢？\n> 因为**这个式子 610 乘 7%，你的计算对象是增量，是这个 42.7**。实际的增量是多少？实际的增量是 43.34。\n> 就是虽然我这个 610 有差，跟这个正确答案差了 3%，是有一个 20 的差距的；但**因为我现在算的不是基期、我要算增量，我把这个 610 去乘了 7%，也会同样地把这个误差成 7%**，就相当于 `630 减 20` 乘了 7%，等于 `63 × 7%` 减去 `20 × 7%`，**我把这个误差用这个增速缩小了**，导致我的误差其实只有一点几，那你说这个一点几的误差对于这个选项来说，是不是就压根就没有影响？\n\n**画面板书（选项对应的增量）**：\n\n```\n每个选项对应的增量：\nA.600 → 673 − 600 = 73.3\nB.620 → 673 − 620 = 53.3\nC.630 → 673 − 630 = 43.3\n（差值从\"百分点级\"变成\"增量级\"，差距拉大到约 25%）\n```\n\n> 实际上，他们每个选项对应的增量是多少？是 43.3、53.3、73.3。例如这 43.3、53.3、73.3，这个差距就大了吧？差了差不多 25% 了吧，到了没？\n> 这样我就算这个增量，我就算说存在一定的偏差，**你不可能偏差这么多吧**？因为你的计算对象小，你的乘除的误差是一个百分比，带来的影响就小。\n> 所以有时候这种题目，**它甚至可能说就是选项越近反而越好算。**\n\n> 这个其实我们后面也会讲，**假设代入**那一节：选项越近，你假设的基期越靠近真实的基期，误差越小，经过增速一乘误差更小。\n> 当然这个题目放在这边，我只是想告诉大家，就是**你要去理解你的误差是由你的计算对象决定的**。……不是说什么时候假设基期代入，这个是另外一回事情，这个是我们后面第四节课会去给你讲怎么去算增量、怎么去算基期，先别着急。\n> 你先告诉我，你们只要现在能理解好，为什么有的时候好像误差大、有的时候好像误差小，就是一个道理——**你去抓准了你的乘除的计算对象，你的计算对象到底是谁？他计算对象的百分之一百分之二，到底会带来多大的误差**，是这个意思。\n\n**画面板书（出题人视角）**：\n\n```\n出题人 疏忽 （画面手写）\n```\n\n> 这种其实你也可以这么理解，它相当于是类似于这种出题人的一个疏忽。他在出题的时候他觉得六百、六百二、六百三挺近的了，我觉得我这个选项设置的让学生应该还是蛮痛苦的吧，**但是我们并不一定要按这个 673 去除这个 1.07，我们就算增量了。**\n\n**【选项原文】**\n\n| 选项 | 数值 | 对应增量（画面板书） |\n|---|---|---|\n| A | 600 亿立方米 | 73.3 |\n| B | 620 亿立方米 | 53.3 |\n| C | 630 亿立方米 | 43.3 |\n| D | 724 亿立方米 | — |\n\n**【答案】** ✅ C（630 亿立方米）\n\n**【解析】**\n\n- 精确计算：`673.34 ÷ 1.0696 ≈ 629.5`（亿立方米），四舍五入 ≈ 630 → **C**。\n- 排除 A（600）/ B（620）：二者与真值的差（73.3 / 53.3）对应约 11.6% / 8.5% 的增速，远超 6.96%。\n- 排除 D（724）：724 > 673.34，而 2021 年是**增长** 6.96%，基期必然**小于**现期。\n- **陷阱类型**：**精度陷阱**（三个选项只差 1~3 个百分点，直接精算极易选错）+ **概念陷阱**（材料给了 4 个指标，只有\"供水总量\"和\"同比增长 6.96%\"是本题所需，其余是干扰信息）。\n- **本题的核心价值**：**换计算对象 = 换误差的量级**。把\"求基期（大数）\"换成\"求增量（小数）\"，误差被增速缩小到原来的 7%。\n\n---\n\n### 例题 17｜2019 山东选调 · 人口总数（计算对象变大的反例）\n\n**【题干原文】**（画面逐字）\n\n> （2019 山东选调）2017 年末，全国医疗卫生机构床位 794.0 万张，同比增长 53.0 万张。其中：医院 612.0 万张（占 77.1%），基层医疗卫生机构 152.9 万张（占 19.3%）。医院中，公立医院床位占 75.7%，民营医院床位占 24.3%。与上年比较，床位增加 53.0 万张，其中：医院床位增加 43.1 万张，基层医疗卫生机构床位增加 8.7 万张。每千人口医疗卫生机构床位数由 2016 年 5.37 张增加到 2017 年 5.72 张。\n> 从所给数据资料中可以推算，2017 年末全国人口总数比 2016 年末增加量最接近：\n\n**【材料数据】**\n\n| 指标 | 2016 年 | 2017 年 |\n|---|---|---|\n| 全国医疗卫生机构床位 | 794.0 − 53.0 = 741.0 万张 | 794.0 万张 |\n| 每千人口医疗卫生机构床位数 | 5.37 张 | 5.72 张 |\n| 床位增加量 | — | 53.0 万张 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求**人口总数的增加量**（题干问\"增加量最接近\"） |\n| 关键转化 | 材料只给了\"**每千人口床位数**\"这个**平均数**，人口只能拿\"床位数 ÷ 每千人口床位数\"倒推 |\n| 列式 | `2017 人口 ≈ 794.0 万张 ÷ 5.72 张/千人`；`2016 人口 ≈ 741.0 万张 ÷ 5.37 张/千人` |\n| 速算步骤 | `794 ÷ 5.72 ≈ 138.8`（亿）；`741 ÷ 5.37 ≈ 138.0`（亿） |\n| 结论 | 差 ≈ 0.8 亿 ≈ 800 万，最接近 822 万 |\n| 为什么这是\"最难的精算题\" | 计算对象是 **14 亿量级**，而四个选项相差只有 100~200 万 → 要求误差控制在**万分之几**以内 |\n\n**板书（画面）**：\n\n```\n794 万张 ÷ 5.72 张/千人  ≈ 14 亿（量级）\n\n精度要求（画面标注）：\n14 亿的 1%   = 1400 万   ← 画面写 1400\n14 亿的 0.1% = 140 万    ← 画面写 140\n14 亿的 0.01%= 14 万     ← 画面写 14\n要求误差 ≈ 0.05%（万分之五）  ← 画面写 0.05%\n```\n\n画面手写：`706`（被圈）、`1472`、`1470`、`70`、`1400 0.12% = 140 0.05%`，以及竖式 `794万 / 5.72 ≈ ...`。\n\n**老师讲解原话**：\n\n> 这个题目很多人看选项，觉得这个题目好像挺正常的，七百多万、八百多万、九百多万，然后一算就知道出问题了。\n> 因为他问的是**人口总数**的增量，然后它上面这个人口总数值怎么算呢？**只能拿每千人口的床位数这个平均值去做除法去算人口**，意味着什么？2017 年的人口总数怎么算？就是拿 17 年的床位数除以每千人口的床位数这个平均值：794 万除以 5.72，就是每千人 5.72 张。\n> 所以就相当把它牵上来，就变成 7940000000 除以 5.72，这么多人。你算下来，其实我也不去算多少了，我告诉你，这个地方**肯定是个十四亿左右的东西**，因为是我们我国的人口嘛，是个十四亿左右的数。\n> 结果你得告诉我，**你的选项只能差 70 万**。就相当于 14 亿，你只能差 70 万的误差。变不变态？14 亿的 1% 它甚至有 1400（万），千分之一都有 14（万）。**这得是万分之五的误差你都不能有。所以这个题目其实是一道非常高难度的精算题。**\n\n> 所以误差其实就看你的计算对象是什么了。最后我们再来稍微总结一下，**这个题不用去跟你算，说怎么算没有意义，就是场上（直接）算**。\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 741万 |\n| B | 822万 |\n| C | 895万 |\n| D | 938万 |\n\n**【答案】** ✅ B（822 万）\n\n> （说明：画面未对该题的选项做出明确圈选；此处按板书\"2017 年人口 ≈ 794万÷5.72 ≈ 138.8 亿\"\"2016 年人口 ≈ 741万÷5.37 ≈ 138.0 亿\"，两者之差 ≈ 0.8 亿 ≈ 800 万，最接近 B.822万。转写中老师只说\"这个题不用去跟你算……就是场上（直接）算\"，未口播答案。）\n\n**【解析】**\n\n- 精确计算：\n  - 2017 年人口 ≈ `7,940,000 张 ÷ 5.72 张/千人 × 1000 ≈ 13.881 亿`\n  - 2016 年人口 ≈ `7,410,000 张 ÷ 5.37 张/千人 × 1000 ≈ 13.799 亿`\n  - 增加量 ≈ `0.082 亿 = 822 万` → **B.822万**\n- 排除 A（741万）：741 恰是 **2016 年的床位数（万张）**，是典型的\"数字搬运\"陷阱。\n- 排除 C（895万）、D（938万）：需要误差达到 9%、14%，与\"只能差万分之几\"的要求完全不符。\n- **陷阱类型**：**概念陷阱**（\"床位 ÷ 每千人口床位 = 人数\"这一步换算）+ **单位陷阱**（万张 ÷ 张/千人 = 千人 → 还要 ×1000 才是人）+ **精度陷阱**（14 亿量级、选项只差百万级）。\n- **本例题的教学定位（老师原话）**：\n\n> 当然这种题目其实很少见，目前这里面好像就看到一道，一九年山东选调到有一道题目，这道题目还是蛮经典的。\n\n> **反例的意义**：这是\"正向例子\"的对立面。前面那题问的是**基期**（大数），但我们**改算增量**（小数）就变简单了；这题问的是**人口增量**，但**每一步的计算对象都是 14 亿级的大数**，误差就变得极其致命。\n\n---\n\n### 例题 18｜间接误差：10566÷1.184 − 8811÷1.02\n\n**【题干原文】**（画面逐字）\n\n> `10566÷1.184 − 8811÷1.02 =`\n\n**【选项原文】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 1755 | 划 |\n| B | 1579 | 划 |\n| C | 286 | 圈选 |\n| D | 268 | 划 |\n\n**【答案】** ✅ C（286）\n\n**板书（画面）**：\n\n```\n10566 / 1.184\n     1184 ) 110566  →  ≈ 8924（近 9000）\n\n8811 / 1.02        →  ≈ 8636（八千多的一个数）\n\n画面示意：9000 − 8714 = 286\n画面另注：276（若算偏 10，就会落到 276，进而误选 D）\n```\n\n画面手写数字：`8924`、`8800+`、`9000`、`−8714`、`= 286`、`276`、`0.1?%`、`99`、`16`、`80`。\n\n**老师讲解原话**：\n\n> 这是一个正向的例子，就是我们去利用这种出题人的一个疏忽，设置的问题是问基期，但我们可以算增量去利用这个疏忽。**但也有反向的例子**，就比如说这样的一个例子。\n> 有的同学看到这种题目，看到这道题目会觉得感觉选项差距挺大的嘛，你不管是 A、B 还是 C、D，都基本上有百分之五以上、百分之十以上的误差，对不对？就觉得这个题目精度要求好像也还好，应该没有那么难算吧？\n> **但是其实像这个题目你就不能这么去想了，因为你要注意你的乘除对象是谁。** 虽然说这个地方差了 18，对于这两百多，这个 18 确实不小了，但是你又不是直接拿乘除对象去算的。\n> 这个 286，你这里的乘除算的是谁呀？算的是 10566 除以 1.184，算下来是个将近 9000 的一个数；8811 除以 1.02，算的是一个 8 千多的一个数。**你的误差是由你的计算对象决定的**——你这个 9000 和 8000，你要是算偏了个 1%，就会对结果带来一个 90~100 的影响，你这个选项差距才十八呀，是不是就很难算？\n> 你就得控制你这个乘除计算不能超过这种十（左右）的误差。你一旦超过十了，是不是就愿意选错？9000，你要把误差控制在 10 以内，对不对？而这个十对于九千来说，它只有**千分之一**的误差，所以你就基本上就只能去死算，就只能去硬算。你其他的什么各种估算都很可能错，**你一旦达到了百分之零点一的误差，就可能错了。**\n\n**死算演示（老师原话）**：\n\n> 怎么死算，死算还要我教你啊？10566 除以 1184，上个这边上九上不去，上个八，这样死算呗。**你不能去调了，你调的话，你不就出问题了吗？** 你要是哪个地方稍微调一点误差，个百分之零点一都可能错了呀。你要是说什么你去用什么放缩，把分母去增加个什么百分之二，上面增加个什么百分之二点一，这都能错的呀，所以这不就（只能硬算）了吗？\n\n**【解析】**\n\n- 精确计算：`10566 ÷ 1.184 ≈ 8924.0`；`8811 ÷ 1.02 ≈ 8638.2`；差 ≈ **286** → **C**。\n- 排除 D（268）：C 与 D 只差 **18**，而两个计算对象都在 8600~9000 量级，**千分之一的误差就能带来 9 的偏差**，两个小误差叠加就足以把 286 变成 276，从而误选 D。\n- 排除 A（1755）、B（1579）：与结果量级完全不符。\n- **陷阱类型**：**精度陷阱**（选项差距 18，计算对象却接近 9000）+ **间接误差**（误差不直接作用在结果上，而是作用在两个\"大数\"上，再作差放大）。\n- **与例题 16 的对照（本讲最重要的思维对照）**：\n\n| 对比项 | 例题 16（正向例子） | 例题 18（反向例子） |\n|---|---|---|\n| 题目问什么 | 问**基期** | 问**两个大数之差** |\n| 我们的计算对象 | **换成增量**（小，被增速 7% 缩小） | **只能是大数**（9000 与 8600） |\n| 误差来源 | 增量的百分比 | 大数的百分比（千分之一就已致命） |\n| 策略 | 大胆估算 + 修正 | **只能死算，不能调** |\n\n---\n\n## 七、本讲知识点总表\n\n| 板块 | 核心结论 | 关键操作 | 典型例证 |\n|---|---|---|---|\n| **壹 运算顺序** | 复杂步骤中，顺序选择非常重要；顺序调整需满足四则运算交换律 | ①好算的先算 ②影响大的先算 ③最后结合选项判断 | `6154÷1.04÷12` → 先算 `÷12`；`3.47/1.2221` 先当 `3.47` 用 |\n| **贰 调整位数** | **位数没有任何意义**（选择题很少考量级） | 随便去掉位数，只看**有效数字**；只在选项有效数字重复时才需估量级 | `59082÷1.1` 看成 `59÷11`；`147774×0.4%` 看成 `14774×4` |\n| **叁 加减误差** | 误差是**量**的影响；加法同向累积、反向抵消；减法同向抵消、反向累积 | 加法：一个舍、一个入，让误差对冲；减法：两个数同方向舍入 | `7417+8854 → 7400+8900`；`715−523 → 700−500` |\n| **叁 加法多位数** | 数多了就**记总账**，把每次的\"边角料\"合并丢给最后一个数 | `74+88+59+47 = 268`，边角料 56 让 `42.7 → 43` | `7417+8810+5920+4709+4270 = 31126`，误差仅 26 |\n| **肆 截位误差** | 乘除运算的误差重点看**占比**（不是量） | 截 2 位误差 1%~10%；截 3 位误差 0.1%~1%；**建议截三位**（四舍五入→截成 105 而非 104） | `1048÷4167`：截两位得 23.8%，截三位得 105÷417 |\n| **肆 选项距离** | 乘除运算看选项距离，**永远看比例** | 差距比例越大，计算难度越低 | `1、2、3、4` 比 `1000、1002、1004、1006` 好算得多；`1552÷1546` 差 1 好算，差 2/4/6 难算 |\n| **肆 乘法误差** | 一个数变大/变小，结果同向变大/变小；**同方向累积、不同方向抵消**；看比例 | 放大后要**反向退回**；多个数小幅变化可**直接相加**（后面\"间隔增长率\"会讲原理） | `1781×3% → 1800×3%=54 → 54−0.54=53.4`；`1642.5×8.8% → 1600×9%=144` |\n| **肆 除法误差** | 分子分母**同方向变化可抵消，反方向变化会累积** | 分母变小→结果变大→要把变大的部分退回去 | `50225÷731 → 5/7=71.4 → −3.5% → 68.6` |\n| **伍 计算对象** | **误差是由计算对象决定的**；计算对象越小，误差带来的量越小 | 把\"大数（基期/现期）\"换成\"小数（增量）\"，误差被增速缩小 | 例题 16 换算增量；例题 17/18 计算对象太大只能死算 |\n\n---\n\n## 八、速算口诀与解题流程\n\n### 8.1 核心口诀\n\n```\n【先粗后细】\n先估算 → 估算能出答案就直接选 → 选不出来再调细\n\n【误差有借有还】\n你多算了的，你就去掉；少算了的，就补回来。\n（把一个数变大 1%，结果就大 1%，要退回 1%）\n\n【方向规则】\n加法、乘法：同方向累积，反方向抵消 → 要让一个变大，另一个变小\n减法、除法：同方向抵消，反方向累积 → 要让两个一起变大，或一起变小\n\n【位数无所谓】\n位数没有任何意义，只看有效数字；\n选项有效数字重复时，才回头估一下量级。\n\n【10% 红线】\n调整数字不要超过 10%，超过就容易控制不住误差。\n\n【计算对象越小越好】\n乘除的计算对象越小，同样的百分比误差带来的\"量\"就越小。\n```\n\n### 8.2 标准解题流程\n\n```\n第 1 步｜读题识别题型：求基期 / 求增量 / 求增速 / 求平均数 / 求比重\n第 2 步｜列式：写出原始式子（分子/分母形式）\n第 3 步｜找\"影响大\"的那一步：\n        先算好算的、先把影响大的算掉 → 得出一个粗结果\n第 4 步｜结合选项排掉明显不对的\n第 5 步｜（选不出来时）分析误差：\n        · 加减：看\"量\"，检查每个数是舍还是入、方向是否对冲\n        · 乘除：看\"占比\"，检查每个数变大/变小了百分之几\n第 6 步｜把误差退回（多了减、少了加），落到唯一选项\n第 7 步｜（难题）检查计算对象是否能换小 → 换成增量/小数来降误差\n```\n\n### 8.3 四则运算放缩的误差方向速查表\n\n| 运算 | 改变方式 | 结果影响 | 处理方式 |\n|---|---|---|---|\n| 加法 | 一个加数变大 | 结果变大 | 让另一个加数变小（对冲） |\n| 加法 | 所有加数都变大 | 误差**累积** | 记总账，把边角料合并后一次性补 |\n| 减法 | 被减数变小、减数也变小 | 误差**抵消** | 尽量同方向四舍五入 |\n| 减法 | 被减数变大、减数变小 | 误差**累积** | 禁止这样操作 |\n| 乘法 | 一个因数变大 | 结果同比例变大 | 结果反向退回同样的比例 |\n| 乘法 | 两个因数都变大 | 误差**累积**（可把两个百分数直接相加） | 一次性退回加总后的百分比 |\n| 乘法 | 一个变大、一个变小 | 误差**抵消** | 可直接选 |\n| 除法 | 分子、分母同方向变化 | 误差**抵消** | 净影响 = 两者之差 |\n| 除法 | 分子变大（分母不变） | 结果变大 | 反向退回 |\n| 除法 | 分母变大（分子不变） | 结果变小 | 反向补回 |\n\n---\n\n## 九、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 说明 | 对应例题 |\n|---|---|---|---|\n| 1 | **违反四则运算交换律** | `(a+b)×c` 不能自作主张先算 `a×c` 再加 `b`，那等于 `a×c + b×c` | 运算顺序原则 |\n| 2 | **抓不住\"影响大\"的一步** | 面面俱到地想每一步的误差，反而增加计算负担 | 例题 1、2 |\n| 3 | **\"现期月均\"当\"基期月均\"** | 基期一定小于现期，可用来快速排除 | 例题 1 |\n| 4 | **找不到隐含的基期** | \"环比增长 22.21%\"是连接二季度与一季度的桥梁 | 例题 2 |\n| 5 | **忘记了修正** | 估完就选，不回头看误差方向 | 例题 5、13、15 |\n| 6 | **修正方向搞反** | 分母放大 → 结果偏小 → 要**加**回来 | 例题 15 |\n| 7 | **修正时直接加减百分数** | 加\"百分之二\"是加**比例的百分之二**，不是 `22 + 2` | 例题 14 |\n| 8 | **估算时两个数同方向都缩小** | 误差会累积，早晚出问题 | 例题 6 |\n| 9 | **多位数加法忘了\"边角料\"** | 要记总账，把每次舍掉的量合并补给最后一项 | 例题 7 |\n| 10 | **减法中被减数与减数方向相反** | 一个变大一个变小，差会被放大 | 例题 8 |\n| 11 | **乘除运算用\"量\"去衡量选项差距** | 乘除看**占比/比例**，不看绝对差 | 5.4 节、`1552÷1546` |\n| 12 | **误以为截两位很安全** | 截两位误差 1%~10%，两次方向相反时会累计 | 5.3 节 |\n| 13 | **调整幅度超过 10%** | 超过 10% 误差很难控制 | 例题 10 |\n| 14 | **\"现期/基期\"混淆** | 增长年份问基期，基期一定小于现期 | 例题 15 |\n| 15 | **材料有多组数据时选错列** | 如东盟/韩国/非洲三组，必须只取非洲列 | 例题 14 |\n| 16 | **概念陷阱：进出口总额 = 出口 + 进口** | 不能只取其中一个 | 例题 14 |\n| 17 | **概念陷阱：平均数倒推总量** | \"床位数 ÷ 每千人口床位 = 人口\"，还需 ×1000 换算单位 | 例题 17 |\n| 18 | **数字搬运陷阱** | 选项 A.741万 恰是\"741.0 万张\"，是数字的搬运 | 例题 17 |\n| 19 | **盲目估算\"大数相减\"型题目** | 计算对象在 9000 量级时，千分之一误差就致命，必须硬算 | 例题 18 |\n| 20 | **反向例子与正向例子搞混** | 能换小计算对象的就换；换不了的就死算 | 例题 16 vs 18 |\n\n---\n\n## 十、老师金句\n\n> ⭐ **你要有这种平衡误差的习惯。**（讲加法误差时）\n\n> ⭐ **我多拿了你百分之一的钱，那我不得还给你吗？那你有借就要有还啊。**（讲退误差）\n\n> ⭐ **资料分析有这么个原则叫先粗后细。你先估算，估算的可以出答案，其他选项不可能在这个范围内选择；选不出来，你就把它调细一点。**\n\n> ⭐ **你只要把误差管理好了，你就相当于是一个数字的魔术师，这个数字在你手上想变成什么数、想变成什么好算的数都可以变，变了之后你再对应去调这个误差就可以了。**\n\n> ⭐ **位数是最没有用的一个东西，真的是最没有用的一个东西。资料分析，它不相信位数，位数没有任何意义。**\n\n> ⭐ **乘除计算的误差是占比不是量。……永远看的是比例，差距比例越大的，计算难度越低。**\n\n> ⭐ **你要去理解你的误差是由你的计算对象决定的。**\n\n> ⭐ **有时候这种题目，它甚至可能说就是选项越近反而越好算。**\n\n> ⭐ **你直除再快，能快得过我？**（讲七分之五）\n\n> ⭐ **不要老去在意那些什么截两位截三位的。（我一般建议大家去截三位。）**\n\n> ⭐ **我甚至有的时候我在去年讲课的时候，我截四位都很经常截。**（因为四位也可以把控好放缩）\n\n> ⭐ **你干嘛要在意这个位数呢？不要在意位数，你位数不影响他们的一个比例关系。**\n\n> ⭐ **我一说这些都是去减少位数的这种估算方式，这种估算逻辑和可能是你们说的一些什么精算技巧、精算的方式不一样。我不想去想那么多位数，我在我脑海中，我只想看它什么两位数或者一位数的。**\n\n> ⭐ **这种题目（例题 18）其实是一道非常高难度的精算题。**\n\n> ⭐ **这个题不用去跟你算，说怎么算没有意义，就是场上（直接）算。**\n\n> ⭐ **我们今天这节课主要讲的就是一个基本逻辑，还有一个误差关系。基本逻辑就是你在做题的时候，注意你的计算顺序、注意一个计算位数，以及你去挑里面的计算对象。**\n\n> ⭐ **你不能说为了自己想快速地解决这些计算，你就统一地全让他们变小变小变小（或者变大变大变大），然后统一地加，这样子迟早会出问题，要有这种平衡误差的习惯。**\n\n> ⭐ **你如果就为了那些百分之五、甚至占比百分之一的难题，去不敢估、去不敢快速地简单地估一下一个结果，你会在剩下的百分之九十五到百分之九十九的简单题、中等题里面浪费大量的时间。**\n\n---\n\n> **本集完**（下一集：第三课 放缩运算，本课为其理论基础）\n\n\n","outline":[{"level":2,"text":"一、开场铺垫：从\"资料分析\"到\"资料计算\"的痛点","id":"一开场铺垫从资料分析到资料计算的痛点"},{"level":2,"text":"二、本讲五大板块（目录页原文）","id":"二本讲五大板块目录页原文"},{"level":2,"text":"三、板块壹：运算顺序","id":"三板块壹运算顺序"},{"level":3,"text":"3.1 四则运算交换律（板书原文）","id":"31-四则运算交换律板书原文"},{"level":3,"text":"3.2 运算顺序的两条原则","id":"32-运算顺序的两条原则"},{"level":3,"text":"3.3 板演示例（加减乘除四例）","id":"33-板演示例加减乘除四例"},{"level":3,"text":"例题 1｜2024 年全国煤炭进口额（月均）","id":"例题-12024-年全国煤炭进口额月均"},{"level":3,"text":"例题 2｜2015 年全国第三方移动支付市场（月均）","id":"例题-22015-年全国第三方移动支付市场月均"},{"level":2,"text":"四、板块贰：调整位数","id":"四板块贰调整位数"},{"level":3,"text":"4.1 核心思想","id":"41-核心思想"},{"level":3,"text":"例题 3｜59082÷1.1（有效数字与量级）","id":"例题-35908211有效数字与量级"},{"level":3,"text":"例题 4｜147774×0.4%（位数无所谓）","id":"例题-414777404位数无所谓"},{"level":2,"text":"五、板块叁/肆：误差分析","id":"五板块叁肆误差分析"},{"level":3,"text":"5.1 误差来源：减少位数","id":"51-误差来源减少位数"},{"level":3,"text":"例题 5｜147774×0.4%（选项变近后的修正）","id":"例题-514777404选项变近后的修正"},{"level":3,"text":"5.2 加减误差","id":"52-加减误差"},{"level":3,"text":"例题 6｜7417+8854（加法：不同方向抵消）","id":"例题-674178854加法不同方向抵消"},{"level":3,"text":"例题 7｜7417+8810+5920+4709+4270（多位数：记总账）","id":"例题-774178810592047094270多位数记总账"},{"level":3,"text":"例题 8｜715−523（减法：同方向抵消）","id":"例题-8715523减法同方向抵消"},{"level":3,"text":"5.3 截位误差","id":"53-截位误差"},{"level":3,"text":"5.4 乘除误差（先看占比）","id":"54-乘除误差先看占比"},{"level":3,"text":"例题 9｜1781×3%","id":"例题-917813"},{"level":3,"text":"例题 10｜25733×7.8%（动两个数）","id":"例题-102573378动两个数"},{"level":3,"text":"例题 11｜1642.5×8.8%（不同方向抵消）","id":"例题-111642588不同方向抵消"},{"level":3,"text":"例题 12｜50225÷731（除法：同向抵消）","id":"例题-1250225731除法同向抵消"},{"level":3,"text":"例题 13｜54428÷12","id":"例题-135442812"},{"level":2,"text":"六、板块伍：计算对象","id":"六板块伍计算对象"},{"level":3,"text":"例题 14｜2024 年江苏省对非洲进出口总额增速","id":"例题-142024-年江苏省对非洲进出口总额增速"},{"level":3,"text":"例题 15｜2019 江苏事业 · 社会消费品零售总额","id":"例题-152019-江苏事业-社会消费品零售总额"},{"level":3,"text":"例题 16｜2021 年全国城市供水总量（计算对象变小）","id":"例题-162021-年全国城市供水总量计算对象变小"},{"level":3,"text":"例题 17｜2019 山东选调 · 人口总数（计算对象变大的反例）","id":"例题-172019-山东选调-人口总数计算对象变大的反例"},{"level":3,"text":"例题 18｜间接误差：10566÷1.184 − 8811÷1.02","id":"例题-18间接误差105661184-8811102"},{"level":2,"text":"七、本讲知识点总表","id":"七本讲知识点总表"},{"level":2,"text":"八、速算口诀与解题流程","id":"八速算口诀与解题流程"},{"level":3,"text":"8.1 核心口诀","id":"81-核心口诀"},{"level":3,"text":"8.2 标准解题流程","id":"82-标准解题流程"},{"level":3,"text":"8.3 四则运算放缩的误差方向速查表","id":"83-四则运算放缩的误差方向速查表"},{"level":2,"text":"九、易错点与陷阱清单","id":"九易错点与陷阱清单"},{"level":2,"text":"十、老师金句","id":"十老师金句"}]}]},{"name":"第 3 课 放缩运算（含课后作业）","items":[{"id":"P04","title":"放缩运算（上）","full":"第3课 放缩运算（上）","lect":"","dur":"99:52","sec":5992,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 4 集\n\n# 第3课 放缩运算（上）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 4 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=4`\n> **时长**：约 99 分 52 秒（本合集最长的一集）\n> **本集主题**：**放缩运算（上）——放缩的两条根本逻辑、加法放缩、减法放缩、除法放缩（原理 / 减少分母位数 / 百化分错位相加相减 / 补偿误差）**\n\n> 说明：本节是「第三课 放缩运算」的上半部分。目录三块中，**加减放缩、除法放缩全部讲完并做了大量练习，乘法放缩未在本集展开**（留待下册）。\n\n---\n\n## 目录\n\n- [一、开篇：放缩的两条根本逻辑](#一开篇放缩的两条根本逻辑)\n- [二、加法放缩](#二加法放缩)\n  - [2.1 「有借有还」：四舍五入 + 尾数凑整](#21-有借有还四舍五入--尾数凑整)\n  - [2.2 「秋后结账」：误差可以留着，但不能一边倒](#22-秋后结账误差可以留着但不能一边倒)\n  - [2.3 例题 1｜2018—2022 年我国新立采矿权总数](#23-例题-120182022-年我国新立采矿权总数)\n  - [2.4 削峰填谷（预设平均数法）](#24-削峰填谷预设平均数法)\n  - [2.5 例题 2｜(71165+43357+57826+67089)÷4](#25-例题-2711654335757826670894)\n  - [2.6 削峰填谷的适用面为什么窄](#26-削峰填谷的适用面为什么窄)\n  - [2.7 例题 3｜2003—2007 年 SCI 平均每年收录中国科技论文](#27-例题-320032007-年-sci-平均每年收录中国科技论文)\n  - [2.8 例题 4｜2012—2016 年固定互联网宽带接入用户平均数](#28-例题-420122016-年固定互联网宽带接入用户平均数)\n- [三、减法放缩](#三减法放缩)\n  - [3.1 「同大同小、公平对待」](#31-同大同小公平对待)\n  - [3.2 例题 5｜2022 年下半年全国居民人均经营净收入](#32-例题-52022-年下半年全国居民人均经营净收入)\n  - [3.3 尾数法（含负值尾数的处理）](#33-尾数法含负值尾数的处理)\n  - [3.4 例题 6｜2022 年四个季度人均工资性收入最高者](#34-例题-62022-年四个季度人均工资性收入最高者)\n- [四、除法放缩（本讲重点）](#四除法放缩本讲重点)\n  - [4.1 原理：分子分母等比例变化，结果不变](#41-原理分子分母等比例变化结果不变)\n  - [4.2 操作模式一：减少分母位数（截位 / 凑百化分）](#42-操作模式一减少分母位数截位--凑百化分)\n  - [4.3 常用 1/n 表与三大「百化分」通道](#43-常用-1n-表与三大百化分通道)\n  - [4.4 操作模式二：补偿误差（分子法 / 结果法）](#44-操作模式二补偿误差分子法--结果法)\n  - [4.5 计算小技巧（错位相加 / 错位相减及其误差）](#45-计算小技巧错位相加--错位相减及其误差)\n  - [4.6 例题 7｜2018 年我国软件业务收入比上年增长](#46-例题-72018-年我国软件业务收入比上年增长)\n  - [4.7 例题 8｜2020 年度国内旅游人数同比](#47-例题-82020-年度国内旅游人数同比)\n  - [4.8 例题 9｜2017 年全国互联网企业电子商务平台收入](#48-例题-92017-年全国互联网企业电子商务平台收入)\n  - [4.9 例题 10｜食品烟酒和居住占居民人均消费支出的百分比](#49-例题-10食品烟酒和居住占居民人均消费支出的百分比)\n  - [4.10 快速练习（10 道除法放缩练习 + 整百版复练）](#410-快速练习10-道除法放缩练习--整百版复练)\n  - [4.11 例题 11｜2022 年全国每万人拥有的体育场地数量](#411-例题-112022-年全国每万人拥有的体育场地数量)\n  - [4.12 例题 12｜G 省平均每件法律援助案件帮助受援群众](#412-例题-12g-省平均每件法律援助案件帮助受援群众)\n  - [4.13 例题 13｜2017 年我国软件和信息技术服务业从业人员](#413-例题-132017-年我国软件和信息技术服务业从业人员)\n  - [4.14 例题 14｜2024 年第一季度全国烤烟出口均价](#414-例题-142024-年第一季度全国烤烟出口均价)\n  - [4.15 例题 15｜Q 省客运平均运送距离（量级陷阱）](#415-例题-15q-省客运平均运送距离量级陷阱)\n  - [4.16 例题 16｜2017 年社会消费品零售总额](#416-例题-162017-年社会消费品零售总额)\n  - [4.17 例题 17｜2018 年 V 市交通运输、仓储和邮政业增加值（本集未讲）](#417-例题-172018-年-v-市交通运输仓储和邮政业增加值本集未讲)\n- [五、本讲知识点总表](#五本讲知识点总表)\n- [六、速算口诀与解题流程](#六速算口诀与解题流程)\n- [七、易错点与陷阱清单](#七易错点与陷阱清单)\n- [八、老师金句](#八老师金句)\n- [九、画面与转写的差异 / 存疑处](#九画面与转写的差异--存疑处)\n\n---\n\n## 一、开篇：放缩的两条根本逻辑\n\n老师开场即点明本课与前两课的关系：\n\n> 「放松的运算从第三节课开始，第三节课和第四节课就是怎么去算一些东西。」\n> 「我们前面一节课刚讲的就是一个误差的控制……在理解了误差之后，我们就具体的来聊一聊怎么利用误差去进行一些计算。我们也叫它放缩运算，放就是放大。」\n\n**目录（画面原样）**：\n\n| 序号 | 板块 |\n|---|---|\n| 壹 | 加减放缩 |\n| 贰 | 除法放缩 |\n| 叁 | 乘法放缩 |\n\n> （目录页每个板块下还有一行小字，画面分辨率不足以辨识，此处不臆测。）\n\n**「放缩逻辑」页（画面原样 + 红色批注）**：\n\n```\n放缩逻辑\n①简化计算 → 减少位数        ← 批注：目的\n②调整误差 → 盈亏相抵        ← 批注：要求\n```\n\n| 分项 | 板书内容 | 红笔批注 | 老师解释 |\n|---|---|---|---|\n| ① | 简化计算 → 减少位数 | **目的** | 放缩就是要把位数变少、把数变整；「放缩的目的一定是减少位数，他不可能是让你去增加位数的。你要是增加位数，那这个放缩肯定是不到位的。」 |\n| ② | 调整误差 → 盈亏相抵 | **要求** | 「这个不是目的，是为了让我们达到更准确的结果的一个要求。你要有这种调整误差的意识，你可以不去调整，但你不能没有这个意识。」 |\n\n> ⭐「加减放缩、乘除放缩，它们的根本逻辑、根本目的，其实就是这两个：为了简化计算，为了能让我们计算的位数少一点，好算一点。」\n\n---\n\n## 二、加法放缩\n\n### 2.1 「有借有还」：四舍五入 + 尾数凑整\n\n**板书标题**：加法放缩\n**板书副标题**：四舍五入，尾数部分凑整，「有借有还」。\n\n**板书演算（画面原样）**：\n\n```\n123 + 318 ≈ 120 + 320 = 440\n479 + 674 ≈ 480 + 670 = 1150\n```\n\n> 「有借有还嘛，我把这个三减少了，那这边这个八就要变大，这样你的误差就会小。」\n> 「479 加上这个 674，我们就写成 479，它四舍五入是不是就比较好促成一个 480？然后那既然我刚刚一个数变大了，那这个数我就要变小，加六百七，变成一千一百五。这是一种习惯，你做这种题目，你要有这种习惯。」\n\n要点拆解：\n\n| 原始 | 调整方向 | 结果 |\n|---|---|---|\n| `123 + 318` | 123 ↓3 → 120；318 ↑2 → 320 | `120 + 320 = 440` |\n| `479 + 674` | 479 ↑1 → 480；674 ↓4 → 670 | `480 + 670 = 1150` |\n\n> 「加法的时候叫盈亏相抵。有的多了，你就要协商地方给他，其他地方给他捡回来。但核心目的都是为了什么？目的都是为了减少位数，为了凑整。但是为了让你不要算的偏差那么多，你就要去盈亏相抵。」\n\n### 2.2 「秋后结账」：误差可以留着，但不能一边倒\n\n**板书标题**：加法放缩 —— 「秋后结账」\n\n**板书演算（逐帧抄全）**：\n\n```\n                         +230   +79(圈)      +250      −126      −310\n78767 + 44921 + 23750 + 92126 + 67810 ≈\n                        79000 + 45000 + 24000 + 92000 + 67500\n\n= 124\n  24\n  148\n   92\n  240\n  675\n 307500        （即 30万7千5）\n```\n\n| 原数 | 凑整后 | 差额 | 方向 |\n|---|---|---|---|\n| 78767 | 79000 | +233（板书记 +230） | 多借 |\n| 44921 | 45000 | +79 | 多借 |\n| 23750 | 24000 | +250 | 多借 |\n| 92126 | 92000 | −126 | 少借（欠着） |\n| 67810 | 67500 | −310 | 少借（还回来一点） |\n\n竖式累加：79 + 45 = 124 → +24 = 148 → +92 = 240 → +67.5 = **307500**\n\n> 「还有一种就是我们上面一节课也说过的，有时候如果说这个数太多了……比如说他那些四舍五入，他五入的或者四舍的比较集中怎么办？我不好去盈亏相抵，我把这个数如果我想成一个七万九，我难道还能把它选成 44 吗？这不好吧？我为了抵这边两百多的一个账，我把这边九百多都还给人家呀，是不是这不合适啊？」\n> 「他说你欠人家十块钱，你说那我这边也没有零钱，我把个一百个给你吧？那这不直接导致对方欠你九十了，这个账更还不掉了，所以怎么办呢？那就继续欠着嘛。」\n> 「你前面几个借多了，那后面就要稍微的象征性的给大家还一点。」\n> 「要问那为什么不是六七九零零，或者说为什么不直接六千八（六万八）啊？就一个道理嘛，你前面空了人家那么多的债，你最后你还在跟人家借。你脸皮这么厚……你最后没机会还了呀，你后面没账了，没有数字了，你只能在这还了，那我就还一点呗。」\n\n**关键结论**：\n\n```\n79000 + 45000 + 24000 + 92000 + 67500 = 307500\n（真实五数之和 ≈ 307500，误差可控，未出现「一边倒」）\n```\n\n> 「要是有同学有兴趣，把这五个数加起来，加一下，跟这个 307500 肯定是差不了太多的。」\n> 「你只要心里面有误差，你记得你的误差在哪就可以了……你这个反正偏大了，你去选个比他小一点的就好。」\n> 「只有一个还不起，你看情况吧……你起码说把这个想成六七幺零零，因为加的时候加了个六万七。」\n\n### 2.3 例题 1｜2018—2022 年我国新立采矿权总数\n\n**【题干原文】**\n> 2018—2022 年，我国新立采矿权总数在以下哪个范围内？（ ）\n> A.不到 6900 个　B.6900-7000 个之间　C.7000-7100 个之间　D.超过 7100 个\n\n**【材料数据】**（柱状图：2018—2022 年全国新立矿业权数量情况，单位：个）\n\n| 年份 | 新立采矿权 | 新立探矿权 |\n|---|---|---|\n| 2018 年 | 1251 | 354 |\n| 2019 年 | 1560 | 502 |\n| 2020 年 | 1553 | 310 |\n| 2021 年 | 1432 | 467 |\n| 2022 年 | 1384 | 362 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求「五个数之和」的范围 |\n| 定位数据 | 题问「新立采矿权总数」→ 取白色柱（新立采矿权）5 个：1251、1560、1553、1432、1384 |\n| 列式 | `1251 + 1560 + 1553 + 1432 + 1384 ≈ ?` |\n| 速算（板上原样） | `12 + 16 = 28`；`16 + 14 = 30`；`14` 单记 → `28 + 30 + 14 = 72` → **7200** |\n| 结论 | 7200 > 7100 → D |\n\n**板书演算**：\n\n```\n1251 + 1560 + 1553 + 1432 + 1384\n  12  +  16  = 28\n             16  +  14  = 30\n                       14\n28 + 30 + 14 = 72  →  7200\n```\n\n> 「比如这个 1251 跟那个 1560，可不可以一边借一边还，把它变成 1000+2000？2800 熟悉的时候，你是不是这个地方其实可以不用动笔，直接 12 加 16 = 28。」\n> 「后面这两个是不是也可以凑一凑……还拿给你这个 1553 去凑成 16，可不可以？16 加 14 = 30。」\n> 「那当然，最后这个地方一三八四，他就很靠近十四，加起来七千二。」\n\n**【选项原文】**\n- A.不到 6900 个\n- B.6900-7000 个之间\n- C.7000-7100 个之间\n- D.超过 7100 个\n\n**【答案】** ✅ **D**（板书画圈标 D）\n\n**【解析】**\n- 真实值：`1251 + 1560 + 1553 + 1432 + 1384 = 7180`，落在「超过 7100 个」区间，选 D。\n- 陷阱类型：**范围陷阱 / 估读误差心理陷阱**。老师专门讲了「怕算多了」的心态：\n\n> 「我感觉这个 7200，如果你觉得好像离这个 7100 也比较近，我怕那会不会说算多了一点？本来应该是 C 的，我算成 D 了。那你想想看，你刚这计算过程的误差会不会存在 100 这么多呢？你刚刚的误差有没有让它到底偏大一百这么多？其实没有啊。」\n> 「你这个 51 加 60，你 111，你想的是个 100 对吧？当做 100 来算的。这 53 跟 30 号也很靠近 100 了吧，这 84 也很靠近 100 了吧。你就只是差那么 10 几的东西，你也就是 3 次，怎么可能差到 100 呢？所以差不到的。」\n\n| 数位归并 | 原数 | 当量 | 差额 |\n|---|---|---|---|\n| 1251 | 12 | 12 | ≈0 |\n| 1560 | 16 | 16 | ≈0 |\n| 1553 | 16 | 15 | +1 |\n| 1432 | 14 | 14 | ≈0 |\n| 1384 | 14 | 14 | ≈0 |\n\n（每次误差只有「十几」，一共才 3 次，不可能累积到 100）\n\n---\n\n### 2.4 削峰填谷（预设平均数法）\n\n**板书标题**：加法放缩 —— 削峰填谷\n\n**原理（老师口述）**：\n> 「我们要算这四个数的一个平均值，除以四对吧？常规做法就是把它们全加起来，再除四，对不对？好，下一种不常规的做法就是我们先预设。」\n\n**验证逻辑（板书原样）**：\n\n```\n预设平均数 = 6w\n验证？   盈 = 亏 = 6w\n         盈 > 亏  →  > 6w\n         盈 \u003c 亏  →  \u003c 6w\n```\n\n| 情况 | 结论 |\n|---|---|\n| 多的部分 = 少的部分 | 预设的平均数就是真实平均数 |\n| 多的部分 > 少的部分（盈 > 亏） | 真实平均数 **大于** 预设值 |\n| 多的部分 \u003c 少的部分（盈 \u003c 亏） | 真实平均数 **小于** 预设值 |\n\n> 「好像我就要给他四个人发工资……但我先预发一下，我先预发给大家，每个人发六万。结果发现，最后年底算账的时候，这些人还要多发这么多，多发的部分更多，那不就说明他们的平均工资比另外还高吗？」\n\n**三条操作要领（老师总结）**：\n\n1. 预设值最好取**中位数附近的整数**——中位数本身「没有多也没有少」；\n2. 中位数两侧**个数相等**，更容易产生抵消；\n3. 两侧与预设值的**距离不会出现极端情况**。\n\n**误差处理**：\n\n> 「你的总量低了 1000，对不对？……那这一千你是要把六万直接减一千吗？不是，这个少了这个东西，它是总量。你是把这四个数加起来，会比这个平均值 6 万的总和 24 万少 1000。所以你还要把这个 1000 平摊到这四个人身上，少 250。所以 6 万减 250，等于 59750。」\n\n```\n平均数 = 预设值 ± （总差额 ÷ 个数）\n```\n\n### 2.5 例题 2｜(71165+43357+57826+67089)÷4\n\n**【题干原文】**\n> (71165+43357+57826+67089) ÷4 ≈ （ ）\n> A.59859　B.56746　C.61497　D.62864\n\n**【材料数据】**：四个数 71165、43357、57826、67089（板书在旁逐个写出）\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求四个数的平均数 |\n| 预设值 | 6 万（`6w`，写在 A 选项下方） |\n| 求盈 | 71165 − 60000 = +11165 ≈ **+1.1w**；67089 − 60000 = +7089 ≈ **+0.7w** |\n| 求亏 | 57826 − 60000 = −2174 ≈ **−0.2w**；43357 − 60000 = −16643 ≈ **−1.7w** |\n| 汇总 | 盈合计 **+1.8w**；亏合计 **−1.9w**（板上把 −1.9w 圈起来） |\n| 判向 | 盈 \u003c 亏 ⟹ 平均数 **\u003c 6 万** |\n| 总差额 | 1.9w − 1.8w = 0.1w = **1000** |\n| 平摊 | `(−1000) ÷ 4 = −250` |\n| 结论 | `60000 − 250 = 59750` |\n\n**板书演算（画面原样）**：\n\n```\n(71165 + 43357 + 57826 + 67089) ÷ 4\n\n        +1.1w        +1.8w\n         +0.7w\n  6w  ──┼───────────────┬──────────────  ← 预设 6w 为基准线\n        │            57826  −0.2w\n     43357  −1.7w\n        −1.9w\n\n盈 = 亏 = 6w\n盈 > 亏   > 6w\n盈 \u003c 亏   \u003c 6w\n\n(−1000) / 4 = −250\n6w − 250 = 59750\n```\n\n**【选项原文】**\n- A.59859\n- B.56746\n- C.61497\n- D.62864\n\n**【答案】** ✅ **A**（板书画圈标 A，并在 A 下写 `6w`；B、C、D 打叉）\n\n**【解析】**\n- 真实值：`(71165+43357+57826+67089) ÷ 4 = 239437 ÷ 4 = 59859.25` → 最接近 A。\n- 老师口算得 59750，与 59859 差 109，仍稳落 A，不可能跳到 B（56746）。\n- 陷阱类型：**选项间距陷阱**。因为（估）算法本身有几百级误差，必须看选项间距是否足够大；本题 A 与 B 相差 3000，估算是安全的。\n\n> 「有的人问这个有没有误差？如果你这四个数算的没有误差，那就没有误差。如果你这四个数估的有误差，那就有误差。那我这边是估的嘛，肯定会有一点点误差，但这个误差不会太大嘛……这些误差都是在百位级的几百，几百除以四十，其实也就一两百的一个误差。不可能插到 B 这里来的。」\n\n### 2.6 削峰填谷的适用面为什么窄\n\n**板书演示（画面原样）**：在选项右下方写出三个差距极大的数\n\n```\n878        24600\n           10000\n    (7270)   ← 圈注\n   90        ← 即 10000 − 878 ≈ 9100\n```\n\n| 数 | 与预设 10000 的差 |\n|---|---|\n| 878 | −9122（板书写作「90」，即 9100 量级） |\n| 24600 | +14600 |\n| 7270 | −2730 |\n\n> 「为什么我说这个方法它的应用面其实比较窄呢？因为这个方法是在这些求和的数越接近越好用。因为越接近你找了个中间的平均数，找的更准确，他们离这个平均数的距离也越近，你减下来数字也越小。」\n> 「如果这几个数它离得相对比较远，越远这种削峰填谷就越没有用，越浪费时间。」\n> 「如果假设这个平均数是 10000，你光是 10000−878，你都要写个什么 9000 多，你还不如就直接去写这个 7200 + 这个东西是多少，对不对？差距这么大，你还不如直接加呢。」\n> 「所以这个（削峰填谷）应用面其实并不广，不过有时候也能用得上，所以要介绍一下。」\n\n**适用条件小结**：\n\n```\n削峰填谷越好用的条件\n① 各数彼此接近\n② 中位数附近有整数可作预设值\n③ 选项间距足够大（允许百位级误差）\n```\n\n### 2.7 例题 3｜2003—2007 年 SCI 平均每年收录中国科技论文\n\n**【题干原文】**\n> 2003-2007 年，SCI平均每年约收录多少篇中国科技论文？\n> A.5.9 万　B.6.3 万　C.6.7 万　D.7.1 万\n\n**【材料数据】**（柱线组合图：2003-2007 年 SCI 收录中国科技论文情况）\n\n| 年份 | SCI 收录中国科技论文数（柱） | 占 SCI 收录论文总数的比重（折线） |\n|---|---|---|\n| 2003 年 | 49788 | 4.48 |\n| 2004 年 | 57377 | 5.43 |\n| 2005 年 | 68226 | 5.25 |\n| 2006 年 | 71184 | 5.87 |\n| 2007 年 | 89147 | 7.00 |\n\n（左轴「量」0～100000；右轴「%」4.00～7.50）\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 五年平均数 |\n| 预设值 | **6.8 万**（取中位数 68226 附近的整数，板书写 `6.8w`） |\n| 求亏 | 49788 → **−1.8w**；57377 → **−1.1w** |\n| 求盈 | 71184 → **+0.3w**；89147 → **+2.1w** |\n| 汇总 | 亏合计 2.9w；盈合计 2.4w |\n| 判向 | 亏 > 盈 ⟹ 平均数 **\u003c 6.8 万** |\n| 总差额 | 2.9 − 2.4 = **0.5w** |\n| 平摊 | `(−0.5w) ÷ 5 = −0.1w` |\n| 结论 | `6.8w − 0.1w = 6.7w` |\n\n**板书演算（画面原样）**：\n\n```\n2003  49788   −1.8w\n2004  57377   −1.1w\n2005  68226    （中位数，不动）\n2006  71184   +0.3w\n2007  89147   +2.1w\n\n(−0.5w) / 5 = −0.1w\n6.8w − 0.1w = 6.7w\n```\n\n**【选项原文】**\n- A.5.9 万\n- B.6.3 万\n- C.6.7 万\n- D.7.1 万\n\n**【答案】** ✅ **C**（板书画圈标 C；A、B、D 打叉）\n\n**【解析】**\n- 真实值：`(49788+57377+68226+71184+89147) ÷ 5 = 335722 ÷ 5 = 67144.4` ≈ 6.7 万 → C。\n- 老师补充了「不必动笔的选项排除法」：\n\n> 「其实这个题目也能看出来。就不可能是 7.1 吧？7.1 到哪了？到这儿了，只有一个 8.9（89147）比它多。你后面这前面这三个明显比这个 7.1 少的部分，肯定比你的 8.9 一个一年多的部分要多吧？你要选前面六点三，六点三是不是有点低了呀？……对他大概在这个位置。这边多的部分也明显比这边少的部分是要多的，所以 6.3 小了，这里也大了。这个比较合适，六点七的话就在六点八下面一点点，这个位置就比较合适。」\n\n- 陷阱类型：**范围陷阱（选项间距大时可先排除）**。\n\n### 2.8 例题 4｜2012—2016 年固定互联网宽带接入用户平均数\n\n**【题干原文】**\n> 2012～2016 年期间，我国固定互联网宽带接入用户的平均数是：\n> A.18425 万户　B.22425 万户　C.25425 万户　D.27425 万户\n\n**【材料数据】**（柱状图：2012-2016 年年末固定互联网宽带接入用户和移动宽带用户数，单位：万户）\n\n| 年份 | 固定互联网宽带接入用户（白柱） | 移动宽带用户（黑柱） |\n|---|---|---|\n| 2012 | 17518 | 23280 |\n| 2013 | 18891 | 40161 |\n| 2014 | 20048 | 58254 |\n| 2015 | 25947 | 70611 |\n| 2016 | 29721 | 94075 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 五年平均数（题问「固定互联网」→ 取白柱；黑柱「移动宽带」是干扰数据） |\n| 预设值 | **2 万**（20048 附近，板书把 20048 圈注作中位数） |\n| 求亏 | 17518 → **−2500**；18891 → **−1100**（合计 **−3600**，板书在 17518/18891 上方统一划一条线写 −3600） |\n| 求盈 | 25947 → **+6000**；29721 → **+9700**（合计 **+15700**） |\n| 净盈 | `15700 − 3600 = 12100` |\n| 平摊 | `12100 ÷ 5 = 2420` |\n| 结论 | `20000 + 2420 = 22420` ≈ 22425 |\n\n**板书演算（画面原样）**：\n\n```\n预设 20000 （圈注 20048 为中位数）\n\n17518  −2500\n18891  −1100    ⇒ 亏合计 −3600\n20048    （不动）\n25947  +6000\n29721  +9700    ⇒ 盈合计 +15700\n\n(12100) / 5 = 2420\n20000 + 2420 = 22420 ≈ 22425\n```\n\n**【选项原文】**\n- A.18425 万户\n- B.22425 万户\n- C.25425 万户\n- D.27425 万户\n\n**【答案】** ✅ **B**（板书把 A 打叉，B 高亮）\n\n**【解析】**\n- 真实值：`(17518+18891+20048+25947+29721) ÷ 5 = 112125 ÷ 5 = 22425` → B。\n- 老师提示可直接用选项位置排除：\n\n> 「你也能直接看选项，它肯定在 A 跟 C 中间的。因为 A 一万八比这个还低、两万五都到这儿了，明显不太可能，看选也能看得出来。」\n> 「只要你这个估这个差的多少，差的不要偏差太多，你这个平均数，你再平摊给五个人身上，那个误差就非常小。」\n\n- 陷阱类型：**范围陷阱（柱状图多组数据，题问「固定互联网」不要取到「移动宽带」）**。\n\n---\n\n## 三、减法放缩\n\n> 「刚刚是关于加法的一个讲解，然后我们再看减法的放缩。我们在第二节课上也讲过，就是你一定要公平对待同方向的一个变化，在减法里面才能去抵消掉。」\n\n### 3.1 「同大同小、公平对待」\n\n**板书标题**：减法放缩\n**板书副标题**：同大同小，「公平对待」\n\n**板书公式推导（画面原样）**：\n\n```\nA − B\n= A + △ − (B + △)\n= A + △ − B − △\n```\n\n> 「a 减 b，如果你把这个 a 变化了，变成一个 a 加点了，那你想象这个结果不变，你应该也要剪一个 B 加点。方向相同，你才能让他们的误差抵消掉，才能等于 a 减 b。所以要同方向的变化。」\n\n**板书演算（画面原样）**：\n\n```\n1433 − 884 ≈ 1400 − 850 = 550          （A 减 33，B 也减 34）\n1495 − 1099 ≈ 1500 − 1100 = 400        （A 加 5，B 也加 1）\n```\n\n| 原式 | 调整 | 结果 |\n|---|---|---|\n| `1433 − 884` | 1433 ↓33 → 1400；884 ↓34 → 850 | `1400 − 850 = 550` |\n| `1495 − 1099` | 1495 ↑5 → 1500；1099 ↑1 → 1100 | `1500 − 1100 = 400` |\n\n> 「那我可能觉得这个三十三太碍事了，我就想按 1400 来算，我是不是让它变小了 30 多？那后面那个也变小 30 多，减个 850，等于这个现在是 550。」\n> 「或者你可以写成 1450−900，就是我觉得后面这个 884 很靠近 900，变成一个整数 900，那我前面这个也要变大一点……变成 1450。」\n> 「不用把它加的特别紧啊，你不要说后面加 16，前面我也加 16，我非要写个 1449 也没必要，除非选项差距特别近。」\n\n### 3.2 例题 5｜2022 年下半年全国居民人均经营净收入\n\n**【题干原文】**\n> 2022 年下半年全国居民人均经营净收入比上半年：\n> A.高 128 元　B.高 493 元　C.低 128 元　D.低 493 元\n\n**【材料数据】**（表：2022 年全国居民人均可支配收入情况表（单位：元））\n\n| 项目 | 第一季度 | 上半年 | 前三季度 | 全年 |\n|---|---|---|---|---|\n| 居民人均可支配收入 | 10345 | 18463 | 27650 | 36883 |\n| 其中工资性收入 | 5871 | 10576 | 15678 | 20590 |\n| 经营净收入 | 1733 | **2841** | 4352 | **6175** |\n| 财产净收入 | 920 | 1665 | 2463 | 3227 |\n| 转移净收入 | 1822 | 3382 | 5157 | 6892 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求「下半年 − 上半年」，但材料给的是**累计值** |\n| 概念关键 | 表头四个时间点（1、2、3、4 列）**都是累计值**（板书在表头上方标 1 2 3 4，并圈写「累计」）；下半年 = 全年 − 上半年 |\n| 定位数据 | 经营净收入：上半年 **2841**，全年 **6175** |\n| 列式（法一） | `(6175 − 2841) − 2841` |\n| 速算（法一） | `6175 − 2841 ≈ 6200 − 2800 = 3300`，再 `3300 − 2841 ≈ 3300 − 2800 = 500 ≈ 493` |\n| 列式（法二，更省事） | `6175 − 2841 − 2841 = 6175 − 5682`（即「减两个上半年」） |\n| 速算（法二） | `6175 − 5682 = 493` |\n| 判向 | 6175 > 2 × 2841（5682）⟹ 下半年**高于**上半年 → 排除 C、D |\n| 结论 | 高 493 元 |\n\n**板书演算（画面原样）**：\n\n```\n法一：\n6175 − 2841 ≈ 6200 − 2800 = 3300\n3300 − 2841 ≈ 493\n\n法二（减两个上半年）：\n6175 − 2841 − 2841 = 6175 − 5682 = 493\n```\n\n> 「这四个时间里面，哪一个包含了下半年呢？全年呗，全年包含的下半年，不属于下半年的就是上半年，踢掉，所以把这 6100 里面的 2800 去掉，就是下半年。6175 减去 2841。」\n> 「还可以有一种思路……它既然你需要拿全年减掉上半年才能得到下半年，然后你还要再减一个上半年，那我们干脆减两个上半年不就好了，6175 减掉 5682。接下来那这不就是 B 吗？」\n> 「这个量是非常一一对应的，是没有任何误差的。它的选项也是没有任何四舍五入的。」\n\n**【选项原文】**\n- A.高 128 元\n- B.高 493 元\n- C.低 128 元\n- D.低 493 元\n\n**【答案】** ✅ **B**（板书左侧写 B；A、C、D 均打叉）\n\n**【解析】**\n- 真实值：`6175 − 2841 − 2841 = 493` → B。\n- 选项设置本身就是提示：A/C 为「128」，B/D 为「493」，只需判**方向**（高还是低）+ 判**量级**（400 级还是 100 级），有两重保险。\n- 陷阱类型：**概念陷阱（累计值 → 当期值要作差）+ 时间陷阱（下半年 ≠ 四季度）**。\n\n> 「所以选 B，多了大概五百不到，多了个四百九左右。」\n\n### 3.3 尾数法（含负值尾数的处理）\n\n**板书标题**：尾数法\n\n**板书演算（画面原样）**：\n\n```\n6175 − 5682 = 493   （圈注）\n\n尾数推演：\n6175          4\n2841     →    1\n              3\n\n−493\n+500\n=  7\n```\n\n> 「就在一些加减问题里面，如果选项它是没有任何的估，没有任何的四舍五入，没有任何的估算，就是保留到了一个个位数这种情况，你要看他的尾数。」\n> 「你也不需要拿 6175 去减 2841 嘛，减下来是不是 4？然后再按这个 4 又要去减一个 2841，对不对？减下来是不是 3？所以肯定是 3 结尾。所以选 B。」\n\n**要点**：\n\n| 步骤 | 操作 | 结果 |\n|---|---|---|\n| ① | 5 − 1 = 4（6175 减 2841 的尾数） | 尾数 **4** |\n| ② | 4 − 1 = 3（再减一次 2841 的尾数） | 尾数 **3** |\n| ③ | 选项中尾数为 3 的有 B（高 493）与 D（低 493） | 需再判方向 |\n\n**负值尾数的处理（重点）**：\n\n> 「那可能有同学问老师，那不能是这个 D 吗？一方面，你可以说这个六千一百七十五肯定是比两倍的这个两千八要大的，肯定是多，不可能是低。然后另外就是这种低 493 啊，负 493，它不是一种那种 4-1 的关系，它是一-4 的关系……其实就相当于是一个七的那种关系。因为它加五百是多少？加五百百分之七？」\n> 「所以如果你比如说是一个 18 减 3、18 减 17，它才能是负什么什么 3。」\n> 「如果你遇到这种负值的时候，一定要记得把它调换过来，它是你的负 493，其实相当于正数的什么什么七。因为尾数上应该是一个八减一或者是九减二，这个关系，对它要倒过来的。」\n\n```\n−493 的「尾数」→ +500 − 493 = 7（即补成 10，10 − 3 = 7）\n所以真答案若为负值，尾数应为 7，而不是 3；\n本题尾数是 3 → 只能是「高 493」→ 选 B，不会被 D 干扰。\n```\n\n**尾数法适用条件**：\n\n```\n① 纯加减运算（无乘除、无估算）\n② 选项没有任何四舍五入，保留到个位\n③ 只需在个别题目上使用（「个别时候还是蛮好用的」）\n```\n\n### 3.4 例题 6｜2022 年四个季度人均工资性收入最高者\n\n**【题干原文】**\n> 2022 年四个季度中，全国居民人均工资性收入最高的是？\n> A.第一季度　B.第二季度　C.第三季度　D.第四季度\n\n**【材料数据】**（同 3.2 表格，取「其中工资性收入」行）\n\n| 累计口径 | 第一季度 | 上半年 | 前三季度 | 全年 |\n|---|---|---|---|---|\n| 工资性收入（元） | 5871 | 10576 | 15678 | 20590 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 累计值 → 单季值，比较大小 |\n| 关键认知 | 第一季度本身就是单季值；第二/三/四季度要**逐期作差** |\n| 第一季度 | **5871** |\n| 第二季度 | `10576 − 5871 ≈ 10500 − 58 = 47 百 = 4700` |\n| 第三季度 | `15678 − 10576 ≈ 15600 − 10500 = 5100` |\n| 第四季度 | `20590 − 15678 ≈ 20500 − 15600 = 4900` |\n| 结论 | 5871 > 5100 > 4900 > 4700 → 第一季度最高 |\n\n**板书演算（画面原样）**：\n\n```\n10500 − 58   →  4700\n15600 − 10500 → 5100\n20500 − 15600 → 4900\n\n第一季 5871 ；第二季 4700 ；第三季 5100 ；第四季 4900\n```\n\n> 「做差的时候，你可以把这 76 跟这个 71 都丢掉，变成 10500−58，接下来就是 4700。」\n> 「后面讲的说这 70，我也不要了，15600 减去 10500，接下来就是 5100。」\n> 「第四季度 90 和 78 我都不要了，20500 减去 15600，最后等于 4900。」\n\n**【选项原文】**\n- A.第一季度\n- B.第二季度\n- C.第三季度\n- D.第四季度\n\n**【答案】** ✅ **A**（板书画圈标 A；A 下写 5871，B 下写 4700）\n\n**【解析】**\n- 真实单季值：第一季度 5871；第二季度 10576−5871 = **4705**；第三季度 15678−10576 = **5102**；第四季度 20590−15678 = **4912** → A。\n- 陷阱类型：**概念陷阱（累计值必须逐期作差）+ 时间陷阱（不能直接比累计数大小）**。\n\n> 「四个季度里面人均工资性收入最高的是第一季度，就是直接给你的。」（第一季度就是单季值）\n\n**减法放缩一句话总结**：\n\n> 「加法减法，你就是注意同方向变化，两个数相减，一个变大另外一个跟着变大，一个变小另外一个跟着变小，就能用整数去减了。」\n\n---\n\n## 四、除法放缩（本讲重点）\n\n> 「除法放缩应该算是我们在资料分析里面放缩法应用的最多的、应用的频率最高的一个运算方式。因为你不管是什么算增速，还是算基期，算平均值，甚至你后面去算什么平均数增长率，那些东西都是涉及到除法的。你这块很重要，这块认真听。」\n> 「加法减法放缩其实也就是一些小儿科嘛，过家家吧。」\n\n> （画面先出现章节分隔页：**「02 除法放缩」**，随后进入原理页。）\n\n### 4.1 原理：分子分母等比例变化，结果不变\n\n**板书原样**：\n\n```\n分式的分子分母等比例变化（放大/缩小）不影响计算结果\n\nA     A×(1+r)     A+A×r     A+△₁\n—  ≈  ————————  =  ——————  =  ——————\nB     B×(1+r)     B+B×r     B+△₂\n\n△₁     A\n——  =  ——\n△₂     B\n```\n\n**板书推导过程（画面原样）**：\n\n```\n 7×1.1     7.7\n———————  = ———  = 0.7\n10×1.1     11\n\n7 + 0.7     7.7\n————————  = ———  = 0.7\n10 + 1       11\n\n 7     0.7        7.7     7.7−0.7      7\n——  =  ———   ；  ———  = ————————  =  ———\n10      1          11       11−1       10\n\n       0.7     7\n       ———  = ——\n        1      10\n```\n\n> 「你把一个除法一个分式，它的分子和分母只要你是等比例变化，不管你是放大还是缩小，等比例变化，它是不影响这个计算结果的。」\n> 「然后就类似于我比如说本来是个七除以十，我现在让他们同时乘以一个 1.1，变成 11 分之 7.7，结果是不是还是 0.7 啊？对啊，这个就通分嘛，对结果没有影响吧。」\n> 「这就好像十分之七，你给它的分母加了个一，那你就要给它的分子增加一个对应的零点七。你要让这个零点七除以这个一，和原来的七除以十基本上相等就行，对不对？也是 0.7。」\n> 「减也是一样嘛，如果你本来是十一分之七点七，我觉得除十一太烦了，我把 11 减了个 1，那么上面就要减一个零点七，也要对应减，这种关系，就变成十分之七。」\n\n**两种理解角度（老师给出）**：\n\n| 角度 | 说明 | 例子 |\n|---|---|---|\n| ① 纵向看倍数 | 先看分子是分母的多少倍 | 7 大约是 10 的 0.7 倍 → 分母 +1，分子就加 `1 × 0.7 = 0.7` |\n| ② 横向看占比 | 看分母的变化量占原分母的百分之几 | 加的 1 占 10 的 1/10 → 分子也加 `7 × 1/10 = 0.7` |\n\n> 「其实也就是我们刚刚第二节课说的，也就是分子分母误差比例相等。我让分母增加了百分之十，会导致结果偏小百分之十吧，我就让分子也变到百分之十来弥补误差，让这个误差抵消掉，这样结果就不会发生变化了。」\n\n### 4.2 操作模式一：减少分母位数（截位 / 凑百化分）\n\n**板书标题**：除法放缩 —— 操作模式——减少分母位数\n\n**板书原样**：\n\n```\n操作模式——减少分母位数\n\n①截位，如：1.91→2.00；1.78→1.8；1.18→1.2……\n②凑百化分。如：1.23→1.25；1.39→1.43；1.13→1.11……\n```\n\n> 「在具体操作的时候，核心一个原理就是你要去减少一个分母的位数。」\n> 「因为我们做除法的时候，其实我们往往不是去烦那些分子位数太多，我们烦的是分母。就比如说 112 除以 4 你会觉得烦吗？不会吧。如果是 4 除以 712，你会觉得烦吗？会吧。所以其实最大的问题是分母的位数太多了，所以一般我们是要赶紧去把分母凑整。」\n> 「我们要调整的是分母，重点是分母，分子只是为了去配合它。」\n\n**两条通道对比**：\n\n| 通道 | 操作 | 例子 | 目标 |\n|---|---|---|---|\n| ① 截位 | 直接把分母写成更好算的整数/一位小数 | 1.91→2.00；1.78→1.8；1.18→1.2 | 位数减少 |\n| ② 凑百化分 | 把分母凑到「特殊分数」的数值上 | 1.23→1.25；1.39→1.43；1.13→1.11 | 变成 `1/n` 的数值，除法变乘法 |\n\n> 「这时候不一定要四舍五入，你觉得哪个好算就算，二好算一点，比一点九好算，我就把它凑到二。」\n\n**凑百化分后除法变乘法（板书原样）**：\n\n```\n a        a          a\n———  →  ————  =  —————  =  a × 8\n1.23     1.25      1/8\n                   0.125\n\n b        b\n———  →  ————  =  b × 7\n1.39     1.43\n\n b        b\n———  →  ————  =  b × 9\n1.13     1.11\n```\n\n> 「这些数它特别特殊，它是一些整数的倒数。1.25，它是八分之一。所以如果你有个数除以 1.23，你就把它想成了除以 1.25，其实就相当于是除了个八分之一（除 1/8 等于乘以 8）。」\n> 「1.25 其实就是 0.125，其实就是 1/8。我们不要看位数，你只要去记住这些固定的数字关系。1.25 也好，12.5 也好，125 也好，你不管除哪个，都是乘以 8。」\n> 「那 143 呢？143 它是七分之一；1.11 是九分之一。所以如果你能把一些数从 1.39 变成了 1.43，就等于 b 乘以 7；如果能把一个数从除以 1.13 变成了除以 1.11，就等于 b 乘以 9。」\n> 「如果你后续还有加减运算，你这个算出来的结果，你要注意一下它的位数，把它凑到一个正确的量级上去。」\n\n### 4.3 常用 1/n 表与三大「百化分」通道\n\n**板书「常用 1/n 表」（画面原样，逐格抄录）**：\n\n| 分母值 | 对应 1/n | 分母值 | 对应 1/n |\n|---|---|---|---|\n| 333 | 1/3 | 111 | 1/9 |\n| 25 | 1/4 | 9 | 1/11 |\n| 2 | 1/5 | aaa | a/9 |\n| 167 | 1/6 | 667 | 2/3 |\n| 143 | 1/7 | 366 | 11/3 |\n| 125 | 1/8 | 286 | 2/7 |\n\n**「凑百化分」提示表（板书在表外用红笔标注）**：\n\n| 分母上出现 | 反应到 | 凑成 | 依据 |\n|---|---|---|---|\n| 247 | 1/4 | **250** | 25 ↔ 1/4 |\n| 317 | 1/3 | **333** | 333 ↔ 1/3 |\n| 357 | 11/3 | **366** | 366 ↔ 11/3 |\n| 118 | 1/8 | **125** | 125 ↔ 1/8 |\n\n> 「比如说你分母上是个什么 247，你就要反应的过来，它跟你这个四分之一是比较对应的，赶紧给它凑到 250。他要是个 317，你可以给他扣到 333。他要是个 357，就可以给他凑到 366；他要是个 118，你可以给他凑到 125。」\n\n**只背到 1/11 为止（老师的强烈建议）**：\n\n> 「我们常见的百化分有什么呢？一般用的比较多的呢，就是三分之一、四分之一、五分之一、六分之一、七分之一、八分之一、九分之一、十一分之一。」\n> 「有没有同学好奇怎么没有十分之一？十分之一是什么？十分之一是零点一，你都除一了，你要去想要除十分之一，那不扯了吗？所以没有十分之一。」\n> 「为什么没有了？我只建议大家记这么多，用这么多，再多的不要了。你不要去跟我背什么十八分之一等于什么什么……等于什么五点五五。好，然后就说我除了个什么除五五等于乘十八，我不建议。」\n\n**板书红笔标注（画面原样）**：\n\n```\n   ×18         1\n   ——>       ——— = 5.55\n   5.6?        18\n\n①位数多  ②压力大  ③（被圈注的「5.6」遮挡）\n```\n\n老师给出的三条理由：\n\n| 理由 | 说明 |\n|---|---|\n| ① 位数多 | 「本身就没有那么好算」 |\n| ② 压力大 | 「你要背的太多了」 |\n| ③ 小数字易带误差 | 「比如说这个数小的时候，你反而容易有误差。比如说有些同学他会把除 5.6，也看作是除什么十八分之一，但是 5.6 跟 5.55 它其实之间的差距是有百分之一的，你还会存在一个误差，你自己有时候注意不到」 |\n\n> 「所以我不是很建议大家在一些特别小的那种增长去背个什么十八分之一、十七分之一、什么十五分之一的，没必要，真没必要。没有用，那种比较小的一个百分比，我是有专门的办法去帮你们去算那些东西的，不需要用这个东西，我们后面会学『化除为乘』。所以百化分这种多少分之一，你就背到这里就够了。」\n\n**「a/444」「b/9」两个特殊技巧（板书原样）**：\n\n```\n a       a\n———  =  ———  =  a/4 × 9        （444 = 4 × 111）\n444     4×111\n\n b             248\n——— ≈ b × 11  ；——— = 248 × 11 = 2480 + 248 = 2728\n 9              9\n\n248\n——— = 248 × 9 = 2480 − 248 = 2232\n111\n```\n\n> 「比如说一个数除 44，你可以把它看作 9 分之 4……因为可以先把 a 除以 4，再除以 9。除 9 是有一个特殊技巧的，除 9 其实就相当于乘以 11，对不对？乘以 11，你就可以去错位相加了。」\n> 「除九的倍数，你也可以先把这个倍数除掉，再去除以九。比如说这个 a 除以 36，怎么办？我不一定要把它凑成 366。如果它正好 36，我就看到我先除了个 4，再除个 9。除 4 之后，我再错位相加，不就可以了吗？4 分之 a 加上 4 分之 a 乘以 0.1。」\n> 「除以五等于乘以二，除以二也等于乘以五，不过没有人用除以二就等于乘以五，除以二就很简单了，就是本身把它掰一半。」\n\n### 4.4 操作模式二：补偿误差（分子法 / 结果法）\n\n**板书标题**：除法放缩 —— 操作模式——补偿误差（波浪下划线）\n\n**板书原样**：\n\n```\n操作模式——补偿误差\n\n①分子近似等比例变化\n\nA     A×(1+r)     A+A×r\n—  ≈  ————————  =  ——————\nB     B×(1+r)     B+B×r\n\n②结果近似等比例调整\n\nA         A\n—  ≈  ————————— × (1 + r)\nB      B×(1+r)\n```\n\n| 方案 | 做法 | 优点 | 适用 |\n|---|---|---|---|\n| ① 分子补偿 | 分母动多少比例，分子跟着动多少比例 | 一次到位，误差最小 | 分子本来就不整（需要截位）时 |\n| ② 结果补偿 | 分子**不动**，先算出结果，再按分母的变动比例回调结果 | 保留整数、计算难度小、更快接近选项 | **分子本身就比较整**时 |\n\n**① 分子补偿 —— 板书演算（画面原样）**：\n\n```\n 645     645+15    660\n———  =  ——————  = ———  = 66 / 12.5 = 66 × 8 = 528  → 5.28\n 122     122+3     125\n 5×↑                            真实值 5.286\n```\n\n竖式：\n\n```\n 660        66\n———  →   ———     66 × 8 = 528  →  5.28\n125       12.5\n\n 66\n  8\n———\n528\n```\n\n> 「我们第一步做法，我们是应该把这个分母去凑整，或者凑成百化分，对不对？是不是我们把它先加个 3？因为它离 125 这个百化分是比较近的。那这边加了个三呢，我想让这个结果没有发生太大的变化，我上面这个六四五是不是也应该加？除法放缩，你要分子分母等比例同方向变化。」\n> 「把它往上加多少？这边两种方法，一种方法是你先大概估一下，645 是 122 的多少倍？5 倍多吧……我加 15 变成 660。」\n> 「你这边是 5 倍多呀，你不加少了吗？刚就有同学说你应该加 16，应该加 17。应不应该加 16？应不应该加 17？哎，不应该。因为你加了之后，你这个分子就不整了。」\n> 「所以分子调整这一步一定不要太准确，好算一点就够了。为什么不要怕他不准呢？因为你的分母本身就动的很小。你从 122 变成 125，你总共也就增加了 2%~3% 不到。你就算分子上不加，你这个结果也只是偏差了百分之三不到，何况你还加了。」\n> 「不差那么点。没有必要为了那么百分之零点几、百分之一的误差，需要你的计算多那么一步，多那么一个位数，没有任何意义。你大概凑个整就好了。」\n\n**横向看占比的思路（老师另一种解释）**：\n\n> 「还有一种思路，就是我刚刚说的横过来看。我把它分母是不是变成了一二五加了个三，三大概是多少？是不是百分之三不到、百分之二点几？122 的 1% 是 1.2，这边是不是百分之三不到，六百多的百分之三是多少？十八左右吧。我还是写 66，我就算加 18 是 663，我也不写什么 663，我就写 66，还是一样的结果。」\n\n```\n分母 122 → 125 ： +3，占 122 的 ≈ 2.5%（不到 3%）\n分子 645 → +15 或 +18 都行，反正凑成 660（整）\n「大家加的这个百分之多少，我不一定要跟你的百分比完全一样，差不多就可以了。」\n```\n\n**② 结果补偿 —— 板书演算（画面原样）**：\n\n```\n 650     +3%   650\n———  ——————>  ———  = 65 × 8 = 520  →  5.2\n122     +3%    125\n                 = 5.2\n        +3%（即 +0.14）\n        = 5.35            真实值 5.33\n```\n\n> 「什么时候在结果上做调整呢？你的分子如果本身就比较整了，你还去动它，何必呢？」\n> 「我直接把分母写成 125，上面我不动了，我不想动它了。我动他干嘛呀？人家已经这么整了，你要再去加个 15，把它变成 660，一般两位变三位，那不是让自己计算更难的吗？」\n> 「那有同学说，那这个误差怎么办呢？那你在最后结果上再调呗，65 乘以 8 得 520，算下来 5.2。我刚刚分母是不是加了快 3%？我分子是不是本来也应该加百分之三不到的？我现在没有加，怎么办？我在结果上加，加个 0.15，5.35，这样子就也够准了。你不信，你算一下，按计算器等于 5.33。」\n\n**结果法的两个优点（板书红笔标注）**：\n\n```\n①整数  ②接近选项\n```\n\n> 「第一保留了整数，计算难度不会大；第二可以更快的接近选项。以更快的接近选项之后，你可能说这个百分之三，你又不用加了，因为 A 选项是 5，B 选项是 5.3，C 选项是 5.8，D 选项是 6.1，你算出来 5.2，你知道你还要再把它扩大那么两三个点，你还要算吗？你不用算，选个 B 不就走了吗？」\n\n**移动幅度上限（本讲最重要的纪律之一）**：\n\n```\n放缩法（除法、乘法）分母/分子移动范围：不要超过 10%\n```\n\n**板书原样（两条对照）**：\n\n```\n 176\n———  ≈ ≤10%    ✓（凑成 180，动得很小）\n180\n\n122  →  100\n     −22\n     −20%      ✗（动得太多）\n```\n\n> 「带来这些东西的前提就是你的分母不要动太多，你不要说哦，我看到个 122，我就偏要想把它分母直接凑什么 100，我给它下面减个 22，这就是不行、这就不好。因为这样你下面动的太多了，你直接动了将近百分之二十，那你分子上你就控的很准，不然的话你误差很大，你离得远误差大。」\n> 「我建议大家做放缩法的时候，不管是除法放缩还是乘法放缩，这个移动的范围不要超过 10%。你动 10% 以内，我保你基本上不怎么错。」\n> 「你常规的一些数，它的周围不用走很远，总能找到一些能让你减少计算的东西。哪怕就是比如什么 176，你说它附近感觉没有什么合适的，你哪怕凑成个 180，你出两位数，你就那么难除吗？」\n\n**放缩法 vs 截位直除（老师的定性判断）**：\n\n> 「这种等比例放缩的放缩法，除了放缩，其实我认为它是截位直除的完全的上位法。什么叫上位法？就是他拥有截位直除的优点，它的位数也可以很少；它有一些截位直除没有的优点，我可以人为的去控制好这个误差，我还能去凑一下百化分，你截位直除能凑百化分吗？所以这是个完全上位的方法。」\n\n### 4.5 计算小技巧（错位相加 / 错位相减及其误差）\n\n**板书标题**：除法放缩 —— 计算小技巧\n\n**板书原样（五条）**：\n\n```\n计算小技巧\n\nA\n——— ≈ A×9  = 10×A − A           （错位相减）\n11\n\n A\n———— ≈ A×9÷n = (10×A − A) ÷ n   （分母为 11 的倍数，如 22、33、44……）\n11n\n\nA\n—— ≈ A×11 = 10×A + A           （错位相加）\n9\n\n A\n———— ≈ A×11÷n = (10×A + A) ÷ n  （分母为 9 的倍数，如 18、27、36……）\n9×n\n\nA\n—— = A×2\n5\n```\n\n**① 错位相减（÷11）的误差来源 —— 板书推导（画面原样）**：\n\n```\n A × 9     9A      9A\n———————— = ———  ≈  ————  = A(10−1)      ← 红笔标 +1%\n 11 × 9     99      100\n\n把分母的 99 看成了 100 → 误差 1%\n\n20\n——— = 20 − 2 = 18  ；真实值 18.18   （结果偏小 1%）\n11\n```\n\n> 「我们先拿第一个式子来看看，a 除以 11，为什么它等于 a 乘以 9 呢？我们把它分子分母都乘以九来看一看，它就等于 99 分之 9a。所以它其实并不是直接等于 9a 的。我们是把分母上的 99 看成了 100，才得到这样的一个错位相减。所以我们把 99 看成 100，就存在了一个百分之一的误差，对不对？」\n> 「那我分子有没有扩大百分之一？是不是没有？那怎么办？我要在结果上扩大百分之一。比如说 20 除以 11，如果用错位相减，是 20 减 2 等于 18，但是这个结果它肯定是偏小的。它的准确值应该是 18.18。」\n\n**② 错位相加（÷9）的误差 —— 板书推导（画面原样）**：\n\n```\n A × 11     11A      11A\n———————— = ————  ≈  ————  = A(10+1)      ← 红笔标 +1%\n  9 × 11      99      100\n\n 20\n——— = 20 + 2 = 22  ；真实值 22.22   （结果偏小 1%）\n  9\n```\n\n> 「同样错位相加也有这样的一个误差，a 除以 9，为什么等于乘以 11 呢？乘 11 挪上去，下面乘 11，它也是 99 分之 a 乘 11。我们也是把它想成了 100 分之 a 乘 11，才有了这个错位（相减）。所以他也一样会有一个百分之一的误差，偏小百分之一。」\n\n> ⚠️ **口诀**：**除以 9 与除以 11 的错位相加/相减，结果都偏小 1%，都要往上扩 1%。**\n\n**③ 误差随「位数」变小 —— 板书（画面原样）**：\n\n```\n A        A×9      A×9\n———  =  —————  ≈  ————          误差 1%\n 11       99       100\n\n  A         A×9      A×9\n—————  =  —————  ≈  ———————     误差 0.1%\n 111        999      1000\n\n   A          A×9      A×9\n——————  =  ——————  ≈  ————————   误差 0.01%\n 1111       9999     10000\n```\n\n> 「但并不是都加百分之一的，什么情况？是这个十一，如果你除的不是十一，除一一一，我能不能用错位相减？也可以用，那它的误差还是百分之一吗？就不是了。你看我把 a 乘以九，分母是不是也乘以九？999，我们把它想成了 1000，它的误差是千分之一；那么如果是除以 1111 来错位相减呢？那他的误差就是从 9999 变成了一万，就是万分之一。」\n> 「所以并不是什么都是加百分之一的。如果你是除以 111，那就只误差百分之零点一；除以 1111 就是误差百分之零点零一。」\n\n| 分母 | 近似过程 | 误差 | 结果修正 |\n|---|---|---|---|\n| 11 | 99 → 100 | **1%** | 结果 ×1.01 |\n| 111 | 999 → 1000 | **0.1%** | 结果 ×1.001 |\n| 1111 | 9999 → 10000 | **0.01%** | 结果 ×1.0001 |\n\n**④ 为什么 ÷99 不能用错位相加（板书原样，打了叉）**：\n\n```\n   A        A×11\n  ———  =  ——————      ✗（画面打了个大叉，并把 99 圈掉）\n   9        99\n\n  A×11\n——————                  ← 板书写出 99×11 = 1089，已不是 99\n 99×11\n```\n\n> 「那如果除的是九十九呢，你还能不能错位相加？不能了。除以 99，这是我们后面讲的『化除为乘』，不可以。为什么这里可以错位相减？是因为他乘了 11，就是 99 分之 a 乘 9……你 99 分之 a，你上面乘 10 一下面乘 11，99 乘 11，它能是 99 吗？这个都到 1000 多了呀，搞不了啊。所以错位相加，只有一个除以 9；错位相减呢，除 11、除 111、除 1111 都可以。」\n\n**⑤ 除以 909 —— 补掉 1% 误差（板书原样）**：\n\n```\n A        A×11      11A\n———  =  ———————  ≈  —————     误差 0.01%\n909       909×11     9999\n\n1\n——— = 0.09090909……\n11\n```\n\n> 「那这个错位相加能不能更准呢？可以的，你可以直接，如果你除的就是九零九，那就没有误差。因为 909，它就是等于 1/11……所以如果是 909，它就非常好了。你上面乘 11，下面乘 11，上面呢是 11a，下面呢它就是 909 乘 11，往下按计算器，就是 9999，是偏差百分之 0.01。所以如果是除以九零九，就基本上是没有误差的。因为相当于他把这个百分之一的误差给你补上了。」\n\n---\n\n### 4.6 例题 7｜2018 年我国软件业务收入比上年增长\n\n> 📌 自本题起，课件页眉依次为「调整分子数值 —— ①纵向比值」（本节例题 7~9）与「调整分子数值 —— ②横向占比」（例题 10），对应 4.4 的两种补偿误差思路。\n\n**【题干原文】**\n> 2018 年我国软件业务收入比上年增长（ ）。\n> A.12.6%　B.14.2%　C.16.2%　D.19.2%\n\n**【材料数据】**（表：2013-2018 年我国软件业部分指标数据）\n\n| 年份 | 业务收入（亿元） | 从业人数（万人） | 出口额（亿美元） | 人均创收（万元） |\n|---|---|---|---|---|\n| 2013 | 30587 | 470 | 469.0 | 65.08 |\n| 2014 | 37026 | 546 | 487.0 | 67.81 |\n| 2015 | 42848 | 574 | 494.9 | 74.65 |\n| 2016 | 48232 | 586 | 499.5 | 82.30 |\n| 2017 | 55200 | 618 | 541.0 | 89.16 |\n| 2018 | 63061 | 643 | 554.5 | 98.07 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求增长率（同比增速） |\n| 定位数据 | 2018 年 63061；2017 年 55200 |\n| ① 错误示范思路 | 直接 `63061 ÷ 55200 − 1`（先算倍数再减 1） |\n| ② 正确思路 | **先减出增长量再除**：`(63061 − 55200) ÷ 55200 = 7861 ÷ 55200` |\n| 截位 | `786 ÷ 552`（各取三位） |\n| 速算（保守派） | `552 + 3 = 555`；`786 + 4 = 790` → `790 / 555` |\n| 化简 | `790 ÷ 5 = 158`，`555 ÷ 5 = 111` → `158 / 111`（除 5 = 乘 2） |\n| 错位相减 | `158 / 111 = 15.8 / 11.1 ≈ 15.8 − 1.58 = 14.22` → **14.2%** |\n| 迅速派 | 分母直接看成 500（−52，≈ −10%），分子减 78 → 708/500 ≈ 14.2%，直接选 B |\n\n**板书演算（画面原样）**：\n\n```\n 63061\n—————— − 1\n 55200\n\n 7861\n——————     （把 7861/55200 看成 786/552，即先减出增长量）\n 55200\n\n 786       790        79        158\n———  →   ————  →   ————  →   ———— = 158/111\n 552       555        55.5      111\n +4        +3        ÷5→×2\n                     ↓\n            79 ÷ 5 = 79 × 2 = 158\n            158 / 111 → 错位相减 → 1580 − 158 = 1422 → 14.22% → 14.2%\n\n另注：63061/55200 ≈ 1.1× ；786/552 ≈ 1.4×\n```\n\n**【选项原文】**\n- A.12.6%\n- B.14.2%\n- C.16.2%\n- D.19.2%\n\n**【答案】** ✅ **B**（板书圈标 B）\n\n**【解析】**\n- 真实值：`7861 ÷ 55200 = 14.24%` → B。\n- **为什么不直接算倍数**——误差量级完全不同：\n\n> 「你不要去算这个倍数，你去算增速，直接算增速。你把增量减出来，减下来是 7861，直接 7861 除以 55200，为什么这样呢？因为这样你的计算对象就小了嘛。你本来你算的是个 1.1 几的数，我现在只算一个 0.1 几的数。如果我这里偏差了 10%，我也只不过只有 0.01 的影响；你这里偏差了 10%，是有 0.1 的影响，所以叫你的误差就会小。」\n\n**板书标注（画面原样）**：\n\n```\n1.1×     0.1\n11       10%    0.01\n0.1×（圈注）\n```\n\n| 列式方式 | 结果量级 | 10% 误差 → 绝对影响 |\n|---|---|---|\n| `63061 ÷ 55200 − 1` | 1.1 几 | 0.1 级 |\n| `7861 ÷ 55200` | 0.1 几 | 0.01 级 |\n\n- **两个原则**（老师反复强调）：\n\n> 「分母调整要小，分子调整要快。」\n> 「为什么上面加个 4？因为本身误差就小了，我象征性的加一个比 3 多一点的，不就够了吗？又加个 79，不就好了吗？你为什么非要把它写成什么 791、792 呢？就影响那么 0.1、0.2 吗？不差那么点。」\n\n- 陷阱类型：**概念陷阱（增长率要「先减再生除」）+ 单位/量级陷阱（百分点 vs 倍数）**。\n\n- 快速通道（胆子大一点的算法）：\n\n> 「那还有胆子大一点的，他怎么做呢？我分母我直接看成 500 行不行？我减 52，减大概 10%，上面会减 10%，减个 78，哎，减 78，86，我就算你 700，不就 14 嘛，B 走了。你说这放缩好不好？放缩是不是比什么截位直除香多了？你可细可粗。想快可以快，想慢也能慢，想准也能准。」\n\n**板书另注（画面原样）**：\n\n```\n79 × 2\n—————— = 158/111\n55 × 2\n\n1580\n 158\n————\n1422  → 14.22%  → 14.2%\n```\n\n### 4.7 例题 8｜2020 年度国内旅游人数同比\n\n**【题干原文】**\n> 2020 年度国内旅游人数 28.79 亿人次，比上年同期减少 30.22 亿人次。\n> 2020 年度国内旅游人数同比约（ ）。\n> A.下降 51.2%　B.下降 48.8%　C.下降 53.8%　D.下降 47.6%\n\n**【材料数据】**\n\n| 项目 | 数值 |\n|---|---|\n| 2020 年度国内旅游人数（现期值） | 28.79 亿人次 |\n| 比上年同期减少（增长量，负） | 30.22 亿人次 |\n| 基期值（推得） | 28.79 + 30.22 = **59.01 亿人次** |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 只给「现期值 + 减少量」，求增长率 |\n| 概念关键 | 减少量是相对于**基期**的，故 `r = 减少量 ÷ 基期值 = 30.22 ÷ 59.01` |\n| 列式 | `r = 30.22 / 59.01` |\n| 简化 | 小数点不管：`30.2 / 59 = 302 / 590` |\n| 凑整 | 分母 59 → 60（+1）；分子 302 约是 59 的 5 倍 → 分子 +5 → **307** |\n| 速算 | `307 ÷ 60 = 5.11…` → **51.2%** |\n| 结果法（另一条路） | 分子取整为 30（不截三位）：`30 / 59 → 30 / 60 = 50%`，因分母只增不到 2% 而分子没跟着增，回落结果 `50% × (1+2%) ≈ 51%` |\n\n**板书演算（画面原样）**：\n\n```\n              30.22\nr = —————————————  = 30.22 / 59.01\n     28.79 + 30.22\n\n 30.2        302  +5       307\n—————  =  ——————————  ≈  —————  → 5.11 → 51.1/51.2%\n  59          59  +1        60\n\n（另一路）\n 30        30\n———  →  ———  = 50%   ；分母 +1 为 59 的不到 2%\n 59        60\n                     结果上调 ≈ +2%  → 51%\n\n59.01 （板书旁注）\n6 ⟌ 307 → 5……7\nA.下降 51.2%   ✔（打钩）\n```\n\n**【选项原文】**\n- A.下降 51.2%\n- B.下降 48.8%\n- C.下降 53.8%\n- D.下降 47.6%\n\n**【答案】** ✅ **A**（板书左侧写 A，A 项打钩）\n\n**【解析】**\n- 真实值：`30.22 ÷ 59.01 = 51.21%` → A。\n- 陷阱类型：**概念陷阱（减少量的分母是基期，不是现期）**。\n- 老师的两条路线都指向 51%：\n\n> 「那这时候算的时候就是我们把它看作这个零一就不要了嘛，把它远了五千九，就是五十九分之三零二，可以吧？……那这时候我们可以放缩，我们可以把五十九放到哪？到了 60，我们给这个五十九里面稍微加了个一，让它变大了一点点。那上面这个 302 呢？302 大概是 59 的几倍？五倍吧，五倍左右吧，是不是就加个 5？变成 307。那 307 除以 60 好算了吧？307 除以 60，5 余 7，5.11 几，所以 51.2。」\n> 「那如果有的同学说老师我是这样子的，我没有截三位，我就留了个 30，因为我觉得后面这零点二也挺小的，30 除以 59 行不行？也可以。在这个时候你给分母上去变成 60 的时候，分子里就先还这样，这是不是就是百分之五十？那个分母增加了一大，大概是 59 的不到 2%，所以你本来应该给分子也扩大不到百分之二的，但你现在没有扩，所以你要后在扩，在后面扩，在结果上扩加百分之二，变成 51，是不是这样也能出来？」\n\n### 4.8 例题 9｜2017 年全国互联网企业电子商务平台收入\n\n**【题干原文】**\n> 2018 年全国互联网企业业务收入 9562 亿元，比上年增长 21.0%。其中，电子商务平台收入 3667 亿元，增长 13.1%；网络游戏业务收入 1948 亿元，增长 17.8%。\n> 2017 年全国互联网企业电子商务平台收入为：\n> A.2938 亿元　B.3012 亿元　C.3076 亿元　D.3242 亿元\n\n**【材料数据】**\n\n| 项目 | 2018 年数值 | 同比增长 |\n|---|---|---|\n| 全国互联网企业业务收入 | 9562 亿元 | 21.0% |\n| 其中：电子商务平台收入 | **3667 亿元** | **13.1%** |\n| 网络游戏业务收入 | 1948 亿元 | 17.8% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求基期值 |\n| 定位数据 | 电子商务平台收入 3667 亿元，增长 13.1% → 分母 1+13.1% = 1.131 |\n| 列式 | `基期 = 3667 / 1.131 = 3667 / 1131` |\n| 凑整 | 分母 1131 → 1111（−20，约 −1.8%），分子同方向减 67 → 3600 |\n| 速算 | `3600 / 1111` → 错位相减 `3600 − 360 = 3240` |\n| 误差 | 分母是 1111（4 位 1），误差仅 0.01%~0.1% 级，**不必再补** |\n| 结论 | ≈ 3240 → D.3242 亿元 |\n\n**板书演算（画面原样）**：\n\n```\n 3667     3667 − 67     3600\n—————  =  —————————  =  —————  → 3600 − 360 = 3240\n 1131      1131 − 20     1111\n   −20         −67\n   （画面把 −67 圈注）\n\nD.3242亿元  ✔（打钩）\n```\n\n> 「等你习惯了之后，这个地方的位数，你就不用去管什么小数点，1 加 13.1 就是 1131，不用写什么小数点，浪费时间。」\n> 「我们是不是第一步要先调什么？先调分母，因为分母是最难缠的那个东西，是我们最需要解决的东西。把它变成什么？1131 附近是 1/9 比较近，所以减了个二十吧。」\n> 「那上面是三倍对不对，减多少？减 67。后面减的是 67，为什么非得是 67？不能是 66，不能是什么 65，不能是 69？因为我只是想把它写成 3600，所以至于它到底是 60 几，我不关心。其实写这个减 37 也是写给你们看的，我做的时候，我才不管什么 67 呢，就写个 3600−60 多。」\n> 「这基本上没有任何误差的，你说要不要再给他加百分之一了呀？这段就不用加 1% 了吧？因为你除的不是 11，你除的是 111，误差只有 0.01%，就是万分之一的误差，就是这么点的误差。」\n\n**老师针对「移动幅度」的补充问答**：\n\n> 「有同学问的是个问题，老师，你不是说不能调整超过 10% 吗？甚至有 10% 吗？这不才 2% 吗？你想百分数，你就把那个数从那边往前挪百分点。它的 1/10 是 11，我 20 才是 11 的两倍，除 2% 不到。」\n\n**【选项原文】**\n- A.2938 亿元\n- B.3012 亿元\n- C.3076 亿元\n- D.3242 亿元\n\n**【答案】** ✅ **D**（板书左侧写 D，D 项打钩）\n\n**【解析】**\n- 真实值：`3667 ÷ 1.131 = 3242.3` 亿元 → D。\n- 陷阱类型：**时间陷阱（问的是 2017 年基期，材料给 2018 年现期）**。\n- 本题是「分母凑百化分 + 错位相减」的教科书式演示：分母 1131 → 1111，误差只有万分之一级别。\n\n### 4.9 例题 10｜食品烟酒和居住占居民人均消费支出的百分比\n\n**【题干原文】**\n> 2017 年全国居民人均可支配收入 25974 元，比上年增长 9.0%，2017 年全国居民人均消费支出 18323 元，比上年增长 7.1%。\n> 食品烟酒和居住分别占居民人均消费支出的百分比为？\n> A.29.3%　22.4%　B.28.6%　23.2%　C.31.2%　22.4%　D.29.3%　21.5%\n\n**【材料数据】**（饼图：2017 年全国居民人均消费支出及其构成，单位：元）\n\n| 支出类别 | 金额（元） |\n|---|---|\n| **食品烟酒** | **5374** |\n| 衣着 | 1238 |\n| **居住** | **4107** |\n| 其他用品和服务 | 447 |\n| 医疗保健 | 1451 |\n| 教育文化娱乐 | 2086 |\n| 交通通信 | 2499 |\n| 生活用品及服务 | 1121 |\n| 合计（人均消费支出） | **18323** |\n\n**【解题拆解 · 食品烟酒】**\n\n| 环节 | 内容 |\n|---|---|\n| 列式 | `5374 / 18323` |\n| 截位 | 各取三位：`537 / 183`（板书记误差 0.1%~1%） |\n| 路线 A（保守） | 分母 183 → 180（−3），分子 537 → 530（−7）→ `530/180` |\n| 继续化简 | `530/180 = 53/18`；18 是 9 的倍数 → 先 ÷2：`26.5`，再 ÷9 → 错位相加 `26.5 + 2.65 = 29.15 ≈ 29.1%` |\n| 误差修正 | 错位相加偏小 1% → `29.1 × 1.01 ≈ 29.3%` |\n| 路线 B（激进） | 分母 183 → 200（+17，约 +10% 不到），分子 537 → 590（+53）→ `590/200 = 29.5%` |\n\n**板书演算（画面原样）**：\n\n```\n 5374           180\n——————      ————\n 18323\n  0.1%~1%      （标注的截位误差区间）\n\n 537     −7     530        26.5              530\n———  ————→  ————  =  265/9 → 26.5 → ———（先除2）\n 183     −3     180          2.6              2\n                            ———  = 26.5\n                             29.1\n                             （错位相加 26.5 + 2.65）\n\n+1%  →  29.3\n\n激进路线：\n 537 + 53     590\n————————  =  ———  = 29.5%\n 183 + 17     200\n```\n\n**【解题拆解 · 居住】**\n\n| 环节 | 内容 |\n|---|---|\n| 列式 | `4107 / 18323` |\n| 截位 | `411 / 183` |\n| 凑整 | 分母 183 → 200（+17），分子 411 → 450（+39，凑整） |\n| 速算 | `450 / 200 = 2.25` → 22.5% |\n| 判选 | 选项里第二项只有 22.4%（A/C）、23.2%（B）、21.5%（D）→ 最接近 **22.4%** |\n\n**板书演算（画面原样）**：\n\n```\n 4107        411 + 40      450\n——————  ≈  ————————  =  ———  = 2.25\n 18323       183 + 17      200\n\n食品烟酒 5374（圈注）   居住 4107（圈注）\nA.29.3% 22.4%  ✔（打钩）\nB.28.6% 23.2%  ✘\nC.31.2% 22.4%  ✘\nD.29.3% 21.5%  ✘\n```\n\n> 「好，那我们可以先把这个 B、C 排除了吧，然后主要就看后面这两个是 22.4 还是 2.5（22.5），再算一个。」\n\n**【选项原文】**\n- A.29.3%　22.4%\n- B.28.6%　23.2%\n- C.31.2%　22.4%\n- D.29.3%　21.5%\n\n**【答案】** ✅ **A**\n\n**【解析】**\n- 真实值：`5374/18323 = 29.33%` ≈ **29.3%**；`4107/18323 = 22.41%` ≈ **22.4%** → A。\n- 关于「第一步截位的误差要不要再调」——老师的回答是**不要**：\n\n> 「有人问，这个第一步截位的误差要不要调整？我把这个 5374 变成了 537，要不要调整？不要，我都保留三位了。刚刚我们是不是说过，三结成三位，你的误差只有 0.1% 到 1% 之间。5300 多，你少了个 4，就是 0.1% 的误差。你这个东西太小了，何况你下面你还做了，也有一点的调整。你截位那肯定是上下都截，上下都变小，所以这个误差是非常非常小的。」\n> 「对，平时做这种除法题，你截三位保准没问题。」\n\n- 陷阱类型：**概念陷阱（占比的分母是「人均消费支出」18323，不是「人均可支配收入」25974）**。\n\n### 4.10 快速练习（10 道除法放缩练习 + 整百版复练）\n\n**练习页板书（画面原样）**：\n\n```\n 35139        70415\n——————       ——————\n  112         1425\n\n 4438         7441\n——————       ——————\n   87          455\n\n 25070        52183\n——————       ——————\n 1271         1337\n\n 22429        27982\n——————       ——————\n  118         1495\n\n 4852         2487\n——————       ——————\n 2183         6531\n```\n\n老师口播：「后面这边你有空你自己，你们自己练练，我就不在这边再讲了。」\n\n**老师演示过的题目及板书（逐条抄录）**：\n\n**① 35139 ÷ 112**（板书原样）\n\n```\n35139       351 − 3     348\n——————  =  ———————  =  —————  →  348 − 34 = 314\n  112       112 − 1     111\n\n（竖式：348 / 34 → 314 ；旁注「好算」）\n```\n\n> 「分母往哪边变？这个简单吗？对，幺幺（111）。分子呢，你不要管这三十九。下面减了个一，上面那三倍多，写个三。」\n> 「38 你减一也有点不太合适……虽然说错了整，你不能跟下面剪的一样嘛，我感觉这样就有点不尊重人家，而且本身你除 111 错位相减也挺简单的。就减个一，有点太不尊重这个方式了。」\n> 「有没有同学注意一个问题？我在减这个三错位相减的时候，我怎么就写了个三四，我没有写个三四八呢？一方面是这样好算；一方面是因为你除十一、除九这种情况相对更多一点，你这样算出来结果本身就是偏小百分之一的。虽然这个地方不是，这只是为你养成一个习惯，本身就偏小，那我少减一点，我减个零点八，我不要了，我不减了。」\n\n**② 4438 ÷ 87**（板书原样）\n\n```\n4438       443 + 17     460\n——————  =  —————————  =  ———  →  460 / 9 = 460 + 46 = 506\n  87        87 + 3       90\n                             真实值 511（偏差约 1%）\n（旁注：460 / 46）\n```\n\n> 「这个 443 大概是 87 的 5 倍，加 15，那就干脆 460 除以 9，错位相加，那就是 506。这个时候，它还偏小 1%，它的准确值就是 511。下面更准。」\n> 「就在除十一、除一百一十一那种错位相减的时候，那个小数点可以不要；这个错位相加的时候，就要看情况了，因为它本身就在往上加的。」\n> 「分子为什么不取四（440 的 44）？可以，你取 44，没问题啊，43 的更准一点……」\n\n**③ 25070 ÷ 1271**（板书原样）\n\n```\n 2507         2465        25          2500\n——————  ≈   ——————  ≈  ————  →  —————  = 2  →  200\n 1271         1250        125         1250\n  −21         −42                       −2%\n  （约 −2%）  （约 −2%）                ⇒ 结果再 −2% → 196\n```\n\n> 「接着这（25070/1271）就是往 1250 上去走对吧？1271 附近的比较靠近百化分嘛，1250 给他减了个 21。那分子上这个零我们先不管了，上面大概两倍，减个 42，就变成 2465。」\n> 「然后你分母上减了大概百分之二的（结果偏大了），接下来就是一九六。」\n\n**④ 22429 ÷ 118**（板书原样）\n\n```\n22429       224 − 14     210\n——————  =  —————————  =  ———  →  2100 − 210 = 1890  →  189\n  118       118 − 7      111\n               −14  −7\n```\n\n> 「分母上变一（111），能明白吧？减七，上面呢，你先不管这个二十九。上面大概两倍吧，减 14，210，减 11、减 11，等于错位相减，这样子接下来 189。」\n\n**⑤ 4852 ÷ 2183**（板书原样）\n\n```\n4852        4850        490        245\n——————  ≈  —————  ≈  —————  =  —————  →  2450 − 245 = 2205  →  2.21\n 2183        2180        222        111\n（画面显示为「4850/2180 → 490/222 → 245/111」，转写此处口述「想成二二二……分母上加个 4」）\n```\n\n**⑥ 70415 ÷ 1425**（板书原样）\n\n```\n70415        7041 + 29     7070        707\n——————  ≈  ——————————  =  —————  =  ——— × 7 = 707 × 7 = 4949  → 4.95\n 1425        1425 + 5      1430        143\n                +25\n```\n\n> 「我不要了，把下面这个当做 1430，加五；上面这个大概是五倍左右，加 25，变成 706 几，那就算 7070 吧。7070 除以 1430 等于乘以 7。707 乘个 7，4949（画面写作 4 9 4 9），算下来是 4.95。」\n\n**⑦ 7441 ÷ 455**（板书原样，老师给了三条路）\n\n```\n路线1： 7441      744 − 14     730       182\n       —————  =  —————————  =  ————  →  ——— → 182 − 18 = 164\n        455       455 − 11     444       111\n                    −14  −11\n\n路线2： 736 / 450   （分子 −8 凑整）\n       736 ÷ 5 = 736 × 2 = 1472  ÷9  → 1472 + 147 = 1619  →  1.62\n\n路线3： 455 → 500（+10%），744 → 818（+10%）\n       818 / 500  →  818 × 2 = 1636  →  1.636\n```\n\n> 「这个四五五，你们会往哪调呢？455 对 44（444）。四百五也可以，也没问题。但我更可能说我会去想写成四十四，因为除以四我感觉好理解一点。」\n> 「或者说，我也可以把分母去凑成四百五。下面减五，上面吧一倍多，我减个几，减个大概八左右吧，变成七三六。736 除以 45，相当于是下面这个 5 乘以 9，先除 5，再除 9，除以 5 等于乘以 2，上面就变成 1472 除以 9，等于错位相加，再加个 147，1619。这也有了。」\n> 「1.64 跟 1.61 还是有一点点误差，主要还是减八呀，或者说减十四，我们为了好算，有的时候不会把它算那么细，它必然会存在一点点的误差，但这种误差都一般都是在我们的可控范围内的。」\n> 「也可以把它写成凑成五百……凑 500 就加了个 45，基本上就 10%，那我可以给 744 也加个 10%，加个 74，就会变成 818。818 除以 500，除以 5 等于乘以 2，818 乘以 2 等于 1636。基本还是一样的，差不多的。照控在这个 10% 的位置上也好算。」\n\n**⑧ 52183 ÷ 1337**（板书原样）\n\n```\n路线1： 52183       522 + 38     560\n       ——————  =  —————————  =  ———  = 3.916  →  39.2\n        1337       134 + 9      143\n                    +9（≈1/7）\n\n路线2（用百化分 4/3）：      4\n                      1337 ≈ ———\n                              3\n\n                        522        3\n                       ————  = 522 × ———  = 522 − 522/4 = 522 − 130 = 392  →  39.2\n                        4/3         4\n```\n\n> 「幺三三七呢？一种你可以把它写成 134/522（画面写作 522/134）……可以给他加个 9，变成 143。上面大概是在 4 倍左右，加 38。……就等于 392。」\n> 「或者这个 1337 其实它也是个百化分，只是这个百化分我觉得没有那么好用，所以我其实用的也很少。1337 它也等于三分之四，它就相当于是 522 除了个 3/4，就等于 522 乘了个 3/4，等于 522 减了个 522 除以 4，就等于 522 减 130 左右，就等于 392。」\n\n> ⚠️ **截位方向的提醒**：\n\n> 「结位最好四舍五入一下吧，稍微四舍五入一下，不过你要注意方向。要注意方向的，比如说你 525 除以幺幺幺（画面为「526/114」），你说你结尾给我那个什么 526 除以 114，虽然你确实四舍五入了，但是你要记得，就是你分子变大了、分母变小了，但它的误差它是没有抵消的，你整体还是会变大一点点的。你到最后算出来，你不要因为说哎什么这个选项算出来的两个选项中间，你忘了说到底是变大还是变小了。要记得你这样算出来结果是偏大的，你算出来结果你就要往下偏小一点的去选。」\n\n> 📌 板书另有一处旁注，写作 `5253/1144 ≈ 5260/1144`（画面显示为「5253/1144」与「5260/1144」，两个分数并列）。（该旁注与相邻题目数字对不上，转写亦未提及，**含义不明、存疑**，此处如实记录画面。）\n\n**⑨ 27982 ÷ 1495**（板书原样）\n```\n27982        2798 + 128     2670        267\n——————  ≈  ————————————  =  ————  =  ——— × 7 = 1869  →  18.69\n 1495         1495 + 65      1430        143\n                 −128  −65\n```\n\n> 「后面我要说快一点，就是 1495，就把它写成 1430（下面减 65）；上面呢大概他的两倍不到，减 130 不到，我减个 128，就会变成 2670，然后 267 乘以 7 就出来了。」\n\n**⑩ 2487 ÷ 6531**（板书原样）\n\n```\n2487        249 + 5      254        254 + 127\n——————  ≈  ————————  =  ———  →  ————————————  = 381\n 6531        653 + 13     666          （÷2/3 = ×3/2 = 加一半）\n              +5   +13\n```\n\n> 「6531 呢，可以把它写成先写个 653，先结个位……那 653 就变成 666，下面加 13。上面大概他的一半不到，那我加个五或者加个六都行。254 除以 666，就是除以 2/3，等于乘以 3/2，等于直接加一半。所以，如果你遇到 666，你可能说就不用去写这些过程，什么 2/3、3/2，就是加一半，变成 254 加 127，变成 381。」\n\n**整百/整千版复练页（板书原样）**：\n\n```\n 35100        70400\n——————       ——————\n  112         1425\n\n 4400         7400\n——————       ——————\n   87          455\n\n 25000        52200\n——————       ——————\n 1271         1337\n\n 22400        28000\n——————       ——————\n  118         1495\n\n 4800         2500\n——————       ——————\n 2183         6531\n```\n\n**新增演示：分子较整时不要动分子（板书原样）**\n\n```\n35100       351\n——————  →  ———  →  351 − 35 = 316\n  112        111\n                      分母 112 变小了 1%，分子没跟着变\n                      ⇒ 结果要 +1%  →  316 × 1.01 ≈ 313\n\n（板书旁注：351 − 35 = 316 ；→ 313 ；并标 −1%）\n```\n\n> 「后面这边我又加了一页，这一页就是想说明什么呢？想说明如果你这个分子比较整，你就不要先去调这个分子了。你把这个分母凑个幺幺（111），你就还是 351，先保留个整数，那 351 除 111 就是错位相减，减三十五嘛，减三十五是 316，对不对？然后你就记得你这时候分母变小了百分之一，本来你分子应该也要变小了，你没变。最后结果让它变准确就是 313。」\n> 「那真的很快的，如果你这个分子本身就比较整，你不想动这个分子，你先算出来再去调，非常快。」\n\n---\n\n### 4.11 例题 11｜2022 年全国每万人拥有的体育场地数量\n\n**【题干原文】**\n> 2022 年全国每万人拥有的体育场地数量约为：\n> A.26.2 个　B.29.9 个　C.34.7 个　D.39.4 个\n\n**【材料数据】**（柱线组合图：2018～2022 年全国体育场地数量及面积）\n\n| 年份 | 全国体育场地数量（万个） | 全国体育场地面积（亿平方米） | 人均体育场地面积（平方米） |\n|---|---|---|---|\n| 2018 年 | 316.20 | 25.94 | 1.86 |\n| 2019 年 | 354.44 | 29.17 | 2.08 |\n| 2020 年 | 371.34 | 30.99 | 2.20 |\n| 2021 年 | 397.14 | 34.11 | 2.41 |\n| 2022 年 | **422.68** | **37.02** | **2.62** |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求「每万人拥有的场地数量」，但材料**没有直接给人数** |\n| 关键推导 | 人数 = 场地总面积 ÷ 人均面积 = `37.02 ÷ 2.62` |\n| 速算 | 分子分母同乘 10（补个零，让倍数关系更明显）：`370 / 262`；分母 262 → 250（−12，凑 1/4）；分子 370 → 350（−20，≈1.5 倍关系） |\n| 得人数 | `350 / 250 = 1.4` → `350 / 25 = 14` → **14 亿人** |\n| 第二步 | `422.68 ÷ 14 ≈ 30`（板书写作 `422/14 = 3`，即 30 个/万人） |\n| 结论 | ≈ 29.9 个 → B |\n\n**板书演算（画面原样）**：\n\n```\n   37.02 补零        −20\n  ————————  ≈  ————  =  ————  = 1.4  →  350/25 = 14（亿人）\n   2.62          262     250\n                   −12\n\n 422.68\n————————  ≈ 422 / 14 = 3   →  29.9\n   14\n（旁注 1412）\n```\n\n> 「每万人拥有的场地数量，那我先要知道这个体育场地数量是多少……22 年是 422.68 万个。然后还要算什么人数，到底多少万人呢？人数就要拿人均来算了，这是人均面积，所以拿总面积除以人均才能得到人数，也就要拿这个 37.02 除以这个平均值 2.62，才能得到人数。」\n> 「这时候可以选择给分母补一个零。为什么补一个零呢？因为这样子你分子跟分母的一个倍数关系就相对来说更明显一点点。」\n> 「现在我算每万人的这个场地数量，就在总的数量 422 除以十四，那地方你就不要再说什么放缩了，没必要了，你不要为了放缩而放松。」\n\n**【选项原文】**\n- A.26.2 个\n- B.29.9 个\n- C.34.7 个\n- D.39.4 个\n\n**【答案】** ✅ **B**（板书画圈标 B）\n\n**【解析】**\n- 真实值：`37.02 ÷ 2.62 = 14.13`（亿人）= 141300 万人；`422.68 万个 ÷ 141300 万人 × 10000 = 29.9` 个/万人 → B。\n- **不必放缩的时刻**（本题最大收获）：\n\n> 「你本身的 42 就是 14 的 3 倍，你还出啥呀？42 不就是 14 的 3 倍吗？出来就是 3 啊，那不就是 B 吗？29.9。本身就是个明显的倍数关系了，你还出（放缩）这个干嘛呢？」\n> 「然后这个题目我说了还有一个技巧是什么呢？就这十四，你甚至也不用算。为什么呢？你全国人数，你不知道吗？我们这几年人数有增长吗？基本上已经停滞了吧。不就是十四亿吗？所以这个题目其实拿到手就应该是每万人的场地数量，场地数量在这儿，人数没有就算了，出十四吧，哦三十。哎，不就走了吗？有的时候你做资料分析的时候，还是可以借助一点点常识的。」\n\n> 「涉及到全国人数的时候……有时候我经常这样子的，有时候在那些综合题里面，它涉及到一些全国人数的，它里算的抢时间，就直接把它当十四去除了算了。你这几年这个人口它就是那么多啊，你什么十三点九、十四点一、十四点二跟十四有什么区别呢？误差很小的。」\n\n- 陷阱类型：**概念陷阱（人均面积 → 推人数）+ 单位陷阱（万个 vs 万人）**。\n\n### 4.12 例题 12｜G 省平均每件法律援助案件帮助受援群众\n\n**【题干原文】**\n> 2022 年，G 省法律援助机构共组织办理法律援助案件（以下简称 G 省法律援助案件）195779 件，较 2021 年减少 40937 件，同比下降 17.29%。其中刑事案件 133059 件（含值班律师法律帮助案件 65647 件），民事案件 61754 件，行政案件 516 件。帮助受援群众 212993 人。\n> 2022 年，G 省平均每件法律援助案件帮助受援群众（ ）。\n> A.小于 1.1 人\n> B.在 1.1 到 1.2 人之间\n> C.在 1.2 到 1.3 人之间\n> D.大于 1.3 人\n\n**【材料数据】**\n\n| 项目 | 2022 年 | 备注 |\n|---|---|---|\n| 法律援助案件总数 | **195779 件** | 同比减少 40937 件，下降 17.29% |\n| 其中：刑事案件 | 133059 件 | 含值班律师法律帮助案件 65647 件 |\n| 民事案件 | 61754 件 | — |\n| 行政案件 | 516 件 | — |\n| **帮助受援群众** | **212993 人** | — |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 平均数（总量 ÷ 份数） |\n| 列式 | `212993 / 195779` |\n| 截位 | `213 / 196`（分子分母都四舍五入，都往上走一点） |\n| 速算 | 分母 196 + 4 = 200；分子 213 + 5 = 218 → `218 / 200 = 1.09` |\n| 结论 | 1.09 \u003c 1.1 → A |\n| 验证法（代入） | `196 × 1.1 = 196 + 19.6 = 215.6 > 213` → 未到 1.1 → A |\n| 拆分法 | `213/196 = (196+17)/196 = 1 + 17/196`，`17/196 \u003c 0.1` → A |\n\n**板书演算（画面原样）**：\n\n```\n 213       213 + 5      218\n——————  =  ————————  =  ————  =  1.09\n 196       196 + 4      200\n  +5          +4\n\n验证：196 × 1.1 = 196 + 19.6 = 215.6  >  213  ⇒ 未到 1.1\n拆分：213/196 = 1 + 17/196  \u003c 1.1\n\nA.小于 1.1 人  ✔\n```\n\n> 「213 取三位，除 196 没问题吧？这个就是两个都四舍五入都捂住了，往上涨一点。这个好算吗？这个太好算了呀。下面加 4，上面加 5，因为我要把它凑 200；上面后面加 5，因为 213 比 196 大一点点，那我就加个 5，1.09 人小于 1.1。」\n> 「或者这个地方你也可以去带入验证。因为这个 213 除以 196，其实还是比较明显，应该要么就是 A，要么就是 B 了，不可能在 1.2 以上的。那我现在只需要判断它到底有没有到一点一。那 196 乘以 1.1，我看乘 1.1 应该是多少？乘 1.1 等于错位相加，应该是 215.6，而我现在只有 213，它是没有到 215 的，所以你算下来应该是没有到 1.1 的，所以选 A。」\n\n**【选项原文】**\n- A.小于 1.1 人\n- B.在 1.1 到 1.2 人之间\n- C.在 1.2 到 1.3 人之间\n- D.大于 1.3 人\n\n**【答案】** ✅ **A**（板书左侧写 A，A 项打钩；B、C、D 打叉）\n\n**【解析】**\n- 真实值：`212993 ÷ 195779 = 1.088` → 小于 1.1 → A。\n- **放缩 vs 拆分（计算的地位）**：\n\n> 「但怎么说呢？就是有些时候还是第一节课说的那个东西，计算它是最末位的东西，真的不重要。你这个东西，你用拆分，你这个题目可能说二十秒做完的，你花了十五秒找数据，五秒算这个东西。那我用放缩，我也一样是十五秒找数据，但这个东西你说你放缩练熟了之后，真的花你时间吗？一脑袋里面，把 196 先想成个 200，上面稍微多一点，210 除 210 几，其实也用不了多久。」\n> 「放缩它的优点是通用。你这个拆分这个题目好用，但其他题目不一定好用啊。你拆出来个 17 除 196，万一还要再算怎么办？不还是要用到放缩吗？拆分肯定也是有它的一定优势的，但是有的时候它不一定有那么有用。放缩是一个更通用——你只要涉及到除法，你都可以用它。」\n> 「什么对话时间？读题理解题目、找数据对话时间。或者说一些你没有办法跳过的简单计算最花时间。所以一般来说我什么题目跟你们的差距是最小的，就是这种求和的题。他就非要你把十年的和给他加起来，那我也没办法，我也得一个个加，没有什么技巧性的东西。」\n\n- 板书批注（画面原样）：`计算`、`未`、`通用`（说明「拆分法只是算得快，放缩才是通用」）。\n\n### 4.13 例题 13｜2017 年我国软件和信息技术服务业从业人员\n\n**【题干原文】**\n> 2017 年，我国软件和信息技术服务业从业人员人数约为多少万人？\n> A.701　B.652　C.633　D.618\n\n**【材料数据】**\n\n图 1：2013-2018 年我国软件和信息技术服务业完成业务收入（亿元）\n\n| 年份 | 2013 | 2014 | 2015 | 2016 | 2017 | 2018 |\n|---|---|---|---|---|---|---|\n| 业务收入 | 30587 | 37026 | 42848 | 48232 | **55103** | 63061 |\n\n图 2：2013-2018 年我国软件和信息技术服务业人均创收额（万元）及同比增速\n\n| 年份 | 2013 | 2014 | 2015 | 2016 | 2017 | 2018 |\n|---|---|---|---|---|---|---|\n| 人均创收额（万元） | 65.05 | 67.84 | 74.61 | 82.34 | **89.22** | 98.07 |\n| 同比增速（折线，画面标注） | 9.80% | （画面显示为 5.30% 量级，字迹较小、不清） | 10% | 10.40% | 8.40% | 9.90% |\n\n> （画面显示为：图 2 折线上标注 9.80%、2014 年标注 5.30%（前有负号疑为字迹）、2015 年 10%、2016 年 10.40%、2017 年 8.40%、2018 年 9.90%；此列数据本讲未使用，字迹不清处存疑）\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 人数 = 总业务收入 ÷ 人均创收额 |\n| 列式 | `55103 ÷ 89.22` → 截位 `551 / 89.2` |\n| 凑整 | 分母 89.2 → 9（×10 后即 89.2 ≈ 90，先凑 9）；分子 +5 → 556 |\n| 速算 | `556 / 9` 错位相加 `= 556 + 55.6 = 611.6 ≈ 612` |\n| 误差修正 | 除以 9（错位相加）结果偏小 1%；`612 × 1% ≈ 6` → **618** |\n| 结论 | 618 → D |\n\n**板书演算（画面原样）**：\n\n```\n 551       +5      556\n——————  ————>  —————  = 556 / 9 → 556 + 55.6 = 611.6 ≈ 612\n89.2      +8      90\n                    +6\n                    = 618\n（板书右侧：556 / 56 → 612 → +6 → 618）\n```\n\n> 「那数据在哪呢？先找一下一七年的时候，这一千（55）是什么东西，是完成了业务收入……后面还有个人均创收额，就是这些业务收入平摊到每个人上有多少，那就是人均值 89.22，总和是 55100。那我要算人数，人数就等于总收入除以人均收入，所以人数就等于 551 除以 892。」\n> 「那 892 往哪去呢？你就不要去搜 88 了，因为他离 9 已经很近了。9 是个非常好的东西，下面加 8。上面呢一半多一点，加个五，加个六都行，加个五吧，变成 556。除以 9，就不要再写了，除以 9 就是直接错位相加，加 556 加 56，就会变成 612。」\n> 「选 D 呗。因为你错位相加，结果会偏小 1%。他哪怕这边答案再来个 e，什么 611，你也应该知道要选 618。」\n\n**【选项原文】**\n- A.701\n- B.652\n- C.633\n- D.618\n\n**【答案】** ✅ **D**（板书左侧写 D，D 项打钩）\n\n**【解析】**\n- 真实值：`55103 ÷ 89.22 = 617.6` ≈ **618** 万人 → D。\n- ⚠️ 本题是**「错位相加必补 1%」**的典型应用：不补 1% 会得到 612，容易被误选（选项里没有 612，但若遇上 611/612 类选项极易掉坑）。\n- 陷阱类型：**数据源陷阱（图 1 与图 2 两组数据要对上「人均创收」这层关系）+ 误差不补陷阱**。\n\n### 4.14 例题 14｜2024 年第一季度全国烤烟出口均价\n\n**【题干原文】**\n> 2024 年第一季度全国烤烟出口均价大约是：\n> A.不到 4 千美元/吨\n> B.4~4.5 千美元/吨\n> C.4.5~5 千美元/吨\n> D.超过 5 千美元/吨\n\n**【材料数据】**\n\n图 1：2024 年 1-11 月全国烤烟当期出口额情况（千美元）\n\n| 月份 | 1 月 | 2 月 | 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 出口额 | 34127 | 24912 | 19140 | 31735 | 34535 | 35852 | 41893 | 42525 | 49293 | （画面不清） | 40402 |\n| 同比增速 | 32.5 | −16.3 | −38.6 | 34.7 | −2.3 | −25.5 | −24 | −9.0 | 13.4 | 87.1 | 69.0 |\n\n图 2：2024 年 1-11 月全国烤烟当期出口量情况（吨）\n\n| 月份 | 1 月 | 2 月 | 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 出口量 | 8385 | 6012 | 4876 | 7092 | 7450 | 7703 | 6642 | 9077 | 8851 | 10101 | 8444 |\n| 同比增速 | 5.5 | −21.9 | −40.2 | 5.8 | −14.0 | −36.0 | −33.6 | −5.5 | −26.2 | 41.0 | 34.2 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 均价 = 出口额 ÷ 出口量；只要**第一季度**（1+2+3 月） |\n| 第一季度出口额（加法放缩） | `34127 + 24912 + 19140 ≈ 35 + 25 + 19 = 79` |\n| 第一季度出口量（加法放缩） | `8385 + 6012 + 4876 ≈ 8000 + 6000 + 5000 = 19000 → 19` |\n| 列式 | `79 / 19` |\n| 速算 | 分母 19 → 20（+1）；分子约 4 倍 → +4 → 83；`83 / 20 = 4.15` |\n| 结论 | 4.15 千美元/吨 → 落在 4~4.5 → **B** |\n\n**板书演算（画面原样）**：\n\n```\n一、加法放缩（有借有还）\n出口额：  35 + 25 + 19 = 79                      ← 板书记「35+25+19 / 79」\n出口量：  8000 + 5000 + 6000 = 19000             ← 板书旁注 19000\n\n二、除法放缩\n 79        +4      83\n———  ————>  ————  = 4.15\n 19        +1      20\n\nB.4~4.5千美元/吨  ✔（画圈）\n```\n\n> 「一季度（出口）额，要把这三个加起来，那加的时候就要稍微用一下加法的放缩。7791234 这三个数的相加，你会怎么处理呢？有借有还，你想位数少一点，你要去借……他就直接 35+25+19。」\n> 「然后还算什么出口量吧，依旧的出口量一二三加起来。这三个数咋处理呢？把这个 300 多借给这个 876，凑一下，虽然多了一点点，但窝头也多那么一点点，不要了。就比如那 8000+5000+6000，19000。所以它的平均值是 79 除以 19，那 79 除以 19 好除吧？下面加 1，上面大概是几倍？4 倍左右吧，加 4，83 除 20 等于 4.15，四到四点五没问题吧？」\n> 「放缩嘛，就这么简单。其实真的很简单，练熟了之后，你做出你就永远不用担心说这个除法好难算、好麻烦、这个数字不好算，你可以把它变成任意你想要算的好算的数。」\n\n**【选项原文】**\n- A.不到 4 千美元/吨\n- B.4~4.5 千美元/吨\n- C.4.5~5 千美元/吨\n- D.超过 5 千美元/吨\n\n**【答案】** ✅ **B**\n\n**【解析】**\n- 真实值：`(34127+24912+19140) ÷ (8385+6012+4876) = 78179 ÷ 19273 = 4.056` 千美元/吨 → B。\n- 陷阱类型：**范围陷阱（平均值落到区间，不必算出精确值）+ 单位陷阱（额是\"千美元\"，量是\"吨\"，均价单位是\"千美元/吨\"）**。\n\n### 4.15 例题 15｜Q 省客运平均运送距离（量级陷阱）\n\n**【题干原文】**\n> Q 省 2018 年旅客周转量 1768.2 亿人公里，增长 12.8%。其中，铁路周转量 865.6 亿人公里，增长 28.0%；公路周转量 767.3 亿人公里，下降 1.2%；民航周转量 132.3 亿人公里，增长 18.0%。\n> 2018 年，Q 省客运平均运送距离约为（ ）。\n> A.107 公里　B.1007 公里　C.1170 公里　D.117 公里\n\n**【材料数据】**\n\n表：2018 年 Q 省各种运输方式完成客货运输量及其增长速度\n\n| 指标 | 计量单位 | 绝对数 | 比上年增长（%） |\n|---|---|---|---|\n| 货运量 | 万吨 | 215124.2 | 5.7 |\n| 其中：铁路 | 万吨 | 4183.2 | −6.9 |\n| 公路 | 万吨 | 184830.9 | 7.1 |\n| 水运 | 万吨 | 25109.2 | −2.2 |\n| 民航 | 万吨 | 6.1 | −2.7 |\n| 管道 | 万吨 | 994.8 | 21.9 |\n| **客运量** | **万人** | **151080.5** | **−7.0** |\n| 其中：铁路 | 万人 | 10390.2 | 9.4 |\n| 公路 | 万人 | 138221.0 | −8.2 |\n| 水运 | 万人 | 1533.9 | 5.9 |\n| 民航 | 万人 | 935.4 | 7.5 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 平均运送距离 = 旅客周转量 ÷ 客运量 |\n| **公式识记（老师专门推导）** | 「平均运送距离」单位是公里，「周转量」单位是人公里，「客运量」单位是人 → `人公里 ÷ 人 = 公里`，所以要用
