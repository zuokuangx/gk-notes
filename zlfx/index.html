三，**如果式子里已经有比较整的数，整数就先保留下来，最后算完了再去调。**\"\n\n---\n\n> **本集全部 25 道作业题讲解完毕，一题不落。**\n","outline":[{"level":2,"text":"本集方法论总览","id":"本集方法论总览"},{"level":2,"text":"例题精讲","id":"例题精讲"},{"level":3,"text":"第 1 题｜乘法放缩 · 561.4×45.8%","id":"第-1-题乘法放缩-5614458"},{"level":3,"text":"第 2 题｜除法放缩 · 6279÷853","id":"第-2-题除法放缩-6279853"},{"level":3,"text":"第 3 题｜除法放缩 + 量级陷阱 · 16.0万亿÷5055.9万","id":"第-3-题除法放缩-量级陷阱-160万亿50559万"},{"level":3,"text":"第 4 题｜除法放缩（分子分母同步减）· 133.7÷1463","id":"第-4-题除法放缩分子分母同步减-13371463"},{"level":3,"text":"第 5 题｜除法放缩（倍数关系凑整）· 3083÷240.2","id":"第-5-题除法放缩倍数关系凑整-30832402"},{"level":3,"text":"第 6 题｜除法放缩（凑 1/6）· 91.9÷1.616","id":"第-6-题除法放缩凑-16-9191616"},{"level":3,"text":"第 7 题｜除法放缩（凑 800 / 750）· 23931÷0.7662","id":"第-7-题除法放缩凑-800-750-2393107662"},{"level":3,"text":"第 8 题｜除法放缩（分母即百化分）· 80976÷12551","id":"第-8-题除法放缩分母即百化分-8097612551"},{"level":3,"text":"第 9 题｜除法放缩（分母凑 200）· 565÷1893","id":"第-9-题除法放缩分母凑-200-5651893"},{"level":3,"text":"第 10 题｜除法放缩（错位相除）· 7775÷1096","id":"第-10-题除法放缩错位相除-77751096"},{"level":3,"text":"第 11 题｜除法放缩（减法凑整 + 错位相减）· 86.63÷225.61","id":"第-11-题除法放缩减法凑整-错位相减-866322561"},{"level":3,"text":"第 12 题｜除法放缩（凑 100）· 2427÷0.99","id":"第-12-题除法放缩凑-100-2427099"},{"level":3,"text":"第 13 题｜乘法放缩（调小乘数）· 2686.4×85.2%","id":"第-13-题乘法放缩调小乘数-26864852"},{"level":3,"text":"第 14 题｜除法放缩（多解法）· 10572.2÷37683.5","id":"第-14-题除法放缩多解法-105722376835"},{"level":3,"text":"第 15 题｜除法放缩（分母凑 1250）· 27007.4÷1.225","id":"第-15-题除法放缩分母凑-1250-2700741225"},{"level":3,"text":"第 16 题｜加法估算 · 2013-2022 年进出口总额合计","id":"第-16-题加法估算-2013-2022-年进出口总额合计"},{"level":3,"text":"第 17 题｜平均数（盈亏相抵）· 平均每季度良好或稳定占比","id":"第-17-题平均数盈亏相抵-平均每季度良好或稳定占比"},{"level":3,"text":"第 18 题｜直接加（分组估算）· S省\"四上\"企业负债","id":"第-18-题直接加分组估算-s省四上企业负债"},{"level":3,"text":"第 19 题｜平均数（盈亏相抵）· 铁矿石月均产量","id":"第-19-题平均数盈亏相抵-铁矿石月均产量"},{"level":3,"text":"第 20 题｜均值 vs 中位数（盈亏判断）· 人均可支配收入","id":"第-20-题均值-vs-中位数盈亏判断-人均可支配收入"},{"level":3,"text":"第 21 题｜环比增量（先算当月均值）· 一带一路新签合同额","id":"第-21-题环比增量先算当月均值-一带一路新签合同额"},{"level":3,"text":"第 22 题｜倍数（先定位年份）· 跨境电商进 量 vs 基期：为什么低增速一律算增量](#三增量-vs-基期为什么低增速一律算增量)\r\n- [四、提前修正（一）：多位数凑整](#四提前修正一多位数凑整)\r\n  - [4.1 原理：把「结果上修正」提前到「过程中修正」](#41-原理把结果上修正提前到过程中修正)\r\n  - [4.2 方向铁律（板书原文）](#42-方向铁律板书原文)\r\n  - [4.3 ⛔ 反面典型：本末倒置](#43--反面典型本末倒置)\r\n  - [第 10~19 题：提前修正例题精讲](#第-10-题2017-全国学前教育在园幼儿提前修正版)\r\n- [五、份数思想（百化分）](#五份数思想百化分)\r\n  - [5.1 公式推导：为什么除以 (n+1)](#51-公式推导为什么除以-n1)\r\n  - [5.2 各种增速情形（板书逐步演算）](#52-各种增速情形板书逐步演算)\r\n  - [5.3 常用 1/n 表（板书原表，标题「常用 1/n 表」）](#53-常用-1n-表板书原表标题常用-1n-表)\r\n  - [5.4 该背什么、不该背什么（老师原话）](#54-该背什么不该背什么老师原话)\r\n  - [5.5 常用百化分速查（板书补充的口诀，老师口述）](#55-常用百化分速查板书补充的口诀老师口述)\r\n- [六、份数思想例题精讲（第 20~22 题）](#六份数思想例题精讲)\r\n  - [6.1 份数思想的修正（两套办法 + 公式证明）](#61-份数思想的修正两套办法--公式证明)\r\n  - [6.2 第二种修正思路（用基期补增速差）](#62-第二种修正思路用基期补增速差)\r\n  - [6.3 负增速的份数思想修正（老师现场举例）](#63-负增速的份数思想修正老师现场举例)\r\n- [七、结尾提炼](#七结尾提炼)\r\n  - [7.1 本讲知识点总表](#71-本讲知识点总表)\r\n  - [7.2 速算口诀与解题流程](#72-速算口诀与解题流程)\r\n  - [7.3 易错点与陷阱清单](#73-易错点与陷阱清单)\r\n  - [7.4 老师金句](#74-老师金句)\r\n\r\n**本集例题速览（共 22 组）**\r\n\r\n| 题号 | 材料主题 | 关键数字 | 答案 |\r\n| --- | --- | --- | --- |\r\n| 1 | 2020 全国粮食总产量 | 66949 万吨，+0.9% | C.597 万吨 |\r\n| 2 | 玉米产量减产 | 25733，−0.7% | C |\r\n| 3 | 江苏国资委营业收入 | 2091，4% | B（≈80） |\r\n| 4 | 4600.1 × 4.2%（口述练手，同第 7 题） | 4600.1 万人，4.2% | B.185 |\r\n| 5 | 2018 玉米产量减产 | 25733 万吨，−0.7% | C.181 万吨 |\r\n| 6 | 2023 上半年江苏国资委营业收入 | 2091 亿元，4% | B.80 亿元 |\r\n| 7 | 2017 全国学前教育在园幼儿 | 4600.1 万人，4.2% | B.185 |\r\n| 8 | 2014 全国旅客运输（求 2013 公路） | 190.5 亿人次，2.8% | C.185.31 |\r\n| 9 | 2019 V 市交通运输仓储邮政增加值 | 398 亿元，4.4% | C.16.8 |\r\n| 10 | 4600.1 提前修正版 | — | B |\r\n| 11 | 2091 提前修正版 | — | B |\r\n| 12 | 2018 年 1—8 月谷物进口量 | 1643.5 万吨，−8.5% | A.152.7 |\r\n| 13 | 2019 前三季度某省规上工业企业利润 | 965.9 亿元，−7.4% | C.1043.1 |\r\n| 14 | 练手题 21754×2.04% / 2116×5.1% | — | 434 / ≈102 |\r\n| 15 | 「增速提前修正举例」表 | — | 参考表 |\r\n| 16 | 2021 全国城市供水管道长度 | 105.99 万公里，5.26% | B.5.3 万公里 |\r\n| 17 | 2018 全国第三产业增加值 | 46.96 万亿元，7.6% | D.3.3 万亿元 |\r\n| 18 | 2024 年 1~2 月 C 市餐饮收入 | 443.7 / 164.7 亿元 | C.22.7 |\r\n| 19 | 「化除为乘 · 练习」七连练 | — | C/B/B/B/A/B/C |\r\n| 20 | 2017 全国科技经费投入总量 | 17606.1 亿元，12.3% | D.1928 |\r\n| 21 | 2017 某市服务业小微增值税 | 2.3 亿元，11.6% | C.0.24 |\r\n| 22 | 2023 二季度末跨省联网药店 | 27.9 万家，12.8% | A.3.2 万家 |\r\n\r\n---\r\n\r\n## 一、化除为乘（小增速的增量估算）\r\n\r\n> 老师开场：\r\n> 「我们第一个讲的方法叫**化除为乘**，它是针对一种**小增速的增量**的估算。」\r\n> 「第二种方法叫**份数思想**，或者叫**分数法**，是针对一些**特殊增速**，就在**百化分附近**那种增速的一个增量的估算。」\r\n\r\n### 1.1 公式推导：为什么要「化除为乘」\r\n\r\n**思路起点**：\r\n\r\n```\r\n增量 = 基期 × 增速\r\n而 基期 = 现期 ÷ (1 + 增速)\r\n所以 增量 = 现期 × 增速 ÷ (1 + 增速)\r\n```\r\n\r\n> 「大家这样子的话，我们计算起来感觉很麻烦，我们要算一个乘法，再算一个除法。那咋办呢？」\r\n\r\n**关键一步：分子分母同乘 (1 − r)**（板书原文）\r\n\r\n```\r\n增量 = 基期 × r\r\n     = 现期 × r ÷ (1 + r)\r\n     = 现期 × r × (1 − r) ÷ [ (1 + r) × (1 − r) ]\r\n     = 现期 × r × (1 − r) ÷ (1 − r²)\r\n     ≈ 现期 × r × (1 − r)\r\n     = 现期 × r − 现期 × r × r\r\n```\r\n\r\n> 「我们给他上下同乘一个 (1 − r)。上下一乘之后，我们就会发现分母上是一个 (1 + r)(1 − r)，就能把它转化成一个 `1 − r²`。」\r\n> 「那这个有什么用呢？还是很麻烦，那下面是一个 r 的平方。」\r\n> 「我们再想想，我们平常经常做题的时候遇到的那个增速，他往往是不是都不太大？什么百分之七啊、百分之四啊、百分之十二啊、百分之二十一啊，这种增速随处可见吧。一般他让你算增量的题，其实很少有那种增速特别大的情况的。」\r\n\r\n**为什么 r² 可以不要**（板书演算）\r\n\r\n```\r\nr = 4% 时：\r\n1 − r² = 1 − (4%)²\r\n       = 1 − 0.04 × 0.04\r\n       = 1 − 0.0016\r\n       = 0.9984\r\n```\r\n\r\n> 「如果是百分之四，那一减百分之四的平方是多少？就是 1 减去 0.04 乘 0.04，就是 0.0016，然后就 0.9984。」\r\n> 「你说你分母上除一个 0.9984 跟除个 1 区别大吗？差多少啊？我们昨天讲过了吧，你把分母从 9984 变成 10000，就差个 16，才**千分之一多一点**吧？这种千分级的影响重要吗？**不重要**，所以可以把这部分消掉。」\r\n> 「只要增速不高，这个 `1 − r²` 它就是**非常非常靠近 1** 的，既然非常靠近 1，就把它省掉。」\r\n\r\n板书在 `1 − r²` 旁标注：`1 − r² → 1`，并写「**r 不大**」。\r\n\r\n**继续拆开，得到「主要项 + 修正项」**\r\n\r\n> 「我们再把它掰开来，把这个 (1 − r) 拆开，就变成 `现期 × r − 现期 × r × r`。这样子的话，我们又会发现这后面不又是个乘 r 的平方吗？意味着啥？意味着**如果你在增速不高的时候，后面这个东西它也是一个很小很小的影响**。」\r\n> 「所以前面这个部分 `现期 × r`，就成了我们算增量里面**非常重要的一个主要的部分**，就被我们直接摘出来了，它就非常重要、非常主要、非常直接，可以让你的这个计算对应到那个增量上去。」\r\n> 「如果算出来这个还不够准，你再去把刚刚没有减的这部分减掉，不就能够把它修正为准了吗？这样就能符合我们前面讲的做资料分析，你要有一个这种**先粗后细**的意识。」\r\n\r\n### 1.2 适用条件：为什么是 10%\r\n\r\n板书原文：\r\n\r\n```\r\n适用条件：变化幅度 ≤ 10%\r\n①误差小；②便于计算\r\n```\r\n\r\n| 条件 | 老师解释（原话） |\r\n| --- | --- |\r\n| **① 误差小** | 「你这个增速越大，你这个 `1 − r²` 和 1 的这个差距就越大，你的误差就越大。所以我们增量这个增速尽量不要太大。**增速越小，精度越高**。」 |\r\n| **② 便于计算** | 「小于等于十的时候，你这边**位数是不是少**啊？如果是百分之四点七，是不是两位数？题目一般不会给你什么 4.74%、4.736% 这种增速吧？大部分来说就是个两位数，**位数少**。相比于两位数，然后给你个什么 13.7%，你还要拿个限期去乘个 137，是不是就很烦？」 |\r\n\r\n**极限误差验算（板书）**\r\n\r\n```\r\n1 − r² = 1 − (10%)² = 1 − 1%\r\n```\r\n\r\n> 「所以你哪怕取得这种极限情况，也只有**百分之一**的误差。」\r\n> 「严格一点来说，就是**变化幅度小于等于百分之十**的时候，**负增速时候也是**，比如负百分之九也算百分之九，也是。」\r\n\r\n> ⭐ **口诀**：「只要增度小，你就赶紧给我用化除为乘，除非其他方法有难以比拟的优势。它**又准又快**，还方便。」\r\n\r\n### 1.3 「粗」与「细」：两步走\r\n\r\n板书原文（`现期×r` 下写「**粗**」，`现期×r×r` 下写「**细**」）：\r\n\r\n```\r\n粗                          细\r\n增量 ≈ 现期×r        −      现期×r×r\r\n= 现期 × r − 现期 × r × r\r\n\r\n① 现期×r = 现期△              ← 粗：先估出主项\r\n② 现期△ − 现期△×r ≈ 实际△    ← 细：再用主项乘 r 修正\r\n```\r\n\r\n> 「什么条件是一样的……我待会跟你说这个是解题的步骤。你是**先把这个部分算出来**，算出来之后可能有的时候你要再去调整，再拿这个东西去乘这个增速给它修下去。」\r\n> 「第一步就是我们先直接去拿这个现期去乘这个增速……他足不足以让你去选答案呢？**其实他已经完全足够了**。」\r\n\r\n### 1.4 从乘法误差角度看化除为乘（本质是放缩）\r\n\r\n板书写出两个式子作对比：\r\n\r\n```\r\n① ∆ = 现 × r        （拿现期代替基期算出来的「假增量」）\r\n   实∆ = 基 × r\r\n```\r\n\r\n> 「其实相当于我们这第一步，我们不是它增量等于这个现期乘以 r 吗？**实际的增量是多少呢？实际的增量应该是拿基期乘 r**。」\r\n> 「还记得我们第二节课说的一个东西吧？就是一个**乘法的误差的一个调整、误差的一个修正**。我们现在其实就相当于是**拿现期代替了基期**，对不对？」\r\n> 「那误差有多少呢？现期比基期的误差有多少，主要看什么，是不是**看比例**？所以你其实就是看这个现期比基期**多多少比例**。那这个比例是什么？那不就是**增速**吗？」\r\n> 「就好像本来我这个地方应该是把这个增量减掉，算它的基期，大概六万六千三左右。我本来这个增量应该是 66300 去乘这个增速 0.9% 的。现在我再拿这个 6万7 去乘，6万7 比这个 66300 多了 0.9%，所以导致你这个结果**偏大了百分之零点九**，你就把这个百分之零点九给他**退掉**。」\r\n\r\n⭐ **结论**：「**这本质上其实也就是一种放缩**，因为你拿现期代替的基期，现期比基期多了这么个增速一个百分比，所以再把这个多的部分给它减掉。」\r\n\r\n> ⚠️ 为什么不建议大增速用：「**因为我们这种放缩运算，你不要动的太多，你动的太多，到时候误差控不住**。它并不是那种很严格意义上的加减关系的，其实会有一点点的影响的，会有那么一丢丢一丝丝的误差的。」\r\n\r\n### 1.5 负增速怎么办：反向补偿\r\n\r\n**板导演算（负增速）**：\r\n\r\n```\r\n基期 100  --(r = −5%)-->  现期 95\r\n\r\n|∆| = 95 × 5% = 4.75        ← 拿现期（比基期小）去乘，结果偏小\r\n|∆| ≈ 5                     ← 再把这 5% 加回来\r\n```\r\n\r\n板书还写出严谨形式：\r\n\r\n```\r\n4.75 × (1 + 5%) ÷ [ (1 − 5%) × (1 + 5%) ]\r\n10 ─ 10% × 1.1% ─ 1.1 ÷ 0.11\r\n```\r\n\r\n> 「如果是负增速，这时候你应该怎么样？对，把你的**减少量绝对值给它加回去**。」\r\n> 「我随便举个例子，比如说如果基期是 10——我直接是 100 吧——我减了百分之五，变成 95。现在我拿这个现期增速去算减少量：我先拿这个现期 95 去乘这个 5%，这是我的减少量，这是**绝对值**。算下来大概 4.75。那结果他是拿现期计算的，现期是比真实值所用的基期**少了五个点**的，所以我的结果也会**少五个点**，那我们就再把这五个点**加回来**。所以它实际的减少量应该是 4.75 的基础上加 5 个点，那不就大概到 5 了吗？」\r\n> 「当然里面其实还是有那么一丢丢误差的。因为本来来说，你应该是拿 4.75 去除以一个 (1 − 5%) 的，但是我们现在又用了一次化除为乘，把它想成了乘以 (1 + 5%)，这样子会有一点点误差。」\r\n> 「**准确的五个点应该是这个真实值的五个点**，但是我们在算这个东西的时候，我们不需要去找到真实，因为他们的这个差距、误差影响很小，你可以直接用这个 4.75，大概它的五个点去加回去就够了。也不需要算的那么特别准，题目不要求你算的那么特别准。」\r\n\r\n**正增速的对照演算（老师口述）**：\r\n\r\n> 「如果是正增速的时候，我一个 10 加了 10%，变成 11。我拿 11 去乘 10%，乘出来的增量是 1.1。你看这个结果就会比你真实值的这个增量**大概高 10%**。你再把它的 10% 减掉，减个 0.11，算出来一个 **0.99**。这个跟你准确的这个增量其实也没什么区别了。」\r\n\r\n### 1.6 方向铁律：大于零往下减，小于零往上加\r\n\r\n> ⚠️ 老师特别强调（板书此处 PPT 有笔误，老师现场纠正）：\r\n> 「大家一定要注意，在做这种化除为乘的时候，**方向千万别搞反了**！这个地方你打起精神来听。我不希望看到哪个同学在群里面问我：哎，这个地方我怎么错了。一看你一个方向都搞反了。」\r\n> 「就是当你**增速大于零**的时候，你想要变得更准确，你需要把那个你算出来的**变化量变小**。大于零的时候要变小，小于零的时候它这个变化量要**变大**。这个千万别搞反了。」\r\n> 「这个地方来说，**大跟小是绝对值**。」\r\n\r\n```\r\n增速 r > 0：增量∆ 偏大  →  往下减（变小）\r\n增速 r \u003c 0：减少量|∆| 偏小  →  往上加（变大）\r\n（此处的「大/小」一律指绝对值）\r\n```\r\n\r\n**老师给的三个数字例子（板书 `⏐∆⏐ = 95 × 5% = 4.75 → |∆| = 5`）**：\r\n\r\n> 「比如 10 加百分之十，你乘出来个 1.1，一定要记得你的实际增量是在它的下面，你要把它变小；如果是 9 减百分之十，你算出来变化量是 0.9，一定要记得你的实际的变化量是会比 0.9 要大，要把它变大。大概百分之十，这个地方来说，大跟小是绝对值。就是大概 0.99。这个地方只要百分之十左右，也是在 0.99 的附近，实际上他们这个变化量都是一样的，会有一个**百分之一**的误差。」\r\n> 「因为我刚刚说了，这种百分之十的时候，你要化除为乘，它会存在一个百分之一的误差，百分之一的误差就这个 `1 − r²`。**大于零的时候往下减，小于零的时候往上加。**」\r\n\r\n---\r\n\r\n## 二、化除为乘例题精讲\r\n\r\n### 第 1 题｜2020 全国粮食总产量 · 同比增长 0.9%\r\n\r\n**【题干原文】**\r\n\r\n> 2020 年全国粮食总产量 66949 万吨，同比增长 0.9%。\r\n> 2020 年全国粮食总产量比 2019 年约增产（ ）。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2020 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 全国粮食总产量 | 66949 万吨 | 0.9% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知**现期值 + 增长率**，求**增长量** |\r\n| 定位数据 | 现期 = 66949 万吨；r = 0.9%（变化幅度 ≤ 10%，触发「化除为乘」） |\r\n| 列式 | `∆ ≈ 现期×r − (现期×r)×r` |\r\n| 速算①（粗） | 66949 四舍五入 → 67000；`67000 × 0.9% = 603` 万吨 |\r\n| 速算②（细） | `603 − 603 × 0.9% = 603 − 5.4` |\r\n| 结论 | `= 597.6`，选 597 |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n∆ ≈ (现×r) − (现×r) × r\r\n\r\n① 67000 × 0.9% = 603 万吨\r\n        670\r\n      ×   9\r\n      ------\r\n        603\r\n\r\n② 603 − 603 × 0.9%\r\n   = 603 − 5.4\r\n   = 597.6\r\n```\r\n\r\n**【选项原文】**\r\n\r\n- A. 119 万吨\r\n- B. 386 万吨\r\n- C. 597 万吨\r\n- D. 623 万吨\r\n\r\n**【答案】** ✅ C\r\n\r\n**【解析】**\r\n\r\n- 老师口述：「现期我们就当做是 6万7，可以吧？这个 66949，我们直接四舍五入选成 6万7，这个是基本上没有什么影响的。然后乘以这个增速 0.9，670 乘以 9 等于 6030，错位相减，603。所以这个乘下来就是 **603 万吨**。」\r\n- 「他足不足以让你去选答案呢？其实他已经**完全足够了**。因为你知道，你想要把它变得更准，你后面一步是拿这个 603 再乘这个增速去把它减掉，就是 **603 减去 5.4 左右，就是 597.6，所以选 597**。」\r\n- 板书在旁补写了「为什么这样修正」的底层逻辑：\r\n\r\n```\r\n① ∆ = 现 × r          （现期比基期多了 r，所以结果偏大 r）\r\n   实∆ = 基 × r\r\n   66300 × 0.9%       （本该用基期算）\r\n```\r\n\r\n- ⚠️ **陷阱类型**：**近似陷阱**——粗估值 603 落在 C.597 与 D.623 之间，若不追加「细」的一步（`603 − 5.4`）就无法在 C/D 之间决断。老师原话：「他足不足以让你去选答案呢？其实他已经**完全足够了**……下一步是拿这个 603 再乘这个增速去把它减掉。」\r\n\r\n---\r\n\r\n### 第 2 题｜玉米产量减产 0.7%（求减产量）\r\n\r\n**【题干原文（转写口述，画面未抓到完整题干）】**\r\n\r\n> 玉米产量 25733〔减产 0.7%〕，（转写为）「玉米产量 25733 减产 0.7%，问这个减产量是多少？」\r\n> （画面显示为「玉米产量 25733 减产 0.7%」，转写不清具体年份与单位，老师只口述了数字）\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 现期值 | 同比增速 |\r\n| --- | --- | --- |\r\n| 玉米产量 | 25733 | −0.7%（**负增速**） |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 负增速求**减少量** |\r\n| 触发条件 | 变化幅度 0.7% ≤ 10% → 化除为乘 |\r\n| 列式 | `|∆| ≈ 现期 × r` |\r\n| 速算①（粗） | `257 × 7 = 1799` → 取三位 `257 × 7 = 1799` → `179.9` |\r\n| 速算②（细） | 因 r \u003c 0，结果偏小，需**往上加**约 0.7% |\r\n| 结论 | 选比 179.9 稍大的一项（选项对应 C） |\r\n\r\n**【速算演示】**\r\n\r\n```\r\n257 × 7 = 1799   →   179.9\r\n```\r\n\r\n**【选项原文】**\r\n\r\n（画面未显示本题选项，转写仅提到「这个 179.9 它在 B 跟 C 之间，选 B 还是选 C 呢？」）\r\n\r\n**【答案】** ✅ **C**（转写：「所以选 c 嘛，比 179.9 大，那么 0.7% 的不就是 c 吗？」）\r\n\r\n**【解析】**\r\n\r\n> 「这个增速就比较小吧，那我们就直接化除为乘，直接上来就拿现期去乘以百分之零点七。为什么可以直接拿现期呢？因为这现期跟基期差的就那么一点点，就差那么百分之零点七。我何苦非要去找到一个那么准的一个基期呢？」\r\n> 「因为我就算拿这个来算，虽然说我这个现期跟基期会差一百多，但是在这个比例上来说，对它的结果来说，只会有那么百分之零点七的一个误差的影响。那我选项之间这个百分之零点七其实就还好，所以不用太在意这个误差。」\r\n> ⚠️ **方向判断（关键）**：「这个你是拿现期代替基期去算的，也就是现期，它到底是小了呢，还是大了呢？**小了嘛**！人家都说了是减产的百分之零点七，这个增速是负的，是从大的一个数变成小的一个数。你拿一个小的数代替大的数去乘，那个结果当然是小的，所以我们就要把这个结果再去**扩大大概百分之零点七**。」\r\n> 「所以选 C 嘛，比 179.9 大那么 0.7% 的不就是 C 吗？」\r\n\r\n⚠️ **陷阱类型**：**方向陷阱**（负增速必须往上补偿，而非往下减）。\r\n\r\n---\r\n\r\n### 第 3 题｜江苏省国资委监管企业营业收入（上半年）\r\n\r\n**【题干原文（转写口述）】**\r\n\r\n> 「上半年，江苏省国资委监管企业实现营业收入同比增加多少？」\r\n> 实现营业收入是前面一个数据 **2091**，它的增速是 **4%**。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 数值 | 同比增速 |\r\n| --- | --- | --- |\r\n| 营业收入 | 2091 | 4% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量** |\r\n| 列式 | `∆ ≈ 2091 × 4%`（提前修正版：`2000 × 4%`） |\r\n| 速算①（结果修正） | `209 × 4 = 83.6` → 得 83.6；因 r>0 偏大 4%，减 3.2 → 80.4 |\r\n| 速算②（提前修正） | 直接把 2091 减到 2000（约减 4%）：`2000 × 4% = 80` |\r\n| 结论 | 选 80 左右的一项（转写显示对应 B） |\r\n\r\n**【速算演示】**\r\n\r\n```\r\n直接乘（粗）：209 × 4 = 83.6\r\n修正（细）：  83.6 − 83.6×4% ≈ 83.6 − 3.2 = 80.4 ≈ 80\r\n\r\n提前修正：2091 → 2000（减约 4%），2000 × 4% = 80\r\n```\r\n\r\n**【选项原文】**（画面未抓到本题选项，转写只提到「选个 84 的」「只能是 B 吗」）\r\n\r\n**【答案】** ✅ **B**（转写：「所以要拿这个 83.6 去把这个百分之四给它减掉，那减四个点，那不就只能是 B 吗？83.2 嘛，减个 3.2，80.4，差不多 80 嘛。」）\r\n\r\n**【解析】**\r\n\r\n> 「直接 209 乘以 4，遇到这种问题，你就不要再去想那么多了。因为**它增速小，你就直接先拿现期乘增速**。只要这个现期跟增速好乘，你直接乘。83.6 出来了选啥？」\r\n> ⚠️「江苏这几年有两次了，好像两三次都在这种**化除为乘上去设坑**的。很多同学以前学的时候只知道『我拿现期乘这个增速，我就能得到一个比较靠近的一个增量』，他不知道去修正。他写了个 83.6 出来之后，很多人在考场会选个 **84** 的，因为他觉得 84 离得近嘛，他忘记了误差了。」\r\n> 「你要一定要记得，这个 83.6，它是会有一个**百分之四的误差，它会偏大百分之四**。因为你拿一个大的、百分之四的现期代替基期去算这个增量，那你的结果肯定也是偏大百分之四的。**这个就是乘法的一个误差对结果的一个影响，要有一个比例的传导**。」\r\n> 「所以你要拿这个 83.6 去把这个百分之四给它减掉，那减四个点，那不就只能是 B 吗？83.2，减个 3.2，80.4，差不多 80 嘛。」\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**——命题人故意把「未修正的粗估值 84」设为干扰项。\r\n\r\n---\r\n\r\n### 第 4 题｜4600.1 × 4.2%（老师先口述、后揭题为第 7 题）\r\n\r\n> 说明：本题老师**先只报数字不讲出处**（「继续哎，再来 4600、4.2」），讲完修正方法后翻到讲义才显示完整题干（即第 7 题）。此处保留老师第一轮口述的完整讲解过程。\r\n\r\n> 转写：「继续，再来 4600、4.2。直接 46、42，然后 4624、18，这边他就是 1932，193.2。我们还要怎么办？我们能直接选那个 C 吗？**这个 C 他是专门来坑你的，他是坑那些直接拿现期乘增速选这个选项的人的。**」\r\n> 「这个结果它会**偏大百分之四左右**，你给他再减个八，因为 193 的百分之四点二大概就是八左右嘛。」\r\n> 「**这个 8 怎么来的？**我这边再讲一下，193 乘以 4.2，它为什么是 8 呀？有朋友问了，能不能用乘法放缩？当然可以，乘法放缩就是可以用在这种你拿什么东西乘什么东西的地方，尤其是这种影响比较小的东西。」\r\n> 「**它就大胆的把它写成两百乘以百分之四就好了。**你不用在意说这个 4.2 变成 4 少了个二、这个 193 要变成 200 要加多少，不用管这些东西，**差不多就行了**。因为它这个东西影响比较小，它只是你这个增量数里面的一个百分之四的东西。这个百分之四的东西，你哪怕再出现个什么百分之五、百分之十的误差，对于整体的影响也只有那么百分之零点四、百分之零点二，影响非常小。」\r\n> 「所以就减个八左右，减个八，**185.2**。」\r\n\r\n**【速算演示】**\r\n\r\n```\r\n46 × 42 = 1932      →  193.2（粗估，偏大约 4.2%）\r\n修正项：193 × 4.2% ≈ 200 × 4% = 8\r\n193.2 − 8 = 185.2\r\n```\r\n\r\n**【答案】** ✅ **B**（转写：「那只能选 B 了嘛，A 又太远，C 又太近。」）\r\n\r\n**【提前修正版（老师后面回讲）】**\r\n\r\n> 「如果你直接乘，这是 46 乘以 42，这个结果是怎么样，是不是偏大百分之四？两位数乘两位数我嫌烦，我也不想用乘法放缩……那怎么办？我能不能给他们俩**谁先减个大概百分之四凑整**呢？是不是他比较合适？**42 减 4% 基本就大概正好是 2** 吧。所以直接 **46 × 4 = 18.4**，B 走了。」\r\n> 「这样子我是不是顺带着连误差都一起修正了？我既让这个位数凑整了、好算了，其次我也让这个结果变得更准了，**一举两得**。」\r\n\r\n---\r\n\r\n### 第 5 题｜2018 年玉米产量 · 减产 0.7%（画面完整题干，即第 2 题）\r\n\r\n> 说明：第 2 题是老师先口述数字、后翻出讲义页的第 5 题（同一道题）。此处给出**画面逐字题干与选项**。\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2018 年，玉米产量 25733 万吨，减产 0.7%。\r\n> 2018 年玉米产量减产（ ）。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2018 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 玉米产量 | 25733 万吨 | −0.7% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 负增速求**减少量**（问「减产多少」） |\r\n| 触发条件 | 变化幅度 0.7% ≤ 10% → 化除为乘 |\r\n| 列式 | `|∆| ≈ 现期 × r` |\r\n| 速算①（粗） | `257 × 0.7` → 竖式 `257 × 7 = 1799` → 得 **179.9** |\r\n| 速算②（细） | r \u003c 0 → 结果偏小 0.7%，需**往上加** |\r\n| 结论 | `179.9 × 1.007 ≈ 181.2` → 选 181 |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n257 × 0.7% = 179.9\r\n     257\r\n   ×   7\r\n   ------\r\n    1799        → 179.9\r\n```\r\n\r\n**【选项原文】**\r\n\r\n- A. 171 万吨\r\n- B. 178 万吨\r\n- C. 181 万吨\r\n- D. 188 万吨\r\n\r\n**【答案】** ✅ C\r\n\r\n**【解析】**\r\n\r\n> 「这个增速就比较小吧，那我们就直接化除为乘，直接上来就拿现期去乘以百分之零点七。」\r\n> ⚠️「这个你是拿现期代替基期去算的，也就是现期，它到底是小了呢，还是大了呢？**小了嘛**！人家都说了是减产的百分之零点七，这个增速是负的，是从大的一个数变成小的一个数。你拿一个小的数代替大的数去乘，那个结果当然是小的，所以我们就要把这个结果再去**扩大大概百分之零点七**。所以选 C 嘛，比 179.9 大那么 0.7% 的不就是 C 吗？」\r\n\r\n⚠️ **陷阱类型**：**方向陷阱**（负增速必须往上补偿）+ **量级陷阱**（25733 → 257 是去掉两位小数，乘 0.7 后结果直接是百位数级别）。\r\n\r\n---\r\n\r\n### 第 6 题｜2023 上半年江苏省国资委 · 营业收入同比增加（画面完整题干，即第 3 题）\r\n\r\n> 说明：第 3 题是老师先口述数字、后翻出讲义页的第 6 题（同一道题）。此处给出**画面逐字题干与选项**。\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2023 年上半年，江苏省国资委监管企业实现营业收入、利润分别为 2091 亿元、306 亿元，分别增长 4%、30.4%。\r\n> 2023 年上半年，江苏省国资委监管企业实现营业收入约同比增加：\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2023 上半年 | 同比增速 |\r\n| --- | --- | --- |\r\n| 营业收入 | 2091 亿元 | 4% |\r\n| 利润 | 306 亿元 | 30.4% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量** |\r\n| 定位数据 | 营业收入 2091 亿元，增速 4%（注意：**不能用利润的 30.4%**） |\r\n| 列式 | `∆ ≈ 现期 × r` |\r\n| 速算（结果修正） | `209 × 4 = 83.6` → 偏大 4% → 减 3.2 → 80.4 |\r\n| 速算（提前修正） | `2091 → 2000`（减约 4%），`2000 × 4% = 80` |\r\n| 结论 | 选 80 亿元 |\r\n\r\n**【速算演示】**\r\n\r\n```\r\n粗算：209 × 4 = 83.6\r\n修正：83.6 − 83.6 × 4% ≈ 83.6 − 3.2 = 80.4\r\n\r\n或提前修正：2091 → 2000（约减 4%），2000 × 4% = 80\r\n```\r\n\r\n**【选项原文】**\r\n\r\n- A. 61 亿元\r\n- B. 80 亿元\r\n- C. 84 亿元\r\n- D. 100 亿元\r\n\r\n**【答案】** ✅ B\r\n\r\n**【解析】**\r\n\r\n> 「直接 209 乘以 4。遇到这种问题，你就不要再去想那么多了，因为**它增速小，你就直接先拿现期乘增速**。」\r\n> 「江苏这几年有两次了，好像两三次都在这种**化除为乘上去设坑**的。很多同学以前学的时候只知道『我拿现期乘这个增速，我就能得到一个比较靠近的一个增量』，他不知道去修正。他写了个 83.6 出来之后，很多人在考场会选个 **84** 的，因为他觉得 84 离得近嘛，他忘记了误差了。」\r\n> 「所以你要拿这个 83.6 去把这个百分之四给它减掉，那减四个点，那不就只能是 B 吗？」\r\n\r\n**【提前修正版（老师后面回讲）】**\r\n\r\n> 「2091 乘以 4%，这个式子它会偏大 4%，对不对？那你能不能**提前把谁修到百分之四**？你不让它偏 4%，不就好了？直接 **2000 乘以 4% = 80**。」\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**——C.84 亿元正是「未修正的粗估值」；另有**概念/范围陷阱**（材料给了利润增速 30.4%，与所求「营业收入」无关）。\r\n\r\n---\r\n\r\n### 第 7 题｜2017 全国学前教育在园幼儿 · 同比增长 4.2%\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2017 年，全国学前教育在园幼儿 4600.1 万人，同比增长 4.2%\r\n> 2017 年全国学前教育在园幼儿人数同比增加（ ）万人\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2017 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 全国学前教育在园幼儿 | 4600.1 万人 | 4.2% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量** |\r\n| 列式 | `∆ ≈ 现期 × r` |\r\n| 速算① | `46 × 42 = 1932` → 得 **193.2** |\r\n| 速算②（修正） | 修正项 `193 × 4.2% ≈ 200 × 4% = 8`；`193.2 − 8 = 185.2` |\r\n| 速算③（乘法放缩版） | `46 × 42 = 48 × 40 = 192`（竖式 48×40=1920 → 192） |\r\n| 结论 | 选 185 |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n        46                           48\r\n      × 42                         × 40\r\n      ----                         ----\r\n        92    （2×46）               192\r\n       184    （4×46）\r\n      ----\r\n      1932  →  193.2\r\n              −  8\r\n      ---------------\r\n             185.2\r\n\r\n修正项：193 × 4.2% = 200 × 4% = 8\r\n```\r\n\r\n> 「这个 4.2 怎么减掉它的平方呢？你自动地脑补，把后面补成 20−16，4.04……」——指 `r²` 的补位技巧。\r\n> 「193 乘以 4.2，为什么是 8 呀？你就大胆的把它写成 **200 乘以 4%** 就好了，差不多就行了。因为它这个东西影响比较小，它只是你这个增量数里面的一个百分之四的东西。」\r\n\r\n**【乘法放缩版（老师补充）】**\r\n\r\n> 「那前面这段能不能乘法放缩呢？当然也能用啊！**46 乘以 42 就等于 48 乘以 40**。这个时候你稍微注意一下，如果有的时候你这个选项差距太近了，**乘法放缩它是自带误差的**，你还是要小心一点。192，然后 192 小几个点选 B 啊。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 138\r\n- B. 185\r\n- C. 193\r\n- D. 230\r\n\r\n**【答案】** ✅ B（板画面上 B.185 处打 ✓）\r\n\r\n**【解析】**\r\n\r\n> ⚠️「我们能直接选那个 **C** 吗？**这个 C 他是专门来坑你的，他是坑那些直接拿现期乘增速选这个选项的人的。**这个结果它会偏大百分之四左右，你给他再减个八。」\r\n> 「选项 C 就是那个**没有修正的 193.2**。」\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**——C.193 与粗估值 193.2 几乎一致，是标准诱饵。\r\n\r\n---\r\n\r\n### 第 8 题｜2014 全国旅客运输 · 求 2013 年公路运输总量（问基期，却算增量）\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 据有关部门统计，2014 年全国旅客运输总量为 220.7 亿人次，同比增长 3.9%，其中，铁路运输总量为 23.6 亿人次，同比增长 11.9%；**公路运输总量为 190.5 亿人次，同比增长 2.8%**；水运运输总量为 2.6 亿人次，同比增长 12.3%；民航运输总量为 3.9 亿人次，同比增长 10.6%。\r\n> 2013 年全国公路运输总量是（ ）亿人次？\r\n\r\n**【材料数据】**\r\n\r\n| 运输方式 | 2014 年总量（亿人次） | 同比增长 |\r\n| --- | --- | --- |\r\n| 全国旅客运输总量 | 220.7 | 3.9% |\r\n| 铁路运输总量 | 23.6 | 11.9% |\r\n| **公路运输总量** | **190.5** | **2.8%** |\r\n| 水运运输总量 | 2.6 | 12.3% |\r\n| 民航运输总量 | 3.9 | 10.6% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 材料给 2014 年，问 **2013 年**（基期）；但增速仅 2.8% ≤ 10% |\r\n| 核心决策 | **问基期也照样先算增量**，再用「现期 − 增量」得基期 |\r\n| 列式 | 增量 `≈ 现期 × r`；基期 `= 现期 − 增量` |\r\n| 速算 | `190.5 → 19`，`2.8 → 28`，`19 × 28 = 532` → 增量 **5.32** |\r\n| 修正 | 5.32 偏大 2.8%，减约 0.15 → **5.17** |\r\n| 结论 | `190.5 − 5.17 = 185.33 ≈ 185.31` → 选 C |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n          19\r\n        × 28\r\n        ----\r\n          152       （8×19）\r\n          38        （2×19，错位）\r\n        ----\r\n          532   →  增量 = 5.32\r\n\r\n修正：5.32 偏大 2.8%  →  5.32 − 0.15 = 5.17\r\n基期：190.5 − 5.17 = 185.33 ≈ 185.31\r\n```\r\n\r\n> 「这个 0.5 就不要了吧，因为 1905 里面这个 5 就影响比较小，只有那么千分之二、千分之三的一个影响。**19 乘以 28，这样就两位数乘两位数了**，你就不用去搞什么四位数乘两位数了。」\r\n\r\n**【老师列出的「选项 → 增量」对照（板书）】**\r\n\r\n```\r\nA.184.31  →  增量 6.19\r\nB.185.16  →  增量 5.34\r\nC.185.31  →  增量 5.19\r\nD.186.15  →  增量 4.35\r\n```\r\n\r\n**【选项原文】**\r\n\r\n- A. 184.31\r\n- B. 185.16\r\n- C. 185.31\r\n- D. 186.15\r\n\r\n**【答案】** ✅ C\r\n\r\n**【解析】**——**本题是全课「计算对象选择」的核心示范**\r\n\r\n> 「我好像讲得有点跳了，因为昨天有同学说，哎老师，你这个地方人家问的是基期，你怎么在这边自顾自地就把增量算起来了？同学们再回忆一下，我昨天给你们讲了一个知识点，就是：**你在考虑一个乘除运算的时候，你考虑好你的计算对象是谁**。」\r\n> 「如果这个题目你真的老老实实去算这个基期，你就麻烦了。很多同学在预习的时候就说，老师这个题目我这样子去做，怎么就做不出来呢？我就直接去算这个基期呗，我按照你昨天说的放缩，我怎么就做不出来呢？」\r\n> 「因为你看这个选项差距多近——**185.16、185.31，只差了 0.15，只有千分之一不到的一个差距**（板书圈注「0.1%」）。而如果你的计算对象就正好是这个基期，那你这个除法你就不能有百分之零点一的一个误差，就很难算。那怎么办？我非得算这个基期吗？」\r\n> 「我能不能先算增量？**我减法有误差吗？我减法没误差吧**。所以我先算增量会有什么好处呢？这个选项他们的差距也就要重新来看了。」\r\n> 「你如果算增量的话，A 选项相当于对应的是 **6.19** 的增量，B 选项对应的是 **5.34** 的增量，C 对应的是 **5.19** 的增量，D 对应的是 **4.35** 的增量。这个时候，**这个 0.15 它是占到了这个 5.34 或者 5.19 的 3%**。」\r\n> ⭐「**因为你换了一下计算对象，你的计算的误差的容许度就会从百分之零点一变成了百分之三。**」\r\n> 「那我们刚刚是不是说了，你那个化除为乘，你哪怕就是百分之十去算，也不过就百分之一的误差。何况这里才 2.8%，才那么 2.8%，大概 0.4 左右（夸张说法，实际约 0.15）的一个误差，基本上在这边是没有任何的区别的。」\r\n> 「所以**你想算什么计算对象就算什么计算对象，又没人限制你**。这也是我之前课前你们问的问题 —— 为什么这种低增速的题目，这种低增速他要你算基期，你也**尽量不要用放缩法去把分母从这个 1028 变成 1000 去算**，因为你低增速有更好的办法，**化除为乘又快又准**。」\r\n> ⭐⭐「**所以我们看到这个低增速，它不管问基期还是问增量，你都应该去算这个增量。**不是你想不起来转换，我待会会告诉你的，你**不需要去转换什么东西**。我就跟你说明明白白的：**增速低的时候，你不管算基期还是算增量，他哪怕问你基期，你也给我用化除为乘。**这要什么转换呢？不需要转换呀。」\r\n> ⭐「就是你看了这么小，**自动触发你的底层代码，自动触发这个条件，直接化除为乘**，先把增量估出来。问增量，那就拿增量；问基期，就去减增量。」\r\n\r\n**修正演示（板书）**：\r\n\r\n```\r\n5.32 偏大 2.8%  →  −0.15  →  5.17\r\n5.19（C 选项对应的增量）  →  两者基本无误差\r\n```\r\n\r\n> 「B 它代表的是 5.34，你这个 5.32，它的结果是**偏大了 2.8%** 的，你肯定要选 C 嘛，185.31。它代表的增长是 **5.19**。你看，你把这个 2.8% 再给它减掉，大概 3% 吧，减个 0.15，是不是 5.17？跟这个 5.19 基本上没有什么误差吧。」（板书把 `1905 / 1.028` 整体划掉，改写成 `1000`，并在旁边写「**化除为乘**」）\r\n\r\n⚠️ **陷阱类型**：**近似陷阱 + 时间陷阱**（材料/题干年份错位，2013 vs 2014）。\r\n\r\n---\r\n\r\n## 三、增量 vs 基期：为什么低增速一律算增量\r\n\r\n**本课最重要的方法论（出自第 8 题的现场讨论）**：\r\n\r\n| 计算对象 | 选项间距要求（以第 8 题为例） | 误差容许度 | 建议 |\r\n| --- | --- | --- | --- |\r\n| 直接算**基期** | 185.16 与 185.31 差 0.15 | **约 0.1%** | 极难，放缩法把 1.028 变 1000 会失败 |\r\n| 改算**增量** | 6.19 / 5.34 / 5.19 / 4.35，最小差 0.15 | **约 3%** | ✅ 用化除为乘轻松搞定 |\r\n\r\n```\r\n低增速（|r| ≤ 10%）→ 一律先算增量（化除为乘）\r\n   ├─ 问增量：直接用算出的增量\r\n   └─ 问基期：基期 = 现期 − 增量（减法无误差）\r\n```\r\n\r\n> ⭐ 老师结论：「**增速低的时候，你不管算基期还是算增量，他哪怕问你基期，你也给我用化除为乘**，这又要什么转换呢？不需要转换呀。你看了这么小，**自动触发你的底层代码**。」\r\n\r\n---\r\n\r\n### 第 9 题｜2019 全年 V 市交通运输、仓储和邮政业增加值\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2019 年全年 V 市交通运输、仓储和邮政业增加值 398 亿元，增长 4.4%\r\n> 2019 年全年 V 市交通运输、仓储和邮政业增加值的增长量约为（ ）亿元。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2019 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| V 市交通运输、仓储和邮政业增加值 | 398 亿元 | 4.4% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量** |\r\n| 列式 | `∆ ≈ 现期 × r`（提前修正：`398 → 400`） |\r\n| 速算①（粗） | `400 × 4.4%` → `44 × 4 = 176` → **17.6** |\r\n| 速算②（细） | 修正项 `20 × 4% = 0.8`（`193×4.2%` 的同类做法） |\r\n| 结论 | `17.6 − 0.8 = 16.8` → 选 C |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n400 × 4.4%\r\n\r\n        44\r\n      ×  4\r\n      ----\r\n       176     → 17.6\r\n\r\n修正：17.6 − 4.4% × ... ≈ 20 × 4% = 0.8\r\n      17.6 − 0.8 = 16.8\r\n```\r\n\r\n**【选项原文】**\r\n\r\n- A. 15.2\r\n- B. 16.0\r\n- C. 16.8\r\n- D. 17.6\r\n\r\n**【答案】** ✅ C（板书把 D.17.6 划掉）\r\n\r\n**【解析】**\r\n\r\n> 「现在来看，它就是直接 400 乘以百分之四点四。44 乘以 4 等于 176，你是不是算出来个 17.6？能选他吗？**肯定不能选**，那要选哪个呢？选 A 还是选 B 还是选 C？这个时候就需要你去修正的了。」\r\n> 「这个时候你要不要算的细？那**肯定不用算很细**吧，我刚刚说过了嘛，因为你这个修正项在这个增量里面只占了百分之几。它本身就是影响很小的东西，所以你要算它的时候，不用算得很细，就直接 **20 乘以 4%**。减个 0.8，16.8，C 走了。」\r\n> 「很多同学说的不错，直接 20 乘 4；说 18 乘 4 的还是太保守了。因为你哪怕用 18 乘以 4，你也不会就减个 0.72，差了个这么 0.08，没什么意义。你这个修正项本身就已经特别特别小了。」\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**——D.17.6 是未修正的粗估值。\r\n\r\n---\r\n\r\n## 四、提前修正（一）：多位数凑整\r\n\r\n### 4.1 原理：把「结果上修正」提前到「过程中修正」\r\n\r\n**板书（「化除为乘——提前修正」页）**：\r\n\r\n```\r\n实际∆ ≈ 现期 × r × (1 − r)\r\n\r\n① 实际∆ ≈ 现期 × [ r × (1 − r) ] = 现期 × (r − r²)\r\n② 实际∆ ≈ [ 现期 × (1 − r) ] × r = (现期 − 现期 × r) × r\r\n\r\n核心逻辑：凑整时顺带修正部分误差\r\n```\r\n\r\n> 「我们刚刚这个式子还记得吧？就是增量约等于**现期乘以增速，再乘一个 (1 − r)**。」\r\n> 「那我们为什么就非得先算这个呢？还记得我们第二节课说过**运算的顺序也很重要**。有时候我们可以把先好算的东西给它先算掉。」\r\n> 「我们能不能先算这个 `r × (1 − r)`？是不是也可以，我们可以把它写成 **现期乘以 (r − r²)**。这样做有什么意义呢？」\r\n> ⭐「**凑整。**如果你能把一个增速通过这样的方式去凑整、去减少位数，那你就提前先把这个增速给它修掉，修掉之后你再去乘这个现期，就相当于已经提前把你这个误差调整掉了。」\r\n> 「换句话来说，就相当于是你拿现期代替基期乘增速，是不是算了一个**假的增量**？整体来说它是**偏大了增速的**，你可以在结果上调。」\r\n> 「我们刚刚学的其实就都是在**结果上调整**……我也可以在过程中，我就先把这个 r 调小了，或者我先把这个现期调小了，是不是都可以？」\r\n> 「所以我可以先算 `现期 × (1 − r)`，我先把这个现期调小一个再去乘增速。这样做的目的是什么呢？**还是这个道理，就是为了凑整。**只要你在现期或者增速上能先调整这个误差，把它调成一个比较整的东西、好算，你就先调。**如果调它没有什么意义，那你就算完了再调。**」\r\n> 「这个跟我们昨天讲的那个除法放缩、乘法放缩的原理其实一样的 —— 你可以在**过程中调**，也可以在**结果中调**。」\r\n\r\n**板书上的除法例子（说明「过程中调 / 结果上调」两种写法）**：\r\n\r\n```\r\n例一：398 / 113  →  400 / 111 = 3.60  →  结果再 −2%  →  3.52\r\n      （只调分母，分子本身就整是 400）\r\n\r\n例二：408 / 113  →  400 / 111\r\n      （本身不整，调分母的同时顺手把分子也调成 400）\r\n```\r\n\r\n> 「比如我随便举个例子，113 分之 398。我们把分母变成 111，按道理来说我们是不是要把上面这个减少一点呢？那我们如果觉得它比较整，它本身就是 400 了，我们就**只调一个分母**，调完了之后在结果上，在这个 3.60 上再给它减个大概百分之二，是不是？」\r\n> 「那如果他本身就不整，他这个 408 除 113，我把它变成 111 之后，我顺便就把这个顺手也变成个 400 呗，对不对？**可以在过程中调，也可以在结果中调。**」\r\n\r\n### 4.2 方向铁律（板书原文）\r\n\r\n```\r\n当 r > 0 时，现期∆ 微调到 实际∆ 需要变小 r 的比例\r\n当 r \u003c 0 时，现期∆ 微调到 实际∆ 需要变大 r 的比例\r\n```\r\n\r\n（板书中「现」「实际」两处为红笔后补，「r > 0」「r \u003c 0」被圈出）\r\n\r\n> ⚠️ 老师现场纠错：「我这个地方好像是粘贴错了，你们的书上应该写的对了吧？我这个 PPT 是反的……**以你们书上写的为准**。就是当增速大于零的时候，你想要变得更准确，你需要把那个你算出来的变化量**变小**；小于零的时候它这个变化量要**变大**。这个千万别搞反了。」\r\n\r\n**老师当场举的两组数字（板书）**：\r\n\r\n```\r\nr = +10%：10 → 11，11 × 10% = 1.1  →  实际∆ 比 1.1 小  →  变小 10%\r\nr = −10%：10 → 9，  9 × 10% = 0.9  →  实际|∆| 比 0.9 大 →  变大 10%\r\n```\r\n\r\n> 「比如 10 加百分之十，你乘出来个 1.1，一定要记得你的**实际增量是在它的下面**，你要把它变小；如果是 9 减百分之十，你算出来变化量是 0.9，一定要记得你的**实际的变化量是会比 0.9 要大**，要把它变大。大概百分之十，这个地方来说，大跟小是绝对值……实际上他们这个变化量都是一样的（都约 0.99），会有一个百分之一的误差。」\r\n\r\n---\r\n\r\n### 第 10 题｜2017 全国学前教育在园幼儿（提前修正版）\r\n\r\n**【题干原文】**（同上第 7 题）\r\n\r\n> 2017 年，全国学前教育在园幼儿 4600.1 万人，同比增长 4.2%\r\n> 2017 年全国学前教育在园幼儿人数同比增加（ ）万人\r\n\r\n**【提前修正演示（板书逐步抄录）】**\r\n\r\n```\r\n46 × 4̶2̶   →   46 × 4\r\n（4.2% 减 4% 基本正好是 2，直接把 42 变成 40 对应的 4%）\r\n              46\r\n            ×  4\r\n            ----\r\n              184\r\n```\r\n\r\n> 「刚刚在做这道题目的时候，有同学他已经有基础了、预习过了，他就知道这个题目其实这个地方就很适合直接调的。」\r\n> 「你看，如果你直接乘，这是 46 乘以 42，这个结果是不是偏大百分之四？两位数乘两位数我嫌烦，我也不想用乘法放缩，因为我觉得我用乘法放缩这个 48 乘 40，它有误差呀……你一个减 2，这边应该加 2 多一点的。但我又不想写什么 48 点几，会有误差。」\r\n> 「那怎么办？我能不能给他们俩**谁先减个大概百分之四凑整**呢？是不是他比较合适？**42 减 4% 基本就大概正好是 2** 吧。所以直接 46 乘以 4，**184**，B 走了。」\r\n> ⭐「这样子我是不是顺带着**连误差都一起修正了**？我既让这个位数凑整了、好算了，其次我也让这个结果变得更准了，**一举两得**。」\r\n\r\n**【答案】** ✅ B\r\n\r\n（注意：提前修正得到 184，直接乘再修正得到 185.2 —— 两者都在 B 附近，但提前修正一步到位、位数更少。）\r\n\r\n---\r\n\r\n### 第 11 题｜2023 上半年江苏省国资委 · 营业收入（提前修正版）\r\n\r\n**【题干原文】**（同上第 6 题）\r\n\r\n> 2023 年上半年，江苏省国资委监管企业实现营业收入、利润分别为 2091 亿元、306 亿元，分别增长 4%、30.4%。\r\n> 2023 年上半年，江苏省国资委监管企业实现营业收入约同比增加：\r\n\r\n**【提前修正演示（板书逐步抄录）】**\r\n\r\n```\r\n2091 × 4%\r\n   ↓（把 2091 提前减到 2000，约等于减 4%）\r\n2000 × 4% = 80\r\n```\r\n\r\n> 「再比如这个地方，能不能也这样子想一下？再回头来看一下，我们刚是结果修正。2091 乘以 4%，这个式子它会**偏大 4%**，对不对？那你能不能**提前把谁修到百分之四**？你不让它偏 4%，不就好了？直接 **2000 乘以 4% = 80**。」\r\n> 「**没有哪种更好用。**他只是看你在这个计算的过程中，这个式子他是不是有这种凑整的一个需求。有的时候他不一定能凑，所以他就不一定是全是什么各种好用的。**你觉得好修你就修，觉得不好修你就算完了再修。**他没有一个什么你必须要这样的或者必须哪样子的一个说法。」\r\n\r\n**【答案】** ✅ B\r\n\r\n---\r\n\r\n### 第 12 题｜2018 年 1—8 月谷物进口量（负增速 + 提前修正）\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2018 年 1—8 月，谷物共进口 1643.5 万吨，同比减少 8.5%\r\n> 2018 年 1—8 月，谷物进口量同比减少了（ ）万吨。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2018 年 1—8 月 | 同比增速 |\r\n| --- | --- | --- |\r\n| 谷物进口量 | 1643.5 万吨 | −8.5% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 负增速求**减少量** |\r\n| 列式 | `|∆| ≈ 现期 × r` |\r\n| 直接法 | `1643.5 → 164`，`164 × 8.5` → 需调 `r` |\r\n| 提前修正 | `8.5%` **上调**到 `9%`：`164 × 9 = 1476` → **147.6** |\r\n| 第二种思路 | `164 → 166`，`8.5 → 8.4`，`166 × 8.4 = (1000/6) × 8.4 = 84 ÷ 6 × 100 = 1400` → **140**；再因 r\u003c0 **上调 8.5%** → `140 × 1.085 ≈ 152` |\r\n| 结论 | 选 **152.7** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n方法一（把 8.5% 往上补到 9%）：\r\n   164 × 8̶.̶5̶        （划掉）\r\n   164 × 9\r\n       164\r\n     ×   9\r\n     ----\r\n      1476        → 147.6\r\n   （+8.5%）        ← 因 r\u003c0，绝对值还要往上加\r\n\r\n方法二（数字敏感度：两边同时凑整）：\r\n   164 × 8.5\r\n   166 × 8.4\r\n   = 1/6 × 84        （166 ≈ 1000/6，84 = 6 × 14）\r\n   = 140\r\n   → +8.5%  → 约 152\r\n```\r\n\r\n> 「这个增速是负的 8.5%，这个现期是 1643。如果你在学了提前修正之后，你看到应该脑海里面先想的是：如果我直接拿现期去乘这个增速，你会去这么做吧？应该是 164 保留三位去乘一个 85，对不对？那这个时候如果你觉得这个位数太多了怎么办？你需要给他们某个人是不是去**补个百分之八点五左右**？给谁补 8.5 比较合适呢？是不是他？」\r\n> 「你算这个东西的时候，你补这个误差的时候，你不用算的特别准，因为它本身就是影响比较小的东西，你大概估一估，88 是不是 64，加个零，加个 6.4，是不是基本上就能凑到**九十多一点**？所以直接 **164 乘 9**，错位相减，六，然后这边的话就七，然后这个地方就是借了一次，**147.6**。这样子相对来说比较快，但是肯定还是有点误差的。」\r\n> 「但你也能选出来吧，你也能知道肯定选哪个，**是不是肯定就要选 A**？因为你刚刚把这个 8.5 变成 9 的时候，它是没有涨那么多的……这个地方属于那种**相对没有那么特别适合去调的**，因为它补上去之后还有点误差。」\r\n> ⭐「那这个题目你还能怎么做呢？就需要一点点**数字敏感度**了。你有没有注意到 164？他其实还是挺靠近 166 的。那把它变成 **166**。右边我们能不能也顺手变一下呢？**这边加个 2，这边减个 1**。这样是不是就好算了？**84 正好是 6 的 14 倍，除以 6 就是 14**。这样你算下来一个现期的增长就 **140**。然后这个结果它是**偏小 8.5%** 的，你再把这个 8.5% 给它补回去。140 的 8.5% 大概就是 10 几吧，加了大概十一二的样子，加起来变成 **152**。反正基本上误差没多少了。」\r\n> ⭐「所以也**不是说什么时候都是去修那个增速，或者说修现期都更有优势的，你也要看情况的。有时候它的现期乘以这个增速本身就已经比较好算的时候，也就先算了再说。**」\r\n\r\n**【选项原文】**\r\n\r\n- A. 152.7\r\n- B. 161.2\r\n- C. 158.9\r\n- D. 163.5\r\n\r\n**【答案】** ✅ A（板画面上 A.152.7 处打 ✓ 并划线）\r\n\r\n⚠️ **陷阱类型**：**方向陷阱**（负增速要往上补）+ **近似陷阱**。\r\n\r\n---\r\n\r\n### 第 13 题｜2019 年前三季度某省规模以上工业企业利润总额（负增速求基期）\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2019 年前三季度，某省规模以上工业企业利润总额 965.9 亿元，同比下降 7.4%。\r\n> 2018 年前三季度，该省规模以上工业企业实现利润总额约为（ ）亿元。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2019 年前三季度（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 某省规模以上工业企业利润总额 | 965.9 亿元 | −7.4% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 负增速，问 2018 年（**基期**）→ 仍先算**减少量**，再加回 |\r\n| 列式 | `|∆| ≈ 现期 × r`；`基期 = 现期 + |∆|` |\r\n| 速算（提前修正） | `965.9 → 960`（≈−0.6%），`7.4% → 8`（≈+8%）；`960 × 8 = 768` → **76.8** |\r\n| 另一写法 | `965.9 → 1000`（上调），`1000 × 7.4% = 74` → 740 分之几，即 74.0 |\r\n| 结论 | `965.9 + 76.8 = 1042.7 ≈ 1043.1` → 选 C |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n板书：  基  小 7.4%        ← 负增速、要往上补\r\n        965.9 下方写 1000\r\n\r\n（965）×（7.9%）           ← 初写，划掉\r\n      ↓\r\n（960）×（8）              ← 提前修正：两边同时凑整\r\n\r\n        96\r\n      ×  8\r\n      ----\r\n       768        → 76.8\r\n\r\n965.9 + 76.8 = 1042.7   ≈  1043.1\r\n```\r\n\r\n> 「965.9 乘以这个负的增速负 7.4%，增量我们怎么列式子？**直接乘嘛，三位数乘两位数有点烦**。它反而是**偏小 7.4%**，对不对？你如果直接乘会偏小百分之七点四，你需要往上去补。」\r\n> 「为什么会偏小？因为你是拿一个比真实的基期要小百分之七点四的现期代替它去算的，所以这个式子结果肯定也会偏小百分之七点四。那我往上涨百分之七点四吧。」\r\n> 「你是选择把它算完了得到结果再涨百分之七点四，还是我提前先涨？**提前涨嘛**，因为他们这两个其实你不管找哪个去涨百分之七点四，左边这个不太好，**右边这个涨百分之七点四比较合理一点**。左边这个涨百分之七点四的话，一千出头，因为你肯定想把它凑了、要把它凑成一千，对不对？九百六十五跟一千只差百分之三点几，不太够。那么你把 **7.4 凑成 8**，是不是就差不多了？」\r\n> 「**7 乘 7 是 49，起码加 0.5，基本上就到 8 了**。所以直接怎么样？对，**960 乘 8**。写 965×8 的同学还是稍微有那么一点点不太灵活 —— 你干脆直接把这个 7.9 几写成 8，把它调大一点，那顺带着把这 965 调小一点，**你位数又少了，还准了**，是不是就非常好？」\r\n> 「所以它的减少量是 **76.8**，把它往上一加，**1042.7**。你看这么做是不是**又快而且还准**？因为你的计算对象是增量，它本身对于这个基期来说就是一个很小的东西，所以这样子你如果还严谨一点，把它调了误差就会非常准。」\r\n> 「那能不能去修这个现期呢？其实也可以，又把它当做一千。**1000 × 7.4%**，那它的增量不就是 74 多一点吗？那我 965.9 就 966 加 74 多一点，就是 1039 点多，**那 C 也能出来**。也是可以的。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 899.3\r\n- B. 965.9\r\n- C. 1043.1\r\n- D. 1066.3\r\n\r\n**【答案】** ✅ C（板书 C.1043.1 处划线）\r\n\r\n⚠️ **陷阱类型**：**概念陷阱**（负增速问基期，应该「往上加」而不是「往下减」）+ **近似陷阱**（A.899.3 是「现期直接减一个大致量」的错误方向）。\r\n\r\n---\r\n\r\n### 第 14 题｜老师口述的练手题（21754×2.04% 与 2116×5.1%）\r\n\r\n**【题干原文（板书）】**\r\n\r\n> 现期 21754，增速 2.04%   →   增量 ≈ ？\r\n> 现期 2116，增速 5.1%     →   增量 ≈ ？\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n① 现期 21754，增速 2.04%\r\n   增量 ≈ 217 × 2 = 434        （把 2.04% 凑成 2%，217.54 → 217）\r\n\r\n② 现期 2116，增速 5.1%\r\n   增量 ≈ 2000 × 5.1             （把 2116 减 5 个点凑到 2000）\r\n```\r\n\r\n> 「比如像这个题目，你们会怎么写？21754 跟 2.04，你要写它的增量。直接 217 乘 2，**434**。好，下面这个 2116 乘以 5.1% 怎么写？直接 **2000 乘以 5.1**，因为它减 5 个点是更整的，直接给他减 5 个点得了。」\r\n\r\n---\r\n\r\n### 第 15 题｜「增速提前修正举例」表（板书原表）\r\n\r\n> 老师原话：「这些是一些怎么说呢……虽然我个人不是太崇尚去背一些东西，我只是拿这举一些例子。**遇到这些增速的时候，他是比较适合去用这种提前修正的**。」\r\n\r\n**板书原表（画面逐字）**：\r\n\r\n| 增速值 | 调整后 | 增速值 | 调整后 |\r\n| --- | --- | --- | --- |\r\n| 2.05% | 2% | −1.95% | −2% |\r\n| **3.1%** | 3% | **−2.9%** | −3% |\r\n| **4.2%** | 4% | −3.8% | −4% |\r\n| **5.3%** | 5% | −4.7% | −5% |\r\n| 6.4% | 6% | −5.6% | −6% |\r\n| 7.5% | 7% | **−6.5%** | −7% |\r\n| **8.7%** | 8% | −7.4% | −8% |\r\n\r\n（表中加粗项为老师课上重点讲解、并在画面中划线标注的行）\r\n\r\n**用「凑整 + 平方」把 r 直接变成 `r − r²`（老师现场示范，十分关键）**：\r\n\r\n> 「三点一就可以当做三，因为**三三得九**。有同学说，老师你刚刚改这个算的很快，我这个怎么一下子能知道减到这个增速的平方是减多少呢？**你就去背前面这个东西的平方数。**」\r\n\r\n```\r\n① r = 3.1%  →  看成 3.10\r\n   3 × 3 = 9   →  在百分位（.10）上减去 0.09\r\n   3.10 − 0.09 = 3.01   →  写作「301」\r\n\r\n② r = 4.2%  →  看成 4.20\r\n   4 × 4 = 16  →  4.20 − 0.16 = 4.04\r\n\r\n③ r = 5.3%  →  看成 5.30\r\n   5 × 5 = 25  →  5.30 − 0.25 = 5.05\r\n\r\n④ r = 8.7%  →  看成 8.70\r\n   8 × 8 = 64  →  8.70 − 0.64 = 8.06\r\n\r\n⑤ r = −1.95% 靠近 −2%\r\n   2 × 2 = 4   →  −1.95 − 0.04 = −1.99 ≈ −2%\r\n\r\n⑥ r = −2.9% 靠近 −3%\r\n   3 × 3 = 9   →  −2.9 − 0.09 = −2.99 ≈ −3%\r\n\r\n⑦ r = −6.5%\r\n   6 × 6 = 36  →  −6.5 − 0.36 = −6.86（板书写作「−6.5 − 6.86」，上方标「36」）\r\n\r\n⑧ r = −7.5% 靠近 −8%\r\n   8 × 8 = 64  →  −7.5 − 0.64 = −8.14 ≈ −8%\r\n```\r\n\r\n> 「这个 4.2 怎么减掉它的平方呢？4 4 16，你自动地脑补，把后面补成 20−16，**4.04**。这个 5.3，5 5 25，自动脑补成后面是 30−25，**5.05**。等于 8.7，8 8 64，**64−64 得 8.06**。」\r\n> 「比如说有人说这个东西你要不要管？**不用管**，因为本身你这个也不是 8 嘛，你这是 8.7 的平方嘛，我本来当成 8 的平方就已经有点小了，实际上 8.7 的平方是比这个 64 要大一点的。但是我们不用算那么细，因为本身这种算法你哪怕不去修整那个误差，其实误差也很小了，基本上是没有误差的。」\r\n> 「那负的时候，负增速的时候就要记得**往上去涨**。负 1.95，差不多就靠近 2 嘛，**二二得四加个四**，正好 −2。负 2.9，靠近 3，**三三得九**，加个九，−2.99 就负 3。」\r\n> 「我再随便说一个，这 −6.5，**六六三十六**。加起来呢，六八六（即 −6.86），那就差不多快近7了嘛；或者你说负 6.6 当作负 7 肯定也可以。负 7.5，**七八五十六**？不对，749（7×7=49）大概加个 0.5 左右也差不多了。对，**负 7.5 也可以直接到负 8**，有时候这个稍微那么一点点的误差不用太在意。」\r\n\r\n---\r\n\r\n> 📌 **顺序说明**：视频中本节例题的实际讲解顺序为——谷物进口题 → 练手题（21754／2116）→ 「增速提前修正举例」表 → 965.9 基期题 → 供水管道 → 第三产业 → 餐饮 1~2 月 → 「化除为乘 · 练习」七连练。本文为便于复习按题型归类排列，题目内容与解析完整无缺。\r\n\r\n### 第 16 题｜2021 全国城市供水管道长度\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2021 年，全国城市供水总量 673.34 亿立方米，同比增长 6.96%；城市供水管道长度 105.99 万公里，同比增长 5.26%。\r\n> 2021 年全国城市供水管道长度比 2020 年增长约：\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2021 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 全国城市供水总量 | 673.34 亿立方米 | 6.96% |\r\n| **城市供水管道长度** | **105.99 万公里** | **5.26%** |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量**（「比 2020 年增长约」= 增量） |\r\n| 列式 | `∆ ≈ 现期 × r`，写了两个方案 |\r\n| 方案 A（调现期） | `106 → 100`（减约 5.7%），`100 × 5.26% = 5.26` |\r\n| 方案 B（调增速） | `5.26% → 5%`，`106 × 5% = 5.3` |\r\n| 结论 | 两方案都指向 5.3 —— 选 **B** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n板书：106 × 5.26  −5.26%\r\n\r\n方案A：调限期\r\n   106 → 100 （向下凑整，约减 5.7%）\r\n   100 × 5.26 = 5.26\r\n\r\n方案B：调增速\r\n   5.26% → 5%\r\n   106 × 5% = 5.3\r\n```\r\n\r\n> 「首先触发一下你的底层代码，你看到这个增速比较小了。他不管是问你增量还是问你基期，你都直接先化除为乘，脑海里面的一个式子就是**现期乘以增速**。106 乘以 5.26，它是一个比较靠近实际增长的一个值，但只是说它会偏大，偏大一个 5.26%，你需要在它的基础上减掉这么多才会相对比较准。」\r\n> 「你是把它先算出来之后再减呢，还是先减了再算呢？那你如果先算的话，就是个三位数，三位数不那么好算。直接怎么样？**两种办法**：一种你**调现期**，因为发现这 106，如果你把它向下凑整凑成 100，正好差不多吧，你减五个多点，是不是差不多？`100 × 5.26 = 5.26`。一种你会发现增速好像也可以，5.26 把它减五个点，五五二十五，`106 × 5% = 5.3`。是不是还是 B？」\r\n> ⭐「**就这种方法，它是非常通用的，只要你的增速比较低，都是这么用，都是这么做，很统一。你只要看到增速低，你就去这么想。**」\r\n> ⚠️「为什么调现期误差更大一点？因为这个地方你减的肯定不止百分之五，**你减了将近百分之六了**，你是减了百分之六下来，差不多才会有这么多的。你只应该减百分之五，那你减多了，不就导致结果变小了那么一点点吗？」\r\n\r\n**【选项原文】**\r\n\r\n- A. 5 万公里\r\n- B. 5.3 万公里\r\n- C. 5.6 万公里\r\n- D. 6 万公里\r\n\r\n**【答案】** ✅ B（板书 B.5.3 处画 ✓）\r\n\r\n---\r\n\r\n### 第 17 题｜2018 全国第三产业增加值\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2018 年我国国内生产总值 90.03 万亿元，按可比价格计算，比上年增长 6.6%，实现了 6.5% 左右的预期发展目标。分产业看，第一产业增加值 6.47 万亿元，比上年增长 3.5%；第二产业增加值 36.60 万亿元，增长 5.8%；第三产业增加值 46.96 万亿元，增长 7.6%。\r\n> 2018 年我国第三产业增加值同比约增加了：\r\n\r\n**【材料数据】**\r\n\r\n| 产业 | 2018 年增加值 | 增速 |\r\n| --- | --- | --- |\r\n| 国内生产总值 | 90.03 万亿元 | 6.6%（预期目标 6.5% 左右） |\r\n| 第一产业 | 6.47 万亿元 | 3.5% |\r\n| 第二产业 | 36.60 万亿元 | 5.8% |\r\n| **第三产业** | **46.96 万亿元** | **7.6%** |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量** |\r\n| 列式 | `∆ ≈ 现期 × (r − r²) ≈ 47 × 7` |\r\n| 速算 | `47 × 7 = 329` → 3.29 万亿元 |\r\n| 结论 | 选 **3.3 万亿元** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n47 × 7\r\n      47\r\n    ×  7\r\n    ----\r\n     329        → 3.29  ≈ 3.3（万亿元）\r\n```\r\n\r\n> 「继续第三产业增量。第三产业，现在直接告诉我，你脑海中是什么式子？是什么乘什么？现期 46.96，增速 7.6%。直接 **47 乘以 7**。」\r\n> ⭐「因为你如果直接乘，你反正后面还要再去调个七点六下去，那我干碎把这个百分之七点六**把它的零点六去掉**，七七四十九减个大概零点五左右（即 `r − r² ≈ 7%`），那么百分之零点一了，无所谓了。」\r\n> ⭐「这个办法他有一个非常明显的优点，就是**他不光准、不光快，他还很灵活**，有没有感觉到？是不是特别灵活？**你在现期上可以调，在增速上也能调，在结果上都能调，你想怎么做就怎么做**，你只要最终的误差合起来是正确的就可以了，方向是对的就可以了。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 1.3 万亿元\r\n- B. 3.8 万亿元\r\n- C. 2.9 万亿元\r\n- D. 3.3 万亿元\r\n\r\n**【答案】** ✅ D（板画面上 D.3.3 万亿元处划线，旁写红字「**灵活**」）\r\n\r\n---\r\n\r\n### 第 18 题｜2024 年 1~2 月 C 市餐饮收入同比增量（两边同时调）\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 按消费形态分，2024 年 1~3 月份，C 市全市餐饮收入 443.7 亿元，同比增长 9.1%，其中，3 月份全市餐饮收入 164.7 亿元，同比增长 9.5%。\r\n> 2024 年 1~2 月，C 市餐饮收入的同比增长量约为（ ）亿元。\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 数值 | 同比增速 |\r\n| --- | --- | --- |\r\n| 2024 年 1~3 月 全市餐饮收入 | 443.7 亿元 | 9.1% |\r\n| 其中：3 月份全市餐饮收入 | 164.7 亿元 | 9.5% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 1~2 月 = 1~3 月 − 3 月（**增量的差**） |\r\n| 列式 | `∆(1~2月) = ∆(1~3月) − ∆(3月)` |\r\n| ① 1~3 月增量 | `443.7` 先减约 9 个点（四九三十六，减个三十多，四百一左右）→ 约 410；`410 × 9.1 ≈ 373` → **37.3**（另一半：`400 × 9.1% = 36.4`） |\r\n| ② 3 月增量 | `164.7 → 150`（提前减约 9%），`150 × 9.5% = 14.25` → **14.3** |\r\n| 结论 | `37.3 − 14.3 = 23` → 选 **C** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n∆(1~3月)：  41 × 9.1\r\n                41\r\n              × 91\r\n              ----\r\n              3690\r\n                41\r\n              ----\r\n              3731      → 37.3\r\n（胆大版：400 × 9.1% = 36.4）\r\n\r\n∆(3月)：    164.7 → 150\r\n            150 × 9.5 = 14.25  → 14.3\r\n                9.5\r\n              × 1.5\r\n              ----\r\n               47.5\r\n                9.5\r\n              ----\r\n              14.25\r\n\r\n∆(1~2月) = 37.3 − 14.3 = 23\r\n```\r\n\r\n**【老师给出的第二种做法（两边同时修正）】**\r\n\r\n```\r\n9.5 → 9   （给对方减 6 个点）\r\n164.7 → 160（这边再减 3 个点）\r\n160 × 9 = 14.4    ≈ 14.3\r\n```\r\n\r\n> 「有时候你也可以有一种做法，就是稍微的胆子再大一点，我觉得乘 9.5 还是比较烦的。我可以把这个东西就是**两边同时修正**……因为你只是要让这个乘法的式子在结果上小掉百分之九点五，那我可以两边把这个百分之九点五**分掉**。我 9.5 我就按 9 来算，这时候大概给他减了 6 个点左右；那这边我再给你减 3 个点左右，16 的 3 倍是 48（即 164.7→160 约减 3%），正好吧，差不多。这样子的吧，14.4、14.25，你看基本上也是没什么误差的。」\r\n> ⚠️「这个方法**局限性就是你要调两次，可能会有点烦**。但可能你到后期你对这个百分比这个感觉比较强的时候，可能脑海中就直接爆出来了，就是一个十六乘以九一四四（160×9=14.4），就会更快。但这个呢就是对你整体的这种百分比的一个误差要求比较高。\r\n> **所以初期的时候，我建议大家还是就只调一边**，你调两边，我怕你真的把控不住、把控不准。」\r\n\r\n**【老师给出的第三种做法（先算再在结果上放缩）】**\r\n\r\n> 「有同学刚刚说了个想法，我觉得也挺好的。他问：为什么 44 乘 9 不行？怎么不行？这不就直接算了，结果再去调嘛！」\r\n> 「就算这个增量的时候，我就直接 **44 乘以 9**，为什么是 44 乘以 9 呢？因为 44 我发现它正好是 **4/9**，`4/9 × 9` 就是 4，所以我直接乘的话就是 **40**。那这个结果它是**偏大百分之九**的，再把 9 的百分之九 3.6 减掉，算成 **36.4** 的增量也没问题。」\r\n> 「这里算成增量是 **14.2** 左右，减个 14.2 等于 **22.2**。也可以算出来，没有问题。这就是**先算嘛，先大概有一点那种乘法放缩的意思，把一个变大，一个变小，这样一乘**。这个就需要一点数感了，就能感觉到这边正好有 4/9，后面正好有个 9，这样把它们一乘，好像就完美。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 35.2\r\n- B. 30.1\r\n- C. 22.7\r\n- D. 15.3\r\n\r\n**【答案】** ✅ C\r\n\r\n**【解析】**\r\n\r\n> 「他问一到二月份的增量。他给的是一到三月份的值和三月份的值，咋算呢？这个账等于啥呢？**这不就等于一到三月份的增量减掉三月份的增量吗？**因为你整个三个月的增量不就是由这三个月合起来的吗？那一到二的加上三的不就是一到三的吗？那我们就分别把他们俩的增量算出来，然后去做个差就好了。」\r\n> ⭐「这两个增速都是比较小的增速，我们怎么去处理呢？肯定都是用**化除为乘**，因为它的增速符合在百分之十以内的条件。**我们看到这样的增速，就会有条件反射、肌肉反射地去用化除为乘，你这样才能快啊。我看到它，我就想到化除为乘，我不需要思考。**」\r\n\r\n⚠️ **陷阱类型**：**范围/时间陷阱**（必须用「1~3 月 − 3 月」，不能直接用 1~3 月）。\r\n\r\n---\r\n\r\n### 第 19 题｜「化除为乘 · 练习」七连练（板书原题 + 答案）\r\n\r\n**【题干原文（板书原表）】**\r\n\r\n| # | 题干 | 选项 | 速算（板书） | 答案 |\r\n| --- | --- | --- | --- | --- |\r\n| 1 | 现期 869.5，增速 4.8% | A.60　B.50　C.40　D.30 | `800 × 5%` = 40 | ✅ **C.40** |\r\n| 2 | 现期 2953，增速 −0.6% | A.−12.1　B.−17.8　C.−24.7　D.−15.1 | `30 × 6 = 18` | ✅ **B.−17.8** |\r\n| 3 | 现期 1583，增速 −2% | A.−50.2　B.−32.3　C.−44.6　D.−16.8 | `16 × 2 = 32` | ✅ **B.−32.3** |\r\n| 4 | 现期 1774，增速 4.2% | A.37.5　B.71.5　C.94.6　D.84.1 | `18 × 4 = 72` | ✅ **B.71.5** |\r\n| 5 | 现期 9813，增速 −4.3% | A.−440.9　B.−368.9　C.−652.6　D.−598.2 | `10000 × 4.3` | ✅ **A.−440.9** |\r\n| 6 | 现期 6116，增速 −8.4% | A.−372.0　B.−560.9　C.−813.2　D.−734.7 | `6000 × 9%`（负增速要往上补） | ✅ **B.−560.9** |\r\n| 7 | 现期 6586，增速 4.9% | A.257.4　B.130.7　C.307.6　D.464.5 | `6600 × 4.9%` / `6000 × 5%` | ✅ **C.307.6** |\r\n\r\n**【老师逐题点评（转写原话）】**\r\n\r\n> 「第一个这个你会怎么算？866.5（即 869.5）乘以 4.8%。你为什么 73 乘 5？你也真是不嫌麻烦。这个我也不知道你这 73 怎么搞出来的，又说整吧，又不够整，说快吧，我觉得好像也不够快。**你直接八百乘五不就得了吗？**你看看选项，你不觉得这个选项差距对于你这种资料来说已经很大了吗？还写 87×5 的，你这个 87×5 就太离谱了啊！**你把两个全变大了**是什么意思？化除为乘，你**增速大于零的时候，你这个直接乘，结果是偏大的，你要往下调的**，你怎么能往上调呢？」\r\n> 「也可以往下调。那我像我这 800 跟 5 是怎么来的呢？就类似于我先给这个 869，我先给他减大概百分之五左右。但我发现减 5% 不够，他明显你把 869 变成 800，这个差距是不止 5% 的。那怎么办？我减多了怎么办？我把 4.8% 再补上去一点呗。而且本身为什么呢？就是你动的也比较小，误差就小。那在很多正常误差的题目里面，这么一点点误差，很多时候是无所谓的，**你就直接八百乘以五就好了，不用算那么准**。」\r\n> 「接着继续这个地方怎么算？对，这**三十乘六**，18 走了。」\r\n> 「现在 **16 乘 2**，32，可以走了。」\r\n> 「再来对直接 **18 × 4**，以凑整这种小增速的，化除为乘**优先凑整**。剩下的误差，只要你方向上不是太离谱，都是可以的。72 一走了。它肯定会偏高一点点的，因为本身我这个 4.2 到 4 就已经把误差调掉了。然后你把这个 1774 变成 18，这个主要是为了算得快。**凑整是我们的最终目的，是我们的最核心的目的，是为了好算。**」\r\n> 「这个地方，现在能不能告诉我，就是两秒钟，你看到这个东西，再看到选项，能不能两秒钟告诉我选哪个？你现在应该是甚至都不用动笔了吧。对，直接他不就是个**一万左右乘个四点三**嘛，你其他的也离得太远了吧。」\r\n> 「下面再来，是什么？以凑整为核心目的，**一切都可以为整数让步**。有些东西你可能说它并不是能够凑到那么整的，可能有一点点误差，你先记着那个误差，你后面可以再去调，在结果上再去修正。对，直接 **6000 乘以 −9%**，B 走了。这是把这个增速给它修正上去了，给增速去补了个 4.8%（8.4→9），因为它是**负增速，所以要往上涨，要把它变大**。」\r\n> 「就这个是怎么算？直接 **6000 乘以 5%**。我们直接把它的现期减少 5% 左右，减到 6000 不够减、减多了，那没事，我把增量增速再顺便调上一点嘛，调 5% 不就好了吗？**有的人说负增度变大，结果不是小了吗？不是，我说这个变大是绝对值变大**，我刚刚强调了的，我说的这个变大变小都是绝对值。」\r\n> ⭐「**我们的目的是为让它更整，而不是为了让它更准，是为了整，不是为了准。这两个虽然读音很接近，但是千万不要搞错了。**」（板书圈注「**整**」「**准**」二字）\r\n\r\n---\r\n\r\n### 4.3 ⛔ 反面典型：本末倒置\r\n\r\n**板书（红字标注）**：\r\n\r\n```\r\n4600 × 4.2%\r\n       ↓（有人这样「提前修正」）\r\n4.2² = 17.64  →  4.2% − 0.1764% = 4.0236%\r\n       ↓\r\n4600 × 4.0236 = 185.1\r\n\r\n板书旁红字：本末倒置\r\n```\r\n\r\n> ⚠️「我这个地方为什么把这个部分圈起来呢？我也怕有些同学会算得太**死板**了。他比如说拿刚刚的例子，4600、4.2%。他说我提前修正嘛，我把这个东西误差给他修正掉，我就把这 4.2 去凑到靠近 4。他说 4.2 的平方，4 2 4 2，16 17 64，减个 0.1764，哦是 4.0236。4600 乘以 4.0236 —— **能不能这么做？不能这么做！**你这么做肯定比我直接写 4% 要准，但是你**本末倒置**了，这种就叫本末倒置。」\r\n> ⭐「我们今天学的，你想想看，我们的**标题叫什么？快速估算。**我们是结合了这个增速比较小的特点，拿现期代理基期去乘增速，本身误差就小，你还去做个修正，误差只是小之又小。你要是再做这种事情，这真是浪费时间了。」\r\n> ⭐「我们这么做学这些方法就是**为了快**，它最明显的特点就是快；它还有个优点，就是**在快的同时也够准了**，真的够准了。它本身你瞎估估，本身就没有多少误差的。**一定要快，一定要够准，千万不要去把这个东西搞得太精确了，没有任何意义。**」\r\n\r\n> （板书在「快」与「够准了」两个红字旁标出；随后老师说「大家稍微休息五分钟，待会儿我们 8:38 再接着上课」，画面切回「快速估算」封面页。）\r\n\r\n---\r\n\r\n## 五、份数思想（百化分）\r\n\r\n> 老师下半场开场：\r\n> 「刚刚一个同学问：那增速比 10% 大怎么办呢？哎，老师，你刚讲了这么多，全是增速小于 10% 的情况。那我就要说了，**增速大于 10% 的时候，我们当然还有另一套思路、还有另一套办法**，就是我们下面讲的**份数思想**。」\r\n> 「份数思想主要就是去应对那些**增速的绝对值大于百分之十**的时候，我们怎么去做一个快速的估算。」\r\n> 「什么是份数思想呢？就是**当这个增速它比较特殊，它正好在一个整数的倒数、也就是我们常说的百化分附近的时候，我们可以把这个基期拆成一份一份的**。」\r\n\r\n### 5.1 公式推导：为什么除以 (n+1)\r\n\r\n**板书原公式（「份数思想」页）**：\r\n\r\n```\r\n若 r = 1/n\r\n\r\n         现期      1     现期      1     现期    n     1     现期\r\n∆ = ───────── × ─── = ───────── × ─── = ──── × ───── × ─── = ─────\r\n       1 + 1/n    n     (n+1)/n     n    n + 1    n     n    n + 1\r\n```\r\n\r\n**课件配图（两张饼图）**：左图标注「**基期**」（n 份 + 拉出 1 份），右图标注「**现期**」（n+1 份）。\r\n\r\n**板书手写（红笔）**：\r\n\r\n```\r\nr = 16.7% = 1/6          （箭头指向「∆」，并标注「基」）\r\n6 基 + 1 ∆ = 7 现\r\n```\r\n\r\n> 「我们拿一个比较基本的例子来说，你们看下面这个图，我们这个增速如果它是个 **16.7%**。16.7% 是我们以前背过的吧？它是一个**六分之一**，对不对？」\r\n> 「增速的含义是什么？**增速是增量在基期中的比例**。那我们能不能对应的把这个**基期看作六份**，**增量看作一份**，是不是可以？就把这个基期，我不管你的基期是多少，我就统一地、平均地把你分成六份。然后我增加了这个基期的六分之一，把这六个里面去增加了一个，这个就是新增的一个增量。对不对？」\r\n> 「那现期变成多少了？是不是变成**七份**了？6 份的基期加上 1 份的这个增量，我们就能得到 7 份的一个现期。」\r\n> ⭐「所以我们可以根据这样的一个比例关系、这样一个份数思想，我们就能直接得到**增量和现期之间的一个比例关系**。我们就是借助这个增速它这种整数的性质，去把这个基期拆成了对应的一个份数，然后让这个增量和现期之间的比例关系变得一个更清楚。」\r\n> 「这边还有一个公式的推导，你看，如果增速是 n 分之一，那增量它不就等于 `现期 ÷ (1 + 1/n) × (1/n)` 嘛。我们把这式子转化一下，把分母上这个 `1 + 1/n` 先加起来变成 `(n+1)/n`，然后把它再挪一下——因为你现期除这个东西就等于乘这个东西的倒数，对不对？除 `(n+1)/n` 就等于乘以 `n/(n+1)`，那和你刚刚在乘的外面这个乘的这个增速（`1/n`）就可以抵消掉，就会变成**现期除以 n+1**。」\r\n\r\n### 5.2 各种增速情形（板书逐步演算）\r\n\r\n**① 正增速、几分之一**\r\n\r\n```\r\nr = 1/4  →  基 4 + 1∆ = 现 5     →  ∆ = 现 ÷ 5\r\nr = 1/7  →  基 7 + 1∆ = 现 8     →  ∆ = 现 ÷ 8\r\nr = 1/6  →  基 6 + 1∆ = 现 7     →  ∆ = 现 ÷ 7\r\n```\r\n\r\n> 「如果增速等于四分之一，我问你增量是现期除以几？**除以五**。为什么是除以五呢？因为基期我们看成了几份？看成了四份，增量是它的一份，这样子才会有一个四分之一的比例关系；四份加一份变成了现期里的 5 份，所以**增量是现期的 1/5**。」\r\n> 「如果增速是比如七分之一呢？1/7 就是 **7 份加了一份变成 8 份**，增量就是**现期除以八**。」\r\n\r\n**② 负增速**\r\n\r\n```\r\nr = −1/10  →  10 − 1 = 9      →  ∆ = − 现 ÷ 9\r\n```\r\n\r\n> 「如果增成负的呢？它如果增到负的十分之一怎么办？不要怕，你还是去想，负十分之一相当于什么？**从十份里面减了一份**，10 份减了一份变成 9 份，所以增量就等于现期除以 9。」\r\n> ⚠️「但要注意，这个地方**不是增量，是变化量**，是现期除以 9。如果是增量的话，就要加个负号了。」\r\n> 「或者你可以这么想，它是负十分之一，对不对？我们这个公式是什么？是给这现期除以 n+1，那个负十加一是多少？负九嘛！所以就是现期除以九。**不管它是正负，你都在它上面加个一**。这个时候你就注意是它的值了，**往上加个一：负 3 就变成 −2，4 就变成 5，7 就变成 8**。」\r\n\r\n**③ 不是几分之一：r = 2/3**\r\n\r\n```\r\nr = 2/3  →  基 3 + 2∆ = 现 5      →  ∆ = 现 × 2/5\r\nr = −2/7 →  7 − 2 = 5             →  ∆ = − 现 × 2/5\r\n```\r\n\r\n> 「如果增速是比如说三分之二怎么办？现在不是这个几分之一了，它还满足这个关系吗？**本质原理都还是这种份数思想**。什么叫三分之二？就是我在三份的基期上加了**两份**，变成现期的**五份**。增量是基期的 2/3，所以**增量是现期的 2/5**，就要乘一个五分之二。」\r\n> 「如果增速是个负的，比如说七分之二怎么搞？下面这个分母就是 7 份减了 2 份变成 **5 份**，这个增量就是**现期乘以负的五分之二**。」\r\n> ⭐「**抓准这个关系：基期、增量、现期，然后看增量是现期的多少分之一、几分之几。**」\r\n\r\n### 5.3 常用 1/n 表（板书原表，标题「常用 1/n 表」）\r\n\r\n| 增速 | 对应 1/n | 增量占现期比例 | 分母值 | 对应 1/n | 增量占现期比例 |\r\n| --- | --- | --- | --- | --- | --- |\r\n| 50% | 1/2 | 1/3 | 12.5% | 1/8 | 1/9 |\r\n| 33.3% | 1/3 | 1/4 | 11.1% | 1/9 | 1/10 |\r\n| 25.0% | 1/4 | 1/5 | 10% | 1/10 | 1/11 |\r\n| 20.0% | 1/5 | 1/6 | 28.6% | 2/7 | 2/9 |\r\n| 16.7% | 1/6 | 1/7 | 40% | 2/5 | 2/7 |\r\n| 14.3% | 1/7 | 1/8 | 66.7% | 2/3 | 2/5 |\r\n\r\n> 注：原表第三行右侧在课件上显示为 `aa.a%`、`a/9`、`a/(9+a)`（占位符），老师现场**在黑板上补写了「10%　1/10」**，即该行应为 10% → 1/10 → 分母值 11 → 增量占现期比例 1/11。\r\n> 板画面上另加注：`14.3% = 1/7`、`10% = 1/10`、`−12.5% = −1/8`、`−14.3% = −1/7`、`2 − 1 = 1`（即 r = −50% 时 2 份 − 1 份 = 1 份，减少量 = 现期）。板画面上被圈注的重点项：`1/2`、`11.1%`、`2/7`、`40%`、`66.7%`。\r\n\r\n### 5.4 该背什么、不该背什么（老师原话）\r\n\r\n> ⭐「一般我只建议大家把这个二分之一对应的百分之五十，你一直背到像九分之一、十分之一这边。其实这里还要再补个十分之一的，我再补一个**十分之一（10%）**。**从二分之一、二、三、四、五、六、七、八、九、十来记住这几个**。」\r\n> 「然后剩下的就是有一些特殊的，比如说**百分之二十八点六、百分之四十、百分之六十六点七**，他们相对来说少一点。因为一般资料分析，它还是结合实际出的题目，都是现实生活中的数据，很少有一些增速比较大的，一般都增速不会特别大。」\r\n> ⭐「**所以我建议大家是把这种百分之十几的一定要给我记熟一点。**看看能不能记熟，看到这些数的时候能不能有感觉，看到这增速的时候能不能立刻反应过来——看到这个 **14.3%** 的时候，要能立刻反应过来就是个 **1/7**。只要背这么多，其他的不用太背。」\r\n\r\n**❌ 不需要背的**\r\n\r\n> 「有些同学说那种百分之个位数的增速，我需不需要背？比如说昨天就说过一个什么十七分之一，我看是多少啊？我自己因为没有背，我也不知道。比如说百分之五点九，我知道百分之五点九，像有的同学他去背什么，说这是个十七分之一，所以增量等于现期除以十八。这人我知道有点背，但我实话实说，**我觉得没什么用**。因为 5.9%，我们可以直接**化除为乘**。」\r\n> 「比如说如果它的增量，我随便说个就 4000（现期 4000）。我干嘛要出什么 18 呀？他的增量不就是 `4000 × 5.9% = 236`，**24 左右**吗？24 小一点嘛，减 5% 就是 **23** 呗。**化除为乘不比这个什么分数法除什么两位数快多了嘛！**（板书：`4000 / 240`，并把 `∆ = 现/18` 划掉）」\r\n> ⭐「所以这种什么十七分之一、十八分之一、十九分之一，这些东西**没有任何意义，没有用，浪费时间**。增速小于 10，我们有更快更准的办法，就是**化除为乘**。你本身这个增幅就这么小了，你直接拿现期乘它就已经是误差很小的事情了，你不要再去把它转换成什么多位数的除法了，本身乘就是一件很简单的事情。」\r\n\r\n**❌ 也不要背 13 分之一、14 分之一**\r\n\r\n> 「那个什么**十三分之一、十四分之一不用背**，因为那个十三分之一、十四分之一它对应的那个增速就在那个**化除为乘的那个范围内**。」\r\n> ⭐⭐「**你不要让你的方法打架！**那不然的话你下次遇到一个比如说这个什么十三分之一，一除十三这个东西就大概是百分之七点七。你要去想：我是用化除为乘呢，还是用分数法呢？这个地方到底哪个更合适呢？**那你想完了，我话说一声，我都算完了。**能明白吗？」\r\n> ⭐⭐「**我让你算的是什么？增量、基期。这些方法我是有非常明确的一个、很明显的、很准确、不交叉、不打架的边界：0 到 10 就是化除为乘，10 以上靠近百化分就用百化分。**明白吗？你这样就养成一个条件反射、一个肌肉记忆，你这样就会快。**计算往往不是那么难的事情。**」\r\n\r\n### 5.5 常用百化分速查（板书补充的口诀，老师口述）\r\n\r\n| 增速 | 对应分数 | 增量 = 现期 × ？ | 老师板书 |\r\n| --- | --- | --- | --- |\r\n| 12.5% | 1/8 | 现期 ÷ 9 | `12.5% = 1/8` |\r\n| 11.1% | 1/9 | 现期 ÷ 10 | `11.1% = 1/9` |\r\n| 10% | 1/10 | 现期 ÷ 11 | `10% = 1/10` |\r\n| 9.1% | 1/11 | 现期 ÷ 12 | — |\r\n| 8.3% | 1/12 | 现期 ÷ 13 | — |\r\n| 7.1% | 1/14 | 现期 ÷ 15 | 板书圈注 `7.1%` |\r\n| 6.7% | 1/15 | 现期 ÷ 16 | — |\r\n| 5.9% | 1/17 | （**不背**，用化除为乘） | 板书 `5.9% = 1/17` 并划掉 `∆ = 现/18` |\r\n| 44.4% | 4/9 | 现期 × 4/13 | 板书 `44.4% = 4/9` → `∆ = 现 × 4/13` |\r\n\r\n> 「44.4% 什么意思呢？就比如说百分之四十四点四，它就是**四个百分之十一点一**，就是**九分之四**。那它相当于**九份的基期加了四份的增量，变成了十三份**，所以增量是现期的 **4/13**。」\r\n> 「这对这种下面的几种相对来说少见，有的时候万一用得上。」\r\n> 「**负的也是对应**，比如负的百分之十二点五，那不就是**负八分之一**嘛，相对应的；负的百分之十四点三就是**负七分之一**；负的百分之五十，那不就是**负二分之一**嘛，只是后面这个对应的现期的比例会做一个调整。比如如果你是负百分之五十，负二分之一就是**两份减一份变成一份**，那这时候**减少量就会等于现期**。如果是负的七分之一，那就是 **7 份减 1 份变成 6 份**，变化量就是现期的 **1/6**。」\r\n> 「这个意思也可以说，比如说 13/4 也不好算，那确实不好算，所以我说下面这个你用的比较少、用的不多。」\r\n> ⭐「那比如说百分之二十八点六，有时候你也能用用。这个**七分之二**还是比较好用的，因为它**除九**，除九还是比较好除的。**五分之二**也比较好用，因为五分之二它正好是 **0.4**，你就可以直接看到一个**乘 4**（乘 0.4）就好了。」\r\n\r\n---\r\n\r\n## 六、份数思想例题精讲\r\n\r\n### 第 20 题｜2017 全国科技经费投入总量\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 《2017 年全国科技经费投入统计公报》数据显示，2017 年我国科技经费投入总量为 17606.1 亿元，比上年增长 12.3%。\r\n> 2017 年，我国科技经费投入比上年增加（ ）亿元\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2017 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 全国科技经费投入总量 | 17606.1 亿元 | 12.3% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量**（12.3% > 10%，不用化除为乘） |\r\n| 百化分 | `12.3% ≈ 12.5% = 1/8` → `∆ = 现期 ÷ (8+1) = 现期 ÷ 9` |\r\n| 错位相加 | `176 ÷ 9`：`1760 + 176 = 1936`（除以 9 的错位相加原理） |\r\n| 修正 | 12.3% 比 12.5% 小（把增速调大了），结果偏大 → 再往下调一点点 |\r\n| 结论 | 选 **1928** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n12.3% ≈ 12.5% = 1/8          （板书标注「+2%」）\r\n\r\n             176 × 11      176 × 10 + 176      1760 + 176\r\n∆ = ─────────────── = ───────────────── = ────────────\r\n        9 × 11              99                   99\r\n\r\n       1760\r\n    +   176\r\n    ---------\r\n       1936        → 约 1936\r\n\r\n→ 准确值应该「再下去一点点」→ 1928\r\n```\r\n\r\n> 「现期是 17600，增速是 12.3%，这个增速就是大于 10% 的，**然后不适合用化除为乘**，对吧？那我们怎么办？然后这个增速呢，它就属于是比较靠近百化分的，**只要靠近就行了**，你可以把它就近似的看作百分之十二点五，它就差不多是**八分之一**。所以根据份数思想，增量就应该等于现期除以什么？**除以 9**。」\r\n> 「除以 9 怎么办？**错位相加**。是不是也很快？可以补也可以不补，为什么可以不补呢？因为你本身在这个地方就已经让结果增加了百分之二左右了，你本身这边就已经有一定的误差了，那你刚刚这个地方我再给他补个百分之一，就有点脸皮太厚了吧。你本身就已经给人家多加了百分之二了，**你干嘛不把刚刚这个误差给它减掉呢？所以其实它的准确值，你应该让它再下去一点点，所以选这个 1928**。」\r\n> 「为什么是百分之二，不是零点二？因为我们看的是**比例**啊，他们的差值是百分之零点二，但这个零点二占这个十二点三，是占了大概**百分之二**的。」\r\n> ⭐「**为什么除以 9 可以错位相加？**因为它这样的：除以 9 就有上下同乘个 11，下面是个 **99**，上面是 **176 乘以 10 加个 176**。**99 跟 100 基本上差不多，所以我们就忽略不计**，就会变成 `1760 + 176`，这就叫**错位相加**的原理。这个我们上节课讲过的。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 1302\r\n- B. 1557\r\n- C. 1766\r\n- D. 1928\r\n\r\n**【答案】** ✅ D（板画面上 D.1928 被圈出，左侧写「D」）\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**（C.1766 与「现期×粗糙的百分点」相近，容易误选）+ **误差方向陷阱**（12.3→12.5 是把增速调大，结果要往下修）。\r\n\r\n---\r\n\r\n### 第 21 题｜2017 某市服务业小微样本企业缴纳增值税\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2017 年某市调查总队对全市服务业小微企业的抽样调查显示，2017 年全市服务业小微样本企业缴纳增值税 2.3 亿元，比上年增长 11.6%。\r\n> 2017 年该市服务业小微样本企业缴纳增值税比上年增加：\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2017 年（现期） | 同比增速 |\r\n| --- | --- | --- |\r\n| 缴纳增值税 | 2.3 亿元 | 11.6% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 增速，求**增长量**（11.6% > 10%） |\r\n| 百化分选择 | 11.6% 离 **11.1%（1/9）** 最近（差值 0.5 个百分点）；离 12.5%（1/8）较远（差值 0.9 个百分点） |\r\n| 列式 | `r ≈ 1/9` → `∆ = 现期 ÷ (9+1) = 现期 ÷ 10` |\r\n| 速算 | `2.3 ÷ 10 = 0.23` |\r\n| 修正 | 11.6% 比 11.1% **小** → 结果偏**小** → 取大一点点 |\r\n| 结论 | 选 **0.24** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n9 + 1 = 10\r\n∆ = 2.3 ÷ 10 = 0.23\r\n11.6%  (红圈)      11.1%  →  0.24  ← 取大\r\n                            0.23  ← 粗估\r\n```\r\n\r\n> 「这个 11.6% 是增速，现期是 2.3，对吧？那他问的是什么？问的是增量。这个时候还是一样的，**他不管是算增量还是算基期，大家都是根据它增速的特点去选择计算**。这个增速就是比较靠近百化分的，所以它算增量也好、算基期也罢，你都是应该用**份数法**去算这个东西。」\r\n> 「它的增速等于九分之一嘛，跟**百分之十一点一**相对是最近的一个，只差了百分之零点五，这个是差值；它跟百分之十二点五差的就比较远，差了百分之零点九。所以我把它想成百分之十一点一，大概就九分之一。说明增量就是现期除以几？**增速是九分之一，那基期我们看到九份，增量就是一份；现在就是十份，所以我们直接除以十**。等于 0.23，**所以选择 C.0.24**。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 0.11 亿元\r\n- B. 0.15 亿元\r\n- C. 0.24 亿元\r\n- D. 0.34 亿元\r\n\r\n**【答案】** ✅ C\r\n\r\n⚠️ **陷阱类型**：**近似陷阱**（0.23 ≠ 0.24，但必须按方向往大取）。\r\n\r\n---\r\n\r\n### 第 22 题｜2023 年第二季度末全国跨省联网定点零售药店\r\n\r\n**【题干原文】**（画面逐字）\r\n\r\n> 2023 年第二季度末，全国跨省联网定点零售药店 27.9 万家，环比增长 12.8%。\r\n> 2023 年第二季度末，全国跨省联网定点零售药店环比增加：\r\n\r\n**【材料数据】**\r\n\r\n| 指标 | 2023 年第二季度末（现期） | 环比增速 |\r\n| --- | --- | --- |\r\n| 全国跨省联网定点零售药店 | 27.9 万家 | 12.8% |\r\n\r\n**【解题拆解】**\r\n\r\n| 步骤 | 内容 |\r\n| --- | --- |\r\n| 题型识别 | 已知现期 + 环比增速，求**增量**（12.8% > 10%） |\r\n| 百化分 | `12.8% ≈ 12.5% = 1/8` → `∆ = 27.9 ÷ 9` |\r\n| 速算 | `27.9 ÷ 9 = 3.1`（正好是 9 的倍数，不用错位相加） |\r\n| 第一步判断大小 | 把 12.8 调成 12.5（**调小**）→ 结果**偏小** → 选比 3.1 大的 |\r\n| 结论 | 选 **3.2** |\r\n\r\n**【速算演示（板书逐步抄录）】**\r\n\r\n```\r\n∆ = 27.9 ÷ 9 = 3.1   （偏小）\r\n① 大小\r\n② 若要精确：12.8 → 12.5，少了 0.3\r\n   0.3 / 12.5 = 2.4% ≈ 3%\r\n   3.1 + 3.1 × 3% = 3.1 + 0.09 = 3.19  → 3.2\r\n   （准确：3.1 + 3.1 × 2.4% = 3.1 + 0.072 = 3.17）\r\n\r\n   另一种：用基期补增速差\r\n   基期 ≈ 24.8\r\n   24.8 × 0.3% = 0.074\r\n   3.1 + 0.074 = 3.174  ≈ 3.17\r\n```\r\n\r\n> 「27.9、12.8% 算增量。百分之十二点八就跟我们刚刚的一样的，我们还是看作八分之一，然后我们直接二十七点九除以九。**这个可以直接除，就不用错位相加了**……二十七点九除以九就是**三点一**嘛，因为正好是九的倍数。3.1，那我选个大一点的 **3.2**。」\r\n> 「刚刚要说了，老师，那这个增速它有的时候跟我这个百化分它有距离呀，它不是那么正好的呀，你把这个什么百分之十二点八看成百分之十二点五，它不是有误差吗？那有误差怎么办呢？那这些题目你是能算的，是没有什么太大问题的。那下次有的题目它是选项比较近了、卡在中间呢？那怎么办？那我们来思考一下。」\r\n> 「你看第一题，我们算出来个 1936，是不是比实际值要大？为什么会大呢？**是不是因为我们把 12.3 看成了 12.5？我们把这个增速调大了，那增量肯定就大了。**你大增速对应的增量肯定比小增速对应的增量要大。」\r\n> 「你看，这里又把 11.6 调成了 11.1，是不是增速变小了？**那增量是不是对应也小了？从 0.24 变成了 0.23。**哎，我把这个 12.8 调成了 12.5，是不是调小了？那我的增量是不是也小了？」\r\n> ⭐「所以**最基本的修正误差方向问题，就是跟着你的增速的变化情况去走。你把增速调大了，那你的结果就会调大；你把增速调小了，你的结果就会偏小**。小于零的时候也是一样的，减少的也是一样，那个负增速它的绝对值的影响也是一样的。」\r\n\r\n**【选项原文】**\r\n\r\n- A. 3.2 万家\r\n- B. 3.4 万家\r\n- C. 3.6 万家\r\n- D. 3.8 万家\r\n\r\n**【答案】** ✅ A（板画面上 A.3.2 万家处打 ✓）\r\n\r\n**【老师补充的两个假设选项】**\r\n\r\n```\r\nE. 3.2 万      F. 3.3 万\r\n```\r\n\r\n> 「那如果这边再来个选项 3.3 怎么办？我 3.1 偏小，到底是大到 3.2 还是大到 3.3 呢？这个时候你再去说调这个误差，你看看这个两个增速相差的百分比是多少。`12.8 比 12.5 多多少？多 0.3/12.5`，这时候其实你大概估算也可以，大概**三个点左右**。所以你把这个 3.1 去加个百分之三：`3.1 + 3%×3.1 = 3.1 + 0.09 = 3.19`，所以是 **3.2**。」\r\n> 「当然准确一点来说就是**百分之二点四**，因为下面这个 12.5 它就是 1/8，除以 1/8 等于乘以 8，`0.3 × 8 = 2.4`，准确的话就给它补 2.4，相对准确。然后就给他补 `3.1 × 2.4% = 0.072`，这算应该是 **3.17** 左右。」\r\n\r\n---\r\n\r\n## 6.1 份数思想的修正（两套办法 + 公式证明）\r\n\r\n**板书原页（「份数思想——修正」）**：\r\n\r\n```\r\n① r : 1/n ≈ 实际∆ : 估算∆          ← 老师把这一条提到了第一点\r\n\r\n   r > 1/n，则实际∆ > 估算∆\r\n   r \u003c 1/n，则实际∆ \u003c 估算∆\r\n\r\n② r ≈ 1/n 时，\r\n   实际∆ ≈ 现期/(n+1) + 基期 × ( r − 1/n )\r\n\r\n   实际∆ ≈ 算∆ + 算∆ × [ (r − 1/n) ÷ (1/n) ]\r\n```\r\n\r\n> 「这个地方我跟你们讲，讲义上写的那个稍微有一点点、有一丢丢的出入，稍微就是优化一下吧，**主要听我讲的东西**。就是首先第一个我把这个东西往上面提了，本来它是第二点呢，我还是想着放在第一点上好一点。**因为它是一个更直观的一个感受**：就是你这个**实际增速和百化分增速之间的一个比例**，和你算出来的**实际增量和用百化分算出来的估算增量**，它们之间这个比例是相对来说很接近的、是基本上一致的。」\r\n> ⭐「你们记得把书上这个地方改一下，是**真实增速跟百化分增速的一个比例，约等于实际增量跟拿百化分估算的增量之间的一个比例**。」\r\n> ⭐「以后但凡遇到错位算的时候，**你判断这个答案的时候，先去分析大小，然后再去调比例**。判断大小这个环节是**非常重要的一个环节**，因为你只有这样子先判断大小了，然后你才能往一个方向去，否则你两边都会算，就不知道往哪边调。」\r\n> 「你这个实际是大了还是小了，你至少有一个判断的方向；然后你再去想后面到底是要再大一点还是再小一点。」\r\n\r\n**现场验证（三题对比，板书）**：\r\n\r\n| 题 | 真实增速 | 百化分增速 | 实际增量 | 估算增量 | 增速比例 | 增量比例 |\r\n| --- | --- | --- | --- | --- | --- | --- |\r\n| 科技经费 | 12.3% | 12.5% | （1936，偏大） | — | 12.3/12.5 略小于 1 | 同比例 |\r\n| 增值税 | 11.6% | 11.1% | **0.24** | **0.23** | 11.1/11.6 ≈ 0.957（少约 5%） | 0.23/0.24 ≈ 0.958（少约 5%） |\r\n| 零售药店 | 12.8% | 12.5% | **3.2** | **3.1** | 0.3/12.5 = **2.4%**（≈3%） | 0.1/3.1 ≈ **3%** |\r\n\r\n> 「你们来看一下，11.6 变成 11.1，少了大概多少？是不是少了差不多 5%？你看这增量，是不是也少了大概百分之五不到？**这就是他们之间的一个近似的一个等比关系。**」\r\n> 「再看，百分之十二点八它实际对的量应该是 3.2，我们算的是 12.5% 去算，算了个 3.1，对不对？12.8 跟 12.5 差了个 0.3，大概就是占大概 3% 不到，3% 左右。3.2 跟 3.1 是不是差了个 0.1？是不是也是 3% 左右？**他们这个比例关系是基本上一样的，为什么会这样呢？**」\r\n\r\n**公式证明（板书逐步抄录）**：\r\n\r\n```\r\n∆₁ = 现 ÷ (1 + r₁) × r₁\r\n∆₂ = 现 ÷ (1 + r₂) × r₂\r\n\r\n∆₁     现 × r₁ / (1 + r₁)        r₁/(1 + r₁)        r₁     1 + r₂\r\n─── = ───────────────────── = ───────────────── = ──── × ────────\r\n∆₂     现 × r₂ / (1 + r₂)        r₂/(1 + r₂)        r₂     1 + r₁\r\n      （先把「现」约掉）\r\n\r\n        1 + r₂      1 + 12.5%\r\n   ─────────── = ───────────── = 1.125 / 1.128 ≈ 1  （板书标注：0.3%）\r\n        1 + r₁      1 + 12.8%\r\n```\r\n\r\n> ⭐「**后面这个东西基本上忽略不计了。**为什么可以忽略不计呢？因为你在用百化分的时候，这两个增速肯定是很靠近的。比如说一个是一加百分之十二点五，一个是一加百分之十二点八，就拿上一题来做例子嘛，`1.125 ÷ 1.128`，你说跟一有啥区别呀？是不是基本上没有区别？所以他们俩之间就是一个**近似的等比关系**。」\r\n> ⚠️「当然你要说，我这个百化分，我把什么百分之十七点六，我非要当做个百分之十二点五去做，那这个误差肯定就大了，有几个点，那你这个就有点太夸张了，对吧？**没有人会把这么远的东西拿来去做百化分的。所以只要是正常的做百化分，你说距离肯定很近，那你这个就基本上没有影响。**」\r\n> 「怎么会有这样一个近似的等比关系呢？你想想看，因为增量等于什么？增量它是等于 `现期 ÷ (1+增速) × 增速` 的。好，那这是实际的增量。那我把比如说叫 r₁（实数），另外一个我们用假的百化分算出来的增量是 `现期 ÷ (1+r₂) × r₂`。我们来做一个上下的相除，就会等于……现期跟现期是不是可以先消掉，后面 `r₁/(1+r₁)` 比上 `r₂/(1+r₂)`，稍微再挪一下就是 `r₁/r₂ × (1+r₂)/(1+r₁)`。**那是增量的比值，就是增速的比值。**」\r\n\r\n### 6.2 第二种修正思路（用基期补增速差）\r\n\r\n> 「还有第二种思路，这两种都能去修正，**它们作用是一样的，用哪种看你更习惯哪一种**。这个就是你拿这个实际增量、你拿这个百化分算出来一个现期除以 n+1 之后，如果你要想把它修正成一个实际增量，**你只要再在基期的基础上去补上一个他们的增速差就可以了**。」\r\n> 「我们刚刚不是拿 27.9、12.5% 算出来一个它的增量是 `27.9 ÷ 9 = 3.1` 嘛，好，那如果我觉得不准咋办呢？你看实际增速它是百分之十二点八呀，我要把它变大，对不对？那大多少呢？」\r\n> 「我相当于什么？我把 12.8 变成 12.5，它为什么会变小？因为相同的一个基期，你只乘了 12.5%，你没有乘对应的正确的 12.8%，**所以你要再把这少乘的 0.3% 给它补回来**。那基期是多少呢？这个基期虽然不准，但是会因为增速相对没有那么大，会把这个误差弥补掉。**它的基期大概是 24.8**，再去乘少乘了的这个增速 **0.3%**，就等于 `3.1 + 0.075 = 3.175`。就这样的也可以，这也是一种思考方式。」（板书：`27.9 / 12.5% / 12.8%`；`3.1 + 24.8 × 0.3% = 3.1 + 0.075 = 3.175 ≈ 3.17`）\r\n\r\n### 6.3 负增速的份数思想修正（老师现场举例）\r\n\r\n> 「就比如说我随便举个例子，还拿着这个 **29.7（27.9）** 来说，如果它是一个**负的百分之十点二**的增速。我举一个这种负增速的例子，我们还是用这个**份数**吧。」\r\n\r\n**板导演算**：\r\n\r\n```\r\n27.9 ,  r = −10.2% = −1/10\r\n\r\n10 − 1 = 9\r\n∆ = 27.9 ÷ 9 = 3.1        （这是「减少量」的粗略值）\r\n\r\n实际：27.9 ÷ 0.898 × 0.102 = 3.169 ≈ 3.17   （计算器验算）\r\n```\r\n\r\n> 「他应该等于什么？等于**负的十分之一**，对不对？10 份减 1 份变成 9 份，它的减少量就是**现期的 1/9**。27.9 除以 9 是 3.1，那它的实际减少量是在哪呢？**肯定会比这个 3.1 要大**，因为它的增速是负 10.2。你当做的是负 10%，**你把它的这个增速调小了**。这个时候我们讨论是**绝对值**，绝对值变小了，那你算出来这个减少量也会变小。」\r\n> 「你不信，你拿计算器摁一下这个负的 10.2：`27.9 ÷ 0.898 × 0.102`，算下来应该是 **3.17**。应该就是你看绝对值就行了。**你把它的绝对值调小了，它的增量的绝对值也会变小。这是大概的一个方向。**」\r\n\r\n---\r\n\r\n## 七、结尾提炼\r\n\r\n### 7.1 本讲知识点总表\r\n\r\n| 模块 | 方法 | 适用条件 | 核心公式 | 修正方向 |\r\n| --- | --- | --- | --- | --- |\r\n| 壹 | **化除为乘** | 变化幅度 **≤ 10%**（含负增速的绝对值） | `∆ ≈ 现期 × r`（粗）\u003cbr>`∆ ≈ 现期×r − (现期×r)×r`（细） | r > 0 往下减；r \u003c 0 往上加（均指绝对值） |\r\n| 贰 | **提前修正** | 同上 | 先调 `r`：`∆ ≈ 现期 × (r − r²)`\u003cbr>先调现期：`∆ ≈ (现期 − 现期×r) × r` | 目标是**凑整**，顺带修正部分误差 |\r\n| 叁 | **份数思想（百化分）** | **\\|r\\| > 10%** 且**靠近**整数倒数 | `若 r = 1/n：∆ = 现期 ÷ (n+1)`\u003cbr>`若 r = a/b：∆ = 现期 × a/(a+b)` | `r > 1/n` → 实际∆ 更大；`r \u003c 1/n` → 实际∆ 更小 |\r\n| 肆 | **份数思想的修正** | 同上 | ① 实际∆ : 估算∆ ≈ r : (1/n)\u003cbr>② 实际∆ ≈ 现期/(n+1) + 基期 × (r − 1/n) | 先判大小，再调比例 |\r\n\r\n**核心公式组（可直接默写）**：\r\n\r\n```\r\n增量 = 基期 × r\r\n基期 = 现期 ÷ (1 + r)\r\n\r\n化除为乘：\r\n增量 = 现期×r ÷ (1+r) = 现期×r×(1−r) ÷ (1−r²) ≈ 现期×r×(1−r)\r\n     = 现期×r − 现期×r×r\r\n\r\n份数思想（r = 1/n）：\r\n增量 = 现期 ÷ (1 + 1/n) × 1/n\r\n     = 现期 ÷ [(n+1)/n] × 1/n\r\n     = 现期 × n/(n+1) × 1/n\r\n     = 现期 ÷ (n + 1)\r\n```\r\n\r\n**板书原公式（「化除为乘」页，逐字）**：\r\n\r\n```\r\n增量 = 基期×r = 现期×r/(1+r) = 现期×r×(1−r)/[(1+r)×(1−r)]\r\n     = 现期×r×(1−r)/(1−r²) ≈ 现期 × r × (1 − r)\r\n     = 现期 × r − 现期 × r × r\r\n                    ↑粗            ↑细\r\n① 现期×r = 现期∆\r\n② 现期∆ − 现期∆×r ≈ 实际∆\r\n\r\n适用条件：变化幅度≤10%\r\n①误差小；②便于计算\r\n```\r\n\r\n### 7.2 速算口诀与解题流程\r\n\r\n**口诀**\r\n\r\n> ⭐ 一、**看到增速小（≤10%），不管问增量还是问基期，一律「化除为乘」——自动触发底层代码，不需要转换。**\r\n> ⭐ 二、**增速大于零，往下减；增速小于零，往上加（大/小一律指绝对值）。**\r\n> ⭐ 三、**可以在过程中调，也可以在结果上调；凑整优先，凑整顺带修正部分误差。**\r\n> ⭐ 四、**是为了「整」，不是为了「准」；一切都可以为整数让步。**\r\n> ⭐ 五、**0 到 10 用化除为乘，10 以上靠近百化分用百化分——方法边界不交叉、不打架。**\r\n> ⭐ 六、**快 + 够准 = 快速估算；千万不要为了准而本末倒置。**\r\n\r\n**解题流程**\r\n\r\n```\r\n第 1 步  看增速：|r| ≤ 10%？\r\n          ├─ 是 → 化除为乘\r\n          │      ├─ 先算 现期 × r         （粗）\r\n          │      ├─ 想修正 → 提前修（调 r 或调现期，凑整）\r\n          │      │           或结果修（减去/加上 现期∆ × r）\r\n          │      └─ 方向：r>0 往下减；r\u003c0 往上加（绝对值）\r\n          └─ 否 → 看是否靠近百化分\r\n                 ├─ 是 → 份数思想\r\n                 │      ├─ r = 1/n → 增量 = 现期 ÷ (n+1)\r\n                 │      ├─ r = a/b（如 2/3、4/9）→ 增量 = 现期 × a/(a+b)\r\n                 │      ├─ 负增速 → 分母用 (n−1)（即 |n| − 1）\r\n                 │      └─ 修正：先判大小，再按 r/(1/n) 的比例调\r\n                 └─ 否 → 另想办法（本集未讲）\r\n第 2 步  问基期 → 基期 = 现期 − 增量（低增速时直接减，不要硬算除法）\r\n第 3 步  看选项 → 选项间距决定「粗」还是「细」\r\n```\r\n\r\n### 7.3 易错点与陷阱清单\r\n\r\n| # | 易错点 / 陷阱 | 老师原话 / 说明 |\r\n| --- | --- | --- |\r\n| 1 | **方向搞反** | 「你在做这种化除为乘的时候，**方向千万别搞反了**！增速大于零的时候要把算出来的变化量**变小**；小于零的时候要**变大**。**这里的大跟小是绝对值。**」 |\r\n| 2 | **粗估值直接当选答案** | 「江苏这几年有两次了、好像两三次都在这种**化除为乘上去设坑**的。很多同学写了个 83.6 出来之后，在考场他会选个 84 的，因为他觉得 84 离得近，**他忘记了误差了**。」（对应题：83.6→80.4、193.2→185.2、17.6→16.8、1936→1928） |\r\n| 3 | **低增速硬算基期** | 「低增速他要你算基期，你也**尽量不要用放缩法去把分母从这个 1028 变成 1000 去算**，因为低增速有更好的办法，化除为乘又快又准。」（板书把 `1905/1.028` 划掉改写 1000） |\r\n| 4 | **不换计算对象** | 「**你换了一下计算对象，你的计算的误差的容许度就会从百分之零点一变成了百分之三。**」 |\r\n| 5 | **本末倒置** | 「4600 × 4.0236 —— 不能这么做！你这么做肯定比我直接写 4% 要准，**但是你本末倒置了**。」 |\r\n| 6 | **把「整」当成「准」** | 「**我们的目的是为了让它更整，而不是为了让它更准，是为了整，不是为了准。**这两个虽然读音很接近，但千万不要搞错了。」 |\r\n| 7 | **两边同时调** | 「这个方法局限性就是你要调两次，可能会有点烦……**初期的时候我建议大家还是就只调一边**，你调两边，我怕你真的把控不住。」 |\r\n| 8 | **方法打架** | 「不要让你的方法打架！……**0 到 10 就是化除为乘，10 以上靠近百化分就用百化分。**」 |\r\n| 9 | **背没用的分数** | 「十七分之一、十八分之一、十九分之一这些东西**没有任何意义，没有用**，浪费时间；十三分之一、十四分之一**也不用背**。」 |\r\n| 10 | **百化分挑得太远** | 「你把这个什么百分之十七点六，我非要当作百分之十二点五去做，那这个误差肯定就大了……**没有人会把这么远的东西拿来去做百化分的。**」 |\r\n| 11 | **忘了判大小** | 「**你判断这个答案的时候，先去分析大小，然后再去调比例。**判断大小这个环节是非常重要的一个环节。」 |\r\n| 12 | **单位 / 量级** | 玉米题 25733 万吨 → 257×0.7 = 179.9（万，须补 0.7%）；谷物题 1643.5 → 164（万）；科技经费 17606.1 → 176（亿） |\r\n| 13 | **时间 / 范围** | 餐饮题必须「1~3 月 − 3 月」；公路题问 2013 年（基期）但可用增量法；江苏题给了利润增速 30.4% 干扰 |\r\n\r\n### 7.4 老师金句\r\n\r\n> ⭐「**他还没有能够真正的让你达到一个速度的质的提升**——我除了让数变得好算一点，我能不能把计算的模式、计算的方式、解题的步骤再优化？」\r\n\r\n> ⭐「**它又准又快，还方便。**」\r\n\r\n> ⭐「**增速低的时候，你不管算基期还是算增量，他哪怕问你基期，你也给我用化除为乘。这又要什么转换呢？不需要转换呀。**」\r\n\r\n> ⭐「**自动触发你的底层代码，自动触发这个条件，直接化除为乘。**」\r\n\r\n> ⭐「**我们看到这样的增速，就会有条件反射、肌肉反射地去用化除为乘，你这样才能快啊。我看到它，我就想到化除为乘，我不需要思考。**」\r\n\r\n> ⭐「**我既让这个位数凑整了、好算了，其次我也让这个结果变得更准了，一举两得。**」\r\n\r\n> ⭐「**是为了整，不是为了准。**」\r\n\r\n> ⭐「**以凑整为核心目的，一切都可以为整数让步。**」\r\n\r\n> ⭐「**它不光准、不光快，他还很灵活 —— 你在现期上可以调，在增速上也能调，在结果上都能调，你想怎么做就怎么做。**」\r\n\r\n> ⭐「**一定要快，一定要够准，千万不要去把这个东西搞得太精确了，没有任何意义。**」\r\n\r\n> ⭐「**你不要让你的方法打架。**」\r\n\r\n> ⭐「**计算往往不是那么难的事情。**」\r\n\r\n\r\n","outline":[{"level":2,"text":"一、化除为乘（小增速的增量估算）","id":"一化除为乘小增速的增量估算"},{"level":3,"text":"1.1 公式推导：为什么要「化除为乘」","id":"11-公式推导为什么要化除为乘"},{"level":3,"text":"1.2 适用条件：为什么是 10%","id":"12-适用条件为什么是-10"},{"level":3,"text":"1.3 「粗」与「细」：两步走","id":"13-粗与细两步走"},{"level":3,"text":"1.4 从乘法误差角度看化除为乘（本质是放缩）","id":"14-从乘法误差角度看化除为乘本质是放缩"},{"level":3,"text":"1.5 负增速怎么办：反向补偿","id":"15-负增速怎么办反向补偿"},{"level":3,"text":"1.6 方向铁律：大于零往下减，小于零往上加","id":"16-方向铁律大于零往下减小于零往上加"},{"level":2,"text":"二、化除为乘例题精讲","id":"二化除为乘例题精讲"},{"level":3,"text":"第 1 题｜2020 全国粮食总产量 · 同比增长 0.9%","id":"第-1-题2020-全国粮食总产量-同比增长-09"},{"level":3,"text":"第 2 题｜玉米产量减产 0.7%（求减产量）","id":"第-2-题玉米产量减产-07求减产量"},{"level":3,"text":"第 3 题｜江苏省国资委监管企业营业收入（上半年）","id":"第-3-题江苏省国资委监管企业营业收入上半年"},{"level":3,"text":"第 4 题｜4600.1 × 4.2%（老师先口述、后揭题为第 7 题）","id":"第-4-题46001-42老师先口述后揭题为第-7-题"},{"level":3,"text":"第 5 题｜2018 年玉米产量 · 减产 0.7%（画面完整题干，即第 2 题）","id":"第-5-题2018-年玉米产量-减产-07画面完整题干即第-2-题"},{"level":3,"text":"第 6 题｜2023 上半年江苏省国资委 · 营业收入同比增加（画面完整题干，即第 3 题）","id":"第-6-题2023-上半年江苏省国资委-营业收入同比增加画面完整题干即第-3-题"},{"level":3,"text":"第 7 题｜2017 全国学前教育在园幼儿 · 同比增长 4.2%","id":"第-7-题2017-全国学前教育在园幼儿-同比增长-42"},{"level":3,"text":"第 8 题｜2014 全国旅客运输 · 求 2013 年公路运输总量（问基期，却算增量）","id":"第-8-题2014-全国旅客运输-求-2013-年公路运输总量问基期却算增量"},{"level":2,"text":"三、增量 vs 基期：为什么低增速一律算增量","id":"三增量-vs-基期为什么低增速一律算增量"},{"level":3,"text":"第 9 题｜2019 全年 V 市交通运输、仓储和邮政业增加值","id":"第-9-题2019-全年-v-市交通运输仓储和邮政业增加值"},{"level":2,"text":"四、提前修正（一）：多位数凑整","id":"四提前修正一多位数凑整"},{"level":3,"text":"4.1 原理：把「结果上修正」提前到「过程中修正」","id":"41-原理把结果上修正提前到过程中修正"},{"level":3,"text":"4.2 方向铁律（板书原文）","id":"42-方向铁律板书原文"},{"level":3,"text":"第 10 题｜2017 全国学前教育在园幼儿（提前修正版）","id":"第-10-题2017-全国学前教育在园幼儿提前修正版"},{"level":3,"text":"第 11 题｜2023 上半年江苏省国资委 · 营业收入（提前修正版）","id":"第-11-题2023-上半年江苏省国资委-营业收入提前修正版"},{"level":3,"text":"第 12 题｜2018 年 1—8 月谷物进口量（负增速 + 提前修正）","id":"第-12-题2018-年-18-月谷物进口量负增速-提前修正"},{"level":3,"text":"第 13 题｜2019 年前三季度某省规模以上工业企业利润总额（负增速求基期）","id":"第-13-题2019-年前三季度某省规模以上工业企业利润总额负增速求基期"},{"level":3,"text":"第 14 题｜老师口述的练手题（21754×2.04% 与 2116×5.1%）","id":"第-14-题老师口述的练手题21754204-与-211651"},{"level":3,"text":"第 15 题｜「增速提前修正举例」表（板书原表）","id":"第-15-题增速提前修正举例表板书原表"},{"level":3,"text":"第 16 题｜2021 全国城市供水管道长度","id":"第-16-题2021-全国城市供水管道长度"},{"level":3,"text":"第 17 题｜2018 全国第三产业增加值","id":"第-17-题2018-全国第三产业增加值"},{"level":3,"text":"第 18 题｜2024 年 1~2 月 C 市餐饮收入同比增量（两边同时调）","id":"第-18-题2024-年-12-月-c-市餐饮收入同比增量两边同时调"},{"level":3,"text":"第 19 题｜「化除为乘 · 练习」七连练（板书原题 + 答案）","id":"第-19-题化除为乘-练习七连练板书原题-答案"},{"level":3,"text":"4.3 ⛔ 反面典型：本末倒置","id":"43-反面典型本末倒置"},{"level":2,"text":"五、份数思想（百化分）","id":"五份数思想百化分"},{"level":3,"text":"5.1 公式推导：为什么除以 (n+1)","id":"51-公式推导为什么除以-n1"},{"level":3,"text":"5.2 各种增速情形（板书逐步演算）","id":"52-各种增速情形板书逐步演算"},{"level":3,"text":"5.3 常用 1/n 表（板书原表，标题「常用 1/n 表」）","id":"53-常用-1n-表板书原表标题常用-1n-表"},{"level":3,"text":"5.4 该背什么、不该背什么（老师原话）","id":"54-该背什么不该背什么老师原话"},{"level":3,"text":"5.5 常用百化分速查（板书补充的口诀，老师口述）","id":"55-常用百化分速查板书补充的口诀老师口述"},{"level":2,"text":"六、份数思想例题精讲","id":"六份数思想例题精讲"},{"level":3,"text":"第 20 题｜2017 全国科技经费投入总量","id":"第-20-题2017-全国科技经费投入总量"},{"level":3,"text":"第 21 题｜2017 某市服务业小微样本企业缴纳增值税","id":"第-21-题2017-某市服务业小微样本企业缴纳增值税"},{"level":3,"text":"第 22 题｜2023 年第二季度末全国跨省联网定点零售药店","id":"第-22-题2023-年第二季度末全国跨省联网定点零售药店"},{"level":2,"text":"6.1 份数思想的修正（两套办法 + 公式证明）","id":"61-份数思想的修正两套办法-公式证明"},{"level":3,"text":"6.2 第二种修正思路（用基期补增速差）","id":"62-第二种修正思路用基期补增速差"},{"level":3,"text":"6.3 负增速的份数思想修正（老师现场举例）","id":"63-负增速的份数思想修正老师现场举例"},{"level":2,"text":"七、结尾提炼","id":"七结尾提炼"},{"level":3,"text":"7.1 本讲知识点总表","id":"71-本讲知识点总表"},{"level":3,"text":"7.2 速算口诀与解题流程","id":"72-速算口诀与解题流程"},{"level":3,"text":"7.3 易错点与陷阱清单","id":"73-易错点与陷阱清单"},{"level":3,"text":"7.4 老师金句","id":"74-老师金句"}]},{"id":"P08","title":"快速估算（下）","full":"资料分析第四课 快速估算（下）","lect":"","dur":"35:44","sec":2144,"theme":"","url":"","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 8 集\n\n# 资料分析第四课 快速估算（下）\n\n> **课程名称**：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）\n> **本集位置**：合集第 8 集（共 21 集）\n> **视频地址**：`https://www.bilibili.com/video/BV15bGA6PEJL?p=8`\n> **时长**：35 分 44 秒\n> **本集主题**：**份数思想（分数法）的\"修正\"与\"提前修正\"**——把上一集学的分数法讲透：① 修正公式怎么来的、为什么\"用的不多\"；② 过程修正（提前修正）与结果修正的区别；③ 结合\"化除为乘 / 份数思想 / 放缩法\"三板斧，用 7 道真题演示\"什么时候用哪个、怎么凑整、怎么控误差\"。\n\n---\n\n## 目录\n\n- [一、开篇：分数法的\"修正\"——为什么老师说\"用的不多\"](#一开篇分数法的修正为什么老师说用的不多)\n  - [1.1 修正公式回顾（板书）](#11-修正公式回顾板书)\n  - [1.2 修正公式是怎么来的（板书推导）](#12-修正公式是怎么来的板书推导)\n  - [1.3 真正\"零误差\"的算法：还要再除一个 (1+r)](#13-真正零误差的算法还要再除一个-1r)\n  - [1.4 为什么\"用的不多\"](#14-为什么用的不多)\n- [二、份数思想 · 提前修正（过程修正）](#二份数思想--提前修正过程修正)\n  - [2.1 提前修正的核心原理](#21-提前修正的核心原理)\n  - [2.2 示范：27.9 × 12.8% 怎么秒算](#22-示范279--128-怎么秒算)\n- [三、三板斧：三种速算方法的适用范围](#三三板斧三种速算方法的适用范围)\n- [四、例题精讲](#四例题精讲)\n  - [衔接回顾｜2023 年第二季度末 · 跨省联网定点零售药店](#衔接回顾2023-年第二季度末--跨省联网定点零售药店)\n  - [第 1 题｜2016 年 · 小微服务业样本企业营业收入](#第-1-题2016-年--小微服务业样本企业营业收入)\n  - [第 2 题｜2021 年 1-8 月 · 全国房地产开发投资（求 2019 年基期）](#第-2-题2021-年-1-8-月--全国房地产开发投资求-2019-年基期)\n  - [第 3 题｜2021 年 · 全国地级及以上城市 PM2.5 年均浓度](#第-3-题2021-年--全国地级及以上城市-pm25-年均浓度)\n  - [第 4 题｜2019 年 1-8 月 · 西部地区房地产开发投资增量](#第-4-题2019-年-1-8-月--西部地区房地产开发投资增量)\n  - [第 5 题｜2021 年 1-9 月 · 我国机床工具对美国出口额](#第-5-题2021-年-1-9-月--我国机床工具对美国出口额)\n  - [第 6 题｜2019 年第一季度 · 131 家证券公司代理买卖证券业务净收入](#第-6-题2019-年第一季度--131-家证券公司代理买卖证券业务净收入)\n  - [第 7 题｜2017 年 · 某市服务业小微样本企业缴纳增值税](#第-7-题2017-年--某市服务业小微样本企业缴纳增值税)\n- [五、本讲知识点总表](#五本讲知识点总表)\n- [六、速算口诀与解题流程](#六速算口诀与解题流程)\n- [七、易错点与陷阱清单](#七易错点与陷阱清单)\n- [八、老师金句](#八老师金句)\n- [附录：画面出现但本集未展开讲解的题目](#附录画面出现但本集未展开讲解的题目)\n\n---\n\n## 一、开篇：分数法的\"修正\"——为什么老师说\"用的不多\"\n\n> 老师开篇原话：\n> \"真的没必要说哪个更准，哪个更不准，你觉得哪个快就行了。\"\n> \"我还要再说一个事情，就是我们刚刚学的这个分数法的修正。其实我说实话用的不多，真的用的不多。\"\n\n### 1.1 修正公式回顾（板书）\n\n画面板书（标题「**份数思想—修正**」，老师旁边手写批注「**用的不多**」）：\n\n```\n① r:  1/n ≈ 实际Δ  →  估算Δ\n     r > 1/n，则 实际Δ > 估算Δ\n     r \u003c 1/n，则 实际Δ \u003c 估算Δ\n\n② r ≈ 1/n， 实际Δ ≈ 现期/(n+1) + 基期×(r − 1/n)\n             实际Δ ≈ 算Δ + 算Δ × ( (r − 1/n) / (1/n) )\n```\n\n> 老师逐句讲：\n> \"① r 约等于 n 分之一的时候，我们先估一个 Δ。\"\n> \"**r 大于 n 分之一，则实际 Δ 大于估算 Δ；r 小于 n 分之一，则实际 Δ 小于估算 Δ**。\"\n> \"② r 约等于 n 分之一的时候，实际 Δ 约等于 现期除以 (n+1) 再加上基期乘以 (r − n分之一)。\"\n\n| 符号 | 含义 |\n|---|---|\n| `r` | 材料给出的**实际增速** |\n| `1/n` | 分数法取用的**近似分数**（如 12.5% = `1/8`、15.4% ≈ 14.3% = `1/7`） |\n| `现期` | 现期值（限期值） |\n| `基期` | 基期值 |\n| `算Δ` | 用 `1/n` 估出来的增量 |\n| `实际Δ` | 真实增量 |\n\n### 1.2 修正公式是怎么来的（板书推导）\n\n老师明说这段\"**你想听可以听，不想听你直接可以不听**\"，但还是板演了完整推导：\n\n```\nΔ₁ = 现期×r₁/(1+r₁)   −   Δ₂ = 现期×r₂/(1+r₂)\n\n   = 现期 × [ r₁(1+r₂) − r₂(1+r₁) ] / [ (1+r₁)(1+r₂) ]\n\n   = 现期 × ( r₁ − r₂ ) / [ (1+r₁)(1+r₂) ]\n\n   = (现期×r₂)/(1+r₂) × (r₁−r₂)/r₂ / (1+r₁)\n```\n\n> 老师原话：\n> \"实际的增量是 现期乘以 r₁ 除以 (1+r₁)；假的（估算的）是 现期乘以 r₂ 除以 (1+r₂)。\"\n> \"那我去算它们的差距，是不是直接做个差呀？做差，我们把它合并同类项，把它分母通分，通分，就等于这样的一个关系。\"\n> \"我们刚算出来那个东西是 现期乘以 r₂ 除以 (1+r₂)，这是我们算的一个增量；然后这边还有一个 1+r₁，上面呢就是一个 r₁ 减 r₂ 除以 r₂。\"\n> \"**这是我们刚刚说的增速的差的比例，然后你最后要再除一个 1 加增速，这样才是一个准确的值。但是这样子太复杂了，太麻烦了。**\"\n\n### 1.3 真正\"零误差\"的算法：还要再除一个 (1+r)\n\n画面在后一页把 `②` 式补全（红笔加上分母 `1+r`）：\n\n```\nr ≈ 1/n， 实际Δ ≈ 算Δ + 算Δ × ( (r − 1/n) / (1/n) ) / (1 + r)\n\n代入 算Δ = 现期/(n+1)：\n\nr ≈ 1/n， 实际Δ ≈ 现期/(n+1) + [ 现期/(n+1) × ( (r − 1/n) / (1/n) ) ] / (1 + r)\n```\n\n> 老师原话：\n> \"这边你看，我还是写的都是约等于。它还是有误差，你再除一个 1 加（增速），这个才是完完全全没有误差的，非常准确的。\"\n> \"但是你说要这样子做，等我这个题目算完，人家估计这一篇都结束了。所以这个方法其实有的时候真的用的不多，但我这边还是要讲一下的。\"\n\n### 1.4 为什么\"用的不多\"\n\n| 原因 | 老师原话 |\n|---|---|\n| ① 这节课本身就叫\"快速估算\" | \"一般你用分数法的时候是不需要把这个题目算的那么精确的，你大概的按照那个比例估一下就可以了……你看我们前面做了很多题目，不需要你去估那么准。\" |\n| ② 修正项本身也有误差 | \"它本身也不是完全特别准确的，它是有误差的。如果你要算的完全准确，你应该是拿刚刚算的这个调整误差，这个东西还要再除一个 1 加（增速）。\" |\n| ③ 性价比太低 | \"但是这样子性价比太低了，太浪费时间了，所以没有必要算那么细。\" |\n\n> **结论（老师原话）**：\n> \"所以分数法，我建议大家就是把它当做一个**快速的估算**，千万不要把分数法当做一个**精算**。如果你用来精算的话，得不偿失，你没有办法把它算得很准，除非你花了大量的时间。\"\n> \"所以我们在对分数法进行操作过程中，一定不要去追求什么完全精准。我们尽量使用分数法去**快速解决一些低精度的问题**。\"\n\n---\n\n## 二、份数思想 · 提前修正（过程修正）\n\n### 2.1 提前修正的核心原理\n\n画面翻页，标题为「**04 份数思想 —— 提前修正**」，板书：\n\n```\n        现期 A              增速 r\n        修正现期 B          修正增速 1/n\n\n若 A : B ≈ 1/n : r，且 1/n 与 r 差距较小\n则两者增量基本一致\n```\n\n> 老师原话：\n> \"我们最后还有一个，就是我们**可以再让这个份数思想进一步提速**，还能再提速。怎么提速呢？**调误差嘛**。\"\n> \"因为我们刚刚发现你这个分数法，你如果直接除，无非不就是存在误差吗？那这个误差我难道就不能**在过程中调整**吗？我非要在结果上调整吗？\"\n> \"是不是又回到了我们的问题——到底是在结果上调整误差，还是在过程中调整误差？这就跟我们那个乘法放缩（化除为乘）那个调误差是不是一样的？我可以在增速上调，也可以在现期上调，那这个地方份数法我在哪调？\"\n> \"**我已经把增速调大了，我是不是可以去调现期？你现期是这么多、增速这么多，你修正成了一个 n 分之一的增速，那你对应的现期做一个反方向的调整就好了。只要你这两个的比值是对应接近的，你这个增量就基本一致的。**\"\n\n> ⭐ **口诀：增速调大 → 现期调小；增速调小 → 现期调大。**\n> 老师原话：\"**增速调高了，现期对应调小一点，凑个整；增速调低了，现期就对应的扩大一点，凑个整。**\"\n\n> 老师强调核心目的：\n> \"核心目标就是一个数，就是一个词——**凑整**。\"\n> \"**不是为了真的去调它，是为了凑整。**\"\n\n### 2.2 示范：27.9 × 12.8% 怎么秒算\n\n画面板书（右侧手写，圈出「**快速**」）：\n\n```\n27.9   ×   12.8%\n ↓ +0.7       ↓ −0.3        ← 增速调小，现期调大\n28.6   ×   12.5% = 1/8\n\nΔ = 28.6/9 = 3.146  →  3.176\n```\n\n| 步骤 | 操作 | 画面内容 |\n|---|---|---|\n| ① 定分数 | 12.8% 最靠近 12.5% = `1/8` | `12.5%` 被圈出 |\n| ② 反向凑整 | 增速 12.8% → 12.5%（−0.3），现期 27.9 → 28.6（+0.7） | `↓ −0.3`、`↓ +0.7` |\n| ③ 求增量 | `28.6 ÷ 9` | `Δ = 28.6/9` |\n| ④ 得数 | 先写 `3.146`，随后圈出 `3.176` | 圈出的 `3.176` |\n\n> 老师原话：\n> \"（转写此句为'因为 8 大前来是 279128'，画面显示为 `27.9 × 12.8%`，此处以画面为准）……甚至你都不需要调位数，因为他们本来就都是两位数。那 12.8 变成 12.5，是不是减了 0.3？左边那个现期是 27.9，是不是 12.8 的两倍多？我可以加多少，加 0.6 或者 0.7 都行，就会变成 28.6 或者 28.5 都行。\"\n> \"那就对应了这两组数，他们的增量是基本上可以有一点点误差，但这个误差非常非常非常小。\"\n> \"那就是增速 12.5%，是 1/8，所以增量就是 28.6 除以 9，等于约等于 3.1 几……这个 3.17 还记得吧？我们刚刚算了好几遍，都是这个 3.17，现在算还是 3.17。\"\n> \"有的人说觉得叫慢，觉得不如我先把那个（增速）n 分之一算出来，然后再去调。不是这个东西慢，就跟我们前面讲的化除为乘的调误差是一样的。你不是说非得要去调它，我们的目的是什么？是**凑整**。如果你这个现期往对应的方向调了一下能凑整，那就干脆调了再说。\"\n> \"如果你本来就好除，比如这个地方 27.9，本来你除以 9 就好，除 3.1 就出来了，肯定这样快。但如果它不是 27.9 呢，如果它是一个 27.2、12.8%，我把它变成百分之十二点五，那我这边就可以写成 27.9 了，除了 9 等于 3.1，我是不是比 27.2 除以 9 要快多了？**核心目标就是一个词——凑整。**\"\n\n画面另一侧还留了「先除、再在结果上调」的对照草稿：\n\n```\n27.9/9 = 3.1        （先按 1/8 直接除）\n\n27.2   12.8%        （原始数据）\n27.9   12.5%        （提前修正后）\n```\n\n> ⭐ 老师总结：\"**要调高，你可以在过程中调，也可以在结果上调，在哪调都可以，就是主打一个字——灵活。**\"\n\n---\n\n## 三、三板斧：三种速算方法的适用范围\n\n> 老师原话：\n> \"好，我们最后来总结一下。今天我们主要讲的什么东西？第一个是化除为乘，第二是份数思想。然后呢，我们再把前面学的放缩法放在一起来说，这就是我们对于整个资料分析里面**算增量算基期**主要用了三种方式。**三板斧**，这也算是我的三板斧吧，他们有各自的适用范围。\"\n\n| 判断条件 | 用哪一\"斧\" |\n|---|---|\n| 增速小，变化率在 **10% 以内** | **化除为乘** |\n| 增速靠近 **n 分之一**（离得不要太远，一般差一两个点、两三个点） | **份数思想（分数法）** |\n| 前两种都不沾 | **放缩法** |\n\n> 老师原话：\n> \"当你的增速小的时候，变化率在百分之十以内的时候，你就用化除为乘。\"\n> \"如果增速在 n 分之一附近，约等于附近，不要离得太远，一般我建议差个一两个点、两三个点，看看情况吧，一般差一两个点之内，你不要搞得太远。\"\n> \"如果都不沾，前两种都不符合，放缩。\"\n> \"我总共也讲了三种方法呀——增速小，化除为乘；增速靠近 n 分之一，分数法；两个都不沾，那他们俩都不用，那我就用放缩呗，就用常规的计算呗。\"\n> \"**放缩它本质上也就是一种直除，或者说直接乘的一个尚未替代（省时替代）而已。**不存在什么打不打架，没有什么打架的东西。\"\n\n| 方法 | 优点 | 缺点 | 注意点 |\n|---|---|---|---|\n| 化除为乘 | 又快又准 | 适用范围有点窄 | 正减负增（绝对值）；提前修正以凑整为主、方向正确的基础上无需过分精确 |\n| 份数思想 | **最快** | 不好做精准计算（\"花一分的力可以拿到 90% 的精准度，想变成 99.9% 要花十成的力\"）；正增速、负增速的加减方向别搞反 | 提前修正类似于乘法放缩，方向正确的基础上无需过分精确 |\n| 放缩法 | 精准 | 不够快（要列式子） | 放缩幅度不要大、以凑整为主；分子较整时可在结果上修正 |\n\n> 老师原话：\n> \"画（化）出一层（化除为乘），它的优点是又快又准，缺点吧，我暂时还没想出来，硬要说缺点，可能就是**适用范围有点窄**。\"\n> \"份数法的优点就是**快，太快了**，基本上是这三个里面最快的。但是它的缺点也很明显，他不好去做一些精准的计算，他不好算得很准。就好像是你只要花**一分的力**，你就可以算出来**百分之九十的精准度**；但是如果你想把它变成**百分之九十九点九**的精准度，你需要花**十成的力**，太不划算了。\"\n> \"放缩法的优点就是精准，缺点就是不够快。因为相对来说放缩法跟前面两个相比，它是要列式子的。前面两个等你念熟了之后，特定的情况你是根本不需要去动笔的，你口算就能算出来的。\"\n> \"然后他们三个的注意点都比较接近，就是**凑整为主**，都是凑整为主，不需要过分的精确。\"\n> \"整体呢他们三个呢，就是你去修正的时候，注意好一个——**过程修正还是结果修正**，他们就都有对应的一个思考方式。核心目标就是**凑整**：**只要整你就不要去调，你算完了再调；如果不够整就先调，调整了再算。怎么快怎么来。**\"\n\n---\n\n## 四、例题精讲\n\n### 衔接回顾｜2023 年第二季度末 · 跨省联网定点零售药店\n\n> 说明：本题是上一集（快速估算·上）讲\"分数法修正\"时用的例题，本集开篇继续拿它做**\"最精确算法\"**的示范，故一并收录。\n\n**【题干原文】**\n\n> 2023 年第二季度末，全国跨省联网定点零售药店 27.9 万家，环比增长 12.8%。\n> 2023 年第二季度末，全国跨省联网定点零售药店环比增加：\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 时间 | 2023 年第二季度末 |\n| 全国跨省联网定点零售药店（现期） | 27.9 万家 |\n| 环比增长率 | 12.8% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**环比增量** |\n| 定位数据 | 限期 27.9 万家，r = 12.8% |\n| 列式 | `Δ = 现期 × r / (1+r)` |\n| 速算（分数法） | 12.8% ≈ 12.5% = `1/8` → `Δ = 27.9 ÷ 9 = 3.1`，并标注「**偏小**」 |\n| 定性判断 | `r 实际 = 12.8% > 12.5%` ⇒ **实际Δ > 估算Δ**，所以 3.1 偏小 |\n| 结果修正 | 增速差比例：`0.3 / 12.5 = 2.4%` → `3.1 × 2.4% ≈ 0.075` → `3.1 + 0.075 ≈ 3.17` |\n| 最精确算法 | `3.1 + (3.1 × 2.4%) ÷ 1.128 ≈ 3.16`（画面手写为 `3.1 + 0.075 = 3.175`，转写为\"3.1 + 0.072 = 3.17\"，此处以画面为准） |\n\n画面板书（红笔）：\n\n```\nΔ = 27.9/9 = 3.1      （偏小，被圈出）\n\n① 太小\n② 3.1  ↑ +3.0%\n   3.1 + 0.09 ↓ 0.072\n   = 3.19 → 3.17\n\n27.9\n12.5%  ↑\n12.8%\n\n3.1 + (3.1 × 2.4%) = 3.1 + 0.075 = 3.175\n\n12.5% / 0.3% = 2.4%   （增速差占比，被圈出）\n```\n\n**【选项原文】**\n\n> A. 3.2 万家　　B. 3.4 万家　　C. 3.6 万家　　D. 3.8 万家\n> （画面把 **A. 3.2 万家** 加了下划线；另在右侧手写补写了两个选项：**E. 3.2 万、F. 3.3**）\n\n**【答案】** ✅ **A（3.2 万家）**（画面以 A 加下划线标出）\n\n**【解析】**\n\n- 计算值 `3.17` 万家介于\"手写补出的 3.2/3.3\"与标准选项 A.3.2 万之间——老师正是用这个反差引出：\"**适当按照大概的比例，把 3.1 估个 3.2 就够了，也不要去算那么细，算个 3.16167 什么的**。\"\n- 陷阱类型：**数值陷阱**（选项与精算值不重合，考场上按\"够用精度\"选择即可）。\n- 老师结论：\"**分数法是快速估算，不是精算**。\"\n\n> 老师原话：\n> \"就比如说刚刚这里算的这个东西，其实它最准确的是 3.1 加上我们刚刚算的这个差，百分之二点四乘上去……再除 1.128，这样你算出来才是准确的，才是 3.16，才是对的。**但是这样子性价比太低了，太浪费时间了，所以没有必要，没有必要算那么细。**\"\n> \"所以像最后这一步，我一般都是省略掉的，我不会去想的。因为本身你调这个误差就是一个不是那么很大的东西，你还要再去把它放缩、去给它算得那么特别精确，意义太小了。\"\n\n---\n\n### 第 1 题｜2016 年 · 小微服务业样本企业营业收入\n\n**【题干原文】**\n\n> 2016 年，该省小微服务业样本企业实现营业收入 80.1 亿元，同比增长 15.4%。\n> 2016 年，该省小微服务业样本企业的营业收入比 2015 年大约多多少亿元？\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 年份 | 2016 年 |\n| 该省小微服务业样本企业营业收入（现期） | 80.1 亿元 |\n| 同比增长率 | 15.4% |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 增长率，求**同比增量**（\"大约多多少\"） |\n| 定位数据 | 限期 80.1 亿元，r = 15.4% |\n| 列式 | `Δ = 现期 × r / (1+r)` |\n| 定分数 | 15.4% 超过 10%，不用化除为乘；15.4% 靠近 14.3% = `1/7` |\n| 分数法 | `Δ ≈ 80 ÷ 8 = 10`（画面写 `Δ = 80/8 = 10`） |\n| 定性判断 | 15.4% > 14.3% ⇒ 实际 Δ **偏大** ⇒ 应比 10 大 |\n| 选答案 | `10.7`（B）——画面把 B.10.7 圈住，标答案 **B** |\n\n画面板书（红笔）：\n\n```\n(14.3%) = 1/7\nΔ = 80/8 = 10        （下方画双横线强调）\n\n15.4  ↑\n14.3\n10.7 / 12.3 → 10.9\n\n80.1/1.154           （另一种做法：直接放缩）\n  −43 (≈−4%)\n8000/1111 = 72\n              −4%\n              2.8\n             69.2\n\n77.0/1.11 → 69.4\n80.1/69.4 → 10.7\n\n80.1 − 10.8 = 69.3   （假设代入）\n69.3 × 15.4%：\n   693\n  ×154\n → 10.67\n```\n\n**【选项原文】**\n\n> A. 5.3　　B. 10.7　　C. 12.3　　D. 23.0\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **方法一（分数法·首选）**：15.4% > 10%，不考虑化除为乘；15.4% 最靠近 14.3% = `1/7`，所以 `Δ = 80.1 ÷ 8 ≈ 10`。\n  > 老师原话：\"这 15.4% 我们怎么处理呢？这个十五点四超过百分之十了吧，我们就不用化除为乘了吧。他是不是这种百分之十几，往往旁边都是有这个 n 分之一的，也可以往上凑，也可以往 14.3 上凑，也可以往 16.7 上凑，对不对？我可以往 14.3 上去走，因为它的 14.3 相对近一点。相对还是近一点的好，143 是 7 分之一，所以这个增量是不是就是限期除以 8？对，是不是就是 10？\"\n- **定性判断定方向**：`10` 是偏小的（15.4% > 14.3%），所以答案要比 10 大；在 B（10.7）与 C（12.3）之间，按比例关系看\"从 14.3 涨到 15.4\"对应的应是 `10 → 10.7`，故选 **B**。\n  > 老师原话：\"你肯定知道，你这个十是偏小的，因为实际（增速）15.4 是比 14.3 要高的……你看，从 14.3 涨到 15.4，按照这个比例，我从 10 是涨到 10.7 呢，还是涨到 12.3 呢？你觉得哪个比例更像？是不是就 10.7 啊？**这就是我说的分数思想，你不要算那么准确，你就大概的估就行了。**\"\n- **陷阱类型：诱导精度陷阱**。题干只说\"大约多多少\"，选项间距够大，不必精算。\n- **当精度不够时怎么办？** 老师给了两条路：\n  1. **放缩法**（画面右下手写）：\n     ```\n     80.1 ÷ 1.154\n       分母 1.154 补 43 变成 1.111（约 −4%），分子先不动\n       → 8000/1111 = 7.2 → 72（错位）\n       分母减了 4%，分子也要减 4%：72 × 4% ≈ 2.8\n       → 72 − 2.8 = 69.2\n     ```\n     > 老师原话：\"放缩，你可以去 80 除以 1154。这样子那个下面减个 43，上面我先不调，因为上面这个本身比较整……这简单的就七二。基期大概是 72，但这个结果不行，因为我分母上减了个 4% 的，你上面没减，所以我这边还得减 4%。72 减个 2.8，就会变成 69.2。\"\n     再用 `80.1 ÷ 69.2 ≈ 10.9`（画面另有 `77.0/1.11 → 69.4`、`80.1/69.4 → 10.7` 的复算）。\n  2. **假设代入法**（讲义最后部分、专治\"选项特别近\"）：\n     > \"你可以假设增量是 10.8，你把 80.1 减个 10.8，减下来是 69.3，然后你按 69.3 这个数——它已经很靠近准确的基期了——再乘 15.4%，这个时候就是 `693 × 154`，你乘一下就能得到这个结果了，`693 × 154` 会算到一个 10.67，就能得到 10.7。\"\n- > 老师金句：\"如果这个题目它的精度已经高到了你估不出来，比如说这个地方改成了 10.9，或者说改成了 11，你觉得这个地方放 10.9 好像也差不多、放 11 也差不多，**你就不要用分数法了**……要么就是**放缩**，要么就是**假设代入**。\"\n- > \"**这个题目增速肯定还是分数法快**：6 分之 1，除以 7，14 做差 8 万 4……有这个题目怎么可能放缩快呢？肯定是分数快。\"\n- > \"这个假设代入，我感觉其实在前面第二节课上也讲到一点。比如说化除为乘，有没有假设代入呢？也有——你把现期先提前调整、提前修正，那其实也是一种假设代入的思想。\"\n\n---\n\n### 第 2 题｜2021 年 1-8 月 · 全国房地产开发投资（求 2019 年基期）\n\n**【题干原文】**\n\n> 2021 年 1-8 月份，全国房地产开发投资 98060 亿元，同比增长 10.9%，比 2019 年 1-8 月份增长 15.9%。\n> 2019 年 1-8 月份，全国房地产开发投资约（　）亿元\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 2021 年 1-8 月，全国房地产开发投资（现期） | 98060 亿元 |\n| 同比增长率（对 2020 年同期） | 10.9% |\n| 比 2019 年 1-8 月增长（**隔年增速**） | 15.9% |\n\n> ⚠️ 关键：问的是 **2019 年 1-8 月**，\"隔一年\"，直接对应 15.9%，**不是** 10.9%。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + **隔年增速**，求**隔年基期**（2019 年值） |\n| 定位数据 | 限期 98060 亿元，r = 15.9%（画面在 15.9% 下方画波浪线并标\"基\"） |\n| 方法选择 | 15.9% 靠近 16.7% = `1/6`，用**份数思想**先估增量再减 |\n| 分数法 | `98000 ÷ 7 = 14000` → 基期 = `98000 − 14000 = 84000` |\n| 定性判断 | 用 16.7% 代替 15.9% 是**把增速调大** ⇒ 增量 14000 **偏大** ⇒ 基期 84000 **偏小** |\n| 选答案 | 应选比 84000 略大的 **B.84607** |\n\n画面板书：\n\n```\n15.9% = 16.7% = 1/6\nΔ = 98000/7 = 14000\n\n   98\n 14000  ↑大\n 84000  ↓小\n\n0.8 × 0.8%     （增速差 0.8，占 15.9% 的比例）\n84000 → 640\n\n84\n×8\n672        672/1.159 = 600\n\n84 0.8\n16.7 → 14000\n15.9   −4.8%\n     983.3\n     13300\n     84700\n\n9806      （放缩法）\n1159\n −48\n9400\n 940\n84600\n```\n\n**【选项原文】**\n\n> A. 82903　　B. 84607　　C. 89668　　D. 92306\n\n**【答案】** ✅ **B**\n\n**【解析】**\n\n- **方法一（份数法，最快）**：\n  ```\n  15.9% ≈ 16.7% = 1/6  →  Δ ≈ 98000 ÷ 7 = 14000\n  基期 ≈ 98000 − 14000 = 84000\n  ```\n  > 老师原话：\"这个时候怎么办呢？两种思路。一种思路，我觉得百分之十五点九，它就是比较靠近百分之十六点七的，我就把它当做一个份数法，去算增量，把增量估出来，再去减一下，得到基期，是不是可以？\"\n  > \"那增量就等于什么？你看到的增速是六分之一吧，所以增量就是限期九万八左右除以 7，98 除以 7 正好是 14，那增量就是 14000。那它的基期就应该是 98000 − 14000 = 84000 左右。\"\n- **先定性、再修正**：\n  > \"这时候你第一步应该干嘛？你是直接修正还是什么？**你应该先判断，先定性，先判断大小。**你这个一万四算多了还是算小了？——你把 15.9 变成 16.7 是变大，那你算的 14000 也是偏大。那你 98000 减了个偏大的数，就会导致 84000 偏小。**所以你要选一个比 84000 大一点的 84600。**\"\n- **修正的两种方式**（画面都写了）：\n  | 方式 | 操作 | 画面 |\n  |---|---|---|\n  | ① 用\"增速差占比\"调 | 增速差 0.8 占 16.7 的比例约 4.8% → 增量减 4.8% | `84000 × 0.8%` 区域、`−4.8%`、`14000 → 13300` |\n  | ② 用\"基期 × 增速差\"调 | `84000 × 0.8% ≈ 640` → `84000 + 640 ≈ 84600` | `0.8 → 640` 区域 |\n  > 老师原话：\"如果说这边再来一个八万五，你觉得好像八万四……八万四千六，八万五差的四百，还算是你可以修正的一个范围，也可以修。这个地方差了个大概百分之零点八，你就把这 84000 再乘以 0.8，就得 640 左右，给它一加，84600 就能选了，对不对？\"\n  > \"你也可以看他们的差距比例，0.8 占 15.9% 占多少？你可以直接除 10.7，因为它是六分之一，除六分之一等于乘以六，等于 4.8，差了个 4.8。你可以把这个 14000 直接给他去减 4.8，差不多就减 700，所以实际应该是 13300，然后拿 98 减掉 13.3 等于 84700，也就这样也可以。**调比例也行，拿基期乘两个增速差也行，都行。**\"\n- **\"最精确\"的做法（板书，说明不必用）**：\n  ```\n  84 × 0.8 = 67.2（错位）       →  672\n  672 ÷ 1.159 ≈ 600\n  84600 + 600...  ≈ 84600 附近\n  ```\n  > 老师原话：\"当然，你看这 84，它肯定是有误差的。准确来说的话，应该是 `84 × 0.8 = 67.2`，`67.2 ÷ 1.159`，出来大概是 600 左右，这样才是比较准的。这个也正好又带你再来过了一遍，就是**准确值是怎么做的，是要除这个 1 加（增速）**。但是我们很多时候根本没必要，**绝大多数时候、99% 的情况下都是没必要的**。\"\n- **方法二（放缩法）**：\n  > 老师原话：\"那这个题目大家也可以拿放缩来做，就可能有同学看到这两个选项上来就有点犯怵，他有点不敢，也理解。\"\n  ```\n  98060 ÷ 1.159\n    分母补 61、减 48 → 1111\n    分子同比例减 ≈ 4000 → 94000\n    94000 ÷ 1.111 ≈ 94000 × 0.9 = 84600（错位相减，减 9400）\n  ```\n  （画面数字依次为 `9806 / 1159 / −48`、`9400`、`940`、`84600`；转写为\"上面大概是他的 9 倍吧……错位相减，等于 8460\"。）\n  > \"放缩相对来说是一个比较稳定的、在这种增速超过百分之十的时候比较稳定可靠的计算方式。但是在有的题上，它没有份数法快。份数法的优点是你有时候只要做一个简单的除法，除一个整数很快，可以很快把八万四左右给它估出来。\"\n- **陷阱类型：时间陷阱（隔年基期）+ 方向陷阱（调大调小的方向）。**\n  > 老师原话：\"**有人问，那怎么判断什么时候算基期块、什么时候算增量块呢？你只要增速是……符合这个条件，你就去用化除为乘，它是最快的；你只要增速符合这个条件，你就用分数法，它是最快的；如果这两个条件都不满足，你就给我去用放缩法。没毛病吧？三板斧。**\"\n\n**（同题再现：提前修正的做法）** 老师在讲\"提前修正\"时，又拿本题做了一次演示（画面在本题上补写）：\n\n```\n980 ↓ −50 → 930        （增速调大，现期调小）\n159 ↑ +8  → 167 = 1/6\n\n930 ÷ 7 = 133\n\n133\n84700\n```\n\n> 老师原话：\"980、159，我们把 159 变成 167，是不是加了个 8？那 980 大概是在 6 倍左右，减个 48、减个 50，就 930。六分之一，我们拿 930 除以 7，大概就是 133 左右。980 减 133 就是 847。\"\n> \"**但就是在过程中给它凑成（整），在这个地方呢，用的有点勉强了。因为本身九百八，你把它往下减，它也凑不到什么很整的地方去。你要说胆子大一点，那 97 会胆子太大了，违反（误差）太大了。这个（980）本身就比较整的，就不用管了。**\"\n\n---\n\n### 第 3 题｜2021 年 · 全国地级及以上城市 PM2.5 年均浓度\n\n**【题干原文】**\n\n> 2021 年，全国地级及以上城市平均空气质量优良天数占比为 87.5%，比 2015 年提高 6.3 个百分点，PM2.5 年均浓度为 30 毫克/立方米，比 2015 年下降 34.8%。\n> 2015 年全国地级及以上城市 PM2.5 年均浓度为：\n\n**【材料数据】**\n\n| 指标 | 数值 |\n|---|---|\n| 2021 年，平均空气质量优良天数占比 | 87.5% |\n| 比 2015 年提高 | 6.3 个百分点（**干扰信息**） |\n| 2021 年 PM2.5 年均浓度（现期） | 30 毫克/立方米 |\n| 比 2015 年下降 | 34.8%（**负增长**） |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知现期值 + 负增长率，求**基
