− 基期 = 现期/(1+增速) − 基期 … | 由「增量 = 现期 − 基期」一步变形 |\n\n---\n\n## 壹　大纲概述\n\n> 以国考的要求为例，去年国考的招考公告里面对资料分析这一块的描述是这样子的。\n\n**PPT 原文（原帧 f_0014 / f_0019）**：\n\n> 资料分析主要测查报考者对文字、数字、图表等统计性资料的**综合理解与分析加工能力**。\n>\n> 一、综合理解能力，需要我们理解题目要求、名词含义、材料逻辑框架、材料数据关系。\n>\n> 二、分析加工能力，也就是根据数据进行分析、运算、得到题目要求的结果的能力。\n\n**老师板书（红笔手写）**：\n\n```\n算 → 末\n```\n\n> ⭐ 总结：**「算」在资料分析里其实是末位的东西，是最末流的东西。** 你算得快、算得慢，其实真的对于你资料分析的那个用时正确率来说，影响真的是不大的。\n>\n> 有很多人他的速算运算能力比我还强，但是我做资料分析从来不虚他们。因为算术这个东西真的在资料分析里面地位没有那么大，没有那么重要。\n\n**考纲拆解**：\n\n| 能力 | 内涵 | 老师举例 |\n| --- | --- | --- |\n| 综合理解能力 | 理解题目要求、名词含义、材料逻辑框架、材料数据关系 | 问你「增长贡献率」是多少，你得先知道这个词什么意思；问你「比什么提高多少个百分点」，你没考虑到它是算增量，方向就错了 |\n| 分析加工能力 | 根据数据进行分析、运算、得到题目要求的结果 | 拿到数据不是上来就算，要先经过一定的分析加工，再去算 |\n\n> 报考公告直接告诉你：**我会考什么，以及我考察你的能力是什么。**\n> 它考的是文字、数字、图表这些统计型资料，考察你的不是「一加一等于二」，而是综合理解和分析加工能力。\n\n**课程分工**：\n\n> 今天这节课我们主要讲的就是**综合理解**部分，希望能够理解好题目。\n> 至于后面的、对于数据的处理，主要是**下周二**会去讲怎么处理数据、分析数据。\n\n---\n\n## 贰　基本概念\n\n> 我们讲的是资料分析里面最基本的增长情况，主要是**增长量**和**增长率**。\n\n### 2.1 基期值 / 现期值 / 增长量\n\n**PPT 原文（原帧 f_0046）**：\n\n> - **基期值**：特定对象在以前某个时间点下的数值\n> - **现期值**：特定对象在现在时间点下的数值\n> - **增长量**：特定对象从基期值到现期值增长的量，**增量＝现期值－基期值**\n\n**老师举例与板书（红笔手写，原帧 f_0055 / f_0058 / f_0061）**：\n\n研究对象：**人均收入**（老师板书特别标注「人均收入」以区别于「人均可支配收入」）。\n\n```\n基期：2025 年   →   4000 元/月\n现期：2026 年   →   5000 元/月\n增加：+1000 元/月\n```\n\n- 讨论去年（2025 年）的值 → 是**基期值**（靠前的时间点）。\n- 讨论今年（2026 年）的值 → 是**现期值**（靠后的时间点）。\n- 增长量：从 4000 涨到 5000，涨了 1000，**这就是增量**。\n\n> 这三个数之间就是**加减关系**（老师板书：**加减**）。\n\n**三个加减公式（板书：=`现`－`增量` 等）**：\n\n```\n现期值 = 基期值 + 增量          （基期值加了个增量，变成了现期值）\n增长量 = 现期值 − 基期值        （看增长多少，就拿现期减基期）\n基期值 = 现期值 − 增量          （把刚刚加上的增量退回去）\n```\n\n> 我从 5000 退 1000 回去，变成了 4000——怎么通过现期、增量去计算机期，以及怎么通过现期、基期算增量，都是这个加减关系。\n\n**增量有正有负**：\n\n```\n正增长：基期 4000 → 现期 5000，增量 = 5000 − 4000 = +1000\n负增长：基期 6000 → 现期 4500，增量 = 4500 − 6000 = −1500\n```\n\n> 注意这个增量，它是有正有负的，都是可以的。它不管你现期值、基期值哪个大。\n> 如果你基期值高一点（6000）、现期值低一点（4500），你的增量还是要拿现期去减基期，**增量就是负 1500**，通过这个负来体现今年是减少的。\n\n### 2.2 同比增量与环比增量\n\n> 增长量主要分两种：一种是**同比增量**，一种是**环比增量**。\n\n**PPT 原文（原帧 f_0064，左图：图 2 煤炭进口月度走势）**：\n\n> - **同比增量**：基期是与**上一年同期**时的增量\n> - **环比增量**：基期是**上一个连续周期**时的增量，**月、季度、半年**\n\n**配套材料：图 2 煤炭进口月度走势（原帧 f_0064，逐字抄录）**\n\n| 时间 | 2023年5月 | 6月 | 7月 | 8月 | 9月 | 10月 | 11月 | 12月 | 2024年1-2月 | 3月 | 4月 | 5月 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 当月进口量（万吨） | 3958 | 3987 | 3926 | 4433 | 4214 | 3599 | 4351 | 4730 | 7452 | 4138 | 4525 | 4382 |\n| 当月同比增速（%） | 92.7 | 110.1 | 67.2 | 50.8 | 27.8 | 23.3 | 34.8 | 53.0 | 22.9 | 0.5 | 11.3 | 10.7 |\n\n> 图例：■ 当月进口量（万吨）　▬ 当月同比增速（%）\n\n**同比增量算例（老师口述）**：\n\n```\n5 月份的同比增量 → 要找上一年（2023 年）的 5 月份\n2023年5月 3958  →  2024年5月 4382\n同比增量 ≈ 4382 − 3958 = 424\n```\n\n> 上一年的同时期就叫**同比**，跟上一年同时期相比增长了多少。**同比就是把时间点固定在上一年的同期。**\n> （4 月份因为图表没给到对应上一年同月，所以改用 5 月份来举例。）\n\n**环比增量算例（老师口述）**：\n\n```\n5 月份的环比增量 → 时间跨度是一个月，往前推一个月即 4 月份\n2024年4月 4525  →  2024年5月 4382\n环比增量 ≈ 4382 − 4525 = −143（负的）\n```\n\n> 环比指的是跟**上一个连续周期**相比的增量。为什么叫环？因为这种连续的周期像环一样，一环接一环扣在一起：\n> 四月加一个环比增量变成五月，五月再加一个环比增量变成六月，六月再加一个变成七月——时间是连续的、连在一起的。\n\n**「往前推」规则（老师逐一讲解）**：\n\n| 口径 | 时间跨度 | 环比基期＝往前推 | 同比基期＝往前推 |\n| --- | --- | --- | --- |\n| 月 | 一个月 | 往前推一个月（如 2017 年 5 月 → 2017 年 4 月） | 往前推一年（2017年5月 → 2016年5月） |\n| 季度 | 一季度 | 往前推一个季度（2024 年二季度 → 2024 年一季度） | 往前推一年（2024年二季度 → 2023年二季度） |\n| 半年 | 半年 | 往前推半年（2024 年下半年 → 2024 年上半年） | 往前推一年（2024年下半年 → 2023年下半年） |\n| 跨年示例 | — | 2017 年 1 月环比＝2016 年 12 月；2024 年一季度环比＝2023 年四季度 | 一律直接往前推一年 |\n\n> 环比的三个时间点：**月、季度、半年**。它就一个规则——**拿时间往前推一个周期**，可以跨年，也可以不跨年。\n> 比如 2017 年 1 月，环比就是 2016 年 12 月，反正就是往前推一个月嘛；2024 年一季度，环比就在 2023 年四季度。\n\n**两个课堂提问（老师集中答疑）**：\n\n1. **「环比这个时间跨度有没有超过一年的？」**\n   > 目前行测资料分析里面没有出现过问环比、且时间跨度超过一年的，因为没有必要。\n   > 你说一年也能说环比：2024 年全年的环比，就只能理解为 2023 年——但这不就是完全等同于同比吗？所以不这么问。\n   > 五年规划也不会问环比，只会问「跟上一个五年计划相比」。\n\n2. **「同比怎么推？」**\n   > 同比是最简单的：直接把它的年份往前推一年，你不用管它后面怎么描述的。\n   > 比如 2024 年下半年的同比，肯定就是 2023 年下半年，直接往前推一年。\n   > 环比呢，就是把这个时间点往前挪一个周期：2024 年下半年的环比就是 2024 年上半年。\n\n### 2.3 一到二月份数据合并的口径问题\n\n> 还有一些常见的，像**一到二月份**，这个东西也蛮特殊的。\n\n**常见考法**：给「1-2 月」的合计值 + 再单独给「2 月」的值，问 1 月是多少。\n\n| 已知 | 求 | 方法 |\n| --- | --- | --- |\n| 1-2 月合计、2 月 | 1 月 | 1 月 ＝ 1-2 月累计 − 2 月 |\n\n**为什么要特别提醒 1-2 月**：\n\n> 因为**一到二月的出题频率更高**。为什么？因为他给的数据都来自现实生活——\n> 统计那些制造业、服务业的量（比如天然气产量）的时候，为什么要把 1、2 月放在一起？因为要**考虑春节**。\n> 春节我们会有一长段时间放假，会导致工厂停工、产量或服务业的营业额下降，所以要合并起来看，才能**避免数据失真**。\n\n**数据失真举例（老师口述）**：\n\n> 比如 2022 年 1 月过的春节，当年 1 月产量只有 4 万吨；2 月恢复工作，搞了 8 万吨。\n> 到了 2023 年，春节对应到阳历的日子不是一对一的，可能今年晚春节、2 月才过年——\n> 结果数据一写出来：1 月同比增长 100%，2 月同比下降 50%。\n> 这就会被拿去做文章：说「中国今年 2 月什么指标同比下降 50%，社会生产停滞」。\n> 所以 **1-2 月经常放在一起公布**，一定要小心。\n\n> ⚠️ 他给 1-2 月合并的数据给你，你是不知道里面 1 月、2 月各自是什么情况的，除非他再单独给你 1 月或单独给你 2 月，你去做差，才能知道另外一个月的情况。\n\n**配套图（原帧 f_0320）：2020 年 1 月—2021 年 2 月各月全国天然气日均产量及同比增速**\n\n- 图例：□ 日均产量　▬ 同比增速\n- 横轴：2020 年 1 月—2021 年 2 月（1-2 月合并为一根柱）\n\n**老师板书（红笔手写）**：\n\n```\n春节\n22 年 1 月  4 万吨        23 年 1 月  8 吨\n22 年 2 月  8 万吨        23 年 2 月  4 吨\n（同比：+100% / −50%）\n```\n\n> 这就说明：给「1-2 月合并」的数据，如果不去注意，就会出现「某月同比增长 100%」「某月同比下降 50%」这种失真结论。\n\n### 2.4 累计值相减求某一段\n\n> 累计值的时候有个特殊一点的：比如他给你个 1-7 月，再问你 1-5 月，本质逻辑还是一样的。\n\n**方法核心**：你要的数据他不直接给，你就去看看**要减掉的部分在哪里**。\n\n```\n给 1-7 月，问 1-5 月  →  要减掉的是「6 月」和「7 月」\n```\n\n**数据可能给的形态**：\n\n| 已知条件 | 怎么凑出要减掉的部分 |\n| --- | --- |\n| 给 1-7 月、给 7 月、再给一个 7 月的**环比**（增量或增速） | 通过环比反推出 6 月的值，从而把 6 月、7 月都减掉 |\n| 给 1-12 月、给 12 月、给 1-7 月、给 7 月 | 找到 7、6 月，把 1-7 里的 6、7 月全减掉，得到 1-5 月 |\n\n> 找不到 6 月，那你就去想怎么通过 7 月找 6 月——**不就是环比吗？**\n> 可以给增量，也可以给增速，通过环比的增速或增量去计算得到 6 月的值。\n\n**举例：以「累计产量」表求单季度（老师口述）**\n\n表头写「累计产量」，列出 2、3、4、5、6 …… 11 月：从 83 一直到 373，这些数字**不是当月的值**，是这一年从 1 月开始累计加起来的。\n\n```\n2 月累计 = 1 月份 + 2 月份\n3 月累计 = 1 月累计 + 2 月 + 3 月 = 2 月累计 + 3 月\n```\n\n> 所以要算**第三季度**（7、8、9 月）：\n> 9 月的值是一到九月的累计，我要算的是七、八、九，那把「一到六」扣掉就好了：\n> 第三季度 ＝ 9 月累计 − 6 月累计 （如 298 − 215）。\n> 要问 11 月：11 月 ＝ 11 月累计 − 10 月累计。\n\n**A 与非 A（老师总结的通用规律）**：\n\n> 这类题的特征都是 **A 与非 A 的关系**：题目材料里给个 A，他问你非 A，你发现找不到这个非 A，其实是因为你没去找这个 A。\n\n| 材料给 | 问 | 减掉谁 |\n| --- | --- | --- |\n| 全年 + 上半年 | 下半年 | 全年 − 上半年 |\n| 全年 + 下半年 | 上半年 | 全年 − 下半年 |\n| 全年 + 前三季度 | 第四季度 | 全年 − 前三季度 |\n| 上半年 + 一季度 | 二季度 | 上半年 − 一季度 |\n| 各月**累计**与单月 | 某一单月/单季度 | 相邻累计相减 |\n\n**PPT 原文（原帧 f_0285，标题：矛盾型 A 与非 A 数据分布）**：\n\n> - 全年与上/下半年\n> - 全年与前三季度\n> - 上半年与一季度\n>\n> （各月累计与单季度）\n>\n> - 1~2 月与 2 月\n> - 全年与 12 月\n> - 1~7 月与 1~6 月与 1~5 月\n\n> 老师在这页圈出「全年与前三季度」，板书追问：「**四季度？**」（即：问四季度就用全年 − 前三季度）。\n\n**配套材料（原帧 f_0290 / f_0295）：2020 年 2—11 月白酒、啤酒累计产量情况**\n\n| 时间 | 白酒累计产量（千万升） | 白酒同比增速（%） | 啤酒累计产量（千万升） | 啤酒同比增速（%） |\n| --- | --- | --- | --- | --- |\n| 2 月 | 83 | −26.6 | 567 | 8 |\n| 3 月 | 126 | −15.3 | 872 | 2.3 |\n| 4 月 | 156 | −1.6 | 1150 | 0.8 |\n| 5 月 | 190 | 2.3 | 1505 | −0.3 |\n| 6 月 | 215 | 2.4 | 1909 | −1 |\n| 7 月 | 235 | −0.9 | 2267 | −2.7 |\n| 8 月 | 262 | 0.0 | 2638 | −2.3 |\n| 9 月 | 298 | −2.8 | 2930 | −2.1 |\n| 10 月 | 332 | −4.5 | 3108 | −2.3 |\n| 11 月 | 373 | −5.9 | 3277 | −1.9 |\n\n> ⚠️ 注意表头写的是「**累计产量**」，这些数字不是当月的值，是从 1 月开始累计到该月的合计数。\n\n**老师板书推导（红笔手写）**：\n\n```\n三季度 = 7 + 8 + 9\n       = 9 月累计 − 6 月累计\n       = 298 − 215\n```\n\n> 九月累计是一到九的，我要七八九，就把一到六扣掉：等于 9 月累计减 6 月累计（298 − 215）。\n> 要问 11 月：11 月 ＝ 11 月累计 − 10 月累计。这就是「要的数据不直接给，就去看要减掉的部分在哪」。\n\n### 2.5 增量的特殊描述——变化量\n\n> 在增量这块，还有最后一个地方：增量有一些**特殊的描述方式**，它描述的是一个变化情况，但这个词不是增量，含义就会发生变化——叫**变化量**。\n\n```\n变化量 = 增量的绝对值\n```\n\n> 只要涉及到「变化」的，都是**绝对值**。他不看你这个数据是变高还是变低，只看你变化了多少、不看方向。\n> 从 100 变成 120，跟从 100 变成 80，他们的变化量是一致的。\n\n（对应的例题见下文【例题精讲】第 5 题。）\n\n### 2.6 增速（增长率）\n\n> 刚刚讲的增量是**加减法**，是现期跟基期之间的差值；而下面讲的这个东西，同样也在描述一个增长情况，但是它是一个**比例**——是**增速**。\n\n**定义**：\n\n```\n增速 = 增量占基期的比例 = 增量 ÷ 基期值\n```\n\n**老师举例**：\n\n| 情景 | 基期 | 现期 | 增量 | 增速 |\n| --- | --- | --- | --- | --- |\n| 1000 → 2000 | 1000 | 2000 | +1000 | 1000 ÷ 1000 = **100%** |\n| 1000 → 1500 | 1000 | 1500 | +500 | 500 ÷ 1000 = **50%** |\n| 2000 → 1000（下降） | 2000 | 1000 | −1000 | −1000 ÷ 2000 = **−50%** |\n\n> 增速就是看你变化的这个量，在这个基期里面的占比。1000 除以 1000 就是百分之百。\n> 从 2000 变成 1000，减少了一千，还是看这个增量在基期里面的占比，拿这个负一千除这个两千，就是**负的百分之五十**，即减少了百分之五十。\n\n**公式链（PPT 与板书）**：\n\n```\n增速 = 增量 ÷ 基期值\n     = (现期值 − 基期值) ÷ 基期值\n     = 现期值 ÷ 基期值 − 1\n```\n\n```\n1 + 增速 = 现期值 ÷ 基期值\n现期值   = 基期值 × (1 + 增速)\n基期值   = 现期值 ÷ (1 + 增速)\n```\n\n**增长倍数 / 「增加 0.5 倍」与「增加 50%」的区别**：\n\n> 1000 涨到 1500，增加了 500，也就是增加了 50%。\n> 其实可以这么想：我这个 1500 是你 1000 的多少倍？**1.5 倍 = 150%**。\n> 我从你原来的 100% 变成了现在的 150%，不就增加了 50% 吗？\n\n```\n现期 ÷ 基期 = 1.5 倍 = 150%\n增加 0.5 倍 = 增加 50%\n```\n\n> ⭐ 为什么会差个一、差个一倍、差个百分之百？因为前面说的是**增加的量，不管原来的**；后面这个数**带上了原来的基期**。\n> 这就是增速的计算关系。\n\n（对应的三道例题见下文【例题精讲】第 6、7、8 题。）\n\n---\n\n## 叁　做题模式\n\n> 课上我是会把这个对应的题目和它对应的数据、那些图表文字都摘给你的，你不需要去找数据。\n> 但是实际考试的时候，他不会把数字摆在跟前——可能先是一长串的文字，又是一个表格，再是一个表格。\n\n### 3.1 错误做法：1 材料 → 2 题目 → 3 材料\n\n> 有一位同学是这样读题做题的：先把材料过一遍，了解一下这个材料在聊什么、数据一般在哪个位置；材料看完了，再去看题目；看完第一题，又回头去材料里找对应的数据。\n\n> 这么做确实对你的正确率没有什么影响，说不定正确率还能提高一点（更谨慎一点），但**最大的问题就是太慢了，比蜗牛还慢。**\n> 我算算看：我一篇资料分析五题，两到三分钟过去了，你两分钟刚把材料读完，我下一篇了。\n\n### 3.2 正确做法：先读题，再回材料找数\n\n> **千万不要先读材料再读题，上来你就去读题。** 直接看那个题目在问你什么，根据它问的要求，去材料里找需要的东西。\n\n**为什么能这么做**：要对整体材料的**框架**先有个大概的了解；出题人的题目数据，**基本是按题目顺序在材料里排的**。\n\n> 第一题的数据往往在第一段或第二段；第二题的就在对应的位置；材料里面对应的数据都是跟你题目的顺序基本一致的。\n> 当然肯定也有个例，不可能每个题目都一样。但**胆大一点，直接干，人有多大胆地有多大产**；你畏手畏脚，做题速度就上不去。\n\n**做题两要素：抓主语 + 抓定语**。\n\n> 找数据时注意两样东西：一个是**主语**，另一个是**定语**。定语也很重要。\n> 如果这个东西有定语，往往材料里有很多跟这个「企业」有关的数据，但只有一个是你要找的「**有进出口实绩的**」。\n\n**课堂举例（即下文 3.4 的纯文字材料第 1 题）**：\n\n> 问：2024 年，我国有进出口实绩的企业有多少家？\n> 从上往下找，第一题的数据往往在第一段或第二段。看上半部分，一眼就能抓出「有进出口实绩的企业」。\n> 「超 50 万家」这个数据是我们想要的吗？不是——他只是说超过 50 万家，不是具体数据；再往后找，因为**时间也不对**（2024 年在这儿呢）；再看「有进出口实绩的企业达多少家」，但那是**民营**企业里的，只是这个企业的一部分。\n\n**三个找数技巧**：\n\n| 技巧 | 说明 |\n| --- | --- |\n| 盯阿拉伯数字 | 文字太多时，先扫那些阿拉伯数字，看数字前面有没有要找的对象；也可以带着看文字，有些文字比较特殊 |\n| 盯括号 | 文字里带**括号**的，是不同的对应方式，是很好的定位锚点 |\n| 看表头 | 看表的时候一定要把**表头**瞄一眼——它只有一行，不占时间，很多时候能帮你避免错误 |\n\n> 比如说「部分地区」，你有没有看到「部分」两个字？比如说「累计量」，你有没有注意到「累计量」？很多时候就是因为表图上你没注意到这个，题目你就做错了。\n> 图表型的数据往往比较好找：直接去找对应的**代码/名称**，再找对应的时间（表头）。\n\n**PPT 材料（原帧 f_0160 / f_0165）**：\n\n> 我国 2015 年全年全社会固定资产投资 562000 亿元，固定资产投资（不含农户）551590 亿元，增长 10.0%。\n> 从各区域看，东部地区投资 232107 亿元，比上年增长 12.4%；中部地区投资 143118 亿元，增长 15.2%；西部地区投资 140416 亿元，增长 8.7%；东北地区投资 40806 亿元，下降 11.1%。\n\n**配套饼图：2015 年按领域分固定资产投资（不含农户）及其占比（逐字抄录）**\n\n| 领域 | 投资额（亿元） | 占比 |\n| --- | --- | --- |\n| 制造业投资 | 180365 | 32.70% |\n| 基础设施投资 | 101271 | 18.40% |\n| 房地产开发投资 | 95979 | 17.40% |\n| 其他投资 | 173976 | 31.50% |\n\n**老师板书（红笔手写）**：\n\n```\n1、材料 —— 2、题目 —— 3、材料\n```\n\n（此处 1 材料＝整体先扫一眼框架；2 题目＝先读题；3 材料＝回材料定位数据。）\n\n### 3.3 斜率能不能代表增量 / 增速（老师专门说明）\n\n> 有同学问：能不能看斜率？柱状图的斜率代表什么，我统一说一下，省得后面做增速的时候还有人问。\n\n**板书推导（原帧 f_0145）**：\n\n```\n斜率 = Δ / m\n```\n\n> 斜率 ＝ 这条线的高 ÷ 这条线的长度。这部分（高度差）是**增量**；这部分（横轴长度）是这个图表里每一年的**固定值**。\n> 所以斜率其实就等于**增量 ÷ 一个固定值**——制图人每年的时间间隔长度固定，所以**斜率的高低确实可以代表增量的大小**。\n\n> 但**只能是增量的大小**，而且这东西其实没什么用：你简简单单减一下增量，不就一下出来了吗？直接减不就好了吗？\n\n> ⚠️ **更不能拿斜率去看增速。** 因为它的**分母并不是一个固定的长度**（基期值每年在变），所以你千万不能把这个斜率当做增速。\n> 我从来不去看什么斜率，最多只是粗略瞄一眼柱子、感觉某一年涨得少、两根柱子离得很近，直接做差就行。\n\n（对应的例题见下文【例题精讲】第 1 题。）\n\n---\n\n### 3.4 PPT 材料演示：纯文字材料如何找数（原帧 f_0177 / f_0196）\n\n> 我拿一个材料来举个例子，这应该就是一个相对来说比较常见的纯文字型资料分析出法。\n\n**材料原文（逐字抄录）**：\n\n> 2009 年，民营企业进出口 3.45 万亿元，占同期我国进出口总额的 22.9%，比重首次超过国有企业。2019 年，民营企业进出口 13.49 万亿元，占同期我国进出口总额的 42.7%，首次成为第一大外贸经营主体并保持至今。2024 年，民营企业进出口占同期我国进出口总额的 55.5%。2025 年前两个月，民营企业进出口 3.69 万亿元。\n>\n> 2022 年，我国有进出口实绩的民营企业数量迈上 50 万家台阶。2024 年，我国有进出口实绩的民营企业数量达 60.9 万家，占我国有进出口实绩企业总数的 87.1%。\n>\n> 2024 年，民营企业出口高新技术产品 3.05 万亿元，较 2019 年增长 94.5%，占我国同类商品出口比重较 2019 年（下同）提升 17.5 个百分点至 48.6%。手机、汽车（包括底盘）、蓄电池、电脑、船舶出口额较 2019 年分别增长 123.8%、10.5 倍、461.6%、83.9%、375%，占比分别提升 30.1 个、18.3 个、19.4 个、11.2 个、20.3 个百分点至 59.7%、51.5%、69.4%、27.2%、38.6%。2025 年前两个月，民营企业上述商品出口额同比分别增长 11.8%、11%、20.3%、1.7%、25.2%。\n>\n> 2024 年，民营企业进口大宗商品 1.91 万亿元，较 2019 年增长 107.8%。同期，国有企业、外商投资企业大宗商品进口额占我国大宗商品进口额比重分别较 2019 年下降 8.6 个、0.7 个百分点至 55.4%、9.3%。\n>\n> 2025 年前两个月，民营企业对传统市场（美国、欧盟、日本、我国香港地区、英国等）、东盟、拉美分别进口 1.26 万亿元、6310.2 亿元、3247.9 亿元，同比分别增长 4%、增长 4.8%、下降 1.3%。\n\n**配套题目（原帧同页右侧，选项为示意，画面上写作 xx）**：\n\n> 1. 2024 年，我国有进出口实绩的企业约有多少万家？（A.xx　B.xx　C.xx　D.xx）\n> 2. 将手机、蓄电池、船舶三类商品按 2019 年民营企业出口额占我国同类产品出口额比重从高到低排列，正确的是：（A.xx、xx、xx　B.xx、xx、xx　C.xx、xx、xx　D.xx、xx、xx）\n> 3. 2019 年，国有企业大宗商品进口额约是外商投资企业大宗商品进口额的多少倍？（A.xx　B.xx　C.xx　D.xx）\n> 4. 关于 2025 年前两个月民营企业进出口总额，以下饼图能准确反映传统市场（白色）、东盟（灰色）和其他地区（黑色）占比关系的是：\n\n**老师板书（红笔手写）**：\n\n```\n文字材料先找数字、注意定语、主语\n```\n\n> 讲第 1 题时：「有进出口实绩的企业」这个**定语**很关键，材料里有很多跟企业相关的数据，但只有一个是你要找的「有进出口实绩的」。\n> 讲第 2 题时：老师圈出「（xxx）」，提示用**括号**做定位。\n> （本题组在课上仅用于演示找数方法，未在课内给答案。）\n\n### 3.5 图表型数据的找法（原帧 f_0200）\n\n> 问 2024 年全国 R&D 经费的增量比上一年高多少、低多少，在哪个范围——这种图表题就不用去找那么多阿拉伯数字，直接去找对应名称和时间。\n\n**配套材料：2021—2024 年全国及部分省市 R&D 经费及其投入强度（摘录「全国」行）**\n\n| 指标 | 2021 | 2022 | 2023 | 2024 |\n| --- | --- | --- | --- | --- |\n| 全国 R&D 经费（亿元） | 27956.3 | 30782.9 | 33357.1 | 36326.8 |\n| 全国投入强度（%） | 2.44 | 2.54 | 2.58 | 2.69 |\n\n（其余省市行 2024 年 R&D 经费：北京 3278.4、上海 2343.7、江苏 4597.5、浙江 2901.4、安徽 1396.2、福建 1257.2、江西 666.3、山东 2597.3、河南 1275.1、湖北 1581.1、湖南 1394.6、广东 5099.6、重庆 797.3、四川 1496.8，单位均为亿元。）\n\n> 24 年从 3 万 3 涨到 3 万 6，涨了 3000；23 年的增量是从 22 年涨到 23 年，2600 不到。\n> 所以 24 年增量 3000 左右，23 年增量 2600 左右——24 年高，高个几百（高 200 以上）。\n\n### 3.6 环比型数据的找法（原帧 f_0212 / f_0216）\n\n> 你只要找准它对应的现期时间点和基期时间点就可以了。\n\n**配套材料：表 2　2025 年 5-6 月地方政府债券投资者持有结构情况**\n\n| 持有机构 | 5 月金额（亿元） | 5 月占比（%） | 6 月金额（亿元） | 6 月占比（%） |\n| --- | --- | --- | --- | --- |\n| 商业银行 | 366807.08 | 71.92 | 371255.62 | 71.87 |\n| 信用社 | 2662.62 | 0.52 | 26330.15 | 0.51 |\n| 保险机构 | 23560.8 | 4.62 | 23895.21 | 4.63 |\n| 证券公司 | 4554.05 | 0.89 | 4914.22 | 0.95 |\n| 非法人产品 | 44273.84 | 8.68 | 45476.05 | 8.8 |\n| 境外机构 | 89.35 | 0.02 | 95.15 | 0.02 |\n| 其他 | 46382.4 | 9.09 | 46228.54 | 8.95 |\n| 柜台市场 | 256.4 | 0.05 | 287.17 | 0.06 |\n| 其他市场 | 21449.95 | 4.21 | 21768.36 | 4.21 |\n| 合计 | 510036.49 | 100 | 516550.47 | 100 |\n\n（「银行间市场」为前 7 行的类别行。）\n\n> 看表的时候，大家一定要把**表头**看一下。表头是图表里一个非常重要的数据，而且它只有一行，不会占用你什么时间。\n> 表头上写着「2025 年 5-6 月地方政府债券投资者持有结构情况」——所以找不到「地方政府债券」，就说明你要找的其实是**整个表的合计**。\n> 六月份的值就在「合计」这行：从 51 万涨到 51 万 6，涨了 6500 左右 → 选 C。\n\n---\n\n## 肆　易混淆点\n\n> 我们再来讲一下今天讲的东西的一个容易混淆的地方，有些点容易搞混。\n\n### 4.1 百分点\n\n**PPT 原文（原帧 f_0460 / f_0490）**：\n\n> **百分点**：一般用「xx 个百分点」描述**百分号数据的增量**，与常规增速 xx% 作出区分。\n>\n> 常见百分号数据：**增速、比重、利润率……**\n\n**老师板书（红笔手写）**：\n\n```\n25%（基） ──→ 30%（现）\n   +5 个百分点\n25% × (1 + 5%) = 26.25%   （这是错的读法）\n\nΔ = 现 − 基\nr = 增量 / 基期   （划掉——这类数据不谈增速）\n```\n\n> 讲极个别情况：`极个别：r=20%  r=30%  10%`\n\n> ⭐ **百分点的存在，就是为了把「增量」和「增速」区分开。**\n> 我们有些时候就是为了做一个区分——做什么的区分呢？就是增量跟增速的区分。\n\n**为什么要用百分点**：\n\n> 如果说我拿利润率来说：去年利润率是 25%，今年利润率是 30%，从基期变成现期，我是不是提高了？\n> 描述这种提高，一般有两种描述：一种是**增量的描述**（现期减基期），一种是**比例型的描述**（增量除以基期）。\n> 但当讨论的数据**自带百分号**时，我们一般不用「比例」的形式描述，而是单纯描述它的**增量**。\n>\n> 如果我写成「增加了 5%」，有些人会有歧义、会以为是增速，以为今年是 `25% × (1+5%) = 26.25%`——这就不对了。\n> 所以为了避免歧义，我们专门把这种情况用「**多少个百分点**」来描述：从 20% 变成 30%，就是**提高了 5 个百分点**。\n> 这叫约定俗成：我跟你约好了，描述「多少个百分点」时，其实就是**一个增量**——是自带百分号数据的增量，即现期减基期。\n\n**常见带百分号数据举例**：\n\n| 数据 | 基期 | 现期 | 正确说法 |\n| --- | --- | --- | --- |\n| 增速 | 2023 年 20% | 2024 年 30% | 增速**提高 10 个百分点** |\n| 比重 | 2023 年 25% | 2024 年 26% | 比重**提高 1 个百分点** |\n| 利润率 | 去年 25% | 今年 30% | 利润率**提高 5 个百分点** |\n\n> ⚠️ 对百分号数据，咱一般不讨论增速。你在题目里看到这种百分号数据，都是说多少个百分点的。\n>\n> 另注：所谓「比重增长率」，是我们**为了计算**捏造出来的一个计算方式，**不是资料分析题目会考察的内容**。\n\n> 极个别不懂事的出题人，会把「从 20% 变成 30%」说成「提高了 10%」。就算他那么写了，**你也要知道它说的就是增量**，不要把它当作增速。一般都是老题、或比较小考试的题，出得不严谨。\n\n（对应例题见【例题精讲】第 9 题。）\n\n### 4.2 变化量 / 降幅 / 变化幅度 / 增幅\n\n**PPT 原文（原帧 f_0513 / f_0530）**：\n\n> - **降幅**：减少量与基期的比值，等同于降速，`降幅 ＝ 减少量/基期 ＝ (基期 − 现期)/基期 ＝ |r|`\n> - **变化量**：增量的绝对值，基期与现期中的**大数 − 小数**\n> - **变化幅度**：变化量与基期的比值，等同于变化率，`变化幅度 ＝ 变化量/基期 ＝ |r|`\n\n**老师板书（红笔手写）**：`幅 → 绝`（带「降 / 变化」含义的，才取绝对值）\n\n**四个说法的辨析（本集最重要的一组易混点）**：\n\n| 说法 | 含义 | 是否取绝对值 | 有无正负 |\n| --- | --- | --- | --- |\n| **变化量** | 增量的绝对值 | ✅ 取 | 只有大小 |\n| **降幅** | 增速的绝对值 | ✅ 取 | 只有大小，**仅下降时才有** |\n| **变化幅度** | 增速的绝对值 | ✅ 取 | 只有大小 |\n| **增幅 / 增长率 / 增长幅度** | 就是增速 | ❌ 不取 | **有正有负** |\n\n> 降幅它也是增速绝对值，但是它**只有在下降的时候才用得上**。\n> 比如说我从 2000 跌到了 1000，我的增速是 −50%，那它的降幅就是 **50%**，取这个 −50% 的绝对值。\n\n**课堂提问：哪一组降幅最大？（老师口述）**\n\n| 组 | 变化 | 增速 | 降幅 | 变化幅度 |\n| --- | --- | --- | --- | --- |\n| 一 | 100 → 2000 | +1900% | **无**（没下降） | 1900% |\n| 二 | 100 → 50 | −50% | **50%** | 50% |\n| 三 | 100 → 80 | −20% | 20% | 20% |\n\n> 千万不能就只记一个「增速的绝对值」，说上面这组增速 1900% 所以降幅最大——**错了**。\n> 因为**只有下降了，它才有降幅**，才有这个属性。所以是**第二组**，它的降幅最大，是 50%。\n> 第一组它没有降幅。\n> 只有下降才有降幅、才有减少量。不然你总不能说这个东西降幅是个「负 1900%」吧，那不很奇怪吗？\n\n**老师辟谣：⭐「只要带『幅度』就是绝对值」——大错特错**\n\n> 有同学说了一个市面上流传很广、但其实是**有问题**的一句话：「只要看到『幅』就是绝对值」。\n> **错，大错特错！那增幅是绝对值吗？增幅就是增速。**\n>\n> 你看 2009 年江苏真题里有一道题「涨跌幅度 / 涨跌幅」，**涨跌幅它也是增速，也是有正有负的**。\n> 为什么有的「幅度」是绝对值？是因为它描述的是**下降**的幅度、看的是**变化**。\n> 这些取决于「**降**」、取决于「**变化**」，**不是因为这个「幅」**。\n> 涨跌幅度跟变化幅度**不是同义词**。官方定义上，涨跌幅就是有正负的（百度上也能搜到，以前的历史真题也有）。\n\n| 组合 | 是否取绝对值 |\n| --- | --- |\n| 降幅 / 降速 / 减少量 / 变化幅度 / 变化量 | ✅ 取绝对值 |\n| 增幅 / 增速 / 增长率 / 增长幅度 / **涨跌幅度 / 涨跌幅** | ❌ 就是增速，有正有负 |\n\n> ⭐ 「幅率」都只是一个形容，它是个比例、比值，只是为了跟「量」做区分。\n> 至于什么时候取绝对值，你要看你**描述的东西**是什么：描述的是降低的量、减少的量、减少的比例——这些才取绝对值。\n\n（对应例题见【例题精讲】第 10、11 题。）\n\n---\n\n## 伍　计算公式\n\n> 前面讲增量，都是拿现期减基期的。可是有的地方他不给你基期，只给你一个现期和增速，怎么办呢？所以把式子稍微转化一下。\n\n**PPT 原文（原帧 f_0610）**：\n\n> - **基期** = 现期 / (1 + r)\n> - **增量** = 现期 − 基期 = 现期 − 现期/(1+r)\n> - **增量** = 基期 × 增速 = 现期/(1+r) × r\n\n**老师板书（红笔手写）**：\n\n```\nΔ = 现 − 基\nr = Δ / 基\nΔ = 基 × r\n（举例：现期 110，增速 10%，则 1+r = 1.1）\n```\n\n**推导链（完整版）**：\n\n```\n增量 = 现期 − 基期\n     = 现期 − 现期/(1+增速)          ← 用「基期 = 现期/(1+增速)」替换基期\n     = 现期/(1+增速) × 增速          ← 用「增量 = 基期 × 增速」替换\n\n基期 = 现期/(1+增速) = 现期 − 增量\n现期 = 基期 × (1+增速) = 基期 + 增量\n```\n\n> 这两个式子有没有误差？**肯定没有误差**，这都是公式一步一步推导过来的，没有任何误差。\n> 这就是增量通过现期和增速来计算的两种关系式。\n\n**为什么第二个（乘法）式子用得少**：\n\n> 下面这个关系式说实话是**用不到**的。很简单的道理：如果你都已经把「现期/(1+增速)」算出来了（＝基期），你直接用现期把它减掉不就好了吗？**减法肯定比乘法快。**\n> 比如现期是 110、增速是 10%，我要算增量，我直接 110 ÷ (1+10%) = 100，基期有了、现期有了，直接减 = 10，还拿什么现期去乘 10% 啊，没必要。\n>\n> ⭐ 但这个式子**还要讲**：因为**下节课会从这个式子出发，去演变一个比较重要的、增量的另一种乘法的估算方式**（这是下节课的内容）。\n\n> 总结：**基本的、很严谨的、很完整的、很精准的计算，我们一般用上面那个**（现期 − 现期/(1+r)）。\n\n（对应例题见【例题精讲】第 12、13 题。）\n\n---\n\n## 例题精讲\n\n### 第 1 题｜增量计算 · 全社会固定资产投资\n\n**【题干原文】**\n\n> 2012-2015 年，我国社会固定资产投资同比增长量最大的年份是（ ）\n\n**【材料数据】**\n\n材料为柱状图，2011—2015 年柱高标值为（单位：亿元）：\n\n| 年份 | 2011 | 2012 | 2013 | 2014 | 2015 |\n| --- | --- | --- | --- | --- | --- |\n| 全国社会固定资产投资（亿元） | 311485 | 374695 | 444618 | 512021 | 562000 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 同比增量比较（增量为时间点自身属性，四年都要算） |\n| 定位数据 | 图给的是各年当期值，需自算同比增量（今年 − 上年） |\n| 列式 | 增量 = 现期值 − 基期值 |\n| 速算步骤 | 2012：374695 − 311485 ≈ 6.3 万；2013：444618 − 374695 ≈ 7 万；2014：512021 − 444618 ≈ 6.8 万；2015：562000 − 512021 ≈ 5 万 |\n| 结论 | 四个增量中最大的是 2013 年 |\n\n**老师板书（红笔手写）**：12、13、14、15 四根柱上分别标 `6.3w`、`7w`、`6.8w`、`5w`，并板书 `① 2012 − 2015`、`斜率 = Δ / m`。\n\n**【选项原文】**\n\n> A.2012 年　B.2014 年　C.2013 年　D.2015 年\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- 为什么要算 2012 年？很多同学会问「12 到 15 不是三次同比增长吗，为什么出来四个」——因为**同比增量是每个时间点的属性**，就像投资额本身一样，2012 年也有它自己的同比增量。题目问的是这四年各自属性谁最大，所以四年都要算。\n- 2012 年增量约 6.3 万最大吗？不是，13 年约 7 万更大。\n- 陷阱类型：**范围陷阱**（漏算第 1 年）＋**概念陷阱**（把「同比增量」当成只算后三年）。\n- 关于**斜率**：`斜率 = Δ / m`（横轴间距固定），所以斜率高低**可以**代表增量大小；但斜率**绝不能**代表增速，因为分母（基期值）不固定。\n\n---\n\n### 第 2 题｜增量计算 · 全国 R&D 经费（表格式找数演示）\n\n**【题干原文】**\n\n> 2024 年，全国 R&D 经费同比增量比上年：\n> A.低不到 200 亿元　B.低 200 亿元以上　C.高不到 200 亿元　D.高 200 亿元以上\n\n**【材料数据】**\n\n表：2021—2024 年全国及部分省市 R&D 经费及其投入强度（**全国**行）\n\n| 指标 | 2021 | 2022 | 2023 | 2024 |\n| --- | --- | --- | --- | --- |\n| 全国 R&D 经费（亿元） | 27956.3 | 30782.9 | 33357.1 | 36326.8 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 两个「增量」再做差（比较 2024 年增量与 2023 年增量） |\n| 定位数据 | 「全国」行，列名为表头（年份） |\n| 列式 | 2024 增量 = 36326.8 − 33357.1；2023 增量 = 33357.1 − 30782.9 |\n| 速算步骤 | 2024 增量 ≈ 3000（3 万 3 → 3 万 6）；2023 增量 ≈ 2600（2 万 6 不到） |\n| 结论 | 2024 年增量比 2023 年高几百，即高 200 亿元以上 |\n\n**【选项原文】**（同上）\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 关键词是「**比上年**」后面还跟了「增量」——主语是 2024 年的增量，问它跟 2023 年的增量比高低。有同学把它读成「2024 年比 2023 年多多少」，就是没把同比增量当作当年属性。\n- 陷阱类型：**表述陷阱**（两个增量比较 vs 两个值比较）。\n- 速算上只做粗略估：3 万 3 → 3 万 6 是 3000；2 万 6 是 2600；差几百 > 200。\n\n---\n\n### 第 3 题｜环比增量 · 地方政府债券投资者总持有额\n\n**【题干原文】**\n\n> 2025 年 6 月，地方政府债券投资者总持有额的环比增量约为：\n\n**【材料数据】**\n\n表：2025 年 5-6 月地方政府债券投资者持有结构情况（**合计**行）\n\n| 持有机构 | 5 月金额（亿元） | 6 月金额（亿元） |\n| --- | --- | --- |\n| 合计 | 510036.49 | 516550.47 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 环比增量（现期 6 月 − 基期 5 月） |\n| 定位数据 | 「地方政府债券投资者总持有额」＝全表合计行 |\n| 列式 | 环比增量 = 6 月合计 − 5 月合计 |\n| 速算步骤 | 516550.47 − 510036.49 ≈ 6514 |\n| 结论 | 约 6514 亿元 |\n\n**【选项原文】**\n\n> A.5514 亿元　B.6124 亿元　C.6514 亿元　D.7124 亿元\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- 陷阱类型：**主体陷阱**（表里没有「地方政府债券」这一行，必须结合表头判断应取合计）。\n- 看表头「2025 年 5-6 月地方政府债券投资者持有结构情况」，说明整张表就是地方政府债券投资者的持有结构，总额即合计。\n- 计算极简：51 万 → 51 万 6，涨了 6500 左右。\n\n---\n\n### 第 4 题｜增量趋势 · 折线图（Q 市法律热线咨询量）\n\n**【题干原文】**\n\n> 2025 年上半年，Q 市 12348 公共法律服务热线有效接听解答咨询量（以下简称法律热线咨询量）为 102428 人次。\n>\n> 以下折线图中，最能准确反映 2022—2025 年间 Q 市法律热线咨询量第二季度环比增量变化趋势的是：\n\n**【材料数据】**\n\n柱状图：2022—2025 年 Q 市法律热线咨询量（单位：人次）\n\n| 季度 | 2022 年 | 2023 年 | 2024 年 | 2025 年 |\n| --- | --- | --- | --- | --- |\n| 一季度 | 34658 | 47010 | 42504 | 52802 |\n| 二季度 | 34027 | 49483 | 50085 | （图中缺，需推算） |\n| 三季度 | 32610 | 49429 | 57725 | — |\n| 四季度 | 49702 | 39991 | 63193 | — |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 各年「二季度环比增量」的大小趋势（折线图） |\n| 定位数据 | 二季度环比增量 = 二季度 − 同一年的 一季度 |\n| 列式 | 见下（2025 二季度需用「上半年 − 一季度」推算） |\n| 速算步骤 | 2022：34027 − 34658 ≈ −600；2023：49483 − 47010 ≈ +2400；2024：50085 − 42504 ≈ +7500；2025 二季度 = 102428 − 52802 = 49626，环比 ≈ 49626 − 52802 ≈ −3200 |\n| 结论 | 四点高度关系：−600 → +2400 → +7500 → −3200（先高后落、末点最低） |\n\n**老师板书（红笔手写）**：\n\n```\n22  □2  ∵ △ −600\n23         +2400\n24         +7500\n25         −3200\n102428 − 52802 = 49626\n```\n\n> 【选项图形】A：前三点上升、第四点落到最低；B：第四点高于第一点；C、D：后面继续往下（不符）。\n\n**【选项原文】**\n\n> A.　B.　C.　D.（四张折线示意图）\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 先排 C、D：它们后面还在往下走，与「2400→7500 越来越高」不符。\n- A、B 的区别只在**第四个点**：第四个点 −3200 是最低的（低于第一个点 −600），所以选 A；B 中第四点比第一个点高，错。\n- 2025 年二季度没有直接给，用「A 与非 A」：二季度 ＝ 上半年 − 一季度。计算可用「借位凑整」：\n  ```\n  102428 − 52802 ≈ 102428 − 52800 = 49628（借了 2）→ 49626 左右\n  ```\n- 陷阱类型：**数据缺失陷阱**（材料不直接给二季度）＋**范围陷阱**（−3200 与 −600 的大小关系）。\n\n---\n\n### 第 5 题｜变化量 · 全国图书出版条目\n\n**【题干原文】**\n\n> 2016-2019 年中，收录全国图书条目年变化量最大的年份是（ ）。\n\n**【材料数据】**\n\n表：2015~2019 年中国图书出版数据库收录全国及部分城市出版图书情况（单位：条）\n\n| 地区 | 2019 年 | 2018 年 | 2017 年 | 2016 年 | 2015 年 |\n| --- | --- | --- | --- | --- | --- |\n| 全国 | 286158 | 298344 | 331078 | 321509 | 298180 |\n| 北京 | 120826 | 124465 | 138818 | 136715 | 130063 |\n| 上海 | 16376 | 16059 | 16905 | 16632 | 14618 |\n| 长春 | 13602 | 14953 | 17218 | 16795 | 13720 |\n| 南京 | 11886 | 12426 | 13961 | 14199 | 13499 |\n| 武汉 | 8743 | 9775 | 10973 | 12098 | 11914 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 「变化量」＝增量的绝对值，取高者减者 |\n| 定位数据 | 「全国」行，2015—2019 各年 |\n| 列式 | 变化量 = \\|现期 − 基期\\| |\n| 速算步骤 | 2016：321509 − 298180 ≈ +2.3 万；2017：331078 − 321509 ≈ +1 万；2018：298344 − 331078 ≈ −3.3 万（变化量 3.3 万）；2019：286158 − 298344 ≈ −1.2 万 |\n| 结论 | 变化量最大的是 2018 年（约 3.3 万） |\n\n**【选项原文】**\n\n> A.2016 年　B.2017 年　C.2018 年　D.2019 年\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- PPT 标题即定义：`变化量：增量的绝对值，以基期、现期中的高者减去低者得到的值。`\n- 2018 年增量是负的（−3.3 万），但**变化量**取绝对值 = 3.3 万，是四年中最大的。\n- 陷阱类型：**概念陷阱**（把「变化量」当「增量」，只看正增长就选错）。\n- 老师强调：从 100 变成 120，跟从 100 变成 80，变化量一致；只看变了多少，不看方向。\n\n---\n\n### 第 6 题｜增速计算 · 全国基础研究经费\n\n**【题干原文】**\n\n> 2021 年全国基础研究经费同比增长约（ ）。\n\n**【材料数据】**\n\n图（图 2）：2016—2021 年全国基础研究经费及占 R&D 经费比重情况\n\n| 年份 | 2016 | 2017 | 2018 | 2019 | 2020 | 2021 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 全国基础研究经费（亿元，柱） | 823 | 975 | 1090 | 1336 | 1467 | 1696 |\n| 占 R&D 经费比重（%，折线） | 5.25 | 5.54 | 5.54 | 6.03 | 6.01 | 6.09 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求同比增速（给「同比」即锁定现期＝2021 年） |\n| 定位数据 | 2021 年 1696、2020 年 1467（基期） |\n| 列式 | `r = 增量 / 基期 = (1696 − 1467) / 1467 = 229 / 1467` |\n| 速算步骤 | 1467 取三位 146；229 ÷ 146 ≈ 1.57 → 15.7%（板书演示用长除法：146 进 229 上 1、余 83…） |\n| 结论 | 约 15.6% |\n\n**老师板书（红笔手写）**：\n\n```\nr = Δ/基 = 229/1467\n   ≈ 15.7%\n```\n\n**【选项原文】**\n\n> A.14.2%　B.15.6%　C.6.09%　D.8%\n\n**【答案】** ✅ B\n\n**【解析】**\n\n- 「同比」这个词就等于告诉你现期在哪：现期是 2021 年（1696），基期是 2020 年（1467）。\n- C 的 6.09% 是「占 R&D 经费比重」这条折线的数值，属于**概念陷阱**（把比重当作增速）。\n- 老师特别提醒：算增速时除的时候**取三位其实就比较准了**，取三位就足够准。\n\n---\n\n### 第 7 题｜环比增速 · 集成电路进口量\n\n**【题干原文】**\n\n> 2021 年上半年，我国进口集成电路 3123 亿块，同比增长 28.4%；进口额 1979 亿美元，增长 28.3%。出口集成电路 1514 亿块，增长 34.5%；出口额 664 亿美元、增长 32.0%。\n>\n> 2021 年上半年，我国集成电路进口量的环比增速是：\n\n**【材料数据】**\n\n图（图）：2020 年 1-12 月我国集成电路进出口量（单位：亿块）\n\n| 月份 | 1-2 月 | 3 月 | 4 月 | 5 月 | 6 月 | 7 月 | 8 月 | 9 月 | 10 月 | 11 月 | 12 月 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 进口量（亿块） | 708 | 453 | 444 | 406 | 421 | 469 | 443 | 537 | 485 | 528 | 555 |\n| 出口量（亿块） | 327 | 205 | 198 | 207 | 189 | 238 | 273 | 272 | 245 | 255 | 289 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 环比增速（现期＝2021 上半年；基期＝2020 下半年） |\n| 定位数据 | 文字给 2021 上半年＝3123；2020 下半年需从表格逐月相加 |\n| 列式 | `r = 增量 / 基期`，基期＝2020 年 7—12 月合计 |\n| 速算步骤 | 2020 下半年 = 469+443+537+485+528+555 ≈ 3017（凑整法见下）；增量 = 3123 − 3017 = 106 |\n| 结论 | 106 ÷ 3017 ≈ 3.5% |\n\n**老师板书（红笔手写，凑整技巧）**：\n\n```\n469+528 ≈ 1000 − 3 = 997    （找“尾巴”凑整）\n443+555 ≈ 1000 − 2 = 998\n537+485 ≈ 1000 + 22 = 1022\n合计 ≈ 3017\n106 / 3017 ≈ 3.5%\n```\n\n> 加的时候有个小技巧：46 9 往后加时，我觉得 469 比较大、接近 500，就尽量在后面找一个尾巴跟它靠近的（528）去加——`469 + 528 ≈ 1000 − 3`；`443 + 555 ≈ 1000 − 2`；把 537 + 485 凑 500（借 15 变成 522 + 500 = 1022）。\n> 这三个加起来就是 3000 + 1022，这样是 3017。\n\n**【选项原文】**\n\n> A.1.8%　B.2.1%　C.3.5%　D.4.6%\n\n**【答案】** ✅ C\n\n**【解析】**\n\n- 环比＝跟上一个半年相比：2021 上半年 ← 上一个半年就是 2020 下半年。\n- 表格里给的是**逐月**数据，下半年要把 7、8、9、10、11、12 共六个月加起来（不能用 1-2 月合并那根）。\n- 陷阱类型：**范围陷阱**（累加项选错）＋**单位/口径陷阱**（进口量而非进口额）。\n- 老师说明：等你不要求那么准时，46 9 和 537 这两个算一千、443 和 555 这两个算一千、其余也算一千出头，很快就能得出「三千零一十」。\n\n---\n\n### 第 8 题｜环比增速 · Q 市法律咨询量（复用第 4 题图表）\n\n**【题干原文】**\n\n> 2025 年第一季度 Q 市法律咨询量环比增长速度约为：\n\n**【材料数据】**\n\n柱状图：2022—2025 年 Q 市法律咨询量（单位：人次）\n\n| 季度 | 2024 年 | 2025 年 |\n| --- | --- | --- |\n| 一季度 | 42504 | 52802 |\n| 四季度 | 63193 | — |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 环比增速（现期＝2025 一季度；基期＝2024 四季度） |\n| 定位数据 | 2025 一季度 52802；2024 四季度 63193 |\n| 列式 | `r = (52802 − 63193) / 63193 ≈ −10391 / 63193` |\n| 速算步骤 | 先排除正数选项；再判断「减少幅度」是 −19% 还是 −16%：|r| 应小于 10000/60000 ≈ 1/6 |\n| 结论 | r ≈ −16.44% |\n\n**老师板书（红笔手写）**：\n\n```\nr = −10300 / 63193\n−20% = 1/5\n```\n\n**【选项原文】**\n\n> A.24.23%　B.19.50%　C.−19.68%　D.−16.44%\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- **拿到数据不要急着算**：先大致看数据大小关系，把明显不可能的选项排掉。\n- 环比是从 2024 四季度 → 2025 一季度，是**下降**的，所以 A、B（正数）先排除。\n- 只剩「减少幅度是 −19% 还是 −16%」：\n  ```\n  减少量 ≈ 10300，基期 ≈ 63193\n  |r| \u003c 10000 / 60000 = 1/6 ≈ 16.7%\n  ```\n  C 的 −19.68% 已非常靠近 −20%，上不去，排除；只能是 D（−16.44%）。\n- 陷阱类型：**方向陷阱**（正负）＋**量级陷阱**（用 1/6 卡边界）。\n\n---\n\n### 第 9 题｜百分点 · 亿元以上商品交易市场成交总额\n\n**【题干原文】**\n\n> 2023 年全国亿元以上商品交易市场成交总额同比增速较 2019 年：\n\n**【材料数据】**\n\n表：2014~2023 年全国亿元以上商品交易市场情况\n\n| 时间（年） | 摊位数（万个） | 营业面积（万平方米） | 成交总额（亿元）——批发市场成交额 | 成交总额（亿元）——零售市场成交额 |\n| --- | --- | --- | --- | --- |\n| 2014 | 5.1 | 295 | 442 | 267 |\n| 2015 | 4.9 | 294 | 423 | 246 |\n| 2016 | 4.9 | 322 | 425 | 231 |\n| 2017 | 4.5 | 301 | 337 | 213 |\n| 2018 | 4.1 | 374 | 205 | 194 |\n| 2019 | 4.0 | 356 | 249 | 189 |\n| 2020 | 3.4 | 331 | 192 | 156 |\n| 2021 | 3.4 | 327 | 386 | 75 |\n| 2022 | 3.3 | 303 | 275 | 63 |\n| 2023 | 3.1 | 289 | 345 | 53 |\n\n（成交总额 = 批发市场成交额 + 零售市场成交额，故 2023 年为 398、2022 年为 338、2019 年为 438、2018 年为 399。）\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 两个「增速」再作差，结果用「百分点」表述 |\n| 定位数据 | 成交总额＝批发 + 零售；取 2022/2023 与 2018/2019 |\n| 列式 | 2023 增速 = 60/338；2019 增速 = 39/399 |\n| 速算步骤 | 2023：338 ≈ 1/3 的量级，60/338 ≈ 18%；2019：39/399 ≈ 10% |\n| 结论 | 从 19 年的约 10% 变成 23 年的约 18%，提高约 8 个百分点（不到 10 个百分点） |\n\n**老师板书（红笔手写）**：\n\n```\nr = 60 / 338 ≈ 18%\n（2019 年 r ≈ 39 / 399 ≈ 10%）\n```\n\n**【选项原文】**\n\n> A.提高不到 10 个百分点\n> B.提高超过 10 个百分点\n> C.降低不到 10 个百分点\n> D.降低超过 10 个百分点\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 题目虽然提到「增速」，但问的是「增速较 2019 年提高/降低多少**个百分点**」——本质是**增速这个百分号数据的增量**。\n- 先要把 2023 年的同比增速、2019 年的同比增速分别算出来，再作差。\n- 陷阱类型：**概念陷阱**（把「增速的增量」误当成算一个增速）＋**时间陷阱**（找错 19 年基期 2018 年）。\n- 老师提示：这里的除法「不用看位数」，下节课会讲。\n\n---\n\n### 第 10 题｜降幅 · 电厂发电设备利用小时数\n\n**【题干原文】**\n\n> 2023 年，全国 6000 千瓦及以上电厂发电设备利用小时 3592 小时，同比降低 101 小时。分类型看，水电 3133 小时，同比降低 285 小时，其中，常规水电 3423 小时，同比降低 278 小时；抽水蓄能 1175 小时，同比降低 6 小时。火电 4466 小时，同比提高 76 小时；其中，煤电 4685 小时，同比提高 92 小时。核电 7670 小时，同比提高 54 小时。并网风电 2225 小时，同比提高 7 小时。并网太阳能发电 1286 小时，同比降低 54 小时。\n>\n> 2023 年，下列全国 6000 千瓦及以上电厂发电设备类型，其利用小时数同比降幅最大的是（ ）。\n\n**【材料数据】**\n\n| 类型 | 利用小时（小时） | 同比变化（小时） | 降幅＝减少量 ÷ 基期 |\n| --- | --- | --- | --- |\n| 水电 | 3133 | 降低 285 | 285 ÷ (3133+285) = 285/3418 ≈ 8% |\n| 常规水电 | 3423 | 降低 278 | 278 ÷ (3423+278) = 278/3701 ≈ 7.5% |\n| 抽水蓄能 | 1175 | 降低 6 | 6 ÷ (1175+6) = 6/1181 ≈ 0.5% |\n| 并网太阳能发电 | 1286 | 降低 54 | 54 ÷ (1286+54) = 54/1340 ≈ 4% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 同比降幅最大（降幅＝减少量 ÷ 基期，取绝对值） |\n| 定位数据 | 四个降低项：水电、常规水电、抽水蓄能、并网太阳能发电 |\n| 列式 | 降幅 = 减少量 / (现期 + 减少量) |\n| 速算步骤 | 285/3418≈8%；278/3701≈7.5%；6/1181≈0.5%；54/1340≈4% |\n| 结论 | 最高约 8%，为水电 |\n\n**老师板书（红笔手写）**：\n\n```\n= 285/(3133+285) = 285/3418 ≈ 8%\n= 278/3701\n= 6/1181   （太小，×）\n= 54/1340\n```\n\n**【选项原文】**\n\n> A.水电　B.常规水电　C.抽水蓄能　D.并网太阳能发电\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 降幅 ＝ 减少量 ÷ **基期**；基期 ＝ 现期 + 减少量（如水电 3133 + 285 = 3418）。\n- 先不用算准，先写式子比较：抽水蓄能的 6 太小（一千一的百分之一才 11，6 连 1% 都不到），直接排除。\n- 剩下三个估一估：28/34 ≈ 8% 略小；27/37 ≈ 7.5%；13×5 已经到 65，所以 54/1340 \u003c 5%，约 4%。\n- 陷阱类型：**概念陷阱**（降幅用基期做分母，不是用现期）＋**范围陷阱**（选项里「常规水电」是大类「水电」的子项，别混）。\n\n---\n\n### 第 11 题｜变化幅度 · 某研究设计院岗位级别\n\n**【题干原文】**\n\n> 下列岗位中，报告期职工人数较基期变化幅度最小的是：\n\n**【材料数据】**\n\n图 2：某研究设计院岗位级别与职工人数（单位：人）\n\n| 岗位级别 | 报告期（■） | 基期（□） | 变化量 | 变化幅度＝变化量 ÷ 基期 |\n| --- | --- | --- | --- | --- |\n| 6 级岗 | 1500 | 1400 | 100 | 100/1400 |\n| 5 级岗 | 400 | 600 | 200 | 200/600 = 1/3 |\n| 4 级岗 | 310 | 320 | 10 | 10/320 = 1/32 |\n| 3 级岗 | 180 | 160 | 20 | 20/160 = 1/8 |\n| 2 级岗 | 60 | 80 | 20 | 20/80 = 1/4 |\n| 1 级岗 | 24 | 24 | 0 | 0 |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 变化幅度最小（变化幅度＝增速的绝对值＝变化量 ÷ 基期） |\n| 定位数据 | 只看选项涉及的 2、3、4、5 级岗 |\n| 列式 | 变化幅度 = 变化量 ÷ 基期 |\n| 速算步骤 | 2 级岗 20/80 = 1/4；3 级岗 20/160 = 1/8；4 级岗 10/320 = 1/32；5 级岗 200/600 = 1/3 |\n| 结论 | 最小的是 4 级岗（1/32） |\n\n**老师板书（红笔手写）**：2 级岗处批注 `20/80`。\n\n**【选项原文】**\n\n> A.2 级岗　B.3 级岗　C.4 级岗　D.5 级岗\n\n**【答案】** ✅ C（4 级岗）\n\n**【解析】**\n\n- 变化幅度 ＝ 增速的**绝对值**：它变化的量占这个基期的比例。\n- ⚠️ **不能看差值**：看差值看的是变化量（增量），变化量不是比例；题目问的是变化幅度。\n- 2 级岗（60 变 80，或 80 变 60）变化的量都是 20 ÷ 基期 80 = 1/4；4 级岗在 320 的基础上只变了 10，变化幅度 1/32，最小。\n- 陷阱类型：**概念陷阱**（变化幅度 vs 变化量）＋**范围陷阱**（只看选项的四个岗位）。\n\n---\n\n### 第 12 题｜增量计算 · 黄金矿产金（用 现期/(1+r) 求基期）\n\n**【题干原文】**\n\n> 中国黄金协会最新统计数据显示，2014 年，全国黄金产量完成 451.799 吨，比 2013 年增加 23.636 吨，同比增长 5.52%。其中，黄金矿产金完成 368.364 吨，比 2013 年同期增长 4.96%。\n>\n> 2014 年，我国黄金矿产金产量比 2013 年增加了约（　）吨。\n\n**【材料数据】**\n\n| 指标 | 2014 年数值 | 与 2013 年相比 |\n| --- | --- | --- |\n| 全国黄金产量 | 451.799 吨 | 增加 23.636 吨，同比增长 5.52% |\n| 其中：黄金矿产金 | 368.364 吨 | 同比增长 4.96% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 求增量，但**没直接给基期**，只给现期和增速 |\n| 定位数据 | 现期 = 368.364，r = 4.96% |\n| 列式 | 增量 = 现期 − 现期/(1+r) = 368.4 − 368.4/(1+4.96%) |\n| 速算步骤 | 368.4 ÷ 1.0496（分母取三位 105）≈ 350.8；增量 = 368.4 − 350.8 = 17.6 |\n| 结论 | 约 17.4 |\n\n**老师板书（红笔手写）**：\n\n```\n368.4 / (1 + 4.96%) = 368.4 / 1.0496 = 350.8（取分母 105）\n增量 = 368.4 − 350.8 = 17.6\n```\n\n**【选项原文】**\n\n> A.25.6　B.20.1　C.18.9　D.17.4\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 这题**没给基期**，所以用「增量 = 现期 − 现期/(1+r)」：先把基期（368.4 ÷ 1.0496）除出来，再作差。\n- 结果略有差异（17.6 vs 17.4）的原因：分母取三位时**分母被放大**，分母变大导致结果变小，差值就偏大。\n- 陷阱类型：**数据缺失陷阱**（不给基期，必须用增速反推）。\n- 老师感慨：「17.4 只有老同学才知道，我这时候憋得有多难受。」（因为不用速算技巧硬除很痛苦，下节课会讲快算。）\n\n---\n\n### 第 13 题｜增量倍数 · 电梯采购规模（两组增量相除）\n\n**【题干原文】**\n\n> 2025 年 8 月，全国电梯采购规模 25.11 亿元，环比增长 7.77%，同比增长 43%。全国电梯更新改造采购规模 56108.32 万元，环比增长 51.92%，同比增长 347.55%。全国加装电梯采购规模 9538.15 万元，环比增长 30.72%，同比下降 18.63%。\n>\n> 2025 年 8 月，全国电梯更新改造采购规模环比增量约是全国加装电梯采购规模环比增量的多少倍？\n\n**【材料数据】**\n\n| 项目 | 采购规模 | 环比增速 | 同比增速 |\n| --- | --- | --- | --- |\n| 全国电梯 | 25.11 亿元 | 7.77% | 43% |\n| 全国电梯更新改造 | 56108.32 万元 | 51.92% | 347.55% |\n| 全国加装电梯 | 9538.15 万元 | 30.72% | 下降 18.63% |\n\n**【解题拆解】**\n\n| 步骤 | 内容 |\n| --- | --- |\n| 题型识别 | 两个「环比增量」相除求倍数（增长率倍数 ≠ 增长量倍数，必须算增量） |\n| 定位数据 | 更新改造：56108.32、r=51.92%；加装电梯：9538.15、r=30.72% |\n| 列式 | 增量₁ = 56108.32 − 56108.32/1.5192；增量₂ = 9538.15 − 9538.15/1.3072；倍数 = 增量₁ ÷ 增量₂ |\n| 速算步骤 | 561÷1.52 ≈ 373（百元级）→ 更新改造增量 ≈ 19000；9538÷1.307 ≈ 7330 → 加装增量 ≈ 2208 |\n| 结论 | 19000 ÷ 2208 ≈ 8.6 倍 |\n\n**老师板书（红笔手写）**：\n\n```\n561 / 1.52 → 373；增量 ≈ 19000\n9538 / 1.307 ≈ 7330；增量 ≈ 2208\n19000 / 2208 > 8\n2208 × 8 = 17664（核对量级）\n```\n\n**【选项原文】**\n\n> A.4.4　B.5.9　C.7.3　D.8.6\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 注意定语：「**更新改造**」采购规模 ≠ 全国电梯采购规模；「**加装**电梯」≠ 更新改造。\n- 两组都必须用「现期 − 现期/(1+r)」先求各自增量，再相除；**不能**直接用两个采购规模相除。\n- 陷阱类型：**主体陷阱**（三组数据混淆）＋**概念陷阱**（用规模比而非用增量比）。\n- 下节课后这类多位数运算会很快，本次因位数太多很痛苦。\n\n---\n\n## 收尾：作业与本集总结\n\n**老师课堂布置的作业与新安排**：\n\n> 有作业，待会课后作业——你们有一个**纸质的**，就直接在纸质上写。如果还没收到的，我也会把这个**课后作业的电子讲义**发在**播送云**上，以及对应的**文字解析**和**视频解析**，我都会发上去。\n\n**PPT 总结页原文（原帧 f_0655，「第一课基本概念总结」）**：\n\n| 基本概念 | 公式关系 | 易错点 |\n| --- | --- | --- |\n| 基期值：特定对象在以前某个时间点下的数值 | 增量 = 现期值 − 基期值 | A 与非 A 矛盾性数据分布：注意提问对象是否需要根据矛盾关系数据推得 |\n| 现期值：特定对象在现在时间点下的数值 | 增速 = 增量 / 基期 | 百分点：% 数据的增量专用描述 |\n| 增量：特定对象从基期值到现期值增长的量 | 现期/基期 − 1 = 增长倍数 | 降幅：负增长时的变化幅度、增速的绝对值 |\n| 增速：增量占基期的比例 | 增量 = 现期 − 现期/(1+r) | 变化量：增量的绝对值 |\n|  | 增量 = 现期/(1+r) × r | 变化幅度：增速的绝对值 |\n\n**老师对本集的收尾总结**：\n\n> 今天主要讲了：\n> 一是基本概念——基期值、现期值、增量、增速，这一组**最重要最重要的关系**，在资料分析里面它们分别代表了什么，以及它们的计算公式；\n> 二是易错点——有时候你找不到数据怎么办（A 与非 A），百分点、降幅、变化量、变化幅度这种绝对值。\n>\n> ⭐ **今天我们主要是提高一个综合理解能力，后面主要就是提高一个分析加工能力为主。**\n> 到了下周二第二节课，我们就开始加速了，去提升分析加工能力：怎么处理那些数据，让数据能够更精准、更快地得到我们需要的答案。\n> 今天这一节课，你不可能把自己吃成个胖子，我们有点耐心，慢慢来。\n\n---\n\n## 本讲知识点总表\n\n| 序号 | 知识点 | 要点 | 出现在 |\n| --- | --- | --- | --- |\n| 1 | 考纲要求 | 文字、数字、图表等统计性资料的**综合理解与分析加工能力** | 壹 |\n| 2 | 能力拆解 | 综合理解（题目/名词/框架/关系）＋分析加工（分析、运算、得结果） | 壹 |\n| 3 | 算的地位 | 「算」是**末流**，理解与加工才是重点 | 壹 |\n| 4 | 基期值 | 以前某个时间点下的数值 | 贰 |\n| 5 | 现期值 | 现在时间点下的数值 | 贰 |\n| 6 | 增长量 | 从基期值到现期值增长的量，有正有负 | 贰 |\n| 7 | 三个加减公式 | 现期 = 基期 + 增量；增量 = 现期 − 基期；基期 = 现期 − 增量 | 贰 |\n| 8 | 同比增量 | 基期是**上一年同期** | 贰 |\n| 9 | 环比增量 | 基期是**上一个连续周期**（月、季度、半年） | 贰 |\n| 10 | 往前推规则 | 环比按月/季/半年推；同比直接推一年；可跨年 | 贰 |\n| 11 | 1-2 月合并 | 因春节停工导致数据失真，故常合并公布 | 贰 |\n| 12 | A 与非 A | 累计值相减：全年/上（下）半年、全年/前三季度、上半年/一季度、1-2 月/2 月、1-7 月/1-6 月/1-5 月 | 贰 |\n| 13 | 累计产量表 | 表头写「累计」，某一单月/单季度需相邻累计相减 | 贰 |\n| 14 | 变化量 | 增量的绝对值 | 贰 |\n| 15 | 增速 | 增量占基期的比例，等于增长率、增幅 | 贰 |\n| 16 | 增速公式链 | r = 增量/基期 = (现期−基期)/基期 = 现期/基期 − 1 | 贰 |\n| 17 | 增长倍数 | 现期/基期 − 1 = 增长倍数（增加 0.5 倍 = 增加 50%） | 贰 |\n| 18 | 做题模式 | 先读题再找数；抓主语 + 定语；错误做法是 1 材料 2 题目 3 材料 | 叁 |\n| 19 | 三个找数技巧 | 盯阿拉伯数字 / 盯括号 / 看表头 | 叁 |\n| 20 | 数据顺序 | 题目数据基本按题目顺序在材料里排，从上往下找 | 叁 |\n| 21 | 斜率 | 斜率 = Δ/m，可代表增量大小，**绝不能**代表增速 | 叁 |\n| 22 | 百分点 | 自带百分号数据的增量专用说法（增速、比重、利润率…） | 肆 |\n| 23 | 降幅 | 减少量与基期的比值 = 增速的绝对值，**仅下降时才有** | 肆 |\n| 24 | 变化幅度 | 变化量与基期的比值 = 增速的绝对值 | 肆 |\n| 25 | 幅度辟谣 | 涨跌幅度/涨跌幅也是增速（有正有负），不是绝对值 | 肆 |\n| 26 | 计算公式 | 基期 = 现期/(1+r)；增量 = 现期 − 现期/(1+r) = 现期/(1+r) × r | 伍 |\n\n---\n\n## 核心概念与公式总表\n\n**概念定义**\n\n| 概念 | 定义 |\n| --- | --- |\n| 基期值 | 特定对象在以前某个时间点下的数值 |\n| 现期值 | 特定对象在现在时间点下的数值 |\n| 增长量（增量） | 特定对象从基期值到现期值增长的量（有正有负） |\n| 增速（增长率、增幅） | 增量占基期的比例 |\n| 同比增量 | 基期是上一年同期 |\n| 环比增量 | 基期是上一个连续周期 |\n| 变化量 | 增量的绝对值 |\n| 降幅 | 减少量与基期的比值，等同于降速（仅下降时才有） |\n| 变化幅度 | 变化量与基期的比值，等同于变化率 |\n\n**公式组**\n\n```\n【增量（加减）】\n现期值 = 基期值 + 增量\n增量   = 现期值 − 基期值\n基期值 = 现期值 − 增量\n\n【增速（比例）】\n增速 = 增量 ÷ 基期值\n     = (现期值 − 基期值) ÷ 基期值\n     = 现期值 ÷ 基期值 − 1\n1 + 增速 = 现期值 ÷ 基期值\n现期值   = 基期值 × (1 + 增速)\n基期值   = 现期值 ÷ (1 + 增速)\n现期 ÷ 基期 − 1 = 增长倍数\n\n【用现期和增速求增量】\n增量 = 现期值 − 基期值\n     = 现期值 − 现期值 ÷ (1 + 增速)\n     = 现期值 ÷ (1 + 增速) × 增速\n\n【非直接给数】\n累计值相减：某段 = 大累计 − 小累计\nA 与非 A：非 A = 整体 − A\n```\n\n**绝对值口诀**\n\n```\n变化量   = |增量|        （增量的绝对值）\n降幅     = |增速|        （仅下降时）\n变化幅度 = |增速|\n增幅 / 增长率 / 增长幅度 / 涨跌幅 = 增速（有正有负，不取绝对值）\n```\n\n---\n\n## 易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 说明 | 对应题 |\n| --- | --- | --- | --- |\n| 1 | 同比增量是「时间点属性」 | 问 2012-2015 增量最大，要算 4 个（含 2012），不能只算 3 个 | 第 1 题 |\n| 2 | 两个增量比大小 vs 两个值比大小 | 「同比增量比上年高/低」主语是增量 | 第 2 题 |\n| 3 | 主体 / 表头陷阱 | 表里没有「地方政府债券」行，需取合计；「部分地区」「累计量」都要看表头 | 第 3 题 |\n| 4 | 数据缺失（A 与非 A） | 二季度 = 上半年 − 一季度；找不到的数去找整体与把另一部分 | 第 4 题 |\n| 5 | 变化量 ≠ 增量 | 变化量取绝对值，负增长的年份也可能是变化量最大 | 第 5 题 |\n| 6 | 百分点 ≠ 增速 | 带百分号数据（增速、比重）的增量用「个百分点」 | 第 9 题 |\n| 7 | 降幅分母用基期 | 降幅 = 减少量 ÷ 基期（基期 = 现期 + 减少量），且仅下降时有 | 第 10 题 |\n| 8 | 变化幅度 ≠ 变化量 | 变化幅度是比例（变化量 ÷ 基期），不能比差值 | 第 11 题 |\n| 9 | 「带幅度就是绝对值」是错的 | 涨跌幅度 / 涨跌幅也是增速，有正有负 | 第 11 题（概念） |\n| 10 | 不给基期 | 用现期 ÷ (1+r) 反推基期再作差 | 第 12 题 |\n| 11 | 增量倍数 ≠ 规模倍数 | 问「增量是……多少倍」，两组都要先算增量 | 第 13 题 |\n| 12 | 斜率不能代表增速 | 斜率 = Δ/m，横轴间距固定，只能代表增量 | 第 1 题（概念） |\n\n---\n\n## 老师金句\n\n> ⭐「算」在资料分析里其实是**末位的东西、最末流的东西**。\n>\n> ⭐ 你算得快、算得慢，其实真的对于你资料分析的那个**用时、正确率**来说，影响真的是不大的。\n>\n> ⭐ 我的速算，很多人比我还强，但我做资料分析从来不虚他们——因为**算术这东西在资料分析里地位没那么大**。\n>\n> ⭐ 这样做题（先读材料）对你的正确率没影响，但最大的问题是**太慢了，比蜗牛还慢**。\n>\n> ⭐ **胆不大直接干，人有多大胆地有多大产**；你要畏手畏脚，那个做题速度就上不去。\n>\n> ⭐ 看表的时候，一定要把**表头**看一下——它只有一行，不会占用你什么时间。\n>\n> ⭐ 拿到数据的时候**不要急着算**，先大概看一眼数据的大小关系，把明显不可能的选项先排除掉。\n>\n> ⭐ 「只要看到『幅』就是绝对值」——**错，大错特错！那增幅是绝对值吗？增幅就是增速。**\n>\n> ⭐ 这些取决于「降」、取决于「变化」，**不是因为这个『幅』**。\n>\n> ⭐ 乘法式（增量 = 现期/(1+r) × r）用得少，因为**减法肯定比乘法快**——但下节课要从它演变重要的估算法。\n>\n> ⭐ **今天主要是提高一个综合理解能力，后面主要就是提高一个分析加工能力为主。**\n>\n> ⭐ 今天这一节课你不可能把自己吃成个胖子，我们**有点耐心，慢慢来**。\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"壹　大纲概述","id":"壹-大纲概述"},{"level":2,"text":"贰　基本概念","id":"贰-基本概念"},{"level":3,"text":"2.1 基期值 / 现期值 / 增长量","id":"21-基期值-现期值-增长量"},{"level":3,"text":"2.2 同比增量与环比增量","id":"22-同比增量与环比增量"},{"level":3,"text":"2.3 一到二月份数据合并的口径问题","id":"23-一到二月份数据合并的口径问题"},{"level":3,"text":"2.4 累计值相减求某一段","id":"24-累计值相减求某一段"},{"level":3,"text":"2.5 增量的特殊描述——变化量","id":"25-增量的特殊描述变化量"},{"level":3,"text":"2.6 增速（增长率）","id":"26-增速增长率"},{"level":2,"text":"叁　做题模式","id":"叁-做题模式"},{"level":3,"text":"3.1 错误做法：1 材料 → 2 题目 → 3 材料","id":"31-错误做法1-材料-2-题目-3-材料"},{"level":3,"text":"3.2 正确做法：先读题，再回材料找数","id":"32-正确做法先读题再回材料找数"},{"level":3,"text":"3.3 斜率能不能代表增量 / 增速（老师专门说明）","id":"33-斜率能不能代表增量-增速老师专门说明"},{"level":3,"text":"3.4 PPT 材料演示：纯文字材料如何找数（原帧 f_0177 / f_0196）","id":"34-ppt-材料演示纯文字材料如何找数原帧-f_0177-f_0196"},{"level":3,"text":"3.5 图表型数据的找法（原帧 f_0200）","id":"35-图表型数据的找法原帧-f_0200"},{"level":3,"text":"3.6 环比型数据的找法（原帧 f_0212 / f_0216）","id":"36-环比型数据的找法原帧-f_0212-f_0216"},{"level":2,"text":"肆　易混淆点","id":"肆-易混淆点"},{"level":3,"text":"4.1 百分点","id":"41-百分点"},{"level":3,"text":"4.2 变化量 / 降幅 / 变化幅度 / 增幅","id":"42-变化量-降幅-变化幅度-增幅"},{"level":2,"text":"伍　计算公式","id":"伍-计算公式"},{"level":2,"text":"例题精讲","id":"例题精讲"},{"level":3,"text":"第 1 题｜增量计算 · 全社会固定资产投资","id":"第-1-题增量计算-全社会固定资产投资"},{"level":3,"text":"第 2 题｜增量计算 · 全国 R&D 经费（表格式找数演示）","id":"第-2-题增量计算-全国-rd-经费表格式找数演示"},{"level":3,"text":"第 3 题｜环比增量 · 地方政府债券投资者总持有额","id":"第-3-题环比增量-地方政府债券投资者总持有额"},{"level":3,"text":"第 4 题｜增量趋势 · 折线图（Q 市法律热线咨询量）","id":"第-4-题增量趋势-折线图q-市法律热线咨询量"},{"level":3,"text":"第 5 题｜变化量 · 全国图书出版条目","id":"第-5-题变化量-全国图书出版条目"},{"level":3,"text":"第 6 题｜增速计算 · 全国基础研究经费","id":"第-6-题增速计算-全国基础研究经费"},{"level":3,"text":"第 7 题｜环比增速 · 集成电路进口量","id":"第-7-题环比增速-集成电路进口量"},{"level":3,"text":"第 8 题｜环比增速 · Q 市法律咨询量（复用第 4 题图表）","id":"第-8-题环比增速-q-市法律咨询量复用第-4-题图表"},{"level":3,"text":"第 9 题｜百分点 · 亿元以上商品交易市场成交总额","id":"第-9-题百分点-亿元以上商品交易市场成交总额"},{"level":3,"text":"第 10 题｜降幅 · 电厂发电设备利用小时数","id":"第-10-题降幅-电厂发电设备利用小时数"},{"level":3,"text":"第 11 题｜变化幅度 · 某研究设计院岗位级别","id":"第-11-题变化幅度-某研究设计院岗位级别"},{"level":3,"text":"第 12 题｜增量计算 · 黄金矿产金（用 现期/(1+r) 求基期）","id":"第-12-题增量计算-黄金矿产金用-现期1r-求基期"},{"level":3,"text":"第 13 题｜增量倍数 · 电梯采购规模（两组增量相除）","id":"第-13-题增量倍数-电梯采购规模两组增量相除"},{"level":2,"text":"收尾：作业与本集总结","id":"收尾作业与本集总结"},{"level":2,"text":"本讲知识点总表","id":"本讲知识点总表"},{"level":2,"text":"核心概念与公式总表","id":"核心概念与公式总表"},{"level":2,"text":"易错点与陷阱清单","id":"易错点与陷阱清单"},{"level":2,"text":"老师金句","id":"老师金句"}]},{"id":"P02","title":"基本概念·课后作业解析","full":"第1课 基本概念课后作业解析","lect":"","dur":"31:34","sec":1894,"theme":"基本概念课后作业逐题讲解","url":"https://www.bilibili.com/video/BV15bGA6PEJL?p=2","md":"# 【资料分析】2027 小P神资料分析实战理论班 · 第 2 集\n# 第1课 基本概念课后作业解析\n\n> 课程名称：2027 小P神资料分析实战理论班（国考 / 省考 / 事业单位通用）  \n> 本集位置：合集第 2 集（共 21 集）  \n> 视频地址：`https://www.bilibili.com/video/BV15bGA6PEJL?p=2`  \n> 时长：约 31 分 34 秒（1894 秒）  \n> 本集主题：**基本概念课后作业逐题讲解**  \n> 讲解要点：基期 / 现期 / 增长量 / 增长率 / 同比 / 环比 / 百分点 / 变化幅度 / 下降幅度 / 比重相关增量的基本列式与速算\n\n---\n\n## 目录\n\n1. [第 1 题｜2017 年 12 月汽车销量](#第-1-题2017-年-12-月汽车销量)\n2. [第 2 题｜2018 年 11 月 MPV 销量](#第-2-题2018-年-11-月-mpv-销量)\n3. [第 3 题｜2018 年 1–10 月轿车生产量与销售量之差](#第-3-题2018-年-110-月轿车生产量与销售量之差)\n4. [第 4 题｜2018 年全国第一、二季度进口煤炭](#第-4-题2018-年全国第一二季度进口煤炭)\n5. [第 5 题｜2019 年上半年国内旅游人数](#第-5-题2019-年上半年国内旅游人数)\n6. [第 6 题｜东北三省进出口增速比全国增速高/低多少个百分点](#第-6-题东北三省进出口增速比全国增速高低多少个百分点)\n7. [第 7 题｜研究与发展人员人数增速](#第-7-题研究与发展人员人数增速)\n8. [第 8 题｜科技课题总数增长了多少倍](#第-8-题科技课题总数增长了多少倍)\n9. [第 9 题｜2018 年增长幅度最大的指标](#第-9-题2018-年增长幅度最大的指标)\n10. [第 10 题｜2014–2018 年下降幅度最大的指标](#第-10-题20142018-年下降幅度最大的指标)\n11. [第 11 题｜乘用车各车型销量同比变化幅度排序](#第-11-题乘用车各车型销量同比变化幅度排序)\n12. [第 12 题｜2020 年 12 月煤炭进口量环比](#第-12-题2020-年-12-月煤炭进口量环比)\n13. [第 13 题｜2019 年 S 省第一产业增加值增量](#第-13-题2019-年-s-省第一产业增加值增量)\n14. [第 14 题｜2014 年 2 月银行间债券市场成交额同比减少量](#第-14-题2014-年-2-月银行间债券市场成交额同比减少量)\n15. [第 15 题｜2022 年 3 月对外承包工程新签合同数环比增速](#第-15-题2022-年-3-月对外承包工程新签合同数环比增速)\n16. [本讲知识点总表](#本讲知识点总表)\n17. [速算口诀与解题流程](#速算口诀与解题流程)\n18. [易错点与陷阱清单](#易错点与陷阱清单)\n19. [老师金句](#老师金句)\n\n---\n\n## 第 1 题｜2017 年 12 月汽车销量\n\n### 【题干原文】\n\n> 2017 年 12 月，汽车销量为（　）万辆。\n\n### 【材料数据】\n\n材料为 **2018 年 12 月汽车生产情况 / 销售情况** 两张表（单位：万辆、%）：\n\n| 指标 | 2018 年 12 月销量 | 1–12 月累计 | 环比增长 | 同比增长 |\n|------|------------------|------------|---------|---------|\n| 汽车 | 266.1 | 2808.1 | 4.5 | **−13.0** |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知现期、同比增速，求**基期量** |\n| 定位数据 | 现期 = 266.1 万辆；同比增长 = −13.0% |\n| 列式 | `基期量 = 现期量 / (1 + 增长率)` = `266.1 / (1 − 13%)` |\n| 速算步骤 | `266.1 / 0.87 ≈ 266 / 87`，直除：87×3=261，余 5，补 0 得 50/87 不够，再补 0 得 500/87≈5.7，结果约 **305.7** |\n| 结论 | 有效数字 305 开头，选 B |\n\n```\n基期量 = 266.1 / (1 − 13%) = 266.1 / 0.87 ≈ 305.9\n```\n\n### 【选项原文】\n\n- A. 289.6\n- B. 305.9\n- C. 300.7\n- D. 312.2\n\n### 【答案】\n\n✅ **B. 305.9**\n\n### 【解析】\n\n- **A 错**：量级虽对，但数值偏小。若误把“266.1”当作生产量（248.2）或把增速看成 −18.4% 会得到偏小结果。\n- **B 对**：`266.1 / 0.87 ≈ 305.9`，有效数字 305 开头。\n- **C 错**：300.7 与 305.9 接近，易因截位过少或计算到第二位就停止而误选。\n- **D 错**：312.2 偏大，若错误用 `266.1 / (1 − 13%)` 的倒数或把下降算成增长会得到。\n\n> ⭐ 老师提醒：资料分析一般保留三位就够；选项同量级时只看有效数字。`266 / 87` 商 305 开头，直接锁定 B。\n\n---\n\n## 第 2 题｜2018 年 11 月 MPV 销量\n\n### 【题干原文】\n\n> 2018 年 11 月，MPV 销量为（　）万辆。\n\n### 【材料数据】\n\n材料仍为 **2018 年 12 月汽车销售情况** 表：\n\n| 指标 | 2018 年 12 月销量 | 环比增长 |\n|------|------------------|---------|\n| MPV | 17.6 | **17.5** |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知现期（12 月）、环比增速，求**上月（11 月）基期量** |\n| 定位数据 | 现期 = 17.6 万辆；环比增长 = 17.5% |\n| 列式 | `基期量 = 现期量 / (1 + 环比增速)` = `17.6 / 1.175` |\n| 速算步骤 | 保留三位：`176 / 117` = 1 余 59，590/117≈5，得 **15.0** |\n| 结论 | 选 A |\n\n```\n基期量 = 17.6 / 1.175 ≈ 15.0\n```\n\n### 【选项原文】\n\n- A. 15.0\n- B. 16.1\n- C. 20.7\n- D. 22.8\n\n### 【答案】\n\n✅ **A. 15.0**\n\n### 【解析】\n\n- **A 对**：`17.6 / 1.175 ≈ 15.0`，11 月销量略小于 12 月，符合“比上月增长 17.5%”的语义。\n- **B 错**：16.1 与 17.6 过于接近，若把 17.5% 当成 10% 左右会误选。\n- **C、D 错**：均大于 17.6，只有增长才会大于现期，而题目要求的是上月基期，必小于 17.6。\n\n> ⭐ 老师提醒：题干给 12 月、问 11 月，是**环比**问题，不是同比。找“环比增长”一列，不要用同比增长。\n\n---\n\n## 第 3 题｜2018 年 1–10 月轿车生产量与销售量之差\n\n### 【题干原文】\n\n> 2018 年 1–10 月，轿车生产量比销售量（　）。\n\n### 【材料数据】\n\n材料为 **2018 年 12 月汽车生产情况 / 销售情况** 表（单位：万辆、%）：\n\n| 轿车 | 12 月 | 1–12 月累计 | 环比增长 |\n|------|-------|------------|---------|\n| 生产 | 101.0 | 1146.6 | −4.1 |\n| 销售 | 102.8 | 1152.8 | −4.4 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 求“1–10 月”两个指标的差值；材料只给 1–12 月累计和 12 月，需用**时间矛盾面**拆出 11、12 月 |\n| 核心思路 | 1–10 月 = 1–12 月累计 − 12 月 − 11 月；11 月需由 12 月 / (1 + 环比增速) 得到 |\n| 生产列式 | 生产 1–10 月 = `1146.6 − 101.0 − 101.0 / (1 − 4.1%)` |\n| 生产速算 | `101.0 / 0.959 ≈ 105.3`；`1146.6 − 101.0 − 105.3 = 940.3` |\n| 销售列式 | 销售 1–10 月 = `1152.8 − 102.8 − 102.8 / (1 − 4.4%)` |\n| 销售速算 | `102.8 / 0.956 ≈ 107.5`；`1152.8 − 102.8 − 107.5 = 942.5` |\n| 差值 | 生产 − 销售 = `940.3 − 942.5 = −2.2`，即**生产量比销售量少 2.2 万辆左右** |\n| 结论 | 选 D |\n\n```\n生产 1-10 月 = 1146.6 − 101.0 − 101.0 / 0.959 ≈ 940.3\n销售 1-10 月 = 1152.8 − 102.8 − 102.8 / 0.956 ≈ 942.5\n差值 = 940.3 − 942.5 ≈ −2.2 万辆\n```\n\n### 【选项原文】\n\n- A. 多 3.61 万辆\n- B. 少 3.61 万辆\n- C. 多 2.19 万辆\n- D. 少 2.19 万辆\n\n### 【答案】\n\n✅ **D. 少 2.19 万辆**\n\n### 【解析】\n\n- **A、C 错**：生产量经过扣除后反而略小于销售量，方向为“少”而非“多”。\n- **B 错**：3.61 万辆偏差较大，可能是用 12 月单月销量直接做差 (`101.0 − 102.8 = −1.8`) 或误把累计差 (`1146.6 − 1152.8 = −6.2`) 的一部分当成答案。\n- **D 对**：扣除 11、12 两个月后，生产量比销售量少约 2.2 万辆，最接近 2.19 万辆。\n\n> ⭐ 老师提醒：题干问“1–10 月”，材料给“1–12 月”和“12 月”，一定要记得去找**时间的矛盾面**——把剩下的 11 月、12 月扣掉。没有直接给 11 月时，用 12 月除以 (1 + 环比增速) 反推。\n\n---\n\n## 第 4 题｜2018 年全国第一、二季度进口煤炭\n\n### 【题干原文】\n\n> 2019 年 7 月，全国进口煤炭 3289 万吨，同比增长 13.4%，比上月增加 579 万吨；2019 年 1–7 月，全国进口煤炭 18736 万吨，同比增长 7.0%。\n>\n> 2018 年，第一、二季度全国进口煤炭（　）。\n\n### 【材料数据】\n\n| 时间 | 进口量（万吨） | 同比增长 |\n|------|---------------|---------|\n| 2019 年 7 月 | 3289 | 13.4% |\n| 2019 年 1–7 月 | 18736 | 7.0% |\n\n目标：求 **2018 年 1–6 月**（即第一、二季度之和）的进口量。\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知 2019 年现期与增速，求 2018 年（基期）1–6 月累计；1–6 月 = 1–7 月 − 7 月 |\n| 定位数据 | 2019 年 1–7 月 = 18736 万吨，增长 7.0%；2019 年 7 月 = 3289 万吨，增长 13.4% |\n| 列式 1 | 2018 年 1–7 月 = `18736 / (1 + 7%) = 18736 / 1.07` |\n| 列式 2 | 2018 年 7 月 = `3289 / (1 + 13.4%) = 3289 / 1.134` |\n| 速算 1 | 保留三位 `187 / 107`：107×17=1819，余 51；510/107≈4.7，结果约 **17470** |\n| 速算 2 | 保留三位 `329 / 113`：113×2=226，余 103；1030/113≈9.1，结果约 **2900** |\n| 做差 | 17470 − 2900 = **14570** |\n| 结论 | 最接近 B 选项 14610 |\n\n```\n2018 年 1-6 月 = 18736 / 1.07 − 3289 / 1.134\n              ≈ 17470 − 2900\n              ≈ 14570 万吨\n```\n\n### 【选项原文】\n\n- A. 14221 万吨\n- B. 14610 万吨\n- C. 15447 万吨\n- D. 15836 万吨\n\n### 【答案】\n\n✅ **B. 14610 万吨**\n\n### 【解析】\n\n- **A 错**：14221 万吨偏低，若把 1–7 月除以 1.07 误算成 17200 左右会接近此值。\n- **B 对**：基期 1–6 月 ≈ 14570，与 14610 最接近（老师说明存在一点估算误差）。\n- **C 错**：15447 万吨对应的是 2019 年 1–6 月现期（18736 − 3289 = 15447），是**现期陷阱**。\n- **D 错**：15836 万吨与 2019 年 7 月现期 3289 无关，是把现期量直接当成基期量导致。\n\n> ⭐ 老师提醒：题目问“第一、二季度”，即 1–6 月。材料给的是 1–7 月和 7 月，要先把两个基期分别算出来再做差。注意不要把 2019 年的 1–7 月减 7 月（得到 2019 年 1–6 月）当成答案。\n\n---\n\n## 第 5 题｜2019 年上半年国内旅游人数\n\n### 【题干原文】\n\n> 2020 年度国内旅游人数 28.79 亿人次，比上年同期减少 30.22 亿人次。其中，城镇居民出游 20.65 亿人次，下降 53.8%；农村居民出游 8.14 亿人次，下降 47.0%。其中一季度国内旅游人数 2.95 亿人次，同比下降 83.4%；二季度国内旅游人数 6.37 亿人次，同比下降 51.0%。\n>\n> 2019 上半年国内旅游人数约为（　）。\n\n### 【材料数据】\n\n| 时间 | 2020 年现期（亿人次） | 同比下降 |\n|------|----------------------|---------|\n| 一季度 | 2.95 | 83.4% |\n| 二季度 | 6.37 | 51.0% |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知 2020 年两个季度各自的现期与同比增速，求 2019 年上半年合计（两个基期之和） |\n| 列式 | 2019 年一季度 = `2.95 / (1 − 83.4%) = 2.95 / 0.166`；二季度 = `6.37 / (1 − 51%) = 6.37 / 0.49` |\n| 速算 1 | `2.95 / 0.166`：295/166≈1.77，结果约 **17.7 亿人次** |\n| 速算 2 | `6.37 / 0.49 ≈ 6.37 / 0.50 × 1 = 12.74`（老师把 0.49 近似成 0.5，再乘以 2） |\n| 求和 | 17.7 + 12.74 = **30.44** |\n| 结论 | 选 C |\n\n```\n2019 上半年 = 2.95 / 0.166 + 6.37 / 0.49\n           ≈ 17.7 + 12.74\n           ≈ 30.44 亿人次\n```\n\n### 【选项原文】\n\n- A. 9.32 亿人次\n- B. 28.23 亿人次\n- C. 30.77 亿人次\n- D. 59.01 亿人次\n\n### 【答案】\n\n✅ **C. 30.77 亿人次**\n\n### 【解析】\n\n- **A 错**：9.32 亿只相当于一季度基期的一半左右，是把 2.95 直接当成 2019 年一季度的值，或把下降 83.4% 理解反了。\n- **B 错**：28.23 亿接近 2020 年全年 28.79 亿，是现期陷阱。\n- **C 对**：两个季度基期相加约 30.4 亿，最接近 30.77 亿（估算误差导致，老师说明有多种算法）。\n- **D 错**：59.01 亿约为现期全年与减少量之和（28.79 + 30.22），是把“2019 年全年”误当成上半年。\n\n> ⭐ 老师提醒：这道题没有直接给“上半年”，也没有“上半年 + 下半年 = 全年”的矛盾面，而是把上半年拆成一季度、二季度，要**分别求基期再相加**。后面会学到百化分，如 0.166 ≈ 1/6，可直接乘 6。\n\n---\n\n## 第 6 题｜东北三省进出口增速比全国增速高/低多少个百分点\n\n### 【题干原文】\n\n> 西部 12 省市进出口增速为 23.4%，超过全国增速 9.2 个百分点；中部 6 省市进出口增速为 18.4%，东北三省进出口增速为 15.6%，东部 10 省市进出口增速为 13.0%。\n>\n> 2017 年，东北三省进出口增速比全国增速（　）。\n\n### 【材料数据】\n\n| 地区 | 进出口增速 |\n|------|-----------|\n| 西部 12 省市 | 23.4%（比全国高 9.2 个百分点） |\n| 中部 6 省市 | 18.4% |\n| 东北三省 | 15.6% |\n| 东部 10 省市 | 13.0% |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 百分点加减：已知西部增速与全国增速的百分点关系，求全国增速，再与东北三省增速比较 |\n| 全国增速 | `23.4% − 9.2% = 14.2%` |\n| 东北与全国差 | `15.6% − 14.2% = 1.4 个百分点` |\n| 结论 | 东北三省比全国高 1.4 个百分点，选 C |\n\n```\n全国增速 = 23.4% − 9.2% = 14.2%\n差值 = 15.6% − 14.2% = 1.4 个百分点\n```\n\n### 【选项原文】\n\n- A. 低 1.2 个百分点\n- B. 低 4.2 个百分点\n- C. 高 1.4 个百分点\n- D. 高 4.2 个百分点\n\n### 【答案】\n\n✅ **C. 高 1.4 个百分点**\n\n### 【解析】\n\n- **A 错**：1.2 是 9.2 与 10 的近似，计算方向也反了。\n- **B 错**：4.2 是把 23.4% 与 18.4%（中部）混淆后做差。\n- **C 对**：全国 14.2%，东北 15.6%，东北高于全国 1.4 个百分点。\n- **D 错**：4.2 是把 23.4% 与 18.4% 的差（西部减中部）误用。\n\n> ⭐ 老师提醒：“超过全国增速 9.2 个百分点”是**百分点加减**，不是乘除。全国增速 = 西部增速 − 9.2 个百分点。\n\n---\n\n## 第 7 题｜研究与发展人员人数增速\n\n### 【题干原文】\n\n> 研究与发展人员人数，2018 年比 2014 年增长了（　）。\n\n### 【材料数据】\n\n材料为 **2014–2018 年福建省公办本科高校科技创新能力指标一览表**：\n\n| 指标 | 2014 年 | 2018 年 |\n|------|---------|---------|\n| 研究与发展人员/人 | 6369 | 9114 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知现期、基期，求**增长率** |\n| 列式 | `r = 增长量 / 基期量 = (9114 − 6369) / 6369` |\n| 增长量 | `9114 − 6369 = 2745` |\n| 速算 | `2745 / 6369` 保留三位 `274 / 637`：637×4=2548，余 196；1960/637≈3，得 **43.1%** |\n| 结论 | 选 B |\n\n```\nr = (9114 − 6369) / 6369 = 2745 / 6369 ≈ 43.1%\n```\n\n### 【选项原文】\n\n- A. 44.1%\n- B. 43.1%\n- C. 42.1%\n- D. 41.1%\n\n### 【答案】\n\n✅ **B. 43.1%**\n\n### 【解析】\n\n- **A 错**：44.1% 略高，可能是在直除时把余数估大或用了 `9114 / 6369 − 1` 但截位不准。\n- **B 对**：先算增量 2745，再用 `2745 / 6369` 直除，结果 43.1%。\n- **C、D 错**：均低于正确值，可能是把现期和基期颠倒或增量算错。\n\n> ⭐ 老师提醒：求增速时，建议**先算增长量再除**，不要直接 `现期/基期 − 1`。因为增量作为被除数更小，同样的相对误差对结果的影响也更小，计算更精准。\n\n---\n\n## 第 8 题｜科技课题总数增长了多少倍\n\n### 【题干原文】\n\n> 科技课题总数，2018 年比 2014 年增长了（　）。\n\n### 【材料数据】\n\n| 指标 | 2014 年 | 2018 年 |\n|------|---------|---------|\n| 科技课题总数/项 | 7187 | 15894 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | “增长了多少倍”就是求**增长率**（增长倍数 = 增长率，0.15 倍 = 15%） |\n| 列式 | 增长倍数 = `(15894 − 7187) / 7187 = 8707 / 7187` |\n| 速算 | 先拆出 1：`8707 / 7187 = 1 + 1520 / 7187`；1520 约是 7187 的 1/5 稍多，即 0.21 左右；所以总增长倍数 ≈ **1.21** |\n| 结论 | 选 C |\n\n```\n增长倍数 = (15894 − 7187) / 7187 = 8707 / 7187 ≈ 1.21 倍\n```\n\n### 【选项原文】\n\n- A. 1.01 倍\n- B. 1.11 倍\n- C. 1.21 倍\n- D. 1.31 倍\n\n### 【答案】\n\n✅ **C. 1.21 倍**\n\n### 【解析】\n\n- **A、B 错**：15894 明显比 7187 的两倍多（7187×2=14374），增长倍数不可能只有 1.01 或 1.11。\n- **C 对**：8707/7187 在 1.2 出头，约 1.21 倍。\n- **D 错**：1.31 倍对应增长率 31%，需要增量约 2200 以上，实际增量 8707 已超过基期本身。\n\n> ⭐ 老师提醒：“增长了多少倍”和“增长率”是同一回事。15894 比 7187 多了 8707，而 7187 的 1/5 约 1437，所以 8707 是 7187 的 1.21 倍，即增长了 121%。\n\n---\n\n## 第 9 题｜2018 年增长幅度最大的指标\n\n### 【题干原文】\n\n> 与 2014 年比，2018 年增长幅度最大的指标是（　）。\n\n### 【材料数据】\n\n| 指标 | 2014 年 | 2018 年 |\n|------|---------|---------|\n| A. 科技经费/亿元 | 17.71 | 34.77 |\n| B. 专著/部 | 51 | 66 |\n| C. 学术论文/篇 | 10349 | 13437 |\n| D. 科技课题总数/项 | 7187 | 15894 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 比较四个指标的**增长率（增长幅度）**，找最大 |\n| 方法 | 先估算“现期 / 基期”的倍数：达到 2 倍以上者增长幅度 >100%，明显占优 |\n| A 科技经费 | 34.77 / 17.71 ≈ 1.96，不到 2 倍 |\n| B 专著 | 66 / 51 ≈ 1.29，远不到 2 倍 |\n| C 学术论文 | 13437 / 10349 ≈ 1.30，远不到 2 倍 |\n| D 科技课题总数 | 15894 / 7187 ≈ 2.21，超过 2 倍 |\n| 结论 | 科技课题总数的增长幅度最大，选 D |\n\n```\n科技课题总数增长率 ≈ (15894 − 7187) / 7187 ≈ 121%\n科技经费增长率 ≈ (34.77 − 17.71) / 17.71 ≈ 96%\n专著增长率 ≈ (66 − 51) / 51 ≈ 29%\n学术论文增长率 ≈ (13437 − 10349) / 10349 ≈ 30%\n```\n\n### 【选项原文】\n\n- A. 科技经费\n- B. 专著\n- C. 学术论文\n- D. 科技课题总数\n\n### 【答案】\n\n✅ **D. 科技课题总数**\n\n### 【解析】\n\n- **A 错**：科技经费约从 17.71 到 34.77，接近 2 倍但不到 2 倍，增长约 96%。\n- **B 错**：专著从 51 到 66，增幅约 29%。\n- **C 错**：学术论文从 10349 到 13437，增幅约 30%。\n- **D 对**：科技课题总数从 7187 到 15894，超过 2 倍，增长 121% 左右，幅度最大。\n\n> ⭐ 老师提醒：增长幅度就是增速。只要找最大的，不需要精算每一个，先估算“有没有到 2 倍”就能快速排除。科技课题总数是唯一超过 2 倍的，直接锁定。\n\n---\n\n## 第 10 题｜2014–2018 年下降幅度最大的指标\n\n### 【题干原文】\n\n> 2014 年—2018 年，近几年下降幅度最大的指标是（　）。\n\n### 【材料数据】\n\n| 指标 | 2014 年 | 2018 年 | 变化方向 |\n|------|---------|---------|---------|\n| A. 鉴定成果数/项 | 58 | 49 | 下降 |\n| B. 签订合同数/项 | 606 | 302 | 下降 |\n| C. 学术论文/篇 | 10349 | 13437 | 上升 |\n| D. 科技课题总数/项 | 7187 | 15894 | 上升 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 比较四个指标的**下降幅度**；只有真正下降的指标才有降幅，上升指标无“降幅”可言 |\n| 降幅公式 | `降幅 = 减少量 / 基期量`（结果取正值） |\n| A 鉴定成果数 | 减少量 = 58 − 49 = 9；降幅 = `9 / 58 ≈ 15.5%` |\n| B 签订合同数 | 减少量 = 606 − 302 = 304；降幅 = `304 / 606 ≈ 50.2%` |\n| C 学术论文 | 上升，无降幅 |\n| D 科技课题总数 | 上升，无降幅 |\n| 结论 | 签订合同数降幅约 50%，最大，选 B |\n\n```\n鉴定成果数降幅 = 9 / 58 ≈ 15.5%\n签订合同数降幅 = 304 / 606 ≈ 50.2%\n```\n\n### 【选项原文】\n\n- A. 鉴定成果数\n- B. 签订合同数\n- C. 学术论文\n- D. 科技课题总数\n\n### 【答案】\n\n✅ **B. 签订合同数**\n\n### 【解析】\n\n- **A 错**：鉴定成果数虽然下降，但只从 58 降到 49，减少 9，降幅约 15.5%，远小于 B。\n- **B 对**：签订合同数从 606 降到 302，几乎腰斩，降幅约 50%，最大。\n- **C 错**：学术论文从 10349 上升到 13437，是增长，不存在“下降幅度”。若说“增速”大约 30%，但绝非“降幅”。\n- **D 错**：科技课题总数从 7187 上升到 15894，也是增长，不存在“降幅”。\n\n> ⭐ 老师提醒：只有下降的指标才能谈“下降幅度”。增长的指标只能用“增速”描述，不能说“降幅是负百分之三十”。变化幅度则取增速的绝对值，可升可降。\n\n---\n\n## 第 11 题｜乘用车各车型销量同比变化幅度排序\n\n### 【题干原文】\n\n> 2017 年乘用车销售 1970 万辆，比上年同期增长 9.89%。其中轿车增速放缓，SUV、MPV 依旧保持高速增长，交叉型乘用车则继续下降。乘用车分车型看：轿车销售 1238 万辆，同比增长 3.1%；SUV 销售为 408 万辆，同比增长 36.4%；MPV 销量为 191 万辆，同比增长 46.8%；交叉型乘用车销量为 133 万辆，同比下降 18.1%。市场结构上……\n>\n> 下列关于 2017 年乘用车各车型销量同比变化幅度的大小关系，正确的是（　）。\n\n### 【材料数据】\n\n| 车型 | 同比增速 | 变化幅度（取绝对值） |\n|------|---------|-------------------|\n| 轿车 | 3.1% | 3.1% |\n| SUV | 36.4% | 36.4% |\n| MPV | 46.8% | 46.8% |\n| 交叉型乘用车 | −18.1% | 18.1% |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 比较各车型销量同比**变化幅度**，变化幅度 = 增速的绝对值 |\n| 排序 | MPV 46.8% > SUV 36.4% > 交叉型 18.1% > 轿车 3.1% |\n| 结论 | 选 A |\n\n```\n变化幅度：MPV(46.8%) > SUV(36.4%) > 交叉型(18.1%) > 轿车(3.1%)\n```\n\n### 【选项原文】\n\n- A. MPV > SUV > 交叉型 > 轿车\n- B. SUV > 轿车 > MPV > 交叉型\n- C. SUV > 交叉型 > 轿车 > MPV\n- D. MPV > SUV > 轿车 > 交叉型\n\n### 【答案】\n\n✅ **A. MPV > SUV > 交叉型 > 轿车**\n\n### 【解析】\n\n- **A 对**：46.8 > 36.4 > 18.1 > 3.1，正确。\n- **B 错**：把轿车排在 MPV 前面，且把交叉型排在最后，均与数据不符。\n- **C 错**：交叉型变化幅度 18.1% 应排在轿车 3.1% 之前，且 MPV 才是最大。\n- **D 错**：轿车 3.1% 应排在交叉型 18.1% 之后，顺序颠倒。\n\n> ⭐ 老师提醒：变化幅度只看绝对值，下降的 18.1% 仍然比轿车 3.1% 大。不要把“下降”直接当成“最小”。\n\n---\n\n## 第 12 题｜2020 年 12 月煤炭进口量环比\n\n### 【题干原文】\n\n> 图 2 2021 年各月全国煤炭进口量及同比增速\n>\n> 2020 年 12 月，全国煤炭进口量环比（　）。\n\n### 【材料数据】\n\n材料为 **2021 年各月全国煤炭进口量及同比增速** 柱状折线图：\n\n| 时间 | 2021 年进口量（万吨） | 同比增速（%） |\n|------|----------------------|--------------|\n| 11 月 | 3505 | 200.5 |\n| 12 月 | 3095 | −20.8 |\n\n目标：求 **2020 年 12 月进口量环比增速**，即 `(2020 年 12 月 − 2020 年 11 月) / 2020 年 11 月`。\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知 2021 年现期与同比增速，求 2020 年 11、12 月进口量，再算环比增速 |\n| 2020 年 12 月 | `3095 / (1 − 20.8%) = 3095 / 0.792 ≈ 3870` |\n| 2020 年 11 月 | `3505 / (1 + 200.5%) = 3505 / 3.005 ≈ 1168` |\n| 环比增速 | `(3870 − 1168) / 1168 ≈ 2702 / 1168 ≈ 231%` |\n| 结论 | 增长超过 100%，选 B |\n\n```\n2020 年 12 月 = 3095 / 0.792 ≈ 3870 万吨\n2020 年 11 月 = 3505 / 3.005 ≈ 1168 万吨\n环比增速 = (3870 − 1168) / 1168 ≈ 231%\n```\n\n### 【选项原文】\n\n- A. 增长了不到 100%\n- B. 增长了 100% 以上\n- C. 下降了不到 50%\n- D. 下降了 50% 以上\n\n### 【答案】\n\n✅ **B. 增长了 100% 以上**\n\n### 【解析】\n\n- **A 错**：2020 年 12 月 3870 万吨，是 2020 年 11 月 1168 万吨的 3 倍以上，增长远超 100%。\n- **B 对**：环比增速约 231%，属于“增长 100% 以上”。\n- **C、D 错**：方向是上升而非下降，2021 年 12 月同比下降不代表 2020 年 12 月环比下降。\n\n> ⭐ 老师提醒：图表给的是 2021 年的数据，问的是 2020 年 12 月的环比。要先通过同比增速把 2020 年 11、12 月分别求出来，再做环比。注意 11 月的增速是 200.5%，所以基期 = 3505 / 3。\n\n---\n\n## 第 13 题｜2019 年 S 省第一产业增加值增量\n\n### 【题干原文】\n\n> 图 1 S 省 2016–2020 年地区生产总值；图 2 S 省 2016–2020 年三次产业增加值占 GDP 的比重\n>\n> 2019 年，S 省第一产业增加值相对于上一年（　）。\n\n### 【材料数据】\n\n| 时间 | 地区生产总值（亿元） | 第一产业占比 |\n|------|---------------------|-------------|\n| 2018 年 | 42902.1 | 10.3% |\n| 2019 年 | 46363.8 | 10.4% |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知总量与比重，求部分量的**增长量** |\n| 基本列式 | 第一产业增加值 = GDP × 占比；增长量 = 2019 年部分 − 2018 年部分 |\n| 直接算法 | `46363.8 × 10.4% ≈ 4821`；`42902.1 × 10.3% ≈ 4419`；差 ≈ **402** |\n| 优化算法 | 将 10.4% 拆成 10.3% + 0.1%，则  \n`增长量 = (46363.8 − 42902.1) × 10.3% + 46363.8 × 0.1%`  \n`= 3461.7 × 10.3% + 46.4`  \n`≈ 356.4 + 46.4 = 402.8` |\n| 结论 | 增加 400 亿元以上，选 B |\n\n```\n2019 年第一产业增加值 = 46363.8 × 10.4% ≈ 4821 亿元\n2018 年第一产业增加值 = 42902.1 × 10.3% ≈ 4419 亿元\n增长量 ≈ 4821 − 4419 = 402 亿元\n\n优化算法：\n增长量 = (46363.8 − 42902.1) × 10.3% + 46363.8 × 0.1%\n       ≈ 3461.8 × 10.3% + 46.4\n       ≈ 356.4 + 46.4\n       = 402.8 亿元\n```\n\n### 【选项原文】\n\n- A. 增加了不到 400 亿元\n- B. 增加了 400 亿元以上\n- C. 减少了 400 亿元以上\n- D. 减少了不到 400 亿元\n\n### 【答案】\n\n✅ **B. 增加了 400 亿元以上**\n\n### 【解析】\n\n- **A 错**：估算结果约 402.8 亿元，已超过 400 亿元。\n- **B 对**：2019 年 GDP 与占比均高于 2018 年，第一产业增加值增加约 402.8 亿元。\n- **C、D 错**：方向是增加，不是减少。\n\n> ⭐ 老师提醒：\n> 1. “第一产业增加值”不是“增长量”，而是当年第一产业的现期量。\n> 2. 当比重只变化 0.1 个百分点时，可以用**拆分法**简化计算：把 10.4% 写成 10.3% + 0.1%，这样只算一次高位乘法，另一次只需移动小数点。\n\n---\n\n## 第 14 题｜2014 年 2 月银行间债券市场成交额同比减少量\n\n### 【题干原文】\n\n> 2014 年 1 月份，银行间债券市场现券交易累计成交 1.9 万亿元，同比减少 76.1%，环比减少 1.6%。1 月末，银行间债券总指数为 145.35，环比上升 0.98%。交易所国债指数为 139.58，较去年 12 月末上升 0.04%。\n>\n> 2014 年 1–2 月，银行间债券市场现券交易累计成交 4.0 万亿元，同比减少 69.6%。\n>\n> 2014 年 2 月份，银行间债券市场现券交易累计成交额较上年同期减少了多少万亿元？\n\n### 【材料数据】\n\n| 时间 | 成交额（万亿元） | 同比减少 |\n|------|-----------------|---------|\n| 2014 年 1 月 | 1.9 | 76.1% |\n| 2014 年 1–2 月 | 4.0 | 69.6% |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 已知 2014 年 1 月、1–2 月累计成交额及各自同比增速，求 2014 年 2 月**同比减少量** |\n| 2014 年 2 月 | `1–2 月累计 − 1 月 = 4.0 − 1.9 = 2.1` 万亿元 |\n| 2013 年 1–2 月 | `4.0 / (1 − 69.6%) = 4.0 / 0.304 ≈ 13.16` 万亿元 |\n| 2013 年 1 月 | `1.9 / (1 − 76.1%) = 1.9 / 0.239 ≈ 7.95` 万亿元 |\n| 2013 年 2 月 | `13.16 − 7.95 = 5.21` 万亿元 |\n| 减少量 | `2013 年 2 月 − 2014 年 2 月 = 5.21 − 2.1 = 3.11` 万亿元 |\n| 结论 | 最接近 A 选项 3.1 |\n\n```\n2014 年 2 月 = 4.0 − 1.9 = 2.1 万亿元\n2013 年 1-2 月 = 4.0 / 0.304 ≈ 13.16 万亿元\n2013 年 1 月   = 1.9 / 0.239 ≈ 7.95 万亿元\n2013 年 2 月   = 13.16 − 7.95 = 5.21 万亿元\n减少量 = 5.21 − 2.1 ≈ 3.11 万亿元\n```\n\n### 【选项原文】\n\n- A. 3.1\n- B. 4.1\n- C. 6.9\n- D. 7.9\n\n### 【答案】\n\n✅ **A. 3.1**\n\n### 【解析】\n\n- **A 对**：2013 年 2 月约 5.2 万亿，2014 年 2 月 2.1 万亿，减少约 3.1 万亿。\n- **B 错**：4.1 万亿可能是把 2013 年 2 月误算成 6.2 万亿或 2014 年 2 月误算成 1.0 万亿。\n- **C 错**：6.9 万亿可能是用 2013 年 1–2 月 13.16 万亿直接减去 2014 年 1–2 月 4.0 万亿，但题目问的是“2 月份”不是“1–2 月”。\n- **D 错**：7.9 万亿接近 2013 年 1 月单独值，是把 1 月当成 2 月。\n\n> ⭐ 老师提醒：\n> 1. 材料给的是“1 月”和“1–2 月累计”，求 2 月要用**矛盾面做差**。\n> 2. 问“较上年同期减少多少”，需要分别把 2014 年 1–2 月和 1 月的上年同期求出来，再做差得到 2013 年 2 月，最后与 2014 年 2 月相减。\n\n---\n\n## 第 15 题｜2022 年 3 月对外承包工程新签合同数环比增速\n\n### 【题干原文】\n\n> 2022 年 1–3 月我国在“一带一路”沿线国家对外承包工程业务情况\n>\n> 2022 年 3 月份我国在“一带一路”沿线国家对外承包工程新签合同数环比约（　）。\n\n### 【材料数据】\n\n| 时间 | 累计完成营业额（亿元） | 累计新签合同数（份） | 累计新签合同额（亿元） |\n|------|---------------------|---------------------|----------------------|\n| 1 月 | 282.3 | 295 | 574.8 |\n| 2 月 | 649.3 | **812** | 1103.0 |\n| 3 月 | 1014.2 | **959** | 1564.7 |\n\n### 【解题拆解】\n\n| 项目 | 内容 |\n|------|------|\n| 题型识别 | 求 2022 年 3 月**新签合同数**的环比增速；注意表格是**累计值** |\n| 3 月新签合同数 | `959 − 812 = 147` 份 |\n| 2 月新签合同数 | `812 − 295 = 517` 份 |\n| 环比增速 | `(147 − 517) / 517 = −370 / 517 ≈ −71.6%` |\n| 结论 | 下降超过 70%，选 D |\n\n```\n3 月 = 959 − 812 = 147 份\n2 月 = 812 − 295 = 517 份\n环比增速 = (147 − 517) / 517 = −370 / 517 ≈ −71.6%\n```\n\n### 【选项原文】\n\n- A. 上升 18%\n- B. 下降 18%\n- C. 上升 72%\n- D. 下降 72%\n\n### 【答案】\n\n✅ **D. 下降 72%**\n\n### 【解析】\n\n- **A、C 错**：3 月 147 份明显小于 2 月 517 份，方向是下降，不是上升。\n- **B 错**：下降 18% 意味着 3 月约为 2 月的 82%，而 147 只有 517 的 28% 左右，下降幅度远大于 18%。\n- **D 对**：147 不到 517 的一半，只剩约 28%，即下降约 72%。\n\n> ⭐ 老师提醒：表格标题是“累计新签合同数”，不是当月数。3 月份的值要用“1–3 月累计”减去“1–2 月累计”。找数据的时候一定要看准**对象、时间、描述**三个字。\n\n---\n\n## 本讲知识点总表\n\n| 知识点 | 定义 / 公式 | 本集对应题号 |\n|--------|------------|-------------|\n| 基期量 | `基期量 = 现期量 / (1 + 增长率)` | 1、2、4、5、12、14 |\n| 增长量 | `增长量 = 现期量 − 基期量` | 3、13、14 |\n| 增长率 | `r = 增长量 / 基期量 = 现期量 / 基期量 − 1` | 7、8、9、10、11 |\n| 同比 / 环比 | 同比：与上年同期比；环比：与紧邻的上一个统计周期比 | 1、2、3、4、12、15 |\n| 百分点 | 百分数之间的差值，直接加减 | 6 |\n| 增长倍数 | “增长了多少倍”即增长率，1.21 倍 = 增长 121% | 8 |\n| 变化幅度 | 增速的**绝对值**，只看大小不看方向 | 11 |\n| 下降幅度 | 只有真正下降的指标才有降幅，用 `减少量 / 基期量` | 10 |\n| 比重相关增量 | 部分量 = 总量 × 比重；增量可拆分为 `Δ总量 × 原比重 + 新总量 × Δ比重` | 13 |\n| 累计与当月 | 当月 = 当月累计 − 上月累计 | 3、14、15 |\n\n---\n\n## 速算口诀与解题流程\n\n### 1. 基期量速算\n\n```\n基期量 = 现期量 / (1 + r)\n保留三位直除，只看有效数字；选项同量级时不用管小数点\n```\n\n### 2. 增长率速算\n\n```\nr = 增长量 / 基期量\n建议先算增长量，再除基期，误差更小\n```\n\n### 3. 增长幅度 / 下降幅度比较\n\n```\n先估算“现期 / 基期”是否达到 2 倍：\n- 超过 2 倍 → 增长率 > 100%\n- 接近 2 倍 → 增长率约 100%\n- 远低于 2 倍 → 增长率不大\n```\n\n### 4. 百分点问题\n\n```\n“A 比 B 高/低 x 个百分点” → 直接用 A − x = B 或 A + x = B\n注意：百分点只加减，不乘除\n```\n\n### 5. 比重相关增量拆分\n\n```\n部分增量 = 新总量 × 新比重 − 原总量 × 原比重\n        = (新总量 − 原总量) × 原比重 + 新总量 × (新比重 − 原比重)\n        = Δ总量 × 原比重 + 新总量 × Δ比重\n```\n\n### 6. 通用解题流程\n\n```\n第 1 步：读题干，圈出时间、主体、问法（基期/现期/增长量/增长率）\n第 2 步：回材料定位，找对应数据行和列\n第 3 步：列式，注意同比/环比、累计/当月、比重/总量\n第 4 步：速算，保留三位直除或合理估算\n第 5 步：结合选项排除，锁定答案\n```\n\n---\n\n## 易错点与陷阱清单\n\n| 陷阱类型 | 具体表现 | 本集例题 | 破解方法 |\n|----------|---------|---------|---------|\n| 时间陷阱 | 给 2018 年 12 月，问 2017 年 12 月 | 1、2 | 看清问的是“同比”还是“环比”，套用基期公式 |\n| 累计陷阱 | 表格给“累计新签合同数”，问当月 | 15 | 当月 = 当月累计 − 上月累计 |\n| 范围陷阱 | 给 1–12 月和 12 月，问 1–10 月 | 3 | 找“时间的矛盾面”，扣除 11、12 月 |\n| 概念陷阱 | “增加值”不是“增长量” | 13 | 增加值是当年部分量，需用总量 × 比重 |\n| 方向陷阱 | “下降幅度”只能用于下降的指标 | 10 | 上升指标无“降幅”，变化幅度取绝对值 |\n| 倍数陷阱 | “增长了多少倍”等同于增长率 | 8 | 0.15 倍 = 15%，1.21 倍 = 121% |\n| 百分点陷阱 | 把百分点当百分数乘除 | 6 | 百分点直接加减 |\n| 对象陷阱 | 找错行/列，把生产量当销售量 | 3 | 先找“主体”，再找“时间”和“指标” |\n| 现期陷阱 | 题目问基期，却直接用现期差 | 4 | 两个时间都要先化基期再做差 |\n\n---\n\n## 老师金句\n\n> ⭐ “这篇课后作业不太难，但是有很多细节的地方，还是要稍微小心一下，注意一点。”\n\n> ⭐ “找数据的时候，如果它是图表，里面的数字会很多，汉字会比较少。重点去找这个汽车在哪，销量在哪。”\n\n> ⭐ “题干里没有直接给你的时间，一定要记得去找这个时间的矛盾面——它一定会存在一个比你要找的时间范围更大的时间。”\n\n> ⭐ “求增速的时候，建议先算增长量，再除以基期。计算对象小一点，误差会小一点。”\n\n> ⭐ “变化幅度只看绝对值；下降幅度只有下降的指标才有。增长的指标，只能说增速，不能说降幅。”\n\n> ⭐ “找数据的时候一定要找准对象、时间、描述，尤其是‘累计’这两个字。”\n\n---\n\n","outline":[{"level":2,"text":"第 1 题｜2017 年 12 月汽车销量","id":"第-1-题2017-年-12-月汽车销量"},{"level":3,"text":"【题干原文】","id":"题干原文"},{"level":3,"text":"【材料数据】","id":"材料数据"},{"level":3,"text":"【解题拆解】","id":"解题拆解"},{"level":3,"text":"【选项原文】","id":"选项原文"},{"level":3,"text":"【答案】","id":"答案"},{"level":3,"text":"【解析】","id":"解析"},{"level":2,"text":"第 2 题｜2018 年 11 月 MPV 销量","id":"第-2-题2018-年-11-月-mpv-销量"},{"level":3,"text":"【题干原文】","id":"题干原文-2"},{"level":3,"text":"【材料数据】","id":"材料数据-2"},{"level":3,"text":"【解题拆解】","id":"解题拆解-2"},{"level":3,"text":"【选项原文】","id":"选项原文-2"},{"level":3,"text":"【答案】","id":"答案-2"},{"level":3,"text":"【解析】","id":"解析-2"},{"level":2,"text":"第 3 题｜2018 年 1–10 月轿车生产量与销售量之差","id":"第-3-题2018-年-110-月轿车生产量与销售量之差"},{"level":3,"text":"【题干原文】","id":"题干原文-3"},{"level":3,"text":"【材料数据】","id":"材料数据-3"},{"level":3,"text":"【解题拆解】","id":"解题拆解-3"},{"level":3,"text":"【选项原文】","id":"选项原文-3"},{"level":3,"text":"【答案】","id":"答案-3"},{"level":3,"text":"【解析】","id":"解析-3"},{"level":2,"text":"第 4 题｜2018 年全国第一、二季度进口煤炭","id":"第-4-题2018-年全国第一二季度进口煤炭"},{"level":3,"text":"【题干原文】","id":"题干原文-4"},{"level":3,"text":"【材料数据】","id":"材料数据-4"},{"level":3,"text":"【解题拆解】","id":"解题拆解-4"},{"level":3,"text":"【选项原文】","id":"选项原文-4"},{"level":3,"text":"【答案】","id":"答案-4"},{"level":3,"text":"【解析】","id":"解析-4"},{"level":2,"text":"第 5 题｜2019 年上半年国内旅游人数","id":"第-5-题2019-年上半年国内旅游人数"},{"level":3,"text":"【题干原文】","id":"题干原文-5"},{"level":3,"text":"【材料数据】","id":"材料数据-5"},{"level":3,"text":"【解题拆解】","id":"解题拆解-5"},{"level":3,"text":"【选项原文】","id":"选项原文-5"},{"level":3,"text":"【答案】","id":"答案-5"},{"level":3,"text":"【解析】","id":"解析-5"},{"level":2,"text":"第 6 题｜东北三省进出口增速比全国增速高/低多少个百分点","id":"第-6-题东北三省进出口增速比全国增速高低多少个百分点"},{"level":3,"text":"【题干原文】","id":"题干原文-6"},{"level":3,"text":"【材料数据】","id":"材料数据-6"},{"level":3,"text":"【解题拆解】","id":"解题拆解-6"},{"level":3,"text":"【选项原文】","id":"选项原文-6"},{"level":3,"text":"【答案】","id":"答案-6"},{"level":3,"text":"【解析】","id":"解析-6"},{"level":2,"text":"第 7 题｜研究与发展人员人数增速","id": .3 板演示例（加减乘除四例）](#33-板演示例加减乘除四例)\n  - [例题 1｜2024 年全国煤炭进口额（月均）](#例题-1｜2024-年全国煤炭进口额月均)\n  - [例题 2｜2015 年全国第三方移动支付市场（月均）](#例题-2｜2015-年全国第三方移动支付市场月均)\n- [四、板块贰：调整位数](#四板块贰调整位数)\n  - [例题 3｜59082÷1.1（有效数字与量级）](#例题-3｜5908211有效数字与量级)\n  - [例题 4｜147774×0.4%（位数无所谓）](#例题-4｜14777404位数无所谓)\n- [五、板块叁/肆：误差分析](#五板块叁肆误差分析)\n  - [5.1 误差来源：减少位数](#51-误差来源减少位数)\n  - [例题 5｜147774×0.4%（选项变近后的修正）](#例题-5｜14777404选项变近后的修正)\n  - [5.2 加减误差](#52-加减误差)\n  - [例题 6｜7417+8854（加法：不同方向抵消）](#例题-6｜74178854加法不同方向抵消)\n  - [例题 7｜7417+8810+5920+4709+4270（多位数：记总账）](#例题-7｜74178810592047094270多位数记总账)\n  - [例题 8｜715−523（减法：同方向抵消）](#例题-8｜715523减法同方向抵消)\n  - [5.3 截位误差](#53-截位误差)\n  - [5.4 乘除误差（先看占比）](#54-乘除误差先看占比)\n  - [例题 9｜1781×3%](#例题-9｜17813)\n  - [例题 10｜25733×7.8%（动两个数）](#例题-10｜2573378动两个数)\n  - [例题 11｜1642.5×8.8%（不同方向抵消）](#例题-11｜1642588不同方向抵消)\n  - [例题 12｜50225÷731（除法：同向抵消）](#例题-12｜50225731除法同向抵消)\n  - [例题 13｜54428÷12](#例题-13｜5442812)\n- [六、板块伍：计算对象](#六板块伍计算对象)\n  - [例题 14｜2024 年江苏省对非洲进出口总额增速](#例题-14｜2024-年江苏省对非洲进出口总额增速)\n  - [例题 15｜2019 江苏事业 · 社会消费品零售总额](#例题-15｜2019-江苏事业--社会消费品零售总额)\n  - [例题 16｜2021 年全国城市供水总量（计算对象变小）](#例题-16｜2021-年全国城市供水总量计算对象变小)\n  - [例题 17｜2019 山东选调 · 人口总数（计算对象变大的反例）](#例题-17｜2019-山东选调--人口总数计算对象变大的反例)\n  - [例题 18｜间接误差：10566÷1.184 − 8811÷1.02](#例题-18｜间接误差105661184--8811102)\n- [七、本讲知识点总表](#七本讲知识点总表)\n- [八、速算口诀与解题流程](#八速算口诀与解题流程)\n- [九、易错点与陷阱清单](#九易错点与陷阱清单)\n- [十、老师金句](#十老师金句)\n\n---\n\n## 一、开场铺垫：从\"资料分析\"到\"资料计算\"的痛点\n\n> 我们上一节课主要就是讲了一些基本概念，讲了个什么是增量，增量就是限期减基期；还讲了什么是增速，增速就是增量除以基期。以及他们之间的一些公式计算，增量它也能等于限期减掉限期除以一加增速，增速还能等于限期除以基期减一。\n\n开场复习公式（板书 + 口述）：\n\n```\n增长量 Δ = 现期值 − 基期值\n增长率 r = 增长量 ÷ 基期值\n增长量 Δ = 现期值 − 现期值 ÷ (1 + 增长率) = 现期值 × 增长率 ÷ (1 + 增长率)\n增长率 r = 现期值 ÷ 基期值 − 1\n```\n\n> 不知道有没有同学觉得我们在做课后作业的时候，就好像感觉这题目吧，我也读得懂，我也知道他们什么关系，但是就是感觉这个计算啊，真烦。\n> 有的时候他数据位数太多了，四位数五位数的都有，我全保留下来去算吧，确实算的准，但是就感觉好慢，这样一道题我要算个一两分钟、两三分钟的，烦死了，花的时间又长、效率还低、脑子还累。你这脑袋一累，待会儿后面去做什么其他模块、做什么言语、做判断，就更使不上劲了。\n\n> 所以我们今天第二节课，包括后面的第三第四节课，主要就是要来帮大家解决这个问题。让我们在避免那么多位数的计算的情况下，还能够相对的准一点。让我们在做这个资料分析的时候，不会变成一个\"资料计算\"，天天在那边什么五位数乘三位数、五位数除三位数，累死了。我们要把它真正的做成一个资料分析。要让这个事情尽量轻松愉快一点。\n\n**本课定位（老师原话）**：\n\n> 今天这第二节课主要还是为我们第三节课\"放缩运算\"去做一个准备的，相当于是一个理论基础。你把这个东西搞懂了之后，你再去学了些什么除法放缩、乘法放缩，就相对来说轻松很多了。\n\n---\n\n## 二、本讲五大板块（目录页原文）\n\n| 编号 | 板块 | 定位 |\n|---|---|---|\n| 壹 | 运算顺序 | 让计算**更快** |\n| 贰 | 调整位数 | 让计算**更快** |\n| 叁 | 加减误差 | 在快的基础上让它**更准** |\n| 肆 | 乘除误差 | 在快的基础上让它**更准** |\n| 伍 | 计算对象 | 决定误差大小的关键 |\n\n> 今天主要讲这几个东西：一个是运算的顺序，还有一个是位数，以及后面的误差。三四五主要是一起的是一个误差。因为计算其实无非就是这些东西。\n\n> 所以前面两个侧重点在于怎么让这个事情变得更快，后面这个侧重点在于怎么让它在快的基础上还要准。\n\n> （目录页手写标注）**快** = 壹 + 贰；**准** = 叁 + 肆（误差），整体围绕**伍 计算对象**展开。\n\n**结尾总结页原文（第二课数据分析总结）**：\n\n| 基本逻辑 | 误差关系 |\n|---|---|\n| ① 计算**顺序**不重要，先易后难，抓大放小 | **加法、乘法**：同方向累积、反方向抵消 |\n| ② 计算**位数**不重要，取有效数字即可 | |\n| ③ 乘除**计算对象**尽量小 | **减法、除法**：同方向抵消、反方向累积 |\n\n---\n\n## 三、板块壹：运算顺序\n\n### 3.1 四则运算交换律（板书原文）\n\n> 这个运算的顺序，它其实也就是符合我们小学的时候学过的四则运算的一个交换律。\n\n画面板书（逐字）：\n\n```\na+b+c+d = a+d+b+c\na-b-c-d = a-d-b-c\na+b-c-d = a-c+b-d\na×b×c = a×c×b\na÷b÷c = a÷c÷b\na×b÷c = a÷c×b\n```\n\n> 大家要注意要满足四则运算的交换律，你不要给我搞出来这种事情：老师说这个计算的顺序可以换，我要是 a 加 b 乘以 c，我感觉这个 a 乘 c 好算，我先算 a 乘 c，算完了之后再加个 b，这行不行？**这肯定不行了**，你违反了四则运算的交换率和分配率，你这样只能把它理解成 a 乘 c 加 b 乘 c。\n\n> ⚠️ **红线**：**加减之间能换，乘除之间能换**，但**别加与乘、加与除什么的也换来换去**，要满足乘法或者说除法的分配率。\n\n### 3.2 运算顺序的两条原则\n\n画面板书（运算顺序页原文）：\n\n> 复杂步骤的题目，运算步骤的顺序选择非常重要。\n> **① 好算的先算**\n> **② 影响大的先算**\n\n> 所以我们在运算顺序上遵循的一个原则就是：如果它的步骤比较多，你**先把好算的算了，先把影响相对比较大的先算了**。先把影响大的算掉之后，你看这个大概的结果是多少，那其他的步骤影响比较小，你再**结合选项去做判断**。\n\n> 它好算肯定先算了，第二个是出于我们资料分析，它是个**选择题**。选择题的话，那有的步骤它的影响比较小，可能就不会干扰你去做一个答案的选择。\n\n### 3.3 板演示例（加减乘除四例）\n\n**① 加法换序：7247 + 5192 + 6695 + 4121**\n\n> 四个数在这边求和，你要一个一个算，你会不会觉得有点累？……那我们可以调一下顺序嘛。你能不能先把这个 4121 跟这个 7247 加起来？这样一加，这个 247 加 121 好加吧，前面的 7000 跟 4000 先加起来是 11000，后面的 200 多加 100 多，300 多、300 多，368；然后中间这两个都是那种很靠近整百的东西，那就算做 5200、6700，他们俩加起来 11900，虽然说都偏大了一点点，但影响应该挺小的。这样两个一加，算起来一共是 23268。\n\n板书（画面）：\n\n```\n7247 + 5192 + 6695 + 4121\n= (7247 + 4121) + (5192 + 6695)\n= 11368        +  11900(≈5200+6700)\n= 23268\n```\n\n画面出现的手写数字：`4121` 与 `7247` 被圈在一起，右侧写 `11368`，中间写 `5200`、`6700`、`11900`，合计 `23268`。\n\n**② 减法换序：1623 − 751 − 417**\n\n> 23 减 51 不够减怎么办？不够减就很烦，我要想着去借……那我先减这个不行吗？我先把 417 减掉呗，反正先减后减都是减我这么多钱，这两笔钱发给你们的，先来后领，跟我最后剩下的这个钱没有关系、没有影响。\n\n板书（画面）：\n\n```\n1623 − 751 − 417\n= (1623 − 417) − 751\n= 1206 − 751\n= 455\n```\n\n**③ 乘法换序：240 × 102 × 250**\n\n> 你说你非要先算这个乘 102 吗？我觉得没必要，因为我觉得这个东西影响比较小，我就先把它往后放放，我先算算这个乘 250 是多少。240 乘 250 就是 60000，然后你再乘个 102，就简单了吧，相当于 60000 乘 102，等于 6120000。\n\n板书（画面）：\n\n```\n240 × 102 × 250\n= 240 × 250 × 102\n= 60000 × 102\n= 6120000\n```\n\n> 问号是什么意思？是不知道这个六万哪来的吗？……250，它是等于 1/4 分之四分之一的关系（250 = 1000 ÷ 4），就是 240 除以 4 等于 60，再往后乘 1000。（画面在 `250` 处圈注 `= 1/4`）\n\n**④ 除法换序：945 ÷ 8 ÷ 9**\n\n> 那我是不是除 9 对于 945 来说更好算，因为 945 它正好是 9 的倍数……我先除 9，出来的是一百零五，最后再除 8，这个结果相对来说就能够更好的直接看出来，大概在十三左右，十三点几。你要是先除个 8，你第一步你就烦了。\n\n板书（画面）：\n\n```\n945 ÷ 8 ÷ 9\n= 945 ÷ 9 ÷ 8\n= 105 ÷ 8\n≈ 13 点几\n```\n\n**⑤ 先乘后除变先除后乘：945 × 5 ÷ 9**\n\n板书（画面）：\n\n```\n945 × 5 ÷ 9\n= 945 ÷ 9 × 5\n= 105 × 5\n= 525\n```\n\n> 除以九，一百零五，再乘五，五百二十五，你看这样是不是快？**好算的先算就可以。**\n\n---\n\n### 例题 1｜2024 年全国煤炭进口额（月均）\n\n> 此为老师讲解\"运算顺序\"的第一道示范题。\n\n**【题干原文】**（画面逐字）\n\n> 2024 年全国全年我国煤炭进口额 6154 亿元，同比增长 4.0%。\n> 2023 年我国月均煤炭进口额为：\n\n**【材料数据】**\n\n| 年份 | 我国煤炭进口额 | 同比增速 |\n|---|---|---|\n| 2024 年（现期） | 6154 亿元 | 4.0% |\n\n所求：2023 年（基期）月均煤炭进口额。\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 已知**现期值 + 增长率**，求**基期值的月均值**（平均数） |\n| 定位数据 | 现期 6154 亿元，增速 4.0%，一年按 12 个月 |\n| 常规列式 | `6154 ÷ (1 + 4%) ÷ 12` |\n| 常规算法 | 先算基期：`6154 ÷ 1.04 ≈ 5901`；再 `5901 ÷ 12 ≈ 492` |\n| 换序算法 | 先算影响大的一步：`6154 ÷ 12`（结果直接落在选项量级上） |\n| 关键判断 | 除 12 把 5900 变成 400 多，**影响大**；除 1.04 只把 6154 变成 5901，**影响小** |\n\n**常规算法板书（竖式，画面）**：\n\n```\n     59.1\n104) 6154\n     520\n     ----\n      954\n      936\n      ----\n       180\n```\n\n即 `6154 ÷ 1.04 ≈ 59.1`（量级为 5901 亿元），再：\n\n```\n   492\n12)5910\n   48\n   ---\n   111\n   108\n   ---\n     30\n```\n\n**【解题拆解（换序演示）】**\n\n画面板书：\n\n```\n6154 ÷ (1+4%) ÷ 12\n≈ (5910) ÷ 12 = 492\n≈ 先算 6154 ÷ 12 ≈ 512\n```\n\n**老师讲解原话**：\n\n> 那我们再来想一下，我们在这个计算过程中，它其实是分了两步：第一步是 6154 它要除 1.04，第二步是要除 12。这两步哪一个影响更大？除 12 吧。你除这个 1.04，只不过是把 6154 变成了 5901，就基本上动了那么一点点。但是这个除 12 呢，能直接把 5900 变成了 400 多，一下子这个数我不管你算成什么，是不是非常靠近这个选项？已经非常接近你的最终答案了。\n> 所以我们就先除 12 呗，我先拿这个 6154 去除 12，反正我调换这个顺序，对结果又没影响。这个式子就会变成 6154 除 12，我上个 5，56，15，上个 1，12，34，上个 2，所以就是我今年这个月均也不过才 512，然后还要干嘛？还再除个 1.04，那不就选 A 吗？你看这个除 1.04，你还要算吗？是不是就不需要算了？\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 493 |\n| B | 517 |\n| C | 528 |\n| D | 552 |\n\n**【答案】** ✅ A\n\n**【解析】**\n\n- 正确值：`6154 ÷ 1.04 ÷ 12 ≈ 5901.9 ÷ 12 ≈ 491.8`，与 A（493）最接近 → **选 A**。\n- 排除 B/C/D：三者都在 500 以上，而\"现期月均\"已经只有 512，基期月均必然**小于** 512，故 B、C、D 全部超出范围。\n- **陷阱类型**：**概念陷阱**（把\"现期月均\"当成\"基期月均\"）+ **时间陷阱**（2024 与 2023 混淆）。\n- **老师点评**：\n\n> 因为它影响小，影响小，那选项差距只要不是那么小的时候，很多时候这个影响它并不会影响到你去选这个正确答案。\n\n> ⚠️ **方法与边界的提醒（老师原话）**：\n> 当然最好这个\"影响大、影响小\"是比较明显的东西。你不要说这个题目它本身就是个什么 6154 除以 37 再除以 25，或者说除 25 再除 37，老师说要先算影响大的，我就先把这个除 37……这个就没必要了。**只是一种思想**，不是说非要你去做每一步运算的时候全去想着它，你给自己增加太多的计算负担也不好。\n\n---\n\n### 例题 2｜2015 年全国第三方移动支付市场（月均）\n\n**【题干原文】**（画面逐字）\n\n> 2015 年二季度全国第三方移动支付市场交易额达到 3.47 万亿元，环比增长 22.21%，三季度、四季度继续上涨，分别达到 4.39 万亿元、5.67 万亿元。\n> 2015 年全国第三方移动支付市场月均交易额约为：\n\n**【材料数据】**\n\n| 时期 | 交易额 |\n|---|---|\n| 2015 年二季度 | 3.47 万亿元 |\n| 2015 年二季度环比增速 | 22.21% |\n| 2015 年三季度 | 4.39 万亿元 |\n| 2015 年四季度 | 5.67 万亿元 |\n\n**【解题拆解】**\n\n| 环节 | 内容 |\n|---|---|\n| 题型识别 | 求**月均交易额** → 先求全年总量，再除以 12 |\n| 缺项定位 | 题干给了二、三、四季度，**缺一季度**；一季度的信息藏在\"二季度环比增长 22.21%\"里 |\n| 方法 | 增速是连接现期与基期的桥梁：一季度 = 二季度 ÷ (1 + 环比增速) |\n| 完整列式 | `(3.47 ÷ 1.2221 + 3.47 + 4.39 + 5.67) ÷ 12` |\n| 速算思路 | 一季度那一步位数最多、最麻烦，但它影响很小（只是把 3.47 变小一点点），可**先当 3.47 用** |\n| 结论 | 估算全年 ≈ 17，月均 ≈ 1.42（偏高），据此排除 B、C，再判断 A 偏小 |\n\n**板书与速算（画面）**：\n\n```\n一季度 = 3.47 ÷ (1 + 22.21%)  →  3.47 ÷ 1.2221\n\n完整式 = (3.47 ÷ 1.2221 + 3.47 + 4.39 + 5.67) ÷ 12\n\n速算：\n3.47 + 3.47 + 4.39 + 5.67 = 17（高估）\n17 ÷ 12 ≈ 1.42（偏高一点的月均值）\n```\n\n> 那干脆我就先当 3.47 来算行不行？……我这个道理大概多算了多少倍，先这样子，先把 3.47 加起来。3.47、6.94、再加 4.39 就是 11.33，再加 5.67 就是 17。17 这个数，它并不是一个准确的真实的全年的数，但是我们在先舍弃了那个相对比较小的一个影响的情况下，估的一个高一点点的全年的数。\n\n**排除逻辑（老师原话）**：\n\n> 那这个 1.42 是一个偏高一点的月均值，那我们是不是可以先把 B、C 排除掉了？主要就看是 A 还是 D。他们俩到底谁是对的呢？肯定比 1.42 小，小多少呢？得到 1.2 啊，能不能差这么 0.22？差 0.22 意味着什么？意味着你的平均值每个月要小 0.22，总共就要小 2.4（万亿）。我到底有没有多算的 2.4？没有那么多吧。我觉得只是个很小的影响，只是可能说把一个 3 不到的数写成那个 3.4，没有这么大的影响，所以 A 太小了，所以选 D。\n\n> ⭐ **先粗后细原则**：\n> 资料分析有这么个原则叫**先粗后细**。你先估算，估算的可以出答案，其他选项不可能在这个范围内选择；选不出来，你就把它调细一点。\n\n**修正示范（画面板书）**：\n\n```\n若算得 1.42，多算了约 0.6\n0.6 ÷ 12 = 0.05\n准确值 ≈ 1.42 − 0.05 = 1.37\n```\n\n> 我们刚刚不是算了个 1.42 吗？你就算这个 1.3 到底偏大了多少嘛……这个增量呢，大概就是 0.6 多一点，就意味着我们刚刚把一个数扩大了 0.6，那 0.6 它平摊到 12 个月上来说，只会导致每个月去增加 0.05，所以它的准确值应该是 1.42 减 0.05，得到 1.37，这个才是准确值。\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 1.2 万亿元 |\n| B | 1.9 万亿元 |\n| C | 1.7 万亿元 |\n| D | 1.4 万亿元 |\n\n**【答案】** ✅ D\n\n**【解析】**\n\n- 精确计算：一季度 ≈ `3.47 ÷ 1.2221 ≈ 2.84`（万亿元），全年 ≈ `2.84 + 3.47 + 4.39 + 5.67 = 16.37`（万亿元），月均 ≈ `16.37 ÷ 12 ≈ 1.36`（万亿元）→ 最接近 **D.1.4 万亿元**。\n- 排除 A（1.2）：若月均为 1.2，则全年只有 14.4，比\"高估值 17\"少 2.4 以上，与\"只省了一季度那一点点\"的事实严重不符。\n- 排除 B（1.9）、C（1.7）：二者均**大于**\"高估值 1.42\"，与\"我们刚刚是往大了估\"的方向矛盾。\n- **陷阱类型**：**概念陷阱**（环比增速是\"与上一季度比\"，容易找不到一季度）+ **范围陷阱**（月均 ≠ 季均）。\n- **为什么排除乘法不用精算**：\n\n> 对他刚刚只不过是相当于是我们的误差，我们的误差它会被 12 均分掉。比如说我假设它原本的数值是 2.9，本来应该是 2.9 加 3.47 加什么除 12，现在我们还是保留了 3.47 加 3.47 加什么除 12，他们之间的差距只会有这两个差距除以 12，不可能有一 点二跟一点四二差距这么大。\n\n---\n\n## 四、板块贰：调整位数\n\n### 4.1 核心思想\n\n> 第二块**调整位数**，这块比较简单。就是我们的资料分析里面**位数是最没有用的一个东西**，真的是最没用的一个东西。资料分析，它不相信位数，**位数没有任何意义**。\n\n> 因为资料分析里面它是选择题，然后它选择题的那个选项设置上，是几乎很少会去涉及一个量级的比较的。\n\n**老师的示范推演（原话）**：\n\n> 比如说 59082 除以 1.1，他就问你，哎，这个是 5 万 1、还是 5 万 4、还是 5 万 7、还是 5 万 6、还是这个 6 万啊？它的**有效数字**是不一样的，你的第二位到底是一还是四还是七？你的第一位到底是几就可以决定到底选哪一个了。所以你这个地方到底是除 1.1、还是除 11、还是除 111，**都无所谓**。你哪怕就直接写一个 59 除以 11。\n> 哎，有人说，你这些 59 除 11，你又把前面的分子变成了 1/100，又把这个分母变成 10 倍，你这个结果不是偏差了 1000 倍吗？**无所谓，位数没有任何意义**，你就直接除 11，上个 5，15 上个 4，三多，五万三千多，那不就选 B 吗？五万四吗？\n\n> ⚠️ **什么时候才需要考虑量级**：\n> 就是这个**选项里面出现的这种有效数字基本上一样**的时候你再考虑。……他就算有这种量级的一个考虑，最后算有个量级的考虑，你算出来之后，你再去估一下。比如刚刚不是算了个五三什么什么开头嘛，你就想它到底是五千四还是五万五，你就根据原来的数据去估一个量级。那五万多除一点一怎么可能是几千呢？是不是肯定是几万？\n\n> 所以位数啊，真的不要担心，随便调你、随便写，你把 5 万 9 写成 59，把 5 万 9 写成 5900 都可以。\n\n---\n\n### 例题 3｜59082÷1.1（有效数字与量级）\n\n**【题干原文】**（画面逐字）\n\n> `59082÷1.1≈（   ）`\n\n**【选项原文（第一版）】**\n\n| 选项 | 数值 | 画面标记 |\n|---|---|---|\n| A | 51000 | 打叉 |\n| B | 54000 | 圈选 |\n| C | 57000 | — |\n| D | 60000 | — |\n\n**【答案】** ✅ B（54000）\n\n**板书（画面）**：\n\n```\n11 ) 59\n     55\n     ---\n      4  → 五万三千多\n\n59082 ÷ 1.1 ≈ 5.4 万 → 选 54000\n```\n\n**【解析】**\n\n- 把 `59082 ÷ 1.1` 里的位数全部丢掉，直接看成 `59 ÷ 11`：上 5 余 4，得到\"五点三几\"，量级按原数读回即\"五万三千多\"。\n- 有效数字 5.3 万 → 最接近 **B.54000**（A.51000 首位是 5.1，C.57000 首位是 5.7，都不匹配）。\n- **陷阱类型**：**量级陷阱**（故意用 5 万 1 / 5 万 4 / 5 万 7 / 6 万 四个不同有效数字来回避量级问题）。\n\n**【选项原文（变体版）】**（画面后续将选项改为）\n\n| 选项 | 数值 |\n|---|---|\n| A | 5400 |\n| B | 5700 |\n| C | 54000 |\n| D | 57000 |\n\n**【答案】** ✅ C（54000）\n\n> ⚠️ 这里要注意：这一版的选项**有效数字开始重复**（5400 与 54000、5700 与 57000），所以就必须**结合量级**判断了。\n\n**老师原话**：\n\n> 那五万多除一点一怎么可能是几千呢？是不是肯定是几万，那只能选 C 五万四嘛，怎么可能是五千四呢？这也太小了吧，我除个十，我都有五千九啊。\n\n---\n\n### 例题 4｜147774×0.4%（位数无所谓）\n\n**【题干原文】**（画面逐字）\n\n> `147774×0.4% = （   ）`\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 59.10 |\n| B | 59.90 |\n| C | 615.46 |\n| D | 685.40 |\n\n**【答案】** ✅ A（59.10）\n\n**板书（画面）**：\n\n```\n14774 × 4 （竖式）\n      14774\n   ×      4\n   ---------\n      59096\n\n→ 59096 即\"59.096\"，约等于 59.1\n→ A\n```\n\n**老师讲解原话**：\n\n> 那好比这个 147774 乘以百分之零点四。我现在要不要把这个百分之零点四去想成它是一个零点零零四？**不需要**，我们就直接 14774 去乘 4，四十、四十六、四十七……直接 A 走人。59096 就是 59.096，那就约等于 59.1 嘛。所以就不要在意这些位数了，**你就只用看它的数字是什么就可以了**。\n\n**【解析】**\n\n- 真实值：`147774 × 0.4% = 591.096`。选项 A 是 59.10、C 是 615.46、D 是 685.40。\n- 这里**只取有效数字**：`14774 × 4 = 59096`，读作\"59.1\"，与 A 的**有效数字完全一致**，直接选 A。\n- **陷阱类型**：**量级陷阱**（如果死抠小数点，591.096 一个选项都没有，会被迫硬算）。\n- 注意：本题的**位数是不重要的**，但选项 A（59.10）与 B（59.90）只有第二位数字不同，属于\"有效数字很接近\"的坑位（详见下一板块例题 5）。\n\n---\n\n## 五、板块叁/肆：误差分析\n\n### 5.1 误差来源：减少位数\n\n> 来第三个**误差分析**。就像刚刚这个计算，有没有觉得好像还是有点烦，我要拿这个什么 14774 去乘这个 4，我的位数问题还是没有解决。你刚刚说了那么多，什么运算顺序、什么调整位数，**没有解决位数多这件事情**，有的时候它的位数就是很多的。那怎么办呢？我们可以去**减少一些位数**。\n\n> 所以（画面先导页原文）**分析误差、理解误差、记得误差，估算才能又快又准**。\n\n**减少位数的演示（原话）**：\n\n> 比如还是刚刚这个题，那我们就直接……我觉得位数多，五位数太多了，有四舍五入，把它想成三位数可不可以？148 三位数不多了吧。148 乘个 4，得 592；跟准确值 59096（59.096）比，是不是也能出来？\n> 所以通过这个情况，我们起码可以知道，在做资料分析的时候，**减少位数他起码是在一定情况下是比较可靠的**，可以帮助我们去节约时间。\n\n---\n\n### 例题 5｜147774×0.4%（选项变近后的修正）\n\n**【题干原文】**（画面逐字，题干与上一题相同，选项收紧）\n\n> `147774×0.4% = （   ）`\n\n**【选项原文（收紧版）】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 59.10 |\n| B | 59.15 |\n| C | 615.46 |\n| D | 685.40 |\n\n**【答案】** ✅ A（59.10）\n\n**板书（画面）**：\n\n```\n= 148 × 4 = 592  →  约 59.2\n\n修正：把 147.74 变成 148，多了 0.26\n      0.26 × 4 ≈ 1\n592 偏高 1  →  准确值 = 59.1\n→ 选 A\n```\n\n**老师讲解原话**：\n\n> 那要是这个题目，它的选项再接近一点，变成这样子，他要是个什么 59.1、59.15，那咋办？那我算了个 59.2 出来，我到底是选 A 还是选 B 呢？\n> 我们刚刚没有面对过这样的问题吗？面对过呀，**你把你前面存在的误差的部分给它补回去不就好了吗**？我们刚刚相当于是把 147.74 变成了 148，那多了 0.26，那 0.26 乘以 4 是不是 1 呀？所以你这个 592 是偏高 1 的，它应该是准确值，应该是 591，所以选 A。\n\n> ⭐ **核心口诀**：\n> **你多算了的，你就去掉；少算了的，就补回来。**\n> 只要我能把我的误差记得它在哪儿——理解了我的误差、记得这个误差，我就算后面算不准、选不到那个选项上去，我把我前面的误差给它调整回来，是不是还是能选？\n\n**板书要点（画面）**：\n\n```\n减少位数\n先粗后细\n```\n\n**【解析】**\n\n- 精确值 `147774 × 0.4% = 591.096`，选项 A 是 59.10，B 是 59.15 —— 二者只差**第二位有效数字**（0 与 5）。\n- 截位估算得 59.2（偏高），**把之前\"五入\"多算的部分（0.26×4≈1）退回去**，即 592 − 1 = 591 → 对应 A。\n- **陷阱类型**：**精度陷阱**（选项第二位有效数字不同，靠\"先粗后细 + 误差修正\"化解）。\n- **为什么值得这么做（老师原话）**：\n\n> 因为它并不是所有的题都是这么麻烦的。你如果就为了那些百分之五甚至占比就百分之一的难题，去不敢估、去不敢快速地简单地估一下一个结果，你会在剩下的百分之九十五到百分之九十九的简单题、中等题里面浪费大量的时间。**所以这个就我们资料分析要先粗后细。**\n> \"粗\"是不是在基本题里面努力提速，\"细\"是为了在难题里面也不会错，而且也不需要返工。\n\n---\n\n### 5.2 加减误差\n\n画面先导页原文：\n\n> **加减误差**\n> 同方向则累积，不同方向则抵消。\n\n> 这个误差其实也是分两种的：一种是**加减型的误差**，这种加减的误差，它主要是一个**量**的影响、量的积累。\n\n---\n\n### 例题 6｜7417+8854（加法：不同方向抵消）\n\n**【题干原文】**（画面逐字）\n\n> `7417+8854 = （   ）`\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 13571 |\n| B | 14374 |\n| C | 16271 |\n| D | 15981 |\n\n**【答案】** ✅ C（16271）\n\n**板书（画面）**：\n\n```\n7417 + 8854 = 7400 + 8900 = 16300\n```\n\n画面手写标注：`7417` 上方标 `17`、`8854` 上方标 `54`（表示一个舍弃、一个进位）；下方另写 `74 + 88`（并被打叉）。\n\n**老师讲解原话**：\n\n> 我可能会怎么做呢？我可能会把它直接想成七千四加上八千九。为什么我写 7400 跟 8900？因为 7417，我如果只想保留两位，我觉得四位数太难算了，我想保留两位，后面的 17 它比较小，我就四舍五入，我给它舍掉；而后面的 8854，后面的 54 又比较大，那我就给它五入上去。**正好我前面少了一点，后面多了一点，这种就是不同方向的误差，抵消掉了。**\n> 就好像类似于我这个 17 借给了这个 8854，让它变得更靠近 8900 了，那这样误差就更小了。这样加起来就能得到 16300，应该跟准确答案 16271 是不是也很快？\n\n> ⭐ **红线：不能同方向一起缩**\n> 有同学说，老师，你写 74 加 88 会不会好一点？**不好，这种就属于犯了原则性的错误。** 这种你可能说有的题会对，但是你如果运算多了、数据太多、加的太多，你一直这样子，你的误差会越加越多，会累积起来，最后如果选项差距不是那么大的时候，你可能就错了。\n> 我不认为这是个好习惯，**这种习惯要改**，你要有这种**控制误差的习惯**。你不能说为了自己想快速地解决这些计算，你就统一的全让他们变小变小变小（或者变大变大变大），然后统一的加，这样子迟早会出问题，**要有这种平衡误差的习惯**。\n\n**【解析】**\n\n- 精确值 `7417 + 8854 = 16271`，估算 16300，误差仅 29（0.18%）。\n- **排除其他选项**：A.13571、B.14374、D.15981 都只是\"一个数变小、另一个数也变小\"的错误做法产物（把 7417→74 也变小、8854→88 也变小）。\n- **陷阱类型**：**同向误差累积陷阱**（估算时两个数朝同一方向四舍五入，误差叠加）。\n\n**同向四舍的补救示范（画面板书）**：\n\n```\n7414 + 8807   （两个数都偏小，无法对冲）\n≈ 7400 + 8800 = 16200\n（记住：真实结果比 16200 稍大一点）\n```\n\n> 比如说它要是个 7414，加了个 8807，实在没办法，你不可能说把它一个变小、一个变大的，把其中某一个变大的太多了也不好。那这时候就把它先估个 7400 加 8800，这没办法，这个太小了，影响比较小，加起来 16200。你最多选的时候，你记得你的结果是比这个 16200 稍微大一点。\n\n---\n\n### 例题 7｜7417+8810+5920+4709+4270（多位数：记总账）\n\n**【题干原文】**（画面逐字，接上题扩展）\n\n> `7417 + 8810 + 5920 + 4709 + 4270 =`\n\n**【答案】** 31126（画面板书末行）\n\n**板书（画面）**：\n\n```\n= 74 + 88 + 59 + 47 + 42.70\n→ 268\n→ + 43\n→ 31100\n→ 31126\n```\n\n画面另标注：`17`、`10`、`20`、`9`（每次舍弃的\"边角料\"），以及 `4270` 上方的 `+43`。\n\n**老师讲解原话**：\n\n> 如果数字比较多，后来再加几个数……这种情况会怎么办呢？**没事，你记账就行**，一般有个账，给他记住了。\n> 我还是当 74 + 88 + 59 + 47 这样加的时候，加起来 268。好，然后最后再加这个 4270 的时候，就我记得前面我是不是省了很多？省了个 17，省了个 10，省了个 20，省了个 9。算了，这些省下来的东西、这些边角料，怎么办？**我全一股脑地丢给你，全丢给最后一个人身上去**，让他变成 4300（即 42.7 + 0.56 ≈ 43），我再加个 43，这样子就会变成 31100。\n> 这五个数加起来，最终结果应该是 **31126**。你看，**我的误差只有 26**。\n> 就是你尽量去控制一个平衡。数多了，你每个都少一点的时候，你去把这些少的东西去给他大概地理在一起，估一个就可以了。\n\n**老师总结（加法误差的规律）**：\n\n> 在**加法**上控制误差，尽量去掌握一个平衡——**你尽量去掌握一个不同方向去抵消的这种平衡，因为你同方向会不断地累积的。**\n> 在**减法**上，就是**同方向的会抵消，不同方向的会累计**。所以减法的时候，你如果让一个数变小了，尽量让另外一个被减的数也一起变小。\n\n---\n\n### 例题 8｜715−523（减法：同方向抵消）\n\n**【题干原文】**（画面逐字）\n\n> `715−523 =`\n\n**【选项原文】**\n\n| 选项 | 数值 |\n|---|---|\n| A | 192 |\n| B | 152 |\n| C | 212 |\n| D | 162 |\n\n**【答案】** ✅ A（192）\n\n**板书（画面）**：\n\n```\n715 − 523 = 700 − 500 = 200\n（15 与 23 标注在旁，两者相差 8）\n→ 200 − 8 = 192\n```\n\n**老师讲解原话**：\n\n> 在减法上，你如果让一个数变小了，尽量让另外一个被减的数也一起变小。比如这个东西，你就可以写成大概就是七百减五百，在 200 附近。一个少了 15，一个少了 23，他们这个方向是一致的，但是没有办法完全抵消，还会差个 8 左右的误差，所以你选这个 192，192 跟 200 是差个 8。\n\n> 从方向来抵消，你在减的时候就要**公平**。如果让一个数变大，那另外一个数尽量也变大。所以如果减的时候，你如果想把它变成两位数减，你可以写成 **720 减 530，这样变成 190**，这也比较准……简单说，你要一个数变大，另外一个数也要跟着变大。不然的话，你一个变大、一个变小，减出来就会变得更大；一个变小、一个变大，减出来就会变得更小。\n\n**【解析】**\n\n- 精确值 `715 − 523 = 192`。\n- 估算 `700 − 500 = 200`，因\"被减数少 15、减数少 23\"，同向但幅度不同，净误差 −8 → 修正为 192。\n- **陷阱类型**：**方向陷阱**（减法中被减数与减数四舍五入方向必须一致，否则误差放大）。\n- 另一条路：`720 − 530 = 190`（两个数都**变大**，方向一致）。\n\n> ⚠️ **减法与加法的方向规则相反**：\n> - 加法/乘法：**同方向累积、反方向抵消**（要让一个变大、另一个变小）\n> - 减法/除法：**同方向抵消、反方向累积**（要让两个一起变大、或者两个一起变小）\n\n---\n\n### 5.3 截位误差\n\n画面板书原文（截位误差页）：\n\n| 截位方式 | 误差范围 | 举例说明（画面原文） |\n|---|---|---|\n| 截为 **2 位** | 一般在 **1% ~ 10% 左右** | 如 1642 截为 1600，减少 42，1642 的 1% 是 16.42，42 大概是 16 的 3 倍不到，所以减少了大概 **3% 不到** |\n| 截为 **3 位** | **0.1% ~ 1% 左右** | 25733 截为 25700，减少 33，25733 的 0.1% 是 25，33 大概是 25 的 1 倍多，所以减少 **0.1% 多一点** |\n\n> **乘除误差（先导页原文）**：在乘除运算中，我们经常会把数据凑整、减少位数、减少计算量。乘除运算中，误差重点看**占比**，看**占原始数据的百分之多少**。\n\n**老师讲解原话**：\n\n> 在加减运算里面，你减少了多少就是多少的误差、增加多少就多少的误差，那是个**量**。但是在资料分析里面加减运算的题目占比并不高，大部分还是**乘除运算**……他不管你要你去算什么增量、算什么增速、算什么平均值，都是乘除运算。\n> 在乘除运算中，你把一个数的位数减少了，它就会对应存在一定的误差。如果你把它减少了，只剩两位，那一般会有一个百分之一到百分之十左右的误差。\n\n> 这个百分之三，我怎么这么快就出来了呢？**我会先去想它的百分之一是多少**，1642 的百分之一是 16（16.42），42 是比 16 的两倍 32 要多的、比它的三倍 48 要少的，所以在它不到 3% 的样子。这个东西你就不用算得很准了。\n\n> ⚠️ **不要过度截位**：\n> 你不可能说这边有个什么 1430，我说我能不能截得只剩一位，截成个 1000，我去减个 430，肯定也没有人想这么做，对吧？一看明显误差就太大了。\n> 所以一般来说，大家的截位都是控制在**两位或者三位**上的……所以既然本身误差就不大，你也不需要把这个不大的误差去描述得特别精确。\n\n> ⭐ **老师的建议**：\n> **我一般建议大家去截三位，我很少截两位，我基本上不会去截两位。** 在做乘除运算的时候，因为我觉得截两位不保险，会有百分之几的误差，而选项里面有的时候选项差距可能也就几个点，你要是算偏了、偏多了，那不就出问题了吗？而且你截位你也不止截一个数，有的那个误差会累积起来的。\n\n**截三位演示（画面板书）**：\n\n```\n1048 ÷ 4167   →  截三位  = 105 ÷ 417\n\n截两位的错误示范：10 ÷ 42 = 23.8%\n（1048 → 1000，少算了 48，约 4 个点；\n  4167 → 4200，多算了 33，约 1 个点；\n  一个变小、一个变大，误差同向累计 → 更不准）\n```\n\n> 比如我这个 1048 变成了 10，相当于变成 1000，减了个 48，少了 4 个点；这个地方变成了 4200，多了 33，又多了一个点。这一来一回、一来一去，就会导致这个结果误差更大，懂了吧？**你把分子变小了，又把分母变大了，不就小了更多了吗？** 所以前两位有的时候可能会有点危险的。一般截三位比较保险，都是这种不到百分之一的误差。\n\n**为什么截三位更稳（老师
