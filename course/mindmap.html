const G = document.getElementById('groups');
const LEG = document.getElementById('legend');
const C = { gray:['var(--c-gray)','var(--cg-bg)'], green:['var(--c-green)','var(--c-green-bg)'],
            purple:['var(--c-purple)','var(--cu-bg)'], red:['var(--c-red)','var(--cr-bg)'],
            amber:['var(--c-amber)','var(--ca-bg)'], blue:['var(--c-blue)','var(--cb-bg)'],

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ptsHTML(arr){
  if(!arr||!arr.length) return '';
  return '<ul class="pts">' + arr.map(x=>'<li>'+x+'</li>').join('') + '</ul>';
}
function exHTML(arr,tag){
  if(!arr||!arr.length) return '';
  const items = arr.map(s=>{
    const p = String(s).split('｜');
    if(p.length>=3) return '<span class="exi"><span class="src">'+p[0].trim()+'</span><span class="ans">'+p[1].trim()+'</span><span class="pt">'+p.slice(2).join('｜').trim()+'</span></span>';
    return '<span class="exi">'+s+'</span>';
  }).join('');
  return '<div class="ex"><span class="exhd">例题</span>'+items+'</div>';
}
function secHTML(s,i,tag){
  const n = String(i+1);
  return '<div class="sec">'+
    '<div class="sech"><span class="n">'+n+'</span>'+s.h+'</div>'+
    (s.q?'<div class="q">'+s.q+'</div>':'')+
    ptsHTML(s.pts)+
    exHTML(s.ex,tag)+
  '</div>';
}

let allHTML='';

  const [fg,bg] = C[g.color]||C.gray;
  const nEx = g.secs.reduce((a,s)=>a+((s.ex&&s.ex.length)||0),0);
  const nPt = g.secs.reduce((a,s)=>a+((s.pts&&s.pts.length)||0),0);
  LEG.insertAdjacentHTML('beforeend','<a href="#'+g.id+'" style="color:'+fg+';background:'+bg+'"><b>'+(gi+1)+'</b> '+g.name+'</a>');

        '<span class="gname">'+g.name+'</span>'+
        '<span class="gtag">'+g.tag+'</span>'+
        '<span class="gcnt">'+g.secs.length+' 节 · '+nPt+' 知识点 · '+nEx+' 例题</span>'+
      '</div>'+

});

const q = document.getElementById('q');
q.addEventListener('input', ()=>{
  const v = q.value.trim();
  document.querySelectorAll('mark').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
  if(!v) return;
  const pat = v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const reT = new RegExp(pat,'i');
  const re = new RegExp(pat,'gi');
  document.querySelectorAll('.ghead, .sec, .glead, .legend a').forEach(el=>{
    if(!reT.test(el.textContent)) return;
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{
      if(!reT.test(n.nodeValue)) return;
      const frag=document.createDocumentFragment();
      let last=0, s=n.nodeValue, m;
      re.lastIndex=0;
      while((m=re.exec(s))){
        frag.appendChild(document.createTextNode(s.slice(last,m.index)));
        const mk=document.createElement('mark'); mk.textContent=m[0]; frag.appendChild(mk);
        last=m.index+m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag,n);
    });
    let g=el.closest('.grp'); if(g) g.classList.remove('closed');
  });
});
