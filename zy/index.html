" | 中性 | 空杯心态：「你没有听过，可能只是你没听过……那就积累就可以了」 |\n| 仰仗 | 需要、凭借 | 同\"全凭你\" | 中性 | 答疑中\"回输仰仗\"＝需要靠回输帮忙 |\n| 随波逐流 | （答疑中出现）形象化表达 | 没有方向、随便飘 | 贬义 | 与\"没有导航\"的形象呼应 |\n\n---\n\n## 八、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 老师原话或提示 | 对应例题 |\n| --- | --- | --- | --- |\n| 1 | **把\"词语区别\"绝对化** | 「我们言语当中很少有绝对的情况，都是讲的一个概率，讲的一个思维方式」「在辨析词语的时候不要走极端，一定要灵活」 | 全讲 |\n| 2 | **拿着小本本直接背别人总结的词** | 「不是说没有用，有用很有用；但你如果**脱离具体的题目，就容易在你的思维中留下固化**」「**你如果忽略了过程，只看结果，你就可能对这个词语的理解有一些绝对化的偏差**」 | 例2 板书后 |\n| 3 | **一见\"居安思危\"就把\"未雨绸缪\"干掉** | 「虽然他们俩有区别（一个想法、一个做法），但他们在某种意义上有相似之处——**都有体现忧患意识的感觉**」「逗号沾边儿就行，它不一定得完全一样」 | 例3 |\n| 4 | **以为顿号引导的并列一定有递进关系** | 「顿号引导的不管是两并列，还是两个顿号引导的三并列，**没有任何规定它有递进关系**，而且据我的经验，**很少考察递进**」 | 例4 |\n| 5 | **忽略\"甚至\"才是真递进** | 「甚至前轻后重，前后意思不能完全一样，它得有递进的感觉」 | 例4 |\n| 6 | **忽略\"横线＋逗号\"的句内呼应** | 「横线加逗号，要根据这句话去选」 | 例2（\"积极拥抱变革\"）、例4 |\n| 7 | **只看第二、三空，忘了回头验证第一空** | 「但是你回头再验证第一空，这个时候如果让你去分析……」 | 例1 |\n| 8 | **忽略横线后的\"出\"字等搭配细节** | 「它跟哪个字要构成一个搭配？你看，有个'出'字」「产生出、创造出可以念通；提供出、设立出是不是没见过？」 | 例2 |\n| 9 | **不看引号就先慌** | 「有很多同学看到引号不会做题了。老师的建议是**先你可以当它没看见**，先正常做；如果这个题从别的角度没法再做出来了，那就要**尽量选更加形象化的表述**」 | 例5 |\n| 10 | **忽略分号提示的并列分层** | 「注意分号……说明这个地方是一个非常明显的并列关系。我在第一个横线的地方，**只想强调'破'**，'立'的地方在后面」 | 例5 |\n| 11 | **被出题人的\"重复选项\"诱导** | 「他宁可让一个选项意思重复，也要把'敬畏'这个词再给你一次，**你就跳**」 | 例6 |\n| 12 | **把\"驱除游戏的什么\"误读成\"游戏具有什么性\"** | 「他不是问你游戏具有什么性，他是问你**驱除了这个游戏的什么，能够让你认识风险**」 | 例6 |\n| 13 | **忘了\"反推\"验证** | 例6 用反推（若填娱乐性，后文该说\"不好玩了\"）；答疑中讲\"无中生有 vs 推断\"也用**反推法** | 例6、答疑 |\n| 14 | **忽略宠词信号** | 一以贯之、应运而生、塑造/重塑、凝聚、诱发……「纠结的时候相信宠词」 | 例7、例9、例10、例11、例12 |\n| 15 | **不辨\"时间/空间\"来路** | 「不是看你搭配谁，而是看**你搭配这个对象是怎么来的**——一天一天来＝积聚；四面八方的＝汇聚」 | 例9、例10 |\n| 16 | **不辨\"引发对象\"的感情色彩** | 「合成谬误是好还是不好？是不是非常的消极？……那就抓感情色彩」 | 例8 |\n| 17 | **忽略\"名不正则言不顺\"的搭配对象** | 渲染→消极；推波助澜→多指坏事物；春风化雨→教育语境；诱发→疾病语境 | 例10、例12 |\n| 18 | **以为意思都差不多的题就只能\"蒙\"** | 「意思都差不多的题，它考的就是**词语使用的规范性**——在大家都 OK 的情况下，我就要选使用的最规范的」 | 例12 |\n| 19 | **对\"没听过的用法\"有排斥心理** | 「但凡遇到这种你之前以为不行的结果、答案可以的，**不要有排斥的心理，一定要有空杯心态**」 | 答疑（稀释功效） |\n| 20 | **把有歧义的词当答案** | 「这种有歧义的词，它作为答案概率也不高」 | 例11（横空出世） |\n| 21 | **纠结太久浪费时间** | 「这种题在考场上其实犹豫来犹豫去，我觉得是很不划算的」「你已经纠结了，就**默认这个题你不太容易做出来了**」 | 例12、（八）开场 |\n\n---\n\n## 九、答疑环节精选\n\n> 老师说：「大家不要着急，我们还是大家听我把这个答疑说完，我觉得有些问题还是非常好的。」\n\n**Q1｜粉笔模考第九季·言语 34 题：为什么是\"传统与现代的交相辉映\"，而不是\"相得益彰\"？你上次不是说交相辉映多形容景色景象吗？（2026/02/06 20:22）**\n\n**题干**：\n> 1. 单选题\n> 从文博热到非遗热，从国风审美到文旅融合，我们看到的不仅是文化产业的繁荣，更是民族精神的 ______。生活的温度；精神的富足，源于文化的滋养。物质文明与精神文明双向奔赴，传统与现代 ______，我们不仅在回望历史，更在塑造未来。\n> 依次填入画横线部分最恰当的一项是：\n> A. 勃发 交相辉映　B. 彰显 水乳交融　C. 振兴 相得益彰　D. 积淀 休戚与共\n\n（答案 A。第一行文字与第二行衔接处、以及\"传统与现代\"前的字被手写批注覆盖，画面显示如上。）\n\n**老师答复**（画面答复框原文）：\n> 「好家伙，不给文段给我，让我一顿好找。首先，**词语都是相对性，所以老师用的是'多用于'**；其次，这个题有**形象化**的感觉：'从文博热到非遗热，从国风审美到文旅融合，我们看到的不仅是文化产业的繁荣''物质文明与精神文明双向奔赴'。文段其实是**把传统和现代具象化了，并非合作之意，而是……**」\n\n> 老师口播补充：「**你看我就是怕出现这种问题，为什么老师不帮大家总结？因为如果你直接拿我给你总结的，你就会把它奉为圭臬。但是我们今天上课又讲到过，我们词语是一定具有某种灵活性的。**」\n>\n> 「大家发现没有，文段中所想表达的传统与现代也好、物质和精神也好，**它本来就有一个拟人化和物化**。他其实想表达的意思是，我们能够从这些文博和非遗当中**看到传统和现代的身影**，他还是在表达这种**观察、这种'看'的感觉**。」\n>\n> 「所以**它不是强调他们两个配合的有多么好，而是我在文博、在非遗中能够看到他们的身影。它的本质还是'看'，而不是强调两者的关系。**——言语你要灵活。」\n>\n> 「休戚与共比较好排，水乳交融比较好排，然后大家纠结 C 和 A 嘛。」\n\n**Q2｜并列中局部和整体的关系：如果局部和整体表达意思不一致，更应侧重整体还是局部？（2026/02/07，星星之火）**\n\n**老师答复**（画面答复框原文）：\n> 「这个问题问的好。其实大多数情况下，整体和部分是**一致**的。因为部分**就是为了论证整体**。当然也可能**出现**一些极个别情况，这个时候可以看看其他空**是否**有更好的线索，导致做错了，这个就**属于可以原谅的错**误，**不要因噎废食**。」\n\n**配的例题（课堂展示原题）**：\n> 许多老大难问题之所以长期无解，重要原因是调查研究流于形式，导致情况吃得不透、病根找得不准。有的是\"盲人摸象\"式调研，眼中只有一个孤立的\"盆景\"，得出的结论往往是 ______；有的是\"刻舟求剑\"式调研，对新情况多凭主观判断下结论，导致出台的政策 ______ 不强。\n> 依次填入画横线部分最恰当的一项是：\n> A. 以偏概全 针对性　B. 老生常谈 科学性　C. 一孔之见 时效性　D. 闭门造车 可行性\n\n（答案 A。）\n\n> 老师讲解：「大家很多同学都能把**闭门造车**和**老生常谈**排掉，因为第一空是'盲人摸象'嘛，'孤立的盆景'嘛，所以**第一空要填片面的意思**，大家当时是不是纠结'**针对性**'和'**实效性**'？」\n>\n> 「这个题如果你只是看到这个地方，你看'面对新情况'，就觉得这个'新'跟'时效'有关系，答案就想选 C。**这个题为什么答案是 A 呢？因为它是在围绕第一句话讲**——'之所以无解，重要是调查研究流于形式，导致情况吃的不透、病根儿找的不准'。所以接下来再举例子：**第一个'有的'在讲吃的不透，第二个'有的'在讲找的不准**，所以对应到'找的不准'，答案就是**针对性不够强**，选 A。」\n>\n> 「但是这个题，像这种题，**我的态度就是你错了就错了**……因为我这个题我也做错了呀。因为你单纯看第二空，'刻舟求剑'也好、'新情况'也好，你确实对应到时效性更好一些。**所以这种题你错了就错了，但是这种题毕竟是少数**——**大家一定不要因噎废食**。绝大部分情况下，局部和整体的关系是保持一致的。」\n>\n> 「这咋解释啊？因为你**针对的是过去的调研，不是新的调研；你针对的是老情况，不是新情况**，这不就解释了吗？比如我去湖北调研，我十年前去过，我今年再去，如果我凭主观判断下决定，那我这个调研针对的就是十年前的湖北，而不是今天的湖北——**这就是针对性不强**。（**就你要能解释也能解释，就有点牵强。**）」\n\n**Q3｜言语题太多、题目又长，做到后面十道题就很烦躁，怎么办？**\n\n> 「第一个你要**锻炼自己的注意力**；第二个你可以把**自己注意力好的时候优先放在长文段当中**。因为我们的题一般就是前面是逻辑填空，后面是其他题型。」\n>\n> 「如果你真的面对长文段很难长时间集中注意力的话，你就**应该把自己状态最好的时候留给长文段**。比如刚刚咱们刚做完常识，那做完常识之后呢，我就先做**后面的十五道题**（因为后面十五道题更长嘛），做完之后我再去做前面十五道**逻辑填空**（因为逻辑填空比较短）。」\n\n**Q4｜画首句、开头背景找主题词，有的时候也错了？**\n\n> 「我反复强调，因为我生怕同学还是理解太狭隘了一些。**我们找主题词，首句引出它只是维度之一**，虽然很多时候它就是这个道理，但是**你不能以偏概全**。而且我说过，找主题词有三个方法：**第一个中心句，第二个高频，第三个首句——以什么为主？以中心句为主。**」\n>\n> 「**找主题词还是以中心句为主，是辅助首句和高频。**你也不能说'老师我学了你的首句，我就把中心句忘了'，那不行。**中心句出现的核心动名词优先考虑。**」\n\n**Q5｜总把\"无中生有\"的选项和\"推断\"的选项弄混，怎么区分？**\n\n> 「第一个你还是去跟那个**细节题一样，你还是得对比**。第二个就是老师教大家方法，就是**反推法**——假设你当它是答案，你**反推一下文段该怎么写**。」\n>\n> 「如果你反推完之后的文段跟文段给我的内容是保持一致的或者差不多的，那大概就（是说）了；那如果反推之后发现文章应该这样写，但是原文没有这样写，那他就没说。」\n>\n> 举例：「比如'这个言语题太多就容易烦躁'，假设它是个答案的话，那我反推那文段就应该写'我到底言语做了多少多少题，确实做了很多之后我很烦躁，很痛苦坚持不下去'，你一看原文，确实是这么说的，那就是对的。**他老师我做了很多题，他说做了一年的题了，我刷了一万道题，但是他没有说烦躁的事情，那就说明无中生有。**」\n\n**Q6｜细节题问\"选非\"，我的想法跟解析不一样，怎么办？**\n\n> 「对这种问**选非**的细节题的时候，有的时候你可以怎么做呢？**你可以找不同**——因为选非说明**有一个不对**，有一个不对，**说明别的三个都对**。」\n>\n> 「那你想想看，那如果其中某一个选项**它最另类**，他跟别的三个的感觉好像完全不太一样，**那么他作为答案的概率是不是特别的高？**」\n>\n> 「你看这个题：B 是要科学有效的**风险控制**，C 说要提高**管理和自保能力**，D 说要注重这个政策和独立，**都非常符合人的一般直觉，说的很好，也很谨慎**——你要控制风险，你要自保，你要注重平衡结果。**结果你 A 来了一个'大力拓展覆盖面'**，就我越多越好——那你这个 A 是不是感觉在这四个当中就**格格不入**？那你作为'选非'的不正确的答案，概率就是最高的。」\n>\n> 「这也是一个思路，**当然不是所有题都这样，但是有时候可能会有意外的惊喜**。」\n\n**Q7｜最后一题（\"稀释功效\"那道）：做错了很不服气**\n\n> 「就像最后那个题一样，**空杯心态**，明白吗？一定要空杯心态。你这个题做错了，你说'老师怎么能选稀释呢？功效被稀释，老师我没听过，我不服气'——**你不要不服气。你没有听过，可能只是你没听过，那可能别人有这样的用法。**」\n>\n> 「**稀释本身就怎么样？除了化学这个方面的点之外，它还有减弱、减轻的意思。所以稀释功效没有问题。**」\n>\n> 「所以这种题它的目的就是告诉你**它可以这样搭**，那就积累就可以了。」\n>\n> 「但凡有一道题你实在不理解，**你就不要看错误选项了，你就把正确选项好好研究透、好好去体会**——为什么呢？因为**你能够做到跟作者的同频共振**，就像我之前拍的那个短视频一样：**你不需要知道别的为什么错，你只需要知道它怎么对就可以了。**」\n>\n> 「仰仗就是需要、凭借的意思，比如'张老师这次言语全仰仗你了'＝'全凭你了'。**但凡你要进行细胞治疗，你就需要靠回输来帮你忙**，就这个意思。」\n>\n> 「第二空随波逐流嘛——导航嘛，它没有导航，那只能哪飘哪了嘛，**像就没有那个方向，那就随便飘了**，就是随波逐流，**这是一个形象化表达**。」\n\n---\n\n## 十、老师金句\n\n> ⭐ **「言语当中很少有绝对的情况，都是讲的一个概率，讲的一个思维方式。」**\n\n> ⭐ **「我们在辨析词语的时候不要走极端，一定要灵活——词语的区别是相对而言的。」**\n\n> ⭐ **「不是说总结没有用，有用、很有用；但你如果脱离了具体的题目，就容易在你的思维中留下固化。」**\n\n> ⭐ **「你如果忽略了过程，只看结果，你就可能对这个词语的理解有一些绝对化的偏差。」**\n\n> ⭐ **「近义并列就是要语义相近，越近越好，重复也没关系。」**\n\n> ⭐ **「有麦当劳，不需要考虑华莱士的。」**（优中选优）\n\n> ⭐ **「逗号沾边儿就行，它不一定得完全一样。」**\n\n> ⭐ **「这个东西就没法讲道理，因为咱们党和政府就用的是'统筹'——这就是所谓吃一堑长一智、空杯心态，你如果之前没听过，你就积累就行了。」**\n\n> ⭐ **「一道题里它们是递进关系，换一道题就变成近义并列关系了——就是这么灵活。想成为一个高手，必须弄明白这个。」**\n\n> ⭐ **「手要由松到紧：一开始条件放宽一点，但凡有一点合理就先保留，先把有明显问题的排掉，然后再慢慢地把要求放严格一点，找到那个最合理的答案。」**\n\n> ⭐ **「逻辑填空题有两个考察方向：第一个意思逻辑的正确性，第二个使用的合理性；当两个都好的时候是最完美的。」**\n\n> ⭐ **「你要弄明白他到底在干嘛——了解，就不神秘嘛。」**\n\n> ⭐ **「当你发现一个题的选项意思不太一样，它大概就考察意思的逻辑正确性；当你发现它的意思都差不多，那它大概就考察你的词语使用的规范性。」**\n\n> ⭐ **「在大家都 OK 的情况下，我就要选使用的最规范的。」**\n\n> ⭐ **「但凡遇到这种你之前以为不行的结果、答案可以的，不要有排斥的心理，一定要有空杯心态。」**\n\n> ⭐ **「你不需要知道别的为什么错，你只需要知道它怎么对就可以了。」**\n\n> ⭐ **「但凡你刷题刷得多，你不用我总结，你自己都知道这个词怎么老做（正确答案）呢？你问这个问题，说明你有点偷懒了。」**\n\n> ⭐ **「不要因为个别的例外去否定基本的思想和原则。」**\n\n> ⭐ **「我是倒数第二节课，明天还有一节课，非常精彩，希望大家不要错过。」**\n\n---\n\n## 十一、下节预告\n\n**PPT 课程预告**（原帧 f_0664／f_0666，画面显示）：\n\n```\n课程预告\n2.9\n19:38\n\n张弓言语\"十二箭\"（十二）\n逻辑填空题\n（九）从出题人角度看选项设置\n```\n\n> 老师原话：「明天最后一节课非常的精彩——**从出题人角度看选项设置**，这就是大家想听的**秒杀技巧**了。但是它也是**建立在一些原理之上**的，所以在讲之前还是让大家明白**底层原理**：为什么有这个所谓的技巧，这个技巧是怎么来的。它当然不是说所有情况都适用，也不是说百分之百对，**但是为什么会有这个概率存在？**」\n>\n> 「因为我觉得在我们临近考试的时候，**讲一讲实战的技巧也是有必要的**——咱们也不能老讲那些本质啊、特别空的东西，**要讲一点大家觉得很爽快的东西**也是很好的。」\n>\n> 「我们今天主要的内容就到这儿了，出了点小意外，但是影响不大……**明天再见，7:38，不见不散。**」\n\n\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"一、开场回顾：逻辑填空的宏观思维","id":"一开场回顾逻辑填空的宏观思维"},{"level":2,"text":"二、（六）理解词语区别的相对性，而非绝对性","id":"二六理解词语区别的相对性而非绝对性"},{"level":3,"text":"例1｜2021 江苏 · 大概率思维应对小概率事件","id":"例12021-江苏-大概率思维应对小概率事件"},{"level":3,"text":"例2｜2021 四川 · 人工智能与就业","id":"例22021-四川-人工智能与就业"},{"level":3,"text":"板书｜忧患意识相关成语（时间轴总结）","id":"板书忧患意识相关成语时间轴总结"},{"level":3,"text":"例3｜2023 山东 · 增强忧患意识（二十大报告节选）","id":"例32023-山东-增强忧患意识二十大报告节选"},{"level":3,"text":"延伸拓展｜词语积累：惊涛骇浪（PPT 原页）","id":"延伸拓展词语积累惊涛骇浪ppt-原页"},{"level":3,"text":"例4｜2021 青海 · 普通话与方言 · 并行不悖与相得益彰","id":"例42021-青海-普通话与方言-并行不悖与相得益彰"},{"level":3,"text":"例5｜2023 国考 · 长江经济带 · 新旧动能转换","id":"例52023-国考-长江经济带-新旧动能转换"},{"level":3,"text":"本节小结：词语的相对性与「由松到紧」","id":"本节小结词语的相对性与由松到紧"},{"level":2,"text":"三、（七）多空题入手的建议（三条原则）","id":"三七多空题入手的建议三条原则"},{"level":3,"text":"例6｜2025 内蒙古 · 生命教育 · 祛除死亡游戏的神秘感","id":"例62025-内蒙古-生命教育-祛除死亡游戏的神秘感"},{"level":3,"text":"例7｜2024 江西 · 关羽由人到神 · 拔擢与众说多歧","id":"例72024-江西-关羽由人到神-拔擢与众说多歧"},{"level":3,"text":"例8｜2025 广东 · 改革深水区 · 挺进与各行其是","id":"例82025-广东-改革深水区-挺进与各行其是"},{"level":2,"text":"四、（八）纠结的时候：相信热词、宠词与常见用法","id":"四八纠结的时候相信热词宠词与常见用法"},{"level":3,"text":"例9｜2024 广西 · 中华民族大一统 · 凝聚与主流","id":"例92024-广西-中华民族大一统-凝聚与主流"},{"level":3,"text":"例10｜2024 黑龙江人民JC · 儿童影视作品 · 春风化雨与塑造","id":"例102024-黑龙江人民jc-儿童影视作品-春风化雨与塑造"},{"level":3,"text":"例11｜2025 国考 · 手枪演变 · 应运而生","id":"例112025-国考-手枪演变-应运而生"},{"level":3,"text":"例12｜2025 新疆 · 糖尿病与认知障碍 · 诱发","id":"例122025-新疆-糖尿病与认知障碍-诱发"},{"level":2,"text":"五、全讲总收束：逻辑填空知识点总结（省流版）","id":"五全讲总收束逻辑填空知识点总结省流版"},{"level":2,"text":"六、本讲方法框架总表","id":"六本讲方法框架总表"},{"level":2,"text":"七、词语 / 成语积累表","id":"七词语-成语积累表"},{"level":2,"text":"八、易错点与陷阱清单","id":"八易错点与陷阱清单"},{"level":2,"text":"九、答疑环节精选","id":"九答疑环节精选"},{"level":2,"text":"十、老师金句","id":"十老师金句"},{"level":2,"text":"十一、下节预告","id":"十一下节预告"}]},{"id":"P13","title":"逻辑填空·出题人角度与选项设置","full":"【言语理解与表达】张弓言语·十二箭 · 第十二讲（合集第 13 集）","lect":"","dur":"113:00","sec":6780,"theme":"","url":"","md":"# 【言语理解与表达】张弓言语·十二箭 · 第十二讲（合集第 13 集）\n\n> **课程名称**：张弓言语·十二箭（适用 26 国考 / 省考 / 多省联考 / 选调生 / 事业单位 / 三支一扶）\n> **讲师**：张弓（上岸村）\n> **本集位置**：合集第 13 集（共 14 P；正课第十二讲 —— **逻辑填空最后一讲 / 压轴课**）\n> **视频地址**：https://www.bilibili.com/video/BV14RzZBuEz3?p=13\n> **时长**：约 113 分钟\n> **本集主题**：**逻辑填空 —— 出题人角度：选项设置**（干扰选项的两大设置原则 + 选项分组思维 + 语义丰富原则 + 全课程总结 + 结课答疑）\n\n---\n\n## 目录\n\n- [本讲知识地图](#本讲知识地图)\n- [一、开场回顾与课程定位](#一开场回顾与课程定位)\n- [二、说在前面：技巧的边界](#二说在前面技巧的边界)\n- [三、出题人视角：干扰选项是怎么设置的（出题三步）](#三出题人视角干扰选项是怎么设置的三步)\n- [四、原则① 文段有对应](#四原则-文段有对应)\n  - [例题 1｜2023 陕西 · 编译工作](#例题-12023-陕西--编译工作)\n  - [例题 2｜2023 内蒙古 · 老字号与营销](#例题-22023-内蒙古--老字号与营销)\n- [五、原则② 选项有共性（外形 / 意义 / 性质）](#五原则-选项有共性)\n- [六、做题的三种境界](#六做题的三种境界)\n- [七、选项分组思维（13 分组 / 211 分组 / 22 分组）](#七选项分组思维)\n- [八、正课例题精讲](#八正课例题精讲)\n  - [例题 3｜2022 四川下 · 老工业景象（13 分组 + 隐藏的相反对比）](#例题-32022-四川下--老工业景象)\n  - [例题 4｜2022 天津 · 马克思主义与理论创新（13 分组 + 211 分组）](#例题-42022-天津--马克思主义与理论创新)\n  - [例题 5｜2025 湖南 · 衰老与精神境界（概率验证 + 词语精确辨析）](#例题-52025-湖南--衰老与精神境界)\n  - [例题 6｜2025 湖南 · 文学与彼此相知（分组思维双保险）](#例题-62025-湖南--文学与彼此相知)\n  - [例题 7｜自编示例 · “彩虹”无人机试飞（211 特殊情况：一正一邪）](#例题-7自编示例--彩虹无人机试飞)\n  - [例题 8｜纪录片《苏东坡》（猪队友进阶：出题人怎么想）](#例题-8纪录片苏东坡)\n  - [例题 9｜2022 四川下 · 恩格尔系数（211 分组 + 猪队友）](#例题-92022-四川下--恩格尔系数)\n  - [例题 10｜2025 国考 · 《营造法式》（211 分组 + 看主语）](#例题-102025-国考--营造法式)\n  - [例题 11｜2022 国考 · 文创产品（猪队友 + 词语精确辨析）](#例题-112022-国考--文创产品)\n  - [例题 12｜2022 青海 · 新能源汽车（22 分组提供思维）](#例题-122022-青海--新能源汽车)\n  - [例题 13｜2023 广东 · 政府与市场（22 分组 + 转折验证）](#例题-132023-广东--政府与市场)\n  - [例题 14｜2024 浙江 · 先秦儒学引诗叙事（22 分组 + 递进前轻后重）](#例题-142024-浙江--先秦儒学引诗叙事)\n  - [例题 15｜2024 陕西 · 双碳目标（语义丰富 + 固定搭配）](#例题-152024-陕西--双碳目标)\n  - [例题 16｜2025 江苏 · 领导细胞（语义丰富 + 主题回归）](#例题-162025-江苏--领导细胞)\n  - [例题 17｜2025 湖南 · 屏南竹木弓箭（语义丰富集大成）](#例题-172025-湖南--屏南竹木弓箭)\n  - [例题 18｜答疑环节 · “死亡游戏”与生命教育](#例题-18答疑环节--死亡游戏与生命教育)\n  - [例题 19｜答疑环节 · 讲好中国故事（事业单位题）](#例题-19答疑环节--讲好中国故事)\n- [九、本讲方法框架总表（含“省流版”总结导图）](#九本讲方法框架总表)\n- [十、词语 / 成语积累表](#十词语--成语积累表)\n- [十一、易错点与陷阱清单](#十一易错点与陷阱清单)\n- [十二、老师金句](#十二老师金句)\n- [十三、结课答疑与考前叮嘱](#十三结课答疑与考前叮嘱)\n- [十四、课程收尾与后续安排](#十四课程收尾与后续安排)\n\n---\n\n## 本讲知识地图\n\n| 板块 | 核心内容 |\n| --- | --- |\n| 出题原理（出题三步） | 找文段 → 挖空 → 设置干扰项。干扰项是挖完空之后才设的，所以它**要么跟正确答案有关联，要么跟文段有关联**，才有最强的迷惑性 |\n| 干扰项两大来源 | ① **文段有对应**（把文段中非对应/非重点的部分放进选项）；② **选项有共性**（外形相似 / 意义相似 / 性质相似） |\n| 做题三境界 | 自己怎么想（80%）→ 作者怎么想（15%）→ 出题人怎么想（约 5%） |\n| 选项分组思维 | 13 分组、211 分组 → 遵循“**优选多数**”原则；22 分组 → **提供做题思路**；211 特殊情况 = “**一正一邪**”，用明显的错误选项（猪队友）暴露正确答案 |\n| 语义丰富原则 | 纠结时优选语义更丰富的选项（字形拆分 / 语义拆分：两个选项的字合起来构成第三个） |\n| 总原则 | **不能代替正常的做题方式**，只在“纠结”时辅助取舍；逻辑填空的根本还是逻辑与词语理解 |\n\n---\n\n## 一、开场回顾与课程定位\n\n> 📌 老师开场：**“我们今天最后一节课讲逻辑填空，依然是逻辑填空——出题人角度：选项设置。”**\n> 📌 “我们讲的是言语的逻辑填空题，**最后一节课也是压轴**的一堂课。”\n\n先用两分钟回顾上一讲（**做题的思维**）：\n\n| 回顾要点 | 内容（老师原话要点） |\n| --- | --- |\n| ① 选项词语的理解 | 要理解区别的**相对性而非绝对性**。言语是非常灵活的一门学科，**有点像中心理解里的“对比择优”**，不能很死板地去记 |\n| 关于“记词” | 老师**不太推崇拿小本本记词**（不管是词典还是某位同学/老师总结的）——当然有用，但**容易把你限制在别人总结的东西当中**，丢失言语的灵活性，这是不太好的。一定要把词放在**具体的题目**中去思考 |\n| ② 做题手法 | 手尽量**由松到紧**，不要一下子就排掉 |\n| ③ 多空入手（三个点） | 第一，选项差异大；第二，文段提示更具体；第三，混搭填空（一般情况下成语排起来会容易一些） |\n| ④ 纠结时 | 既然已经纠结，就没必要再去特别理性地思考——**相信热词、相信常见用法**，相信那些刷题中经常作为答案的选项。**“相信概率，相信统计学。”** |\n| ⑤ 区分词语的角度 | 之前讲过了，不再重复 |\n\n> 📌 课程约定：新同学点点关注；**十二节课的 PPT 和思维导图下课后老师会重新梳理，通过运营群发给大家，不用截图**。\n\n---\n\n## 二、说在前面：技巧的边界\n\nPPT 原文（逐字）：\n\n> 本节课介绍的关于逻辑填空的技巧**具有一定的普遍性，但并非保证 100% 的正确性**。因此大家在平时做题的时候，还是应该按照正常的思路去处理，**“纠结”之时**，可以通过这些思路辅助解题。\n\n> ⭐ 老师强调：这些东西**具有一定的普遍性，没有普遍性我也不会讲，但并非保证百分之百的正确性**。平时该正常做还是正常做，**当你纠结的时候**，可以利用这些思路辅助解题。最重要的是**搞清楚原理**。\n\n> 💡 老师补充：这节课讲的就是“大家最喜欢听的东西”——解题技巧。“你们不就想听技巧吗？是不是老师怎么秒杀？什么邪修？什么坟掘？（“坟掘”这类网络新词，老师表示入行以来、特别是二五年开始学了很多）”\n\n---\n\n## 三、出题人视角：干扰选项是怎么设置的（出题三步）\n\n> 💡 老师自述：接下来这一部分 PPT 是**他之前培训出题老师用的**——培训他们“怎么出模拟题”。所以“你们听的都是真东西”。“你学了之后就会发现，哦，原来这个题是这样出的”，再去做就**有了出题人的思维**。\n\n逻辑填空题和别的题不同：**它有原文**。出题一般分三步（板书）：\n\n```\n第一步 找文段 —— 比如找一些权威的媒体写的文章\n第二步 挖 空 —— 在文中选择一些有价值的词语挖出来，作为我要考察的对象\n第三步 设置干扰项 —— 挖完空之后，这个时候才设置干扰项\n```\n\n> ⭐ **原理（全讲的地基）**：干扰项是**挖完空之后才设置的第三步**，那它某种意义上**一定跟这个选项（正确答案）或者说这个文段有一定的关联性**，只有这样它才具有**最强的迷惑性**。\n> ——“他要么跟正确答案有关联，要么跟文段有关联。”\n\n由此得出逻辑填空干扰选项设置的**两大原则**（PPT 逐字）：\n\n> ③ 认识逻辑填空题干扰选项的设置\n> （1）**文段有对应**\n> （2）**选项有共性**\n\n---\n\n## 四、原则① 文段有对应\n\nPPT 标题：**①文段有对应：和文段非对应部分，对应很合适**（老师红笔批注：**类似非重点**）\n\n含义：出题人把文段当中**某个内容（哪怕不是重点）作为线索放进选项**，让你“看词对号入座”，但那条线索其实**不是横线想表达的意思**——很像中心理解题里的“**非重点**”。\n\n### 例题 1｜2023 陕西 · 编译工作\n\n**【题干原文】**\n> 例（2023 陕西）\n> **编译工作是寂寞的。一盏灯、一杯茶、一支笔、一沓纸、一摞书、一个悠长的夜晚**，这是编译人员在岗位上______的写照。他们**不在意外界的喧哗**，只**坚守内心的宁静**。\n> 填入画横线部分最恰当的一项是：\n\n> ⚠️ 说明：本题 PPT 上**只给出了 A、D 两个选项**（老师用于演示干扰项来源，未展示 B、C）。\n\n**【选项原文】**\n> A. 兢兢业业（形容做事小心谨慎、认真踏实）\n> D. 夜以继日（指日夜不停）\n\n**【答案】** ✅ A\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 找“夜以继日”这个干扰项的来源 | 文段中“一个悠长的**夜晚**”——很多同学看到“悠长的夜晚”就想选“夜以继日” |\n| 2 | 判断这条线索是不是重点 | “夜晚”只是文段的**非重点**内容；横线要表达的不是它 |\n| 3 | 抓真正强调的内容 | 书重要吗？纸重要吗？笔重要吗？茶重要吗？灯重要吗？**都不重要**——重要的是“**寂寞**”：没有人陪、一个人很孤单的样子 → 兢兢业业 |\n\n**【逐项解析】**\n- **A 项**：✅ 与“寂寞”“不在意外界的喧哗、坚守内心的宁静”对应，是编译人员岗位状态的写照。\n- **D 项**：❌ “夜以继日”来自文段“悠长的夜晚”，属于**文段有对应式的干扰**——你确实在文段里找得到对应，但它不是横线想表达的重点（类似中心理解的“非重点”）。\n\n**【本题要点】**\n> ⭐ 这就叫**文段有对应**：把文段当中一个内容作为线索放到选项之中，**但这条线索其实不是重点**。\n> ⭐ 不能看到某个词就去“对”，**要找它真正强调的那个**——有点像**主题词**的感觉；主题才是文章（选项）真正想强调的。\n> ⭐ “老师讲的课是一脉相承的”——为什么一直让大家抓主题？因为**主题才是文段或选项真正想强调的**。\n\n### 例题 2｜2023 内蒙古 · 老字号与营销\n\n**【题干原文】**\n> 例（2023 内蒙古）\n> 笔者近日跟随调研组赴某文化大市采访交流。该市在国内广为人知，非遗资源十分丰富，**老字号**众多，发展文化旅游产业有得天独厚的优势。但因为种种原因，目前当地很多老字号品牌，发展却都不温不火，**知名度虽然有，市场反响却一般**。前往调研的专家，在返程路上无不感慨______是多么重要。\n> 填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 营销（指企业发现或发掘准消费者需求，让消费者了解某产品进而购买该产品的过程）\n> B. 经营（指内在筹划、组织并管理）\n> C. 创新（指抛开旧的，创造新的）\n> D. 宣传（指说明讲解，使大家相信并跟着行动起来）\n\n**【答案】** ✅ A\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 定位“______是多么重要” | 结合四个选项都是动词，可以理解为在提**对策**——又回到中心理解：**对策要跟问题构成对应关系** |\n| 2 | 找问题句 | 问题就是“**市场反响却一般**”（老师反复强调“问题是不是主要这句话”） |\n| 3 | 对策匹配问题 | 要让市场反响好一点 → 加强**营销**；加强经营 / 创新 / 宣传的对应感都没那么好 |\n| 4 | 解释干扰项来源 | “老字号”→ 有人想选“**创新**”（创新可以解决老的问题）；“知名度”→ 有人想选“**宣传**” |\n\n**【逐项解析】**\n- **A 项**：✅ 问题出在“市场反响一般”，让市场反响变好的手段就是营销。\n- **B 项**：❌ “经营”与问题的对应不如“营销”直接。\n- **C 项**：❌ 来自文段“老字号”——但文段的问题**不是**“因为老字号”（“有些老字号挺好的呀”）。\n- **D 项**：❌ 来自文段“知名度”——转折之后说得很清楚“知名度**虽然**有”，问题**没出在知名度上**，根本还在市场反响。**转折之后这句话说得非常好，这就串起来了**。\n\n**【本题要点】**\n> ⭐ C、D 之所以出现在选项里，就是**文段有对应**：文段中虽然出现了那些词，但它们**不是真正的对应点**。\n> ⭐ 这就和上上节课的内容结合起来了——**为什么要有整体观念、要抓文段主题**？因为抓住横线真正想强调的内容，你才不会走偏。不能随便拎出一个词说“我觉得有线索”，那样道理不够充分。\n\n> 💡 老师回扣上一讲的同款题：**“驱除神秘感、驱除游戏性”**那道题——为什么那么多同学想选“娱乐”？**不就是因为有“游戏”吗？**“假设他不给‘游戏’这两个字，你会选娱乐吗？**你绝对不会考虑。**”文段真正想说的是“让你更多地了解和知晓”，是让你**知道**的意思，不是说游戏怎么样——**用不是文段真正重要的内容来干扰你**。\n\n---\n\n## 五、原则② 选项有共性\n\nPPT：**②选项有共性**。老师强调：**绝大部分题目在这一块非常下功夫，特别是联考题**。出题人根据正确答案去设置干扰项，有三种“相似”：\n\n### （1）外形相似（实词、成语）\n\n> 板书示例 1：答案“**一蹴而就**”→ 就出“**一**以贯之、**一**鸣惊人、**一**劳永逸”——都给一个“一”字。\n> 板书示例 2：答案“**无孔不入**”→ 就出“**无**所不在、**无**远弗届…”——**多给你一个“无”**，再给你一个“不”。\n\nPPT 上配套展示的模拟题片段（演示“同字外形”）：\n- **26 题（史料题）**：选项含“**一**劳永逸 / **一**鸣惊人 / **一**以贯之 / **一**蹴而就”。\n- **37 题（养老推销题）**：选项含“**无**孔不入”类的“无”字打头成语（老师现场圈“无所不在”等）。\n\n> ⭐ 老师自嘲：“我这个人处女座，就喜欢这样搞。”“大家模考做得多的同学有没有这种感觉？**四个选项长得都很像**”——那是出题人刻意为之，目的就是**让辨析难度变大**。\n\n### （2）意义相似（实词、成语）\n\n> 板书示例 1：答案“**曝光**”→ 出“**暴露、败露**”——都是“被人发现、显现出来”的感觉。\n> PPT 23 题（**医疗美容市场乱象**）选项：A. **暴露** 升级 / B. **败露** 改变 / C. **曝光** 净化 / D. 产生 效赎〈画面显示为“效赎”，字迹不清〉。\n> 板书示例 2：答案“**明知故犯**”→ 出“**知法犯法、以身试法**”——意思差不多：“知道了，我还要干”。\n> PPT 27 题（**柔性执法 / 交通违法行为**）选项：第一空为“无视 / 纵容 / 怜悯 / 苛责”类，第二空成语可见“**明知故犯、以身试法、知法犯法**”。\n\n### （3）性质相似（实词、成语）\n\n> 板书示例 1：答案“**绅士**”→ 出“**演员**”（老师自嘲：出完“绅士”再出“演员”，别人以为他是薛之谦粉丝）、“**儒生、秀才**”——都是“**某种类型的人**”这一性质。\n> PPT 39 题（**新时代的奋斗者**）选项印证：A. 演员 预感 置若罔闻 / B. 儒生 乖觉 临阵脱逃 / C. 秀才 灵活 轻描淡写 / D. **绅士** 敏锐 闭目塞听。\n> 板书示例 2：文段有“______的**脚力**，沉入一线、走深走实”→ 干扰项出“**踏破铁鞋、踏石留印、如履薄冰、步步为营**”——“你很有可能根据‘脚’‘走’选到其中任何一个”，这就是**某种性质上的相似**。\n\n> ⭐ **出题原理总结**：干扰项是**根据正确答案出的**，所以干扰项和答案之间往往有某种相似性（外形 / 意义 / 性质）。**“没有无缘无故的词。”**\n\n---\n\n## 六、做题的三种境界\n\n老师板书（仿王国维《人间词话》的三种境界）：\n\n```\n① 自己怎么想     80%   的同学停留在这一层\n② 作者怎么想     15%   的同学能够到达这一层\n③ 出题人怎么想   约5%  的同学能够达到这一层（不到 5%）\n```\n\n> ⭐ **“我不要你觉得，我要作者觉得，我要出题人觉得。”**\n> 题目不是要跟你辩论——你要知道（出题人或）作者想表达什么意思，**自己的想法没有那么重要**。做题时一定不要太把自己的想法当回事，一定要**尊重作者、尊重出题人**。\n> ⭐ 再看看你那个岗位的上岸比例，你就知道该在哪一层做题了。\n\n---\n\n## 七、选项分组思维\n\nPPT 板书（逐字）：\n\n```\n②选项分组思维：\n   13分组、211分组 —— 较多遵循优选多数原则\n   22分组 —— 可能提供做题思路\n```\n\nPPT 右侧三栏选项（逐字）：\n\n| 13 分组 | 211 分组 | 22 分组 |\n| --- | --- | --- |\n| A. 见义勇为 | A. 大同小异 | A. 肤浅 |\n| B. 宁死不屈 | B. 相去甚远 | B. 模糊 |\n| C. 英勇无畏 | C. 千姿百态 | C. 混乱 |\n| D. 宁折不弯 | D. 大相径庭 | D. 狭隘 |\n\n> 💡 **类比排序题**：假设 A 首句是①，B、C、D 首句都是③——那 A 作为答案的概率高不高？**不高**。逻辑填空同理。\n\n| 分组类型 | 解析 | 原理与用法 |\n| --- | --- | --- |\n| **13 分组**（1+3） | “宁死不屈、英勇无畏、宁折不弯”给人的感觉**非常重**；而“见义勇为”就显得**轻飘飘** | **单独的、格格不入的选项作为答案的概率一定低**——因为很多干扰项是**根据正确答案一起出的**，干扰项和答案之间有相似性 |\n| **211 分组**（2+1+1） | “相去甚远、大相径庭”都强调**差别很大**；A“大同小异”是差别很小；C“千姿百态”是**多样化** | 答案在**较多的那一组（B/D）**概率更大 |\n| **22 分组**（2+2） | 一组强调“肤浅、狭隘”（没什么学识、很浅显）；一组强调“模糊、混乱”（不清晰、很乱） | **不是帮你选答案，而是提供做题思路**——到底文段强调哪个方向？选项暗示了你的思考方向 |\n| **111 分组** | 如“营销”那道题 | 出题人**没有在选项上做文章**，让你去看**文段的线索**；而且选项差别大反而更好辨析，**是好事** |\n\n> ⭐ **优选多数原则**：当你纠结的时候，答案出现在“**较多的那个组**”当中的概率会更高。\n> 💡 学生追问“如果是一一一呢？”——老师：“谁能举一反三？**111 说明出题人没在选项上做文章，而是让你去看文段的线索**，就跟营销那个题一样。”\n> ⭐ 补充：**选项差别越大，对大家来讲反而是好事**，因为更好辨析。\n\n---\n\n## 八、正课例题精讲\n\n> 📌 本节课的模式：**先做，再讲方法技巧**。以下例题按授课顺序连续编号（承接前文例题 1、2）；括号内标注 PPT 上的原始编号。\n\n### 例题 3｜2022 四川下 · 老工业景象\n\n（PPT 例 1 · 13 分组 + 隐藏的相反对比）\n\n**【题干原文】**\n> 例 1（2022 四川下）\n> **过去**高耸的烟囱**满是灰尘**，**昔日**热闹的厂房______，**以往**忙碌的铁轨**锈迹斑斑**……在不少地方都有类似的景象，它们见证了时代发展的______，**但随着产业升级和城市化进程推进，逐渐沉寂**。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 人迹罕至（很少有人到过的地方） 事过境迁（事情已经过去，事情发生的环境也改变了）\n> B. 杳无人烟（僻远无人居住） 标新立异（提出新的主张或见解）\n> C. 人去楼空（人已离去，楼中空空） 日新月异（发展或进步迅速，不断出现新事物、新气象）\n> D. 颓垣败壁（荒凉破败的景象） 沧桑巨变（巨大的变化）\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空找对应 | “过去高耸——现在满是灰尘”“昔日热闹——现在____”“以往忙碌——现在锈迹斑斑”：**隐藏的相反对比之感** |\n| 2 | 定第一空词义 | 要与“热闹”相反 → 冷冷清清：“人去楼空”“颓垣败壁”都可以 |\n| 3 | 排 A、B | 文段强调“**本来有、现在没**”；而“人迹罕至、杳无人烟”是**可能一直都没有**——一个是天生的，一个是后来的 → A、B 排掉 |\n| 4 | 第二空看转折 | “**但**随着产业升级……逐渐**沉寂**”——转折前后**相反**；转折后是“不好”，所以转折前应偏**积极** |\n| 5 | 两词都有“变”的意思，谁更积极 | “日新月异”最积极 → 选 C。“沧桑巨变／沧海桑田”是**中性词**（对比“事过境迁”） |\n\n**【逐项解析】**\n- **A 项**：❌ “人迹罕至”＝可能一直没人，不符合“昔日热闹→如今冷清”的变化。\n- **B 项**：❌ “杳无人烟”同上；“标新立异”也无积极发展之意。\n- **C 项**：✅ “人去楼空”对应“热闹→冷清”；“日新月异”＝发展进步迅速、不断出现新事物新气象，最积极，与“逐渐沉寂”构成转折。\n- **D 项**：❌ “沧桑巨变／沧海桑田”是**中性词**，可以由好变坏、也可以由坏变好——它只是**变化大**，不是**变好**。\n\n**【本题要点】**\n> ⭐ “**沧桑巨变、沧海桑田是变化大，而不是好。**”\n> ⭐ 第二空其实也符合 **211**：“标新立异、日新月异”是一组（都带“新”）。\n> ⭐ 用出题人视角再验一次：“你以为这个‘标新立异’是怎么来的？你以为这个‘杳无人烟’是怎么来的？你以为这个‘人迹罕至’的‘人’是怎么来的？**如果答案是‘颓垣败壁’的话，出题人会出一些跟建筑物相关的成语放在这儿**（大概率不会这样出）。”——因为 A、B 是照着 C 出的，这就是 3 比 1。\n\n### 例题 4｜2022 天津 · 马克思主义与理论创新\n\n（PPT 例 2 · 难度较大 · 13 分组 + 211 分组）\n\n**【题干原文】**\n> 例 2（2022 天津）\n> 马克思主义能不能**在实践中发挥作用**，关键在于能否把马克思主义基本原理同中国实际和时代特征结合起来。面对快速变化的世界和中国，如果______、**思想僵化**，**没有理论创新的勇气**，不能科学回答中国之问、世界之问、人民之问、时代之问，**不仅**党和国家事业无法继续前进，马克思主义**也会**失去______、说服力。\n> 依次填入画横线部分最恰当的一项是：\n\n（PPT 底注，老师强调“绝大部分同学根本想不到”）：\n> 注：对于中国，我们经常用到的一个词就是“**历久弥新**”，其实就是**生命力**的体现，用理论创新诠释，更是生命力体现。\n\n**【选项原文】**\n> A. 纸上谈兵（比喻不联系实际情况，空发议论） 发展力（指促使事物不断进步更新的力量）\n> B. 固步自封（比喻安于现状，不求进步） 凝聚力（指使个人或事物聚集到一起的力量）\n> C. 墨守成规（指因循守旧，不肯改进） 生命力（指事物具有的生存、发展的能力）\n> D. 临渴掘井（比喻平时没有准备，事到临头才想办法） 持久力（指维持长久的力量）\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空找并列 | “______、思想僵化”——**顿号提示并列**；“思想僵化”＝没有进步、停留在原地 → 墨守成规、固步自封 |\n| 2 | 排 A、D | “纸上谈兵”是不联系实际、不做事；“临渴掘井”**反而说明你这个人是会想办法去做改变的** → D 排除，保留 B、C |\n| 3 | 第二空的正确理解法 | 不是要跟“说服力”构成并列，而是**带上“失去”两个字去理解**：“失去______力”约等于“失去说服力” |\n| 4 | 思维一：找另一处并列 | “**不仅**……**也**……”——真正想表达的是“**无法前进**”：没有生命力＝生命走到尽头 |\n| 5 | 思维二：抓文段主题（中心理解化） | 文段中心＝“关键在于能否同中国实际和时代特征结合起来”“没有**理论创新**的勇气” → 强调**常学常新**；一个东西**失去了创新**＝停止了生长＝失去**生命力** |\n| 6 | 211 分组验证 | 发展力、生命力、持久力都能体现“继续前进”，唯独**凝聚力**格格不入 |\n\n**【逐项解析】**\n- **A 项**：❌ “纸上谈兵”＝不联系实际、空谈，与“思想僵化”不构成并列；第一空已被并列锁定为“不进步”义。\n- **B 项**：❌ “固步自封”第一空可保留，但“凝聚力”与“无法前进”“理论创新”都无关；单看第二空两词似乎都说得通（“说服不了别人就不能凝聚人心”也有道理），必须靠“不仅……也……”和主题来定。\n- **C 项**：✅ “墨守成规”与“思想僵化”并列；“失去生命力”对应“无法前进”与“没有理论创新”。\n- **D 项**：❌ “临渴掘井”＝平时没准备、事到临头才想办法，反而说明“会去改变”，与文段意相反。\n\n**【本题要点】**\n> ⭐ 做逻辑填空时，**要在理解横线时把前后的关键词一起带上**（如“失去”＋“说服力”），而不是机械地找并列。\n> ⭐ PPT 底注那个点——“我们经常会用一个词叫‘**历久弥新**’，它表明我们的理论具有**鲜活的生命力**，虽然历经百年仍可以常学常新，**这跟凝聚力一点关系都没有**。”\n> ⭐ 纠结时用 211：四个词（发展力、生命力、持久力、凝聚力）哪个格格不入？——**凝聚力**（发展／生命／持久都含“继续向前”之意）。\n\n### 例题 5｜2025 湖南 · 衰老与精神境界\n\n（PPT 例 3 · 概率验证 + 词语精确辨析）\n\n**【题干原文】**\n> 例 3（2025 湖南）\n> **衰老**伴随着一系列生理功能的丧失和疾病的痛苦，但是**从精神层面**而言，**老年人更能理解人生的真谛**，如果**修炼得好**，能够做到**心静如水**，______，**超然于生活中的各种失意与失落**，对世事______，**这样的境界是一般年轻人无法抵达的**。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 乐天知命（认为自己的一切都由命运支配，安于自己的处境，没有忧虑） 洞幽烛微（形容目光敏锐，能透彻看到事物细微之处）\n> B. 荣辱不惊 洞若观火（形容看得清楚明白）\n> C. 宠辱若惊 举重若轻（比喻能力强，能够轻松地胜任繁重的工作或处理困难的问题）\n> D. 宠辱偕忘 明哲保身（因怕犯错误或有损自己利益而对原则性问题不置可否的处世态度）\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 出题人概率视角（第一反应） | 三个“宠辱”＋两个“洞（幽烛微 / 若观火）”→“那大概不选 A”“那大概不选 C、D”，**纠结的话大概选 B** |\n| 2 | 第一空正推 | “超然于**失意与失落**”＝**心静如水**——“既没有太开心，也没有太伤心” → 好（宠）坏（辱）都不“惊”；“**若惊**”与文段相反；“乐天知命”**还有“乐”，还在乐呢**；要的是“不以物喜、不以己悲”，**啥也没有** |\n| 3 | 第二空正推 | “对世事______，这样的境界一般人无法抵达”——精神层面强调**好**：对世事的了解**非常透彻** → 洞若观火；“明哲保身”**境界太低级** |\n\n**【逐项解析】**\n- **A 项**：❌ “乐天知命”还是“乐”，与“心静如水、超然失意失落”不符（第一空排掉）。\n- **B 项**：✅ “荣辱不惊”对应“宠也好辱也好都不惊”；“洞若观火”对应“对世事了解透彻”。\n- **C 项**：❌ “宠辱**若惊**”与文段“超然、不惊”正好相反。\n- **D 项**：❌ “明哲保身”境界太低，不是“一般人无法抵达”的精神境界。\n\n**【本题要点】**\n> ⭐ 老师引庄子（非常推崇的观点）：**“知其不可奈何而安之若命”**——所以是“不惊”。\n> ⭐ 老师举例：“你们以后上岸了，收到通知那一天——哦，上岸了，这叫**宠辱不惊**；你如果没上岸，说‘没上岸’，这也叫**宠辱不惊**。他不是乐天（那是你很开心），也不是若惊（那正好相反）。”\n> ⭐ **不是所有题四个选项都一样——碰到这种“三个宠辱、两个洞”的题你应该开心**：“那大概就是 B 嘛，交叉一下嘛。”“你干嘛老是为难自己呢？那有什么用什么嘛。”\n\n### 例题 6｜2025 湖南 · 文学与彼此相知\n\n（PPT 例 4 · 分组思维双保险）\n\n**【题干原文】**\n> 例 4（2025 湖南）\n> 不同国家和民族之间的对话，很大一部分是建立在**世界意识**的基础之上。世界之大，个人只能涉足有限的处所；作为一种**彼此相知**的语汇，**文学**可以帮助**不同民族**的人们______，乃至**共同参与世界**。所以，世界范围______的**文学经典**展示了“人类”的存在。“人类”生活在地球的各个角落，然而，他们是相互联系的共同体——不论他们自己能否意识到这一点。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 心中有数（指对情况和问题有基本的了解，处理事情有一定把握） 形形色色（形容事物种类繁多，各式各样）\n> B. 心心相印（指彼此的心意不用说出，就可以互相了解） 跃然纸上（活跃地显现在纸上。形容刻画……）\n> C. 心领神会（指对方没有明说，心里已经领会） 林林总总（形容人或事物……）\n> D. 融会贯通（各方面的知识道理融合贯穿起来，得到系统透彻的理解） 多姿多彩（指形状和色彩多种多样，十分丰富）\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 方法一：分组猜 | 第一空：**AD＝“我自己懂了”**（心中有数／融会贯通），**BC＝“我懂你”**（心心相印／心领神会）。文段关键词“**彼此相知**”＝我懂你 → BC 概率更高 |\n| 2 | 第二空分组猜 | 形形色色、林林总总、多姿多彩**都是“多”**；“**跃然纸上**”孤零零一个、怪怪的 → 排 B → 锁定 C |\n| 3 | 方法二：正常做 | 第一空要表达“**相知、有共性**” → 不是“心中有数”，也不是“融会贯通”（它俩重点都是“**懂了**”）；第二空“跃然纸上”形容**具体的人物或写作对象**生动逼真（如“曹操这个人物跃然纸上”），**不能形容“文学经典”这种书** → 排 B，答案 C |\n| 4 | 大数据验证 | 若仍纠结，看第二空：“跃然纸上”就是那个**单独的一个**——**你敢不敢选？**（类比排序题里“单独的首句”） |\n\n**【逐项解析】**\n- **A 项**：❌ “心中有数”强调“我自己懂了、有把握”，不是“彼此相知”。\n- **B 项**：❌ “跃然纸上”形容描写生动逼真，对象是具体人物／写作对象，不能搭配“世界范围的文学经典”。\n- **C 项**：✅ “心领神会”＝我懂你，对应“彼此相知”；“林林总总”对应“世界范围……的文学经典”之多。\n- **D 项**：❌ “融会贯通”也是“我自己懂了”，与“帮助不同民族的人们有共同语言”不符。\n\n**【本题要点】**\n> ⭐ **AD 是“我自己懂了”，BC 是“我懂你”**；文段说“**彼此相知**”——就是“**我懂你**”。\n> ⭐ “跃然纸上”不能形容“文学经典”（书），它形容的是**具体写作对象**的生动逼真：“我看三国演义，曹操这个人物跃然纸上——你不能说《红楼梦》这本书跃然纸上吧？”\n> ⭐ 两种方法都行：**要么正常做（第一空排 AD，第二空排 B，答案 C），要么用分组思维猜（AC 概率更高，再看第二空，锁定 C）**。\n\n---\n\n### 211 分组的特殊情况：一正一邪\n\nPPT 新页标题（逐字）：\n\n> ②选项分组思维：\n> **211分组的特殊情况：一正一邪，利用明显的错误选项找到正确答案**\n\n> ⭐ 原理：四个选项当中有两个选项**长得很像**，答案出在这个“2”里面会多一些。这个时候又有**特殊情况**：这两个有共性的选项里，**其中一个又有明显的错误**（你一眼就能看出它不行）。\n> 那么它就相当于一个“**猪队友**”，**把自己的答案（搭档）给暴露出来了**。\n> 💡 类比：“就相当于有个猪队友，把他的队友给暴露出来了。”\n\n### 例题 7｜自编示例 · “彩虹”无人机试飞\n\n（老师用于讲“一正一邪”的第一个例子，明确说“这两个例子我不讲，因为讲起来浪费时间，我直接说原理”）\n\n**【题干原文】**\n> 例：远眺试飞机场，天地混为一体，这就是“彩虹”无人机______的起点，更是放飞梦想的舞台。每一名科研人员，都会在试飞成功后，站在这里静静凝视，让热情______平静，平静的背后是一份更高的期许。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 高飞 荣归\n> B. 遨游 回复\n> C. 腾空 恢复\n> D. 翱翔 回归\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 找“你绝对不会纠结”的词 | 第二空不管你纠结哪个，**你绝对不会纠结“荣归”**——因为我们都是“荣归**故里**”，“荣归”放这儿莫名其妙 |\n| 2 | 反问出题人 | “荣归”是怎么来的呢？怎么莫名其妙有个“荣归”？**没有无缘无故的词**——它**大概率跟正确答案具有某种关联性** |\n| 3 | 顺藤摸瓜 | 与“荣归”关联的正是 D 项的“**回归**” → 答案选 D |\n\n**【逐项解析】**\n- **A 项**：❌ “荣归”是明显的“猪队友”，暴露了自己的搭档——它正是照着正确答案“回归”编出来的。\n- **B 项**：❌ “回复”与“让热情______平静”不搭。\n- **C 项**：❌ “恢复”搭配“平静”不如“回归”贴合语境。\n- **D 项**：✅ “翱翔的起点”“让热情回归平静”语义通顺。\n\n**【本题要点】**\n> ⭐ 这就是 **211 分组的特殊情况——“一正一邪”**：两个长得很像的选项里，那个“邪”的（明显有错的干扰项）**相当于猪队友，把自己的答案（搭档）暴露出来了**。\n> ⭐ “**没有无缘无故的词**”——否则很难解释这个“荣归”。\n\n### 例题 8｜纪录片《苏东坡》\n\n（“猪队友”进阶：从“文段有对应”走到“出题人怎么想”）\n\n**【题干原文】**\n> 例：纪录片《苏东坡》以苏东坡贬谪黄州四年的生活为横切面，______其一生的心路历程，从文学、艺术、美食、情感等维度进行透视，多角度地______其生命感悟、精神嬗变和艺术升华的过程，以及对中华传统文化产生的深远影响。同时，辅之以当今最新的研究成果，再现了一个最丰富、最接近本真的苏东坡形象。\n> 依次填入划横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 关照 阐释\n> B. 记载 解说\n> C. 记录 阐述\n> D. 观照 解读\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 正常做的纠结点 | 很多同学因为“**纪录片**”三个字纠结“记录／记载”——**这正是“文段有对应”式的干扰** |\n| 2 | 找莫名其妙、绝对不能选的词 | 第一空你再怎么选也**不能选“关照”**——“你关心照料苏东坡的一生吗？不可能的呀”，这个词特别奇怪 |\n| 3 | 出题人思维（关键推演） | 假设原文是“记录”，你作为出题人**凭什么联想到“关照”**？想不到。只有原文是“**观照**”时，才会根据它出“关照”（外形＋意义都接近） |\n| 4 | 用“有无依据”验证 | “记录、记载”是根据文段“纪录片”出的（**文段里有依据**）；“关照”在文段里**没有**依据——那它只能是从正确答案“观照”来的 |\n| 5 | 锁定答案 | 与“观照”同组的“**解读**” → 选 D |\n\n**【逐项解析】**\n- **A 项**：❌ “关照”（关心照料）与“心路历程”不搭——它是“猪队友”，暴露了正确答案“观照”。\n- **B 项**：❌ “记载”来自“纪录片”的对应式干扰。\n- **C 项**：❌ “记录”同样是“纪录片”的对应式干扰。\n- **D 项**：✅ “观照其一生的心路历程”“解读其生命感悟”，最贴近纪录片的艺术视角。\n\n**【本题要点】**\n> ⭐ 这道题是“**文段有对应**（记录／记载 ← 纪录片）＋**选项有共性**（关照 ← 观照）”两个原理的**淋漓尽致的体现**。\n> ⭐ 老师强调前提：“**这不是说所有题都这样**。我说的前提是——万一你遇到了，而且你又纠结的时候，你的天平可以稍稍往那边移一点。”\n\n### 例题 9｜2022 四川下 · 恩格尔系数\n\n（PPT 例 5 · 211 分组 + 猪队友）\n\n**【题干原文】**\n> 例 5（2022 四川下）\n> 回顾我国 GGKF40 多年的历程，有很多______的成就，其中之一就是**恩格尔系数稳步下降**。这与我国经济**从高速发展迈向高质量发展**相______，不仅侧面佐证了中国经济社会的**发展进步**，更是民众告别求温饱阶段、走向更加富裕生活的生动注解。\n> 依次填入画横线部分最恰当的一项是：\n\n> ⚠️ 说明：PPT 上“GGKF”为画面原样显示（即“改革开放”的缩写）。\n\n**【选项原文】**\n> A. 可歌可泣（悲壮的事迹使人非常感动） 呼应\n> B. 彪炳史册（伟大的业绩流传千秋万代） 般配（多指……）\n> C. 来之不易（财物的取得或事情的成功是不容易的） 辉映（照耀、映射）\n> D. 可圈可点（形容表现好，值得肯定或赞扬） 匹配（配合、符合）\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空正常排 | “可歌可泣”可以搭配成就，但恩格尔系数**稳步下降谈不上可歌可泣**——“一般我们什么时候会感叹一句可歌可泣？**悲壮**，比如抗日战争” → A 排掉，保留 B、C、D |\n| 2 | 第二空辨析 | “般配”一般**形容人**；辉映让我们想起“交相辉映”，**多形容景色**（“这个成就和发展相辉映还是有点少见”）；“匹配”最合适，但与 C 仍可能纠结 |\n| 3 | 猪队友定答案 | 纠结时换思维：为什么会有个“可歌可泣”？它一点也不可歌可泣——**大概率是照着“可圈可点”出的** → 答案是与“可圈可点”同组的“**匹配**” |\n| 4 | 验证 | 一看答案，果然选 D |\n\n**【逐项解析】**\n- **A 项**：❌ “可歌可泣”程度过重、侧重点不符（恩格尔系数下降并不“悲壮感人”）。\n- **B 项**：❌ “般配”多形容人（婚配、身份相称），与“经济迈向高质量发展相____”不搭。\n- **C 项**：❌ “辉映”多形容景色（交相辉映）。\n- **D 项**：✅ “可圈可点”程度恰当；“与高质量发展相匹配”搭配自然。\n\n**【本题要点】**\n> ⭐ **考场思维**：当你在“辉映／匹配”之间纠结时，换一个角度——**D 这个空作为答案的概率大不大？**“有一个莫名其妙的‘可歌可泣’，D 的概率就比 C 大。”\n> ⭐ 核心动作：**充分利用选项信息**。\n\n### 例题 10｜2025 国考 · 《营造法式》\n\n（PPT 例 6 · 211 分组 + 看横线主语）\n\n**【题干原文】**\n> 例 6（2025 国考）\n> 《营造法式》刊行之后，两浙一带的建筑技术借助官方的推广完全融入了中国古典木构建筑技术的**主流**。以抬梁式为梁柱结构，屋面重量通过椽、檩、梁、斗栱、柱传递至基础的方案，形成此后**中国官式建筑**______的发展路径。这种结构开间大，立柱少，气势恢宏，可细分为殿堂式与厅堂式，满足不同礼制等级的需要。\n> 填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 源远流长（比喻历史悠久，根底深厚）\n> B. 标新立异（创新或提出新奇的主张，也指为了显示自己而故意另搞一套）\n> C. 一枝独秀（在同类人或同类事物中出类拔萃）\n> D. 一以贯之（用一种思想理论贯穿于始终）\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 定横线主体 | 横线的主体是“**中国官式建筑**”——它成为主流之后**一直沿用**下去 |\n| 2 | 排 A、B | “源远流长”强调**历史长**；“标新立异”强调**创新**——而文段强调的是“成为主流之后**不变**、一直用下去”，与时间长短、创新都无关 |\n| 3 | 排 C（看用法／主语） | “一枝独秀”需要**同类对比对象**——“中国官式建筑”没有对比对象；若选它，主体应该是“**这个技术本身／结构本身**”（如“木构结构在众多技术中一枝独秀”） |\n| 4 | 锁定 D | 既然是主流，此后就一直沿用——“一以贯之”；呼应例题 2 里“一以贯之”同出题人出的题 |\n| 5 | 也可先 CD 后辨析 | 觉得 A、B 难分析时，直接看 C/D（作为答案概率更大），再判断到底强调“它很厉害”还是“一直沿用下去” |\n\n**【逐项解析】**\n- **A 项**：❌ 强调“历史悠久”；选它得告诉我“多少多少年上下”，文段说的是“此后”的发展路径不变。\n- **B 项**：❌ 强调“创新”，而文段说的是一直围绕这个技术发展。\n- **C 项**：❌ 主语是“中国官式建筑”，没有同类对比对象，用法不成立。\n- **D 项**：✅ 用一个方案贯穿始终——**“它强调的不是时间长，而是不变”**。\n\n**【本题要点】**\n> ⭐ **A 的意思是“长”，D 的意思是“不变”**——文段到底强调“长”还是“不变”，把这个问题想清楚就行。\n> ⭐ 排 C 的关键是**看横线的**主语**（主体）**：主体是“中国官式建筑”，它没法“一枝独秀”。\n> 💡 老师举的例子：“我觉得中心理解题三步走这个方法很好用，那我从此以后就**一以贯之**地把它用下去——你不能说从此以后中心理解题**一枝独秀**。”\n\n### 例题 11｜2022 国考 · 文创产品\n\n（PPT 例 7 · 猪队友 + 词语精确辨析）\n\n**【题干原文】**\n> 例 7（2022 国考）\n> 文创产品能否经受检验、笑到最后，关键在于是否蕴含了深厚的文化价值与审美价值，在专注其实用价值的同时，**更要看到**它们所承载的**文化意涵**、所具有的**文化表达功能**。如果对传统文化______，盲目引入商业化流程，反而会贬损传统文化的价值。\n> 填入画横线部分最恰当的一项是：\n\nPPT 批注：第一句“在专注其实用价值的同时，更要看到……”旁注【**对偶**】；末句旁注【**反面论证**】。\n\n**【选项原文】**\n> A. 敬而远之（表示尊敬，但又不愿意接近）\n> B. 不求甚解（只知道个大概，不求深刻了解）\n> C. 不以为然（不认为是对的，表示不同意）\n> D. 浅尝辄止（比喻做事不深入，不肯深入研究，一般指做某件事）\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 找横线暗示 | “**盲目引入**”暗示横线＝**没有深入了解**这个文化 → 在“不求甚解／浅尝辄止”里纠结 |\n| 2 | 排 A | 一个文创产品，怎么可能对传统文化“敬而远之”？**对文化敬而远之，你还能叫文创吗？** |\n| 3 | 排 C | 什么叫“不以为然”＝**不认为是对的、表示不同意**；你如果对文化表示不同意，你怎么可能创造文创产品？ |\n| 4 | 猪队友定答案 | B、D 凭良心说**真不好区分**（老师自述“我真讲不明白”）。但既然有个“不以为然”，它跟“不求甚解”长得很像 → **猪队友暴露答案** → 选 B |\n\n**【逐项解析】**\n- **A 项**：❌ 与“文创产品承载文化”的定位矛盾。\n- **B 项**：✅ 对传统文化只知大概就盲目商业化 → 反而贬损其价值。\n- **C 项**：❌ “不以为然”是“不同意”，与文意矛盾（它与“不求甚解”外形相近，是猪队友）。\n- **D 项**：❌ 与“不求甚解”极难区分（老师坦言自己区分不了），靠猪队友逻辑落选。\n\n**【本题要点】**\n> ⭐ **不以为然 ＝ 表示不同意（“然”是“对、正确”）；不以为意 ＝ 不在乎、不放在心上**——**不要记混了！**\n> ⭐ 老师诚实示范：“让我区分 B、D，我真不会区分，**不管怎么讲总有同学觉得牵强**……那我知道这里有一个‘不以为然’，这个词怎么会坐在这儿呢？它就像‘关照’一样，是个**猪队友**，**把答案暴露出来了**。”\n> ⭐ 学员在评论区把“不以为然”记成了“不在乎”，老师当场纠正：“那是**不以为意**。**不以为然和不以为意完全不一样**。”\n\n---\n\n### 22 分组（可能提供做题思路）\n\nPPT 新页标题：**（八）从出题人角度看选项设置-22分组**\n\n> ⭐ 22 分组的作用：**不是帮你选答案，而是给你提供做题的思路**——把选项“两两分组”后，每一组其实在**暗示你思考的方向**，帮你理解文段到底强调哪一面。\n\n### 例题 12｜2022 青海 · 新能源汽车\n\n（PPT 例 8 · 22 分组提供思维 + 忠于原文）\n\n**【题干原文】**\n> 例 8（2022 青海）\n> **汽车是 20 世纪现代化的重要标志**，以**石油**为燃料的汽车工业______是**世界各强国经济腾飞**的龙头和重要支柱。\n> **近年来**，世界主要汽车大国纷纷加强战略谋划、强化政策支持，跨国企业加大研发投入、完善产业布局，**新能源汽车**成为全球汽车产业转型发展的主要方向和促进未来世界经济持续增长的重要______。\n> 依次填入画横线部分最恰当的一项是：\n\nPPT 底注（逐字）：\n> 注：文段总体是一个**不同时间引导的相反对比关系**。\n\n**【选项原文】**\n> A. 一向（副词） 动力（比喻推动工作、事业等前进和发展的力量）\n> B. 曾经（副词） 引擎（比喻推动工作、事业等前进和发展的力量）\n> C. 之前（指以前） 源泉（比喻力量、知识、感情等的来源或产生的原因）\n> D. 向来（指一贯，从来） 引领（指引、带领）\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 看第一空如何分组 | A“一向”与 D“向来”＝**一直是（过去是、现在也是）**；B“曾经”与 C“之前”＝**只是过去** |\n| 2 | 追问“是过去重要还是一直重要” | 注意断句：文段问的**不是单纯的石油**，而是“**以石油为燃料的汽车工业**”（可以理解成“**油车**”）——油车是过去重要还是一直重要？**读到这儿不知道** |\n| 3 | 回到“做题三境界” | **“所有的理解都是你自己的理解”**——不要凭自己的印象，要看**作者怎么想** |\n| 4 | 从后文找答案 | “**近年来**……新能源汽车成为全球汽车产业转型发展的主要方向”——不管第二空填什么，文段已经告诉你：**今天重要的是新能源汽车** → 油车**只是过去重要** → 第一空排 A、D，保留 B、C |\n| 5 | 第二空二选一 | “它能够拉动经济增长”——**引擎**（源泉是“怎么出现/来源”的意思；别人是“促进”，有一个**动力的感觉、推动的感觉**）→ 选 B |\n\n**【逐项解析】**\n- **A 项**：❌ “一向”＝一直是，与“不同时间的相反对比”不符。\n- **B 项**：✅ “曾经”对应“油车只是过去重要”；“引擎”有推动、动力的感觉，与“促进经济增长”相应。\n- **C 项**：❌ “之前”虽然也是过去，但“源泉”＝来源，不如“引擎”贴合“促进”。\n- **D 项**：❌ “向来”＝一贯如此，与后文“新能源汽车成为主要方向”矛盾；“引领”一般作动词，此处应填名词，读起来也不顺。\n\n**【本题要点】**\n> ⭐ “**所有理解都是你自己的理解**”——你要看**作者**怎么想，**你认为的其实没那么重要**。\n> ⭐ 本题第一空其实**错在“猪队友”上**：A“一向”就是那个明显的错误项，它把正确答案“曾经”（即 B 组）暴露出来。\n> ⭐ 22 分组的意义：“**选项设置明显告诉你两个思维**——到底‘之前重要’还是‘一直重要’？那就回到原文去想。”\n\n### 例题 13｜2023 广东 · 政府与市场\n\n（PPT 例 9 · 22 分组 + 转折验证）\n\n**【题干原文】**\n> 例 9（2023 广东）\n> 政府部门要**制定政策、营造环境**，**发挥**宣传发动、组织协调、引导扶持**作用**，**但绝不能**______。要**坚持有为政府和有效市场相促进**，充分发挥市场机制作用，调动市场主体积极性，以**重点产业项目**为______，促进资源要素更多向乡村流动，以产业“活水”变输血为造血。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 置身事外（把自己放在事情之外，毫不关心） 核心\n> B. 越俎代庖（比喻超过自己的职务范围去处理别人所管的事情） 根本\n> C. 大包大揽（把工作或事情全部兜揽、承担起来） 载体\n> D. 袖手旁观（比喻置身事外或不协助别人） 导向\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 看第一空如何分组 | A 置身事外、D 袖手旁观＝“**不管**”；B 越俎代庖、C 大包大揽＝“**管太多**” |\n| 2 | 回到文段 | “要制定政策、营造环境，发挥……作用”——**前面说的是你要做一些事情** |\n| 3 | 用转折验证 | 前面是“要做”，后面“**但绝不能**______”——不能填“要做”，因为那样就**没有转折的感觉**了 |\n| 4 | 反过来想 | 注意有个“**不能**”：不能做太多 → 转折后应表达“**你要做，但不能做太多**”（不是递进，是**相反**的感觉）→ 答案在 B、C（管太多） |\n| 5 | 第二空辨析 | B 根本 / C 载体——重点是“以**重点产业项目**为____”，“重点产业就是**通过**重点产业**促进**要素向乡村流动”，所以它是一种**载体**（可以理解为一种**工具**） |\n| 6 | 追问“谁才是根本” | 文段说“充分发挥**市场机制**作用，调动**市场主体**积极性”——**根本是市场机制**，不是政府的项目 |\n\n**【逐项解析】**\n- **A 项**：❌ 把 A 项加“不能”读——“不能置身事外”，那不还是要做吗？那就**达不到转折的效果**。\n- **B 项**：❌ “越俎代庖”虽是“管太多”，但第二空“根本”错——根本在市场机制，不在项目。\n- **C 项**：✅ “大包大揽”＝管太多；“载体”＝工具，与“以重点产业项目为____促进要素流动”贴合。\n- **D 项**：❌ 与 A 同理（“不能袖手旁观”＝还是要做）。\n\n**【本题要点】**\n> ⭐ 22 分组把选项分成“**不管**（AD）／**管太多**（BC）”，直接提示你思考方向——“到底我要填‘不管’的意思还是‘管太多’的意思？”\n> ⭐ **“载体”这个词其实经常作为答案**，可以把它理解成一种**工具**。\n> ⭐ 关于“越俎代庖是不是程度有点重”：不重，“他俩都是管太多的意思，而且前面有个‘不能’，**不用考虑程度重不重的问题**”。\n\n### 例题 14｜2024 浙江 · 先秦儒学引诗叙事\n\n（PPT 例 10 · 22 分组 + 递进关系“前轻后重”）\n\n**【题干原文】**\n> 例 10（2024 浙江）\n> 先秦儒学传世文献与出土文献中，存在着**大量的引诗叙事**。这些引诗叙事或因其义理方式不够“纯粹”，或因其文献形态不够“经典”，**往往被**______，**甚至被忽视乃至遗忘其思想价值**。**然而**这些引诗叙事，**并不是**先秦儒学诸子______的。**研究**先秦儒学的引诗叙事，是**还原**先秦儒学的原始生命、______先秦儒学的**诗性智慧**、**彰显**先秦儒学的**中国哲学特质**的重要路径。\n> 依次填入画横线部分最恰当的一项是：\n\nPPT 底注（逐字）：\n> 昭示：明白表示或宣布——（2023 吉林）把中国真正的文化精髓昭示世人\n\n**【选项原文】**\n> A. 轻描淡写（指说话写文章把重要问题轻轻带过） 率性而为（指按照自己的性情行事） 突出\n> B. 一带而过（指捎带着就顺过去了） 随意而为（指随着自己的意愿做事） 昭示\n> C. 弃如敝屣（比喻毫不可惜地抛弃掉） 随心所欲（指任凭自己的意愿，想要怎样就怎样） 揭示\n> D. 熟视无睹（形容对事物漫不经心或不重视） 随其所宜（随意，怎么适宜就怎么做） 凸显\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空先看关系 | “往往被______，**甚至**被忽视乃至遗忘其思想价值”——**递进关系，前轻后重** |\n| 2 | 按 22 分组给第一空分类 | A、B（轻描淡写／一带而过）＝“**写了，但写得少**”；C、D（弃如敝屣／熟视无睹）＝“**完全不管**” |\n| 3 | 用递进关系排除 | 你既然要填在“忽视、遗忘”**之前**，**程度不能比它更重**（“起码我写了一点”）→ 保留 A、B，排掉 C、D |\n| 4 | 第二空用“猜”（随机呼应法） | “随意而为、随心所欲、随其所宜”**三个“随”** → 那我是不是应该猜一猜？——“本来应该选 A 的，那我选 B 了” → **选 B** |\n| 5 | 第二空讲道理 | 因为后面在告诉你：**研究先秦儒学是有目的的**（还原智慧、彰显特质、昭示生命智慧）——“其实我这样做是有目的的，**不是漫无目的的**” |\n| 6 | 辨析“率性” vs “随意” | **率性而为＝按照自己的性情**（与有没有目的性**没关系**）；**随意而为＝没什么目的** → 选“随意而为” |\n| 7 | 第三空 | “**昭示**诗性智慧”——见过（昨天刚讲过），表示“非常明显地显露出来” |\n\n**【逐项解析】**\n- **A 项**：❌ 第一空可保留，但第二空“率性而为”是“按自己性情”，与文段“有目的”的语境不合。\n- **B 项**：✅ “一带而过”程度轻，符合递进前轻；“随意而为”对应“不是漫无目的”；“昭示”对应“明确地显露”。\n- **C 项**：❌ “弃如敝屣”＝完全抛弃，程度比“忽视”还重，放在递进前**顺序反了**。\n- **D 项**：❌ “熟视无睹”＝完全不管，程度与“忽视”相当甚至更重，同样位置不对。\n\n**【本题要点】**\n> ⭐ **递进关系“前轻后重”**：填在递进之前的词，**程度不能太重**（“起码我写了一点”）。\n> ⭐ 老师现场示范“现学现卖”：“我不太懂什么叫率性、什么叫随意——**那你猜就猜 B 嘛**，因为‘随意而为、随心所欲、随其所宜’**三个‘随’**。”\n> ⭐ **“率性而为”是按自己的性情，跟有没有目的性没什么关系；文段是有目的的，所以用“随意而为”。**\n\n---\n\n### 语义丰富原则\n\nPPT 新页（逐字，页眉为“（八）从出题人角度看选项设置-语义丰富”）：\n\n```\n③语义丰富原则：\n   优选语义更加丰富的选项（字形拆分或语义拆分）\n   注意：并不提倡在日常做题时使用，推荐纠结时偶尔使用\n```\n\nPPT 上配的三组示例词（逐字）：\n\n```\n残存、残留、保存\n感悟、感受、领悟\n自谋生路、自生自灭、自取灭亡\n```\n\n> ⭐ 原理：**跟“选项有共性”是同一个原理**——干扰项是**根据正确答案出的**，所以它或多或少跟正确选项有关联。\n> 💡 字形/语义拆分示例：“残**存**、残**留**、保**存**”——“残”对“残留”、“存”对“保存”；“**感**悟、**感**受、领**悟**”；成语也一样：“自**生**自**灭**”的“生”对应“自谋生**路**”，“灭”对应“自取**灭亡**”。\n> ⭐ “就我的观察来看，**并不少见，还是挺频繁的**。”\n> ⚠️ 老师严正声明：“**千万不要把老师说的话断章取义**，你说‘张老师讲过，只要语义丰富就选’——**我没这么说**，各位同学给我作证。我说的是**你该正常做就正常做**；当你纠结了（比如‘残存还是残留我不好区分’），那就选**残存**，两个加在一起、第三个加在一起的，作为答案概率更高。”\n\n### 例题 15｜2024 陕西 · 双碳目标\n\n（PPT 例 11 · 语义丰富 + 固定搭配热词）\n\n**【题干原文】**\n> 例 11（2024 陕西）\n> **碳达峰和碳中和**“双碳”目标的提出是______生态环境发展趋势、**推动经济方式升级**的**迫切需要**。______碳达峰和碳中和的“双碳”**目标**，需要将长期绿色低碳发展战略纳入美丽中国建设总体框架，**制定**灵活的低碳发展战略目标**和实施战略**，**强化**国家战略科技力量和低碳前沿技术，**深化**生态环境领域的国际合作等。\n> 依次填入画横线部分最恰当的一项是：\n\nPPT 底注（逐字）：\n> **锚定目标**：在某个过程或行动中确定并专注于一个特定的目标或方向并为之努力\n\n**【选项原文】**\n> A. 顺乎（遵从） 确定（定下来）\n> B. 符合（与存在的式样、形式或标准一致） 实现（使成为事实）\n> C. 顺应（顺着某种趋势去适应） 锚定（稳定住、锁定住）\n> D. 适应（符合客观条件或需要） 明确（清晰明白）\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 主要方法 | **固定搭配（热词搭配）** |\n| 2 | 第一空不好做 | “什么玩意儿看不懂”——但**两个“顺（顺乎／顺应）”作为答案的概率高** |\n| 3 | 第二空有个明显的“目标” | 发现一个词叫“**锚定**”——“**锚定目标**”这个词就很好；**不知道就记** |\n| 4 | 第二空其实也有分组 | **A、D 是一组（确定／明确＝把目标定下来）**；**B、C 是一组（实现／锚定＝要为之奋斗）** |\n| 5 | 为什么不能选“确定、明确” | 因为后面说的是“需要**制定、深化、强化**”——**我不光要把目标定下来，我是要实现它、做到它** |\n| 6 | 为什么“锚定”也可以 | 很多人以为“锚定”＝确定，**不是**——锚定**多了一个“为之努力”的感觉**：“咬定青山不放松，立根原在破岩中”；“你锚定这个岗位，不是说我岗位确定就算了，而是我确定之后**要为之奋斗**” |\n| 7 | 语义丰富加成 | 第一空“两个顺”＋第二空“锚定”是热词 → C 作为答案的概率更高 |\n| 8 | 辨析“符合” | “符合趋势**的需要**”**没有这么说话**——你只能说“符合趋势”，不能说“符合趋势的需要”（后面有个“的需要”），而“顺应趋势的需要”就顺 |\n\n**【逐项解析】**\n- **A 项**：❌ “顺乎”正常人很少这么说话（“考试正常人谁去挖这个空”）；“确定”只是把目标定下来，与后文“制定、强化、深化”不符。\n- **B 项**：❌ “符合趋势的需要”搭配不成立；“实现”虽语义没问题，但**“锚定目标”是官方文章里更受宠的搭配**。\n- **C 项**：✅ “顺应……发展**趋势**”是固定搭配；“锚定目标”是热词，且有“为之努力”的意味。\n- **D 项**：❌ “适应”搭配“趋势”不如“顺应”；“明确”只是把目标弄清，力度不够。\n\n**【本题要点】**\n> ⭐ **“锚定目标”要记住，热词很可能还会再考。**\n> ⭐ 老师强调“**最恰当**”三个字：“从语义来讲，‘实现’没有问题，但我们逻辑填空题把‘**最恰当**’这三个字圈上——**我不是说‘实现’意思不对，而是两相比较，‘锚定’更好**。”\n> ⭐ 语义丰富的加成作用：“两个‘顺’作为答案概率高；第二空热词还是语义丰富，那 **C 作为答案概率肯定更高**。”\n\n### 例题 16｜2025 江苏 · 领导细胞\n\n（PPT 例 12 · 语义丰富 + 回归文段主题）\n\n**【题干原文】**\n> 例 12（2025 江苏）\n> “**领导细胞**”在**肝脏受损**后进行**自我修复**方面发挥了**主要作用**。在伤口愈合过程中，**这些细胞**______，迅速**闭合伤口**，然后细胞快速**增殖**，进一步**密封伤口**。这表明，在______新组织前，肝脏优先考虑闭合伤口，**防止细菌进入器官引起广泛感染**。\n> 依次填入画横线处最恰当的一项是：\n\nPPT 底注（逐字）：\n> 形成通常搭配一些**抽象**的对象，比如“**局势、趋势、问题**”\n> 生成通常搭配一些**具体**的，比如“**模型、文本、组织、代码**”\n\n**【选项原文】**\n> A. 争先恐后（争着向前，唯恐落后） 繁殖\n> B. 身先士卒（泛指领导带头走在群众前面） 形成\n> C. 一马当先（作战时策马冲锋在前，形容领先或带头） 生成\n> D. 首当其冲（最先受到攻击或遭遇灾难） 产生\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空找暗示 | “**迅速**闭合伤口”→ 要表达“**快**”的意思 |\n| 2 | 先干掉 D | “首当其冲”＝最先受到攻击或遭遇灾难，与“快”无关 |\n| 3 | 回归文段主题（不要学了后面忘了前面） | 横线的主体是“**领导细胞**”——“你作为一个领导细胞，是不是得**有点领导的力量**？” → “**身先士卒、一马当先**”具有领导力；“争先恐后”用在领导身上**怪怪的** → 第一空排 A、D，保留 B、C |\n| 4 | 第二空 | 说实话 B、C 不好区分（跟“维持/保持”那类一样）——**形成**一般搭**抽象**的（局势、趋势、问题）；**生成**一般偏**具体**的（模型、文本、组织、代码）。文段是“**新组织**”→ 具体 → **生成** |\n| 5 | 语义丰富终验 | “生**成**、产**生**、形**成**”——**我各取一个字，还是“生成”最好** → 选 C |\n\n**【逐项解析】**\n- **A 项**：❌ “争先恐后”是“争着向前、唯恐落后”，用在“领导细胞”这一主体上不合适（没有领导力的感觉）。\n- **B 项**：❌ “身先士卒”有领导力，但“形成”多搭抽象对象，与“新组织”这一具体对象不搭。\n- **C 项**：✅ “一马当先”有领导力；“生成”搭配具体的“新组织”。\n- **D 项**：❌ “首当其冲”意思完全不符（最先遭受攻击）。\n\n**【本题要点】**\n> ⭐ **“形成”搭抽象（局势、趋势、问题），“生成”搭具体（模型、文本、组织、代码）。**\n> ⭐ “**不要学了后面忘了前面，文段的主题是什么**”——主体是“领导细胞”，所以要有“领导力”。\n> ⭐ 语义丰富再验一遍：“生成、产生、形成，**我各取一个字儿，还是你最好**——纠结的话就猜嘛。”\n> ⭐ 顺带一提：“繁殖这个词作为答案概率也不高，因为其实他们三个跟‘繁殖’有一种**三比一**的感觉。”\n> ⚠️ 老师坦承：“这个题‘符合’为什么不行，讲起来确实有点费劲……**你就当考场技巧**，老师在这抱个歉。你在考试时也没时间想为什么‘符合’不行，相信我的技巧就可以了。”\n\n### 例题 17｜2025 湖南 · 屏南竹木弓箭\n\n（PPT 例 13 · 语义丰富“集大成” · 全讲最后一题）\n\n**【题干原文】**\n> 例 13（2025 湖南）\n> 福建屏南，**群峰耸峙**、**雨量**______，**孕育了茂密的竹海**，也造就了屏南**传统竹木弓箭制作技艺**。**一代代弓箭工匠**，致力于______竹木弓箭制作工艺、______传统竹木射箭运动，让**传统体育项目重新焕发光彩**。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 充足 再现 恢复（恢复到原有状态）\n> B. 充沛 复原 复兴（恢复原状，再次兴盛）\n> C. 丰沛 修复 弘扬（发扬光大）\n> D. 充实 还原 振兴（使振作、兴起，增强活力）\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 第一空固定搭配 | “雨量充足／充沛／丰沛”都可以；**“雨量充实”太奇怪了** → 排 D |\n| 2 | 第二空搭配 | “______竹木弓箭制作工艺”——**再现工艺／复原工艺可以；修复工艺不太对劲**，修复是修复**具体的东西** → 排 C |\n| 3 | 第三空辨析 | “______传统竹木射箭运动”——“**恢复**”＝以前怎么样，现在就怎么样；“**复兴**”比它**更积极**：不仅要恢复，而且**要更好、更兴旺**（如“民族伟大复兴”） |\n| 4 | 回到文段 | 文段说“让传统体育项目**重新焕发光彩**”——**注意不是“重新回来”，是“重新焕发光彩”** → 选“复兴” |\n| 5 | 语义丰富大验收 | 复兴＝“恢复＋振兴”（A＋D），充沛＝“充足＋丰沛”（A＋C），复原＝“修复＋还原”（C＋D）——**可不是一个哟！每一个都这样** |\n\n**【逐项解析】**\n- **A 项**：❌ “恢复”只表示“回到原来的样子”，不如“复兴”积极。\n- **B 项**：✅ “充沛”“复原”“复兴”三者搭配与语境都最贴，且“复兴”对应“重新焕发光彩”。\n- **C 项**：❌ “修复”不能搭配抽象的“工艺”。\n- **D 项**：❌ “雨量充实”搭配错误。\n\n**【本题要点】**\n> ⭐ 这是全讲的**收尾题**，也是语义丰富的**集大成者**：“**复兴＝恢复＋振兴；充沛＝充足＋丰沛；复原＝修复＋还原**——**每一个都这样**。”\n> ⭐ 老师解释为什么把它放最后：“因为他**每个选项都达到了这个要求**，比较典型。”\n> 💡 缘分梗：“咱们**十二箭**最后一个题就是弓箭，知道吧？弓箭，**奇妙的缘分**。”（老师备课时才发现）\n> ⚠️ 老师反复强调：“**不要把它太神圣化**，它只是出题人的一种**常见的逻辑套路而已**。咱们还是要正常做题，当你纠结的时候，你再这样去做。”\n\n---\n\n### 结课答疑中出现的两道题\n\n> 📌 本节课最后是“老规矩”的答疑环节（虽然是最后一节课）。答疑 PPT 是一张**学员提问汇总表**（列：序号 / 学员名 / 日期 / 提问 / 截图 / 老师回复）。其中两道题被展开讲评。\n\n### 例题 18｜答疑环节 · “死亡游戏”与生命教育\n\n（学员“吃不够”提问，2026/02/09；老师借此题印证“文段有对应”；本题在答疑表中的序号为 13）\n\n**【题干原文】**\n> **学校和家庭需要给予孩子们更充分的生命教育**。比如，不妨在学生中间开展关于“**死亡游戏**”的讨论，**祛除这种所谓“游戏”的**______，帮助孩子们从**健康角度**认识其**风险**，从**科学角度**知晓其**原理**。通过**真实案例**，帮助孩子们**认识到生命的唯一性**，**树立对生命的**______，让他们在面对“**极限诱惑**”时，**选择正确的方向**。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 危害性 崇拜感\n> B. 娱乐性 敬畏感\n> C. 虚幻性 崇敬感\n> D. 神秘感 敬畏感\n\n**【答案】** ✅ D（PPT 上 D 项前有勾选圈，画面显示答案为 D）\n\n**【学员提问原文】**\n> 老师今天讲的，祛除这种所谓“游戏”的（ ），帮助孩子 xxxxx，从科学角度知晓原理。通过真实案例帮助孩子 xxxx **为什么不能从后面的真实案例的“真实”入手，所以祛除的是虚幻性**\n\n**【老师回复原文】**\n> 因为这句话的**重点不在真实**。这和**中心理解题非重点**的感觉是一样的，我从**真实性**入手，和你讲述这个游戏。**重点不是让这个游戏变真，还是让你更多了解**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 学员的困惑 | 看到后文有“**真实案例**”，就想从“真实”入手 → 选 C“虚幻性” |\n| 2 | 关键点 | **重点不在“真实”**——这和中心理解题里“**非重点**”的感觉一样；“我从‘真实性’入手，和你讲述这个游戏”，但重点不是“让游戏变真”，而是“**让你更多了解**” |\n| 3 | 用本讲原理复盘 | **不是找正确答案的相似性，而是“文段有对应”**——把文段中**非重点、不关键的部分**拿到选项当中来给你出干扰项 |\n| 4 | 逐条还原干扰项来源 | “我看到一个‘真实’，我想选**虚幻**”；“我看到一个‘游戏’，我想选**娱乐**”；“我看到一个‘认识’，我就想选**神秘**”；“我看到一个‘死亡’，我就想选**危害**” |\n\n**【本题要点】**\n> ⭐ 这道题是“**文段有对应**”原理的完美印证：“这四个选项的干扰词，全都来自文段中的**非重点部分**。”\n> ⭐ 所以“**一定要抓住真正想强调的内容**”。\n\n### 例题 19｜答疑环节 · 讲好中国故事\n\n（学员“爱听张弓的星”提问，2026/02/09；**事业单位题**；答疑表中序号为 5；老师自述这是他本节课最后一道题、只讲自己的思维）\n\n**【题干原文】**\n> **一部好故事，要有高票房，就要讲好故事，而讲好故事除了要使用最先进的专业技术之外**，**更要能沉下心来在我们**______**的传统文化里挖掘电影内容**，只有这样，在流量纵横的网络时代，深耕传统文化、______好故事并把好故事讲好的电影艺术才能既发挥**娱乐消遣**作用又发挥**文化传递**功能，并**构建中国电影自身的**______，更好担负起**新的文化使命**。\n> 依次填入画横线部分最恰当的一项是（ ）。\n\n**【选项原文】**\n> A. 悠久 发掘 民族性\n> B. 灿烂 构思 地域性\n> C. 独特 叙述 文化性\n> D. 宏大 传承 时代性\n\n**【答案】** ✅ A（PPT 上 A 项被圈为答案）\n\n**【学员提问原文】**\n> 老师这个题我的思路是**有横线然后逗号**，后边说**担负新的文化使命**，然后 **D 里边有时代性**，然后我就选了。也看见了**深耕传统文化**、什么好故事，并**把故事讲好**这是个**三并列**，然后我就才从这入手。然后**我看了答案之后**，然后我抓了一下他的**主题词**，说的是**传统文化**的事，然后我就觉得**最后一个空填民族性会更好一些**。\n\n**【老师回复原文】**\n> 这个题我看完**第一空**之后，感觉只能选**悠久**了。说……个点你可以尝试思考一下，**除了要先进的，更要有……什么？不那么先进的，有历史底蕴的，就是悠久**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 | 入手点 | 老师自述：**“当我看完第一空之后，我基本上就锁定‘悠久’了。”**——这就是**抓住了文章的中心主题** |\n| 2 | 第一空为什么是“悠久” | “悠久／灿烂／独特／宏大”**都能修饰传统文化**，但要根据**前后文对比**：“**一部好故事，除了要使用最先进的专业技术之外，更要能沉下心来在我们……的传统文化里挖掘电影内容**”——“**除了……之外，还要**”是**对比**：除了要有**先进的新东西**，**还得有一些老的、能经得起时间沉淀的东西**——“最能体现时间沉淀意思的，是不是就是**悠久**？” |\n| 3 | 举例说明该思维 | “我们任何一家公司，**除了有新人，还有旧人**” |\n| 4 | 回应学员的困惑 | “有人问‘传统不就代表老东西吗？’——是的，但**你要知道作者想强调什么**：你要把**传统文化当成一个整体**，传统文化有很多性质，**我想强调的性质是它历史是悠久的、有积累有积淀的**。” |\n| 5 | 第二空也可做 | 抓“**深耕**”——“能够和深耕最好构成**并列关系**的是**发掘**，动作程度最接近：**深耕发掘**，把好东西挖出来” |\n| 6 | 第三空 | “**民族性**”——“中国人！还是世界的嘛，这不是民族？所以你要抓**我们的传统文化**，这不是民族性嘛”；而且“文化使命大概率也是**民族**” |\n\n**【逐项解析】**\n- **A 项**：✅ “悠久”与“除了最先进的之外，还要有历史底蕴的”构成对比；“发掘”与“深耕”动作程度最接近；“民族性”对应“我们的传统文化／新的文化使命”。\n- **B 项**：❌ “灿烂”也是修饰传统文化的词，但与“先进 vs 有历史底蕴”的对比不合。\n- **C 项**：❌ “独特”与前后文的“新／老”对比关系不大。\n- **D 项**：❌ “宏大”与“先进／沉淀”的对比关系不大（学员选 D 是因为看到“时代性”，但那不是文段想强调的）。\n\n**【本题要点】**\n> ⭐ 老师结论：“**言之有理即可**，我只是讲一讲我的思维。”\n> ⭐ 从第一空入手、从第二空入手都行：“你第二空抓‘深耕’，我觉得也行——**发掘、深耕非常好**。”\n> ⭐ 关键动作：**“除了……之外，还要有……”是明显的对比结构**，一定要意识到作者在**对立**两种性质。\n\n---\n\n## 九、本讲方法框架总表\n\n### 9.1 主框架（老师板书 + PPT 逐字）\n\n```\n【逻辑填空】\n├─ 思路\n│   ├─ 弄清文段与横线意思\n│   └─ 选项寻找合适的词语\n├─ 语境分析\n└─ 词语辨析\n    ├─ 出题人角度看选项设置\n    │   ├─ ①认识逻辑填空题干扰选项的设置\n    │   │   ├─（1）文段有对应 —— 和文段非对应部分，对应很合适（类似非重点）\n    │   │   └─（2）选项有共性 —— 外形相似（实词、成语）\n    │   │                      意义相似（实词、成语）\n    │   │                      性质相似（实词、成语）\n    │   ├─ ②选项分组思维\n    │   │   ├─ 13分组  —— 较多遵循优选多数原则\n    │   │   ├─ 211分组 —— 较多遵循优选多数原则\n    │   │   │               一正一邪，利用明显的错误选项找到正确答案\n    │   │   └─ 22分组  —— 可能提供做题思路\n    │   └─ ③语义丰富原则 —— 优选语义更加丰富的选项（字形拆分或语义拆分）\n    ├─ 选项词语做题思维\n    └─ 区分词语的角度\n```\n\n> ⚠️ 这一页 PPT 右侧老师用红笔大圈标注了一行字：**“不能代替正常的做题方式”**，并标为“（省流版）”。\n\n### 9.2 三大工具速查\n\n| 工具 | 触发时机 | 操作步骤 | 本讲对应例题 |\n| --- | --- | --- | --- |\n| **13 / 211 分组 · 优选多数** | 纠结时 | ① 看选项哪些“像”在一组；② 答案优先落在**人数多的那一组**；③ 格格不入的单个选项，作答案概率低 | 例 3、例 4、例 5、例 6 |\n| **211 特殊情况 · 一正一邪（猪队友）** | 两个选项很像，且其中一个**明显有错** | ① 找出那个“明显有错”的；② 问“它凭什么出现在选项里”；③ 它的搭档（长得很像的那个）就是答案 | 例 7、例 8、例 9、例 11、例 12 |\n| **22 分组 · 提供思路** | 不知道文段强调哪个方向 | ① 把选项两两分组；② 每组代表一个“思考方向”；③ 回文段确认到底强调哪一面 | 例 12、例 13、例 14 |\n| **语义丰富原则** | 纠结时 | ① 看两个字/词能否“拼”出第三个选项；② 能拼出的那个作答案概率更高 | 例 15、例 16、例 17 |\n\n### 9.3 做题三境界\n\n| 境界 | 占比 | 要点 |\n| --- | --- | --- |\n| ① 自己怎么想 | 80% | “我不要你觉得” |\n| ② 作者怎么想 | 15% | “我要作者觉得” |\n| ③ 出题人怎么想 | 约 5% | “我要出题人觉得” |\n\n---\n\n## 十、词语 / 成语积累表\n\n> 说明：以下词语均出自本讲 PPT 与老师讲解，释义以画面显示为准。\n\n### 10.1 文段有对应 · 高频干扰词\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 兢兢业业 | 形容做事小心谨慎、认真踏实 | 工作状态、岗位态度 | 褒 | 对应“寂寞、坚守内心宁静”，是本题答案 |\n| 夜以继日 | 指日夜不停 | 时间上的连续 | 中性偏褒 | 由文段“悠长的**夜晚**”设置，属非重点干扰 |\n| 营销 | 指企业发现或发掘准消费者需求，让消费者了解某产品进而购买该产品的过程 | 市场、销售端 | 中性 | 对应“市场反响一般”，是本题答案 |\n| 经营 | 指内在筹划、组织并管理 | 企业内部管理 | 中性 | 与“市场反响”的对应感不如营销 |\n| 创新 | 指抛开旧的，创造新的 | 技术、方法 | 褒 | 由“**老**字号”设置的非重点干扰 |\n| 宣传 | 指说明讲解，使大家相信并跟着行动起来 | 信息传播 | 中性 | 由“**知名度**”设置的非重点干扰（转折后已说“知名度虽然有”） |\n\n### 10.2 选项有共性 · 三种“相似”示例词\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 一蹴而就 | 踏一步就成功，形容事情轻而易举 | 做事的难易与速度 | 中性 | **外形相似**族：均带“一” |\n| 一以贯之 | 用一种思想理论贯穿于始终 | 始终如一、**不变** | 褒 | 与“源远流长（长）”对比：它强调**不变** |\n| 一鸣惊人 | 比喻平时没有突出表现，一下子做出惊人的成绩 | 结果、表现 | 褒 | 外形相似族 |\n| 一劳永逸 | 辛苦一次，把事情办好，以后就不再费力了 | 付出的次数 | 中性 | 外形相似族 |\n| 无孔不入 | 比喻善于钻营，有机会就钻 | 渗透 | 贬 | **外形相似**族：均带“无” |\n| 无所不在 | 到处都存在，到处都有 | 范围 | 中性 | 外形相似族 |\n| 曝光 | 指事物暴露出来，被公众知道 | 事件被公开 | 中性 | **意义相似**族 |\n| 暴露 | 指隐蔽的事物、缺陷、矛盾等显露出来 | 问题被显露 | 中性偏贬 | 与“曝光、败露”近义 |\n| 败露 | 指（秘密或坏事）被人发现 | 坏事、阴谋 | 贬 | 意义相似族 |\n| 明知故犯 | 明明知道不能做，却故意违犯 | 主观故意 | 贬 | **意义相似**族 |\n| 知法犯法 | 知道法律却还违法 | 法律层面 | 贬 | 意义相似族 |\n| 以身试法 | 明知法律禁止，还亲身去做犯法的事 | 法律层面 | 贬 | 意义相似族 |\n| 绅士 | 指旧时地方上有势力、有功名的人，或指有教养的男子 | 某种**类型的人** | 中性偏褒 | **性质相似**族：与“演员／儒生／秀才”同类 |\n| 儒生 | 指遵从儒家学说的读书人 | 某类读书人 | 中性 | 性质相似族 |\n| 秀才 | 指明清两代生员的通称，泛指读书人 | 某类读书人 | 中性 | 性质相似族 |\n| 踏破铁鞋 | 比喻为寻找某事物而历尽艰辛，走遍各地 | 脚力、行走 | 中性 | **性质相似**族：均由“脚／走”联想而来 |\n| 踏石留印 | 比喻做事扎实有力、留下痕迹 | 脚力、实干 | 褒 | 性质相似族 |\n| 如履薄冰 | 比喻行事极为谨慎，存有戒心 | 谨慎 | 中性 | 性质相似族 |\n| 步步为营 | 形容进军谨慎，也比喻行动、做事谨慎 | 谨慎 | 中性 | 性质相似族 |\n\n### 10.3 分组与词义辨析高频词\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 人去楼空 | 人已离去，楼中空空 | 人事变迁后的冷清 | 中性 | 本题答案；对应“本来有→现在没” |\n| 颓垣败壁 | 荒凉破败的景象 | 建筑、景象 | 中性偏贬 | 若为答案，干扰项应出“建筑类”成语 |\n| 人迹罕至 | 很少有人到过的地方 | 地方偏僻 | 中性 | 强调**可能一直没有**，与“昔日热闹”不符 |\n| 杳无人烟 | 僻远无人居住 | 地方荒僻 | 中性 | 同上，属“天生的” |\n| 事过境迁 | 事情已经过去，事情发生的环境也改变了 | 时间与环境变化 | 中性 | 同组近义词 |\n| 标新立异 | 提出新的主张或见解，也指故意另搞一套 | 创新 | 中性偏贬 |  | 不能用于“经济发展” |\n| 辉映 | 照耀、映射 | 多形容**景色**（交相辉映） | 褒 | 与“成就和发展”搭配少见 |\n| 匹配 | 指配合、符合 | 二者相配 | 中性 | 本题答案 |\n| 源远流长 | 比喻历史悠久，根底深厚 | 时间**长** | 褒 | 与“一以贯之（不变）”辨析 |\n| 一枝独秀 | 在同类人或同类事物中出类拔萃 | 需要**同类比较对象** | 褒 | 主语是“中国官式建筑”，无对比对象 |\n| 一以贯之 | 用一种思想理论贯穿于始终 | **不变**、始终 | 褒 | 本题答案（且是“受宠”的热词） |\n| 敬而远之 | 表示尊敬，但又不愿意接近 | 距离感 | 中性 | 文创产品不可能对文化如此 |\n| 不求甚解 | 只知道个大概，不求深刻了解 | **了解得浅** | 贬 | 本题答案 |\n| 不以为然 | 不认为是对的，表示**不同意** | 态度、判断 | 贬 | 猪队友；**易与“不以为意”混淆** |\n| 不以为意 | 不把它放在心上，表示**不在乎** | 态度、在意与否 | 贬 | **与“不以为然”完全不一样** |\n| 浅尝辄止 | 比喻做事不深入，不肯深入研究，一般指做某件事 | **做得浅** | 贬 | 与“不求甚解”极难区分（老师坦言分不出） |\n\n### 10.5 22 分组与语义丰富重点词\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 一向 | 副词，一向、从来 | 一直是（含现在） | 中性 | 与“曾经／之前（只过去）”对立 |\n| 向来 | 指一贯、从来 | 一直是（含现在） | 中性 | 同上 |\n| 曾经 | 副词，表示从前有过 | 只指过去 | 中性 | 本题答案（与原文“近年来”相应） |\n| 之前 | 指以前 | 只指过去 | 中性 | 第二空“源泉”淘汰 |\n| 动力 | 比喻推动工作、事业等前进和发展的力量 | 推动前进 | 中性偏褒 | “促进”有动力感 |\n| 引擎 | 比喻推动工作、事业等前进和发展的力量 | 拉动、推动 | 中性偏褒 | 本题答案 |\n| 源泉 | 比喻力量、知识、感情等的来源或产生的原因 | **来源** | 中性 | 与“增长”搭配不合 |\n| 引领 | 指引、带领 | 多作**动词** | 中性 | 此处应填名词，读起来不顺 |\n| 置身事外 | 把自己放在事情之外，毫不关心 | **不管** | 贬 | 加“不能”后变成“要做”，达不到转折 |\n| 袖手旁观 | 比喻置身事外或不协助别人 | **不管** | 贬 | 同上 |\n| 越俎代庖 | 比喻超过自己的职务范围去处理别人所管的事情 | **管太多** | 贬 | 与“大包大揽”同组，程度不必纠结 |\n| 大包大揽 | 把工作或事情全部兜揽、承担起来 | **管太多** | 贬 | 本题答案 |\n| 核心 | 中心，主要部分 | 最重要 | 中性 | 第二空四选一 |\n| 根本 | 事物的根源或最主要的部分 | 根源 | 中性 | 文段的“根本”是市场机制 |\n| 载体 | 泛指能够承载其他事物的事物 | **工具／媒介** | 中性 | 本题答案；**常作为答案** |\n| 导向 | 引导的方向 | 方向 | 中性 | 与“以……为____”搭配不合 |\n| 轻描淡写 | 指说话写文章把重要问题轻轻带过 | **写了，但少** | 贬 | 递进前“轻”组 |\n| 一带而过 | 指捎带着就顺过去了 | **写了，但少** | 贬 | 本题答案 |\n| 弃如敝屣 | 比喻毫不可惜地抛弃掉 | **完全不管** | 贬 | 程度重于“忽视”，位置反了 |\n| 熟视无睹 | 形容对事物漫不经心或不重视 | **完全不管** | 贬 | 同上 |\n| 率性而为 | 指按照自己的**性情**行事 | 与目的性**无关** | 中性 | 与“随意而为”辨析 |\n| 随意而为 | 指随着自己的**意愿**做事，没什么目的 | 无目的 | 中性 | 本题答案 |\n| 随心所欲 | 指任凭自己的意愿，想要怎样就怎样 | 无约束 | 中性偏贬 | “三个随”之一 |\n| 随其所宜 | 随意，怎么适宜就怎么做 | 无定 | 中性 | “三个随”之一 |\n| 昭示 | 明白表示或宣布 | 明白显露 | 中性 | 本题答案；老师注“（2023 吉林）把中国真正的文化精髓昭示世人” |\n| 顺乎 | 遵从 | 顺着 | 中性 | “正常人很少这么说话” |\n| 符合 | 与存在的式样、形式或标准一致 | 一致 | 中性 | “符合趋势的需要”搭配不成立 |\n| 顺应 | 顺着某种趋势去适应 | **趋势** | 中性 | 本题答案（固定搭配） |\n| 适应 | 符合客观条件或需要 | 客观条件 | 中性 | 与“趋势”搭配不如“顺应” |\n| 确定 | 定下来 | 把目标定下 | 中性 | 与“锚定”辨析：**少“为之努力”** |\n| 明确 | 清晰明白 | 把目标弄清 | 中性 | 同上 |\n| 实现 | 使成为事实 | 达成 | 褒 | 语义对，但不如“锚定”受宠 |\n| 锚定 | 稳定住、锁定住 | **确定并为之努力** | 褒 | 本题答案；**锚定目标＝热词** |\n| 争先恐后 | 争着向前，唯恐落后 | 快、抢 | 中性 | 用在“领导细胞”上怪怪的 |\n| 身先士卒 | 泛指领导带头走在群众前面 | **领导力** | 褒 | 第二空“形成”搭抽象，不合 |\n| 一马当先 | 作战时策马冲锋在前，形容领先或带头 | **领导力** | 褒 | 本题答案 |\n| 首当其冲 | 最先受到攻击或遭遇灾难 | 遭灾 | 贬 | 与“快”完全无关，直接排 |\n| 形成 | （抽象）形成某种局势、趋势、问题 | 搭**抽象**对象 | 中性 | 与“生成”配对辨析 |\n| 生成 | 生成模型、文本、组织、代码 | 搭**具体**对象 | 中性 | 本题答案 |\n| 产生 | 由已有事物中生出新的事物 | 通用 | 中性 | 同组近义 |\n| 繁殖 | 生物产生新的个体，以传代 | 生物 | 中性 | 与“生成／产生／形成”形成三比一 |\n| 充足 / 充沛 / 丰沛 | 均指足够、丰富 | 多搭配“雨量、水源、精力”等 | 褒/中性 | 三者近义；**“充实”搭配“雨量”错** |\n| 充实 | 丰富、充足（多指内容、生活） | 内容、生活 | 褒 | 与“雨量”搭配错误 |\n| 再现 / 复原 | 均指恢复原来的样子 | 搭配“工艺”可 | 中性 | 与“修复”区分 |\n| 修复 | 修理使恢复完整 | 多搭**具体**事物 | 中性 | 不能搭抽象的“工艺” |\n| 还原 | 事物恢复原状 | — | 中性 | 与“复原”近义 |\n| 恢复 | 变成原来的样子 | 回到原状 | 中性 | 不如“复兴”积极 |\n| 复兴 | 恢复原状，**再次兴盛** | 更积极、要更好 | 褒 | 本题答案（对应“重新焕发光彩”） |\n| 弘扬 | 发扬光大 | 精神、文化 | 褒 | 第二空“修复”淘汰 |\n| 振兴 | 使振作、兴起，增强活力 | 兴盛 | 褒 | 与“复兴”“恢复”构成语义丰富链 |\n\n### 10.6 语义丰富示例词（PPT 原文）\n\n| 词组 | 字形/语义拆分关系 |\n| --- | --- |\n| 残存、残留、保存 | “残”对“残留”，“存”对“保存” → 残存 = 残留 + 保存 |\n| 感悟、感受、领悟 | “感”对“感受”，“悟”对“领悟” → 感悟 = 感受 + 领悟 |\n| 自谋生路、自生自灭、自取灭亡 | “生”对“自谋生路”，“灭”对“自取灭亡” → 自生自灭 = 自谋生路 + 自取灭亡 |\n| 复兴 / 恢复 / 振兴 | 复兴 = 恢复 + 振兴 |\n| 充沛 / 充足 / 丰沛 | 充沛 = 充足 + 丰沛 |\n| 复原 / 修复 / 还原 | 复原 = 修复 + 还原 |\n| 生成 / 形成 / 产生 | 生成 = 形成 + 产生 |\n\n---\n\n## 十一、易错点与陷阱清单\n\n1. **看到文段里有某个词就去“对号入座”**——这是最大的坑。“文段有对应”式干扰项，就是把**非重点/非对应**的部分拿来放在选项里。要抓**真正强调的那个**。\n   > ⭐ “你不能说老师，我看到某一个词，我觉得我要跟他对，**你要找他真正强调的那个**。”\n2. **把“选项有共性”当成“选项都可以”**——外形相似、意义相似、性质相似，正是为了**加大辨析难度**，不是提示你“随便选”。\n3. **忽略横线的“主语 / 主体”**——例 10（营造法式）C 项“一枝独秀”被排除，就是因为主体是“中国官式建筑”而非“技术本身”。\n4. **把“失去____、说服力”机械理解成并列**——要**把“失去”带上**一起理解（例 4）。\n5. **不计“递进关系”的前后轻重**——“往往被____，甚至被忽视乃至遗忘”，递进**前轻后重**，前面填的词**程度不能太重**（例 14）。\n6. **忽略转折词的“相反”作用**——例 3 第二空：“但……逐渐沉寂”→ 转折前应偏**积极**。\n7. **忘记“否定词”带来的语义反转**——例 13：第一空前面有“绝不能”，把“置身事外/袖手旁观”代入后反而变成“要做”，转折消失。\n8. **认为“四个选项一定都很像”**——遇到 111 分组（选项差异大）反而是好事，更好辨析；遇到“三个宠辱、两个洞”这种，**应该开心**。\n9. **把“语义丰富原则”绝对化**——老师严正声明：**“我没说过‘只要语义丰富就选’。”** 该正常做就正常做，只在**纠结时**用。\n10. **词语记混**——**“不以为然＝不同意”**，**“不以为意＝不在乎”**，二者完全不一样。（本讲学员当场记错，被老师纠正。）\n11. **“率性而为”与“随意而为”混淆**——率性＝按自己的**性情**（与有无目的无关）；随意＝没什么**目的**。\n12. **“形成”与“生成”混用**——形成搭**抽象**（局势、趋势、问题）；生成搭**具体**（模型、文本、组织、代码）。\n13. **“源泉”与“引擎/动力”混用**——源泉是“来源”，引擎/动力是“推动”。\n14. **忽视“固定搭配热词”**——如“锚定目标”“顺应趋势”“交相辉映（多形容景色）”“般配（多指人）”。\n15. **某一空不好做就慌**——本讲大量例题都是“某一空看不出，但另一空／选项分组能定案”。\n16. **把技巧当正解**——**“不能代替正常的做题方式”**；一上来就用技巧 = **路走偏了**。\n\n---\n\n## 十二、老师金句\n\n> ⭐ **“我不要你觉得，我要作者觉得，我要出题人觉得。”**\n> ⭐ **“一定要尊重作者，尊重出题人。”**——不要太把自己的想法当回事。\n> ⭐ **“所有理解都是你自己的理解。”**——你认为的没那么重要，要看作者怎么想。\n> ⭐ **“我们要相信概率，相信统计学。”**\n> ⭐ **“没有无缘无故的词。”**\n> ⭐ **“干扰项是挖完空之后才设置的——它要么跟正确答案有关联，要么跟文段有关联，只有这样它才具有最强的迷惑性。”**\n> ⭐ **“选项差别越大，对大家来讲反而是好事。”**\n> ⭐ **“这不是所有题都这样——万一你遇到了，而且你又纠结的时候，天平可以稍稍往那边移一点。”**\n> ⭐ **“不要把它太神圣化，它只是出题人的一种常见的逻辑套路而已。”**\n> ⭐ **“不要走火入魔。”**\n> ⭐ **“不能代替正常的做题方式。”**（老师带全班打出来，反复强调）\n> ⭐ **“路走对了，才不怕遥远。”**（老师的 slogan）\n> ⭐ **“逻辑填空最主要的还是逻辑——分析逻辑的意思、理论以及词语的理解。”**\n> ⭐ **“矫枉必须过正。”**（讲“为什么反复强调首句”）\n> ⭐ **“任何题理论上都是可以讲的，只是有些题确实很恶心。”**\n\n---\n\n## 十三、结课答疑与考前叮嘱\n\n> 📌 说明：因为是最后一节课，老师特意保留了答疑环节，**选了一些有代表性的问题**。答疑 PPT 是一张**学员提问汇总表**（序号 / 学员名 / 日期 / 提问 / 截图 / 老师回复）。以下按老师讲评顺序整理。\n\n| # | 学员 / 日期 | 提问（原文摘要） | 老师回复（PPT 原文 + 口播补充） |\n| --- | --- | --- | --- |\n| 1 | **Sigma** 2026/02/09 | 上了您的课我现在已经能读懂题目、找到首句的主体，但对比选项时我会觉得这个答案是引自里面的内容，导致我老是会选**更宽泛**的那个选项。现在困扰我的不是读不懂题，是**如何在 2 选 1 的时候选对答案**？ | **PPT**：“还是那句话，**主题词不能只看首句**，完全夸大首句的作用，也是不可取的。我强调首句主要就是为了矫枉，因为很多同学之前完全不注意首句。**真正做题还是要找准中心句，再结合首句或者高频看**。”\u003cbr>**口播**：“**一定要结合中心句去判断。**我为什么之前那么强调首句？是因为**矫枉必须过正**，因为你们之前太不重视了。但我反复强调**并不意味着首句能够代替中心句**。” |\n| 2 | **miracle** 2026/02/09 | 老师，我想问下就是 PPT 上成语的旁边解释是从哪里查最准确，最接近考点常用的意思［举手］ | **PPT**：“我标注的很多都是词典的意思。不过具体怎么用，这个还是得**通过做题感受**。其实**没有一个真正能够给你‘标准’注释的词典**，因为考试用法就没有那么标准。”\u003cbr>**口播**：“光靠解释是没有用的……**不能完全靠标准的注释来解题**。” |\n| 3 | **箩箩** 2026/02/09 | 张老师，我有个问题，不止言语，是一个宏观的问题：因为我知道我写不完，所以导致我写题的时候心里一直**操心时间问题**，就像时间在追着我跑，进而导致我读题缓慢、读不进去题，思维混乱，想不到老师教的解题的方法，反而适得其反的更慢，正确率也不高，特别是粉笔模考的时候，时不时瞟一眼左上角的“**催命符**”，令我心烦意乱。我告诉自己忘记时间忘记时间，可是忘不掉…… | **PPT**：“确实**一开始路走岔了**。最开始学的时候，**是先追求正确率的，不要在意时间**。不知道你还有没有时间，我觉得如果短时间内想提升的话，感觉只能再在题型之间做一些取舍了，同时**忘了时间**，它其实和高考试卷不太一样，没多少人能真正仔细看完然后全部做完，因为焦虑没啥用，还不如不焦虑耐心一点。”\u003cbr>**口播**：“你的速度应该是**随熟练度的提高越做越快**……你焦虑肯定效果也不好，还不如慢慢做。” |\n| 4 | **憧宁** 2026/02/08 | 老师，我不太能把握“**例子一般不作为答案**”和“**例子可以辅助理解观点**” | **PPT**：“好问题。这其实有个**先后关系**。**从重要性的角度**，观点是大于例子的，就比如**论点高于论据**，论据是为论点服务的；**其次，从理解层面看**，论点不一定非常好理解，这个时候论据也可以帮助理解。所以**一般情况下，看论点即可**，但是**拿捏不住的时候**，或者**是保险起见，可以看看例子验证一下观点的意思**。”\u003cbr>**口播**：“**这个不矛盾。**什么时候例子可以辅助？是当你**只看观点不好辨别、有问题不好选的时候**。” |\n| 5 | **用户5453506433641** 2026/02/08 | 在逻辑填空中，如果有中心句的文段，是不是要把握一下中心句主要讲了什么，然后去看挖空的选项？ | **PPT**：“**不是所有逻辑填空都有中心句**，因为我们不能带着**上帝视角**去判断。只是我们在正常做题的时候，要**留心，要优先考虑符合中心主题的选项**。就是这个意思。就是**视野要开阔一些**。”\u003cbr>**口播**：“**不要走偏了。**老师教大家的‘中心理解化’**不是否定大家正常的做题思维**，而是在正常找对应的前提下，**把注意力更多地分配给全文的理解**……**更加优先考虑符合中心的选项，就这意思。**” |\n| 6 | **cz** 2026/02/08 | 老师，我是你最铁的粉丝，我想请教个问题：就是逻辑填空您所讲的**主题词对应、包括首句有提示，我都是在纠结的时候才去考虑**；如果一个题根据题干找对应能做出选唯一答案时，我就不会考虑首句提示和主题，只有纠结时才会考虑。这个思路对不对？ | **PPT**：“**不过可以再稍微的留意一点点，加一点点的感觉。**”\u003cbr>**口播**：“这个题……**你做完之前、包括答案出来之前，你也不知道到底是不是中心句**。不能说‘所有逻辑填空但凡首句是完整语句都是中心句’，**不是这样子**……看首句其实只是说，你们相比于之前完全不重视的情况下，今后可以**稍微留意一下，带有一点验证的感觉**。” |\n| 7（题目） | **吃不够** 2026/02/09 | “死亡游戏”与生命教育（见例题 18） | 见本讲「例题 18」 |\n| 8（题目） | **爱听张弓的星** 2026/02/09 | 讲好中国故事（事业单位题，见例题 19） | 见本讲「例题 19」 |\n\n### 老师的考前叮嘱（口播整理）\n\n> ⭐ **“路走对了，才不怕遥远。”**——不能一上来路就走偏了。\n> ⭐ 逻辑填空最主要的还是**逻辑**：分析逻辑的意思、理论以及词语的理解。\n> ⭐ **任何题理论上都是可以讲的**，大部分题都能正常分析做出来；**除非你真的有点纠结**，考场上可以借鉴这些技巧。\n> ⭐ **“不要走火入魔。”**\n> ⭐ 关于心态：“最开始学的时候**一定是先追求正确率**，不要太在意时间；速度是随熟练度提高越来越快的。”\n> ⭐ 关于例子：“**看论点即可，拿捏不住的时候用例子验证。**”\n> ⭐ 关于中心句：“**中心理解化不是推翻正常做题，而是更加关注一点点中心，更加优先考虑符合中心的选项。**”\n\n---\n\n## 十四、课程收尾与后续安排\n\n> 📌 老师原话要点（逐字归纳）：\n> - “行，我们**终于结束了这十二天的课程**，非常感慨。感谢每一位陪老师走到今天的同学。”\n> - “我看那个小破站已经 **80 多万播放**了，非常的开心。希望我这一点微小的贡献能够帮助大家。”\n> - **十二节课的 PPT 和思维导图**，老师下课后会重新梳理，通过运营群发给大家；**回放可到小破站看**。\n> - **年后刷题课**：预计 **2 月 26 日（大年初十）**开始上，共 **10 天**，讲 **20 套题（10 套卷子，一套 20 个题）**，每节课约 **2 小时**，一次讲 20 个题（国联考组卷：**3 套国考卷 + 7 套联考卷**）。\n> - **讲义**：快递初八发货，比较晚，**打过卡的同学可免费获得纸质讲义**；需要电子讲义的进群找小助手。\n> - 老师自述：“我**第一次出来上课**，有做得不对的地方，大家多多包涵，希望越来越好。”\n> - 结课祝福：**“马年大吉，祝上岸。”**\n> - “我们不要那么早说再见——**咱们明年春节之后再见面。**”\n> - 最后一屏：**“Thanks”** → **“马年大吉 / 祝上岸”**。\n\n---\n\n> ✅ 本讲（正课最后一讲）结束。逻辑填空五讲（第八讲总纲与语境分析、第九讲并列关系、第十讲宏观视角、第十一讲选项词语辨析与做题思维、第十二讲出题人角度与选项设置）至此全部讲完。\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"一、开场回顾与课程定位","id":"一开场回顾与课程定位"},{"level":2,"text":"二、说在前面：技巧的边界","id":"二说在前面技巧的边界"},{"level":2,"text":"三、出题人视角：干扰选项是怎么设置的（出题三步）","id":"三出题人视角干扰选项是怎么设置的出题三步"},{"level":2,"text":"四、原则① 文段有对应","id":"四原则-文段有对应"},{"level":3,"text":"例题 1｜2023 陕西 · 编译工作","id":"例题-12023-陕西-编译工作"},{"level":3,"text":"例题 2｜2023 内蒙古 · 老字号与营销","id":"例题-22023-内蒙古-老字号与营销"},{"level":2,"text":"五、原则② 选项有共性","id":"五原则-选项有共性"},{"level":3,"text":"（1）外形相似（实词、成语）","id":"1外形相似实词成语"},{"level":3,"text":"（2）意义相似（实词、成语）","id":"2意义相似实词成语"},{"level":3,"text":"（3）性质相似（实词、成语）","id":"3性质相似实词成语"},{"level":2,"text":"六、做题的三种境界","id":"六做题的三种境界"},{"level":2,"text":"七、选项分组思维","id":"七选项分组思维"},{"level":2,"text":"八、正课例题精讲","id":"八正课例题精讲"},{"level":3,"text":"例题 3｜2022 四川下 · 老工业景象","id":"例题-32022-四川下-老工业景象"},{"level":3,"text":"例题 4｜2022 天津 · 马克思主义与理论创新","id":"例题-42022-天津-马克思主义与理论创新"},{"level":3,"text":"例题 5｜2025 湖南 · 衰老与精神境界","id":"例题-52025-湖南-衰老与精神境界"},{"level":3,"text":"例题 6｜2025 湖南 · 文学与彼此相知","id":"例题-62025-湖南-文学与彼此相知"},{"level":3,"text":"211 分组的特殊情况：一正一邪","id":"211-分组的特殊情况一正一邪"},{"level":3,"text":"例题 7｜自编示例 · “彩虹”无人机试飞","id":"例题-7自编示例-彩虹无人机试飞"},{"level":3,"text":"例题 8｜纪录片《苏东坡》","id":"例题-8纪录片苏东坡"},{"level":3,"text":"例题 9｜2022 四川下 · 恩格尔系数","id":"例题-92022-四川下-恩格尔系数"},{"level":3,"text":"例题 10｜2025 国考 · 《营造法式》","id":"例题-102025-国考-营造法式"},{"level":3,"text":"例题 11｜2022 国考 · 文创产品","id":"例题-112022-国考-文创产品"},{"level":3,"text":"22 分组（可能提供做题思路）","id":"22-分组可能提供做题思路"},{"level":3,"text":"例题 12｜2022 青海 · 新能源汽车","id":"例题-122022-青海-新能源汽车"},{"level":3,"text":"例题 13｜2023 广东 · 政府与市场","id":"例题-132023-广东-政府与市场"},{"level":3,"text":"例题 14｜2024 浙江 · 先秦儒学引诗叙事","id":"例题-142024-浙江-先秦儒学引诗叙事"},{"level":3,"text":"语义丰富原则","id":"语义丰富原则"},{"level":3,"text":"例题 15｜2024 陕西 · 双碳目标","id":"例题-152024-陕西-双碳目标"},{"level":3,"text":"例题 16｜2025 江苏 · 领导细胞","id":"例题-162025-江苏-领导细胞"},{"level":3,"text":"例题 17｜2025 湖南 · 屏南竹木弓箭","id":"例题-172025-湖南-屏南竹木弓箭"},{"level":3,"text":"结课答疑中出现的两道题","id":"结课答疑中出现的两道题"},{"level":3,"text":"例题 18｜答疑环节 · “死亡游戏”与生命教育","id":"例题-18答疑环节-死亡游戏与生命教育"},{"level":3,"text":"例题 19｜答疑环节 · 讲好中国故事","id":"例题-19答疑环节-讲好中国故事"},{"level":2,"text":"九、本讲方法框架总表","id":"九本讲方法框架总表"},{"level":3,"text":"9.1 主框架（老师板书 + PPT 逐字）","id":"91-主框架老师板书-ppt-逐字"},{"level":3,"text":"9.2 三大工具速查","id":"92-三大工具速查"},{"level":3,"text":"9.3 做题三境界","id":"93-做题三境界"},{"level":2,"text":"十、词语 / 成语积累表","id":"十词语-成语积累表"},{"level":3,"text":"10.1 文段有对应 · 高频干扰词","id":"101-文段有对应-高频干扰词"},{"level":3,"text":"10.2 选项有共性 · 三种“相似”示例词","id":"102-选项有共性-三种相似示例词"},{"level":3,"text":"10.3 分组与词义辨析高频词","id":"103-分组与词义辨析高频词"},{"level":3,"text":"10.4 分组例题重点词","id":"104-分组例题重点词"},{"level":3,"text":"10.5 22 分组与语义丰富重点词","id":"105-22-分组与语义丰富重点词"},{"level":3,"text":"10.6 语义丰富示例词（PPT 原文）","id":"106-语义丰富示例词ppt-原文"},{"level":2,"text":"十一、易错点与陷阱清单","id":"十一易错点与陷阱清单"},{"level":2,"text":"十二、老师金句","id":"十二老师金句"},{"level":2,"text":"十三、结课答疑与考前叮嘱","id":"十三结课答疑与考前叮嘱"},{"level":3,"text":"老师的考前叮嘱（口播整理）","id":"老师的考前叮嘱口播整理"},{"level":2,"text":"十四、课程收尾与后续安排","id":"十四课程收尾与后续安排"}]}]}]};</script>
<script>/* ============================================================

(function (global) {
