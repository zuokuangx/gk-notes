<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识库</title>
<style>
/* ============================================================
 * styles.css — 判断推理知识库
 * ============================================================ */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f7f8fa;
  --panel-3: #f0f2f5;
  --text: #1f2328;
  --text-2: #4a5260;
  --muted: #7b838f;
  --line: #e4e7eb;
  --line-2: #eef0f3;
  --accent: #2f6bff;
  --accent-soft: #eaf0ff;
  --accent-text: #1d4ed8;
  --mark: #ffe58f;
  --code-fg: #9a3412;
  --ok: #16a34a;
  --shadow: 0 6px 24px rgba(20, 26, 40, .08);
  --shadow-lg: 0 18px 50px rgba(20, 26, 40, .16);
  --radius: 10px;
  --header-h: 58px;
}
body.dark {
  --bg: #14161a;
  --panel: #1b1e23;
  --panel-2: #21252b;
  --panel-3: #262b32;
  --text: #e7e9ed;
  --text-2: #c2c8d1;
  --muted: #8b939f;
  --line: #2b3138;
  --line-2: #23282e;
  --accent: #6d9bff;
  --accent-soft: #1b2740;
  --accent-text: #8fb4ff;
  --mark: #6b5a10;
  --code-fg: #ffb08a;
  --shadow: 0 6px 24px rgba(0, 0, 0, .4);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

/* ================= 顶栏 ================= */
#topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
#brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 0 0 auto; }
#brand .logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #7aa2ff);
  color: #fff; font-weight: 800; font-size: 16px;
  display: grid; place-items: center; letter-spacing: .04em;
}
#brand .brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
#brand .brand-txt b { font-size: 14.5px; }
#brand .brand-txt span { font-size: 11.5px; color: var(--muted); }

.searchbox { position: relative; flex: 1 1 auto; max-width: 560px; margin: 0 auto; }
.searchbox input {
  width: 100%; height: 36px; padding: 0 34px 0 34px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-2); color: var(--text); font-size: 13.5px; outline: none;
}
.searchbox input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox::before {
  content: ""; position: absolute; left: 13px; top: 50%; width: 13px; height: 13px;
  margin-top: -8px; border: 1.8px solid var(--muted); border-radius: 50%;
}
.searchbox::after {
  content: ""; position: absolute; left: 24px; top: 50%; width: 6px; height: 1.8px;
  margin-top: 4px; background: var(--muted); transform: rotate(45deg);
}
#qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--panel-3); color: var(--muted); font-size: 13px; line-height: 1;
}
#qclear:hover { background: var(--line); color: var(--text); }

.topbtns { display: flex; gap: 8px; flex: 0 0 auto; }
.topbtns button {
  height: 32px; padding: 0 12px; font-size: 12.5px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text-2);
}
.topbtns button:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
#btnMenu { display: none; }
#btnMenu {
  width: 34px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text-2); cursor: pointer; font-size: 15px; line-height: 1;
}

/* ================= 布局 ================= */
#layout { display: grid; grid-template-columns: 292px minmax(0, 1fr) 216px; align-items: start; }
#sidebar {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 8px 0 40px;
}
#main { padding: 26px 44px 60px; min-width: 0; }
#toc {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-left: 1px solid var(--line);
  padding: 18px 10px 40px;
}

/* ================= 侧栏目录 ================= */
.grp-h {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 8px; border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  text-align: left;
}
.grp-h:hover { color: var(--text); }
.grp-n { flex: 1; }
.grp-c {
  font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  background: var(--panel-3); color: var(--muted);
}
.chev {
  width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg) translate(-1px, -1px); transition: transform .18s; flex: 0 0 auto;
}
.grp.closed .chev { transform: rotate(-45deg); }
.grp.closed .grp-b { display: none; }
.grp-b { padding-bottom: 4px; }
.item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 16px; margin: 0 6px 1px;
  border-radius: 7px; font-size: 13.5px; color: var(--text); text-decoration: none;
}
.item:hover { background: var(--panel-2); text-decoration: none; }
.item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.pn { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 30px; letter-spacing: .02em; }
.item.active .pn { color: var(--accent); }
.nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm { font-size: 10.5px; color: var(--muted); opacity: .8; font-variant-numeric: tabular-nums; }
.item.is-read .pn::after { content: "✓"; color: var(--ok); margin-left: 3px; font-size: 10px; }

/* ================= 右侧大纲 ================= */
.toc-title { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding: 0 8px 8px; }
.toc-i {
  display: block; font-size: 12.5px; line-height: 1.5; color: var(--muted);
  padding: 4px 8px; border-left: 2px solid transparent; border-radius: 0 5px 5px 0;
}
.toc-i.lv3 { padding-left: 17px; font-size: 12px; }
.toc-i:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
.toc-i.active { color: var(--accent-text); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* ================= 正文头部 ================= */
.doc-inner { max-width: 880px; }
.doc-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 22px; }
.dh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text);
  font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.dh-lect, .dh-dur { font-size: 12px; color: var(--muted); }
.dh-link { font-size: 12px; margin-left: auto; }
.dh-title { margin: 0 0 6px; font-size: 25px; line-height: 1.35; letter-spacing: -.01em; }
.dh-theme {
  margin: 0; font-size: 13px; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ================= Markdown ================= */
.md-body > *:first-child { margin-top: 0; }
.md-p { margin: 11px 0; }
.md-h { scroll-margin-top: 84px; }
.md-h1 { font-size: 22px; margin: 26px 0 12px; }
.md-h2 {
  font-size: 20px; margin: 34px 0 14px; padding-left: 11px;
  border-left: 4px solid var(--accent); line-height: 1.4;
}
.md-h3 { font-size: 16.5px; margin: 24px 0 10px; color: var(--accent-text); }
.md-h3::before { content: "▍"; opacity: .45; margin-right: 4px; font-size: 13px; }
.md-h4 { font-size: 15px; margin: 18px 0 8px; color: var(--text-2); }
.md-h5, .md-h6 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); }
.md-hr { border: none; border-top: 1px dashed var(--line); margin: 28px 0; }

.md-quote {
  margin: 14px 0; padding: 11px 16px;
  background: var(--panel-2); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: var(--text-2);
}
.md-quote .md-p { margin: 6px 0; }
.md-quote > *:first-child { margin-top: 0; }
.md-quote > *:last-child { margin-bottom: 0; }
.md-quote .md-quote { background: var(--panel-3); border-left-color: var(--muted); }

.md-list { margin: 10px 0; padding-left: 22px; }
.md-list .md-list { margin: 6px 0; }
.md-li { margin: 5px 0; }
.md-li::marker { color: var(--accent); }
.md-list ol, .md-list ul { padding-left: 20px; }

.md-inline-code {
  background: var(--panel-3); color: var(--code-fg);
  padding: 1.5px 5px; border-radius: 5px;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  word-break: break-word;
}
.md-pre {
  position: relative; margin: 14px 0; padding: 13px 15px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); overflow-x: auto;
}
.md-pre code {
  font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  color: var(--text-2); white-space: pre;
}
.md-pre-lang {
  position: absolute; top: 6px; right: 10px; font-size: 10.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
}

/* 表格 */
.table-wrap {
  margin: 15px 0; overflow-x: auto;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
}
.md-table { width: 100%; border-collapse: collapse; font-size: 13.8px; }
.md-table th {
  background: var(--panel-2); text-align: left; font-weight: 700;
  padding: 9px 12px; border-bottom: 2px solid var(--line); white-space: nowrap;
  position: sticky; top: 0;
}
.md-table td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-2);
  vertical-align: top; line-height: 1.68;
}
.md-table tbody tr:last-child td { border-bottom: none; }
.md-table tbody tr:hover td { background: var(--panel-2); }
.md-table td:first-child { white-space: nowrap; }
.md-table td:first-child:has(> br) { white-space: normal; }

/* 本讲完整目录折叠 */
.toc-toggle {
  display: inline-flex; align-items: center; gap: 7px;
  margin: 6px 0 10px; padding: 6px 13px; cursor: pointer;
  border: 1px dashed var(--line); border-radius: 999px;
  background: var(--panel); color: var(--text-2); font-size: 12.5px;
}
.toc-toggle:hover { border-color: var(--accent); color: var(--accent-text); }
.toc-toggle .chev { transform: rotate(-45deg); }
.toc-toggle.open .chev { transform: rotate(45deg) translate(-1px, -1px); }
.native-toc {
  border-left: 3px solid var(--line); padding-left: 14px; margin-bottom: 22px;
  background: var(--panel-2); border-radius: 0 8px 8px 0; padding: 10px 14px;
}
.native-toc .md-list { columns: 2; column-gap: 22px; }
.native-toc .md-li { break-inside: avoid; font-size: 13px; }

mark.hl { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

/* ================= 翻页 ================= */
#pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; max-width: 880px; }
.pg {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 14px; background: var(--panel); display: block; text-decoration: none;
}
.pg:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
.pg span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.pg b { font-size: 13.5px; color: var(--text); font-weight: 600; }
.pg.next { text-align: right; }
.pg.disabled { border: none; background: none; }

/* ================= 首页 ================= */
body.is-home #toc { display: none; }
body.is-home #layout { grid-template-columns: 292px minmax(0, 1fr); }
.home { max-width: 900px; }
.hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--panel));
  border: 1px solid var(--line); border-radius: 16px;
  padding: 30px 32px; margin-bottom: 26px;
}
.hero h1 { margin: 0 0 8px; font-size: 29px; letter-spacing: -.02em; }
.hero-sub { margin: 0 0 20px; color: var(--text-2); font-size: 14px; }
.stats { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 18px; }
.stat b { display: block; font-size: 24px; line-height: 1.2; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.btn {
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 16px;
  background: var(--panel); color: var(--text); font-size: 13.5px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.hero-src { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.kbd-tips { font-size: 12.5px; color: var(--muted); margin-bottom: 26px; }
kbd {
  display: inline-block; padding: 1px 6px; margin: 0 1px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
  background: var(--panel); font: 11.5px ui-monospace, monospace; color: var(--text-2);
}
.ghome { margin-bottom: 26px; }
.ghome h2 {
  display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 0 0 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.ghome h2 i {
  font-style: normal; font-size: 12px; font-weight: 800; color: var(--accent-text);
  background: var(--accent-soft); border-radius: 6px; padding: 2px 7px;
}
.ghome h2 em { margin-left: auto; font-style: normal; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--panel); font-size: 13px; color: var(--text); text-decoration: none;
}
.chip:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
.chip .cp { font-size: 11px; font-weight: 700; color: var(--accent-text); }
.chip .cd { font-size: 10.5px; color: var(--muted); }
.chip.is-read { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.howto { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text-2); }
.howto li { margin: 6px 0; }

/* ================= 搜索结果面板 ================= */
#results {
  position: fixed; top: var(--header-h); left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 100px);
  overflow-y: auto; z-index: 60;
  background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 14px 14px;
  box-shadow: var(--shadow-lg); padding: 12px 14px 16px;
}
.rs-head { font-size: 12.5px; color: var(--muted); padding: 4px 4px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rs-head b { color: var(--accent-text); font-size: 14px; }
.rs-q { color: var(--text); font-weight: 600; }
.rs-x {
  margin-left: auto; border: none; background: var(--panel-3); color: var(--muted);
  border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
}
.rs-item { border-top: 1px solid var(--line-2); padding: 10px 4px; }
.rs-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); text-decoration: none; }
.rs-title b { font-weight: 600; }
.rs-g { font-size: 11px; color: var(--muted); }
.rs-c { margin-left: auto; font-size: 11px; color: var(--accent-text); font-weight: 700; }
.rs-snips { margin: 6px 0 0 4px; }
.rs-snip {
  font-size: 12.5px; color: var(--text-2); line-height: 1.6;
  padding: 5px 10px; margin: 4px 0; cursor: pointer;
  background: var(--panel-2); border-left: 2px solid var(--line); border-radius: 0 6px 6px 0;
}
.rs-snip:hover { background: var(--accent-soft); border-left-color: var(--accent); }
.rs-empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13.5px; }

/* ================= 响应式 ================= */
@media (max-width: 1280px) {
  #layout { grid-template-columns: 276px minmax(0, 1fr); }
  #toc { display: none; }
  body.is-home #layout { grid-template-columns: 276px minmax(0, 1fr); }
}
@media (max-width: 900px) {
  #layout, body.is-home #layout { grid-template-columns: minmax(0, 1fr); }
  #sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: 282px; z-index: 55;
    transform: translateX(-104%); transition: transform .22s; box-shadow: var(--shadow-lg);
  }
  body.drawer #sidebar { transform: none; }
  #btnMenu { display: inline-block; }
  #main { padding: 20px 18px 60px; }
  .native-toc .md-list { columns: 1; }
  .dh-title { font-size: 21px; }
  #brand .brand-txt { display: none; }
}

/* ================= 打印 ================= */
@media print {
  #topbar, #sidebar, #toc, #pager, #results, .toc-toggle { display: none !important; }
  #layout { display: block; }
  #main { padding: 0; }
  body { background: #fff; font-size: 12px; }
  .table-wrap { break-inside: avoid; border-color: #ccc; }
  .md-table th { position: static; }
  .md-h2 { break-after: avoid; }
  a { color: #000; }
}

</style>
</head>
<body>

<header id="topbar">
  <button id="btnMenu" title="目录">☰</button>
  <div id="brand">
    <div class="logo">库</div>
    <div class="brand-txt"><b id="brandTitle">知识库</b><span id="brandSub"></span></div>
  </div>
  <div class="searchbox">
    <input id="q" placeholder="搜索全部笔记…  按 / 或 Ctrl+K" autocomplete="off" spellcheck="false">
    <button id="qclear" title="清空">×</button>
  </div>
  <div class="topbtns">
    <button id="btnHome" title="返回总览">总览</button>
    <button id="btnExpand" title="展开 / 收起全部模块">展开目录</button>
    <button id="btnPrint" title="打印 / 导出 PDF">打印</button>
    <button id="btnTheme" title="切换明暗">深色</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar"><div id="nav"></div></aside>
  <main id="main">
    <article id="doc"></article>
    <div id="pager"></div>
  </main>
  <nav id="toc"><div class="toc-title">本篇目录</div><div id="tocbody"></div></nav>

 课程安排总表\n\n| 讲次 | 直播日期 | 模块 | 主题方向 | 题量与时长 |\n| --- | --- | --- | --- | --- |\n| 1 | 1 月 28 日 | 中心理解 | 中心理解题的核心思路与技法 | 每节课 10 题左右，1.5 小时以内 |\n| 2 | 1 月 29 日 | 中心理解 | 中心理解题首句与例子的认知 | 每节课 10 题左右，1.5 小时以内 |\n| 3 | 1 月 30 日 | 中心理解 | 中心理解题对策文段解题思路 | 每节课 10 题左右，1.5 小时以内 |\n| 4 | 1 月 31 日 | 中心理解 | 中心理解题转折文段因果文段 | 每节课 10 题左右，1.5 小时以内 |\n| 5 | 2 月 1 日 | 中心理解 | 晦涩文段和细节题的解题思路 | 每节课 10 题左右，1.5 小时以内 |\n| 6 | 2 月 2 日 | 语句表达 | 语句填空与接语选择解题思路 | 每节课 10 题左右，1.5 小时以内 |\n| / | 2 月 3 日 | / | 休息 | / |\n| 7 | 2 月 4 日 | 语句表达 | 语句排序题的两原则与三步骤 | 每节课 10 题左右，1.5 小时以内 |\n| 8 | 2 月 5 日 | 逻辑填空 | 逻辑填空核心思路与句内呼应 | 每节课 10 题左右，1.5 小时以内 |\n| 9 | 2 月 6 日 | 逻辑填空 | 逻辑填空并列关系考点大总结 | 每节课 10 题左右，1.5 小时以内 |\n| 10 | 2 月 7 日 | 逻辑填空 | 逻辑填空题中心化与空际关联 | 每节课 10 题左右，1.5 小时以内 |\n| 11 | 2 月 8 日 | 逻辑填空 | 词语辨析相对性和多空入手点 | 每节课 10 题左右，1.5 小时以内 |\n| 12 | 2 月 9 日 | 逻辑填空 | 出题角度看逻辑填空选项设置 | 每节课 10 题左右，1.5 小时以内 |\n\n### 时长与题量原则\n\n> 每节课尽量控制在 **1.5 小时以内**，题量约为 **10 题左右**，追求短小精悍，减少备考压力。\n\n---\n\n## 二、本课程的三大作用\n\nPPT 板书：\n\n> **三大作用**\n> 一、认识题型的本质\n> 二、学习好用的技巧\n> 三、统一同学的思想\n\n### （一）认识题型的本质\n\nPPT 核心观点：\n\n> **课程千千万，特别是言语，容易感到迷茫：该不该学，对不对？**\n>\n> **言语应该达到什么水平、应该怎么走；判断言语课程，为己所用。**\n>\n> **认识言语本质，绝对正确。**\n\n老师展开说明：\n\n1. **为什么学本质？** 本质是“绝对正确的东西”，看似虚，但能提供正确目标：言语到底该达到什么水平、应该怎么走。\n2. **建立评判依据：** 知道方向后，就不会乱；也能以此判断市面上其他讲解哪些有道理、可借鉴，哪些值得商榷。\n3. **底层通了，技巧才能快：** 就像练“九阳神功”，掌握底层原理后，再学什么技巧都会更快。\n4. **三类题型的本质：**\n   - **中心理解题**：本质在于理解 **句子与句子的关系**，要学会“庖丁解牛”。\n   - **接语选择题**：答案构成是 **“文段提及的核心话题 + ……”**（先找核心话题 → 先做一遍中心理解，再将文……）。\n   - **细节判断题**：本质在于 **判断对错 & 有无**。\n   - **逻辑填空题**：\n     - 考文段意思分析：把握文段，以及横线和文段之间的 **逻辑关系**，这是逻辑填空的本质。\n     - 考对词语的多角度理解：考察区分词语的角度，如 **基本释义、搭配对象、程度轻重、感情色彩、词义侧重** 等。\n\n> ⭐ 老师原话：本质是绝对正确的东西；知道了方向，具体怎么走就不会乱。\n\n### （二）学习好用的技巧\n\nPPT 核心观点：\n\n> **临近考试不能全虚。**\n\n老师说明：课程不仅讲“虚”的本质，也会针对实际做题中的痛点、难点给出解释和解决办法，例如：\n\n- 中心理解中 **首句的句子与话题的关系**；\n- 对策文段 **到底该抓什么主题词**；\n- 出现 **宏观对策 + 后面更具体的对策** 时，谁更重要；\n- 遇到 **晦涩难懂的文段** 该怎么解决；\n- 逻辑填空中 **空与空的关联性**、多空题 **先从哪空入手**。\n\nPPT 上同步出现的技巧预告板书：\n\n**思维提升①：**\n> 首句的**句子**可能并不重要（前文引入），但是首句引出的**话题**可能很重要。\n> 联想：做排序题的时候，哪些句子适合作为首句？\n\n**思维提升②：**\n> 对策类文段选项应该抓的主题词——**对策（做什么）** & **对象（谁去做，为了谁做）**：\n\n**思维提升③：**\n> 对策之后可能出现更加具体的对策，此时是前面的对策重要还是后面的对策重要？\n\n**（八）晦涩文段 - 总结（省流版）**\n> 晦涩文段的常见表述形式：\n> ① 拥有较为晦涩的词汇；\n> ② 表达较为宽泛不通俗；\n\n**（七）多空题入手的建议**\n> 多空题不知道从哪空入手？\n> 三条建议：\n> （本集 PPT 中未展开具体三条，仅作后续课程预告）\n\n**题干中可能存在空与空的关联性**\n> 考点：除了横线与文段的对应之外\n> ① 常见与转折文段与并列文段，……（画面右侧文字被截断）\n> ② 祈使句文段，也较为常见：要……（画面右侧文字被截断）\n> ③ 意思通常具有相近，或相反的关……（画面右侧文字被截断）\n\n### （三）统一同学的思想\n\n老师说明：后续还会有刷题等其他课程，如果讲法与大家之前听到的有出入，可能造成沟通成本。因此本系列课先把基本思想统一，让后续听课更顺畅。\n\n核心统一思想预告：\n\n- 中心理解题主要讲 **“框架三步走”**；\n- 逻辑填空题主要讲 **围绕语境分析 + 词的辨析** 来寻找线索、辨析词语；\n- 排序题通过 **“两大原则、三个步骤”** 讲清楚入手方法。\n\n---\n\n## 三、课程方法论预告\n\n### 1. 中心理解题：“3 步走”\n\nPPT 板书：\n\n> **中心理解解题思路：“3 步走”**\n> ① 通读全文，弄清脉络；寻找重点（中心句）。\n\n老师提示：三步走框架会在后续正课中系统展开。\n\n### 2. 逻辑填空题：语境分析 + 词的辨析\n\nPPT 逻辑框架图：\n\n```\n逻辑填空题\n├── 思路\n│   ├── 根据文段提示信息\n│   └── 选项寻找合适的词语\n├── 语境分析\n│   └── 结合\n└── 词的辨析\n```\n\nPPT 思考题：\n\n> 是否存在逻辑填空题，只考察词的辨析 / 语境分析？\n\n### 3. 语句排序题：两大原则 + 三个步骤\n\nPPT 板书：\n\n> **五、语句排序题**\n> ① 排序题“两大原则”\n> 指在实际做排序题之前首先要明白的做题基本规则和思维\n> ② 排序题“三个步骤”\n\n老师提示：排序题的“老大难”是不知道从何入手，课程会用两大原则、三个步骤讲清楚。\n\n### 4. 其他技巧预告\n\n根据本集口述与 PPT，后续将展开的技巧方向包括：\n\n| 技巧方向 | 预告要点 |\n| --- | --- |\n| 首句判断 | 首句的“句子”可忽略，但首句引出的“话题”要重视 |\n| 对策类文段 | 抓“对策（做什么）+ 对象（谁去做、为了谁做）” |\n| 宏观 vs 具体对策 | 对策之后出现更具体对策时，判断何者更重要 |\n| 晦涩文段 | 识别晦涩词汇、宽泛不通俗的表述形式 |\n| 多空题入手 | 观察空与空的关联性，判断从哪一空优先突破 |\n\n---\n\n## 四、学习建议与理念\n\n1. **题是手段，方法思想是本**\n   > 大家想刷题以后多的是；希望大家没有太大压力地跟完这个系列课程，有所成长。\n\n2. **短小精悍，控制时长**\n   > 每节课尽量控制在直播时长 1.5 小时以内，题量约 10 题左右；临近考试、时间宝贵，课程设计上追求精悍。\n\n3. **无压力跟课**\n   > 开开心心过大年，不要有太大压力。\n\n4. **言语灵活但有迹可循**\n   > 这个科目确实非常灵活，但也是有迹可循的。\n\n5. **信任与共同进步**\n   > 希望不辜负大家对我的信任，我们一起加油，一起进步。\n\n---\n\n## ⭐ 老师金句\n\n> **路走对了，就不怕遥远。**\n>\n> **一“箭”上岸，不辜负每一次相遇。**\n>\n> **题是手段，搞懂方法思想是本。**\n>\n> **1 月 28 日晚上 7 点 38 分，一起上岸吧～**\n\n---\n\n## 本集要点速览\n\n| 板块 | 核心内容 |\n| --- | --- |\n| 课程安排 | 1.28–2.9 共 12 讲，2.3 休息；每晚 19:38；5 讲中心理解 + 2 讲语句表达 + 5 讲逻辑填空 |\n| 时长题量 | 每讲约 10 题、控制在 1.5 小时以内 |\n| 三大作用 | 认识题型本质、学习好用技巧、统一同学思想 |\n| 题型本质 ）——\"说在课前\"**\n> 1. 本系列课程目的：提高题型认知 + 重难点点拨\n> 2. 每节课程不长，老师尽量节奏慢一些，同学们互相理解，和谐课堂\n> 3. 不要一味拔高听课的作用——老师只是大家旅程中的引路人\n> 4. 刷而不思则罔，思而不刷则殆——思考 & 刷题二者不可偏废\n> 5. 不要忽视阅读理解能力的培养——平时注意提高阅读能力\n> 6. 讲完会有唠嗑答疑时间，后期有回放上传\n>\n> **感谢大家支持！**\n\n讲师口播要点：\n\n| 条目 | 老师原话要点 |\n| --- | --- |\n| 课程目的 | 第一，对每一个题型的**本质**做讲解；第二，对大家纠结、容易产生疑问的地方做说明 |\n| 节奏 | 一节课控制在**一个半小时以内**，本来准备说一小时，怕拖堂留了提前量；节奏慢一些，照顾基础不一致的同学 |\n| 学以致用 | \"讲完之后我希望大家**学以致用，所谓知行合一**\"——学完去刷题、去看、去用，验证老师说得有没有道理 |\n| 刷思统一 | \"刷而不思则罔，思而不刷则殆\"，听课、刷题、思考一定是一个统一的过程 |\n| 阅读能力 | 言语理解这一科**建立在阅读能力的基础上**，\"你的阅读能力提高，言语能力提高，水涨船高\" |\n| 答疑 | 讲完正课之后有唠嗑答疑时间 |\n\n---\n\n## 一、正确认识言语理解与表达各题型的思路逻辑\n\n### （一）整个言语就是\"两个题型\"\n\n讲师第一步先破除\"言语题型特别多\"的错觉：\n\n> \"在老师看来，他就考察**两个题型**，或者说**一个半**吧——第一个是**中心理解**，第二个是关于逻辑填空当中**词的辨析**。\"\n\n论证路径（讲师逐个题型拆解）：\n\n```\n片段阅读\n  中心理解  → 本身就是核心\n  细节判断  → 主要就是查找信息（较小题型，不必多说）\n  标题填入  → 填一个标题、把握主旨 → 本质还是中心理解\n              \"标题就是中心，中心就是标题\"\n  词句理解  → 理解某个词/某句话在文段中的意思，必须先懂整段\n              → 是中心理解或细节判断的变形\n  ⇒ 片段阅读本质上除了细节差点意思，考的就是中心理解\n\n语句表达\n  语句填空  → 要抓住横线的核心意思，必须把握上下文 → 总体理解\n  接语选择  → 后文不能偏题、要与前文保持一致 → 中心理解的变形\n  语句排序  → 考的是句子和句子的关系 → 根儿上仍是中心理解\n  ⇒ 第二个模块本质上也在考察中心理解\n\n逻辑填空\n  ＝ 文段 + 选项（文段的理解 + 选项词语的理解）\n  文段的理解本质上又是什么？又是中心理解！\n  只不过在文段理解的基础上，还要考察词语的积累\n  ⇒ 所以这个题型难，难在\"既考察中心理解，又考察词语的理解\"\n\n篇章阅读 → 各个题型的综合\n```\n\n> ⭐ **结论**：虽然言语理解表达题型非常非常多，但根本上就两个题型——**第一个是中心理解，第二个是逻辑填空当中词的辨析**。\n\n> ⭐ 为什么要花大力气解决中心理解？——\"**因为这个题型学好了，后面的题型一通百通**\"，所以课程设置上前五节都是中心理解。\n\n### （二）各题型本质对照表（PPT 板书逐字）\n\n> **PPT 板书（逐字）——（一）正确认识言语理解与表达各题型的思路逻辑**\n\n```\n言语理解\n├── 片段阅读\n│   ├── 中心理解题        （红色星标 · 全课重心）\n│   ├── 细节判断题\n│   ├── 标题填入题        中心理解题的变型    概括全文\n│   └── 词句理解题        中心理解与细节判断的变型   理解特定词语、句子\n├── 语句表达\n│   ├── 语句填空题        中心理解题的变型    抓住横线句子的核心内容\n│   ├── 接语选择题        中心理解题的变型    后文不能偏离核心话题\n│   └── 语句排序题        中心理解题的变型    要对句子之间的关系充分把握\n├── 逻辑填空\n│   ├── 语境分析          中心理解题的变型    理解文段的意思\n│   └── 词的辨析          考察词语的积累\n└── 篇章阅读              各个题型的综合\n```\n\n### （三）课程安排表（PPT 板书逐字）\n\n> **PPT 板书（逐字）——课程安排表**\n\n| 节数 | 直播日期 | 直播时间 | 直播主题 | 时长 |\n| --- | --- | --- | --- | --- |\n| 1 | 1月28日 | 晚上 19:38 | 中心理解题的核心思路与技法 | 1.5 小时以内 |\n| 2 | 1月29日 | 晚上 19:38 | 中心理解题首句与例子的认知 | 1.5 小时以内 |\n| 3 | 1月30日 | 晚上 19:38 | 中心理解题对策文段解题思路 | 1.5 小时以内 |\n| 4 | 1月31日 | 晚上 19:38 | 中心理解题转折文段因果文段 | 1.5 小时以内 |\n| 5 | 2月1日 | 晚上 19:38 | 晦涩文段和细节题的解题思路 | 1.5 小时以内 |\n| 6 | 2月2日 | 晚上 19:38 | 语句填空与接语选择题解题思路 | 1.5 小时以内 |\n| / | 2月3日 | / | 休息 | —— |\n| 7 | 2月4日 | 晚上 19:38 | 语句排序题的两原则与三步骤 | 1.5 小时以内 |\n| 8 | 2月5日 | 晚上 19:38 | 逻辑填空核心思路与句内呼应 | 1.5 小时以内 |\n| 9 | 2月6日 | 晚上 19:38 | 逻辑填空并列关系考点大总结 | 1.5 小时以内 |\n| 10 | 2月7日 | 晚上 19:38 | 逻辑填空题中心化与呼应关联 | 1.5 小时以内 |\n| 11 | 2月8日 | 晚上 19:38 | 词语辨析相对性和多空入手点 | 1.5 小时以内 |\n| 12 | 2月9日 | 晚上 19:38 | 出题角度看逻辑填空选项设置 | 1.5 小时以内 |\n\n> 讲师指着表格强调：**\"前 5 节都是中心理解\"**，这是有原因的，所以不要怕老师只用两节课讲语句表达——\"你前面学好了，后面自然就好了\"。\n\n---\n\n## 二、中心理解题解题思路：\"3 步走\"总纲\n\n> **PPT 板书（逐字）——（二）正确认识中心理解题的思路逻辑**\n>\n> **中心理解解题思路：\"3 步走\"**\n>\n> **① 通读全文，弄清脉络，寻找重点（中心句）**\n> **② 同义替换**\n> **③ 排除干扰项**\n\n讲师口播：\n\n> \"这个中心理解题就是**三步**，所有的考点都在围绕这三步展开，我们今天就把它解决掉。\"\n> \"今天所有内容你都可以忘掉，但这三点你得记住。\"\n\n三步走的逻辑关系：\n\n```\n第一步 找重点        —— 这么多句子里，找出最重要的那一句（中心句 / 主旨句）\n第二步 同义替换      —— 找到重点后，在选项里找与中心句最接近的那个\n第三步 排除干扰项    —— 对比择优，把不该选的按类型排掉\n（注意：二、三两步很多时候是在一起用的）\n```\n\n> ⭐ 老师提醒：市面上绝大多数机构的教学体系，关于中心理解**只讲了\"怎么找\"，只有第一步**，没有第二步第三步。本课三步走是完整闭环。\n\n---\n\n## 第一步：寻找重点\n\n**基本定义**：中心理解题是在一个文段中，虽然有很多话，但很多时候**某一句话就能概括中心**，我们把它叫做**中心句**或者**主旨句**（本质是一样的）。所以第一步就是在这么多句子当中，找到那个**最重要的那一个**。\n\n> 打比方说：**\"句子很多，我要找到那个最重要的那一个。\"**\n\n### 1. 判断句子轻重的\"七大关系\"（PPT 板书逐字）\n\n> **PPT 板书（逐字）**\n>\n> 第一步：寻找重点，**从众多句子中，找到最重要的那一个，积累几组句子与句子的关系**\n>\n> | 前半 | 后半 | 关系名 |\n> | --- | --- | --- |\n> | 转折前的内容 | **转折后的内容** | 转折关系 |\n> | 结论前的内容 | **结论后的内容** | 因果关系 |\n> | 与对策相比的其他内容 | **对策的内容** | 必要条件关系（对策） |\n> | 详细、具体的解释展开内容 | **明确、直接的观点论点** | 解释关系 |\n> | 非强调的内容 | **强调的内容** | 强调关系 |\n> | 前文出现的老话题 | **后文出现的新话题** | 新旧关系 |\n> | 不属于上述任何形式，且没有明显侧重点 | | 并列关系 |\n\n> 讲师提示：**\"打绿色的就是不重要的，打红色就是重要的。\"** PPT 上红色字＝重点，绿色字＝非重点。\n\n老师逐一举例（原话）：\n\n| 关系 | 老师的例子 | 结论 |\n| --- | --- | --- |\n| ① 转折关系 | \"虽然我生病了，但是我还在上学\" | 转折后\"上学\"重要 |\n| ② 因果关系 | \"我开始学英语，后来学化学，然后又学数学，最后发现物理才是我最喜欢的\" | 结果（物理）重要；**结果比原因重要** |\n| ③ 必要条件（对策） | \"我不舒服，我需要吃一些药\" | 吃药（对策）比不舒服（问题）重要；**怎么解决问题更重要** |\n| ④ 解释关系 | \"老李是一位慈祥的老人，每天都会笑嘻嘻地跟同学打招呼\" | \"慈祥\"（观点/论点）重要；**论点比论据重要**。这是言语的基础 |\n| ⑤ 强调关系 | \"我们班同学大家都非常不错，特别**是小红**\"／\"大家的成绩都很好，特别是小明\" | 表强调之后的内容更重要 |\n| ⑥ 新旧关系 | \"过去的深圳一片萧条，今天的深圳非常繁华\" | 新的重要 |\n| ⑦ 并列关系 | \"小黄喜欢华山，小红喜欢黄山，小明喜欢嵩山\" | 三座山都重要，**没有明显侧重点**，不好区分主次 |\n\n> ⭐ \"我们整个的中心理解的文段，文段的内容最为常见的就是这七大关系。你在做的时候，你就想想这个文段符合哪种关系就可以了。\"\n\n### 2. 思维提升①：庖丁解牛——例 1（2026 四川·莫高窟）\n\n> **PPT 板书（逐字）**\n>\n> **思维提升①：中心理解题的关键，在于句子与句子的关系，要学会庖丁解牛**\n\n讲师口播：\n\n> \"作为一个高手，你要达到一个目的，就是什么？就是要学会**庖丁解牛**。在一个文段，在你看来它已经不是一个单纯的文段了，它在你眼里看来，它是**一个一个的结构**，明白吗？**提出问题，分析问题，解决问题**。我们古人说**目无全牛**嘛，就它在你看来不是一头完整的牛，它是一段儿一段的。这就是对这个文段理解清楚了。\"\n\n#### 例题 1｜2026 · 四川 · 莫高窟考古与中华文化的包容性\n\n**【题干原文】**\n\n> 【例1】（2026 四川）在莫高窟考古中，可以找到很多古印度、叙利亚地区传来的文化元素。有一些宗教最初是相互排斥的，但在斗争之后逐渐融合，也就和平共处、一起发展。比如在汉代至魏晋南北朝初期，佛教与中国传统道教、儒家思想都有过斗争，在斗争中也都在改变，在融合中中国化，在中国化中创新，在创新中中国化。佛教中国化的创新形成即是典型。**这些发现，足以证明中华文化的包容性，它没有排斥外来文化，而是不断将其吸收进来。** 在敦煌石窟里，可以看到中国传统神仙思想文化与外来佛教文化共同融合，最后形成包容性比较强的敦煌文化。\n>\n> **这段文字主要：**\n\n**【选项原文】**\n\n> A. 介绍近些年来莫高窟考古成果的多样性\n> B. 概述佛教在汉代传入中国后的嬗变过程\n> C. 解释历史上外来宗教在中国的发展情况\n> D. 说明中华传统文化具有包容性和创新性\n\n**【答案】** ✅ D（画面手写批注\"**选 D**\"，老师口播\"跟这句话最像……中华文明包容\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 分层 | 按\"举例 / 观点 / 举例\"把文段劈成三块 | 前面一堆（佛道儒斗争融合、佛教中国化）→ 中间一句 → 后面一堆（敦煌石窟） |\n| 2 判关系 | 中间句与前后是什么关系 | 前面是对后面的解释，后面是对前面的总结结论 → **解释关系** |\n| 3 定中心句 | 解释关系取\"观点\"那一句 | \"这些发现，足以证明中华文化的包容性，它没有排斥外来文化，而是不断将其吸收进来。\"（**总结，提出观点**） |\n| 4 看后半 | 后半段有没有换新话题 | 虽又提到敦煌石窟，但依然在说\"共同融合\"，**观点没有变** → 依然是解释关系 |\n| 5 认结构 | 用结构术语表达 | **分—总—分结构**，中间那句话是重点 |\n\n**【板书标注（PPT 上的红字批注）】**\n\n```\n例1 文段分层（PPT 红字批注）：\n  ┌ 第一层（举例）：……在斗争中也都在改变，在融合中中国化……\n  │                       佛教中国化的创新形成即是典型。 （举例子）\n  ├ 第二层（观点）：这些发现，足以证明中华文化的包容性……\n  │                       它没有排斥外来文化，而是不断将其吸收进来。（总结，提出观点）\n  └ 第三层（继续举例）：在敦煌石窟里，可以看到……共同融合……\n                          最后形成包容性比较强的敦煌文化。（继续举例）\n```\n\n**【逐项解析】**\n\n- **A 项**：非重点。讲的是\"莫高窟考古成果的多样性\"，属于**举例部分**（前面那一堆具体史实），不是中心句。\n- **B 项**：非重点。佛教传入后的嬗变过程同样是**举例子**（\"佛教中国化的创新形成即是典型\"），是为论证观点服务的。\n- **C 项**：非重点。外来宗教在中国的发展情况，也停留在\"举例/解释\"层面。\n- **D 项**：✅ 正确。与中心句\"中华文化的包容性，它没有排斥外来文化，而是不断将其吸收进来\"最接近。\n\n**【本题要点】**\n\n> ⭐ 本步**不要求做题，只要求找到那句话**——\"你至于选答案选哪个，那是另外一回事儿，那是第二步和第三步。我们现在只讲第一步。\"\n> ⭐ 只要把中心句找到了，选答案就很自然——\"哪个选项跟这句话最像？中华文明包容，那不就 D 地（就是了）？\"\n> ⭐ 高手读文段的标志：看到的是\"分—总—分\"这样的**骨架**，而不是一堆字。\n\n### 3. 句子与句子关系的常见作用（PPT 板书逐字）\n\n> **PPT 板书（逐字）——进阶内容**\n>\n> **分析句子和句子之间的关系，就互相的关系而言，常见的作用有以下情况：**\n\n| 作用类型 | PPT 原文说明 |\n| --- | --- |\n| 背景引入 | \"随着\"\"近年来\"\"在……大环境下\"或时代环境等 |\n| 引出话题 | 引出某个话题目前的现状，或援引其他人的观点 |\n| 提出观点 | 观点句，即一些重点词语引导的句子，或文段论述的中心 |\n| 提出问题 | 消极表述通常可以看作提出问题，如\"不足\"\"有害\"\"缺陷\" |\n| 分析问题 | 可以是问题形成的原因，也可以是对问题的危害详细展开或具体说明 |\n| 解决问题 | 即对策标志词引导的句子 |\n| 意义效果 | 对策带来的好处，也可以理解为正面论证 |\n| 举例论证 | \"比如\"\"就像\"\"典型\"或一些具体的人名地名等 |\n| 反面论证 | 如果不采取对策会带来哪些危害 |\n| 解释说明 | 范围较广，一切和观点相关的部分都可当作解释，可以是解释原因，也可以是具体展开 |\n| 补充说明 | 对文段的某个话题或对象进行补充，通常不影响文段的完整性 |\n\n老师提示：这套 PPT「比较进阶」——**\"其实很多题就是这些东西的排列组合。\"**\n\n> ⭐ \"你们学言语的时候，就要把原文翻译成这样的文段。所以在你的脑海里面，它就应该是一个一个的**筋骨和结构**。这就是最精华，这就是本质。\"\n\n### 4. 思维提升②：到底如何正确看待关联词\n\n> **PPT 板书（逐字）**\n>\n> **思维提升②：句子与句子的关系，并不完全由关联词决定，关联词的存在与否不能完全构成我们选择的依据。**\n>\n> **例：思考，下列例句删去关联词是否影响句意？**\n>\n> ```\n> 今天身体不是很舒服，（但是）我还是按时赴约了\n> 今天身体不是很舒服，（所以）我没有按时赴约\n> 今天身体不是很舒服，我（应该）吃一些药休息一会\n> ```\n\n讲师用这三句反问：删掉\"但是\"\"所以\"\"应该\"，**句意本质上是都不受影响的**——\"是不是有一种思维打开的感觉？\"\n\n> **PPT 板书（逐字）——例：\"而\"的用法**\n>\n> ```\n> ① 学而不思则罔      → 表转折\n> ② 学而时习之        → 表顺承（学习，然后不断地练习）\n> ③ 会议的意义重大而深远 → 表同时（重大，同时也很深远）\n> ④ 青出于蓝而胜于蓝   → 表递进关系\n> ```\n\n> 讲师结论：**\"这个'而'字有那么重要吗？它没那么重要，因为它有很多的意义。\"**\n\n> ⭐ **老师对关联词的态度**：\n> \"关联词应该是大家作为一个**初学者学习的一根拐杖**。你刚开始学走路，抓一些关联词可以，没问题；但你不能老抓它——你活了二十岁了，还去拄拐杖呢？不合适。\"\n> \"**它是表象，它是表象，句子的内容才是本质。**\"\n\n### 5. 思维提升③：部分 ≠ 整体，必须看完整\n\n> **PPT 板书（逐字）**\n>\n> **思维提升③：中心理解题看的是句子与句子的关系，所以部分内容的关联关系，并不一定代表整体，要看完整**\n>\n> **本质原因：一个关联词只能保证管辖所在的句子，但不一定管辖整个文段**\n> **（画面右侧批注：文段看完整）**\n\n#### 举例 1：这次考试老师特别提到过（课堂示例）\n\n> **PPT 板书（逐字）**\n>\n> **举例1：这次考试老师特别提到过，看似很新颖，其实难度不会特别高。很多同学对此［表示，难道］是不是就可以放松警惕了？之前就有同学因为这个原因，没有认真准备，因此没考好，所以我们还是要认真对待。**\n>\n> （注：中段文字被讲师身体遮挡，按画面可辨字迹与口播补出）\n\n老师演示推理：\n\n```\n第一层（读到\"难度不会特别高\"）：以为重点是\"难度不高\"\n     ↓ 于是某选项 B 对应\"难度不高\" → 选了 B → 错了\n第二层（再往下读）：\"难道就可以放松警惕了吗？……因此没考好，\n                    所以我们还是要认真对待\" —— 有问有答，相当于对策结构\n     ↓ 文章重点从\"难度不高\"变成了\"认真对待\"\n第三层（读薄一半再比）：前半重点＝难度不高；后半重点＝认真对待\n     ↓ 两者本质上是什么关系？ —— 转折关系（\"虽然难度不高，但是我们还是要认真对待\"）\n     ↓ 当然说\"对策\"也可以，因为很多时候是综合在一起的（既有转折又有对策）\n```\n\n> ⭐ \"所以大家**一定要看完整**啊！\"\n\n#### 例 2（2021 四川·现代化）\n\n> **PPT 板书（逐字）**\n>\n> **例2（2021 四川）** 现代化是一个世界性课题。在世界多极化、经济全球化的时代背景下，各国现代化进程色彩纷呈而又相容相通，汇聚为一曲多元与共识的交响。从历史经验与价值取向上看，现代化应体现民族性与世界性、多元与共识的统一。从这个角度理解和推进现代化，须摒弃自我中心、唯我独尊的立场和心态。**遗憾的是，当今西方一些思想家在这个问题上是存在偏颇的。** 对于他们而言，西方理性主义是理解和诠释现代化问题的基本立场。**这样一种理论定位容易导致\"西方中心主义\"，我们应有这种文化警醒。**\n>\n> **这段文字的中心句是：**\n>\n> A. 现代化应体现民族性与世界性、多元与共识的统一\n> B. 当今西方一些思想家在这个问题上是存在偏颇的\n> C. 我们应有这种文化警醒\n> D. （画面下方被视频裁切，无法辨识）\n\n**【答案】** ✅ C（画面红笔圈画 C）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 分层 | 前段讲背景与观点 | 现代化是多元的、色彩纷呈的；从这个角度推演现代化，**要摒弃唯我独尊的立场和心态**（对策） |\n| 2 转折 | 出现\"遗憾的是\"＝\"但是\" | 当今西方一些思想家在这个问题上**存在偏颇**，**要摒弃自我为中心** |\n| 3 只看一半会怎样 | 到此停笔选 B | **原题没读完 → 选 B 就错了** |\n| 4 读完全文 | 后文\"这样一种理论定位容易导致'西方中心主义'\" | **\"这样一种理论\"指代的就是前面那些偏颇想法**，全文落到\"我们应有这种文化警醒\" |\n| 5 判关系 | 七大关系里的哪一个？ | **对策关系** → 答案不再是 B，而是 **C** |\n\n**【逐项解析】**\n\n- **A 项**：非重点。这是\"从历史经验与价值取向上看\"引出的观点，位于转折之前。\n- **B 项**：非重点 / 前半截。是\"遗憾的是\"转折后的那句，看似重点，但**文段没有到此结束**，后文又把关系改成了对策。\n- **C 项**：✅ 正确。文段最终落脚在对策——\"我们应有这种文化警醒\"。\n- **D 项**：画面未显示（视频画幅裁切），不做判定。\n\n**【本题要点】**\n\n> ⭐ \"所以大家发现没有，一（个）文段能不能只是读一半儿？**不行，那你就得整体思维，你要看完整。**\"\n> ⭐ 这就是第一步想传达的核心观点：**一个关联词只能保证管辖所在的句子，但不一定管辖整个文段。**\n\n### 6. 第一步总结（PPT 板书逐字）\n\n> **PPT 板书（逐字）**\n>\n> **中心理解解题思路：\"3 步走\"**\n>\n> **第一步：寻找重点总结**\n> 基本思路：一个文章有很多句子，找重点可以理解为，我们要找到最重要的那一个\n>\n> **思维提升①：** 怎么判断谁重要，谁不重要，重点是看句子之间的逻辑关系，有一些基本的排序原则（p10）\n>\n> **思维提升②：** 对于关联词的态度，应该把它作为学习的\"拐杖\"，而非真理，它只是提示作用，不能依赖\n>\n> **思维提升③：** 要把文段当做一个整体来处理。可能某句话单独看很重要，放在整体又不重要（要看完整）\n\n（注：思维提升②③句末文字被画面右缘裁切，按可辨字迹与讲师口播补全。）\n\n---\n\n## 第二步：同义替换\n\n> **PPT 板书（逐字）**\n>\n> **第二步：已经找到重点，需要在选项中选择一个选项匹配——同义替换**\n>\n> ```\n> A.XXXXXXXXXXXXXXXXXXXXXXXXX,XXXXXXXXXXXXXXXXXXXXX。\n> B.XXXXXXXXXXXXXXXXXXXXX,XXXXXXXXXXXXXXXXXXXX。\n> C.XXXXXXXXXXXXXXXXXXXXXXXXXXX,XXXXXXXXXXXXXXXXX.XXXXXXXXXXXXX。\n> D.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX,XXXXX。\n> ```\n>\n> **同义替换的基本原则就是选项中寻找一个和文段重点部分最接近的选项**\n\n> 讲师口播：\"什么叫同义替换呢？**你要找一个最像的选项**，找一个跟文段最接近的选项，看一下哪个选项跟文段的重点部分最接近。\"\n\n### 1. 思维提升④：不求完全一致，大意一致即可\n\n> **PPT 板书（逐字）**\n>\n> **思维提升④：大多数情况下，不能要求中心句与正确答案的表述完全一致，大意一致即可**\n\n#### 例 3（26 国考行政执法回忆·程序文本）\n\n**【题干原文】**\n\n> 【例3】（26 国考行政执法回忆）民主真正落地，需基于明确、可操作的行动指南，行动指南要依托科学规范的程序文本来呈现，在这个意义上，**科学民主的程序文本是民主得以从理念转化为现实不可或缺的载体，也是维护民主之实的基本保证。**（提出观点）一方面，可借鉴他山之石，一定程度地吸纳其他国家较为成熟的，基于民主、公正、法治原则所建立起的议事规则；另一方面，须扎根实际，不能将程序简单视为政治制度的\"飞来峰\"，照抄照搬或简而化之，需要注重历史与现实、理论和实践、形式和内容有机统一，找到正确的方式方法。此外，还应构建长效化的程序完善机制，不断夯实程序之基。\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. （画面下方被视频裁切，无法辨识）\n> B. 以程序内容之基筑牢实质民主之实\n> C. （画面下方被视频裁切，无法辨识）\n> D. （画面下方被视频裁切，无法辨识）\n\n> 说明：本题 PPT 只显示到 B 项即被视频画幅裁断，老师本环节**不要求做题、也不给答案**，只借它讲\"结构\"。\n\n**【本题用途】** 用来理解\"同义替换 ≠ 一字不差\"以及\"总分结构\"。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找结构 | 先判整体结构 | 前一句是**结论/观点**：科学民主的程序文本是不可或缺的载体、基本保证 → \"一定要搞好**程序文本**这个玩意儿\" |\n| 2 看后文 | 后面的\"一方面／另一方面／此外\"在干什么 | 都在讲**怎么抓程序**：吸纳规则（程序）→ 程序不能当\"飞来峰\" → 构建长效化程序机制 |\n| 3 验核心 | 后面有没有脱离\"程序重要\"这个核心 | **没有脱离** → 后三段是**解释**，不是并列 |\n| 4 定结构 | 结论 | **总分结构**，或叫**观点 + 解释说明** |\n\n**【本题要点】**\n\n> ⭐ 有同学答\"并列结构\"，老师当场纠偏：\"**现在改还来得及。**\"\n> ——\"并列只是针对**后半部分**。如果这个题你没有前面这一堆，从'一方面'开始，那确实表并列；但**这整体的一个并列，是为了论证前面的东西**，所以它是**总分**。\"\n> ⭐ \"大家记住，**转折结论是干嘛的？是解决第一步的。**\"\n> ⭐ 有同学问\"能不能把后面当重点\"——老师答：\"**你这个问题太进阶了，这是后面的内容。** 文段有的时候要和选项一起看，单独看文段它可能有多种解释，你先把它理解为总分结构就可以了。\"\n\n### 2. 思维提升⑤：抓大放小，\"大\"就是主题词\n\n> **PPT 板书（逐字）**\n>\n> **思维提升⑤：同义替换需要做到所谓\"抓大放小\"\"先大后小\"，\"大\"就是主题词，是整个文段的最核心内容；\"小\"就是表达形式，遣词用句等非核心内容**\n\n老师用\"招聘言语老师\"打比方讲\"完美主义做不好题\"：\n\n> \"我这十个人当中我会言语，这个时候有的 HR 就不同意了，说张老师这个人**身高不太行**，身高一米七四点五，我们要找一米七八以上的，影响形象；还有人说老师你**处女座**，性格有点难搞……**你管这些那些的呢？招了十个人，就我会言语，你管我身高怎么样、颜值怎么样、什么星座的？** 这就是抓大放小——**别的有一些缺点没关系，你重点抓住就可以了。**\"\n\n> ⭐ \"很多同学为什么中心理解做不好？就是因为他是一个**完美主义**。\"\n\n### 3. 关于主题词（PPT 板书逐字）\n\n> **PPT 板书（逐字）**\n>\n> **关于主题词**\n>\n> **1. 定义：文段围绕的核心话题，通常是核心动名词（主谓宾）**\n>\n> **2. 主题词判断方法：**\n> **（1）中心句围绕的核心话题，一般前有引入或后有解释说明**\n> 　　--- 主题词频次可能较低，是中心句的核心动名词（主谓宾）\n> **（2）每句话都围绕的相同话题**\n> 　　--- 主题词频次相对较高，当文段结构中心句不好把握，可以以此入手\n> **（3）很多时候，首句引出的话题，即为文段主题（之一）**\n> 　　--- 可以通过排序题理解：先引出话题，后文才能围绕主题展开\n>\n> **判断方法：以（1）为主，综合（2）（3）来判断**\n\n老师对\"（1）中心句的核心话题\"的原理讲解：\n\n> 例（桥梁 / 网络系统）：\n> \"大多数桥梁是向公众开放的。尽管一些桥梁要收取通行费，但是对于绝大多数人来说并不禁止通行。**然而，多数网络系统对公众却是不开放的。** 原因显而易见——网络系统是用来储存和处理个人通信、财务数据、医疗记录和商业机密等敏感信息的，这些信息都跟个人和机构密切相关。\"\n>\n> 分析：前两句是**转折关系**（桥梁开放 vs 网络不开放），后两句是**解释关系**（\"原因显而易见\"），所以中间那句是**复合句中心**——\"前有引入，后有解释\"。核心动名词＝**网络 + 不开放**。\n\n> ⭐ 原理：\"**从文段 → 中心句 → 主题词，其实就是你对重点不断凝练的一个过程。** 文段这么长 → 变成一句话 → 变成几个词，相当于你的理解越来越深刻。所以中心句通常有核心动名词，找到中心句，再从中找核心的主题词。\"\n\n#### 例 4（26 国考行政执法回忆·生态保护修复工程）\n\n**【题干原文】**\n\n> 【例4】（26 国考行政执法回忆）生态保护修复工程的人工修复工程投资和建设周期一般为 3 到 5 年，高寒地区生态群落完成自然演替往往需要几十年乃至更长的时间。以拉萨河流域山水林田湖草生态保护修复试点工程为例，在工程验收时植被覆盖度显著增加，但群落自然演替尚未完成，生态系统的可持续稳定性仍然较低。由于现有生态修复工程的相关投资多用于工程实施周期内，工程周期结束后大多需要依靠高寒生态系统自然恢复，在管护力度不足的情况下，生态系统容易发生再次退化，威胁生态修复工程效益的长期可持续性。\n>\n> **这段文字意在说明，高寒地区生态系统修复工程要：**\n\n**【选项原文】**\n\n> A. 保障后期管护与可持续性\n> B. 充分发挥系统的内在恢复能力\n> C. 科学规划投资和建设周期\n> D. 强调验收流程的规范性与科学性\n\n**【答案】** ✅ A（老师口播\"我告诉大家答案，就选 A\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓首句 | 用判断方法（3）——首句引出的话题 | 第一句讲\"生态保护修复工程……3 到 5 年\"\"高寒地区……需要几十年乃至更长时间\" |\n| 2 提炼感觉 | 首句读完后得出什么信息 | **这个工程时间很长**——\"不是你建完了就没了，后面还需要几十年乃至更长时间\" |\n| 3 定基调 | 开篇定基调 | 我讨论的就是\"这个系统需要的时间长\" |\n| 4 匹选项 | 四个选项谁能接住\"时间长\" | \"后期可持续性\"＝建完不是就没了，后面还要几十年 → **A** |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。\"后期管护与可持续性\"直接对应首句定下的\"时间长、建完不是就没了\"的基调。\n- **B 项**：干扰项。\"充分发挥系统的内在恢复能力\"，虽然文段提到\"依靠高寒生态系统自然恢复\"，但这只是过程描述，不是首句定下的讨论基调。\n- **C 项**：干扰项。虽然\"周期\"二字出现在文段，但**\"周期\"本身不含长短**——\"太阳东升西落不也是周期吗？\"C 的\"周期\"与\"时间长\"没有必然联系。\n- **D 项**：干扰项。对应\"工程验收时植被覆盖度显著增加\"这一细节，属于过程描述而非核心话题。\n\n**【本题要点】**\n\n> ⭐ \"你看一个文段**开篇就定了一个基调**——我讨论的就是这个系统它需要的时间长。你说我后面干嘛？那我**大概率**（但不是一定）还是会围绕这个来讲。\"\n> ⭐ **\"首句引出的话题，很可能就是文段讨论的主题。所以你不要忽略首句。\"**\n> ⭐ 老师补充：\"我这不是正常的做题方法，我只是告诉你们一个点。\"\n\n**【三个找主题词的方法】**\n\n```\n① 中心句围绕的核心话题  ← 以此为主\n② 每句话都围绕的相同话题（高频词）\n③ 首句引出的话题\n判断方法：以（1）为主，综合（2）（3）来判断（这是最保险的）\n```\n\n老师对\"用哪一个\"的回答：\n\n> \"我说实话，**老师做题的时候也有的时候看感觉**。比如你文段读完之后发现好多同样的一个词，那你大概率也会认为它是主题词。所以我个人的想法就是**以一为主**——你还是以找到中心句为主，你反正是要找的嘛；如果它不是并列的话，反正你要找的嘛。**以一为主，综合二三**，就是综合高频词和首句来判断。\"\n\n**【4. 解题方法：为什么这么重视主题词】**\n\n> **PPT 板书（逐字）**\n>\n> **3. 解题方法（我们为什么这么重视主题词）：正确答案需包含文段主题词（同义替换的依据）**\n>\n> ```\n> ②同义替换\n>    ├── 找到和中心句最\"像\"的选项 ──┬── 不求文段和中心句\"一模一样\"\n>    │                                └── 抓\"大\"放\"小\"，先\"大\"后\"小\"\n>    └── 正确答案需要包含主题词\n> ```\n\n> **PPT 板书（逐字）**\n>\n> **4. 具体如何操作：一般情况下，先找到文段重点部分，然后提炼其中最核心的词汇——这是同义替换的依据，来到选项，先找有主题词的选项验证，没问题直接锁定，其它排除**\n\n> ⭐ **\"主题词是第二步的\"**——老师专门纠一个高频疑问：\n> \"你们想想这个问题：**主题词和转折、主题词和观点、主题词和结论是什么关系？** 你但凡问出这种问题，就说明你完全不知道你为什么要学主题词。**转折、结论是解决第一步的；主题词是第二步的**——是当你重点找到之后，我来到选项，我选哪一个呢？**是帮你找答案的。**\"\n\n### 4. 思维提升⑥：主题词优先原词，但可适当扩大/缩小/替换\n\n> **PPT 板书（逐字）**\n>\n> **思维提升⑥：主题词优先考虑原词，但并非一定是文段原词，且适当扩大、缩小、替换并非一定错误，一定要对比择优！**\n>\n> **Eg：文化——文明，技术——技艺，音乐——艺术**\n\n老师讲解（含课堂示例）：\n\n- 主题词优先考虑**原词**：\"比如主题词是言语，你尽量选言语。\"\n- 但也\"凡事都有意外\"，可能没有原词 → **适当扩大、缩小、替换，也并非一定错，你得对比择优**。\n- 举例：\"文段的意思是**小明很帅**（有点帅），那我能不能说**小明颜值高**？可以啊，**同类替换**嘛。\"\n- 但\"不能太离谱\"：**文化→文明**（区别没那么大）；**技术→技艺**（也还行）；**音乐→艺术**（这个就稍微有点大了，需要斟酌——但凡有音乐就不选艺术，万一没有，选个艺术也可以）。\n- 特别提示：\"一些**专业名词**（如'全国统一大市场'这种）一般不能换。\"\n\n> **PPT 板书（逐字）——课堂示例**\n\n> 一般来说，残破的物体总是不美的。但偏偏有那么些**古建筑、雕塑乃至日用品**的残体被认为是美的，这又该如何解释呢？可能因为……\n>\n> A. 如何欣赏古建筑\n> B. \"废墟\"何以是美的\n> C. 何为建筑的残缺之美\n> D. \"世界遗产\"的评选标准\n\n**【答案】** ✅ B\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找主题词 | 抓文段的核心字 | 主题词就是**\"残\"**——\"残体\"\"残破\" |\n| 2 先排无主题词 | 谁没有\"残\"字先干掉 | **A（古建筑）**、**D（世界遗产）**先排除 |\n| 3 剩下 B、C 都比 | B 有\"废墟\"，C 有\"残\"，怎么选 | \"废墟\"打了引号——**废墟不就是它不完整吗？不也残吗？就是换了一个表达方式。** |\n| 4 比问法 | \"何以\"与\"何为\"的区别 | **何以＝解释原因（为什么）**；**何为＝是什么（什么是）** |\n| 5 回文段定问法 | 文段在讲\"什么是\"还是\"为什么\" | 文段明说\"这又该如何解释呢？可能因为……\" → 讲的是**为什么** → 选 **B** |\n\n**【逐项解析】**\n\n- **A 项**：无主题词（缺\"残\"），排除。\n- **B 项**：✅ 正确。有主题词（\"废墟\"＝残缺），且\"何以\"＝为什么，与文段\"该如何解释呢？可能因为……\"匹配。\n- **C 项**：有主题词但**表达不对**，\"何为\"是\"是什么\"，不是\"为什么\"；且\"建筑\"也片面了（文段还有雕塑、日用品），不过这个问题比较小。\n- **D 项**：无主题词，排除。\n\n**【本题要点】**\n\n> ⭐ \"根据主题词排掉 A、D，然后 B、C 都有主题词，**C 的表达不对、B 的表达没问题**——虽然有一些替换，但可以选。\"\n> ⭐ \"**你但凡有音乐就不选艺术，你万一非没有的话，选个艺术也可以**。\"\n\n### 5. 第二步总结（PPT 板书逐字）\n\n> **PPT 板书（逐字）**\n>\n> **中心理解解题思路：\"3 步走\"**\n>\n> **第二步：同义替换**\n> 基本思路：从选项中寻找一个和中心句最像的选项\n>\n> **思维提升①：** 不能要求中心句与正确答案的表述完全一致，大意一致即可\n>\n> **思维提升②：** 同义替换需要做到所谓\"抓大放小\"\"先大后小\"。\"大\"就是主题词，是整个文段的最核心内容，是我们判断正确答案的基本依据；有核心主题词会出现，依据三种主题词法\n>\n> **思维提升③：** 主题词优先考虑原词，但并非一定是文段原词，可能会适当扩大、缩小、替换\n\n---\n\n## 第三步：排除干扰项\n\n> **PPT 板书（逐字）**\n>\n> **第三步：排除干扰选项**\n>\n> ```\n> A.XXXXXXXXXXXXXXXXXX,XXXXXX。\n> B.XXXXXXXXXXXXX,XXXXXXXXXXXX。\n> C.XXXXXXXXXXXXX,XXXXXX。\n> D.XXXXXXXXXXXXX,XXXXXXXXXXXXXX。\n> ```\n\n> ⭐ 老师提醒：**\"其实很多时候二三是在一起的\"**——比如你发现只有 B 有主题词、ACD 没有，那就直接选 B 了。\n> 那为什么还要单独讲第三步？因为**\"对比择优\"这句话只给了口号，没给方法论**：\n> \"老师你让我对比，我怎么对比呢？我就觉得 C 好。你也不告诉我怎么对比——**方法论没有给齐**。\"\n\n### 1. 思维提升⑦：选项\"对比择优\"的分类依据（PPT 板书逐字）\n\n> **PPT 板书（逐字）**\n>\n> **思维提升⑦：中心理解排除选项所谓\"对比择优\"，有何依据？**\n\n```\n③ 排除干扰项\n├── 类型1  一定不能选 ──── 与文意相悖、文段未提及、无关对策\n├── 类型2  基本不能选\n│    ├── 不含/缺少文段主题词\n│    ├── 非中心句（分述句）同义替换（非重点）\n│    │    └── 分述句\n│    │         ├── （中心前）转折前、结论前、程度词前\n│    │         ├── （分述句）定义引入、背景引入、对比引入、问题引入\n│    │         └── （中心后）解释、举例、意义、数据、多角度论述\n│    └── 并列文段中表述片面\n└── 类型3  对比可次选\n     ├── 主题词范围适当扩大/缩小/替换\n     └── 不明确选项：含有否定词、较为笼统\n```\n\n老师三类定性：\n\n| 类型 | 定性 | 老师原话 |\n| --- | --- | --- |\n| 类型1 一定不能选 | **原则性问题，死罪** | \"你就说再多也没用，**死罪**\"（与文意相悖＝我说你是好人，你说我是坏人；文段未提及＝压根没说的，**无中生有**；无关对策＝我饿了你说让我跑步去，跑步解决不了饿的问题） |\n| 类型2 基本不能选 | **话不能说死，百分之九十不能选，有例外但不多** | \"基本什么意思？**有例外，但不多。** 所以你当它不能选也可以，除非遇到极个别情况。\" |\n| 类型3 对比可次选 | **可以选，但没那么完美** | \"就跟张老师一样，也能做你们老师，虽然不完美，也能做老师——这种感觉叫**机智的对比**。\" |\n\n### 2. 类型① 一定不能选\n\n> **PPT 板书（逐字）**\n>\n> **类型①：一定不能选（与文意相悖、无关对策、文段未提及）**\n\n#### 例 5（2023 国考·民间文学艺术作品的保护）\n\n**【题干原文】**\n\n> 【例5】（2023 国考）我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在 1990 年著作权法规定保护办法另行规定。**但时隔三十余年，保护办法仍未出台。** 尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨论，提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立法，但因质疑声音过大而夭折。\n>\n> **作者可能赞同下列哪一观点？**\n\n**【选项原文】**\n\n> A. 通过公法保护民间文学艺术作品是最可行的路径\n> B. 围绕民间文学艺术作品法律保护的争议流于表面\n> C. 国家版权局应就民间文学艺术保护倾听多方面意见\n> D. 民间文学艺术作品法律保护缺位状态亟需改变\n\n**【答案】** ✅ D（老师口播\"虽然这个题答案选 D\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一次转折 | 找第一个\"但\" | \"但时隔三十余年，**保护办法仍未出台**\"（第一个转折提出观点） |\n| 2 问结构 | 第一个转折重要，还是第二个转折重要？ | **一定是第一个**——从文段**整体结构**上看 |\n| 3 验后文 | 后面的\"尽管如此……与此同时……\"有没有脱离这句话 | \"因质疑声音过大而夭折\"**再次论证了\"没出台\"** → 依然是这句话 |\n| 4 定结构 | 结论 | **总分结构**，核心就是\"**没出台**\" |\n| 5 排除 | A、B、C 属于哪一类 | 三个选项全是**原则性问题（一定不能选）** |\n| 6 引出特例 | 为什么答案能选 D | 这是**\"文段提问题，选项提对策\"**的特殊情况，第三节课会讲：你既然没有出台，我就\"尽快出台、急需改变\" |\n\n**【逐项解析】**\n\n- **A 项**：**无中生有**（绝对表述）。文段只说\"有个别学者主张通过公法加以保护\"，并**没有说\"最可行\"**。\"你顶多说张老师是优秀的老师，你不能说某人是最优秀的——这叫绝对，或者叫无中生有，没这么说。\"\n- **B 项**：**与文意相悖**。文段说学界提出了多种方案，涉及\"权利客体、权利主体、权利内容、保护期限、权利限制\"，探讨得非常深刻——\"**我们俩已经把十年后的事情都想清楚了，结果你还说流于表面**，这不打我脸嘛。\"\n- **C 项**：**无关对策**。\"因质疑声音过大而夭折\"——\"**我但凡独裁一点、专制一点，我早过了**，我不就是因为很民主吗？我不就是因为听外界声音听得太多了才夭折了吗？你还让我倾听多方意见，这解决不了问题。\"\n- **D 项**：✅ 正确。对应\"保护办法仍未出台\"的问题状态——缺位状态亟需改变。\n\n**【本题要点】**\n\n> ⭐ \"你看这是个很典型的题目，**三个选项一个都不能选，一定不能选**。所以你哪怕不能直接选 D，**你排除也是选 D**。\"\n> ⭐ \"这个题有一个特殊情况，叫做**文段提问题，选项提对策**，我们在第三节课会讲到。\"\n> ⭐ \"我就问大家一个问题：从**文段整体的结构**来讲，是第一个转折重要，还是第二个转折更重要？**一定是第一个。** 因为你只是转了前面这一句话，**你整体的观点还是为了论证前面这句话而已**。\"\n\n### 3. 类型② 基本不能选\n\n> **PPT 板书（逐字）**\n>\n> **类型②：基本不能选**\n> **（不含/缺少主题，解释、举例说明的部分等，极少数可能作为答案）**\n\n#### 例 6（2024 天津·阿希从众实验）\n\n**【题干原文】**\n\n> 【例6】（2024 天津）社会心理学先驱所罗门·阿希通过一系列著名的阿希从众实验证明，即使是判断\"三段线段谁最长\"这样的简单任务，人们的回答也会受到他人的强烈影响，**进而在并无胁迫的情况下服从某种群体规范。**（观点）\n>\n> 人们为什么会服从规范？这可能源于群体中的个人害怕被其他成员视为\"**一匹离群之马（越轨者）**\"而遭到孤立。人的这种顺从行为在动物身上也有所体现。比较心理学家**本内特·加利夫**的研究发现，**挪威大鼠**会忽视自己的偏好转而选择同伴偏爱的食物味道，尽管有时这种味道并不怎么好。\n>\n> **这段话所要表达的中心思想是：**\n\n**【选项原文】**\n\n> A. 人的行为活动容易受到他人的影响\n> B. 离群之马都会遭到社会群体的孤立\n> C. 人们在无胁迫下往往会服从群体规范\n> D. 挪威大鼠会忽视自己偏好而选择顺从\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓关联词\"进而\" | \"进而\"表结论 | 结论＝\"**在没有胁迫的情况下，服从群体规范**\"（人话：我没逼你，你也这样做了） |\n| 2 分层 | 后面这一堆有没有脱离这句话 | ①\"人们为什么会服从规范？可能源于……害怕被孤立\"→ **解释原因** ②\"人的这种行为在动物身上也能看见，比如挪威大鼠\"→ **举例子** |\n| 3 定关系 | 七大关系里属哪个 | 解释关系 / 因果关系 → **解释部分不重要**；举例本质也是解释 → **依然不重要** |\n| 4 定结构 | 结论 | **总分结构**，主要是解释\"在没有胁迫的情况下服从群体规范\" |\n| 5 匹选项 | 哪个跟中心句最像 | \"又要没有胁迫，又要服从，那不就是 **C** 吗？\" |\n\n**【逐项解析】**\n\n- **A 项**：**非重点 + 不明确**。\"进而\"之前和之后是**因果关系，因果关系前面不重要**；而且\"容易受到他人影响\"**不明确**——是怎么个影响法？**你到底是威胁的还是没威胁？**（别人是没威胁的）把它理解为递进也可以，那强调的部分（后半句）才是重点。\n- **B 项**：**非重点**。\"离群之马\"出现在**解释部分**（\"可能源于……害怕被视为一匹离群之马\"），是原因，不是中心。（而且\"都会\"过于绝对）\n- **C 项**：✅ 正确。\"人们在无胁迫下往往会服从群体规范\"（\"往往\"＝大概率，不是绝对；**百分之百才叫绝对**）。\n- **D 项**：**非重点（例子）**。\"挪威大鼠\"是**举例**——\"大鼠它有引出新话题吗？它的内核有没有变？人服从群体规范，这个挪威大鼠忽视自己喜欢吃花生米，看见别人吃大米那我也去吃大米，**这不就是服从群体吗？**\"\n\n**【本题要点】**\n\n> ⭐ **本题的真正价值在于用 A、B、D 三个错项总结出规律**：老师让全班一起说出三个字——\n> **\"非重点\"**：\"A 项的受到他人影响在这儿，B 项的离群之马在这儿，D 项的挪威大鼠在这儿——你跟我中心句不太匹配，你不是重点内容，**你要么是结论前，要么是解释，要么是例子，这叫非重点。**\"\n> ⭐ 课堂口诀（老师举\"举手提问\"的例子）：\"你们小时候老师说大家有问题吗？有问题的请举手。你有问题，但你看别人都没有举手，**你也不举手**——这就叫人在没有（胁迫的）情况下，**因为要服从群体规范**。\"\n\n#### 例 7（2024 青海·干细胞抗衰老）\n\n> 老师提示：这道题是**\"基本不能选的说明还是有的时候可以选\"**的**反例**，专门放进来讲例外情况。\n\n**【题干原文】**\n\n> 【例7】（2024 青海）从古至今，人类不断梦想着能够找到长生不老的\"灵丹妙药\"，但目前也未有合法批准的能够真正用于抵抗衰老的药物或疗法。以干细胞抗衰老疗法为例，由于具有自我更新和多向分化能力，干细胞在组织再生等领域具有良好的应用潜力，也被宣传为延缓衰老的有力武器。然而科研人员提醒，虽然干细胞疗法在动物实验中表现出一定的治疗效果，但对于人类而言，还需要等待临床试验结果。衰老是机体在整体水平上的系统性变化，不是单一组织的变化，干细胞目前还无法同时针对所有组织细胞发挥治疗或起到延缓衰老的作用。\n>\n> **这段文字意在强调：**\n\n**【选项原文】**\n\n> A. 采用干细胞疗法抵抗衰老大有可为\n> B. 干细胞治疗用于延缓衰老还有许多问题\n> C. 从古到今人类为延缓衰老进行了各种尝试\n> D. 当前干细胞的抗衰老研究仍处于实验探索阶段\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 判结构 | 先不看选项，只看文段 | 有\"**以干细胞抗衰老疗法为例**\"这个明显提示 → 后面全是干细胞 → **妥妥的总分结构** |\n| 2 找中心句 | 转折结构，\"然而\"之后 | \"**目前也未有合法批准的能够真正用于抵抗衰老的药物或疗法**\"（转折后提出中心） |\n| 3 常规操作 | 按道理\"非重点不能选\" | 看到干细胞（举例）应该排掉 → A、B、D 都有\"干细胞\" → 只剩 C |\n| 4 验证 C | C 能不能选？ | **不能**。C 说\"进行了各种尝试\"态度**积极**，而文段的核心是\"**没有通过批准**\"、偏消极，**从根上违背了文段意志** |\n| 5 改判 | 只能回过头比 B、D | **B 的\"有许多问题\"跟\"没有批准\"更远；D 的\"实验阶段\"跟\"没有批准\"更近**——\"什么叫没有批准？没有批准不就是实验吗？不就还在实验过程当中吗？\" |\n| 6 第二重验证 | B 与 D 之间是什么关系？ | B 和 D 是**因果关系**，B 在前加\"因为\"、D 在前加\"所以\"就豁然大明白了：**因为你还有很多问题，所以你还只是一个实验阶段** → **果（D）更重要** |\n\n**【逐项解析】**\n\n- **A 项**：\"大有可为\"与文段\"未有合法批准、还无法发挥作用\"的消极基调**相悖**，没人会选。\n- **B 项**：基本不能选的\"非重点\"（对应后文举例部分），且与中心句\"没有批准\"不如 D 接近。\n- **C 项**：**与文意相悖**。\"你在哪儿呢？你在这儿（第①②行的背景引入）\"；你的态度是积极的（各种尝试），而文段核心思想是\"你没有通过批准，你是非正式的\"——**从根上就违背了文段的意志**。\n- **D 项**：✅ 正确。由题干的**同一屏**可知，选项 D 用的是\"**当前干细胞的抗衰老研究仍处于实验探索阶段**\"，与原文\"未有合法批准的……药物或疗法\"意思相同。\n\n**【本题要点】**\n\n> ⭐ **出题人手法揭秘**：本题原文中，中心句被**拆成两半**——一半留在原文（\"没有合法批准\"\"尚未有合法批准的药物和疗法\"），一半放进正确答案（\"仍处于实验探索阶段\"），**两句话的意思本身是一样的**。\n> 老师原话：\"看到了这个出题人险恶的用心没有？**原文当中一句话，他把它拆成两半，一半留给原文，一半留给答案。但是两句话的意思本身是一样的，就是没有通过正式的批准。**\"\n> ⭐ **核心规律**：**\"例子和观点在本质上意思是一样的。\"** 例子只要能表达中心句的意思，就可以选——\"大家成绩都很好，比如小张就很好，小张作为例子论证的观点在本质上是同一个意思。\"\n> ⭐ \"这个题大家做错了没有关系，这个题就纯粹是**出题老头儿为难你们**。\"\n\n### 4. 类型③ 对比可次选\n\n> **PPT 板书（逐字）**\n>\n> **类型③：次选（主题适当变化，不明确选项，可次选）**\n\n#### 例 8（2023 山东·经典影视作品）\n\n**【题干原文】**\n\n> 【例8】（2023 山东）影视作品凝结的不只是创作者们的灵感和创意，还有时代文化形成的集体无意识的投射和缩影。（引出话题）\n>\n> 就影视作品而言，一方面，对社会文化的传承来说，经典作品承载着丰厚的文化价值，**对经典的重复呈现**既是一种文化延续，也是一种文化确认，与我国传统文化联系密切的经典影视作品尤为如此。（对经典作品的重复呈现）\n>\n> 另一方面，对影视文化的发展来说，经典作品原有版本的魅力会逐渐褪色，用新的视听技术、新的时代美学和新的演员**演绎将经典重新阐释一遍**，则是赋予这些作品与时俱进的新生命力，其本身是重塑经典甚至创造新经典的过程。（将经典重新阐释）\n>\n> **这段文字主要说明：**\n\n**【选项原文】**\n\n> A. 经典影视作品生命力的来源\n> B. 对待经典影视作品的正确态度\n> C. 经典影视作品与传统文化的关系\n> D. 新时代翻拍经典影视作品的意义\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓首句 | 首句引出话题 | 影视作品 → 主题词大概率是\"影视作品\"（但**这题没用，因为选项都有**） |\n| 2 看结构 | 一方面／另一方面是并列还是解释？ | 形式上**肯定是并列结构** |\n| 3 关键判断 | 它是在解释第一句，还是提出了新观点？ | **不是解释关系**——因为后文提到了第一句**没有提到的东西**（\"重复\"\"重新阐释\"） |\n| 4 讲原理 | 解释的前提 | \"**解释的前提是你得先把观点提出来。** 第一句话有提到'重复'的意思吗？**没有**，所以它不是解释关系，它是一个**新的观点**。\" |\n| 5 抓动宾 | 两方面共同强调对经典做什么 | 都是\"**重新**\"——\"重复呈现\"＋\"重新阐释\" → 可概括为**分总，也可理解为并列**，只要把它俩概括起来即可 |\n| 6 同义替换 | 哪个选项有\"重新\"的意思 | **翻拍**＝\"新的技术、新的时代美学、新的演员\"。\"难道不能是重播吗？可以是重播呀，但是**选项没有重播**，不管它就可以了。\" |\n\n**【逐项解析】**\n\n- **A 项**：\"生命力\"与\"重新\"**没关系** → 非重点。\n- **B 项**：**不算错，但相比 D 更不好**。\"对待经典影视作品的正确态度\"——你正确态度到底是啥？是翻拍还是不翻拍？**太大、太笼统了**，所以还不如 D。\n- **C 项**：\"与传统文化的关系\"只对应\"一方面\"的内容，**片面**，且与\"重新\"没关系 → 非重点。\n- **D 项**：✅ 正确。**\"翻拍\"就是对\"重新（重复呈现 + 重新阐释）\"的同义替换**。\n\n**【本题要点】**\n\n> ⭐ **\"主题词适当变化\"**：我不说\"重新\"，换一个词行不行？——**\"翻拍\"**。\n> ⭐ 老师现场示范\"文段与选项互证\"：有同学说\"表并列\"——老师纠正：\"**你单独看肯定是个并列，但这个并列跟前面这句话的关系不是解释关系，因为它在后面提到了一个第一句没有提到的东西。**\"\n> ⭐ \"学知识要知道你为什么学。\"\n\n#### 例 9（2024 山西县级·书法课）\n\n**【题干原文】**\n\n> 【例9】（2024 山西县级）目前很多高校针对留学生开设的书法课多被定位为汉字教学课程的辅助课程，属于对外汉语教学背景下的语言技能课的附属课程。书法教学成为汉字教学、写字的一个环节，**未能充分发挥其在文化传播中应有的作用。**（提出问题）\n>\n> 书法作为一种独立的艺术形式，不仅有助于留学生对汉字的记忆，更应承担起展示中国人特有的艺术修养和审美观念的角色。（强调书法重要性）\n>\n> **汉语国际推广视域下的书法课，应该定位为独立于语言技能课之外的中国文化艺术课［核心课程］。**（对策）\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. \"走出去\"的书法国际传播\n> B. 留学生书法课与中国文化传播\n> C. 对外汉语教学中书法的尴尬地位\n> D. 汉语国际推广视域下书法课的定位\n\n**【答案】** ✅ D\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓首句 | 首句引出话题 | 书法课 → 大概率跟书法有关（但**选项都有**，本步没用上） |\n| 2 找问题 | 消极表述＝提出问题 | \"未能充分发挥其在文化传播中应有的作用\"——**\"未能充分发挥\"六个字就是\"问题\"** |\n| 3 看重要性 | \"更有助于……更应承担起……\" | 讲重要性——**重要性讲得再多，也只是再次证明问题的严重性**：\"你既然这么重要，你还没能发挥，这肯定不行\" |\n| 4 找对策 | 尾句\"应该定位为……\" | **对策句 = 中心句** |\n| 5 定关系 | 结构 | **分总结构**，主要关系是**对策关系** |\n| 6 同义替换 | 抓核心话题 | 书法大家都有，关键是\"**应该定位**\" → 只能选 D |\n\n**【逐项解析】**\n\n- **A 项**：\"走出去的书法国际传播\"，非重点且偏离。\n- **B 项**：\"留学生书法课与中国文化传播\"——对应的是**问题部分**，不是对策。\n- **C 项**：\"尴尬地位\"——**属于问题**，问题和对策相比，**对策更重要**。\n- **D 项**：✅ 正确。抓住\"定位\"这一核心动作。\n\n**【本题要点】**\n\n> ⭐ **D 其实也不完美**——老师当场让学生评价 D：\"文章说的是'应该定位为独立于语言之外的（核心课程）'，而 D 只说了'书法课的定位'，**你到底什么定位呢？也没说完整，很模糊**。\"\n> ⭐ 但结论是：\"**人比人，选项比选项，你总比 A、B、C 离题了要好一些**，所以这种**不明确选项是可以次选的**。\"\n> ⭐ \"这种不好的选项，你不要说'老师它不明确'，它**相比于其他的已经很好了**。\"\n> ⭐ **标题就是中心理解**，本质上是一样的，不用纠结。\n\n---\n\n## 三、本讲知识总结（PPT 总结脑图逐字）\n\n> **PPT 板书（逐字）——（二）正确认识中心理解题的思路逻辑-总结**\n\n```\n中心理解题\n│\n├─ ① 通读全文，弄清脉络 寻找重点（中心句）\n│    └── 句子与句子的关系是本质 （不能过度依赖关联词）\n│         ├── 转折前的内容；转折后的内容 ──────────── 转折关系\n│         ├── 结论前的内容；结论后的内容 ──────────── 因果关系\n│         ├── 对策的内容；与对策相比的其它内容 ────── 必要条件关系（对策）\n│         ├── 明确的、直接的观点论点；详细的解释、展开的内容 ── 解释关系\n│         ├── 强调的内容；非强调的内容 ────────────── 强调关系\n│         ├── 后文出现的新话题；前文出现的老话题 ───── 新旧关系\n│         └── 不属于上述形式，句子之间无明显侧重点 ──── 并列\n│    （右侧批注：文段看完整）\n│\n├─ ② 同义替换\n│    ├── 找到和中心句最\"像\"的选项\n│    │      └── 不求文段和中心句\"一模一样\"；抓\"大\"放\"小\"，先\"大\"后\"小\"\n│    ├── 正确答案需要包含主题词（同义替换的根本依据）\n│    │      └── 主题词的判断方法：\n│    │            ① 中心句围绕的核心话题\n│    │            ② 每句话都围绕的相同话题\n│    │            ③ 首句引出的话题\n│    └── 主题词优先考虑原词，但并非一定是文段原词，可能适当扩大、缩小、替换\n│\n└─ ③ 排除干扰项\n     ├── 类型1  一定不能选 ──── 与文意相悖、文段未提及、无关对策\n     ├── 类型2  基本不能选\n     │      ├── 不含/缺少文段主题词\n     │      ├── 非中心句（分述句）同义替换（非重点）\n     │      │      └── 分述句：转折前、结论前、程度词前\n     │      │                  定义引入、背景引入、对比引入、问题引入\n     │      │                  解释、举例、意义、数据、多角度论述\n     │      └── 并列文段中表述片面\n     └── 类型3  对比可次选\n            ├── 主题词范围适当扩大/缩小/替换\n            └── 不明确选项：含有否定词、较为笼统\n```\n\n老师对这个脑图的现场解读：\n\n> \"任何东西可以忘记，**三步走不能忘**：第一步找重点，第二步替换，第三步排除干扰项。\"\n> \"在找证（重点）的时候，**句子和句子的关系是本质**，七大关系我不一一展开了——**绿色是非重点，红色是重点**。\"\n> \"同时有一个特殊情况就是**并列**，并列就是都重要，没有明显的侧重点，'一方面，另一方面'就表并列关系，**那就要注意文段看完整**。\"\n> \"第二个，同义替换，就是找和中心句最像的选项，要**抓大放小**，这个大就是**主题词**——主题词是我们的依据。\"\n> \"怎么找呢？三个方法：**中心句的核心话题、每句话的相同话题、首句的话题**。**以一为主，结合二三去判断**，而且有的时候可能并非一定是原词，可能会适当的变化。\"\n> \"第三个，干扰选项三类：**一定不能选、基本不能选和对比可次选**。我们在选项对比择优的时候就应该遵循这样原则，**先把一二尽量排掉**，如果有特殊情况咱们再特殊考虑。\"\n\n> ⭐ \"我相信把节课学完之后，你对中心理解题——包括去听其他老师的课程——就可以**'他山之石可以攻玉'**，把别的东西纳入到这个体系中来。他们讲的东西到底是**第几步**？是第一步还是第二步、第三步？有助于我补充哪个内容？就非常的清晰，**清晰成体系**。\"\n\n---\n\n## 四、中心理解三步走练习\n\n> 老师提示：**\"目的不是为了讲题，让大家明白每一个步骤的一个情况。\"**\n\n### 例 10（2024 江苏·生产性服务业）\n\n**【题干原文】**\n\n> 【例10】（2024 江苏）生产性服务业包括研发设计、信息数据、人力资源、现代物流等领域，涉及农业、工业等产业的多个环节，具有专业性强、创新活跃、产业融合度高、带动作用显著等特点。国际经验表明，制造业发展到一定阶段后，其附加值和市场竞争力的提升更多的是靠现代生产性服务业的支撑。（**引出话题，论述生产性服务业重要性**）\n>\n> 相较而言，我国生产性服务业发展相对滞后，总量不足、结构不合理等问题仍较突出。（**提出问题**）\n>\n> 推动中国制造由大到强，需要我们推动生产性服务业向专业化和价值链高端延伸，更好服务制造业高质量发展。（**提出对策**）\n>\n> **这段文字意在强调：**\n\n**【选项原文】**\n\n> A. 应进一步推动生产性服务业高质量发展\n> B. 生产性服务业包括涉及多领域众多产业\n> C. 生产性服务业与制造业的发展息息相关\n> D. 更好服务制造业是生产性服务业的目标\n\n**【答案】** ✅ A\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 第一步·首句 | 用首句定主题词 | 首句＋第二句都在讲\"生产性服务业\"（**\"生产性\"三字很关键**），大家都有，谁也别说谁 |\n| 第一步·分层 | 断成两段 | 前面讲生产性服务业的**重要性**（啥事都需要你，你太重要了）；\"相较而言\"之后＝**滞后、不足、不合理 → 两个字送给他：问题** |\n| 第一步·找对策 | \"需要我们……\" | **对策句**：\"推动生产性服务业向专业化和价值链高端延伸，更好服务制造业发展\"（说人话：我要让生产性服务业**更牛、更好、更棒**） |\n| 第一步·定结构 | 结论 | **分总结构**：引出话题 + 提出问题 + 解决问题；七大关系里**主要是对策** |\n| 第二步·抓主题词 | \"怎么做\" | 向**更高端**延伸 → 对应选项\"**高质量发展**\" |\n| 第二步·抓套路 | 出题人的小心思 | A 的\"高质量发展\"**不是对应文段里形容制造业的\"高质量发展\"**，而是**对\"专业化和（价值链）高端\"的同义替换** |\n| 第三步·排干扰 | B、C、D 属于哪一类 | B 对应\"涉及农业、工业等产业多个环节\"（**非重点**）；C 对应\"制造业需要靠生产性服务业支撑\"（**非重点**）；D 是**意义/效果** |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。\"高质量发展\"＝对\"专业化和价值链高端\"的同义替换（**适当变化的主题词**）。\n- **B 项**：**非重点**。\"涉及众多领域\"对应文段\"涉及农业、工业等产业的多个环节\"，是引出话题时的铺陈。\n- **C 项**：**非重点**。\"与制造业的发展息息相关\"对应\"制造业发展到一定阶段后……更多的是靠现代生产性服务业的支撑\"——**不是中心句，只是重要性论述**。\n- **D 项**：**非重点（意义效果）**。\"更好服务制造业\"对应尾句后半，\"**A 和 D 是什么关系？** A 是\"需要提升\"，D 是\"更好的服务制造业\"——**D 是意义效果，对策更重要**。\"你只有上岸了，你才有工作；工作是意义效果呀。\"\n\n**【本题要点】**\n\n> ⭐ \"**你要抓大放小**——大是谁呀？大是主题'专业化和高端'。放着 '高质量' 你不看，你去看 D——这个思路就得改一改。**按道理你就应该先关注 C 项（此处指选项里含主题词的那一项）**。\"\n> ⭐ \"出题人就这么多套路：**B、C、D 都属于非重点，他们都提到了，但是不好意思，我只要主角，我只要这个对策。**\"\n> ⭐ \"我跟大家讲这个题有一个**小套路、小小心思**：这个'高质量发展'**对应的不是文中形容制造业的'高质量发展'**，它对应的是'专业化和高端'——是**对这个专业和价值链的统一替换**。\"\n\n### 例 11（2025 四川·诗源于情感）\n\n**【题干原文】**\n\n> 【例11】（2025 四川）诗源于情感，但应该超越一般的情感。超越，建立在情感的基础之上，本身就包含了情感元素。诗是文字的最高形式，不能等同于一般的情感抒发和情绪宣泄，**诗应该有更高的使命，那就是\"言志\"。**（**引出话题并提出观点**）\n>\n> 所以，\"**缘情**\"是诗之基础，\"**言志**\"才是诗之超越，或者说诗之要求、诗之标准。（**得出结论**）\n>\n> \"道始于情\"\"道生于情\"，精神的源头其实是情感。情感不加控制，就流于欲望本能；情感经过疏导，就可能上升为\"**道**\"或者\"**理**\"，并可能最终转化为精神。（**解释说明**）\n>\n> **这段文字意在强调：**\n\n**【选项原文】**\n\n> A. 情感元素是诗歌创作的基本要求和标准\n> B. 诗的创作必须建立在生活实践的基础上\n> C. 诗\"言志\"才能成为精神的传道者和弘扬者\n> D. 诗歌应该尽可能地避免情感宣泄与欲望表达\n\n**【答案】** ✅ C（画面红笔圈画 C）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓转折 | \"诗源于情感，**但**应该超越一般的情感\" | 转折后是重点：要**超越**情感 |\n| 2 找新话题 | 读到\"更高\"要注意——七大关系第六个是**新旧关系** | \"**言志**\"是前文没出现过的**新话题**！\"前面跟言志没关系，怎么就突然多了个'言志'呢？\" |\n| 3 定重点 | 新话题 + \"更高\" | \"诗应该有更高的使命，那就是'**言志**'\"→ **言志** 是重点 |\n| 4 别急收尾 | 再看看有没有新东西 | \"所以，'缘情'是诗之基础，'言志'才是诗之超越，或者说诗之要求、诗之标准。\"——**依然在说\"言志才是\"**（用了\"超越\"\"要求\"\"标准\"三个词） |\n| 5 读尾句 | 尾句在说什么 | 情感**不加控制**就流于欲望本能；情感**经过疏导**才能上升为\"道\"或\"理\" → 再次告诉你**情感地位不高**，**道和理（＝志/质）才是最高的** |\n| 6 段内同义替换 | \"道/理\"＝什么？ | **文段内部的同义替换**：\"志向、道理，我要追求的那个道/目标\" → 对应\"**言志**\"的\"志\" |\n| 7 定结构 | 结论 | **分总分**：开篇引出话题（言志）→ 中间再强调（言志才是超越/要求/标准）→ 后面解释 |\n| 8 抓大放小 | 主题词是谁 | **\"志\"**（言志） |\n| 9 排干扰 | A、B、D | A 说\"情感\"（情感不重要）；B 无中生有；D 偷换概念 |\n\n**【逐项解析】**\n\n- **A 项**：**非重点 / 与文意不符**。文段说情感**不是**最重要的——\"它不能等同于情感，情感没那么重要嘛\"。\n- **B 项**：**无中生有**。\"生活实践\"跟\"志\"有什么关系？文段压根没提。\n- **C 项**：✅ 正确。\"诗'言志'才能成为精神的传道者和弘扬者\"——\"志\"＝主题词；\"精神的传道和弘扬\"对应文段\"精神的源头其实是情感……最终转化为精神\"，也对应\"诗应该有更高的**使命**\"。\n- **D 项**：**偷换概念**。\"文段没有说诗歌**只是**不能等同一般的情感\"，而是\"不能等同于一般的情感抒发和宣泄\"——**你可以抒发，但不能只抒情**。\"李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情——你说你 D 应该尽可能避免抒情，这不对吧？\"\n\n**【本题要点】**\n\n> ⭐ **\"抓大放小\"的实战演示**：老师自述做题过程——\"**我看的就是'言志'，我根本就没看到后半部分。**\"\n> ⭐ \"**我是帮出题人圆这个 C 项的**——我选 C 是因为**你有最关键的话题，别的没有**；至于怎么讲的没关系，我帮你圆。因为这个选项只要**有道理、只要没有那么大的问题**就可以。\"\n> ⭐ \"**你如果先看后半句，你肯定选不到 C 项。**\"这就是抓大放小的价值。\n> ⭐ 关于\"道/理/志\"的理解：\"道和理就是**形而上的更高级的东西**，它在这个文章当中就指的是这个'志'——你可以把它理解为道也好、理也好、志也好，**它都是那个'情'之上的东西**。\"\n\n---\n\n## 本讲方法框架总表\n\n### 表 1｜中心理解\"3 步走\"\n\n| 步骤 | 名称 | 基本思路 | 思维提升 |\n| --- | --- | --- | --- |\n| ① | 通读全文，弄清脉络，**寻找重点**（中心句） | 一个文章有很多句子，找重点可以理解为，我们要找到最重要的那一个 | ① 判断轻重看**句子之间的逻辑关系**（七大关系）\u003cbr>② 关联词只是学习的\"**拐杖**\"，不是真理，只是提示作用，**不能依赖**\u003cbr>③ 把文段当成一个**整体**处理，单看重要、整体可能不重要 → **文段看完整** |\n| ② | **同义替换** | 从选项中寻找一个和中心句**最像**的选项 | ① 不能要求表述完全一致，**大意一致即可**\u003cbr>② 抓\"**大**\"放\"**小**\"，先大后小（大＝主题词，小＝表达形式/遣词用句）\u003cbr>③ 主题词**优先原词**，但并非一定是文段原词，可适当**扩大、缩小、替换** |\n| ③ | **排除干扰项** | 对比择优，按三类型排除 | ① 类型1 **一定不能选**（原则性问题）\u003cbr>② 类型2 **基本不能选**（90%，有例外但不多）\u003cbr>③ 类型3 **对比可次选**（可以选，只是不完美） |\n\n> 补充：**二、三两步很多时候是在一起的**（例如只有一个选项含主题词时，可一步锁定）。\n\n### 表 2｜第一步核心工具：七大关系\n\n| # | 关系名 | 重点落在哪一边 |\n| --- | --- | --- |\n| 1 | 转折关系 | **转折后** |\n| 2 | 因果关系 | **结论/结果**（结果比原因重要） |\n| 3 | 必要条件关系（对策） | **对策**（怎么解决问题比问题本身重要） |\n| 4 | 解释关系 | **明确、直接的观点论点**（论点比论据重要） |\n| 5 | 强调关系 | **强调的内容**（\"特别是……\"之后） |\n| 6 | 新旧关系 | **后文出现的新话题** |\n| 7 | 并列关系 | 无明显侧重点，**都重要** → 必须概括全面、看完整 |\n\n### 表 3｜第一步备用工具：句子功能的常见类型\n\n| 类型 | 标志 / 说明 |\n| --- | --- |\n| 背景引入 | \"随着\"\"近年来\"\"在……大环境下\"或时代环境等 |\n| 引出话题 | 引出某个话题目前的现状，或援引其他人的观点 |\n| 提出观点 | 观点句，即一些重点词语引导的句子，或文段论述的中心 |\n| 提出问题 | 消极表述，如\"不足\"\"有害\"\"缺陷\" |\n| 分析问题 | 问题形成的原因，或对问题危害的详细展开/具体说明 |\n| 解决问题 | 对策标志词引导的句子 |\n| 意义效果 | 对策带来的好处（正面论证） |\n| 举例论证 | \"比如\"\"就像\"\"典型\"或具体的人名地名等 |\n| 反面论证 | 不采取对策会带来哪些危害 |\n| 解释说明 | 范围较广，一切和观点相关的部分都可当作解释 |\n| 补充说明 | 对某个话题或对象进行补充，通常不影响文段完整性 |\n\n### 表 4｜第二步核心工具：主题词\n\n| 项目 | 内容 |\n| --- | --- |\n| 定义 | 文段围绕的核心话题，通常是**核心动名词（主谓宾）** |\n| 判断方法 ① | **中心句围绕的核心话题**（一般前有引入或后有解释说明；频次可能较低）—— **以此为主** |\n| 判断方法 ② | **每句话都围绕的相同话题**（频次相对较高；中心句不好把握时以此入手） |\n| 判断方法 ③ | **很多时候，首句引出的话题，即为文段主题（之一）** |\n| 综合原则 | **以（1）为主，综合（2）（3）来判断**（最保险） |\n| 解题意义 | 正确答案需包含文段主题词（**同义替换的依据**） |\n| 具体操作 | 先找文段重点 → 提炼其中最核心的词汇 → 来到选项，**先找有主题词的选项验证，没问题直接锁定，其它排除** |\n| 用词尺度 | 优先原词；可适当扩大/缩小/替换（文化→文明、技术→技艺、音乐→艺术）；专业名词一般不能换 |\n\n### 表 5｜第三步核心工具：干扰项三类型\n\n| 类型 | 定性 | 具体情形 |\n| --- | --- | --- |\n| 类型① **一定不能选** | 原则性问题（死罪） | 与文意相悖；文段未提及（无中生有）；无关对策 |\n| 类型② **基本不能选** | 约 90% 不能选，有例外但不多 | 不含/缺少文段主题词；非中心句（分述句）同义替换（非重点）——分述句含：转折前、结论前、程度词前、定义引入、背景引入、对比引入、问题引入、解释、举例、意义、数据、多角度论述；并列文段中表述片面 |\n| 类型③ **对比可次选** | 可以选，但没那么完美 | 主题词范围适当扩大/缩小/替换；不明确选项（含有否定词、较为笼统） |\n\n### 表 6｜本讲全部例题速查\n\n| 题号 | 出处 | 题干主题 | 答案 | 讲解所在步骤 | 关键方法 |\n| --- | --- | --- | --- | --- | --- |\n| 例1 | 2026 四川 | 莫高窟考古与中华文化的包容性 | **D** | 第一步·思维提升① | 庖丁解牛；分总分结构 |\n| 举例1 | 课堂示例 | 这次考试老师特别提到过 | 不设选项 | 第一步·思维提升③ | 关联词只管辖所在句子 |\n| 例2 | 2021 四川 | 现代化是一个世界性课题 | **C** | 第一步·思维提升③ | 看完整；转折→对策 |\n| 例3 | 26 国考行政执法回忆 | 民主落地与程序文本 | 不要求做题 | 第二步·思维提升④ | 大意一致即可；总分结构 |\n| 例4 | 26 国考行政执法回忆 | 高寒地区生态保护修复工程 | **A** | 第二步·主题词方法（3） | 首句引出的话题＝文段主题 |\n| 示例（残破物体） | 经典老题（北京） | 残破的物体总是不美的 | **B** | 第二步·思维提升⑥ | 主题词范围可替换；\"何以\"＝为什么 |\n| 例5 | 2023 国考 | 民间文学艺术作品的保护 | **D** | 第三步·类型① | 三个错项全为\"一定不能选\" |\n| 例6 | 2024 天津 | 阿希从众实验 | **C** | 第三步·类型② | 非重点（结论前/解释/举例） |\n| 例7 | 2024 青海 | 干细胞抗衰老 | **D** | 第三步·类型② | 例外：例子可表达中心句意思 |\n| 例8 | 2023 山东 | 经典影视作品的重复呈现与重新阐释 | **D** | 第三步·类型③ | 主题词适当变化（重新→翻拍） |\n| 例9 | 2024 山西县级 | 汉语国际推广视域下的书法课定位 | **D** | 第三步·类型③ | 不明确选项可次选 |\n| 例10 | 2024 江苏 | 生产性服务业高质量发展 | **A** | 三步走综合练习 | 对策文段；\"专业化+高端\"→\"高质量发展\" |\n| 例11 | 2025 四川 | 诗源于情感，但应该超越 | **C** | 三步走综合练习 | 新旧关系；段内同义替换（志＝道＝理） |\n\n---\n\n## 易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 老师给的破解办法 |\n| --- | --- | --- |\n| 1 | 以为言语题型很多，被题型数量吓住 | 言语**根本上只有两个题型**：中心理解 + 逻辑填空的词义辨析 |\n| 2 | 只学了\"怎么找\"，不学第二、三步 | 三步走是闭环，市面上多数体系只有第一步 |\n| 3 | 过度依赖关联词 | 关联词只是\"**拐杖**\"，删掉不影响句意；\"而\"就有转折/顺承/同时/递进四义 |\n| 4 | **只读一半就选答案** | 一个关联词只能保证管辖所在的句子，不一定管辖整个文段 → **文段看完整** |\n| 5 | 把\"部分并列\"当成\"整体并列\" | 局部的\"一方面/另一方面\"可能只是在论证前面的观点 → 整体是**总分** |\n| 6 | 以为中心句和正确选项必须一字不差 | 大多数情况下**大意一致即可** |\n| 7 | 完美主义：抓住细枝末节否决正确项 | **抓大放小**——\"你管我身高、颜值、星座的？就我会言语\" |\n| 8 | 不清楚主题词和转折/结论/观点的关系 | **转折、结论解决第一步；主题词解决第二步**（帮你选答案） |\n| 9 | 只用一个方法找主题词 | **以中心句核心话题为主，综合高频词与首句** |\n| 10 | 因为选项用了非原词就排除 | 适当扩大/缩小/替换**并非一定错**，要**对比择优**（文化→文明可以；音乐→美术不行） |\n| 11 | \"最\"字当头的绝对化表述 | \"最可行\"＝绝对表述，多为**无中生有** |\n| 12 | 把\"积极基调\"的选项配给\"消极基调\"的文段 | 如例7的 C（各种尝试）、例9 的 C（尴尬地位）——**从根上违背文段意志** |\n| 13 | 看到例子（如\"干细胞\"\"挪威大鼠\"）就一律排除 | 例7是例外：**例子和观点本质上意思一样**，当选项全含例子时，选与中心句最近的 |\n| 14 | 出题人把中心句拆成两半 | 一半留原文、一半放答案，**意思一致即可选**（例7 的\"实验探索阶段\"） |\n| 15 | 题干问\"是什么\"却选了\"为什么\" | 分清\"**何为何以**\"：何为＝是什么；何以＝为什么 |\n| 16 | 把\"意义效果\"当成\"对策\"选 | 对策更重要（例10 的 D，\"你只有上岸了才有工作\"） |\n| 17 | 认为\"对比择优\"只是口号 | 三类型给出对比的**依据**：一定不能选 → 基本不能选 → 对比可次选 |\n\n---\n\n## ⭐ 老师金句\n\n> ⭐ \"**标题就是中心，中心就是标题。**\"\n>\n> ⭐ \"**虽然在老师看来他就考察两个题型**——第一个是中心理解，第二个是关于逻辑填空当中词的一个辨析。\"\n>\n> ⭐ \"**今天所有内容你都可以忘掉，但这三点你得记住。**\"\n>\n> ⭐ \"**你要学会庖丁解牛。** 文段在你眼里看来，它是一个一个的结构——提出问题，分析问题，解决问题。我们古人说**目无全牛**嘛。\"\n>\n> ⭐ \"**打绿色的就是不重要的，打红色就是重要的。**\"\n>\n> ⭐ \"**结果比原因重要。**\"\n>\n> ⭐ \"**论点比论据重要。**\"\n>\n> ⭐ \"关联词应该是大家**作为一个初学者学习的一根拐杖**。你不能老抓它——你活了二十岁了，还去拄拐杖呢？不合适。\"\n>\n> ⭐ \"**它是表象，句子的内容才是本质。**\"\n>\n> ⭐ \"**所以大家一定要看完整啊！**\"\n>\n> ⭐ \"一个关联词**只能保证管辖所在的句子，但不一定管辖整个文段**。\"\n>\n> ⭐ \"**释的前提是你得先把观点提出来。**\"\n>\n> ⭐ \"**抓大放小**——招了十个人，就我会言语，**你管我身高怎么样、颜值怎么样、什么星座的？**\"\n>\n> ⭐ \"很多同学为什么中心理解做不好？就是因为他是一个**完美主义**。\"\n>\n> ⭐ \"**从文段到中心句到主题词，其实是你对重点不断凝练的一个过程。**\"\n>\n> ⭐ \"**转折结论是解决第一步的；主题词是第二步的**——是帮你找答案的。\"\n>\n> ⭐ \"**首句引出的话题，很可能就是文段讨论的主题。所以你不要忽略首句。**\"\n>\n> ⭐ \"**以一为主，综合二三来判断，这是最保险的。**\"\n>\n> ⭐ \"**你但凡有音乐，就不选艺术；你万一非没有的话，选个艺术也可以。**\"\n>\n> ⭐ \"**话也不能说死**——基本不能选的意思就是：**有例外，但不多。**\"\n>\n> ⭐ \"就跟张老师一样，也能做你们老师，虽然不完美，也能做老师——这种感觉叫**机智的对比**。\"\n>\n> ⭐ \"**例子和观点在本质上意思是一样的。**\"\n>\n> ⭐ \"出题人**把中心句拆成两半**——一半留给原文，一半留给答案。但是两句话的意思本身是一样的。\"\n>\n> ⭐ \"**你光抓住一个定位，就只能选 D 了。**\"\n>\n> ⭐ \"我选 C 是因为**你有最关键的话题，别的没有**——至于怎么讲的没关系，**我帮你圆**。\"\n>\n> ⭐ \"**他山之石可以攻玉**——别的老师讲的东西，到底是我体系里的第几步？非常清晰，**清晰成体系**。\"\n\n---\n\n## 课程预告\n\n> **PPT 板书（逐字）**\n>\n> **课程预告**\n> **张弓言语\"十二箭\"（二）**\n> **1.29　19:38**\n> **（三）重视首句对于核心话题的提示作用**\n> **（四）正确理解例子（解释说明）**\n\n讲师口播：\n\n> \"我们明天接着讲我们的十二箭的第二节课，就是**重视首句**，再一次给大家去夯实一下这个观点；**重视首句的提示作用，以及正确的理解例子**。明天 29 号 07:38（口播，PPT 为 19:38）老时间不见不散。\"\n\n> ⭐ 课后提示：本讲是\"中心理解\"五讲的第一讲，属于**总纲课**——先把\"3 步走\"的框架和\"七大关系 / 主题词 / 干扰项三类型\"三套工具牢牢记住，后面四讲分别展开**首句与例子、对策文段、转折文段与因果文段、晦涩文段与细节题**。\n\n---\n\n> **本笔记依据 P02 全程 83 张网格总览图 + 对应原帧高清画面逐字核对整理；题干、选项、板书均以原帧画面为准，讲师口播的同音字（如\"中心解题/中心理解\"\"统一替换/同义替换\"\"主指/主旨\"\"提面/题面\"等）已按画面校正。**\n\n\u003c/content>\n\u003c/invoke>\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"课前约定：说在课前","id":"课前约定说在课前"},{"level":2,"text":"一、正确认识言语理解与表达各题型的思路逻辑","id":"一正确认识言语理解与表达各题型的思路逻辑"},{"level":3,"text":"（一）整个言语就是\"两个题型\"","id":"一整个言语就是两个题型"},{"level":3,"text":"（二）各题型本质对照表（PPT 板书逐字）","id":"二各题型本质对照表ppt-板书逐字"},{"level":3,"text":"（三）课程安排表（PPT 板书逐字）","id":"三课程安排表ppt-板书
