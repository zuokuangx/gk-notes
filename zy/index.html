→ 找对策 → 比选项（内容 ＞ 形式）→ 纠结时回头看问题。**\n","outline":[{"level":2,"text":"一、开场与上节回顾","id":"一开场与上节回顾"},{"level":3,"text":"1.1 开场：课程互动与反馈渠道","id":"11-开场课程互动与反馈渠道"},{"level":3,"text":"1.2 上节回顾：首句的作用","id":"12-上节回顾首句的作用"},{"level":3,"text":"1.3 上节回顾：例子与解释说明（5 条）","id":"13-上节回顾例子与解释说明5-条"},{"level":2,"text":"二、对策类文段·考点回顾（基础框架）","id":"二对策类文段考点回顾基础框架"},{"level":3,"text":"2.1 考点回顾三条（PPT 原文）","id":"21-考点回顾三条ppt-原文"},{"level":3,"text":"2.2 对策类文段的三种模式（PPT 原文）","id":"22-对策类文段的三种模式ppt-原文"},{"level":3,"text":"2.3 模式一的课堂示范例","id":"23-模式一的课堂示范例"},{"level":3,"text":"2.4 模式二的课堂示范例","id":"24-模式二的课堂示范例"},{"level":3,"text":"2.5 模式三的课堂示范例","id":"25-模式三的课堂示范例"},{"level":2,"text":"三、思维提升①：内容 ＞ 形式","id":"三思维提升内容-形式"},{"level":3,"text":"课堂示范例（两组对照）","id":"课堂示范例两组对照"},{"level":3,"text":"例1｜2022 江苏 · 獬豸与公平正义","id":"例12022-江苏-獬豸与公平正义"},{"level":3,"text":"例2｜2025 江苏 · 何尊铭文与青铜器研究","id":"例22025-江苏-何尊铭文与青铜器研究"},{"level":2,"text":"四、思维提升②：对策 + 对象","id":"四思维提升对策-对象"},{"level":3,"text":"例3｜2025 广西 · 传统文博展示与新技术","id":"例32025-广西-传统文博展示与新技术"},{"level":3,"text":"例4｜2024 宁夏 · 智慧治理与技术融合","id":"例42024-宁夏-智慧治理与技术融合"},{"level":2,"text":"五、思维提升③：宏观对策与具体对策","id":"五思维提升宏观对策与具体对策"},{"level":3,"text":"5.1 总纲（PPT 原文）","id":"51-总纲ppt-原文"},{"level":3,"text":"5.2 情况一：提出宏观对策，后文围绕具体多方面展开","id":"52-情况一提出宏观对策后文围绕具体多方面展开"},{"level":3,"text":"情况一·回顾例｜26 国行政执法回忆 · 程序内容之基","id":"情况一回顾例26-国行政执法回忆-程序内容之基"},{"level":3,"text":"例5｜2023 国考 · 老旧小区适老化改造","id":"例52023-国考-老旧小区适老化改造"},{"level":3,"text":"5.3 情况二：宏观对策 + 后文单一更具体的对策","id":"53-情况二宏观对策-后文单一更具体的对策"},{"level":3,"text":"例6｜2023 广东 · 烈士纪念设施","id":"例62023-广东-烈士纪念设施"},{"level":3,"text":"例7｜2023 湖北选调 · 质检报告","id":"例72023-湖北选调-质检报告"},{"level":2,"text":"六、思维提升④：什么时候不选对策","id":"六思维提升什么时候不选对策"},{"level":3,"text":"例8｜2024 重庆 · 新农人","id":"例82024-重庆-新农人"},{"level":3,"text":"例9｜2024 黑龙江人民检察院 · 知识产权侵权执法","id":"例92024-黑龙江人民检察院-知识产权侵权执法"},{"level":2,"text":"七、思维提升⑤：对策和问题的相关性","id":"七思维提升对策和问题的相关性"},{"level":3,"text":"例10｜2025 国考 · 基层执法权限","id":"例102025-国考-基层执法权限"},{"level":3,"text":"例11｜2024 国考 · 个人信息保护案件","id":"例112024-国考-个人信息保护案件"},{"level":2,"text":"八、本讲方法框架总表","id":"八本讲方法框架总表"},{"level":3,"text":"8.1 对策类文段总流程","id":"81-对策类文段总流程"},{"level":3,"text":"8.2 五个思维提升一览","id":"82-五个思维提升一览"},{"level":3,"text":"8.3 三种模式的定位表","id":"83-三种模式的定位表"},{"level":3,"text":"8.4 两条\"黄金抓手\"（配套使用）","id":"84-两条黄金抓手配套使用"},{"level":2,"text":"九、易错点与陷阱清单","id":"九易错点与陷阱清单"},{"level":2,"text":"十、⭐ 老师金句","id":"十-老师金句"},{"level":2,"text":"十一、词语 / 易错字积累表","id":"十一词语-易错字积累表"},{"level":2,"text":"十二、思维导图（二）对策类文段（板书全录）","id":"十二思维导图二对策类文段板书全录"}]},{"id":"P05","title":"转折文段与因果文段","full":"【言语理解与表达】张弓言语·十二箭 · 第 05 集（正课第四讲）","lect":"","dur":"90:36","sec":5436,"theme":"","url":"","md":"# 【言语理解与表达】张弓言语·十二箭 · 第 05 集（正课第四讲）\n\n> **课程名称**：张弓言语·十二箭（适用 26 国考 / 省考 / 多省联考 / 选调生 / 事业单位 / 三支一扶）\n> **讲师**：张弓（上岸村）\n> **本集位置**：合集第 5 集（共 14 P；正课第 4 讲）\n> **视频地址**：https://www.bilibili.com/video/BV14RzZBuEz3?p=5\n> **时长**：约 90 分 36 秒\n> **本集主题**：**中心理解——转折文段（第六节）与因果文段（第七节）的考点回顾与思维提升**\n> PPT 内部编号：`（六）转折文段`、`（七）因果文段`；课后总结页标注为「张弓言语十二箭（四）- 转折因果」。\n\n---\n\n## 目录\n\n- [一、本讲知识地图](#一本讲知识地图)\n- [二、开课回顾：第三讲「对策文段」思维导图速览](#二开课回顾第三讲对策文段思维导图速览)\n- [三、转折文段（PPT 第六节）](#三转折文段ppt-第六节)\n  - [3.1 考点回顾（PPT 原文）](#31-考点回顾ppt-原文)\n  - [3.2 思维提升①：其实 / 事实上 / 实际上 ≠ 必然转折](#32-思维提升其实--事实上--实际上--必然转折)\n  - [3.3 思维提升②：转折文段答案的两种形式](#33-思维提升转折文段答案的两种形式)\n  - [例题 1｜2025 福建 · 雅文化与俗文化](#例题-12025-福建--雅文化与俗文化)\n  - [例题 2｜2020 浙江 · 农村三产融合发展](#例题-22020-浙江--农村三产融合发展)\n  - [例题 3｜2023 青海 · 饮酒危害健康](#例题-32023-青海--饮酒危害健康)\n  - [例题 4｜2023 吉林 · 灵活就业的\"门槛\"](#例题-42023-吉林--灵活就业的门槛)\n  - [3.4 转折文段总结（省流版）](#34-转折文段总结省流版)\n- [四、因果文段（PPT 第七节）](#四因果文段ppt-第七节)\n  - [4.1 考点回顾（PPT 原文）](#41-考点回顾ppt-原文)\n  - [4.2 思维提升①：文段为因果文段，答案可以是「因+果」结构](#42-思维提升文段为因果文段答案可以是因果结构)\n  - [4.3 思维提升②：层层递进，重在开头和结果](#43-思维提升层层递进重在开头和结果)\n  - [4.4 思维提升③：哪怕尾句有结论词，也要结合上下文](#44-思维提升哪怕尾句有结论词也要结合上下文)\n  - [例题 5｜2025 江苏 · 非遗与传承人口述调查](#例题-52025-江苏--非遗与传承人口述调查)\n  - [例题 6｜2023 国考 · 月球的两副面孔](#例题-62023-国考--月球的两副面孔)\n  - [例题 7｜2021 四川 · 蜜蜂与咖啡因](#例题-72021-四川--蜜蜂与咖啡因)\n  - [例题 8｜2023 山东 · 春阳社解散的原因](#例题-82023-山东--春阳社解散的原因)\n  - [例题 9｜2025 重庆 · 冬小麦与\"四时\"观念](#例题-92025-重庆--冬小麦与四时观念)\n  - [例题 10｜2022 重庆选调 · 西风带与冷空气南下](#例题-102022-重庆选调--西风带与冷空气南下)\n  - [补充例题 A｜26 国考行政执法（考生回忆）· 中纬度极端寒潮](#补充例题-a26-国考行政执法考生回忆--中纬度极端寒潮)\n  - [补充例题 B｜2020 国考 · 慕课发展与高校作用（讲义外补充）](#补充例题-b2020-国考--慕课发展与高校作用讲义外补充)\n  - [例题 11｜2022 山西 · 叙事医学](#例题-112022-山西--叙事医学)\n  - [例题 12｜2024 河北 · 运动干预脑衰老](#例题-122024-河北--运动干预脑衰老)\n- [五、本讲方法框架总表](#五本讲方法框架总表)\n- [六、易错点与陷阱清单](#六易错点与陷阱清单)\n- [七、⭐ 老师金句](#七-老师金句)\n- [八、本讲总结板书（省流版）原文照录](#八本讲总结板书省流版原文照录)\n\n---\n\n## 一、本讲知识地图\n\n本讲只讲两大板块：**转折文段**（承接前一天的「对策文段」，今天正式讲转折）与**因果文段**。老师反复强调本讲\"内容其实没有昨天那么复杂\"，但思维提升点密度高。\n\n| 板块 | 考点回顾（常规知识） | 思维提升（本讲重点，拉分点） | 对应例题 |\n| --- | --- | --- | --- |\n| **转折文段**（PPT 六） | 转折之后是重点，转折之前不重要 | ① 其实 / 事实上 / 实际上 ≠ 一定表转折，**只是引导一种事实**\u003cbr>② 转折文段答案**既可以是对转折前观点的否定，也可以是对转折后内容的阐述** | 例 1、例 2、例 3、例 4 |\n| **因果文段**（PPT 七） | 结论之后是重点，结论之前不重要\u003cbr>尾句出现结论词可以重点关注 | ① 文段为因果文段，答案可以是「因+果」结构\u003cbr>② 层层递进、过程繁复的，重在开头和结果，特别是结果\u003cbr>③ 哪怕尾句有结论词，也不建议只看尾句，一定要结合上下文 | 例 5 ～ 例 12（含 2 道补充题） |\n\n**本讲贯通的底层思维**（老师反复回扣）：\n\n```\n抓大放小 —— 只抓主题词（对象）与结果（对策 / 果），不抠中间过程与字眼\n内容 > 形式 —— 选答案选的是\"内容\"，不是选关联词、不是选形式上的对策\n首句 = 话题范围的提示 —— 纠结时回看首句讲了\"谁和谁的关系\"\n尾句结论词 = 高概率中心句（约 80% 以上），但要看不懂时才用这一招\n```\n\n---\n\n## 二、开课回顾：第三讲「对策文段」思维导图速览\n\n> 老师开课翻出第三讲的思维导图作回顾，导图标题：**张弓言语十二箭（三）- 对策文段**。\n> 老师说：\"我们昨天主要是围绕对策讲……第一个对策很重要；第二个只有才对策和应该和必要条件，它的意思本质上是一样的；第三个就是优选对策，它的重要性比问题、意义都重要。然后就是对策的三种方式。\"\n\n**【对策文段·考点回顾】**\n\n```\n① 对策考点是我们公考言语的必考点，考察对策的文段我们称之为\"对策类文段\"\n② 必要条件：只有…才…，只有才中间更重要，在言语的中心理解题中，表达意思和对策是一回事；\n③ 理论要点：必要条件/对策是重点，对策类文段选优选对策，其重要性 > 问题、意义效果、解释、原因…\n④ 对策类文段的三种模式：\n   1. 通过对策标志词引导，文段正面提对策（最高频）\n   2. 通过反面提对策，假设做法+不好的结果，做法反过来即为对策\n   3. 文段没有说对策，但提到了问题，此时优选有针对性、能解决问题的对策；\n      若选项没有，则退而求其次选问题\n```\n\n**【对策文段·思维提升】**\n\n```\n① 选项选对策，内容 > 形式；若对策内容都存在，再优先考虑形式上是对策的答案\n② 对策类文段选项应该抓的主题词 —— 对策（做什么）& 对象（谁去做，为了谁做）\n③ 宏观对策之后可能出现更加具体的对策，此时是前面的对策重要还是后面的对策重要？\n   要结合具体情况，均有可能\n   情况 1：提出宏观对策，后文围绕其多方面展开\n           ① 若后文有明确定义提示，此时前…\n           ② 若后文有明确重点引导词提示…\n           ③ 若后文既没有举例提示，也…\n   情况 2：提出宏观对策，后文围绕具体单方面展开\n④ 什么时候可以不选对策\n   1. 文段不是对策类文段，即既没有问题，也没有对策\n   2. 文段出现了问题，但是选项中没有好的对策（没有…）\n⑤ 对策和问题的相关性\n```\n\n> ⭐ 老师特别更正了昨天导图的一个疏忽：\n> \"昨天我给这个 PDF 的导图的时候我有点疏忽了，就是把这个直接粘贴下去了。这个地方应该是**多方面的**：先提一个宏观大对策，然后接下来具体的多方面的小对策，这个时候其实前后都可以作为答案。那第二个是前面先提出大对策，后面围绕具体的单方面展开，一个是多方面，一个是单方面。这个时候选前面还是选后面，其实都有可能，你要分情况讨论。\"\n\n> 老师还提到衬衫梗：\"你们猜，还有没有？这是第四件……我这一年四季一季一套，四季常服不过四套。\"（呼应明代\"四季常服不过八套\"的说法，用来记忆讲次进度。）\n\n---\n\n## 三、转折文段（PPT 第六节）\n\n### 3.1 考点回顾（PPT 原文）\n\n**【（六）转折文段 · 考点回顾】**\n\n```\n典型标志：虽然……但是……；尽管……可是……；\n          ……不过……；……然而……；\n          ……却……；\n          其实/事实上/实际上\n\n理论要点：转折之后是重点\n典型错误选项特征：转折前的内容\n```\n\n> ⭐ 老师强调（本讲第一个重点提醒）：\n> \"要点就是转折之后是重点，转折前就不能选，大家非常熟悉了。但是我这个地方还是要强调一个点，就是什么呢？就是**这个转折之后还是站在整个文段的角度**。你不是说一句话当中有一个'但是'，那后面就一定是重点，明白吗？一定是这个文段，它整体来讲可能存在一个转折的关系。**一定要完整地看，是句子和句子之间的关系。**\"\n\n---\n\n### 3.2 思维提升①：其实 / 事实上 / 实际上 ≠ 必然转折\n\n**【PPT 原文】**\n\n```\n思维提升①：\n其实/事实上/实际上，并非一定表转折，只是引导一种事实\n\n例：大家都说老王是好人，事实上，他是一个坏人\n    大家都说老王是好人，实际上，他确实如此\n\n只有引导的事实，与前文构成矛盾关系，才是转折关系\n\n回忆第一箭：思维提升②：\n句子与句子的关系，并不完全由关联词而决定，关联词的存在与否不能完全构成我们分析的依据\n```\n\n> **老师的讲解原话（要点归纳）**：\n> - \"其实很多同学在这个问题上老容易记得很死板，其实千万不要这样子。**它只是引导一种事实。**\"\n> - \"什么叫其实？什么叫事实上、实际上？就是**它的事实是**，就是这个事情的真相是。\"\n> - \"接着讲就是事实，这个东西一定是转折的吗？它不一定吧。它只是一个事实而已，**谁说事实一定要转折了？**\"\n> - 两句话对比：第 1 句\"大家都说老王是好人，事实上他是一个坏人\"→ 表转折；第 2 句\"大家都说老王是好人，实际上他确实如此\"→ 不表转折。\n> - \"所以你们以后看到'事实上''实际上'能不能很武断地说，转折了，转折之后是重点？**一定不行**。它跟'但是'还是有区别的。你要看什么？**你要看内容**。它只是引导事实，**只有这个引导的事实跟前文构成了矛盾关系，它才叫转折**。\"\n> - 回扣第一节课：\"就是它跟我们第一节课讲的道理是一样的，就是**你不能完全由关联词来决定**。你还是看这两句话的关系。\"\n\n---\n\n### 3.3 思维提升②：转折文段答案的两种形式\n\n**【PPT 原文】**\n\n```\n思维提升②：\n转折文段的答案，既可以是 对转折前观点的否定，也可以是对转折后内容的阐述\n\n例：有人说公务员考试挺简单，其实，公务员考试挺难的\nA. 公务员考试简单的说法是错误的\nB. 公务员考试挺难的\n```\n\n> **板书圈画（画面可见）**：老师在\"公务员考试挺难的\"与 B 项上打**对勾**，在 A 项与\"公务员考试挺简单\"上打**删除线/叉**。老师讲解：这题 **A、B 都可以**——\"答案既可以是把后面的观点给他挪下来（选 B），我也可以说我反驳了前面的观点，就是公务员考试简单的说法是错的（选 A）。\"\n\n**【两个都出现怎么办？】**\n\n> ⭐ 老师给出两条处理原则：\n> 1. \"**首先第一个情况还是跟我昨天讲的一样，出题人大概率不会让你陷入这样的两难境地。** 他一定会用某种手段，比如说你在 A、B 纠结，但是他可能让某一个选项变得不好——比如他去掉一个主题词，或者把'公务员'改成'高考'，用某种手段把它变得不那么好。\"\n> 2. \"**如果你非要说 A、B 哪个更好，那就 B 吧。因为 B 它表述比较明确、比较直接。** 这个在我们第一节课第三步排除选项对比择优的时候讲过。\"\n\n---\n\n### 例题 1｜2025 福建 · 雅文化与俗文化\n\n**【题干原文】**\n\n> 例 1（2025 福建）\n> 雅文化是一种自觉的、表现为典籍形态的思想体系，流行于知识层次较高的阶层，对社会的影响深刻而狭窄。俗文化以世俗生活为中心，是民众自发的、无意识的文化心理，对社会的影响肤浅而广泛。二者之间只有形式上的自觉思想体系与民众直观体认，典籍形态与世俗传承的区别，实际上雅中有俗、俗中有雅，由俗到雅、由雅到俗。《论语》《孟子》中的语录不仅记载于典籍，也被世俗传诵。《诗经》原本是当时的民谣俚曲，后世竟成为儒家的经典。\n>\n> **这段文字意在强调雅文化与俗文化：**\n\n**【选项原文】**\n\n> A. 彼此完全对立\n> B. 表现形式有别\n> C. 社会影响不同\n> D. 存在互动关系\n\n**【答案】** ✅ **D**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n（介绍雅文化与俗文化）—— 批注在\"雅文化……对社会的影响肤浅而广泛。\"之后\n二者之间只有形式上的……（提出观点）—— 批注在\"二者之间只有形式上的……由俗到雅、由雅到俗。\"之后\n《论语》《孟子》中的语录……（举例）—— 批注在末句之后\n```\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找主体 | 开篇即给出两个主体 | 「雅文化」与「俗文化」——老师说\"他其实把主体都给你了\" |\n| 2 看前半段 | 判断前半段强调相同点还是不同点 | \"一个深刻而狭窄，一个肤浅而广泛\"——**强调不同点（个性）** |\n| 3 看到\"实际上\" | 不能一见\"实际上\"就判转折，要看内容是否与前文构成矛盾 | 后文\"雅中有俗、俗中有雅，由俗到雅、由雅到俗\"——**讲相同点（共性）** |\n| 4 判定转折 | 前文个性 vs 后文共性 → 构成矛盾关系 → 此处\"实际上\"**确实表转折** | \"所以文段到这儿，这句话就是中心句\" |\n| 5 看后半段 | 判断后续内容的作用 | 《论语》《孟子》像例子——\"很像我们在第几节课来着？第二节课！\"（举例） |\n| 6 定结构 | 判分总分结构 | **分—总—分**结构，重点是\"实际上雅中有俗……由雅到俗\"这一句 |\n| 7 匹选项 | 抓大放小，选最能表达\"相似 / 共性\"的项 | 只有 D\"存在互动关系\"能表达这层意思，故选 D |\n\n**【逐项解析】**\n\n- **A 项**\"彼此完全对立\"：**错**。\"对立\"\"有别\"和\"不同\"肯定不行——因为 A、B、C 三项都是在强调**转折之前**那一段（讲的是不同点），属于转折前的内容。\n- **B 项**\"表现形式有别\"：**错**。同上，只对应转折前（\"形式上的自觉思想体系与民众直观体认，典籍形态与世俗传承的区别\"），是**转折前的非重点**。\n- **C 项**\"社会影响不同\"：**错**。只对应\"深刻而狭窄 / 肤浅而广泛\"这一句转折前内容。\n- **D 项**\"存在互动关系\"：✅ **正确**。\"其实它也没有一个特别好、特别完美的答案，但是还是那句话，抓大放小，谁能够表达这个意思呢？相似呢那就只有地下的互动关系。就你乍一看这个'互动关系'好像也不是特别的好，但是对立有别和不同肯定不行。\"\n\n**【本题要点】**\n\n> ⭐ 看到\"实际上\"先别急着判转折——**要看内容**：前文讲\"个性（不同点）\"、后文讲\"共性（相同点）\"，两者构成矛盾关系，这里的\"实际上\"才真表转折。\n> ⭐ 转折之后的\"《论语》《孟子》……《诗经》……\"是**举例**（第二节课知识点），举例本身不选，它只是论证中心句。\n> ⭐ 本段是**分—总—分**结构：介绍（分）→ 提出观点（总）→ 举例（分）。\n\n---\n\n### 例题 2｜2020 浙江 · 农村三产融合发展\n\n**【题干原文】**\n\n> 例 2（2020 浙江）\n> 长期的城乡二元发展格局，导致城乡在科技、人才、资金及土地等要素配置方面严重不均衡，并且农村的优质资源还在源源不断地向城市集中，难以避免地造成农村产业萎缩乃至空心化。通过建立健全城乡融合发展机制，推动城乡要素自由平等交换，消除城市优质要素资源向农村流动的各种障碍，才能真正形成乡村产业兴旺的基础条件。事实上，我国农村三产融合发展好的地方往往也是城乡融合发展程度高的地方。\n>\n> **这段文字主要说明农村三产融合发展：**\n\n**【选项原文】**\n\n> A. 受制于城乡二元发展格局\n> B. 需吸引城市优质要素资源的流入\n> C. 与城乡融合的发展水平息息相关\n> D. 应解决城乡间资源配置不均衡的问题\n\n**【答案】** ✅ **C**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n长期的城乡二元发展格局……乃至空心化。（提出问题）—— 批注在\"乃至空心化。\"之后\n通过建立健全城乡融合发展机制……才能真正形成乡村产业兴旺的基础条件。（提出对策）\n事实上，我国农村三产融合发展好的地方往往也是城乡融合发展程度高的地方。（举例解释）\n```\n\n> 板书圈画：老师圈出「长期」「并且」「建立健全城乡融合发展机制」，并在 C 项上画大圈、\"息息相关\"处画圈。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 读首句 | 抓话题 | \"长期的城乡二元发展格局\"——老师顺带解释：\"就是城市和乡村不太一样，比如我们有农村户口、有城市户口。\" |\n| 2 找问题 | 见消极表述即判\"问题\" | \"严重不均衡\"\"难以避免地造成农村产业萎缩乃至空心化\"→ **表问题**（昨天知识点：看到消极表问题） |\n| 3 找对策 | 有问题 → 大概就是怎么去解决 | \"**通过建立健全城乡融合发展机制**\"→ **对策 + 对象**（对象＝城乡） |\n| 4 辨析\"事实上\" | 关键判断：它有没有**反驳**前文？ | 后文说\"农村三产融合发展好的地方往往也是城乡融合发展程度高的地方\"——观点与前面**一样**，没有反驳 → **不构成转折** |\n| 5 定性\"事实上\"后一句 | 它是什么？ | 老师认为把它当**例子**更好：\"作为一个例子，在证明前面确实你要是有了建立健全的城乡融合发展机制，你这个融合如果程度高，那就很好。\" |\n| 6 定中心句 | 中心句在中间 | \"所以当时我做这个题，我觉得中心句在中间，就是在中间这句话。\" |\n| 7 匹配选项 | 抓大放小：出题人已把对象拎出，只抓对策本身 | \"只有 C 项有城乡融合，这就是我们讲的抓大放小。\" |\n\n**【逐项解析】**\n\n- **A 项**\"受制于城乡二元发展格局\"：**错**。它是**问题**，比较好排——优质资源在前面这个地方（\"导致城乡在科技、人才、资金及土地等要素配置方面严重不均衡\"）。且没有主题词\"城乡融合\"。\n- **B 项**\"需吸引城市优质要素资源的流入\"：**错**。只有问题没有对策，**没有对策、主题词没有**。\n- **C 项**\"与城乡融合的发展水平息息相关\"：✅ **正确**。出现了\"城乡融合\"这一对策内容。\n- **D 项**\"应解决城乡间资源配置不均衡的问题\"：**错**。除了没有主题词\"城乡融合\"之外，还犯了一个问题——**它不太明确**：\"我到底怎么样解决资源配置不均呢？怎么解决？通过建立健全城乡融合发展机制。\"所以答案选 C 而不是 D。\n\n**【本题要点】**\n\n> ⭐ **\"事实上\"是否表转折，要看它有没有反驳前文**：本题后文观点与前文一致（都在讲城乡融合很重要），所以**不是转折**，该句更像是**举例**。老师强调：\"就是你不能因为正确答案长得跟它像，你就认为文段是转折关系，重点在尾句。其实我觉得是不对，**咱们要实事求是**。\"\n> ⭐ **内容 > 形式**（本讲核心不等式）：老师现场纠正弹幕提问\"老师，C 不是对策呀\"——\n> \"**内容一定要大于什么？形式！** 我要找对策是找'应该'这个词吗？我是选这个对策的**内容**！这个对策的内容就是你要城乡融合发展，**城乡融合是对策的内容**。我要选对策，不是选'应'这个字，不是选'虚'这个字，我选的是谁能够更好地体现我文段当中对策的具体内容。\"\n\n---\n\n### 例题 3｜2023 青海 · 饮酒危害健康\n\n**【题干原文】**\n\n> 例 3（2023 青海）\n> 喝酒有害健康早已成为共识，酒精对大脑的影响也逐渐受到更多关注。《自然·通讯》的一项研究发现，每周喝几瓶啤酒，就会造成大脑灰质和白质体积减小；发表于《英国医学杂志》的一项研究指出，每周饮酒会导致海马体萎缩风险急剧上升。由此造成的后果是，长期饮酒的人更易患上痴呆症。不过，这些研究往往关注长期饮酒的影响，如果只是偶尔喝一次酒，也会对大脑造成危害吗？发表于《美国科学院院刊》的最新研究给出了肯定答案：你人生中的第一次醉酒，不仅会改变大脑神经元的形态，这种影响甚至会伴随终生。\n>\n> **这段文字意在：**\n\n**【选项原文】**\n\n> A. 强调长期饮酒对健康的严重危害\n> B. 纠正人们对饮酒危害的错误认识\n> C. 探讨痴呆症与饮食习惯之间的关联\n> D. 介绍关于饮酒危害健康的研究结论\n\n**【答案】** ✅ **D**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n喝酒有害健康早已成为共识……长期饮酒的人更易患上痴呆症。（长期喝酒有害）\n不过，这些研究往往关注长期饮酒的影响，如果只是偶尔喝一次酒，也会对大脑造成危害吗？\n发表于《美国科学院院刊》的最新研究给出了肯定答案：……这种影响甚至会伴随终生。（偶尔喝酒也有害）\n```\n\n> 板书圈画：圈出「早已成为共识」「每周喝酒」「长期饮酒的人更易患上痴呆症」「不过」「偶尔」「肯定答案」；选项 A 上打对勾，B 上圈「错误认识」并打叉，C 上圈「饮食习惯」，D 上打对勾。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找观点句 | 开门就提观点 | \"喝酒有害健康早已成为共识\"——老师：\"就开门就提观点嘛\" |\n| 2 识别举例论证 | 中间是论证过程 | \"每周喝几瓶啤酒……海马体萎缩风险急剧上升\"——举例论证 |\n| 3 找结论词 | \"由此\" → 重点看结论 | \"长期饮酒的人更易患上痴呆症\" |\n| 4 **陷阱预警** | 如果文段到这就停了，答案就是 A | 但**由此不是对全文的总结，只是对前半部分的总结**——\"这就是句子和句子关系\" |\n| 5 往后看 | 见\"不过\"——转折 | \"不过，这些研究往往关注长期饮酒的影响\" |\n| 6 判断新话题 | \"长\" vs \"短（偶尔）\" | \"我前面说的是长，你现在说的是短、偶尔，所以它相比于前面的长，**它是一个新话题**\"→ 相当于转折之后引出新观点 |\n| 7 判定\"并列 vs 转折\" | 二者有本质区别 | \"并列式就是并列式**都重要**，转折是指示**后面**重要，是有本质区别的。所以它的意思就是我不研究长的，我只研究短的了。\" |\n| 8 找尾句答案 | 尾句给出答案 | \"肯定答案就是也是有危害的\"\"哪怕你喝醉一次，也是影响伴随终身\" |\n| 9 定结构 + 归纳中心 | 分总结构，中心＝偶尔喝酒也有害 | 但**选项里没有\"短期\"\"偶尔\"这个词**→ 退而求其次，选沾边的 D |\n\n**【逐项解析】**\n\n- **A 项**\"强调长期饮酒对健康的严重危害\"：**错**，且**最不应该选**。\"因为前面在讲长期的好（指前半段内容），它在转折之前。\"老师明确：\"他犯了**原则性问题，转折前非重点，不能选**。\"\"A 可以说片面了、不重要，那你都在转折之前，我管你片不片面呢。\"\n- **B 项**\"纠正人们对饮酒危害的错误认识\"：**错**，且错了两次。\n  - 第一层：**没有\"错误认识\"**。\"纠正错误认识的前提是什么？你得先犯个错呀！\"\"就像当年一位哲人说的话，既未曾拿起，又何曾放下呢？\"\"你看'喝酒有害健康'，他第一句话告诉你早已成为共识，没有人说喝酒没有危害呀，也没有人觉得喝酒其实没害的。**他没有错误认识，谁需要你纠正？** 顶多不知道，但'不知道'不等于'错误认识'。\"\n  - 第二层：它在**转折之前**。\n- **C 项**\"探讨痴呆症与饮食习惯之间的关联\"：**错**。\"C 不能选，因为 C 没有这个'饮食'是不是也太大了一些？文段不是在喝酒吗？\"范围扩大。\n- **D 项**\"介绍关于饮酒危害健康的研究结论\"：✅ **正确**。\"这个 D 其实非常的不明确，这个 D 其实并不完美，很明显并不完美，因为它非常莫名其妙。但是这个'研究结论'它就可以概括这个最新的研究结论，虽然话没说清楚，但是它已经是 A、B、C、D 当中最好的了。\"\n\n**【本题要点】**\n\n> ⭐ **\"由此\"\"所以\"不一定总结全文**：可能只总结前半部分。判断依据仍然是\"**句子和句子之间的关系**\"——本段整体不是结论关系，而是\"不过\"转折。\n> ⭐ **转折之后引出新话题**（长 vs 短），此时\"转折之后是重点\"。\n> ⭐ **并列 ≠ 转折**：\"并列式都重要，转折是指示后面重要。\"\n> ⭐ 本段结构与第三节课\"下游违法者该不该追究责任\"那题**一模一样**——都是**提问—回答（问答）结构**：\"如果只是偶尔喝一次酒，也会造成伤害吗？\"\"会造成伤害吗？提了一个问题，然后接下来好像在回答。\"\n> ⭐ **不完美选项的取舍**：自己归纳的真正中心是\"偶尔（短期）喝酒也有危害\"，但选项没有这个词，**退而求其次选沾边的**。\n\n---\n\n### 例题 4｜2023 吉林 · 灵活就业的\"门槛\"\n\n**【题干原文】**\n\n> 例 4（2023 吉林）\n> 在关于灵活就业的讨论中，还有一种论调认为，灵活就业门槛过低、技能要求不高，年轻人投身其中是短视行为，不利于个人以及社会整体人力资本的积累。这种忧虑的初衷可以理解，但事实上，灵活就业进入的门槛确实不高，但要留存的门槛却并不低，也需要一定的技能支撑，灵活就业并不意味着\"低能\"。\n>\n> **这段文字意在强调：**\n\n**【选项原文】**\n\n> A. 并非所有灵活就业都是低门槛\n> B. 应摒弃对灵活就业形式的偏见\n> C. 灵活就业在职越久越要技能傍身\n> D. 年轻人对灵活就业无须过度忧虑\n\n**【答案】** ✅ **B**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n在关于灵活就业的讨论中，还有一种论调认为，……（引出某种观点）\n这种忧虑的初衷可以理解，但事实上，……并不意味着\"低能\"。（转折后提出作者观点）\n```\n\n> 板书圈画：圈「还有一种论调认为」「但事实上」「要留存的门槛」「\"低能\"」；选项层面动手删改 A（\"并非所有都是 d\"）、C（加\"时间→\"标记）、D（\"年轻人\"上打叉）。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找某种论调 | 抓出\"被批评的观点\" | \"还有一种论调认为，灵活就业门槛过低、技能要求不高，年轻人投身其中是短视行为\"→ 对灵活就业态度**消极** |\n| 2 看转折 | \"但事实上\"——先判断有无转折 | 前文消极、后文\"门槛确实不高，但要留存的门槛却并不低，也需要一定的技能支撑\"→ **态度转积极**。\"你说低，我说并不低\" |\n| 3 定性转折范围 | 局部转折不等于全文转折 | \"但其实就是部分的转折，它不是针对全文的\" |\n| 4 定重点 | 重点一定在后面 | \"所以这个但是上一定不要转折，所以重点一定在后面。\" |\n| 5 反推法验 A | 假设答案是 A，文段该怎么写？ | 教方法：**反推法**。若中心是 A\"并非所有都低门槛\"，文段必须写成\"有的灵活就业高、有的灵活就业低\"（**有的…有的…关系**），而文段**没有**体现这种关系 |\n| 6 排 C | 看 C 是否\"加戏\" | C 说\"在职越久越要技能傍身\"——文段**没有讲时间长短关系**，只讲\"但凡留存，你就需要\" |\n| 7 排 D | 抠主语 | D 的主语是\"年轻人\"，但**年轻人是被讨论的对象，不是发出这句话的人** |\n| 8 定 B | 与例 3 对照 | 例 3 是\"概括转折之后\"，例 4 是\"**反对前文**\"——B 项恰好对应\"有偏见可摒弃\" |\n\n**【逐项解析】**\n\n- **A 项**\"并非所有灵活就业都是低门槛\"：**错**。**反推法**——\"假设答案选它，那文段该怎么写？文段的意思是告诉你，灵活就业的门槛它就是有一定门槛的，它就是比较高的。那如果你这文段的中心是 A，文段就该表达'有的灵活就业高，有的灵活就业低'，它是一种**有的…有的…的关系**，而这个意思文段**没有体现出来**。文段就是说反正它其实还是要有技能支撑、要有门槛的。\"\n- **B 项**\"应摒弃对灵活就业形式的偏见\"：✅ **正确**。\"这个题就有偏见，这个题就是有一种论调……因为它真的有偏见呀，所以我可以摒弃。\"\n- **C 项**\"灵活就业在职越久越要技能傍身\"：**错**，犯了\"**加戏**\"。\n  > 老师举例说明：\"假设我举个例子，比如说我做一个公考英语老师。我待一年要求是这么高，待两年是这么高，待三年是这么高，待五年是这么高，待十年比天花板还高。请问文段有没有体现出'你的技能、能力一定要随着你的时间增加而增加'？有没有说？没有。他只是说你但凡留存，你就需要。\"\n  > \"他就说的是你，**但凡留存，我管你留是一年还是十年，我不重要**，反正你但凡要留存，你就要。他没有说你的时间越长越怎么样，他没有这个时间长短关系，**这不给自己加戏吗？**\"\n- **D 项**\"年轻人对灵活就业无须过度忧虑\"：**错**，**差在主语**。\n  > \"来这个地方很有意思，大家可以想想，我怎么把这个 D 改一改就对了？你把这个'对'把它往前放。**因为你这些论调，就是觉得这些年轻人是被讨论的对象，不是说话的那个人。**这个'年轻人'他是那些专家讨论的、被讨论的那些对象，不是说出去这句话的人。**所以你如果改成'对年轻人的灵活就业无须过度忧虑'是不是就可以了？**因为是这些专家学者在讨论年轻人的就业嘛，而不是说年轻人他们去讨论，他们又没有这个权利，他们又没有发声的渠道，他是一个被讨论的对象，他不是讨论的那个主体。是吧？**是不是很细节啊？**\"\n\n**【本题要点】**\n\n> ⭐ **为什么例 3 和例 4 放在一起？**——它们分别对应「转折文段答案」的**两种形式**：\n> - 例 3 = **概括转折之后**（但选项写得不完美，只能选沾边的 D）\n> - 例 4 = **反对前文**（B 项直接反驳了\"有偏见\"的那种论调，不需要把后文内容说出来）\n>\n> ⭐ **反推法（本讲新方法）**：判断某选项对不对，可以**假设它是对的**，反问\"那文段该怎么写？\"——如果写出来的文段结构与原文不符，该选项即排除。\n> ⭐ 转折文段里**\"前文有错才可以否定\"**：例 3 不能选\"纠正错误认识\"是因为**没有错误认识**（不是\"没有危害\"，是\"没有错误认识\"）；例 4 可以选\"摒弃偏见\"是因为**确实有错误论调**。\n> ⭐ 抠主语：C 项错在\"时间长短关系\"无中生有，D 项错在**主体颠倒**（把\"被讨论者\"当成\"讨论者\"）。\n\n---\n\n### 3.4 转折文段总结（省流版）\n\n**【PPT 原文】**\n\n```\n（六）转折文段 - 总结（省流版）\n\n考点回顾：\n转折之后是重点，转折之前不重要\n\n思维提升①：\n其实/事实上/实际上，并非一定表转折，只是引导一种事实\n\n思维提升②：\n转折文段的答案，既可以是 对转折前观点的否定，也可以是对转折后内容的阐述\n```\n\n> ⭐ 老师收束本板块：\"关于我们转折的，其实很简单，我觉得就是两个点。第一个，'其实/事实上/实际上'并不一定表转折；第二个，转折文段答案——再说一遍，**既可以是对转折前观点的否定，也可以是对转折后内容的阐述**。他俩之间其实很多时候**出题人不会都给你两个完美的选项**，他如果要给的话，他会让某一个选项变得有问题，让你能够放心地把它排掉，这是一般出题人的手法。\"\n>\n> 老师补充极端情况处置：\"如果我告诉你没有，如果我说了，出题人不会这样尽量为难你。**你如果非要问我的话，如果你真的遇到那种极端情况，那就选后面的**，因为它看起来更具体一些。\"\n\n---\n\n## 四、因果文段（PPT 第七节）\n\n### 4.1 考点回顾（PPT 原文）\n\n**【（七）因果文段 · 考点回顾】**\n\n```\n典型标志：因为……所以……；由于……因此……\n\n结论标志：\n1. 所以、因此、因而、故而、故\n2. 于是、可见、看来\n3. 这种情况下、可以说、换言之、对此、有鉴于此、总之、换句话说、简而言之……\n\n理论要点：结论之后是重点，尾句出现结论词重点关注\n典型错误选项特征：结论前的内容\n```\n\n> ⭐ 老师讲解：「结论标志」不要只停留在第一种情况——\n> \"很多人对于结论只停留在第一个情况，'所以''因此'，其实太狭隘了一些。**结论除了这个之外，还有'于是''可见''看来'；而且第三种情况，它也是结论。**你可以把这个第三种情况理解为**指代了前文**——他帮你把前文指代了，你看这是不是换言之嘛，'之'就是指代前面嘛。对此、有鉴于此、总之、换句话说、简言之，就他把前面给你指代了一下，指代了前面之后大概地去总结，所以它某种意义上也能起到总结的作用。\"\n\n**【考点二：尾句出现结论词】**\n\n> ⭐ 老师重点展开：\"第二个，**尾句出现结论词要重点关注**。这个东西呢，你乍一看感觉好像平平无奇，但是其实它的内涵很深刻。\"\n>\n> **使用场景**：正常做题还是正常做；**如果你说我这个题我不太懂（看不懂），但好巧不巧，这个题尾句有一个\"所以\"\"因此\"，那你就紧紧抓住尾句这个结论就可以了**——\"它作为中心句、它作为答案的概率**高达 80% 以上**。这个结论出现在尾句，它作为中心句的概率非常高，不是所有情况，但很高很高。\"\n>\n> **原理**：\n> 1. 如果这个结论词就是对整个前面做总结 → 分总结构，自不必说。\n> 2. 有人会问：\"结论可能只是一个部分的结论——可能只针对后半部分的某个部分，比如对一个例子做了个总结，那你凭什么说它也是重点？\"\n>    **答**：\"因为**例子和观点本质是一样的**。哪怕你是对例子总结，但是例子我们之前讲过——**例子的观点、例子的本质和观点其实是一样的**，不影响你选答案。\"\n>    老师举例回扣第二节课：「只此青绿」「人在画中游」那题，中间是例子，尾句做了个总结；**既可以理解为对整个前面的总结，也可以理解为对例子的总结，但不管怎么理解，都不影响选答案。**\n>\n> ⭐ 老师追问：\"首先你该正常做还是正常做。……你都有问题了，那你说你能干嘛吗？大概就是解决呗。\"——老师强调**做题要养成下意识**：\"你们要达到一种什么程度才能做得越快越好呢？**就是你看到这个出题人说的第一句，你就大概知道后面在干嘛了。**\"\n\n---\n\n### 4.2 思维提升①：文段为因果文段，答案可以是「因+果」结构\n\n**【PPT 原文】**\n\n```\n思维提升①：文段为因果文段，答案可以是\"因+果\"结构\n\n一、适用情况：当文段出现原因、意义论述的时候\n二、考察理由：反套路，不要因其像是\"非重点\"排除\n三、选项特点：\n   结论+原因/为什么+结论：（选这个答案是因为它体现了\"果\" 选它，至于\"因\"可有可无）\n\n例：考试难度越来越高，原因在于考试的人数越来越多，因此应该认真听课刷题。\n答案设置：① 应该认真听课刷题\n          ② 应该认真听课刷题的原因\n\n第一箭 -（2019 北京）B. \"废墟\"何以是美的\n```\n\n> **老师讲解要点**：\n> - \"因果文段答案很喜欢考**因 + 果**的结构。就是当文段中出现**很多原因论述**的时候，他答案喜欢这么出，就是答案中**既有原因也有结果**。\"\n> - **为什么这么出（反套路）**：\"因为有的人他就不喜欢'因'嘛，因为有的人说'老师你讲过因果，因果因不重要、果重要'，他看到一个因他就跑了。所以他这样说是为了**反套路**，**你不要因为它像非重点就把它排掉**。\"\n> - **选答案的依据**：\"所以我们选这个答案是因为它**体现了这个结果**，它有这个结果，它表达了结果的意思。至于那个因有没有，其实不重要——**你这个答案中有果就可以了**，这也是抓大放小。至于选项当中有没有把原因提出来，你爱提不提，提也行，不提也行，无所谓。\"\n> - **两种答案设置都可**：\"我说'考试难度越来越高，原因在于……'是因果结构，'因此应该认真听课刷题'是中心句，好，那重点是不是要把这个结果或者说这个对策给提出来？那答案一和二选哪个？**都可以**。\"\n> - **回扣第一节课**：\"比如说我们在第一节课当中举的例子，**废墟何以是美的**，这个'何以是'三个字，我觉得要不要也无所谓，我反正只需要体现出废墟、这个残体是美就可以了，这就够了，**这就及格了**。\"\n> - **概率提示**：\"但是从出题人的习惯来讲，**第二个出的更多一些**。原理归原理，理论归理论，概率归概率——就是从概率来讲，这种第二种出法会更多一些。\"\n\n---\n\n### 4.3 思维提升②：层层递进，重在开头和结果\n\n**【PPT 原文】**\n\n```\n思维提升②：层层递进，重在开头和结果，特别是结果\n\n一、适用情况：文段层次较为复杂，过程描述较多\n二、做题思维：首尾兼顾抓重点，特别是结果很重要\n\n例：好的成绩需要好的心态，好的心态需要好的身体，好的身体需要好的休息，好的休息需要好的睡眠\n这段文字意在？\n```\n\n> **老师讲解要点**：\n> - \"有些文段的层次比较复杂，**过程的描述非常的多**。这个时候记住**你不要被中间的这些过程给它干扰了**，你就抓重点就可以了，**首尾兼顾抓重点，特别是结果很重要**。\"\n> - 举例推演：\"好的成绩需要好的心态，好的心态需要好的身体，身体需要好的休息，休息需要好的睡眠……那这个文段在讲谁和谁的关系？根据刚才讲的，过程比较多、比较复杂，首尾兼顾抓重点，特别是结果很重要，抓什么？是不是肯定都有睡眠？而且一般是首尾，所以他应该就会说'好的成绩需要好的睡眠'。\"\n> - \"就有点像判断推理里**搭桥**的感觉。所以大家一定要注意，过程只要很多，你不用太在意，一定要抓重点、抓结果，**首尾、特别是结果**。\"\n\n---\n\n### 4.4 思维提升③：哪怕尾句有结论词，也要结合上下文\n\n**【PPT 原文】**\n\n```\n思维提升③：哪怕尾句有结论词，也不建议大家只看尾句，一定要结合上下文\n\n例：这么简单的题目你都做不对，所以，赵老师你真是太让我惊讶了！\n    这么难的题目你都可以做对，所以，赵老师你真是太让我惊讶了！\n\n这段文字意在强调：A. 赵老师很厉害  B. 赵老师很差劲\n```\n\n> **老师讲解要点**：\n> - **前提条件说清楚**：\"我刚才说的'尾句出现结论词、只关注尾句'，**什么情况下你可以只看尾句呢？是这个题你正常做不会做、你看不懂，你看也白看，那还不如只看尾句**。\"\n> - \"**但是如果你看得懂，这个时候尾句有结论词，你就不能只看尾句了，你一定要结合上下文。**\"\n> - 例子推演：\"我说'所以赵老师你真是太让我惊讶了'。那请问这段文字强调的是赵老师很厉害，还是赵老师很差劲？我就告诉你他的尾句——那请问答案选 A 还是选 B 呢？**不知道！** 那我哪知道'惊讶'是什么意思呀？你凭什么觉得'惊讶'就是厉害呢？\"\n> - \"我如果前面说'**这么简单的题目你都做不对**，所以赵老师你真是太让我惊讶了'——这是一个**消极的**，那这个时候就选 B 嘛。\"\n> - \"那如果说'**这么难的题目你都可以做对**，所以赵老师你太让我惊讶了'——那不就选 A 嘛。\"\n> - ⭐ \"**你别只要但凡看得懂，你别只看尾句——挖坑就这么给你挖！**\"\n\n---\n\n### 例题 5｜2025 江苏 · 非遗与传承人口述调查\n\n**【题干原文】**\n\n> 例 5（2025 江苏）\n> 由于历史上非物质文化遗产没有文字著录，而非遗最重要的内容——记忆和技艺，都保存在传承人的身上，这就带来了巨大的不确定性。如果传承中断，记忆和技艺就会立即丢失，这项非遗也就消失了。只有通过传承人的口述记录，将这些无形的记忆和技艺转化为文字，才能将其确凿地保存下来。故而本世纪以来，自民间文化遗产抢救工作和非遗名录建立肇始，对传承人的口述调查便成了为非遗建档普遍采用的不可或缺的方式，有时甚至是唯一的方式，也是最可靠的方法。\n>\n> **这段文字意在强调：**\n\n**【选项原文】**\n\n> A. 为非遗建档是亟待完成的非遗传承工作\n> B. 口述调查是进行非遗研究最可靠的方法\n> C. 对传承人口述调查于保存非遗作用很大\n> D. 传承人是做好非遗抢救工作的关键因素\n\n**【答案】** ✅ **C**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n由于历史上非物质文化遗产没有文字著录……这项非遗也就消失了。（提出问题）\n只有通过传承人的口述记录，将这些无形的记忆和技艺转化为文字，才能将其确凿地保存下来。（提出对策）\n故而本世纪以来，自民间文化遗产抢救工作和非遗名录建立肇始，对传承人的口述调查便成了为非遗建档普遍采用的不可或缺的方式，有时甚至是唯一的方式，也是最可靠的方法。（总结前文）\n```\n\n> 板书圈画：圈「非遗最重要的内容」「不确定性」「只有通过传承人的口述记录」「（提出对策）」；正文中「不可或……」（不可或缺）与「传承」被圈；选项 A 上画斜线、B 上打叉、C 处画对勾、D 上打叉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 看首句 | 抓话题 | \"大概跟非遗有关系\" |\n| 2 找问题词 | 见消极表述即判问题 | \"不确定性\"\"消失\"→ 两个字送给它：**问题** |\n| 3 找对策 | 有问题就好说，接下来大概就是解决 | \"**只有通过传承人的口述记录**，将这些无形的记忆和技艺转化为文字，才能将其确凿地保存下来\"→ 只有才是条件关系/表对策 |\n| 4 找新话题 | 对策中出现新东西 | \"出现了一个新玩意儿——**口述记录**（前面没有口述记录嘛）\"，所以到这儿重点就是口述记录 |\n| 5 看尾句 | 尾句有结论词「故而」 | \"故而……对传承人的口述调查便成了……不可或缺的方式……也是最可靠的方法\" |\n| 6 抓强信号词 | \"出题人生怕你不知道谁重要\" | \"不可或缺\"\"唯一\"\"最可靠\"——所有强信号都指向**口述调查** |\n| 7 对比选项找差异 | 剩下 B、C 都有对策，对比差异 | \"C 怎么比 B 多了一个**传承人**呢？那就看一看文章有没有呢？**有**。你不是对什么领导的口述调查，不是对县长市长的口述调查，你是对**传承人**的口述调查。\" |\n| 8 定答案 | — | 选 C |\n\n**【逐项解析】**\n\n- **A 项**\"为非遗建档是亟待完成的非遗传承工作\"：**错**。没有\"口述调查\"这个核心对策，属于结论前的内容/未抓到核心。\n- **B 项**\"口述调查是进行非遗研究最可靠的方法\"：**错**（相对 C 而言）。**差别在少了\"传承人\"**：\"C 比 B 多了一个传承人\"，而文段明确讲的是\"对**传承人**的口述调查\"。\n- **C 项**\"对传承人口述调查于保存非遗作用很大\"：✅ **正确**。既有\"口述调查\"这一对策，又有\"传承人\"这一对象。\n- **D 项**\"传承人是做好非遗抢救工作的关键因素\"：**错**。**没有\"口述调查\"这个核心对策**——\"你就先把谁干掉，你没有口述调查肯定不行。\"\n\n**【本题要点】**\n\n> ⭐ **抓大放小**：老师现场\"忠告\"——\"我希望不要再有同学问我为啥不选 A、D。因为在我眼里就只有**非遗**和**传承人的口述**，别的只要你没有大问题都无所谓。\"\n> ⭐ **不要一见绝对表述就批判**：\"当然有的时候'老师我不选 B，是因为他有\"最可靠\"。\"我因为 B 有'最可靠'就不选它，大家觉得这个理由对不对？**不要看到这种特别绝对的，就一味的批判**，你们得看看文段呀。\"\n>\n> 老师现场\"假设\"验证：\"我假设没有 C 项，我也假设一下，我说这个题如果没有 C，我再把 B 加一个传承人，我说'对传承人的口述调查是非遗研究最可靠的方法'，行不行？**那肯定选呀！**……同学们看一看来，**这不是我说，这文段有文段，白纸黑字，它就是'最可靠'**。你**忠于原文**！\"\n>\n> ⭐ **上帝视角批判**：\"我特别不喜欢上帝视角讲课。就是我当时在做这题的时候，**谁能够一上来就关注到传承人呢？** 其实我觉得一般人都只能关注到口述记录、口述调查。这个时候就**一定要靠选项来给你提示**——剩下两个选项就对比选项找差异，他们就告诉你：B 没有传承人，C 有，那就看一看到底有没有。\"\n\n---\n\n### 例题 6｜2023 国考 · 月球的两副面孔\n\n**【题干原文】**\n\n> 例 6（2023 国考）\n> 科学家早就知道月球有两面：面向地球的一面较为平坦，背向地球的一面凹凸不平，遍布撞击坑，月球为何具有截然不同的两副面孔，是其众多谜团之一。近日，科学家提出一种全新解释：数十亿年前，形成月球背面盆地的巨大撞击，产生了足以传遍月球的巨大热量，促成月幔物质的熔化，其中的稀土和放射性生热元素钍以及钾、磷等被携带到与撞击区域对称的月面，形成克里普岩，分布在月球正面风暴洋及其周围，放射性生热元素的集中，产生了月球表面的熔岩流，最终形成月球正面的火山平原。\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. 盆地与平原：两副面孔，两种材质\n> B. 月球上的熔岩流：亟待开发的宝藏\n> C. 双面月球：一次撞击，两种结局\n> D. 放射性生热元素：月球的化妆师\n\n**【答案】** ✅ **C**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n科学家早就知道月球有两面：……月球为何具有截然不同的两副面孔，是其众多谜团之一。（提出结果）\n近日，科学家提出一种全新解释：……最终形成月球正面的火山平原。（解释原因）\n```\n\n> 板书圈画：圈出「月球有两面」；选项 C 处批注\"（双面月球的原因，结论+原因表述）\"，并在 C 上画大圈勾选；A 项\"两副面孔，两种材质\"、B 项\"熔岩流\"、D 项\"放射性生热元素\"被划掉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先把对象找到 | 开篇就说了月球 | \"月球题大概就围绕月球来讲嘛\" |\n| 2 回扣第二节课首句 | 听过第二节课讲首句的，就不会纠结 A、D | \"你是不是一定不会纠结 A？肯定讲月球嘛。\" |\n| 3 抓核心话题 | 讲的是\"两副面孔\" | \"他讲的是两副面孔，就两面的意思嘛\" |\n| 4 识别\"冒号\" | 冒号后面就是解释 | \"他说'科学家提出一种全新解释：'冒号就是，这就是已经非常明显的提示，在干嘛呀？就是告诉你为啥呀？\" |\n| 5 定性中间大段 | 后面这一堆重不重要？ | \"他就在解释原因，告诉你来龙去脉\"——撞击产生热量→熔化→带到对称区域→熔岩流→最终形成正面火山平原 |\n| 6 定结构 | 总分结构 / 观点 + 举例说明 | \"这个题是一个非常典型的总分结构，或者说观点 + 举例说明。那原因和结果，**我抓结果就可以了**\" |\n| 7 抓结果 | 结果就是那五个字 | \"**月球有两面**\"，答案选 C |\n| 8 排选项 | 抓大放小 | A 没有月球；B 和 D 没有两面，直接排掉 |\n\n**【逐项解析】**\n\n- **A 项**\"盆地与平原：两副面孔，两种材质\"：**错**。**没有\"月球\"**——\"A 没有月球\"。老师：\"剩下的这几个，A 没有月球，B 和 D 没有两面，直接排掉。\"\n- **B 项**\"月球上的熔岩流：亟待开发的宝藏\"：**错**。**没有体现\"两面\"**；且\"熔岩流\"是**中间的过程**，不重要（\"你也可以认为 B 的'熔岩流'、D 的'放射性生热元素'是属于中间的过程，不重要\"）。\n- **C 项**\"双面月球：一次撞击，两种结局\"：✅ **正确**。**\"双面月球\"就是结果**，\"而后面这个'一次撞击，两种结局'，它恰恰表明的是**原因**。所以 C 就相当于'双面月球的原因'一个意思。\"\n- **D 项**\"放射性生热元素：月球的化妆师\"：**错**。放射性生热元素属于中间过程，不重要。\n\n**【本题要点】**\n\n> ⭐ 有人质疑\"C 没提到热元素\"——老师回答：\"**这重要吗？这解释嘛！** 好好补习一下第一节课。**这解释不重要，你管中间这么多干嘛呢？只是过程不重要，就是噪音，都是噪音。**\"\n> ⭐ **首句定对象**：开篇的\"月球\"就把范围框定了，A 项不含月球即出局。\n> ⭐ 老师点明本题定位：\"有的老师觉得这个题好像不难——**我们是为了讲理论，题目不重要**，你想难题还不容易吗？年后有的是你们折磨的，所以我们先把基础打扎实。\"\n\n---\n\n### 例题 7｜2021 四川 · 蜜蜂与咖啡因\n\n**【题干原文】**\n\n> 例 7（2021 四川）\n> 美国《科学》杂志的一项研究表明：咖啡因是让蜜蜂忠诚专一的物质。正如咖啡因会刺激人类的大脑一样，这种化学物质也可以刺激蜜蜂的大脑，特别是其中一个叫蕈形体的脑区域，这一区域跟气味的学习和记忆有关。咖啡因的摄入使得蜜蜂深刻地记住了在柑橘和咖啡花朵上采集花蜜这件事情。所以在接下来很长的一段时间里，蜜蜂都离不开这种特殊味道的花蜜了。\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. 花蜜与咖啡因\n> B. 难以抗拒的咖啡因\n> C. 蜜蜂为何\"单恋一枝花\"\n> D. 蜜蜂学习和记忆的奥秘\n\n**【答案】** ✅ **C**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n美国《科学》杂志的一项研究表明：……咖啡因的摄入使得蜜蜂深刻地记住了在柑橘和咖啡花朵上采集花蜜这件事情。（原因分析）\n所以在接下来很长的一段时间里，蜜蜂都离不开这种特殊味道的花蜜了。（指出咖啡因带给蜜蜂的结果）\n```\n\n> 板书圈画：圈「咖啡因是让蜜蜂忠诚专一的物质」「所以」「离不开这种特殊味道的花蜜」；选项 C 处画大圈勾选，A、B、D 均被划掉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 看首句 | 引出咖啡因和蜜蜂的关系 | \"咖啡因是让蜜蜂忠诚的物质，也引出咖啡因和蜜蜂的关系\" |\n| 2 中间大段 | 判断性质 | \"反正还是过程\"——刺激大脑、蕈形体、气味学习记忆 |\n| 3 抓\"所以\" | 表结论，只用关注结论 | \"所以嘛，表结论嘛，你只用关注结论就可以了\" |\n| 4 定位尾句结论 | 尾句有结论则重点关注 | \"接下来很长一段时间，蜜蜂离不开花蜜\" |\n| 5 辨因果 | 尾句是果，前文就是因 | \"既然尾句是果，那前文就是因，**谁是因？咖啡因是因**。很巧妙很巧合，咖啡因就是因嘛\" |\n| 6 定重点 | 因和果谁重要 | \"一定是**果**重要——就是那个广告语'用了就离不开它'\" |\n| 7 语义替换 | 把\"离不开\"对应到形象表述 | \"蜜蜂为何'单恋一枝花'——这是一个形象表述，但表达的意思一样，'单恋一枝花'嘛，就对应到离不开这种味道的花蜜\" |\n| 8 定答案 | — | 选 C |\n\n**【逐项解析】**\n\n- **A 项**\"花蜜与咖啡因\"：**错**。**A 是原因**。\"A 和 B 是原因，现在理解了没有？A、B 是原因，它不是关键词。所以**主题词，不是例词，主题词最主要的还是看结尾**。\"\n- **B 项**\"难以抗拒的咖啡因\"：**错**。同上，**是原因不是结果**。\n- **C 项**\"蜜蜂为何'单恋一枝花'\"：✅ **正确**。尾句是果——\"蜜蜂离不开这种特殊味道的花蜜\"，\"单恋一枝花\"即其形象替换。\n- **D 项**\"蜜蜂学习和记忆的奥秘\"：**错**。\"选 D 同学有点莫名其妙吧。你的重点是**离不开**，你要体现出蜜蜂它得有必要条件、它得有'我需要你'，是不是跟你怎么学习、怎么记忆没关系。\"\n\n**【本题要点】**\n\n> ⭐ **\"咖啡因\"虽然首句就出现、且高频，但它是\"因\"**——老师强调：\"主题词最主要的还是看结尾。\"\n> ⭐ **首句不是绝对引导主题**：\"第一个，那只是概率，只是大概率；第二个，它也引出来了呀——**它引出来的是蜜蜂嘛**。所以有的时候你得看完整，老师讲的所有东西它都不是绝对化的，一定要灵活处置。\"\n> ⭐ 本题本质也是**因果结构**，只是**把\"因\"囊括进尾句当中**了：\n> \"你可以把 C 理解为'改为蜜蜂单恋一枝花的原因'，是不是相当于蜜蜂单恋一枝花的原因？'为何'指的不就是咖啡因吗？就蜜蜂因为难以抗拒的咖啡因，所以它单恋了一枝花，就这个意思嘛。**你把结果抓准。**\"\n> ⭐ 顺带一提：\"老师，啥叫动名词？你可以报一个我们宇飞老师的课，让专业的中文出身的老师来告诉你什么叫动名词。\"\n\n---\n\n### 例题 8｜2023 山东 · 春阳社解散的原因\n\n**【题干原文】**\n\n> 例 8（2023 山东）\n> 春阳社成立之初，社员成分比较复杂，商学界名流众多，艺术倾向和审美趣味多样。首演《黑奴吁天》时为扩大影响邀请戏曲名伶参与演出，骨干演员也多为商界京戏爱好者，以致把戏演成中西大杂烩，这显然不是王钟声倡导新式演剧的初衷。故在首演后他就调整方向，在短短的四个月内频繁举行公演，不难发现其中贯穿着一条明显的动机线索，即借\"创设音乐学校\"之名为培养戏剧新人筹集办学经费。可以这样说，春阳社解散的更深层原因，是王钟声试图摆脱那些爱好京戏的绅商社员，创办演艺学校培养新剧人才，开展专业性演出，实现其以演剧开通民智、改良社会的宏大理想。\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. 春阳社因何解散\n> B. 春阳社与旧时代\n> C. 新式演剧的悲剧\n> D. 以演剧改良社会\n\n**【答案】** ✅ **A**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n春阳社成立之初，……即借\"创设音乐学校\"之名为培养戏剧新人筹集办学经费。（背景）\n可以这样说，春阳社解散的更深层原因，是王钟声试图摆脱那些爱好京戏的绅商社员，创办演艺学校培养新剧人才，开展专业性演出，实现其以演剧开通民智、改良社会的宏大理想。（原因）\n```\n\n> 板书圈画：圈「春阳社成立之初」「王钟声」「可是」「春阳社解散的更深层原因」；选项 A 处画大圈勾选，B、C、D 被划掉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 回顾旧知识点 | 首句＋尾句都是\"春阳社\" | \"第一句又是春阳社是吧？整个文字好像也是。而尾句也是春阳社\" |\n| 2 判断是否为例题 | **全篇讲同一对象，故不是例子** | \"从开篇到结尾，全在讲春阳社，它是例子吗？**不是。**\" |\n| 3 联想旧题 | 回扣第二节课 | \"让我们想起了之前的哪两道题？**上海和长三角**。上海和长三角这两个，我是特意放在'关于怎么正确理解例子'当中去讲解的。\" |\n| 4 承认读不懂 | 坦白考场实况 | \"他前面其实讲了很多有的没的，我说实话，你们不一定看得懂……也没事，你在考场上一定会遇到这种情况，**那有技巧就可以用一用**。\" |\n| 5 用技巧 | 尾句出现结论词 | \"比如说我们讲过尾句出现结论词，如果你真看不懂，你就看尾句就行\" |\n| 6 抓尾句 | 提取尾句关键 | \"春阳社解散的原因是……\"→ 后面**看不看不看都行**，反正知道结果是\"解散\" |\n| 7 匹配选项 | 找\"解散的原因\"形式 | \"而且这个表述'因何解散'，这不就是春阳社解散的原因吗？**又来了**（因+果结构）。\" |\n| 8 排 C、D | 补一条保障 | \"第一个，整个文章在讲春阳社，咱们不用考虑 C、D——**起码能不做 C、D 就不做**，除非 A、B 有别的问题。\" |\n| 9 排 B | — | \"什么'旧时代'跟'解散'有啥关系？干掉。\" |\n\n**【逐项解析】**\n\n- **A 项**\"春阳社因何解散\"：✅ **正确**。对应尾句结论词引导的\"春阳社解散的更深层原因\"，也是标准的\"因+果\"结构表述。\n- **B 项**\"春阳社与旧时代\"：**错**。\"'旧时代'跟'解散'有啥关系？没关系，干掉。\"\n- **C 项**\"新式演剧的悲剧\"：**错**。全文对象是**春阳社**，不是\"新式演剧\"。\n- **D 项**\"以演剧改良社会\"：**错**。它只是文段最末尾提到的**王钟声的理想**（背景性的理想表述），不是文段的中心。\n\n**【本题要点】**\n\n> ⭐ **识别\"例子\"的新标准**：如果**开篇到结尾都在讲同一个对象**，那它**不是例子**（对比第二节课的\"上海和长三角\"）。\n> ⭐ **做题为上，理解为辅**：老师专门解释了这段背景的含义——\n> \"王钟声他其实最开始成立春阳社是有一个更好的初衷：**他想救国，他想改良社会，他要开通民智**。那他为什么要把它给解散呢？因为他发现成立完之后**失控了**——这些演员干的事情跟他的初衷并不一致。那怎么办？他就转换了思想：既然你们不能为我做事儿，那我就干脆互相利用，**我就趁你们演这个的时候赚钱嘛**，我就单纯把它看成一个赚钱的行为，**等钱赚够了，我就把它解散掉**就行了。\"\n> ⭐ ⭐ 老师的方法论金句：\"**所以我希望大家以后做题，就你做题归做题，理解归理解，这两个都得做到位。** 遇到你不懂的东西的时候，你做的时候可以先不用搞清楚；但是如果你做完之后，我希望你还是要花心思去把搞不懂的地方，不管是词也好还是文段也好，**要自己查查明白**。你不要偷懒——**偷懒的害的是你自己。**\"\n\n---\n\n### 例题 9｜2025 重庆 · 冬小麦与\"四时\"观念\n\n**【题干原文】**\n\n> 例 9（2025 重庆）\n> 历史早期季节体系的发展演变与农事周期之间具有紧密联系。殷商及其以前的\"二时\"观念是围绕种植粟、黍等农作物的农事活动而产生的一种社会时间，殷商以来对冬小麦的推广种植并使其嵌入到固有的农业结构中，推动了先秦时期人们\"四时\"观念的萌生与演进，所以，\"四时\"观念的产生，是在对既有的\"二时\"观念进一步细化的基础上得以实现的，而冬小麦的推广种植及其在农业生产中重要地位的逐渐凸显，成为人们细化\"二时\"观念为\"四时\"观念的契机。\n>\n> **这段文字主要讲述的是：**\n\n**【选项原文】**\n\n> A. 社会时间超过自然时间之外而独立存在\n> B. 先秦\"四时\"观念与\"二时\"观念的联系\n> C. 冬小麦的推广种植在农业生产中的重要地位\n> D. 冬小麦的推广种植与先秦\"四时\"观念的产生\n\n**【答案】** ✅ **D**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n历史早期季节体系的发展演变与农事周期之间具有紧密联系。（引出话题）\n殷商及其以前的\"二时\"观念是围绕种植粟、黍等农作物的农事活动而产生的一种社会时间，（殷商之前的情况）\n殷商以来对冬小麦的推广种植并使其嵌入到固有的农业结构中，推动了先秦时期人们\"四时\"观念的萌生与演进，所以，\"四时\"观念的产生，是在对既有的\"二时\"观念进一步细化的基础上得以实现的，而冬小麦的推广种植及其在农业生产中重要地位的逐渐凸显，成为人们细化\"二时\"观念为\"四时\"观念的契机。（得出结论）\n```\n\n> 板书圈画：圈「历史早期季节体系的发展演变与农事周期之间具有紧密联系」「\"四时\"观念」「所以」「而冬小麦的推广种植及其在农业生产中重要地位」；旁批\"四时→二时\"\"来自\"；选项 A 上打叉、B 上打叉、C 上画三角标记、D 处打对勾。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 承认难度 | \"这个题其实有一定难度，我讲两个方法\" | — |\n| 2 **方法一（常规）**：读内容 | 解释背景 | \"'二时'是什么意思？就是可能以前人们不分春夏秋冬，可能以前人们觉得一年只有春季和秋季。\" |\n| 3 抓变化链 | 冬小麦 → 从\"二时\"到\"四时\" | \"有了冬小麦之后，大家对待一年的时间，从二时变成四时了。\"（四时＝春、夏、秋、冬） |\n| 4 抓\"所以\" | 结论之后是重点 | \"'四时'观念的产生，是在'二时'的基础上实现的\"→ \"四时是由二时变过来的\" |\n| 5 看尾句的\"而\" | 不纠结关联词，**看内容** | \"而冬小麦的推广种植，它的地位逐渐凸显，成为人们细化'二时'观念变成'四时'观念的**契机**\" |\n| 6 辨明方向 | \"是由\"还是\"来自\"？ | 老师强调：\"**这个是'来自'的意思，不是'变成'，是'来自'。** 你看你没有冬小麦，你是不可能从二时变成四时的，它是观念的契机嘛，契机就是机会的意思。\" |\n| 7 提取\"必需品\" | 结果必须含冬小麦 | \"你反正是不是得有冬小麦啊？因为这是尾句的重中之重，又被'所以'引导之后，又在'而'后面表强调\" |\n| 8 先排 AB | A、B 都没有冬小麦 | \"帮你先把 A、B 干掉，你在 C、D 里面选一个更好的，这个时候就容易多了\" |\n| 9 对比 C、D | — | \"D 说冬小麦和'四时'观念的产生，C 只说冬小麦在农业生产中的重要地位——**文段肯定不是只讲冬小麦怎么种植的**，而是它跟人们对待时间的观念有关系\" |\n| 10 **方法二（快捷）**：首句定调 | 首句已把文段基调告诉你 | \"我在讲谁和谁的关系？**季节体系的发展和农事周期**。季节和农事就可以理解冬小麦嘛，季节呢，二时或者是四时。那不就是 D 吗？\" |\n\n**【逐项解析】**\n\n- **A 项**\"社会时间超过自然时间之外而独立存在\"：**错**。\"时间超过自然时间之外而独立存在\"——文段并未讨论社会时间与自然时间的关系。\n- **B 项**\"先秦'四时'观念与'二时'观念的联系\"：**错**。**没有冬小麦**。\"你没有冬小麦肯定不行。\"\n- **C 项**\"冬小麦的推广种植在农业生产中的重要地位\"：**错**。**只讲了冬小麦，丢了\"时间（四时）\"**。\"文段肯定不是只讲冬小麦怎么种植的，而是它跟人们对待时间的观念是有关系的，不管是二时还是四时，一定跟时间有关系。所以哪怕你对文段不是很了解，你 D 作为答案的概率是不是比 C 高？\"\n- **D 项**\"冬小麦的推广种植与先秦'四时'观念的产生\"：✅ **正确**。因子（冬小麦）与果（\"四时\"观念的产生）兼具。\n\n**【本题要点】**\n\n> ⭐ **两个方法双保险**：\n> 1. **尾句重中之重法**：尾句既在\"所以\"引导之后，又在\"而\"后面强调——\"冬小麦是契机\"，所以答案必须有冬小麦。\n> 2. **首句定调法**：\"**首句还在发挥作用**——第一句话已经把文段的探讨范围、把答案告诉你了：'季节体系的发展和农事周期之间具有紧密联系'。\"\n> ⭐ **因+果结构再次应验**：本题与例 5（口述调查）\"一样的\"——都得抓那个\"必需品\"。\n> ⭐ ⭐ 老师的学习观金句：\"**如果你想提高的话，一定要有好的做题思维。我知道改变自己很难，因为你们有很多固有的不太对的观念。我相当于在让你们否定过去的自己，这个东西很难接受，但是你想提高，你只能这样提高。** 你们想，如果你觉得你没问题，那分又上不来——那肯定有原因的呀，这说明可能你们之前的一些想法是不太对的。\"\n\n---\n\n### 例题 10｜2022 重庆选调 · 西风带与冷空气南下\n\n**【题干原文】**\n\n> 例 10（2022 重庆选调）\n> 西风带原本是条近乎平直的稳定东行的纬向气流，当气流发生波动时，我们把向南凹的部分称为\"槽\"，向北凸的部分称作\"脊\"。西风带上\"槽\"的形成与冷空气的向南移动有关，而\"脊\"的形成往往意味着中纬度地区有暖空气向北发展。当\"脊\"不断向北发展，其南部与南方暖空气的联系被中高纬度冷空气截断后，将会形成一个闭合的暖中心，称为\"阻塞高压\"。这种阻塞高压稳定少动，持续时间长，它破坏了西风带环流，有利于波动的形成和发展，即南北向气流的发展，从而给冷空气的南下打开了\"通道\"。\n>\n> **这段文字意在说明：**\n\n**【选项原文】**\n\n> A. 西风带是如何流动的\n> B. 冷空气是如何南下的\n> C. \"阻塞高压\"是如何形成的\n> D. \"槽\"和\"脊\"是如何波动的\n\n**【答案】** ✅ **B**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n西风带原本是条近乎平直的稳定东行的纬向气流，……而\"脊\"的形成往往意味着中纬度地区有暖空气向北发展。（介绍槽和脊的形成）\n当\"脊\"不断向北发展，其南部与南方暖空气的联系被中高纬度冷空气截断后，将会形成一个闭合的暖中心，称为\"阻塞高压\"。（引出话题 阻塞高压）\n这种阻塞高压稳定少动，持续时间长，它破坏了西风带环流，有利于波动的形成和发展，即南北向气流的发展，从而给冷空气的南下打开了\"通道\"。（指代前文，得出结论）\n```\n\n> 板书圈画：圈「西风带原本」「从而给冷空气的南下打开了\"通道\"」；选项 B 上打对勾，A、C、D 均被划掉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 读首句 | 认识三个概念 | 西风带＝稳定的纬向气流；波动时，向南凹的叫\"**槽**\"，向北凸的叫\"**脊**\" |\n| 2 画图理解 | 老师现场画图 | \"南方是暖空气，北方是冷空气，按道理相当于被西风带隔断了。如果它发射了一个槽和脊，就可能形成一个闭合的暖中心。\" |\n| 3 看中间 | 判断性质 | 槽、脊、阻塞高压的形成——**都是过程** |\n| 4 抓关键转折 | \"从而\" | \"从而给冷空气南下打开了'通道'\" |\n| 5 定性前文 | 前文都是铺垫 | \"所以他前面讲这么多干嘛呀？是不是相当于**为了这盘醋包的这个饺子**？我想解释为什么冷空气南下，我不给你解释西风带的槽、脊，我是解释不清楚的。\" |\n| 6 定结果 | 结果是\"冷空气南下\" | \"所以结果是冷空气南下，而你前面全可以当成**原因或者是过程**。\" |\n| 7 排干扰项 | 逐项验证 | A\"西风带如何流动\"在首句（第一句不重要）；C\"阻塞高压如何形成\"在指代词之前（指代词之前不重要）；D\"槽和脊\"在**前文**中，**尾句里没有槽、脊了**，而且文段也没讲\"如何波动\" |\n| 8 定答案 | — | 选 B |\n\n**【逐项解析】**\n\n- **A 项**\"西风带是如何流动的\"：**错**。对应首句\"稳定东行的纬向气流\"，属于**非重点**（第一句不重要）。\n- **B 项**\"冷空气是如何南下的\"：✅ **正确**。对应尾句结果\"从而给冷空气的南下打开了'通道'\"。\n- **C 项**\"阻塞高压是如何形成的\"：**错**。\"阻塞高压\"出现在**指代词**（\"这种\"）**之前**，属于非重点。\n- **D 项**\"槽\"和\"脊\"是如何波动的：**错**，两点原因：\n  1. \"首先，槽和脊在前文当中，**你尾句就没有槽、脊了**。\"\n  2. \"**文段也没有讲你怎么波动的**。\"\n\n**【本题要点】**\n\n> ⭐ **\"为了这盘醋包的饺子\"**（本讲高频比喻）：前面所有铺垫都只是为了解释最后那句结果。\n> ⭐ **指代词之前不重要**：尾句的\"这种阻塞高压\"是**指代前文**的，被指代的部分属结论前内容。\n> ⭐ ⭐ 老师点出本讲\"最精彩的地方\"：\n> \"此题为何首句没有话题呢？你说的很对，这就是一个**特殊情况**。其实有，其实有这个'如何'，相当于概括了。**所以因果文段它就容易出现这种情况**——你说答案当中有没有第一句话的意思？其实有，但是'如何'你把 B 收完整就有了，就是**冷空气是因为西风带不再稳定**，导致它南下了，就这个意思。它其实有，只是没有说清楚。\"\n\n---\n\n### 补充例题 A｜26 国考行政执法（考生回忆）· 中纬度极端寒潮\n\n> 老师说明：\"这个题当时刚刚出来的时候，我印象很深刻……当时某机构给的答案是 D。然后当时我正在上线下课，就有学生过来问我，为什么这个题答案不选 B？……**我就坚持认为选 B。我为这句话负责**……后来果然改答案了。\"\n\n**【题干原文】**\n\n> （26 国行政执法回忆）\n> 中纬度地区高空的西风带，是在北极极涡外环绕全球一周的强大气流，由上升的赤道暖空气在向两极运动过程中受地球自转影响而偏转形成。西风带就像是地球大气环流中的一根\"皮筋儿\"，其松紧程度取决于赤道和极地之间的温度差。当温差较大时，西风带流动较强，冷空气被束缚在极地。而随着全球变暖，南北温差减小，西风带环流变弱，这根\"皮筋儿\"变松了。当北极涡分裂南下时，冷暖空气的南北交汇现象会变得更加剧烈。西风带上尺度大尺度波动的增强，会使中纬度地区的天气过程变得更加极端，急剧降温，并且持续时间更长。\n>\n> **这段文字主要解释了：**\n\n**【选项原文】**\n\n> A. 为何中纬度地区会有极端寒潮天气\n> B. 为何中纬度地区高空会形成西风带\n> C. 西风带的风力为何如此巨大而持久\n> D. 西风带的风力为何与南北温差有关\n\n**【答案】** ✅ **A**\n\n**【PPT 板书标注】**\n\n> 板书圈画：圈「西风带」「急剧降温」；选项 A 上打对勾，B、C、D 均被划掉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 与例 10 对照 | 本质是同一类题 | \"我记得……你看西风带，看到这个降温，那不就是这个题吗？**此时此刻，恰恰如彼时彼刻。**\" |\n| 2 形象化理解 | 皮筋比喻 | \"西风带像一根皮筋，它就会把这个冷暖空气给阻隔掉，冷空气被束缚在极地。但是随着一些过程，这个西风带它松了。\" |\n| 3 推演链条 | 波动 → 交汇 → 降温 | \"它松了，那就可能像刚刚那个题一样有一个波动；那波动的话呢，冷暖空气就交汇了呀；那交汇着交汇着，那中纬度就会降温呢。\" |\n| 4 抓结果 | \"还是抓结果呀\" | \"结果是什么？结果是会使中纬度地区天气过程变得极端，急剧降温——**你抓'变冷'不就行了吗？**\" |\n| 5 匹配选项 | — | \"那不选什么选什么？**选 A 嘛**。'为何中纬度地区会有极端的寒潮天气'。B 跟 C 跟冷没关系，D 讲的是南北温差，别人讲的是中纬度。行了，选 A。\" |\n| 6 复盘用时 | — | \"这个题我花了半分钟……这正确率好像不到五十吧。\" |\n\n**【逐项解析】**\n\n- **A 项**\"为何中纬度地区会有极端寒潮天气\"：✅ **正确**。对应尾句结果\"使中纬度地区的天气过程变得更加极端，急剧降温\"。\n- **B 项**\"为何中纬度地区高空会形成西风带\"：**错**。对应首句（结论前/过程），且**与\"冷\"无关**。\n- **C 项**\"西风带的风力为何如此巨大而持久\"：**错**。**与\"冷\"无关**。\n- **D 项**\"西风带的风力为何与南北温差有关\"：**错**。文段讲的是**中纬度地区的降温**，\"别人讲的是中纬度\"。\n\n**【本题要点】**\n\n> ⭐ **同类题一致性**：与例 10（2022 重庆选调）\"是不是一个题？是不是一类？是不是就一模一样？\"\n> ⭐ ⭐ \"**他就是为了这盘醋包的饺子**——他不给你介绍清楚西风带的变化，他就解释不清楚为什么中纬度会变冷。**所以过程、原因不重要，我的结果就是我怎么就变冷了呢？** 就像武汉一样，怎么最近这么冷呢？因为西风带波动了，它不再那么紧绷了。那行了。\"\n\n---\n\n### 补充例题 B｜2020 国考 · 慕课发展与高校作用（讲义外补充）\n\n> 老师说明：\"好，所以我就再来一个比较……拿一个这个题，**大家讲义没有，但是我想讲一讲**。就这个题当时刚刚出来的时候，我印象很深刻。当时某机构给的答案是 D。……我就说这个题，**我就坚持认为选 B**。我为这句话负责，我绝对干过这件事情。当这个题机构答案是 D 的时候，我就坚持认为答案就是 B。它不可能是 D。**后来果然改答案了。**\"\n\n**【题干原文】**\n\n> （2020 国考）\n> 现代信息技术与高等教育教学的融合，衍生出大规模在线开放课程，打破了传统教育的时空界限和学校围墙。六年来，中国慕课从无到有，从小到大，在实践中总在向一个共识靠近，那就是高等教育作为高层次人才的主要供给者，知识创新的主要推动者，要回应时代需求，就必须创新发展，把慕课建设作为加快中国教育现代化、发展\"互联网+教育\"\"智能+教育\"的战略先手棋，推进这场深度融合信息技术与教育教学的课堂革命向纵深发展。这就意味着，慕课的建设与发展必然离不开高校的参与和支持、学校与社会的共同协力。\n>\n> **这段文字意在：**\n\n**【选项原文】**\n\n> A. 介绍中国慕课的发展理念和现状\n> B. 强调高校应在慕课发展中发挥重要作用\n> C. 说明高校需重视高级人才的培养和储备\n> D. 探讨中国慕课突破传统的新思路\n\n**【答案】** ✅ **B**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先看首句定话题 | 首句讲的是什么 | \"我从第一句开始讲的是**现代信息技术和高等教育融合**\" |\n| 2 抓高频词与感情色彩 | 注意\"总在\" | \"你看大家注意这个词啊，**感情色彩**——'**总在**向一个共识靠近'，那就是高等教育是主要供给者、主要推动者\" |\n| 3 判选项分布 | A、C 选的人不多 | \"'慕课的发展理念和现状'……这个题选 A 和 C 其实并不多，它可能就是在 B 和 D 里面纠结嘛。\" |\n| 4 破解机构解析 | 机构为何定 D？ | \"他解析说的是'这个高校的作用在尾句有点片面'——他觉得是'高校、学校和社会'三并列。\" |\n| 5 关键断句 | 破解\"片面\"指控 | \"**你不要把它看成一个三并列，你把它看成一个两并列**：'高效的参与和支持' / '学校与社会的共同协力'。这'学校'指的就是高校，所以这个 B 一点都不片面。\" |\n| 6 逻辑反证 | 前文讲半天高教，尾句突然不要高校？ | \"难道我前面白讲了吗？我前面讲了半天高等教育，结果你告诉我尾句高校不重要了。**合理吗？合不合理？一定不合理。** 所以他一定得有高校。\" |\n| 7 定答案 | — | 选 B |\n\n**【逐项解析】**\n\n- **A 项**\"介绍中国慕课的发展理念和现状\"：**错**。仅对应中间部分描述，未抓到尾句重点。\n- **B 项**\"强调高校应在慕课发展中发挥重要作用\"：✅ **正确**。尾句\"慕课的建设与发展必然离不开高校的参与和支持、学校与社会的共同协力\"，\"学校\"即高校。\n- **C 项**\"说明高校需重视高级人才的培养和储备\"：**错**。偏离文段重心（文段讲的是高校要参与支持慕课建设）。\n- **D 项**\"探讨中国慕课突破传统的新思路\"：**错**。老师明确否定：\"他**说这个高校作用在尾句有点片面**……但是如果你因为这个原因选了 D 项，是非常不符合逻辑的。\"\n\n**【本题要点】**\n\n> ⭐ **断句决定成败**：\"**注意这个句子应该怎么断？** '高校的参与和支持'/'学校与社会的共同协力'。你不要把它看成一个三并列，你把它看成一个两并列。**这个'学校'它指的就是高校**，所以 B 一点都不片面。\"\n> ⭐ **\"片面\"指控的破解思路**：如果某选项被指\"片面\"，先看是不是自己**断句错了**（三并列 vs 两并列）。\n> ⭐ 回扣\"抓大放小\"：\"你不要关注别的，你就抓关键的看……**这个题在你眼里就只有高校和慕课**。\"\n\n---\n\n### 例题 11｜2022 山西 · 叙事医学\n\n**【题干原文】**\n\n> 例 11（2022 山西）\n> 叙事医学是一种具有叙事能力的医学实践，而叙事能力是指能够吸收、解释并被疾病的故事所感动的能力。这种能力有助于临床医生在医疗活动中提升对患者的共情能力、职业精神、亲和力和自我行为的反思。叙事医学要求医生在临床决策过程中聆听病人的叙事，关注家属等社会关系人的叙事。这样，医生才可以获取更多有助于临床决策的信息，才能作出正确的疾病诊断，提出最适合病人的决策建议，最后和患方共同作出首先保障病人利益，又能平衡各方权益的诊疗选择。\n>\n> **这段文字意在说明：**\n\n**【选项原文】**\n\n> A. 叙事医学有助于医患共同决策\n> B. 叙事医学可化解当下医疗分歧\n> C. 叙事医学可避免技术至上误区\n> D. 叙事医学有利于当前医学实践\n\n**【答案】** ✅ **A**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n叙事医学是一种具有叙事能力的医学实践，而叙事能力是指能够吸收、解释并被疾病的故事所感动的能力。……叙事医学要求医生在临床决策过程中聆听病人的叙事，关注家属等社会关系人的叙事。（引出话题）\n这样，医生才可以获取更多有助于临床决策的信息，才能作出正确的疾病诊断，提出最适合病人的决策建议，最后和患方共同作出首先保障病人利益、又能平衡各方权益的诊疗选择。（讲述其作用）\n```\n\n> 板书圈画：圈「叙事医学」「叙事能力」「这样」「和患方共同作出」「首要保障病人利益」；选项 A 处画大圈勾选，B 上圈「化解」打叉，C 上圈「技术至上」打叉，D 上圈「有利于当前医学实践」打叉。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找主题词 | 引出话题 | \"叙事医学是一种具有叙事能力的医学实践\"——\"它的主题词肯定有**叙事医学**，答案中都有了\" |\n| 2 找第二主题词 | 从前面内容看它跟谁有关 | \"他一定要被**疾病的故事**所感染，也就是和**病人、患者**的关系\" |\n| 3 带着前文看尾句 | 看懂前文后尾句更清晰 | \"当你把这个地方看懂了之后，你再看尾句，就可能会更加清晰，获得更多的信息\" |\n| 4 抠尾句关键词 | 抓\"患方\"\"病人\" | \"最后和**患方**共同作出，首先**保障病人**的利益\"——\"这个时候你才会注意到，'患方'这个词确实很重要\" |\n| 5 反证 D | 若只看尾句会怎样 | \"如果你不看前面，那你就很容易忽略尾句当中对于患者、对于病人的这个重要性的体察，你就很容易选到 D 项，**甚至会觉得这个'医患'的'患'有点片面**。\" |\n| 6 破除\"片面\"顾虑 | 回应\"医学实践\"四字 | \"但凡选 D 的同学，就是他觉得'我通过医学实践四个字，能够非常好地概括这个尾句'。\" |\n| 7 定答案 | 抓主题词 | \"答案一定要有**医患**，而不选 D 这个'有利于医学实践'——相比于'医患'就有点**范围扩大**。\" |\n\n**【逐项解析】**\n\n- **A 项**\"叙事医学有助于医患共同决策\"：✅ **正确**。尾句\"和患方共同作出……诊疗选择\"即\"医患共同决策\"。\n- **B 项**\"叙事医学可化解当下医疗分歧\"：**错**。**\"没有讲分歧\"**——\"至于什么化解医疗分歧，没讲。\"\n- **C 项**\"叙事医学可避免技术至上误区\"：**错**。\"至于技术至上，那更没讲到了。\"\n- **D 项**\"叙事医学有利于当前医学实践\"：**错**。**范围扩大**——\"这个'有利于医学实践'，相比于'医患'就有点范围扩大。\"\n\n**【本题要点】**\n\n> ⭐ **为什么\"病人\"不片面？**：\"因为整个文段从开头铺垫了半天，他讲的就是**你要和患者共情，就是要倾听病人故事**，所以尾句的重点也一定要继续围绕**患方**来讲，这才是符合逻辑的。\"\n> ⭐ **抓主题不要管形式**：\"'叙事医学'不是对策吗？你不用管，你先抓主题，不要管形式。再说一遍——第一，叙事医学；第二，它强调的一定是**病人**。你把这个意思表达出来就可以了。\"\n> ⭐ 关于\"医患共同决策\"这一说法：\"很多同学可能不太懂这个什么叫所谓的'医患共同决策'……你如果觉得这个说法不行，可能只是因为你社会阅历可能不太够。**就比如你家里人如果要做手术的话，你要签什么？知情同意书。任何大的医疗决策都不是医生能够单独下的，一定是医生和患者共同决策的。**\"\n\n---\n\n### 例题 12｜2024 河北 · 运动干预脑衰老\n\n**【题干原文】**\n\n> 例 12（2024 河北）\n> 神经科学领域已有研究揭示脑衰老的分子、细胞、器官、系统多层级多种生物学特征，它们相互依赖、彼此互为联系，共同构成脑衰老特征及其发生机制的复杂性。此外，该领域新技术和新方法的应用也使研究内容得到极大丰富与发展。在对抗衰老过程中维持脑健康及其功能，是一项挑战，运动可以通过改善脑衰老的生物学特征及生理功能，促进脑的可塑性。因此，临床实践中运动干预可作为补充策略，改善衰老人群及相关慢性疾病患者的脑健康。\n>\n> **最适合做这段文字标题的是：**\n\n**【选项原文】**\n\n> A. 运动促进脑生长：加强认知与记忆\n> B. 运动干预脑衰老：新进展与再认识\n> C. 运动改变脑结构：挑战性与安全性\n> D. 运动影响脑健康：运动疗法有前景\n\n**【答案】** ✅ **B**\n\n**【PPT 板书标注】（画面逐字）**\n\n```\n神经科学领域已有研究揭示脑衰老的分子、细胞、器官、系统多层级多种生物学特征，……此外，该领域新技术和新方法的应用也使研究内容得到极大丰富与发展。（关于脑衰老的一些成果）\n在对抗衰老过程中维持脑健康及其功能，是一项挑战，运动可以通过改善脑衰老的生物学特征及生理功能，促进脑的可塑性。（话题来到对抗衰老）\n因此，临床实践中运动干预可作为补充策略，改善衰老人群及相关慢性疾病患者的脑健康。（结论）\n```\n\n> 板书圈画：圈「脑衰老」「此外」「运动」「因此」「运动干预」；选项 A、C、D 中的「脑生长」「脑结构」「脑健康」被圈并打叉；选项 B 处画大圈勾选。\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先抓主题词 | 别只看\"因此\" | \"这个题我就直接讲尾句，如果你只看尾句，你其实不太容易做对。\"\"这个题很典型——出题人坏心思，**恰恰在最重要的这个尾句，他没有告诉你'脑衰老'三个字**。\" |\n| 2 回看前文 | 全文高频词是\"脑衰老\" | \"你看脑袋的衰老嘛，共同构成脑衰老特征\"；\"该领域也是脑衰老\"；\"在对抗衰老过程中，维持脑健康也是脑衰老\" |\n| 3 破解尾句 | 尾句只是把\"脑衰老\"拆开讲 | \"他说'运动干预可作为补充策略，改善衰老人群及相关慢性疾病患者的脑健康'——**他只不过把'脑衰老'三个字拆开讲**，他只是拆开讲了，但意思肯定是一个意思。\" |\n| 4 逻辑推演 | 前面讲半天脑衰老，尾句不可能不讲 | \"你不能前面我讲了半天脑衰老，结果你告诉我一句'它不是脑衰老'，**可能性太低了**。\" |\n| 5 定答案 | 抓主题词 | \"所以这个题一定要先抓主题词\"→ 选 B |\n| 6 抓大放小看细节 | 其余词都无所谓 | \"什么叫'新进展和再认识'？你有这些新的技术方法，是不是进展呀？你发现它可以作为补充策略去改善，这不就是再认识吗？没问题。**只要你大的方向对就可以了。**\" |\n| 7 回扣对策+对象 | 尾句本身就是对策+对象 | \"运动干预在这儿，脑衰老在这里，**这不也是对策加对象吗？运动干预是对策，脑衰老是对象**。\" |\n\n**【逐项解析】**\n\n- **A 项**\"运动促进脑生长：加强认知与记忆\"：**错**。**\"脑生长\"\"加强认知与记忆\"**——\"至于什么脑生长、脑结构、脑健康，跟**衰老**没关系，别人都是讲衰老。\"\n- **B 项**\"运动干预脑衰老：新进展与再认识\"：✅ **正确**。既含对策（运动干预）又含对象（脑衰老）。\n- **C 项**\"运动改变脑结构：挑战性与安全性\"：**错**。\"脑结构\"偏离\"脑衰老\"这一高频主题词。\n- **D 项**\"运动影响脑健康：运动疗法有前景\"：**错**。只是把\"脑衰老\"拆开的一个结果表述，未含\"脑衰老\"这一核心对象。\n\n**【本题要点】**\n\n> ⭐ **\"因此\"后面不一定有完整主题词**——\"出题人恰恰在最重要的尾句没有告诉你'脑衰老'三个字，但是脑衰老重不重要？**很重要**，因为它就是文段开篇的话题呀。\"\n> ⭐ ⭐ **主题词三大方法**（老师本讲给的口诀）：\n> ```\n> 中心句、首句（首句引导）、高频词\n> ```\n> 老师原话：\"我们说主题词三个方法——**中心句、首句和高频**，你肯定得有'衰老'，对不对？得有衰老啊。\"\n> ⭐ **不要问\"运动干预\"行不行**：\"运动干预不是你怎么还在问运动干预行不行呢？**这不原词吗？** 你看一看吧，睁眼看世界——这不是尾句结论词的原词嘛，运动干预。\"\n\n---\n\n## 五、本讲方法框架总表\n\n### 5.1 转折文段 · 三件套\n\n| 编号 | 名称 | 内容 | 来源 |\n| --- | --- | --- | --- |\n| 1 | 考点回顾 | 转折之后是重点，转折之前不重要（**站在整个文段的角度**，是句子和句子之间的关系） | PPT（六） |\n| 2 | 思维提升① | 其实 / 事实上 / 实际上，**并非一定表转折，只是引导一种事实**；只有引导的事实与前文构成**矛盾关系**，才是转折关系 | PPT（六） |\n| 3 | 思维提升② | 转折文段的答案，**既可以是对转折前观点的否定，也可以是对转折后内容的阐述** | PPT（六） |\n\n**操作流程**\n\n```\n第 1 步 找转折标志：虽然…但是… / 尽管…可是… / ……不过…… / ……然而…… / ……却…… / 其实、事实上、实际上\n第 2 步 对\"其实/事实上/实际上\"做内容判断：\n        前文事实 与 后文事实 是否构成矛盾关系？\n          → 是 = 真转折，转折之后是重点\n          → 否 = 只是引导事实，不表转折（往往是在举例 / 补充）\n第 3 步 判答案形式：可选\"否定前文观点\"，也可选\"阐述转折后内容\"\n第 4 步 若两种形式选项同时出现 → 出题人一般会让其中一个有硬伤（缺主题词 / 加戏 / 主体错位）；\n        若真出现两难 → 选表述更明确、更具体的那个（通常在后）\n第 5 步 排除转折前的内容（典型错误选项特征）\n```\n\n### 5.2 因果文段 · 四件套\n\n| 编号 | 名称 | 内容 | 来源 |\n| --- | --- | --- | --- |\n| 1 | 考点回顾① | 典型标志：因为……所以……；由于……因此……\u003cbr>结论标志三类：① 所以、因此、因而、故而、故；② 于是、可见、看来；③ 这种情况下、可以说、换言之、对此、有鉴于此、总之、换句话说、简而言之…… | PPT（七） |\n| 2 | 考点回顾② | 理论要点：结论之后是重点，**尾句出现结论词重点关注**；典型错误选项特征：结论前的内容 | PPT（七） |\n| 3 | 思维提升① | 文段为因果文段，答案可以是「因+果」结构（反套路：不要因其像是\"非重点\"而排除） | PPT（七） |\n| 4 | 思维提升② | 层层递进，**重在开头和结果，特别是结果** | PPT（七） |\n| 5 | 思维提升③ | 哪怕尾句有结论词，也不建议只看尾句，**一定要结合上下文** | PPT（七） |\n\n**操作流程**\n\n```\n第 1 步 找结论标志：所以/因此/因而/故而/故；于是/可见/看来；这种情况下/可以说/换言之/对此/有鉴于此/总之/换句话说/简而言之\n第 2 步 判断结论范围：是对全文总结？（分总结构）还是只对局部（例子/解释）总结？\n           → 即使是局部总结也照用，因为\"例子的本质和观点是一样的\"，不影响选答案\n第 3 步 抓\"果\"：因果文段的核心是结果，选项含\"果\"即可（\"因\"可有可无）\n第 4 步 过程繁复 → 首尾兼顾，特别是结果（层层递进型）\n第 5 步 尾句有结论词时：看不懂 → 可只看尾句（命中率约 80% 以上）；\n                        看得懂 → 必须结合上下文，不能只看尾句（防挖坑）\n第 6 步 排除结论前的内容\n```\n\n### 5.3 本讲通用「抓大放小」操作卡\n\n```\n① 只抓两类信息：主题词（对象 / 对策内容） + 结果（果）\n② 中间的解释、原因、举例、过程 = 噪音，不影响选答案\n③ 选项比对：先看有没有主题词（对象），再看有没有结果/对策内容\n④ 内容 > 形式：选的是\"意思\"，不是选关联词、不是选\"应该\"这类虚词\n⑤ 两选项纠结 → 对比选项找差异（差异点往往就是考点，如例 5 的\"传承人\"）\n⑥ 首句 = 话题范围提示：纠结时回看首句讲的是\"谁和谁的关系\"\n⑦ 反推法：假设某选项是答案，反问\"那文段该怎么写？\"——结构不符即排除\n```\n\n---\n\n## 六、易错点与陷阱清单\n\n| 序号 | 陷阱 | 正解 | 出处 |\n| --- | --- | --- | --- |\n| 1 | 一见\"其实/事实上/实际上\"就判转折 | 它只是**引导一种事实**，只有与前文构成**矛盾关系**才叫转折 | 思维提升①·例 1／例 2 |\n| 2 | 只看一句话里的\"但是\"，不看整体 | 转折是**句子和句子之间**的关系，必须站在**整个文段**的角度 | 考点回顾 |\n| 3 | 认为\"转折后内容的阐述\"是唯一答案形式 | 也可是\"**对转折前观点的否定**\" | 思维提升②·例 3／例 4 |\n| 4 | 因为正确答案长得像尾句就认定文段是转折 | **要实事求是**——看它有没有**反驳前文**（例 2 的\"事实上\"不表转折） | 例 2 |\n| 5 | 见\"所以/由此\"就以为是全文结论 | 它可能**只总结前半部分**（例 3 的\"由此\"只总结长期饮酒那段） | 例 3 |\n| 6 | 把\"并列\"当\"转折\" | 并列＝**都重要**；转折＝**后面重要**，有本质区别 | 例 3 |\n| 7 | 选答案只认\"应该\"等对策标志词 | **内容 > 形式**，选的是对策的**内容**，不是那个虚词 | 例 2 |\n| 8 | 见到\"最可靠\"\"唯一\"等绝对表述就一票否决 | 要看文段——**忠于原文**，如果文段白纸黑字写了\"最可靠\"，就选它 | 例 5 |\n| 9 | 自己给选项\"加戏\"（加原文没写的时间、程度关系） | 例 4 的 C 项\"在职越久越要技能傍身\"——文段没有时间长短关系 | 例 4 |\n| 10 | 忽略选项的**主语/主体** | 例 4 的 D 项把\"被讨论者（年轻人）\"当成\"讨论者\"，必须改语序才成立 | 例 4 |\n| 11 | 只抓\"因此\"后面的字面内容，忽略全文高频主题词 | 例 12 尾句没有\"脑衰老\"三字，但它才是文段主题词 | 例 12 |\n| 12 | 习惯性\"只看尾句结论词\" | 前提是**看不懂**；看得懂时必须结合上下文（\"惊讶\"的例子） | 思维提升③ |\n| 13 | 把\"首句引导主题\"当成绝对规律 | 那只是**大概率**；有时尾句才是主题词所在（例 7 咖啡因是\"因\"不是主题词） | 例 7 |\n| 14 | 误判\"三并列\"，导致误判\"片面\" | 例 B 中\"高校的参与和支持\"/\"学校与社会的共同协力\"是**两并列**，\"学校\"＝高校 | 补充例题 B |\n| 15 | 被选项的\"片面\"指责带偏 | 反向验证：如果选该选项，前文那一大段是不是白讲了？ | 补充例题 B |\n| 16 | 不知道\"例子和观点本质一样\"，质疑局部结论词无效 | 即使结论只总结了一个例子，也不影响它作为重点 | 考点回顾二 |\n| 17 | 读音／同音字误记（转写稿错误） | 以画面为准：如\"雅文化 / 俗文化\"\"蕈形体\"\"克里普岩\"\"阻塞高压\"\"春阳社\" | 全讲 |\n\n---\n\n## 七、⭐ 老师金句\n\n> ⭐ **\"内容一定要大于什么？形式！我要找对策是找'应该'这个词吗？我是选这个对策的内容！\"**\n\n> ⭐ **\"咱们要实事求是——你不能因为正确答案长得跟它像，你就认为文段是转折关系、重点在尾句。我觉得是不对。\"**\n\n> ⭐ **\"他就是为了这盘醋，包的饺子。\"**（讲西风带、月球、慕课等题的铺垫与结果关系时反复使用）\n\n> ⭐ **\"此时此刻，恰恰如彼时彼刻。\"**（发现两道题思路一致时说）\n\n> ⭐ **\"我也假设一下……白纸黑字，它就是'最可靠'。你忠于原文！\"**\n\n> ⭐ **\"我特别不喜欢上帝视角讲课。谁能够一上来就关注到传承人呢？这个时候就一定要靠选项来给你提示。\"**\n\n> ⭐ **\"做题归做题，理解归理解，这两个都得做到位。你不要偷懒——偷懒的害的是你自己。\"**\n\n> ⭐ **\"我相当于在让你们否定过去的自己，这个东西很难接受，但是你想提高，你只能这样提高。\"**\n\n> ⭐ **\"为什么有的同学做题会很快？他们就养成下意识了——你看到出题人说的第一句，你就大概知道后面在干嘛了。\"**\n\n> ⭐ **\"别人都把对象给你拎出来了，你也不用关心对象是谁，你抓住对策本身。这就叫抓大放小。\"**\n\n> ⭐ **\"睁眼看世界。\"**（提醒学生别问\"运动干预行不行\"这种画面原词问题）\n\n> ⭐ **\"不要看到这种特别绝对的，就一味地批判——你们得看看文段呀。\"**\n\n> ⭐ **\"既未曾拿起，又何曾放下呢？\"**（讲\"纠正错误认识\"前提必须先有\"错误认识\"）\n\n---\n\n## 八、本讲总结板书（省流版）原文照录\n\n**【总结（省流版）】· 张弓言语十二箭（四）- 转折因果**\n\n```\n                              ┌─ 考点回顾 ── 转折之后是重点，转折之前不重要\n                              │\n              ┌─ 转折文段 ───┤                    ┌ 其实/事实上/实际上，并非一定表转折，只是引导一种事实\n              │               └─ 思维提升 ──┤\n              │                                └ 转折文段的答案，既可以是转折前观点的否定，\n              │                                  也可以是对转折后内容的阐述\n张弓言语十二箭 ─┤\n（四）-转折因果│                                ┌ 结论标志：总结作用的，或是指代前文的\n              │               ┌─ 考点回顾 ──┤ 结论之后是重点，结论前不重要\n              │               │                └ 尾句出现结论词可以重点关注\n              └─ 因果文段 ───┤\n                              │                ┌ 文段为因果文段，答案可以是\"因+果\"结构，是因为\"果\"选择\n                              └─ 思维提升 ──┤ 层层递进，过程繁复的，重在开头和结果，特别是结果\n                                               └ 哪怕尾句有结论词，也不建议大家只看尾句，一定要结合上下文\n```\n\n> **老师口头总结（逐句）**：\n> \"其实内容其实没有特别多，转折和因果。转折之后是重点，前面不重要。\n> 思维提升，第一个'事实上''实际上'表示时不一定表转折；第二个转折文段答案可以是对前面的否定，也可以是对后面的阐述。\n> 到了因果，首先回顾一下考点，'总结''指代'的都叫结论词，结论后重要、结论前不重要，而且尾句出现结论词可以重点关注，如果文段看不懂又在尾句发现了结论词，可以这个时候特殊情况特殊考虑，只看尾句。\n> 然后思维提升就是三点：第一个因果文段答案经常也是因果结构，那是**因为'果'选它**，而不是因为'因'选它；第二个层层递进、过程繁复的，重在开头和结果，特别是结果；最后一个，哪怕尾句结论词，在你看得懂的情况下，尽量看完整，不建议大家只看尾句，要结合上下文。\"\n\n---\n\n**本讲完整例题清单（共 14 道）**\n\n| 序号 | 年份·来源 | 主题 | 答案 |\n| --- | --- | --- | --- |\n| 例 1 | 2025 福建 | 雅文化与俗文化 | D |\n| 例 2 | 2020 浙江 | 农村三产融合发展 | C |\n| 例 3 | 2023 青海 | 饮酒危害健康 | D |\n| 例 4 | 2023 吉林 | 灵活就业的\"门槛\" | B |\n| 例 5 | 2025 江苏 | 非遗与传承人口述调查 | C |\n| 例 6 | 2023 国考 | 月球的两副面孔 | C |\n| 例 7 | 2021 四川 | 蜜蜂与咖啡因 | C |\n| 例 8 | 2023 山东 | 春阳社解散的原因 | A |\n| 例 9 | 2025 重庆 | 冬小麦与\"四时\"观念 | D |\n| 例 10 | 2022 重庆选调 | 西风带与冷空气南下 | B |\n| 补充 A | 26 国考行政执法（考生回忆） | 中纬度极端寒潮 | A |\n| 补充 B | 2020 国考（讲义外） | 慕课发展与高校作用 | B |\n| 例 11 | 2022 山西 | 叙事医学 | A |\n| 例 12 | 2024 河北 | 运动干预脑衰老 | B |\n","outline":[{"level":2,"text":"一、本讲知识地图","id":"一本讲知识地图"},{"level":2,"text":"二、开课回顾：第三讲「对策文段」思维导图速览","id":"二开课回顾第三讲对策文段思维导图速览"},{"level":2,"text":"三、转折文段（PPT 第六节）","id":"三转折文段ppt-第六节"},{"level":3,"text":"3.1 考点回顾（PPT 原文）","id":"31-考点回顾ppt-原文"},{"level":3,"text":"3.2 思维提升①：其实 / 事实上 / 实际上 ≠ 必然转折","id":"32-思维提升其实-事实上-实际上-必然转折"},{"level":3,"text":"3.3 思维提升②：转折文段答案的两种形式","id":"33-思维提升转折文段答案的两种形式"},{"level":3,"text":"例题 1｜2025 福建 · 雅文化与俗文化","id":"例题-12025-福建-雅文化与俗文化"},{"level":3,"text":"例题 2｜2020 浙江 · 农村三产融合发展","id":"例题-22020-浙江-农村三产融合发展"},{"level":3,"text":"例题 3｜2023 青海 · 饮酒危害健康","id":"例题-32023-青海-饮酒危害健康"},{"level":3,"text":"例题 4｜2023 吉林 · 灵活就业的\"门槛\"","id":"例题-42023-吉林-灵活就业的门槛"},{"level":3,"text":"3.4 转折文段总结（省流版）","id":"34-转折文段总结省流版"},{"level":2,"text":"四、因果文段（PPT 第七节）","id":"四因果文段ppt-第七节"},{"level":3,"text":"4.1 考点回顾（PPT 原文）","id":"41-考点回顾ppt-原文"},{"level":3,"text":"4.2 思维提升①：文段为因果文段，答案可以是「因+果」结构","id":"42-思维提升文段为因果文段答案可以是因果结构"},{"level":3,"text":"4.3 思维提升②：层层递进，重在开头和结果","id":"43-思维提升层层递进重在开头和结果"},{"level":3,"text":"4.4 思维提升③：哪怕尾句有结论词，也要结合上下文","id":"44-思维提升哪怕尾句有结论词也要结合上下文"},{"level":3,"text":"例题 5｜2025 江苏 · 非遗与传承人口述调查","id":"例题-52025-江苏-非遗与传承人口述调查"},{"level":3,"text":"例题 6｜2023 国考 · 月球的两副面孔","id":"例题-62023-国考-月球的两副面孔"},{"level":3,"text":"例题 7｜2021 四川 · 蜜蜂与咖啡因","id":"例题-72021-四川-蜜蜂与咖啡因"},{"level":3,"text":"例题 8｜2023 山东 · 春阳社解散的原因","id":"例题-82023-山东-春阳社解散的原因"},{"level":3,"text":"例题 9｜2025 重庆 · 冬小麦与\"四时\"观念","id":"例题-92025-重庆-冬小麦与四时观念"},{"level":3,"text":"例题 10｜2022 重庆选调 · 西风带与冷空气南下","id":"例题-102022-重庆选调-西风带与冷空气南下"},{"level":3,"text":"补充例题 A｜26 国考行政执法（考生回忆）· 中纬度极端寒潮","id":"补充例题-a26-国考行政执法考生回忆-中纬度极端寒潮"},{"level":3,"text":"补充例题 B｜2020 国考 · 慕课发展与高校作用（讲义外补充）","id":"补充例题-b2020-国考-慕课发展与高校作用讲义外补充"},{"level":3,"text":"例题 11｜2022 山西 · 叙事医学","id":"例题-112022-山西-叙事医学"},{"level":3,"text":"例题 12｜2024 河北 · 运动干预脑衰老","id":"例题-122024-河北-运动干预脑衰老"},{"level":2,"text":"五、本讲方法框架总表","id":"五本讲方法框架总表"},{"level":3,"text":"5.1 转折文段 · 三件套","id":"51-转折文段-三件套"},{"level":3,"text":"5.2 因果文段 · 四件套","id":"52-因果文段-四件套"},{"level":3,"text":"5.3 本讲通用「抓大放小」操作卡","id":"53-本讲通用抓大放小操作卡"},{"level":2,"text":"六、易错点与陷阱清单","id":"六易错点与陷阱清单"},{"level":2,"text":"七、⭐ 老师金句","id":"七-老师金句"},{"level":2,"text":"八、本讲总结板书（省流版）原文照录","id":"八本讲总结板书省流版原文照录"}]}]},{"name":"02 · 细节判断与语句表达（第五~七讲）","items":[{"id":"P06","title":"晦涩文段与细节判断题","full":"【言语理解与表达】张弓言语·十二箭 · 第 06 集（正课第五讲）","lect":"","dur":"113:00","sec":6780,"theme":"","url":"","md":"# 【言语理解与表达】张弓言语·十二箭 · 第 06 集（正课第五讲）\n\n> **课程名称**：张弓言语·十二箭（适用 26 国考 / 省考 / 多省联考 / 选调生 / 事业单位 / 三支一扶）\n> **讲师**：张弓（上岸村）\n> **本集位置**：合集第 6 集（共 14 P；正课第 5 讲，**中心理解模块收官**）\n> **视频地址**：https://www.bilibili.com/video/BV14RzZBuEz3?p=6\n> **时长**：约 113 分钟\n> **本集主题**：**中心理解收官——晦涩文段的两个抓手（主题词·高频与首句／多者之间的关系）＋ 细节判断题（审题、做题顺序、优先验证、选项关键信息、四大易错陷阱）**\n\n---\n\n## 目录\n\n- [〇、开篇：对「言语」这门科目的顶层认知](#〇开篇对言语这门科目的顶层认知)\n- [一、昨日回顾：转折与因果](#一昨日回顾转折与因果)\n- [二、中心理解收官：晦涩文段](#二中心理解收官晦涩文段)\n  - [2.1 什么叫晦涩文段](#21-什么叫晦涩文段)\n  - [2.2 思维提升①：主题词（高频与首句）](#22-思维提升主题词高频与首句)\n    - [例题 1｜2024 国考 · 大模型赋能生成式人工智能](#例题-12024-国考大模型赋能生成式人工智能)\n    - [例题 2｜2022 浙江 · 制造与服务融合](#例题-22022-浙江制造与服务融合)\n  - [2.3 思维提升②：重视多者之间的关系（特别是二者）](#23-思维提升重视多者之间的关系特别是二者)\n    - [例题 3｜2023 四川 · 莲子心的叶绿素合成](#例题-32023-四川莲子心的叶绿素合成)\n    - [例题 4｜2023 浙江 · Cas9 与 PAM 识别序列](#例题-42023-浙江cas9-与-pam-识别序列)\n  - [2.4 晦涩文段·总结（省流版）](#24-晦涩文段总结省流版)\n- [三、细节判断题](#三细节判断题)\n  - [3.1 考情扫描（量程 / 提问方式 / 本质 / 方法 / 错项类型）](#31-考情扫描量程--提问方式--本质--方法--错项类型)\n  - [3.2 思维提升①：做题顺序建议](#32-思维提升做题顺序建议)\n  - [3.3 思维提升②：快速解题技巧（优先验证）](#33-思维提升快速解题技巧优先验证)\n  - [3.4 思维提升③：如何抓取选项的关键信息](#34-思维提升如何抓取选项的关键信息)\n  - [3.5 思维提升④：几个常见的误区](#35-思维提升几个常见的误区)\n    - [例（2020 江苏）· 海底石油](#例2020-江苏海底石油误区四的配套例题)\n  - [3.6 细节判断题·总结（省流版）](#36-细节判断题总结省流版)\n- [四、细节判断题·例题精讲](#四细节判断题例题精讲)\n  - [例题 5｜2024 国考 · 穿山甲与微型机器人](#例题-52024-国考穿山甲与微型机器人)\n  - [例题 6｜2023 青海 · 现代社会是陌生人社会](#例题-62023-青海现代社会是陌生人社会)\n  - [例题 7｜2021 广东选调 · 睡眠与 β 淀粉样蛋白](#例题-72021-广东选调睡眠与-β-淀粉样蛋白)\n  - [例题 8｜2022 江苏 · 数字孪生](#例题-82022-江苏数字孪生)\n  - [例题 9｜2025 安徽 · 现代设施农业](#例题-92025-安徽现代设施农业)\n  - [例题 10｜26 国考行政执法（回忆）· 半规管与气压变化](#例题-1026-国考行政执法回忆半规管与气压变化)\n  - [例题 11｜2025 江苏 · 司法建议](#例题-112025-江苏司法建议)\n  - [例题 12｜2026 四川 · 额尔齐斯河](#例题-122026-四川额尔齐斯河)\n  - [课前顺序练习｜2025 联考 · 隐私计算（仅判断顺序，未讲解）](#课前顺序练习2025-联考隐私计算仅判断顺序未讲解)\n- [五、课后答疑（六问）](#五课后答疑六问)\n  - [答疑题｜2024 山西 JJW · 血清钠与健康](#答疑题2024-山西-jjw血清钠与健康)\n- [六、本讲方法框架总表](#六本讲方法框架总表)\n- [七、易错点与陷阱清单](#七易错点与陷阱清单)\n- [八、⭐ 老师金句](#八-老师金句)\n- [九、下讲预告](#九下讲预告)\n\n---\n\n## 〇、开篇：对「言语」这门科目的顶层认知\n\n张弓老师在正课开始前，先花了几分钟讲「怎么看待言语这个科目」——这是本讲的方法论地基。\n\n> 「不要对你所期待的事情抱有不切实际的幻想。」\n\n| 认知要点 | 老师原话 / 展开 |\n| --- | --- |\n| 言语是**不确定的科目** | 做全对的概率很低，因为它具有**非常强的主观性**，跟申论差不多 |\n| 言语老师的定位 | 「言语老师所做的事情，是在帮助大家在**不确定当中寻找一个确定性**。」 |\n| 理论的作用边界 | 任何老师都不敢说「只要你学了我的东西，市面上所有题目都能完美概括」，张弓老师也做不到 |\n| 学员应有的态度 | **把握大的部分、大的方向就可以**；不要因为做了一道跟老师讲的不一样的题，就来批判一番 |\n| 出题人的「雏田乱来」 | 有些出题正确率只有百分之十几、二十几，那就没有什么意义了 |\n| 结论 | 我们学言语，是**要追求不确定当中的一些确定性，把握一个大的部分、大的方向就可以了** |\n\n> ⭐ 本讲后半段的「晦涩文段」正是这套认知的直接产物：**它不保证做对，只保证把「猜」的概率提高一点。**\n\n---\n\n## 一、昨日回顾：转折与因果\n\n本讲未放昨日思维导图，老师带学员口头回忆（第四讲内容）。\n\n### 1.1 转折（只有两个知识点）\n\n```\n①「事实上」「实际上」不一定表转折  → 根据前后意思去判断\n②转折文段的答案：既可以是对后面部分的概括，也可以是对前文内容的否定\n```\n\n### 1.2 因果（三个点）\n\n```\n①结论词有哪些？结论之后是重点\n②原因论述多 → 可能是因果结构，选项常写成「……的原因」；\n  但选它不是因为它是「原因」，而是因为「果」选它\n③层层递进 / 过程比较繁复 → 不要太在意过程，看结果\n④哪怕尾句有结论词，也不要只看尾句；在看得懂的前提下，还是要忠于整个文段\n```\n\n> ⭐ 复习方法（老师的高中老师教的）：「每天躺在床上，**闭上眼睛**，想张老师今天讲了什么，回忆一下，看能不能回忆起来。」——学一定要回忆，不能听完就完了。\n\n---\n\n## 二、中心理解收官：晦涩文段\n\n### 2.1 什么叫晦涩文段\n\n#### （1）客观上的晦涩（PPT 板书：晦涩文段的常见表述形式）\n\n> **晦涩文段的常见表述形式：**\n>\n> **① 拥有较为晦涩的词汇**：（示例文段）莲子心发育过程中，多数叶绿素生物合成结构基因的表达是显著上调的，与叶绿素的积累模式一致。原叶绿素酸酯氧化还原酶参与催化的原叶绿素酸酯转化为叶绿素酸酯是一个关键步骤，生成的叶绿素酸酯进一步转化形成叶绿素。光依赖的原叶绿素酸酯氧化还原酶（LPOR）是被子植物中参与这一反应的关键酶，并且此过程是被子植物中叶绿素合成唯一需要光的反应。而一些裸子植物和微生物可以采用不依赖光的原叶绿素酸酯氧化还原酶（DPOR）完成这一反应；莲子心中并不存在 DPOR 编码基因，但鉴定到两个 LPOR 编码基因，且其表达模式与叶绿素的积累模式一致。\n>\n> **② 表达较为「宽泛」不通俗**：（示例文段）实现技术要素高效配置是高标准市场体系建设的战略使命。技术要素市场化改革为建设高标准市场体系带来内生动力。发展完善技术要素市场，对现有市场体系提出了更高要求，例如需要更加健全的产权保护制度，更加公平的市场竞争环境，更为成熟的劳动力、资本要素市场以及更加包容的市场监管。此外，由于市场管理与创新管理的部门分割，技术要素市场化改革必然要求高标准市场体系建设要着力解决深层次的体制机制障碍、更加有效地统筹市场体系与创新体系的关系、协调科技与经济社会发展的关系。\n\n- ①的典型代表是**科技说明文**：专业术语很多（老师举例：「我不会读酸酯氧化还原酶、什么 LPOR……反正我也不懂」，你看到第一句，脑袋已经炸开了）。\n- ②的典型是**泛泛而谈、给人感觉很虚的文章**：每一个字你都认识，但连在一起就不认识了。\n\n#### （2）主观上的晦涩\n\n- 每个人对「晦涩」的理解是**主观的、变化的**：\n  - 理科生、文字阅读量很大的同学，可能觉得「没有晦涩文段，什么文段我没见过」；\n  - 而另一些同学，别人看起来不难的文段，对他已经是晦涩文段了。\n\n#### （3）遇到晦涩文段，期望值必须下调\n\n> ⭐「如果你认为它晦涩了，那这个时候你对这道题目的期望，是不是应该稍微放低一点儿？就想着反正我不会，那我就**死马当活马医**，不要妄想着完全能够做对。」\n\n> ⭐「叠个甲：我的方法不能保证你以后遇到晦涩文段完全一定能做对，因为本身你遇到这样的文段，它就已经很难做对了。你做对是你运气好，而老师只是让你这个运气变得能够稍微更好一点儿而已。」\n\n> ⭐「这个时候已经是**猜**了，朋友们已经到了猜的范畴了，我只是让你猜得更准一点儿而已。」\n\n---\n\n### 2.2 思维提升①：主题词（高频与首句）\n\n**PPT 板书原文：**\n\n> **思维提升①：晦涩文段重视主题词的提示作用，特别是高频词和首句引出的话题**\n\n#### 老师讲透的三层逻辑\n\n| 层次 | 内容 |\n| --- | --- |\n| 主题词共三个抓手 | ①看**高频词**；②看**首句**引出的话题；③看**中心句**（第一节课讲过） |\n| 为什么本讲**不看中心句** | 「因为我就读不懂，我都读不懂，你干嘛还让我看中心句呢？」——读不懂就找不到中心句，所以只剩高频与首句 |\n| 为什么高频词容易做主题词 | 「如果这个东西它不重要，**为什么作者要反复说呢**？」反复说，某种意义上就意味着它有点重要 |\n\n> ⭐「这个时候文段读不懂，怎么猜？**抓主题词**。尽量看哪个词出现的频率最高，或者说首句到底引出了什么话题来。」\n\n> ⭐「你说老师一定吗？**不一定**。但它已经算得上……**概率上已经比较高了**。」\n\n---\n\n#### 例题 1｜2024 国考·大模型赋能生成式人工智能\n\n**【题干原文】**（讲义「例1（2024 国考）」）\n\n> 大模型赋能，生成式人工智能正在引发新一轮智能化浪潮。得益于拥有庞大的数据、参数以及较好的学习能力，大模型增强了人工智能的通用性。从与人顺畅聊天到写合同、剧本，从检测程序安全漏洞到辅助创作游戏甚至电影，生成式人工智能本领加速进化。随着技术迭代，更高效、更「聪明」的大模型将渗透到越来越多的领域，有望成为人工智能技术及应用的新基座，变成人们生产生活的基础性工具，进而带来经济社会发展和产业的深刻变革。人工智能大模型强大的创新潜能，使其成为全球竞争的焦点之一。\n>\n> **这段文字意在说明：**\n\n**【选项原文】**\n\n> A. 人工智能在大模型赋能下正在快速发展\n> B. 加快发展新一代人工智能势在必行\n> C. 生成式人工智能的创新潜能亟待挖掘\n> D. 生成式人工智能已成为全球研究的焦点\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 承认读不懂 | 本题偏技术，术语多，先接受「读不太懂」 | 「大模型」「生成式人工智能」反复出现 |\n| 2 抓首句 | 首句引出的话题 | 首句：**大模型赋能，生成式人工智能**正在引发新一轮智能化浪潮 → 押「大模型 + 人工智能」两个词 |\n| 3 抓高频 | 再看后文哪个词反复出现 | 「大模型」「人工智能」通篇高频——「你看是不是这两个词也是经常地高频出现」 |\n| 4 两个词都涵盖 → 猜 | 选项里**两个词都有**的，作为正确答案概率更高 | 只有 A 同时含「大模型」与「人工智能」 |\n| 5 结构复核（看得懂时） | 第三节课内容：**大模型＝对策，人工智能＝对象**；有了大模型的帮助，能让人工智能变得更好 | 全文没脱离这个含义 → **总分结构**，答案就是 A |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。既含「人工智能」又含「大模型」，且「大模型赋能下正在快速发展」＝全段的总说（大模型增强了人工智能通用性 / 加速演化 / 成为新基座……）。\n- **B 项**：只有「人工智能」，**没有主题词「大模型」**，且「加快发展……势在必行」是文段没有的对策推断。\n- **C 项**：只有「生成式人工智能」，**没有「大模型」**（老师原话：「C 项也是只有人工智能」）。\n- **D 项**：只有「生成式人工智能」，**没有「大模型」**；且「已成为全球研究的焦点」偷换了文末的「全球竞争的焦点之一」。\n\n> 老师的「非常规方法」逻辑链：\n> ```\n> 首句话题（大模型 人工智能）\n>   → 高频词（大模型 人工智能）\n>   → 选项里同时涵盖两个词的＝概率最高\n>   → A\n> ```\n> 「你猜都猜了，你干嘛猜这么复杂呢？你就猜简单点儿……这个时候期望值要降低。」\n\n**【本题要点】**\n\n> ⭐ 首句 + 高频**结合**使用：首句定方向，高频确认方向。\n> ⭐ 猜的结构要**简单**——直接选「两个主题词都涵盖」的那一项，不要去纠结感情色彩、句式。\n> ⭐ 这道题同时也是一个**总分结构**：大模型（对策）让人工智能（对象）变得更好，后文全是这一句的展开。\n\n---\n\n#### 例题 2｜2022 浙江·制造与服务融合\n\n**【题干原文】**（讲义「例2（2022 浙江）」，**摘要加标题**类设问）\n\n> 制造与服务融合是智能制造的重要内容之一，服务要素渗透到制造各个环节中形成了生产性服务与制造服务化。本文从工业互联网的商业视角、使用视角、功能视角、实现视角建立了制造与服务融合中虚拟逻辑与实体活动交互的技术体系，有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动的制造与服务融合方法。本文构建的制造与服务融合技术体系，深化了工业互联网在制造业与服务业中的应用，为数字经济中制造服务产业的技术创新奠定了基础。\n>\n> **如果这是一篇论文的摘要，那么这篇论文的标题最有可能是：**\n\n**【选项原文】**\n\n> A. 数字经济中制造与服务融合的协同机制\n> B. 四轮驱动下的制造与服务融合技术体系\n> C. 工业互联网在智能制造中的体系化应用\n> D. 基于工业互联网的制造与服务融合技术\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 看首句（守旧角度） | 首句大概率就是话题 | 首句：「**制造与服务融合**是智能制造的重要内容之一」 |\n| 2 用首句排选项 | 四个选项都拿首句去对 | A 有、B 有、D 有；**C 没有「服务」也没有「融合」** → C 最先排 |\n| 3 找后面有没有「相同句式」 | 相同句式＝并列，并列要**全面概括、提取共性** | 后文出现两个「**本文**」：「本文从工业互联网的……」「本文构建的制造与服务融合技术体系，深化了**工业互联网**……」 |\n| 4 锁定第二个主题词 | 「工业互联网」出现两遍——「当这个词出现两遍的时候，是不是就得关注了？」 | 两个「本文」都在讲**工业互联网** |\n| 5 两词合一选答案 | 同时含「工业互联网」＋「制造与服务融合」 | 只剩 **D** |\n\n> 老师对「工业互联网到底重不重要」的推演过程：\n> ```\n> 第一句没提「工业互联网」（此时不能认为它重要，没有依据）\n>   → 第二句「本文从工业互联网的……」出现第 1 次（仍不能咬定）\n>   → 第三句「本文构建的……深化了工业互联网……」出现第 2 次\n>   → 出现两遍 → 该关注了 → 它是主题词\n> ```\n> ⭐「用最朴素的想法想：这个词如果不重要，我凭什么反复说呢？」\n\n**【逐项解析】**\n\n- **A 项**：主题词（工业互联网）缺失；且讲的是「**协同机制**」——文段不是在分析机制（机制就是原理的意思），文段讲的是**技术**。\n- **B 项**：「四轮驱动」片面。它在文中只是「有针对性地提出了生态位驱动、供应链驱动、大数据驱动、物联网驱动这四个驱动」这一句，**只出现在第一个「本文」部分中、只是其中很短暂的一截**；同一个层次上还有「商业视角、使用视角、功能视角、实现视角」四个视角，「那你还有商业视角、使用视角、功能视角和时间视角呢」，所以没有依据，直接排掉。\n- **C 项**：只有「智能制造」，**没有「服务」、没有「融合」**，主题词不全，最早被排除。\n- **D 项**：✅ 正确。「**基于工业互联网**的制造与服务**融合技术**」——工业互联网、制造与服务融合、技术三个要素全中。\n\n**【本题要点】**\n\n> ⭐ 首句给话题，**两个「本文」＝相同句式表并列**，并列结构要**全面概括、提取共性**。\n> ⭐ 除「工业互联网」外，本题还有一个隐藏高频词——「**技术**」（方法技术、技术体系、技术创新），D 项刚好也带「技术」。\n> ⭐ 两个方法（首句法、高频法）都可以，但考场上多数同学读不太懂，**用第一种（首句法）就够了**。\n\n---\n\n### 2.3 思维提升②：重视多者之间的关系（特别是二者）\n\n**PPT 板书原文：**\n\n> **思维提升②：晦涩文段重视多者之间的关系（特别是二者）**\n\n#### 老师讲透的原理\n\n> ⭐「一个文段，它想要写得复杂，如果只是一个对象，它不太可能复杂到哪儿去。……它为什么会显得很复杂呢？它应该是**多者的**，特别是**至少有两者的关系**——我和你怎么怎么样，你对我怎么怎么样。」\n\n**用前两道题当场验证：**\n\n| 例题 | 文段的「两者」 | 选项里的「单方面干扰」 |\n| --- | --- | --- |\n| 例1 | **大模型** 与 **人工智能** 两者 | C、D 只提「生成式人工智能」一方面 |\n| 例2 | **工业互联网** 与 **制造与服务融合**（＋技术）两者 | C 只有「智能制造」；B 只有「四轮驱动」 |\n\n> ⭐ 于是晦涩文段就有**两种手段**：\n> ```\n> 手段一（从文段出发）：抓主题词 → 抓首句、抓高频\n> 手段二（从选项出发）：重视多者关系 → 尽量选讲「两个／多个」主题的选项\n> 两者叠加，命中的概率就更高\n> ```\n\n---\n\n#### 例题 3｜2023 四川·莲子心的叶绿素合成\n\n**【题干原文】**（讲义「例3（2023 四川）」）\n\n> 莲子心发育过程中，多数叶绿素生物合成结构基因的表达是显著上调的，与叶绿素的积累模式一致。原叶绿素酸酯氧化还原酶参与催化的原叶绿素酸酯转化为叶绿素酸酯是一个关键步骤，生成的叶绿素酸酯进一步转化形成叶绿素。光依赖的原叶绿素酸酯氧化还原酶（LPOR）是被子植物中参与这一反应的关键酶，并且此过程是被子植物中叶绿素合成唯一需要光的反应。而一些裸子植物和微生物可以采用不依赖光的原叶绿素酸酯氧化还原酶（DPOR）完成这一反应；莲子心中并不存在 DPOR 编码基因，但鉴定到两个 LPOR 编码基因，且其表达模式与叶绿素的积累模式一致。\n>\n> **这段文字意在说明：**\n\n**【选项原文】**\n\n> A. 叶绿素的形成有两种不同的模式\n> B. 裸子植物依赖光反应形成叶绿素\n> C. 莲子心的叶绿素合成需要光参与\n> D. 莲子有裸子植物的两个编码基因\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 0 先承认读不懂 | 「就别说你们，我都不想看。……我不看三分钟，我也看不懂。」 | 全段大量专业术语 |\n| 1 抓首句 | 第一句重点看，找「谁和谁」 | 首句：**莲子心**发育过程中……与**叶绿素**的积累模式一致 → 线索①「莲子心 + 叶绿素」 |\n| 2 抓高频 | 哪个词反复出现 | **叶绿素**反复出现 → 大概率答案里有「叶绿素」 |\n| 3 找新话题 | 第一节课讲过：**新话题要格外关注** | 后文出现第一句没有的「**光**」（光依赖的……不依赖光……），且与光相关的话题很多 → 把「光」也画上 |\n| 4 二者叠加猜 | 「叶绿素 + 光」两个都有的选项 | 回到选项：**先把 A、D 干掉**（A 只讲「两种模式」处于前面；D 讲「编码基因」），剩下 B、C，概率从 25% 变成 50% |\n| 5 再比对细节 | C 有「莲子心」，与首句同 | **C** |\n\n> ⭐ 老师原话：「你起码很接近答案了。……你还对比的话，说老师莲子心，我就信你信到底，老师我一条路走到黑，就选 C 嘛——第一句莲子心嘛。」\n\n**【逐项解析】**\n\n- **A 项**：选的人很少。「两种模式」是对的，但它**处于前面**，且与后文大量的「光」话题无关——「咱们就按照第一节课讲的，你后面这么多跟光相关的话题，你不提到光不合适吧。」\n- **B 项**：**与文意相悖**。文段说得很清楚「一些裸子植物和微生物可以**采用不依赖光**的原叶绿素酸酯氧化还原酶（DPOR）完成这一反应」，**裸子植物不依赖光**，不是「依赖光反应形成叶绿素」。\n- **C 项**：✅ 正确。莲子心的叶绿素合成需要光参与——符合首句话题（莲子心）、高频词（叶绿素）、新话题（光），且是「二者关系」型选项。\n- **D 项**：**偷换概念／细节不符**。莲子确实有编码基因，但莲子的编码基因是 **LPOR**；而 **DPOR** 恰恰是裸子植物中有的东西——「莲子心中并不存在 DPOR 编码基因」。所以「莲子有裸子植物的两个编码基因」不对。\n\n> ⭐「我其实不太建议这样做，因为考试你没时间。这个题我就建议大家按照方法去猜就可以了。」\n\n**【本题要点】**\n\n> ⭐ 三个抓手叠用：**首句（莲子心·叶绿素）＋ 高频（叶绿素）＋ 新话题（光）**。\n> ⭐ 先干掉 A、D，再从 B、C 里二选一——**把 25% 变成 50%**，这也是重要的应试技巧。\n> ⭐ 晦涩题**不建议逐字抠细节**，考试没时间；细节对错只是「最后的 50%」里帮你确认的那一下。\n\n---\n\n#### 例题 4｜2023 浙江·Cas9 与 PAM 识别序列\n\n**【题干原文】**（讲义「例4（2023 浙江）」）\n\n> 研究人员介绍，来源于化脓性链球菌的 Cas9 核酸酶现已广泛应用于水稻基因组编辑，有效促进了水稻功能基因组学研究和分子育种进程。Cas9 在进行基因组编辑的过程中需要识别、结合一段位于编辑位点靶 DNA 序列末端的保守 NGG 序列（该保守序列被称为 PAM 识别序列，N 为碱基 A/T/G/C 中任意一种）。PAM 识别序列的存在极大限制了 Cas9 在基因组范围内的打靶序列选择，尤其在进行单碱基编辑替换时，由于待编辑靶碱基位置是固定的，周边若无 NGG 序列的话，基本无法进行靶碱基的编辑替换。\n>\n> **这段文字意在说明：**\n\n**【选项原文】**\n\n> A. PAM 识别序列的特点和作用\n> B. Cas9 基因编辑方法的特殊性\n> C. Cas9 对水稻基因组编辑的重要性\n> D. PAM 识别序列对 Cas9 基因组编辑时的影响\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 用「多者关系」秒选 | 上一题刚讲的第二点：**选讲两者关系的选项** | 「你如果听过我刚才讲的第二点，就哪个答案马上非常地合适」 |\n| 2 逐项扫主题数量 | A、B 只讲**一个对象**，C、D 讲**两个** | A、B 直接落到「单对象」组；答案在 C、D 之间 |\n| 3 判断「水稻」重不重要 | 第二节课的内容：**如果这个词真的重要，后文一定反复说、反复解释** | 「水稻」只在**第一句**出现过，后面整个都在谈**基因**的问题，好像跟水稻没什么关系了 → **不选 C** |\n| 4 判断「PAM」重不重要 | 找高频 | 「PAM 极大的限制了……」「若无 NGG 序列的话，基本无法进行靶碱基的编辑替换」→ PAM 高频且是中心句主语 |\n| 5 复核中心句 | 本题中心句就是「PAM 识别序列的存在极大限制了 Cas9 在基因组范围内的打靶序列选择」 | **对策／必要条件关系**：Cas9 需要一个 DNA 末端的保守 NGG 序列，NGG 就被称为 PAM，**PAM 就是 NGG、NGG 就是 PAM** → 「Cas9 需要 PAM」反过来讲就是「PAM 对它的影响」 ✓ |\n\n**【逐项解析】**\n\n- **A 项**：只讲**一个对象**（PAM 的特点和作用），且「特点和作用」是并列式概括，没有点出 PAM 对 Cas9 的**制约关系**。\n- **B 项**：只讲**一个对象**（Cas9 基因编辑方法的特殊性）。\n- **C 项**：虽然有两个词（Cas9、水稻基因组编辑），但**「水稻」只在第一句出现**，后文全在讲基因，水稻不是主题词 → 「所以这个题大概不选 C」。\n- **D 项**：✅ 正确。PAM 识别序列（NGG）＋ Cas9 基因组编辑，两者都在，且正中中心句的「极大限制／影响」。\n\n**【本题要点】**\n\n> ⭐ 判断「第一句里的某个词重不重要」的方法：**看它后面有没有被反复说、反复解释**（第二节课内容）。因为「真的很重要的话，我后面是不是得反反复复去强调一下？对话题一致嘛」。\n> ⭐ 「PAM 就是 NGG，NGG 就是 PAM」——**它俩是一回事**，认清这一点，D 项的表述就没有毛病。\n\n---\n\n### 2.4 晦涩文段·总结（省流版）\n\n**PPT 板书原文：**\n\n> **（八）晦涩文段-总结（省流版）**\n>\n> **晦涩文段的常见表述形式：**\n> ① 得有较为晦涩的词句；\n> ② 表述为泛泛而不通俗；\n>\n> **思维提升①：** 晦涩文段重视主题词的作用，特别是**高频词和首句**引出的话题\n>\n> **思维提升②：** 晦涩文段重视**多者之间**的关系（特别是二者）\n\n**老师的收官总结：**\n\n```\n当你读不懂的时候（考场上时间太紧张，建议直接猜）：\n  一个是从文段出发 → 抓主题词：重点看高频 + 首句（因为中心句你也找不到）\n  一个是从选项出发 → 选「两者」或「多者」关系的选项\n```\n> ⭐「当你只要你看不懂的时候，因为考场上时间太紧张，所以我建议大家就猜。你错了就错了。」\n\n---\n\n## 三、细节判断题\n\n> 过渡语：「到这我们就结束中心理解了。……**理解的题是基础**，打好基础，我们后面才会走得越来越顺畅。」\n\n### 3.1 考情扫描（量程 / 提问方式 / 本质 / 方法 / 错项类型）\n\n**PPT 板书原文（逐字）：**\n\n> **二、细节判断题**\n>\n> **题量**：国联考 2~4 题，**时间**：90s 以内一题\n>\n> **① 提问方式**\n> 「以下对文段理解正确/不正确、符合/不符合、可以（不能）得知/推出」\n> **审题很重要，一定要仔细**\n>\n> **② 细节判断题和中心理解题的本质区别**：一个是找重点，一个是看对/错、有/无\n>\n> **③ 基本方法**：选项和文段**一一对应**\n>\n> **④ 错误选项类型**：\n> 1. 无中生有\n> 2. 偷换概念（替换、混搭）\n> 3. 偷换逻辑（强加因果/因果倒置、并列偷换）\n>    - 文段：A，B　　　选项：因为 A 所以 B\n>    - 文段：A 导致 B　选项：B 导致 A\n>    - 文段：A 同时 B　选项：A 是主体 / B 是核心\n> 4. 与文意相悖\n\n#### 老师逐条展开\n\n| 项目 | 讲解要点 |\n| --- | --- |\n| **题量时间** | 国联考一般 2~4 题，**90 秒以内一题**。同学质疑「你怎么做得完」——因为不同题型之间有**时间分配** |\n| **言语怎么做快** | ⭐ **「言语题怎么才能做得快？只能在逻辑填空挤时间。」** 因为**文段的长短就决定了你的基本耗时**；逻辑填空词不认识，再纠结没有意义，不如干脆一点。细节题有可能半分钟，**排序题几乎不可能** |\n| **本质＝找茬** | 「我之前讲课放过一张这样的图：细节判断题的本质有点像**找茬**——第一张图是文段的意思，第二张图是选项的意思，本质上就是问你这个选项对不对」。它考的就是**阅读、查找能力**，考**基本功** |\n| **正确认知** | 做这种题觉得烦躁很正常；**细节判断题不用特别训练，你中心理解好了，这个题自然就好了** |\n| **基本方法** | 选项和文段**一一对应**，一个一个找。「不管什么方法，这一步是逃不过去的」 |\n\n#### 错误选项类型（逐条）\n\n**① 无中生有——一定要忠于原文，不要靠常识**\n\n> 例子 1：文段说「伯乐是一个人」「相马经是一本书」，选项给「**相马经是伯乐写的**」——对不对？**不对**。因为文段没有讲是他写的；哪怕现实生活中真是他写的，文段没讲也不行。\n\n> 例子 2（关键提醒，**要记笔记**）：「所谓无中生有，**不是说没有这个词，一定指的是话题**。」\n> 文段在讨论**南极动物**，选项出现「**企鹅**」，算不算无中生有？**不算**。「因为我并没有脱离南极动物的这个范畴。」\n> 但如果你把企鹅改成「**北极熊**」，那就算了（＝无中生有）。\n> ⭐「所以有的题里的企鹅不选，是**别的原因**。」\n\n> ⭐「就他一般来说不会考你特别难的常识。……我的意思就是说，我们说的无中生有，不是这个选项的词一定得原封不动在文段，**不一定，它可能就是换了一种表达方式**。」\n\n**② 偷换逻辑——比较爱考的是强加因果、因果倒置、并列偷换**\n\n| 类型 | 含义 | 老师的例子 |\n| --- | --- | --- |\n| **强加因果** | A 和 B 本来没有因果关系 | 文段只说「三星手机卖得不好，苹果手机卖得好」，选项给「三星卖得不好，是因为苹果卖得好」→ 不行。「你不要自己理解，因为文段只是在客观描述」 |\n| **因果倒置** | 把因果反过来 | 「今天因为下雨了，所以我打车了」→ 不能说「因为打车，所以下雨了」 |\n| **并列偷换** | 文段中某对象只是**并列中的一环**、没那么突出，选项却让它**变突出** | 文段：「在行测当中，言语、数字、判断都很重要」→ 选项说「**言语是最重要**的」不行。**这不叫片面，这叫并列偷换** |\n\n> ⭐「你不能说言语最重要，**但你可以说言语重要**。」\n> ⭐「细节判断题**严格来讲不存在片面**。它不需要你概括呀，你只需要**对**就行了。」\n> ⭐「它是芸芸众生的一环，你不能把它地位拔高。」\n\n**③ 与文意相悖**：你往南我往北，你说好我说不好。\n\n**④ 易错项补充——张冠李戴（偷换概念）**（老师说是「刚才忘讲了」）\n\n> 「同样概念就是张冠李戴，比如说**我上岸了**改成**你上岸了**，其实很简单，就是**换了个人儿，换了个对象**。」\n\n---\n\n### 3.2 思维提升①：做题顺序建议\n\n**PPT 板书原文（逐字）：**\n\n> **思维提升①：做题顺序建议（只是建议，灵活处理）**\n>\n> **1. 从文段特征看：**\n> - 文段**晦涩难懂**（科技说明类）：建议**先看选项**，再回到文段做比对\n> - 文段**通俗易懂**（人文社科类）：可以**先读文段**，再看选项（**人文社科选是题，强烈建议！**）\n>\n> **2. 从选项特征看，选项特征明显，可以先从选项入手：**\n> - 选项字数**较短**，或者选项有**明显的差异**、有**明显的优先验证点**\n\n#### 展开要点\n\n| 情形 | 建议 | 原因 |\n| --- | --- | --- |\n| 文段晦涩难懂（科技说明类） | 先看选项 → 回文段比对 | 看不懂就看选项 |\n| 文段通俗易懂（人文社科类） | 先读文段 → 再看选项 | 可能是**细节主旨化**（答案不仅正确、而且契合中心）——「**先看看文段，因为可能有的时候有惊喜**」 |\n| 「人文社科**选是题**」 | ⭐ **强烈建议先看文段** | 选是题的正确答案有机会「正确且契合中心」 |\n| 选项短 / 差异明显 / 有优先验证点 | 先从选项入手 | 短就好记；差异明显好定位 |\n\n> ⭐「中心理解一定要先看文段。但是细节判断题，你读完提问方式确定是细节判断之后，是先看文段还是先看选项……**其实总的原则很灵活，这个时候没有定论**。我可以建议，但是没有定论，你爱咋地咋地，你可以自己去试，哪个更适合你用哪个。」\n\n> ⭐「什么叫科技说明文（理科类）？就刚才那个莲子心那个题。」\n\n---\n\n### 3.3 思维提升②：快速解题技巧（优先验证）\n\n> ⚠️ 老师说：**别把顺序和优先验证搞混了**。\n> 「刚才我们在干的事，是我到底是先看文段还是先看选项？**这个 PPT 的意思是，你已经来到 ABCD 了，但你还想偷懒**——我 ABCD 我不想先 A 再 B 再 C 再 D，我想先看一看**某种意义上作为答案概率更高的**选项，这叫**优先验证的原则**。」\n\n**PPT 板书原文（逐字）：**\n\n> **思维提升②：快速解题技巧，有些选项可以优先验证：**\n>\n> **1. 相对绝对项**\n> 绝对表述：**一定、必定、都……**\n> 相对表述：**可能、也许、往往、大概、之一……不完全、并非绝对……**\n> - A. 要想在所学的专业有所建树就一定要有高智商\n> - B. 人与人的关系发生对抗可能和人与自然相关\n>\n> **2. 对比项**\n> 标志词：**A 高于/优于 B、利大于弊、A 比 B 更……**\n> - A. 人与自然的和谐相处事实上有利于协调人与人之间的关系\n> - B. 处理好人与人的关系比处理好人与自然之间的关系更为重要\n>\n> **3. 表述与实际不符/相符项**\n> - A. 农业保险能够预防天气灾害\n> - B. 褪黑素有助于睡眠\n>\n> **【快速解题技巧总结】**\n> 当你发现细节题要选**说法正确**的答案：可以优先验证：**表述温和、符合常识等**\n> 当你发现细节题要选**说法错误**的答案：可以优先验证：**表述绝对、对比项、不符合常识**\n> **注意：只是可以考虑优先验证，并非直接锁定答案！**\n\n#### 讲解要点\n\n**① 相对绝对**：「绝对表述一定、必定、都，大家一看就知道，就是**说话不留有余地**嘛，就容易被打脸，所以他一般会表述错误的选项。」\n「相对表述给人的感觉就是**很温和**，就感觉你怎么都不错。」\n> 老师举例：「有人问张老师明天下雨吗？我说明天**可能**下雨——你无敌了呀。可能下雨你也对，不下雨，反正是『可能』嘛。」\n\n**② 对比项**：纯粹从考情、统计概率出发——「这种对比的感觉，A 大于 B、A 高于 B、A 比 B 更好……从我们这个统计的概率来讲，它比较容易犯错，就是比较容易是**错的表述**。」\n> ⚠️ **关键操作**：「注意，这个题让你选一个**正确的答案**……那对比项选 B 吗？**不是**，它作为错误表述的概率更高，那它既然错误表述的概率更高，我反而就**先不看 B**。\n> 注意**不是直接排掉，是先不看**。」→ 应该先看 A。\n\n**③ 表述与实际不符/相符**：「多多少少你可以有点常识。」老师举例：「以下说法正确的是」，给你一个选项叫「**吸烟有益健康**」，你敢选吗？**你不敢选**——所以它大概率是不对的。\n> 「A 项农业保险能预防天气灾害，它大概率不对；B 项褪黑素有助于睡眠，它大概率是对的。」（注意：**不是一定**，最终还是要看文段。）\n\n**总结（老师原话）：**\n\n> ⭐「当你发现这个题要选**正确**答案的时候，可以优先验证**温和**和**符合常识**的表述。\n> 当你发现这个题要选**错误**的时候，可以优先验证**表述绝对、对比的、不符合常识**的。\n> 但是**一定只是优先验证，并非直接锁定答案**。」\n\n> ⭐ 铁律：「因为你再怎么优先验证，它**只是优先验证**，**永远代替不了回到文段去对应的这个步骤**。……你细汉（仔细）问题，你不管再怎么用技巧，你永远代替不了选项和文段对应的这个步骤。」\n\n#### 配套「顺序练习」演示（老师不讲题，只判断先看谁）\n\n**演示一｜「对本文理解最为准确的是」**\n\n> 选项（摘要）：A. ……只有……才……　B. ……无法降低……　C. ……　D. ……\n\n- 老师判断：**优先看 C、D，不能先看 A、B。**\n- 原因：**A 项「只有……才……」绝对**（「我是不是在讲中心理解也讲过，**只有才在细节题叫绝对**，有没有想起来？这是连起来了」）；**B 项「无法降低」也很绝对**。\n- ⚠️「**不是直接排**，所以你还是弄错了，你是**先看 C、D**，他俩出答案概率更大。**那假设 C、D 没答案，你还是要去看 A、B**。」\n- 补充：「C、D 其实都可以，特别是 **D 更好**，因为一个『**β**』就好找嘛……刚才讲过选项有特殊的一些标志可以先看选项。」（老师现场承认：讲义上「β」这个特殊字母粘贴时掉了，是他的问题。）\n\n**演示二｜「下列关于数字孪生的说法与文意不符的是」**\n\n- 老师判断：**优先看 B 项**。「别的都还好，就感觉还行、一般般，但 **B 有一个『最新』**，是不是有点绝对，所以你可以先看 B。」\n\n> ⭐ **两个重要论断：**\n> 1. 「优先看的选项，如果你选出来了，**其他答案还看不看？——不看。**」\n> 2. 「因为**细节题跟中心理解不一样**，细节题是**唯一一个你但凡确定某个答案就是答案的时候，别的你不用看了**，是唯一一个。因为你做细节题很多时候就是先看选项的。**但是别的题型一般都得看完整。**」\n\n---\n\n### 3.4 思维提升③：如何抓取选项的关键信息\n\n**PPT 板书原文（逐字）：**\n\n> **思维提升③：如何抓取选项的关键信息：**\n> 选项中**较为特殊的字词（只有某个选项有）**：\n>\n> （2023 安徽）\n> 对这段文字理解不准确的一项是：\n> A. 学业负担问题涉及到主客观综合因素\n> B. 学业负担有其自身发生的历史与现实逻辑\n> C. 学业负担问题受到社会各个层面的深度影响\n> D. 缓解学业负担问题有助于推动基础教育发展\n\n#### 讲解要点\n\n- 原则：**尽量选选项中有比较特殊的字词**。\n- ❌ 反面示范：抓「**学业**」这个词行不行？**不行**——「因为你 ABCD 不都是学业吗？那都没用呀」。\n- ✅ 正确做法（老师现场圈画）：\n  - A 项的「**主客观**」（别的选项没有）\n  - B 项的「**历史与现实**」（别的选项没有）\n  - C 项的「**社会的各个层面**」（别的选项没有）\n  - D 项的「**推动基础教育**」（别的选项没有）\n- ⭐「你在正常做的时候，尽量抓某个选项中**特殊的那个词儿**，抓这些**别的选项没有的**。」\n\n---\n\n### 3.5 思维提升④：几个常见的误区\n\n**PPT 板书原文（逐字）：**\n\n> **思维提升④：几个常见的误区：**\n>\n> **1. 细节判断题，片面可不可以选？**\n> 我爱言语，也爱数资 —— 我爱言语 / 我只爱言语 / 我最爱言语\n>\n> **2. 细节判断题，范围适度扩大缩小可不可以选？**\n> 张老师是湖北人 —— 张老师是中国人\n> 老师需要了解学生的心理 —— 言语老师需要了解学生的心理\n>\n> **3. 细节判断题，适度联想的选项可不可以选？**\n> 张老师感冒了很难受，难以专心上课 —— 张老师感冒了对生活造成了极大困扰\n\n#### 误区一：片面可不可以选？——可以选（但「只见其一」不行）\n\n> ⭐「我说过，细节题严格上不存在片面。**片面跟你的对错没有必然关系**，大家把这话记住。」\n>\n> - 文段「我爱言语，也爱数资」→ 选项「**我爱言语**」：**可以选**。\n> - 选项「**我只爱言语**」「**我最爱言语**」：**不行**——「这叫什么？这叫**并列偷换**」。\n\n#### 误区二：范围适度扩大缩小可不可以选？——**不一定**\n\n> ⭐「以后再不要跟我说什么扩大缩小，**不一定**，你要很朴素的去看它到底成不成立，就有点像**判断的思维**。」\n\n- 文段「张老师是湖北人」→ 选项「张老师是中国人」：**可以**（扩大一点没关系）。\n- 反过来：文段「张老师是中国人」→ 选项「张老师是湖北人」：**不行**（缩小就可能不行）。\n- ⚠️ 但**不是**「扩大可以、缩小不行」这么简单：\n  - 文段「老师需要了解学生的心理」→ 选项「**言语老师**需要了解学生的心理」：**可以**！因为「言语老师肯定属于老师」。\n  - 反之，文段只说「言语老师需要了解学生心理」，选项写「**老师**需要了解学生心理」就**不行**。\n- ⭐ 一句话：**「不管你是扩大还是缩小，不一定，都是不一定的，你得看具体情况，或者说用判断的思维来判断」**（判断推理里的「属性、集合」）。\n- 老师补例：「我说言语老师得懂成语，那难道所有老师都得懂成语吗？数学老师得懂直除，难道所有老师都得懂直除吗？」\n\n#### 误区三：适度联想的选项可不可以选？——**不一定**\n\n- 文段「张老师感冒了很难受，难以专心上课」→ 选项「张老师感冒了**对生活造成了极大困扰**」：**不一定**。\n- ⭐ 这就是言语的特点：「老师说这个选项就是**模棱两可**，你说对吧，也没那么对；你说不对嘛，也不是那么的不对。」\n\n#### 由此引出「细节判断-思维拔高」（**本讲最重要的思维转变**）\n\n**PPT 板书原文（逐字）：**\n\n> **4. 细节判断-思维拔高：细节判断题也需要对比择优，思路一定要扭转！！**\n>\n> **选正确**：不是说它没有任何问题，而是：**问题最不明显的选项 / 表述与文段最接近的选项**\n> **选错误**：不是说只有它有问题，而是：**问题最明显的选项 / 表述与文段极不符的选项**\n\n> ⭐「我们这个题让他选正确，不是说这个答案就没有任何问题，而是说**这个答案的问题最不明显**，或者说他和文段最接近。\n> 如果他让你选有问题的，不是说只有他有问题，而是说他**问题最明显**、或者说表述是**最不相符**的。」\n>\n> ⭐「不要当完美主义。**完美主义永远做不好言语题。**」\n\n---\n\n#### 例（2020 江苏）· 海底石油（误区四的配套例题）\n\n**【题干原文】**（PPT「例：（2020 江苏）」）\n\n> 海底矿产资源中最受关注的是海底石油。有人推测，37%的大陆架蕴藏着石油。海底石油储量约 2500 亿吨，相当于世界石油预估储量的三分之一以上，仅在大陆架的石油储量就有 1400 亿吨。第一口浅海油井出现在 1891 年，更多的勘探开发始于 20 世纪 20 年代，60 年代进入飞跃发展时期。现在，全世界有 100 多个国家在勘探海底石油，30 多个国家已开采出这种「工业的血液」。20 世纪 50 年代海底石油产量仅占全世界石油总产量的 5%，70 年代增加到 29%，80 年代已达，21 世纪初已远远超过 50%。\n>\n> **以下概括不符合文意的是**\n\n**【选项原文】**（PPT 本题只呈现了 B、D 两项）\n\n> B. 大陆架的石油储量超过世界石油储量三分之一\n> D. 全世界约半数的国家进行了海底石油勘探\n\n**【答案】** ✅ **B**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先看选项 | 题干给出 B、D 两个选项待判 | 大家都纠结 D 的「约半数」 |\n| 2 处理 D | 「这个 D 我不知道对不对，你别告诉我不知道」——**全世界一共多少个国家，文段没给** | 文段只说「全世界有 100 多个国家在勘探」，没说总数，所以「约半数」无法验证 → **存疑搁置** |\n| 3 处理 B | 请出「数学恩师」做简单计算 | 三分之一的**世界**石油储量＝海底石油储量 2500 亿；而**大陆架**的储量是 1400 亿 |\n| 4 比较 | **1400 能不能超过 2500？**不能 | 所以「大陆架的石油储量超过世界石油储量三分之一」**一定不对** |\n| 5 出手 | 「我知道这个 B 它一定不对，那我就选 B。我管它 D 对不对呢？」 | 选 **B** |\n\n> ⭐「这是数学问题，说没那么复杂。……这个 D 我不知道对不对，但是我知道这个 B 它一定不对，那 B 一定不对，那我就选 B，我管它 D 对不对呢？」\n\n**【逐项解析】**\n\n- **B 项**：✅ **应选**（本题选「不符合文意」）。大陆架储量 1400 亿 \u003c 世界储量三分之一（2500 亿），**不可能超过**。\n- **D 项**：**存疑、不影响作答**。文段没给「全世界共多少国家」，所以「约半数」无法判断；但**只要 B 板上钉钉，就别再纠结 D**（与例题 8「数字孪生·最新」同理）。\n\n**【本题要点】**\n\n> ⭐「对比择优」的实战用法：**找那个「一定不对」的，而不是找「一定对」的。**\n> ⭐ 这也呼应了细节判断的错项类型——**与文意相悖**（数字层面直接矛盾）。\n\n---\n\n### 3.6 细节判断题·总结（省流版）\n\n**PPT 板书原文（逐字，树状框架）：**\n\n> **二、细节判断题-总结（省流版）**\n>\n> **① 审题**\n> - 什么题？中心理解 OR 细节判断\n> - 选「是」还是选「非」？提还是没提\n> - 创新考法：能够解释 / 无法解释下列哪一问题\n> - ➜ **细节判断在于判断对错 & 有无**\n>\n> **② 确定做题顺序**\n> - 文段晦涩难懂、生物科技类 ➜ 建议先看选项，再回到文段比对\n> - 文段通俗易懂、人文社科类 ➜ 可以先看文段，再看选项\n> - 选项角度：较短，有明显区别或明显的优先验证点，可以从选项出发\n> - ➜ **灵活处理**\n>\n> **③ 选项怎么看**\n> - 学会找「特殊」：选项中较为特殊的字词（只有某个选项有）\n> - 有些选项可优先验证：\n>   - 大概率表述**错误** ➜ 对比项、绝对项、与常识明显不符\n>   - 大概率表述**正确** ➜ 相对项、与常识较为相符\n>\n> **④ 常见干扰项**\n> - 与文意相悖\n> - 偷换概念：概念替换、概念混搭\n> - 偷换逻辑\n>   - 强加因果、因果倒置\n>   - 并列偷换：A 导致 / 影响 B；A 是主要 / B 是核心\n> - 无中生有：注意适度推断、适度联想、适度扩大缩小方的选项，**择优对比**\n\n#### 老师对总结的四点复述\n\n| 序号 | 内容 |\n| --- | --- |\n| **1 审题** | 是什么题？题型和问法 |\n| **2 顺序** | 总的来讲比较灵活：看不懂就先看选项，看得懂就先看文段；或选项有明显角度，也可以先看选项 |\n| **3 选项怎么看** | ① **找特殊**，找别的选项没有的；② 有些选项可以**优先验证**——对比项、绝对项、常识不符项**大概率错**（**注意不是错误答案，是表述错**，「那万一这个题问的就是错的，那就选它了」）；相对象、常识相符项**大概率对**，**只是优先验证，不是选** |\n| **4 常见干扰项** | 与文意相悖、偷换概念（**张冠李戴**，如「我分手了，你恋爱了」不能变成「我恋爱了，你分手了」）、偷换逻辑（强加因果、因果倒置、并列偷换）不能选 |\n| **5 无中生有** | ⭐ **一定要注意「适度推断、适度联想、适度扩大缩小」的选项并不一定不对，要注意对比择优** |\n\n---\n\n## 四、细节判断题·例题精讲\n\n> 讲解前老师再次提示：这些是讲义题，**做题顺序**前面已经带着判断过了，此处开始逐题精讲。\n\n### 例题 5｜2024 国考·穿山甲与微型机器人\n\n**【题干原文】**（讲义「例5（2024 国考）」）\n\n> 穿山甲的外壳由被称作角蛋白的有机骨骼组成，能为躯体提供强有力的保护作用，却不会妨碍行动或损伤自身。穿山甲能把角质鳞片组成重叠结构，灵活无碍地移动。受其启发，工程师设计出一个拥有重叠鳞片设计的微型机器人，用于在人体内进行安全和微创的医疗。它通过变形，可以到达人体内难以触及的胃或小肠等区域。在概念验证实验中，微型机器人能够加热到 70℃，对人体组织进行医疗处理，包括在难以触及区域进行癌症热疗或止血。此外，机器人能够将负载物释放到组织，未来可用于递送药物。\n>\n> **关于微型机器人，下列说法与这段文字不相符的是：**\n\n**【选项原文】**\n\n> A. 鳞片结构与穿山甲类似\n> B. 具有灵活机动的移动能力\n> C. 治疗能力已在临床中得到验证\n> D. 可用在微创手术中进行止血\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 审题 | 问「不相符」→ **选非题**；题干偏科技 → 可直接看选项 | 「文字不相符，对不对？我们大家都说这个题不想读，是不是？不想读就不读嘛，那就看选项嘛」 |\n| 2 找特殊词 | 抓每个选项里「别的选项没有的」词 | A 抓「**鳞片/穿山甲**」；B 抓「**移动**」；C 抓「**临床**」；D 抓「**止血**」 |\n| 3 定位 A | 「鳞片、穿山甲」在哪 | 第一句「穿山甲」、第二句「角质鳞片」→ 「工程师设计出一个拥有重叠鳞片设计的微型机器人」→ 相当于**拟物**，**好像是对的** |\n| 4 定位 B | 「移动」在哪 | 第二句「灵活无碍地移动」；后文「可以到达人体难以触及的地方」→ 「灵活机动」好像也对 |\n| 5 定位 C | 「临床」在哪 | 前文讲**原理**；最后一段是「在**概念验证实验中**……**未来可用于**递送药物」→ ★**只是概念验证实验，说明还没有落地** |\n| 6 出手 | 大概率选 **C**，且**确定后 D 不看** | 「那如果你确定这个题答案选 C 了，这个 D 你看不看？**不看**。明白了吗？**只有细节题可以这样**」 |\n\n> ⚠️ 老师的**前提**：「我说的是**前提是很确定**，你如果很确定 C 的话，D 不看。当然你如果说我不确定，你不确定就再看一看嘛。」\n\n**【逐项解析】**\n\n- **A 项**：可以与文段对应（穿山甲把角质鳞片组成重叠结构 → 机器人拥有重叠鳞片设计），相符。\n- **B 项**：可以对应（「灵活无碍地移动」「可以到达人体内难以触及的胃或小肠等区域」），相符。\n- **C 项**：✅ **不相符（应选）**。文段只说「在**概念验证实验中**能够加热到 70℃……」，**没有说已在临床中得到验证**，属**无中生有 / 偷换阶段**。\n- **D 项**：可以对应（「用于在人体内进行安全和微创的医疗」「包括在难以触及区域进行癌症热疗或**止血**」「还可进行热疗和止血」），相符。\n\n**【本题要点】**\n\n> ⭐ 科技类文段 + 选非题 ⇒ **直接看选项、抓特殊词回文定位**。\n> ⭐ **「概念验证实验中」「未来可用于」这类时间/阶段限定词，是细节题的常见埋点**——把「实验阶段」说成「临床验证」就是错。\n> ⭐ 「你如果很确定 C 的话，D 不看」——**只有细节题可以这样**（中心理解题一般要看完整）。\n\n---\n\n### 例题 6｜2023 青海·现代社会是陌生人社会\n\n**【题干原文】**（讲义「例6（2023 青海）」，**人文社科选是题 → 强烈建议先看文段**）\n\n> 现代社会是陌生人社会，以市场经济为基础，更广范围更大规模的交易如跨国贸易，更长距离的往来如海运空运，甚至是跨期买卖如期货交易，不再是在几个熟人之间进行，而是大规模的陌生人社会交往，因此，迫切需要一套交易规则来保障交易的正常进行。这个时候，规则与法律的作用就远远超过熟人社会的习俗礼节与乡规民约。\n>\n> **根据这段文字，下列说法正确的是：**\n\n**【选项原文】**\n\n> A. 现代社会通常会依照差序格局决定办事的难易程度\n> B. 市场经济需要习俗礼节与乡规民约保障交易的进行\n> C. 熟人社会是以家族亲属关系为主轴的社会网络关系\n> D. 现代社会人际关系的维系更依赖规约和法律的作用\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 审题 + 定顺序 | 人文社科 + **选是题** ⇒ 强烈建议**先看文段** | 「为什么我建议大家先看文段呢？」 |\n| 2 读懂文段（只看大意） | 看细节题文段**不需要像中心理解那样层层分析结构层次**，**先大概浏览就可以了** | 现代社会 → 大规模陌生人交往 → 迫切需要一套交易规则 → 「**规则与法律的作用就远远超过**熟人社会的习俗礼节与乡规民约」 |\n| 3 抓「惊喜点」 | 留意文段有没有**结论句**、中心句好不好找 | 尾句有个「**因此**」+ 结论，读完感觉「**法律很重要**」 |\n| 4 找「细节主旨化」的选项 | 选项里**既正确、又契合中心**的 | 恰好是 **D 项**（「规则与法律」「远远超过」对应「更依赖规约和法律的作用」） |\n| 5 确认 | 「这个 D 项它不仅对，而且还符合中心」 | **D** |\n\n> ⭐ **细节主旨化**：「有一种出法叫做**细节主旨化**，就是你看起来好像是一个细节题的问法，什么正不正确，但是你发现这题答案**不仅正确，而且符合中心**，它类似中心理解题。」\n> ⭐「所以为什么这种文段我建议大家**可以先看看文段**，因为有时候有惊喜。」\n\n**【逐项解析】**\n\n- **A 项**：**无中生有**。「差序格局」文段**真没提到**——老师补充：「大家如果想知道什么叫差序格局，可以看一看**费孝通的《乡土中国》**，这是真没提到，就是人的关系像一个同心圆一样，从近到远、由近到远，这叫差序格局。」\n- **B 项**：**与文意相悖**。文段恰恰反驳了这个观点——「规则与法律的作用就远远超过熟人社会的习俗礼节与乡规民约」，说明这玩意儿在现在**不重要**。\n- **C 项**：**无中生有**。文段讲的是**现代社会、陌生社会**，**压根儿没有详细介绍熟人社会**，「你还追着 C 吗？不纠结吧」。\n- **D 项**：✅ 正确。文段尾句的结论「规则与法律的作用远远超过习俗礼节与乡规民约」，等价于「现代社会人际关系的维系更依赖规约和法律的作用」。\n\n**关于「现代社会的人际关系」的答疑（老师预判弹幕）：**\n\n> 「老师哪儿来的『现代社会的人际关系』？——你没看懂文段的意思：\n> 在**古代**是**熟人社会**，你可能一辈子都出不了这个村儿，你的人际关系是熟人的关系；\n> 而**现代社会**的人际关系，它是一种**陌生人的社会交往**，这叫现代社会的人际关系。比如你不认识我，这叫现代社会的人际关系。\n> 你说他不在讲交易吗？**无所谓呀**，交易它也是**社会的人际关系**啊，难道交易不是关系吗？」\n> 举例：「你们在这，我们在这看我上课，或者是你花了钱买我讲义，这个叫产生了现代社会的人际关系吗？他当然产生了呀。」\n\n**【本题要点】**\n\n> ⭐ **人文社科 + 选是题 ⇒ 先看文段，可能遇到「细节主旨化」的惊喜**（答案既正确又契合中心）。\n> ⭐ 看细节题的文段**只需浏览大意**，不需要像中心理解那样分析结构层次——「因为细节判断题，你不需要完全搞懂」。\n> ⭐ 若选项「都对」或「都模棱两可」，**优先选契合文段中心主旨的那一项**（细节主旨化）。\n\n---\n\n### 例题 7｜2021 广东选调·睡眠与 β 淀粉样蛋白\n\n**【题干原文】**（讲义「例7（2021 广东选调）」）\n\n> 关于人类睡眠的最新研究成果表明，当人类睡着后，血液会周期性地流出大脑，脑脊液随即进入，对大脑里 β 淀粉样蛋白等代谢副产品进行清除。这样的过程在睡着后才能实现，因为在人醒着的时候，神经元不会同开同关，让大脑血量下降到足够低的水平。只有睡着之后，大脑里没有那么多血液，脑脊液才能自如地循环开来。这也能解释，为什么人一觉醒来，会感到头脑清爽，而熬夜、失眠则让人头脑昏沉。\n>\n> **对本段文字理解最为准确的是：**\n\n**【选项原文】**\n\n> A. 人类只有在睡着后大脑才会分泌脑脊液\n> B. 人类在清醒时大脑中的血液含量无法降低\n> C. 大脑血液含量不足会导致人醒来后头脑昏沉\n> D. 大脑中 β 淀粉样蛋白会影响人的精神状态\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先定优先验证的顺序 | A 项「**只有……才**」＝绝对；B 项「**无法**」＝绝对 | 先看 C、D，**不先看 A、B** |\n| 2 看 D 项（温和表述） | 「**影响**」极其温和 | 「哪怕你只有百分之零点零零零一的影响，我是不是也能叫影响？」 |\n| 3 回文验证 D | β 淀粉样蛋白确实是「代谢副产品」，清除之后头脑清爽 | 「它如果太多就不好了，它太少了就好」→ D 对 |\n| 4 确定即收手 | 「这个时候如果你确定了答案是 D，你就不用看 A、B，知道吧？如果你不确定，你再看 A、B，这是考场思维」 | **D** |\n\n**【逐项解析】**\n\n- **A 项**：**偷换概念**。「人类只有在睡着后大脑才会**分泌**脑脊液」——文段是「脑脊液**随即进入**」，不是「分泌」。\n- **B 项**：**与文意相悖 + 不符合常识**。文段是「让大脑血量**下降到足够低的水平**」（人醒着时做不到），**不是「无法降低」**——「它不是不能降，是无法降到足够低，大家能不能理解？」\n  > 老师的反例：「你在清洗的时候去医院，扎一针，『医生，我抽血，你别抽我的手，你拿根针在我的大脑里面一抽』，你一抽那不就降低了吗？所以你肯定有办法嘛。」\n- **C 项**：**与文意相悖**。文段说「大脑里**没有那么多血液**，脑脊液才能自如地循环开来」，所以大脑血液**不太多是好**的；「你太多了，反而容易昏沉」「太多容易上头嘛」。C 项说反了。\n- **D 项**：✅ 正确。表述温和（「影响」），且回文可验证（β 淀粉样蛋白被清除后头脑清爽，说明它会影响人的精神状态）。\n\n**【本题要点】**\n\n> ⭐ **「影响」这个词非常温和**（本讲第二次出现「影响是正确答案的选项」，要**补充进自己的知识库里**）。\n> ⭐ **绝对表述（只有……才、无法）→ 优先验证时往后放，但不是直接排。**\n> ⭐ 选项与常识不符也是重要信号：**大脑血液含量下降是不可能有办法「无法降低」的。**\n\n---\n\n### 例题 8｜2022 江苏·数字孪生\n\n**【题干原文】**（讲义「例8（2022 江苏）」）\n\n> 数字孪生是指物理空间中的对象在虚拟空间中的数字模型，该模型通过传感器随时获取真实物体的数据，并随之一起演变、成熟甚至衰老。利用该模型，人们可以对物理对象进行分析、预测、诊断或者训练，从而优化和决策。这个数字模型就像是真实物体的孪生兄弟，因而得名。小到一颗螺丝钉，大到一座城市，物理世界中的各种事物均可拥有数字孪生模型。数字孪生并不是全新技术，而是建模仿真技术在制造领域的新发展之一。\n>\n> **下列关于数字孪生的说法与文意不符的是：**\n\n**【选项原文】**\n\n> A. 本质是真实物体的数字化模型\n> B. 是制造领域研发出的最新技术\n> C. 与物理对象间保持动态的关联\n> D. 因模型与真实物体的关系得名\n\n**【答案】** ✅ **B**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找「不服气」的特殊词 | 选非题，先挑「长得不像好人」的选项 | **B 项有一个「最新」**——有点绝对，**优先看 B** |\n| 2 回文一击 | 找「最新」的对应 | 文段明确说「数字孪生**并不是全新技术**，而是建模仿真技术在制造领域的**新发展**之一」——**不是最新** |\n| 3 板上钉钉 | 「哪怕你纠结 A、C、D，这个 B 是不是一定错？」 | 「**已经没得洗了，洗不干净了，一定不对**」 |\n| 4 收手 | 「就这个时候你就**千万不要再纠结 A、C、D**了」 | **B** |\n\n**【逐项解析】**\n\n- **A 项**：可以对应（「物理空间中的对象在虚拟空间中的**数字模型**」）——「在这儿是……指虚拟空间的模型」。\n- **B 项**：✅ **不符（应选）**。文段说「并不是全新技术」，选项却说「制造领域研发出的**最新**技术」，**与文意相悖**。\n- **C 项**：可以对应（「该模型通过传感器获取真实数据，并**随之一起变化**」——「随之一起不就是关联吗？**同义替换**」）。\n- **D 项**：可以对应（「这个数字模型就像是真实物体的**孪生兄弟，因而得名**」）。\n\n**【本题要点】**\n\n> ⭐ **「最新」「全新」「唯一」这类词，是细节题的高危绝对表述。**\n> ⭐ 「这个 B 已经板上钉钉了……就这个 B 已经没得洗了，洗不干净了、洗不白了，它一定不对，所以你如果在考场上完全不用纠结，直接选 B，其他不用看，**别看，浪费时间**。」（与「海底石油」例题思路完全一致）\n\n---\n\n### 例题 9｜2025 安徽·现代设施农业\n\n**【题干原文】**（讲义「例9（2025 安徽）」）\n\n> 我国主要粮食品种供给充足，但在资源和环境双重约束下，构建多元食物供给体系还面临较大压力。现代设施农业包含设施种植、设施畜牧、设施渔业和工厂化育秧设施、粮食烘干设施、仓储冷链物流设施等公共服务设施，可以利用现代信息技术、生物技术、工程装备技术与现代经营管理方式，突破资源、环境和市场的限制，拓宽农业发展时空，缓解粮食生产面临的问题，尽可能规避市场风险。\n>\n> **与这段文字意思相符的一项是：**\n\n**【选项原文】**\n\n> A. 我国设施农业应用广泛，粮食品种供给充足\n> B. 现代经营管理方式构建了多元食物供给体系\n> C. 解决育秧难问题，须建设工厂化育秧设施\n> D. 现代设施农业可以突破资源、环境的制约\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 顺序 | 「这个文段先看文段还是先看选项？其实都可以」，文段也不难读懂 | 老师开始「carry」 |\n| 2 举一反三（假设这是中心理解题） | 围绕谁在讲？后面全在讲「**它**」的效果——「现代设施农业」 | 所以 **D 作为答案概率就很高** |\n| 3 把文段切成「问题 + 对策」 | 第一句可视为**问题**（供给充足，但资源环境双约束）；后面是**对策**（可以利用……突破……限制） | D 项「可以突破资源、环境的制约」正是对策句 |\n| 4 验证 D | 回文找对应 | 文段「**突破资源、环境和市场的限制**」→ D「可以突破资源、环境的制约」✓ |\n| 5 处理「A、D 都对」的假设 | 若真遇到 A、D 都对 → **优先考虑契合文段中心主旨的选项** | 「因为文段就是围绕**现代设施农业**这一系列的优点来讲的，它更加契合文段的中心」 |\n\n**【逐项解析】**\n\n- **A 项**：「我国设施农业应用广泛，粮食品种供给充足」——「**应用广泛**」**没讲到**（「他说你设施农业只能用在农业，你怎么用『设施广泛』呢？」）。后半句「供给充足」确实有，但前半句无据；且**「一旦 A、D 都对，就选更契合中心主旨的 D」**。\n- **B 项**：**偷换概念 / 概念混搭（张冠李戴）**。「现代经营管理方式」在前半句，「多元食物供给体系」在别处，**两个词没什么关系，被揉在一起了**。老师提示：「其实这个 B 是明显有个问题的，因为**它有个句号**嘛，句号在这是个句号。」\n- **C 项**：**无中生有**。「解决育秧难问题」——文段只是说要包含「**育秧设施**」，**没有说育秧难**。\n- **D 项**：✅ 正确。对应文段「突破资源、环境和市场的限制」。\n\n**【本题要点】**\n\n> ⭐ **细节主旨化**的实战：假设多个选项都「对」，**优先选契合文段中心主旨的**。\n> ⭐ 「现代设施农业」是文段的论述对象（主题词），围绕它讲优点 → 讲它优点的选项概率最高。\n> ⭐ 识别**概念混搭**：把前半句的词和别处的词强行揉在一起（B 项）。\n\n---\n\n### 例题 10｜26 国考行政执法（回忆）·半规管与气压变化\n\n**【题干原文】**（讲义「例10（26 国行政执法回忆）」）\n\n> 半规管原本是感知头部运动的器官，目前尚不清楚它是如何捕捉气压变化的。当半规管感知气压降低，会将信息传递给前庭神经，再传递给下丘脑。下丘脑负责调整自主神经。自主神经是维持体内状态不变、使身体适应外界变化的神经，分为交感神经和副交感神经，前者负责将身体切换到「战斗模式」，后者负责切换到「放松模式」。当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致精神状态不佳。交感神经过度活跃时，身体会处于紧张状态，产生焦虑感；交感神经不能正常工作时，人就会无精打采。\n>\n> **根据这段文字，下列说法正确的是：**\n\n**【选项原文】**\n\n> A. 交感神经负责使人进入放松状态\n> B. 气压变化时人的前庭神经最先感知\n> C. 副交感神经过度活跃使人产生焦虑感\n> D. 气压变化通过下丘脑影响人的精神状态\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 审题 | **选是题**，文段「不太想看」 | 「文段看不看？好像不太想看吧」 |\n| 2 找可优先验证的 | 有可以优先验证的吗？ | 「别的不知道，这个 B 我不想看」——因为「最先」是绝对；选正确时**先看 A、C、D** |\n| 3 吃一堑长一智 | 「刚刚还做了一个『**影响』是正确答案的选项**，你又看到了一个『影响』，是不是得先看一看、尊重一下？」 | D 项「**影响**」非常温和 → **先看 D** |\n| 4 回文验证 D | 找「影响」的对应 | 文段「当下丘脑因气压变化受到刺激时，自主神经的功能就会紊乱，导致**精神状态不佳**」——「影不影响？那当然影响了，这都导致精神不佳了」 |\n| 5 走人 | 「行了，走不走？走是吧？**莫停留**」 | **D** |\n\n**【逐项解析】**\n\n- **A 项**：**与文意相悖**。文段「前者（交感神经）负责将身体切换到『**战斗模式**』」，A 却说「负责使人进入**放松**状态」。\n- **B 项**：**偷换主语 / 与文意相悖**。「气压变化时人的前庭神经**最先**感知」——文段是「当**半规管**感知气压降低，会将信息传递给前庭神经」，**最先感知的是半规管**，不是前庭神经。（「它不是半规管先感知吗，然后再传递给前庭神经，这也不对吧」）\n- **C 项**：**偷换概念（一字之差）**。「**副**交感神经过度活跃使人产生焦虑感」——原文是「**交感**神经过度活跃时，身体会处于紧张状态，产生焦虑感」。老师点评：「虽然是有一个（对应），但**其实问题在『副』上**，对不对？在『副』上偷换概念。」\n- **D 项**：✅ 正确。气压变化 → 下丘脑受刺激 → 自主神经功能紊乱 → 精神状态不佳，即「气压变化通过下丘脑影响人的精神状态」。且「影响」温和，与例题 7 同款。\n\n**【本题要点】**\n\n> ⭐ **「影响」是高频的正确答案信号词**——非常温和，「哪怕只有 0.00001 的影响，也叫影响」。\n> ⭐ 「最先」「第一」「唯一」等序位词是常见的偷换点。\n> ⭐ 一字之差（交/副交感）就是**偷换概念**，做题要盯紧修饰成分。\n> ⭐ 选是题中，**绝对表述（最先）先放后面看**，优先验证温和表述。\n\n---\n\n### 例题 11｜2025 江苏·司法建议\n\n**【题干原文】**（讲义「例11（2025 江苏）」）\n\n> 司法建议最初源于行政诉讼。近年来，司法建议的适用范围不断拓展，从保障法院裁判执行措施，进阶升级为社会矛盾纠纷的预防性机制。司法建议既是对传统「治未病」理念的继承，也是对新时代「枫桥经验」的一项创新性实践。通过司法建议，对案件审理过程中发现的可能影响社会和谐的隐患或因素提出建议，以预防纠纷再次发生，有效的司法建议不仅能预先准确找出矛盾纠纷产生的原因，还能进一步提升法院的权威，彰显司法的人文关怀。\n>\n> **下列关于司法建议的说法，与文意不符的是：**\n\n**【选项原文】**\n\n> A. 适用范围正在逐步地扩大\n> B. 不会弱化司法机关的权威\n> C. 可有效避免社会矛盾产生\n> D. 是一种更柔性的治理方式\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 审题 | **选非题** + 人文社科 | 「这个文段你可不可以看呢？你可以看，也可以不看。……因为这个题是**选非题**，所以**不存在细节主旨化**的情况」 |\n| 2 找「长得就不像好人的」 | 「大家都不是什么好人，但你让我找一个**最离谱**的」 | B 有「**不会**」，C 有「**避免**」，D 有「**更**」——都有点绝对 |\n| 3 锁定 C | 「你不选 C，你觉得合理吗？**有效避免社会矛盾产生**」 | ⭐「是不是学过马克思主义？**社会的进步就是矛盾产生的，你没有矛盾怎么进步呢？**结果你告诉我，你可以有效避免社会矛盾，这简直就是违背了这个规律。」 |\n| 4 回文验证 C | 文段里到底说了什么 | ①文段只是「**建议**」「预先准确找出矛盾纠纷**产生的原因**」——**不是有效避免**；②若非得说避免，**顶多是「避免发生过的东西再次发生」**，即「预防纠纷**再次**发生」 |\n| 5 收手 | 「牛老师，你先看 C 对不对？当然你不是直接选」 | **C** |\n\n> ⭐「它顶多是**吃一堑长一智**的意思。……它顶多是这玩意儿，这个问题已经发生了，放过的错误咱不要再犯，**是预防再次，而不是能够完全避免矛盾发生**，这个就太宽泛了、太违背常识了。」\n\n**【逐项
