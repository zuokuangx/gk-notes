正确途径优先级"},{"level":2,"text":"十四、词语 / 成语积累表","id":"十四词语-成语积累表"},{"level":2,"text":"十五、易错点与陷阱清单","id":"十五易错点与陷阱清单"},{"level":2,"text":"十六、老师金句","id":"十六老师金句"}]},{"id":"P10","title":"逻辑填空·并列关系","full":"【言语理解与表达】张弓言语·十二箭 · 第九讲（合集第 10 集）","lect":"","dur":"101:00","sec":6060,"theme":"","url":"","md":"# 【言语理解与表达】张弓言语·十二箭 · 第九讲（合集第 10 集）\n\n> **课程名称**：张弓言语·十二箭（适用 26 国考 / 省考 / 多省联考 / 选调生 / 事业单位 / 三支一扶）\n> **讲师**：张弓（上岸村）\n> **本集位置**：合集第 10 集（共 14 P；正课第九讲）\n> **视频地址**：https://www.bilibili.com/video/BV14RzZBuEz3?p=10\n> **时长**：约 101 分钟\n> **本集主题**：**逻辑填空——语境分析之并列关系**（近义并列 / 反义并列 / 相同句式表并列 / 三并列 / \"或、且、并\"引导的并列 / 并列中的局部与整体）\n\n---\n\n## 目录\n\n- [一、开场回顾：逻辑填空做题基本思路](#一开场回顾逻辑填空做题基本思路)\n- [二、为什么本讲只讲\"并列关系\"](#二为什么本讲只讲并列关系)\n- [三、并列关系的常见考法（三大类）](#三并列关系的常见考法三大类)\n- [四、相同句式表并列](#四相同句式表并列)\n- [五、其他并列考法](#五其他并列考法)\n- [六、并列中的局部与整体（本讲最重要的思想）](#六并列中的局部与整体本讲最重要的思想)\n- [例题精讲](#例题精讲)\n  - [例题1｜2024 国考 · 协商民主（近义并列）](#例题1-2024-国考--协商民主近义并列)\n  - [例题2｜2025 云南 · 新物种的发现（反义并列）](#例题2-2025-云南--新物种的发现反义并列)\n  - [例题3｜2024 国考 · 战场\"善疑\"（相同句式表并列）](#例题3-2024-国考--战场善疑相同句式表并列)\n  - [例题4｜2025 国考 · 改进文风\"短实新\"（反义并列）](#例题4-2025-国考--改进文风短实新反义并列)\n  - [例题5｜2023 国考 · 冰川监测（三并列，昨日作业题）](#例题5-2023-国考--冰川监测三并列昨日作业题)\n  - [例题6（例5）｜2022 福建 · 柔性电子技术（三并列＋主题词）](#例题6例52022-福建--柔性电子技术三并列主题词)\n  - [例题7（例6）｜2022 江苏 · 城区与郊区（三并列＋解释说明反推）](#例题7例62022-江苏--城区与郊区三并列解释说明反推)\n  - [例题8（例7）｜2020 国考 · 测谎仪（\"且\"字表不同）](#例题8例72020-国考--测谎仪且字表不同)\n  - [例题9（例8）｜2021 国考 · 盐与人类文明（\"并\"引导的两方面并列）](#例题9例82021-国考--盐与人类文明并引导的两方面并列)\n  - [例题10（例9）｜2025 国考 · 保持历史耐心（局部看整体）](#例题10例92025-国考--保持历史耐心局部看整体)\n  - [例题11（例10）｜2024 深圳 · 刀刃向内（相同句式表并列）](#例题11例102024-深圳--刀刃向内相同句式表并列)\n  - [例题12（例11）｜2024 国考 · 守正创新（逻辑填空中心理解化）](#例题12例112024-国考--守正创新逻辑填空中心理解化)\n  - [例题13（例12）｜2024 深圳 · \"精专\"读书法（近义并列＋整体）](#例题13例122024-深圳--精专读书法近义并列整体)\n  - [例题14｜课后答疑补充题① · 相声（2026/02/06 答疑）](#例题14课后答疑补充题--相声20260206-答疑)\n  - [例题15｜课后答疑补充题② · 2026 国考标题题（城镇化与基层治理）](#例题15课后答疑补充题--2026-国考标题题城镇化与基层治理)\n- [七、并列关系-总结（省流版）与课程预告](#七并列关系-总结省流版与课程预告)\n- [八、课后答疑](#八课后答疑)\n- [九、本讲方法框架总表](#九本讲方法框架总表)\n- [十、词语/成语积累表](#十词语成语积累表)\n- [十一、易错点与陷阱清单](#十一易错点与陷阱清单)\n- [十二、老师金句](#十二老师金句)\n\n---\n\n## 本讲知识地图\n\n| 板块 | 核心内容 | 核心方法 |\n| --- | --- | --- |\n| 开场回顾 | 逻辑填空做题基本思路（思路 / 语境分析 / 词语辨析 / 对比择优） | 两个点：文段的角度（弄清文段与横线的意思）+ 选项中挑选合适的词语 |\n| 并列常见考法 | ①近义并列 ②反义并列 ③相同句式表并列 | 近义并列表相近；反义并列表相反；相同句式可近可反、视文段而定 |\n| 例题1~4 | 近义并列、反义并列、相同句式表并列的实战 | 找并列标志词 → 判断相近/相反 → 找对应点 |\n| 其他并列考法 | ①三并列（给定两词填第三词）②\"或、且、并\"引导的两并列 | 三并列要灵活、尽量从别的空入手；或且并表\"不同\"（一定不重复） |\n| 例题5~9 | 三并列（3 题）、\"且\"表不同、**\"并\"表两方面并列** | 例题9 树立\"**有病优先看病（关联词）**\"的优先级 |\n| 局部与整体 | 本讲最重要的思想：几乎所有并列难题的出题角度 | 不能只看局部，要带着整体的感觉去看局部 |\n| 例题10~13 | 保持历史耐心、刀刃向内、守正创新、\"精专\"读书法 | 局部说得通 ≠ 答案；用**观点句 / 主语句 / 首句话题词**定唯一 |\n| 例题14~15 | 课后答疑两道补充题（相声、2026 国考标题题） | 先知道词义（\"停留\"＝笃定 vs \"徘徊/流连\"＝犹豫）；标题题抓首句话题 |\n| 总结 / 答疑 | 并列关系-总结（省流版）思维导图；邯郸学步期、精刷、四类结构切分 | 逻辑填空题\"**中心理解化**\"是趋势 |\n\n---\n\n## 一、开场回顾：逻辑填空做题基本思路\n\n老师开场：\n\n> \"今天我们还是讲我们的逻辑填空并列关系，我们先老规矩，把我们昨天的内容回顾一下。\"\n\nPPT 首页为「逻辑填空题」思维导图（上一讲内容的总复习），结构如下（依据帧 f_0004 抄录，部分文字被人像遮挡处以省略号标注）：\n\n```\n逻辑填空题\n├─ 思路\n│   ├─ 弄清文段与横线意思 ←—结合—→ 选项寻找合适的词语\n│   │    (1) 意思是逻辑填空的灵魂，并非完全靠语感\n│   │    (2) 搭配考察词语使用的合理性，但并非最重要，一定要以文段意思优先\n│   └─ 选项寻找合适的词语\n│        (1) 基本释义是基础\n│        (2) 其他角度：搭配对象、程度轻重、感情色彩、使用语境、\n│            宠词陪跑词、固定搭配、词义侧重等\n├─ 语境分析\n│   └─ 句内呼应\n│        · 注意横线所在句子的意思，通过横线前后的提示推测横线处的意思\n│        · 高频考法：出现 \"__,xxxxxxx\" 的标志，重点关注后面的解释说明\n├─ 词语辨析\n│   ├─ 基本释义：词语意思的区别\n│   ├─ 词义侧重：辨析方法（一般用于形近音近词的辨析），拆字组词\n│   ├─ 搭配：注意积累词语不同的搭配对象（比如人与物等）；\n│   │        积累热词搭配（官方热词、日常习惯用语）\n│   ├─ 程度轻重：从语义程度方面对词语进行区分\n│   ├─ 感情色彩：从感情色彩方面对词语进行区分（褒义、中性、贬义）\n│   ├─ 使用语境：需要积累一些词语的使用语境（如罄竹难书……）\n│   └─ 宠词陪跑词：可以积累词语作为正确答案的概率，关键时刻……\n└─ 对比择优\n```\n\n老师回顾要点：\n\n> \"昨天我们做了两件事情，第一件事情我们讲述了逻辑填空题做题的一个基本思路……根据两个点，一个是文段的角度，弄清文段和横线的意思。\"\n\n> ⭐ **\"意思是逻辑填空的灵魂。\"** 虽然有的时候要考虑搭配的合理性，但并非一定最重要，一定要**文字的意思优先**，也不能完全靠语感。\n\n> 关于选项抉择：\"基本的释义是最基础的，意思的差别是最根本的。\"除此之外还有搭配的角度、程度、感情、使用语境，包括适不适合作为正确答案的\"宠词陪跑词\"，以及固定搭配和词义侧重。\n\n老师提醒（学习心态）：\n\n> \"逻辑填空题你文段怎么去分析，这个是可以靠短时间内去学习去掌握的；但是选项中对词语的积累，短时间内不太容易做到，需要大家慢慢刷题、去积累、去提高。就像巧妇难为无米之炊——你能短时间内提高英语单词的英语成绩吗？不行，单词得靠记忆，一个道理。\"\n\n第二块回顾——**语境分析·关系词辨析**：\n\n> \"特别是出现**横线加逗号**的时候，后面的内容极有可能就是对横线处的一个解释、一个说明，所以一定要重点关注。\"（对应导图中\"高频考法：出现 '__,xxxxxxx' 的标志\"）\n\n---\n\n## 二、为什么本讲只讲\"并列关系\"\n\nPPT 标题页（帧 f_0027）：**弓助上岸九 · 六、逻辑填空题 ·（三）并列关系**\n\n> \"今天的内容就一个并列关系，咱们今天晚上就这一个目标把它给吃透就可以了。为什么呢？因为并列关系在逻辑填空当中考得非常非常的多。其实老师在中心理解没有讲并列……因为其实并列它比较特殊，你前面的学好了，并列自然就学会了。但是逻辑填空当中的并列非常非常的关键。\"\n\n为什么不讲转折和因果？\n\n| 关系 | 讲法 | 老师评价 |\n| --- | --- | --- |\n| 转折 | 转折就是相反，横线往前看，找相反 | \"太简单了，没有必要花功夫\" |\n| 因果 | 有一些比较直接的因果关系 | 容易理解 |\n| **并列** | 复杂得多 | \"所以大家一定要注意，这块得掌握住\" |\n\n---\n\n## 三、并列关系的常见考法（三大类）\n\nPPT（帧 f_0043、f_0080，逐字抄录）：\n\n> **（1）并列常见考法**\n>\n> **①近义并列**：\"、\" \"，\" \"和\" 等引导的双并列（2个词之间的并列）\n> 考法：语义相近，感情色彩相近（不一定完全一致）　如：需要**自信**、**自强**\n>\n> **②反义并列**：\"不是...而是...\" \"多一些...少一些...\" \"既不能...也不能...\" \"要…不要…\" 等\n> 考法：语义一般相反相对　如：**要科学**，**不要愚昧**\n>\n> **③相同句式表并列**\n> 考法：可以相近也可以相反，视具体文段而定（观察文段整体表述感情有无变化）\n> 如：**好的书籍净化心灵，坏的书籍残害灵魂**（板书标注：净化 ↔ 残害，相反）\n\n### ① 近义并列——专指\"双并列\"\n\n> \"注意这个近义并列，老师在这里特指是**双并列**，也就是**两个词**之间的并列关系……如果你在考场上发现多个词（昨天说的三并列），这个不属于近义并列的范畴。它一般用逗号、顿号和'和'连接在一起。\"\n\n例：需要自信、自强 → 自信与自强语义相近、感情色彩相近。\n\n**四条\"注意\"（PPT 红字，帧 f_0043）：**\n\n1. **近义并列就是要语义接近，不存在重复！不存在重复！！不存在重复！！！**\n2. 不一定完全一样，有相似性就可以\n3. 逗号\"，\"一般是前后为成语之时，才是引导近义并列\n4. **此为最高频的考法**\n\n> ⭐ \"每次我讲课都有同学走神了，说'老师，不重复吗？'来，自己默念一下：不存在重复、不存在重复、不存在重复。因为我要的就是你俩接近，你越接近越好。这叫并列关系，这叫同义并列，它不叫重复。\"\n\n### 关于\"重复\"问题的两点澄清（板书，帧 f_0060/f_0075）\n\n板书结构：\n\n```\n重复 ──┬─ ① 语义重复不爱考\n       └─ ② 修饰关系（的、地）→ 例：美丽的漂亮（×）\n```\n\n1. **从考频来讲，\"语义重复\"这个点不爱考。**\n   > \"我们在考虑选项的时候，你不要先想着它到底有没有重复的问题。它也可能考到过，但是考的概率是很低的。就跟出题人在英语当中不考语法一样，基本上不考这玩意儿。\"\n\n2. **大家公认的\"不能重复\"是修饰关系**——由\"的、地\"连接、词性又相同（都是形容词）时，一般尽量不要重复。\n   > \"比如说'**美丽的漂亮**'这个就一般不太行，词性又相同，都是形容词，这就不行。\"\"还有'**精挑细选**的挑选'，就是挑选的挑选；'**条分缕析**的分析'，就是分析的分析。\"\n\n3. 不一定完全一样，**有相似性就可以**。\n   > \"你越接近越好……你不能两个完全感觉没什么关系，这就不行。\"\n\n### 逗号的特殊性\n\n> \"顿号就很确定是一个并列。但是逗号比较特殊：如果逗号前后是**两句话**（句，句），那它并不是引导并列关系；但是如果逗号前后都是**四字的成语**（成语，成语），那它就是引导并列关系。\"（板书右上角写有\"句，句 或 句、句\"并打叉，提示句与句之间的逗号不算并列标志）\n\n### ② 反义并列\n\n引导词：\"**不是…而是…**\"\"**多一些…少一些…**\"\"**既不能…也不能…**\"\"**要…不要…**\"等，相当于引导词。\n考法：语义一般**相反相对**。例：要科学、不要愚昧——\"科学\"和\"愚昧\"之间就是相反的。\n\n> \"它其实考的也不算特别多，也有……肯定没有第一个多。第一个（近义并列）是最多的。\"\n\n补充（讲师答疑时强调）：\n\n> \"我再强调一遍，'既怎么样又怎么样'其实表达不同，但是从概率来讲，它很多是相反的。比如说'我们既不能走封闭僵化的老路，也不能走改旗易帜的邪路'——既…又…它一般就是一种相反的感觉。\"\n\n### ③ 相同句式表并列\n\n> \"相同句式就是看起来像排比句一样……比如'代表先进生产力的发展要求、代表先进文化的前进方向、代表最广大人民群众的根本利益'，这就是相同句式表并列。\"\n\n考法：**可以相近，也可以相反，依具体的文段情况来定**。\n\n> \"老师怎么判断到底相近相反呢？就是你要看一下**文段整体的感情有没有变化**。你发现它如果全文章从头到尾都是一回事儿，那就是近义并列；你如果发现文段明显有一些不同，那就可能有相反的感觉。\"\n\n例：好的书籍**净化**心灵，坏的书籍**残害**灵魂——\"书籍、书籍\"相同句式，\"好、坏\"明显一好一坏 → 反义并列，\"净化\"与\"残害\"正好相反。\n\n---\n\n## 例题精讲\n\n### 例题1｜2024 国考 · 协商民主（近义并列）\n\n**【题干原文】**（帧 f_0097 逐字抄录）\n> 发展社会主义协商民主，要把民主集中制的优势运用好，发扬\"团结—批评—团结\"的优良传统，广开言路，______，促进不同思想观点的充分表达和深入交流，做到相互尊重、平等协商而不强加于人，遵循规则、有序协商而不各说各话，体谅包容、真诚协商而不偏激偏执，形成既畅所欲言、______，又理性有度、合法依章的良好协商氛围。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 集思广益　各抒己见\n> B. 不耻下问　百家争鸣\n> C. 兼收并蓄　取长补短\n> D. 虚怀若谷　从善如流\n\n**【答案】** ✅ A（帧 f_0125 老师板书大\"A\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"逗号前后都是成语 → 逗号引导近义并列\" | 第一空：\"广开言路，______\"，前后都是四字成语 |\n| 2 抓核心字 | 分析标志词的意思 | \"广开言路\"凸显一个\"**广**\"字——大家都来，充分吸收你们的意见 |\n| 3 找相近 | 找含\"广\"义、有相似性的成语 | 集思广益（\"集思\"对\"广开\"）✔；兼收并蓄（\"兼\"＝都来、都兼容）✔ |\n| 4 排无\"广\"义 | 不一定有\"广\"的意思的排除 | 不耻下问、虚怀若谷——可能从头到尾就一个人给你提意见，不一定\"广\" |\n| 5 第二空 | \"既畅所欲言、______，又理性有度\" | \"既…又…\"表达不同（从概率讲很多相反）；\"畅所欲言\"＝想说什么说什么 → 只有\"各抒己见\"能衔接 |\n\n**【逐项解析】**\n- **A 项**：✅ 集思广益与\"广开言路\"语义相近（都有\"广、都来\"的意思）；\"各抒己见\"与\"畅所欲言\"（各自发表自己的意见或见解）相近。\n- **B 项**：不耻下问——向地位不如自己的人请教（\"我说小张，这个题怎么做呀，教教我呗\"），从头到尾可能就一个人，**不一定有\"广\"的意思**；第二空\"百家争鸣\"（形容学术之间的自由争论）勉强凑合，但第一空不行。\n- **C 项**：兼收并蓄——\"兼\"就是大家都都可以来，第一空也可以；但第二空\"取长补短\"（用长处弥补短处）体现不出\"畅所欲言\"。\n- **D 项**：虚怀若谷——\"小张对我有意见，我觉得说得有道理就采纳了\"，也是**不一定要很多人**；\"从善如流\"（迅速地采纳别人的正确意见）强调**上位者对下位者的接纳**，而文段此处站在平等表达的角度，不合适。\n\n**【本题要点】**\n> ⭐ 抓住标志词里的核心字（本题是\"**广**\"字），四个成语里谁是\"大家来\"、谁是\"一个人来\"，一辨即明。\n> ⭐ \"既…又…\"表达不同，从概率来讲很多是相反的——\"可以稍微随便一点，但你不能太随便了\"（畅所欲言 ↔ 理性有度、合法依章）。\n\n---\n\n### 例题2｜2025 云南 · 新物种的发现（反义并列）\n\n**【题干原文】**（帧 f_0152 逐字抄录）\n> 对分类学者来说，与其说是找到新物种，不如说是碰到新物种。新物种的发现往往并非______，而是意外之喜。在阅读文献、野外调查、查阅图片或者研究标本时，分类学者偶尔会发现某份标本或者个体跟之前的记录不一样，进而通过形态学比较或者分子测序手段确认该物种是否属于新的物种。\n> 填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 守株待兔（死守狭隘的经验不知变通，也讽刺妄想不劳而获的侥幸心理）\n> B. 刻舟求剑（办事刻板拘泥，不知根据实际情况处理问题）\n> C. 照本宣科（形容讲课、发言等死板地按照课文讲稿，没有发挥，不生动）\n> D. 按图索骥（依照线索去寻找事物）\n\n**【答案】** ✅ D（帧 f_0152 老师在 D 项画 ✓）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"并非______，而是意外之喜\" → 反义并列 | 横线要与\"**意外之喜**\"构成相反关系 |\n| 2 解横线义 | 结合上下文解释\"意外之喜\" | 在阅读、调查、查阅、研究时**偶尔**发现——无心、巧合、偶然 |\n| 3 反推 | 偶然的反面 | **计划之内、程序之中、刻意、有目的**——\"我本来就应该这样做的\" |\n| 4 粗排 | 先排感情色彩完全消极的 | B 刻舟求剑、C 照本宣科过于消极——\"按计划走\"不能叫消极（\"我今天七点三十八上课，这叫按照计划进行，这不叫消极啊\"） |\n| 5 细辨 | 剩 A、D 辨析词义的两个侧面 | D 按图索骥有两个意思：①中性——按照既定步骤/规划去做（计划之中）②消极——非得按照图找马，死板不变通。**既有中性又有消极**，故能作答 |\n\n**【逐项解析】**\n- **A 项**：守株待兔——①死守狭隘经验不知变通（偏消极，与刻舟求剑差不多）②讽刺不劳而获。\"我作为学者就是在找物种，根本就没有不劳而获\"；而且文段是\"在阅读、在调查、在查阅、在研究的时候偶尔发现——你是在动的，是在工作当中有了新发现\"，不是待在家里等惊喜。\n- **B 项**：刻舟求剑——办事刻板拘泥，感情基调完全消极，排掉。\n- **C 项**：照本宣科——死板地按照讲稿念，同样完全消极，排掉。\n- **D 项**：✅ 按图索骥——依照线索去寻找事物（中性，计划之中），符合\"意外之喜\"的反面。\n\n**【本题要点】**\n> ⭐ 出题人放\"守株待兔\"就是让有些同学想掉坑：\"我正在这儿睡觉呢，砰的一下出来个兔子\"——确实有惊喜的感觉，但这个惊喜建立在**不劳而获、啥也不干**的基础上；文段的惊喜是**做事情当中**来的。\n> ⭐ **记词一定要记完整**：如果一个词在你脑海里只有消极的意思，就可能选不到正确答案（如\"按图索骥\"既有中性义又有消极义）。\n\n---\n\n## 四、相同句式表并列\n\n### 例题3｜2024 国考 · 战场\"善疑\"（相同句式表并列）\n\n**【题干原文】**（帧 f_0185 / f_0188 / f_0206 多帧拼合逐字抄录）\n> 战场上未解之惑、未识之物、未通之理皆可疑。战场中的善疑并非一味多疑或疑邻盗斧般无度，而是要从全局出发，围绕作战目的、作战对手、作战体系而\"疑\"，观察战场态势，分析关联要点，力求对敌方的军事行动______，对敌方的结构体系心知肚明，从而把握重心，掌握大局。\n> 填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 绿色注释，帧 f_0206）\n> A. 洞若观火（清楚得就像看火一样，形容观察事物透彻分明）\n> B. 防患未然（在祸患发生之前就加以预防）\n> C. 胸有成竹（处理事情之前已有完整的谋划打算）\n> D. 未卜先知（没有占卜便能事先知道）\n\n**【答案】** ✅ A（帧 f_0206 老师板书大\"A\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"对敌方的军事行动______，对敌方的结构体系心知肚明\" → 排比句、相同句式 | \"力求对……对……\"相同句式表并列 |\n| 2 判近反 | 看感情基调有没有变化 | \"从而把握重心，掌握大局\"——结果没变 → 相同的意思 → **近义并列** |\n| 3 找对应 | 逻辑填空找对应点 | 敌方对敌方、军事对军事、**\"心知肚明\"对到横线** |\n| 4 解词 | 分析\"心知肚明\" | 心中非常清楚明白 → 找意思最接近的词 |\n\n**【逐项解析】**\n- **A 项**：✅ 洞若观火——\"就我们记成语的时候，不要死记硬背，我们要形象地记，就好比一个黑黢黢的山洞，你突然点起了一把火，就像在一个黑黢黢的山洞里面看这个火一样，非常清晰、非常明了，就是观察事物非常清晰透彻\"。正是\"心知肚明（心里门儿清）\"。\n- **B 项**：防患未然——\"跟清楚明白没关系\"，先排掉。\n- **C 项**：胸有成竹——记住两个字：\"**自信**\"（\"老师，我对这次的 314 联考，我胸有成竹\"）。\"你了解是一回事儿，你能不能打得过是另一回事儿：敌方五十万我三十万，你说优势在我？了不了解和你自不自信，不能构成必然的关系\"，排掉。\n- **D 项**：未卜先知——\"作为公务员考试，咱们得保证三观和主流价值观保持一致啊：你能对军事学未卜先知吗？这是人类能干的事儿吗？别人也是从全局出发，围绕对手做了观察、做了分析才达到目的，怎么可能未卜先知呢？\"——偶尔出现，考得很少，排掉。\n\n**【本题要点】**\n> ⭐ \"逻辑填空题，特别是国考题，包括大部分联考题，都是非常讲究逻辑关联性的。就像我们玩密室逃脱游戏一样，你把线索抓到了，你就能做出来。\"\n> ⭐ 相同句式（排比）出现时，先判断文段感情基调有无变化，再定近义还是反义。\n\n---\n\n### 例题4｜2025 国考 · 改进文风\"短实新\"（反义并列）\n\n> 老师原话：\"这个题我非常喜欢，**如果让我在 2025 年国考题当中找一个我最喜欢的逻辑填空，就是这个题了。**\"\n\n**【题干原文】**（帧 f_0212 逐字抄录）\n> 改进文风就要多写\"短实新\"的好文章。\"实\"就是讲符合实际的话不讲脱离实际的话，讲管用的话不讲空话，讲反映自己思考的话不讲______的话，讲有感而发的话不讲______的话，讲通俗明白的话不讲故作高深的话，______，用朴实的语言阐述深刻的理论。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0240）\n> A. 故弄玄虚　装腔作势　由表及里（是从表面现象看到本质）\n> B. 照本宣科　无病呻吟　深入浅出（文章或言论的内容很深刻措辞却浅显易懂）\n> C. 人云亦云　言不由衷　举一反三（从一件事情类推而知道其他许多事情）\n> D. 陈词滥调　冠冕堂皇　言简意赅（言语简明而意思完备）\n\n**【答案】** ✅ B（帧 f_0240 老师圈\"深入浅出\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"从第二句开始都是'讲什么不讲什么'\" | 讲…不讲…、讲…不讲… → **反义并列** |\n| 2 验证 | 相邻句子一一相反 | 符合实际 ↔ 脱离实际；管用 ↔ 空话 |\n| 3 第一空 | 横线要对应\"自己思考\"且加\"不\" | 即\"**自己没有思考**\" |\n| 4 第二空 | 与\"有感而发\"相反 | 即\"**无感而发**\"——我没有感觉，却发表见解 |\n| 5 第三空 | 解释\"讲通俗明白的话不讲故作高深的话\" | \"用朴实的语言阐述深刻的理论\"→ **深入浅出**：深入对应深刻的理论，浅出对应朴实的语言 |\n\n**【逐项解析】**\n- **第一空**：照本宣科（跟着说）、人云亦云、陈词滥调（陈旧的）都有\"自己没有思考\"的感觉，都还行；**A 的故弄玄虚与\"有没有思考\"关系不大**——\"故弄玄虚可能是你自己想的呀，你重点是没有思考呀\"，排掉 A。\n- **第二空**：**无病呻吟**太好了——\"就当年辛弃疾写的那首词：'少年不识愁滋味，爱上层楼，爱上层楼，为赋新词强说愁'——没什么忧虑的事情你却在这儿说，这就是无感而发\"；**言不由衷**也可以（说一些不是自己真正感想的话）。但 A 的装腔作势（做作）、D 的冠冕堂皇（显得庄严体面），**跟你有没有真实的感受没有关系**——你有感受也可以装腔作势，所以 A、D 排掉。\n- **第三空**：剩 B、C。**深入浅出**完美对应\"朴实的语言＋深刻的理论\"；**举一反三**是\"由一推到其他很多\"，跟\"深刻\"和\"朴实\"无关。另外对比 A 的由表及里——\"文段的意思是我用通俗的语言讲深刻的道理，**不是简单的从浅显到深刻**（表里关系不对）\"；D 的言简意赅——\"相比较于深入浅出，它少了'深入'两个字，只能体现出浅出、体现出语言很朴实，但不能体现出道理很深刻\"。\n\n**【本题要点】**\n> ⭐ \"哪怕你前两空不好做，你第三空对比选项：朴实的语言、深刻的理论 → 深入浅出。\"\n> ⭐ 多空题要会用**最好下手的那一空**定答案。\n\n---\n\n## 五、其他并列考法\n\nPPT「（2）其他并列」（帧 f_0290 逐字抄录）：\n\n> **①给定两个词，填第三个词语**：甲、____、丙\n> 　考法：根据给定两词的关系推断横线信息　如：脚踏实地、____、真抓实干；高__、帅\n> 　**提示：鉴于三并列的复杂性，遇到了尽量从别的地方入手**\n>\n> **②或、且、并引导的并列**：\n> 　考法：语义一般不重复，只是表不同　如：痛并快乐、东方或西方\n\n### ① 三并列（给定两个词填第三个词）\n\n> \"甲、横线、丙——这就不是近义并列了，因为它是三并列。我刚才说过了，近义并列特指两并列。三并列怎么做？两个字：**非常灵活**。它要根据给定的两个词的关系来推测第三个词：他俩如果接近，那就接近；他俩如果不接近，那就不接近——可以接近，也可以不接近，随便。\"\n\n例：**脚踏实地、____、真抓实干** → 都得体现一个\"实\"字 → 填意思接近的。\n例：**高、__、帅** → \"你不能填'高丑帅'吧？大概也要填一个褒义词；但'好看'行不行？不行——因为高和帅不是完全相同的一个角度，'好看'换了角度，和高和帅可能关系不大。\"\n\n> ⭐ **\"鉴于三并列的复杂性，遇到了尽量从别的地方入手。\"** \"我不是说你就一定不要管它，是你先看一下别的空。大部分情况下，绝大部分题其实跟三并列关系没有那么大。这就是考试的思维。\"\n\n**重要澄清——三并列≠递进：**\n\n> \"有多少人觉得三并列一定要表递进关系的？**没有这个说法**。大家请把'递进'这两个字在自己脑海里先删掉。我们从来没有说过三并列一定要表递进。它有没有这种情况？有，但不是说一定是这样子的，它只是有可能一样或不一样而已。\"\n\n### ② \"或、且、并\"引导的两并列\n\n> \"或、且、并它跟'和'、顿号就不太一样。它引导的一般是**不重复**，它只是**表不同**——注意也不是相反，就是单纯的不同而已。\"\n> \"痛并快乐——你能不能改成'痛并疼着'？东方或西方——我说'东方或东方'行不行？数学里面说'有且只有'——你能不能说'有且有'？不行！当你发现**或、且、并**三个字的时候就要注意了，它就是一定不能一样。\"\n\n对比记忆：\n\n| 类型 | 语义关系 | 备注 |\n| --- | --- | --- |\n| 三并列（甲、__、丙） | 可能一样，也可能不一样 | 看给定两词的关系；尽量从别的空入手 |\n| 或/且/并两并列 | **一定不一样**（表不同，不重复） | 考得不多；注意它一般是**两个词**之间的关系 |\n\n（老师补充：\"我说或且并的时候，它一般是两个词之间的关系。你如果是三个词之间的关系的话，那就按照三个词来定。三个词是最特殊的。\"）\n\n### 例题5｜2023 国考 · 冰川监测（三并列，昨日作业题）\n\n**【题干原文】**（帧 f_0255 逐字抄录）\n> 在气候变暖背景下，冰川是变化最快速、最显著和最具______的地理要素之一。过去50年来，由于气候变暖，全球冰川加速消融，造成海平面上升、水循环变化、冰川灾害增加，引发人们高度关注。应用科学方法，______冰川消融、保持水资源的可持续利用，在当前区域迅速增温、冰川快速退缩的情境下，显得尤为重要。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n> A. 指示性　缓解\n> B. 直观性　避免\n> C. 动态性　干预\n> D. 通用性　防止\n>\n> （PPT 下方注释：指示性：起到对客观事物某种状态的指明、显示作用）\n\n**【答案】** ✅ A（帧 f_0275 老师圈\"指示性\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"最快速、最显著和最具______\" → 三并列 | 不属于近义并列（近义并列特指两并列） |\n| 2 析给定词 | 最快速＝**速度**问题（冰川变化很快）；最显著＝**最明显**（不用望远镜不用显微镜，肉眼就知道冰川的变化） | 第三个词按同样思路推测 |\n| 3 解\"指示性\" | **关联性最强** | \"人一发烧，马上就不舒服、可能头疼——头疼不一定最明显（看不出来），也不一定最快，它只是关联性很强：身体但凡有点儿不舒服，马上就有症状\" |\n| 4 定答案 | 三个词一个说速度、一个说明显、一个说关联性，各占一个角度，不算重复 | 第一空填\"指示性\"问题不大；第二空\"缓解冰川消融\"（选项 A 自带） |\n\n**【本题要点】**\n> ⭐ 有同学问\"最快速、最显著、指示性\"是不是语义重复？老师答：**不能说它重复**——一个是速度的问题，一个是明不明显的问题，一个是关联性强不强的问题，是三个不同角度。\n> ⭐ \"这个题主要是通过**第二空（缓解）**做的，别的空不太好下手\"——印证\"三并列遇到就尽量从别的地方入手\"。\n> ⭐ 板书（帧 f_0275）：最快速→快｜最显著→明显｜指示性→关联性最强。\n\n### 例题6（例5）｜2022 福建 · 柔性电子技术（三并列＋主题词）\n\n**【题干原文】**（帧 f_0324 逐字抄录）\n> 沙发、台灯、水杯、音箱、灯罩、咖啡壶……生活中充斥着大量\"非规则平面\"物体，它们中的一些未来可能会智能化，其智能化后的人机交互不再是通过一块平面屏幕，而是会实现物体本身可感知、可______、可对话，而要做到这一点，柔性电子技术______。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0324）\n> A. 显示　大有可为（指事情很有发展前途，很值得做）\n> B. 触摸　迫在眉睫（形容事情临近眼前，非常紧迫）\n> C. 输出　永无止境（指永远没有尽头）\n> D. 操控　前途无量（指一个人的未来发展不可限量）\n\n**【答案】** ✅ A（帧 f_0347 板书\"主题 → 显示\"并写大\"A\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 选突破口 | \"可感知、可____、可对话\"是三并列 → 别死磕，**先看第二空** | \"而要做到这一点\"——要实现这些功能，柔性电子技术很可能做到 → 柔性电子屏在未来智能化场景中很有用 → **大有可为** |\n| 2 排除 B | 迫在眉睫重点在**紧迫性** | \"未来可能会智能化，有那么着急吗？可能是十年、二十年，没说你得抓紧时间\" |\n| 3 排除 C | 永无止境一般要**接一个动作** | \"你得说'这个技术的发展''技术的创新'永无止境，不能说这个技术永无止境\" |\n| 4 比较 D | 前途无量意思上没问题，但**使用上形容人更多** | \"我不是说 D 一定不行，而是它从使用概率来讲还是人更多一些——你有麦当劳了，何必华莱士呢\" |\n| 5 回第一空 | 抓文段**主题词：屏幕** | 屏幕最本质的特征是**能显示**（能看）——\"显示\"点出了屏幕最根本的特点 |\n\n**【逐项解析】**\n- **A 项**：✅ 显示＋大有可为。\n- **B 项**：触摸＋迫在眉睫——紧迫感无中生有，排掉。\n- **C 项**：输出＋永无止境——搭配不当，排掉。\n- **D 项**：操控＋前途无量——\"前途无量\"多形容人，有更好的\"大有可为\"，排掉。\n\n**【本题要点】**\n> ⭐ 三并列\"可感知、可显示、可对话\"看似是考点，**其实出题人考的是主题词**。\"这个出题人看似给了你两个顿号，但其实他考的根本就不是这玩意儿。\"\n> ⭐ **屏幕的本质是\"能显示\"（能看）**：\"像我面前那个电视，它是显示屏、是个屏幕，但它只能看、不能摸。能看是屏幕的本质。能触摸那是后来的高级屏幕——你回去问问你爸妈，当年诺基亚能触摸吗？小灵通能触摸吗？\"（老师还在课上展示了柔性屏图片：未来的电视车机、中控可能全变成一个可以显示画面的屏幕。）\n> ⭐ 这是\"**逻辑填空题中心理解化**\"的先声——优选和文段主题相关的选项（明天第十讲的主题）。\n\n### 例题7（例6）｜2022 江苏 · 城区与郊区（三并列＋解释说明反推）\n\n**【题干原文】**（帧 f_0374 逐字抄录）\n> 以都市圈视角来看，超大城市的城区和郊区应该互相______、互相补充并______：\n> 城区是超大集聚，郊区则应该是中型或小型集聚；\n> 城区是尽显______的超级都市，郊区则是各具特色的市镇体系和生态田园；\n> 城区是高容积率高密度的，郊区则是相对低容积率和低密度的。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0374）\n> A. 提携（牵扶;携带；照顾;扶植；提拔）　　　　美美与共　气势\n> B. 呼应（彼此关联、照应）　　　　　　　　　　融为一体　实力\n> C. 错位（离开原来的或应有的位置，置于此处表达两者错开）　相得益彰　魅力\n> D. 借鉴（把别的人或事当镜子，对照自己，以便吸取经验或教训）　珠联璧合　优势\n\n**【答案】** ✅ C（帧 f_0374 \"错位\"\"相得益彰\"高亮）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"互相____、互相补充并____\" → 三并列 | 但只给定了一个词\"互相补充\"，第一、二空与\"补充\"是近是反**无从判断** |\n| 2 换思路 | 后文整段都在干什么？ | 都在**解释说明**：\"城区是超大集聚，郊区是中型或小型集聚；城区是超级都市，郊区是市镇体系和生态田园；城区是高容积率高密度，郊区是低容积率低密度\" |\n| 3 反推 | 观点＋解释说明 → 根据解释内容反推观点（和中心理解题一毛一样） | \"你是大的我是小的、你是高的我是低的、你是超级的我是田园的——我们**不一样**\" |\n| 4 排除 | 填\"提携\"\"借鉴\"就变一样了 | \"一提携把你往上一提，不跟我一样了吗？我去借鉴你、学你的，咱俩不就一样了吗？肯定不能一样呀\" → A、D 排掉 |\n| 5 第二空 | 剩\"融为一体\"与\"相得益彰\" | \"你如果融为一体了，还叫你是大的我是小的吗？不就没区别了吗？→ **相得益彰**：可以分开，但是在一起会显得更好\" |\n| 6 第三空 | 气势/实力/魅力/优势 | 形容超级都市都可以，**第三空不是解题要点** |\n\n**【逐项解析】**\n- **A 项**：提携——提携、扶植意味着\"把你往上一提\"，与\"不一样\"矛盾，排掉。\n- **B 项**：呼应——\"这个词纯粹不好排，没有什么特别不顺眼的地方\"，但\"融为一体\"与\"城区郊区保持差异\"矛盾，排掉。\n- **C 项**：✅ 错位＋相得益彰——\"错位\"就是互相错开，\"你走你的阳关道，我走我的独木桥\"；填回去验证：\"互相错位、互相补充并相得益彰\"——三并列大方向一致（都是说两个不太一样的东西能够互相配合），所以才能一起解释前文。\n- **D 项**：借鉴——借鉴意味着\"我学你\"，会变一样，排掉。\n\n**【本题要点】**\n> ⭐ 逻辑填空与中心理解相通：**观点＋解释说明，根据解释说明的内容反推观点**。\n> ⭐ 积累：\"**错位发展**\"——咱俩不是一个赛道的（例：我是言语老师，他是数学老师，我们俩就是错位的）。老师还展示了人民网报道《天津市静海区：发挥特色优势 统筹错位发展——找准定位 突出特色 有效分工 错位发展，打造\"三级一带一区\"区域协调发展新格局》（2023-08-27，来源：海南日报）佐证\"错位发展\"是官方热词。\n> ⭐ 老师 extends：美美与共、珠联璧合\"至少比'融为一体'好\"，因为答案必须体现\"区别\"。\n\n### 例题8（例7）｜2020 国考 · 测谎仪（\"且\"字表不同）\n\n**【题干原文】**（帧 f_0399 逐字抄录）\n> 测谎的基本原理是：欺骗的人会紧张，以致呼吸、脉搏加快和血压升高。测谎专家因此而声称，只要操作、解析得当，测谎仪能够有效发现说谎者，结果是______的。反对者则认为，一个______且擅长控制情绪的人是可以对付测谎仪的。在这个过程中，不是人与机器，而是测谎者与被测者的______。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0399）\n> A. 合理　见多识广（阅历深，经验多，知识广博）　　博弈\n> B. 可靠　有备而来（事先有准备而前来）　　　　　较量\n> C. 科学　不露声色（心里的打算不在说话和脸色上显露出来）　抗衡\n> D. 准确　从容不迫（不慌不忙，非常镇定）　　　　对决\n\n**【答案】** ✅ B（帧 f_0430 \"有备而来\"高亮）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 形容\"结果\"：\"只要操作、解析得当，能够有效发现说谎者\" → 结果具有一定正确性、可以相信 | 可靠／科学／准确都行；**\"合理\"不行** |\n| 2 为什么\"合理\"不行 | \"合理\"体现不出测谎仪的能力 | \"你不管测谎仪出来什么结果（说谎／没说谎），某种意义上都是合理的。它一定强调的是这个结果是**我可以相信的、有道理的**，而不是结果的合理性\" |\n| 3 第二空 | 抓\"**且**\"字 → 或且并表**不同** | 后面是\"擅长控制情绪\"，横线就不能再填\"不露声色／从容不迫\"（那就是重复了） |\n| 4 定答案 | 能对付测谎仪要两个条件，缺一不可 | ①确实擅长控制情绪的能力；②**知道你在测我的谎**（有防备）→ \"**有备而来**\" |\n\n**【逐项解析】**\n- **A 项**：合理——体现不出测谎仪\"解析得当、可信\"的能力，排掉；见多识广与\"对付测谎仪\"无关。\n- **B 项**：✅ 可靠＋有备而来——\"我知道你在测我的谎，我有了防备；一方面有防备，另一方面又有能力，才能应付测谎仪。\"\n- **C 项**：不露声色——与\"擅长控制情绪\"语义重复（且表不同），排掉。\n- **D 项**：从容不迫——同上，与\"擅长控制情绪\"重复，排掉。\n- **第三空**：博弈／较量／抗衡／对决意思差不多，**不好做、对解题没帮助**——\"空比较多的时候怎么处理，我们会在第十一节课讲到\"。\n\n**【本题要点】**\n> ⭐ \"或、且、并\"引导的并列**一定表不同、不能重复**——\"且\"后面是\"擅长控制情绪\"，横线就要换一个角度。\n> ⭐ 对付测谎仪的两个条件（缺一不可）：①有控制情绪的能力；②知道自己在被测谎。就像做题：①知道是什么题型，②有能力做这个题型，题才能做出来。\n\n### 例题9（例8）｜2021 国考 · 盐与人类文明（\"并\"引导的两方面并列）\n\n**【题干原文】**（帧 f_0435 逐字抄录）\n> 现代社会获取盐分轻而易举，以至于人们认为吃盐是______的事情。而事实上，由于地理上的分布不均以及交通不畅等原因，其在古代一直都属于______之物。在人类历史的绝大部分时间里，人们都在寻找盐，甚至令盐业成为了历史上第一个由国家垄断的产业。可以说，盐贯穿着整个人类历史，并在人类文明的发展中起到了______的作用。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0459）\n> A. 稀松平常　必需　举足轻重（身份或地位特殊，一举一动足以影响全局）\n> B. 理所当然　稀缺　至关重要（对于某人或某事起着关键性作用）\n> C. 天经地义　关键　承上启下（承接上面的，引出下面的内容）\n> D. 手到擒来　珍贵　一以贯之（按照一个道理，从始至终都不会改变）\n\n**【答案】** ✅ B（帧 f_0459 \"至关重要\"圈出）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 因果关系：\"获取盐分轻而易举，以至于认为吃盐是______的\" | 稀松平常／理所当然／天经地义／手到擒来都可以（\"天经地义\"也行：比如我家姑娘觉得到饭点饭就从桌上长出来，是天经地义的——不是因为它太简单，而是\"人就应该能吃到盐\"） |\n| 2 第二空 | \"而事实上\"表转折；\"分布不均、交通不畅\" → 古代获得盐很难 | 要填出**难、稀缺、珍贵**的意思 → 保留 B（稀缺）、D（珍贵）；\"必需／关键\"跟难不难无关——\"人能离开水吗？能离开空气吗？但水和空气在古代并不稀缺\" |\n| 3 第三空 | 抓\"**并**\"字！ | \"并\"在\"人类文明的发展中起到了______作用\"——**\"并\"引导两方面的并列关系（表不同）**：既然已经有\"贯穿\"了，还能填\"贯\"吗？\"一以贯之不就是从始至终贯穿的意思吗？\"→ 换一个词 → **至关重要**（你不仅贯穿历史，而且非常重要） |\n\n**【逐项解析】**\n- **A 项**：必需——体现不出\"古代获得盐难\"；举足轻重尚可但前两空不行。\n- **B 项**：✅ 理所当然＋稀缺＋至关重要——三空全对。\n- **C 项**：关键——同 A，体现不出\"难\"；承上启下（承接上面的引出下面的）与\"作用\"对象不符。\n- **D 项**：珍贵——可以，但\"**一以贯之**\"与\"贯穿\"重复，被\"并\"字排除。\n\n**【本题要点】**\n> ⭐ \"很多同学看到'贯穿'就说'老师，我看到贯穿我就直接一以贯之了'——现在知道为什么不选一以贯之了：因为它前面有个'**并**'字，'并'引导两方面的并列，要引导不同点。\"\n> ⭐ 搭配澄清：\"一以贯之并不是只能搭配制度。比如'对于老师的话应该一以贯之的执行'——它就是**不改变、从一而终**的意思，搭配制度确实多，但不是只能搭配制度。\"\n> ⭐ 优先级：\"如果你把'并'去掉，就有点像昨天讲的'句内呼应'了，有一定道理。但是**有病（关联词）就要优先看病，关联词的作用更加明显一些**。\"\n\n---\n\n## 六、并列中的局部与整体（本讲最重要的思想）\n\n> ⭐ **\"几乎所有关于并列的难题，都是从这个角度出来的。\"** \"出简单题，可能就像我们第一题到第三题那样出，比较简单；出难一点的话，它一定会这样出——**并列中的局部与整体：你不能只看局部，你要带着整体的感觉去看局部**，就跟我们中心理解题一样。\"\n\n### 6.1 思想导入：不要断章取义\n\n> \"语言就是灵活的。你同样一个东西，在不同文段意思就是不一样。他就是对咱们不能断章取义——要根据文段、根据材料来。第二个一定要尽量做到：局部结合整体，你不能只盯着这一亩三分地，你得看多一点。\"\n\n老师用一个\"**倾向性**\"的概念例说明\"看似给了线索，光抓顿号却做不出来\"：\n\n| 语境例句 | \"倾向性\"在这句话里的近义 | 为什么 |\n| --- | --- | --- |\n| 当年高中大家都**倾向于选理科** | **普遍性**（大部分人都想选） | 倾向＝大势所趋、多数 |\n| 这个问题具有**倾向性**（值得关注） | **关键** | 倾向＝重要、要紧 |\n| 他有**考公的倾向** | **苗头** | 倾向＝刚露头、初兆 |\n| 对待部队建设中带有**倾向性**的问题（动辄要求全部清除、一律禁止、乱打板子） | **普遍**（大家都犯了这样的错） | \"全部、一律\"→大家都这样，与\"关键\"无关 |\n| 抓早抓小、防微杜渐、要有预警机制、监测干部、及时提醒、关口前移 | **苗头** | 强调在\"刚露头\"时干预 |\n\n> \"同样一个'倾向性'，a 普遍、b 关键、c 苗头——你感觉都能说得通。这就是难题：看似给了你答案、给了你线索，但你光抓顿号做不出来，**一定要给你完整的文段**。\"\n\n老师顺势回顾**中心理解题讲\"尾句\"时说过的一个例子**：\n\n> \"哪怕你知道尾句是重点，有的时候你也得结合上下文。比如我说'张老师，你真是太厉害了'——那什么意思？他可能在夸你，也可能在阴阳怪气。同样一句话，可能有不同的解释。\"\n\n### 6.2 PPT 上的\"倾向性\"示例（板书逐字，帧 f_0468 / f_0491~f_0502）\n\n第一屏（帧 f_0468）只给了一个光秃秃的句子与三个近义选项：\n\n```\n（3）并列中的\"局部\"与\"整体\"\n\n倾向性、______\nA 普遍性        B 关键性        C 苗头性\n```\n\n> \"我要找一个词的近义词，它给了一个倾向性——那你说这个时候近义词应该选谁呀？大家觉得答案选谁？\"\n> （同学答 B、C）\"**选 A 的同学一个都没有**……大家有没有想起老师在讲（中心理解）尾句的时候讲过的一个例子？\"\n\n第二屏（帧 f_0491 / f_0493 / f_0498 / f_0500）给出**两道真实考题**作为对照，PPT 原文逐字抄录：\n\n> **（2022 天津）**若对待部队建设中带有**倾向性**、______的问题，动辄要求\"**全部清除**\"、\"**一律禁止**\"，甚至\"**乱打板子**\"，不仅很难达到目的，还会导致问题累积、矛盾升级。（普遍性/关键性）\n>\n> **（中国组织人事报）**坚持抓早抓小、防微杜渐，健全常态化预警机制，推动干部监督关口前移。综合运用各类监督成果，多角度、经常性监测领导干部的______、**倾向性**问题，及时进行提醒、函询、诫勉。（普遍性/苗头性）\n>\n> 从近年考查趋势来看：①看清楚并列类型；②一定要做到\"局部\"结合\"整体\"——**遇到并列不要急，结合前后看仔细**\n\n| 例题 | 题干给出的\"局部\"线索 | 决定答案的\"整体\"线索 | 答案 |\n| --- | --- | --- | --- |\n| 2022 天津 | 顿号并列：\"倾向性、______\" | 动辄要求\"**全部清除**\"\"**一律禁止**\"\"乱打板子\"→ 大家都犯了这样的错 | **普遍性** |\n| 中国组织人事报 | 顿号并列：\"______、倾向性问题\" | 抓早抓小、防微杜渐、预警机制、监测干部、及时提醒、**关口前移** → 在\"刚露头\"时干预 | **苗头性** |\n\n> ⭐ \"你看全部清除、一律禁止——大家都犯了这样错误，那不就是**普遍**吗？这个时候跟'关键'就没什么关系了。\"\n> ⭐ \"那别人说的是抓早抓小、防微杜渐、要有预警机制、要监测干部、要及时提醒、关口前移——那就指的是**苗头**。\"\n> ⭐ 有同学问：\"老师，我之前做过一道题，倾向性的近义词不是普遍吗？怎么换了个题就不是普遍了呢？\"\n> 　老师答：**\"语言就是灵活的。同样一个东西在不同文段意思就是不一样——对咱们，就是不能断章取义，一定要根据文段、根据材料来。\"**\n\n---\n\n### 例题10（例9）｜2025 国考 · 保持历史耐心（局部看整体）\n\n**【题干原文】**（帧 f_0505 / f_0512 逐字抄录）\n\n> 我们想问题、作决策、办事情，首先要考虑人口基数问题，考虑我国城乡区域发展水平差异大等实际，既不能______，也不能因循守旧，要保持历史耐心，坚持稳中求进、循序渐进、持续推进。\n> 填入画横线部分最恰当的一项是：\n\n> 说明：本题**只有一个空**，后半句\"也不能因循守旧\"是题干已经给出的文字（老师在其上方板书\"**不变**\"，在横线上方板书\"**变**\"）。\n\n**【选项原文】**（含 PPT 注释，帧 f_0512）\n\n> A. 朝令夕改（形容主张或办法经常改变，一会儿一个样）\n> B. 寅吃卯粮（比喻入不敷出，预先支用未来的收入）\n> C. 好高骛远（脱离实际去追求过高的、难以实现的目标）\n> D. 一厢情愿（办事时不考虑客观实际情况，全从主观意愿出发）\n\n**【答案】** ✅ C\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"既不能……也不能……\" → 反义并列，表**相反** | 横线处要与\"因循守旧\"相反 |\n| 2 解给定词 | 因循守旧＝**不变**、没有追求 | 那横线就要有\"**变**\"、有\"追求\"的意思 |\n| 3 按局部排两项 | 朝令夕改有\"变\"，好高骛远有\"追求\" | A、C 都沾边；B 寅吃卯粮是\"预先借支\"，D 一厢情愿是\"不考虑实际\"，**与\"求新求变\"关系没那么大** → 排 B、D |\n| 4 只往后看的陷阱 | 只看\"要保持历史耐心\" | \"老师，保持耐心不就是你不要天天改吗？\" → **很容易选 A** |\n| 5 往前看（整体） | 句首：\"要考虑人口基数问题，考虑我国城乡区域发展水平差异大等实际\" | 意思是**中国太大**——问题太多、人太多、地域太广 |\n| 6 定整体义 | 面对这么大的国情，就不能一口气吃个大胖子 | \"要谨慎一些，但**谨慎也不能不做**\" → 不能好高骛远，也不能因循守旧 |\n\n> 板书（帧 f_0505）：在\"因循守旧\"上方写\"**不变**\"，在横线下方用箭头写\"**变**\"，即横线处要表达\"**变 / 求新**\"的意思。\n\n**【逐项解析】**\n- **A 项**：朝令夕改——确实有\"变\"的意思，只盯\"变↔不变\"的局部看似完美（\"天天变\"对\"啥也不变\"，天生一对），但**与\"国家大、决策要稳、要保持历史耐心\"毫无关系**，排掉。\n- **B 项**：寅吃卯粮——预先支用未来的收入，与\"求新求变\"关系没那么大，排掉。\n- **C 项**：✅ 好高骛远——\"不能好高骛远\"＝做改变可以，但不能太飘、不能丢弃实际、**不能想着一步到位**；与后文\"循序渐进、持续推进\"完全呼应。\n- **D 项**：一厢情愿——不考虑客观实际情况，同样与\"变/求新\"关系不大，排掉。\n\n**【本题要点】**\n> ⭐ **\"既不能也不能\"是要往前看的，不能白讲给你。** 真正的定调句是句首\"考虑人口基数／城乡区域发展水平差异大等实际\"和结尾\"保持历史耐心\"。\n> ⭐ 正确理解是：**不能因循守旧＝要改、要变；不能好高骛远＝改可以，但步子不能太大、不能太飘。**\n> ⭐ 好高骛远是**贬义词**（形容人飘了：\"我刚毕业，期望薪资嘛，年薪一个亿吧\"）。老师补充：**这个句子在 2023 年国考题原文当中也考过一次。**\n> ⭐ 有同学问\"好高骛远是褒义还是贬义\"——老师答：\"**当然是贬义词**，形容这个人飘了。\"\n\n---\n\n### 例题11（例10）｜2024 深圳 · 刀刃向内（相同句式表并列）\n\n**【题干原文】**（帧 f_0530 逐字抄录）\n\n> 将下列选项中的词语填入句子横线处，最恰当的一项是（　）。\n> 每一位党员干部都应该有刀刃向内的勇气，正视自己的缺点和错误并加以改正，不______，不文过饰非。\n\n**【选项原文】**（含 PPT 注释，帧 f_0530）\n\n> A. 隐恶扬善（隐瞒他人的坏处，而表扬他人的好处）\n> B. 掩耳盗铃（比喻自己欺骗自己，明明是掩盖不住的事情偏要想法子掩盖）\n> C. 沽名钓誉（故意矫情做作，用手段猎取名声或赞誉）\n> D. 掩人耳目（捂住别人的耳朵，遮住别人的眼睛，比喻以假象蒙骗别人）\n\n**【答案】** ✅ B（帧 f_0549 老师圈\"掩耳盗铃\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"不______，不文过饰非\" → 相同句式、同一并列 | 横线要与\"文过饰非\"构成近义并列 |\n| 2 解\"文过饰非\" | **\"文\"通\"纹\"**，是动词：用花纹（装饰）去掩饰 → **\"文过饰非\"＝掩饰自己的过失和错误** | 抓住核心义：**隐藏** |\n| 3 用\"隐藏\"粗排 | 谁没有\"隐藏\"义 | 沽名钓誉（猎取名声赞誉）跟隐瞒毫无关系 → 排 C |\n| 4 看 A 的毛病 | 隐恶扬善虽有一个\"隐\"字，却多了\"**扬善**\" | 文段只想强调\"自己的错误\"，哪来的\"善\"可扬？→ **画蛇添足、无中生有**，排 A |\n| 5 剩 B、D 辨微差 | 都是\"欺骗、隐藏\" | 掩耳盗铃＝**捂住自己的耳朵**，自己听不到 → **自己骗自己**；掩人耳目＝**遮住别人的眼睛**，让别人看不到 → 骗别人 |\n| 6 抓整体主语 | 文段开头写的是\"**刀刃向内**\"——拿自己开刀，正视的是**自己的缺点** | 谁骗谁？自己骗自己 → **B** |\n\n**【逐项解析】**\n- **A 项**：隐恶扬善——\"你只有'隐'就好了，但你在'隐'的前提下多了一个'扬善'\"，文段只有\"过与非\"，**哪儿来的善**？\n- **B 项**：✅ 掩耳盗铃——自己把耳朵捂住去偷铃铛，**是自己听不到＝自己骗自己**，正合\"刀刃向内、正视自己的缺点和错误\"。\n- **C 项**：沽名钓誉——故意矫情做作、用手段猎取名声或赞誉，**没有强调\"隐藏\"的意思**，排掉。\n- **D 项**：掩人耳目——侧重\"不让别人发现／蒙骗别人\"，而文段主语是党员拿自己开刀，是**自己骗自己**，故不如 B 贴切。\n\n**【本题要点】**\n> ⭐ 老师原话：\"**光抓'文过饰非'，你可能感觉好像也可以；但你抓住'刀刃向内'，是自己的缺点、自己的，那就是自己骗自己——掩耳盗铃。**\"\n> ⭐ 相同句式表并列时，横线一定与相邻的那句话同义；但最终定答案，还要看**局部（并列词）＋整体（主语句）**。\n\n---\n\n### 例题12（例11）｜2024 国考 · 守正创新（逻辑填空中心理解化）\n\n> 老师原话：\"**二〇二四国考，是在我心中近七八年以来最难的一套题。**\"（板书在题目上方写\"**2020 - 2026**\"）\"这两年（2023、2024）是最难的两年，而 **2024 又是我认为最难的一年**，就因为很多这样的题目看似给了你非常明显的线索，但你如果只看一个，很容易理解有问题。\"\n\n**【题干原文】**（帧 f_0557 / f_0562 / f_0585 逐字抄录）\n\n> 守正是创新的前提，创新是守正的路径。守正不是______、循规蹈矩，而是守住本源、根和魂；创新也不是凭空幻想、______，而是在把握事物发展规律的基础上充分发挥主观能动性。只有守正，才能恪守正道、______；只有创新，才能与时俱进、推陈出新。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（含 PPT 注释，帧 f_0577 第一列释义、f_0585 第三列释义）\n\n> A. 陈陈相因（沿袭老一套，无创造革新）　纸上谈兵　正本清源（从根源上加以整顿清理）\n> B. 抱残守缺（思想守旧，不肯接受新事物）　天马行空　返璞归真（除去外饰，恢复原来的质朴状态）\n> C. 食古不化（不能按现在情况理解运用旧知识）　向壁虚造　拨乱反正（治理混乱的局面，使其恢复正常）\n> D. 墨守成规（思想保守，守着老规矩不肯改变）　恣意妄为　固本强基（加固本体，强化基础）\n\n**【答案】** ✅ D（帧 f_0622 老师圈\"固本强基\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓观点句 | 首句\"**守正是创新的前提，创新是守正的路径**\"是全文的**观点**（老师在此句下划红线并板书\"观点\"） | 后文都是对这句话的展开 |\n| 2 预判后文 | \"你先不要看后文——我讲完这句话之后，后面会怎么解释？\" | 后文一定是**反着说**：\"我守正不是不创新，我创新也不是不守正\" |\n| 3 第一空 | 后文第一句（守正不是____、循规蹈矩，而是守住本源、根和魂）＝\"**守正不是不创新**\" | 第一空＝**不创新**（A 陈陈相因、B 抱残守缺、C 食古不化、D 墨守成规**四个词都是\"不创新\"的意思**）→ 第一空不好做、不是决定项 |\n| 4 第二空的两个局部线索 | ①有顿号 → 与\"凭空幻想\"构成**近义并列**；②有\"不是……而是……\" → 与\"把握事物发展规律\"构成**反义并列** | 单看局部，纸上谈兵／天马行空／向壁虚造**都比\"恣意妄为\"贴合得多**（\"凭空幻想\"给人的感觉就是空、假大空、不扎实） |\n| 5 第二空的整体线索 | 第二句（创新也不是凭空幻想、____，而是…发挥主观能动性）＝\"**创新也不是不守正**\" | 第二空＝**不守正**；\"**妄就是乱**\"，乱＝不正 → **恣意妄为** |\n| 6 第三空（老师说是它给的仁慈线索） | \"只有守正，才能恪守正道、______\"后面直接是分号，**没有别的线索** | 恪守正道＝**我还没丢** → 只需要\"守住\" → **固本强基** |\n| 7 反推排除 | 清源／返璞／拨乱都要有前提 | 正本清源的前提是**已被污染**；返璞归真的前提是**已经变了**；拨乱反正的前提是**已经乱了**——文段只说\"守住\"，什么都还没丢 |\n\n> 板书（帧 f_0562 / f_0585 / f_0622）：在\"守正是创新的前提，创新是守正的路径\"上写\"**观点**\"；句中右侧写\"（**守正是需要创新的**）\"\"（**创新是需要守正的**）\"；题干上方写\"**2020 - 2026**\"\"**反**\"\"**不是**\"；右侧写\"**逻辑填空题中心理解化**\"。\n\n**【逐项解析】**\n- **A 项**：陈陈相因（沿袭老一套）——第一空说得通（都指\"不创新\"），但第二空\"纸上谈兵\"与第三空\"正本清源\"都不符；尤其\"正本清源\"要求\"已经被污染\"，而文段只说\"守住\"。\n- **B 项**：抱残守缺（思想守旧）——同上，第二空\"天马行空\"（形容才思豪放、不受约束）与\"不守正\"不符，第三空\"返璞归真\"要求\"已经变了\"。\n- **C 项**：食古不化（不能按现在情况理解运用旧知识）——同上，第二空\"向壁虚造\"、第三空\"拨乱反正\"均不符。\n- **D 项**：✅ 墨守成规＋恣意妄为＋固本强基——第一空\"不创新\"，第二空\"不守正（妄＝乱＝不正）\"，第三空\"守住即可\"，三空全通。\n\n**【本题要点】**\n> ⭐ **这道题表面上考并列（顿号），实际上第一空和第二空都不是靠并列做出来的，而是靠首句的观点句\"中心理解化\"做出来的。**\n> ⭐ \"**妄就是乱的意思**——恣意妄为的乱就是不正，就是没有守正。所以第一空体现的是你没有创新，第二空体现的是你没有守正，这就是守正加创新。\"\n> ⭐ \"难题的感觉就是：**你说你想不到，但一定有人想得到。**\"\n> ⭐ \"明天（第十讲）我会详细讲，这种题是一个大的趋势——**逻辑填空题中心理解化**。\"\n> ⭐ \"当你发现只看局部不好做的时候，别的地方不是黑的——**你可以重点看这儿，但你不能说别的地方就不看。**\"\n\n---\n\n### 例题13（例12）｜2024 深圳 · \"精专\"读书法（近义并列＋整体）\n\n**【题干原文】**（帧 f_0630 / f_0640 / f_0645 逐字抄录）\n\n> 将下列选项中的词语依次填入句子横线处，最恰当的一组是（　）。\n> \"精专\"读书法，并不是让我们穿凿附会、______，那样只会\"拘泥于章句而疏忽于会意，活脱书橱也\"。而是提倡一种______、苦心孤诣的读书态度。读书就像品茗，虽然茶水的颜色和飘逸的茶香较易辨认，但茶中三味，却要细细品之才能体会得来。\n\n**【选项原文】**（帧 f_0630）\n\n> A. 咬文嚼字　去粗取精（去掉粗糙，取其精华）\n> B. 咬文嚼字　去伪存真\n> C. 雕章琢句　去粗取精\n> D. 雕章琢句　去伪存真\n\nPPT 下方词语注释（帧 f_0640 / f_0645 逐字）：\n> **穿凿附会**：把讲不通的或不相干的道理、事情硬扯在一起进行解释\n> **苦心孤诣**：煞费苦心地钻研，到了别人所达不到的至高境界\n\n**【答案】** ✅ A（帧 f_0645 老师板书大\"A\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 认标志 | \"穿凿附会、______\" → 顿号，**近义并列** | 横线要与\"穿凿附会\"同义 |\n| 2 解\"穿凿附会\" | 就是**硬扯、强行解释、一点一点去抠**，偏**贬义** | 横线也应是贬义 |\n| 3 比词性色彩排 CD | \"**雕章琢句**\"偏**积极**——\"玉不琢不成器\"，一看这个\"琢\"字就知道 | 雕章琢句形容**作者写文章**；咬文嚼字形容**读者读书** → 本题是\"读书法\"，**C、D 排掉** |\n| 4 第二空的困惑 | \"提倡一种______、苦心孤诣的读书态度\"——\"苦心孤诣\"＝**苦心钻研、达到别人达不到的造诣（水平高）** | \"乍一看跟这个苦心孤诣都没什么关系\"，顿号这次也帮不上忙 |\n| 5 回头抓整体 | **开篇五个字——\"'精专'读书法\"** | \"其实这个文段开篇五个字就已经把答案送给你了\"：既然是\"精专\"，就要**读精、读细** |\n| 6 定第二空 | 去粗取精 vs 去伪存真 | \"既然是精专读书法，**跟真假没什么关系**，要读精、要读得更加细致一些，所以去粗取精\" → A |\n\n**【逐项解析】**\n- **A 项**：✅ 咬文嚼字＋去粗取精——咬文嚼字与\"穿凿附会\"同为贬义、语义相近；\"精专\"对应\"去粗取精\"（后文\"细细品之\"也照应）。\n- **B 项**：咬文嚼字可以，但\"去伪存真\"讲的是**真假**，与\"精专\"无关。\n- **C 项**：雕章琢句偏积极（形容作者写文章），与\"穿凿附会\"的贬义色彩不符。\n- **D 项**：两个毛病都有。\n\n**【本题要点】**\n> ⭐ \"**第一句'精专读书法'，第一个空来到'咬文嚼字'——它形容读者；'雕章琢句'形容作者写文章。既然是'精专读书法'，所以不能选 C、D。**\"\n> ⭐ \"**你其实很多时候，虽然给了你（顿号），你也得看；但当你发现只看这个地方有点不好做的时候，就一定要……或者说你做任何题目，不是说你眼中只有这个地方，别的地方是黑的——你整个文段都得看。**\"\n> ⭐ \"**一定要带着整个文段的感觉去看局部。**\"\n\n---\n\n### 例题14｜课后答疑补充题① · 相声（2026/02/06 答疑）\n\n> 来源：课后答疑区学员提问（答疑表截图，帧 f_0690 / f_0712，序号栏显示\"4\"）\n> **学员问题**：\"老师昨天听了逻辑填空很有收获，特别是记住了跟五官有关的多半用于人，这题在 a c 里纠结感觉都可以，想到那个点就选了 a，答案是 c，但是我看了解析说发人深省程度太轻有点说服不了我，题目如下：\"\n> **老师回复**：\"答案是 a 呀？这个题我之前还录过单题。不过我的重点是，觉得'停留'这个词挺得好。\"\n\n**【题干原文】**（帧 f_0690 / f_0712）\n\n> 导致眼前相声难出精品的核心问题，是艺术观念和审美把握的错位，一些表演仅仅______在逗笑娱乐的浅表层面，缺乏相声应有的审美智慧和______的思想力量。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**（帧 f_0690 / f_0718）\n\n> A. 停留　振聋发聩\n> B. 流连　鞭辟入里\n> C. 徘徊　发人深省\n> D. 局限　义正辞严\n\n**【答案】** ✅ A（老师在答疑回复中确认\"答案是 a 呀\"；帧 f_0718 板书画圈\"停留\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 先干掉 D | \"**义正辞严**\"的\"严\"是严肃，它**只能形容\"说法／言辞\"**，不能形容\"思想力量\" | '\"你不能说我的思想义正辞严'，这个搭配是非常离谱的\" → 排 D |\n| 2 第二空区分度不大 | 振聋发聩、鞭辟入里、发人深省**都给人\"很深刻\"的感觉** | 第二空不是解题要点，关键在第一空 |\n| 3 比\"停留\"与\"流连／徘徊\" | 流连＝流连忘返；徘徊＝\"徘徊过多少橱窗\"——都带**犹豫、拿不定、舍不得走**的感觉 | \"比如之前村长说'要不你来上村吧'，我就有点徘徊、有点流连——就是我来不来呢？还得思考思考\" |\n| 4 看文段整体 | \"核心问题是观念和审美的**错位**\"\"**缺乏**相声应有的审美智慧\" | 说明他\"**压根儿就没想通往**审美智慧和好的思想力量\"，他就想待在浅显的逗笑娱乐的表面当中，**他没有想走** |\n| 5 定答案 | \"停留\"给人的感觉更加**笃定**——\"我就停在这儿了，我已经决定好了\" | 没有犹豫 → **A** |\n\n**【逐项解析】**\n- **A 项**：✅ 停留＋振聋发聩——\"停留\"＝笃定地待在这儿，符合\"错位、缺乏、压根没想走\"；\"振聋发聩\"表示深刻。\n- **B 项**：流连——带\"舍不得走、犹豫\"的意思，与文段的\"笃定\"不符。\n- **C 项**：徘徊——同样是犹豫、纠结的意思，不符。\n- **D 项**：局限＋义正辞严——\"义正辞严\"**不能形容\"思想力量\"，只能形容说法／言辞**，搭配离谱。\n\n**【本题要点】**\n> ⭐ \"**你要先知道这些词代表这种意思是什么**\"——\"停留\"是笃定，\"流连／徘徊\"是犹豫。\n> ⭐ 老师提醒学员：\"这题在 a c 里纠结……答案是 a 呀\"，并强调**本题的重点是\"停留\"这个词用得好**。\n\n---\n\n### 例题15｜课后答疑补充题② · 2026 国考标题题（城镇化与基层治理）\n\n> 来源：课后答疑区学员提问（答疑表截图，帧 f_0720 / f_0756，序号栏显示\"1\"，学员\"双曜0301\"，2026/02/06）\n> **学员问题**：\"老师，可以麻烦看一下这两道题吗？\"\n> **老师回复**（截图原文）：\"第一个题，那个不切实际的幻想有点无中生有，第二题，ab 不太好说，我其实也做错了，不过你结合我讲的注意首句提示，其实讲的是城市治理的话题，可以选到 A。\"\n> 老师课上补充：\"这个题大家如果做过 2026 年的国考题，对这个题一定印象深刻……这道题出出来之后，我在小红书看到很多同学讨论，大家就在 a b 纠结。**这个题正确率比较低，大概只有 36% 吧。**\"\n\n**【题干原文】**（帧 f_0720 / f_0756 逐字抄录）\n\n> 随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间。要实现智慧城市的发展目标，必须紧跟新一代数字技术发展趋势，找准数字技术融入市域社会治理的\"小切口\"，促进两者深度融合。可建设区、街、社（村）三层结构的数智化基层治理平台，覆盖社区治理全域组织工作场景，有效破解基层治理\"小马拉大车\"的突出问题。通过建设数智化基层治理平台，加快实现市域社会管理手段、管理模式、管理理念创新，推动城市治理和运行从数字化到智能化再到智慧化的转型升级。\n> 最适合做这段文字标题的是：\n\n**【选项原文】**（帧 f_0720 / f_0756）\n\n> A. 变\"治理\"为\"智理\"，提升城市智治水平\n> B. 从\"数字\"到\"数智\"，打造基层治理平台\n> C. 数字技术：提升基层治理的新手段\n> D. 基层治理：从未梢发力向智慧升级\n\n**【答案】** ✅ A（题库答案为 A；老师坦承\"**我当时选的是 b**\"）\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 切分结构 | 老师自述的四层分类：**背景引入 → 宏观对策 → 具体对策 → 意义效果** | 见下表 |\n| 2 首句定话题 | \"**随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间**\"——首句引出的关键词是\"**智慧城市／城市／市域**\" | 全段讲的是\"谁的事\"？城市的事 |\n| 3 排除 B 的理由①（用字） | \"从'数字'到'数智'\"的\"**治**\"不对 | \"难道之前没有这个'治'吗？你如果把这个'智'改成智慧的'智'，我觉得会好很多\" |\n| 4 排除 B 的理由②（概括不全） | \"打造基层治理平台\"漏掉了\"**数字化**\" | \"你不能只提'治理平台'，你一定要提'数字化基层治理平台'\" |\n| 5 排除 B 的理由③（对象） | A 比 B **多了非常关键的一个词**——\"**城市**\" | \"提升城市的治理水平——城市有了对象词，智是智慧的意思\" |\n| 6 老师的\"完美答案\" | 把 A、B 结合：**对策＋对象** | \"把 B 的'基层治理'改成'基层智治'，再结合 A——**打造基层治理平台，提升城市智治水平**，那就是比较完美的答案\" |\n\n结构切分（老师口述板书）：\n\n```\n背景引入：随着我国城镇化率逐步提高，城市已经成为人口集聚的主要空间\n宏观对策：要实现智慧城市的发展目标，必须紧跟新一代数字技术发展趋势，\n          找准数字技术融入市域社会治理的\"小切口\"，促进两者深度融合\n具体对策：可建设区、街、社（村）三层结构的数智化基层治理平台……\n意义效果：通过建设数智化基层治理平台，加快实现……的转型升级\n```\n\n> 板书（帧 f_0756）：在首句下划红线并写\"**首句**\"；在\"数智化基层治理平台\"上画圈并写\"**数**\"\"**智**\"；题干上方写\"**2026**\"；选项旁标正确率\"**46%**\"\"**36%**\"。\n\n**【逐项解析】**\n- **A 项**：✅ 变\"治理\"为\"智理\"，提升城市智治水平——有\"城市\"这个对象词，与首句话题一致，且\"智理／智治\"呼应\"智慧城市、智慧化\"。\n- **B 项**：从\"数字\"到\"数智\"，打造基层治理平台——\"平台确实很重要\"（老师也承认\"典型的大对策小对策，我当时也选错了\"），但\"**从'数字'到'数智'**\"的用字站不住（之前也有\"治\"），且漏掉\"数字化\"\"城市\"等关键限定。\n- **C 项**：数字技术：提升基层治理的新手段——只提\"数字技术\"，覆盖面偏窄，且没有落到\"城市/智慧城市\"的核心话题。\n- **D 项**：基层治理：从未梢发力向智慧升级——同样没有对上首句的\"城市\"话题。\n\n**【本题要点】**\n> ⭐ \"**你要抓首句的提示**——第一句话干嘛了？文段在讲谁的事情呢？……所以后面所有的，包括治理也好，他都在讲**智慧城市**的事情。\"\n> ⭐ 老师自我修正：\"**老师说'背景不重要'，我没有说这句话重要——我说的是这句话它引出的这个词可能很重要。**\"（要听出首句引出的**话题词**）\n> ⭐ 老师自评：\"**这个题我也做错了，我当时选的是 b**\"——但复盘的落点仍然是首句话题与选项的对象词。\n\n---\n\n## 七、并列关系-总结（省流版）与课程预告\n\n### 7.1 PPT「（三）并列关系-总结（省流版）」思维导图（帧 f_0652 / f_0656 / f_0660 逐字抄录）\n\n```\n逻辑填空题\n├─ 思路\n│    ├─ 弄清文段与横线意思 ←——结合——→ 选项寻找合适的词语\n├─ 语境分析\n│    ├─ 句内呼应\n│    └─ 关联关系\n│         ├─ 转折（前后语义感情相反）；因果（前后有较为直接的因果关系）\n│         └─ 并列关系\n│              ├─ 并列常见考法\n│              │    ├─ ①近义并列：\"、\" \"，\" \"和\"等引导的双并列（2个词之间的并列）\n│              │    │      考法：语义相近，感情色彩相近（不一定完全一致）\n│              │    ├─ ②反义并列：\"不是…而是…\" \"多一些…少一些…\" \"既不能…也不能…\" \"要…不要…\"等\n│              │    │      考法：语义一般相反相对\n│              │    └─ ③相同句式表并列\n│              │           考法：可以相近也可以相反，视具体文段而定（观察文段整体表述感情有无变化）\n│              ├─ 其他并列考法\n│              │    ├─ ①给定两个词，填第三个词语：甲、___、丙；\n│              │    │      考法：根据给定两词的关系推断横线信息\n│              │    └─ ②或、且、并引导的并列：\n│              │           考法：语义一般不重复，只是表不同\n│              └─ 并列中的\"局部\"与\"整体\"：站在整体的视角了解局部\n└─ 词语辨析\n```\n\n页面右侧竖排红字（板书）：\"**遇到并列不要急，结合前后看仔细**\"\n\n老师逐条串讲（转写原话）：\n\n> \"转折就表相反，因果就有直接的因果关系——**这个不重要，所以没有在讲义上提**。\"\n> \"并列关系是我们考得非常非常多的关联关系，它是属于**语境分析**的部分，帮我们分析文段和横线。\"\n> \"**近义并列考得最多，大家一定要注意它——不叫重复，大家不要把它理解为重复。我看以后谁问我重复啊，我希望大家千万不要问这个问题。**\"\n> \"反义并列表相反；相同句式可以相近、可以相反。\"\n> \"给定两个词填第三个词，要根据给定的两个词去推断第三个词，**而且是不好做——三空的地方不好做，你可以尽量先看别的空**。\"\n> \"或、且、并引导的双并列，它的语义一般是**不重复**的，只是**表达不同**而已。\"\n> \"最后一个并列的局部与整体关系，**一定要尽量站在整体的视角来了解局部**——因为你只看局部，你的理解可能出现偏差；你只有站在整体上，你才能知道这个文段的作者大概在干嘛。\"\n\n### 7.2 课程预告（帧 f_0667 / f_0668）\n\n```\n课程预告（计时 2.7 / 19:38）\n\n张弓言语\"十二箭\"（十）\n逻辑填空题\n（四）逻辑填空题中心理解化\n（五）空与空的关联\n```\n\n> \"明天我们接着讲逻辑填空：第一个是**逻辑填空题的中心理解化**，第二个是**空与空的关联**。\n> 其实都是站在一个比较宏观的角度，所以老师为什么要讲这第十节呢？**主要就是破除大家之前那种思维，就是局部的思维——眼中只有一个个盆景，盲人摸象，没有形成一个整体的场景。**\"（老师举例：\"大家做过那个二四零题没有？眼中只有一个个盆景\"）\n\n---\n\n## 八、课后答疑\n\n答疑表（PPT 截图逐字，帧 f_0669 ~ f_0686；表头列为「序号 / 学员 / 时间 / 问题 / 截图 / 老师回复」）\n\n| 序号 | 学员 | 时间 | 学员问题（截图原文） | 老师回复 |\n| --- | --- | --- | --- | --- |\n| 10 | 演员黄磊 | 2026/02/05 | 我感觉学完张弓老师的课，有些题感觉信心满满选出来，一下就错了。我想表达的意思是，当你学习一套新理论，肯定吸收需要一个过程，这时候就是刷题，再听一遍，把他的方法论吃透，这要经历一个波动上升的过程。等你再开付费课啊，这样学员少一点可能有机会答疑，我最近用你的理论很哪一懵额 | **邯郸学步**——就是你的新的思维和旧的思维打架，肯定有个过渡的过程 |\n| 12 | 马华藤 | 2026/02/05 | 老师，我刷了1万道言语题，而且线下也在上辅导班，但是言语的正确率一直在75左右徘徊，判断和资料也是差不多，但是我发现一个问题，有可能大部分同学都存在这个问题，就是言语虽然刷了很多很多题，**但是每道题都像初见**，没有具体的针对性细化解题思路，请老师指教下，谢谢 | 其实如果真的刷了很多题，不至于每道题都如初见。（画面部分被人像遮挡，可见\"……一定会有熟悉的感觉\"） |\n| 5 | Chaoou_ | 2026/02/06 | 老师 中心理解非问题对策的文段 就是陈述那种类型 从首句找到主题词然后选项都有这个主题词 找不到中心句怎么办[感谢] | 很多题都是这样，那这个时候得找另外的词。找中心句的，或者找不到那就是并列，肯定有个关键的东西 |\n| 4 | （心形图标） | 2026/02/06 | （见例题14） | （见例题14） |\n| 1 | 双曜0301 | 2026/02/06 | 老师，可以麻烦看一下这两道题吗？ | （见例题15） |\n\n老师口述的完整答疑要点（转写，比截图更全）：\n\n**① \"学完课之后感觉信心满满，结果一下子就错了\"**\n\n> \"学习新理论有一个过程。咱们学了一个新东西之后，我经常用一个词来形容，就是**邯郸学步**——就是你的新的思维和旧的思维打架，**新的思维没有完全学会，旧的思维又没有完全忘掉**，那这个时候你的成绩可能有的时候还不如之前。这叫邯郸学步嘛，**所以这时候一定要坚持。**\"\n\n**② \"我刷了一万道言语题，但每道题都像初见\"**\n\n> \"首先我对这个数字存疑——咱们说话不能这么夸张和绝对。如果你**真的刷了很多题，一定会有题感觉很熟悉、似曾相识**，不可能每道题都很陌生。\n> 所以那就是说：要么你可能没认真刷（在那儿纯浏览网页），要么你可能确实没有一万道。**但是你要'精刷'。**\"（板书在答疑表上写\"**精刷**\"）\n> 呼应本讲例题13：\"我们说刚才讲过'精专'读书法，**重在一个字：活，去活用**。\"\n\n**③ \"找到主题词了，但 ABCD 都有这个主题词／找不到中心句怎么办\"**\n\n> \"这种题也很多。那你就找嘛，你要**找区别**。这个时候可能它的重点就不止一个，肯定有**第二个比较关键的东西**。\n> 所以你首先还要把中心句找到；然后除了你找到的主题词之外，可能还有别的词很重要、别的话题很重要，就把它找到，**对比选项找差异**。\"\n\n**④ 老师总结（本讲收尾）**\n\n> ⭐ \"上岸要趁早——**未来的题可能只会越来越难**。不是你觉得难，可能大家都觉得难。\"\n> ⭐ \"明天的主题还是'中心理解化'——**逻辑填空题中心理解化**，这是我们未来的一种趋势。\"\n\n---\n\n## 九、本讲方法框架总表\n\n### 9.1 并列关系全景表\n\n| 并列类型 | 标志 | 语义关系 | 考频 | 做题动作 |\n| --- | --- | --- | --- | --- |\n| ①近义并列（**特指双并列，两个词之间**） | \"、\" \"，\"（前后均为成语时）\"和\" | 语义相近、感情色彩相近（**不一定完全一致，有相似性即可**） | **最高频** | 抓标志词里的核心字（如\"广开言路\"的\"广\"），找含同一核心义的词 |\n| ②反义并列 | \"不是…而是…\" \"多一些…少一些…\" \"既不能…也不能…\" \"要…不要…\"\"讲…不讲…\" | 语义**一般相反相对** | 次之 | 横线 = 给定词的\"反面\" |\n| ③相同句式表并列 | 排比、结构相同的分句（\"对……，对……\"） | **可近可反，视文段而定**（观察文段整体表述感情有无变化） | 较高 | 先判\"感情基调有无变化\"，再定近义还是反义 |\n| ④三并列（给定两个词填第三个） | 甲、___、丙 | 根据给定两词的关系推断（可能一样，也可能不一样） | 中 | **不好做就尽量从别的空入手** |\n| ⑤\"或、且、并\"引导的并列 | 或 / 且 / 并（一般连接**两个词**） | **一定不同、一般不重复** | 较少 | 横线要换一个角度，不能与旁边的词重复 |\n| ⑥并列中的\"局部\"与\"整体\" | 顿号 + 关联词 + 上下文 | 由整体决定局部 | **难题几乎都从这里出** | 不能只看局部，**带着整体的感觉去看局部** |\n\n### 9.2 四条\"注意\"（近义并列，PPT 红字）\n\n```\n1. 近义并列就是要语义接近，不存在重复！不存在重复！！不存在重复！！！\n2. 不一定完全一样，有相似性就可以\n3. 逗号\"，\"一般是前后为成语之时，才是引导近义并列\n4. 此为最高频的考法\n```\n\n### 9.3 \"重复\"问题的两点澄清\n\n```\n重复 ──┬─ ① 语义重复不爱考\n       └─ ② 修饰关系（的、地）→ 例：美丽的漂亮（×）\n```\n\n| 澄清 | 内容 |\n| --- | --- |\n| ① 考频 | \"语义重复\"这个点**不爱考**——\"就跟出题人在英语当中不考语法一样，基本上不考这玩意儿\" |\n| ② 真正不能重复的是**修饰关系** | 由\"的、地\"连接、词性又相同时（都是形容词）尽量不要重复。例：\"**美丽的漂亮**\"\"**精挑细选**的挑选\"\"**条分缕析**的分析\" |\n| ③ 近义并列相反 | 近义并列**就是要接近**——\"你越接近越好，这叫并列关系、同义并列，它不叫重复\" |\n\n### 9.4 逗号的特殊性\n\n> \"**顿号**就很确定是一个并列。但是**逗号**比较特殊：如果逗号前后是**两句话**（句，句），那它并不是引导并列关系；但如果逗号前后都是**四字的成语**（成语，成语），那它就是引导并列关系。\"\n\n### 9.5 局部与整体：解题动作清单\n\n```\n第一步 认标志：先看清是近义并列 / 反义并列 / 相同句式 / 三并列 / 或且并引导的不同并列\n第二步 找局部：横线旁边那个词（成语）是什么核心义\n第三步 往前看：句首那句定调子的话（话题、对象、国情、背景）说了什么\n第四步 往后看：后文是解释说明还是意义效果，反推横线\n第五步 定答案：局部说得通的多个选项，用整体（观点句 / 主语句 / 首句话题词）定唯一\n```\n\n> ⭐ 本讲反复出现的同一句：\"**一定要带着整个文段的感觉去看局部。**\"\n\n---\n\n## 十、词语/成语积累表\n\n> 一律以 PPT 原帧上的写法与注释为准；PPT 未给注释的，摘录老师在课上给出的辨析点。\n\n### 10.1 例题1~9 出现的词语/成语\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 集思广益 | 集中众人的智慧，广泛吸收有益的意见 | 侧重\"广、都来\"（很多人） | 褒义 | 第一空与\"广开言路\"并列，抓一个\"**广**\"字 |\n| 各抒己见 | 各自发表自己的意见或见解 | 侧重\"各人自己说\" | 中性偏褒 | 与\"畅所欲言\"并列；\"既…又…\"表不同 |\n| 不耻下问 | 向地位不如自己的人请教 | 侧重\"向下面的人请教\" | 褒义 | 从头到尾可能就一个人，**未必有\"广\"的意思** |\n| 虚怀若谷 | 胸怀像山谷一样宽广 | 侧重\"能容纳意见（一个人也行）\" | 褒义 | 不一定要很多人；\"从善如流\"强调上位者采纳下位者意见 |\n| 从善如流 | 迅速地采纳别人的正确意见 | 侧重\"上位者对下位者的接纳\" | 褒义 | 文段站在平等表达的角度，不合适 |\n| 兼收并蓄 | 把不同内容、不同性质的东西收下来 | 侧重\"兼＝都来、都兼容\" | 中性 | 第一空可以，第二空\"取长补短\"体现不出\"畅所欲言\" |\n| 取长补短 | 用长处弥补短处 | 侧重\"补短\" | 中性偏褒 | 与\"畅所欲言\"不同义 |\n| 守株待兔 | 死守狭隘经验不知变通；也讽刺妄想不劳而获的侥幸心理 | 侧重\"不动、等\" | 贬义 | 文段的惊喜是\"**做事情当中**\"来的，不是待在家里等 |\n| 刻舟求剑 | 办事刻板拘泥，不知根据实际情况处理问题 | 侧重\"刻板\" | 贬义 | 与\"按计划进行\"不同，过于消极 |\n| 照本宣科 | 死板地按照课文讲稿念，没有发挥、不生动 | 侧重\"照着念\" | 贬义 | 用于讲课、发言，与\"发现新物种\"无关 |\n| 按图索骥 | ①依照线索去寻找事物（中性）②死板不变通（贬义） | 侧重\"按既定步骤/线索找\" | **中性＋贬义两义** | **记词要记完整**，只记贬义就会选不到正确答案 |\n| 洞若观火 | 清楚得就像看火一样，形容观察事物透彻分明 | 侧重\"看得清楚明白\" | 褒义 | 与\"心知肚明\"对应；形象记忆法：\"黑黢黢的山洞里看火\" |\n| 防患未然 | 在祸患发生之前就加以预防 | 侧重\"预防\" | 褒义 | 与\"清楚明白\"无关 |\n| 胸有成竹 | 处理事情之前已有完整的谋划打算 | 侧重\"**自信**\" | 褒义 | \"了不了解\"≠\"自不自信\" |\n| 未卜先知 | 没有占卜便能事先知道 | 侧重\"超自然预知\" | 中性 | 公务员考试三观要与主流价值观一致，人不能未卜先知 |\n| 故弄玄虚 | 故意玩弄花招，迷惑欺骗别人 | 侧重\"故意玩花招\" | 贬义 | 与\"有没有思考\"关系不大（故弄玄虚也可能是自己想出来的） |\n| 装腔作势 | 故意做作，装出某种情态 | 侧重\"做作\" | 贬义 | 与\"有没有真实感受\"无关 |\n| 照本宣科（见上） | — | — | — | 有\"自己没有思考\"的感觉，可用 |\n| 无病呻吟 | 比喻没有值得忧虑的事情而长吁短叹 | 侧重\"**无感而发**\" | 贬义 | 与\"有感而发\"正相反——辛弃疾\"为赋新词强说愁\" |\n| 言不由衷 | 说的话不是出自内心 | 侧重\"说的不是真心话\" | 贬义 | 可用，但不如\"无病呻吟\"贴切 |\n| 人云亦云 | 人家怎么说，自己也跟着怎么说 | 侧重\"跟着别人说\" | 贬义 | 有\"自己没有思考\"的意思，可用 |\n| 陈词滥调 | 陈旧而不切实际的言论 | 侧重\"陈旧\" | 贬义 | 同上 |\n| 冠冕堂皇 | 表面上庄严体面、光明正大 | 侧重\"表面体面\" | 贬义 | 与\"有没有真实感受\"无关 |\n| 深入浅出 | 文章或言论的内容很深刻，措辞却浅显易懂 | 侧重\"深＋浅\"两面 | 褒义 | 完美对应\"朴实的语言阐述深刻的理论\" |\n| 举一反三 | 从一件事情类推而知道其他许多事情 | 侧重\"推及其他\" | 褒义 | 与\"深刻／朴实\"无关 |\n| 由表及里 | 从表面现象看到本质 | 侧重\"表→里的过程\" | 中性 | 文段不是\"由浅到深\"的过程，是同时具备深与浅 |\n| 言简意赅 | 言语简明而意思完备 | 侧重\"**少而全**\" | 褒义 | 少了\"深入\"二字，体现不出\"道理深刻\" |\n| 脚踏实地 | 形容做事踏实认真 | 侧重\"实\" | 褒义 | 与\"真抓实干\"三并列，都体现一个\"实\"字 |\n| 真抓实干 | 实实在在地做事 | 侧重\"实\" | 褒义 | 同上 |\n| 指示性 | 起到对客观事物某种状态的指明、显示作用 | 侧重\"**关联性最强**\" | 中性 | 与\"最快速（速度）\"\"最显著（明显）\"各占一个角度，不算重复 |\n| 直观性 | 直接、不用推理就能感知 | 侧重\"看得见\" | 中性 | 与\"最显著\"重复 |\n| 动态性 | 处于变化运动中的性质 | 侧重\"变化\" | 中性 | 与\"最快速\"重复 |\n| 通用性 | 适用于各种情况 | 侧重\"普遍适用\" | 中性 | 不贴合 |\n| 缓解 / 避免 / 干预 / 防止 | — | — | — | 第二空是本题突破口：\"缓解冰川消融\"最贴切 |\n| 显示 | 明显地表现 | 侧重\"**能看**\" | 中性 | **屏幕的本质是\"能显示\"（能看）** |\n| 大有可为 | 指事情很有发展前途，很值得做 | 侧重\"事\" | 褒义 | 与\"柔性电子技术\"搭配最佳 |\n| 迫在眉睫 | 形容事情临近眼前，非常紧迫 | 侧重\"**紧迫**\" | 中性 | 文段说\"未来可能会智能化\"，没有紧迫感 |\n| 永无止境 | 指永远没有尽头 | 侧重\"没有尽头\" | 褒义 | 一般要**接一个动作**（\"发展\"\"创新\"永无止境） |\n| 前途无量 | 指一个人的未来发展不可限量 | 侧重\"**形容人**\" | 褒义 | 使用概率上形容人更多，有\"大有可为\"就不选它 |\n| 提携 | 牵扶；携带；照顾；扶植；提拔 | 侧重\"往上提\" | 褒义 | 会使两者变得\"一样\"，与文段的\"错位\"矛盾 |\n| 呼应 | 彼此关联、照应 | 侧重\"互相照应\" | 中性 | 本身不好排，靠第二空排除 |\n| 错位 | 离开原来的或应有的位置，置于此处表达两者错开 | 侧重\"**错开、不一样**\" | 中性 | **\"错位发展\"**是官方热词（人民网报道佐证） |\n| 借鉴 | 把别的人或事当镜子，对照自己，以便吸取经验或教训 | 侧重\"我学你\" | 中性偏褒 | \"我学了你就跟你一样了\"，与\"错位\"矛盾 |\n| 相得益彰 | 互相帮助、互相补充，更能显出各自的长处 | 侧重\"分开但一起更好\" | 褒义 | 与\"融为一体\"对比：融为一体就没有区别了 |\n| 融为一体 | 融合为整体 | 侧重\"合在一起、没有区别\" | 中性 | 与\"城区郊区保持差异\"矛盾 |\n| 美美与共 | 各自的美好互相交融 | 侧重\"都好\" | 褒义 | 看不出\"区别\" |\n| 珠联璧合 | 比喻杰出的人才或美好的事物结合在一起 | 侧重\"美好事物结合\" | 褒义 | 看不出\"区别\" |\n| 见多识广 | 阅历深，经验多，知识广博 | 侧重\"经验多\" | 褒义 | 与\"对付测谎仪\"无关 |\n| 有备而来 | 事先有准备而前来 | 侧重\"**有防备、知道自己在被测**\" | 中性 | 与\"擅长控制情绪\"**不同角度**（\"且\"表不同）——两条件缺一不可 |\n| 不露声色 | 心里的打算不在说话和脸色上显露出来 | 侧重\"不表现\" | 中性 | 与\"擅长控制情绪\"**语义重复**，被\"且\"排除 |\n| 从容不迫 | 不慌不忙，非常镇定 | 侧重\"镇定\" | 褒义 | 同上，与\"擅长控制情绪\"重复 |\n| 博弈 / 较量 / 抗衡 / 对决 | — | — | — | 第三空四个词意思差不多，**不是解题要点**（\"空多怎么处理，第十一节课讲\"） |\n| 稀松平常 | 平常、不稀奇 | 侧重\"很平常\" | 中性 | 第一空可 |\n| 理所当然 | 按道理应当这样 | 侧重\"按道理就该\" | 中性 | ✅ 第一空；与\"而事实上\"形成对照 |\n| 天经地义 | 绝对正确、不能改变的道理 | 侧重\"就应该\" | 中性 | 第一空可（\"我家姑娘觉得到饭点饭就从桌上长出来\"） |\n| 手到擒来 | 形容做事很有把握，轻而易举 | 侧重\"容易\" | 中性 | 第一空可 |\n| 必需 | 不可缺少的 | 侧重\"不能没有\" | 中性 | 与\"获得难不难\"无关（水、空气并不稀缺） |\n| 稀缺 | 稀少、短缺 | 侧重\"**少、难得到**\" | 中性 | ✅ 第二空 |\n| 珍贵 | 价值高、意义大 | 侧重\"宝贵\" | 褒义 | 第二空可，但被第三空排除 |\n| 关键 | 对事物最关紧要的部分 | 侧重\"要紧\" | 中性 | 体现不出\"古代获得盐难\" |\n| 举足轻重 | 身份或地位特殊，一举一动足以影响全局 | 侧重\"地位重要\" | 褒义 | 尚可但前两空不行 |\n| 至关重要 | 对于某人或某事起着关键性作用 | 侧重\"极重要\" | 褒义 | ✅ 第三空——\"**并**\"引导，不能与\"贯穿\"重复 |\n| 承上启下 | 承接上面的，引出下面的内容 | 侧重\"结构过渡\" | 中性 | 与\"作用\"的搭配对象不符 |\n| **一以贯之** | 按照一个道理，从始至终都不会改变 | 侧重\"**从始至终不变**\" | 褒义 | 与\"贯穿\"**重复**，被\"并\"字排除。搭配澄清：不是只能搭配\"制度\"（\"对于老师的话应该一以贯之地执行\"） |\n\n### 10.2 例题10~15 出现的词语/成语\n\n| 词语/成语 | 释义（PPT 注释 / 老师讲解） | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 朝令夕改 | 形容主张或办法经常改变，一会儿一个样 | 侧重\"**变**\" | 贬义 | 有\"变\"的意思，与\"因循守旧\"局部相反，但**与\"国家大、决策要稳\"无关**（典型陷阱） |\n| 寅吃卯粮 | 比喻入不敷出，预先支用未来的收入 | 侧重\"提前借支\" | 贬义 | 与\"求新求变\"关系不大 |\n| 好高骛远 | 脱离实际去追求过高的、难以实现的目标 | 侧重\"**有追求但脱离实际**\" | **贬义** | ✅ 例题10答案；与\"循序渐进、保持历史耐心\"呼应；2023 国考原文也考过 |\n| 一厢情愿 | 办事时不考虑客观实际情况，全从主观意愿出发 | 侧重\"只按自己想\" | 贬义 | 与\"变／求新\"关系不大 |\n| 因循守旧 | 沿袭旧规，不求改进 | 侧重\"**不变、没追求**\" | 贬义 | 题干给定词（例题10） |\n| 隐恶扬善 | 隐瞒他人的坏处，而表扬他人的好处 | 侧重\"隐瞒＋扬善\" | 中性 | \"隐\"可用，但多了\"**扬善**\"——文段没有\"善\"可扬，画蛇添足、无中生有 |\n| 掩耳盗铃 | 比喻自己欺骗自己，明明是掩盖不住的事情偏要想法子掩盖 | 侧重\"**自己骗自己**\"（捂住自己的耳朵） | 贬义 | ✅ 例题11答案；与\"刀刃向内、自己的缺点\"完全咬合 |\n| 沽名钓誉 | 故意矫情做作，用手段猎取名声或赞誉 | 侧重\"猎取名望\" | 贬义 | **与\"隐藏\"毫无关系** |\n| 掩人耳目 | 捂住别人的耳朵，遮住别人的眼睛，比喻以假象蒙骗别人 | 侧重\"**骗别人**\"（遮住别人的眼） | 贬义 | 与 B 的微差：一个侧重自己，一个侧重别人 |\n| 文过饰非 | 用漂亮的言辞掩饰自己的过失和错误 | \"**文**\"通\"纹\"，动词，\"过、非\"是名词 → 核心是**隐藏** | 贬义 | 题干给定词（例题11）；光抓它排不掉 A、D |\n| 陈陈相因 | 沿袭老一套，无创造革新 | 侧重\"照旧、不创新\" | 贬义 | 例题12第一空；四个选项的第一词**都表示\"不创新\"**，故第一空不是决定项 |\n| 抱残守缺 | 思想守旧，不肯接受新事物 | 侧重\"守旧\" | 贬义 | 同上 |\n| 食古不化 | 不能按现在情况理解运用旧知识 | 侧重\"照搬旧知\" | 贬义 | 同上（\"食古嘛，字面意思就是不能按现在的情况运用旧知识\"） |\n| 墨守成规 | 思想保守，守着老规矩不肯改变 | 侧重\"守着老规矩\" | 贬义 | 同上；✅ 例题12第一空（与\"循规蹈矩\"近义并列） |\n| 循规蹈矩 | 指遵守一点不敢变通的规矩 | 侧重\"守规矩不变通\" | 中性偏贬 | 题干给定词（例题12），画圈处 |\n| 纸上谈兵 | 空谈理论，不能解决实际问题 | 侧重\"空谈\" | 贬义 | 与\"凭空幻想\"局部贴合，但答不到\"不守正\" |\n| 天马行空 | 形容才思豪放，不受约束 | 侧重\"不受约束、空\" | 中性（可褒可贬） | 同上 |\n| 向壁虚造 | 指凭空捏造 | 侧重\"凭空编造\" | 贬义 | 同上 |\n| 恣意妄为 | 任意胡作非为 | 侧重\"**乱来**\"——\"妄＝乱\"，乱＝**不正** | 贬义 | ✅ 例题12第二空；靠整体\"创新不是不守正\"推出 |\n| 正本清源 | 从根源上加以整顿清理 | 侧重\"清理\" | 褒义 | 前提是\"**已经被污染**\"——文段没丢 |\n| 返璞归真 | 除去外饰，恢复原来的质朴状态 | 侧重\"恢复原来\" | 褒义 | 前提是\"**已经变了**\" |\n| 拨乱反正 | 治理混乱的局面，使其恢复正常 | 侧重\"治乱\" | 褒义 | 前提是\"**已经乱了**\" |\n| 固本强基 | 加固本体，强化基础 | 侧重\"**守住即可**\" | 褒义 | ✅ 例题12第三空——\"恪守正道＝我还没丢，只需要守住\" |\n| 咬文嚼字 | 形容过分地斟酌字句 | 侧重\"**读者**抠字句\" | 贬义 | ✅ 例题13第一空；与\"穿凿附会\"近义并列 |\n| 雕章琢句 | 形容对文章词句刻意雕琢 | 侧重\"**作者**写文章\" | **偏积极**（\"玉不琢不成器\"） | 与\"穿凿附会\"的贬义色彩不符，且本题是\"读书法\" |\n| 去粗取精 | 去掉粗糙，取其精华 | 侧重\"取**精华**、读细\" | 褒义 | ✅ 例题13第二空；\"精专\"读书法 → 去粗取精 |\n| 去伪存真 | 除掉虚假的，留下真实的 | 侧重\"辨**真假**\" | 褒义 | \"既然是精专读书法，**跟真假没什么关系**\" |\n| 穿凿附会 | 把讲不通的或不相干的道理、事情硬扯在一起进行解释 | 侧重\"硬扯、强行解释\" | 贬义 | 题干给定词（例题13） |\n| 苦心孤诣 | 煞费苦心地钻研，到了别人所达不到的至高境界 | 侧重\"**造诣高、水平高**\" | 褒义 | 题干给定词（例题13）；乍看与\"去粗取精／去伪存真\"都没关系 |\n| 停留 | 停下来不再前进 | 侧重\"**笃定地停在这儿**\" | 中性 | ✅ 例题14第一空 |\n| 流连 | 舍不得离开 | 侧重\"**犹豫、舍不得走**\" | 中性 | 与文段\"没有想走、没有犹豫\"不符 |\n| 徘徊 | 在一个地方来回地走；比喻犹豫不决 | 侧重\"**拿不定、纠结**\" | 中性 | 同上 |\n| 局限 | 限制在狭小的范围里 | 侧重\"范围小\" | 中性偏贬 | 与\"仅仅……在浅表层面\"尚可，但第二空不行 |\n| 振聋发聩 | 比喻用语言文字唤醒糊涂麻木的人 | 侧重\"**使人清醒，很深刻**\" | 褒义 | ✅ 例题14第二空 |\n| 鞭辟入里 | 形容能透彻说明问题，深中要害 | 侧重\"切中要害\" | 褒义 | 与\"振聋发聩\"同属\"深刻\"，区分度不大 |\n| 发人深省 | 启发人深刻思考而有所醒悟 | 侧重\"启发思考\" | 褒义 | 同上 |\n| 义正辞严 | 道理正当，措辞严肃 | 侧重\"**只能形容说法／言辞**（严＝严肃）\" | 褒义 | **不能形容\"思想力量\"**，搭配离谱（例题14） |\n\n---\n\n## 十一、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 正确认识 |\n| --- | --- | --- |\n| 1 | 把近义并列当成\"语义重复\" | **不存在重复**——并列要的就是\"接近\"，越接近越好 |\n| 2 | 把\"不能重复\"扩大化 | 真正不能重复的是\"**的、地 + 同词性**\"的修饰关系（\"美丽的漂亮\"\"精挑细选\"的挑选）；\"语义重复\"这个点不爱考 |\n| 3 | 见到逗号就当并列 | 逗号前后是**两句话（句，句）不算并列**；前后都是**四字成语**才算近义并列 |\n| 4 | 认为三并列一定要\"递进\" | **没有这个说法**——\"请把'递进'两个字先在脑海里删掉\"；三并列可能一样，也可能不一样 |\n| 5 | 三并列（甲、___、丙）死磕 | 三并列复杂，**尽量从别的空入手**（例题5 靠第二空\"缓解\"做出） |\n| 6 | 把\"或、且、并\"当作\"和／顿号\"用 | 或且并引导的并列**语义一般不重复**，一定表不同（\"痛并疼着\"\"有且有\"\"东方或东方\"都不成立） |\n| 7 | 相同句式一律当近义并列 | 相同句式**可近可反**，要看文段**整体感情有无变化**（\"好的书籍净化心灵，坏的书籍残害灵魂\"＝反义） |\n| 8 | 只看局部，不看整体 | **本讲最大的坑**：例题9、11、12、13 都是\"局部说得通，整体才定答案\" |\n| 9 | 只往后看，不往前看 | 例题10：\"既不能……也不能……\"要**往前看**句首的\"人口基数、城乡区域发展水平差异大\" |\n| 10 | 记词只记一个义项 | 例题2：\"按图索骥\"既有中性义（依照线索找）又有贬义（死板），只记贬义就会选错 |\n| 11 | 选项\"多了一个字\"没警觉 | 例题11：\"隐恶扬善\"多出来的\"**扬善**\"＝画蛇添足、无中生有 |\n| 12 | 关联词与搭配冲突时不知优先谁 | 例题9：\"**有病（关联词）就要优先看病**，关联词的作用更加明显一些\" |\n| 13 | 看到\"贯穿\"就直接选\"一以贯之\" | 前面有\"**并**\"字，并列要表不同 → 不能重复 |\n| 14 | 只看词语表面色彩 | 例题8：\"且\"后面是\"擅长控制情绪\"，横线就不能再填\"不露声色／从容不迫\" |\n| 15 | 被\"文段给了明显线索\"误导 | 例题12：顿号给的线索（纸上谈兵／天马行空／向壁虚造）**恰恰是坑**，真正的线索在首句观点 |\n| 16 | 标题题只看后半段的\"大对策\" | 例题15：不能只抓\"打造基层治理平台\"（大家都觉得它重要），要回到**首句引出的话题词** |\n| 17 | 刷题只求数量不求\"精\" | \"每道题都像初见\"说明没有**精刷**——本讲例题13的\"'精专'读书法\"就是答案 |\n\n---\n\n## 十二、老师金句\n\n> ⭐ \"**意思是逻辑填空的灵魂。**\"（\"不能完全靠语感，一定要文字的意思优先\"）\n\n> ⭐ \"**近义并列就是要语义接近，不存在重复！不存在重复！！不存在重复！！！**\"\n\n> ⭐ \"每次我讲课都有同学走神了，说'老师，不重复吗？'——来，自己默念一下：不存在重复、不存在重复、不存在重复。因为我要的就是你俩接近，你越接近越好。这叫并列关系，这叫同义并列，**它不叫重复**。\"\n\n> ⭐ \"**鉴于三并列的复杂性，遇到了尽量从别的地方入手。**\"\n\n> ⭐ \"大家请把'**递进**'这两个字在自己脑海里先删掉——我们从来没有说过三并列一定要表递进。\"\n\n> ⭐ \"**几乎所有关于并列的难题，都是从这个角度出来的：并列中的局部与整体。**\"\n\n> ⭐ \"**语言就是灵活的。同样一个东西，在不同文段意思就是不一样——对咱们，就是不能断章取义。**\"\n\n> ⭐ \"**做任何题目，不是说你眼中只有这个地方、别的地方是黑的——你整个文段都得看。一定要带着整个文段的感觉去看局部。**\"\n\n> ⭐ \"**有病（关联词）就要优先看病，关联词的作用更加明显一些。**\"\n\n> ⭐ \"逻辑填空题，特别是国考题，包括大部分联考题，都是非常讲究逻辑关联性的。**就像我们玩密室逃脱游戏一样，你把线索抓到了，你就能做出来。**\"\n\n> ⭐ \"**你说你想不到，但一定有人想得到。**\"（例题12 难题的感受）\n\n> ⭐ \"**这是趋势——逻辑填空题中心理解化。**\"\n\n> ⭐ \"逻辑填空题你文段怎么去分析，这个是可以靠短时间内学习掌握的；但是选项中对词语的积累，短时间内不太容易做到，需要慢慢刷题去积累、去提高。**就像巧妇难为无米之炊。**\"\n\n> ⭐ \"**学习新理论有一个过程——邯郸学步，新的思维没有完全学会，旧的思维又没完全忘掉。所以这时候一定要坚持。**\"\n\n> ⭐ \"**未来的题可能只会越来越难。上岸要趁早。**\"\n\n---\n\n> **本讲小结（一句话）**：并列关系共六类考法，**近义并列最高频**（不叫重复）；**\"或、且、并\"表不同**；**三并列别死磕**；而所有难点最终都指向同一句话——**带着整体的感觉去看局部**。\n\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"一、开场回顾：逻辑填空做题基本思路","id":"一开场回顾逻辑填空做题基本思路"},{"level":2,"text":"二、为什么本讲只讲\"并列关系\"","id":"二为什么本讲只讲并列关系"},{"level":2,"text":"三、并列关系的常见考法（三大类）","id":"三并列关系的常见考法三大类"},{"level":3,"text":"① 近义并列——专指\"双并列\"","id":"近义并列专指双并列"},{"level":3,"text":"关于\"重复\"问题的两点澄清（板书，帧 f_0060/f_0075）","id":"关于重复问题的两点澄清板书帧-f_0060f_0075"},{"level":3,"text":"逗号的特殊性","id":"逗号的特殊性"},{"level":3,"text":"② 反义并列","id":"反义并列"},{"level":3,"text":"③ 相同句式表并列","id":"相同句式表并列"},{"level":2,"text":"例题精讲","id":"例题精讲"},{"level":3,"text":"例题1｜2024 国考 · 协商民主（近义并列）","id":"例题12024-国考-协商民主近义并列"},{"level":3,"text":"例题2｜2025 云南 · 新物种的发现（反义并列）","id":"例题22025-云南-新物种的发现反义并列"},{"level":2,"text":"四、相同句式表并列","id":"四相同句式表并列"},{"level":3,"text":"例题3｜2024 国考 · 战场\"善疑\"（相同句式表并列）","id":"例题32024-国考-战场善疑相同句式表并列"},{"level":3,"text":"例题4｜2025 国考 · 改进文风\"短实新\"（反义并列）","id":"例题42025-国考-改进文风短实新反义并列"},{"level":2,"text":"五、其他并列考法","id":"五其他并列考法"},{"level":3,"text":"① 三并列（给定两个词填第三个词）","id":"三并列给定两个词填第三个词"},{"level":3,"text":"② \"或、且、并\"引导的两并列","id":"或且并引导的两并列"},{"level":3,"text":"例题5｜2023 国考 · 冰川监测（三并列，昨日作业题）","id":"例题52023-国考-冰川监测三并列昨日作业题"},{"level":3,"text":"例题6（例5）｜2022 福建 · 柔性电子技术（三并列＋主题词）","id":"例题6例52022-福建-柔性电子技术三并列主题词"},{"level":3,"text":"例题7（例6）｜2022 江苏 · 城区与郊区（三并列＋解释说明反推）","id":"例题7例62022-江苏-城区与郊区三并列解释说明反推"},{"level":3,"text":"例题8（例7）｜2020 国考 · 测谎仪（\"且\"字表不同）","id":"例题8例72020-国考-测谎仪且字表不同"},{"level":3,"text":"例题9（例8）｜2021 国考 · 盐与人类文明（\"并\"引导的两方面并列）","id":"例题9例82021-国考-盐与人类文明并引导的两方面并列"},{"level":2,"text":"六、并列中的局部与整体（本讲最重要的思想）","id":"六并列中的局部与整体本讲最重要的思想"},{"level":3,"text":"6.1 思想导入：不要断章取义","id":"61-思想导入不要断章取义"},{"level":3,"text":"6.2 PPT 上的\"倾向性\"示例（板书逐字，帧 f_0468 / f_0491~f_0502）","id":"62-ppt-上的倾向性示例板书逐字帧-f_0468-f_0491f_0502"},{"level":3,"text":"例题10（例9）｜2025 国考 · 保持历史耐心（局部看整体）","id":"例题10例92025-国考-保持历史耐心局部看整体"},{"level":3,"text":"例题11（例10）｜2024 深圳 · 刀刃向内（相同句式表并列）","id":"例题11例102024-深圳-刀刃向内相同句式表并列"},{"level":3,"text":"例题12（例11）｜2024 国考 · 守正创新（逻辑填空中心理解化）","id":"例题12例112024-国考-守正创新逻辑填空中心理解化"},{"level":3,"text":"例题13（例12）｜2024 深圳 · \"精专\"读书法（近义并列＋整体）","id":"例题13例122024-深圳-精专读书法近义并列整体"},{"level":3,"text":"例题14｜课后答疑补充题① · 相声（2026/02/06 答疑）","id":"例题14课后答疑补充题-相声20260206-答疑"},{"level":3,"text":"例题15｜课后答疑补充题② · 2026 国考标题题（城镇化与基层治理）","id":"例题15课后答疑补充题-2026-国考标题题城镇化与基层治理"},{"level":2,"text":"七、并列关系-总结（省流版）与课程预告","id":"七并列关系-总结省流版与课程预告"},{"level":3,"text":"7.1 PPT「（三）并列关系-总结（省流版）」思维导图（帧 f_0652 / f_0656 / f_0660 逐字抄录）","id":"71-ppt三并列关系-总结省流版思维导图帧-f_0652-f_0656-f_0660-逐字抄录"},{"level":3,"text":"7.2 课程预告（帧 f_0667 / f_0668）","id":"72-课程预告帧-f_0667-f_0668"},{"level":2,"text":"八、课后答疑","id":"八课后答疑"},{"level":2,"text":"九、本讲方法框架总表","id":"九本讲方法框架总表"},{"level":3,"text":"9.1 并列关系全景表","id":"91-并列关系全景表"},{"level":3,"text":"9.2 四条\"注意\"（近义并列，PPT 红字）","id":"92-四条注意近义并列ppt-红字"},{"level":3,"text":"9.3 \"重复\"问题的
