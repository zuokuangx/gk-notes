**本集位置**：合集第 9 集（共 14 P；正课第八讲）\n> **视频地址**：https://www.bilibili.com/video/BV14RzZBuEz3?p=9\n> **时长**：约 120 分钟（2 小时）\n> **本集主题**：**逻辑填空总纲（正确认识解题思路）+ 语境分析（文段意思为王）+ 词语辨析七大角度 + 高频考点\"句内呼应\"**\n\n本讲是**逻辑填空第一次课**。老师开场口播：**\"我们今天第八节课了，正式进入我们万众瞩目的环节——逻辑填空题。\"** 开头先用几分钟回顾上一讲的语句排序题（板书\"五、语句排序题 总结（省流版）\"思维导图），随后进入\"六、逻辑填空题\"。\n\n> 本讲 PPT 标题页（红底白字）：\n> 张弓言语\"十二箭\"（八）\n> （一）正确认识逻辑填空题的思路逻辑\n> （二）句内呼应\n> 主讲人：张弓\n\n---\n\n## 目录\n\n- [一、开场与上一讲回顾（语句排序题·省流版总结）](#一开场与上一讲回顾语句排序题省流版总结)\n  - [1.1 老师开场口播](#11-老师开场口播)\n  - [1.2 语句排序题·省流版思维导图（板书全录）](#12-语句排序题省流版思维导图板书全录)\n  - [1.3 老师对上一讲的复盘](#13-老师对上一讲的复盘)\n- [二、逻辑填空总纲：正确认识逻辑填空题的解题思路](#二逻辑填空总纲正确认识逻辑填空题的解题思路)\n  - [2.1 PPT 原理图（板书全录）](#21-ppt-原理图板书全录)\n  - [2.2 为什么\"语境分析\"与\"词语辨析\"都非学不可](#22-为什么语境分析与词语辨析都非学不可)\n  - [2.3 逻辑填空为什么难](#23-逻辑填空为什么难)\n  - [2.4 文本页：两大考察内容（板书全录）](#24-文本页两大考察内容板书全录)\n- [三、语境分析（角度一）：文段意思为王](#三语境分析角度一文段意思为王)\n  - [3.1 幻灯片原文（逐字抄录）](#31-幻灯片原文逐字抄录)\n  - [3.2 讲解①：意思是逻辑填空的灵魂，不能全靠语感](#32-讲解意思是逻辑填空的灵魂不能全靠语感)\n  - [3.3 讲解②：绝大多数同学的问题——过于迷信搭配](#33-讲解绝大多数同学的问题过于迷信搭配)\n  - [3.4 核心原理：为什么能靠\"搭配\"、又不能只看\"搭配\"——利用率](#34-核心原理为什么能靠搭配又不能只看搭配利用率)\n- [四、例题精讲（第一批）](#四例题精讲第一批)\n  - [例题 1｜2022 江苏 · 山民故事与个人感悟（三空）](#例题-12022-江苏--山民故事与个人感悟三空)\n  - [例题 2｜2025 四川 · 恐龙足迹的保存条件（三空）](#例题-22025-四川--恐龙足迹的保存条件三空)\n  - [例题 3｜2022 四川 · 人无德不立（三空）](#例题-32022-四川--人无德不立三空)\n- [五、词语辨析（角度二）：考对词语的多角度理解](#五词语辨析角度二考对词语的多角度理解)\n  - [5.1 案例回顾：从三道题看\"多角度\"的必要性](#51-案例回顾从三道题看多角度的必要性)\n  - [5.2 幻灯片原文（逐字抄录）](#52-幻灯片原文逐字抄录)\n- [六、两大考察方向：意思的正确性 vs 使用的合理性](#六两大考察方向意思的正确性-vs-使用的合理性)\n- [七、词语辨析七大角度逐项精讲](#七词语辨析七大角度逐项精讲)\n  - [7.1 角度（1）：搭配对象](#71-角度1搭配对象)\n  - [7.2 角度（2）：程度轻重](#72-角度2程度轻重)\n  - [7.3 角度（3）：感情色彩](#73-角度3感情色彩)\n  - [7.4 角度（4）：使用语境](#74-角度4使用语境)\n  - [7.5 角度（5）：宠词 / 陪跑词](#75-角度5宠词--陪跑词)\n  - [7.6 角度（6）：词义侧重](#76-角度6词义侧重)\n  - [7.7 词语积累的正确途径（优先级排序）](#77-词语积累的正确途径优先级排序)\n- [八、例题精讲（第二批）](#八例题精讲第二批)\n  - [例题 4｜2025 天津 · 金融资源配置与数字鸿沟](#例题-42025-天津--金融资源配置与数字鸿沟两空)\n  - [例题 5｜2023 国考 · 冰川消融与科学应对](#例题-52023-国考--冰川消融与科学应对两空)\n  - [例题 6｜2023 江苏 · 科技强国与\"科创策源地\"](#例题-62023-江苏--科技强国与科创策源地三空)\n  - [例题 7｜2024 江苏 · 南极北极的\"别有洞天\"](#例题-72024-江苏--南极北极的别有洞天两空)\n- [九、高频考点：句内呼应](#九高频考点句内呼应)\n  - [9.1 什么是句内呼应](#91-什么是句内呼应)\n  - [9.2 最高频考法：横线 + 逗号](#92-最高频考法横线--逗号)\n- [十、例题精讲（第三批）](#十例题精讲第三批)\n  - [例题 8｜2025 四川 · 感恩与知己的层次](#例题-82025-四川--感恩与知己的层次两空)\n  - [例题 9｜2025 国考 · 可再生能源的间歇性与储能](#例题-92025-国考--可再生能源的间歇性与储能两空)\n  - [例题 10｜2025 内蒙古 · 人类活动对鸟类的影响](#例题-102025-内蒙古--人类活动对鸟类的影响三空)\n  - [例题 11｜2022 四川 · 中国发展的短视行为与\"卡脖子\"](#例题-112022-四川--中国发展的短视行为与卡脖子两空)\n  - [例题 12｜2022 山东 · 回忆录中的选择性记忆](#例题-122022-山东--回忆录中的选择性记忆两空)\n- [十一、本讲思维导图（收尾总结）](#十一本讲思维导图收尾总结)\n- [十二、答疑精选](#十二答疑精选)\n- [十三、本讲方法框架总表](#十三本讲方法框架总表)\n- [十四、词语 / 成语积累表](#十四词语--成语积累表)\n- [十五、易错点与陷阱清单](#十五易错点与陷阱清单)\n- [十六、老师金句](#十六老师金句)\n\n---\n\n## 本讲知识地图\n\n| 板块 | 核心内容 | 对应方法 / 口诀 |\n| --- | --- | --- |\n| 开场回顾 | 语句排序题\"省流版\"思维导图（两大原则、先后关系、紧密相连、三个步骤） | 从选项差异入手 + 排除法；看首句 → 排思路 → 验证 |\n| 总纲 | 逻辑填空 = **文段 + 选项**；文段对应**语境分析**，选项对应**词语辨析** | 弄清文段与横线意思 → 结合 → 选项寻找合适的词语 |\n| 语境分析 | **文段意思为王**；意思是逻辑填空的灵魂，不能全靠语感；搭配只考察\"使用的合理性\"，并非最重要 | 分不分析的出来是能力问题，分不分析是路线问题 |\n| 核心原理 | 只看搭配 = 对文段利用率极低（可能只有百分之十几） | 出题人给你一整段话，你却只看几个字 |\n| 词语辨析 | 七个角度：基本释义、搭配对象、程度轻重、感情色彩、使用语境、宠词陪跑词、词义侧重 | 基本释义是最本质的区别，必须满足；角度多不等于都要背 |\n| 两大考察方向 | **意思的正确性**（国考最重）vs **使用的合理性**（广东等地更重，指固定搭配） | 二者矛盾时，**优先尊重意思的正确性** |\n| 高频考点 | **句内呼应**（考得最多）：横线所在句子给横线以意思提示，尤其是\"横线 + 逗号\" | 横线后（逗号后）的内容极可能是解题要点 |\n| 积累途径 | 以史为鉴（刷真题）> 听课 > 权威文章媒体 > 词典 | 考得越多，记的角度就应该越多 |\n\n---\n\n## 一、开场与上一讲回顾（语句排序题·省流版总结）\n\n### 1.1 老师开场口播\n\n> \"我们今天第八节课了，正式进入我们万众瞩目的环节——逻辑填空题，一个非常大家非常喜欢的一个题型。逻辑填空，有时候大家不喜欢，不喜欢也没办法。\"\n> \"后面八到十二节全是大家关心的逻辑填空。\"\n> \"我们这节课首先两个任务，第一个是正确认识逻辑填空的解题思路。跟我们第一节课一样，我们第一节课就是正确认识中心理解的思路，我们这节课就正确认识逻辑填空的思路。\"\n\n**课程安排口播**：刷题安排大概是三月一号开始，讲十天，大概讲到十一号，中间休息一天；想要免费的纸质讲义，可以去参加打卡活动，三月一号开始。\n\n### 1.2 语句排序题·省流版思维导图（板书全录）\n\n> 来源：开场幻灯片「五、语句排序题 总结（省流版）」，老师用 2 分钟带大家复盘。\n\n```\n五、语句排序题 总结（省流版）\n\n语句排序题\n├─ 两大原则\n│   ├─ 从选项差异入手\n│   └─ 排除法\n├─ 先后关系\n│   ├─ 行文逻辑：观点+解释说明、提问+回答、问题+对策等\n│   └─ 日常逻辑：时间脉络、行动顺序等\n├─ 紧密相连\n│   ├─ 看指代词：这、那、他、其、该、此、这些、他们等\n│   ├─ 看关联词\n│   │   ├─ 转折：语义相反 —— 虽然……但是、可是、然而、不过、却等\n│   │   └─ 并列：话题强相关 —— 同时、同样、此外、也等\n│   ├─ 看例子：比如、就像、好像、例如等\n│   └─ 补充（慎用）：文段中仅出现两次的内容，概率上适合放在一起\n└─ 三个步骤\n    ├─ 第①步 看首句\n    │   ├─ 判断依据：根据先后关系判断\n    │   └─ 非首句特征\n    │       ├─ 指代词指代不清：这、那、他、其、该、此等\n    │       ├─ 关联词后半部分：但、却、而且等\n    │       └─ 明确的举例标志：例如、比如、就像等\n    ├─ 第②步 思路\n    │   ├─ 先从文段出发寻找解题线索，再排除不符合要求的选项\n    │   │   ├─ （一）看文段是否存在指代词、关联词\n    │   │   ├─ （二）看是否存在明显的时间线索\n    │   │   ├─ （三）看明显的引出话题（下定义）\n    │   │   └─ （慎用）看是否有话题只出现两次，用紧密相连解题\n    │   └─ 先从选项出发寻找解题线索，再判断相应句子顺序和相连关系\n    │       ├─ （一）任何选项差异理论上均是解题线索\n    │       └─ （二）首句的差异，利用得较多（画面字迹略糊，显示为\"首句号的差异\"）\n    └─ 第③步 验证\n        ├─ （一）绝大多数题目不需要验证，\"一步到位\"的题可以酌情验证\n        └─ （二）验证句子的顺序和逻辑\n```\n\n> 老师原话（指着导图讲）：\n> \"把不符合先后关系和不符合紧密相邻的排掉，它一定是排除。排除掉所有的不好的，剩下那个就是答案。它一定不是从文段中直接得到答案，是从选项出发，排除法把不好的排掉，剩下的是答案。\"\n> \"三步走第一步一定是看首句……根据先后关系判断，同时要注意一下，有些句子是一定不行的，就是非首句特征三类。\"\n> \"第二步分两种情况，这是我跟可能其他同学和老师思维不太一样的地方……有的题可能文段线索比较多的话，就可以从文段出发；有的题你瞟了一眼，发现文段没什么线索，那就可以从选项出发找线索。\"\n> \"最后一个是验证，这一步其实不是必须的，一般就一步到位了。内心有点慌张的时候，可以验证一下。\"\n\n### 1.3 老师对上一讲的复盘\n\n> ⭐ \"这个题型（排序题）内容比较多、知识比较密集。大家如果想有提高的话，还是建议大家再去看一看，再去对照自己做题的经历再去感受、消化。\"\n> ⭐ \"这个题型，国联考题一般就两道题，一般不会超过两道题。所以如果实在是有点儿把握不住，**也可以选择性地放弃一道左右**，因为这个题型短期内不太能提高，它的根儿在中心理解上。\"\n\n---\n\n## 二、逻辑填空总纲：正确认识逻辑填空题的解题思路\n\n### 2.1 PPT 原理图（板书全录）\n\n> 幻灯片标题：**（一）正确认识逻辑填空题的解题思路**\n> 画面为一张思维导图（老师用红笔在图上圈画、写批注\"本质\"\"逻辑\"）。\n\n```\n                                ┌── 弄清文段与横线意思 ②\n        ┌──  思 路  ──结合──┤\n        │                   └── 选项寻找合适的词语 ②\n逻辑填空题 ┤\n        ├── 语境分析 ③\n        └── 词语辨析 ⑲\n\n思考：是否存在逻辑填空题，只考察词的辨析 / 语境分析？\n```\n\n> （上图中\"思路\"\"语境分析\"\"词语辨析\"三个框分别用红、粉、黄三色标注；各项后附小序号 ②/②/③/⑲，疑为讲义中的题量标注，画面显示如此。）\n\n老师边讲边在\"语境分析\"旁写批注**\"本质\"**，在\"词语辨析\"旁写批注**\"逻辑\"**（对应\"逻辑填空考的是逻辑关系\"）。\n\n### 2.2 为什么\"语境分析\"与\"词语辨析\"都非学不可\n\n> 老师原话（本讲最核心的一段原理推导）：\n> \"很多的老师在教大家的时候，主要就是围绕这两点讲：一个是语境分析，一个是词语的辨析。其实我们要理解一下原理，为什么我们要学这个东西。我们要学一个新东西的时候，你不能光被动的学，你要知道我为什么我要学，我能不能不学。\"\n> \"怎么做逻辑填空题？它是由什么构成的？**它是由文段和选项构成的。**\"\n> \"那么对于文段，你应该干一些什么事情？第一个你得知道文字什么意思；第二个，它是挖了空的，它是有横线的，所以你要**根据文段上下文的意思来推测横线的意思**。\"\n> \"我们为什么要学语境分析呢？其实就是帮大家理解，帮大家更好的去分析、去理清楚这个文段和横线是什么意思。\"\n> \"咱出了个暴论：假设你每一个文段都能读得很清晰，你的阅读能力很强，给你一个文段，你就能知道文段和横线大概想表达的意思，那么这个题的**语境分析模块你压根儿不用学**。因为我们学它的目的就是为了分析；你如果自己会分析，你可以不用学。\"\n> \"你弄清了文章的意思，拿到了横线意思之后，接下来干嘛？你是不是要从选项寻找合适的词语？那什么词最合适呢？四个词给我，我到底该选哪一个呢？**怎么辨析？由哪些角度辨析？就是词语辨析告诉我们的。**\"\n\n```\n逻辑填空 = 文段 + 选项\n   ├─ 文段 → 弄清文段什么意思、横线什么意思 =【语境分析】\n   └─ 选项 → 选择合适词语、弄清词语区别 =【词语辨析】\n```\n\n> ⭐ 老师下结论：\"**是否存在只考察词的辨析、或者只考察语境分析的逻辑填空题？存不存在？不可能。** 所以每道题都是这两部分构成。\"\n> \"我们做的所有的工作，只是帮你更好的理解文段，以及帮你更好的去区分词语。你如果自己有这个能力，你完全可以不用学。\"\n> \"你拿到意思之后，来到选项，选择合适词语——**分不分析的出来是能力问题，分不分析是路线问题**。\"\n\n### 2.3 逻辑填空为什么难\n\n> \"这个题为什么难？因为它相当于**你看你弄懂文段，相当于做了一个比较简单的中心理解**；你相当于在做了一个中心理解的基础上，还要再去**做很多的词语的辨别**，这是不是就是难上加难了？\"\n> \"你不仅要做一遍中心理解，理解文章的意思，你还得去选项中，面对如此多的词语，还要去辨析区别。这就是难点所在。\"\n\n### 2.4 文本页：两大考察内容（板书全录）\n\n> 幻灯片原文（逐字抄录，老师用红笔圈画关键词）：\n\n**（一）正确认识逻辑填空题的解题思路**\n\n1. 考文段意思分析：\n   把握文段，以及横线和文段之间的逻辑关系，**它是逻辑填空的本质**（此处为黄色高亮，老师圈画\"逻辑关系\"\"本质\"）\n2. 考对词语的多角度理解：\n   考察区分词语的角度，如基本释义、搭配对象、程度轻重、感情色彩、使用语境、宠词陪跑词、词义侧重等\n\n> ⭐ 老师原话：\"**逻辑填空本质考的是什么？考的是逻辑关系，考的是横线和文段的逻辑关系，不是你的语感**，不能完全靠语感。\"\n> ⭐ \"这个题型，不同的老师有不同的叫法。有的老师叫选词填空，没有错，但我们叫习惯了叫逻辑填空——我认为这个叫法非常合适，它更能体现这个题型的本质，就是**谜底在谜面上**。\"\n> ⭐ \"对于文段来讲，你一定要把握逻辑关系；而对于词语的角度来讲，你一定要做到**多角度的理解**。很多同学为什么做不好？就是因为他可能只知道意思——意思只是区分词语的角度之一，它有很多角度。\"\n\n---\n\n## 三、语境分析（角度一）：文段意思为王\n\n### 3.1 幻灯片原文（逐字抄录）\n\n> 幻灯片标题：**（一）正确认识逻辑填空题的解题思路-1 文段意思为王**\n\n```\n1. 语境分析——考文段意思分析：\n   把握文段，以及横线和文段之间的逻辑关系，它是逻辑填空的本质\n\n   (1) 意思是逻辑填空的灵魂，并非完全靠语感\n       例：月光轻轻把梦偷走，所有______的夜想你够不够。\n           （无眠、寂寞、清冷）\n\n   (2) 搭配考察词语使用的合理性，但并非最重要，一定要以文段意思优先\n       例：____________________ 文化的活力，____________________。（消磨 / 释放）\n       例：封闭的环境同时也很可能______文化的活力，使其停滞不前，甚至消亡湮灭。（消磨 / 释放）\n       例：____________________ 采取应对措施。（大刀阔斧 / 未雨绸缪）\n       例：要增强风险意识，研判未来 5 年、15 年乃至 30 年我国人口老龄化、人均预期寿命提升、\n           受教育年限增加、劳动力结构变化等发展趋势，分析社会保障可能面临的新情况新问题，\n           提高工作预见性和主动性，______采取应对措施。（大刀阔斧 / 未雨绸缪）\n\n为什么逻辑填空大家喜欢靠\"搭配\"解题？而又不能只看\"搭配\"解题，内在原理是？\n```\n\n> 说明：画面中第 (2) 项前两条例子用了**黑色遮挡条**（被改编过、隐去原文），能看清的只有\"文化的活力\"\"采取应对措施\"等少数文字。\n\n### 3.2 讲解①：意思是逻辑填空的灵魂，不能全靠语感\n\n**案例：**月光轻轻把梦偷走，所有______的夜想你够不够。（无眠、寂寞、清冷）\n\n> 老师原话：\n> \"你就把它当一个逻辑填空选哪个。你如果从语感出发，无眠、寂寞和清冷是不是感觉都有道理？但是你要知道文段他想传达给你什么东西。\"\n> \"第一个，我在想你。想你无非就是两种情况：第一种我是醒着的、我是清醒的，我在想你；第二种我在做梦，我在梦里想你。**不存在第三种情况吧？**\"\n> \"而他前面又说**月光把梦偷走了**——就是你没有做梦了，你梦醒时分了，那这个时候就指着怎么样？睡不着觉了呀，那就只能是清醒的时候想你了。**所以这个题只能选'无眠'**，跟你寂寞和清冷没有关系。\"\n> \"你如果要填寂寞、要填清冷，那你这前半句就说明你没看懂。他为什么叫'把梦偷走'呢？梦醒了、睡不着觉了、一夜无眠——**想你想的一夜无眠**。\"\n\n> ⭐ 结论：**\"这就是逻辑填空的本质。\"** 不要只凭语感，要看文段想传达什么。\n\n### 3.3 讲解②：绝大多数同学的问题——过于迷信搭配\n\n**案例组（消磨 / 释放；大刀阔斧 / 未雨绸缪）**\n\n> 老师原话：\n> \"很多同学，特别是新同学，**过于迷信搭配**——其实这也是一种语感，就觉得哪个词我搭起来好，我就选哪个。\"\n> \"比如第一个'______文化的活力'，假设给你两个词，一个是消磨，一个是释放，你的第一反应是什么？'消磨'没见过，'释放'很好选。\"\n> \"包括第二个，什么采取应对措施呢？一个是大刀阔斧，一个是未雨绸缪。你'大刀阔斧地采取措施'，感觉也很符合语感；'未雨绸缪地采取'感觉就很怪。所以你如果光从搭配角度来讲，好像是有道理的。\"\n> \"但是我们刚才讲过，一定要把握横线和文段的关系。你把它放到文章里看——**封闭的环境**同时也很可能______文化的活力，使其**停滞不前，甚至消亡湮灭**，那前后的语境就告诉你，这个活力是多了还是少了？消极的，所以是**少了**。\"\n> \"这个时候你感觉'我没太见过这个搭配'，但你也不能选释放，**因为释放是越来越多的意思**。\"\n> \"第二个也是：'要增强风险意识，研判未来的变化''要提高工作的预见性主动性''要面临新情况新问题'——那是不是就是对未来的一种预判？所以应该是**未雨绸缪**。\"\n\n> ⭐ 答案：① 消磨（不能选\"释放\"）② 未雨绸缪（不能选\"大刀阔斧\"）\n\n### 3.4 核心原理：为什么能靠\"搭配\"、又不能只看\"搭配\"——利用率\n\n> 老师原话（本讲第一个\"暴论级\"金句）：\n> ⭐ \"**最根本的原理是：如果你只看搭配的话，你对这个文段的利用率是非常低的。**\"\n> \"相当于整个文段我标黑的地方白讲了。你如果眼中只有'活力'，相当于老师标黑的地方我白讲。那你照这么理解，我就给五个字不就行了吗？那出题人为什么要给你这么长的一句话呢？\"\n> ⭐ \"**你的眼中一定不能只有搭配，因为你如果只看搭配，你的眼中就只有词，而别人给你的是一段话。**\"\n> \"你如果看'活力'就选'释放'的话，**你对文字的利用率可能只有百分之十几**，别的都没看到。\"\n\n> ⭐ 老师收束这一节：\n> \"**分不分析的出来是能力问题，分不分析是路线问题。** 老师我分析能力很差、我看不懂——那是看不懂的事，但是你不能不看。知道吧？这是两码事儿。一个是路线问题，一个是能力问题，这个不能搞错。\"\n\n---\n\n## 四、例题精讲（第一批）\n\n### 例题 1｜2022 江苏 · 山民故事与个人感悟（三空）\n\n**【题干原文】**\n\n> 例1（2022 江苏）\n> 作者以文学实录的形式写下的山民故事和个人感悟，______，情深意切。有的考证源流，有的用诗词歌赋表达山川秀美、古迹悠悠，有的记录______花海的一头幸福猪、古镇休憩中的一条藏獒，幽默之处常常引得读者______，有的讲述古城的故人故事，有的怀念家人朋友，感人至深。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 娓娓道来　徜徉　会心一笑\n> B. 滔滔不绝　徘徊　拍手叫好\n> C. 从容不迫　寄身　抚掌大笑\n> D. 侃侃而谈　闯入　忍俊不禁\n\n> PPT 上老师在选项旁写的词语注解（画面原文）：\n> - A 列：娓娓道来（形容谈论不倦或说话动听）／会心一笑（领会对方没表明的意思微微一笑）\n> - B 列：滔滔不绝（指话很多，说起来没个完）／拍手叫好（多指仇恨消除，也指赞赏）\n> - C 列：从容不迫（不慌不忙，沉着镇定）／抚掌大笑（形容非常高兴）\n> - D 列：侃侃而谈（理直气壮、从容不迫地说话）／忍俊不禁（忍不住要笑出声）\n> - 另有针对第二空四词的注解：徜徉（陶醉于某事物当中）／徘徊（犹豫，拿不定主意）／寄身（指托身，一般用于人）／闯入（突然进入、冲进）\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 文段分析 | 先弄清每一空所在句在说什么 | 第一空不知该句在干什么，不好判断；第二空情感色彩极明确 |\n| 2 第一空初筛 | 看搭配对象是否说得通 | 娓娓道来/滔滔不绝/侃侃而谈都\"是在说\"，跟\"写\"有关；从容不迫强调\"面对危险困难没有慌张\"，C 项先打入冷宫 |\n| 3 第二空定音 | 把握整句的积极/美好色彩 | 诗词歌赋、山川秀美、古迹悠悠、幸福猪、藏獒、幽默——全是美好积极，选\"徜徉\" |\n| 4 第三空验证 | 看程度轻重 | 会心一笑（领会对方没表明的意思，微微一笑）最贴\"幽默\"，抚掌大笑程度过重 |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。第一空\"娓娓道来\"形容谈论不倦或说话动听，与\"写下的山民故事和个人感悟\"\"情深意切\"相合；第二空\"徜徉\"（陶醉于某事物当中）与后文\"花海的一头幸福猪、古镇休憩中的一条藏獒\"的美好意境相合；第三空\"会心一笑\"意为领会对方没有表明的意思而微微一笑，正对\"幽默之处\"。\n- **B 项**：第二空\"徘徊\"是消极词，一般指犹豫不决（老师举例\"徘徊过多少橱窗\"——因为失恋了才徘徊）。\n- **C 项**：第一空\"从容不迫\"更强调**面对危险、面对困难没有慌张**，与\"写\"、与\"情深意切\"的匹配度不好；第二空\"寄身\"取自苏轼\"渺沧海之一粟\"\"长恨此身非我有\"，是\"这个身体只是暂时托身在这个地方\"的意思，**不是那么积极**，也排掉。\n- **D 项**：第二空\"闯入\"给人感觉不礼貌（\"别人都这么好了，悠悠、秀美，你说闯入了一头幸福猪，有点不礼貌了、煞风景\"），排掉。\n\n**【本题要点】**\n\n> ⭐ \"你看你感觉一下，别人这么优美，你说'闯入'了一头幸福猪，那这个猪就……给人感觉不礼貌了，煞风景，所以 D 排掉。**你不要凭感觉，老师我觉得猪就是要闯入——你得看看完整。**\"\n> ⭐ \"这个题第一空给人的感觉其实不是很好判断，因为你不知道这句话在干嘛；但**第二空就很好判断了**——读完'诗词歌赋、山川秀美、古迹悠悠、幸福猪、幽默'，你的第一反应就是非常积极、非常优美和美好。\"\n> ⭐ 关于第三空：\"**这叫程度轻重。** 会心一笑、拍手叫好、忍俊不禁都还不错，但'抚掌大笑'给人的感觉就有点**过**了一些。我们看逻辑填空一定要**对比着看**，不是说你这个词一定不对，而是相比'会心一笑'，你这个'抚掌大笑'相比'幽默'来讲有点太过了一点、夸张了一点，所以答案选 A。\"\n\n---\n\n### 例题 2｜2025 四川 · 恐龙足迹的保存条件（三空）\n\n**【题干原文】**\n\n> 例2（2025 四川）\n> 通常在含水率高、粒度细、黏度大的地层上留下的恐龙足迹要深，反之则浅；但又不能太湿、太细或太黏。太湿、太细可能保存不住，马上会被踩塌的物质______；太黏则会使留下的足迹变形而难以______；但也不能太干，太干则根本留不下足迹。总而言之，恐龙足迹的保存条件比较______，需要不多不少刚刚好。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 遮盖　甄别　严格\n> B. 淹没　保留　苛刻\n> C. 掩盖　采集　刁钻\n> D. 掩埋　识别　严苛\n\n> PPT 上的词语注解（画面原文）：\n> - 遮盖（从上面遮住、盖住）\n> - 淹没（被水覆盖或被其他物质浸没，常搭配水或声音）\n> - 掩盖（从上面遮住、盖住或隐藏、隐瞒）\n> - 掩埋（遮盖、埋藏）\n> - 甄别（考核鉴别，多指对真伪、优劣等进行区分）\n> - 保留（保存不改变、暂时留着不处理）\n> - 采集（收集、搜罗）\n> - 识别（辨认、分辨清楚）\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 进入情境、想画面 | 太湿太细、保存不住 → 物质被\"踩塌、盖住\"，遮盖/掩盖/掩埋都可以，但不能用\"淹没\" |\n| 2 第二空 | 抓\"变形\"到底意味着什么 | 变形 = 看不出来了 = 无法**识别**；跟\"保留\"\"采集\"没关系 |\n| 3 第三空 | 看语义与感情 | 严苛、苛刻、严格都是\"比较严格\"的意思，刁钻是形容人狡猾奸诈，排掉 |\n| 4 锁定 | 第二空即可锁定 | 答案 D |\n\n**【逐项解析】**\n\n- **A 项**：第二空\"甄别\"是\"考核鉴别、多指对真伪优劣进行区分\"（优中选优、\"某某甄选\"），与\"变形\"无关，排掉。\n- **B 项**：第一空\"淹没\"通常搭配**两个东西——水和声音**，不能搭配\"物质/土壤/地层\"；第二空\"保留\"也不对，因为\"保存不住\"说的是**太湿太细**那一种情况，太黏则不只是保存的问题。\n- **C 项**：第一空\"掩盖\"勉强可以，但第二空\"采集\"与\"变形\"毫无关系（\"苹果变形了，影响你采集吗？影响你保留吗？不影响，它只是可能长得不像苹果了\"），排掉。\n- **D 项**：✅ 正确。\"掩埋\"（遮盖、埋藏）符合物质被踩塌盖住的画面；\"识别\"（辨认、分辨清楚）正好对应\"变形而难以辨认\"；\"严苛\"对应保存条件的要求很严、条件比较\"严苛\"。\n\n**【本题要点】**\n\n> ⭐ **\"太黏则会使留下的足迹变形而难以______\"——变形就难以\"识别\"，一定不能识别。** 老师举自己的例子：\"老师今天脸部变形了，说我变形了，变形的重点是什么？**看不出来了。** 就跟你这好像不像张老师了，所以你看就无法**识别**。\"\n> ⭐ 关于\"甄别\"的辨析：\"甄别一般在什么地方用？**真伪优劣**。所以有的地方叫什么什么甄选，就是他帮你把好东西选出来了，是**优中选优**的意思。\"\n> ⭐ 关于\"淹没\"：\"**淹没通常搭配水和声音**。那这个东西很明显是物质，它肯定不是水，它应该是一些土壤，所以这个 B 没那么合适。\"\n> ⭐ **前后呼应**：\"这个'保留'其实在这儿——'太湿太细可能保存不住'，太黏则会怎么样？所以这个地方一定不能填保留，因为保留不住是**前面这情况（太湿太细）**。\"\n> ⭐ \"这个题稍微难一点，就是这个'甄别'，这就**对你的词语的积累要求更高一点儿**。\"\n\n---\n\n### 例题 3｜2022 四川 · 人无德不立（三空）\n\n**【题干原文】**\n\n> 例3（2022 四川）\n> 人无德不立，品德是为人之本。面对______的世界变局，要明辨是非、恪守正道；面对形形色色的外部诱惑，要保持定力、严守规矩；面对来之不易的美好岁月，要______、心怀感恩；面对强国强军的伟大事业，要______、勇于担当。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 纷繁复杂　安之若素　当仁不让\n> B. 眼花缭乱　知恩图报　一马当先\n> C. 扑朔迷离　饮水思源　责无旁贷\n> D. 一日千里　安居乐业　义不容辞\n\n> PPT 上的词语注解（画面原文）：\n> - 纷繁复杂（形容头绪、现象等杂乱）\n> - 安之若素（对反常现象或不顺利的情况，能像平常一样、毫不在意）\n> - 知恩图报（得到别人的恩德，要懂得回报与人）\n> - 饮水思源（喝水的时候想起水是从哪儿来的）\n> - 安居乐业（安定地生活，愉快地工作）\n> - 一日千里（形容进展极快）\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 找句式 | 看\"面对……，要……\"的**相同句式** | 四个\"面对……要……\"构成并列，横线处大意要与\"形形色色\"相近 |\n| 2 第一空 | 意思筛选 | 纷繁复杂、眼花缭乱、扑朔迷离意思都差不多（很乱、很多很乱），\"一日千里\"是快的意思，不对，排 D |\n| 3 第一空再筛 | 看搭配对象 | \"眼花缭乱\"与五官（眼睛、耳朵、鼻子）有关，一般**以人作为主体**，通常要加\"让人\"\"令人\"，所以 B 也不好 |\n| 4 第二空 | 抓顿号后的并列与\"感恩\" | \"要______、心怀感恩\"，与\"感恩\"并列 → 知恩图报、饮水思源；安之若素、安居乐业与感恩无关，排 |\n| 5 第三空验证 | 看是否与\"勇于担当\"最接近 | 责无旁贷（责任不能推给别人）最贴切 |\n\n**【逐项解析】**\n\n- **A 项**：第一空\"纷繁复杂\"意思对，但第二空\"安之若素\"（对反常或不合常态的情况毫不在意）**是面对不好的事情也能像平常一样对待**，与\"感恩\"无关；\"庄子说'知其无可奈何而安之若命'，也是一种处事的态度，它不是一种感恩\"，排掉。\n- **B 项**：第一空\"眼花缭乱\"虽意思相近，但这个词与五官有关、一般以人为主体，通常要加\"让人/令人\"，\"这个世界本身有眼睛吗？不是\"，所以不好；第二空\"知恩图报\"正确，但第一空已排。\n- **C 项**：✅ 正确。\"扑朔迷离\"（事物错综复杂，难以辨别清楚）搭配\"世界变局\"；\"饮水思源\"（喝水的时候想到水的源头是从哪儿来的）与\"心怀感恩\"并列；\"责无旁贷\"与\"勇于担当\"意思最接近——\"担当就是我扛在肩上，我没有旁贷，就是我没有把责任扔给别人\"。\n- **D 项**：第一空\"一日千里\"是**快**（形容进展极快）的意思，与\"世界变局\"的\"乱/杂\"不符；第二空\"安居乐业\"（安定地生活，愉快地工作）与\"感恩\"毫无关系，排掉。\n\n**【本题要点】**\n\n> ⭐ **第一空的双重筛法**：\"虽然说意思都好，但'眼花缭乱'这个词，如果你做题做得多的话就应该马上反应过来——**这个词跟五官有关系**（眼睛耳朵鼻子），一般以人作为主语会多一些。所以你说'面对眼花缭乱的世界'，是这个世界本身有眼睛吗？不是，一般加个'让人''令人'。\"\n> ⭐ **高端讲解（意思优先原则）**：\"这个题为什么你在第一空当中可以先把它（B）干掉？是因为这个时候 A、C 还有的选，是有更好的选。**假设这个题的第一空别的词意思都不对、完全不沾边儿，就给你一个'眼花缭乱'，你选不选？选。** 咱优中选优，你有更好的当然选更好的；你如果万一不行，那没办法，那也得选——**因为意思优先。它哪怕在使用上有点瑕疵，意思一定要对，一定要把老师这话记住。**\"\n> ⭐ 关于第三空的程度比较：\"责无旁贷——勇于担当，担当就是我扛在肩上，我没有旁贷，就是我没有把责任扔给别人，这不就担当起来了吗？其实'当仁不让'和'义不容辞'也可以，但'一马当先'这个词就不是那么的合适，因为这个词才是**领先**的意思（跑在最前面），相较于 C 来讲不如 C 的意思跟它最接近。**顿号单纯表并列时，选意思最接近的。**\"\n> ⭐ 老师预告：\"明天讲并列——**并列是我们逻辑填空考的非常多的考点，几乎是必考的。** 一般不表递进。\"\n\n> ⭐ 关于\"慌\"字的提醒（老师板书批注）：讲题时反复强调选字要**细致**——\"很多打一个字啊，不要说细致。知道吧？**细致，你给只给一个'细'不太好。**\"\n\n---\n\n## 五、词语辨析（角度二）：考对词语的多角度理解\n\n### 5.1 案例回顾：从三道题看\"多角度\"的必要性\n\n> 老师原话：\n> \"其实我们刚才通过三道题，大家可以发现，我们最基本的当然就是**释义**，就是基本的意思。那么除了基本的意思之外呢？**搭配对象、程度轻重、感情色彩、使用语境、宠词陪跑词和词语侧重。**\"\n> \"还有很多的角度，就是你不能只抓一个——特别对于考的比较多的词，你不能只抓一个。\"\n\n### 5.2 幻灯片原文（逐字抄录）\n\n> 幻灯片标题：**（一）正确认识逻辑填空题的解题思路**\n\n```\n2. 词语辨析——考对词语的多角度理解：\n   考察区分词语的角度，如基本释义、搭配对象、程度轻重、感情色彩、使用语境、\n   宠词陪跑词、词义侧重等\n\n   首先，基本释义是最本质的区别\n   （对词语的考察，考试大概分为意思的正确性，使用的合理性）\n   例：封闭的环境同时也很可能______文化的活力，使其停滞不前，甚至消亡湮灭。（消磨/释放）\n```\n\n> ⭐ 老师原话：\"虽然说角度这么多，但是**基本的释义是最本质的区别，这个是一定要满足的。**\"\n\n---\n\n## 六、两大考察方向：意思的正确性 vs 使用的合理性\n\n> 老师原话（本讲第二个金句级段落）：\n> ⭐ \"**对于我们公务员言语考试，对于词语的考察，大概有两个考察方向：一个叫意思的正确性，一个叫使用的合理性。每个地方它的比例是不太一样的。**\"\n> \"**国考一般更加侧重于考察意思的正确性。**\"\n> \"比如说某些地方，比如广东，大家都知道它一直一颗红星向太阳、政治站位很高，它一般就多考察**使用的合理性**。什么叫使用合理性呢？就是它的选词更加侧重于我们所说的那种**固定搭配**，就是咱们党和政府都这么用。**你不仅要用对，还得用好**，这叫使用的合理性。\"\n\n| 考察方向 | 含义 | 典型命题方 |\n| --- | --- | --- |\n| **意思的正确性** | 词的基本意思是否与文段吻合 | 国考最爱考察；联考、河南联考也以它为主 |\n| **使用的合理性** | 是否属于公考语境下的固定搭配（\"党和政府都这么用\"） | 广东等地占比更高 |\n\n> ⭐ **矛盾时的处理原则（本讲最重要的做题铁律之一）**：\n> \"如果两个都能兼顾就更好——意思也对，我们也经常用。比如**党员干部面对人民群众的要求，责无旁贷**：意思也对，然后也非常适合搭配在党员干部身上。\"\n> \"**但是如果当意思的正确性和使用的合理性有矛盾的时候，就是你感觉这个词它好像不该这么用，虽然意思是对的，但是好像不该这么用，有点问题，就像刚才那个眼花缭乱一样——但有矛盾的时候，你就应该优先尊重意思的正确性。**\"\n> \"只要这个要求它达到就可以了。你能不能一味的追求使用的合理性，而去忽略意思的正确性？**一定不行。**\"\n> \"就像刚才举的例子'释放'——你说'释放活力'非常好、很恰当、搭配很得当，但是意思不对，行不行？**一定不行。**而这个'消磨'，你可能说没见过这个用法，但它**意思对，那就选意思对的。**\"\n> \"国考题是最爱考察意思的正确性的，所以国考题为什么严谨一些？联考包括河南联考题，它可能两方面会均衡一点点，但**还是以意思的正确性为主**。\"\n> ⭐ \"**你可以牺牲一定的使用合理性，但一定要满足你的意思正确性；你不能为了满足使用的合理性而牺牲意思的正确性，这是一定不行的，它是基本条件。**\"\n\n---\n\n## 七、词语辨析七大角度逐项精讲\n\n> 七个角度全览（PPT 罗列顺序）：**① 基本释义 ② 搭配对象 ③ 程度轻重 ④ 感情色彩 ⑤ 使用语境 ⑥ 宠词陪跑词 ⑦ 词义侧重**\n> 老师在 PPT 上把\"基本释义\"圈出并批注\"首先，基本释义是最本质的区别\"。\n\n### 7.1 角度（1）：搭配对象\n\n> 幻灯片原文：\n\n```\n（1）有些词语，可以从搭配对象的角度区分：\n\n骇人听闻：使人听了非常吃惊、害怕。指实际存在（搭配真事儿的），但让人不敢相信的事。\n耸人听闻：夸大或捏造事实，使人听了感到惊异或震动。\n危言耸听：故意说些夸大的吓人的话，使人惊疑震动。指被捏造、夸张出来的事（搭配虚假的）。\n授予：郑重地给予。（多与奖励、荣誉相关）\n给予：给、赠送、使别人得到、也作给与。（搭配对象更为宽泛）\n喜闻乐见：让大家喜闻乐见（多以人作为主体）\n深入人心：这个理论深入人心（多以思想、理论作为主体）\n```\n\n> 老师原话：\n> \"同样一些词语，比如**骇人听闻**这个词，给人感觉就是吃惊害怕；**耸人听闻、危言耸听**可能也是让人吃惊害怕。怎么办呢？如果你积累过后就知道：**骇人听闻一般搭配真事儿**——这确实让人感觉很震惊，但却是真的；而**带'耸'字的大概就是假的**，就假的事情，这就是搭配对象。\"\n> \"还有**授予和给予**：言语它不考读音，授予和给予虽然都有'给'的意思，但**授予一般搭配奖励和荣誉相关，而给予搭配对象更广泛一些**。\"\n> \"还有**喜闻乐见和深入人心**：喜闻乐见**通常以人作为主体**，你看是不是跟耳朵有关系？'耳目'就跟五官有关系的。**因为五官长在人身上，所以跟五官相关的一些词语大概就是以人作为主体。**而深入人心——你看它已经有一个'人'了，所以它就不需要以人作为主语，可以直接以**思想、理论**为主体。\"\n> ⭐ \"有些适合搭人，有些适合搭物，有些适合搭真，有些适合搭假。那么我们在积累词语的时候，**你就不能只记'让人惊异和震动'，你还要记什么？记真假。** 一定要多角度去积累。\"\n\n### 7.2 角度（2）：程度轻重\n\n> 幻灯片原文：\n\n```\n（2）有些词语，可以从程度轻重的角度区分：\n\n千丝万缕、息息相关、息息相通：呼吸相关联，比喻关系非常密切。\n如影随形、形影不离：好像影子老是跟着身体。比喻两个事物关系密切或两个人关系密切不能分离。\n同气连枝、情同手足：比喻像同胞的兄弟姐妹般关系亲近。\n休戚相关、休戚与共 / 利益相关、利害相关、祸福相关（形容利益共同体）\n唇亡齿寒、唇齿相依：比喻两者关系密切，利害相关。\n```\n\n**老师给出的\"由轻到重\"排序（板书批注\"轻\"\"重\"两端）：**\n\n```\n轻 ────────────────────────────────────────────► 重\n\n千丝万缕 / 息息相关 / 息息相通\n      ↓\n如影随形 / 形影不离\n      ↓\n同气连枝 / 情同手足\n      ↓\n休戚相关 / 休戚与共（利益共同体）\n      ↓\n唇亡齿寒 / 唇齿相依（生死存亡）\n```\n\n> 老师原话：\n> \"你查词典全都是'关系密切'六个字、四个字，从第一个千丝万缕到后面的唇亡齿寒，其实都是关系很密切，那怎么办呢？你就得找角度分析。其实老师就按照**由轻到重**做了一个排序。\"\n> \"这个你别看它解释的意思好像很重，但是**千丝万缕、息息相关它其实要求没那么高**：比如'我和在座的各位都有千丝万缕的联系'，万事万物之间都可以是息息相关的。**哲学讲过联系的普遍性嘛。**\"\n> \"但是第二个（形影随形、形影不离、如影随形）就稍微有点重了：比如两个好闺蜜好哥们儿，从小到大，形影不离。你不能说我和各位形影不离，那就有点重了一些。**你可以用息息相关，但不能用形影不离。**\"\n> \"同气连枝、情同手足是不是就更重了？这就不是一般的关系了——金庸《笑傲江湖》里面说的是'五岳剑派同气连枝'。\"\n> \"倒数第二个**休戚相关、休戚与共**，这就是非常非常重的联系了，就是**利益共同体**：他好我也好，我好他也好。比如我现在跟上岸村就是休戚相关。那我跟你们就不太好用。\"\n> \"那最后一个就更重了嘛，**唇亡齿寒、唇齿相依**，就是 'you jump, I jump'，你没了我也没了，这是**生死存亡**的关系。\"\n\n> ⭐ **实战保险原则（老师反复强调）**：\n> \"假设有一道题，你非常纠结，到底是选**息息相关**还是选**休戚相关**，你应该选哪个？\"\n> \"**选息息相关。为什么？因为它的要求很低，要求低就意味着任何两个对象都可以用它，不太容易出错——它的使用范围广。**而'休戚相关'这个词就有点窄了。\"\n> ⭐ \"**除非当你不确定的情况下——我说的是不确定**，你如果能确定很重，当然选重的那个；如果你不确定的情况下，你选'息息相关'就稍微保险一点。\"\n\n### 7.3 角度（3）：感情色彩\n\n> 幻灯片原文：\n\n```\n（3）有些词语，可以从感情色彩的角度区分：\n\n蔚然成风：多指某件有意义的事情经过提倡推广，逐渐形成一种社会上普遍流行的风尚（积极）\n风靡一时：形容一个事物在一个时期非常盛行，像风吹倒草木一样。（中性）\n大行其道：某种思想、理论或时尚等盛行一时（多贬）\n```\n\n| 词语 | 感情色彩 | 释义 |\n| --- | --- | --- |\n| 蔚然成风 | **积极（褒义）** | 多指某件有意义的事情经过提倡推广，逐渐形成一种社会上普遍流行的风尚 |\n| 风靡一时 | **中性** | 形容一个事物在一个时期非常盛行，像风吹倒草木一样 |\n| 大行其道 | **多贬义** | 某种思想、理论或时尚等盛行一时 |\n\n> 老师原话：\n> \"同样都是**很流行**的意思，那侧重点来讲的话，**蔚然成风一般偏积极，风靡一时偏中性，大行其道偏消极**。\"\n> \"我知道有的说'老师这个词曾经做过中性词'——**凡是不是绝对的**。比如那个什么火箭的题、一箭多星那个题，它可能用的就是这个词（大行其道）作为中性词；**但是它大概还是从概率来讲多贬义，偶尔中性、多贬义**。这就是感情色彩，意思都差不多，都是流行，但有感情的区分。\"\n\n### 7.4 角度（4）：使用语境\n\n> 幻灯片原文（老师批注：\"使用语境，**这是最难的**\"）：\n\n```\n（4）有些词语，可以从使用语境的角度区分：\n\n相得益彰：两件可以独立的事物互相配合，有好的效果（1+1>2的效果）\n相辅相成：更加强调相互辅助的事物之间是缺一不可的关系。\n水乳交融：关系非常融洽或结合十分紧密（常形容党群关系）\n珠联璧合：美好的且性质相似的人或事物凑在一起\n交相辉映：一般指景色所发出的光亮色彩互相映照，一般不太形容两者的影响\n取长补短：强调交流互通，学别人的长处，文段有明确的长处分短处\n```\n\n| 词语 | 使用语境 / 关键要求 | 老师举的例子 |\n| --- | --- | --- |\n| 相得益彰 | 两件**可以独立**的事物互相配合，有好的效果（1+1>2） | 男女搭配干活不累；\"你不合作也无所谓，在一起更好\" |\n| 相辅相成 | 更加强调相互辅助的事物之间是**缺一不可**的关系 | \"任何一堂课程都是老师和运营的共同努力的结果，二者就是相辅相成，缺一不可\" |\n| 水乳交融 | 关系非常融洽或结合十分紧密，**常形容党群关系** | \"我们经常说保持和人民群众之间的血肉联系\" |\n| 珠联璧合 | **美好的且性质相似**的人或事物凑在一起 | 梁思成与林徽因是一对璧人；强强联合 |\n| 交相辉映 | 一般指**景色**所发出的光亮色彩互相映照，**一般不太形容两者的影响** | 蓝天白云、房屋道路、灯火 |\n| 取长补短 | **必须有长有短**，文段要明确告诉你长处与短处分别是什么 | \"你得告诉我你的长在哪儿短在哪儿\" |\n\n> 老师原话：\n> \"**这是最难的——最难的就是这个词到底什么时候用。**\"\n> \"比如**相得益彰**，一般是形容两个可以独立的事物互相配合：比如男女搭配干活不累，就是男人和女人分工协作、合作更好；你不合作呢也无所谓。但**相辅相成**它更加强调**不能缺一**、不能分开。任何一堂课程都是老师和运营共同努力的结果，二者就是相辅相成、缺一不可。\"\n> \"**水乳交融**多数形容党群关系。大家写申论、写过面试吧？我们经常说保持和人民群众之间的血肉联系，所以它一般形容党群关系。\"\n> \"**珠联璧合**——珠璧嘛，珍珠美玉，就形容一定是非常好的东西合作、强强联合这种感觉，美好的人和事儿凑在一块儿。\"\n> \"**交相辉映**一般就形容**外在的光亮色彩景色**，比如蓝天白云交相辉映；它一般不形容互相之间的影响，我们考试当中一般指景色、外在的景色用得更多一些。\"\n> \"**取长补短**，你有取长补短，是不是得有长有短？**所以但凡用这个词语，它就得告诉我长短分别是什么。**\"\n> ⭐ \"当你满足这些要求的时候，你才能使用相对应的词语。**你看上去好像都是互相配合，但是它是有区别的**——这就需要大家平时做题去积累。\"\n> ⭐ \"就**跟你们学英语单词一样**：你不要只背后面那个单词表，你要把这个词放在它使用的句子当中去理解。\"\n\n### 7.5 角度（5）：宠词 / 陪跑词\n\n> 幻灯片原文（老师把\"宠词\"\"陪跑词\"圈出，写下\"高手\"）：\n\n```\n（5）甚至，可以从宠词/陪跑词的角度区分：\n\n独善其身：多指只顾自己，不管他人（现在多用于在大环境不好下，小个体难以保障自身）\n应运而生：指适应时机而产生（多指事物的出现不是凭空突然的，而是有缘由的）\n相得益彰：相互配合的好，各方的长处就更能显现\n南辕北辙：比喻行动跟目的相反\n互为表里：甲为乙的外表，乙为甲的内里；比喻互相依存，互相接受\n无与伦比：事物非常完美，没有能够与它相比的同类的东西\n```\n\n> **定义（老师口述）**：\n> ⭐ \"什么叫**宠词**呢？就是**考的又多，作为正确答案的概率又高**——就跟那个宫里的妃子受宠一样。\"\n> ⭐ \"什么叫**陪跑词**呢？就是他考的虽然好像也挺多，但是**他很少作为答案**。\"\n\n| 类别 | 词例 | 老师点评 |\n| --- | --- | --- |\n| **宠词**（高频 + 高正确率） | 独善其身、应运而生、相得益彰 | \"大家应该做多了，会发现**经常作为答案**\" |\n| **陪跑词**（高频 + 极少作答案） | 南辕北辙、互为表里、无与伦比 | \"这就很少作为答案，基本上就可能就一两次吧\" |\n\n> 老师对\"陪跑词\"原理的剖析：\n> ⭐ \"为什么有些词容易作为陪跑词呢？**原理很简单：因为这些词的要求太高了。**\"\n> \"这个词为什么作为答案概率更低？可能是因为这个词**使用的概率比较低**；为什么使用概率比较低？是因为这个词**使用的范围比较窄、比较极端**。\"\n> \"比如**无与伦比**——你谁呀？咱们中国人讲究谦虚，你又不是周杰伦，你敢说自己无与伦比吗？正常人说话不会这么夸自己的。\"\n> \"包括**南辕北辙**——你到底有多不聪明？你到底犯了多大的错误，导致完全相反呢？一般情况下不至于。**就这些词有点太窄了、太极端了一些，所以某种意义上它作为答案的概率就低。**\"\n\n> 老师对\"宠词\"的用法示范：\n> - **独善其身**（大小关系）：\"在整个大的经济环境下，每一个个体都难以独善其身。\"\n> - **应运而生**（因果）：\"它特别适合**这个事情的出现是有原因的**，不是凭空出现的。比如随着公务员考试逐渐热门，公务员培训这个行业应运而生。\"\n> - **互为表里**（内外关系）：\"2019 年（记不太准）当时它是形容**形式主义和官僚主义互为表里**——形式主义是官僚主义的表，官僚主义是形式主义的里，它有内外关系。因为很少有的题是纯粹说内外关系的，所以它就很少作为答案。\"\n\n### 7.6 角度（6）：词义侧重（尤其是\"实词\"）\n\n> 幻灯片原文（老师批注\"实词\"）：\n\n```\n（6）实词一般对比难度更大，更加考察一些词语的固定搭配用法\n\n（2023 联考）\n在漫长的发展历史中，二十四节气已经成为中华民族共有的认知文化系统，______着中国各民族\n人民的伦理情感、生命意识、审美情趣和信仰……\nA. 凝结　B. 聚集　C. 凝聚　D. 粘合\n\n（2024 江苏）\n……面对人工智能等新兴科技带来的挑战，______不同学科、不同领域的力量，积极探索如何\n解决诸如人工智能和机器人伦理问题。\nA. 聚集　B. 汇聚　C. 融合　D. 整合\n```\n\n> **答案**：第一题 **C 凝聚**（老师圈 C，划掉 A、B、D）；第二题 **D 整合**（老师圈 D）。\n\n> 老师原话：\n> \"为什么实词难呢？因为**实词确实就容易考察一些固定搭配的用法**。\"\n> \"各族人民（的）伦理情感、生命意识、审美情趣和信仰，哪个词特别适合形容好的东西？它放在一起，哪个词就特别适合？**就是凝聚。**\"\n> \"为什么不选凝结？**你就属于题做少了**——就但凡你这种官方的文章做的比较多的话，就应该知道，就这个词太容易作为答案了。为什么？因为**凝聚相比凝结，它给人的感觉凝聚力更强一些：凝结只是结在一块儿，那可能是一盘散沙；而凝聚多了一种'凝聚'的感觉，就是心往一处想、劲往一处使**。这两个词（聚集、粘合）就有点偏口语化了一些，或者一般形容物理现象会多一点。\"\n> \"第二个，不同的东西，你看我们政府面对不同的一些资源，用得最多的就是**整合**——整合资源、整合不同学科、整合各方的力量。**这就全靠你积累了，这某种意义上讲真的靠你的积累和预感。**别的词也不是说语法不对、意思不对，但是就是不如这个词好，这就是需要靠你积累固定搭配的地方。\"\n> \"**融合和整合是不一样的**：融合就是使它们完全变成一个东西；**整合是整理合并，有一种重新安排的意思**——比如我手头有物流的、有房地产的、有快递的、有食品的，我把我的资源再整合一下，就它是一种**重新的梳理和安排**的意思。而融合是完全合成一个东西，它的意思不是说把不同的学科变成一个东西，是好好的去整理、去利用一下。\"\n> \"**汇聚就更不行了**——'汇'就简单堆在一起吧，他没有这种整理的感觉呀。包括**聚集跟汇聚的意思差不多，就单纯的放在一起而已，就没有这个整理的感觉。**\"\n> ⭐ \"所以大家平时做题的时候也可以这样去想：**为什么选他不选他？你们要自己想知道吧？老师是教不完的。**\"\n\n> 幻灯片原文（第七个角度）：\n\n```\n（7）除了上述角度外，也可以结合词义侧重的方式区分，这更需要我们主动思考\n\n· 广东人大首次尝试用立法手段对行政审批进行管理监督，有望从源头上______地方政府增加\n  行政审批的冲动。　（遏制 & 遏止）\n· 20 世纪 90 年代，有人______传统书信将被新兴的通信方式取代。　（坦言 & 预言）\n· 通过与国家的主动接触与互动，______与政府的相关性，并以协作或合作的方式参与社会问题的\n  解决。　（保持 & 维持）\n```\n\n> 老师原话（\"词义侧重\"的核心方法）：\n> ⭐ \"**什么叫词义侧重？就有两个词长得很像，那你要根据不一样的那个字去猜测这个词的侧重点**——就拿这个不一样的字去猜。你看，都有'遏'嘛，一个'制'、一个'止'；一个'坦'、一个'预'；一个'保'、一个'维'。\"\n\n**① 遏制 / 遏止**\n\n> \"文段说'首次尝试'——你想首次尝试，你就能够完全的制止吗？**是不是有点太理想化了一点？**\"\n> ⭐ \"**一个是制约，就稍微踩个刹车；'止'呢，哎，赶紧停止**——那这个就太重了一些，所以它俩就是程度的问题。文段的程度到底重不重呢？**'首次尝试'，可能经验也不是很丰富，不一定能够一步到位，所以顶多用'遏制'。**\"\n\n**② 坦言 / 预言**\n\n> \"20 世纪 90 年代就有人怎么样：将被新兴方式取代——是不是对未来的**一种预判**？那对未来的预判，那就不是坦言，而是**预言**。**因为坦言是现在完成时——我现在坦言我很慌张。**\"\n\n**③ 保持 / 维持**\n\n> ⭐ \"这两个词，你们如果查词典会发现：'保持'什么意思？维持。'维持'什么意思？保持——**互相解释。所以我为什么说词典没什么用呢？**\"\n> ⭐ \"你得自己去分析，自己去给它举例子。**'保持'给人的感觉就是从从容容、游刃有余**——比如我保持健康、保持一个乐观的状态，感觉还挺没有那么的费劲儿。**但'维持'给人的感觉有点艰难**——比如我要把我的体重维持在多少多少斤、我要维持我的生存，那这个维持就有点**要咬着牙**的感觉了。\"\n> ⭐ **新闻联播的\"微言大义\"例子（本讲最精彩的一段）**：\"前几年我们中国 GDP 高速增长，我们要说'**保持**我们今年 GDP 百分之八的增长'（保八），透出的就是一种**从容**。但如果我们的新闻媒体报道**日本**——比如日本去年 GDP，它用什么词呢？'**日本 GDP 维持在百分之一**'。你看这个小心思就露出来了：**你日本，你这你能有'一'就不错了，你这个'一'已经很难了，稍微一不注意你就往下掉了，用的就是'维持'。这就是微言大义。**\"\n> \"所以这个题说'通过与国家主动接触'——**主动接触是不是很积极？很积极，那就选'保持'**：保持和政府的相关性，并以协作方式来参与社会问题的解决。\"\n\n### 7.7 词语积累的正确途径（优先级排序）\n\n> 老师原话（收束\"词语辨析\"这一大块）：\n> \"虽然说基本释义是词语辨析的根本角度，但是有的时候你光有一个基本释义是不够的，你还需要这么多的角度。那老师，这么多我都能记吗？**不是。有的考得比较多的，就记得多一点儿；有些冷门词就光记意思就可以了。**\"\n\n```\n第一（最权威）：以史为鉴——通过刷真题\n              看这个词作为正确答案时，真题的文段是怎么写的\n              （可以去题库，如\"粉笔题库\"比较全，查某词作为正确答案时的文段）\n第二：听课听老师怎么讲（但是被动的）\n第三：权威文章和媒体——人民日报、新华网、光明日报、新闻联播\n      学习他们的用词，培养正确的语感\n最后：词典——\"光知道意思没有用\"，其实不太关键\n```\n\n> ⭐ 老师总结：\"**考的越多，你记的角度就应该越多；考得越少，你就知道意思就可以了。**\"\n> ⭐ \"一定要多刷题，多刷题。\"\n\n> 老师在《词义侧重》这一页的空白处板书了\"积累途径\"的四步排序（课堂实录）：\n> ```\n> 1. 真题为主\n> 2. 听课\n> 3. 权威（媒体）\n> 4. 词典\n> ```\n\n---\n\n## 八、例题精讲（第二批）\n\n> 老师开场口播：\"好，我们到这儿告一段落，我们来看看后面题目。\"\n> 老师反复强调：\"**咱们这十二箭题目其实没那么重要**，因为很多同学都做过，**主要为了讲知识点、讲原理。**\"\n\n### 例题 4｜2025 天津 · 金融资源配置与数字鸿沟（两空）\n\n**【题干原文】**\n\n> 例4（2025 天津）\n> 长期以来，我国区域间、城乡间的金融资源______存在异质性差异，金融资源的不平衡分布会加速经济发展的\"马太效应\"。数字金融能够______区域间、群体间的\"数字鸿沟\"，促进资金的公平分配和经济的包容性增长。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 规划　填平\n> B. 共享　跨越\n> C. 储备　淡化\n> D. 配置　弥合\n\n> PPT 上的词语注解（画面原文）：\n> - 规划（计划安排，侧重对未来）\n> - 共享（共同享有）\n> - 储备（储存以备应用）\n> - 配置（配备布置）\n> - 填平（填补满）\n> - 跨越（跨过、超越）\n> - 淡化（弱化、减弱）\n> - 弥合（使愈合，填满）\n\n> PPT 底部还有两条\"以史为鉴\"的官方媒体例证（画面原文）：\n> - （人民网）优化资源配置　释放发展潜力\n> - （人民网）弥合数字鸿沟　推动数字经济发展\n\n**【答案】** ✅ **D**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 搭配资源其实没有哪个不能搭，要看哪个意思不对 | \"规划\"一般是对未来的规划（职业规划），\"长期以来\"用规划不是很好 |\n| 2 第一空排 B | 意思为王：前后矛盾 | \"如果你都共享了，哪儿来的差异呢？你都共享了，怎么会有不平衡呢？\"——**共享一定不对** |\n| 3 第一空定 | 只剩储备、配置 | 之前的资源的一些储备、一些配置，就是一些分布，它可能不太平衡 |\n| 4 第二空 | 搭配\"数字鸿沟\" | 淡化和弥合大方向都还行，但\"鸿沟怎么淡化呀？只能是什么？弥合，就是填满的意思\" |\n| 5 结论 | 答案 D | \"这个题大家很想选跨越……**不是说跨越有问题，而是这个共享一定不对**\" |\n\n**【逐项解析】**\n\n- **A 项**：第一空\"规划\"侧重对未来（计划安排），与\"长期以来\"的已然语境不符，排掉。\n- **B 项**：第一空\"共享\"与后文\"存在异质性差异\"\"不平衡分布\"自相矛盾——\"**你都不平衡了，那肯定还没共享啊**\"，这是\"意思为王\"的典型考法，排掉。（第二空\"跨越\"本身是比\"淡化\"\"弥合\"更好的搭配，但第一空已废。）\n- **C 项**：第二空\"淡化\"（弱化、减弱）不能搭配\"鸿沟\"——\"鸿沟怎么淡化呀？\"，排掉。\n- **D 项**：✅ 正确。\"配置\"（配备布置）与\"金融资源\"是官方标准搭配（人民网：\"优化资源配置\"）；\"弥合\"（使愈合，填满）与\"数字鸿沟\"是官方标准搭配（人民网：\"弥合数字鸿沟\"）。\n\n**【本题要点】**\n\n> ⭐ **心态提醒（老师讲完这题后的一段掏心窝子的话）**：\"这个题一旦做错了，你的反应，我希望大家不是说'老师，我怎么又做错了'，我希望大家的反应是'**今天我又学到新东西了**'。你以前觉得不能这么用，发现哦它可以这么用。**你要有一个积极的心态。**你看人民网说了'优化资源配置，释放潜力''弥合数字鸿沟，推动发展'。**要有积极的心态，要抱这种学到新东西的心态来对待自己的错误。**\"\n> ⭐ \"我们之前讲过，**你提高一定是一个痛苦的过程。**\"\n> ⭐ 老师还提醒：\"这两个词（资源配置、弥合）平时千万别弄错、**也别弄混**。\"\n\n---\n\n### 例题 5｜2023 国考 · 冰川消融与科学应对（两空）\n\n**【题干原文】**\n\n> 例5（2023 国考）\n> 在气候变暖背景下，冰川是变化最快速、最显著和最具______的地理要素之一。过去 50 年来，由于气候变暖，全球冰川加速消融，造成海平面上升、水循环变化、冰川灾害增加，引发人们高度关注。应用科学方法，______冰川消融、保持水资源的可持续利用，在当前区域迅速增温、冰川快速退缩的情境下，显得尤为重要。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 指示性　缓解\n> B. 直观性　避免\n> C. 动态性　干预\n> D. 通用性　防止\n\n> PPT 上的词语注解（画面原文）：\n> - 缓解（减轻或改善不好的东西）\n> - 避免（设法不使某种情形发生）\n> - 干预（过问或影响别人的事）\n> - 防止（预先设法制止某事发生）\n> - 指示性：起到对客观事物某种状态的指明、显示作用\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 三并列（\"最快速\"\"最显著\"\"最具______\"）不好判断，**建议先不看第一空** | 三并列可以一样、可以不一样，比较复杂（明天讲） |\n| 2 第二空 | 看语境能不能\"让它不发生\" | 开篇\"由于气候变暖\"已经是一个全球大趋势，\"你能让它不发生吗？你能完全阻止它消融吗？\" |\n| 3 排 B、D | 避免、防止都表示\"设法不使发生\" | 不符合文意，排掉 |\n| 4 看 C | 干预是否够明确 | \"干预是让它变得更快还是更慢呢？更快也是干预，更慢也是干预\"，太中性、不清晰 |\n| 5 定 A 并回验第一空 | 用第一空验证 | \"指示性\"就是能够起到一种指明显示作用——冰川是最明显的线索 |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。\"缓解\"（减轻或改善不好的东西）与\"冰川消融\"搭配，\"我是要让它没有那么快\"；\"指示性\"指\"起到对客观事物某种状态的指明、显示作用\"，冰川是气候变化最明显的线索。\n- **B 项**：第二空\"避免\"（设法不使某种情形发生）——\"别人文的开篇就告诉你了，全球气候变暖的背景下，由于气候变暖，它已经是一个大事了，你能够让它不发生吗？\"\n- **C 项**：第二空\"干预\"\"可以是可以，但干预就有点像我们中心理解——你干预是让它变得更快还是变得更慢呢？**更快也是干预，更慢也是干预，那你为啥不选'缓解'呢？**\"这个词就显得有点太中性了一些，不太清晰、不明确。\n- **D 项**：第二空\"防止\"（预先设法制止某事发生）——\"你能说你作为一个人，你能让这个冰川不再消融了吗？这就叫避免、这叫防止。**你自己想能不能**，它这已经是一个大的背景了，是一个全球的大趋势。\"\n\n**【本题要点】**\n\n> ⭐ **\"第二空定生死\"原则**：\"当你第一空不好判断的时候，那就通过第二空答案，基本上锁定 A 项了。\"\n> ⭐ \"**当你第二空 B、C、D 不对的时候，你第一空再好有用吗？没用。不用纠结，直接选 A 就可以了。**\"\n> ⭐ \"所以你这个时候在考场上，你能很确定答案选 A，就**不用纠结这个 B、C、D 了**。\"\n> ⭐ 关于第一空三并列：\"其实我觉得意思上没有什么太大的毛病，但是第二空 B、C、D 一定不对。\"（第一空的三并列辨析**留到明天**讲）\n\n---\n\n### 例题 6｜2023 江苏 · 科技强国与\"科创策源地\"（三空）\n\n**【题干原文】**\n\n> 例6（2023 江苏）\n> 新一轮科技和产业革命风起云涌，席卷全球。各大科技强国的中心城市______，力图摘取全球\"科创策源地\"这一______，这是一个能够激起世界级城市管理者内心澎湃的宏伟目标。作为策源地，不仅意味着科学上的领先，还意味着最先进的高科技产业和最具创新能力的企业家的集聚，能够在城市中水乳交融，______，向外源源不断地释放出能量。\n> 依次填入画横线处最恰当的一项是：\n\n**【选项原文】**\n\n> A. 争先恐后　盛誉　交相辉映\n> B. 各显神通　美称　互通有无\n> C. 各尽所能　桂冠　相得益彰\n> D. 尽心尽力　殊荣　取长补短\n\n> PPT 上的词语注解（画面原文）：\n> - 交相辉映（各种光亮、色彩互相映照）\n> - 互通有无（拿自己多余的东西与之交换，得到自己所缺少的东西）\n> - 相得益彰（相互帮助，相互补充，更能显出各自的好处）\n> - 取长补短（吸取别人的长处，来弥补自己的不足之处）\n> - 水乳交融：像水和乳汁那样融合在一起，比喻关系非常融洽或结合得很紧密\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 各显神通、争先恐后、各尽所能、尽心尽力好像都还行，不好判断 | 先放一放 |\n| 2 第二空 | **考固定搭配**：谁能搭配\"摘取\"？ | \"摘取桂冠\"——把帽子摘下来，\"它比'盛誉''美称''殊荣'要好得多\" |\n| 3 初定 | 答案大致是 C，但**不能确定** | 还得看第三空 |\n| 4 第三空 | 与\"水乳交融\"构成并列 | 高科技产业 + 最富创新力的企业家 = **强强联合** → 相得益彰 |\n| 5 结论 | 答案 C | 逐项排除其它三空 |\n\n**【逐项解析】**\n\n- **A 项**：第三空\"交相辉映\"——\"我刚才讲过，一般形容**光亮色彩、外在的景象**\"，不形容两者的配合，排掉。\n- **B 项**：第三空\"互通有无\"——\"一般形容**消息之间的交换**，比如我们俩之间互通有无，你把你知道的告诉我，我把我知道的告诉你。你说产业和企业家能够互通有无吗？它一般是**同类之间才能互通有无**\"，排掉。\n- **C 项**：✅ 正确。\"各尽所能\"与\"力图摘取……桂冠\"匹配；\"桂冠\"（冠军的称号，也指竞赛中的第一名）与\"摘取\"是固定搭配；\"相得益彰\"（相互帮助，相互补充，更能显出各自的好处）形容科技产业与企业家之间的强强联合。\n- **D 项**：第三空\"取长补短\"——\"大家告诉我文段中有讲长处和短处吗？**都是长处，没有短处，就不存在取长补短啊**\"，排掉。\n\n**【本题要点】**\n\n> ⭐ **固定搭配的威力**：\"这个题就考了固定搭配——**摘取**。你如果知道这个搭配的话，就能非常好的做出来。是哪个词最能搭配摘取？你看摘下来，把帽子摘下来——**桂冠**。\"\n> ⭐ \"**有的题就喜欢考固定搭配。你如果能够看到'摘取'并且知道这个搭配的话，做起来就更简单一些。** 当然如果你不知道也可以做，第三空也可以做。\"\n> ⭐ \"**第一空大家看的好像差不多，反正就是革命风起云涌嘛，大家都在竞争。**\"\n\n---\n\n### 例题 7｜2024 江苏 · 南极北极的\"别有洞天\"（两空）\n\n**【题干原文】**\n\n> 例7（2024 江苏）\n> 北极和南极是地球的极巅（画面显示为\"极巅\"，字迹较细，亦可能为\"极冠\"），它们遥相呼应，各据一方。冰天雪地是极地的特色，寒冷干燥是那里的常态，那里______，生态环境却别有洞天，企鹅在南极雪地疾走，白熊在北极冰水游泳，苍鹰在高峰之巅盘旋……神奇的世界、迷人的景象，令人______。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 与世隔绝　心旷神怡\n> B. 寸草不生　怦然心动\n> C. 人迹罕至　心驰神往\n> D. 冰冻三尺　赏心悦目\n\n> PPT 上的词语注解（画面原文）：\n> - 心旷神怡（心情愉快，精神舒畅）\n> - 怦然心动（受某种事物的刺激，思想、情感突然起了波动）\n> - 心驰神往（思想集中在追求和向往的事情或地方上）\n> - 赏心悦目（因看到好的事物而心情欢畅）\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 抓关联词 | 后面有\"**却**\"，是转折 | 转折其实比较简单（本系列课没单独讲逻辑填空的转折）——\"相反\"，后面\"别有洞天\"偏积极，前面就得偏消极 |\n| 2 关键分寸 | **消极归消极，不能完全相反、不能矛盾** | \"与世隔绝\"\"人迹罕至\"甚至\"冰冻三尺\"都能接受，但\"寸草不生\"就怪了 |\n| 3 排 B | \"寸草不生\"= 连草都不长（环境非常恶劣），与后文有企鹅、白熊、苍鹰**前后矛盾** | \"你到底长不长呀？\" |\n| 4 第二空 | 人在不在这里？ | 文段说\"**那里**\"——说明你人不在那儿，所以只能\"心驰神往\" |\n| 5 结论 | 答案 C | 而且 C 比 B 语义更丰富 |\n\n**【逐项解析】**\n\n- **A 项**：第一空\"与世隔绝\"可以接受，但第二空\"心旷神怡\"（心情愉快，精神舒畅）是**人已经在场**才能发出的感叹，与\"那里\"不符，排掉。\n- **B 项**：第一空\"寸草不生\"——\"什么叫寸草不生？它是形容环境非常恶劣，不是说不长草，是**连草都不长**。那你后面再说'这儿有企鹅、有白熊、有苍鹰'，这叫**前后矛盾**。我举个例子：'今年我上岸了，但是我没上岸'——不是哥们，你到底上了没呀？\"排掉。\n- **C 项**：✅ 正确。\"人迹罕至\"（人的足迹很少到达，形容地处偏僻）与前文\"寒冷干燥是常态\"的偏消极色彩吻合，又不与后文的生机矛盾；\"心驰神往\"（思想集中在追求和向往的事情或地方上）正合\"那里\"的远距离视角。\n- **D 项**：第一空\"冰冻三尺\"虽可接受，但第二空\"赏心悦目\"（因看到好的事物而心情欢畅）同样要求**人已身临其境**，排掉。\n\n**【本题要点】**\n\n> ⭐ **\"转折可以相反，但不能矛盾\"（本讲第三个金句级原理）**：\n> \"你消极归消极，你不能完全相反。所以这个题我认为你说'我与世隔绝''人迹罕至'，你甚至说'冰冻三尺'，我都能够接受；**但是你说'寸草不生'就有点怪了**……这叫前后矛盾。**转折，你可以相反，但你不能矛盾。**\"\n> ⭐ **第二空的核心区分（视角法）**：\"什么时候会说心旷神怡？比如你正在云南大理苍山洱海，坐在海边山脚下、在这个有风的地方吹着凉风、喝杯咖啡，叫心旷神怡——**那是因为你真的去了，你的人已经在那儿了**，你才能感叹一句真爽。而文段说'**那里**'——**你如果在南极就说'这里'，他说'那里'，那里就说明你人不在那儿。**\"\n> ⭐ \"所以在写这个文章的时候只能叫**心驰神往**。当然'怦然心动'也可以，但就算你单独跟 B、C 比较的话，也是 C 比 B 好一些，**因为 C 比 B 语义更丰富**——你光心动，我不仅心动，我还想去。当然这是后话了，因为第一空就不对。\"\n> ⭐ 老师补充：\"我们在 **2025 年的联考题再次考到了这个词语**（心驰神往）——这个词就特别适合形容**一些旅游的景点、一些场景、一些地点**。比如新疆，我是心驰神往；南沙群岛，我心驰神往。\"\n\n> ⭐ **本板块收束（老师总结基本解题思路）**：\n> \"第一个文段上来讲的话，**一定要想尽办法弄清文段和横线的意思**；第二个对于选项来讲的话，**在区分词语角度的时候，意思是最基本的角度**。当然你不能只知道意思，你还要从很多个角度对一些常考的词进行区分。\"\n\n---\n\n## 九、高频考点：句内呼应\n\n### 9.1 什么是句内呼应\n\n> 老师原话（这一板块的引入）：\n> \"接下来我们再看一下第二个考点——**句内呼应**。其实这个点我们前面的铺垫铺垫好了，讲这个就很简单。**我都是按照高频考点来分布的，句内呼应是考得最多的。**\"\n> ⭐ **\"什么叫句内呼应呢？就是注意横线所在句子的意思，通过横线前后的提示来推测横线处表达的意思。\"**\n> ⭐ \"所以告诉大家怎么去看文段呢？首先你句子内部你不能忽略。\"\n\n> 幻灯片原文（逐字抄录）：\n\n```\n（二）句内呼应\n\n句子内部注重联系：\n注意横线所在句子的意思，通过横线前后的提示，推测横线处表达的意思\n\n高频考法：出现\"______，xxxxxxxxx\"的标志，重点关注横线后的内容\n\n例：·（2024 四川）如此______的工程布局，堪称人类水利史上的奇迹……\n     （匠心独具 / 巧夺天工）\n```\n\n### 9.2 最高频考法：横线 + 逗号\n\n> 老师原话：\n> ⭐ \"**最高频的考法，就是我给你一个横线，给你一个逗号**——有的老师叫它'横逗'，我觉得还挺形象的。**这个时候，这个逗号后面这一段，一定要仔细看，因为它很可能就是解题要点。**\"\n> ⭐ \"**是不是很像我们语句填空题？** 语句填空题只不过挖一个长横线、填一句话；你逻辑填空题是挖一个短横线、填一个词，**那本质不是一样的吗？**\"\n\n**示例（2024 四川）**：如此______的工程布局，堪称人类水利史上的奇迹……（匠心独具 / 巧夺天工）\n\n> 老师原话：\n> \"就它给的程度给的是很重的，他说的是**奇迹**，那你简简单单的'匠心独具'就有点太轻了、不够格，那你得说**巧夺天工**——欲与天公试比高，**这一定要程度很重才行**。\"\n\n> **答案：巧夺天工**\n\n---\n\n## 十、例题精讲（第三批）\n\n> 老师说明（讲例9之前）：\"这个题大家可能问题会多一点。\"\n> 老师还提到：\"咱们这是**基础夯实、思维巩固**——难题有很多，过年后你跟着我一起刷难题嘛。\"\n\n### 例题 8｜2025 四川 · 感恩与知己的层次（两空）\n\n**【题干原文】**\n\n> 例8（2025 四川）\n> 在人际交往中，感恩与知己处于不同的层次，体现不同的境界。感恩的对象非常______，可以说遍布于人生的各个时段、各种场合，不必要精神的契合、情志的相通。而知己就不同了，\"人生得一知己足矣\"，平生不可能遇到很多。知己处于更高境界，需要______，声应气求，相知相重。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 复杂　休戚与共\n> B. 灵活　情投意合\n> C. 广泛　志同道合\n> D. 明确　心有灵犀\n\n> PPT 上的词语注解（画面原文）：\n> - 复杂（多而杂）\n> - 灵活（敏捷、不呆板）\n> - 广泛（范围广、普遍）\n> - 明确（确定、明白）\n> - 休戚与共（利益共同体，共享喜悦悲伤）\n> - 情投意合（双方感情融洽，心意相通）\n> - 志同道合（志趣相同，思想相合）\n> - 心有灵犀（双方对彼此的心思都能心领神会）\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 看横线后的解释 | \"可以说遍布于人生的各个时段、各种场合\"——哪哪都有 = **广泛** |\n| 2 第一空排除 | 意思不对 | 不能选\"灵活\"，也不能选\"明确\" |\n| 3 第一空再筛 | 看感情基调 | \"感恩与知己\"的感情基调肯定不是消极的，所以\"复杂\"（多而杂，偏消极）也不行 |\n| 4 第二空 | 抓\"知己\"\"相知相重\" | \"人生得一知己足矣\"\"声应气求\"\"相知相重\"，就是**志同道合** |\n| 5 验证 | 看其它选项 | 情投意合、心有灵犀强调的也是心意相通，但 A 一定不行 |\n\n**【逐项解析】**\n\n- **A 项**：第一空\"复杂\"偏消极，与\"感恩\"的感情基调不符；**\"A 一定不行\"**。\n- **B 项**：第一空\"灵活\"（敏捷、不呆板）——\"灵活是这个人身段很柔软，**他不一定哪儿都有；遍布是广泛的意思**\"，排掉。\n- **C 项**：✅ 正确。\"广泛\"（范围广、普遍）对应\"遍布于人生的各个时段、各种场合\"；\"志同道合\"（志趣相同，思想相合）对应\"声应气求，相知相重\"。\n- **D 项**：第一空\"明确\"（确定、明白）与\"遍布\"不对应，排掉。第二空的\"心有灵犀\"其实也挺好——\"其实我觉得情投意合都还行，心有灵犀也可以，就是起码 B、C、D 它强调的都是**心意相通**的意思\"。\n\n**【本题要点】**\n\n> ⭐ **\"送分题\"的提示**：\"第一空就是告诉你了呀——可以说遍布人生各个阶段各个场合，**哪哪都有**。是不是送分题？\"\n> ⭐ **\"两空不要着急\"**：\"当然你不要着急，万一有坑呢，朋友们别着急，**两空别着急**。\"\n> ⭐ **逻辑严谨性**：\"遍布是什么？这是逻辑性也要严谨一些——**灵活是这个人身段很柔软，他不一定哪儿都有**。\"\n\n---\n\n### 例题 9｜2025 国考 · 可再生能源的间歇性与储能（两空）\n\n**【题干原文】**\n\n> 例9（2025 国考）\n> 能量的产生和使用不一定______。可再生能源发电如风力发电、太阳能发电等，会因为天气、季节、地理位置的不同，存在不同时间尺度的间歇性，而用电需求也有______，时多时少。低成本大规模的储能系统可以突破可再生能源\"即发即用、不能存储\"的瓶颈，显著提高风、光等可再生能源的消纳水平。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 同步　波动性\n> B. 协调　机动性\n> C. 平衡　规律性\n> D. 匹配　差异性\n\n> PPT 上的词语注解（画面原文）：\n> - 波动性（某事物在一定时间或范围内不稳定，存在一定变化）\n> - 机动性（在适应变化和应对不确定性方面的能力和灵活性）\n> - 规律性（客观事物相互作用中所固有的稳定的规定性）\n> - 差异性（与其他事物相比有差别或不同点）\n\n> **PPT 页面底部还附了一道对照真题（画面原文）**：\n> （2022 国考）太阳能、风能是产生电力的主要可再生能源，但都具有随机性、间歇性、波动性等特点……因此……以保证电力的平稳供给\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 句号后是空的，一时没线索 | 老师先不说，**\"其实是个句号，你不是说句内吗？\"——可以往后看** |\n| 2 第二空 | 抓横线后的四字 | **\"时多时少\"** ——只有四个字，但已经够了 |\n| 3 第二空定音 | 时多时少 = 有时有、有时没有 | 跟\"机动\"\"规律\"没关系（这个词肯定是消极的），排除 B、C |\n| 4 二选一 | 波动 vs 差异 | **\"时多时少\"不仅体现差异，还体现\"不同的时间\"** → 波动；差异没有时间的感觉 |\n| 5 回验第一空 | 抓首尾呼应 | 后文\"解决'即发即用、不能存储'的瓶颈\"→ 首尾呼应 → **同步** |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。第二空\"波动性\"（某事物在一定时间或范围内不稳定，存在一定变化）正合\"时多时少\"且带时间感；第一空\"同步\"与后文\"即发即用\"首尾呼应。\n- **B 项**：第二空\"机动性\"（在适应变化和应对不确定性方面的能力和灵活性）——\"机动\"形容\"你这个人能够应对不确定的时候能具有一定的灵活性，比如机动部队\"，与\"时多时少\"的消极语境不符。\n- **C 项**：第二空\"规律性\"（客观事物相互作用中所固有的稳定的规定性）——\"规律是指**稳定**，那肯定不稳定\"，与\"时多时少\"矛盾。\n- **D 项**：第二空\"差异性\"——\"差异就没有体现出**时间**的感觉\"，所以不如\"波动\"。\n\n**【本题要点】**\n\n> ⭐ **\"句内\"不等于\"只在本句\"**：\"老师是个句号，是吧？你不是说是句内吗？这不是句号吗？**那就可以，你信息别看这，你看你往后面看。**\"\n> ⭐ **四个字就够了**：\"'时多时少'，**只有四个字，但已经够了**。什么叫时多时少？就是有时候没有嘛——它跟'机动'跟'规律'就没关系，**因为这个词肯定是消极的**。\"\n> ⭐ **首尾呼应的用法**：\"因为他们说了一句话呀，叫做'我做了这个大规模的储能之后呢，就可以解决一个问题，解决**即发即用、不能存储**的瓶颈'。所以既然你要解决即发即用，因此能量的产生使用是不一定什么？**是不一定即发即用的。正因为你不一定即发即用，所以我要解决这个瓶颈——所以首尾呼应了，答案是同步。**\"\n> ⭐ **常做常新（同题对照）**：\"如果你做过 **2022 年**那个题，**这个题那不是一模一样吗？** 你看这个题它怎么考的——它是挖了**间歇**（第二空），文段给了一个**波动**；而二二年那个题是文段给了一个波动，选项考了一个间歇、还考了一个平稳。**其实这两个题意思是一样的。**\"\n\n---\n\n### 例题 10｜2025 内蒙古 · 人类活动对鸟类的影响（三空）\n\n**【题干原文】**\n\n> 例10（2025 内蒙古）\n> 新研究表明，人类活动对鸟类______的影响比之前认为的要大得多。森林砍伐、过度捕猎和入侵物种的引入，迅速摧毁了鸟类种群。世界上许多岛屿原本是______的鸟类天堂，但人类的介入与过度开发导致鸟类栖息地丧失。自然界在失去众多鸟类的同时，还失去了相关生态作用，包括种子传播和授粉等关键功能，这对生态系统产生了______影响。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 安全性　莺声燕语　报复性\n> B. 复杂性　与世隔绝　隐蔽性\n> C. 多样性　人迹罕至　连锁性\n> D. 多元性　超然物外　灾难性\n\n> PPT 上的词语注解（画面原文）：\n> - 莺声燕语（形容春天鸟儿喧闹活跃的景象）\n> - 与世隔绝（处在与社会或外界隔绝的环境中）\n> - 人迹罕至（偏僻荒凉的地方很少有人来过）\n> - 超然物外（超出世俗生活之外，通常形容人的态度）\n\n**【答案】** ✅ **C**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 读到这儿不知道是安全还是复杂还是多元——**没线索，别着急，往后看** | \"迅速摧毁了鸟类种群\"才是线索 |\n| 2 第一空定音 | 抓\"摧毁了什么\" | 摧毁了**种群** = 破坏了**物种的多样性** → 多样性 / 多元性，而不是安全性、复杂性 |\n| 3 第一空排 D | 意思与搭配 | \"物种不会用**复杂性**\"；\"你又提升了安全性？我自己考虑一下……不是安全性\" |\n| 4 第二空 | 意思不好做，看**搭配对象** | 搭配的是\"许多**岛屿**\"——可以说\"人迹罕至\"，不能说\"超然物外\" |\n| 5 第三空验证 | 看是不是\"方方面面\" | 种子传播、授粉等关键功能都受影响 = **连锁性**影响 |\n\n**【逐项解析】**\n\n- **A 项**：第一空\"安全性\"——\"这个时候你就不要想当然，你说：老师，那我都摧毁了，还不是安全吗？**你就要看这个文段强调什么**——文段主要强调的是**种群问题**。\"第二空\"莺声燕语\"与\"岛屿\"不搭；第三空\"报复性\"——老师明确说\"不行，跟我没什么关系\"。\n- **B 项**：第一空\"复杂性\"——\"**物种不会用复杂性**\"；第二空\"与世隔绝\"意思上不如\"人迹罕至\"贴岛屿；第三空\"隐蔽性\"——\"也不行，跟我没什么关系\"。\n- **C 项**：✅ 正确。\"多样性\"对应\"摧毁了鸟类种群\"；\"人迹罕至\"（偏僻荒凉的地方很少有人来过）搭配\"岛屿\"；\"连锁性\"对应\"种子传播和授粉等关键功能\"被一并破坏。\n- **D 项**：第二空\"超然物外\"——**这是形容人的态度的**（超出世俗生活之外，不以物喜、不以己悲，范仲淹\"居庙堂之高\"），\"你岛屿，能说超然物外吗？哇，这个岛修炼成精了\"，所以可以干掉。\n\n**【本题要点】**\n\n> ⭐ **\"不确定性就往后找线索\"**：\"你读到这儿，你是不知道的——那我怎么知道是安全还是复杂还是多元？**不知道没线索，别着急，再看完整嘛。**\"\n> ⭐ **不要想当然**：\"有没有同学选安全性？老师我都摧毁了，它不就不安全了吗？——**不是，你要看这个文段强调什么。影响安全性的东西又很多，文段主要强调的是种群问题，你就不要想当然。**\"\n> ⭐ **\"搭配对象\"救场**：\"第二空意思不好做，**但是可以考搭配**——你的搭配对象是什么？是'许多岛屿'。\"\n> ⭐ **第三空的解析**：\"第三空是不是也可以做？你看，它失去了众多鸟类的同时，还失去了生态作用，包括种子传播、授粉等关键作用，这对生态造成什么影响——**是不是方方面面都有影响？** 那这个'连锁性'就非常好，但是其实我觉得'灾难性'也可以，问题不算大，因为它确实影响很大。**它主要是'超然物外'不对。**\"\n\n---\n\n### 例题 11｜2022 四川 · 中国发展的短视行为与\"卡脖子\"（两空）\n\n**【题干原文】**\n\n> 例11（2022 四川）\n> 过去几十年中国发展总体上很成功，但也存在一些______的短视行为，比如优先上马\"短平快\"赢利项目而忽视更需长期投入和经营的基础科学，有些重要项目采取简单外购的\"拿来主义\"而没下大力气自己攻关。结果，我们在一些关键技术上存在被人\"卡脖子\"的______。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 急功近利　隐患\n> B. 好大喜功　短板\n> C. 顾此失彼　困境\n> D. 心浮气躁　威胁\n\n> PPT 上的词语注解（画面原文）：\n> - 急功近利（着急追求眼前的利益）\n> - 好大喜功（不管条件是否许可，一心想做大事立大功）\n> - 顾此失彼（顾了这个，丢了那个，形容不能全面照顾）\n> - 心浮气躁（内心浮躁）\n\n> PPT 页面底部还有两条积累（画面原文）：\n> （光明网）这三方面工作是破除经济、能源、环境等领域\"卡脖子\"隐患、实现我国社会经济的可持续发展的关键。\n> 常见搭配：存在\\消除隐患，存在\\补齐短板，身处\\破除困境，面临\\威胁\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 用中心理解思维 | 横线 + 逗号 → 后面全是解释说明（观点 + 解释说明） | \"比如优先上马短平快、忽视长期\"\"简单地采用拿来主义\"——全是解释\"**短视行为**\" |\n| 2 第一空定音 | 哪个词最适合\"短视\" | **急功近利**（很着急，着急着去追求眼前的利益） |\n| 3 排 B、D | 看逻辑性 | 好大喜功是\"事情大小\"；心浮气躁是\"容不容易冲动\"——都不是\"时间长短\" |\n| 4 排 C | 看明确性（对比择优） | 顾此失彼还要翻译\"此\"和\"彼\"是谁，**没有\"急功近利\"明确** |\n| 5 第二空（点题） | 抓开篇背景 | 开篇说\"总体上很成功\"→ 目前**还没有**被人卡脖子 → 只能是**隐患** |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。\"急功近利\"（着急追求眼前的利益）= 只顾眼前、忽视长远，与\"短视行为\"最贴；\"隐患\"（潜在的祸患）与\"总体上很成功\"的背景吻合。\n- **B 项**：第一空\"好大喜功\"（不管条件是否许可，一心想做大事立大功）——\"**跟你这个人短不短视是两码事儿**。有可能你这个好大喜的'功'，它需要长时间完成。大家明不明白？**一个是时间长短，一个是事情大小，你得有逻辑性**\"，所以排掉。\n- **C 项**：第一空\"顾此失彼\"（顾了这个，丢了那个）——\"顾此失彼你这样理解当然问题不大，但是还是一句话，**文段整体来讲是讲什么？短视行为**。所以你这个顾此失彼，你是顾了谁、失了谁呢？你是顾了短失了长，还是顾了长失了短呢？**你相比于急功近利，哪个更明确呢？我们带入一下中心理解题的优选——明确选。**\"\n- **D 项**：第一空\"心浮气躁\"（内心浮躁）——\"**不冷静、容易冲动，容易草率地做决定，它也不能体现这个决定大还是小，不能体现这个事情是快还是慢**\"，排掉。\n\n**【本题要点】**\n\n> ⭐ **第二空为什么必须选\"隐患\"（本讲最精妙的一处\"伏笔\"）**：\n> \"你觉得'困境'比'隐患'好，我就很不喜欢这个'隐患'——有没有这样想的同学？**恰恰这个题就应该选'隐患'。**为什么？\"\n> \"不管是填**短板、困境、威胁**，其实就意味着**你是不是已经被人卡脖子了**——你能不能明白？\"\n> \"但是文段为什么要选**隐患**呢？那是因为**开篇的背景告诉你了：过去几十年中国发展总体上是很成功的**。虽然有一些短视行为，但是这些短视行为可能在目前、在当时来看，**还没有被人拿来卡脖子**。所以他只能说你会存在一些风险隐患；你未来如果还这样短视，你未来就有可能被人卡脖子。**但是你目前是没有的，因为过去总体上是很成功的嘛。**\"\n> ⭐ **\"搭配都不错、意思才有高低\"**：\"大家也不要觉得这个'隐患'不能搭，**隐患是可以搭的，其实搭配来讲问题都不大**——还是那句话，**你不能只看搭配**：存在隐患、消除隐患；存在短板、补齐短板（这考的比较多）；身处困境、破除困境（困境其实'存在'也很少用，一般是身处困境、破除困境）；威胁呢，面临威胁。\"\n\n---\n\n### 例题 12｜2022 山东 · 回忆录中的选择性记忆（两空）\n\n**【题干原文】**\n\n> 例12（2022 山东）\n> 往事一旦写入回忆录，必然经过了一个主观______的环节。说到底，回忆录是选择性记忆的产物。每个人骨子里都有______的天性，趋利避害的本能。这决定了回忆录中的往事，可以被屏蔽、可以被改写，也可以被强化和升华。\n> 依次填入画横线部分最恰当的一项是：\n\n**【选项原文】**\n\n> A. 筛选　扬长避短\n> B. 提炼　避重就轻\n> C. 评判　好大喜功\n> D. 归纳　追名逐利\n\n> PPT 上的词语注解（画面原文）：\n> - 扬长避短（发挥长处，回避短处）\n> - 避重就轻（避开重要的而拣次要的来承担）\n> - 好大喜功（一心只想做大事，贪大功的浮夸作风）\n> - 追名逐利（追求名和利）\n\n**【答案】** ✅ **A**\n\n**【老师解题思路】**\n\n| 步骤 | 操作 | 本题对应 |\n| --- | --- | --- |\n| 1 第一空 | 句号，没线索——**别乱来** | \"往事一旦写入回忆录，必然经过了一个主观______的环节\"——不知道，这肯定不知道 |\n| 2 往后找线索 | \"说到底，回忆录是**选择性记忆**的产物\" | 线索在这儿——回忆录是被**选择**的 |\n| 3 第一空排 C、D | 跟\"选择\"有没有关系 | \"评判\"是评价好坏、\"归纳\"是总结——**都不叫选**，排掉 |\n| 4 第二空定音 | 看对应点 | \"长短\"对应\"利和害\"（长就是好、短就是坏），重轻是**重要性**问题 |\n| 5 结论 | 答案 A 扬长避短 | \"因为它有对应点，长短在这儿对应到利和害\" |\n\n**【逐项解析】**\n\n- **A 项**：✅ 正确。第一空\"筛选\"带有\"选\"的感觉（且与\"选择性记忆\"呼应）；第二空\"扬长避短\"的\"长短\"正好对应文段的\"利与害\"。\n- **B 项**：第一空\"提炼\"虽有选的感觉，但第二空\"避重就轻\"的\"重轻\"是**重要性**问题——\"一个东西是好是坏，跟它重不重要没有必然关系\"，排掉。\n- **C 项**：第一空\"评判\"（评价好坏）**不叫选**，排掉。\n- **D 项**：第一空\"归纳\"（我总结）**不叫选**，排掉；第二空\"追名逐利\"也与\"趋利避害\"的对应关系不吻合。\n\n**【本题要点】**\n\n> ⭐ **\"没有线索就别乱来\"**：\"往事一旦写入回忆录，必然经过了一个主观______的环节——不知道，这肯定不知道。你筛选、提炼、评判、归纳就没有线索，**你不要乱来，这属于没有线索，因为是个句号嘛**。\"\n> ⭐ **抓\"选择性\"这个题眼**：\"说到底，回忆录是**选择性记忆**的产物——明白了，这儿是线索！**就像那句名言：正经人谁写日记啊？就是好东西才写进去嘛。** 所以你选词的时候要跟这个'选择'有关系。\"\n> ⭐ **\"扬长避短\"胜出的关键（对应点法）**：\"说起来，是不是**长短**（长就是好、短就是坏）跟利和害更接近，还是**重轻**跟利害更接近？**重轻是重要性的问题——一个东西是好是坏，跟它重不重要没有必然关系。** 他可能干了一件好事、干了一件坏事，可能好事坏事都很重要，也可能都不重要。**所以好坏跟重要性没关系，但是跟长短、就跟感情色彩有关系。所以答案选的是 A 项扬长避短，因为它有对应点：长短在这儿对应到利和害。**\"\n> ⭐ \"所以'好大喜功'和'追名逐利'也不行，**因为你要体现两方面利害**——有好有坏、有长有短，所以第二空也可以排掉。\"\n\n---\n\n## 十一、本讲思维导图（收尾总结）\n\n> 老师原话：\"最后给大家总结一下我们今天的这个思维导图。\"\n> 幻灯片（画面全录）：\n\n```\n逻辑填空题\n├─ 思路\n│   ├─ 弄清文段与横线意思\n│   │      (1) 意思是逻辑填空的灵魂，并非完全靠语感\n│   │      (2) 搭配考察词语使用的合理性，但并非最重要，一定要以文段意思优先\n│   └─ 选项寻找合适的词语\n│          (1) 基本释义是基础\n│          (2) 其他角度：搭配对象、程度轻重、感情色彩、使用语境、宠词陪跑词、固定搭配、词义侧重等\n├─ 语境分析\n│   └─ 句内呼应\n│          注意横线所在句子的意思，通过横线前后的提示，推测横线处所表达的意思\n│          高频考法：出现\"______，xxxxxxxxx\"的标志，重点关注横线后的内容信息\n└─ 词语辨析\n    ├─ 基本释义：词语意思的区别\n    ├─ 词义侧重：辨析方法（一般用于形近音近词的辨析）——拆字组词猜测词语的侧重点\n    ├─ 搭配：\n    │     注意积累词语不同的搭配对象，比如人与物等\n    │     积累热词搭配（官方热词、日常习惯用语）\n    ├─ 程度轻重：从词义程度方面对词语进行区分\n    ├─ 感情色彩：从感情色彩方面对词语进行区分——褒义、中性、贬义\n    ├─ 使用语境：需要积累一些词语的使用语境，如罄竹难书，多形容罪行\n    └─ 宠词陪跑词：可以积累词语作为正确答案的概率，关键时候也能作为我们选择的依据\n\n【绿色标签】意思为王，对比择优\n```\n\n> 老师原话：\n> ⭐ \"我们的做题思维一定是**文段结合选项**。文段就是弄清楚文段和横线的意思——**意思是逻辑填空的灵魂**；然后选项就是**寻找合适的词语**，那么最基本的差别就是**基本释义**，就跟这个是一脉相承的。\"\n> ⭐ \"意思不管是在文段还是在选项都是基础。然后除了意思之外，也有些其他角度——搭配、程度、感情等等，**但是还是要意思为主**。那这些是怎么来的呢？**还是通过真题去积累**这个词的一些用法，**不能光记词典**。\"\n> ⭐ \"我们还讲的第二个点，就是考得最多的一个考点叫**句内呼应**——就是横线直接所在的句子给横线进行意思的提示，那你要通过横线的提示来推测横线所表达的意思，**特别是这个高频考法：横线加逗号**。那**逗号后的这个内容就有可能对横线处进行解释和提醒**。\"\n\n**课程预告（画面）**：\n\n> 课程预告　2.6　19:38　张弓言语\"十二箭\"（八）逻辑填空题（三）并列关系\n> 老师原话：\"明天讲并列关系。**并列关系是我们逻辑填空考得非常多的一个考点。我在中心理解没有讲并列**，因为中心理解的并列我觉得可讲的点没那么多；但是**逻辑填空的并列非常重要，考得非常多，几乎是必考的。**\"\n\n---\n\n## 十二、答疑精选\n\n> 以下问题全部来自本集直播的答疑环节（PPT 上显示的是同学提交的原文），老师的解答要点全录。\n\n**Q1：听你的课感悟很多，有一部能稳定在 60 左右，最好能达到 70，想达到 80 以上，请问怎么提升？**\n\n> ⭐ \"这种问题都是**表象**，它是一种**结果**。所以大家**不要问'老师你怎么从七十到八十'，你应该问自己'怎么提高'**。\"\n> \"你一定要知道自己的**薄弱环节**，一定要根据自己的薄弱环节去刷题，**带着思考去刷题**。然后**重心放在中心理解和逻辑填空上**。\"\n> \"哪里都弱，那就扎扎实实从基础的题目慢慢去夯实，**先易后难**，咱不能一口气吃一个胖子。\"\n> **刷题范围**：\"近五年肯定得刷一刷。国考题 **2015 年之后**的都可以刷，联考别的省份的 **2018 年之后**的也可以刷一刷，太早了就没太必要。\"\n\n**Q2：引出话题的\"话题\"，到底是一个具体的事物，还是话语或者观点？**\n\n> ⭐ \"**这只是我强行给他安的一个东西**。比如我说'朋友们这句话是引出话题'，我讲这句话的真正目的是什么？**潜台词是告诉你——这句话不重要，你就只配叫引出话题。**\"\n> \"你不叫他引出话题，你叫他引出背景、提出背景，可不可以？**可以，没问题。我只是给你取个名字，就是告诉你第一句话只是一个开端，他没有提观点。**\"\n> \"如果整个文段读完了你发现观点就在第一句，那我第一句就不会叫他引出话题了，**我就会叫它提出观点**。\"\n> \"如果这个题第一句是'近年来'，那我也可以说它是**引入背景**，反正是**非重点**，就是非重点的意思。\"\n\n**Q3：我做题过程中感觉省考联考没有国考结构清晰。**\n\n> ⭐ \"这个是对的。国考题不管是中心理解也好，还是逻辑填空也好，整体来讲会**严谨一些**。**但它只是个比例的问题。**\"\n> \"我们学习的时候，肯定要先学一些**结构清晰**的。所以老师为什么咱们这个十二箭选的题会比较典型呢？**大家觉得有点简单，其实不是简单，是比较典型。**\"\n> \"你得基础打牢嘛，**基础打牢之后，你再去做一些难一点、复杂一点的题，你才可能有一个正确的思考方式。**\"\n> \"**背成语不太建议，一定要把词放在文段当中去理解。**\"\n\n**Q4：促进这个词用的语境是有一定基础，还是说空白的领域使它发生？**\n\n> ⭐ \"这个问题问得很好，因为今天刚讲到逻辑填空——**它到底是一个从零到一，还是说从一到更多？**\"\n> \"**'促进'这个词一般是从有到更多，它一般是有基础的。** 但我不能这么武断地说，因为你还是得**看具体题目和选项**。**但你能这样想是很好的**——我们做逻辑填空就应该这样去想。\"\n\n**Q5：上节课你说的横线在中间有时候不完整，怎么判断啥时候完整啥时候不完整？是看横线逗号句号吗？但你不是说在语句填空中逗号句号不重要吗？**\n\n> ⭐ \"**其实这是两个问题。**\"\n> \"**第一个：这个横线，它只要不是完整的一句话，它都叫不完整。这个时候我把横线所在的那个句子当一个整体看，而不是只看横线。**\"\n> \"**第二个：我说的'标点符号不重要'是什么意思呢？就是从结构的角度，它不是严格以标点符号作为区分**——包括中心理解也是这样的。举例：'公务员考试很难，所以我们应该好好备考'，我在'很难'和'应该'中间打了一个逗号，那你能因为这个逗号，你就不区分结构吗？**你还不还得说'很难'是问题、'应该'是对策？**\"\n> ⭐ \"**真正的结构，整个文章的结构，它其实跟标点符号没有必然的关系。**\"\n\n**Q6：讲中心理解的时候，基础点都很明白，感觉好像拿下了，但是实际做题的时候感觉对，还是做错了，是对知识点的理解不够吗？**\n\n> ⭐ \"对，就**知行要合一**。你以为你懂了，大家可能就**似懂非懂**。\"\n> \"因为还是那句话，我选择题比较常规、比较基础、比较典型；那你在实际做题的时候，可能有的结构没有那么清晰、没有那么常规。**所以题目是检验器，你们要通过实践去加深理解。**\"\n> ⭐ \"所以要在实践中不断去更正自己的认知——**包括老师讲的可能也不一定全对，也可以去在不断的实践中形成自己的一些总结、方法和思想。**\"\n\n**Q7：实战当中逻辑填空是看到第一空就开始选，还是说把整个文段看完再选呢？**\n\n> ⭐ \"**就看一个做一个**。比如我们两个空，你看第一空呢，就看一下第一空的选项。**但是你不一定能做出来**——你如果发现这个题第一空不好做，**赶紧进入下一个**。\"\n> \"所以我的习惯是**看一个做一个**。这个其实也没有定论，看个人。\"\n\n**Q8：正确率不稳定，我应该提升哪个方面？是成语的含义还是逻辑的关系？**\n\n> ⭐ \"逻辑填空题一定是**两方面都要提升**——一个是对**文段的理解**，一个是对**词语的理解**。\"\n> ⭐ \"**绝大部分 99% 的逻辑填空题不好的同学，都是对词语的积累不到位。** 他们可能以为自己到位了，但是其实还是差点儿，**可能是错误的理解、不完全的理解**，所以两方面都得积累，**特别是后面更需要靠积累。**\"\n\n**Q9：昨天排序题里说\"紧密相连\"看关联词，可最后思维导图里说\"配套的关联词又不一定紧密相连\"，这不是矛盾了吗？**\n\n> ⭐ 老师用白板举例讲原理：\n> ```\n> 第 4 句：但是我饿了          ← 有\"但是\"\n> 第 5 句：我早上吃得很多\n> 第 6 句：小明吃了很多，不饿\n> ```\n> \"按照我们的做法，应该先把这几句当线索做——**把第 4 句当线索**（'但是'往前看），看看哪个句子能跟它构成紧密相连。这个时候其实**第 5 句和第 6 句都可以放在前面**。\"\n> \"那假设我在第 6 句前面加一个'虽然'，你能因为第 4 句有'但是'、第 6 句有'虽然'，就说六四一定完全在一起吗？**不能。**\"\n> ⭐ \"**因为你只能证明六四是 OK 的，你没有证明五四它不对——你没有排除。** 而我们说过**做排序题是排除法**。所以为什么你就算看到了'虽然'和'但是'，你也不能武断地把六四放在一起呢？**因为万一别的句子也可以和'但是'构成一个紧密相连呢？它只是没有一个引导词而已，但是内容上是可以的。**\"\n> ⭐ **两点结论**：\n> \"① 我们看到关联词，你可以往前找，**有可能**和它紧密相连的句子——**只是有可能**。\"\n> \"② 我们看到配套的关联词的时候，**它只是其中一种可能性而已**，你不能因为它们俩配套就直接锁定。\"\n\n**Q10（最后一道题，同学发来的分类笔记）**：民族文化复兴 / 文物保护的题\n\n> 题干（画面原文）：\n> 每一个民族的文化复兴，都是从总结自己的遗产开始的。在几千年历史长河中，我国各族人民创造了丰富的历史文化财富，留下了大量文物遗存。历史文物是传统文化的重要物质载体，记录着我们历史的光辉过去，延续着我们国家和民族的精神血脉，承载着我们民族的认同感和自豪感。保护历史文物和文化遗产，是传承中华优秀传统文化、坚定文化自信的必然要求。不断加大文物保护力度，让我们的城市建筑更好地体现地域特征、民族特色和时代风貌，有助于我们传承优秀传统文化，凝聚伟大民族精神，为实现民族复兴提供正确的精神指引和强大的精神动力。\n> 这段文字意在强调：\n> A. 民族文化复兴的途径\n> B. 传统文化的物质载体\n> C. 城市规划要富有特色\n> D. 文物保护的深远意义\n\n> **答案：D**\n> 老师原话：\n> ⭐ \"这个题其实不难，结果也非常清楚。他分的类分的是对的：**第一句引出话题，讲民族文化复兴——它不重要**；从'保护历史文物和文化遗产是传承中华优秀传统文化、坚定文化自信的必然要求'开始，这就已经**不能更明显地是提对策**了；然后'不断加大文物保护力度，让……'，**'让'后面是意义效果**。所以这个题**对策在这儿，它是一个分总结构，我们就应该抓住这个选答案**。\"\n> ⭐ **为什么选 D 不选 A（对策的\"内容大于形式\"）**：\"他 AD 纠结。其实符合我们在讲对策时说的那个点——**你 A 项虽然有个'途径'，但是对于对策来讲，我们选对策是选什么？是选内容，内容要大于形式。我要干嘛呀？我就是要保护历史文物，文物是内容。**\"\n> ⭐ \"所以**'文物'这个词一定要有**。明白吗？我们选 D 不是因为'意义'这两个字，**是因为它有'文物'**，就跟我们选因果关系一样，我们选什么什么的原因，是因为它能体现这个结果。\"\n> ⭐ **为什么优先 D**：\"因为咱们一定要**尊重中心句**。我们说**首句只是一个维度，首句看主题词只是维度之一，我们还要尊重中心句的核心话题以及文段的高频词。** 那么这个文段的中心句当中其实没有'文化复兴'，而是强调**文物**——包括'文物'这个词也是从第二句开始就已经反反复复高频出现，所以答案选到 D 项。\"\n> ⭐ \"**对策对象不分开最好。** 如果出严谨一点：'要通过文物保护实现民族文化复兴'——重点点一下保护文物，然后再呼应一下开头，国考就套路化了。**但这个题就让你去做一个区分。**\"\n> ⭐ \"至于'文化遗产'——**你不要脱离选项想问题**。第一，文段里有'文物历史'；第二，在这句话当中，**文物就是文化遗产的一部分**，它俩严格意义上不是并列关系。所以也不要觉得它片面。\"\n> 老师对这道题的补充评价（画面右上角文字）：\n> \"对策优先抓内容而非形式，D 的文物就是对策内容，相当于对策 + 意义效果。另外 A、C 有问题——民族文化复兴只是目标之一，也不好。这个题就属于故意恶心人，非得把对策对象拆开成 AD；还好中心句比较明确，后面文段的重点很突出。\"\n\n---\n\n## 十三、本讲方法框架总表\n\n### 框架一：逻辑填空的总体解题思路（总纲）\n\n| 编号 | 框架 | 具体内容 |\n| --- | --- | --- |\n| 1 | 题型构成 | **逻辑填空 = 文段 + 选项** |\n| 2 | 文段侧 | 弄清文段什么意思、横线什么意思 → 这个动作叫**语境分析** |\n| 3 | 选项侧 | 选择合适词语、弄清词语区别 → 这个动作叫**词语辨析** |\n| 4 | 结论 | 不存在只考语境分析或只考词语辨析的题，**每道题都是两部分构成** |\n| 5 | 为什么难 | 相当于先做一遍（简单的）中心理解，再做大量词语辨别——难上加难 |\n\n### 框架二：语境分析（文段）\n\n```\n第一步 抓根本意思：这文段到底想干嘛？（意思是逻辑填空的灵魂）\n第二步 不靠语感：语感有一定道理，但不是每个人的语感都是对的\n第三步 抓住逻辑关系：横线和文段之间的逻辑关系 = 逻辑填空的本质\n第四步 看清标黑处：眼中不能只有搭配，否则对文字利用率可能只有百分之十几\n```\n\n> ⭐ 铁律：**分不分析的出来是能力问题，分不分析是路线问题。**\n\n### 框架三：词语辨析七大角度\n\n```\n① 基本释义（最本质的区别，必须满足）\n② 搭配对象（搭人 / 搭物；搭真 / 搭假）\n③ 程度轻重（由轻到重排序，不确定时选\"要求低、范围广\"的那个）\n④ 感情色彩（褒义 / 中性 / 贬义）\n⑤ 使用语境（这个词到底什么时候用——最难，靠积累）\n⑥ 宠词 / 陪跑词（高频且易作答案 vs 高频但极少作答案）\n⑦ 词义侧重（形近音近词：拆字组词，用不一样的字猜侧重点）\n     （另有\"实词固定搭配\"：靠积累官方热词，如\"整合资源\"\"凝聚\"）\n```\n\n### 框架四：两大考察方向与优先原则\n\n```\n意思的正确性（国考最爱；联考以它为主）\n使用合理性（广东等地占比高，指\"党和政府都这么用\"的固定搭配）\n                    ↓\n        二者矛盾时 → 优先尊重\"意思的正确性\"\n        （可以牺牲一定的使用合理性，但绝不能牺牲意思正确性）\n```\n\n### 框架五：句内呼应\n\n```\n第一层 句子内部注重联系：\n       注意横线所在句子的意思，通过横线前后的提示，推测横线处表达的意思\n第二层 最高频考法：\n       出现\"______，xxxxxxxxx\"的标志（横线 + 逗号）\n       → 重点关注横线后（逗号后）的内容信息\n第三层 方法论等价：\n       逻辑填空（短横线填词）与语句填空（长横线填句）本质相同\n```\n\n### 框架六：词语积累的正确途径（优先级）\n\n```\n第一（最权威） 以史为鉴——刷真题，看这个词作为正确答案时真题文段怎么写的\n第二          听课（被动）\n第三          权威文章与媒体（人民日报、新华网、光明日报、新闻联播）\n最后          词典（\"光知道意思没有用\"，其实不太关键）\n```\n\n---\n\n## 十四、词语 / 成语积累表\n\n> 说明：本表收录本讲 PPT 上出现的词语注解、老师口头辨析的词语，释义**一律以画面/老师原话为准**；老师未展开的标注\"（老师未展开，仅作识记）\"。\n\n| 词语/成语 | 释义 | 侧重 / 搭配对象 | 感情色彩 | 辨析点 |\n| --- | --- | --- | --- | --- |\n| 骇人听闻 | 使人听了非常吃惊、害怕 | 指实际存在、**搭配真事儿** | 贬义 | 与\"耸人听闻\"区别在**真假** |\n| 耸人听闻 | 夸大或捏造事实，使人听了感到惊异或震动 | 搭配**虚假的**事情 | 贬义 | 带\"耸\"字的偏假 |\n| 危言耸听 | 故意说些夸大的吓人的话，使人惊疑震动 | 指被捏造、夸张出来的事 | 贬义 | 同上，偏\"故意夸大\" |\n| 授予 | 郑重地给予 | 多与**奖励、荣誉**相关 | 中性 | 搭配范围窄 |\n| 给予 | 给、赠送、使别人得到，也作给与 | 搭配对象**更为宽泛** | 中性 | 搭配范围宽 |\n| 喜闻乐见 | 让大家喜闻乐见 | **多以人作为主体**（与五官有关） | 褒义 | 通常要加\"让人/令人\" |\n| 深入人心 | 这个理论深入人心 | **多以思想、理论作为主体** | 褒义 | 本身已含\"人\"，不需以人作主语 |\n| 千丝万缕 / 息息相关 / 息息相通 | 呼吸相关联，比喻关系非常密切 | 程度**最轻**，要求低 | 中性 | 不确定时选它更保险（范围广） |\n| 如影随形 / 形影不离 | 好像影子老是跟着身体。比喻两个事物关系密切或两个人关系密切不能分离 | 程度稍重 | 中性 | 好闺蜜、好哥们儿才用 |\n| 同气连枝 / 情同手足 | 比喻像同胞的兄弟姐妹般关系亲近 | 更重 | 中性 | \"五岳剑派同气连枝\" |\n| 休戚相关 / 休戚与共 | 利益相关，祸福相关（形容利益共同体） | 非常重 | 中性 | 利益共同体，如\"我和上岸村\" |\n| 唇亡齿寒 / 唇齿相依 | 比喻两者关系密切，利害相关 | 最重，生死存亡 | 中性 | \"you jump, I jump\" |\n| 蔚然成风 | 多指某件有意义的事情经过提倡推广，逐渐形成一种社会上普遍流行的风尚 | 偏积极 | **褒义** | 三者都是\"流行\" |\n| 风靡一时 | 形容一个事物在一个时期非常盛行，像风吹倒草木一样 | 中性 | **中性** | 与\"蔚然成风\"区别在色彩 |\n| 大行其道 | 某种思想、理论或时尚等盛行一时 | 多贬 | **多贬义**（偶尔中性） | \"火箭那个题\"曾作中性用 |\n| 相得益彰 | 两件**可以独立**的事物互相配合，有好的效果（1+1>2） | 相互帮助，相互补充，更能显出各自的好处 | 褒义 | 分开也行，在一起更好 |\n| 相辅相成 | 更加强调相互辅助的事物之间是**缺一不可**的关系 | 不能分开 | 褒义 | 与\"相得益彰\"区别在\"能不能缺一\" |\n| 水乳交融 | 像水和乳汁那样融合在一起，比喻关系非常融洽或结合得很紧密 | **常形容党群关系** | 褒义 | 血肉联系、党群关系 |\n| 珠联璧合 | 美好的且性质相似的人或事物凑在一起 | 强强联合、一对璧人 | 褒义 | 强调\"美好 + 性质相似\" |\n| 交相辉映 | 一般指景色所发出的光亮色彩互相映照 | **外在的光亮、色彩、景色** | 褒义 | **一般不形容两者的影响** |\n| 取长补短 | 吸取别人的长处，来弥补自己的不足之处 | 强调交流互通，学别人的长处 | 褒义 | **文段必须有明确的长处与短处** |\n| 独善其身 | 多指只顾自己，不管他人 | 现在多用于**在大环境不好下，小个体难以保障自身** | 中性 | 宠词；大小关系 |\n| 应运而生 | 指适应时机而产生 | 多指事物的出现**不是凭空突然的，而是有缘由的** | 褒义 | 宠词；因果关系 |\n| 南辕北辙 | 比喻行动跟目的相反 | 要求\"完全相反\" | 贬义 | 陪跑词，要求太高 |\n| 互为表里 | 甲为乙的外表，乙为甲的内里； 项 |\n| 掩埋 | 遮盖、埋藏 | 符合\"被踩塌盖住\"的画面 | 中性 | 本题正确答案 |\n| 甄别 | 考核鉴别，多指对**真伪、优劣**等进行区分 | 优中选优（\"某某甄选\"） | 中性 | 与\"变形\"无关 |\n| 保留 | 保存不改变、暂时留着不处理 | — | 中性 | 与\"太黏\"无关 |\n| 采集 | 收集、搜罗 | — | 中性 | 与\"变形\"无关 |\n| 识别 | 辨认、分辨清楚 | **变形 = 看不出来 = 难以识别** | 中性 | 本题正确答案 |\n| 严苛 / 苛刻 / 严格 | 都是\"比较严格\"的意思 | — | 中性 | 三者皆可（\"严苛\"为答案项） |\n| 刁钻 | 形容人狡猾奸诈 | 修饰人 | 贬义 | 排除项 |\n\n---\n\n## 十五、易错点与陷阱清单\n\n| # | 易错点 / 陷阱 | 正解 |\n| --- | --- | --- |\n| 1 | **完全凭语感**（\"寂寞\"\"清冷\"感觉也有道理） | 语感有一定道理，但不是每个人的语感都是对的；要分析文段想传达什么 |\n| 2 | **过于迷信搭配**（\"释放活力\"读着最顺） | 只看搭配 → 对文段利用率极低（可能只有百分之十几），出题人给你的是一段话 |\n| 3 | **只看某一个空** | 当某空（如第二空）能确定其他选项都不对时，第一空再好也没用；反之亦然 |\n| 4 | **\"意思对\"但\"不该这么用\"时不敢选** | 意思正确性与使用合理性矛盾时，**优先尊重意思的正确性** |\n| 5 | **以为词典能救你**（\"保持\"与\"维持\"互训） | 词典没用，要靠自己分析、举例、刷真题积累 |\n| 6 | **纠结熟重熟轻**（息息相关 vs 休戚相关） | 不确定时选**要求低、使用范围广**的那个（息息相关） |\n| 7 | **把陪跑词当答案**（南辕北辙、互为表里、无与伦比） | 这类词要求太高、范围太窄、使用率太低，作为答案概率低 |\n| 8 | **转折文段里写成\"前后矛盾\"**（寸草不生 + 有企鹅白熊） | **转折可以相反，但不能矛盾** |\n| 9 | **忽略视角**（人在不在场） | \"这里\"= 人在场（心旷神怡/赏心悦目）；\"那里\"= 人不在（心驰神往） |\n| 10 | **把\"存在 X\"当万能用** | 搭配虽都对，但\"短板/困境/威胁\"意味着**已经**被卡脖子，与\"总体上很成功\"矛盾，应选\"隐患\" |\n| 11 | **忽略\"对应点\"**（扬长避短 vs 避重就轻） | 好坏（利害）对应**长短**，不对应**重轻**（重要性） |\n| 12 | **忽略\"句号\"就放弃**（以为句内呼应只在本句） | 句号后也可以往后看；例9 第一空就是靠后文\"即发即用\"首尾呼应的 |\n| 13 | **第一空好判断就死磕，其他空不看** | \"看一个做一个\"，不好做就**赶紧进入下一个** |\n| 14 | **以为标点符号决定结构** | 从结构角度，不是严格以标点符号作为区分；\"很难，所以应该……\"仍是问题+对策 |\n| 15 | **以为\"配套关联词\"必然紧密相连（排序题）** | 关联词只是**一种可能性**；你没排除其它句子，就不能锁定 |\n| 16 | **背成语表** | 老师明确\"背成语不太建议，一定要把词放在文段当中去理解\" |\n| 17 | **对策题只看\"形式\"不看\"内容\"** | 对策优先抓**内容**（如\"文物\"）而非形式（如\"途径\"） |\n\n---\n\n## 十六、老师金句\n\n> ⭐ \"**逻辑填空，有时候大家不喜欢，不喜欢也没办法。**\"\n>\n> ⭐ \"**谜底在谜面上**——逻辑填空考的是什么？考的是逻辑，考的是横线和文段的逻辑关系，**不是你的语感。**\"\n>\n> ⭐ \"**分不分析的出来是能力问题，分不分析是路线问题。** 一个是路线问题，一个是能力问题，这个不能搞错。\"\n>\n> ⭐ \"**最根本的原理是：如果你只看搭配的话，你对这个文段的利用率是非常低的。**\"\n>\n> ⭐ \"**你的眼中一定不能只有搭配，因为你如果只看搭配，你的眼中就只有词，而别人给你的是一段话。**\"\n>\n> ⭐ \"**意思优先。它哪怕在使用上有点瑕疵，意思一定要对，一定要把老师这话记住。**\"\n>\n> ⭐ \"你可以牺牲一定的**使用合理性**，但你一定要满足你的**意思正确性**。\"\n>\n> ⭐ \"**考得越多，你记的角度就应该越多；考得越少，你就知道意思就可以了。**\"\n>\n> ⭐ \"**转折，你可以相反，但你不能矛盾。**\"\n>\n> ⭐ \"**对策优先抓内容，内容要大于形式。**\"\n>\n> ⭐ \"**分不出来的东西要看完整——不要凭感觉，老师我觉得猪就是要闯入，你得看看完整。**\"\n>\n> ⭐ **改错题的心态**：\"今天我又学到新东西了！我以前觉得不能这么用，发现哦它可以这么用。**你要有一个积极的心态。**\"\n>\n> ⭐ \"**你提高一定是一个痛苦的过程。**\"\n>\n> ⭐ \"**能看懂问题也是一种能力。**\"\n>\n> ⭐ \"**题目是检验器**，你们要通过实践去加深理解。\"\n>\n> ⭐ \"**包括老师讲的可能也不一定全对**，也可以去在不断的实践中形成自己的一些总结、方法和思想。\"\n>\n> ⭐ \"就**跟你们学英语单词一样**：不要只背单词表，要把这个词放在它使用的句子当中去理解。\"\n>\n> ⭐ \"**逻辑填空的并列非常重要，考得非常多，几乎是必考的。**\"\n","outline":[{"level":2,"text":"本讲知识地图","id":"本讲知识地图"},{"level":2,"text":"一、开场与上一讲回顾（语句排序题·省流版总结）","id":"一开场与上一讲回顾语句排序题省流版总结"},{"level":3,"text":"1.1 老师开场口播","id":"11-老师开场口播"},{"level":3,"text":"1.2 语句排序题·省流版思维导图（板书全录）","id":"12-语句排序题省流版思维导图板书全录"},{"level":3,"text":"1.3 老师对上一讲的复盘","id":"13-老师对上一讲的复盘"},{"level":2,"text":"二、逻辑填空总纲：正确认识逻辑填空题的解题思路","id":"二逻辑填空总纲正确认识逻辑填空题的解题思路"},{"level":3,"text":"2.1 PPT 原理图（板书全录）","id":"21-ppt-原理图板书全录"},{"level":3,"text":"2.2 为什么\"语境分析\"与\"词语辨析\"都非学不可","id":"22-为什么语境分析与词语辨析都非学不可"},{"level":3,"text":"2.3 逻辑填空为什么难","id":"23-逻辑填空为什么难"},{"level":3,"text":"2.4 文本页：两大考察内容（板书全录）","id":"24-文本页两大考察内容板书全录"},{"level":2,"text":"三、语境分析（角度一）：文段意思为王","id":"三语境分析角度一文段意思为王"},{"level":3,"text":"3.1 幻灯片原文（逐字抄录）","id":"31-幻灯片原文逐字抄录"},{"level":3,"text":"3.2 讲解①：意思是逻辑填空的灵魂，不能全靠语感","id":"32-讲解意思是逻辑填空的灵魂不能全靠语感"},{"level":3,"text":"3.3 讲解②：绝大多数同学的问题——过于迷信搭配","id":"33-讲解绝大多数同学的问题过于迷信搭配"},{"level":3,"text":"3.4 核心原理：为什么能靠\"搭配\"、又不能只看\"搭配\"——利用率","id":"34-核心原理为什么能靠搭配又不能只看搭配利用率"},{"level":2,"text":"四、例题精讲（第一批）","id":"四例题精讲第一批"},{"level":3,"text":"例题 1｜2022 江苏 · 山民故事与个人感悟（三空）","id":"例题-12022-江苏-山民故事与个人感悟三空"},{"level":3,"text":"例题 2｜2025 四川 · 恐龙足迹的保存条件（三空）","id":"例题-22025-四川-恐龙足迹的保存条件三空"},{"level":3,"text":"例题 3｜2022 四川 · 人无德不立（三空）","id":"例题-32022-四川-人无德不立三空"},{"level":2,"text":"五、词语辨析（角度二）：考对词语的多角度理解","id":"五词语辨析角度二考对词语的多角度理解"},{"level":3,"text":"5.1 案例回顾：从三道题看\"多角度\"的必要性","id":"51-案例回顾从三道题看多角度的必要性"},{"level":3,"text":"5.2 幻灯片原文（逐字抄录）","id":"52-幻灯片原文逐字抄录"},{"level":2,"text":"六、两大考察方向：意思的正确性 vs 使用的合理性","id":"六两大
