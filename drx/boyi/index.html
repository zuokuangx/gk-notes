手的底牌3\n> - 第 0124 集　抓住对方心理才能搞定1\n> - 第 0125 集　抓住对方心理才能搞定2\n> - 第 0126 集　抓住对方心理才能搞定3\n> - 第 0127 集　转移对方的注意力1\n> - 第 0128 集　转移对方的注意力2\n> **时长**：约 40 分钟（各页时长求和）\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0113 | 契约为何成为一纸空文5 | 吴越相争：实力相当的两只“斗鸡”，谁先主动进攻谁先败 |\n| 0114 | 契约为何成为一纸空文6 | 夫差一举击溃越国却放过勾践，转向北方争霸 |\n| 0115 | 契约为何成为一纸空文7 | 十年生聚、十年教训，勾践反手灭吴，吴国败于自己的退让 |\n| 0116 | 讨价还价的智慧1 | 菜市场砍价是最简单的谈判博弈，成交价由讨价还价形成 |\n| 0117 | 讨价还价的智慧2 | 讨价还价促成共识，位置决定你是否有能力和对方博弈 |\n| 0118 | 讨价还价的智慧3 | 谈判漫长源于双方都有讨价还价能力，一方失去能力僵局即破 |\n| 0119 | 准备充分很重要1 | 谈判前做足功课、摸清行情，才有胜算 |\n| 0120 | 准备充分很重要2 | 美日谈判：日方虚高报价，被有备而来的美方识破 |\n| 0121 | 搞清楚对手的底牌1 | 透视对方底牌的十种策略 |\n| 0122 | 搞清楚对手的底牌2 | 警惕思维定式，谈判中途换人可打乱对手节奏 |\n| 0123 | 搞清楚对手的底牌3 | 史考勒斯三兄弟轮番上场，逼对手在心理压力下让步 |\n| 0124 | 抓住对方心理才能搞定1 | 巴拿马运河：美国故作姿态，把一亿美元的价压到四千万 |\n| 0125 | 抓住对方心理才能搞定2 | 罗斯福如法炮制，以极低代价长期租得运河区 |\n| 0126 | 抓住对方心理才能搞定3 | 打动心底最软处：送录像、送玫瑰，比讲产品更管用 |\n| 0127 | 转移对方的注意力1 | 巧设迷局、请君入瓮，让对手在一连串“是”中改口 |\n| 0128 | 转移对方的注意力2 | 拿到情报先声夺人，用虚实结合压低对方报价 |\n\n---\n\n## 第 0113 集｜契约为何成为一纸空文5\n\n### 核心内容\n\n本集续讲吴越博弈。在吴越这场博弈中，吴国进攻楚国，越国趁机攻入吴国；吴国夫差乘机自立，阖闾无奈率军回国夺位，吴军退回了国内，楚军也退回，吴越又保持了不战不和的状态。公元前四九六年，越王允常去世，勾践继位。阖闾想教训这个年轻的后生，双方展开大战。勾践先以敢死之势冲入吴军，被吴军击退；于是又派犯罪的刑徒向前挑战，他们前进到吴军阵地前面大喊一声，然后集体自杀。吴军看得目瞪口呆，越军乘机大破吴军。在这场战争中，吴王阖闾死在初出茅庐的勾践手中。阖闾临死前叮嘱儿子夫差，一定要报这一箭之仇。\n\n三年后，勾践听说夫差天天喊复仇，决定先下手为强，于是点齐全国三万壮丁，浩浩荡荡杀向吴国。吴越激战于夫椒，夫差年轻气盛，伍子胥老谋深算，吴军统领调度灵活、指挥得当，士兵怀着为先王报仇的决心奋勇出击，结果勾践被打得一败涂地。勾践仅带着残余的五千人躲在会稽山中，惶惶不可终日。夫椒之战以后，勾践仅剩下五千人，这已经从一场旗鼓相当的斗鸡博弈，转化为实力一边倒的不对称博弈。在这两场博弈中，实力相当的吴越先后主动发起进攻。按照斗鸡博弈的理论，如果双方都前进，那么必然使双方都遭受损失；然而真正的斗鸡博弈在打击对方的时候，总会想方设法削弱对手、让自己获得利益，也就是以最小的损失获取最大的利益。所以在槜李大战中，勾践巧妙地利用死囚集体自杀来挫败对方的锐气；而在夫椒之战前，吴军制定了复仇计划，双方交战，夫差一马当先，极大地激励了士气。这两次博弈中，主动进攻的一方先后遭到失败，实际上是败在策略上。此时形势对吴国极为有利，而越国则处在亡国灭种的边缘。\n\n### 金句摘录\n> 真正的斗鸡博弈在真正打击对方的时候，总会想方设法削弱对手，让自己获得利益。\n> 这两次博弈中，主动进攻的一方先后遭到失败，实际上是败在策略上。\n\n---\n\n## 第 0114 集｜契约为何成为一纸空文6\n\n### 核心内容\n\n本集讲夫差为何放过了到手的胜利。此时吴国已经击溃了越国的全部主力，无论越国下一步怎么走，吴国要消灭越国都已经是举手之劳；而对越国来说，无论进攻还是后退，都已经无法决定自己的命运，唯一的希望是吴国主动退却、给越国喘息的机会。但这种机会太渺茫了，因为吴国权臣伍子胥明白，吴越同处三江之地，不能长久并存，现在越国战败，正是吞并它的土地和人口最好的时机。\n\n然而在关键时刻，勾践的本性和夫差的贵族傲气同时出现了。勾践派文种备厚礼向吴国求和，甚至愿意以身为奴、保存越国；而意气风发的夫差却小看了这位甘愿为奴的君王。在他看来，勾践为奴无异于整个越国的臣服，这和吞并越国的国土和人口并没有什么两样，于是夫差很爽快地答应了这位穷途末路的越国君主，保存了越国。而吴王夫差的事业从此投向了辽阔的北方——那里有更强硬的对手晋国和齐国，有令人羡慕的霸主名分，这一切似乎对这位血统高贵的君王更有吸引力。从公元前四八九年，吴国全面转向北方，开始与齐国展开生死博弈。夫差先攻灭位于河南淮阳的陈国，解除了北进时来自侧翼的威胁；接着攻打鲁国，打开进军中原的大门。为了建立北上的战略基地、打通向北进军的交通运输线，吴国开凿了我国历史上第一条人工运河——邗沟。公元前四八五年，吴在陆地组建鲁、邾等国联军，由陆上进攻齐国；同时组建了中国历史上第一支海军，由长江入海，向山东半岛迂回包抄，攻打齐国的侧翼。公元前四八四年，夫差得知齐国动乱，再次决定攻齐。齐吴两军会战于艾陵，吴军四面合围，大败齐军十万，齐军基本全军覆没。\n\n### 金句摘录\n> 在他看来，勾践为奴无异于整个越国的臣服，这和吞并越国的国土和人口并没有什么两样。\n> 而意气风发的夫差，却小看了这位甘愿为奴的君王。\n\n---\n\n## 第 0115 集｜契约为何成为一纸空文7\n\n### 核心内容\n\n本集讲吴国的最终败亡。然而，夫差的北伐是一场典型的斗鸡博弈消耗战：吴国精锐就这样一批批暴尸荒野，而为夫差赢得的却是一个虚假的霸主称号。而此时的越国，勾践为奴三年，最后回到越国，在范蠡、文种的帮助下，制定了“十年生聚、十年教训”的战略计划：一面努力生产，一面鼓励夫差北上，又送美女西施诱惑夫差，用大量财物离间吴国的君臣。经过十年时间，越国君臣上下齐心、十年磨砺、养精蓄锐；而吴国不停地东征西讨，大批精锐暴尸荒野，吴强越弱的形势已经悄悄发生了根本的变化。公元前四八二年，吴王夫差带领全国主力在黄池与晋争霸，勾践和他的谋臣认为时机成熟，一举歼灭吴军，并乘势攻入吴都。夫差大惊失色，率军回援，但为时已晚，只能向越国求和。\n\n这时候的吴越可以说还是两只旗鼓相当的斗鸡，只是骄横的吴国小看了勾践，纵虎归山，跑到北方去，把自己柔软的腹部暴露在越国的利爪下。然而此时的吴国已经后继无力，所以过了四年，吴国发生灾荒，勾践再次进攻，在笠泽与吴军隔江对峙，消灭了吴军仅有的主力。这时候的吴越，又形成了越强而吴弱的一边倒局面。对吴国来说，唯一的机会就是重演自己曾经做过的“越国乖乖退让、让它喘气”的一幕；然而，从君王到奴隶、又从奴隶到君王的勾践，不会再让对手变成与自己平级的斗鸡。于是，公元前四七五年，勾践率军猛扑吴国都城姑苏，围城三年。夫差求和不成，城破自杀，吴国灭亡。本书总结：吴越博弈中，吴国都是由于主动退让而让对手胜出，吴国对越国的行为自始至终都像个“绅士”，不把对手逼上绝路。谈判的参与者应该学会利用各种博弈手段，尽量缩短谈判的过程、达成协议，以便减少耗费的成本，从而避免损失，维护各自的最大利益。\n\n### 金句摘录\n> 夫差的北伐是一场典型的斗鸡博弈消耗战，吴国精锐就这样一批批暴尸荒野，而为夫差赢得的却是一个虚假的霸主称号。\n> 吴国对越国的行为自始至终都像个绅士，不把对手逼上绝路。\n\n---\n\n## 第 0116 集｜讨价还价的智慧1\n\n### 核心内容\n\n本集开始讲“讨价还价的智慧”。对谈判博弈的讨论提醒我们注意一点：如果担心博弈结果在未来会对自己不利，就应该在博弈进行中充分利用讨价还价的能力，避免自己将来陷入困境。在谈判中，为了维护博弈双方各自的利益，必然会出现讨价还价的局面。我们在菜市场买菜，就是最简单的谈判博弈。\n\n书中分析了一段熟悉的对话来说明讨价还价的作用：苹果怎么卖？十块一斤。十块钱一斤太贵了，您再便宜点吧，五块吧。抢钱，现在的水果都在涨价，您给九块吧。还是太贵了，六块吧。最低八块五，您总不能让我赔钱吧。七块钱最多了，要不我就走了。八块成本价给您，当我不赚钱。那行吧，你给我来一斤，反正你肯定有赚头。价格就像钟摆一样，在双方的讨价还价中摆来摆去，最后定格在八块上。或许你会说，为什么不一开始就卖八块，大家都省事？事实上，八块是博弈的最终结果，而在此之前，谁知道最佳成交价是多少呢？或许换个卖家和买家，同样的苹果，最终成交价是七元、九元、十元等等。其实，无论最终的成交价是多少，能够形成成交就说明这次博弈达到了双方满意的成果；反过来说，如果有一方觉得不满意，就不会形成交易。正是讨价还价促成了博弈双方达成共识。\n\n### 金句摘录\n> 价格就像钟摆一样，在双方的讨价还价中摆来摆去，最后定格在8块上。\n> 无论最终的成交价是多少，形成成交就说明这次博弈达到了双方满意的成果。\n\n---\n\n## 第 0117 集｜讨价还价的智慧2\n\n### 核心内容\n\n本集进一步说明：促成博弈双方达成共识的，就是讨价还价的作用。在商业谈判中，这种讨价还价的过程更显得尤为重要，双方为了自己的利益唇枪舌剑，都在等待最佳成交价格的出现。对于大的贸易来说，一次谈判更可能耗时几天，甚至几个月。值得注意的是，由于博弈的双方所处的位置不同，讨价还价并不一定是公平进行的。在某些时候，你还可能碰到这样的局面：当你准备和对手进行讨价还价时，却发现对方根本不懂得、或不愿意和你进行谈判。在这种情况下，你的位置就决定了你是否有能力和对方博弈。\n\n书中用两个经济学家的遭遇来做提醒。一天深夜，有两个经济学家打车从机场到酒店，司机认出了名人，热情地说不用打表，会给他们最优惠的价格和正规发票。两个经济学家敏感地认识到这是一个博弈问题：在不知道价格和司机可疑动机的情况下，什么是最佳的对策呢？经过复杂的心算，两人得到了一致的答案——只要到了酒店，他们的还价地位就非常高，而且深夜出租车很难叫，于是就让司机拉着他们到了酒店。司机依然热情，说只收你们一百元零头去掉；于是两个经济学家试图还价到九十。谁知司机气坏了，把车门反锁，直接拉着他们回到了机场，生气地嚷道：九十块只能到半路，不信就算了！把他们扔在了原来的地方。两人瞠目结舌，又等了将近半个小时才打到一辆车，这次没等司机说话就坚持要打表，一路到了酒店，出租车的价目表正好停在九十上。之后，两位著名经济学家得出的结论是：应该先下车再还价。经济学家固然聪明，但是他们找错了博弈的对象——出租车司机不愿意和他们讨价还价，又把两人拉回原处，造成了双输的局面。\n\n### 金句摘录\n> 你在博弈中的位置，决定了你在讨价还价中是占优还是占劣。\n> 经济学家固然聪明，但是他们找错了博弈的对象。\n\n---\n\n## 第 0118 集｜讨价还价的智慧3\n\n### 核心内容\n\n本集接上集分析：这个结果是博弈中的复合博弈。假设这两个经济学家到达酒店、下了车之后，再和出租车司机进行讨价还价的博弈，结果恐怕就不是故事里这样了——司机恐怕不会硬生生地把两人再拉回机场，很有可能被迫同意九十元的条件。所以说，你在博弈中的位置，决定了你在讨价还价中是占优还是占劣，也由此决定了博弈的结果是否让你的利益达到最大。\n\n再仔细想想，为什么很多时候谈判会进行得非常漫长呢？主要是因为双方都有讨价还价的能力，并且没有一方在博弈中占据极为有利的位置，于是陷入僵持。如果其中有一方失去了讨价还价的能力，这种僵持局面就会被打破。比如上面出租车司机和经济学家，如果司机锁住车门开始和经济学家讨价还价，那么很可能出现的局面是双方你来我往，谈很长时间也不分胜负；但如果经济学家下车，司机就会失去讨价还价的能力，因为一旦经济学家逃跑，而自己随便把车丢在路边去追，是有风险且不划算的。所以博弈的天平就倾向于经济学家，谈判会很快结束。最后，本书再次提醒：对谈判博弈的讨论提醒我们注意一点——如果担心博弈结果在未来会对自己不利，应该在博弈进行中充分利用讨价还价的能力，避免自己将来陷入困境。\n\n### 金句摘录\n> 如果其中有一方失去了讨价还价的能力，这种僵持局面就会被打破。\n> 如果担心博弈结果在未来会对自己不利，应该在博弈进行中充分利用讨价还价的能力。\n\n---\n\n## 第 0119 集｜准备充分很重要1\n\n### 核心内容\n\n本集讲“准备充分很重要”。在我们讨价还价之前，一定要做足准备，先搞清楚行情，再进入博弈中，否则将会陷入对方设定的骗局。在任何谈判博弈展开之前，准备得越充分，对自己越有利，胜算也越大。\n\n书中举美国前总统尼克松为例：一次访问日本，基辛格作为美国国务卿同行。尼克松总统在参观日本京都的二条城时，曾询问日本的导游小姐一个历史年份，那导游小姐一时答不上来，基辛格立即从旁插嘴报出了正确答案。这点小事说明基辛格在访问日本前已经深深了解和研究过日本的情况，阅读了大量有关资料，以备不时之需。美国人十分注重商业谈判技巧，在行动前总要把目标方向了解清楚，不主张贸然行动，所以他们的生意成功率较高。美国商人在任何商业谈判前都先做好周密的准备，广泛收集各种可能派上用场的资料，甚至包括对方的身世、嗜好和性格特点，使自己无论处在何种局面均能从容不迫地应付。\n\n书中又举一家美国公司与日本公司洽谈购买国内急需的电子机器设备的例子。日本素有圆桌武士之称，富有谈判经验，手法多变，谋略高超。美国人在强大对手面前不敢掉以轻心，组织精干的谈判班子，对国际行情做了充分了解和细致分析，制定了谈判方案，对各种可能发生的情况都做了预测性估计。尽管美国人做了各种可能性预测，但在具体方法步骤上还是缺少主导方向，对谈判取胜没有十分把握。谈判开始，按国际惯例由卖方首先报价。报价不是一个简单的技术问题，它有很深的学问，甚至是一门艺术：报价过高会吓跑对方，报价过低又会使对方占了便宜而自身无利可图。日本人对报价极为精通，首次报价一千万日元，比国际行情高出许多。\n\n### 金句摘录\n> 在任何的谈判博弈展开之前，准备的越充分，对自己越有利，胜算也越大。\n> 报价过高会吓跑对方，报价过低又会使对方占了便宜而自身无利可图。\n\n---\n\n## 第 0120 集｜准备充分很重要2\n\n### 核心内容\n\n本集继续这个案例。日本人这样报价是经过计算的：如果美国人不了解国际行情，就会以此高价作为谈判基础；但日本人过去曾卖过如此高价，有历史依据；如果美国人了解国际行情、不接受此价，他们也有此可辩，有台阶可下。事实上，美国人已经知道了国际行情，知道日本人在试探，果断地拒绝了对方的报价。日本人采取迂回策略，不再谈报价，转而介绍产品性能的优越性，用这种手法支持自己的报价。美国人不动声色，旁敲侧击地提出问题：贵国生产此种产品的公司有几家？贵国产品优于德国和法国的依据是什么？用提问来点破对方，说明美国人已了解产品的生产情况——日本国内有几家公司生产、其他国家的厂商也有同类产品，美国人有充分的选择权。\n\n日方主谈人充分领会了美国人提问的含义，故意问他的助手：我们公司的报价是什么时候定的？这位助手也是谈判的老手，极善于配合，于是不假思索地回答：是以前定的。主谈人笑着说：时间太久了，不知道价格有没有变动，只好回去请示总经理了。美国人也知道此轮谈判不会有结果，宣布休会，给对方以让步的余地。最后，日本人认为美国人是有备无患，在这种情势下，为了早日做成生意，不得不做出退让。准备充分再做交易，这是美国人的经商法则。在经商过程中，如果遇到不懂的问题，美国人会问到自己彻底弄清楚以后才善罢甘休。美国人这种“问则问个水落石出”的性格，在商业谈判中可以彻底表现出来。\n\n### 金句摘录\n> 日本人认为美国人是有备无患，在这种情势下，为了早日做成生意，不得不做出退让。\n> 准备充分再做交易，这是美国人的经商法则。\n\n---\n\n## 第 0121 集｜搞清楚对手的底牌1\n\n### 核心内容\n\n本集讲“搞清楚对手的底牌”。要想在谈生意中占得主动，一方面要防止对手翻看自己的底牌，另一方面自己也要想办法摸清对手的底牌，才能做到充分的知彼。书中介绍了一种“透视法”——并非用眼睛去看，而是用几种类似于透视的办法来洞察对手的底牌。如何透视对手的底牌？书中共给出十个策略：一、错误策略，卖主以很低的价钱吸引顾客前来，等顾客真有兴趣要买时，又说先前估价过程有错误，价格必须重新审定；二、提高品级策略，卖方想知道买主到底有多少预算，便在停放普通车型的场地询问买主对高档车有没有兴趣；三、降低品级策略，买主不知道出多少价钱卖方能接受，就先告诉卖方他在考虑买一种品级较低的产品，然后用这个较低价位去试探，看卖方能不能以这个价格卖给他品级较高的产品；\n\n四、步步升高策略，买卖两方谈好价之后，卖主反悔，说经过一番考察认定应该提高售价；五、心有余、钱不足策略，买主表示确实很有诚意买下产品，可是因为预算有限无能为力，于是双方开始商量是否有其他办法做成这笔生意；六、调解策略，因为谈判进行速度过快，买卖双方已竭尽所能做出最后的让步却仍未达成协议，甚至陷入僵局，这时运用仲裁从中调解，或许能使谈判重现生机；七、要不要拉倒策略，买主提出这种条件，目的是要试探卖方的反应；八、礼尚往来策略，买方提出一个可能的让步方案，并希望卖方礼尚往来，如果卖方果真依计让步，买主就会从较低的价位开始谈；九、二选一策略，买方得知两幅画的价格是八百元，若仅买一幅单价就提高到五百元，于是买主询问对方：两幅才八百元，这幅是五百元，那另一幅三百元，你卖不卖？十、单刀直入策略，假如以上策略全行不通，就不妨采用单刀直入法——不少人对你来我往的讨价还价缺乏耐心，宁愿直截了当地告诉你底价，至于你接不接受那是另外一回事。\n\n### 金句摘录\n> 掌握透视对方底牌的诀窍，你才能操控谈判的全局。\n> 要想在谈生意中占得主动，一方面要防止对手翻看自己的底牌，另一方面自己也要想办法摸清对手的底牌。\n\n---\n\n## 第 0122 集｜搞清楚对手的底牌2\n\n### 核心内容\n\n本集从“透视底牌”引到谈判心理。由于惯性使然，人们在反复做某项工作时，往往会产生思维定式，形成一定的心智模式。所以某些谈判老手往往可以据此猜到对方可能提出的要求，以及对方对其提议所持的态度，如此谈判的主动权就会落在他的手中。如果你在谈判博弈时发现对方对你的思路比较熟悉，最好动动脑筋，采取一定的策略来设法弥补这一劣势。比如，你可以趁休会之机，找一个可以替代你的谈判者登场，这很可能会使对方大吃一惊——因为对方不知道新的谈判者与前一个相比是不是更难对付、新的谈判者手法如何，这样对方心中就会因此产生很大的压力，甚至会自动瓦解。\n\n其实更换谈判者是一种谈判艺术，它最大的好处在于可以借此摸透对方的意图、摸清对方的底牌。书中以美国史考勒斯三兄弟为例：他们共同经营一家公司，在与对手谈判时在不同阶段分别登场。通常都是老三第一个上场，提出非常强硬的条件；待双方争执不下、谈不下去的时候，史考勒斯一方便提出暂停会议。当谈判再次开始时，一旁观阵的老二便出场，他会针对对方的目标和态度与对方认真较量，直到对方几乎无力应战之际，老二又退出，老大登场。由于老大一直在旁边不动声色地静观其变，通过前两个回合的较量，他基本上已摸准了对方的底牌，因而要不了几个回合，对方往往会迫于心理上的巨大压力而做出让步，并在合约上签字。\n\n### 金句摘录\n> 人们在反复做某项工作时，往往会产生思维定式，形成一定的心智模式。\n> 更换谈判者是一种谈判艺术，它最大的好处在于可以借此摸透对方的意图，摸清对方的底牌。\n\n---\n\n## 第 0123 集｜搞清楚对手的底牌3\n\n### 核心内容\n\n本集讲如何应对对手临时换人。如果你的对手在谈判时临时更换谈判者、变化谈判阵容，你该怎么应对呢？面对新的谈判者，你要保持冷静的头脑，不妨把优先发言权让给对方，让他先发表意见，你可以借此摸清新谈判者所持的态度，然后在此基础上提出自己的要求。如果新登场的谈判者不再理会刚才谈的议题，而刚才所谈的议题对你来说又非常重要时，你一定要坚持讨论旧的议题，这样对方很可能会回过头来再议原话题。\n\n本书提醒：不要把精力投放在旧的争执点上，否则只会把事情弄僵，也许换个角度来讨论会收到较好的效果。事实上，对方换人这一做法，无疑是在向你传达这样一个信息——他要改变目前的谈判状况；你也可以试着提出一项新的方案，以试探对方的真实意图，进而摸清对方的底牌。这一集把“窥探底牌”的攻防两方面都讲透了：既要用换人等手法去摸对方，也要防着对方用同样手法来摸自己；应对之道是冷静、让对方先开口、守住关键议题，同时敢于提出新方案试探虚实。\n\n### 金句摘录\n> 面对新的谈判者，你要保持冷静的头脑，不妨把优先发言权让给对方，让他先发表意见。\n> 对方换人这一做法，无疑是在向你传达这样一个信息，他要改变目前的谈判状况。\n\n---\n\n## 第 0124 集｜抓住对方心理才能搞定1\n\n### 核心内容\n\n本集转到“抓住对方心理才能搞定”。在公关谈判的历史上，有很多通过抓住对方心理迅速搞定对方的经典案例。书中首先讲巴拿马运河。巴拿马运河最早不是由美国开凿。十九世纪末，一家法国公司跟哥伦比亚签订了合同，打算在哥伦比亚的巴拿马省境内开一条连通大西洋和太平洋的运河，主持运河工程的总工程师就是因开凿苏伊士运河而闻名世界的法国人雷赛布。他自以为这一工程不在话下，然而巴拿马的环境与苏伊士有很大的不同，工程进度很慢，资金开始短缺，公司陷入窘境。\n\n美国早在一八八〇年就想开一条连贯两大洋的运河，由于法国先下手与哥伦比亚签订了条约，美国十分懊悔。在这种形势下，法国公司的代理人布里略访问美国，向美国政府兜售巴拿马运河，公司要价一亿美元。美国早已对运河公司垂涎三尺，知道法国拟出售公司，更是欣喜若狂。然而美国却故作姿态：罗斯福要美国海峡运河委员会提出报告，证明在尼加拉瓜开运河更省钱。报告指出，在尼加拉瓜开运河的全部费用不到两亿美元；在巴拿马运河的直接费用虽然只有一亿多，但另外要付出一笔收买法国公司的费用，这样算下来，开巴拿马运河的全部支出将超过两亿五千万美元。布里略看到这个报告后大吃一惊：如果美国不开巴拿马运河，法国不是一分钱也收不回了吗？于是他马上游说，表明法国公司愿意削价，只要四千万美元就行了。通过这一方法，美国就少花了六千万美元。\n\n### 金句摘录\n> 美国却故作姿态，罗斯福要美国海峡运河委员会提出报告，证明在尼加拉瓜开运河省钱。\n> 通过这一方法，美国就少花了六千万美元。\n\n---\n\n## 第 0125 集｜抓住对方心理才能搞定2\n\n### 核心内容\n\n本集讲美国如何继续运用同一心理战术压服哥伦比亚政府。罗斯福又用同一计策来压哥伦比亚政府：他指使国会通过一个法案，规定美国如果能在适当时期内同哥伦比亚政府达成协议，将选择巴拿马开运河，否则美国将选择尼加拉瓜。这样一来，哥伦比亚也坐不住了。驻华盛顿大使马上找美国国务卿海约翰协商，签订了一项条约，同意以一百万美元的代价，长期租给美国一条两岸各宽三公里的运河区，美国每年另外付租金十万美元。这个过程中，美国政府始终把握好了对手的心理底线，以退为进，用极低的价格达到了自己的目的。\n\n本书总结：公关谈判是一场与对手进行的心理战术，如果不能很好地把握对手的底牌，往往会事倍功半。在很多时候，如果能够抓住对方心理最容易被打动的地方，就是能够成功攻关的关键。这一集用巴拿马运河的完整案例说明：美国的每一次“退”（表面上选择尼加拉瓜、提出更贵的方案），其实都是在为“进”（用极低价拿下巴拿马运河）铺路；真正被拿捏的不是价格，而是对手“怕一分钱也收不回”“怕失去机会”的心理底线。\n\n### 金句摘录\n> 美国政府始终把握好了对手的心理底线，以退为进，用极低的价格达到了自己的目的。\n> 公关谈判是一场与对手进行的心理战术，如果不能很好的把握对手的底牌，往往会事倍功半。\n\n---\n\n## 第 0126 集｜抓住对方心理才能搞定3\n\n### 核心内容\n\n本集用两个贴近生活的例子说明“打动心底最软处”的威力。其一是小王的故事：小王是一家营销公司的公关经理，有一单生意是和市里一家著名的大企业合作，这单生意他的公司非常看重。小王的任务就是要让该企业的梁老板愿意把钱投资到他的公司。开始的时候事情进展得并不顺利，因为梁老板觉得这家公司是一家小公司，不愿意投资。小王从多方打听得知，梁老板是从农村一步步打拼出来的，对家乡的老母亲感情非常深，但由于工作繁忙，已经很长时间没有回家看过母亲。小王决定到梁老板的老家跑一趟，以梁老板的名义带去了些礼物，并把老人家的生活状态拍了下来。回到市里，小王找到了梁老板，当梁老板看到母亲的录像时，眼睛湿润了，小王知道自己这次触动了梁老板心里的那根弦。梁老板看到小王这么用心，决定把钱投资到他们公司。\n\n其二是推销之王乔杰拉德的自传故事：一位中年妇女走进展销室，说她只想看看车打发时间，她想买一辆福特，可大街上的推销员让她一小时后再去找他，她还说这是给自己的生日礼物，今天是她五十五岁生日。乔杰拉德祝她生日快乐，然后借口出去一下；返回时他介绍说，既然有空，请允许我介绍一种我们的雪佛莱轿车，也是白色的。大约十五分钟后，一位女秘书走进来递上一沓玫瑰花，乔杰拉德把花送给那位妇女，说：祝您生日快乐，尊敬的夫人。她显然很受感动，眼眶都湿润了，说已经很久没有人给她送花了。闲谈中她讲起想买的福特，说那个推销员真差劲，猜想他一定是因为看到自己开着一辆旧车，就以为买不起新车，正在看车时那推销员却突然说要去收一笔欠款，叫她等他回来。在这次销售中，乔杰拉德面对一个已经选定其他车型的女士，发现了她的需求，通过送花的方式打动了她的心理，从而实现了销售。本书点出：谈判能力是一个人综合素质的反映，一个谈判能力强的人，一定是一个善于读懂别人心理、善于把握机会的人。\n\n### 金句摘录\n> 在很多时候，如果能够抓住对方心里最容易被打动的地方，是能够成功攻关的关键。\n> 一个谈判能力强的人，一定是一个善于读懂别人心理的人，是一个善于把握机会的人。\n\n---\n\n## 第 0127 集｜转移对方的注意力1\n\n### 核心内容\n\n本集讲“转移对方的注意力”。“巧设迷局、请君入瓮”，是谈判中经常使用的技巧，它最大的好处是：即使你处于博弈的劣势中，也可以通过这个技巧改变局面，从而实现博弈的胜利。书中讲了一个推销员阿里森的例子。阿里森是一家电器公司的推销员，一次他到一家公司去推销电机，这家公司前不久刚从阿里森手中买过电机，由于使用不当，电机的温度超过了正常的发热指标，所以这家公司的总工程师一看到他就不客气地说：阿里森，你不想让我多买你的电机吗？阿里森在仔细了解情况之后，发现总工程师的说法是不正确的，但他没有强行辩解，而是决定以理服人，让客户自己改变态度。\n\n于是他微笑着对这位总工程师说：好吧，斯宾塞先生，我的意见和你的一样，如果那电机发热过高，别说再买，就是已买的也要退货，是吗？斯宾塞肯定地回答：是的。阿里森接着说：当然电机是会发热的，但你绝不希望它的温度超过全国电工协会规定的标准。对方又一次做出了肯定的回答。在得到两个肯定答案之后，阿里森开始讨论实质性问题：按标准，电机的温度可比室温高七十二度，是吗？是的。但是你们的电机却比这个指标高出许多，简直让人无法用手摸，难道这不是事实吗？阿里森没有回答这个问题，而是反问道：贵公司车间的温度是多少？斯宾塞想了一下说：大约是七十五度。阿里森听了点点头，恍然大悟地说：这就对了，车间的温度是七十五度，加上应有的七十二度，一共是一百四十度左右，请问，要是你把手放进一百四十度的水里，会不会把手烫伤呢？对方不情愿地点点头；阿里森趁热打铁地说，那么你以后就不要用手去摸电机了，放心，那热度是正常的。就这样，阿里森提出了一系列的问题，使对方在一连串“是”的回答中，不知不觉地否定了自己原来的观点，消除了疑虑，最后不仅取得了成功，还顺带做成了一笔生意。\n\n### 金句摘录\n> 使对方在一连串的“是”的回答中，不知不觉的否定了自己原来的观点，消除了疑虑。\n> 巧设迷局，请君入瓮，是谈判中经常使用的技巧。\n\n---\n\n## 第 0128 集｜转移对方的注意力2\n\n### 核心内容\n\n本集先总结上集案例，再讲另一个运用虚实结合的谈判故事。从这个案例不难看出，谈判者谋略的出发点在于巧布迷阵，借以给对手指示某种虚假的动向或暗示的信息，使之具有一定的诱惑力，其目的就在于搜索到对方更多有价值的信息，从而掌握谈判的主动权，达到请君入瓮的目的。在商务谈判中，谈判者常常运用虚实结合、巧布迷阵的策略，放置各种烟幕弹，干扰对方的视线，将对方引入迷阵，从而掌握谈判的主动权，改变对手的谈判态度，取得谈判的胜利。\n\n书中举了已经六十出头的魏德曼先生的例子。他在商业界仍然非常活跃，打算从日本引入一套生产线，双方在斯图加特开始谈判。在进行了八天的技术交流后，谈判进入了实质性阶段。日方代表发言：我们经销的生产线由日本最守信誉的三家公司生产，具备当今先进水平，全套设备的总报价是三百三十万美元。日方代表报完价后，淡然一笑，摆出一副不容置疑的神气。魏德曼先生缓缓站起身，掷地有声地说：据我们掌握的情报，你们的设备性能与贵国某会社提供的没有任何差异，而我的朋友从该会社购买的设备，比贵方开价便宜百分之五十，因此，我提请贵方重新出示价格。日方代表听了魏德曼的发言，面面相觑，就这样，首次谈判宣告结束了。离开谈判桌后，日方在一夜之间把各类设备的开价列了一个详细的清单，第二天报出的总价急剧跌到二百三十万美元，经过双方激烈的争论，总价又压到了一百八十万美元，至此，日方表示价格无法再压。这一集再次印证：掌握情报、虚实结合、先声夺人，是压缩对方要价空间的有效手段。\n\n### 金句摘录\n> 谈判者谋略的出发点在于巧布迷阵，借以给对手指示某种虚假的动向或暗示的信息。\n> 在商务谈判中，谈判者常常运用虚实结合、巧布迷阵的策略，放置各种烟幕弹，干扰对方的视线。\n\n---\n\n## 本篇小结\n\n本篇前半段以吴越争霸为教材，把“斗鸡博弈”讲到了底：实力相当的两方互不相让，主动进攻者往往先败；而胜利一方若因傲气或“绅士心态”主动退让、放过对手，也会把优势一点点让出去。吴国的灭亡，正是败在自己的退让与轻敌。后半段转入谈判桌，系统给出可操作的博弈法则：讨价还价是促成共识的过程，成交价由双方能力与位置决定，位置占优者更容易获利；谈前必须做足准备、摸清行情，才能不被对方的虚高报价牵着走；要善于透视对手底牌，警惕思维定式，必要时以换人打乱对手节奏；更高明的一层是抓住对方心理、转移对方注意力，用“巧设迷局、请君入瓮”让对方在一连串“是”中自己改口。贯穿全篇的主线一句话：谈判的胜负，往往不在口才，而在信息、位置与心理的较量。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0113 集｜契约为何成为一纸空文5","id":"第-0113-集契约为何成为一纸空文5"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0114 集｜契约为何成为一纸空文6","id":"第-0114-集契约为何成为一纸空文6"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0115 集｜契约为何成为一纸空文7","id":"第-0115-集契约为何成为一纸空文7"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0116 集｜讨价还价的智慧1","id":"第-0116-集讨价还价的智慧1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0117 集｜讨价还价的智慧2","id":"第-0117-集讨价还价的智慧2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0118 集｜讨价还价的智慧3","id":"第-0118 会与他人合作2\n> - 第 0134 集　学会与他人合作3\n> - 第 0135 集　一根筷子与一束筷子1\n> - 第 0136 集　一根筷子与一束筷子2\n> - 第 0137 集　既要合作还要分工1\n> - 第 0138 集　既要合作还要分工2\n> - 第 0139 集　既要合作还要分工3\n> - 第 0140 集　既要合作还要分工4\n> - 第 0141 集　取长补短才能快速前进1\n> - 第 0142 集　取长补短才能快速前进2\n> - 第 0143 集　优势互补赢得成功1\n> - 第 0144 集　优势互补赢得成功2\n> **时长**：约 39 分钟（各页时长求和）\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0129 | 转移对方的注意力3 | 魏德曼甩落对手资料，把日本人引入迷宫，压价到160万成交 |\n| 0130 | 用小妥协实现大目标1 | 妥协不是软弱，明智的妥协是以退为进、以小让换大得 |\n| 0131 | 用小妥协实现大目标2 | 妥协能止损、能换喘息、能保存在，是没有更好办法时的最好策略 |\n| 0132 | 学会与他人合作1 | 猎鹿模型：合作猎鹿每人饱10天，单打独斗只够吃2天 |\n| 0133 | 学会与他人合作2 | 合作猎鹿具帕累托优势，不要单打独斗 |\n| 0134 | 学会与他人合作3 | 时代要求广泛合作，合作能力是职场核心素质 |\n| 0135 | 一根筷子与一束筷子1 | 折筷寓言：一根易折，一把难断，团结才有力量 |\n| 0136 | 一根筷子与一束筷子2 | 拔河与蚁球：团结能化险为夷、战胜困难 |\n| 0137 | 既要合作还要分工1 | 分工是效率之源，中国孩子的瓶中小球实验印证有序分工 |\n| 0138 | 既要合作还要分工2 | 好拍档要能互补，理想组合是各提供不同专业与贡献 |\n| 0139 | 既要合作还要分工3 | 三人创业团队从诞生起就埋下不协调的缺陷 |\n| 0140 | 既要合作还要分工4 | 选错伙伴全盘皆输，合作要先看对方能否胜任职责 |\n| 0141 | 取长补短才能快速前进1 | 贾副史与工师取长补短则事成，分手则双双败绩 |\n| 0142 | 取长补短才能快速前进2 | 水母虾、琐蛄蟹、二头鸟、比肩人：互相依存才是正道 |\n| 0143 | 优势互补赢得成功1 | 小蛇骑大蛇装神灵：善借他人之力是成功捷径 |\n| 0144 | 优势互补赢得成功2 | 荀子“善假于物”，洛维洛借钱买船，一分钱没花成富翁 |\n\n---\n\n## 第 0129 集｜转移对方的注意力3\n\n### 核心内容\n\n本集是魏德曼谈判故事的高潮。在随后长达十天的谈判中，双方共计谈崩了三十次。由于双方互不妥协，拉锯战没有任何结果。魏德曼苦苦思索：回想整个谈判过程，前一段时间基本上是日方漫天要价、自己就地还价，处于较被动的状态；如果对方认为自己是抱着“过了这个村就没有这个店”的心态来压价，要想让他们让步就难如登天。经过一番冥思苦想，魏德曼计上心来，利用虚虚实实的手段，假装和另一家公司做了洽谈联系。这一小小的动作立即被日商发现，总价当即降到一百七十万美元。单从报价看，这个价格已相当不错，但魏德曼了解到，当时正有几家外商同时在斯图加特进销自己的生产线，他认为，如果把握住这个有利时机，很可能会迫使对方做出进一步让价。双方在谈判桌上的角逐呈现白热化状态。日方代表震怒了：我们几次请示东京，并多次压价，从三百三十万美元降至一百七十万美元，比原价降了百分之四十八点五，可以说做到了仁至义尽；而如今你还不签字，你也太无诚意了吧！说完气呼呼地把文件夹甩在桌子上。魏德曼回敬道：先生，我想提醒你的是，你们的价格和你们的态度，我都是不能接受的。说完同样气呼呼地把文件夹甩在桌上。由于魏德曼故意没有夹好文件夹里的文件，经这么一甩，文件夹里西方某公司的设备资料撒了一桌子。日方代表看到桌上的资料大吃一惊，急忙拉住魏德曼的手，满脸陪笑说：魏德曼先生，我的权限只能到此为止，请容我请示之后再商量商量。魏德曼说：请你转告贵会长，这样的价格我们不感兴趣。说完转身便走。最后，日方经过再次请示，双方以一百六十万美元成交。魏德曼在此次谈判博弈中获得成功的奥秘，就在于他利用了虚虚实实的诡诈谋略，把日本人引入自己设置的迷宫，使日方代表慌了手脚，最终疑惑动摇、败下阵来。\n\n### 金句摘录\n> 利用虚虚实实的手段，假装和另一家公司做了洽谈联系。\n> 把日本人引入自己设置的迷宫，使日方代表慌了手脚，最终疑惑动摇败下。\n\n---\n\n## 第 0130 集｜用小妥协实现大目标1\n\n### 核心内容\n\n本集转入“用小妥协实现大目标”。说到谈判博弈，自然要提到妥协。在市场上，买家与卖家经过讨价还价，最终以双方的妥协而成立；在国际冲突中，冲突双方各自做出让步，最后也以双方的妥协而解决冲突和纠纷。在一些人的眼中，妥协似乎是软弱和不坚定的表现，似乎只有毫不妥协才能显示出英雄本色。但是，这种非此即彼的思维方式，实际上是认定人与人之间的关系是征服与被征服的关系，没有任何妥协的余地。在现实生活中，人与人之间的关系逐渐由依赖与被依赖的关系转向相互依赖关系。就说买东西吧，过去东西短缺，买家只能求着卖家，价格自然是铁价不二；但现在不同了，市场经济下形成的买方市场，买家与卖家的关系变为相互依赖，使得讨价还价流行开来。在这种情况下，如果不肯做出任何妥协，那只能失去自身的生存与发展的机会，成为最终的失败者。\n\n本书强调：妥协并不意味着放弃原则，一味让步应当区分明智的妥协和不明智的妥协。明智的妥协是一种适当的交换：为了达到主要的目标，可以在次要的目标上做适当的让步。这种妥协并不是完全放弃原则，而是以退为进，通过适当的交换来确保自身要求的实现。相反，不明智的妥协就是缺乏适当的权衡，或是坚持了次要目标而放弃了主要目标，或是妥协的代价过高、遭受不必要的损失。因此，明智的妥协是一种让步的艺术，而掌握这种高超的艺术，可以换取更大的收益。只要妥协符合双方的长远利益，那这样的妥协就有利于谈判各方全盘优势的实现。也许从眼前或局部来看，妥协是一种支出，但这种支出是为了更长远、更重要的收获——它绝对不是损失，而是一种获取利益的科学战略。\n\n### 金句摘录\n> 明智的妥协是一种适当的交换，为了达到主要的目标，可以在次要的目标上做适当的让步。\n> 这种支出不是损失，而是一种获取利益的科学战略。\n\n---\n\n## 第 0131 集｜用小妥协实现大目标2\n\n### 核心内容\n\n本集讲妥协的三个优点。妥协是双方或多方在某种条件下达成的共识。从争取利益的角度上看，它不是最好的方法，但在没有更好的方法出现之前，它却是最好的策略。为什么呢？因为妥协具有以下优点：一、妥协可以避免时间、精力等资源的继续投入。在胜利不可得而资源消耗殆尽日渐成为可能时，妥协可以立即停止消耗，使自己有喘息调整的机会。也许你会认为强者不需要妥协，因为他资源丰富、不怕消耗；理论上是这样子，但问题是，当弱者以飞蛾扑火之势咬住你时，强者纵然得胜，也是损失不小的惨胜，所以强者在某些状况下也需要妥协。\n\n二、你可以借妥协的和平时期来扭转不利的劣势。对方提出妥协，表示他有力不从心之处，他也需要喘息，说不定他是要放弃这场博弈；如果是你提出，而他也愿意接受，并且同意你所提的条件，表示他也无心或无力继续这场博弈，否则他是不可能放弃胜利的果实的。因此，妥协可创造和平的时间和空间，而你便可以利用这段时间来引导态势的转变。三、你可以通过妥协维持自己最起码的存在。妥协常有附带条件，如果你是弱者并且主动提出妥协，那么虽然可能要付出相当高的代价，却换得了存在——存在是一切的根本，因为没有存在，就没有明天、没有未来。也许这种附带条件的妥协对你不公平、让你感到屈辱，但用屈辱换得存在、换得希望，相信也是值得的。\n\n### 金句摘录\n> 妥协可以避免时间、精力等资源的继续投入。在胜利不可得而资源消耗殆尽日渐成为可能时，妥协可以立即停止消耗。\n> 存在是一切的根本，因为没有存在，就没有明天，没有未来。\n\n---\n\n## 第 0132 集｜学会与他人合作1\n\n### 核心内容\n\n本集由妥协过渡到合作。人是社会的人，单独的存在是没有意义的，千万不要觉得自己可以一个人解决所有的问题，要学会与人一起合作或竞争。独木难成林，单枪匹马也难成事；一个人的行动往往会受到很多的限制，让自己难以向前。一只蚂蚁的力量是非常有限的，也无法成就一番事业、筑起一个蚁巢。社会学告诉我们，在原始社会，人们为生的方式主要是狩猎。在博弈论中，有一个著名的猎鹿模型，讲述了两个猎人共同猎鹿的故事。\n\n某一天，他们狩猎的时候看到一只梅花鹿，于是两人商量，只有这两个人齐心协力、都去猎鹿时，才会得到那只鹿；如果猎鹿的时候，一只兔子突然在其中一人身边经过，而这个人转而抓兔子，这人会得到兔子，但鹿就跑掉了。两人得到一只鹿的效用，远比分别得到一只兔子大。因此，一共有四种方案供选择：第一，猎人A和B都抓兔子，结果是A和B都能吃饱四天；第二，猎人A抓兔子、猎人B打梅花鹿，结果是A可以吃饱四天、B则一无所获；第三，猎人A打梅花鹿、猎人B抓兔子，结果是A一无所获、B可以吃饱四天；第四，猎人A和B合作抓捕梅花鹿，结果是两人平分猎物，都可以吃饱十天。如果双方都选择了猎鹿，即A猎鹿、B猎鹿，具有帕累托最优，是深入合作的最佳结果；如果双方都选择了猎兔，即双方没有合作，称为风险上策均衡；如果一人选择了猎鹿，而对方选择了猎兔，即对方没有诚信、背叛了原来的协议，则选择猎鹿者将一无所获，选择猎兔者将保证得到一定效用。\n\n### 金句摘录\n> 两人得到一只鹿的效用，远比分别得到一只兔子大。\n> 如果双方都选择了猎鹿，具有帕累托最优，为深入合作的最佳结果。\n\n---\n\n## 第 0133 集｜学会与他人合作2\n\n### 核心内容\n\n本集分析猎鹿模型的博弈结果。在这个博弈中，根据纳什均衡原理，应用博弈论中的严格劣势删除法，可以得到两个比较好的结果：要么分别打兔子、每人吃饱四天，要么合作、每人吃饱十天。明显的事实是，两人一起去猎梅花鹿，比各自去抓兔子可以让每个人多吃六天。按照经济学的说法，合作猎鹿的纳什均衡，比分别抓兔子的纳什均衡具有帕累托优势。\n\n书中用更常见的说法解释帕累托优势：合作时其中一方收益增大，而其他各方的境况都不受损失，这就是“帕累托优势”的含义。我们也可以看得出来，两个猎人自己单独行动的话是最不利的，得到的结果只能让大家吃两天。由此就得到一个原理：我们不要单打独斗，要学会与他人的合作；一个人的力量不足以让团队都好。从我们的生活中来看，我们都离不开朋友、家人，甚至是陌生人；有时候别人的一个眼神都可以给予你极大的鼓励。人是社会的人，单独存在是没有意义的，千万不要觉得自己可以一个人解决所有的问题，每个人都不是万能的神。\n\n### 金句摘录\n> 两个猎人自己单独行动的话是最不利的，得到的结果只能让大家吃两天。\n> 我们不要单打独斗，要学会与他人的合作，一个人的力量不足以让团队都好。\n\n---\n\n## 第 0134 集｜学会与他人合作3\n\n### 核心内容\n\n本集把合作提升到时代要求的高度。市场经济是广泛的交往经济，离不开与各种类型的人合作。今天的时代是竞争的时代，只有选择合作，才能成为最具竞争力的一族；今天的时代是全球一体化的时代，要成为国际人，更需要高超的合作能力，没有合作能力就不可能适应我们这个时代。今天的时代要求我们广泛地合作，我们也只能适应时代的要求，没有人能够独自成功。唱独角戏、当独行侠，是不能成大事的。俗话说得好，双拳难敌四手，三个臭皮匠赛过诸葛亮。只有运用合力、善于合作，才有强大的力量，才能把蛋糕做大、把事业做大做强。\n\n这就迫切要求我们每个人都应具有合作能力。合作能力指在工作事业中所需要的协调协作能力，其突出的特点是指向工作和事业，这正是许多企业组织极端重视员工的合作能力的原因所在。任何人离开了他人的支持和配合，离开了一个必要的环境，就像鱼儿离开了水一样，必将一事无成。团队的力量是伟大的：从远古时期，人类就懂得借助集体的合力求生存，进而征服自然；在不断进化的漫长过程中，人类终于主宰了这个世界，人与人之间的相互依存度越来越高。离开了他人、离开了人类文明，任何个人都将无法生存。不要一个人去战斗，充分与他人一起合作或者竞争，都是对自己有利的方式。\n\n### 金句摘录\n> 唱独角戏，当独行侠，是不能成大事的。\n> 任何人离开了他人的支持和配合，离开了一个必要的环境，就像鱼儿离开了水一样，必将一事无成。\n\n---\n\n## 第 0135 集｜一根筷子与一束筷子1\n\n### 核心内容\n\n本集用“一根筷子与一束筷子”的寓言讲团结的力量。俗话说人心齐、泰山移，在我们的生活、工作中，团队的力量也一样非常强大；博弈的力量不能只靠自己，要靠大家的团结。伊索寓言里有这样一个故事：从前有一个人有好几个儿子，他们经常发生争吵，这个人费了很大的劲，也无法让他的儿子们和和气气地生活在一起，于是他想出了一个办法，可以让他们明白自己的愚蠢。某天，老头把三个儿子召集在一起，给他们每人一根筷子，说道：你们将手中的筷子折断。儿子们虽然不知老头的葫芦里卖的是什么药，但还是照办了，三人手中的筷子都轻易地被折断了。老头又拿了一把筷子交给老大，说道：请你将手中的筷子一起折断。老大用了很大的力气也没能成功；老头对老二说，你来试试看，老二也无法做到；幺儿自诩年富力强，将二哥手中的筷子一把抢过，穷毕生之力去折那一把筷子，仍然毫不奏效。三人以疑惑的目光盯着父亲，只见老头颔首微笑：你们明白了吗，孩子们？他说，如果你们团结在一起，没有人可以是你们的对手；但如果你们一天到晚争吵不休、四分五裂，你们就会变得很虚弱，谁都可以打败你们。\n\n### 金句摘录\n> 如果你们团结在一起，没有人可以是你们的对手。\n> 但如果你们一天到晚争吵不休，四分五裂，你们就会变得很虚弱，谁都可以打败你们。\n\n---\n\n## 第 0136 集｜一根筷子与一束筷子2\n\n### 核心内容\n\n本集承接寓言，进一步论述团结。团结才会有力量，每个人都是社会的成员，社会的发展需要我们大伙团结努力、共同推进。没有人能主宰世界，我们只有团结起来，才能发挥整体的功能，共同创造世界的辉煌。就好比一个公司要在市场中立于不败之地，就必须团结公司成员的力量，开拓创新、与时俱进，那么这个公司才会不断地发展、不断地壮大，团结的力量就显而易见了。\n\n书中又举了拔河为例：这是一项有趣的娱乐活动，一项能让人的心与心连在一起、让人与人之间变得团结起来的运动，更让人体会到这是一项集体的运动，而不单是个人的项目。在拔河开始之后，它不再仅仅是拔河、娱乐或比赛，因为在这一刻，它有一种神奇的力量，能让所有的人都团结在一起；它最大的好处不仅是能让我们锻炼身体，更重要的是它能拉近人与人之间的距离，让所有人的力量都在那一刻凝聚在一起，彼此之间不分你我。无论场上的还是场外的，在这一刻都紧紧地靠在了一起，你会深深体会到，与你并肩作战的人都与你抱着同一个梦想、同一个信念。书中还有一个蚂蚁的故事：一个秋日的下午，一片临河的草丛突然起火，顺着风游走的火舌向草丛中央一个小小的丘陵包围过来，丘陵上无数的蚂蚁被逼得连连后退，似乎除了葬身火海已别无选择。但就在这时，出人意料的情形出现了：蚂蚁们迅速聚拢，抱成一团，滚作一个黑色的蚁球，冲向火海。烈火将外层的蚂蚁烧得噼啪作响，然而蚁球越滚越快，终于穿过火海，冲进小河，河水把蚁球卷向岸边，使大多数蚂蚁绝处逢生。这个故事告诉我们：团结就是力量，只有团结起来才能化险为夷、战胜困难。\n\n### 金句摘录\n> 团结才会有力量，每个人都是社会的成员，社会的发展需要我们大伙团结努力。\n> 团结就是力量，只有团结起来才能化险为夷，战胜困难。\n\n---\n\n## 第 0137 集｜既要合作还要分工1\n\n### 核心内容\n\n本集讲“既要合作，还要分工”。团队既需要合作，又需要分工，两方面不可偏颇。合作固然很重要，但也要懂得分工；分工才能各司其职、有规划地合作。一个团体中，主管要懂得授权，授权就是分工；部门要懂得团结，团结就能合作。分工与合作考验彼此的默契，就像二人三足，必须默契十足、动作一致，才能在缺陷中发挥互补的效能。根据亚当·斯密的分工理论，分工是提高劳动生产效率、促进经济增长的源泉；书中也提到，分工与协作能够产生一种集体形式的生产力。不分工的话，很容易造成大家做事的重复性和一些事情的盲区，这样不利于效率的提高。当我们分工之后，每个人各司其职，各自做好自己的工作，一个都不能缺失，每个人都是整体的一部分。就像我们的身体，不管少了手脚还是鼻子都不行，我们都会不舒服，不利于生活的继续。\n\n书中举了一个实验：有位老太太找了几个中国孩子做一个游戏，她把几个拴着细线的小球放进一个瓶子里，瓶口很小，一次只能容纳一个小球通过。她说这是一个火灾现场，每个人只有三分钟之内逃出瓶子才能活下去。她让每个孩子拿一根细线，开始计时。只见几个孩子从小到大依次把小球取了出来，老太太很惊讶——她在许多国家做过这个实验，但从来没有成功过，那些孩子无一例外都争先恐后地把细线拼命往上拉，导致最后一堆小球堵在瓶口。只有这几个中国小孩有秩序地喊“一二三，一个一个地出来”，结果实验成功了。这几个孩子在实验前就说好了：最小的孩子先出去，后面的等着。就这样简单地分了一下工，就相当于救了自己的命。\n\n### 金句摘录\n> 分工是提高劳动生产效率，促进经济增长的源泉。\n> 就这样简单的分了一下工，就相当于救了自己的命。\n\n---\n\n## 第 0138 集｜既要合作还要分工2\n\n### 核心内容\n\n本集由分工引出“选对拍档”。一个团队的活动就是这样，分到的责任是什么，就要认真去完成什么；有一个乱来，那么整体就会出现问题，所以我们一定要重视分工的作用。既然分工如此重要，我们与他人合作的时候，就要做好自己的事情，当然也需要自己的伙伴做得很好。好的伙伴是成功的一半，错误的伙伴，工作上的或个人的，或许比没有伙伴更糟。\n\n不过，有时候恐惧会阻止我们去寻找最佳拍档、形成达致胜利的伙伴关系。许多人担心，他们必须要跟别人分享权益、决策权以及随着计划或生意而来的特权；害怕的态度当然不会允许我们去做这种事。克服这个恐惧，我们就会知道，组合一对胜利拍档会更符合我们的利益。那么，判断一个拍档是否适合我们，有几个重要的考虑因素。如果合作伙伴中的成员基本上都做同样的事，那么不可避免的，这个人将比另外一个更辛苦地投入，结果那个人也开始不爽，自己老拉着另一个人前进；同样的，被拉着走的那个人也会不爽另一个人的催促，这通常不是最佳拍档。比较理想的模式是，每个伙伴最好可以提供不同的专业技术和贡献：一个擅长细节的计划，另一个擅长促销和公开演讲；或者一个擅长推销，另一个擅长内部机制的管理和质量监督。一对好的拍档，就好比一桩天作之合的姻缘，必须小心挑选。如果我们能结合正确的技术、工作伦理和事业，我们就可以创造出一对最佳拍档。\n\n### 金句摘录\n> 好的伙伴是成功的一半，错误的伙伴，工作上的或个人的，或许比没有伙伴更糟。\n> 一对好的拍档，就好比一桩天作之合的姻缘，必须小心挑选。\n\n---\n\n## 第 0139 集｜既要合作还要分工3\n\n### 核心内容\n\n本集讲一个创业失败者总结自己经验时发现的、因选择合作伙伴失误而导致混乱的案例。创业时，他们一共三人合创了这家企业，其中一位是他极好的朋友的朋友。朋友的朋友是主导人，而他在决定辞职创业时，只是与朋友的朋友通过几次电话，基本上是通过他朋友做一个中间人联系。他重点论述了三人的特性和不协调之处。我们假定A为他，B为他的朋友，C为朋友的朋友。\n\nA二十四岁，某集团负责产品的省区经理，主抓市场和销售，带领八十人左右的团队；性格比较沉默、偏内向、好思考，行动能力一般，独立思考较强。B二十六岁，某集团负责区域的区域经理，主抓客户，有带领团队经验；性格比较外向、好交流、不好思考，行动能力强，缺乏独立思维。C三十岁，某集团负责产品的策划人员，主抓市场和产品策略，无带领团队经验；性格比较偏激、易冲动急躁，表达能力强、思维快，有创意，独立思维强、行动能力强、谈判能力强。最初是很偶然的原因，B和C结识，C无资金，有预谋地影响B辞职创业，并拉来A，于是一个创业的初始团队诞生。这个团队从诞生之日就有几个无法消融的缺陷，导致了最后的分崩。\n\n### 金句摘录\n> 这个团队从诞生之日就有几个无法消融的缺陷，导致了最后的分崩。\n> C无资金，有预谋的影响B辞职创业，并拉来A，于是一个创业的初始团队诞生。\n\n---\n\n## 第 0140 集｜既要合作还要分工4\n\n### 核心内容\n\n本集把三人团队崩解的原因逐条列出。一、C是主导，要求A和B坚决执行C定的方针；但C的方针经常变化，据C的说法是市场和供应商的变化致使他们也需要改变，而始终A和B未能完全理解变化的原因及含义，C也没有做出明确的解释，因为C的经验丰富，A和B没有提出异议。二、C定的市场策略超过他们现有的资源能力，导致股东需要不断投入并对外借债，但一直入不敷出，账面现金流一直为红字；此时C还是坚定不移地坚持既定的市场投入策略，于是A和B继续投入，C却因为个人原因未能做大笔持续投入，导致A和B有怨言，因为最初C的投入也不及A和B。三、A对C不信任，认为C不是一名合适的领导者；B当时则是一团火热，胸怀着顺从C。四、为了追求更多的外部投资，C自主决断引入多名新股东，对每人均擅自承诺股权平均；但对于新股东的人选，只考虑资金的投入，不考虑其个人的期望、意愿及能力，对于某些未按其投入资金的新股东，很粗暴地予以抛弃。\n\n合作创业是现在很提倡的一种形式，它也是一种合作博弈：自己的人脉资金不足的时候，借用他人的智慧等来完成大家的事业。可是经过了很多失败的经验后，大家发现，合作伙伴的选择是一件很大的事情，没有好的伙伴，什么事情都不行。所以我们在与他人合作博弈的时候，要注意我们每个人各司其职，那么就要看看你的伙伴能不能胜任自己的职责，还要看他是否有足够的责任心等等。\n\n### 金句摘录\n> 合作伙伴的选择是一件很大的事情，没有好的伙伴，什么事情都不行。\n> 那么就要看看你的伙伴能不能胜任自己的职责，还要看他是否有足够的责任心。\n\n---\n\n## 第 0141 集｜取长补短才能快速前进1\n\n### 核心内容\n\n本集讲“取长补短，才能快速前进”：通过取长补短来共同进步，达到共赢的目的；两个人忠诚的合作，也就是为自己创造机会。书中讲了战国时期两个官员的故事：越国人的贾副史和工师，各有所长。贾副史善于计谋，但处事很不果断；工师处事果断，却缺少心计，常犯疏忽大意的错误。因为这两个人交情很好，所以他们经常取长补短、合谋共事。他们虽然是两个人，但好像有一条心，这两个人无论一起去干什么，总是心想事成。后来他们在一些小事上发生了冲突，吵完架后就分了手。当他们各行其是的时候，都在自己的政务中屡获败绩。\n\n一个叫密须奋的人对此感到十分痛心，他哭着规劝两人说：你们听说过海里的水母没有？它没有眼睛，靠虾来带路，而虾则分享着水母的食物，这二者互相依存、缺一不可。我们再看一看琐蛄吧，它是一种带有螺壳的供气动物，寄居蟹把它的腹部当做巢穴；琐蛄饥饿了，靠螃蟹出去觅食，螃蟹回来以后，琐蛄因吃到了食物而饱，螃蟹因有了巢穴而安，这是又一个谁也离不开谁的例子。\n\n### 金句摘录\n> 两个人忠诚的合作，也就是为自己创造机会。\n> 这二者互相依存，缺一不可。\n\n---\n\n## 第 0142 集｜取长补短才能快速前进2\n\n### 核心内容\n\n本集续讲密须奋的劝解。他接着举了更多例子。再看蛩蛩駏驉（音）：蟨前足短，善求食而不善行走；而蛩蛩駏驉则四足高，善走路而不善求食。平时蛩蛩駏驉靠蟨提供的甘草生活，一旦遭遇劫难，蛩蛩駏驉则背着蟨逃跑，它们也是互相依赖的。恐怕你们还没有见过双方不能分开的另一典型例子，那就是西域的二头鸟：这种鸟有两个头，共长在一个身子上，但是彼此妒忌、互不相容，两个鸟头饥饿起来就互相啄咬，其中的一个睡着了，另一个就往它嘴里塞毒草，如果睡梦中的鸟头咽下了毒草，两个鸟头就会一起死去，它们谁也不能从分裂中得到好处。密须奋又说，北方有一种肩并肩长在一起的比肩人，他们轮流着吃喝、交替着看东西，死一个则全死，同样是二者不可分离。\n\n密须奋说：现在你们两人与这种比肩人非常相似，你们和比肩人的区别仅仅在于，比肩人是通过形体，而你们是通过事业联系在一起的。既然你们独自处事时连连失败，为什么还不和好呢？贾副史和工师听了劝解，对视着会意地说：要不是密须奋这番道理讲得好，我们还会单枪匹马受更多的挫折。于是两人言归于好，重新在一起合作共事。这则寓言通过密须奋讲的五个故事，以及贾副史和工师的经验教训告诉大家：生物界中各个个体的能力是非常有限的，在争生存、求发展的斗争中，只有坚持团结合作、取长补短，才能赢得一个又一个胜利。\n\n### 金句摘录\n> 生物界中各个个体的能力是非常有限的，在争生存求发展的斗争中，只有坚持团结合作，取长补短，才能赢得一个又一个胜利。\n> 你们和比肩人的区别仅仅在于，比肩人是通过形体，而你们是通过事业联系在一起的。\n\n---\n\n## 第 0143 集｜优势互补赢得成功1\n\n### 核心内容\n\n本集讲“优势互补，赢得成功”：只有充分发挥自己的才智，利用自己和别人的优势，更好地合作，才能赢得博弈游戏。书中引《韩非子·说林上》的一则寓言故事：蛇要迁移，于是小蛇对大蛇说，你在前，我跟着你走，人们就会认为这是普通的蛇，会将我们打死的；大蛇问那该怎么办呢？小蛇说，你就让我站在你的头上一起走，人们一定会认为我是神灵。果然，大蛇背着小蛇走，人们见了不但不敢打他们，还感到惊奇，都以为见到了神灵，烧香叩拜、祈求保佑。\n\n这则寓言教会我们：要随机应变，要善于与他人合作，合理利用身边的物力和人力，让这些人力和物力发挥最大的作用，也能让自己处于博弈游戏的强势状态之中。每一次的博弈都不是一个人单独的活动，是要与外界的事物或者人联系的；如果能够合理利用别人手里的力量，就会让自己的力量更加强大。在自己的力量还没有足够强大的时候，借助他人的力量是走向成功的捷径。对于一个人来说，要获得进一步发展，更免不了借助他人的力量。像上面的小蛇与大蛇，它们任何一个的力量都是不够的，如果单独出去，肯定会被人打死在路上；那么在这样的博弈游戏中，这两条蛇就成了失败者，不但找不到一个新的住宿地点，可能连命都要搭进去。但是这两条蛇懂得利用自己的智慧，知道怎么去迷惑众人、知道怎么才能加强自己的力量，让人不但不敢伤害自己，而且还奉为神灵一般。无疑，这两条蛇是智者。\n\n### 金句摘录\n> 如果能够合理利用别人手里的力量，就会让自己的力量更加强大。\n> 在自己的力量还没有足够强大的时候，借助他人的力量是走向成功的捷径。\n\n---\n\n## 第 0144 集｜优势互补赢得成功2\n\n### 核心内容\n\n本集把“借力”讲到底。一个人不管他的能耐有多大，他的智慧和才能都是有限的；唯有借助他人的能力和智慧、取长补短，才能广采博集、发挥集体的智慧。特别是在全球化迅速发展的今天，更离不开他人的智慧和支持。书中引荀子《劝学》的一段精彩论述：登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰；假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河；君子生非异也，善假于物也。也就是说，登上高处挥动手臂，在很远的地方也能看到；顺风而呼，声音并非洪亮，但听到的人都觉得很清楚；借助马车，不用腿跑也能行千里之远；借助船只，水性不好也能渡过大江河——乘船的人能渡江河，并非他的游泳技术好，而是他借用了船的力量；骑马的人能行千里，也不是他跑得快，而是他借用了马的力量。\n\n书中又举了美国亿万富翁洛维洛的例子。他近四十岁时还很穷、不成气候，无所事事地混了几十年后，突然大彻大悟，发现了一个借钱发财的办法。他先说服银行给他一笔贷款，买了一条货船，将之改为游轮包租出去；而后又以这条船做抵押，到银行借了另一笔贷款，买了第二条货船，也改成游轮出租。随后的几年中，洛维洛不断地贷款买船出租，生意越来越大。后来，他借钱赚钱的方法又上了一个新台阶：他组织人设计了一条船，在安装龙骨之前，便找到一家运输公司，说服该公司预定包租这条“八字还没有一撇”的船；洛维洛拿着该公司与他签订的合同，并以未来的租金为抵押，到银行里贷款建造这艘船。若干年之后，洛维洛连本带息还清了这笔贷款，拥有了这艘船，但从严格意义上说，他却始终没有花过一分钱。\n\n### 金句摘录\n> 君子生非异也，善假于物也。\n> 他借用了船的力量，从严格意义上说，他却始终没有花过一分钱。\n\n---\n\n## 本篇小结\n\n本篇从谈判桌上的“虚虚实实”讲起，以魏德曼把日本人引入迷宫、压价成交收尾，随后转入合作博弈的完整主题。核心逻辑分三层：第一层是“妥协”，妥协并非软弱，明智的妥协是以退为进、放弃次要目标以确保主要目标，它能止损、能换喘息、能保住最起码的存在；第二层是“合作”，猎鹿模型说明合作猎鹿是帕累托最优，单打独斗最吃亏，折筷子、拔河、蚁球都印证团结的力量；第三层是“分工与互补”，分工是效率之源，好拍档要能提供不同的专业技术，选错伙伴足以导致创业崩盘，而水母与虾、二头鸟、比肩人乃至荀子的“善假于物”，都说明取长补短、借力而行才是走向成功的捷径。全篇的方法论可归为一句：会妥协、能合作、懂分工、善借力，才能在博弈中把蛋糕做大、让自己走得更远。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0129 集｜转移对方的注意力3","id":"第-0129-集转移对方的注意力3"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0130 集｜用小妥协实现大目标1","id":"第-0130-集用小妥协实现大目标1"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0131 集｜用小妥协实现大目标2","id":"第-0131-集用小妥协实现大目标2"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0132 集｜学会与他人合作1","id":"第-0132-集学会与他人合作1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0133 集｜学会与他人合作2","id":"第-0133-集学会与他人合作2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0134 集｜学会与他人合作3","id":"第-0134-集学会与他人合作3"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0135 集｜一根筷子与一束筷子1","id":"第-0135-集一根筷子与一束筷子1"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0136 集｜一根筷子与一束筷子2","id":"第-0136-集一根筷子与一束筷子2"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0137 集｜既要合作还要分工1","id":"第-0137-集既要合作还要分工1"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0138 集｜既要合作还要分工2","id":"第-0138-集既要合作还要分工2"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0139 集｜既要合作还要分工3","id":"第-0139-集既要合作还要分工3"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0140 集｜既要合作还要分工4","id":"第-0140-集既要合作还要分工4"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0141 集｜取长补短才能快速前进1","id":"第-0141-集取长补短才能快速前进1"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0142 集｜取长补短才能快速前进2","id":"第-0142-集取长补短才能快速前进2"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0143 集｜优势互补赢得成功1","id":"第-0143-集优势互补赢得成功1"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0144 集｜优势互补赢得成功2","id":"第-0144-集优势互补赢得成功2"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]},{"id":"T10","title":"第0145-0160集","full":"每天读点博弈论 · 第 0145–0160 集（借势共赢与取舍之道）","lect":"","dur":"39:00","sec":2340,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0145–0160 集（借势共赢与取舍之道）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0145–0160 集（145 优势互补赢得成功3；146 覆巢之下，焉有完卵1；147 覆巢之下，焉有完卵2；148 把优势变成生存的资本1；149 把优势变成生存的资本2；150 把优势变成生存的资本3；151 欲望博弈中的选择1；152 欲望博弈中的选择2；153 人际交往中的心理博弈1；154 人际交往中的心理博弈2；155 当断不断必然自乱1；156 当断不断必然自乱2；157 当断不断必然自乱3；158 舍小部，保大局1；159 舍小部，保大局2；160 舍小部，保大局3）\n> **时长**：约 39 分钟（各页时长求和）\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0145 | 优势互补赢得成功3 | 单方都难成事，互相借力才能形成强力组合，实现和谐双赢 |\n| 0146 | 覆巢之下，焉有完卵1 | 整体遭殃则个体难保，团队精神因此至关重要 |\n| 0147 | 覆巢之下，焉有完卵2 | 集体和个体相互依存，团队里聪明人也要有肯担事的\"笨人\" |\n| 0148 | 把优势变成生存的资本1 | 博弈的目的是趋利避害，弱者只能设法把损失降到最小 |\n| 0149 | 把优势变成生存的资本2 | 王氏兄弟借司马睿的皇族身份，在江南为他立威铺路 |\n| 0150 | 把优势变成生存的资本3 | \"王与马共天下\"：弱者司马睿只能靠借助对方优势换取生存 |\n| 0151 | 欲望博弈中的选择1 | 与贪婪博弈应取无欲则刚，乞丐贪心接金终成空 |\n| 0152 | 欲望博弈中的选择2 | 父子拓宽石缝求更多金沙，反把原有的小金坑也毁了 |\n| 0153 | 人际交往中的心理博弈1 | 人心难测，一项\"选A还是选B\"的企业博弈由此展开 |\n| 0154 | 人际交往中的心理博弈2 | 选B是优势策略，合谋也难如愿，\"不要太贪婪\"才是稳妥之选 |\n| 0155 | 当断不断必然自乱1 | 协和谬误：没有十足胜算时，及早退出才是明智 |\n| 0156 | 当断不断必然自乱2 | 女孩一件衣服牵出一堆购买，沉没成本常逼人做非理性决策 |\n| 0157 | 当断不断必然自乱3 | 同样两难，企业老总因已投500万而选择继续，反可能再赔50万 |\n| 0158 | 舍小部，保大局1 | 舍弃局部保全大局，狼王断腿求生便是明证 |\n| 0159 | 舍小部，保大局2 | 拖住我们的常是患得患失，懂得选择与放弃才能谋求更大发展 |\n| 0160 | 舍小部，保大局3 | 南宋王佐断臂诈降，为说降陆文龙忍痛舍弃一臂 |\n\n---\n\n## 第 0145 集｜优势互补赢得成功3\n\n### 核心内容\n\n本集是\"优势互补赢得成功\"的收尾。讲的是一位年纪很大、起初毫无资本的富翁,他的起家靠的是巧借他人之力。他懂得如何利用别人的财产来赢得信任,继而获得更多资本。对银行而言,放贷能增加利润,而这位商人信誉好、有发展前途,银行也乐意提供资本为自己盈利。单看任何一方都难以成事,可当两者互相借力,就形成了强力的组合,从而赢下这场博弈,大家都达到了自己的目的,这就是和谐的双赢。\n\n现代商业社会越来越提倡双赢,这与均衡原理相通——只有双方都不吃亏,结果才是最好的。当今社会越来越开放,信息传播越来越快,企业的结构越来越庞大,专业分工越来越细致,靠个人单枪匹马闯天下的时代已经过去。要成功,就得借助他人的力量,而不是自己一个人的艰苦奋斗。换句话说,要调动外界一切能为我所用的资源,提高办事效率,迅速达到预定目标。\n\n外界的资源不利用就是浪费,要学会理性博弈,把已有的资源和自己的优势结合起来,给生活带来便利。\n\n### 金句摘录\n> 单看任何一方都难以成事,可当两者互相借力,就形成了强力的组合。\n> 靠个人单枪匹马闯天下的时代已经过去,要成功就要借助他人的力量。\n\n## 第 0146 集｜覆巢之下，焉有完卵1\n\n### 核心内容\n\n本集以\"覆巢之下,焉有完卵\"这一成语展开。当我们一起做事情的时候,很难独善其身;只有共同把事情解决,大家一起实现整体的美好,才是最好的。\n\n书中讲述了典故来源:汉献帝时,曹操独揽朝政、挟天子以令诸侯。一次曹操率大军南征刘备、孙权,孔融劝阻曹操停止出兵,曹操不听,孔融便在背地里发了几句牢骚。御史大夫与他素来不睦,得知后加油添醋地向曹操报告,并挑拨说孔融一向瞧不起曹操,祢衡对曹操的无理谩骂也是孔融指使。曹操大怒,当即下令将孔融全家抓起来一并处死。\n\n孔融被捕时,全家人都害怕不已,只有他两个八九岁的孩子还在玩钉钉子的游戏,毫无惶恐之色。家人以为孩子不懂事,偷偷叫他们快逃;孔融也恳求使者只加罪于自己一人,保全两个孩子。不料孩子竟不慌不忙地说:他们不会放过我们的,覆巢之下,安有完卵,恳求有什么用。结果父子三人从容就死。后人便以\"覆巢之下,焉有完卵\"作成语使用,比喻整体遭殃,个体或部分也不能保全。\n\n由此可以看出,拥有团队精神至关重要——当你的团队都不好的时候,又怎么会有好的个人发展呢?\n\n### 金句摘录\n> 覆巢之下,安有完卵,恳求有什么用。\n> 当你的团队都不好的时候,怎么可能有好的个人发展呢?\n\n## 第 0147 集｜覆巢之下，焉有完卵2\n\n### 核心内容\n\n本集接着讲整体与个体的关系。你要有足够的勇气伸出手并爬上别人的肩膀,尽管有时他们看起来摇摇晃晃;你必须同时接纳赞扬和批评,因为两者都是成长的必要途径;还要不断与合适的人在合适的环境中磨练自己,提高技能,求教于大师,从他们的成功与失败中学习,让他们也从你的观点中有所收获。\n\n追求个人利益最大化的人往往被誉为聪明人,最后也可能成功。但一个团体若人人都是聪明人,反而是个大问题。对一大群人来说,如果A对团体最好,而B对个人最好,这个人在团体中又拥有权力,他显然会选B——然而团体利益的损害最终也会影响到个人,正所谓\"倾覆之下,焉有完卵\"。所以一个团体里,聪明人需要,但也需要\"笨人\"、脑子一根筋的人,以团体目标为自己的目标,不惜牺牲个人利益。聪明人加笨人的团体,要好于都是笨人的团体;都是笨人的团体,又好于一盘散沙的聪明人组成的团体。\n\n人生活在团体之中,团体利益的损害与个人息息相关。我们个人追求的小目标有时对团体未必有利:士兵若贪生怕死、只为保全自己,就会损害国家利益。没有集体就无所谓个体,没有个体也无法成为集体,集体和个体永远相互依存。维护集体利益就是维护自己的利益,侵害集体利益就是侵害自己的利益。\n\n### 金句摘录\n> 团体利益的损害最终也会影响到个人,正所谓倾覆之下,焉有完卵?\n> 维护集体利益就是维护自己的利益,侵害集体利益就是侵害自己的利益。\n\n## 第 0148 集｜把优势变成生存的资本1\n\n### 核心内容\n\n本集转入\"把优势变成生存的资本\"。博弈的本质就是人与人之间采取合作还是非合作的方式,无论选择哪种方式,目的只有一个——趋利避害。\n\n现代社会讲究一切都要公平,但事实上可能吗?在市场经济条件制约下,不同商品的价值相差悬殊,其价值与使用价值也不一致。这种不一致必然通过等价交换的规律来实现不等价的交换,也就是说,形式上的等价交换,只是实质上的不等价交换。在这种矛盾而特殊的不等价交换规律中,弱者的选择只有两条:要么想尽办法让自己的损失降到最小,要么就此灭亡。出于人的本能,博弈的结果往往是前者。由此可见,是合作还是背叛,选择并不固定,但尽可能减少损失、让自己得利,则是不变的处事原则。\n\n随后书中以历史为例说明弱者之道。三国鼎立结束后,西晋司马氏统一了中国,可两晋政权并不稳固。连年战乱后地方割据残余势力依然存在,司马氏皇室子弟之间的权力斗争也十分激烈。其中颇有势力的是东海王司马越,几十年后他联合其他藩王发动内战争夺皇位,史称八王之乱。因藩王内讧和北方匈奴、羯胡趁机侵略,中国北方陷入战争浩劫,最终北方被匈奴和羯胡占据,司马越也战死。西晋皇族在战争中死伤过半,幸存者纷纷准备渡江逃避战乱。其中琅琊王司马睿势单力薄,渡江之前只想着避难自保,并未考虑渡江之后的计划。\n\n### 金句摘录\n> 是合作还是背叛,选择不是固定的,不过尽可能减少损失,让自己得利则是不变的处事原则。\n> 弱者只有在不利局势下想尽办法把损失降到最小,或者就此灭亡。\n\n## 第 0149 集｜把优势变成生存的资本2\n\n### 核心内容\n\n本集讲王氏兄弟如何借司马睿的皇族身份成就大业。司马睿作为皇族幸存者,仍具有一定政治号召力。王氏家族的精英王导和王敦便准备扶持他做渡江之后的皇帝。\n\n王氏家族在当时晋朝影响力不容忽视。王氏兄弟见国家危难,本想有所作为,却苦于自己既非司马氏皇族,又不是手握重兵的大将,有心无力。直到发现落难的皇族司马睿,便想借助他的皇族身份复兴大业。双方接洽后,说出了辅佐司马睿做皇帝、恢复西晋基业的想法,司马睿大喜过望,甚至有些感动,与王氏兄弟一拍即合,开始了司马氏与王氏的亲密合作。\n\n渡江之后,王氏兄弟马上按承诺提高司马睿的声势。三月初二,按当地风俗百姓和官员都要到江边祈福消灾。这一天,王导让司马睿坐上华丽的轿子到江边,前面有仪仗队鸣锣开道,王导、王敦和从北方来的大官名士骑着高头大马跟在后面,排成一支十分威武的队伍。司马睿的声望由此大涨,江南士族远远张望,见王导、王敦这些有声望的人对他如此尊敬,大吃一惊,怕怠慢了司马睿,一个接一个出来排在路旁拜见。王导又劝司马睿拉拢名士顾荣、贺循,派人上门请二人出来做官,两人都应允,江南大族纷纷拥护,司马睿在建康站稳了脚跟。北方大乱后,北方士族地主纷纷逃到江南避难,王导又劝他多吸纳优秀人才。经过这番经营,王氏兄弟联合各大家族,推举司马睿登上皇位,即晋元帝,建立了偏安东南百余年的东晋王朝。\n\n### 金句摘录\n> 直到发现落难的皇族司马睿,王氏弟兄便想借助他的皇族身份复兴大业。\n> 只要把这两人拉过来,就不怕别人不跟着我们走。\n\n## 第 0150 集｜把优势变成生存的资本3\n\n### 核心内容\n\n本集继续讲\"王与马共天下\"。晋元帝登基那天还发生了一个戏剧性的故事:王导和文武百官进宫朝见,晋元帝竟从御座上站起来,拉住王导,要他一起坐上御座接受百官朝拜。王导大为吃惊,因为在封建社会这是绝对不允许的,他忙不迭推辞,说这怎么行,如果太阳跟普通的生物在一起,生物还怎么能得到阳光的照耀呢?这番吹捧使晋元帝十分高兴,也不再勉强,王氏家族从此更受重用。\n\n从此,东晋虽是司马氏做名义上的天子,但掌握实权的是拥立他的王氏兄弟。司马睿对王氏兄弟极为尊敬,甚至上朝时宰相王导入座之前,自己都不敢坐龙椅。历史上把司马睿与王氏兄弟这对政治组合称为\"王与马共天下\",即司马氏和王室共同主宰朝政。\n\n人们只看到司马睿对王家兄弟的尊敬和畏惧,却没看出原因:王氏兄弟拥有政治实力和社会地位,司马睿虽为皇帝,但各方面都无法与王家相比。王家与司马睿名为君臣,实际上司马睿处于明显劣势,是这场博弈中的弱者。他若对王家兄弟稍有不敬,就可能被推翻、皇位不保。所以在博弈中,双方都需要借助对方,利用自己的优势,换取更好的生存条件。\n\n### 金句摘录\n> 虽然是东晋皇帝司马氏做名义上的天子,但是掌握实权的是拥立他的王氏兄弟。\n> 在博弈中,双方都需要借助对方,利用自己的优势,换取更好的生存条件。\n\n## 第 0151 集｜欲望博弈中的选择1\n\n### 核心内容\n\n本集进入\"欲望博弈中的选择\"。我们在生活中与贪婪博弈时,选择的策略就应是无欲则刚。我们说欲望是无底深渊,究其一生,我们都在和自己的欲望进行博弈。正是由于贪婪,很多本应有大好前途的人葬送了自己的一生。我们要和自己的贪婪做斗争,因为战胜了自己,也就战胜了一切;人类最大的敌人就是自己的贪婪。不管做生意还是做官,总是得陇望蜀:得到的东西不知珍惜,得不到的却念念不忘。\n\n书中讲了乞丐与上帝的故事。一个乞丐衣衫褴褛、面黄肌瘦,在大街上垂头丧气地走着,不停抱怨为什么唯独自己这么穷。上帝听到抱怨出现在他面前,问他最想得到什么。乞丐张口就说出自己的愿望。上帝说,好吧,脱下你的衣服来接,不过要注意,只有被衣服包住的才是金子,掉在地上就会变成垃圾,所以不能装得太多。乞丐迫不及待地脱下衣服,不一会儿金子从天而降,他忙不迭地用破衣服去接。上帝告诫他金子太多会撑破衣服,乞丐却不听劝告,兴奋地大喊再来点儿、再来点儿。正喊着,破衣服裂开一条大口子,所有金子落地瞬间都变成了破砖头、碎瓦片和小石头。上帝叹气消失了,乞丐又变得一无所有,只好披着更破更烂的衣服继续乞讨。\n\n所谓无欲则刚,有些人就像这个贪婪的乞丐,抵不住\"贪\"字,总想要得更多,最终却连本来拥有的也一并失去。\n\n### 金句摘录\n> 我们要和自己的贪婪做斗争,因为战胜了自己,也就战胜了一切。\n> 抵不住贪字,总是想要更多,最终却连本来拥有的也一并失去了。\n\n## 第 0152 集｜欲望博弈中的选择2\n\n### 核心内容\n\n本集用山泉金沙的故事继续说明克制贪欲的道理。一股细细的山泉沿着窄窄的石缝叮咚而下,多年后在岩石上冲出了三个小坑,还被泉水带来的金沙填满。某天一位砍柴的老汉来喝山泉水,偶然发现清冽泉水中闪闪的金沙,惊喜之下小心捧走。从此老汉不再受苦受穷、不再翻山越岭砍柴,每隔十天半月就来取一次沙,日子渐渐富裕起来。\n\n人们奇怪老汉发了什么财,老汉的儿子便跟踪父亲,发现了秘密。他看了看窄窄的石缝、细细的山泉和浅浅的小坑,埋怨父亲不该瞒着这事,不然早发大财了。儿子建议拓宽石缝、扩大山泉,不就能冲来更多金沙吗?老汉觉得有理,父子俩说干就干,把石缝拓宽了好几倍,又把石坑凿大凿深,累得半死却异常高兴。可父子俩天天跑去看,却天天失望而归——金沙不但没有增多,反而从此消失得无影无踪。原来水流一大,金沙便不再沉下来,父子俩连原来的小金坑都没有了。\n\n在生活中与贪婪博弈,选择的策略就应是无欲则刚,处处克制自己的贪婪,不管外在诱惑多大,仍岿然不动,即使错过时机也不后悔。因为我们对事物的信息掌握很少,在不了解信息的情况下贸然出手,要承担很大风险,就像金沙一样——表面看似是水流冲下来的,其实这是一条假信息,迷惑了这对父子。在不确定的情况下,只靠想当然和表面现象是不行的。\n\n### 金句摘录\n> 金沙不但没有增多,反而从此消失得无影无踪。\n> 在不了解信息的情况下贸然出手,要承担很大的风险。\n\n## 第 0153 集｜人际交往中的心理博弈1\n\n### 核心内容\n\n本集讲人际交往中的心理博弈。俗话说,知人知面难知心,画龙画虎难画骨。人心叵测,尤其在关系复杂的社会网中,每个人都有自己的为人处事方法,都有自己的心理表征。面对每一件事都要经过一番心理斗争,而社会的种种现象,正是发生矛盾的双方心理博弈的结果。在人际交往的心理博弈中,我们该如何选择呢?\n\n书中给出了一个有趣的博弈游戏。假设每一个学生都拥有一家属于自己的企业,现在企业陷入困境,他们只有在两个方案中任选其一以维持生存。方案A:生产高质量的商品,帮助维持现在较高的价格。方案B:生产伪劣商品,通过别人的损失来换取自己的所得。每个学生根据自己的意愿选择,选择的学生将把自己的收入分给每个学生。\n\n事实上,这是一个事先设计好的博弈,目的是确保每个选择B的学生总比选择A的学生多得50美分。这个设定有现实意义,因为生产伪劣商品的成本比生产高质量商品的成本低。不过,选择B的人越多,他们的总收益也就会越少——伪劣商品过多会造成市场混乱,他们的企业也会受影响,信誉跟着降低。\n\n本集给出了这套博弈的规则设定,为下一集的具体推演做铺垫。\n\n### 金句摘录\n> 知人知面难知心,画龙画虎难画骨。\n> 社会的种种现象正是发生矛盾的双方心理博弈的结果。\n\n## 第 0154 集｜人际交往中的心理博弈2\n\n### 核心内容\n\n本集具体推演上一集的企业博弈。假设全班27名学生都选择A,那么他们各得到1.08美元。假设有一个人偷偷改选B,那么选择A的学生少了一名,变为26名,各得1.04美元,比原来少了4美分;而改主意的那个学生则得到1.54美元,比原来多出46美分。不管最初选择A的人数有多少,结果都一样。很显然,选择B是一个优势策略:每个改选B的学生都会多得46美分,同时使其他同学各少得4美分,结果全班收入少了58美分。\n\n等到全班学生一致选择B,即尽可能使自己的收益最大时,他们将各得50美分。反过来讲,如果他们联合起来协同行动,不惜将个人利益减至最小化,他们各得1.08美元,但博弈的结果十分糟糕。在演练过程中,从起初不允许集体讨论,到后来允许讨论以便达成合谋,愿意合作选A的学生从3人到14人不等。在最后一次带有协议的博弈里,选A的学生为4人,全班总收益15.82美元,比全班成功合作可得的收益少了13.34美元。一个学生嘟囔道:我这辈子再也不会相信任何人了。\n\n事实上,这个博弈无论如何选择,都不会有最优情况出现,类似于囚徒困境。即使达成合谋,由于人的心理太过复杂,结果也不是预期的样子。所以在这样复杂的心理博弈中,我们不能苛求获得最好的结果,因为人心各异,最好结果根本不存在。遇到类似情况时,要保证一点——不要太贪婪,只要有利益就可以,不要妄求太多利益,或要获得比别人更多的利益。\n\n### 金句摘录\n> 选择B是一个优势策略,每个改选B的学生都会将多得46美分。\n> 不要太贪婪,只要有利益就可以,不要妄求有太多的利益。\n\n## 第 0155 集｜当断不断，必然自乱1\n\n### 核心内容\n\n本集讲\"当断不断,必然自乱\",核心是协和谬误。你买进一只股票,股价下跌,于是又在低位买进,股民称此为摊平,可它又下跌,你再次购买的本意是减少损失,却越陷越深。博弈论专家常将这种困境中的博弈称为协和谬误。对于协和谬误的博弈来说,在没有百分之百胜算的把握下,及早退出是明智的选择。\n\n书中以协和飞机为例。20世纪60年代,英国和法国政府联合投资开发大型超音速客机——协和飞机。开发一种新型商用飞机简直是一场豪赌:单是设计一个新引擎的成本就可能高达数亿美元,想开发更新更好的飞机,实际上等于把公司作为赌注压上去,难怪政府会被牵涉进去,竭力为本国企业谋求更大的市场。这种飞机机身大、设计豪华、速度快,但英国政府发现,继续投资开发,花费会急剧增加,而这样的设计定位能否适应市场还不知道;可停止研制,又将使以前的投资付诸东流。随着研制工作深入,他们更无法做出停止的决定。\n\n协和飞机最终研制成功,但因耗油大、噪声大、污染严重等缺陷,成本太高,不适合市场竞争,最终被淘汰,英法政府为此蒙受很大损失。如果当初能及早放弃,损失会减少,但他们没能做到。直到英法航空公司宣布协和飞机退出民航市场,才算从这个无底洞中脱身,这也是壮士断腕的无奈之举。\n\n### 金句摘录\n> 对于协和谬误的博弈来说,在没有100%胜算的把握下,及早退出是明智的选择。\n> 直到宣布退出民航市场,才算是从这个无底洞中脱身。\n\n## 第 0156 集｜当断不断，必然自乱2\n\n### 核心内容\n\n本集把协和谬误放到日常生活里。人们经常会陷入类似误区:某事物前期成本越高,对它后续的投入就越多。\n\n书中举出女孩买衣服的例子:很多女孩买了一件不错的上衣之后往往不会收手,发现没有合适的裤子搭配,就继续到商场里买裤子;等上衣和裤子准备好,又觉得鞋配不上这身衣服,于是再买鞋;鞋买好后,可能还要为整身行头配个新包。于是一大笔钱花出去,算下来一件衣服引发的购物超出了工资,\"月光公主\"由此诞生。其实女孩们陷入了协和谬误的博弈,忽视了购物的成本。\n\n在经济学上,我们把那些已经发生、不可收回的支出,如时间、金钱、精力,称为沉没成本。意思是在正式完成交易之前投入的成本,一旦交易不成就会白白损失掉。股市中的股民若最后股票退市,投入就成了沉没成本;因退出研发而在协和飞机上付出的经费也成了沉没成本;女孩们最后买的衣服饰物若没产生期望效果,被雪藏在衣柜里,开销也是沉没成本。\n\n从理性角度来说,沉没成本不应该影响我们的决策,然而挽回成本的心理作用往往让人在博弈中做出非理性决策,导致更大损失。在企业运营中,由于事先对决策的预见性并不准确,往往会出现协和谬误的困境,这种情况下及时放弃才是明智的选择。书中由此引出止痛药开发项目的案例。\n\n### 金句摘录\n> 在经济学上,我们把那些已经发生不可收回的支出,如时间金钱精力称为沉没成本。\n> 挽回成本的心理作用往往在博弈中让人做出非理性的决策,从而导致更大的损失。\n\n## 第 0157 集｜当断不断，必然自乱3\n\n### 核心内容\n\n本集继续用医药公司的例子讲沉没成本误区。假设你是一家医药公司的总裁,正进行一个新的止痛药开发项目。另外一家公司已开发出类似止痛药,通过它在市场上的销售情况可以预计:如果继续这个项目,公司有将近90%的可能性损失500万,有将近10%的可能性盈利2500万。到目前为止,项目刚刚启动,还没花费什么钱。从现阶段到产品研制成功、投放市场,还需耗资50万。你会坚持,还是现在放弃?正常人会选择放弃。\n\n再看第二道题:你同样是这家医药公司的总裁,对于这个止痛药开发项目,你们已经投入了500万元。只要再投50万,产品就可以研制成功、正式上市。成败概率与上述案例相同,你会坚持还是放弃?除了已投入500万之外,第二个问题与第一个问题完全一样。既然懂得了沉没成本误区,理应对两道题做出一致的决定。但把两道题分别给企业老总做,绝大多数老总对第二题的回答是\"坚持继续投资\",他们认为已经投了500万,再怎么样也要继续试试看,说不定运气好可以收回成本。殊不知,为了这已经沉没的500万,他们将有90%的可能非但收不回原有投资,还会再赔上50万。\n\n所以在投资时应该注意,如果发现是一项错误的投资,就应该立刻悬崖勒马,尽早回头,切不可因为顾及沉没成本而错上加错。事实上,为追回沉没成本而继续追加投资、导致最终损失更多的例子比比皆是。许多公司在明知项目前景黯淡的情况下依然苦苦维持,原因仅仅是因为在该项目上已经投入了大量资金。\n\n### 金句摘录\n> 为了这已经沉没的500万,他们将有90%的可能还会再赔上50万。\n> 如果发现是一项错误的投资,就应该立刻悬崖勒马,尽早回头。\n\n## 第 0158 集｜舍小部，保大局1\n\n### 核心内容\n\n本集进入\"舍小部,保大局\"。舍小保大,是协和谬误对人们生活的重要提示:在小利和大利面前,我们应该舍得放弃其中较小的一部分,保全较大的一部分,做一个能够权衡利弊的人。在面对困难时,我们应该能做到牺牲局部保全大局,这样才能够化险为夷。\n\n书中讲述了狼王的故事。丹尼斯是美国野生动物保护协会的成员,为了搜集狼的资料走遍大半个地球,见证了许多狼的故事。他在非洲草原曾目睹一个狼与猎狗交战的场面,至今难以忘怀。那是一个极度干燥的季节,许多动物因缺水缺食而死,生活在这里的猎狗和狼也面临同样的问题。狼群外出捕猎统一由狼王指挥,而猎狗却一窝蜂往前冲;猎狗仗着数量众多,常从猎豹和狮子嘴里抢夺食物。因狼和猎狗同属犬科动物,能相处在同一片区域,甚至共同捕猎,但食物短缺时二者也会发生冲突。\n\n这次为争夺被狮子吃剩的一头野牛残骸,一群狼和一群猎狗死伤惨重。由于猎狗数量比狼多得多,很多狼也被咬死。最后只剩一只狼王与五只猎狗对峙。狼王与猎狗力量相差悬殊,何况它还在混乱中被咬伤了一条后腿,那条拖拉在地上的后腿成了狼王无法摆脱的负担。面对步步紧逼的猎狗,狼王突然回头,一口咬断了自己的伤腿,然后向离自己最近的那只猎狗猛扑过去,以迅雷不及掩耳之势咬断它的喉咙。其他四只猎狗被狼王的举动吓呆了,站在原地不敢向前。\n\n### 金句摘录\n> 在小利和大利面前,我们应该舍得放弃其中较小的一部分,保全较大的一部分。\n> 那条拖拉在地上的后腿,是狼王无法摆脱的负担。\n\n## 第 0159 集｜舍小部，保大局2\n\n### 核心内容\n\n本集承接狼王的故事并给出结论。当危险来临时,狼王能毅然咬断后腿,让自己毫无牵累地应付强敌,这值得人们学习。人生中拖我们后腿的东西很多,那就是患得患失、瞻前顾后、惊慌失措。如果舍不得蝇头微利,就无法获取大的成功;如果承受不了砍去无法救治的后腿的痛苦,那么就有失去生命的危险。\n\n聪明的人凡事都会从大局着想,为整体利益暂时放弃一些局部利益,兵家、商家、职场人士无不知晓其中的道理。对不同的问题,若只知进不知退,只知得不知舍,试图处处得利,必会处处被动、整体失利,最终受其大害。\n\n\"舍足保居\"是一种策略。纵观天下,凡成就大事的人,无不懂得选择和放弃。为了谋求更大的发展,只有果断放弃眼前的某些利益;舍足保居不仅是为了保住性命,更是为了更好拥有。书中由此引出南宋的一段故事:南宋初年,金国四太子兀术率兵南侵,宋国派岳飞领兵抵抗,两军在诛仙镇会战。兀术有位义子叫陆文龙,是兀术自小调教的,武艺超群,连败几位宋将,岳飞只好挂出免战牌,思谋计策。宋部有位部将叫王佐,原是杨幺部下,自从来到岳飞营中一直没什么建树。这天晚上,他突然来到岳飞帐中,说有破敌之策。\n\n### 金句摘录\n> 人生中拖我们后腿的东西很多,那就是患得患失,瞻前顾后,惊慌失措。\n> 舍足保居,不仅是为了保住性命,而是为了更好的拥有。\n\n## 第 0160 集｜舍小部，保大局3\n\n### 核心内容\n\n本集讲王佐断臂说降陆文龙的故事。王佐告诉岳飞,陆文龙本是大宋潞州节度使陆登的儿子。潞州失陷,兀术杀了陆登夫妇,把襁褓中的陆文龙和乳娘带到北番养大。王佐愿去番营说服陆文龙来降。岳飞自然高兴,可转念一想,王佐怎能打入番营呢?王佐说早有计策,说罢抽出剑来一挥,砍下自己的右臂,岳飞赶忙制止,王佐已倒在血泊中,岳飞忙让军医包扎护理。王佐醒来,说了打入金营的办法,感动得岳飞热泪盈眶。\n\n休养几天后,王佐趁夜来到金营。巡逻兵带他来见兀术,王佐痛哭流涕,说了一番劝岳飞识时务、不要与强大的金国对抗、及早讲和的话,因此激怒岳飞被砍下右臂。直说得兀术动了情,安慰他一番后收在帐下。见王佐已不能出阵打仗,便权当顾问,需要了解宋营将士情况就找他来问。王佐本是儒将,饱读诗书,历史故事烂熟;金营诸将最爱打听中原历史,所以不时有人来找他饮酒闲扯。\n\n一日,王佐饮酒闲扯后回自己帐篷,路过一处,见一位老年妇人中原打扮,在帐外晒衣服。王佐看左右没人注意,便上前搭话,果然是陆文龙的乳母。乳母把他请入帐中,询问宋国情形,流露出不忘故国之情。王佐趁机问她日后有什么打算,妇人见是中原人也不避讳,表示出南归之意。王佐亮出身份,两人定下游说陆文龙之计。此后,王佐在乳娘安排下常去陆文龙营中讲故事。一天,王佐带去一幅画,说要为陆文龙讲个精彩故事。故事在此留作下篇的悬念。\n\n### 金句摘录\n> 在下早已有计策了,说罢抽出剑来一挥,便砍下了自己的右臂。\n> 王佐亮出身份,两人定下游说陆文龙之计。\n\n---\n\n## 本篇小结\n\n这一组十六集,围绕\"借势、克制与取舍\"三条主线展开。开篇以富翁借银行之力起家、王氏兄弟借司马睿皇族身份成就\"王与马共天下\",反复说明一个道理:单方难成事,弱者更要善用自己的优势去换取更好的生存条件,互相借力方能和谐双赢;同时也提醒我们,整体与个体相互依存,团队中既要有聪明人,也要有肯为团体目标担当的人。\n\n中段转入欲望与人心。乞丐贪心接金、父子拓宽石缝求更多金沙,都以失去原有之物收场,印证了\"无欲则刚\"与克制贪欲的智慧;企业与学生的博弈则说明,复杂心理博弈中最好结果根本不存在,不贪婪、有利益即可是稳妥之选。\n\n后段落在\"当断则断\"与\"舍小保大\"。协和谬误、沉没成本和企业老总的两难选择,告诉我们没有十足胜算时应及早退出;狼王断腿求存、王佐断臂诈降,则示范了牺牲局部保全大局的策略智慧。十六集一气贯通:善借外力、克制贪欲、果断取舍,正是把优势变成生存资本的三重功课。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0145 集｜优势互补赢得成功3","id":"第-0145-集优势互补赢得成功3"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0146 集｜覆巢之下，焉有完卵1","id":"第-0146-集覆巢之下焉有完卵1"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0147 集｜覆巢之下，焉有完卵2","id":"第-0147-集覆巢之下焉有完卵2"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0148 集｜把优势变成生存的资本1","id":"第-0148-集把优势变成生存的资本1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0149 集｜把优势变成生存的资本2","id":"第-0149-集把优势变成生存的资本2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0150 集｜把优势变成生存的资本3","id":"第-0150-集把优势变成生存的资本3"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0151 集｜欲望博弈中的选择1","id":"第-0151-集欲望博弈中的选择1"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0152 集｜欲望博弈中的选择2","id":"第-0152-集欲望博弈中的选择2"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0153 集｜人际交往中的心理博弈1","id":"第-0153-集人际交往中的心理博弈1"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0154 集｜人际交往中的心理博弈2","id":"第-0154-集人际交往中的心理博弈2"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0155 集｜当断不断，必然自乱1","id":"第-0155-集当断不断必然自乱1"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0156 集｜当断不断，必然自乱2","id":"第-0156-集当断不断必然自乱2"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0157 集｜当断不断，必然自乱3","id":"第-0157-集当断不断必然自乱3"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0158 集｜舍小部，保大局1","id":"第-0158-集舍小部保大局1"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0159 集｜舍小部，保大局2","id":"第-0159-集舍小部保大局2"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0160 集｜舍小部，保大局3","id":"第-0160-集舍小部保大局3"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]},{"id":"T11","title":"第0161-0176集","full":"每天读点博弈论 · 第 0161–0176 集（放弃的智慧与职场博弈）","lect":"","dur":"39:00","sec":2340,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0161–0176 集（放弃的智慧与职场博弈）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0161–0176 集（161 舍小部，保大局4；162 放弃的态度一定要坚决1；163 放弃的态度一定要坚决2；164 放弃的态度一定要坚决3；165 学会选择，学会放弃1；166 学会选择，学会放弃2；167 学会选择，学会放弃3；168 \"智猪博弈\"的职场启示1；169 \"智猪博弈\"的职场启示2；170 \"智猪博弈\"的职场启示3；171 \"智猪博弈\"的职场启示4；172 \"智猪博弈\"的职场启示5；173 \"智猪博弈\"的职场启示6；174 不进则退的职场博弈1；175 不进则退的职场博弈2；176 职场中改善关系的原则1）\n> **时长**：约 39 分钟（各页时长求和）\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0161 | 舍小部，保大局4 | 王佐舍己一臂换来大宋猛将，能舍才有得 |\n| 0162 | 放弃的态度一定要坚决1 | 不要为打翻的牛奶哭泣，把注意力放到新事情上 |\n| 0163 | 放弃的态度一定要坚决2 | 沉溺昨日只会错过今天的机会，马克因自暴自弃险些失去一切 |\n| 0164 | 放弃的态度一定要坚决3 | 拿得起放得下，今天是决定成败的关键 |\n| 0165 | 学会选择，学会放弃1 | 坚持之外也要懂得放弃，打不赢就跑是智者所为 |\n| 0166 | 学会选择，学会放弃2 | 乾隆以\"对不上\"点状元，懂得何时放弃才能事事如鱼得水 |\n| 0167 | 学会选择，学会放弃3 | 两个樵夫的抉择：舍不得棉花者最终两手空空 |\n| 0168 | \"智猪博弈\"的职场启示1 | 职场既要与人博弈，也要与自己博弈 |\n| 0169 | \"智猪博弈\"的职场启示2 | 小猪等大猪按按钮，搭便车成了优势策略 |\n| 0170 | \"智猪博弈\"的职场启示3 | 大猪张丽疲于奔命，小猪刘丽左右逢源 |\n| 0171 | \"智猪博弈\"的职场启示4 | 做小猪要靠人缘与关系网撑腰，并不轻松 |\n| 0172 | \"智猪博弈\"的职场启示5 | 投机取巧非长久之计，理想做法是既做大猪也会做小猪 |\n| 0173 | \"智猪博弈\"的职场启示6 | 李开复\"追随我心\"，前提是得到关键人物支持 |\n| 0174 | 不进则退的职场博弈1 | 不进则退，七成职场人陷入职业方向迷失 |\n| 0175 | 不进则退的职场博弈2 | 不要甘心当篓子里的螃蟹，要追求职业增值 |\n| 0176 | 职场中改善关系的原则1 | 逢人只讲三分话，忠诚是上司对员工的第一要求 |\n\n---\n\n## 第 0161 集｜舍小部，保大局4\n\n### 核心内容\n\n本集为\"舍小部,保大局\"收尾,讲完王佐断臂说降陆文龙的故事。陆文龙刚十六岁,稚气未退,听说要讲故事十分高兴。王佐先让他看那幅图画:画上一座官衙大堂,一位宋将坐在堂上,堂前躺着一位宋将和一位妇人,旁边一位妇人抹着眼泪,怀里还抱着孩子。陆文龙百思不解,请王佐从头讲来。王佐便说出金兀术入侵潞州、杀死节度使陆登夫妇、抢走陆家公子陆文龙的故事。陆文龙忙问那小孩怎么与自己重名,王佐说那小孩就是你,不信可问乳娘。陆文龙将信将疑,乳娘从帐后哭着出来,讲述当时经过。陆文龙听罢又恨又气,恨兀术杀死父母,气自己全然不晓、认贼作父。不久,陆文龙在王佐安排下投奔岳飞。岳飞得此猛将,大举进攻,把金兵打退了。\n\n自古凡成大事者,必深谙舍足保居之道:小到钱财房产,大到自尊手足,能舍才有得。王佐舍己一臂,却为大宋得一猛将,为击退金兵打下坚实基础,可谓功不可没。无论在职场上还是商场上,都经常出现舍足保居的现象:为了大利益做出一些相对较小的牺牲,是成功的上司、领导、企业家取得成功的博弈策略。即使你只是一名普通员工,也要学会\"舍得\"。\n\n### 金句摘录\n> 自古凡成大事者,必深安舍足保居之道,小到钱财房产,大到自尊手足,能舍才有得。\n> 为了大利益,做出一些相对较小的牺牲,是成功的上司领导企业家取得成功的博弈策略。\n\n## 第 0162 集｜放弃的态度一定要坚决1\n\n### 核心内容\n\n本集进入\"放弃的态度一定要坚决\"。放弃的态度要坚决,如果用积极的态度甩掉昨天的包袱,自己成功的机会才会更大。\n\n书中讲述了某位老师实验课上的一个实验。实验之前,老师什么话都没说,就把一杯早已准备好的牛奶倒进了水槽,牛奶洒了,杯子也碎了。同学们非常不解地看着他,也看着水槽里的牛奶和碎片。老师大声说:不要为倒掉的牛奶哭泣,我要你们记住这一刻,倒掉的牛奶是收不回来的,我们能做的就是在牛奶撒掉之前防止这样的事发生;现在牛奶洒了、杯子碎了,我们只有忘记这件事,投入到新的事情当中。\n\n世界上没有后悔药。当无法挽回的事情发生了,就不要总被它影响,要把注意力集中到新的事情当中,这样才能有新的机会。如果把精力用在为过去后悔上,那么你的损失会更大。人们从这个经典故事中总结出一句话——不要为打翻的牛奶哭泣,意思是损失已经造成,即使再怎么哭天抢地、怨天尤人,也于事无补,不如另寻他境、弥补已经造成的损失。\n\n在简单的环境里,我们大可以假设小心驶得万年船,用谨慎来避免错误;但在纷繁复杂的商场中,任何一个企业家都不可能只靠小心来赢得成功。经济环境的波动、政府政策的变化以及竞争对手的行为,让这个世界充满了不确定性。今天的决策看似大有可为、前途光明,明天就可能变得一文不值,反而成了累赘。牛奶洒不撒由不得你,你要做的是:哭泣,还是走开?\n\n### 金句摘录\n> 不要为打翻的牛奶哭泣,倒掉的牛奶是收不回来的。\n> 当无法挽回的事情发生了,你就不要总是被它影响,要把注意力集中到新的事情当中。\n\n## 第 0163 集｜放弃的态度一定要坚决2\n\n### 核心内容\n\n本集继续讲\"不要为打翻的牛奶哭泣\"。有人会想:牛奶是可惜了,不然可以换成200个鸡蛋,孵出200只小鸡,很快卖出,就可以去参加舞会,并遇上梦寐以求的心上人。这样一想,怎能忍心头也不回地走开?然而,就在你为牛奶哭泣的时候,另一个赚钱机会刚好从你身边偷偷溜走,留下你浑然不知。如果说开始那个决策变成地上的牛奶、让你蒙受损失,是天灾人祸,那么因哭泣而错过反击机会,就完全是咎由自取了。\n\n人生都是由昨天走到今天,再由今天走向明天。很多时候我们站在今天,却总对昨天念念不忘。并不是说昨天与我无关,而是为了自己能够生活得更好,不要总对昨天念念不忘。不管昨天你是成功还是失败,它都已成为过去式,虽然会对今天和明天有所影响,但已不能成为最终的决定因素。所以要尝试着忘记昨天,尤其是别为昨天而哭泣。\n\n书中讲了马克的故事。马克今年40岁,五年前他曾经历一场灾难,对他而言始终是一个警钟。马克大学毕业后事业顺利,在跨国企业干了四年,接近而立之年时想自己闯一番事业,于是开始创业。起初公司搞得红红火火,但因为一次失误的投资,让他几近破产。他心灰意冷,夜夜买醉,借酒浇愁。妻子试着劝他,全然无用;他总是抱怨运气不好,对妻子的劝告不仅不感激,还对妻子大发脾气。那时几乎没有人能让他想通、从头开始,他每天都在为昨天而流泪。\n\n### 金句摘录\n> 就在你为牛奶哭泣的时候,另一个赚钱机会刚好从你身边偷偷溜走了。\n> 不管昨天你是成功的还是失败的,都已成为过去式。\n\n## 第 0164 集｜放弃的态度一定要坚决3\n\n### 核心内容\n\n本集讲完马克的故事并给出结论。马克每天为昨天流泪,换来的结果是什么?妻子因无法再忍受他的自暴自弃和冷眼相对,决定离开他一段时间,搬回了娘家。可能是妻子的离开,让马克忽然觉得自己真的不像个人样了——那时喝醉回家冷冷清清,原来妻子总会照顾他,他觉得自己对不起妻子。后来他静下心来思考,想再从头开始。正好有位刚从海外回来的同学要在国内创业,先把他骂了一顿,也给了他一个从头开始的机会。经过几年打拼,他又走上事业顶峰,也与妻子重归于好。如今进入不惑之年的马克,已看不出曾经的潦倒,取而代之的是事业成功、家庭幸福的令人羡慕的样子。如果他继续自暴自弃、走不出昨天的失败,等待他的将是永远的失败,包括事业和家庭。\n\n\"拿得起放得下\",这句俗语说的就是这样一个道理。然而并不是所有人都能做到放得下,很多人依然活在对沉没成本的悔恨当中:每当想起以前发生过的事情,无论是亲人离别、初恋终结还是事业失败,都会感到痛苦。其实仔细想想,每个人手中最重要的是什么?不是已经过去的昨天,也不是还未到来的明天,而是你正在度过的今天。今天你的作为才是决定自己成败的关键;如果活在过去的阴影中走不出来,成功始终不会落在你头上。相反,如果用积极的态度甩掉昨天的包袱,成功的机会才会更大。\n\n### 金句摘录\n> 在每个人的手中,最重要的是什么?不是已经过去的昨天,也不是还未到来的明天,而是你正在度过的今天。\n> 拿得起放得下,这句俗语说的就是这样一个道理。\n\n## 第 0165 集｜学会选择，学会放弃1\n\n### 核心内容\n\n本集讲\"学会选择,学会放弃\"。我们必须要看清方向、认准方向,方向找对了就是一个成功的开始,而好的开始就是成功的一半。\n\n有记者曾问一位成功的企业家:成功的秘诀是什么?这位企业家毫不犹豫地回答:第一是坚持,第二是坚持,第三还是坚持,第四是放弃。的确,在一定条件下,放弃也可能成为走向成功的捷径。条条大路通罗马,此门不开别门寻,找到与自己才能相匹配的新努力方向,就有可能创造新的辉煌。\n\n毫无疑问,我们不应当轻言放弃,因为胜利常常孕育在再坚持一下的努力之中。古时愚公移山是一种伟大的坚持,科学家的发明创造也是一种伟大的坚持。法国杰出的生物学家巴斯德有句名言:我唯一的力量就是我的坚持精神。不少人在前进道路上,本来只要再多努力一些、再忍耐一些就可以成功,却放弃了,结果与即将到手的成功失之交臂。只有经得起风吹雨打、在各种困难和挫折面前永不放弃的人,才有可能获得成功。\n\n但是在有的情况下,你已经付出了最大的努力,却未取得理想的结果,这就需要认真考虑:如果是自己选定的目标方向同自己的才能不相匹配,就需要勇敢地选择放弃、另辟蹊径,没有必要在一棵树上吊死。军事上有\"打得赢就打,打不赢就跑\"之说。明明知道不是敌人的对手、胜利无望,却硬要鸡蛋往石头上碰、白白去送死,不是太蠢了吗?这时最好的选择就是打不赢就跑。这不是怯懦,而是智者所为。敢于放弃,并不是毫不在乎,也不是随随便便,而是以平常心面对现实:既要抓住机遇、勤奋努力,又要放弃那些不切实际的幻想和难以实现的目标,做到不急躁、不抱怨、不强求、不悲观。\n\n### 金句摘录\n> 第一是坚持,第二是坚持,第三还是坚持,第四是放弃。\n> 我唯一的力量就是我的坚持精神。\n\n## 第 0166 集｜学会选择，学会放弃2\n\n### 核心内容\n\n本集继续阐述放弃的智慧。人生在世,不可能没有追求、没有为之奋斗的目标。但如果人生总是无休止地追求而不知放弃,对完全没有可能实现的目标仍然穷追不舍,结果不但会无端浪费时间和精力,还会因达不到预期目标而烦恼不堪、痛苦不已。正确的态度是既要有所追求,又要有所放弃:该得到的得到,心安理得;不该得到的或得不到的则主动放弃,毫不留恋。学会放弃,你就会告别因求之不得而带来的诸多烦恼和苦闷,就会丢掉那些压得你喘不过气来的沉重包袱,就会轻装前进,就会活得潇洒和滋润。放弃不是消极避世,不是不思进取,不是斗志衰退,而是一种明智的选择,是另一种更实际、更科学、更合理的追求。\n\n书中讲了一个典故。据说有一次乾隆皇帝在殿试时,给举子们出了一个上联\"烟锁池塘柳\",要求对下联。一位举子想了一下,就直接说对不上来。另外的举子们还在苦思冥想时,乾隆就直接点了那个回答说对不上的举子为状元。这是为什么?原来这五个字以金木水火土五行为偏旁,几乎可以说是绝对。第一个说放弃的考生肯定思维敏捷,很快就看出了其中的难度,而敢于说放弃,说明他有自知之明,不愿把时间浪费在几乎不可能的事情上。\n\n人的时间和精力都是有限的,不可能面面俱到地做好每一件事,想要得到一切的人最终可能什么也不会得到。有一位学者曾说,放弃是智者对生活的明智选择,只有懂得何时放弃的人,才会事事如鱼得水。人生如戏,每个人都是自己的导演,只有学会选择和懂得放弃的人,才能创作出精彩的作品,拥有海阔天空的人生境界。人与人的差别,往往不在于面临的机遇的差别,而在于机遇来临时人们有不同的选择方式:有人单纯接受,有人怀疑旁观,有人固执地不肯接受任何新改变,不同的选择当然导致截然不同的结果。\n\n### 金句摘录\n> 放弃是智者对生活的明智选择,只有懂得何时放弃的人,才会事事如鱼得水。\n> 想要得到一切的人,最终可能什么也不会得到。\n\n## 第 0167 集｜学会选择，学会放弃3\n\n### 核心内容\n\n本集用两个樵夫的故事说明选择与方向的重要。两个贫苦的樵夫靠上山捡柴维持生计。有一天,他们在山里发现两大包棉花,喜出望外。棉花的价格高过柴薪数倍,卖掉后可让家人一个月衣食无忧。当下两人各自背了一包棉花赶路回家。走着走着,其中一名樵夫眼尖,看到山路上有一大捆布,走近细看竟是上等细麻布,足有十多匹。他喜出望外,和同伴商量一同放下棉花改背麻布回家,同伴却认为自己背着棉花已走了大段路,到了这里才丢下岂不枉费先前的辛苦,坚持不愿换。发现麻布的樵夫屡劝不听,只得自己放下棉花、竭尽所能背起麻布前行。\n\n又走了一段路,背麻布的樵夫望见林中闪闪发光,近前一看,地上竟散落着数坛黄金。他心想这下真发财了,赶忙邀同伴放下麻布和棉花、改用扁担挑黄金。同伴仍不愿丢下棉花,怕枉费辛苦,还怀疑黄金是假的,劝他别白费力气。发现黄金的樵夫只好自己挑了两坛黄金和背棉花的伙伴赶路回家。走到山下时突然下了一场大雨,两人在空旷处被淋透,背棉花的樵夫肩上大包棉花吸饱雨水,重得完全无法再背,不得已只能丢下一路辛苦舍不得放弃的棉花,空着手和挑黄金的同伴回家去。\n\n选择好前路的方向,就像在海中航行,一个能看清方向的人如灯光指引的航船,不会迷失风中;也像在沙漠中摸索,如掌握指南针,不会被海市蜃楼迷惑。人的一生面临的选择很多,可走的路也很多,略微迟疑、犹豫不决、踟蹰不前,就会导致我们远远落后于生命的轨迹。所以我们必须要看清方向、认准方向。\n\n### 金句摘录\n> 背棉花的樵夫不得已只能丢下一路辛苦舍不得放弃的棉花,空着手和挑黄金的同伴回家去。\n> 略微迟疑,犹豫不决,踟蹰不前,就会导致我们远远的落后于生命的轨迹。\n\n## 第 0168 集｜\"智猪博弈\"的职场启示1\n\n### 核心内容\n\n本集转入\"智猪博弈\"的职场启示。应对职场问题,我们不仅需要和领导、客户、同事博弈,更需要和自己博弈。当然,职场博弈的结果永远只有一个:不是自己淘汰自己,就是被别人淘汰,这就是职场进化论。只有拥有成熟心智的人,才能在任何时候都立于职场的不败之地。\n\n\"智猪博弈\"这一经典案例早已扩展到生活的各个方面,在当今职场中经常有类似情况发生:在办公室的人际冲突中,有一些人会成为不劳而获的\"小猪\",而另一些人却充当了费力不讨好的\"大猪\"。\n\n所谓智猪博弈,说的是有两头非常聪明的猪,一只比较大,一只比较小,生活在一个笼子里。笼子很长,笼子尽头有一个按钮,另一头是饲料的出口和食槽。按一下按钮,将出现相当于十个单位的猪食进槽,但按按钮以后跑到食槽所需付出的劳动量,加起来要消耗相当于两个单位的猪食。问题是按钮和食槽分置笼子两端:按按钮的猪付出劳动,跑到食槽时,坐享其成的另一头猪早已吃了不少。如果大猪先到,大猪吃到9个单位,小猪只能吃到1个单位;如果同时到达,大猪吃到7个单位,小猪吃到3个单位;如果小猪先到,小猪可以吃到4个单位,而大猪吃到6个单位。这套规则,正是推演职场博弈的模型。\n\n### 金句摘录\n> 职场博弈的结果永远只有一个,不是自己淘汰自己,就是被别人淘汰,这就是职场进化论。\n> 有一些人会成为不劳而获的小猪,而另一些人却充当了费力不讨好的大猪。\n\n## 第 0169 集｜\"智猪博弈\"的职场启示2\n\n### 核心内容\n\n本集具体推演智猪博弈。如果两只猪同时按按钮、同时跑向食槽,大猪吃进7个单位、付出2个单位,净得5个单位;小猪吃进3个单位、付出2个单位,实得1个单位。如果大猪按按钮、小猪先吃,小猪吃进4个单位,实得4个单位;大猪吃进6个单位,扣除付出的2个单位,实得4个单位。如果大猪等待、小猪按按钮、大猪先吃,大猪吃进9个单位、净得9个单位;小猪吃进1个单位,却付出了2个单位,实得负1个单位。如果双方都懒得动,所得都是零。\n\n由此可知,等待是小猪的优势策略,按按钮是小猪的劣势策略。先把小猪的劣势策略消去,等待就变成了大猪的劣势策略——注意是现在才变成劣势策略;把它也删去,就得到智猪博弈的结局:小猪只是坐享其成地等待,每次都是大猪去按按钮,小猪先吃,大猪再赶来吃。这种行为可以称之为\"搭便车\"。办公室里经常会出现这样的场景:有人做小猪,舒舒服服躲起来偷懒;有人做大猪,疲于奔命、吃力不讨好。但不管怎样,小猪笃定一件事——大家是一个团队,就是有责罚也落在团队身上,所以总会有大猪悲壮地跳出来完成任务。\n\n书中讲了张丽的故事。张丽可以说是智猪博弈中的大猪,每天下班回家第一件事就是打电话,向好朋友大吐苦水。她在一家公司的核心部门工作,每天这项工作还没完成,就有另外几项工作等着做,整天没有喘息机会。公司规模小,但她所在的重要部门只有三个人,还分了三个等级:部门经理、经理助理、普通干事。张丽正好是经理助理,处于中间级别。\n\n### 金句摘录\n> 等待是小猪的优势策略,按按钮是小猪的劣势策略。\n> 大家是一个团队,就是有责罚也是落在团队身上,所以总会有大猪悲壮的跳出来完成任务。\n\n## 第 0170 集｜\"智猪博弈\"的职场启示3\n\n### 核心内容\n\n本集继续讲大猪张丽的处境。张丽总抱怨:经理的任务就是发号施令,他是管理层,上面交给他的工作一句话就打发掉了——\"张丽把这件事办一办\"。可张丽接到活后,却不能对下属阿兵也潇洒地说一句\"你去办一办\":一来阿兵比她年长,又是经理的老兵;二来他学历低、能力有限,怎么放心把事情交给他?张丽只能无奈叹息,把自己当三个人用,加班加点完成上级任务。\n\n更让她想不到的是,由于事事都是她出面,其他部门同事渐渐认准了\"只要找发展部办事就找张丽\",甚至老总也不再向经理派任务,往往直接把文件扔到张丽桌上。她办公桌上的文件越堆越高,连阿兵都敢给她派活。这天阿兵把一叠发票放在她面前,说\"你帮我去财务报一下\"。张丽顿时被噎得说不出话,半晌才问:你自己为什么不去?阿兵不好意思地回答:我和财务不熟,你去比较好。尽管心中怒火万丈,但碍于同事情面,张丽最终还是走了这一趟。\n\n于是形成这样的局面:一上班,张丽就像陀螺一样转个不停;经理则躲在办公室里打电话,美其名曰联系客户;阿兵玩纸牌游戏,顺便上网跟老婆谈情说爱,好不逍遥。到了年终,由于部门业绩出色,上级奖励4万元,经理独得2万元,张丽和阿兵各得1万元。想想自己辛劳整年,却和不劳而获的人所得一样,张丽满心不平,但自己又能怎么做呢?如果她也不做事了,不仅连这一万元也得不到,说不定还会下岗。想来想去,还是继续当大猪吧。\n\n### 金句摘录\n> 一上班,张丽就像陀螺一样转个不停,经理则躲在自己的办公室里打电话。\n> 如果她也不做事了,不仅连这一万元也得不到,说不定还会下岗。\n\n## 第 0171 集｜\"智猪博弈\"的职场启示4\n\n### 核心内容\n\n本集讲\"小猪\"刘丽的处世哲学。刘丽在一家国企工作,她是个聪明人,这样为自己下断语:从大学开始,我就不是最引人注目的学生,在学生会里从不出风头,只是帮最能干的同学做些辅助性工作。如果工作搞得好,受表扬少不了我;但工作搞砸了,对不起,跟我一点关系也没有。刘丽工作三年,照样奉行这样的处世哲学。她说:我就纳闷,怎么会有那么多人下了班嚷嚷着自己累?要是又累又没有加薪升职,那只能说明自己笨。我从小职员当上经理,一直轻轻松松的,反正硬骨头自有人啃。\n\n有朋友问她:你这样同事不会有意见吗?刘丽一脸神秘地说出秘诀:第一,平时要善于感情投资,跟同事搞好关系,让他们觉得跟你是哥们儿,关键时刻会帮助你。第二,立场要坚定,坚决不做事,什么事都让别人做。有些人就是爱表现,你就给他们表现的机会,反正出了事先死的是他们。万一碰上也不爱表现的人对我看不惯,我会告诉他:我不是不想做,我是做不来呀;你想开掉我,对不起,我的朋友多,他们都会为我说话。在职场中,刘丽就是那种所谓的小猪,做什么事喜欢投机取巧。\n\n做大猪还是小猪?看来看去,做大事固然辛苦,但小事情也并不轻松。虽然工作可以偷懒,但私下里要花费更多精力去编织维护关系网,否则在公司的地位便会岌岌可危。张丽为什么忍气吞声?不就是因为阿兵是经理的老部下吗?刘丽又为什么有恃无恐?无非是有人为她撑腰。难怪说做小猪的都是聪明人,不聪明怎么能左右逢源。\n\n### 金句摘录\n> 反正硬骨头自有人啃。\n> 虽然工作可以偷懒,但私下里要花费更多的精力去编织维护关系网,否则在公司的地位便会岌岌可危。\n\n## 第 0172 集｜\"智猪博弈\"的职场启示5\n\n### 核心内容\n\n本集分析大猪小猪的结局与理想的职场做法。的确,大猪加班、小猪拿加班费这种情况在企业里比比皆是,因为\"我们什么都缺,就是不缺人\"。所以每次不论多大的事情,加班的人总是越多越好;本来一个人就可以做完的事,总是会安排两个甚至更多的人做,\"三个和尚\"的现象这时就出现了。如果大家都耗在那里谁也别动,结果是工作完不成、挨老板骂。这些常年在一起工作的同事对彼此的行事规则了如指掌:大猪知道小猪一直过着不劳而获的生活,小猪也知道大猪总碍于面子或责任心使然不会坐以待毙。因此总会有一些大猪过意不去,主动去完成任务,而小猪们在一边逍遥自在,反正任务完成后奖金一样拿。\n\n但这种聪明并不值得提倡。工作说到底还是凭本事、靠实力的,靠人缘关系也许能风光一时,但也是脆弱的、经不住推敲的。小猪什么力都不出反而被提升,看似混得很好,其实心里也会发虚,万一哪天露了馅,如果从事的不是团队合作性质的工作,而是侧重独立工作的职业,那又该怎么办,还能心安理得地当小猪吗?在职场中,大猪付出很多却没有得到应有回报,做小猪虽然可以投机取巧,但这并不是一种长远的计策。因此,身在竞争激烈的职场中,一个最理想的做法就是——既要做大猪,也要会做小猪。\n\n书中接着讲了李开复的事例。有人波澜不惊,有人风生水起,有人忙忙碌碌举步维艰,有人却如履青云直上九天。李开复从微软跳槽到Google,引起了一次人事地震,导致微软起诉Google,虽说官司最终和解,但两家世界知名公司为一个员工打官司毕竟少见。李开复给人的印象是儒雅、坦诚和智慧,中国的大学生们非常崇拜他。他曾说微软是他最后一个东家,在微软五年,跳槽走时又解释说是要\"追随我心\"。\n\n### 金句摘录\n> 工作说到底还是凭本事靠实力的,靠人缘关系也许能风光一时,但也是脆弱的。\n> 一个最理想的做法就是既要做大猪,也要会做小猪。\n\n## 第 0173 集｜\"智猪博弈\"的职场启示6\n\n### 核心内容\n\n本集继续讲李开复的职场经历。从经历看,李开复从小就很有个性,或者说是很叛逆:幼儿园没上完就要上小学,家长不同意,他就天天闹,最后还是让他上了学。20世纪70年代,李开复在美国读法律,毕业以后很可能成为大律师,在美国做律师既很有钱、社会地位也高;可他中途放弃,说要学新鲜的,于是学了计算机。那时计算机行业远没有现在这么火,可他还是冒险学了计算机。在他的职业生涯里,都是在一个地方干三五年就跳槽到别处。\n\n李开复虽然经常\"追随我心\"、有个性,但并不另类。他性格比较腼腆,但非常清楚在企业里得到关键人物的支持是最重要的,于是用了一个特别简单的办法——请人吃饭,向人请教。在公司里,大家吃午饭都很随便,李开复就专门去请本部门、其他部门的重要人物共进午餐;今天请吃,明天请吃,还总向人请教。这样几个月的时间,他就成为公司里所有关键人物都很喜欢的人。\n\nGoogle请李开复,其实主要看重他对青年大学生们的魅力:Google是靠计算机技术立足的公司,而中国学生又是世界上公认的计算机天才最多的群体,请到李开复,就可以利用他的影响和魅力招聘到最棒的人才。事实上,李开复到Google上任之后,首先做的事就是招聘大学生。\"追随我心\",但前提是得到雇主、老板的认可和支持,这才是李开复成功的关键。\n\n### 金句摘录\n> 在企业里面得到关键人物的支持是最重要的。\n> 追随我心,但前提是得到雇主老板的认可和支持,这才是李开复成功的关键。\n\n## 第 0174 集｜不进则退的职场博弈1\n\n### 核心内容\n\n本集转入\"不进则退的职场博弈\"。在竞争激烈的职场中,不进则退是一个亘古不变的道理。有关部门研究发现,有70%以上的职业人随着职业经验的积累,反而会出现职业方向迷失的状况。而他们的职业困惑,主要是对自己优劣势仅有初步的感性认识,对自己的职业定位缺乏科学的分析,更谈不上理性把握职业生涯的发展规律。\n\n书中讲了罗强的经历。罗强毕业于某大学英语专业,在国内某高校涉外部门工作,他希望能在教育交流领域创出一番自己的事业。因此,在正常工作以外,他业余自学市场营销和电子商务等课程,并主动承担起部门网站组建和国际交流活动策划等工作,成功组织了各项活动,网站质量也受到上司好评。几年后,因为部门管理混乱,而且他自己也感觉如此下去毫无前途可言,于是跳到一家国际教育发展投资公司做市场调研员。开始时每天都要跑业务,罗强只用一年多时间就成为公司的业绩标兵,升职做了主管。\n\n后来,罗强被安排到市场部担任市场部经理助理。在这个阶段,他开始全面接触市场工作,工作激情和绩效非常高。在助理的位子上,他充分发挥自己的特长,特别在市场策划方面显示出过人的能力。就这样,日复一日、年复一年,转眼间三年过去,下一阶段的发展问题摆在了罗强面前。他感觉自己对目前从事的媒体公关和广告管理三大部分都很感兴趣,可是不知道以后应该朝哪个方向持续发展,而且哪个方向他都感觉自己不具有足够的竞争力。一些朋友劝他知足常乐,一些朋友劝他踏实工作、不要老想跳槽。他有些犹豫,这次他真的感到自己迷失了未来发展的方向。\n\n### 金句摘录\n> 在竞争激烈的职场中,不进则退是一个亘古不变的道理。\n> 他有些犹豫,这次他真的感到自己迷失了未来发展的方向。\n\n## 第 0175 集｜不进则退的职场博弈2\n\n### 核心内容\n\n本集用螃蟹的故事说明环境对人的影响。或许钓过螃蟹的人知道,篓子中放了一群螃蟹,不必盖上盖子,螃蟹是爬不出去的。这其实正是运用了博弈理论:因为只要有一只想往上爬,其他螃蟹便会纷纷攀附在它的身上,结果是把它拉下来,到最后就没有一只螃蟹可以爬得出去。\n\n罗强所处的环境就有一些这样的人:他们不喜欢看到别人的成就与杰出表现,更怕别人超越自己,因而天天想尽办法破坏与打压他人。如果一个组织受这样的人影响,久而久之,公司里就只剩下一群互相牵制、毫无生产力的螃蟹。职场中,罗强吸取了螃蟹的教训,以不懈的努力和敢于面对困难的毅力,不听朋友劝告、固执己见,找到了自己合适的工作,可谓是他奋斗的结晶。但是人在职场,安于现状,不进则退。罗强过去的成功和现在面临的职业选择,值得每个人去深思。\n\n在市场经济体制下,组织发展和变革的顺利进行离不开一个强有力的组织文化环境。作为在这个环境下成长的职场人员,应理性选择职业,做到高瞻远瞩,善于将自己的理想与组织目标保持一致。不要甘心当篓子里的螃蟹,而应该勇敢地面对现实,追求职业增值,像老鹰一样去搏击长空。这就像博弈一样,需要不间断地博弈,才会成为最后的胜利者。\n\n### 金句摘录\n> 只要有一只想往上爬,其他螃蟹便会纷纷攀附在它的身上,结果是把它拉下来。\n> 不要甘心当篓子里的螃蟹,而应该勇敢的面对现实,追求职业增值,像老鹰一样去搏击长空。\n\n## 第 0176 集｜职场中改善关系的原则1\n\n### 核心内容\n\n本集讲\"职场中改善关系的原则\"。人一生当中,除去家人,同事间相处的时间是最多的。所以怎样改善同事间的交际关系、怎样促进交际融洽和谐,便成为我们不得不学的东西。\n\n自古以来就有\"祸从口出\"的说法。同事之间如果彼此信得过、合得来,就可以多谈一些、谈深一些,但也不能信口雌黄;如果关系较疏远,交谈中就要谨慎一些。因为同事间确实存在一些小人,一旦你口无遮拦什么都说,就有可能被人利用而深受其害。所以最好是\"逢人只讲三分话,不可全抛一片心\"。一定要记住,不要在人前随意讨论他人的长短,以及兜售自己的某些隐私,或亮出自己的某些底线。这样就不会因口无遮拦而吃亏上当。\n\n在职场中的多人博弈时务必要小心,因为随时会有不可预期的情况发生。但在职场多人博弈里,信息是至上的优势,可太多时候信息却是不对称的。我们一方面要先伺机挖掘信息,另一方面要做到对上司的忠诚。通俗地说,就是既要忠诚,还要做事有主见。关于忠诚原则:你可以能力有限,你可以处事不够圆滑,你可以有些诸如丢三落四的小毛病,但你绝对不可以不忠诚。忠诚是上司对员工的第一要求。不要试图搞小动作,你的上司能有今天的位置,说明他绝非等闲之辈;你智商再高、手段再高明,在他的经验阅历面前也不过是小儿科。最低级的背弃忠诚的行为,往往从贪小便宜开始。任何一家正规资深的公司,即使制度再严密也会有漏洞:比如趁人不备悄悄打个私人长途,趁上司不注意塞一张因私打的票让其签字报销,上班明明迟到卡上却填因公外出,客户来访时给你带来礼物以答谢你在业务往来中曾给他的帮助——而这份帮助恰恰是以牺牲本公司利益为代价的。\n\n### 金句摘录\n> 逢人只讲三分话,不可全抛一片心。\n> 忠诚是上司对员工的第一要求。\n\n---\n\n## 本篇小结\n\n这一组十六集,前半程延续\"舍小保大\"的取舍智慧,后半程转入职场博弈。王佐舍己一臂、为大宋换来猛将陆文龙,说明能舍才有得;而\"不要为打翻的牛奶哭泣\"\"拿得起放得下\"则提醒我们,沉没成本已不可收回,真正能决定成败的是正在度过的今天。马克因自暴自弃险些失去事业与家庭,两个樵夫因舍不得棉花最终两手空空,都从反面印证了及时放弃、看清方向的价值。乾隆以\"烟锁池塘柳\"点状元,更把\"懂得放弃\"上升为一种自知之明与智者选择。\n\n后半程围绕\"智猪博弈\"的职场启示:大猪按下按钮、小猪坐等搭便车,张丽的疲于奔命与刘丽的左右逢源,勾勒出办公室里费力不讨好与不劳而获的两副面孔。但书中明确指出,投机取巧并非长久之计,理想的做法是既做大猪、也会做小猪,而李开复\"追随我心\"却先争取关键人物支持,恰是这一平衡的注解。罗强的职业迷失与\"篓中螃蟹\"的隐喻,道出\"不进则退\"的职场铁律;最后落在同事相处与忠诚原则上,以\"逢人只讲三分话\"与不做贪小便宜的背弃之举,为职场生存补上关系一课。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0161 集｜舍小部，保大局4","id":"第-0161-集舍小部保大局4"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0162 集｜放弃的态度一定要坚决1","id":"第-0162-集放弃的态度一定要坚决1"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0163 集｜放弃的态度一定要坚决2","id":"第-0163-集放弃的态度一定要坚决2"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0164 集｜放弃的态度一定要坚决3","id":"第-0164-集放弃的态度一定要坚决3"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0165 集｜学会选择，学会放弃1","id":"第-0165-集学会选择学会放弃1"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0166 集｜学会选择，学会放弃2","id":"第-0166-集学会选择学会放弃2"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0167 集｜学会选择，学会放弃3","id":"第-0167-集学会选择学会放弃3"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0168 集｜\"智猪博弈\"的职场启示1","id":"第-0168-集智猪博弈的职场启示1"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0169 集｜\"智猪博弈\"的职场启示2","id":"第-0169-集智猪博弈的职场启示2"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0170 集｜\"智猪博弈\"的职场启示3","id":"第-0170-集智猪博弈的职场启示3"},{"level":3,"text":"
