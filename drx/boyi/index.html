来 |\n| 0185 | 爱情里的\"麦穗理论\"1 | 柏拉图问情：最大最金黄的麦穗只能摘一次，结果两手空空 |\n| 0186 | 爱情里的\"麦穗理论\"2 | 婚姻如同砍树，有了上次教训便带回一棵普普通通的树 |\n| 0187 | 爱情里的\"麦穗理论\"3 | 20个追求者如何选最优：分组筛选，避免挑到最差 |\n| 0188 | 爱情里的优势策略1 | 爱情中劣势一方选择优势策略，反能赢得对方芳心 |\n| 0189 | 爱情里的优势策略2 | 麦吉的礼物：利他式付出反使双方利益同时受损 |\n| 0190 | 婚姻是不可预期的1 | 选择婚姻如一场赌博，婚前婚后大不相同 |\n| 0191 | 婚姻是不可预期的2 | 车工功成名就后变心，厂花以美丽健康换来幻灭 |\n| 0192 | 婚姻是不可预期的3 | 婚姻不可预期，靠\"抗\"与\"忍\"调低彼此的期望 |\n\n---\n\n## 第 0177 集｜职场中改善关系的原则2\n\n### 核心内容\n\n本集继续讲改善同事关系的忠诚原则。忠诚如细雨无声,但倘若让酸雨淋了你的心,你就会慢慢被腐蚀。老板都厌恶贪小便宜的人,他认为这是品质问题,一旦对你有了这种印象,就会失去对你的信任。上司一般把下属当成自己的人,希望下属忠诚地跟着他、拥戴他、听他指挥,下属不与自己一条心是上司最反感的事。忠诚、讲义气、重感情,经常用行动表示你信赖他、敬重他,便可得到上司的喜爱。你可以通过多种方式表达对老板的忠诚,让上司感到你是他可靠的员工,但这种表示不是要你去拍马屁,而是让你将自己的坦诚展现给上司看。\n\n书中举了一个商界经典反例。有家公司因其对手公司业务红火而忧心,却想不出制胜良策。终于对策有了:他们想方设法寻找关系,接近对手公司的一名仓库主管,让其暗中出卖商业机密。这个主管在利益驱使下利令智昏,把自己公司的库存数量、货品结构、价格策略一一泄露。几经交手,商界风向大变,原来生意红火的公司节节败退,最后倒闭;另一家快要倒闭的公司却起死回生、反败为胜。覆巢之下,安有完卵?这名主管最后也落得身败名裂的下场。\n\n这种隐性的不忠诚,可以说是办公室里的定时炸弹。一个有职业道德的人,心里有一条准则,绝不选择良心的堕落。因此,你做事要站在上司的立场去考虑,对上司尤其是老板的指令与意见要由衷尊重并全力以赴,对公司或团队要尽力维护并确保形象,有时更需要耐心接受上司或老板的冗长说教甚至错误的指责。再者,逆境是考验一个人是否忠诚的最佳时机,所谓\"疾风知劲草,板荡识忠臣\",就是考验一个人在逆境中是否忠诚的最佳写照。当公司经营陷入困境或内部高层倾轧争权之际,你能坚守岗位、全力为上司分忧解劳,毫无临危逃脱或落井下石的行为,即使上司将来另立门户,也会视你为左右手而提拔你。\n\n### 金句摘录\n> 这种隐性的不忠诚,可以说是办公室里的定时炸弹。\n> 疾风知劲草,板荡识忠臣。\n\n## 第 0178 集｜职场中改善关系的原则3\n\n### 核心内容\n\n本集讲\"做事有主见\"原则。在职场博弈里,你只做到忠诚还不够,还要坚持自己的原则。做事有主见,因为职场里各种消息会满天飞,一不小心就可能被假消息迷惑,从而失去自己在职场中的机会。所以你一定要坚持自己的主见。\n\n书中讲到,IBM最欢迎的员工就是具有\"野鸭精神\"的员工,他们坚持自我、不迷信上司,有胆量提出尖锐而有设想的问题。IBM总经理沃森信奉丹麦哲学家戈尔科加德的一段名言:野鸭或许能被人驯服,但是一旦驯服,野鸭就失去了它的野性,再也无法海阔天空地去自由飞翔了。沃森说,对于重用那些我并不喜欢但有真才实学的人,我从不犹豫;然而重用那些围在你身边尽说恭维话、喜欢与你一起去假日垂钓的人,则是一种莫大的错误。与此相比,我寻找的是那些个性强烈、不拘小节,以及直言不讳、甚至似乎令人不快的人。如果你能在周围发掘许多这样的人,并能耐心听取他们的意见,那你的工作就会处处顺利。根据IBM公司的用人思想,这种毫不畏惧的人才会做出大的成绩,是企业真正需要的人才。\n\n坚持自我是指维护自己的观点和立场。坚持自我的人通常与人们进行诚实公正的交流来表达自己的需要,而不是靠争斗来解决问题。书中列出几点坚持自我的表现:重视自己的观点,保持自尊;发言时斩钉截铁,说话时吐字清晰、语调平稳,你的声音越从容,你就会越自信;清晰而缓慢地说出自己的需求;保持身体前倾;正视对方。说话时强调自我,这是坚持自我的真正本质。做到这一点,你就能清楚地表达自己的愿望和期待,同时还不必把对方置于敌对的立场上,可以采用\"我想\"\"我觉得\"\"我愿意\"等句式来表达自己的意愿。\n\n### 金句摘录\n> 野鸭或许能被人驯服,但是一旦驯服,野鸭就失去了它的野性,再也无法海阔天空的去自由飞翔了。\n> 你声音越从容,你就会越自信。\n\n## 第 0179 集｜怎样跳槽才是合算的1\n\n### 核心内容\n\n本集讲\"怎样跳槽才是合算的\"。在职场中,每个人都知道\"此处不留人,自有留人处\"这个道理,跳槽已成为一件很平常的事。但跳槽并非在任何时候都有益,当情况不利时,跳槽就会变成一种风险。我们究竟该如何判断呢?书中说可以运用博弈的原理来判断对自己是否有利。\n\n书中给出了一个模型。假设员工A在甲公司上班,薪酬为X元每月。由于种种原因,A有跳槽的意向,在人才市场投递若干份简历后,乙公司表示愿以Y元每月的薪酬聘任A从事与甲公司类似的工作,Y大于X。这时甲公司面临两种选择:第一,默认A的跳槽行为,以P元每月的薪酬聘任B从事同样的工作,Y大于P;第二,拒绝A的跳槽行为,将A的薪酬提升到Q元每月,当然Q一定要大于或等于Y,A才不会跳槽。\n\n当员工A有跳槽想法时,单位甲和员工A之间的信息就不对称了,很明显员工A占有更充分的信息,因为甲公司不知道乙公司愿给A支付多少薪酬。当员工A提出辞呈时,甲公司会首先考虑员工A所处岗位人力资源的可替代性:如果A的人力资源不具有可替代性,那么甲公司就会以提高薪酬的方式留住A;员工A与甲公司经过讨价还价后,甲公司会将A的薪酬提升到大于或等于Y元每月的水平。如果A的人力资源具有可替代性,那么甲公司就会默认A的跳槽行为。其实,每个单位都会针对员工的跳槽申请做出两种选择——默许或挽留;相对来说,员工也会做出两种选择——跳槽或留任。实际上,在对待跳槽问题上,单位和员工都会基于自身利益讨价还价,最后做出对自己有利的选择。这一过程是单位和员工的博弈过程,无论员工最后是否跳槽,都是这一博弈的纳什均衡。\n\n### 金句摘录\n> 无论员工最后是否跳槽,都是这一博弈的纳什均衡。\n> 如果A人力资源不具有可替代性,那么甲公司就会以提高薪酬的方式留住A。\n\n## 第 0180 集｜怎样跳槽才是合算的2\n\n### 核心内容\n\n本集继续分析跳槽的成本与风险。以上只是基于信息经济学角度进行的理论分析,实际上,当存在招聘成本时,即便人力资源具有可替代性,单位也会在事前或事后采用非提薪的手段阻止员工。事前手段指单位与员工签署就业合同时,约定一定的工作时限和违约金额;事后手段则包括限制户籍或档案调动,扣押员工工资,扣押员工学历证书或相关资格证等。\n\n对于员工来说,跳槽也存在择业成本和风险:新单位是否有发展前景,到新单位后有没有足够的发展空间,新单位增长的薪酬部分是否会弥补原来的同事情缘。在跳槽过程中,员工必须考虑到这些因素。这只是一次跳槽的博弈,从一生来看,一个人要换多家单位,尤其是年轻人跳槽更为频繁,将一个员工一生中多次分散的跳槽博弈组合在一起,就构成了多阶段持续的跳槽博弈。正所谓行为可以传递信息:员工每跳槽一次,就会给下一个雇主提供自己正面或负面的信息。跳槽过于频繁的员工会让人觉得不够忠诚,以往职位一路看涨的员工会给人有发展潜力的感觉,长期徘徊于小单位的员工会让人觉得缺乏魄力。\n\n员工以往跳槽行为给新雇主提供的信息,对员工自身的影响最终将通过单位对其人力资源价值的估价表现出来。相对于正面的信息来说,负面的信息会让新单位在原有基础上给员工支付更低的薪酬。从短期看,通常员工跳槽都以新单位承认其更高的人力资源价值为理由;从长期看,员工跳槽的前一阶段时间会影响到未来雇主对其人力资源价值的评估,这种影响既可能对员工有利,也可能对员工不利。换句话说,员工在选择跳槽时,也等于在为自己的短期利益与长期利益做选择。职场中,如果一个人心已不在就职单位上,那么他或多或少会在工作中表现出来。但你不要总以为自己才是最聪明的,也不要总想着跳槽。需要时刻记住的是,无论如何取舍,都不会有人为你的失误埋单,跳槽也存在着风险,所以要经过充分考虑。\n\n### 金句摘录\n> 员工每跳槽一次,就会给下一个雇主提供自己正面或负面的信息。\n> 无论如何取舍,都不会有人为你的失误埋单。\n\n## 第 0181 集｜浪漫的爱情也需要博弈1\n\n### 核心内容\n\n本集进入\"浪漫的爱情也需要博弈\"。在爱情的博弈里,要主动出击才能占据优势地位、获取佳人芳心。但在爱情向婚姻迈进的过程中,如何付出、付出多少,就要分析并采取一定的博弈术;即使这样,结婚后是否能带来预期效用,还是有很大风险。对待爱情和婚姻,既不要给自己太大的期望值,也要适当遏制对方的期望。\n\n在爱情里,男人总想找到属于自己的白雪公主,那个女孩一定要漂亮而且深爱自己;同样,女人也总想找到自己的白马王子,那个男孩一定要英俊潇洒,还要有绅士风度。可在现实的爱情里,我们都在感慨:为什么好男人总是少之又少,为什么好女人却总嫁不掉,为什么第三者的条件往往不如你优秀却敢在你面前叫嚣,为什么一个好男人加一个好女人却不能等于百年好合?这些看似无从回答的爱情难题,在博弈论里即可找到答案。爱情博弈论就是研究日常生活中男男女女该如何才能找到使自己幸福的另一半。\n\n一个成功的好男人身边定然少不了追逐他的女人,但即便位列一等的好男人也会留下机会给那些优秀的女人得到他,否则比尔·盖茨至今还应该单身,威廉王子也不会到处约会、一门心思替英国王室寻找最好的王妃。书中以贝克汉姆与维多利亚为例:贝克汉姆曾经也是情窦初开的腼腆少年,痛恨自己的拙嘴笨舌,因为在刚遇见如花似玉的辣妹维多利亚时,他不知道该如何表达好感,只有在维多利亚去洗手间的时候两次情不自禁起身,才让维多利亚看出了他的敬慕。接着才有维多利亚巡回演出时两人隔着太平洋和七小时时差狂打越洋电话,电话内容简单无趣,只是讨论同一轮月亮为什么在两人眼里看起来不大一样。\n\n### 金句摘录\n> 爱情博弈论就是研究日常生活中男男女女,该如何才能找到使自己幸福的另一半。\n> 在爱情里,男人总想找到属于自己的白雪公主,女人也总想找到自己的白马王子。\n\n## 第 0182 集｜浪漫的爱情也需要博弈2\n\n### 核心内容\n\n本集继续讲贝克汉姆与维多利亚的故事,并总结爱情博弈的要旨。后来成为妻子的维多利亚不能忍受丈夫的花心,在怀孕五个月的时候,因为小贝和一位女郎的恋情,她抽小贝的耳光,直抽到他嘴角出血,但最后她还是把苦果独自咽了下去,因为她还想要生育、想要孩子,想要能跟他联手在时尚界立于不败之地的好搭档。可以说,在好感刚来的时候,是维多利亚的美貌和名声击败了小贝,但接着就要靠她的智慧和伎俩,否则两个人的爱情怎么能传奇到今天。\n\n在爱情中,男人总是很容易背叛,因为男人是靠事业的,女人是靠美貌的。打动维多利亚的正是小贝的辉煌事业,而小贝恰恰是看上了维多利亚的美貌。在爱情博弈里,男人与女人的期望是不同的,根据不同的期望,自然要选择不同的策略。\n\n总之,在每个人的爱情博弈中,都一定要从自身实际出发,尽可能掌握对方更多的信息。在此基础上,才有可能找到属于自己的幸福。本集把爱情从浪漫的想象带回理性的层面:感情里同样有信息、有期望、有策略,懂得看清自己和对方的处境,才不至于在爱情博弈中盲目出牌。\n\n### 金句摘录\n> 在爱情中,男人总是很容易背叛,因为男人是靠事业的,女人是靠美貌的。\n> 在每个人的爱情博弈中,都一定要从自身实际出发,尽可能掌握对方更多的信息。\n\n## 第 0183 集｜谁先动，谁就更主动1\n\n### 核心内容\n\n本集讲\"谁先动,谁就更主动\"。爱情里的规则是先动一方占据主动优势,不管女方貌若天仙,还是男方英俊潇洒。作为爱情博弈中的你,不要因此而自惭形秽,只要你把握主动权、采取先动策略、率先表达出自己的爱意,那么就很可能获得对方的青睐。\n\n书中举例:据说当年的格格王艳因为太漂亮,从来没有男生敢去追求,最后一个商人第一次向她表白爱意,王艳就嫁给了他,也就是她现在的丈夫。又有一个男孩非常喜欢一个女孩,但他把感情藏在心里不敢说出口,后来另一个男孩先说了,结果女孩就和那个先表达爱意的男孩谈恋爱了。男孩的失败,是因为他没有遵循爱情的规则,即采取行动策略。\n\n书中提到电影《诺丁山》。大牌影星安娜·斯科特走进伦敦诺丁山一家小书店,一杯橙汁使离婚后爱情生活一直空白的威廉·萨克意外得到安娜的吻,两人相爱了。但威廉·萨克是一个羞涩的男人,或者说是一个不懂得主动的男人:女主角只能主动第一次去威廉家里,出门后又回来,在车站再次邂逅;女主角邀请威廉去自己家里;后来为躲避记者跟踪,她到威廉家过夜,也是女主角主动走到威廉的床边;后来因为前男友的介入,她和威廉有了误会;到最后也是女主角主动上门要求重修旧好。那个憨厚纯良的男人,也许觉得这种幸福是不真实的,就那么一次次缺乏爱的勇气,一次次躲避着爱情的大驾光临。所以那些看到这部电影禁不住热泪盈眶的观众,一定是理解了女主角心里的温柔和焦急:主动,我得主动,否则我的爱情就要不翼而飞了。\n\n### 金句摘录\n> 爱情里的规则是,先动一方占据主动优势,不管女方貌若天仙,还是男方英俊潇洒。\n> 主动,我得主动,否则我的爱情就要不翼而飞了。\n\n## 第 0184 集｜谁先动，谁就更主动2\n\n### 核心内容\n\n本集从经济学角度解释\"先动优势\"。或许我们在生活里也有这样的经历:自己心爱的那个人仿佛永远不知道自己在渴望什么,就那么傻愣愣地在一旁观望自己的爱情,像局外人一样不敢介入。经济学里的先动优势,是指在一个博弈行为中,先行动者往往比后行动者占有优势,从而获得更多的收益。也就是说,第一个到达海边的人可以得到牡蛎,而第二个人得到的只是贝壳。也许你可以把它理解为先下手为强:比如第一个对你说\"我爱你\"的人,总是比之后其他追求你的人让你印象深刻,哪怕你那时只是和他在大学校园里拉了拉手、散了散步,到很老的时候,你也不会忘记他。\n\n但是在爱情中,行动优势往往会形成惯性:你主动了,第一次以后就得永远主动下去,你爱的那个人仿佛已经习惯了什么事情都由你发起,或许个性使然,也或许习惯使然。共鸣和分享式的爱情,才会有持久的生命力。在一场恋爱当中,当你发现对方只是一个道具,而这个爱情故事基本上是你一个人在拼命流泪流汗唱独角戏,这是多么遗憾的事情。所以在爱情里要耍一点小伎俩:先动了、有了优势的时候,不如把脚步放慢,让对方跟上来,两个人步调一致了,爱情才能经营得好。\n\n《诺丁山》的结局里,威廉·萨克鼓起勇气直闯记者会,关键时刻向心上人表达了自己的心声,赢得美人归,这就是进步。在爱情博弈中,先表白、采取主动,是追求恋人最好的策略。\n\n### 金句摘录\n> 第一个到达海边的人可以得到牡蛎,而第二个人得到的只是贝壳。\n> 先动了,有了优势的时候,不如把脚步放慢,让对方跟上来。\n\n## 第 0185 集｜爱情里的\"麦穗理论\"1\n\n### 核心内容\n\n本集讲\"爱情里的麦穗理论\"。对于伴侣的选择,乃是人生中最重要的事,特别是女性——婚姻无异于女人的第二次生命。俗话说得好:\"男怕入错行,女怕嫁错郎。\"因此,女性朋友在择偶时必须慎之又慎,学会用博弈论来指导自己的择夫行为。\n\n西方的择偶观里有著名的麦穗理论,是说我们寻找伴侣时如同走进了一个麦田,一路有麦穗向我们招手,很多人不知道摘取哪一只,因而就会有踌躇和彷徨、遗憾和悲伤。而正常人再花心,他或她也得选择一人来陪伴自己的旅程(当然并不排除极少数人会在短短一生里一换再换)。\n\n麦穗理论来源于这样一个故事。伟大的思想家、哲学家柏拉图问老师苏格拉底什么是爱情,老师就让他先到麦田里去摘一颗全麦田里最大最金黄的麦穗来,只能摘一次,并且只可向前走、不能回头。柏拉图于是照做,结果两手空空地走出了麦田。老师问他为什么没摘,他说:因为只能摘一次,又不能走回头路,期间即使见到最大最金黄的,因为不知前面是否有更好的,所以没有摘;走到前面时,又发觉总不及之前见到的好,原来最大最金黄的麦穗早已错过了,于是我什么也没摘。老师说,这就是爱情。可见,完美的爱情很难得到,大多数人只是处于凑合的状态,真正得到合适伴侣的概率很小。\n\n### 金句摘录\n> 男怕入错行,女怕嫁错郎。\n> 因为不知前面是否有更好的,所以没有摘;走到前面时,又发觉总不及之前见到的好。\n\n## 第 0186 集｜爱情里的\"麦穗理论\"2\n\n### 核心内容\n\n本集继续讲麦穗理论中关于婚姻的部分。之后又有一次,柏拉图问老师什么是婚姻,老师就叫他先到树林里砍下一棵全树林最大最茂盛、最适合放在家做圣诞树的树,期间同样只能砍一次,同样只可以向前走、不能回头。柏拉图照着做了,这次他带了一棵普普通通、不是很茂盛、亦不算太差的树回来。老师问他怎么带这棵普普通通的树回来,他说:有了上一次的经验,当我走到大半路程还两手空空时,看到这棵树也不太差,便砍下来,免得最后又什么也带不出来。老师说,这就是婚姻。\n\n可见,完美的爱情和婚姻是很难得到的,大多数人只是处于凑合的状态,真正得到合适伴侣的概率是很小的。书中接着设了一个情境:不妨假设有20个合适的单身男子都有意追求某个女孩,这个女孩的任务就是从他们当中挑选最好的一位作为结婚对象。从这20个里面选出最好的一个并非易事,该怎么做才能争取到这个结果?\n\n首先要考虑的是对对方真实性格、人品的判断。约会时,男女双方一开始都是展示自己的优点、掩盖自己的不足,当然他们都想了解对方的一切,不管是优点还是缺点。对于一个女孩来说,男朋友赠送的花是相对廉价的,而贵重的钻石、金表、项链等礼物也许更能代表一个人的真心——正如有句话说的,一个男人爱一个女人有多深,就会为她掏多少钞票,这是一个人乐意为你奉献多少的可靠证明。然而,礼物值多少钱对不同的人是有差异的:对一个亿万身价的有钱人来说,送上一颗名贵钻石可能比带你游山玩水的价值要低得多;反之,一个穷小子花了大量时间辛勤工作,买上一颗钻石的价值就要高得多。你也应当意识到,你的约会对象同样会对你的行为挑剔一番,所以你得采取能真正代表你具有高素质的行为,而不是谁都学得来的那种行为。其次要考虑的是选择什么样的方法来筛选出比较合适的异性,最好的方法是和这20个人都接触一遍、了解每个人的情况,经过筛选找出最适合的人。\n\n### 金句摘录\n> 有了上一次的经验,当我走到大半路程还两手空空时,看到这棵树也不太差,便砍下来。\n> 一个男人爱一个女人有多深,就会为他掏多少钞票。\n\n## 第 0187 集｜爱情里的\"麦穗理论\"3\n\n### 核心内容\n\n本集讲在严格条件下如何用筛选法挑选最优对象。然而在现实生活中,一个人的精力是有限的,不可能花大把时间去和每个人交往。不妨假定更严格的条件:每个人只能约会一次,而且只能一次性选择放弃或接受,一旦选中结婚对象,就没有机会再约会别人。那么最好的选择方法是否存在呢?事实上是存在的。\n\n书中做了模拟推演:显然,你不应该选择第一个遇到的人,因为他是最合适者的概率只有二十分之一,这个概率非常渺茫,直接把筹码放在第一个人身上也是最糟的赌注;同样,后面的人情况都相同,每个人都只有二十分之一的概率可能是20个人当中的最适合者。可以把所有追求者分成组,比如分成5组,每组4人。首先从第一组开始选择,与第一组中每一个男性都约会,但并不选择第一组中的男性——即使他再优秀再完美,都要选择放弃,因为最合适的对象在第一组中存在的概率不过五分之一。如果以后遇到比这组人更好的对象,就嫁给这个人。\n\n当然,这种方法像麦穗理论一样,并不能保证选择出的是最饱满最美丽的麦穗,但却能选择出比较大、比较美丽的麦穗。无论是选择爱情、事业、婚姻还是朋友,最优结果只可能在理论上存在。不把追求最佳人选作为最大目标,而是设法避免挑到最差的人选,这种规避风险的观念,对我们在做人生选择时非常有用。\n\n### 金句摘录\n> 不把追求最佳人选作为最大目标,而是设法避免挑到最差的人选。\n> 无论是选择爱情事业婚姻朋友,最优结果只可能在理论上存在。\n\n## 第 0188 集｜爱情里的优势策略1\n\n### 核心内容\n\n本集转入\"爱情里的优势策略\"。在爱情里,虽然经常看到\"恐龙配帅哥、青蛙配美女\"的情况,我们知道这是由于逆向选择造成的,是由于信息的不对称造成的。但到底是什么造成了信息不对称呢?书中说,这就是在爱情中处于劣势的一方选择了优势策略,从而使自己获得了佳人或帅哥的芳心。\n\n书中引用了欧·亨利的小说《麦琪的礼物》(文中作《麦吉的礼物》)。故事描述了一对年轻夫妻:新婚不久的夫妻俩穷困潦倒,除了妻子那一头美丽的金色长发、丈夫那一只祖传的金怀表,便再也没有什么东西可以让他们引以为傲了。虽然生活很苦,他们却彼此相爱至深,关心对方都胜过关心自己,为了对方愿意奉献和牺牲自己的一切。圣诞节快到了,两人都没有钱赠送对方礼物,即使这样,他们还是决定互赠礼物。丈夫卖掉了心爱的怀表,买了一套漂亮的发卡,去配妻子那一头金色长发;妻子剪掉心爱的长发,拿去卖钱,为丈夫的怀表买了表链和表带。最后到交换礼物的时刻,他们无可奈何地发现,自己如此珍视的东西,对方都以作为礼物的代价而出卖了——花了惨痛代价换回的东西,竟成了无用之物。出于无私爱心的利他主义行为,结果却使得双方的利益同时受损。\n\n欧·亨利在小说中写道:聪明的人送礼自然也很聪明,大约都是用自己有余的物事来交换送礼的好处;然而,我讲的这个平平淡淡的故事里,主人公却是笨到极点,为了彼此白白牺牲了他们最珍贵的财富。\n\n### 金句摘录\n> 出于无私爱心的利他主义行为,结果却使得双方的利益同时受损。\n> 主人公却是笨到极点,为了彼此白白牺牲了他们最珍贵的财富。\n\n## 第 0189 集｜爱情里的优势策略2\n\n### 核心内容\n\n本集从博弈论角度分析爱情中的利他主义。从这段文字看,欧·亨利似乎并不认为这小两口是理性的。如果我们抛开爱情,假定每个人都有一个专门为别人谋幸福的偏好系统,那么个人选择付出还是不付出,只看对方能不能得益,与自己是否受损无关。以这样的偏好来衡量,最好的结果自然是自己付出而对方不付出,对方收益增大;次好的结果是大家都不付出,对方不得益,也不牺牲;再次的结果是大家都付出、都牺牲;最坏的结果是别人付出而自己不付出,靠牺牲别人来使自己得益。\n\n书中用数字代表个人对这四种结果的评价:第一种结果给3分,第二种结果给2分,第三种结果给1分,第四种结果给0分。不难看出,无论对方选择付出还是不付出,自己的最佳选择都是付出,然而这并不是对大家都有利的选择。事实上,大家都选择不付出,明显优于大家都选择付出的境况。\n\n实际上,这里的例子有一个占优策略均衡。通俗地说,在占优策略均衡中,不论参与人选择什么策略,一个参与人的占优策略总是他的最优策略。显然,这一策略一定是所有其他参与人选择某一特定策略时该参与人的占优策略,因此占优策略均衡一定是纳什均衡。在这个例子中,不剪掉金发对于妻子来说是一个优势策略,也就是说,妻子不付出,丈夫不管选择什么策略,妻子所得的结果都好于丈夫;同理,丈夫不卖掉怀表,对于丈夫来说也是一个优势策略。\n\n### 金句摘录\n> 无论对方选择付出还是选择不付出,自己的最佳选择都是付出,然而这并不是对大家都有利的选择。\n> 占优策略均衡一定是纳什均衡。\n\n## 第 0190 集｜婚姻是不可预期的1\n\n### 核心内容\n\n本集进入\"婚姻是不可预期的\"。现在越来越多的男女倾向于这样一种观点:爱情和婚姻不是一回事,爱情往往意味着甜蜜,选择婚姻却是一场赌博。和什么人过一辈子,选择了也就认命了,不管是男人还是女人。结婚也就意味着你必须和他或她走完漫漫的人生旅途。但选择谁呢?在选择之前,我们每个人都对婚姻充满着无限的渴望;选择后,也许如我们所愿,也许就跌入了万丈深渊。因为人生路漫漫,不可预期的事情太多,而且就人而言,结婚前和结婚后绝对不一样。\n\n书中用一个例子说明婚姻的不确定性与不可预知性。她和他很早就认识,一个是车工,一个是厂花。喜欢厂花的男人很多,每天都有人给她打好饭,看着厂花吃。车工清贫,也没什么背景,因此有些自卑,只能在一个角落里偷偷地看厂花。其实厂花心里早就喜欢车工,只是车工不知道。车工虽然是车工,却很懂文艺,每逢厂里排戏都是由车工编本子。在厂庆的晚会彩排上,厂花演车工的本子、说车工的台词,后来厂花和车工就在一起了,结婚生孩子,像大多数恋爱的男女一样有了一个好结果。\n\n故事却没有完。厂花和车工第二个孩子降生时,车工对厂花说想去拍电影。厂花知道,这些年来车工一直没断了去拍戏的念头。考虑再三,厂花还是冒着风险支持车工,辞掉工作、拿走家里全部的积蓄,甚至借了些钱。车工跑到北京,开始另一番创业,先是两年的理论学习,后来开始在剧组里打杂。那些日子家里很困难,厂花一个人撑下来,渐渐地她的脸色黄下来,秀美的脸被愁容掩盖。厂花几乎与外界隔绝,无暇读书看电视,生活里除了两个急需照看的孩子之外,就是远在他乡、给厂花帮不上一点忙的车工。\n\n### 金句摘录\n> 爱情往往意味着甜蜜,选择婚姻却是一场赌博。\n> 因为人生路漫漫,不可预期的事情太多,而且就人而言,结婚前和结婚后绝对不一样的。\n\n## 第 0191 集｜婚姻是不可预期的2\n\n### 核心内容\n\n本集讲完厂花与车工的故事。车工偶尔给厂花打电话,厂花总说电话费好贵,不如省下来买火车票,其实厂花是希望见车工的。二十二年光阴一晃而过,车工和厂花已到中年。厂花把孩子带大,用自己的美丽健康换得孩子的幸福。车工拍了好几部电影,车工成功了,他拍的片子得到认可,并且在国外连连获奖。这些厂花当然知道,每当认识的朋友看到车工拍的电影而向她祝贺并询问车工的情况时,厂花都会无限骄傲。只是车工更忙,一年中厂花偶尔可以见车工一两次,每次都短短三五天。相比剧组里年轻的女演员,厂花早成了黄脸婆,而且现在的女孩子为了能出名什么都放得开。外面的世界充满诱惑,过去的生活如此无趣,车工终于迎向了更蓝更广阔的天空,向厂花提出了离婚的请求。厂花流着泪问车工为什么,车工说:因为我们没有相爱的理由。\n\n厂花不知道,婚姻是一场漫长的考验,不是这时这刻的相爱就能代表一生一世。世界会变,人也会变,两个从苦日子走过来的人,并不一定能同时面对生活的甘美。婚姻的不确定性很大,婚前的甜言蜜语、海誓山盟并不代表婚后一定是幸福的。这个女子的丈夫在功成名就后变心,虽然给她造成打击,但她毕竟有过一段时间的美好期盼;而有的婚姻刚刚开始,就露出了魔鬼的狰狞。\n\n### 金句摘录\n> 婚姻是一场漫长的考验。不是这时这刻的相爱,就能代表一生一世。\n> 婚前的甜言蜜语海誓山盟并不代表婚后一定是幸福的。\n\n## 第 0192 集｜婚姻是不可预期的3\n\n### 核心内容\n\n本集用极端案例说明婚姻的不可预期,并给出应对之道。书中讲:有一个丧心病狂的男人,在没得到女人之前百般献媚,结婚后不遂他意便大打出手,更为恶劣的是在女人的脸上和身上刺字,话语肮脏下流。他一共结了两次婚,残忍地伤害了两个女人。第一个妻子脸上身上都被刺了字,多年以后,满脸的刺青依然清晰可见,惨不忍睹;第二个妻子全身上下共刺了三百多个字,需要两年时间才能彻底清除。他对付这两个女人的手段和伎俩如出一辙,那就是不许报案,否则将灭其全家。这两个女人最初的忍让没有换来罪犯丝毫的怜悯,她们都是在走投无路的情况下、在罪犯大意的时候偷偷逃跑的。前一个柔弱的女人为了不累及家人选择了忍气吞声,只有第二个女人在家人的支持下勇敢地站了出来。\n\n至此,这一切才真相大白。当然,罪犯被判处死刑、剥夺政治权利终身,他得到了应有的惩罚,但却在两个女人的身上和心里留下了不可磨灭的创伤。这两个女人结婚前,谁也没想到他是这样一个恶徒,而结婚以后不但没得到幸福,却深陷囹圄,甚至毁了一生。\n\n婚姻是不可预期的,就像赌博一样,当你真正走进婚姻,会发觉婚姻不只是围城,甚至是牢笼,进去的想出来,很少的婚姻能达到双方的预期。因为婚姻的不确定性太大,它总是不可预期的,想达到真正的幸福,就要学会\"抗\"和\"忍\":用\"忍\"来减少自己的预期,用\"抗\"来遏制对方的预期。\n\n### 金句摘录\n> 婚姻是不可预期的,就像赌博一样。\n> 用忍来减少自己的预期,用抗来遏制对方的预期。\n\n---\n\n## 本篇小结\n\n这一组十六集,由职场收尾走向爱情与婚姻。前四集把职场关系讲圆:仓库主管因隐性不忠而身败名裂,印证\"覆巢之下,安有完卵\";IBM的\"野鸭精神\"则说明做事有主见、敢于直言同样是职场生存的要义。随后两集用博弈模型拆解跳槽——单位在\"默许或挽留\"、员工在\"跳槽或留任\"之间讨价还价,构成纳什均衡;而跳槽有成本有风险,多阶段跳槽博弈中,每一次跳槽都在向未来雇主传递关于忠诚与潜力的信息。\n\n后半程转入爱情与婚姻。爱情博弈论告诉我们,男女期望不同,要掌握对方信息、从自身实际出发;先动优势说明率先表白者更易赢得青睐,但主动会形成惯性,先动之后不妨放慢脚步。麦穗理论用柏拉图的两个故事点破玄机:完美的爱情与婚姻难以求得,与其追求最佳,不如设法避免最差。欧·亨利《麦琪的礼物》与占优策略均衡则揭示了利他式付出的悖论——彼此牺牲反使双方受损。最后,车工的变心与刺字恶徒的极端案例,道出婚姻的不可预期,而\"用忍减少自己的预期、用抗遏制对方的预期\",正是书中给出的应对之法。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0177 集｜职场中改善关系的原则2","id":"第-0177-集职场中改善关系的原则2"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0178 集｜职场中改善关系的原则3","id":"第-0178-集职场中改善关系的原则3"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0179 集｜怎样跳槽才是合算的1","id":"第-0179-集怎样跳槽才是合算的1"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0180 集｜怎样跳槽才是合算的2","id":"第-0180-集怎样跳槽才是合算的2"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0181 集｜浪漫的爱情也需要博弈1","id":"第-0181-集浪漫的爱情也需要博弈1"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0182 集｜浪漫的爱情也需要博弈2","id":"第-0182-集浪漫的爱情也需要博弈2"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0183 集｜谁先动，谁就更主动1","id":"第-0183-集谁先动谁就更主动1"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0184 集｜谁先动，谁就更主动2","id":"第-0184-集谁先动谁就更主动2"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0185 集｜爱情里的\"麦穗理论\"1","id":"第-0185-集爱情里的麦穗理论1"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0186 集｜爱情里的\"麦穗理论\"2","id":"第-0186-集爱情里的麦穗理论2"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0187 集｜爱情里的\"麦穗理论\"3","id":"第-0187-集爱情里的麦穗理论3"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0188 集｜爱情里的优势策略1","id":"第-0188-集爱情里的优势策略1"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0189 集｜爱情里的优势策略2","id":"第-0189-集爱情里的优势策略2"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0190 集｜婚姻是不可预期的1","id":"第-0190-集婚姻是不可预期的1"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0191 集｜婚姻是不可预期的2","id":"第-0191-集婚姻是不可预期的2"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0192 集｜婚姻是不可预期的3","id":"第-0192-集婚姻是不可预期的3"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]}]},{"name":"第 13–16 篇","items":[{"id":"T13","title":"第0193-0207集","full":"每天读点博弈论 · 第 0193–0207 集（企业制度、激励与管理的博弈）","lect":"","dur":"35:00","sec":2100,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0193–0207 集（企业制度、激励与管理的博弈）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0193–0207 集（193 企业制度中的博弈1；194 企业制度中的博弈2；195 企业制度中的博弈3；196 用人制度中的博弈1；197 用人制度中的博弈2；198 企业与员工的双赢博弈1；199 企业与员工的双赢博弈2；200 企业与员工的双赢博弈3；201 激励制度后面的信用博弈1；202 激励制度后面的信用博弈2；203 胡萝卜与大棒在手1；204 胡萝卜与大棒在手2；205 胡萝卜与大棒在手3；206 管理中的利益关系1；207 管理中的利益关系2）\n> **时长**：约 35 分钟（各页时长求和）\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0193 | 企业制度中的博弈1 | 管理是互动游戏，需以完善规则和目标激励员工 |\n| 0194 | 企业制度中的博弈2 | 用游戏开发案例算清激励与期望利润的关系 |\n| 0195 | 企业制度中的博弈3 | 迟到扣款、建议奖50元的制度为何成效有限 |\n| 0196 | 用人制度中的博弈1 | 分槽喂马与弥勒佛韦陀，讲人才各得其位 |\n| 0197 | 用人制度中的博弈2 | 皮尔卡丹\"1+1不等于2\"，柳传志分拆联想定接班人 |\n| 0198 | 企业与员工的双赢博弈1 | 薪酬是博弈对象，过程与囚徒困境相似 |\n| 0199 | 企业与员工的双赢博弈2 | 李丽的故事说明加薪反能激发员工实力 |\n| 0200 | 企业与员工的双赢博弈3 | 个人、内部、外部三种公平决定员工满意 |\n| 0201 | 激励制度后面的信用博弈1 | 激励基于支配型关系，效果往往一次不如一次 |\n| 0202 | 激励制度后面的信用博弈2 | 信息时代下，\"用人不疑\"该让位于随时监督 |\n| 0203 | 胡萝卜与大棒在手1 | 激励与限制并用的威逼利诱之道 |\n| 0204 | 胡萝卜与大棒在手2 | 大棒给人压力，胡萝卜给人动力，曾国藩治湘军 |\n| 0205 | 胡萝卜与大棒在手3 | 饭店会员卡留住客人，奖惩并举才能长久 |\n| 0206 | 管理中的利益关系1 | 管理如同做生意，人与人最终是生意伙伴关系 |\n| 0207 | 管理中的利益关系2 | 黄宏生的教训与价值链思维，须对各类人保持平和理性 |\n\n---\n\n## 第 0193 集｜企业制度中的博弈1\n\n### 核心内容\n\n本集讲\"企业制度中的博弈\"。管理是一场互动的游戏,管理者需要制定完善的游戏规则,并以目标来激励员工。企业制度中的博弈,只有有一个合适的、奖罚分明的制度,才能够对员工创造出合适的激励。\n\n书中指出一个现实:当企业发展顺利时,首先考虑的是资金投入、技术引进;当企业发展不顺利时,首先考虑的则是裁员和员工下岗,而不是想着如何开发市场,以及激励员工去创新产品、改进服务与质量。那么,企业应该如何制定一个员工激励制度,从而有效地驱动员工工作呢?其实这就是一个博弈的运用。\n\n本集由此引出一个游戏软件企业的案例:有一家游戏软件企业的老总,打算开发一种叫\"仙剑奇缘\"的新网络游戏。如果开发成功,根据市场部预测可以得到2000万人民币的销售收入;如果开发失败,那就是血本无归。而这款新网络游戏是否会成功,关键在于技术研发部员工是否全力以赴、殚精竭虑地做这项开发工作。如果研发部员工完全投入工作,有80%的可能这款游戏的市场价值将达到市场部所预测的程度;如果研发部员工只是敷衍了事,那么游戏成功的可能性只有60%。这个设定,为下一集测算激励与利润的关系做了铺垫。\n\n### 金句摘录\n> 管理是一场互动的游戏,管理者需要制定完善的游戏规则,并以目标来激励员工。\n> 只有有一个合适的奖罚分明的制度,才能够对员工创造出合适的激励。\n\n## 第 0194 集｜企业制度中的博弈2\n\n### 核心内容\n\n本集继续用游戏开发的案例算清激励与利润的关系。如果研发部全体员工在这个项目上所获得的报酬只有500万元,那么这款游戏对员工的激励不够,他们就会得过且过、敷衍了事。要想让这些员工付出高质量的工作,老板就必须给所有员工700万元的酬金。\n\n如果老板仅付500万总酬金,那么市场销售的期望值就是2000万乘60%等于1200万元,再减去500万的固定酬金,老板的期望利润有700万元。如果老板肯出700万的总酬金,则市场销售的预期值由2000万乘80%等于1600万元,再减去总酬金700万元,老板最终的期望利润有900万元。\n\n然而困难在于,老板很难从表面了解到研发部员工在进行工作时是否恪尽职守、兢兢业业,即使给了全体员工700万的高酬金,研发部员工也未必就尽心尽力地完成这款游戏。比较好的方法是:若游戏市场反应良好,员工报酬提高;若是不加,则员工报酬缩减。如果市场部目标达成,则付给全体研发人员900万元;若是失败,则让全体研发人员付给企业100万元的罚金。这种情况下,员工薪金的期望值是:900万乘80%减去100万乘20%,等于700万元。其中900万元是成功的酬金,成功的概率为80%;100万元则是不成功的罚金,不成功的概率为20%。在理论上,采用这样的激励方法,会大大提高员工工作的积极性。从某种意义上说,这种激励方法相当于赠送一半的股份给企业研发部员工,同时员工也承担游戏软件市场失败的风险。然而这种方法在实际中并不可行,因为不可能有任何一家企业能够通过罚金的方式让员工承担市场失败的风险。可行的方法就是尽量让企业奖惩制度接近于这种理想状态,而更加有效的方法,就是在本质上等同于奖励罚金制度的员工持股计划。\n\n### 金句摘录\n> 员工工作努力与否与良好的激励机制密切相关。\n> 更加有效的方法,就是在本质上等同于奖励罚金制度的员工持股计划。\n\n## 第 0195 集｜企业制度中的博弈3\n\n### 核心内容\n\n本集分析现实中常见的奖惩制度为何成效有限,并总结制度的特点。书中指出,现实中的很多公司并不明白激励与努力密切相关的道理。比如,很多公司的奖惩制度上写着:所有员工应按时上班,迟到一次扣10元;若迟到30分钟以上,则按旷工处理,扣50元。国外有弹性工作制,即不强求准时,但每天都必须有效地完成当天的工作。作者认为,即使有人迟到早退被扣工资,但在实际工作中,他很可能并不努力工作,其因扣除工资而产生的逆反心理导致的隐性罢工成本,反而有可能高于所扣除的工资。表面上老板似乎赚到了所扣工资的钱,实际上却是损失更多,可见这并不是一个有效的奖罚激励制度。\n\n再比如,有的公司规章写着:所有员工应具有主人翁意识,大胆向公司领导提出合理化建议,可直接提出也可以书面提出,若被采纳后奖励50元。不同的合理化建议对公司所创造的效益是不同的:假设一个人所提建议可以提高效益5万元,另一个人所提建议只能提高效益500元,都用50元的奖金来进行物质激励,其条例本身就明显不是合理化的。\n\n书中还谈到制度的若干特点:制度是给人执行的,也是给人破坏的,有时制度会成为不能办事的借口;刚开始制度是宽松的,后来设的篱笆越来越多;有很多规则是潜规则,不需要说明,比如买菜刀时不需要说明不能让刀刃对着人;有些规则不规定不行,比如开会,不规定准时,就肯定永远有人迟到。制度还有一个人为可破的特征:比如按制度你只能住400元的房间,老板说破例给你住600元的,员工会觉得老板违反制度、对我特别好,于是就会在工作上付出更多努力。总而言之,一个良好的奖惩制度,首先要选择好对象,其次要能够建立在员工相对表现基础之上的回报,简单地说就是实际的业绩越好,奖励越高。\n\n### 金句摘录\n> 一个良好的奖惩制度,首先要选择好对象,其次要能够建立在员工相对表现基础之上的回报。\n> 实际的业绩越好,奖励越高。\n\n## 第 0196 集｜用人制度中的博弈1\n\n### 核心内容\n\n本集转入\"用人制度中的博弈\"。如何把最合适的人放到最合适的岗位上去,这是企业用人制度要解决的问题。\n\n书中引战国野史:当时北方有两种马特别有名,一种是蒙古马,力大无穷,能负重千余斤;另一种是大宛马,驰骤如飞,一日千里。邯郸有一商人,家里同时养了一匹蒙古马和一匹大宛马,用蒙古马来运输货物,用大宛马来传递信息。两匹马圈在一个马厩里、在一个槽里吃料,却经常因为争夺草料而相互踢咬,每每两败俱伤,要请兽医调治,使得主人不胜其烦。恰巧伯乐来到邯郸,商人请他来帮忙解决难题。伯乐来到马厩看了看,微微一笑,说了两个字:\"分槽。\"主人依计而行,从此轻松驾驭二马,生意越来越红火。\n\n能者要想人尽其用,不但要分而养之,还必须善用之。因为不同的贤才各有其能,有的适合彼工作,有的适合此工作,把各种能力放在适合它们的境里才能得以发挥。书中接着讲了庙里弥勒佛与韦陀的故事:相传很久以前,他们并不在同一个庙里,而是分别掌管不同的庙。弥勒佛热情快乐,所以来的人非常多,但他什么都不在乎、丢三落四,没有好好管理账务,所以依然入不敷出;韦陀管账是一把好手,但成天阴着脸、太过严肃,搞得人越来越少,最后香火断绝。这两个故事讲的都是同一个问题——如何把最合适的人放到最合适的岗位上去。\n\n### 金句摘录\n> 能者要想才尽其用,不但要分而并之,还必须善用之。\n> 把各种能力放在适合他们的环境里,才能得以发挥。\n\n## 第 0197 集｜用人制度中的博弈2\n\n### 核心内容\n\n本集讲把合适的人放到合适岗位的实践智慧。佛祖在查香火时发现了弥勒佛与韦陀各自的问题,就将他们俩放在同一个庙里:由弥勒佛负责攻关,笑迎八方客,于是香火大旺;而韦陀铁面无私、锱铢必较,则让他负责财务,严格把关。在两人的分工合作下,庙里呈现出一派欣欣向荣的景象。\n\n分槽喂马和佛祖派工说的都是同一个问题,就是如何把最合适的人放到最合适的岗位上去,而这个问题也是一个曾经长期困扰中国企业的难题,特别是在同时有两个候选人的情况下。法国著名企业家皮尔·卡丹曾经说,用人上1+1不等于2,搞不好等于0。如果在用人中组合失当,常常会失去整体优势;安排得宜,才成最佳配置。在这方面,柳传志以其洞明世事的眼光,成功运用分槽喂马的策略,不仅化解了这个难题,而且将企业的发展推向一个新的高度。\n\n2001年3月,联想集团宣布,联想电脑、神州数码分拆进入资本市场。同年6月,神州数码在香港上市。分拆之后,联想电脑由杨元庆接过帅旗,继承自有品牌,主攻PC硬件生产销售;神州数码则由郭为领军,另创品牌,主营系统集成、代理产品分销、网络产品制造。至此,联想接班人问题以喜剧方式尘埃落定。身负众望的\"双少帅\",一个握有联想的现在,一个开拓联想的未来。但在实行分槽喂马的过程中,还有一个如何进行搭配、使每个人才相得益彰而不是相互妨碍的问题。这就需要管理者对自己的\"千里马\"有深刻的洞察力,最好使他们彼此所负责的事务具有互补性。\n\n### 金句摘录\n> 用人上1+1不等于2,搞不好等于0。\n> 一个握有联想的现在,一个开往联想的未来。\n\n## 第 0198 集｜企业与员工的双赢博弈1\n\n### 核心内容\n\n本集讲\"企业与员工的双赢博弈\"。在员工与企业的博弈中,员工要满足于企业给予的薪酬水平,企业也要对优秀的员工给予薪酬上的回报,这样双方的博弈就能达到阶段性的力量均衡,从而实现共赢。\n\n书中指出,现今许多员工对企业的人身依附心理已经大大减弱。在联想公司,许多员工喊出的\"公司不是我的家\"已经深入人心,为广大的打工一族所普遍接受。付出就要求回报并不过分,而从公司的角度出发,付出薪酬的前提是要求员工为公司做出相应的贡献。在公司和员工既相互依赖又相互争斗的博弈中,最直接的表现形式就是薪酬。其实,薪酬是员工与企业之间博弈的对象,这一博弈的过程与囚徒困境很相似:由于员工和企业很难有真正的相互认同,双方始终在考察对方,而后决定自己的行为。员工考虑拿这样的薪酬是否值得付出额外的努力,企业又不是自己的老板,会了解认同自己的努力吗?公司会用回报来承认自己的努力付出吗?公司方面则考虑员工的能力是否能胜任现在的工作,给员工的薪酬待遇是否物有所值,员工会否对公司保持持续的忠诚。\n\n书中讲了一个管理故事:一个企业经营者某次跟朋友闲聊时抱怨说,我的秘书李丽来两个月了,什么活都不干,还整天跟我抱怨工资太低、吵着要走,烦死人了,我得给她点颜色瞧瞧。朋友说,那就如她所愿,炒了她。经营者说好,那我明天就让她走。朋友说那太便宜她了,应该明天就给她涨工资翻倍,过一个月之后再炒了她。经营者问,既然要她走,为什么还要多给她一个月的薪水,而且是双倍的薪水?朋友解释说,如果现在让她走,她只不过是失去了一份普通的工作,马上可以在就业市场上再找一份同样薪水的工作;一个月之后让她走,她丢掉的可是一份她这辈子也找不到的高薪工作。\n\n### 金句摘录\n> 薪酬是员工与企业之间博弈的对象,这一博弈的过程与囚徒困境很相似。\n> 在公司和员工既相互依赖又相互争斗的博弈中,最直接的表现形式就是薪酬。\n\n## 第 0199 集｜企业与员工的双赢博弈2\n\n### 核心内容\n\n本集讲完李丽的故事,并总结企业与员工互信的机制。一个月之后,该企业经营者开始欣赏李丽的工作。尽管她拿了双倍的工资,但她的工作态度和工作效果和一个月之前已是天壤之别。这个经营者并没有像当初说的那样炒掉她,而是重用她。从企业经营者角度看,他可以说是运用博弈的理论,通过增加薪酬使员工发挥出实力;如果当初就把李丽炒掉,势必给双方都带来一定的不利影响,而经过这样的博弈,双方都实现了共赢。\n\n但如果从公司的管理角度看,这个故事说明了一个现象:许多员工在工作中经常不断衡量自己的得失,如果认为企业能够提供满足或超过他个人付出的收益,他才会安心努力地工作,充分发挥个人的主观能动性,把自己当作企业的主人。但是老板很难判断衡量一个人是否有能力完成工作,是否能够在得到高薪酬后实现老板期待的工作成绩。由于员工和企业都无法完全信任对方,因此就出现了囚徒困境一样的博弈过程。企业只有制定一个合理完善、相对科学的管理机制,使员工能够获取应得报酬,或让员工相信他能够获得应得报酬,这样员工就能心甘情愿地努力工作,从而实现企业和员工的双赢结局。\n\n本集由此引出:在博弈的过程中,员工在衡量个人的收益与付出是否相符合时,会有三个衡量标准——个人公平、内部公平和外部公平,为下一集的展开做准备。\n\n### 金句摘录\n> 如果认为企业能够提供满足或超过他个人付出的收益,他才会安心努力的工作。\n> 只有双方实现互信,才能保障。\n\n## 第 0200 集｜企业与员工的双赢博弈3\n\n### 核心内容\n\n本集讲员工衡量薪酬是否公平的三个标准。所谓个人公平,就是员工个人对自己能力发挥和对公司所做贡献的评价,是否满足于自己的收入标准,取决于自己对个人能力的评价。如果他认为自己是高级工程师的水平、承担着高级工程师的工作任务和责任,而公司给予的却是普通工程师的薪酬待遇,员工自然就会产生怨气,这会出现两种结果:或是消极怠工,或是选择离开。企业要想保证个人公平,最重要的就是量才而用,并为有才能者创造脱颖而出的机会;一味地说教、强调奉献,不但无济于事,更是对员工的欺骗和不尊重。海尔的人才观是\"赛马,不相马\",说的并不是不需要量才而用,而是不以领导对个人的评价作为竞争评价标准,以一套公正透明的人才选拔机制,用个人在工作中的实际绩效作为评价机理和评价标准。要保证个人公平,还应该事先说明规则,保证让双方明白相互间的权利和义务。\n\n员工相互之间的比较衡量就是所谓的内部公平。对于企业的分工来说,个人无法完成工作的各个工序,而是需要团队间的相互协调配合来完成,很难判断一个员工对企业做出的贡献,也很难在岗位相近的员工之间进行横向比较;而过多人工干预、领导主观对员工的评价,进而反映在薪酬待遇上,常起不到激励员工的积极作用,而多是消极作用。公司只有统一薪酬体系、科学的岗位评价和公正的考核体系,才能保证内部公平。\n\n外部公平主要是员工个人的收入相对于劳动力市场的水平。科学管理之父泰勒对此有深刻认识,他认为企业必须在能够招到适合岗位要求的员工的薪酬水平上增加一份激励薪酬,以保证这份工作是该员工所能找到的最好工作,这样一旦员工失去这份工作,便将很难在社会上找到相似收入的工作,因此一旦员工失去工作,就承担了很大的机会成本,只有这样员工才会珍惜这份工作、努力完成工作要求。很多公司在招聘人才时都强调公司实行的是同行业有竞争力的薪酬标准,什么叫有竞争力的薪酬待遇?就是同行业之间的薪酬比较:比如一个软件架构设计师在外企的薪酬是每月3万元人民币,在同一行业、同一类产品的国内公司,要想聘请到同档次的软件架构师,你的薪酬水平就不能低于外企的薪酬水平。以上三方面也是员工对企业不满的主要原因,其中薪酬设计的关键因素是内部公平与外部公平,个人公平虽然难以从外部表现来衡量,但对于员工积极性的影响也是实实在在的。企业需要通过与员工的沟通,缩小双方的认识差距,让员工认识到自己劳动的价值、市场上的真正价值,珍惜自己的工作岗位。\n\n### 金句摘录\n> 企业要想保证个人公平,最重要的就是量才而用,并为有才能者创造脱颖而出的机会。\n> 海尔的人才观是赛马,不像马。\n\n## 第 0201 集｜激励制度后面的信用博弈1\n\n### 核心内容\n\n本集讲\"激励制度后面的信用博弈\"。口头奖励、红包、温情对待、表示尊重……无论多么经典的激励手段,结果都是第一次比较有用,再而衰、三而竭。为什么呢?因为激励是一种典型的基于支配型关系的行为。我们哄孩子时都这样说:\"乖,你听话,我给你糖吃。\"是因为我们要孩子去做他不想做的事,才要用糖果来激励他。结果这次给一块糖,下次就得两块三块——现在的孩子们多患龋齿,可能和家长的激励措施有关。\n\n激励背后的思维方式是\"我要你做\",而不是员工\"我自己要做\"。所以员工视你的激励措施为他痛苦选择的补偿,认为你给的激励是应该的,甚至还不能满足他们的期望。其实,好的企业与员工的关系应该是:员工在给企业打工,同时是在做他们自己觉得划算的生意。如果员工觉得激励手段是个惊喜,他会很开心,然后就会认为下次应该有更多更大的惊喜,否则就失望。因为是交易行为,而且是持续进行的交易行为,老板不要指望员工会对你一次提出的交易条件满意多次。单次交易完成就行,持续交易就要有持续交易的规则和条件。\n\n书中由此引出\"用人不疑,疑人不用\"是否还适用的讨论,为下一集展开。这个命题是一个相当经典的命题,民营企业老板和经理人之间经常爆发的矛盾当中,就包括疑人与用人的矛盾。\n\n### 金句摘录\n> 激励背后的思维方式是我要你做,而不是员工我自己要做。\n> 员工在给企业打工,同时是在做他们自己觉得划算的生意。\n\n## 第 0202 集｜激励制度后面的信用博弈2\n\n### 核心内容\n\n本集讨论\"用人不疑,疑人不用\"这一命题。疑惑、用人的问题,是关于信任和授权的。无条件的完全的信任,就要疑人不用、用人不疑。那么,为什么我们要如此信任别人呢?其实,这条企业管理规则产生于没有电话网络的时代。那时将军带兵出征或者镇守边陲,和皇上沟通一次可能要十天半个月,皇上没办法对将军进行实时指挥。所以\"将在外,君命有所不受\",是因为皇上不了解现场的情况。在信息难以及时传递的情况下,用人没办法疑人,也绝对不能用,人际关系必须是基于个人信任的支配型。\n\n现在即便是地球两端,也可以随时通过显示屏面对面地通话。美军在海湾作战时,坦克上都装了摄像头,及时把战况传回指挥部;指挥部都可以用卫星定位和地面监测,随时把握战局动态进行指挥。此种情况下,授权和信任还需要那么封闭、那么多吗?市场变化快,需要快速决策、快速调整,所以授权的范围和时间也必须缩小,这时就是要随时监督、随时讨论。所以\"用人不疑,疑人不用\"这句话可以停止使用了。用人是为了让他劳动,他为你工作也是为了自己的利益,只要有完善的激励机制,员工自然不会背叛你。本集把\"信任\"从一种道德姿态还原为信息条件下的制度安排:在信息畅通的今天,更多依靠机制而非笼统的信任来约束关系。\n\n### 金句摘录\n> 在信息难以及时传递的情况下,用人没办法疑人,也绝对不能用。\n> 只要有完善的激励机制,员工自然不会背叛你。\n\n## 第 0203 集｜胡萝卜与大棒在手1\n\n### 核心内容\n\n本集讲\"胡萝卜与大棒在手\"。人都是需要激励和限制的,所以在博弈的时候就要注意这种威逼利诱的方式:给人激励,让他发展,但是又要限制,让他不能脱离你的掌握。\n\n\"胡萝卜加大棒\"的故事相信大家都不陌生,它来源于西方一则古老的故事:要是驴子往前走,就在它面前放一个胡萝卜,或者用一根棒子在后面赶它。而如今这个原理被广泛适用在各个行业,特别是企业管理上,很多领导人都喜欢使用这个方法。在管理上,这是一种很有效的方法,常常用来考核业绩,这就是管理阶层与员工之间博弈的方法。其实不仅是在企业中,在很多其他的管理方法中也用到了这个方法:学校对于学生的管理方面,一面采用奖学金的方式,而另一面则采用不及格必须补考的模式。\n\n本集先讲大棒的好处,书中讲了这样一个故事:每天当太阳升起来的时候,非洲大草原上的动物们就开始奔跑了。狮子妈妈在教育自己的孩子:孩子,你必须跑得再快一点、再快一点,你要是跑不过最慢的羚羊,你就会活活饿死。在另外一个场地上,羚羊妈妈在教育自己的孩子:孩子,你必须跑得再快一点、再快一点,如果你不能跑得比最快的狮子还要快,那你就肯定会被它们吃掉。俗话说,\"逆是害,严是爱\"\"棍棒底下出孝子\"\"严师出高徒\"。人是要有压力的,养尊处优只能使人安于现状、丧失斗志、降低效率。不可否认,大棒会给人带来一种恐惧感,而恐惧来源于人们对生存的威胁;只有当人们受到生存威胁的时候,人才会集中精力、激发思维、提高效率。\n\n### 金句摘录\n> 人都是需要激励和限制的,所以我们在博弈的时候就要注意这种威逼利诱的方式。\n> 只有人们受到生存威胁的时候,人才会集中精力,激发思维,提高效率。\n\n## 第 0204 集｜胡萝卜与大棒在手2\n\n### 核心内容\n\n本集先讲大棒的效应,再讲胡萝卜的力量。美国哈佛大学克莱默教授的一项研究表明,很多人喜欢给比较凶、比较严厉的管理者做事情。而现实中也是这样,当一个人严厉的时候,往往他办的事情或者他要求别人完成的东西质量都很好;同时这个严厉的人很容易给人一种威严的感觉,不管在什么方面都会让人有信任感。你想想,在博弈世界里,当你处处都能得到人们的信任、做事都能让别人信服、能够激励别人的斗志的时候,你还有什么游戏不能玩得出色呢?\n\n再说胡萝卜的力量。古人云:\"重赏之下,必有勇夫。\"\"赏罚若明,奇迹必成。\"别人要获得什么,你就去奖励什么。曾国藩是一个文人,他把湘军治理成为一支很有战斗力的军队,方法很简单:他认为农民出来卖命打仗,无外乎是为了升官发财。对想当官的人,打小胜仗当小官,打大胜仗当大官;对想发财的人,打小胜仗发小财,打大胜仗发大财。把打仗的胜负与士兵的升官发财联系在一起,这就为这支军队注入了活力和生命力。胡萝卜好看有营养,送给别人当然是一片欢腾;适当的奖励可以给人注入动力,可以让人朝着你想要的方向发展。\n\n书中举了刘先生的例子:刘先生家住在北京某豪华地段,爱好是品尝美食,被他看好的美食百吃不厌。附近的一些饭店都去过后,他确定了两家最喜欢的地方,但有一家相对来说比较远一些,而两家的价格和服务味道都差不多,于是他经常就在近的地方吃饭了。偶然一次,他在远的那家饭店吃完饭之后,服务员给了他一张会员卡,说他是这里的常客,应该给他一些折扣,以后每次吃饭都能打八五折,而且还附带送一些小果品或者凉菜之类的东西。\n\n### 金句摘录\n> 重赏之下,必有勇夫。赏罚若明,奇迹必成。\n> 把打仗的胜负与士兵的升官发财联系在一起,这就为这支军队注入了活力和生命力。\n\n## 第 0205 集｜胡萝卜与大棒在手3\n\n### 核心内容\n\n本集讲完刘先生的故事并总结奖惩并用的道理。这下子把刘先生给乐了:有这样的事情,干嘛不享受呢?自己请客、朋友聚会之类的不少,这不是节约了很多吗?不就是多走了一点路而已,很划算的。于是刘先生开始舍近求远,成了那家饭店的贵宾。\n\n从这个故事来看,这家饭店在博弈中取得了满意的成果。博弈者都要遵守博弈的规则,利用好这些智慧,让别人心服口服地成为自己的需要。这家饭店适当给客人一些胡萝卜,让客人尝到了甜头;而客人满足于这样的实际实惠,所以来光顾的次数也比以前要多,每一次消费的数量也比以前增大。从而可以看到,饭店是真正的赢家:拿出胡萝卜而让客人沿着自己想要的路线去走,最后让自己取得想要的结果。\n\n当然,胡萝卜吃多了也会麻木,再美的事物看多了也会审美疲劳,而大棒用多了也会让人反抗,同样还会限制人的发展。因此,单一的手段是不可取的,要有奖励,还要有惩罚的措施,才能够让人既前进又不逆反。拿破仑说得很形象:\"我有时像狮子,有时像绵羊,我的全部成功秘密在于我知道什么时候我应当是前者,什么时候是后者。\"人都是需要激励和限制的,所以我们在博弈的时候就要注意这种威逼利诱的方式:给人激励,让他发展,但是又要限制,让他不能脱离你的掌握。所以只有大棒与胡萝卜同时在手,该用哪个的时候,毫不吝啬地去用。\n\n### 金句摘录\n> 我有时像狮子,有时像绵羊,我的全部成功秘密在于我知道什么时候我应当是前者,什么时候是后者。\n> 大棒与胡萝卜同时在手,该用哪个的时候,毫不吝啬的去用。\n\n## 第 0206 集｜管理中的利益关系1\n\n### 核心内容\n\n本集讲\"管理中的利益关系\"。管理如同做生意,在管理当中,人和人之间最终只有一种关系,以利益交换为基础的生意伙伴关系。组织内部、外部的人际关系状态经常会发生变化,唯一不变的是生意伙伴关系、永恒的生意伙伴。搞不清这一点,你就难免会有这样那样的心理落差或行为不当。\n\n书中讲了小红的例子。小红觉得自己是天下最冤的人,比窦娥还冤。小红曾经是电视台的美女加才女,她被一位著名媒体投资人看中,请去筹备一本都市期刊。小红非常投入,把自己的许多朋友也拉来一起做。期刊上市了,经营慢慢步入正轨,小红有一天突然发现,她的一位好朋友、被她请来做编辑部主任的小T,竟然背着她和老板投资人密切接触,而且说了很多她的坏话。老板则表示出一副公平竞争的态度:小红很能干,小T也很能干,至于小T能否替代小红,要看他们各自的表现。\n\n小红非常郁闷,找朋友聊天。朋友问她:小T和你是什么关系?小红答:朋友。朋友说:现在是同事。朋友接着问:如果以前不是朋友,是单纯的同事,他想往上走、取代你,正常吗?小红答:正常。朋友说:同事关系即工作关系,更准确地讲就是为了利益在一起做事的关系,并且每个人其实都希望通过工作获得更多利益,对吧?小红答:我明白了。道理其实非常简单,职场是生意场。\n\n### 金句摘录\n> 在管理当中,人和人之间最终只有一种关系,以利益交换为基础的生意伙伴关系。\n> 同事关系即工作关系,更准确的讲就是为了利益在一起做事的关系。\n\n## 第 0207 集｜管理中的利益关系2\n\n### 核心内容\n\n本集是全书最后一集,总结职场人际的利益关系。道理其实非常简单,职场是生意场,在职场这个大game当中,人和人之间最终只有一种关系——以利益交换为基础的生意伙伴关系。\n\n书中举了另一个例子:创维集团的老板黄宏生,他给人的感觉相当厚道,听他讲述创业的故事,就像是带着一帮弟兄打江山的感觉。结果,黄宏生第一次遭遇重大挫折,是他非常倚重的陆强华带领整个销售团队集体跳槽;第二次也是因为身边人举报,在香港惹上官司。其实,如果黄宏生不是用对待家里人的方式对待这些人,而是把利益规则都讲得清清楚楚,大家有什么期望的变化随时摆到桌面上来谈,可能也就不会遇到这些突然性的背叛。\n\n书中进一步指出,职场人际关系也是按照价值链的方式串联起来的,包括供应商、客户、合作者、竞争者、可能的替代者、潜在的对手和同盟者等,这些人都是你的职场生意伙伴。因为期望和人际关系会发生变化,你今天的平级同事可能是你明天的上司,今天的竞争对手可能是你明天的客户,所以在职场人际经营中,对各种人都要保持平和理性的心态。全书在此收束,把\"理性看待利益关系\"作为职场博弈的最终落点。\n\n### 金句摘录\n> 在职场这个大game当中,人和人之间最终只有一种关系,以利益交换为基础的生意伙伴关系。\n> 你今天的平级同事可能是你明天的上司,今天的竞争对手可能是你明天的客户。\n\n---\n\n## 本篇小结\n\n这十五集是全书收尾的企业管理篇,主线是制度、激励与利益关系。开篇以\"仙剑奇缘\"游戏开发为例,把激励数额与员工努力程度、老板期望利润之间的博弈算得清清楚楚,并指出最有效的方式其实是与奖励罚金制度等价的员工持股计划;而迟到扣款、建议奖50元这类常见制度,则因忽视逆反心理与贡献差异而成效有限。用人制度上,分槽喂马、弥勒佛与韦陀、柳传志分拆联想,都说明把最合适的人放到最合适的位置,方能\"1+1\"发挥最佳配置。\n\n企业要赢,就得与员工共赢:薪酬是双方博弈的对象,过程与囚徒困境相似,而个人公平、内部公平、外部公平三条标准,决定了员工是否心甘情愿地付出。激励制度背后的信用博弈则提醒我们,激励是一种支配型关系,效果常\"再而衰、三而竭\",在信息畅通的今天,\"用人不疑\"应让位于随时监督与完善机制。胡萝卜与大棒要同时在手,该用时毫不吝啬;而全书最终的落点是那句朴素的话——职场是生意场,人与人最终是生意伙伴关系,唯有把利益规则讲清楚、随时沟通,并对各类人保持平和理性的心态,才能少一些突如其来的背叛。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0193 集｜企业制度中的博弈1","id":"第-0193-集企业制度中的博弈1"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0194 集｜企业制度中的博弈2","id":"第-0194-集企业制度中的博弈2"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0195 集｜企业制度中的博弈3","id":"第-0195-集企业制度中的博弈3"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0196 集｜用人制度中的博弈1","id":"第-0196-集用人制度中的博弈1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0197 集｜用人制度中的博弈2","id":"第-0197-集用人制度中的博弈2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0198 集｜企业与员工的双赢博弈1","id":"第-0198-集企业与员工的双赢博弈1"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0199 集｜企业与员工的双赢博弈2","id":"第-0199-集企业与员工的双赢博弈2"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0200 集｜企业与员工的双赢博弈3","id":"第-0200-集企业与员工的双赢博弈3"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0201 集｜激励制度后面的信用博弈1","id":"第-0201-集激励制度后面的信用博弈1"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0202 集｜激励制度后面的信用博弈2","id":"第-0202-集激励制度后面的信用博弈2"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0203 集｜胡萝卜与大棒在手1","id":"第-0203-集胡萝卜与大棒在手1"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0204 集｜胡萝卜与大棒在手2","id":"第-0204-集胡萝卜与大棒在手2"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0205 集｜胡萝卜与大棒在手3","id":"第-0205-集胡萝卜与大棒在手3"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0206 集｜管理中的利益关系1","id":"第-0206-集管理中的利益关系1"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0207 集｜管理中的利益关系2","id":"第-0207-集管理中的利益关系2"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"本篇小结","id":"本篇小结"}]}]}]};</script>
<script>/* ============================================================
 * md.js — 轻量 Markdown 渲染器（零依赖 / 可离线）
 * 支持：标题、表格、引用（含嵌套表格）、有序/无序列表（含嵌套）、
 *       围栏代码块、分隔线、段落，以及行内 **粗体** *斜体* ~~删除~~
 *       `代码` [链接](url) 裸链接 <br>（唯一放行的原始 HTML）
 * ============================================================ */
(function (global) {
  'use strict';

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return ESC[c]; });
  }

  /* 中文（全角）字符之间拼接不加空格，避免出现"断 句 空 格" */
  function isWide(ch) {
    return /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef\u2018-\u201f\u2014\u2026]/.test(ch);
  }
  function smartJoin(a, b) {
    if (!a) return b || '';
    if (!b) return a;
    return (isWide(a.slice(-1)) && isWide(b.charAt(0))) ? a + b : a + ' ' + b;
  }

  /* GitHub 风格锚点（与笔记内已有 TOC 链接保持一致） */
  function slug(text) {
    return String(text)
      .toLowerCase()
      .replace(/`+/g, '')
      .replace(/\*\*|\*|~~/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[^\w\u4e00-\u9fff\s-]/g, '')
      .replace(/^\s+|\s+$/g, '')
      .replace(/\s+/g, '-');
  }

  /* ---------------- 行内 ---------------- */
  function inline(text) {
    var codes = [];
    var t = String(text);

    // 1) 先抽出行内代码，避免其中的符号被当语法
    t = t.replace(/`([^`]+)`/g, function (m, a) {
      codes.push(a);
      return '\u0001C' + (codes.length - 1) + '\u0001';
    });
    // 2) 放行 <br>
    t = t.replace(/<\s*br\s*\/?\s*>/gi, '\u0001B\u0001');
    // 3) 转义
    t = esc(t);
    // 4) 链接
    t = t.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (m, txt, href) {
      var ext = /^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + href + '"' + ext + '>' + txt + '</a>';
    });
    // 5) 粗体 → 删除线 → 斜体
    t = t.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
    t = t.replace(/(^|[^*\w])\*([^\s*][^*\n]*?)\*(?!\*)/g, '$1<em>$2</em>');
    // 6) 裸链接
    t = t.replace(/(^|[\s(（])(https?:\/\/[^\s<>()（）]+)/g, function (m, p, u) {
      return p + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
    // 7) 还原
    t = t.replace(/\u0001C(\d+)\u0001/g, function (m, idx) {
      return '<code class="md-inline-code">' + esc(codes[+idx]) + '</code>';
    });
    t = t.replace(/\u0001B\u0001/g, '<br>');
    return t;
  }

  /* ---------------- 行判定 ---------------- */
  function headingOf(l) { return /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l); }
  function isFence(l) { return /^\s*(```+|~~~+)/.test(l); }
  function isHr(l) { return /^\s*([-*_])(\s*\1){2,}\s*$/.test(l); }
  function isQuote(l) { return /^\s{0,3}>/.test(l); }
  function ulOf(l) { return /^(\s*)([-*+])\s+(.*)$/.exec(l); }
  function olOf(l) { return /^(\s*)(\d+)[.)]\s+(.*)$/.exec(l); }
  function indentOf(l, tab) {
    var m = /^[ \t]*/.exec(l)[0];
    return m.replace(/\t/g, tab || '    ').length;
  }

  function splitRow(l) {
    var s = l.replace(/^\s+|\s+$/g, '');
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.slice(-1) === '|') s = s.slice(0, -1);
    var cells = [], cur = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c === '\\' && s.charAt(i + 1) === '|') { cur += '|'; i++; continue; }
      if (c === '|') { cells.push(cur.replace(/^\s+|\s+$/g, '')); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur.replace(/^\s+|\s+$/g, ''));
    return cells;
  }

  function isTableSep(l) {
    if (typeof l !== 'string') return false;
    var cells = splitRow(l);
    if (cells.length < 1) return false;
    if (cells.length < 2 && l.indexOf('|') < 0) return false;
    for (var i = 0; i < cells.length; i++) {
      if (!/^:?-{2,}:?$/.test(cells[i])) return false;
    }
    return true;
  }

  function alignOf(sep) {
    var a = [];
    var cells = splitRow(sep);
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (/^:-+:$/.test(c)) a.push('center');
      else if (/^-+:$/.test(c)) a.push('right');
      else a.push(null);
    }
    return a;
  }

  /* ---------------- 列表 ---------------- */
  function parseList(lines, start, n) {
    var baseIndent = indentOf(lines[start]);
    var firstIsUl = !!ulOf(lines[start]);
    var tag = firstIsUl ? 'ul' : 'ol';
    var startAttr = '';
    if (!firstIsUl) {
      var num = parseInt(olOf(lines[start])[2], 10);
      if (num && num !== 1) startAttr = ' start="' + num + '"';
    }
    var i = start;
    var html = '<' + tag + ' class="md-list"' + startAttr + '>';

    while (i < n) {
      var l = lines[i];
      if (/^\s*$/.test(l)) {
        var j = i;
        while (j < n && /^\s*$/.test(lines[j])) j++;
        var nx = lines[j];
        if (nx === undefined) break;
        if ((ulOf(nx) || olOf(nx)) && indentOf(nx) >= baseIndent) { i = j; continue; }
        break;
      }
      var um = ulOf(l), om = olOf(l);
      if (!um && !om) break;
      if (indentOf(l) < baseIndent) break;
      if (indentOf(l) > baseIndent) {           // 意外缩进：当同级处理
        // 交给内层循环处理（此处直接放宽）
      }
      var text = um ? um[3] : om[3];
      i++;
      var item = inline(text);

      var guard = 0;
      while (i < n && guard++ < 500) {
        if (/^\s*$/.test(lines[i])) {
          var k = i;
          while (k < n && /^\s*$/.test(lines[k])) k++;
          if (k < n && (ulOf(lines[k]) || olOf(lines[k])) && indentOf(lines[k]) > baseIndent) { i = k; continue; }
          break;
        }
        if (ulOf(lines[i]) || olOf(lines[i])) {
          if (indentOf(lines[i]) > baseIndent) {
            var sub = parseList(lines, i, n);
            item += sub.html;
            i = sub.next;
            continue;
          }
          break;
        }
        if (headingOf(lines[i]) || isHr(lines[i]) || isFence(lines[i])) break;
        if (indentOf(lines[i]) > baseIndent) {
          item = smartJoin(item, inline(lines[i].replace(/^\s+|\s+$/g, '')));
          i++;
          continue;
        }
        break;
      }
      html += '<li class="md-li">' + item + '</li>';
    }
    html += '</' + tag + '>';
    return { html: html, next: i };
  }

  /* ---------------- 主渲染 ----------------
   * opts 可传：true（旧写法，等价于 {nested:true}）
   *            { nested: true, idPrefix: 'p12-' }
   * idPrefix 用于把多篇笔记合并进同一页面时避免标题 id 冲突。
   */
  function render(md, opts) {
    var nested = false, idPrefix = '';
    if (opts === true) nested = true;
    else if (opts && typeof opts === 'object') {
      nested = !!opts.nested;
      idPrefix = opts.idPrefix || '';
    }
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
    var n = lines.length;
    var out = [];
    var outline = [];
    var used = {};
    var i = 0;

    function uniq(base) {
      base = base || 'sec';
      if (!used[base]) { used[base] = 1; return base; }
      used[base]++;
      return base + '-' + used[base];
    }

    while (i < n) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      /* 围栏代码块 */
      var fm = /^\s*(```+|~~~+)\s*([\w+#-]*)\s*$/.exec(line);
      if (fm) {
        var tick = fm[1].charAt(0);
        var closeRe = new RegExp('^\\s*' + tick + tick + tick);
        var lang = fm[2];
        var buf = [];
        i++;
        while (i < n && !closeRe.test(lines[i])) { buf.push(lines[i]); i++; }
        if (i < n) i++;
        out.push('<pre class="md-pre">' + (lang ? '<span class="md-pre-lang">' + esc(lang) + '</span>' : '') +
          '<code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      /* 分隔线 */
      if (isHr(line)) { out.push('<hr class="md-hr">'); i++; continue; }

      /* 标题 */
      var hm = headingOf(line);
      if (hm) {
        var lvl = hm[1].length;
        var raw = hm[2];
        var id = idPrefix + uniq(slug(raw));
        outline.push({
          level: lvl,
          text: raw.replace(/\*\*/g, '').replace(/`/g, '').replace(/~~/g, ''),
          id: id
        });
        out.push('<h' + lvl + ' id="' + id + '" class="md-h md-h' + lvl + '">' + inline(raw) + '</h' + lvl + '>');
        i++;
        continue;
      }

      /* 引用块（内部可含表格/列表/标题） */
      if (isQuote(line)) {
        var qbuf = [];
        while (i < n) {
          if (isQuote(lines[i])) {
            qbuf.push(lines[i].replace(/^\s{0,3}>\s?/, ''));
            i++;
          } else if (/^\s*$/.test(lines[i]) && isQuote(lines[i + 1] || '')) {
            qbuf.push('');
            i++;
          } else break;
        }
        out.push('<blockquote class="md-quote">' + render(qbuf.join('\n'), { nested: true, idPrefix: idPrefix }).html + '</blockquote>');
        continue;
      }

      /* 表格 */
      if (line.indexOf('|') >= 0 && isTableSep(lines[i + 1])) {
        var aligns = alignOf(lines[i + 1]);
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < n && !/^\s*$/.test(lines[i]) && lines[i].indexOf('|') >= 0) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        var th = '';
        for (var c = 0; c < head.length; c++) {
          var st = aligns[c] ? ' style="text-align:' + aligns[c] + '"' : '';
          th += '<th' + st + '>' + inline(head[c]) + '</th>';
        }
        var tb = '';
        for (var r = 0; r < rows.length; r++) {
          var tds = '';
          for (var c2 = 0; c2 < head.length; c2++) {
            var st2 = aligns[c2] ? ' style="text-align:' + aligns[c2] + '"' : '';
            tds += '<td' + st2 + '>' + inline(rows[r][c2] === undefined ? '' : rows[r][c2]) + '</td>';
          }
          tb += '<tr>' + tds + '</tr>';
        }
        out.push('<div class="table-wrap"><table class="md-table"><thead><tr>' + th +
          '</tr></thead><tbody>' + tb + '</tbody></table></div>');
        continue;
      }

      /* 列表 */
      if (ulOf(line) || olOf(line)) {
        var res = parseList(lines, i, n);
        out.push(res.html);
        i = res.next;
        continue;
      }

      /* 段落 */
      var buf2 = [line];
      i++;
      while (i < n) {
        var cur = lines[i];
        if (/^\s*$/.test(cur)) break;
        if (headingOf(cur) || isQuote(cur) || isFence(cur) || isHr(cur)) break;
        if (ulOf(cur) || olOf(cur)) break;
        if (cur.indexOf('|') >= 0 && isTableSep(lines[i + 1])) break;
        buf2.push(cur);
        i++;
      }
      var para = '';
      for (var q = 0; q < buf2.length; q++) para = smartJoin(para, buf2[q].replace(/^\s+|\s+$/g, ''));
      out.push('<p class="md-p">' + inline(para) + '</p>');
    }

    return { html: out.join('\n'), outline: nested ? [] : outline };
  }

  global.MDRender = {
    render: render,
    inline: inline,
    slug: slug,
    esc: esc
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ============================================================
 * app.js — 知识库前端（零依赖 / 可离线）
 * 侧栏章节目录 · 全文搜索 · 右侧大纲 · 阅读进度 · 明暗主题
 * ============================================================ */
(function () {
  'use strict';

  var KB = window.KB;
  var NOTES = [];
  var BY_ID = {};
  KB.groups.forEach(function (g) {
    g.items.forEach(function (n) {
      n.group = g.name;
      n._idx = NOTES.length;
      NOTES.push(n);
      BY_ID[n.id] = n;
    });
  });

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------------- 本地存储 ---------------- */
  var LS_READ = 'pd_kb_read_v1', LS_LAST = 'pd_kb_last_v1', LS_THEME = 'pd_kb_theme_v1';
  function readMap() { try { return JSON.parse(localStorage.getItem(LS_READ) || '{}'); } catch (e) { return {}; } }
  function markRead(id) {
    try { var m = readMap(); m[id] = 1; localStorage.setItem(LS_READ, JSON.stringify(m)); } catch (e) {}
  }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------------- 通用：清理 Markdown ---------------- */
  function cleanMd(s) {
    s = String(s).replace(/^\s*\|/, '|');
    if (s.indexOf('|') >= 0) s = s.replace(/\|/g, ' · ');
    return s
      .replace(/^\s*[>#*+\-—]{1,6}\s*/, '')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/<\/?br\s*\/?>/gi, ' ')
      .replace(/\*\*|~~|`/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function highlightSnippet(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      if (!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = out.replace(re, '<mark class="hl">$1</mark>');
    });
    return out;
  }

  /* ================= 侧栏 ================= */
  function buildSidebar() {
    var nav = $('#nav');
    var read = readMap();
    var html = '';
    KB.groups.forEach(function (g, gi) {
      html += '<div class="grp" data-g="' + gi + '">' +
        '<button class="grp-h" type="button"><span class="grp-n">' + esc(g.name) + '</span>' +
        '<span class="grp-c">' + g.items.length + '</span><i class="chev"></i></button>' +
        '<div class="grp-b">';
      g.items.forEach(function (n) {
        html += '<a class="item' + (read[n.id] ? ' is-read' : '') + '" data-id="' + n.id + '" href="#' + n.id + '" title="' +
          esc(n.full || n.title) + '">' +
          '<span class="pn">' + n.id + '</span>' +
          '<span class="nm">' + esc(n.title) + '</span>' +
          (n.dur ? '<span class="dm">' + n.dur + '</span>' : '') +
          '</a>';
      });
      html += '</div></div>';
    });
    nav.innerHTML = html;

    nav.addEventListener('click', function (e) {
      var h = e.target.closest('.grp-h');
      if (h) { h.parentNode.classList.toggle('closed'); return; }
      var a = e.target.closest('.item');
      if (a) { e.preventDefault(); open(a.getAttribute('data-id')); closeDrawer(); }
    });
    nav.addEventListener('contextmenu', function (e) {
      var a = e.target.closest('.item');
      if (a) { e.preventDefault(); a.classList.remove('is-read'); var m = readMap(); delete m[a.getAttribute('data-id')]; ls(LS_READ, JSON.stringify(m)); }
    });
  }

  function syncSidebarActive(id) {
    $$('#nav .item').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-id') === id); });
    var cur = $('#nav .item.active');
    if (cur) {
      var grp = cur.closest('.grp');
      if (grp) grp.classList.remove('closed');
      var box = $('#sidebar'), cr = cur.getBoundingClientRect(), br = box.getBoundingClientRect();
      if (cr.top < br.top + 60 || cr.bottom > br.bottom - 20) {
        box.scrollTop += (cr.top - br.top) - box.clientHeight / 2 + 30;
      }
    }
  }

  /* ================= 内容渲染 ================= */
  var currentId = null;
  var renderedKey = null;   // 已渲染的 hash key，避免 hashchange 造成重复渲染

  function collapseNativeToc(article) {
    $$('h2', article).forEach(function (h) {
      if (h.textContent.replace(/\s/g, '') !== '目录') return;
      var box = document.createElement('div');
      box.className = 'native-toc';
      var n = h.nextElementSibling;
      while (n && n.tagName !== 'H2') { var nx = n.nextElementSibling; box.appendChild(n); n = nx; }
      if (!box.children.length) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toc-toggle';
      var setLabel = function () { btn.innerHTML = '<i class="chev"></i>' + (box.hidden ? '本讲完整目录' : '收起完整目录'); };
      box.hidden = true; setLabel();
      btn.addEventListener('click', function () { box.hidden = !box.hidden; btn.classList.toggle('open', !box.hidden); setLabel(); });
      h.after(btn);
      btn.after(box);
    });
  }

  function buildToc(note) {
    var body = $('#tocbody');
    var items = (note.outline || []).filter(function (o) { return o.level >= 2 && o.level <= 3; });
    if (!items.length) { $('#toc').classList.add('empty'); body.innerHTML = ''; return; }
    $('#toc').classList.remove('empty');
    body.innerHTML = items.map(function (o) {
      return '<a class="toc-i lv' + o.level + '" href="#' + o.id + '">' + esc(o.text) + '</a>';
    }).join('');
    body.parentNode.scrollTop = 0;
  }

  var tocHandler = null;
  function bindTocScroll() {
    if (tocHandler) window.removeEventListener('scroll', tocHandler);
    var links = $$('#tocbody .toc-i');
    if (!links.length) return;
    var targets = links.map(function (a) { return document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))); });
    tocHandler = function () {
      var y = window.scrollY + 120, idx = -1;
      for (var i = 0; i < targets.length; i++) {
        if (targets[i] && targets[i].offsetTop <= y) idx = i; else if (targets[i]) break;
      }
      links.forEach(function (a, i) { a.classList.toggle('active', i === idx); });
    };
    window.addEventListener('scroll', tocHandler, { passive: true });
    tocHandler();
  }

  function open(id, anchor, terms) {
    var note = BY_ID[id];
    if (!note) { renderHome(); return; }
    currentId = id;
    renderedKey = '#' + id + (anchor ? '/' + anchor : '');
    if (location.hash !== renderedKey) location.hash = renderedKey;
    $('#doc').innerHTML = '<div class="doc-inner"><div class="doc-head">' +
      '<div class="dh-top"><span class="badge">' + note.id + '</span>' +
      (note.lect ? '<span class="dh-lect">' + esc(note.lect) + '</span>' : '') +
      (note.dur ? '<span class="dh-dur">时长 ' + note.dur + '</span>' : '') +
      (note.url ? '<a class="dh-link" href="' + note.url + '" target="_blank" rel="noopener">原视频</a>' : '') +
      '</div>' +
      '<h1 class="dh-title">' + esc(note.full || note.title) + '</h1>' +
      (note.theme ? '<p class="dh-theme">' + esc(note.theme) + '</p>' : '') +
      '</div></div>';

    var res = window.MDRender.render(note.md);
    var art = $('.doc-inner');
    var holder = document.createElement('div');
    holder.className = 'md-body';
    holder.innerHTML = res.html;
    art.appendChild(holder);

    // 去掉笔记自带的 H1（课程信息与标题已在头部统一展示）
    $$('h1', holder).forEach(function (h) { h.remove(); });

    // 表格横向滚动
    $$('table', holder).forEach(function (t) {
      if (!t.parentNode.classList.contains('table-wrap')) {
        var w = document.createElement('div'); w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      }
    });

    collapseNativeToc(holder);

    // 内部的 #锚点 链接
    holder.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var target = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
      if (target) window.scrollTo({ top: target.offsetTop - 84, behavior: 'smooth' });
    });

    buildToc(note);
    bindTocScroll();
    markRead(id);
    var si = $('#nav .item[data-id="' + id + '"]');
    if (si) si.classList.add('is-read');
    syncSidebarActive(id);
    ls(LS_LAST, id);
    renderPager(note);
    $('#toc').style.visibility = '';
    document.body.classList.remove('is-home');
    // 切换笔记时立即回到顶部（不要被全局 scroll-behavior:smooth 拖成长动画）
    var de = document.documentElement;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { de.style.scrollBehavior = ''; });

    if (terms && terms.length) {
      var n = highlightIn(holder, terms);
      if (n) {
        var first = holder.querySelector('mark.hl');
        if (first) setTimeout(function () { window.scrollTo({ top: Math.max(0, first.offsetTop - 120), behavior: 'smooth' }); }, 60);
      }
    } else if (anchor) {
      var t = document.getElementById(decodeURIComponent(anchor));
      if (t) setTimeout(function () { window.scrollTo({ top: t.offsetTop - 84, behavior: 'smooth' }); }, 30);
    }
    document.title = note.id + ' ' + note.title + ' · 判断推理知识库';
  }

  function highlightIn(root, terms) {
    if (!terms || !terms.length) return 0;
    var re = new RegExp('(' + terms.map(function (t) {
      return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|') + ')', 'gi');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = node.parentNode;
        if (p && /^(SCRIPT|STYLE|MARK)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
        re.lastIndex = 0;
        return re.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    var count = 0;
    nodes.forEach(function (node) {
      var frag = document.createDocumentFragment();
      var parts = node.nodeValue.split(re);
      parts.forEach(function (p, i) {
        if (i % 2 === 1) { var m = document.createElement('mark'); m.className = 'hl'; m.textContent = p; frag.appendChild(m); count++; }
        else if (p) frag.appendChild(document.createTextNode(p));
      });
      node.parentNode.replaceChild(frag, node);
    });
    return count;
  }

  function renderPager(note) {
    var i = note._idx, p = NOTES[i - 1], n = NOTES[i + 1];
    $('#pager').innerHTML =
      (p ? '<a class="pg" href="#' + p.id + '" data-id="' + p.id + '"><span>上一讲</span><b>' + p.id + ' ' + esc(p.title) + '</b></a>' : '<span class="pg disabled"></span>') +
      (n ? '<a class="pg next" href="#' + n.id + '" data-id="' + n.id + '"><span>下一讲</span><b>' + n.id + ' ' + esc(n.title) + '</b></a>' : '<span class="pg disabled"></span>');
  }

  /* ================= 首页 ================= */
  function renderHome() {
    currentId = null;
    renderedKey = '';
    document.body.classList.add('is-home');
    $('#toc').style.visibility = 'hidden';
    $('#pager').innerHTML = '';
    $$('#nav .item').forEach(function (a) { a.classList.remove('active'); });
    var h = Math.round(KB.meta.totalSec / 3600 * 10) / 10;
    var last = ls(LS_LAST);
    var read = readMap();
    var readCount = NOTES.filter(function (n) { return read[n.id]; }).length;

    var html = '<div class="doc-inner home">' +
      '<div class="hero">' +
      '<h1>' + esc(KB.meta.title) + '</h1>' +
      '<p class="hero-sub">' + esc(KB.meta.subtitle || '') + (KB.meta.teacher ? ' · ' + esc(KB.meta.teacher) : '') + '</p>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + KB.meta.totalEp + '</b><span>篇笔记</span></div>' +
      '<div class="stat"><b>' + h + '</b><span>小时视频</span></div>' +
      '<div class="stat"><b>' + KB.groups.length + '</b><span>个模块</span></div>' +
      '<div class="stat"><b>' + readCount + '/' + KB.meta.totalEp + '</b><span>已读进度</span></div>' +
      '</div>' +
      (last && BY_ID[last] ? '<button class="btn primary" id="hContinue">继续上次：' + last + ' ' + esc(BY_ID[last].title) + '</button>' : '') +
      (KB.meta.course ? '<p class="hero-src">笔记来源：' + esc(KB.meta.course) + '</p>' : '') +
      '</div>' +
      '<div class="kbd-tips"><b>快捷键</b> ' +
      '<kbd>/</kbd><kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索 &nbsp;·&nbsp; <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 上一讲/下一讲 &nbsp;·&nbsp; <kbd>Esc</kbd> 关闭搜索 &nbsp;·&nbsp; 右键侧栏条目可取消已读</div>';

    KB.groups.forEach(function (g, gi) {
      var secs = g.items.reduce(function (a, b) { return a + b.sec; }, 0);
      html += '<section class="ghome"><h2><i>' + String(gi + 1).padStart(2, '0') + '</i>' + esc(g.name.replace(/^\d+\s*·\s*/, '')) +
        '<em>' + g.items.length + ' 讲 · ' + Math.round(secs / 60) + ' 分钟</em></h2><div class="chips">';
      g.items.forEach(function (n) {
        html += '<a class="chip' + (read[n.id] ? ' is-read' : '') + '" href="#' + n.id + '" data-id="' + n.id + '">' +
          '<span class="cp">' + n.id + '</span>' + esc(n.title) + '<span class="cd">' + n.dur + '</span></a>';
      });
      html += '</div></section>';
    });

    var _howto = (KB.meta && KB.meta.howto) || [
      ['按模块学：', '左侧目录按课程模块组织，和上课顺序一致，可整块顺读。'],
      ['全文搜索：', '直接搜考点名或关键词（如「增速」「比重」「百分点」），会列出所有讲过的位置和原文片段。'],
      ['查模板：', '每讲结尾都有「知识点总表 / 口诀与流程 / 易错点清单」，复习时只看这些表即可。'],
      ['追进度：', '打开过的讲会自动标记为已读，右侧可取消。']
    ];
    html += '<section class="ghome"><h2><i>用</i>怎么用这个知识库</h2><ul class="howto">' +
      _howto.map(function (it) {
        var b = Array.isArray(it) ? it[0] : (it.b || ''), t = Array.isArray(it) ? it[1] : (it.text || '');
        return '<li><b>' + esc(b) + '</b>' + esc(t) + '</li>';
      }).join('') +
      '</ul></section>';

    html += '</div>';
    $('#doc').innerHTML = html;
    var cb = $('#hContinue');
    if (cb) cb.addEventListener('click', function () { open(last); });
    document.title = KB.meta.title;
  }

  /* ================= 搜索 ================= */
  var idxReady = false;
  function buildIndex() {
    if (idxReady) return;
    NOTES.forEach(function (n) {
      n._lines = n.md.split('\n');
      n._lc = n.md.toLowerCase();
    });
    idxReady = true;
  }

  function doSearch(q) {
    buildIndex();
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var res = [];
    NOTES.forEach(function (n) {
      var ok = true;
      for (var i = 0; i < terms.length; i++) if (n._lc.indexOf(terms[i]) < 0) { ok = false; break; }
      if (!ok) return;
      var hits = [], total = 0;
      for (var j = 0; j < n._lines.length; j++) {
        var L = n._lines[j].toLowerCase(), best = 0;
        for (var k = 0; k < terms.length; k++) if (L.indexOf(terms[k]) >= 0) best++;
        if (best > 0) { total += best; hits.push({ line: j, text: cleanMd(n._lines[j]), score: best }); }
      }
      hits.sort(function (a, b) { return b.score - a.score; });
      res.push({ note: n, score: total, hits: hits.slice(0, 4) });
    });
    res.sort(function (a, b) { return b.score - a.score || a.note._idx - b.note._idx; });
    return res;
  }

  var searchSeq = 0;
  function runSearch(q) {
    var box = $('#results');
    if (!q.trim()) { box.hidden = true; box.innerHTML = ''; return; }
    var seq = ++searchSeq;
    var res = doSearch(q);
    if (seq !== searchSeq) return;
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var maxLine = 86;
    var html = '<div class="rs-head">找到 <b>' + res.length + '</b> 篇相关笔记（共 ' + NOTES.length + ' 篇）· <span class="rs-q">' + esc(q) + '</span><button class="rs-x" type="button">关闭 Esc</button></div>';
    if (!res.length) {
      html += '<div class="rs-empty">没有找到包含「' + esc(q) + '」的内容。试试更短的词，例如「他因」「秒杀」「两难」。</div>';
    } else {
      html += '<div class="rs-list">';
      res.slice(0, 40).forEach(function (r) {
        html += '<div class="rs-item"><a class="rs-title" href="#' + r.note.id + '" data-id="' + r.note.id + '">' +
          '<span class="badge">' + r.note.id + '</span><b>' + esc(r.note.title) + '</b>' +
          '<span class="rs-g">' + esc(r.note.group.replace(/^\d+\s*·\s*/, '')) + '</span>' +
          '<span class="rs-c">' + r.score + ' 处</span></a>';
        html += '<div class="rs-snips">';
        r.hits.forEach(function (hh) {
          var t = hh.text;
          var pos = -1;
          for (var k = 0; k < terms.length && pos < 0; k++) pos = t.toLowerCase().indexOf(terms[k]);
          if (pos < 0) pos = 0;
          var start = Math.max(0, pos - 30);
          var snip = (start > 0 ? '…' : '') + t.slice(start, start + maxLine) + (t.length > start + maxLine ? '…' : '');
          html += '<div class="rs-snip" data-id="' + r.note.id + '" data-line="' + hh.line + '">' + highlightSnippet(snip, terms) + '</div>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    }
    box.innerHTML = html;
    box.hidden = false;
  }

  function closeSearch() {
    $('#results').hidden = true;
    $('#q').value = '';
  }

  /* ================= 路由 ================= */
  function route() {
    var h = location.hash;
    if (!h) { if (renderedKey !== '') renderHome(); return; }
    if (h === renderedKey) return;
    var seg = decodeURIComponent(h.slice(1)).split('/');
    if (BY_ID[seg[0]]) open(seg[0], seg[1] || null);
    else renderHome();
  }

  /* ================= 初始化 ================= */
  function init() {
    buildSidebar();
    var bt = $('#brandTitle'), bs = $('#brandSub'), lg = $('.logo');
    if (bt && KB.meta.title) bt.textContent = KB.meta.title;
    if (lg && KB.meta.title) lg.textContent = KB.meta.title.replace(/[·・\s.].*$/, '').slice(0, 1);
    if (bs && KB.meta.subtitle) bs.textContent = KB.meta.subtitle;
    if (ls(LS_THEME) === 'dark') document.body.classList.add('dark');

    $('#brand').addEventListener('click', function () { location.hash = ''; renderHome(); });

    $('#btnHome').addEventListener('click', function () { location.hash = ''; renderHome(); });

    $('#btnExpand').addEventListener('click', function () {
      var any = $$('#nav .grp').some(function (g) { return g.classList.contains('closed'); });
      $$('#nav .grp').forEach(function (g) { g.classList.toggle('closed', !any); });
      $('#btnExpand').textContent = any ? '收起目录' : '展开目录';
    });

    $('#btnTheme').addEventListener('click', function () {
      document.body.classList.toggle('dark');
      ls(LS_THEME, document.body.classList.contains('dark') ? 'dark' : 'light');
      $('#btnTheme').textContent = document.body.classList.contains('dark') ? '浅色' : '深色';
    });
    $('#btnTheme').textContent = document.body.classList.contains('dark') ? '浅色' : '深色';

    $('#btnPrint').addEventListener('click', function () { window.print(); });

    $('#btnMenu').addEventListener('click', function () { document.body.classList.toggle('drawer'); });

    var q = $('#q'), timer = null;
    q.addEventListener('input', function () {
      clearTimeout(timer);
      var v = q.value;
      timer = setTimeout(function () { runSearch(v); }, 130);
    });
    q.addEventListener('focus', function () { if (q.value.trim()) runSearch(q.value); });

    $('#qclear').addEventListener('click', function () { closeSearch(); q.focus(); });

    $('#results').addEventListener('click', function (e) {
      if (e.target.closest('.rs-x')) { closeSearch(); return; }
      var t = e.target.closest('[data-id]');
      if (!t) return;
      var id = t.getAttribute('data-id');
      var terms = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
      $('#results').hidden = true;
      open(id, null, terms);
    });

    $('#pager').addEventListener('click', function (e) {
      var a = e.target.closest('a[data-id]');
      if (a) { e.preventDefault(); open(a.getAttribute('data-id')); }
    });

    $('#doc').addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a || a.closest('#nav')) return;
      var id = decodeURIComponent(a.getAttribute('href').slice(1)).split('/')[0];
      if (BY_ID[id] && !document.getElementById(id)) { e.preventDefault(); open(id); }
    });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea';
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); return; }
      if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); return; }
      if (e.key === 'Escape') { if (!$('#results').hidden) closeSearch(); else if (typing) q.blur(); return; }
      if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && currentId) {
        e.preventDefault();
        var i = BY_ID[currentId]._idx + (e.key === 'ArrowRight' ? 1 : -1);
        if (NOTES[i]) open(NOTES[i].id);
      }
    });

    window.addEventListener('hashchange', route);
    route();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  function closeDrawer() { document.body.classList.remove('drawer'); }
})();
</script>
</body>
</html>
