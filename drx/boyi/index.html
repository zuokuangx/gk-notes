<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识库</title>
<style>
/* ============================================================
 * styles.css — 判断推理知识库
 * ============================================================ */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #f7f8fa;
  --panel-3: #f0f2f5;
  --text: #1f2328;
  --text-2: #4a5260;
  --muted: #7b838f;
  --line: #e4e7eb;
  --line-2: #eef0f3;
  --accent: #2f6bff;
  --accent-soft: #eaf0ff;
  --accent-text: #1d4ed8;
  --mark: #ffe58f;
  --code-fg: #9a3412;
  --ok: #16a34a;
  --shadow: 0 6px 24px rgba(20, 26, 40, .08);
  --shadow-lg: 0 18px 50px rgba(20, 26, 40, .16);
  --radius: 10px;
  --header-h: 58px;
}
body.dark {
  --bg: #14161a;
  --panel: #1b1e23;
  --panel-2: #21252b;
  --panel-3: #262b32;
  --text: #e7e9ed;
  --text-2: #c2c8d1;
  --muted: #8b939f;
  --line: #2b3138;
  --line-2: #23282e;
  --accent: #6d9bff;
  --accent-soft: #1b2740;
  --accent-text: #8fb4ff;
  --mark: #6b5a10;
  --code-fg: #ffb08a;
  --shadow: 0 6px 24px rgba(0, 0, 0, .4);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

/* ================= 顶栏 ================= */
#topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
#brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 0 0 auto; }
#brand .logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #7aa2ff);
  color: #fff; font-weight: 800; font-size: 16px;
  display: grid; place-items: center; letter-spacing: .04em;
}
#brand .brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
#brand .brand-txt b { font-size: 14.5px; }
#brand .brand-txt span { font-size: 11.5px; color: var(--muted); }

.searchbox { position: relative; flex: 1 1 auto; max-width: 560px; margin: 0 auto; }
.searchbox input {
  width: 100%; height: 36px; padding: 0 34px 0 34px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-2); color: var(--text); font-size: 13.5px; outline: none;
}
.searchbox input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox::before {
  content: ""; position: absolute; left: 13px; top: 50%; width: 13px; height: 13px;
  margin-top: -8px; border: 1.8px solid var(--muted); border-radius: 50%;
}
.searchbox::after {
  content: ""; position: absolute; left: 24px; top: 50%; width: 6px; height: 1.8px;
  margin-top: 4px; background: var(--muted); transform: rotate(45deg);
}
#qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--panel-3); color: var(--muted); font-size: 13px; line-height: 1;
}
#qclear:hover { background: var(--line); color: var(--text); }

.topbtns { display: flex; gap: 8px; flex: 0 0 auto; }
.topbtns button {
  height: 32px; padding: 0 12px; font-size: 12.5px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text-2);
}
.topbtns button:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
#btnMenu { display: none; }
#btnMenu {
  width: 34px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text-2); cursor: pointer; font-size: 15px; line-height: 1;
}

/* ================= 布局 ================= */
#layout { display: grid; grid-template-columns: 292px minmax(0, 1fr) 216px; align-items: start; }
#sidebar {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 8px 0 40px;
}
#main { padding: 26px 44px 60px; min-width: 0; }
#toc {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-left: 1px solid var(--line);
  padding: 18px 10px 40px;
}

/* ================= 侧栏目录 ================= */
.grp-h {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 8px; border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  text-align: left;
}
.grp-h:hover { color: var(--text); }
.grp-n { flex: 1; }
.grp-c {
  font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  background: var(--panel-3); color: var(--muted);
}
.chev {
  width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg) translate(-1px, -1px); transition: transform .18s; flex: 0 0 auto;
}
.grp.closed .chev { transform: rotate(-45deg); }
.grp.closed .grp-b { display: none; }
.grp-b { padding-bottom: 4px; }
.item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 16px; margin: 0 6px 1px;
  border-radius: 7px; font-size: 13.5px; color: var(--text); text-decoration: none;
}
.item:hover { background: var(--panel-2); text-decoration: none; }
.item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.pn { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 30px; letter-spacing: .02em; }
.item.active .pn { color: var(--accent); }
.nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm { font-size: 10.5px; color: var(--muted); opacity: .8; font-variant-numeric: tabular-nums; }
.item.is-read .pn::after { content: "✓"; color: var(--ok); margin-left: 3px; font-size: 10px; }

/* ================= 右侧大纲 ================= */
.toc-title { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding: 0 8px 8px; }
.toc-i {
  display: block; font-size: 12.5px; line-height: 1.5; color: var(--muted);
  padding: 4px 8px; border-left: 2px solid transparent; border-radius: 0 5px 5px 0;
}
.toc-i.lv3 { padding-left: 17px; font-size: 12px; }
.toc-i:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
.toc-i.active { color: var(--accent-text); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* ================= 正文头部 ================= */
.doc-inner { max-width: 880px; }
.doc-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 22px; }
.dh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text);
  font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.dh-lect, .dh-dur { font-size: 12px; color: var(--muted); }
.dh-link { font-size: 12px; margin-left: auto; }
.dh-title { margin: 0 0 6px; font-size: 25px; line-height: 1.35; letter-spacing: -.01em; }
.dh-theme {
  margin: 0; font-size: 13px; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ================= Markdown ================= */
.md-body > *:first-child { margin-top: 0; }
.md-p { margin: 11px 0; }
.md-h { scroll-margin-top: 84px; }
.md-h1 { font-size: 22px; margin: 26px 0 12px; }
.md-h2 {
  font-size: 20px; margin: 34px 0 14px; padding-left: 11px;
  border-left: 4px solid var(--accent); line-height: 1.4;
}
.md-h3 { font-size: 16.5px; margin: 24px 0 10px; color: var(--accent-text); }
.md-h3::before { content: "▍"; opacity: .45; margin-right: 4px; font-size: 13px; }
.md-h4 { font-size: 15px; margin: 18px 0 8px; color: var(--text-2); }
.md-h5, .md-h6 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); }
.md-hr { border: none; border-top: 1px dashed var(--line); margin: 28px 0; }

.md-quote {
  margin: 14px 0; padding: 11px 16px;
  background: var(--panel-2); border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0; color: var(--text-2);
}
.md-quote .md-p { margin: 6px 0; }
.md-quote > *:first-child { margin-top: 0; }
.md-quote > *:last-child { margin-bottom: 0; }
.md-quote .md-quote { background: var(--panel-3); border-left-color: var(--muted); }

.md-list { margin: 10px 0; padding-left: 22px; }
.md-list .md-list { margin: 6px 0; }
.md-li { margin: 5px 0; }
.md-li::marker { color: var(--accent); }
.md-list ol, .md-list ul { padding-left: 20px; }

.md-inline-code {
  background: var(--panel-3); color: var(--code-fg);
  padding: 1.5px 5px; border-radius: 5px;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  word-break: break-word;
}
.md-pre {
  position: relative; margin: 14px 0; padding: 13px 15px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); overflow-x: auto;
}
.md-pre code {
  font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  color: var(--text-2); white-space: pre;
}
.md-pre-lang {
  position: absolute; top: 6px; right: 10px; font-size: 10.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
}

/* 表格 */
.table-wrap {
  margin: 15px 0; overflow-x: auto;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
}
.md-table { width: 100%; border-collapse: collapse; font-size: 13.8px; }
.md-table th {
  background: var(--panel-2); text-align: left; font-weight: 700;
  padding: 9px 12px; border-bottom: 2px solid var(--line); white-space: nowrap;
  position: sticky; top: 0;
}
.md-table td {
  padding: 9px 12px; border-bottom: 1px solid var(--line-2);
  vertical-align: top; line-height: 1.68;
}
.md-table tbody tr:last-child td { border-bottom: none; }
.md-table tbody tr:hover td { background: var(--panel-2); }
.md-table td:first-child { white-space: nowrap; }
.md-table td:first-child:has(> br) { white-space: normal; }

/* 本讲完整目录折叠 */
.toc-toggle {
  display: inline-flex; align-items: center; gap: 7px;
  margin: 6px 0 10px; padding: 6px 13px; cursor: pointer;
  border: 1px dashed var(--line); border-radius: 999px;
  background: var(--panel); color: var(--text-2); font-size: 12.5px;
}
.toc-toggle:hover { border-color: var(--accent); color: var(--accent-text); }
.toc-toggle .chev { transform: rotate(-45deg); }
.toc-toggle.open .chev { transform: rotate(45deg) translate(-1px, -1px); }
.native-toc {
  border-left: 3px solid var(--line); padding-left: 14px; margin-bottom: 22px;
  background: var(--panel-2); border-radius: 0 8px 8px 0; padding: 10px 14px;
}
.native-toc .md-list { columns: 2; column-gap: 22px; }
.native-toc .md-li { break-inside: avoid; font-size: 13px; }

mark.hl { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

/* ================= 翻页 ================= */
#pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; max-width: 880px; }
.pg {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 14px; background: var(--panel); display: block; text-decoration: none;
}
.pg:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
.pg span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.pg b { font-size: 13.5px; color: var(--text); font-weight: 600; }
.pg.next { text-align: right; }
.pg.disabled { border: none; background: none; }

/* ================= 首页 ================= */
body.is-home #toc { display: none; }
body.is-home #layout { grid-template-columns: 292px minmax(0, 1fr); }
.home { max-width: 900px; }
.hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--panel));
  border: 1px solid var(--line); border-radius: 16px;
  padding: 30px 32px; margin-bottom: 26px;
}
.hero h1 { margin: 0 0 8px; font-size: 29px; letter-spacing: -.02em; }
.hero-sub { margin: 0 0 20px; color: var(--text-2); font-size: 14px; }
.stats { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 18px; }
.stat b { display: block; font-size: 24px; line-height: 1.2; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.btn {
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 16px;
  background: var(--panel); color: var(--text); font-size: 13.5px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.hero-src { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.kbd-tips { font-size: 12.5px; color: var(--muted); margin-bottom: 26px; }
kbd {
  display: inline-block; padding: 1px 6px; margin: 0 1px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
  background: var(--panel); font: 11.5px ui-monospace, monospace; color: var(--text-2);
}
.ghome { margin-bottom: 26px; }
.ghome h2 {
  display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 0 0 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.ghome h2 i {
  font-style: normal; font-size: 12px; font-weight: 800; color: var(--accent-text);
  background: var(--accent-soft); border-radius: 6px; padding: 2px 7px;
}
.ghome h2 em { margin-left: auto; font-style: normal; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--panel); font-size: 13px; color: var(--text); text-decoration: none;
}
.chip:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
.chip .cp { font-size: 11px; font-weight: 700; color: var(--accent-text); }
.chip .cd { font-size: 10.5px; color: var(--muted); }
.chip.is-read { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.howto { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text-2); }
.howto li { margin: 6px 0; }

/* ================= 搜索结果面板 ================= */
#results {
  position: fixed; top: var(--header-h); left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 100px);
  overflow-y: auto; z-index: 60;
  background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 14px 14px;
  box-shadow: var(--shadow-lg); padding: 12px 14px 16px;
}
.rs-head { font-size: 12.5px; color: var(--muted); padding: 4px 4px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rs-head b { color: var(--accent-text); font-size: 14px; }
.rs-q { color: var(--text); font-weight: 600; }
.rs-x {
  margin-left: auto; border: none; background: var(--panel-3); color: var(--muted);
  border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
}
.rs-item { border-top: 1px solid var(--line-2); padding: 10px 4px; }
.rs-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); text-decoration: none; }
.rs-title b { font-weight: 600; }
.rs-g { font-size: 11px; color: var(--muted); }
.rs-c { margin-left: auto; font-size: 11px; color: var(--accent-text); font-weight: 700; }
.rs-snips { margin: 6px 0 0 4px; }
.rs-snip {
  font-size: 12.5px; color: var(--text-2); line-height: 1.6;
  padding: 5px 10px; margin: 4px 0; cursor: pointer;
  background: var(--panel-2); border-left: 2px solid var(--line); border-radius: 0 6px 6px 0;
}
.rs-snip:hover { background: var(--accent-soft); border-left-color: var(--accent); }
.rs-empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13.5px; }

/* ================= 响应式 ================= */
@media (max-width: 1280px) {
  #layout { grid-template-columns: 276px minmax(0, 1fr); }
  #toc { display: none; }
  body.is-home #layout { grid-template-columns: 276px minmax(0, 1fr); }
}
@media (max-width: 900px) {
  #layout, body.is-home #layout { grid-template-columns: minmax(0, 1fr); }
  #sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: 282px; z-index: 55;
    transform: translateX(-104%); transition: transform .22s; box-shadow: var(--shadow-lg);
  }
  body.drawer #sidebar { transform: none; }
  #btnMenu { display: inline-block; }
  #main { padding: 20px 18px 60px; }
  .native-toc .md-list { columns: 1; }
  .dh-title { font-size: 21px; }
  #brand .brand-txt { display: none; }
}

/* ================= 打印 ================= */
@media print {
  #topbar, #sidebar, #toc, #pager, #results, .toc-toggle { display: none !important; }
  #layout { display: block; }
  #main { padding: 0; }
  body { background: #fff; font-size: 12px; }
  .table-wrap { break-inside: avoid; border-color: #ccc; }
  .md-table th { position: static; }
  .md-h2 { break-after: avoid; }
  a { color: #000; }
}

</style>
</head>
<body>

<header id="topbar">
  <button id="btnMenu" title="目录">☰</button>
  <div id="brand">
    <div class="logo">库</div>
    <div class="brand-txt"><b id="brandTitle">知识库</b><span id="brandSub"></span></div>
  </div>
  <div class="searchbox">
    <input id="q" placeholder="搜索全部笔记…  按 / 或 Ctrl+K" autocomplete="off" spellcheck="false">
    <button id="qclear" title="清空">×</button>
  </div>
  <div class="topbtns">
    <button id="btnHome" title="返回总览">总览</button>
    <button id="btnExpand" title="展开 / 收起全部模块">展开目录</button>
    <button id="btnPrint" title="打印 / 导出 PDF">打印</button>
    <button id="btnTheme" title="切换明暗">深色</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar"><div id="nav"></div></aside>
  <main id="main">
    <article id="doc"></article>
    <div id="pager"></div>
  </main>
  <nav id="toc"><div class="toc-title">本篇目录</div><div id="tocbody"></div></nav>

人生。你的人生就是在博弈。\n\n博弈与人生关系密切，它可以解释我们人生当中的各种关系：朋友、家人、同事，无一不与博弈有关。我们的人生中充满了博弈，即使最小的琐事，往往也能体现出博弈来。举一个最简单的例子：吸烟伤肺，不吸烟却\"伤心\"，烟民是选择抽烟还是不抽烟，这就需要进行权衡；如果这个烟民并非单身贵族，而是有妻子或女友，这种情况下就很有可能形成一个博弈。\n\n这也就是说，博弈者的身边充斥着具有主观能动性的决策者，他们的选择与其他博弈者的选择相互作用、相互影响。这种互动关系，自然会对博弈各方的思维和行动产生重要的影响，有时甚至直接影响其他参与者的决策结果。\n\n### 金句摘录\n\n> 人的一生可以看成是由无数的博弈组成的……最终博弈的结果则会影响我们的人生。你的人生就是在博弈。\n\n> 博弈者的身边充斥着具有主观能动性的决策者，他们的选择与其他博弈者的选择相互作用、相互影响。\n\n---\n\n## 第 0002 集｜你的人生就是在博弈2\n\n### 核心内容\n\n有七个人组成一个小团体共同生活，他们想用非暴力的方式解决吃饭问题——分食一锅粥，但是没有任何容器可以称量，怎么办呢？这样的小事，只要善于运用博弈论，就非常好解决了。他们试验了这样一些方法。\n\n方法一：拟定一人负责分粥事宜。很快大家就发现这个人为自己分的粥最多，于是换了人，结果总是主持分粥的人碗里的粥最多最好。结论是：权力导致腐败，绝对的权利导致绝对的腐败（音）。\n\n方法二：大家轮流主持分粥，每人一天。虽然看起来平等了，但是每个人在一周中只有一天吃得饱且有剩余，其余六天都饥饿难耐。结论是：资源浪费。\n\n方法三：选举一位品德尚属上乘的人，还能维持基本公平；但不久，他就开始为自己和溜须拍马的人多分。结论是：毕竟人不是神。\n\n方法四：选举一个分粥委员会和一个监督委员会，形成监督和制约。公平基本做到了，可是由于监督委员会经常提出多种议案，分粥委员会又据理力争，等粥分完早就凉了。结论是：效率太低。\n\n方法五：每人轮流值日分粥，但是分粥的人最后一个领粥。结果每次七只碗里的粥都是一样多，就像科学仪器量过的一样。\n\n怎么样以博弈论解决喝粥问题？最后大家都高高兴兴地喝粥，这就是博弈论在人生中的妙用。\n\n### 金句摘录\n\n> 权力导致腐败，绝对的权利导致绝对的腐败。\n\n> 每人轮流值日分粥，但是分粥的人最后一个领粥。结果每次七只碗里的粥都是一样多。\n\n---\n\n## 第 0003 集｜博弈是一种生活常识\n\n### 核心内容\n\n每个人都要学用自己的智慧来生活，让自己在社会上活得更加出色，在由博弈组成的人生中赢得更多效用最大化。我们没有办法脱离社会，那么能做的就只有融入社会，做一个强大的社会人。\n\n博弈还是一种生活中的常识。出租车涨价了，打车的人就会掂量一下，还要不要打车呢？听说牛奶要涨价、电费要涨了，排队买奶粉、买电的人是不是就排成了长龙？你去买菜还要货比三家的时候，卖菜的大婶赶紧说：\"还不放心呀，我可是天天都在这儿卖的，大家都知道我的菜最好了。\"于是你也就买了。这些其实都是一些无意识的博弈，它不需要我们故意绞尽脑汁，也不像谈判一样激烈，只是一件很简单很平常的事情。\n\n事实上，这种有利益的争夺正是博弈的目的，也是形成博弈的基础。现代经济学对此有专门的研究，最基本的假设就是经纪人的效用最大化。参与博弈的博弈者正是为了自身效用的最大化而互相争斗，大家就形成了一种对抗的关系，以争取己方的效用最大化。而一定的外部条件又决定了竞争和对抗的具体形式，这就形成了博弈。\n\n### 金句摘录\n\n> 我们没有办法脱离社会，那么能做的就只有融入社会，做一个强大的社会人。\n\n> 这种有利益的争夺正是博弈的目的，也是形成博弈的基础。\n\n---\n\n## 第 0004 集｜博弈为人生作了铺垫1\n\n### 核心内容\n\n每个人从生下来开始，就要为着生存而不断地进行着与人与环境的抗争活动。在活着的几十年里面，如果不和社会上的人、环境联系的话，是活不下去的。因此，每个人都是社会的，也同时和社会进行着博弈。\n\n博弈组成的人生其实是很丰富的，仔细想想自己的人生就会发现，每一种博弈的选择，都给自己的后来做了一定的铺垫。我们每个人都想要一个美好的人生旅程，但我们要记住，只有选择好了，才会让自己更加成功。\n\n首先要学习接受\"无处不在的博弈\"这个观点：不管你怎么去看待这个问题，它都是事实；对于不可改变的事实，我们能做的事情就只有去接受它，客观地看待它，这样才能更客观地做好它。其次就是要认识到博弈的作用，它能为我们带来什么，这个理论的运用使我们的生活发生了什么样的改变。其实博弈原理弄清楚了，作用是很大的。\n\n第一就是能给我们带来信心。春秋战国时期，吴越两国都是当时的小国。吴王夫差把越国打得只剩下5000甲兵，躲在会稽山上，惶惶不可终日。越王勾践被迫向吴国求和，送了一大批的珠宝美玉，最后还被迫亲自和夫人大臣一起去吴国做奴隶，才暂时保住了国家的安危。勾践的忍辱负重，让骄傲的吴王以为勾践屈服了。勾践给夫差当了三年马夫，夫差每次坐车出去，勾践就给他拉马。这样过了两年，夫差认为勾践真心归顺了，他就放勾践回国。\n\n### 金句摘录\n\n> 对于不可改变的事实，我们能做的事情就只有去接受它，客观地看待它，这样才能更客观地做好它。\n\n> 每一种博弈的选择，都给自己的后来做了一定的铺垫。\n\n---\n\n## 第 0005 集｜博弈为人生作了铺垫2\n\n### 核心内容\n\n勾践回到越国后，立志报仇雪耻。他唯恐被眼前的安逸消磨了志气，于是在吃饭的地方挂上一个苦胆，每逢吃饭的时候，就先尝一尝苦味，自己问自己：你忘了会稽的耻辱吗？他还把席子撤去，用柴草当做褥子。这就是后人传颂的卧薪尝胆。\n\n勾践决定要使越国富强起来，他亲自参加耕种，要他的夫人自己织布来鼓励生产。因为越国遭遇近乎亡国的灾难，人口大大减少，他制定出奖励生育的制度。他要文种（音）管理国家大事，要范蠡（音）训练人马，自己虚心听从别人的意见，救济贫苦的百姓。全国的老百姓都巴不得多加一把劲，好让这个受欺压的国家改变成为强国。\n\n经过十年生聚，十年教训，越国重新复兴，最后一举灭掉了骄傲的夫差，成为春秋战国时期的最后一任霸主。这个故事是以弱灭强的典型例子。可以看得出来，暂时的强弱并不能和胜负画上必然的等号。弱小的一方用策略，同样可以战胜对方。所以博弈让我们有信心战胜对手。\n\n### 金句摘录\n\n> 你忘了会稽的耻辱吗？\n\n> 暂时的强弱并不能和胜负画上必然的等号。弱小的一方用策略，同样可以战胜对方。\n\n---\n\n## 第 0006 集｜博弈为人生作了铺垫3\n\n### 核心内容\n\n博弈其实和古人的对弈是相通的，都是双方或者多方的对峙：自己要全面分析自己和他人的实力，获得足够的信息，根据对方的策略做出自己的策略，以求一胜。无独有偶，著名的故事田忌赛马也是这样。田忌经常与齐国诸公子赛马，设重金赌注。孙膑发现他们的马脚力都差不多，可分为上中下三等，于是孙膑对田忌说：\"您只管下大赌注，我能让您取胜。\"田忌相信并答应了他，与齐王和诸公子用千金来赌胜。比赛即将开始，孙膑说：现在用您的下等马对付他们的上等马，拿您的上等马对付他们的中等马，拿您的中等马对付他们的下等马。一场比赛完后，田忌一场不胜而两场胜，最终赢得齐王的千金赌注。\n\n第二，博弈的理论能让我们进行均衡的考虑。均衡的原理是什么呢？就是根据对方的策略，采取对自己最有利的方法。最后的结果往往是双方都没有得到最大的利益，而是双方都得到最坏的结果。像勾践这样的大胜利，在生活中并不多见，这样的事情风险太大，因为作为被逼到绝境的一方，很容易豁出去，想要拼个鱼死网破，最后的结果肯定都不会怎么样。\n\n而且即使是吴越争霸中，也有均衡的对策。试想，当年夫差在会稽山中，为什么要接受勾践的投降？勾践当时有两种选择：如果不接受投降，可以率领最后人马决一死战，那么越国真的就全部毁灭了；接受投降，至少可以暂时争取到喘息的时间。而夫差一方面很贪恋财产，一方面也顾忌着勾践的鱼死网破之争，于是就答应了投降，在均衡的原理上，这是正确的。\n\n### 金句摘录\n\n> 均衡的原理是什么呢？就是根据对方的策略，采取对自己最有利的方法。\n\n> 用您的下等马对付他们的上等马，拿您的上等马对付他们的中等马，拿您的中等马对付他们的下等马。\n\n---\n\n## 第 0007 集｜博弈为人生作了铺垫4\n\n### 核心内容\n\n下面就是著名的囚徒困境。AB两个囚徒，A坦白、B抵赖，B判10年、A判1年；若两人均坦白，则各判5年；若两人均抵赖，则都判两年。A、B面临抉择。显然，最好的策略是双方都抵赖，结果是大家都只被判两年。但是由于两人处于隔离的情况下，无法串供。\n\n按照亚当·斯密的理论，每一个人都是一个理性的经纪人，都会从利己的目的出发进行选择。这两个人都会有这样一个盘算的过程：假如他招了、我不招，得做十年监狱；招了才五年，所以招了划算。假如我招了、他也招，得做五年；他要是不招，我就只做一年，而他会做十年，还是招了划算。综合以上几种情况考虑，不管对方招不招，对自己而言都是招了划算，两个人都会动这样的脑筋。最终两个人都选择了招，结果都被判五年刑期。这样，原本对双方都有利的策略——抵赖、抵赖，各判两年——就不会出现。\n\n在囚徒困境中，博弈双方所形成的局面，在博弈学上有个专有名词叫纳什均衡。\n\n### 金句摘录\n\n> 不管对方招不招，对自己而言都是招了划算。\n\n> 在囚徒困境中，博弈双方所形成的局面，在博弈学上有个专有名词叫纳什均衡。\n\n---\n\n## 第 0008 集｜博弈为人生作了铺垫5\n\n### 核心内容\n\n纳什均衡的定义是这样的：假设有 n 个局中人参与博弈，给定其他人策略的条件下，每个局中人选择自己的最优策略，个人最优策略可能依赖于、也可能不依赖于他人的战略，从而使自己效用最大化。所有局中人的策略构成一个策略组合，纳什均衡指的就是这样一种策略组合，这种策略组合由所有参与人最优策略组成，即在给定别人策略的情况下，没有人有足够理由打破这种均衡。\n\n但是现实中并不是每个人都能遵守纳什均衡的原则，很多时候都是不理性的，纯粹为自己的利益着想，没有全盘去考虑，没想到别人也会为自己采取最有利的措施。所以，每一个理性的博弈者都要学会双赢的策略：在自己全胜的时候也要给对方留下一条出路，保住对方最低限度的利益，在这个基础上，均衡才是长久的。例如，现在的可持续发展道路的提出、和谐社会的建设，都是这个原理。\n\n既然我们每个人每时每刻都在进行着博弈的行为，而一个明确的博弈能给大家带来如此的好处，我们就要很好地利用这个原理，用博弈来创造美好的未来。具体来说，我们都是和个人、社会进行着博弈的行为。如果每个人都只是人人为己的话，就很难形成合作性博弈，在这样的情况下，整个社会的交易分配都面临着严重的不稳定性，而且还反过来阻碍生产和消费；第二就是要有一个合作性竞争的意识——竞争能够提高效率，合作就可以长久，所以恶性竞争只会导致大家的灭亡。\n\n由此就可以看得出来，为什么有一些人在处理事情的时候能够处理得很好，即使看起来吃亏，实际上却不会，而有一些人利欲熏心，却没有得到什么好处。社会是复杂的，但也是简单的，从一些简单事情的处理方法上就可以看出一个人的处事方式。一个成功的人处理任何事情都是很理智的，因此在处理大事件之前，我们要注意自己平时处理小事情的方法，学会博弈的精神，用智慧、用策略给自己的未来打造一个美好的基础。\n\n### 金句摘录\n\n> 每一个理性的博弈者都要学会双赢的策略，在自己全胜的时候也要给对方留下一条出路。\n\n> 竞争能够提高效率，合作就可以长久，所以恶性竞争只会导致大家的灭亡。\n\n---\n\n## 第 0009 集｜小博弈，大智慧1\n\n### 核心内容\n\n小博弈，大智慧。博弈的故事虽然小，但往往给人以很大的启迪，往往能从一个小故事中体味出人生的大道理。人生是一个不断与人合作和竞争的过程，所谓没有永远的朋友，也没有永远的敌人；但有一点是不变的，无论合作还是竞争，每个人都想让自己的利益最大化。我们看看下面这个猎狗捕食公司的发展历程，相信能给你带来不少的启迪。\n\n一条猎狗追逐一只兔子，追了好久也没有追到。牧羊（音）看到此种情景，讥笑猎狗说：\"你居然不如一只兔子跑得快。\"猎狗回答说：\"因为我们两个跑的目的是完全不同的，我仅仅是为了一顿饭而已，它却是为了性命而跑呀。\"这话被猎人听到了，猎人想：猎狗说的对呀，那我要想得到更多的猎物，就得想个好法子。\n\n所以猎人又买来几条猎狗，凡是能够在打猎中捉到兔子的，都可以得到几根骨头，捉不到的就没有饭吃。这一招果然有用，猎狗们纷纷去追兔子，因为谁都想吃到骨头。就这样过了一段时间，问题又出现了：大兔子非常难捉到，小兔子好捉，但捉到大兔子和捉到小兔子得到的骨头差不多。猎狗们善于观察，发现了这个窍门，专门去捉小兔子，逐渐所有的猎狗都知道了这个方法。猎人对猎狗说：\"最近你们捉的兔子越来越小了，为什么？\"猎狗们说：\"反正没有什么大的区别，为什么费那么大的劲去捉那些大的呢？\"\n\n这里猎狗所说的，就是人力资源里的平均主义是不可取的，激励机制要体现出差别来。\n\n### 金句摘录\n\n> 因为我仅仅是为了一顿饭而已，它却是为了性命而跑呀。\n\n> 人力资源里的平均主义是不可取的，激励机制要体现出差别来。\n\n---\n\n## 第 0010 集｜小博弈，大智慧2\n\n### 核心内容\n\n猎狗与猎人的博弈，也为管理提供了借鉴。猎人经过思考后，决定不将分得骨头的数量与是否捉到兔子挂钩，而是采用每过一段时间就统计一次猎狗捉到兔子的总重量的方法，按照重量来评价猎狗，决定其在一段时间内的待遇。于是猎狗们捉到兔子的数量和重量都增加了，猎人很开心。\n\n但在这以后，新问题又出现了：猎狗抓的兔子又少了很多，而且越有经验的猎狗捉兔子的数量下降的就越厉害。于是猎人又去问猎狗。猎狗说：\"我们把最好的时间都奉献给了您，主人。但是我们随着时间的推移会变老，当我们捉不到兔子的时候，您还会给我们骨头吃吗？\"猎狗的担心不无道理。每个人都要为自己的长远发展考虑，一旦丧失工作能力，如果再得不到养老的保障，那么我们的青春和精力也就浪费了。我们不得不为自己考虑，一旦发现唯利是图的老板，我们就只有跳槽了。\n\n猎人经过一番思考之后，分析与汇总了所有猎狗捉到兔子的数量与重量，规定如果捉到的兔子超过一定的数量后，即使捉不到兔子，每顿饭也可以得到一定数量的骨头。猎狗们都很高兴，大家都努力去达到猎人规定的数量。一段时间过后，终于有一些猎狗达到了猎人规定的数量。\n\n### 金句摘录\n\n> 当我们捉不到兔子的时候，您还会给我们骨头吃吗？\n\n> 一旦发现唯利是图的老板，我们就只有跳槽了。\n\n---\n\n## 第 0011 集｜小博弈，大智慧3\n\n### 核心内容\n\n这时，其中一只猎狗说：\"我们这么努力只得到几根骨头，而我们捉的猎物远远超过了这几根骨头，我们为什么不能给自己捉兔子呢？\"于是有些猎狗离开了猎人，自己捉兔子去了。猎人意识到猎狗正在流失，并且那些流失的猎狗像野狗一般和自己的猎狗抢兔子，情况变得越来越糟。\n\n猎人不得已引诱了一条野狗，问他到底野狗比猎狗强在哪里。野狗说：\"猎狗吃的是骨头，吐出来的是肉。\"接着又说，倒也不是所有的野狗都顿顿有肉吃，大部分最后骨头都没得舔，不然也不至于被你诱惑。于是，猎人进行了改革，使得每条猎狗除基本骨头外，还可获得其所猎兔肉总量的百分之 n；而且随着服务时间加长、贡献变大，该比例还可递增，并有权分享猎人收获的总兔肉的百分之 m。就这样，猎狗们与猎人一起努力，将野狗们逼得叫苦连天，野狗纷纷强烈要求重归猎狗队伍。\n\n这样下去，时间越长，兔子越少，猎人们的收成也一天不如一天，而那些服务时间长的老猎狗们，老的不能捉到兔子，但仍然在无忧无虑地享受着那些他们自以为是应得的大份食物。\n\n### 金句摘录\n\n> 我们这么努力只得到几根骨头，而我们捉的猎物远远超过了这几根骨头，我们为什么不能给自己捉兔子呢？\n\n> 猎狗吃的是骨头，吐出来的是肉。\n\n---\n\n## 第 0012 集｜小博弈，大智慧4\n\n### 核心内容\n\n终于有一天，猎人再也不能忍受，把他们赶出了家门，因为猎人更需要身强力壮的猎狗。被赶出的老猎狗们得到了一笔不菲的赔偿金，于是他们成立了猎狗捕食公司。他们采用连锁加盟的方式招募野狗，向野狗们传授猎兔的技巧，从猎得的兔子中抽取一部分作为管理费。当赔偿金几乎全部用于广告后，他们终于有了足够多的野狗加盟，公司开始盈利。一年后，他们收购了猎人的家当。\n\n猎狗捕食公司许诺加盟的野狗能得到公司百分之 n 的股份，这实在是太有诱惑力了。这些自认为是怀才不遇的野狗们都以为找到了知音，终于做了公司的主人了，不用再忍受猎人们呼来唤去的不快，不用再为捉到足够多的兔子而累死累活，也不用眼巴巴地祈求猎人多给两根骨头而显得楚楚可怜。这一切对这些野狗来说，比多吃两根骨头更加受用，于是野狗们拖家带口地加入了猎狗捕食公司。一些在猎人门下的年轻猎狗也开始蠢蠢欲动，甚至很多自以为聪明、实际愚蠢的猎人也想加入，好多同类型的公司雨后春笋般地成立了。一时间，森林里热闹起来。\n\n猎人凭借出售公司的钱走上了老猎狗走过的路，最后千辛万苦要与猎狗捕食公司谈判的时候，老猎狗出人意料地答应了猎人，把猎狗捕食公司卖给了他。老猎狗们从此不再经营公司，转而开始写自传：《老猎狗的一生》，又写了《如何成为出色的猎狗》《如何从一只普通猎狗成为一只管理层的猎狗》《猎狗成功秘诀》《成功猎狗的500条》《穷猎狗，富猎狗》，并将老猎狗的故事搬上屏幕，取名《猎狗花园》，三只老猎狗成了家喻户晓的明星。收版权费没有风险，利润更高。\n\n整个猎狗捕食公司的成立和发展及落幕，虽然是一个小小的寓言故事，其中却蕴含了合作、背叛、合作的生存之道。小小的博弈故事，蕴含着深刻的人生哲理。\n\n### 金句摘录\n\n> 收版权费没有风险，利润更高。\n\n> 其中却蕴含了合作、背叛、合作的生存之道。\n\n---\n\n## 第 0013 集｜有互动就会有博弈1\n\n### 核心内容\n\n有互动就会有博弈。博弈论是一种游戏理论，其准确的定义是：一些个人、团队或其他组织面对一定的环境条件，在一定的规则约束下，依靠所掌握的信息，同时或先后、一次或多次对各自允许选择的行为或策略进行选择并加以实施，并从中各自取得相应结果或收益的过程。通俗地讲，博弈就是指在游戏中的一种选择策略的研究。\n\n博弈的英文为 game，我们一般将它翻译成游戏，而在西方，game 的意义不同于汉语中的游戏。在英语中，game 即是人们遵循一定规则的活动，进行活动的人的目的是让自己赢。而自己在和对手竞赛或游戏的时候，怎样使自己赢呢？这不但要考虑自己的策略，还要考虑其他人的选择。生活中博弈的案例很多，只要有涉及人群的互动就有博弈。\n\n一天晚上，你参加一个派对，屋里有很多人，你玩的很开心。这时候屋里突然失火，火势很大，无法扑灭。此时你想逃生，你的面前有两个门，左门和右门，你必须在它们之间选择。但问题是，其他人也要争抢这两个门出逃。如果你选择的门是很多人选择的，那么你将因为人多拥挤冲不出去而被烧死。相反，如果你选择的是较少人选择的，那么你将逃生。这里我们不考虑道德因素，你将如何选择？你选择时必须考虑其他人的选择，而其他人在选择时也会考虑你的选择。你的结果，博弈论称之为支付，不仅取决于你的行为选择（博弈论称之为策略选择），同时取决于他人的策略选择。这样你和这群人就构成了一个博弈。\n\n### 金句摘录\n\n> 只要有涉及人群的互动就有博弈。\n\n> 你选择时必须考虑其他人的选择，而其他人在选择时也会考虑你的选择。\n\n---\n\n## 第 0014 集｜有互动就会有博弈2\n\n### 核心内容\n\n博弈是一种选择与结果的互动。博弈涉及的游戏范围甚广：人际关系的互动、球赛或麻将的出招、股市的投资等等，都可以用博弈论巧妙地解释。可以说，红尘俗世莫不博弈。博弈论讨论的就是聪明又自利的局中人如何采取行动，以及如何与对手互动的问题。人生正是由一局又一局的博弈所组成，你我皆在其中，竞相争取高分。\n\n人的一生本身就可以看成是永不停息的决策过程。在决策过程中存在一个共同的因素：你并不是在一个毫无干扰的真空世界里做决定，相反，你的身边充斥着和你一样的决策者，他们的选择与你的选择相互作用、互相影响。\n\n19世纪中期，在美国宾夕法尼亚州已经发现了石油，成千上万人奔向采油区。一时间，宾夕法尼亚土地上井架林立，原油产量飞速上升。克利夫兰的商人们对这一新行当也怦然心动。他们推选年轻有为的经济商洛克菲勒去宾州原油产地亲自调查一下，以便获得直接而可靠的信息。经过一段时间考察，他回到了克利夫兰。他建议商人们不要在原油生产上投资，因为那里的油井已有72座，日产1135桶，而石油需求有限，油市的行情必然下跌，这是盲目开采的必然结果。他告诫说：当别人全部开始进入这一行业时，我们自己的策略选择就是退出。因为利润是有限的，人们全部进入一个行业疯狂争抢一块蛋糕时，在这场博弈里，最理智的选择就是退出。洛克菲勒根据别人的选择，做出了自己在石油问题上退出的决策。果然不出洛克菲勒所料，打先锋的赚不到钱。由于疯狂的钻油，导致油价一跌再跌，每桶原油从当初的20美元暴跌到10美分。那些钻油先锋一个个败下阵来。三年后原油一再暴跌之时，洛克菲勒却认为投资石油的时候到了，这大大出乎一般人的意料。\n\n### 金句摘录\n\n> 当别人全部开始进入这一行业时，我们自己的策略选择就是退出。\n\n> 我们自己的策略选择就是退出……在这场博弈里，最理智的选择就是退出。\n\n---\n\n## 第 0015 集｜有互动就会有博弈3\n\n### 核心内容\n\n此时，洛克菲勒认为别人全都不干石油了，自己的策略选择就是干石油。洛克菲勒总是根据众多商家的策略选择来判断自己的行为选择。洛克菲勒在投资中，已经运用了博弈论。\n\n洛克菲勒与克拉克共同投资4000美元，与一个在炼油厂工作的英国人安德鲁斯合伙，开设了一家炼油厂。安德鲁斯采用一种新技术提炼煤油，使安德鲁斯—克拉克公司迅速发展。后来，洛克菲勒决定放手大干，他的合作者克拉克这时却举棋不定，不敢冒风险。两个人在石油业务的决策上发生了严重分歧，最后不得不分道扬镳。分手后，他把公司改名为洛克菲勒—安德鲁斯公司，满怀希望地干起了他的石油事业。洛克菲勒迅速扩充了他的炼油设备，日产油量增至500桶，年销售额也超出了100万美元。洛克菲勒的公司成了克利夫兰最大的一家炼油公司，并成立了标准石油公司。\n\n1865年，洛克菲勒初进石油业时，克利夫兰有55家炼油厂。到1870年，标准石油公司成立时，只有26家生存下来。1872年底，标准石油公司就控股了26家中的21家。洛克菲勒成了美国十大超级富豪之一。从此以后，洛克菲勒家族成了美国威望最高的家族之一。正是博弈的策略选择成就了洛克菲勒的辉煌，他每一次都能根据别人的选择判断出自己进入的最佳时机，每一次选择对洛克菲勒的事业都是一次极大的推动。\n\n### 金句摘录\n\n> 洛克菲勒总是根据众多商家的策略选择来判断自己的行为选择。\n\n> 正是博弈的策略选择成就了洛克菲勒的辉煌。\n\n---\n\n## 第 0016 集｜博弈是一种竞合游戏1\n\n### 核心内容\n\n博弈是一种竞合游戏。一个博弈并不仅仅是竞争，实际上，竞争中有着潜在合作的种子，合作中有着潜在竞争的种子。合作博弈并不是指合作各方具有合作的意向或态度，而是指在博弈中有一些对博弈各方有约束力的协议或契约，或者说是博弈各方不能公然串通或共谋。\n\n合作博弈最典型的例子是石油输出国组织欧佩克。1960年9月，伊朗、伊拉克、科威特、沙特阿拉伯和委内瑞拉的代表在巴格达开会，决定联合起来共同对付西方石油公司，维护石油收入，欧佩克在这个时候应运而生。欧佩克现在已发展成为亚洲、非洲和拉丁美洲一些主要石油生产国的国际性石油组织。它统一协调各成员国的石油政策，并以石油生产配额制的手段来维护他们各自和共同的利益，把国际石油价格稳定在公平合理的水平上。比如，有些时候为防止石油价格飙升，欧佩克可根据市场形势增加其石油产量；为阻止石油价格下滑，欧佩克则可根据市场形势减少其石油产量。\n\n对于个人来说，从博弈论的角度来看，在人生事业一筹莫展的时候，如何能寻找到一个快速突破困境的办法？首先要寻找一个合理的策略，而这个合理的策略势必要建立在一个牢固的基点之上，才能切实可行。如果在困境之中，有人与你因为同样的原因无法抽身，那么是否能够和这个人一起摆脱不利的处境，在合作的基础上走向双赢呢？《红楼梦》里形容四大家族的时候，用过一个结语叫做\"一荣俱荣，一损俱损\"，就是因为这四个家族你中有我、我中有你，相互之间有利益的合作，也有亲缘关系，所以结成了一个牢固的联盟。\n\n### 金句摘录\n\n> 一个博弈并不仅仅是竞争，实际上，竞争中有着潜在合作的种子，合作中有着潜在竞争的种子。\n\n> 一荣俱荣，一损俱损。\n\n---\n\n## 本篇小结\n\n本组十六集是全书开篇，围绕\"认识博弈\"层层展开。开篇先说明人生由无数博弈组成、博弈是一种日常的生活常识；再用七人分粥、吴越争霸、田忌赛马、囚徒困境与纳什均衡等故事，说明博弈原理能带给人信心，也让人学会做均衡的考虑；接着以猎狗与猎人、猎狗捕食公司的寓言，讲透激励、养老、合作与背叛之间的生存之道；最后阐释\"有互动就会有博弈\"的定义，以及博弈作为\"竞合游戏\"的本质。贯穿始终的核心启发是：接受无处不在的博弈，认识并善用它的作用，学会双赢与合作性竞争，用智慧与策略为自己的未来打好基础。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0001 集｜你的人生就是在博弈1","id":"第-0001-集你的人生就是在博弈1"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0002 集｜你的人生就是在博弈2","id":"第-0002-集你的人生就是在博弈2"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0003 集｜博弈是一种生活常识","id":"第-0003-集博弈是一种生活常识"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0004 集｜博弈为人生作了铺垫1","id":"第-0004-集博弈为人生作了铺垫1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0005 集｜博弈为人生作了铺垫2","id":"第-0005-集博弈为人生作了铺垫2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0006 集｜博弈为人生作了铺垫3","id":"第-0006-集博弈为人生作了铺垫3"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0007 集｜博弈为人生作了铺垫4","id":"第-0007-集博弈为人生作了铺垫4"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0008 集｜博弈为人生作了铺垫5","id":"第-0008-集博弈为人生作了铺垫5"},{"level":3,"text": 竞合游戏2 | 亲缘加利益的合作更牢固；智力游戏是现实的微缩模型。 |\n| 0018 | 博弈是一种竞合游戏3 | 微软过桥智力题，说明策略选择决定胜负。 |\n| 0019 | 博弈是一种竞合游戏4 | 规则约束行为，香农的猜测机器靠隐藏规律取胜。 |\n| 0020 | 懂一点博弈的基本术语1 | 理性假定、参与者与策略空间。 |\n| 0021 | 懂一点博弈的基本术语2 | 博弈结果与均衡，买卖成交就是纳什均衡。 |\n| 0022 | 懂一点博弈的基本术语3 | 纳什均衡的定义与纯策略、混合策略。 |\n| 0023 | 搞清楚博弈的要素1 | 局中人、策略、效用三个要素。 |\n| 0024 | 搞清楚博弈的要素2 | 信息与均衡两个要素。 |\n| 0025 | 为什么会互相背叛1 | 花瓶索赔与饮料采购，退到双输的结局。 |\n| 0026 | 为什么会互相背叛2 | 猜数字实验，个人理性与集体理性的矛盾。 |\n| 0027 | 囚徒困境与懦夫困境1 | 战场逃跑的最佳策略，引出懦夫困境。 |\n| 0028 | 囚徒困境与懦夫困境2 | 古罗马军规与西点军校如何破解懦夫困境。 |\n| 0029 | 巧用囚徒困境降低博弈成本1 | 招投标机制设计让报价回归真实成本。 |\n| 0030 | 巧用囚徒困境降低博弈成本2 | 让员工陷入困境的威逼、利诱与煽风点火。 |\n| 0031 | 巧用囚徒困境降低博弈成本3 | 默契与笨蛋都会失效，小组竞赛更有效。 |\n| 0032 | 利用困境，解决难题1 | 伍子胥用宝珠之说吓退斥候脱险。 |\n\n---\n\n## 第 0017 集｜博弈是一种竞合游戏2\n\n### 核心内容\n\n如果两个同时处在困境中的人，也有这种利益加亲缘的双重关系，他们合作起来就会更加容易，而且形成的合力就会更大。正所谓\"二人同心，其利断金\"，而要做到同心，只有利益上的合作是不够的，还要一种近乎亲情的亲缘关系。显然，这是可遇而不可求的，因为亲缘关系不是能够随便形成的。\n\n智力游戏与博弈相近似的本质，是在确定游戏规则的约束下，游戏参与者决策行动的过程。各种智力游戏实际上就是一个社会的经济、管理、政治等现象抽象出来的微缩模拟模型。在这个意义上，不妨说博弈论就是研究怎么玩好游戏的理论。\n\n游戏是一种抽象。面对复杂现象时，人们经常会只见树木、不见森林，无法抓住某种现象的关键所在；而在游戏中，可以通过抽象出现实生活中的要点，并将干扰因素减至最低，从而轻松地分析问题，并找到合理的解决方法。中国最古老的智力游戏围棋，其最初的功能形态就是模拟战争，围棋包含最多的就是博弈的内涵，特别是战争中的博弈内涵；围棋以获得最大的利益为胜，抽象出战争的本质和目的来研究战争的规律。围棋游戏的规则极其简单，最终以所占地盘大小定胜负。\n\n### 金句摘录\n\n> 二人同心，其利断金。而要做到同心，只有利益上的合作是不够的，还要一种近乎亲情的亲缘关系。\n\n> 博弈论就是研究怎么玩好游戏的理论。\n\n---\n\n## 第 0018 集｜博弈是一种竞合游戏3\n\n### 核心内容\n\n智力游戏可以锻炼人的思维能力，培养人的思维方法。良好的思维方法能使我们从错综复杂的现象中找到事物的本质，从纷繁的因素中找到事物变化的主要原因，使事物呈现出条理性。现在很多世界级公司都已经明白智力游戏的作用。\n\n著名的微软公司在招聘员工时，出过非常儿童化的招聘考题。题目是这样的：某合唱团的四名成员A、B、C、D赶往演出现场，他们中途要经过一座小桥。当他们赶到桥头时，天已经黑了，周围没有灯，他们只有一只手电筒。现在规定一次最多只许两人一起过桥，过桥人手里必须有手电筒，而且手电筒不能用扔的方式传递；四个人的步行速度都不同，若两人同行，则以较慢者的速度为准。A需花1分钟过桥，B过桥需花2分钟，C需花5分钟过桥，D需花10分钟过桥。请问他们能在17分钟内过桥吗？据说，许多跻身世界500强的公司在招聘新员工时，都要出类似的智力题。\n\n思维方法是抽象的，它不像1加1等于2那么简单，只有通过自己的想象、亲自动手操作、经历失败，才能逐步形成。思维科学化程度越高的人，工作中发现问题、解决问题的能力就越强，这一点已成为人们的共识。在许多智力游戏中，都存在这么一个共同的特点，就是参与者所选择的策略对于胜负有着举足轻重的影响。一个游戏的规则一旦定好之后，策略选择的好坏就成了游戏参加者所能自由运用的、左右游戏结果的最关键因素；特别是在围棋、象棋之类参与者的初始条件完全相同的游戏中，策略选择就成了游戏结果的唯一决定因素。\n\n### 金句摘录\n\n> 一个游戏的规则一旦定好之后，策略选择的好坏就成了游戏参加者所能自由运用的、左右游戏结果的最关键因素。\n\n---\n\n## 第 0019 集｜博弈是一种竞合游戏4\n\n### 核心内容\n\n博弈论的策略思维是一种技巧，策略思维从一些基本技巧出发，考虑的是怎样将这些基本技巧最大限度地发挥出来。任何游戏都有自己的规则，事实上，现实中的人类社会自然也是如此，这就是法律、道德和各种成文或不成文的规章制度和惯例等。当然，这些规则也不是一成不变的，它会随着情况的改变和人们的要求不断修正。但是，只要规则存在，这个规则就确定了人们行为的前提条件。\n\n因此，博弈与游戏都有一个重要的共同特征，那就是：这些规则规定游戏参加者可以做什么、不可以做什么，按照什么次序去做，什么时候结束游戏，一旦参与者犯规将受到怎样的惩罚等。游戏者的策略有相互依存的关系，每一个游戏者从游戏中所得结果的好坏，不仅取决于自身的策略选择，同时也取决于其他参加者的策略选择。有时甚至一个坏的策略会给选他的一方带来并不坏的结果，原因是其他方选择了更坏的、利他而不利己的策略。这一点也是游戏与博弈重要的相似之处。\n\n大约40年前，贝尔电话公司实验室中一位天资过人的数学家、也是信息论创始人香农，发明了一个猜测机器来跟真人对决。这个机器成功击败真人，因为人们永远无法隐藏自己的思考模式。这个游戏的最佳策略就是尽可能找出对手行为的规律，自己则随机出招；简单地说，就是一面藏拙（音），一面利用对手的弱点。所以竞赛游戏都是这样：橄榄球运动员尽量混合不同的跑位和传球，机智的棒球投手会以快速球配合变化球来封锁对手的公式，桥牌能手也不会每次都唬人。但请注意，如果每次都在出其不意时使用绝招，这也是一种行为规律。假如双方在玩猜石子游戏时都很成功、不露破绽，那么最后就会打成平手。香农的机器连续赢了好多回，最后才输给一位企业总裁，这位总裁的思考是相当随机的。\n\n### 金句摘录\n\n> 这个游戏的最佳策略就是尽可能找出对手行为的规律，自己则随机出招。\n\n> 如果每次都在出其不意时使用绝招，这也是一种行为规律。\n\n---\n\n## 第 0020 集｜懂一点博弈的基本术语1\n\n### 核心内容\n\n博弈论的研究对象是理性的行动者或参与者如何选择策略、如何做出行动的决定。理性的人是对现实的人的基本假定，即假定参与者努力用自己的推理能力使自己的目标最大化。理性的与道德的不是一回事，理性的与道德的有时会发生冲突，但是理性的人不一定是不道德的。\n\n博弈涉及哪些内容呢？第一，博弈至少涉及两个独立的博弈参与者。每个参与者通过采取行动，努力使自己的效用或利益最大化；但是他的行动的好处或支付的获得，取决于另外的参与者。在买卖的交换行为中，买东西的人要尽量以低的价格买到，但是他是否能买到，取决于卖者是否能卖；卖东西的人尽量想以高的价格将东西卖出去，但价格太高买者不接受，因此卖东西的人能否将物品卖出去，取决于买者。\n\n第二，博弈涉及行动者存在着策略选择的可能。博弈论用策略空间来表示参与者可以选择的策略。赤壁一战，曹兵大败，曹操落荒而逃，在选择是走通往华容道的小路还是选择大路时，他面临着在两个策略之间进行选择；囚徒困境中，小偷面临着不招认还是招认的选择。每个参与者从策略空间中选取他的策略，如果没有选择的可能，理性的人是无法去计算的，对自己的目标也就无能为力。\n\n### 金句摘录\n\n> 理性的人是对现实的人的基本假定，即假定参与者努力用自己的推理能力使自己的目标最大化。\n\n> 博弈论用策略空间来表示参与者可以选择的策略。\n\n---\n\n## 第 0021 集｜懂一点博弈的基本术语2\n\n### 核心内容\n\n第三，对于博弈参与者来说，存在着博弈结果。所谓博弈结果，是参与者最终对策略的选择造成的确定性的支付。如在曹操败走华容道的博弈中，诸葛亮在埋伏大陆（音）与埋伏通往华容道的小路之间进行选择，而曹操在走大路和走通往华容道的小路之间进行选择。在这个博弈中，双方猜测对方的行为，看谁猜得准。博弈的最终结果是，诸葛亮派关羽埋伏在通往华容道的小路，而曹操选择走小路，被诸葛亮抓住，这就是曹操与诸葛亮之间的博弈的结果。\n\n第四，博弈涉及均衡。均衡是经济学中的重要概念，均衡即是平衡的意思，在经济学中，均衡即相关量处于稳定值。在供求关系中，如果在某一商品市场的某一价格下，想以此价格买此商品的人均能买到，而想卖的人均能将商品卖出去，此时我们就说该商品的供求达到了均衡，此时的价格可称之为均衡价格，产量可称之为均衡产量。均衡分析是经济学中的重要分析。那么什么是博弈论的均衡呢？所谓博弈均衡，它是一个稳定的博弈结果。均衡是博弈的一种结果，但不是说博弈的结果都能成为均衡。博弈的均衡是稳定的，因而是可以预测的。\n\n纳什均衡是一种最常见的均衡，它的含义是：在对方策略确定的情况下，每个参与者的策略都是最好的，此时没有人愿意先改变或主动改变自己的策略。在上面的买卖的博弈中，卖出买进是纳什（音）均衡，这个博弈可以解释为什么在现实中讨价还价后买卖就能做成，因为这对双方来说都是最优选择，同时在买卖博弈中，其均衡对双方来说是全局最优的。\n\n### 金句摘录\n\n> 所谓博弈均衡，它是一个稳定的博弈结果……博弈的均衡是稳定的，因而是可以预测的。\n\n> 在对方策略确定的情况下，每个参与者的策略都是最好的，此时没有人愿意先改变或主动改变自己的策略。\n\n---\n\n## 第 0022 集｜懂一点博弈的基本术语3\n\n### 核心内容\n\n第五，重要的均衡——纳什均衡。纳什均衡是博弈分析中的重要概念。1950年，身为研究生的纳什写了一篇论文《论博弈的均衡问题》，该文只有短短一页纸，可就是这短短一页纸，成了博弈论的经典文献。在这篇论文中，纳什给出了博弈均衡的定义，这样的均衡被人们称之为纳什均衡。\n\n什么是纳什均衡呢？简单说，就是一个策略组合中，所有的参与者面临这样一种情况：当其他人不改变策略时，他此时的策略是最好的；也就是说，此时如果他改变策略，他的支付将会降低。在纳什均衡点上，每一个理性的参与者都不会有单独改变策略的冲动。在囚徒困境中，存在唯一的纳什均衡点，即两个囚徒均选择招认，这是一个稳定的结果。\n\n是不是所有的博弈均存在纳什均衡点呢？不一定存在纯策略的纳什均衡点。所谓纯策略，是指参与者在他的策略空间中选择唯一确定的策略，但至少存在一个混合策略平衡点；所谓混合策略，是指参与者采取的不是唯一确定的策略，而是其策略空间上的一种概率分布。这就是纳什于1950年证明了的纳什定理。我国研究纳什均衡的专家谢时宇（音）博士在《纳什均衡论》中用通俗的说法表达了纳什均衡含义：给定你的策略，我的策略是最好的策略；给定我的策略，你的策略也是你最好的策略。也就是说，双方在对方的策略下，自己现有的策略是最好的策略，即此时双方在对方给定的策略下，不愿意调整自己的策略，这里的策略包括混合策略。\n\n诺贝尔经济学奖获得者萨缪尔森有一句幽默的话：你可以将一只鹦鹉训练成经济学家，因为它所需要学习的只有两个词——供给与需求。博弈论专家坎多瑞（音）引申说，要成为现代经济学家，这只鹦鹉必须再多学一个词，这个词就是纳什均衡。由此可见，纳什均衡在现代经济学中的重要地位。\n\n### 金句摘录\n\n> 给定你的策略，我的策略是最好的策略；给定我的策略，你的策略也是你最好的策略。\n\n> 要成为现代经济学家，这只鹦鹉必须再多学一个词，这个词就是纳什均衡。\n\n---\n\n## 第 0023 集｜搞清楚博弈的要素1\n\n### 核心内容\n\n搞清楚博弈的要素。局中人、策略、报酬和信息，规定了一局博弈的游戏规则；均衡是博弈的结果，也是游戏结束的最后结局。博弈由很多因素构成，每个博弈都至少包含五个基本要素。\n\n一、局中人，也可以称之为决策主体，或者叫参与者、博弈者。在一场竞赛或博弈中，每一个有决策权的参与者都成为一个局中人。只有两个局中人的博弈现象称为两人博弈，而多于两个局中人的博弈称为多人博弈。博弈的参与者在游戏里扮演不同的角色。象棋有这样几种角色：老将、相、士、车、马、炮和小卒子，俨然一支军队，每个角色都是一次棋局博弈的局中人。当然比起真实的人生，这个模型过于简单了，但一样可以映射出现实的生活。也正因为人有争强好胜的天性，所以在整个人生中博弈才会无处不在，因为人们时时刻刻都在想着与他人竞争，时时刻刻都把自己摆在一个局中人的角度。从这个意义上讲，人生本身就是一场博弈，而人则永远是博弈中的局中人。\n\n二、策略。在博弈中，有了局中人，就要开始进行策略的选择了。一局博弈中，每个局中人都有可供选择的、实际可行的、完整的行动方案；该方案不是某阶段的行动方案，而是指导整个行动的一个方案。局中人的一个可行的、自始至终筹划全局的行动方案，称为局中人的一个策略。如果在一次博弈中，局中人都只有有限个策略，则称为有限博弈，否则称为无限博弈。由于每个人在人生中都随时扮演着局中人的角色，人生也就随时面对各种选择，所以在人生这场大游戏里，策略的选择也就异常重要，一旦选择不慎，则可能出现整个人生的败局，正所谓\"一招不慎，全盘皆输\"。策略固然能改变我们的人生，但是不要忘了，我们之所以进行策略选择，只有一个目的，那就是为了获得更大的效用。\n\n三、效用。所谓效用，就是所有参与人真正关心的东西，是参与者的收益或支付，我们一般称之为得失。每个局中人在一局博弈结束时的得失，不仅与该局中人自身所选择的策略有关，而且与全局中人所取定的一组策略有关。所以，一局博弈结束时，每个局中人的得失是全体局中人所取定的一组策略的函数，通常称为支付函数。每个人都有自己的支付函数，整个人生中的每一步行动，其实人都为自己简单地计算过支付函数中效用的得失，也就是干一件事情值还是不值。\n\n### 金句摘录\n\n> 人生本身就是一场博弈，而人则永远是博弈中的局中人。\n\n> 一招不慎，全盘皆输。\n\n---\n\n## 第 0024 集｜搞清楚博弈的要素2\n\n### 核心内容\n\n四、信息。在博弈中，策略选择是手段，效用是目的，而信息则是根据目的采取某种手段的依据。信息是指局中人在做出决策前所了解的关于得失函数或支付函数的所有知识，包括其他局中人的策略选择给自己带来的收益或损失，以及自己的策略选择给自己带来的收益或损失。在策略选择中，信息自然是最关键的因素，只有掌握了信息，才能准确判断他人和自己的行动。两军对垒，知己知彼者百战不殆；牌桌上出老千的人，总是赢面大一些；公司里的商业秘密绝不能透露，否则可能会给公司带来厄运；一个人如果提前了解了内部信息，则可能会改变他原来的计划。\n\n五、均衡。均衡是一场博弈最终的结果，均衡是所有局中人选取的最佳策略所组成的策略组合。均衡就是平衡的意思。在经济学中，均衡即相关量处于稳定值。在供求关系中，某一商品市场如果在某一价格下，想以此价格买此商品的人均能买到，而想卖的人均能卖出，此时我们就说该商品的供求达到了均衡。所谓纳什均衡，它是一个稳定的博弈结果。\n\n### 金句摘录\n\n> 策略选择是手段，效用是目的，而信息则是根据目的采取某种手段的依据。\n\n> 只有掌握了信息，才能准确判断他人和自己的行动。\n\n---\n\n## 第 0025 集｜为什么会互相背叛1\n\n### 核心内容\n\n谈博弈，就必须从囚徒困境谈起。囚徒困境是我们每个人都会在生活中碰到的，如何解决囚徒困境、如何让博弈的最终利益最大化，值得我们探讨和思考。\n\n为什么会互相背叛？囚徒困境反映了个人理性和集体理性的矛盾。在生活中，不乏有很多囚徒困境的例子。比如有这样一个经典的故事：两个旅行者麦克和约翰从一个出产瓷器的著名旅游胜地回来时，他们各买了一个瓷花瓶；提取行李时发现花瓶被打破了，他们向航空公司索赔。航空公司估计花瓶的价格在80到90元左右，但不知道这两位旅客购买的准确价格，要求两位旅客在100美元以内自己写下花瓶价格。若两人所写的相同，说明他们说了真话，就照他们写的数额赔偿；如果两人所写的不一样，那就认定写得低的旅客讲的是真话，按这个低的价格赔偿，但是对讲真话的旅客奖励2元钱，对讲假话的旅客罚款2元。如果两人都写100元，他们都会获得100元；但是给定约翰写100元，麦克改写99元，则他会获得101元；约翰又想，若麦克写99元，自己写98元比写100元好，因为这样他获得100元，而自己写100元、当麦克写99元时自己却只获97元；而给定约翰写98元，麦克又会写97元。这样最后落得两个人只写1元的境地，双输，这往往就是囚徒困境带来的结果。\n\n再有一个小镇政府有一个为期一年的采购计划，每个月采购一批饮料。如果小镇上的两家饮料公司的报价一致，那么政府就把订单一分为二，否则政府会把更多的订单给报价低的那个公司。显然，这两家公司都报出同样的高价才符合其利益。在这种多次博弈中，他们会联合起来出高价吗？如果会，那么在一年十二次的博弈中，他们会合作几次呢？假如他们开始签订了合约，都报出一个比较高的价位，不过显然最后一次他们不需要遵守合约，因为以后没有采购计划了，违约也不会有什么坏处；如果是这样，倒数第二次也不需要遵守合约，因为不论怎样，倒数第一次都是要违约的，那就不存在是否有惩罚的问题，所以倒推下来，一次合约都不用遵守，两家公司最后可能还是两败俱伤。\n\n### 金句摘录\n\n> 这样最后落得两个人只写1元的境地，双输，这往往就是囚徒困境带来的结果。\n\n> 倒推下来，一次合约都不用遵守，两家公司最后可能还是两败俱伤。\n\n---\n\n## 第 0026 集｜为什么会互相背叛2\n\n### 核心内容\n\n如果你有兴趣，还可以做一个实验：选定几个人，让他们都猜一个数字，必须是1至100的整数。条件是：谁最接近所有实验者所猜数字平均值的1/3，谁就可以得到100块钱。这个时候，每个人都会想，如果一开始其他人都是随机地选择数字，50就会是所有人的猜测，这个时候猜50的1/3，也就是大约17，可能会赢；然而每个人都会猜到17这个数字的时候，大家就会猜17的1/3，也就是6左右；依次类推，这个游戏中的每一个人最终猜测的最小数字，那就是1。\n\n囚徒困境反映了个人理性和集体理性的矛盾。如果甲和乙都选择抵赖、各判刑一年，显然比都选择坦白、各判刑十年好得多。当然，甲和乙可以在被警察抓到之前订立一个攻守同盟，但是这可能不会有用，因为它不构成纳什均衡，没有人有积极性遵守这个协定。因为这种协商并不会影响他们在被审讯的时候所做的决策，虽然有了协议，但乙还是不敢确信甲是否会出卖自己，并且不论甲是否被判（音）协约出卖，对方肯定是有好处的；反过来，甲也是这么想的，所以到最后，他俩还是会同时出卖对方。\n\n### 金句摘录\n\n> 如果一开始其他人都是随机地选择数字，50就会是所有人的猜测……依次类推，这个游戏中的每一个人最终猜测的最小数字，那就是1。\n\n> 因为它不构成纳什均衡，没有人有积极性遵守这个协定。\n\n---\n\n## 第 0027 集｜囚徒困境与懦夫困境1\n\n### 核心内容\n\n囚徒困境与懦夫困境。一旦陷入囚徒困境，任何一方都无法独善其身，即使双方都有合作意愿，也很难达成合作。囚徒困境中，从一个故事的角度，为两个囚徒不能合作而可惜；然而在现实生活中，我们都巴不得他们互相指认，否则罪犯也就逃脱了法律制裁。其实，我们完全可以把囚徒困境作为自己的一种行为策略。\n\n假设你正作为一名士兵，身处战场，在战场上遭到了敌军，如果你不怎么爱国，那么活命是你的最高目标。当战斗打响时，避免成为炮灰的最好办法就是逃跑，让其他人留下来战斗。当然，假如你这边的其他人也跟着逃跑，那么你的逃跑就显得更明智了，因为当敌军打到你们这边时，你一定不希望只剩下自己在战斗。因此，不管其他人怎么做，逃跑都是你所能采取的最佳策略。但是假如你身边的每个人都逃跑，那么你们大概就只有全军覆没了。在这种情况下，类似囚徒困境的懦夫困境就出现了：假如你这边的每个人都逃跑，敌军很容易就能把你们一举擒获并加以歼灭，因此与其每个人都逃跑，不如每个人都留下来更有利。就个人而言，懦弱一点比较有利；就团体而言，勇敢一点对大家都好。\n\n### 金句摘录\n\n> 不管其他人怎么做，逃跑都是你所能采取的最佳策略。\n\n> 就个人而言，懦弱一点比较有利，就团体而言，勇敢一点对大家都好。\n\n---\n\n## 第 0028 集｜囚徒困境与懦夫困境2\n\n### 核心内容\n\n古时部队就有打破这个懦夫困境的方法。在大部分的军队中，假如有士兵在战斗时逃跑，就会被就地正法。因此，退缩就会被处决的压力，反而对士兵更有帮助，因为这等于帮他们破解了懦夫困境。\n\n古罗马有这样的军规：军队排成直线向前推进的时候，任何士兵只要发现自己身边的士兵开始落后，就要立即处死这个临阵脱逃者。为使这个规定更可靠，未能处死临阵脱逃者的士兵也会被判处死刑。这样一来，一个士兵宁可向前冲锋陷阵，也不愿意回头捉拿一个临阵脱逃者，否则就有可能赔上自己的性命。罗马军队这一军规的精神，直到今天仍然存在于西点军校的荣誉准则之中。该校的考试无人监考，作弊属于重大过失，作弊者会被立即开除。不过，由于学生们不愿意告发自己的同学，学校规定：发现作弊而未能及时告发，同样违反荣誉准则，也会被开除。所以，一旦发现有人违反荣誉准则，学生们就会举报，因为他们不想由于自己保持缄默而成为违规者的同伙。\n\n### 金句摘录\n\n> 退缩就会被处决的压力，反而对士兵更有帮助，因为这等于帮他们破解了懦夫困境。\n\n> 一旦发现有人违反荣誉准则，学生们就会举报，因为他们不想由于自己保持缄默而成为违规者的同伙。\n\n---\n\n## 第 0029 集｜巧用囚徒困境降低博弈成本1\n\n### 核心内容\n\n巧用囚徒困境，降低博弈成本。囚徒双方都是从自己的利益去考虑，很多时候采取出卖对方的策略，结果被主导者（囚徒困境中的警察角色）所利用，让双方陷入了困境，可以起到降低成本的作用。\n\n比如现在有一个公开招标，选择网络公司建立政府网的政府项目。某公司是投标者之一。对于这个公司来说，根据过去的经验，能够预算出接手这个项目的真实成本是100万元人民币，然而这个公司并不了解其他竞争对手的真实成本。该公司根据市场行情推断，其他公司的真实成本在50万至150万元之间。从概率的角度去看，在50万至150万元之间的任何一个价格，都有可能是最终的胜利者。我们简化这个问题，假设每个公司的成本只能是50至60万、60至70万、120万到130万、130万到140万、140万到150万这样的整数，总共有10种可能，因此最终获得胜利的公司落在这10种价格区间中的任何一个的概率是1/10。假如这个公司报价90万元，很显然即使胜出，仍然要亏本10万元，看来100万元的报价是底线，低于这个价格的报价对于该公司毫无意义，当然这只是这一机制的理想状态。实际当中，如果价格低于成本，破坏了市场均衡，毫无疑问会影响项目质量，不但损害中标者利益，最终还会损害招标政府自身利益。\n\n自然，从理论上说，该公司投标报价一定要高于100万元。不妨假设报价为120万元，根据这10种价格的概率，其他公司报价低于120万元、该公司失败的概率是5/3；即使开价100万，该公司不能中标的概率也有2/5。当然，开价120万元胜出时，可以赚取20万元利润；而开价100万元时，即使胜出，也仅仅是能够弥补成本而已。由此可见，开出一个较高的价码是该公司的优势策略。每一个投标公司都这么考虑的话，所有公司的报价都会高于实际成本，结果就是所有的开价都被人为抬高。\n\n怎样才能让公司投标报价接近于真实成本呢？问题的关键在于，采用某种激励机制来驱动投标者不说谎。如有这样一种激励方式，就是将合同判给开价最低者，却让他付开价第二低者的价格。这个时候，该公司如果开出的还是120万元的报价，并且是第二低的报价，而另一家公司开出的价格比这个公司要低，比如是低于该公司成本价的90万元，该公司最终的报价120万元，反而成了这个胜出公司的最终项目价码。在这种招投标方式下，任何一个公司的优势策略就是开出一个接近其真实项目成本的价格。按照博弈论的观点具体分析招投标行为，我们还可以发现：就像博弈的参加者独立决策、独立承担后果那样，投标各方也如同分别隔离审问、不准串供，他们相当于处在两难困境中的囚徒，各家只能依据自身实力、期望利润和所掌握的市场信息自主报价、独自承担风险。不难看出，机制设计的关键是如何让每个公司的报价有利于集体选择，并最终达到纳什均衡，这里其实靠的是两个制度安排：第一，阻止公司之间的合作；第二，制定了一套坦白从宽、抗拒从严的奖罚规则。由此可见，在招投标的机制设计中，通过博弈竞争，使中标价接近成本价、达到均衡合理，为招标人节约投资、提高经济效益；通过优胜劣汰，使市场竞争力低下的投标人无力参与竞争而退出市场，让有实力的投标人脱颖而出，使资源达到均衡配置，市场秩序得以规范。\n\n### 金句摘录\n\n> 采用某种激励机制来驱动投标者不说谎……将合同判给开价最低者，却让他付开价第二低者的价格。\n\n> 机制设计的关键是如何让每个公司的报价有利于集体选择，并最终达到纳什均衡。\n\n---\n\n## 第 0030 集｜巧用囚徒困境降低博弈成本2\n\n### 核心内容\n\n再有，假如你是一个事业部门的经理，手下有七八个业务员，有什么好办法让他们拼命干活呢？看完了上面的文字，你一定已经想到了一个好办法：让他们陷入囚徒困境。一旦每个员工都觉得拼命工作、无条件地加班加点是自己的最优选择，老板的日子就舒心了。\n\n让员工们陷入这种困境的方法很多。例如威逼员工，按员工业绩给他们打分评级，告诉他们得分最差的扣工资；利诱，得分最高的给奖金；煽风点火，对小王说：\"小王，你知道我们公司要提拔一批新的管理人员，我是很看好你的。不过你看老张都拖家带口的了，最近还经常干到半夜，也在较着劲儿呢，你现在没有家庭负担，可不能比他落后了，这样我也好在老板那儿给你说好话。\"然后对老张说：\"你看人家小王，天天工作到半夜，没多久业绩已经有声有色了；你可是老员工了，如果业绩还比不上新来的，让我怎么向老板推荐你啊？\"总之，这一套耍下来，如果运用得好，员工应该攀比着加班加点吧。\n\n### 金句摘录\n\n> 一旦每个员工都觉得拼命工作、无条件地加班加点是自己的最优选择，老板的日子就舒心了。\n\n---\n\n## 第 0031 集｜巧用囚徒困境降低博弈成本3\n\n### 核心内容\n\n也不一定，尤其是如果你接管的部门成立已久、员工们都非常熟悉、有一定交情的时候，这套手段就不那么灵验了。工资是按月领的，员工们在进行的是无法预期次数的多次博弈，有理性的员工很快就会发现，听老板的话只会让自己更辛苦。渐渐地，他们就会达成默契，从囚徒困境中摆脱出来，原来什么样还是什么样，能偷懒就偷懒，奖金轮流拿，拿了奖金就要大出血、安抚住其他没拿到奖金的。\n\n这时候你会想到找一个非理性的人来扰乱员工们的默契，于是招聘一个任劳任怨、加班加点的笨蛋到办公室。如果别人不努力，每个月的奖金就都给笨蛋。但这样做还是不见得有成效，因为其他员工会孤立笨蛋，作为对他的惩罚，这就大大增加了笨蛋的博弈成本。用不了多久，笨蛋就会发现：或者加入到其他同事的阵营里去，或者到处树敌，得到的奖金还补偿不了损失，而且失去了大家的帮助，工作很难进行，奖金还是拿不了多久。于是笨蛋开始变得理性，囚徒困境还是没有出现。\n\n让员工去跟不太容易与他们达成默契或合约的人博弈，就可以让他们在囚徒困境中多陷一会儿。比如，让员工以小组的方式相互竞赛，就比对个体的激励更有效一些；甚至可以让自己的部门和处在异地的同性质部门竞争，这样两个部门的人员因为没有在一起相处的机会，是很难达成协议的。\n\n### 金句摘录\n\n> 有理性的员工很快就会发现，听老板的话只会让自己更辛苦。\n\n> 让员工以小组的方式相互竞赛，就比对个体的激励更有效一些。\n\n---\n\n## 第 0032 集｜利用困境，解决难题1\n\n### 核心内容\n\n利用困境，解决难题。应用囚徒困境，除了上述所说的在商业管理上降低成本的作用外，在很多场合还可以起到四两拨千斤的作用，解决棘手的难题。春秋时楚国杰出的军事家伍子胥，性格十分刚强，青少年时期即好文习武、勇而多谋。伍子胥的祖父伍举（音）、父亲伍奢（音）和兄长伍尚（音）都是楚国忠臣。周景王二十三年，楚平王怀疑太子外交诸侯、将入（音）为乱，于是迁怒于太子太傅伍奢，将伍奢和伍尚骗到郢都杀害，伍子胥只身逃往吴国。\n\n在逃亡中，伍子胥在边境上被守关的斥候（音）抓住了。斥候对他说：\"你是逃犯，我必须将你抓去面见楚王。\"伍子胥说：\"楚王确实正在抓我，但是你知道楚王为什么要抓我吗？\"斥候冷冷地说：\"我没必要知道，你是逃犯，我就可以抓你去领功取赏。\"伍子胥从容自若地说：\"不，你需要知道。因为有人跟楚王告密，说我有一颗价值连城的宝珠，楚王一心想得到我的宝珠，可我的宝珠已经丢失了，楚王不相信，以为我在欺骗他，我没有办法了，只好逃跑。\"斥候冷笑说：\"宝珠丢了，至少我还抓住了人，我想楚王还是有打赏的。\"伍子胥摇头说：\"你又错了。现在你抓住了我，还要把我交给楚王，那我会在楚王面前说是你夺去了我的宝珠并吞到肚子里去了；楚王为了得到宝珠，就一定会先把你杀掉，并且还会剖开你的肚子，把你的肠子一寸一寸地剪断来寻找宝珠。这样我活不成，而你会死得更惨。\"斥候信以为真，非常恐惧，觉得没必要以命相搏去换取那一丁点的打赏，于是赶紧把伍子胥放了。伍子胥终于脱险，逃出了楚国。\n\n### 金句摘录\n\n> 这样我活不成，而你会死得更惨。\n\n> 斥候信以为真，非常恐惧，觉得没必要以命相搏去换取那一丁点的打赏，于是赶紧把伍子胥放了。\n\n---\n\n## 本篇小结\n\n本组十六集把博弈论从\"故事\"推进到\"术语与工具\"。前半部分先以智力游戏、围棋和微软过桥题说明：规则约束行为，策略选择决定胜负；接着系统给出博弈的五大基本术语与五大要素——局中人、策略、效用、信息、均衡，并重点讲清了纳什均衡的含义与纯策略、混合策略之别。后半部分围绕囚徒困境展开：用花瓶索赔、饮料采购、猜数字等例子揭示个人理性与集体理性的矛盾，用战场逃跑引出懦夫困境，用招投标机制设计与员工管理展示囚徒困境的\"低成本\"用法，最后以伍子胥借困境化险的典故收束。核心启发是：理解术语与要素，学会利用困境、设计机制，才能在博弈中占据主动。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0017 集｜博弈是一种竞合游戏2","id":"第-0017-集博弈是一种竞合游戏2"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0018 集｜博弈是一种竞合游戏3","id":"第-0018-集博弈是一种竞合游戏3"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0019 集｜博弈是一种竞合游戏4","id":"第-0019-集博弈是一种竞合游戏4"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0020 集｜懂一点博弈的基本术语1","id":"第-0020-集懂一点博弈的基本术语1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0021 集｜懂一点博弈的基本术语2","id":"第-0021-集懂一点博弈的基本术语2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0022 集｜懂一点博弈的基本术语3","id":"第-0022-集懂一点博弈的基本术语3"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0023 集｜搞清楚博弈的要素1",
