2\n> - 第 0044 集 坚持到底才能成为赢家3\n> - 第 0045 集 坚持到底才能成为赢家4\n> - 第 0046 集 信息是博弈的筹码1\n> - 第 0047 集 信息是博弈的筹码2\n> - 第 0048 集 信息的提取和甄别1\n> **时长**：约 41 分钟\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0033 | 利用困境，解决难题2 | 伍子胥脱险收尾；兄弟俩装耳背卖衣服打开销路。 |\n| 0034 | 利用困境，解决难题3 | 费城两家\"死对头\"商店原是一对兄弟演戏。 |\n| 0035 | 面对困境，谨慎为上1 | 乔世荣断钱袋案，自作聪明反坏事。 |\n| 0036 | 面对困境，谨慎为上2 | 教授用\"破的是哪只轮胎\"揭穿学生谎言。 |\n| 0037 | 面对困境，谨慎为上3 | 勇于担责的斯汀因祸得福当上经理。 |\n| 0038 | 走出困境的两种方式1 | 信任是走出困境的第一步：圣诞夜敌我同屋。 |\n| 0039 | 走出困境的两种方式2 | 摒弃自私、相互信任才能共同走出困境。 |\n| 0040 | 走出困境的两种方式3 | 九名矿工八天八夜互助求生。 |\n| 0041 | 走出困境的两种方式4 | 家具厂老板与员工共渡难关，困境考验凝聚力。 |\n| 0042 | 坚持到底才能成为赢家1 | 国美、苏宁争夺大中电器的并购开局。 |\n| 0043 | 坚持到底才能成为赢家2 | 苏宁突然退出，国美以36亿接盘。 |\n| 0044 | 坚持到底才能成为赢家3 | 价格患得患失，苏宁的囚徒困境分析。 |\n| 0045 | 坚持到底才能成为赢家4 | 国美加价20%胜出，放弃者失去主动。 |\n| 0046 | 信息是博弈的筹码1 | 茶碟做猫食碗，信息不对称让猫主人反赚一笔。 |\n| 0047 | 信息是博弈的筹码2 | 掌握信息越多，决策越准，胜算越大。 |\n| 0048 | 信息的提取和甄别1 | 所罗门王以试探提取深层信息断案。 |\n\n---\n\n## 第 0033 集｜利用困境，解决难题2\n\n### 核心内容\n\n面对可能出现的潜在危机，人总是抱着\"宁可信其有，不可信其无\"的态度，以保证自己能够免于陷入困境。由此，伍子胥应用囚徒困境，三言两语就改变了自己的处境。\n\n在西方，同样有聪明者制造囚徒困境的假象，解决了商品销售的难题。话说美国有兄弟俩开了个服装店，由于店的门面不大，哥哥就在外面推销衣服，弟弟在店的另一头负责结账。顾客买衣服的时候都要讨价还价、让来让去。每当顾客和这个哥哥砍价的时候，哥哥就会要顾客去柜台那边结账，而弟弟又得跟哥哥确认这件衣服最后砍到多少钱了，于是弟弟就大声对哥哥喊着问衣服价钱，哥哥就在另一头喊着告诉他。顾客不解，便问他们为什么要这么大声地喊。弟弟说，因为他的耳朵听力不好，所以需要大声问哥哥好几遍。这位顾客在他们互相问价的中间发现，弟弟结账时收的钱都要比哥哥告诉他的要少一些。这位顾客还以为自己捡了个便宜，赶快付完款，卷起衣服就走了，生怕弟弟再问。之后一传十、十传百，兄弟俩耳背卖衣服的事就传开了，好多顾客都到这家店来买衣服，发现还真是这样：每次弟弟结账的时候和哥哥传递的消息总是发生错误，每次价格都比原来听到的低，于是到这家店里买衣服的人是越来越多。\n\n### 金句摘录\n\n> 面对可能出现的潜在危机，人总是抱着宁可信其有，不可信其无的态度，以保证自己能够免于陷入困境。\n\n> 每次弟弟结账的时候和哥哥传递的消息总是发生错误，每次价格都比原来听到的低。\n\n---\n\n## 第 0034 集｜利用困境，解决难题3\n\n### 核心内容\n\n这个经典的假借囚徒困境打开销路的案例，后来被复制和改良，催生出了另外一个经典的案例。费城西区有两个互为敌手的商店——纽约廉价品商店和美国廉价品商店，他们正好紧挨着。两家店的老板是死敌，一直进行着没完没了的价格战。出售爱尔兰亚麻床单，价格又低得可笑，只需6.5美元；当一个店的橱窗里出现这样的手写告示时，每位顾客都会习惯地等另一家廉价品商店的回音。果然大约过了两小时，另一家商店的橱窗里出现了告示，说我的床单质量一流，只需5.95美元。除了贴告示以外，两店的老板还总是站在店外尖声对骂，经常发展到拳脚相加。最后总有一方的老板在这场价格战中停止争斗，价格不断下降，骂对方是疯子，这就意味着对方胜利了。这时围观的路过的还有附近每一个人，都会拥入获胜的廉价品商店，将床单和其他物品抢购一空。这两个店的争吵是最激烈、也是持续时间最长的，因此竟很有名声，住在附近的每个人都从他们的争斗中获益不少，买到了各式各样的精美商品。\n\n突然有一天，一家店的老板死了，几天以后，另一家店的老板声称去外地办货，两家商店都停业了。过了几个星期，两店分别来了新老板，他们对前任老板的财产进行了详细调查。一天，他们发现两家店之间有条秘密通道，并且在两家店的楼上两个老板住过的套房里发现了一扇连接两套房子的门。新老板很奇怪，后来一了解，才知道这两个死对头竟然是兄弟俩。原来所有的诅咒谩骂威胁及一切相互间的人身攻击，全是在演戏；每场价格战都是装出来的，不管谁战胜谁，最后还是把另一位的一切库存商品与自己的一起卖给顾客。真是绝妙的骗局。囚徒困境被如此灵活地应用，是博弈理论在生活中的巨大贡献，值得我们每个人深思。\n\n### 金句摘录\n\n> 原来所有的诅咒谩骂威胁及一切相互间的人身攻击，全是在演戏……真是绝妙的骗局。\n\n> 囚徒困境被如此灵活地应用，是博弈理论在生活中的巨大贡献。\n\n---\n\n## 第 0035 集｜面对困境，谨慎为上1\n\n### 核心内容\n\n面对困境，谨慎为上。庄子有云：善骑者坠于马，善水者溺于水，善饮者醉于酒，善战者莫于沙（音）。古往今来，人们常因为自以为是、自作聪明，付出昂贵的代价。\n\n清朝有一个读书人叫做乔世荣，长得其貌不扬，言行举止也不拘小节，但精通诗书、颇有文采。某年大考中第，到吏部候职时，因无余银上供，所以坐了好久的冷板凳，最终被分发为一小县的七品县令。正当走马上任，在途中碰到了二人在激烈争吵，一问之下才知道：其中一位心地善良的老者捡到一个钱袋，在原地等候失主前来认领；殊不知，那遗失钱袋的年轻人反而一口咬定钱袋装有50两银，而不是现在的10两银。围观的民众也替老者抱不平，但苦无对策还其公道。这时乔县令首先向老者问话：你捡到这钱袋都没离开原地？老者答没有。乔县令又问：可有人见证？围观民众纷纷愿替老者作证。乔县令于是已有定见地说：这就对了，老者捡到的钱袋是装十两银的，那就不是你的五十两银的钱袋；老者拾金不昧，这十两银的钱袋一并赏你；至于年轻人的五十两银钱袋，则由你自己再行寻找吧。这时围观的民众都异口同声称赞乔县令是个好官。\n\n这个故事告诉我们，自作聪明的人往往会因为自己的精明而坏事。上面故事中的年轻人和老者同时陷入了困境，而年轻人自认为谎话说得滴水不漏，却忽略了作为警察（音）角色的乔世荣。事实上，在一个比自己高明很多的人面前，自作聪明是讨不得半点好处的，还不如坦白从宽了。\n\n### 金句摘录\n\n> 善骑者坠于马，善水者溺于水，善饮者醉于酒，善战者莫于沙。\n\n> 在一个比自己高明很多的人面前，自作聪明是讨不得半点好处的，还不如坦白从宽了。\n\n---\n\n## 第 0036 集｜面对困境，谨慎为上2\n\n### 核心内容\n\n我们再来看一个故事，故事中的两位主人公双双陷入了囚徒困境，而制造困境的人，则是他们的教授。两位交往甚密的学生在杜克大学修化学课，两人在小考、实验和期中考中都表现优异，成绩一直是A。在期末考试前的周末，他们非常自信，于是决定去参加弗吉尼亚大学的一场聚会。由于聚会太尽兴，结果周日这天就睡过了头，来不及准备周一上午的化学期末考试。他们没有参加考试，而是向教授撒了个谎，说他们本已从弗吉尼亚大学往回赶，并安排好时间复习准备考试，但途中轮胎爆了，由于没有备用胎，他们只好整夜待在路边等待救援，现在他们实在太累了，请问教授可否允许他们隔天补考。教授想了想，同意了。两人利用周一晚上好好准备了一番，胸有成竹地来参加周二上午的考试。教授安排他们分别在两间教室作答。第一个题目在考卷的第一页占了10分，非常简单，两人都写出了正确答案，心情舒畅地翻到第二页。第二页只有一个问题，占了90分，题目是：请问破的是哪只轮胎？结果，两个学生同时在卷子上乖乖地向教授承认撒谎并检讨。\n\n教授通过制造困境，让两个学生的谎话一下被揭穿。能在杜克大学学习的学生绝非不聪明，只是教授更高明。可以想象，陷入困境的两个学生在做第二页的题目的时候，一定在心里进行了博弈分析，最终选择了相对保险一些的坦白从宽。毕竟如果之前没有协商，两个人选同一只轮胎的可能性太低了。在困境中，坦白从宽不光可以帮你将风险降到最低，有时候甚至可以起到因祸得福的作用，因为困境的出现，更容易让人看到你的品质，对你有更深刻的了解。\n\n### 金句摘录\n\n> 第二页只有一个问题，占了90分，题目是：请问破的是哪只轮胎？\n\n> 在困境中，坦白从宽不光可以帮你将风险降到最低，有时候甚至可以起到因祸得福的作用。\n\n---\n\n## 第 0037 集｜面对困境，谨慎为上3\n\n### 核心内容\n\n斯汀和戴维是快递公司的两名职员，他们俩是工作搭档，工作一直很认真也很卖力，上司对这两名员工很满意。然而一件事却改变了两个人的命运。一次，斯汀和戴维负责把一件很贵重的古董送到码头，上司反复叮嘱他们路上要小心。没想到送货车开到半路却坏了，如果不按规定时间送到，他们要被扣掉一部分奖金。于是斯汀凭着自己的力气大，背起邮件一路小跑，终于在规定的时间赶到了码头。这时戴维说：我来背吧，你去叫货主。他心里暗想，如果客户看到我背着邮件，把这件事告诉老板，说不定会给我加薪呢。他只顾想，当斯汀把邮件递给他的时候，他一下没接住，邮包掉在了地上，哗啦一声，古董碎了。\n\n戴维大喊：你怎么搞的？我没接你就放手。斯汀辩解道：你明明伸出手了，我递给你了，是你没接住。他们都知道，古董打碎了意味着什么，没了工作不说，可能还要背负沉重的债务。果然，老板对他俩进行了十分严厉的批评。戴维趁着司机不注意，偷偷来到老板的办公室，对老板说：老板，不是我的错，是司机不小心。老板平静地说：谢谢你，我知道了。老板把斯汀叫到了办公室，斯汀把事情的原委告诉了老板，最后说：这件事是我们的失职，我愿意承担责任；戴维的家境不太好，他的责任我愿意承担，我一定会弥补我们所造成的损失。\n\n斯汀和戴维一直等待着处理的结果。一天，老板把他们叫到了办公室，对他们说：公司一直对你们俩很器重，想从你们两个当中选择一个人担任客户部经理，没想到出了这样一件事，不过也好，这会让我们更清楚哪一个人是合适的人选。我们决定请斯汀担任公司的客户部经理，因为一个能勇于承担责任的人是值得信任的。戴维从明天开始，你就不用来上班了。老板，为什么？戴维问。其实古董的主人已经看到了你们俩在递接古董时的动作，他跟我说了他看见的事实，还说我看到了问题出现后你们两个人的反应。老板最后说。在这个故事中，戴维和斯汀都不知道老板已经知道事情的真实情况，采取了截然不同的做法：一个自以为是地去责怪别人，推卸本来应该承担的责任；另一个则主动承担责任，体现了极高的个人品质。结果戴维得到了惩罚，而斯汀则因祸得福，成了经理。\n\n### 金句摘录\n\n> 一个能勇于承担责任的人是值得信任的。\n\n> 戴维得到了惩罚，而斯汀则因祸得福，成了经理。\n\n---\n\n## 第 0038 集｜走出困境的两种方式1\n\n### 核心内容\n\n走出困境的两种方式。在生活中，囚徒困境可能会随时发生在我们身上，所以如何走出囚徒困境是一个很现实的问题。由于博弈的双方都想取得一个令自己满意的结果，所以在可以合作的时候，首先应该要保证自己对对方充满信任是非常重要的。并除（音）猜疑的想法，建立起一个相互信任的气氛，可以极大地帮助人们走出困境。\n\n有一个故事：1944年的圣诞节，两个迷了路的美国大兵拖着一个受了伤的兄弟，在风雪中敲响了亚尔丁森林中一栋小木屋的门。它的主人，一个善良的德国女人，轻轻地打开了门。家的温暖，在一瞬间拥抱了又冷又饿的美国大兵。女主人开始有条不紊地准备圣诞晚餐，没有丝毫的慌乱与不安，或是警惕与敌意，因为她相信自己的直觉——他们只是战场上的敌人，而不是生活中的坏人。美国大兵静静地坐在炉边烤火，除了燃烧的木柴偶尔发出一两声脆响外，静得几乎可以听见雪花落地的声音。正在这时候，门又一次被敲响了，站在满心欢喜的女主人面前的，不是来送礼物和祝福的圣诞老人，而是四个同样疲惫不堪的德国士兵。女主人同样用西方人特有的方式告诉她的同胞：这里有几位特殊的客人。今夜，在这栋弥漫着圣诞气息的小木屋里，要么发生一场屠杀，要么一起享用一顿可口的晚餐。在女主人的授意下，德国士兵们垂下枪口，鱼贯进入小木屋，并且顺从地把枪放在墙角。于是，1944年的圣诞烛火，见证了或许是二战史上最为奇特的一幕：一名德国士兵慢慢蹲下身去，开始为一名年轻的美国士兵检查腿上的伤口，然后扭过去向自己的上司急速地诉说着什么。人性中善良温情的一面，决定了他们的相处是奇妙而美好的，没有人担心对方会把自己变成邀功请赏的俘虏。\n\n### 金句摘录\n\n> 在可以合作的时候，首先应该要保证自己对对方充满信任是非常重要的。\n\n> 他们只是战场上的敌人，而不是生活中的坏人。\n\n---\n\n## 第 0039 集｜走出困境的两种方式2\n\n### 核心内容\n\n第二天，睡梦中醒来的士兵们在同一张地图上指点着，寻找着回到己方阵地的最佳路线，然后握手告别，沿着相反的方向消失在白茫茫的林海雪原中。在上面这个故事中，美国士兵和德国士兵可以说是战场上的死敌，但是由于受到客观条件的影响，共同陷入了困境。庆幸的是，他们和女主人一起建立了一种和谐的相处关系，并最终一同走出了困境，令人称奇。试想一下，如果在这个困境中有一方产生了不和谐的想法，势必会引发杀戮，结果必然是两败俱伤。所以保持这种和谐信任的关系，是双方的明智之举。\n\n而这种关系必须依赖相互信任的态度。如果想共同走出困境，人们还应该摒弃自私的心理，共同合作，达到利益的最大化。\n\n### 金句摘录\n\n> 试想一下，如果在这个困境中有一方产生了不和谐的想法，势必会引发杀戮，结果必然是两败俱伤。\n\n> 如果想共同走出困境，人们还应该摒弃自私的心理，共同合作，达到利益的最大化。\n\n---\n\n## 第 0040 集｜走出困境的两种方式3\n\n### 核心内容\n\n一座煤矿在凌晨突然停电，9名矿工被迫停止作业，他们只得在漆黑的深井中等待。片刻后，他们等来的不是光明，而是比停电更可怕的泥石流，汹涌而至的泥石流轰隆隆涌向他们。本能的求生欲望驱使他们拼命往主巷道跑。慌乱中，一名矿工不小心被矿车夹住、不能动弹，另一名矿工陷入一个泥坑。黑暗的矿道里，七名矿工停止了奔跑，异口同声地说：不能再跑了，救人要紧。他们使劲儿把两名同伴拽了出来，躲过了死神的第一劫。在离主巷道50米处，他们又开始了与死神的第二次较量。泥石流滚滚向前，随时有淹没他们的可能；跑了一段时间后，他们齐心协力，用煤块、石块和矿车垒起一道厚厚的墙，阻挡泥石流，然后趁机后退。退到主巷道110米处，他们找到了通风巷和氧气源。\n\n很显然，在这种极度危险的处境下，光有氧气远远解救不了他们，吃喝是最大的生存问题。矿井中没有任何食物，他们同时想到了吃树皮。一个年长的矿工决定分成三组，按时间轮流到不远处扒柳木矿桩的树皮。第一次，几个矿工扒来的树皮，他们吃了两天；第二次，两个矿工使出浑身力气扒回了六根矿柱，然后扒下树皮让大家吃。光吃树皮没有水，饥饿和黑暗像猛兽一样威胁着他们，他们的身体越来越虚弱。一个年轻的矿工冒着危险，在通风巷附近找到了一个足够可以让他们喝很长时间的水坑。喝水时，他们并没有只顾及自己：扒树皮用的力气较大，年轻的矿工扒树皮给年长的吃，年长的用矿帽舀来水让年轻的喝。在漫长的黑暗中，有人困顿泄气了，年长的矿工就会给他们讲自己一生当中遭受的磨难，他说：我一生当中经历了多次比这更危险的大风大浪，现在我不是挺过来了吗？人生的道路还很长，眼前的危险算得了什么，再坚持坚持，肯定会有人来救我们的，只要有一线希望，我们就绝不能放弃。长者的鼓励使那些虚弱的矿工信心陡增，他们又开始了新的抗争。就在他们在黑暗中与死神较劲的同时，外边的营救人员争分夺秒地动用一切力量营救他们。8天8夜后，他们得救了，他们终于创造了生命的奇迹。\n\n矿工之所以能够走出困境，是因为相互之间无私的帮助：当有人被卡住时，他们会冒着生命危险停下来帮助；当面对有限的生存资源时，他们没有争抢，合理分配；当体力衰竭时，他们会相互扶持、相互鼓励。最终走出困境的不光是他们自己，更是他们那种无私的相互帮助的精神。这个故事还提醒我们，如果一个团队能够在面对困境时相互鼓励、互相帮助、毫无私心的话，那么这将是一个无比强大的团队，他们一定会迎来胜利的曙光。\n\n### 金句摘录\n\n> 只要有一线希望，我们就绝不能放弃。\n\n> 如果一个团队能够在面对困境时相互鼓励、互相帮助、毫无私心的话，那么这将是一个无比强大的团队。\n\n---\n\n## 第 0041 集｜走出困境的两种方式4\n\n### 核心内容\n\n有这样一个真实发生在企业里的故事。一个南方做家具生意的老板，在创业之初，公司曾一度面临破产。当时他借钱来给员工发工资，因为他知道员工来公司上班是为了养家糊口，拿不到工资，生活就会陷入困境。员工得知这个消息的时候，非常感动。又过了一个月，情况并没有好转，老板痛心地召集来所有的员工，对他们说：对不起，公司的资金出现了周转困难。现在如果有人想辞职，我会立刻批准，但要在平时我会挽留；如今我已经没有理由挽留大家了，我会发给大家最后一个月的薪水，在你们找到新的工作之前，这些钱可能还够用。老板，我不走，我不能在这个时候离开。一个员工说。老板，我们一定会战胜困难的。另一个员工说。是的，我们不会走的。很多员工都这样说。没有一个员工离开公司，老板感动得痛哭流涕。这些员工心里明白，此时大家离开这个公司就会彻底完蛋，老板还会因为借钱发工资而欠下不少的债务，而再坚持一下或许还能看到转机。最后，他们真的迎来了转机，老板带领着员工们动用了自己所有的力量，业务一天比一天好起来，终于扭亏为盈，让公司走出了困境。\n\n对于任何团队来说，困境是考察其凝聚力的最有效途径，也正是困境让好团队和差团队区别开来：那些卓越的、团结一心的团队在走出困境之后很容易大展宏图，共同分享胜利的果实；而各有私心的差团队在困境的考验中很容易分崩离析，被社会所淘汰。\n\n### 金句摘录\n\n> 困境是考察其凝聚力的最有效途径，也正是困境让好团队和差团队区别开来。\n\n> 那些卓越的、团结一心的团队在走出困境之后很容易大展宏图，共同分享胜利的果实。\n\n---\n\n## 第 0042 集｜坚持到底才能成为赢家1\n\n### 核心内容\n\n坚持到底，才能成为赢家。在我们的生活中，竞争无处不在。在竞争之下，企业难免会陷入囚徒困境，只不过在这场博弈中，谁放弃谁将会失去主动，坚持到底才是占优的策略。\n\n2007年底的一场并购之争，博弈的一方国美电器成功地收购了大中电器，在并购战中彻底战胜了老对手苏宁电器，或许这次博弈能够给我们一些启发。2007年12月20日，由国美集团副总裁穆桂先（音）领衔的新大中管理团队亮相，正式宣告家电北京连锁市场三足鼎立时代的结束，进入全面国美苏宁争霸时代。苏宁与大中最早接触是在2006年7月25日，国美并购永乐时，张大中不堪被永乐暗算而转而结盟苏宁，表示希望在合适的时机择优而合。2007年4月11日，苏宁发布公告称，公司委托了第三方财务顾问，与大中电器就行业发展、双方合作事项进行了沟通与交流。至11月底，苏宁30亿元收购大中的计划似乎逐渐明朗，苏宁接管了大中电器北京以外的门店，苏宁人员开始进入大中电器北京主要门店，并开始安装苏宁独有的销售终端POS机和监视器。大中北京分公司总经理已向员工传达，收购后不会有裁员和降薪之举，一切显示收购似乎指日可待。然而，事情从2007年12月11日开始起了变化。12月11日，苏宁在北京召开\"打响2007年收官五大战役\"记者见面会，大中方面通过各种渠道向记者打听会议的内容；会上，苏宁华北区执行总裁范志军回避了有关苏宁收购大中的问题，而是强调苏宁通州梨园3C旗舰店将于12月15日开业。\n\n### 金句摘录\n\n> 在竞争之下，企业难免会陷入囚徒困境，只不过在这场博弈中，谁放弃谁将会失去主动，坚持到底才是占优的策略。\n\n---\n\n## 第 0043 集｜坚持到底才能成为赢家2\n\n### 核心内容\n\n12月12日下午，苏宁突然将已安装在大中电器门店的POS机和监视器拆除卸走，苏宁人员同时撤出。晚上9点，苏宁发布公告，宣布退出大中并购。正当人们还没从苏宁为何放弃大中的疑问中缓过神来时，第二天，12月13日，国美即发布公告，参与并购大中；12月14日22时58分，国美发布公告，宣布借助第三方收购大中，并在当天就划拨出36亿元人民币。\n\n苏宁在公告中解释，之所以退出对大中的收购，是由于与大中在核心条款上未达成共识，所谓的核心条款就是收购价格。据知情人士透露，在最终的谈判中，张大中放弃了最初的希望能够成为买方的股东之一、继续利用自己的团队品牌和经验让企业发展的想法，而是真正做到全身而退，所以要求收购方必须给出现金，而非通常收购所采用的现金加股票的方式。但即便如此，也不是简单的价高者得。由于苏宁已经与大中进行了近一年的接触，苏宁委托的第三方机构已经对大中内部情况进行了详细的摸底，双方虽然一直没有签订收购合同，但也基本上达成了口头的君子协定。在面对多方买家时，倘若第三方的出价高于苏宁两三亿元，苏宁都具有优先购买权，但倘若第三方出价超出这个范围，大中自然也有选择新的买家的权利。有人质疑，为何苏宁与大中谈了一年多，却迟迟没签协议，最终让国美抢了先机。也许，这正是苏宁缺乏并购经验的表现。对此，知情人士认为，正是由于苏宁与大中接触了一年多、对大中的家底有足够的了解，才会在价格上患得患失，甚至认为在收购价格上还有再商量的余地，这就是一场囚徒困境的博弈。\n\n### 金句摘录\n\n> 正是由于苏宁与大中接触了一年多、对大中的家底有足够的了解，才会在价格上患得患失。\n\n> 这就是一场囚徒困境的博弈。\n\n---\n\n## 第 0044 集｜坚持到底才能成为赢家3\n\n### 核心内容\n\n大中是铁定要卖的，时间拖得越久，价格可能会越低，这恐怕就是苏宁一直不急于出手的原因。虽然苏宁深知，收购大中将成为其进入北京这个重要市场并具备与国美抗衡最难得的也是唯一的机会，而且大中在北京的门店布局与苏宁的重合度在15%左右，与国美的重合度在50%以上，因此苏宁认为由自己收购大中会更有意义。另外一项重情义的苏宁集团董事长张近东手中的另一张牌，就是张大中的情感因素：在国美收购永乐之后，张大中自感被永乐欺骗，加上与国美在北京市场近二十年的竞争，难免存在不少交恶的记录，而苏宁自然而然成为大中的患难之交。\n\n但显然，苏宁低估了国美在资本市场上的运作能力。试想，如果苏宁收购大中，其在北京市场的占有率将超过国美，稳坐第一的位置；卧榻之侧岂容他人酣睡，况且是在国美的大本营北京，以黄光裕的做事风格，是绝对不能忍受的。据知情者透露，在最后关头，黄光裕显示出了志在必得的魄力：无论苏宁出价多少，国美都会加价20%。这个价格超过了苏宁大中君子协定中两三亿元的底线，也超出了苏宁的心理预期，甚至让人觉得，这是大中用来要挟苏宁的砝码。于是苏宁选择了退出。更重要的是，国美没有再给对手任何反复的机会，迅速签下协议并发布公告，即使苏宁有意反悔，也无力回天了。对于苏宁最后的放弃，苏宁电器总裁表示，作为一个上市公司，任何收购都是要为投资者负责的，苏宁不能为了与竞争对手的博弈而放弃这个原则，国美收购大中对苏宁未尝不是一件好事。\n\n### 金句摘录\n\n> 卧榻之侧岂容他人酣睡，况且是在国美的大本营北京。\n\n> 无论苏宁出价多少，国美都会加价20%。\n\n---\n\n## 第 0045 集｜坚持到底才能成为赢家4\n\n### 核心内容\n\n虽然多花了一些钱，但国美大获全胜，在业界赚足了面子。国美出手，谁与争锋，并且巩固了国内连锁业王者的地位。国美电器新闻发言人何阳清（音）认为，在目前已经饱和的连锁家电市场，兼并是一种最好的选择；未来，国美和大中的门店业态将形成差异化，如3C卖场、旗舰店等多种类型，为消费者提供不同的选择。家电资深人士分析，国美收购大中更重要的意义不在于又多了多少店，而是在某种程度上消灭了对手、拦截了对手。\n\n黄光裕又一次表现了自己强悍的本性，与当年和百思买争夺北京宜家旧址一役类似，黄光裕在最后一刻改写了故事的结局。黄光裕一举成功的关键是基于两个判断：一是大中是铁定要卖的，时间拖得越久价格可能会越低，这是苏宁一直不急于出手的原因；二是在最后关头，黄光裕显示出了志在必得的魄力，无论苏宁出价多少，国美都会加价20%。最后，以36亿元总价、6亿元的差价，成功收购大中，让苏宁选择了退出。仔细想想，为什么苏宁会在这场竞争中败下阵来？关键在于它在囚徒困境中放弃了竞争。并购是一场博弈，国美和苏宁就像囚徒困境中的两个囚徒，坚持下去对任何一方都是占优的策略，放弃者将会失去主动。\n\n信息是博弈的筹码。有信息共享时，我们要善于利用；没有信息时，我们要静观其变，以待时机。用得好，信息往往就会成为在博弈中制胜的法宝。\n\n### 金句摘录\n\n> 为什么苏宁会在这场竞争中败下阵来？关键在于它在囚徒困境中放弃了竞争。\n\n> 有信息共享时，我们要善于利用；没有信息时，我们要静观其变，以待时机。\n\n---\n\n## 第 0046 集｜信息是博弈的筹码1\n\n### 核心内容\n\n信息是博弈的筹码。在博弈中，信息的作用是至关重要的。有个做古董生意的人，他发现一个人用珍贵的茶碟做猫食碗，于是假装很喜爱这只猫，要从主人手里买下。古董商出了很大的价钱买了猫之后，古董商装作不在意地说：这个碟子他已经用惯了，就一块送给我吧。猫主人不干了：你知道用这个碟子，我已经卖出多少只猫了？古董商万万没想到，猫主人不但知道，而且利用了他认为对方不知道的错误，大赚了一笔。这就是真正的信息不对称。\n\n信息不对称造成的劣势，几乎是每个人都要面临的困境。那么怎么解决？首先，为了避免这样的困境，我们应该在行动之前尽可能掌握有关信息，人类的知识经验等都是你将来用得着的信息库。华尔街历史上最富有的女人海蒂·格林，是一个典型的葛朗台式（音）的守财奴。她曾为遗失了一张几分钱的邮票而疯狂地寻找数小时，而在这段时间里，她的财富所产生的利息足够同时代的一个美国中产家庭生活一年。为了财富，她会毫不犹豫地牺牲掉所有的亲情和友谊。无疑，在她身上有许多人性中丑陋的东西，但这并不妨碍她成为资本市场中出色的投资者。她说过这样一段话：在决定任何投资前，我会努力去寻找有关这项投资的任何一点信息；赚钱其实并没有多大的窍门，你要做的就是低买高卖，要节俭，要精明，还要持之以恒。这个故事告诉我们，我们并不一定知道未来将会面对什么问题，但是你掌握的信息越多，正确决策的可能就越大。在人生博弈的平台上，你掌握的信息的优劣和多寡，决定了你的胜算。\n\n### 金句摘录\n\n> 猫主人不干了：你知道用这个碟子，我已经卖出多少只猫了？\n\n> 在人生博弈的平台上，你掌握的信息的优劣和多寡，决定了你的胜算。\n\n---\n\n## 第 0047 集｜信息是博弈的筹码2\n\n### 核心内容\n\n有了信息，行为就不会盲目，这一点在商业斗争、军事战争、政治角逐中都表现得十分明显。孙子兵法云：知己知彼，百战不殆。这说明掌握足够的信息对战斗的好处是很大的。在生活的游戏中掌握更多的信息，一般是会有好处的：恋爱你得明白他有何所好，然后才能对症下药、投其所好，不至于吃闭门羹；又比如猜拳行令，如果你了解对方的规律，那你的胜算就会比较大。\n\n信息是否完全，会给博弈带来不同的结果。举一个劫机事件的例子可以说明：假定劫机者的目的是逃走，如果政府在任何时候总是选择把飞机击落，那么将不会有劫机者——这与事实是相符的。在汉武帝时期，法令规定对劫人之（音）者一律格杀勿论。有一次，一个劫匪绑架了小公主，武帝依然下令将劫匪射杀，公主也死于非命，但此后国内一直不再有劫持人质者。所以一个国家要防止犯罪的发生，仅有严厉的刑罚是不够的，还要让人民了解那些刑罚，进行普法教育，因为一个人不知道会面临哪些刑罚，他就不会用那些规则来约束他的行为。在我国，有许多悲剧也正是因为不了解法律而酿成的。从人类诞生以来，人们从来没有像现在这样深刻地意识到信息对于生活的重要影响，也从来没有任何一个时代像现在一样信息如此繁多。这就需要我们时刻准备着，及时掌握各方信息，并用以指导自己的行为。\n\n### 金句摘录\n\n> 知己知彼，百战不殆。\n\n> 仅有严厉的刑罚是不够的，还要让人民了解那些刑罚，进行普法教育。\n\n---\n\n## 第 0048 集｜信息的提取和甄别1\n\n### 核心内容\n\n信息的提取和甄别是博弈中一个关键的问题。在博弈过程中，不但要发出一些影响对方决策的信号，还要尽量获取对方的信息，并对这些信息进行筛选和鉴别。所罗门王断案的故事，恰好说明了这点。所罗门王曾断过一个妇女争孩子的案子，有两个妇女都说孩子是自己的，当地官员无法判断，只好将妇女带到所罗门那里。所罗门稍想了一下，就对手下人说：既然无法判定谁是孩子的母亲，那就用剑将孩子劈成两半，两人各得一半。这时，其中的一个妇女大哭起来，向所罗门请求，她不要孩子了，只求不要伤害孩子；另一个妇女却无动于衷。所罗门哈哈一笑，对那个官员说：现在，你该知道谁是那个孩子真正的母亲了吧？任何一个母亲都不会让别人伤害自己的孩子的。在这个故事里，所罗门并没有把这件事看作一个直截了当的非此即彼的选择，而是深入地思考这个问题，通过恐吓性的试探提取到了情感和心理深处的信息，对事件有了更全面的把握。\n\n而有的信息则不需挖掘，事件本身就在向人们传达着信息，但这样的信息往往真假难辨，需要人们对信息进行甄别。当然，凭常识判断，可以看出一些信息的真假。比如市场上许多良品的商誉都是花不小的代价建立的，有的甚至经过几十年才打造了一个品牌，而消费者对它们也格外信赖；相反，如果建立商誉的成本很小，那么大家都会建立商誉，结果等于谁也没建立商誉，消费者也不领情。在大街上，我们看惯了跳楼价、放血大甩卖、清仓还债、价格特惠等招牌，这也是信息，不过谁相信它是真的呢？但有的信息是可以以假乱真的，这种情况就需要人们仔细甄别，以选出真正的有利信息，就像所罗门那样，挖掘深层次的信息，用于事件的判断。\n\n### 金句摘录\n\n> 通过恐吓性的试探提取到了情感和心理深处的信息，对事件有了更全面的把握。\n\n> 有的信息是可以以假乱真的，这种情况就需要人们仔细甄别，以选出真正的有利信息。\n\n---\n\n## 本篇小结\n\n本组十六集围绕\"困境与信息\"两大主题展开。前半部分讲困境中的应对：先用伍子胥脱险、兄弟店装耳背、费城\"死对头\"演戏等例子说明如何利用困境；再用乔世荣断案、教授\"破的是哪只轮胎\"、斯汀与戴维的担责对比，讲\"面对困境，谨慎为上\"；随后以圣诞夜敌我同屋、九名矿工互助求生、家具厂老板与员工共渡难关等故事，说明信任、无私与合作是走出困境的关键。后半部分以国美收购大中电器的并购战为例，说明坚持到底才是占优策略、放弃者失去主动；进而转入\"信息是博弈的筹码\"，用茶碟养猫、海蒂·格林、劫机与所罗门王断案等例子，讲清信息不对称、信息完全与否、以及信息的提取与甄别。核心启发是：困境中要谨慎、信任与合作，竞争中要坚持，而信息的多寡优劣往往决定胜算。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0033 集｜利用困境，解决难题2","id":"第-0033-集利用困境解决难题2"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0034 集｜利用困境，解决难题3","id":"第-0034-集利用困境解决难题3"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0035 集｜面对困境，谨慎为上1","id":"第-0035-集面对困境谨慎为上1"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0036 集｜面对困境，谨慎为上2","id":"第-0036-集面对困境谨慎为上2"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0037 集｜面对困境，谨慎为上3","id":"第-0037-集面对困境谨慎为上3"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0038 集｜走出困境的两种方式1","id":"第-0038-集走出困境的两种方式1"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0039 集｜走出困境的两种方式2","id":"第-0039-集走出困境的两种方式2"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0040 集｜走出困境的两种方式3","id":"第-0040-集走出困境的两种方式3"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0041 集｜走出困境的两种方式4","id":"第-0041-集走出困境的两种方式4"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0042 集｜坚持到底才能成为赢家1","id":"第-0042-集坚持到底才能成为赢家1"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0043 集｜坚持到底才能成为赢家2","id":"第-0043-集坚持到底才能成为赢家2"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0044 集｜坚持到底才能成为赢家3","id":"第-0044-集坚持到底才能成为赢家3"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0045 集｜坚持到底才能成为赢家4","id":"第-0045-集坚持到底才能成为赢家4"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0046 集｜信息是博弈的筹码1","id":"第-0046-集信息是博弈的筹码1"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0047 集｜信息是博弈的筹码2","id":"第-0047-集信息是博弈的筹码2"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0048 集｜信息的提取和甄别1","id":"第-0048-集信息的提取和甄别1"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]},{"id":"T04","title":"第0049-0064集","full":"每天读点博弈论 · 第 0049–0064 集（信息提取与甄别 · 零和与正和博弈）","lect":"","dur":"46:53","sec":2813,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0049–0064 集（信息提取与甄别 · 零和与正和博弈）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0049–0064 集（① 信息的提取和甄别2 ② 信息的提取和甄别3 ③ 信息的提取和甄别4 ④ 信息的提取和甄别5 ⑤ 信息的提取和甄别6 ⑥ 公共信息下的锦囊妙策1 ⑦ 公共信息下的锦囊妙策2 ⑧ 公共信息下的锦囊妙策3 ⑨ 没有信息时善于等待时机 ⑩ 机会是制胜的关键 ⑪ 有赢有输的零和博弈1 ⑫ 有赢有输的零和博弈2 ⑬ 两败俱伤的负和博弈1 ⑭ 两败俱伤的负和博弈2 ⑮ 两败俱伤的负和博弈3 ⑯ 互利互惠的“正和博弈”1）\n> **时长**：约 42 分钟（315+338+301+284+357+347+306+293 秒）\n> **特别说明**：本组第 0050、0051 两集所举案例涉及近现代政治军事人物与军阀争斗，依内容政策不整理具体人物与情节，仅保留其可迁移的博弈方法要义；其余信息提取、处世心理与商业合作内容照常整理。\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0049 | 信息的提取和甄别2 | 联通因过早泄露降价机密而落败；信息一旦公开，胜负就靠设局用谋。 |\n| 0050 | 信息的提取和甄别3 | 公共信息环境下强攻必两败俱伤，需借力使力、以巧局制胜（案例依内容政策不整理）。 |\n| 0051 | 信息的提取和甄别4 | 好的“局”是多方牵制、层层设防的组合，兼顾施压与给利（案例依内容政策不整理）。 |\n| 0052 | 信息的提取和甄别5 | 周瑜以反间计借蒋干之手除掉蔡瑁、张允，不费一兵而一举两得。 |\n| 0053 | 信息的提取和甄别6 | “将计就计”与曹操“隔岸观火”，是利用虚假公共信息、坐收渔利的高手之作。 |\n| 0054 | 公共信息下的锦囊妙策1 | 信息不对称源于“私有信息”，善用假信息可改变博弈胜负。 |\n| 0055 | 公共信息下的锦囊妙策2 | 借假军情索权：制造假信息是掌控局面的第一步。 |\n| 0056 | 公共信息下的锦囊妙策3 | 靠假信息架空朝廷，说明信息不对称可被用至极处。 |\n| 0057 | 没有信息时善于等待时机 | 没有信息时先隐蔽自己、静观其变，像猎人一样等待后发制人。 |\n| 0058 | 机会是制胜的关键 | 信息就是机会，机会垂青有准备的头脑；要善于发现并抓住它。 |\n| 0059 | 有赢有输的零和博弈1 | 零和博弈一方所得即另一方所失，是利益对抗最高、你死我活的博弈。 |\n| 0060 | 有赢有输的零和博弈2 | 邻里拉琴演成零和对抗，双方都选了最糟糕的方案。 |\n| 0061 | 两败俱伤的负和博弈1 | 负和博弈谁都得不到好处，木匠与画师的人偶之争正是典型。 |\n| 0062 | 两败俱伤的负和博弈2 | 双胞胎姐妹争玩具、扔掉谁都别想要，是家庭里的负和博弈。 |\n| 0063 | 两败俱伤的负和博弈3 | 合伙者见利忘义、设套独吞，最终一把火烧光两败俱伤。 |\n| 0064 | 互利互惠的“正和博弈”1 | 正和博弈即双赢，合作为了更好的竞争，金龙鱼与苏泊尔联合推广即例。 |\n\n---\n\n## 第 0049 集｜信息的提取和甄别2\n\n### 核心内容\n\n商战之中，信息战是一种常用的手段，谁能把关键信息保守到最后一刻，谁就多一分胜算。重庆通信市场曾发生过一起案例：中国联通重庆公司突然在报上刊登广告，宣布次日手机降价。中国电信重庆公司当天下午便获知这一消息，随即商讨对策，当晚就把电信手机的降价方案送到报社，第二天清早，电信的员工和临时雇用的广告派发员便将“电信手机即日降价”的广告发给过往行人。结果电信打了一场漂亮的后发制人的仗。联通之所以失败，就在于没有把谋划已久的降价这一商业秘密保守到真正的最后时刻，从而给对手留下了应对的空隙。\n\n由此引出一个重要话题：当信息是公开的、彼此都知道对方的底细和虚实（即“公共信息”环境）时，就不能指望靠信息差取胜，而需要一些设局之策。正所谓“兵不厌诈”，双方越是知己知彼，就越需要靠计谋来争取胜利。作者指出，所谓公共信息下的锦囊妙策，正是指在信息是公开的情况下，如何通过设计“局”来达到博弈胜利的目的。这一集先以商战案例说明“守住信息”的价值，又为读者铺垫了“信息一旦公开，就要靠设局”的思路。\n\n### 金句摘录\n\n> 联通的失败在于他们没有把谋划已久的降价的商业秘密保守到真正的最后时刻，从而为电信采取行动留下了空隙。\n\n> 所谓兵不厌诈，双方在知己知彼的情况下，就更需要一些计谋来取得胜利。\n\n---\n\n## 第 0050 集｜信息的提取和甄别3\n\n### 核心内容\n\n这一集用一则近现代的政治军事案例来说明：在“公共信息”环境下，双方实力互知，若正面强攻必然两败俱伤，因此需要设计周全的“借力使力”之策，让对手与第三方相互消耗，自己则坐收渔利（即所谓“一石三鸟”“借刀杀人”）。因该案例涉及近现代政治军事人物与军阀争斗，依内容政策不整理具体人物和情节。\n\n就博弈方法而言，本节的要点可以概括为三点：其一，在公共信息环境中，硬碰硬只会两败俱伤，胜负的关键不在于谁掌握的信息更多，而在于谁的“局”设计得更巧；其二，要善于利用对手的欲望与弱点——越是急需、越是贪心的一方，越容易落入圈套，作者特别点出“要地盘心切就会缺乏对诈术的防范”；其三，要把自己置于局外，让矛盾和冲突在对手与第三方之间发生，自己以最小的代价获得最大的收益。作者在案例收尾处评价，这类计策虽属权谋甚至“缺德”，但从实现目标的角度看，只有这样才能创造出“一石多鸟”的机会。他并指出，这种利用公共信息环境、借力使力的招数，在古代的谋略故事中比比皆是，下一集便转入三国时期的经典例子。\n\n### 金句摘录\n\n> 这种利用公共信息环境，利用计谋借力使力的招数，在三国时期比比皆是。\n\n> 如果强攻应战的话，必定会两败俱伤。所以，要想一个周全之策。\n\n---\n\n## 第 0051 集｜信息的提取和甄别4\n\n### 核心内容\n\n本节继续以同一则近现代政治军事案例展开，讲述各方势力的角力与算计，依内容政策不整理具体内容。\n\n从博弈方法上看，其可借鉴之处在于：设计者在实施计策时会做多重防范——例如安排第三方部队堵住对手的退路、并给对方以好处，同时集结重兵形成强大的威慑，使对手在几路压力之下不战自溃。这提示我们，一个好的“局”很少是单一手段，而往往是多方牵制、层层设防的组合：既要给对手以压力，也要给盟友以利益，才能确保局面向预期的方向发展。作者同时提醒，这类计策能少花代价就除掉心腹之患，其谋划确实周全，但其用心刻薄、损人利己，从道德层面并不可取；学习博弈的目的是防人与成事，而不是害人。\n\n因此，本节在方法上留给我们两点借鉴：一是设计谋略要周全、留后手，把各种可能的反应都考虑进去；二是要认清这类“权谋”的边界，在现实中守好道德与规则的底线，不能只学其“术”而丢了“道”。\n\n### 金句摘录\n\n> （本节案例涉及近现代政治军事内容，依内容政策不整理。）\n\n---\n\n## 第 0052 集｜信息的提取和甄别5\n\n### 核心内容\n\n在公共信息环境下借力使力、设计用谋的例子，三国时期比比皆是。曹操率领号称八十三万的大军准备渡过长江、占据南方，孙刘两家联合抗曹，但兵力远少于曹军。曹军多为北方骑兵，善于马战而不善于水战，恰好有两位精通水战的降将蔡瑁、张允可为曹操训练水军，曹操把他们当作宝贝，优待有加。东吴主帅周瑜见对岸曹军水寨排布井井有条、十分在行，心中大惊，暗下决心一定要除掉这两个心腹大患。\n\n曹操一贯爱才，知道周瑜年轻有为、是军事奇才，很想拉拢他。曹营谋士蒋干自称与周瑜曾是同窗好友，愿意过江劝降，曹操当即派他前往。周瑜见蒋干过江，一个反间计便酝酿成熟：他热情款待蒋干，酒席上让众将作陪、炫耀武力，并规定只叙友情、不谈军事，堵住蒋干的嘴；又佯装大醉，约蒋干同帐而眠，故意在桌上留了一封信。蒋干偷看，发现是蔡瑁、张允写来约定与周瑜里应外合、共破曹操的信。此时周瑜说梦话、翻身，吓得蒋干装睡；过了一会儿有人来见周瑜，周瑜故意起身查看蒋干是否睡熟，再与来人低声密谈，蒋干隐约听见提到“蔡张”二字，于是对二人与周瑜里应外合之事确信无疑。他连夜赶回曹营，把周瑜伪造的信件给曹操看，曹操顿时火起，杀了蔡瑁、张允。\n\n这一计不仅显出周瑜的聪明，更显出他“设局”的高明：若不如此，蒋干就会占据主动，周瑜即使不被说服也占不到便宜；用了反间计，不仅没给蒋干当说客的机会，还除掉了两个心腹大患，可谓一举两得。\n\n### 金句摘录\n\n> 曹操把这两个人当做宝贝，优待有加。\n\n> 他采用了这个反间之计，不仅没有给蒋干做说客的机会，还除掉了蔡瑁、张允两个心腹大患，可谓是一举两得。\n\n---\n\n## 第 0053 集｜信息的提取和甄别6\n\n### 核心内容\n\n曹操派蒋干过江，本意是刺探军情、充分了解敌方的信息，结果却正中了周瑜的“计中之计”。这说明：表面上看似曹操掌握了对方的信息，实质上却落入了对方的圈套——这是一种“虚假的公共信息环境”。也就是说，信息本身也可能是被对方刻意制造出来、专门喂给你的。\n\n除了赤壁之战中周瑜的将计就计，曹操“隔岸观火”除掉袁绍之子也属于这种情况。东汉末年，袁绍兵败身亡，几个儿子为争夺权力互相争斗，曹操决定击败袁氏兄弟。袁氏兄弟走投无路，投奔辽东的公孙康。曹营诸将纷纷进言，要一鼓作气平定辽东、捉拿二袁，曹操却安抚众将说：公孙康会把二袁的头送上门来的。于是他率军转回许昌，静观局势。\n\n公孙康听说二袁来降，心中疑虑：袁家父子一向有夺取辽东的野心，如今二袁兵败如丧家之犬，投奔辽东实属迫不得已，收留他们必有后患，而且必然得罪实力强大的曹操；但如果曹操进攻辽东，自己就只能收留二人共同抵御曹操。当他探听到曹操已转回许昌、并无进攻辽东之意时，认定收留二袁有害无益，于是解决二袁，把首级送到曹营。曹操笑着对众将说：公孙康向来惧怕袁氏吞并他，二袁上门必遭猜疑；我们若急于用兵，反而会促成他们合力抗拒；我们退兵，他们就难以结盟。结果果然不出所料。\n\n从曹操与袁氏兄弟的关系可以看出，他们之间正是一种博弈关系：曹操根据公孙康与二袁的利益冲突，采取退兵的策略；公孙康得知曹操无意辽东，便采取杀掉二袁的策略，从而实现自身利益最大化。这种矛盾众所周知，属于公共信息，曹操加以利用，不用出兵便坐山观虎斗，获得了最大收益。\n\n### 金句摘录\n\n> 曹操却安抚众将，公孙康会将二元的头送上门来的。\n\n> 如果我们急于用兵，反会促成他们合力抗拒。我们退兵，他们肯定难以结盟。\n\n> 曹操对此加以利用，不用出兵坐山观虎斗，却获得了最大的收益。\n\n---\n\n## 第 0054 集｜公共信息下的锦囊妙策1\n\n### 核心内容\n\n信息不对称下的制胜之道，与公共信息环境正好相反：当信息不对称时，要善于利用假信息迷惑对方，从而取得对自己有利的地位。生活中很多情形都发生在非公共信息环境之下：人寿保险公司并不真正了解投保人的身体状况，只有投保人自己对自身健康最清楚；求职者向公司投递简历，其真实能力相对而言只有自己最清楚，公司并不完全了解；最常见的例子是买卖双方交易时，商品质量的高低，卖方总比买方更了解。\n\n之所以会出现信息不对称，是因为存在“私有信息”。通俗地讲，私有信息就是某一方所掌握、而对方并不知道的信息。例如商家的产品是否存在严重缺陷，这类信息往往只有接近和熟悉产品的人才能观察到，不熟悉产品的人则无从了解、难以了解。掌握了私有信息的一方，就拥有了主动；而在信息不对称时，善于利用假信息迷惑对方，往往能改变博弈的胜负。作者由此引出“战场上以弱示强”的思路，并以南宋的贾似道作为利用信息不对称而官运亨通的例子，为下文展开埋下伏笔。\n\n### 金句摘录\n\n> 在信息不对称的时候，要善于利用假信息迷惑对方，取得自己的有利地位。\n\n> 所谓私有信息，通俗的讲，就是如果某一方所掌握的信息，对方并不知道，这种信息就是拥有信息一方的私有信息。\n\n---\n\n## 第 0055 集｜公共信息下的锦囊妙策2\n\n### 核心内容\n\n贾似道的权力受到极大限制，他明白再这样下去自己将有灭顶之灾，于是精心设计了一个巨大的圈套。他先弃官隐居，再让亲信吕文德从湖北抗蒙前线假传告急，谎称忽必烈亲率大兵来袭、势不可挡，有直取南宋都城临安之势。宋度宗正想改革弊政、励精图治，不料迎来当头一棒，立刻召集众臣商量出兵抗击之事。谁知满朝文武竟没有一人能提出一言半语的御敌之策，更不用说慷慨领兵出征了。\n\n此时贾似道却隐居临安，悠哉游哉地过着隐士生活。“前线战报”不断传来，说数十万敌军铁骑逼近临安、急需筑垒防御，这一切让度宗心惊肉跳。他不得不想起朝中唯一一位能抗击敌军、曾取得鄂州大捷的英雄——贾似道。无可奈何之下，他只好请皇太后出面，求贾似道出山。谢太后写了手谕，派人恭恭敬敬地送给贾似道。\n\n这么一来，贾似道放心了，索性端起架子：先是搪塞不出，接着又要求度宗大加封赏。度宗无奈，只好授予他节度使的荣誉，尊为太师，加封魏国公，贾似道这才懒洋洋地出来“为国效力”。他心里清楚警报是自己派人假传的，因此做出慷慨赴任、万死不辞、胸有成竹的样子，向度宗要了节钺遗诏，即日出征，令度宗感激涕零，也令百官惶愧不已。天子的节钺仪仗一旦出去就不能返回，除非所奉使命有了结果——这本是皇帝尊严的象征。\n\n### 金句摘录\n\n> 他不得不想起朝廷中唯一的一位能抗击蒙军、取得鄂州大捷的英雄贾似道。\n\n> 他深深的叹了口气，在无可奈何之下，只好以皇太后的面子，请求贾似道出山。\n\n---\n\n## 第 0056 集｜公共信息下的锦囊妙策3\n\n### 核心内容\n\n贾似道出征这天，临安城人山人海，都来看热闹。他为了显示威风，居然借口当日不利于出征，下令让节钺仪仗返回——这真是大涨了贾似道的威风，大灭了度宗的志气。等贾似道到前线逛了一圈、无事而回，度宗和朝臣见不过是一场虚惊，额手称庆尚且不及，哪里还顾得上追查到底是谎报还是实报呢？贾似道出征回来，度宗便把大权交给了他。他还故作姿态，再三辞让、屡次试探要挟，见度宗和谢太后出于真心，才留在朝中。这时满朝文武也争相趋奉，把他比作辅佐成王的周公。\n\n经过这场“考验”，年轻的度宗对朝臣完全失去了信心，他终于“理解”了当年理宗为何要委政于贾似道——原来满朝文武竟无一人可用；贾似道虽然奸佞，但在困难当头之际，只有他还敢于挺身而出。度宗哪里知道，满朝文武的懦弱是假，贾似道的忠勇也是假，他在不知不觉中坠入了贾似道的圈套，从此失去了治理朝政的信心和热情，把大权一推，纵情享乐去了。\n\n贾似道再一次肃清朝堂，在极短的时间内把朝廷上下全换成自己的亲信，甚至连守门的小吏都要查询一遍，赵宋王朝实际上变成了贾氏天下。纵观整个过程，贾似道从头到尾提供的信息都是假的，他利用朝廷与战场之间信息不对称的环境，制造假信息迷惑对方，最终达到了控制朝廷的目的。\n\n### 金句摘录\n\n> 这真是大涨了贾似道的威风，大灭了度宗的志气。\n\n> 度宗哪里知道，满朝文武懦弱是假，忠勇却是假。\n\n> 贾似道从头到尾的信息都是假的，他利用朝廷与战场信息不对称的环境，制造假信息迷惑对方，达到了自己控制朝廷的目的。\n\n---\n\n## 第 0057 集｜没有信息时善于等待时机\n\n### 核心内容\n\n作者指出，在很多情况下，实力和地位与发展并不成正比。这时就需要有效地把自己的实力和意图隐藏起来，静观其变，等待机会。虽然信息对博弈很重要，但没有信息的情况也常有——有道是“蛟龙未遇，潜身于鱼虾之间；君子失时，拱手于小人之下”。有时是时机不成熟，必须像猎人一样耐心潜伏、等待猎物出现；有时则是为了让对手充分表演、彻底暴露他的全部招数，然后再抓住要害，给以致命一击，让他领教后发制人的厉害。\n\n所以，为了有效打击对手，首先要有效地隐蔽自己、保护自己，用假象迷惑敌人，等对方暴露缺点、有机可乘时再一举击破。“害人之心不可有，防人之心不可无”，即使不以打击对方为目的，为了不遭对方打击，也不应天真地把自己的一切暴露无遗，使自己毫无还手余地。因此，善良固然可爱，能在险恶世道中保存这份善良则更为可贵。\n\n北宋时，丁谓任宰相，把持朝政，不许同僚在退朝后留下来单独向皇上奏事，只有王曾非常顺从，从不违背他的意思。一天，王曾对丁谓说：我没有儿子，老来感到孤独，想把亲弟弟的一个儿子过继来传宗接代，想当面祈求皇上恩泽，又不敢在退朝后留下来启奏。丁谓说：那你就照说的去办吧。王曾于是趁机单独拜见皇上，迅速呈上一份奏折，同时揭发了丁谓的行为。丁谓刚走开几步就非常后悔，但为时已晚。没过几天，仁宗上朝，丁谓就被贬到衙州去了。王曾能顺从丁谓的苛求、抓住时机，最终实现了揭发丁谓的目的。善于等待时机，是事业成功和克敌制胜的关键；一个不懂得等待的人，即使能力再强、智商再高，也难以取胜。\n\n### 金句摘录\n\n> 蛟龙未遇，潜身于鱼虾之间。君子失时，拱手于小人之下。\n\n> 害人之心不可有，防人之心不可无。\n\n> 善于等待机会，是事业成功和克敌制胜的关键。\n\n---\n\n## 第 0058 集｜机会是制胜的关键\n\n### 核心内容\n\n信息就是机会，有机会、信息才会在人生的博弈舞台上获得成功。机会是博弈制胜的关键，但机会都是随机的，它总是垂青于有准备的头脑；机不可失，失不再来。对于机会，我们不仅要善于等待，更要善于抓住机会，成就自己的人生。\n\n纽约的基姆·瑞德先生原先从事过沉船寻宝的工作，在遇到那只高尔夫球之前，日子过得很平凡。一天，他偶然看到一颗高尔夫球因为打球者动作失误掉进湖水中，霎时仿佛看到了一个机会。他穿戴好潜水工具，跳进朗伍德洛岭高尔夫球场的湖中，在湖底惊讶地看到白茫茫的一片，足足散落堆积着成千上万只高尔夫球，其中大部分跟新的没什么差别。球场经理知道后，答应以十美分一颗的价格收购。他一天捞了两千多颗，得到的钱相当于他一周的薪水。后来他每天把球捞出湖面带回家，让工人洗净、重新喷漆、再包装，按新球价格的一半出售。再后来，别的潜水员闻风而动，做这行的潜水员多了起来，瑞德干脆从他们手中收购旧球，每颗八美分，每天都有八万到十万颗旧球送到他设在奥兰多的公司。如今他的总收入已达八百多万美元。\n\n对掉入湖中的高尔夫球，别人看到的是失败和沮丧，瑞德却说：我主要是从别人的失误中获得机遇的。当别人都发现这个机会时，他又另辟蹊径，从潜水员手里收购高尔夫球，终于成了一代富翁。很多人都和瑞德一样看到球落水，却没有把它当机会去把握，因为他们缺少发现机会的头脑。在生活中，我们不能等待，要积极寻找并抓住机会；一时的等待，可能造成一生的遗憾。\n\n### 金句摘录\n\n> 机会是博弈制胜的关键。但机会都是随机的，他总是垂青于有准备的头脑。\n\n> 我主要是从别人的失误中获得机遇的。\n\n> 机不可失，失不再来。\n\n---\n\n## 第 0059 集｜有赢有输的零和博弈1\n\n### 核心内容\n\n作者先厘清了几组概念：在博弈中，一方得利必然来自另一方的损失，这叫零和博弈；双方都受损失的博弈叫负和博弈（原文口播作“复合博弈”，即负和之意），更是极不明智；最好的博弈结果应是双赢，即正和博弈。负和博弈与正和博弈都叫非零和博弈。博弈中应力求避免负和结果与零和结果，努力实现共赢。\n\n零和博弈属于非合作博弈，是利益对抗程度最高的博弈，也叫零和游戏。意思是双方博弈，一方得利必然意味着另一方吃亏，一方得利多少，另一方就吃亏多少；之所以称为“零和”，是因为把胜负双方的得与失相加，总数为零。在零和博弈中双方没有合作机会，各方都以自己的最大利益为目标，结果既无法实现集体的最大利益，也无法实现个体的最大利益，甚至可以说是你死我活的博弈。在社会生活各个方面都能发现类似局面：胜利者的光荣背后，往往隐藏着失败者的辛酸和苦涩。从个人到国家、从政治到经济，到处都有零和游戏的影子。\n\n有一群年轻人曾在一家火锅城为朋友过生日。其中一个年轻人拿着自己已经吃过的蛋饺要求更换，由于火锅城规定吃过的东西不能换，遭到拒绝，双方因此发生冲突并打了起来。最后人多势众的火锅城打败了那几个年轻人。可以说博弈的结果是火锅城一方赢了，但从长远看他们并没有赢：这就是人际博弈中的零和博弈，赢方的所得与输方的所失相同，他们的胜利建立在失败方的辛酸和苦涩之上，也必将为此付出代价。消息传出去以后，这家店可能被说成“服务太差劲、店员竟敢打顾客”，口口相传，火锅城必然要流失一部分顾客。\n\n### 金句摘录\n\n> 胜利者的光荣背后，往往隐藏着失败者的辛酸和苦涩。\n\n> 零和博弈是利益对抗程度最高的博弈，甚至可以说是你死我活的博弈。\n\n> 他们的胜利是建立在失败方的辛酸和苦涩上的。那么他们也将为此付出代价。\n\n---\n\n## 第 0060 集｜有赢有输的零和博弈2\n\n### 核心内容\n\n邻里之间也存在博弈，而博弈的结果往往让人难以接受，因为它常常是一种一方吃掉另一方的零和博弈。在一个家属院里住着四五家人，由于平时太忙，邻里之间如同陌生人，各家都关着门过平静的生活。突然有一天，有一家的大人为女儿买了一把小提琴。小女孩没有学过琴，却喜欢每天去拉，而且拉得难听极了；更要命的是，她总挑人们午休的时候拉，弄得整个家属院的人都有意见，矛盾由此产生。\n\n有性格直率的人直接找上门提意见，结果闹了个不欢而散，小女孩依然我行我素。大家私下议论纷纷，有年轻人发狠说：干脆一家买一个铜锣，到午休时一起敲，看谁厉害。几家人一合计竟真这么做了，终于让那个小女孩不再拉提琴。可此后小女孩见了邻居，如同见了仇敌，她一直认为是这些人让她不能再拉小提琴，邻里关系变得更糟。\n\n其实这件事完全可以避免。对小女孩一家来说，至少有三种选择：让女儿去培训班学琴；在被邻居告知后改变拉琴的时间；或者在被告知后不予理会。邻居同样有多种选择：建议对方家长让女孩学些音乐知识；建议她不要在午休时拉琴；或者以其人之道还治其人之身。可惜双方都选择了最糟糕的方案。很多事实证明，参与者在博弈过程中，往往会在不知不觉中基于私利做出最不理智的选择——要么是零和博弈，要么是负和博弈，总之都是非合作性的对抗博弈。\n\n### 金句摘录\n\n> 其实，邻里之间也存在博弈，而博弈的结果往往让人难以接受。\n\n> 很多事实证明，在很多时候，参与者在博弈的过程中，往往都是在不知不觉中基于私利做出最不理智的选择。\n\n---\n\n## 第 0061 集｜两败俱伤的负和博弈1\n\n### 核心内容\n\n负和博弈（原文口播作“复合博弈”）是指博弈中人都得不到好处、都受到损害的博弈，可以说是当事人最不明智的选择。作者用一则古老的故事来引出这一概念：很久以前，北印度有一个技艺高超的木匠，擅长用木头做人偶，所做的“女郎”容貌艳丽、穿戴时尚、活动自如，还能斟茶递酒、招呼客人，与真人无异，唯一不足就是不能说话。南印度则有一位画技了得的画师，所画人物栩栩如生。\n\n一次，画师来到北印度，木匠久闻其大名，想宴请他，于是备好酒菜请画师到家中做客，又让自己做的“木女郎”斟酒端菜，招呼十分周到。画师见这“女子”秀丽娇俏，心生爱恋，木匠看在眼里，却故作不知。酒足饭饱、天色已晚，木匠便回卧室休息，临走时故意把“女郎”留下，对画师说：留下女郎，听你使唤，与你作伴吧。客人非常高兴。等主人走后，画师见“女郎”立在灯下、一脸娇羞，越发可人，便叫她过来，她却一声不吭；画师以为她害羞，上前用手一拉，才发觉竟是木头人。画师又羞又恼：我真是个傻瓜，竟然被木匠愚弄了。\n\n他越想越气，决意报复，便在门口的墙上画了一幅自己的像，衣着与自己一模一样，并画了一条绳子挂在井上，像是上吊死去的样子，又画了一只苍蝇叮在画中人的嘴上。画好后，他便躲到床底下睡觉去了。第二天早上，木匠见画师久久没有出来、门户紧闭、叩门无人应答，便透过门缝向内张望，赫然看到画师“上吊”了。惊恐万分的木匠马上撞开门户，等用力去割绳子时，才发现那不过是一幅画。木匠很是恼火，一气之下打了画师。可以说，这是一个典型的人际负和博弈。\n\n### 金句摘录\n\n> 负和博弈是博弈局中人都得不到好处、受到损害的博弈。可以说，负和博弈是当事人最不明智的选择。\n\n> 如果他们彼此欣赏，而不是彼此戏弄，那么这场争斗也就不会发生了。\n\n---\n\n## 第 0062 集｜两败俱伤的负和博弈2\n\n### 核心内容\n\n从人偶与画师的故事可以看出，负和博弈使双方交锋的结果是都没有所得，或者所得小于所失，其结果是两败俱伤。它只能加大博弈双方的矛盾和抵触，使双方失和；一旦在交际中发生负和博弈，人们往往会因两败俱伤而渐行渐远，甚至反目成仇。\n\n在生活中，兄弟姐妹之间争东西，就很容易形成这种两败俱伤的负和博弈。一对双胞胎姐妹，妈妈给她们买了两个玩具，一个是金发碧眼的芭比娃娃，一个是自动越野玩具车。姐妹俩同时都喜欢芭比娃娃，而都讨厌越野玩具车，一致认为那是男孩子玩的，于是两人都想独占那个可爱的娃娃。姐妹俩互不让步，最后干脆把玩具扔掉，谁都别想得到。这样造成的后果是双方都受到损失，双方的愿望都没有实现，还伤害了姐妹之间的感情。\n\n人只要生活在这个社会中，就离不开与他人的交往，这就形成了一种特定关系——人际关系。从某种角度看，人际关系也是一种利益关系，因为人要追求物质和精神两方面的满足，在这个过程中就会产生相互间的矛盾和冲突，而冲突的结果就是一种博弈关系，负和博弈就是其中的一种。所谓负和博弈，就是指双方冲突和斗争的结果是所得小于所失，也就是通常所说的结果总和为负数，是一种两败俱伤的博弈，双方都有不同程度的损失。\n\n### 金句摘录\n\n> 负和博弈使双方交锋的结果是都没有所得，或者所得到的小于所失去的，其结果还是两败俱伤。\n\n> 负和博弈只能加大博弈双方的矛盾和抵触，使双方失和。\n\n---\n\n## 第 0063 集｜两败俱伤的负和博弈3\n\n### 核心内容\n\n有两类人若各自为战都难以成事，走到一起却可能成就一番事业——但若一方起了歹心，结果往往是两败俱伤。有这样两个人：一个很有钱，却不善于交际；另一个缺少资金，但在人际关系方面很善于沟通，是个交际能手。一天两人相遇，聊得相当投机，颇有相见恨晚之感，于是决定合伙做生意：有钱的人出资金，善于交际的人疏通关系。经过共同努力，他们的生意红火，事业越做越大。\n\n此时，那个善于交际的人起了歹心，想独吞生意，便向出资人提出：把合伙时的资金还给他，这份生意就算他一个人的了。出资人当然不愿意，双方开始了长时间的僵持，矛盾越来越尖锐，最后只能诉诸法院。然而，那个交际能手在两人开始做生意时就已给对方下了套：登记注册时只注册了自己一个人的名字。虽然出资人是原告，却因为对方早就设好陷阱，最终输了官司，眼睁睁看着对方独吞生意而无能为力。\n\n出资人一怒之下，把对方的货物全烧了。结果，两个人谁也没捞到好处。这个事例就是典型的负和博弈。因此，处理人际关系一定要本着“为人利就是为己利”的态度：见利忘义，常常会导致两败俱伤的负面结果。\n\n### 金句摘录\n\n> 对于人际关系，我们一定要本着为人利就是为己利的态度。见利忘义常常导致负面结果。\n\n> 结果两个人谁也没捞到好处。这个事例就是典型的负和博弈。\n\n---\n\n## 第 0064 集｜互利互惠的“正和博弈”1\n\n### 核心内容\n\n正和博弈（原文口播作“郑和博弈”）与负和博弈不同，顾名思义，是一种双方都能得到好处的博弈，通俗地说，就是指结果双赢的博弈。贸易谈判基本上都是正和博弈，也就是要达到双赢；双赢的结果是通过合作来实现的，必须建立在彼此信任的基础上，是一种非对抗性博弈。双赢的博弈可以体现在各个方面，其中商场上双赢的合作博弈运用得最充分。\n\n需要强调的是，合作并不是不要竞争，恰恰相反，合作正是为了更好的竞争。世界范围内激烈的竞争，使企业逐步从纯粹竞争走向合作竞争，竞争的结果也由零和博弈演变为正和博弈，实现多赢。在大多数情况下，合作可以带来企业真正意义上的竞争优势。传统竞争强调的是战胜对手，随着经济融合度增强，现代竞争更强调竞争对手之间的合作。在当今市场条件下，企业能否取得成功，取决于其拥有资源的多少，或者说整合资源的能力；任何一个企业都不可能具备所有资源，但可以通过联盟、合作、参与等方式，使他人的资源变为自己的资源，从而增强竞争实力。\n\n金龙鱼是家乐氏粮油旗下的著名食用油品牌，最先将小包装食用油引入中国市场，多年来一直致力于改变国人的食用油健康观念，并进一步研发出更健康营养的二代调和油和 AE 色拉油；苏泊尔则是中国炊具第一品牌。金龙鱼是中国食用油第一品牌，苏泊尔是中国炊具第一品牌，两者都倡导新的健康烹饪观念——如果结合起来，岂不是能把“健康”做得更大？就这样，两家企业策划了“苏泊尔”和“金龙鱼”两个行业领导品牌“好油好锅，引领健康时尚”的联合推广，在全国八百家卖场掀起了一场营销风暴。\n\n### 金句摘录\n\n> 正和博弈就是指结果双赢的博弈。\n\n> 合作并不是不要竞争，正相反，合作正是为了更好的竞争。\n\n> 任何一个企业都不可能具备所有资源。但是可以通过联盟合作参与等方式，使他人的资源变为自己的资源，增加竞争实力。\n\n---\n\n## 本篇小结\n\n本组十六集围绕“信息”与“博弈结果”两条线索展开。前半部分讲信息的处理与运用：既要在信息不对称时守住关键信息、善用私有信息与假信息（如联通因过早泄露降价机密而落败），也要在公共信息环境下靠设局用谋、借力使力取胜（如周瑜反间计、曹操隔岸观火），还要懂得在没有信息时隐忍等待、抓住时机（如王曾隐忍揭发、瑞德从失误中发现商机）。后半部分提出博弈的三种结果——零和、负和、正和，并用火锅城、邻里拉琴、木偶与画师、双胞胎姐妹、合伙反目等例子说明：零和与负和博弈只会两败俱伤，唯有以信任为基础的合作才能实现双赢。总的原则是：避免你死我活的对抗，把竞争导向互利互惠的正和博弈。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0049 集｜信息的提取和甄别2","id":"第-0049-集信息的提取和甄别2"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0050 集｜信息的提取和甄别3","id":"第-0050-集信息的提取和甄别3"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0051 集｜信息的提取和甄别4","id":"第-0051-集信息的提取和甄别4"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0052 集｜信息的提取和甄别5","id":"第-0052-集信息的提取和甄别5"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0053 集｜信息的提取和甄别6","id":"第-0053-集信息的提取和甄别6"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0054 集｜公共信息下的锦囊妙策1","id":"第-0054-集公共信息下的锦囊妙策1"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0055 集｜公共信息下的锦囊妙策2","id":"第-0055-集公共信息下的锦囊妙策2"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0056 集｜公共信息下的锦囊妙策3","id":"第-0056-集公共信息下的锦囊妙策3"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句摘录-8"},{"level":2,"text":"第 0057 集｜没有信息时善于等待时机","id":"第-0057-集没有信息时善于等待时机"},{"level":3,"text":"核心内容","id":"核心内容-9"},{"level":3,"text":"金句摘录","id":"金句摘录-9"},{"level":2,"text":"第 0058 集｜机会是制胜的关键","id":"第-0058-集机会是制胜的关键"},{"level":3,"text":"核心内容","id":"核心内容-10"},{"level":3,"text":"金句摘录","id":"金句摘录-10"},{"level":2,"text":"第 0059 集｜有赢有输的零和博弈1","id":"第-0059-集有赢有输的零和博弈1"},{"level":3,"text":"核心内容","id":"核心内容-11"},{"level":3,"text":"金句摘录","id":"金句摘录-11"},{"level":2,"text":"第 0060 集｜有赢有输的零和博弈2","id":"第-0060-集有赢有输的零和博弈2"},{"level":3,"text":"核心内容","id":"核心内容-12"},{"level":3,"text":"金句摘录","id":"金句摘录-12"},{"level":2,"text":"第 0061 集｜两败俱伤的负和博弈1","id":"第-0061-集两败俱伤的负和博弈1"},{"level":3,"text":"核心内容","id":"核心内容-13"},{"level":3,"text":"金句摘录","id":"金句摘录-13"},{"level":2,"text":"第 0062 集｜两败俱伤的负和博弈2","id":"第-0062-集两败俱伤的负和博弈2"},{"level":3,"text":"核心内容","id":"核心内容-14"},{"level":3,"text":"金句摘录","id":"金句摘录-14"},{"level":2,"text":"第 0063 集｜两败俱伤的负和博弈3","id":"第-0063-集两败俱伤的负和博弈3"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0064 集｜互利互惠的“正和博弈”1","id":"第-0064-集互利互惠的正和博弈1"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]}]},{"name":"第 05–08 篇","items":[{"id":"T05","title":"第0065-0080集","full":"每天读点博弈论 · 第 0065–0080 集（合作共赢 · 强弱博弈）","lect":"","dur":"45:26","sec":2726,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0065–0080 集（合作共赢 · 强弱博弈）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0065–0080 集（① 互利互惠的“正和博弈”2 ② 非零和博弈的运用1 ③ 非零和博弈的运用2 ④ 非零和博弈的运用3 ⑤ 从零和博弈到合作双赢1 ⑥ 从零和博弈到合作双赢2 ⑦ 强者往往是规则的制定者 ⑧ 避免以卵击石1 ⑨ 避免以卵击石2 ⑩ 弱势变强势的谋划之道1 ⑪ 弱势变强势的谋划之道2 ⑫ 强弱博弈的借力用力1 ⑬ 强弱博弈的借力用力2 ⑭ 优未必胜，劣未必汰1 ⑮ 优未必胜，劣未必汰2 ⑯ 木秀于林，风必摧之1）\n> **时长**：约 40 分钟（316+335+327+286+274+308+252+326 秒）\n> **特别说明**：第 0071 集中关于不同国家法律与政治体制的论述，依内容政策不整理；其余合作、处世、心理与强弱博弈内容照常忠实整理。\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0065 | 互利互惠的“正和博弈”2 | 金龙鱼与苏泊尔两阶段联合推广，强强联合换来双赢与品牌提升。 |\n| 0066 | 非零和博弈的运用1 | 蜜蜂的三种选择——恳求、对抗、合作，只有合作者达到目的。 |\n| 0067 | 非零和博弈的运用2 | 二层楼里互相夹菜的人吃得尽兴，合作才能双赢；夫妻取长补短亦是正和。 |\n| 0068 | 非零和博弈的运用3 | 为对方留下爱吃的鸡蛋，说明相互体谅是双赢思维的日常体现。 |\n| 0069 | 从零和博弈到合作双赢1 | 撕借条赖账者终被识破，见利忘义是零和博弈的根源。 |\n| 0070 | 从零和博弈到合作双赢2 | 心胸开阔、互相体谅，方可避免零和对抗（送筐的官员夫人）。 |\n| 0071 | 强者往往是规则的制定者 | 规则永远是强者的专利，实力决定地位与利益。 |\n| 0072 | 避免以卵击石1 | 与强者正面交锋如鸡蛋碰石头，康熙面对鳌拜只能智取。 |\n| 0073 | 避免以卵击石2 | 康熙以少年卫士智擒鳌拜，示弱者应避其锋芒、韬光养晦。 |\n| 0074 | 弱势变强势的谋划之道1 | 沙丘之变：弱者若不谋划先发，就会处处受制于人。 |\n| 0075 | 弱势变强势的谋划之道2 | 赵高以利害说动李斯，先发制人，弱者反夺强势地位。 |\n| 0076 | 强弱博弈的借力用力1 | 弱者生存之道：搭强者便车或暂隐锋芒，寻找以弱胜强的关键环节。 |\n| 0077 | 强弱博弈的借力用力2 | 白登之围中陈平以“美人计”针对人性弱点，借外力助刘邦突围。 |\n| 0078 | 优未必胜，劣未必汰1 | 扬长避短方能立于不败，某方面绝对强的人在别处可能不堪一击。 |\n| 0079 | 优未必胜，劣未必汰2 | 田忌赛马与沙漠三学子：以智取胜、置身事外，劣势未必被淘汰。 |\n| 0080 | 木秀于林，风必摧之1 | 出众者易遭对付，弱者应先保护自己、静待时机（ABC 射击手博弈）。 |\n\n---\n\n## 第 0065 集｜互利互惠的“正和博弈”2\n\n### 核心内容\n\n两家企业先对两大品牌做了详细分析，发现它们的内涵有着惊人的相似：健康与烹饪的乐趣是双方共同的主张，也是合作的基础。围绕这一主题共同推出联合品牌，在同一品牌下各自投入，既能避免行业差异、更好地为消费者接受，又能在合作中通过该品牌实现关联；由于双方都是行业领袖，强强联合使品牌的冲击力更强，双方都能从投入中获益。\n\n经过磋商，双方决定把联合品牌合作分为两个阶段：第一阶段通过春节档的促销活动，把双方联合的信息告知消费者；第二阶段为品牌升华期，在第一阶段的基础上共同操作联合品牌。活动正值春节前后，人们买油买锅的欲望高涨，不仅给消费者更多让利、让购物更开心，更重要的是向消费者传递健康知识、帮助其明确选择标准，用优质产品和健康理念提升国人的健康生活素质。活动一经推出便广受欢迎：苏泊尔与金龙鱼油的销售大幅上涨，健康品牌形象也深入人心。\n\n在这次合作中，两家企业在成本降低的同时，品牌和市场都得到提升——金龙鱼扩大了市场份额、品牌美誉度进一步增强，苏泊尔则强化了中国厨具第一品牌的市场地位。这正是正和博弈带来的双赢局面。作者总结说，合作营销更多的是一种策略思考，强调双方优势互补、强强联合，通过共同的推动获得更大的品牌效益。\n\n### 金句摘录\n\n> 这正是正和博弈带来的双赢局面。\n\n> 合作营销更多的是一种策略的思考，强调双方的优势互补，强强联合。\n\n---\n\n## 第 0066 集｜非零和博弈的运用1\n\n### 核心内容\n\n现实生活中，为了使事情向着利己的方向发展，一定要注意非零和博弈的运用。在小溪旁边有三丛花草，每丛花草中都居住着一群蜜蜂。有一天，一个小伙子看着这些花草，总觉得没多大用处，便决定把它们除掉。当他动手除第一丛花草时，住在里面的蜜蜂苦苦哀求：善良的主人，看在我们每天为您的农田传播花粉的情分上，求您放过我们的家吧。小伙子看着这些无用的花草摇摇头说：没有你们，别的蜜蜂也会传播花粉的。很快，他毁掉了第一群蜜蜂的小家。\n\n没过几天，小伙子又来锄第二丛花草，这时冲出一大群蜜蜂对他嗡嗡大叫：残暴的地主，你要毁坏我们的家园，我们绝对不会善罢甘休的。小伙子的脸上被蜜蜂蜇了好几下，一怒之下放火把整丛花草烧得干干净净。\n\n当小伙子把目标锁定第三丛花草时，蜂窝里的蜂王飞了出来，柔声说：睿智的投资者，请您看看这丛花草给您带来的利益吧——我们的蜂窝每年能生产很多蜂蜜，还有最有营养价值的蜂王浆，这些都能给您带来经济效益；如果您把这丛花草除了，您将什么也得不到，您想想吧。小伙子听了，心甘情愿地放下锄头，与蜂王合作，做起了经营蜂蜜的生意。\n\n在这场人与蜂的博弈中，面对小伙子，三群蜜蜂做出了三种选择：恳求、对抗、合作，而只有第三群蜜蜂达到了目的。这个例子告诉我们：如果博弈的结果是零和或负和，那么对方得利就意味着自己受损，或者双方都受损，结果只能是两败俱伤。因此，为了生存，人与人之间必须学会与对方共赢，把人际关系变成一场双方得利的正和博弈，这也是使人际关系向着更健康方向发展的唯一做法。\n\n### 金句摘录\n\n> 如果博弈的结果是零和或负和，那么对方得意就意味着自己受损或双方都受损。\n\n> 为了生存，人与人之间必须学会与对方共赢。\n\n---\n\n## 第 0067 集｜非零和博弈的运用2\n\n### 核心内容\n\n要做到共赢，就要借助合作的力量。有这样一个关于合作的例子：一个人跟着魔法师来到一间二层楼的屋子里。进入第一层楼时，他发现一张长长的大桌子，桌上摆满了丰盛的佳肴，桌旁都坐着人；虽然他们不停地试着让自己吃到食物，却每次都失败，没有一个人能吃得到——因为大家的手臂都受到魔法师的诅咒，变成了直的手肘，不能弯曲，而桌上的美食夹不到口中，所以个个愁苦满面。\n\n他好奇地上到二楼，听到那里充满了愉快的笑声。二楼同样有一群人，手肘同样不能弯曲，但他们却吃得兴高采烈。原来他们彼此协助、互相帮助夹菜喂食，结果每个人都吃得很尽兴。在这场博弈中，两层楼上的人都有两种选择：其一，双方互相合作，获得各自利益；其二，互不合作、各顾各的，自己努力去获得利益。可以看出，只有那些互相合作、相互帮助的人才能够真正达到双赢，走向正和博弈。\n\n正和博弈正是一种相互合作、非对抗性的博弈。对人际交往来说，要想取得良好效果，就应该采取这种非对抗性博弈。这个世界上没有一个人可以不依靠别人而独立生活，这本来就是一个需要互相扶持的社会；先主动伸出友谊的手，你会发现原来四周有这么多的朋友。夫妻之间的互利互惠，可以使彼此感情更亲密：曾有一对夫妻，妻子是跛足，丈夫是聋哑人，外人看来他们应该很不幸，但他们却生活得很幸福——出门买东西时，聋哑丈夫骑着三轮车让妻子坐上，到了地方由能言善道的妻子坐在车上谈价购物；他们从未因某事争吵，因为他们能互相补充彼此的缺陷、取长补短，所以生活得十分美满。这种互利互惠，便是正和博弈。\n\n### 金句摘录\n\n> 只有那些互相合作，相互帮助的人才能够真正达到双赢，走向正和博弈。\n\n> 先主动伸出友谊的手，你会发现原来四周有这么多的朋友。\n\n---\n\n## 第 0068 集｜非零和博弈的运用3\n\n### 核心内容\n\n再比如有这样一对夫妇，他们一生都没有激烈地争论过，更不用说吵架了，生活中更是默契和谐。他们有一个共同的习惯，就是每天都要煮鸡蛋吃。奇怪的是，妻子煮鸡蛋时每次都是自己先吃了蛋白，把蛋黄留给丈夫；而丈夫煮鸡蛋时便吃了蛋黄，把蛋白留给妻子，这似乎成了习惯。\n\n直到丈夫去世前，说想吃鸡蛋，妻子便煮好鸡蛋，首先剥掉蛋白、把蛋黄给丈夫。丈夫说想吃一次蛋白，妻子说：你不是喜欢吃蛋黄吗？丈夫摇摇头说，其实他并不喜欢吃蛋黄，只是看妻子爱吃蛋白，所以才每次都吃蛋黄。这时妻子也告诉丈夫，其实她本来爱吃的是蛋黄，只是因为见丈夫每次都愿意吃蛋黄，所以她每次才吃蛋白。这个故事很美丽，让人为夫妻间的相敬如宾动容。\n\n其实在交际中，如果遇到与交际对象发生冲突的时候，彼此能为对方着想，采取一种双方合作的态度，就一定能避免对抗性博弈发生。所以，为了短期胜利要建立共同利益，为了长远成功要建立良好关系，也就是拥有博弈中的双赢思维；拥有平等互惠的思想、采取合作的态度，才能使人际关系呈现正和状态，并向着健康的方向发展，从而收到良好的交际效果。\n\n### 金句摘录\n\n> 其实在交际中，如果遇到与交际对象发生冲突的时候，互相之间若能为对方着想，采取一种双方合作的态度，那么就一定能避免交际中的对抗性博弈发生。\n\n> 为了短期胜利，建立共同利益，为了长远成功，建立良好关系。\n\n---\n\n## 第 0069 集｜从零和博弈到合作双赢1\n\n### 核心内容\n\n面对博弈中的人际关系，一定要理性分析，不可为了一己之利或一时的胜利，而使良好的人际关系呈现出“吃掉一方”的零和博弈现象。对于局中人，双赢是再好不过的结果了；但人生不如意常十之八九，这就要求我们多加自我控制和约束，朝着正和博弈的方向努力。\n\n首先，别见利忘义，做人之本要心存善良。在人际交往的博弈中，之所以会出现零和博弈，大多是因为人的见利忘义，想图谋别人的利益；而这样的人往往从一开始就心存恶念、不安好心，整天想着算计别人，自然也会用欺诈手段去达到让人不齿的目的。作者举了一个诉讼案件：李先生借了王先生三万元钱。后来王先生因家人有病等着用钱，便向李先生讨要；但王先生多次去找都被各种理由推脱，十分着急，便发了火。李先生见状干脆一不做二不休，一把抢过借条撕得粉碎、从窗口扔下去，并对王先生说：现在好了，谁也不欠谁的钱了。\n\n王先生知道对方想赖账，急忙跑到楼下拾起被撕碎的借条，一片一片对了起来。可李先生根本不认账，王先生只好把他告到法院。法庭上，李先生声称自己已经把钱还给了王先生，所以才撕了借条，弄得王先生百口难辩，法庭也一时无法判断到底谁在讹诈谁——因为李先生说的似乎也有道理：如果不还钱，王先生怎么会让他把借条撕掉呢？后来法庭觉得李先生的理由虽有合理之处，但仍有不少疑点，于是又做了大量调查。最后，王先生提供了电话录音作为证据，说明讨要欠款时曾发生争吵，再加上李先生夫妇在“什么情况下给钱”的问题上口径并不一致，法庭最终判李先生败诉、归还欠款。像李先生这样的人，本就不是善良之辈，他企图在人际关系博弈中赖账不还，达到把别人财产归自己的零和目的，最终仍被法庭抓住了狐狸尾巴。\n\n### 金句摘录\n\n> 首先，别见利忘义，做人之本，心存善良。\n\n> 之所以会出现零和博弈，大多是因为人的见利忘义，想图谋别人的利益。\n\n---\n\n## 第 0070 集｜从零和博弈到合作双赢2\n\n### 核心内容\n\n其次，就是要心胸开阔、能够互相体谅，这也是在人际交往中避免发生零和博弈的一个重要原则。很多事情都是由于人们心胸不够开阔、遇事不够理性才发生的：邻居之间，如果一方心胸开阔些、另一方体谅一些，就不会发生感情不和的事情。最后，就是诚心对待别人、耐心对待别人，一些事总会有雨过天晴的一天。\n\n作者讲了一个例子：某位官员的夫人，邻居总喜欢计较小事。一天，邻居发现官员夫人手提的小筐与自家相似，而自己的小筐几日前不见了，便问官员夫人是否错拿了自家的筐。官员夫人虽知真相并非如此，但也了解邻居的脾气，便什么话也没说，只是笑眯眯地把筐送给了邻居。后来邻居发现了自己的筐，十分抱歉地把筐还给官员夫人，而官员夫人仍是笑眯眯地说：不是你的，那我就拿走了。这位夫人把握关系的分寸十分合适：关键不在于那个筐到底是谁的，而在于多用一份心思、多体谅别人，做到恰到好处，人与人之间自然就会相处得很好。\n\n和美的人际关系是靠点滴用心积累而成的。何不站在对方的立场上多为他人想一些？体谅别人并不难做，我们应该放宽眼光，远望才能有更多收获。古语有云：塞翁失马，焉知非福。为了拥有和美的人际关系，更不必对小事斤斤计较，多为他人想一点，你便会拥有灿烂而愉快的生活。总之，面对博弈中的人际关系，一定要理性分析，不可为一己之利或一时之利，使良好的人际关系呈现“吃掉一方”的零和现象。\n\n### 金句摘录\n\n> 其次就是要心胸开阔，能够互相体谅。\n\n> 古语有云，塞翁失马，焉知非福。\n\n> 和美的人际关系是靠自己点滴用心积累而成的，何不站在对方的立场上多为他人想一些。\n\n---\n\n## 第 0071 集｜强者往往是规则的制定者\n\n### 核心内容\n\n在一方强势的情况下，往往没有博弈，只有服从。强势一方是规则的制定者，在强者面前不要正面交锋，要学会顺势而下、韬光养晦，还要善于搭强者的便车，等待机会以弱胜强。\n\n在狼面前，狐狸是弱小的，狼是规则的制定者，它想打狐狸，可以找到任何理由。规则永远是强者的专利：在博弈中，哪一方处于强势地位，制定的博弈规则必然对其有利。（本集原文中关于不同国家法律与政治体制的论述，依内容政策不整理。）\n\n又比如股市永远是庄家的天下，因为庄家具备拉高股票的实力，散户只能跟进赚点小钱，一旦跟错或封上庄家，甚至可能赔掉本钱。规则虽然具有约束力，但它是建立在实力基础上的；如果没有实力作为依托，什么样的规则都没有意义。在生意圈内，谁拥有雄厚的资金，谁就有对市场的话语权——拥有雄厚资金者可以大规模收购产品，导致产品涨价，从而获取巨额利润。第一代互联网热潮中倒下的企业，多是因为资金实力不济，前期资金烧完、后续资金跟不上。实力决定地位、决定利益；如果你想让游戏规则按自己的意志制定，那就要不断增强自己的实力。\n\n### 金句摘录\n\n> 在一方强势的情况下，没有博弈，只有服从。\n\n> 规则虽然具有约束力，但它是建立在实力基础上的，如果没有实力作为依托，什么样的规则都没有意义。\n\n> 实力决定地位，决定利益。\n\n---\n\n## 第 0072 集｜避免以卵击石1\n\n### 核心内容\n\n“以卵击石”这个成语，相信大家都听说过：与强者正面交锋，就像鸡蛋碰石头，结果只有惨败。作者用一段清代宫廷的历史来说明这个道理。顺治帝驾崩后，年少的康熙登基。身为辅政大臣的鳌拜，依仗自己的权势，培植亲信、打击异己，把朝廷大权操于一人之手：他网罗亲信、广植党羽，在朝中纠集了一股藐视皇帝、操纵六部的势力。辅国公班布尔善处处与鳌拜结党营私，利用权力擅改票签、决定拟罪免罪，因帮助鳌拜而被授予领侍卫内大臣等职。\n\n鳌拜一门更是显赫：他的弟弟穆里玛为满洲都统，后被封为贝勒；另一个弟弟巴哈任议政大臣、领侍卫内大臣，其子还娶了顺治的女儿；鳌拜的儿子官居领侍卫内大臣，班列大学士之上，后袭二等公爵、加太子少师。鳌拜的侄子、姻亲也都依仗他的权势得到高官厚禄，甚至跻身议政王大臣会议。康熙亲政后，决定收回大权，并准备取消辅政大臣的辅政之权，使鳌拜受到极大限制，双方早已存在的矛盾更趋激化。但鳌拜在朝中势力很大，康熙不敢妄动——一旦逼反鳌拜，自己的皇权很可能不保。所以康熙深知，不能与鳌拜正面交锋，必须智取。\n\n### 金句摘录\n\n> 与强者正面交锋，就像鸡蛋碰石头，结果只有惨败。\n\n> 康熙深知不能与鳌拜正面交锋，必须智取。\n\n---\n\n## 第 0073 集｜避免以卵击石2\n\n### 核心内容\n\n鳌拜把自己的心腹纷纷安插在内三院和朝廷各部，一时间文武各部尽出其门下，朝廷中形成了以鳌拜为中心的庞大势力。康熙对此深感不安，冥思苦想剪除鳌拜的办法，终于想出一条计谋。康熙八年五月十六日，鳌拜因事觐见康熙，康熙借此良机，利用自己训练的一批少年卫士将他捉住，送入大狱；接着命康亲王杰书等进行审问，列出鳌拜主要罪行三十款。朝廷大臣议定：应将鳌拜革职立斩，其亲子兄弟亦应斩，其孙为奴，家产籍没；其族人中有官职及在护军者，均应革退。\n\n康熙考虑到鳌拜是顾命辅臣，且有战功、效力多年，最后定为革职籍没，与其子纳木福俱终身禁锢。后来鳌拜死在狱中，纳木福获释。鳌拜的死党穆里玛、塞本特、班布尔善等主要罪犯一律处死。曾经猖獗一时的鳌拜集团就这样被彻底铲除。\n\n由此可见，面对强者要避开其锋芒，这既可以保全自己，又可以给除掉对手创造机会。在与强者博弈中，一定要注意“识时务者为俊杰”的策略，绝对不能干螳臂当车的蠢事；如果没有实力除掉对手，就要继续隐藏下去、修炼内功，等待时机。\n\n### 金句摘录\n\n> 面对强者要避开其锋芒，这既可以保全自己，又可以给除掉对手创造机会。\n\n> 在与强者博弈中，一定要注意识时务者为俊杰的策略，绝对不能干螳臂当车的蠢事。\n\n---\n\n## 第 0074 集｜弱势变强势的谋划之道1\n\n### 核心内容\n\n在博弈中处于弱势的一方，除了以静制动、韬光养晦之外，还要积极谋划，主动出击、先发制人，以免错过时机。作者以秦朝的沙丘之变为例。秦始皇称帝后第五次巡视全国各地，随行的有丞相李斯和中车府令赵高。据说秦始皇有二十多个儿子，但只有第十八子胡亥被允许同行，因为他特别受秦始皇宠爱。\n\n据《史记》记载，这次巡视东至会稽，渡江至琅琊，再取道西返。七月，车驾到平原津，秦始皇病重；到沙丘平台，病情严重，他自知不能治愈，于是命令赵高拟定诏书给长子扶苏，要扶苏把军务托付给蒙恬，速回咸阳办理丧事。诏书写毕，还来不及封口交给使者，秦始皇就去世了。赵高拿了秦始皇的玉玺和遗诏，心情十分沉重——当时知道遗诏内容的，只有李斯、胡亥和他三个人。因为秦始皇死在出行路上，立太子的事未定，丞相李斯怕天下动乱，就命令秘不发丧；每到一地，官吏照常奏事，亲信宦官就在车中假托皇帝命令批复百官奏本。\n\n赵高曾是胡亥的老师，教他书籍与律令法事，两人关系密切。赵高原本是赵国国君的远亲，自幼受宫刑，长大后进宫当宦官；他曾犯大罪，秦始皇命蒙毅审理，秉公执法的蒙毅判他死罪，秦始皇因赵高办事干练、精通刑狱法令而赦免了他。此时的赵高担心：如果让公子扶苏即位，与扶苏关系密切的蒙恬、蒙毅兄弟就会受到宠信，对自己不利。于是他处在“是生还是死”的困境选择之中，随即策划了一场夺权争斗，决定把胡亥推上皇位。\n\n### 金句摘录\n\n> 在博弈中处于弱势的一方，除了以静制动韬光养晦外，还要积极谋划，主动出击，先发制人，以免错过时机。\n\n> 这个时候赵高就处于一个是生还是死的困境选择之中。\n\n---\n\n## 第 0075 集｜弱势变强势的谋划之道2\n\n### 核心内容\n\n赵高扣下皇帝的信件，游说胡亥说：陛下离世，没有遗诏封诸皇子为王，而只赐信给长子扶苏，扶苏一到咸阳就将即位；公子你却无尺寸之地可以立足，你想过该怎么办吗？胡亥说：贤明的君主了解大臣，贤明的父亲了解儿子，我还有什么好说的？赵高面露一丝奸笑，说：现在皇位的归属取决于您、我和李斯三人，希望公子抓住机会；臣人与见臣于人、智人与见智于人，怎可同日而语呢？胡亥对赵高的奸计心存恐惧，但皇位的诱惑实在太大，也就不管那么多了，只是有点担心：现今父皇的遗体还在路上、没有发丧，此事怎么对丞相说呢？\n\n赵高知道，没有丞相李斯的支持，阴谋无法得逞，于是去劝说李斯。李斯起初还以忠于军国自命，但赵高晓之以理：无论才能、功劳、谋略、声望以及和扶苏的私人情谊，你李斯哪一点比得上蒙恬？公子扶苏即位，必定宠任蒙恬、以蒙恬为丞相，这样你的荣华富贵不但没有了，子孙也会受到伤害；只有公子胡亥仁慈可爱、轻钱财、重人才，在始皇所有公子中没有谁比得上他。出于对权势的欲求，李斯终于被赵高说服，同意照赵高的意思去办。三人狼狈为奸，对外宣称李斯接到始皇诏书，立胡亥为太子。\n\n赵高在处于弱势的情况下，先发制人，取得了争权斗争的胜利。当一个人处于困境之下、相对而言又是弱者的时候，便会想尽办法、运用各种阴谋诡计，抢得自己的优势地位——因为弱者非常明白：强势一方是规则的制定者，谁取得强势地位，谁就有制定规则的权利；谁处于弱势地位，谁就只能服从规则。最终，胡亥成了秦二世，赵高也成了显赫一时的权臣。\n\n### 金句摘录\n\n> 赵高在处于弱势的情况下，先发制人，取得争权斗争的胜利。\n\n> 谁取得了强势的地位，谁就有制定规则的权利，谁处于弱势地位，谁就只能服从规则。\n\n---\n\n## 第 0076 集｜强弱博弈的借力用力1\n\n### 核心内容\n\n在强弱的对局中，要善于观察形势，抓住解决问题的关键环节。关键环节找到了，从容发力，可以收事半功倍之效，以极小的成本获得极大的收益。弱者与强者博弈，博弈规则由强者制定，博弈力量也是强者最大；弱者可以搭强者的便车，也可以暂时隐藏锋芒。这是弱者对局强者的生存之道，但弱者忍辱负重、在强者的阴影下生存，只有一个目的，就是自己变为强者、取代强者的位置。\n\n弱者与强者是矛盾的两个方面，强者决定着矛盾的主流走向，因为在这对矛盾中，强者是性质和内容的规定者；但矛盾还有一个特性，就是在一定条件下矛盾双方会发生转变。所以，弱者在与强者对局中，要学会如何以弱胜强。以弱胜强，一般是“借力用力”的四两拨千斤之术和“反剑”之道；在双方对局中，要善于观察形势、抓住关键环节，关键环节找到了，从容发力，可以收事半功倍之效。\n\n作者举了西汉初期的例子：匈奴仍不断侵扰北方边境，刚刚做了皇帝不久的刘邦决定一劳永逸地解决匈奴问题。公元前二百年，匈奴单于冒顿率师南下，刘邦亲率三十万大军迎战，不想在平城白登山（今山西大同东北）中了匈奴的埋伏，被三十万匈奴兵包围。当时匈奴兵的阵势十分壮观：战阵东面是一色的青马，西面是一色的白马，北面是一色的黑马，南面是一色的红马，气势逼人。\n\n### 金句摘录\n\n> 弱者与强者博弈，博弈规则由强者制定，博弈力量也是强者最大。弱者可以搭强者便车，也可以暂时隐其锋芒。\n\n> 要善于观察形势，抓住解决问题的关键环节。\n\n---\n\n## 第 0077 集｜强弱博弈的借力用力2\n\n### 核心内容\n\n刘邦在白登山被围了七天，救兵被阻、突围不成，又值严冬，粮草断绝，许多士兵的手指都冻掉了。刘邦焦急万分：双方力量相差悬殊，硬拼不可能成功，而对手又是死敌，没有商谈的余地，真是一个板上钉钉的死局。正在危难之际，刘邦手下的大臣陈平想到一条妙计：他派使者求见冒顿单于的妻子（阏氏），送去一份厚礼，其中有一张洁白的狐狸皮，并对她说：如果单于继续围困汉朝，我们就会送最美的美女给单于，那时你将失宠。同时，陈平又令人制造了一些形似美女的木偶，装上机关使其舞动。她远远望去，见许多美女舞姿婆娑、楚楚动人，担心汉朝真的送美女来，于是说服单于放开了一个缺口，刘邦趁机冲出重围。\n\n这就是历史上的白登之围。在白登山，刘邦已深陷困境，如果匈奴一举进攻，也许汉朝的历史将被改写；双方实力之悬殊可见一斑，但在这样的情况下，陈平却巧妙地想到利用女人的嫉妒来突围的妙策。刘邦突围后，又成为与单于对决的强势一方。从另一个角度说，这个美人计同样是针对人性的弱点：一般的美人计是为男人而设，目的在于勾引蛊惑男人，而这个美人计针对的是女人，利用单于妻子的自保之心，借外力解围。\n\n### 金句摘录\n\n> 双方力量相差悬殊，硬拼是不可能成功的。\n\n> 这个美人计针对的是女人，利用单于妻子自保之心，借外力解围。\n\n---\n\n## 第 0078 集｜优未必胜，劣未必汰1\n\n### 核心内容\n\n弱者并不是等死的，不管自己多弱，都会想方设法做最有利于自己的行为。进化论有一个著名的理论叫“优胜劣汰”，指生物在生存竞争中适应力强的保存下来、适应力差的被淘汰；但优胜劣汰不能简单地理解为表面上的优劣就决定了一切。人是智慧的生物，有时结果常会事与愿违。博弈其实就是互动的策略性问题：在每一次利益对抗中，每个人都在寻求制胜之策，不管对方采取怎样的策略，都采用对自己最佳的方法。\n\n作者讲了一个笑话：一个人很高兴地对朋友说，他刚才一下子战胜了三个世界冠军。朋友非常了解他，觉得根本不可能。他不屑地说：我和象棋冠军比游泳，把他落下了一大截；我和游泳冠军比骑马，刚跑完一圈他就从马背上掉了下来；然后我和赛马冠军比下棋，他输得很惨。朋友听了目瞪口呆。笑话真假不必考究，事情本身却体现了一种智慧竞争的法则：故事里的人之所以能战胜三个冠军，是因为他充分了解自己的长处，在激烈的竞争中善于发挥自己的优点，做到了扬长避短，才使自己立于不败之地。在人组成的世界里，没有绝对的强与弱，在某一个方面具有绝对优势的人，在其他方面也许不堪一击。所以优未必胜、劣未必汰，真正懂得扬长才能避短。\n\n### 金句摘录\n\n> 弱者并不会等死，不管自己多弱，都会想方设法做最有利于自己的行为。\n\n> 在人组成的世界里，没有绝对的强与弱。\n\n> 所以优未必胜、劣未必汰，真正懂得扬长才能避短。\n\n---\n\n## 第 0079 集｜优未必胜，劣未必汰2\n\n### 核心内容\n\n弱者不一定完全弱，要找到自己生存的法则。前面章节说过田忌赛马的故事：田忌本来是弱者，他却赢了，为什么？因为他知道运用自己的智慧，不与强者争一时的长短，而是依据自己的实际，错开对方的优势、以长击短，因此取胜。这就是所谓的扬长避短、剑走偏锋。生活中我们常遇到这样的情况：明知在这方面比不过人家，却还要硬着头皮去做。为什么不换一种思路呢？当你斗不过别人的时候，采用一种旁观者的角度来处事也是不错的；当你与世无争的时候，说不定正成全了你的成功。\n\n作者讲了一个故事：甲、乙、丙三个学子经常在一起争论。甲和乙信奉竞争哲学，认为优胜劣汰的法则是真理，这个世界只有强者才可以生存；而身体虚弱、又不怎么聪明的丙则不然，他认为人类应该合作，而不应该相互竞争。甲和乙经常因此笑话丙的观念，时不时还为难他，但丙坚持自己的看法。有一天，三人外出探险，在茫茫沙漠中迷了路——沙漠一望无际，头上烈日炎炎，淡水越来越少。为了活命，信奉竞争哲学的甲和乙终于打了起来。在这场争夺淡水的争斗中，甲当场被杀，乙因战斗而身负重伤，不久也死了。最后只剩下丙，喝着剩余的一点点淡水，终于走出了沙漠。\n\n学会置身事外是一种智慧，也是博弈的一种高明手段，目标是在混乱的时候保护自己。当一场冲突很严重的时候，不是要去打倒对方，而是保护好自己才是最重要的，并且在这个过程中找到有利于自己的位置。所以，优势与劣势不是绝对的，只要运用好自己的智慧，劣势不一定会被淘汰，也可以胜利。\n\n### 金句摘录\n\n> 弱者不一定完全弱，要找到自己生存的法则。\n\n> 当你斗不过别人的时候，采用一种旁观者的角度来处事也是不错的。\n\n> 优势与劣势不是绝对的，只要运用好自己的智慧，劣势不一定会被淘汰，也可以胜利。\n\n---\n\n## 第 0080 集｜木秀于林，风必摧之1\n\n### 核心内容\n\n中国古代有句俗语：木秀于林，风必摧之；堆出于岸，流必湍之；行高于人，众必非之。就是说，一个人如果比别人优秀太多，难免会成为大家议论或对付的对象。这也可以说是一种保护自己的方法。当“枪手”对决时，我们要做的不是击倒谁，而是先保护自己，然后找到自己有利的地位。\n\n弱者在博弈中一般不被大家重视，很多人都觉得弱者不是一种威胁，因此，在博弈的初始，弱者处于安全位置；但这种安全并不是绝对的，要善于利用对手的这种心理，为自己争取空间和时间。在枪手的对决中，想要始终保持胜利，不仅是能力决定的，还需要智慧——当别人打得火热的时候，正好可以提高自己的实力。\n\n作者举了一个例子：假设有 A、B、C 三个射击手，C 的命中率是百分之三十，B 的命中率是百分之八十，A 是神枪手，命中率是百分之百。三个人轮流互相射击，每个人最多放两枪，可以对另外两人中的一个射击，也可以对空射击；只要被命中就一枪毙命。考虑到 C 的水平最差，由 C 第一个射击，然后是 B，最后是 A。请问 C 应该采取什么策略才能使自己的存活率最高？答案是 C 应该对空射击，才能保证自己最高的存活率。再多做一些计算，可得出 B 的存活率是百分之五十六，A 的水平最高，存活率却是最低的，只有百分之十四。这个结果很有意思：A 的能力最强，却在这场博弈中最难存活下来。\n\n### 金句摘录\n\n> 木秀于林，风必摧之。堆出于岸，流必湍之。行高于人，众必非之。\n\n> A 的能力是最强的，却在这场博弈中最难存活下来。\n\n---\n\n## 本篇小结\n\n本组十六集从“正和博弈”讲到“强弱博弈”。前一部分强调共赢与合作：金龙鱼与苏泊尔强强联合、蜜蜂的三种选择（恳求、对抗、合作）、二层楼里互相喂食的人，都说明合作才能带来真正持久的利益；夫妻取长补短、为对方留下爱吃的鸡蛋，则把双赢落到日常相处。中间部分提醒我们远离零和与负和：赖账撕借条者终被识破，说明见利忘义必受惩罚，唯有心胸开阔、互相体谅才能避免对抗（如送筐的官员夫人）。后一部分转向强弱博弈的生存智慧：强者往往是规则的制定者，弱者不宜以卵击石，应韬光养晦、借力用力（如以弱胜强的白登突围），更要懂得扬长避短、置身事外（如田忌赛马、沙漠中的丙君），因为“木秀于林，风必摧之”——实力与智慧才是博弈的根基。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0065 集｜互利互惠的“正和博弈”2","id":"第-0065-集互利互惠的正和博弈2"},{"level":3,"text":" 胜，劣未必汰2","id":"第-0079-集优未必胜劣未必汰2"},{"level":3,"text":"核心内容","id":"核心内容-15"},{"level":3,"text":"金句摘录","id":"金句摘录-15"},{"level":2,"text":"第 0080 集｜木秀于林，风必摧之1","id":"第-0080-集木秀于林风必摧之1"},{"level":3,"text":"核心内容","id":"核心内容-16"},{"level":3,"text":"金句摘录","id":"金句摘录-16"},{"level":2,"text":"本篇小结","id":"本篇小结"}]},{"id":"T06","title":"第0081-0096集","full":"每天读点博弈论 · 第 0081–0096 集（劣势转优势 · 斗鸡博弈）","lect":"","dur":"42:50","sec":2570,"theme":"","url":"","md":"# 每天读点博弈论 · 第 0081–0096 集（劣势转优势 · 斗鸡博弈）\n\n> **合集**：每天读点博弈论：掌控人生的生存策略（B站 UP主：勤者读书）\n> **对应集**：第 0081–0096 集（① 木秀于林，风必摧之2 ② 木秀于林，风必摧之3 ③ 木秀于林，风必摧之4 ④ 劣势很可能是优势1 ⑤ 劣势很可能是优势2 ⑥ 劣势很可能是优势3 ⑦ 劣势很可能是优势4 ⑧ 两个弱者之和大于二1 ⑨ 两个弱者之和大于二2 ⑩ 两个弱者之和大于二3 ⑪ “斗鸡博弈”中的进退之道1 ⑫ “斗鸡博弈”中的进退之道2 ⑬ “斗鸡博弈”中的进退之道3 ⑭ “斗鸡博弈”中的进退之道4 ⑮ 学会牵着对方鼻子走1 ⑯ 学会牵着对方鼻子走2）\n> **时长**：约 38 分钟（263+296+269+273+315+330+276+290 秒）\n> **特别说明**：第 0095 集所举案例涉及外国政治人物与选举，依内容政策不整理具体人物与情节，仅保留其博弈方法要义；其余处世、心理与商业内容照常整理。\n\n---\n\n## 本篇速览\n\n| 集号 | 标题 | 一句话要点 |\n| --- | --- | --- |\n| 0081 | 木秀于林，风必摧之2 | 生存更取决于你对别人的威胁程度，强者宜“扮猪吃老虎”，弱者宜坐山观虎斗。 |\n| 0082 | 木秀于林，风必摧之3 | 弱者不必一味争强，示弱也是一种策略，能达到逞强达不到的效果。 |\n| 0083 | 木秀于林，风必摧之4 | 夫妻争执中适时低头示弱，矛盾迎刃而解；太尖锐只会招来对抗。 |\n| 0084 | 劣势很可能是优势1 | 祸福相依，劣势也能转优势，断臂男孩只凭一招学柔道。 |\n| 0085 | 劣势很可能是优势2 | 师傅借男孩的缺陷制胜；“鲨鱼效应”说明劣势可炼成强项。 |\n| 0086 | 劣势很可能是优势3 | 两鱼馆争客：一则鱼钩伤人的祸事，暗藏转机。 |\n| 0087 | 劣势很可能是优势4 | 孙家鱼馆以诚致歉反倒证明是野生鱼，逆向思维由劣势转优势。 |\n| 0088 | 两个弱者之和大于二1 | 三个臭皮匠赛过诸葛亮，思维有漏洞、二人可互补。 |\n| 0089 | 两个弱者之和大于二2 | 鱼竿与鱼篓：懂得合作者过上好日子，单干者皆亡。 |\n| 0090 | 两个弱者之和大于二3 | 潘石屹与妻子优势互补、明确分工，成就 SOHO 中国。 |\n| 0091 | “斗鸡博弈”中的进退之道1 | 两强相争进退两难，斗鸡博弈有两个纳什均衡，结果不可预测。 |\n| 0092 | “斗鸡博弈”中的进退之道2 | 债权债务类似斗鸡博弈，双方都想强硬，反而陷入囚徒困境。 |\n| 0093 | “斗鸡博弈”中的进退之道3 | 动态博弈下均衡为“B 强硬、A 妥协”；庄子以“木鸡”喻斗鸡最高境界。 |\n| 0094 | “斗鸡博弈”中的进退之道4 | 拍卖叫价“骑虎难下”，及早退出是明智之举，关键要把握主动。 |\n| 0095 | 学会牵着对方鼻子走1 | 势均力敌时，善用传媒夺主动者占上风（案例依内容政策不整理）。 |\n| 0096 | 学会牵着对方鼻子走2 | 抓住对手软肋才能占主动，诸葛亮舌战江东即是范例。 |\n\n---\n\n## 第 0081 集｜木秀于林，风必摧之2\n\n### 核心内容\n\n在现实生活中，生存不但取决于你的能力，更取决于你对别人的威胁程度。一般而言，能力越是超强的人，对别人的威胁也越大。这就是“木秀于林，风必摧之”：个人能力并不与生存能力成正比。要提高现实社会中的生存能力，对能力最强的人（A）而言，最好的策略就是装傻，也就是大智若愚，通俗地说，就是“扮猪吃老虎”，这实在是无奈之举。而弱者（C）的策略也很有意思：与 A、B 相比，他的能力差很多，面对两个比自己强大得多的敌人，他的最佳策略是对空射击、不招惹强敌，让 A 和 B 相斗，自己坐山观虎斗、偏安一隅、坐收渔利；当然，在现实生活中，他绝不能让 A 和 B 中间的任何一方真正倒下，否则下一个倒霉的就是他。\n\n历史上有些政权军事力量薄弱、与周边强敌差距很大，就犹如这个博弈范例中弱者 C 的角色，其最佳策略本应是挑起强敌互相争斗，并保证任何一方不能倒下。如果把次强者 B 的命中率改动一下，改成百分之四十——只比弱者 C 稍稍强一点，与 A 的差距都很大，重新计算会发现：C 的最佳策略变成向 A 射击。在现实中，魏、蜀、吴三国相争就类似这种情形：曹操占据中原、拥百万之众，是范例中的 A；东吴盘踞江东、历经三世、人才济济，实力仍与曹魏差距很大，是修改参数后的 B；刘备最弱，犹如 C，所以他的最佳策略就是联合东吴抗衡最强者曹操，这也正是诸葛亮“隆中对”的深意。\n\n### 金句摘录\n\n> 生存不但取决于你的能力，更取决于你对别人的威胁程度。\n\n> 个人能力并不与生存能力成正比。\n\n> 刘备的最佳策略就是联合东吴抗衡最强者曹操，这也是诸葛亮隆中对的深意。\n\n---\n\n## 第 0082 集｜木秀于林，风必摧之3\n\n### 核心内容\n\n在这个弱肉强食的时代，每个人都不可能在每件事情上占绝对的优势。作为弱者，我们不必一味争强好斗，有时候示弱也是不错的方法。有对年轻夫妇，结婚刚三年，却经常为一些鸡毛蒜皮的事吵个不停，感情像阳光下的雪，变得越来越薄。有天那位妻子向朋友诉苦，说这种日子无法忍受、还不如离掉算了。她每次吵架都觉得自己有理，想要个合理的说法，可丈夫总有借口把她驳得无法辩驳，让她很不甘心。朋友建议她：再争吵时不要一味逞强，要学会示弱。她反问：女人本来就扮演弱者的角色，继续示弱，岂不更让男人得寸进尺？朋友说：不是这样，这里的示弱是有技巧的，能达到逞强无法达到的效果。\n\n作者由此指出，在博弈中一味争强未必是上策，适时示弱反而可能化解对抗、扭转局面——尤其在没有触及原则的问题上，退一步往往比硬碰硬更有效。这为下一集具体展开“示弱”的做法做了铺垫。\n\n### 金句摘录\n\n> 在这个弱肉强食的时代，每个人都不可能在每件事情上占绝对的优势。\n\n> 有时候示弱也是不错的方法。\n\n---\n\n## 第 0083 集｜木秀于林，风必摧之4\n\n### 核心内容\n\n朋友举例说：没有触及原则问题的争吵，不必针尖对麦芒；即便理由充分，也不必得理不饶人。可以悄无声息地低下头，做一种无辜无奈状；必要时楚楚可怜地看他一眼——英雄惜美人是男人的天性，而且退让更容易博得理解，远比控诉更有力量，矛盾也就迎刃而解。以后再遇到细小的家庭矛盾，这位妻子如法炮制，果然收效明显：少了吵闹，多了设身处地的理解和温情脉脉的恩爱。\n\n人与人之间的相处其实很有学问。可以看出，这对夫妻之间的争吵总是以丈夫的能说会道结束，大家都想争得胜利，但事实上并没有那么多胜利。一方太尖锐，也会导致另一方尖锐，“针尖对麦芒”的战争就是这样产生的：当一方太强势，另一方肯定不甘心，必然产生抵抗心理，长期下去就不是好事。示弱也是一种策略——不能压倒对方，也可以让对方软下来。遇到事情时，最重要的还是看清自己的立场、自己和对手之间的差距，弄清自己究竟是强者还是弱者。世界上什么层次的人都有，任何阶层的人都有自己的生存之道；太招摇的人总是容易树敌，不管是别人真想超过他，还是出于嫉妒。所以有时候弱者要学会低下头、学会坐山观虎斗，不要随随便便和别人硬拼。\n\n### 金句摘录\n\n> 没有触及原则问题的争吵，不必针尖对麦芒。\n\n> 示弱也是一种策略，不能压倒对方，那也可以让对方软下来。\n\n> 太招摇的人总是容易树敌。\n\n---\n\n## 第 0084 集｜劣势很可能是优势1\n\n### 核心内容\n\n看待任何事情都要有两面性，要用辩证的思维去考虑：当你觉得一件事不好的时候，也许它就将变得很好。老子说过：祸兮福所倚，福兮祸所伏。好坏是相对的，不要一味埋怨自己的弱势之处，动动脑子就可以让它转变。有些人面对自己的短处或劣势，拘泥其中、怨天尤人，却不想方设法借势而行，那成功也就遥遥无期。人生没有绝对的优势，也没有绝对的劣势，只要你用心去做，劣势同样可以转变为优势；如果你只是把自己的劣势看成劣势，那么你的劣势就真的只是劣势了。想要有所转变，首先就要有转变的心态。\n\n有这样一个经典故事：一个小男孩在一次车祸中失去了左臂，他很想学柔道，于是拜了一位日本柔道大师为师。尽管他学得不错，但师傅自始至终只教他一招，并对他说：你只需要会这一招就够了。男孩心中迷惑，却依然听从师傅的话，下决心把这一招练到极致。一年之后，男孩将此绝招练得烂熟于心、运用得炉火纯青。恰在此时，师傅要带他去参加一场武术比赛，男孩也想检验一下自己的武艺，便欣然同意。令人没想到的是，他在这场比赛中很轻松地战胜了数位对手。\n\n### 金句摘录\n\n> 祸兮福所倚，福兮祸所伏。\n\n> 如果你只是把自己的劣势看成是劣势，那么你的劣势就真的只是劣势了。\n\n> 人生没有绝对的优势，也没有绝对的劣势。\n\n---\n\n## 第 0085 集｜劣势很可能是优势2\n\n### 核心内容\n\n当最后一位挑战者走上台时，男孩不禁有些担心：眼前的对手身材高大、体格健壮，看起来不容易对付。他不由得提高了警惕，幸好他闯到了最后一关。其他挑战者在这种情形下变得焦躁起来，男孩从挑战者的眼神中看出了破绽，于是使出师傅教给他的那一式绝招，制服了对手，取得最后的胜利。事后男孩觉得很不可思议：为什么单凭这一招就能赢得比赛？师傅这才告诉他两点原因：第一，你熟练掌握了基本功；第二，你把这一式绝招练得很纯熟，而战胜你这一招的唯一方法就是抓住你的左臂——但你失去了左臂，对手自然不可能将你制服。直到此时，男孩才终于明白，师傅仅教他一招却让他战胜对手，正是把他的劣势变成了优势。\n\n这就是一个把劣势转变为优势的例子。在你的生活中，没有绝对的优势，就看你能不能把握好自己的客观条件和机遇，把自身的特点都发挥出来。这个男孩有一位好师傅，是个伯乐，懂得借用男孩的弱势，让他的缺点变成别人难以攻击的优势。在生活中并非每个人都有这样一位师傅，更多的是需要我们自己去发掘自身的特点。\n\n鱼依靠鱼鳔才能在大海中自由沉浮；而没有鱼鳔的鲨鱼，为了不使自己下沉，就得不停地游动，长此以往，它的身体肌肉越来越强壮、体格也越来越大，终成海洋霸王——这就是“鲨鱼效应”。每个人都有劣势，也有优势，与其为自己的缺陷苦恼，倒不如想想怎样弥补它、利用它，让它在别的方面成为优势。\n\n### 金句摘录\n\n> 战胜你这一招的唯一方法就是抓住你的左臂。但你失去了左臂，对手自然不可能将你制服。\n\n> 每个人都有劣势，有优势。\n\n> 长此以往，他的身体肌肉越来越强壮，体格也越来越大，终成海洋霸王。\n\n---\n\n## 第 0086 集｜劣势很可能是优势3\n\n### 核心内容\n\n虽然每个人都有缺点，但如果找到了这些缺点的突破口，就不必害怕；找到突破口，让自己的缺陷在别的地方发挥优点，就可以把劣势变优势了。某地小镇新开了两家鱼馆，为了吸引顾客，双方都打出“正宗野生鱼”的招牌，声称店内鲜鱼全部由江上渔船直接供货。开始的确如此，但随着两店经营规模不断扩大，仅凭渔夫送的鲜鱼已难以保证食客所需；再加上水域污染严重、野生鱼资源越来越少，鱼价自然水涨船高。孙家鱼馆老板为了节约成本，无奈把菜价抬了上去，以致顾客数量锐减、生意日渐冷清。而刘家鱼馆老板头脑活，认为不能提价（提了价谁还来），但也不能高进低出，于是悄悄以网箱鱼替代野生鱼——因为价格低，吸引来不少食客。\n\n这天因为刘家鱼馆客满，几个食客只好转到孙家鱼馆。几人点了几条鲤鱼，正吃着，其中一人突然大叫起来——原来他被鱼嘴内遗留的鱼钩钩住了嘴，鲜血淋漓。孙老板赶紧把受伤的食客送到医院治疗，忙碌下来，孙家鱼馆不但没收一分钱，反而倒赔了食客一千元医药费。刘家鱼馆的人见孙家鱼馆一蹶不振，暗自庆幸，言谈中透出幸灾乐祸：看他孙家鱼馆不行了，吃鱼还钩破了食客的嘴，还有谁敢去？\n\n第二天，孙家鱼馆门前贴出了用大红纸书写的醒目致歉声明：本鱼馆所供鲜鱼，由于是渔夫从江中垂钓所得，致使鱼钩留在鱼嘴并逃过服务员的检查，最终造成鱼钩误伤顾客；同时保证今后避免此类事情再次发生。\n\n### 金句摘录\n\n> 与其为自己的缺陷费心费神，倒不如想想怎样弥补自己的缺陷，利用自己的缺陷。\n\n> 找到突破口，让自己的缺陷在别的地方发挥优点，就可以把劣势变优势了。\n\n---\n\n## 第 0087 集｜劣势很可能是优势4\n\n### 核心内容\n\n孙家鱼馆的致歉信贴出来没几天，情况发生逆转，食客大增，门可罗雀变成了门庭若市。原来，人们通过致歉声明明白了：孙家鱼馆的鱼是纯野生的——要不鱼嘴中咋有鱼钩呢？网箱鱼自然不可能有这种情况。再说，孙老板敢于承认错误，说明孙家鱼馆诚实守信、不唬人；至于鱼价调高的问题，钓的鱼嘛，成本肯定比网箱鱼高。有好事者专门到刘家鱼馆再仔细品尝，结果发现味道与孙家鱼馆的鱼不一样。事情传出去，孙家鱼馆的生意又重新红火起来。对孙老板而言，本是件心烦事，反倒成了体现诚信的好时机。假设孙老板不采用逆向思维挽救事态，恐怕这件祸事就变成了致命伤，饭馆就要关门了。\n\n人的思维最怕僵化，一旦僵化、形成定势，就会产生误区。做生意如果只沿着一种思维的死胡同走，就成了“憋死牛”；而逆向思维的一个小小转变，却有可能让你绝处逢生，由劣势转为优势。其实这样的例子多得很：仔细观察身边，你会发现很多人都能利用自己的劣势，做得让你佩服不已。我们也要学会利用自己的劣势，把不利因素引导着朝自己有利的方向发展，变不利为有利、变被动为主动。古语有云：如敌之强，十强于我，我先攻其弱，无损其强而利以疲矣——这就是说，要获得胜利，需要因势而动。但我们也要明白，很多时候有些事没法改变，能改变的只有我们自己的策略：我们要做的就是扬长避短，把自己的劣势转换到另外的场合，变成优点，即可胜利。\n\n### 金句摘录\n\n> 人的思维最怕僵化，一旦僵化，形成定势，就会产生误区。\n\n> 很多时候有些事没法改变。能改变的只有我们自己的策略。\n\n---\n\n## 第 0088 集｜两个弱者之和大于二1\n\n### 核心内容\n\n每个人都是有缺点的，也许别人正可以利用你的弱点攻击你，而你要做的就是怎么去弥补它。中国有句俗话叫“三个臭皮匠，赛过诸葛亮”，是有渊源的。话说有一天，诸葛亮到东吴做客，为孙权设计了一尊报恩寺塔——其实这是诸葛亮要先掂掂东吴的分量，看看东吴有没有能人造塔。那宝塔要求很高，单是顶上的铜葫芦就有五丈高、四十多斤重。孙权被难住了，急得抓耳挠腮；后来好不容易寻到了匠人，却缺少做铜葫芦模型的人，便在城门上贴起招贤榜，时隔一个月仍无下文。\n\n城门口有三个摆摊子的皮匠，他们面目丑陋、又目不识丁，大家都称他们为“丑皮匠”。他们听说诸葛亮在为难东吴，心里不服气，便凑在一起商议，足足花了三天三夜功夫，终于用剪鞋样的办法剪出了个葫芦的样子，再用牛皮开料，一锥子一锥子地缝成一个大葫芦的模型；在浇铸时，先将皮葫芦埋在沙里，这一招果然一举成功。诸葛亮得到铜葫芦做好的消息，立即向孙权告辞，从此再也不敢小看东吴了。“三个臭皮匠，赛过诸葛亮”的故事，就这样成了一句寓意深刻的谚语。\n\n你看这几个臭皮匠的智慧，与诸葛亮比起来绝对是天上地下，但这一局博弈，诸葛亮却没有占到上风。为什么？主要原因就是人的思维都是有漏洞的，想问题时考虑范围只能局限在自己的思维定式内；而且有时候两个人刚好可以互补，让弱势的部分不再是问题。这时候，两个弱者的和就不再是两个弱者，而是一个强者了。\n\n### 金句摘录\n\n> 人的思维都是有漏洞的，在想问题的时候，考虑范围只能局限在自己的思维定式内。\n\n> 两个弱者的和就不再是两个弱者，而是一个强者了。\n\n---\n\n## 第 0089 集｜两个弱者之和大于二2\n\n### 核心内容\n\n从前有两个饥饿的人得到一位长者的恩赐：一根鱼竿和一篓鲜活硕大的鱼。其中一个人要了鱼，另一个人要了鱼竿，然后分道扬镳。得到鱼的人在原地用干柴搭起篝火煮起了鱼，他狼吞虎咽，转瞬间连鱼带汤吃了个精光，不久便饿死在空空的鱼篓旁；另一个人提着鱼竿，继续忍饥挨饿，一步步艰难地向海边走去，可当他已看到不远处那片蔚蓝的海洋时，浑身的最后一点力气也使完了，只能眼巴巴地带着无尽的遗憾撒手人寰。\n\n后来又有两个饥饿的人，同样得到长者恩赐的一根鱼竿和一篓鱼。只是他们没有各奔东西，而是商定共同去找寻大海：每次只煮一条鱼，经过长途跋涉来到海边，从此开始了捕鱼为生的日子。几年后，他们盖起了房子，有了各自的家庭和子女，有了自己建造的渔船，过上了幸福安康的生活。\n\n同样的东西给了不同的人，得出不同的结果。只看见自己不足的人，永远被困在自己的弱势里；而看得深远的人却不一样，能够看到合作的巨大作用。拿鱼竿的人一边去找钓鱼的地方、一边拿现成的鱼为生，才是最佳的合作方式、最佳的生存方式。当然，在与别人合作时要注意分工明确：每个人干什么要分配合理，否则就会乱套。\n\n### 金句摘录\n\n> 只看见自己不足的人，永远都是被困在自己的弱势里面，而看得深远的人却不一样，能够看到合作的远大的作用。\n\n> 在与别人合作的时候，要注意分工的明确。\n\n---\n\n## 第 0090 集｜两个弱者之和大于二3\n\n### 核心内容\n\n地产大王潘石屹就是这样一个聪明人，他与妻子的生意搭配，让各自的优势得到充分发挥，从而始终站在地产界前列。潘石屹的缺点在于设计、财务方面，长处在于他对市场有着超常的嗅觉。他回忆自己十一二岁时，生产队里种了好多瓜，大人们出去卖老是卖不出去，后来让他去卖，每次都能卖得干干净净——他讲这个故事，是为了证明自己是一个天生的好商人。\n\n在 SOHO 中国上市之前，潘石屹的妻子张欣曾接受《华尔街日报》采访。记者问张欣：你是剑桥大学经济学硕士，又在华尔街工作过，可为什么更关注美学以及设计这类在商业中较为软性的部分呢？张欣干脆地回答：和我相比，潘石屹天生就是个更好的商人，在市场嗅觉方面，我没有他那样敏锐的直觉。十年前，为了开发北京 CBD 的处女地，潘石屹选中了今天 SOHO 现代城的所在地；当年所有境外开发商都认为这个气味不佳的地点并不适合用作 CBD 选址，无人愿意与他合作，而十年后，潘石屹用事实向他们作出证明。上市之前，潘石屹和张欣的分工是：前者负责寻找项目、市场营销和财务，后者负责规划设计和工程；SOHO 中国进入上市程序后，财权就交由华尔街出身的张欣负责。目前由于张欣对上市公司的持股比例高于潘石屹，有人戏称潘石屹是给妻子打工，潘石屹却说这只是一个家族安排，没有什么特殊目的。\n\n这样的两个人在我们看来是强人了，但他们仍然知道自己的弱势在哪里——每个人都是有缺点的，也许别人正可以利用你的弱点攻击你，而你要做的就是怎么去弥补它。潘石屹和妻子的合作，让彼此的业绩都无可挑剔。所以在生活中，我们不会时时处于强势状态，处于弱势时的智慧与策略就格外重要。\n\n### 金句摘录\n\n> 潘石屹的缺点在于设计，财务方面，长处在于他对于市场有着超长的嗅觉。\n\n> 每个人都是有缺点的。也许别人正可以利用你的弱点攻击你。\n\n---\n\n## 第 0091 集｜“斗鸡博弈”中的进退之道1\n\n### 核心内容\n\n在生活和工作中，总会出现你争我夺的局面，而且多少都会遭遇一些威胁，甚至落入危险的境地。这个时候该怎么办？不妨用点“斗鸡博弈”的智慧。斗鸡博弈中的进退之道告诉我们：哪一方能够前进，是由双方的实力所决定的；当双方都无法完全预测实力强弱时，就只能通过试探才知道，而这种试探有时要付出相当大的代价。\n\n设想斗鸡场上有两只好斗的公鸡发生遭遇战，它们有两个行动选择：退下来或进攻。如果一方退下来而对方没有退，对方获胜，这只公鸡则很丢面子；如果双方都退，则打个平手；如果自己没退而对方退了，自己胜利、对方失败；如果两只公鸡都前进，则两败俱伤。因此对每只公鸡来说，最好的结果是对方退而自己不退，但此时又面临两败俱伤的风险。不妨假设：两只公鸡均选择前进，结果两败俱伤，收益是负二个单位（损失两个单位）；一方前进、另一方后退，前进者获得一个单位收益（赢得了面子），后退者获得负一个单位（损失一个单位，输掉面子），但没有两者均前进损失大；两者均后退，都输掉面子，各获得负一个单位。这些数字只是相对值。\n\n如果一个博弈有唯一的纳什均衡点，它就是可预测的；如果有两个或两个以上的纳什均衡点，就无法预测出一个结果。斗鸡博弈有两个纳什均衡：一方进、另一方退。因此我们无法预测斗鸡博弈的结果，即不能确知谁进谁退、谁输谁赢。由此可见，斗鸡博弈描述的是两个强者在对抗冲突时，如何让自己占据优势、力争最大收益、确保损失最小，参与者都处于势均力敌、剑拔弩张的紧张局势——就像武侠小说里两个顶尖高手在华山比拼内力，难分难解，一旦一方稍有分心、内力衰竭，就要被对方一举击溃。\n\n### 金句摘录\n\n> 哪一方能够前进是由双方的实力所决定的。\n\n> 斗鸡博弈描述的是两个强者在对抗冲突的时候，如何能让自己占据优势。\n\n---\n\n## 第 0092 集｜“斗鸡博弈”中的进退之道2\n\n### 核心内容\n\n斗鸡博弈在日常生活中非常普遍，债权人与债务人之间的博弈就类似于斗鸡博弈。假如债权人 A 与债务人 B 双方实力相当，债权债务关系明确，B 欠 A 一百元，金额可协商。若合作达成妥协，A 可获九十元，B 减免十元；如果一方强硬、一方妥协，则强硬方收益为一百元，妥协方收益为零；如果双方强硬、发生暴力冲突，A 不但收不回债务还受伤，医疗费用损失一百元，A 的收益为负二百元（不仅一百元债务收不回，反而倒贴一百元），B 则损失一百元。因此 A、B 各有两种战略：妥协或强硬，每一方选择自己最优战略时，都假定对方战略给定。\n\n若 A 妥协，则 B 强硬是最优战略；若 B 妥协，A 强硬将获更大收益。于是双方都想强硬以图获得一百元收益，却不曾考虑这一行动会给自己和对方带来负一百的效益。故这场博弈有两个纳什均衡点：A 收益一百、B 收益零，或相反。这显然比不上集体理性下的收益——双方都妥协，收益分别为九十和十。也就是说，债权人与债务人为追求利益最大化，会选择不合作，从某种意义上说，双方陷入了囚徒困境。尽管在理论上有两个纳什均衡，但由于信用环境、法律执行成本等因素，现实中债务人的强硬往往更占上风，因此 B 会首先选择强硬。\n\n### 金句摘录\n\n> 若A妥协，则B强硬是最优战略；若B妥协，A强硬将获更大的收益。\n\n> 债权人与债务人为追求利益最大化，会选择不合作。从某种意义上说，双方陷入囚徒困境。\n\n---\n\n## 第 0093 集｜“斗鸡博弈”中的进退之道3\n\n### 核心内容\n\n因此这是一个动态博弈：A 在 B 选择强硬后，不会选择强硬，因为 A 采取强硬措施反而结局不好，所以 A 只能选择妥协；而在双方强硬的情形下，B 虽然收益为负一百，但 B 会预期他选择强硬时 A 会选择妥协，故 B 的理性战略是强硬。因此这一博弈的纳什均衡实际上是 B 强硬、A 妥协。欠债还钱博弈是假定 A、B 实力相当；如果实力相差悬殊，一般实力强者选择强硬。在家庭夫妻冲突中，首先退下阵来的一般是丈夫——大部分夫妻怄气或吵架，最终胜利的总是妻子。\n\n战国思想家庄子讲过一个故事：斗鸡的最高状态就是好像木鸡一样，面对对手毫无反应，可以吓退对手，也可以麻痹对手。这个故事里就包含着斗鸡博弈的基本原则——让对手错误估计双方的力量对比，从而产生错误的期望，再以自己的实力战胜对手。然而在实际生活中，两只“斗鸡”要做出严格优势策略的选择，有时并不是一开始就能做出的，而是要通过反复试探、甚至激烈争斗之后，才会做出选择。一方前进、一方后退，也是符合斗鸡定律的：因为哪一方前进，不是由两只斗鸡的主观愿望决定的，而是由双方的实力预测所决定的。现实中以这种形式运用斗鸡定律，比直接选用严格优势策略的形式要常见得多，这也许是因为人有复杂的思维、更多的欲望。\n\n### 金句摘录\n\n> 斗鸡的最高状态就是好像木鸡一样，面对对手毫无反应，可以吓退对手，也可以麻痹对手。\n\n> 让对手错误估计双方的力量对比，从而产生错误的期望，再以自己的实力战胜对手。\n\n---\n\n## 第 0094 集｜“斗鸡博弈”中的进退之道4\n\n### 核心内容\n\n斗鸡博弈进一步衍生为动态博弈，会形成这样一个拍卖模型。拍卖规则是轮流出价，谁出得最高，谁就将得到该物品；但是出价少的人不仅得不到该物品，还要按他所叫的价付给拍卖方。假定有两人竞价争夺价值一百元的物品，只要双方开始叫价，就进入了“骑虎难下”的状态：每个人都这样想——如果我退出，我将失去我的钱；若不退出，我将有可能得到这件价值一百元的物品。但随着出价增加，他的损失也可能越大，每个人都面临着“继续叫价还是退出”的两难困境。\n\n这个博弈实际上有一个纳什均衡：第一个出价人叫出一百元的竞标价，另一个人不出价——因为在对方叫出一百元后，他继续叫价将是不理性的；出价一百元的参与者得到该物品。一旦进入骑虎难下的博弈，尽早退出是明智之举，然而当局者往往做不到，这就是所谓“当局者迷，旁观者清”。这种骑虎难下的博弈，经常出现在企业或组织之间，也出现在个人之间：赌红了眼的赌徒，输了钱还要继续赌下去，希望翻本，就是骑虎难下。其实赌徒进入赌场开始赌博时，就已经进入了骑虎难下的状态——因为从概率上讲，赌场是必胜的；从理论上讲，如果赌徒与赌场之间的博弈是多次的，那么赌徒肯定输，因为赌徒的资源与赌场的资源相比差距实在太大。如果你的资源与赌场的资源相比很大，那么赌场有可能输；如果你的资源无限大，只要赌徒有非零的赢的可能性，那么赌徒肯定会赢。\n\n### 金句摘录\n\n> 一旦进入骑虎难下的博弈，尽早退出是明智之举。然而，当局者往往是做不到的，这就是所谓当局者迷，旁观者清。\n\n> 赌红了眼的赌徒，输了钱还要继续赌下去，以希望返本，就是骑虎难下。\n\n---\n\n## 第 0095 集｜学会牵着对方鼻子走1\n\n### 核心内容\n\n在生活和工作中，难免会出现你争我夺的情况，这时就体现出斗鸡博弈的影响：谁能在你进我退之中占领上风，谁将会取得最终的胜利，成为那只赢的“斗鸡”。本集举了一则国外竞选的故事来说明这一点：两位实力旗鼓相当的竞选者展开了激烈的争夺——一方是在任者，政绩并不突出，内政方面不能令人满意，国内通货膨胀加剧、失业人数猛增，民众对民生问题十分不满、怨声载道；另一方则集中火力攻击对方经济政策失误，宣称要消除衰退；而在任者也抓住民众关心的战争与和平问题加以指责。双方唇枪舌剑、拳来脚往，一时难分胜负，最终由更善于借助大众传媒塑造形象的一方以绝对优势取胜。（该竞选案例涉及外国政治人物与选举，依内容政策不整理具体人物与情节。）\n\n从这个案例中，作者提炼出的博弈方法要义是：在势均力敌的对抗中，善于借助大众传媒塑造形象的一方往往能占据主动；形象、性格、风度有时会直接影响选民的判断，甚至胜过政策纲领本身。谁能夺得“进攻的主动权”，谁就像占了上风的斗鸡；而被动的一方则显得捉襟见肘、被对方牵着鼻子走，最终走向失败。\n\n### 金句摘录\n\n> 谁能够在进我退之中占领上风，谁将会取得最终的胜利，成为那只赢的斗鸡。\n\n> （本节竞选案例涉及外国政治人物与选举，依内容政策不整理。）\n\n---\n\n## 第 0096 集｜学会牵着对方鼻子走2\n\n### 核心内容\n\n有的时候，在进退之间，为了占据主动，你也可以尝试寻找别人的软肋——只要抓住了对手的软肋，你就可以大胆进攻了。作者以诸葛亮初到江东为例：作为弱国的使者，而且独自一人，看上去势单力薄；江东那些怕硬欺软的谋士们人多势众、一个个盛气凌人。诸葛亮决心先打掉他们的气焰，所以出手伶俐、直击要害。像张昭这样的江东首席谋士，凭他的嚣张气势，也不过勉强与诸葛亮周旋了三个回合。\n\n张昭突出的弱点是曾主动主张降曹——投降既是无能又是无耻的表现。诸葛亮瞅准这一点，在历数刘备一方怎样仁义爱民、艰苦抗击曹操之后，话锋一转：国家大计、社稷安危，要有主谋之人，而不是那种只会夸夸其谈、临机应变却百无一能的人。这一番话正打在对方的痛处，挫败了江东谋士的气焰，也确立了诸葛亮在江东舌战群儒中的主动地位。\n\n可见，在斗鸡博弈式的较量中，占据主动的关键之一，是准确找到对方最怕被触及的软肋，集中火力、一击中的；而一旦被对方抓住软肋，就只能被动挨打、被牵着鼻子走。\n\n### 金句摘录\n\n> 有的时候在进退之间，为了占据主动，你也可以尝试一下寻找别人的软肋。\n\n> 只要抓住了对手的软肋，你就可以大胆进攻了。\n\n---\n\n## 本篇小结\n\n本组十六集围绕“强弱与进退”展开。开头延续“木秀于林，风必摧之”，指出生存不仅取决于能力，更取决于你对别人的威胁程度，因此强者有时要“扮猪吃老虎”，弱者则宜坐山观虎斗；接着讲“示弱”的策略与“劣势很可能是优势”，用断臂男孩学柔道、鲨鱼效应、孙家鱼馆因祸得福、三个臭皮匠赛过诸葛亮等例子，说明换个思路、善于合作，劣势也能变成优势，两个弱者之和可以大于二（潘石屹与妻子优势互补即是明证）。后半部分转入“斗鸡博弈”，分析两强相争时进退的利害与纳什均衡，用债权债务、拍卖叫价、赌徒心理等例子说明“骑虎难下”时应及早退出、把握主动，并提醒：占据主动的关键，是准确抓住对方的软肋、牵着对方的鼻子走。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0081 集｜木秀于林，风必摧之2","id":"第-0081-集木秀于林风必摧之2"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0082 集｜木秀于林，风必摧之3","id":"第-0082-集木秀于林风必摧之3"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0083 集｜木秀于林，风必摧之4","id":"第-0083-集木秀于林风必摧之4"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0084 集｜劣势很可能是优势1","id":"第-0084-集劣势很可能是优势1"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0085 集｜劣势很可能是优势2","id":"第-0085-集劣势很可能是优势2"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0086 集｜劣势很可能是优势3","id":"第-0086-集劣势很可能是优势3"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0087 集｜劣势很可能是优势4","id":"第-0087-集劣势很可能是优势4"},{"level":3,"text":"核心内容","id":"核心内容-7"},{"level":3,"text":"金句摘录","id":"金句摘录-7"},{"level":2,"text":"第 0088 集｜两个弱者之和大于二1","id":"第-0088-集两个弱者之和大于二1"},{"level":3,"text":"核心内容","id":"核心内容-8"},{"level":3,"text":"金句摘录","id":"金句  --- |\n| 0097 | 学会牵着对方鼻子走3 | 抓住对方软肋，只言片语即可消灭对手气焰、赢得主动 |\n| 0098 | 用点以退为进的手腕1 | 以退为进：先顺应对方需要，再为自己的利益开路 |\n| 0099 | 用点以退为进的手腕2 | 暂时忍让换取长远利益，关键在于不露声色地迎合对方 |\n| 0100 | 用点以退为进的手腕3 | 贬低自己无碍真才实学，表面让步往往暗中更进一步 |\n| 0101 | 用一点“威慑战略”1 | 威慑要有效，须有壮士断腕、孤注一掷的决心 |\n| 0102 | 用一点“威慑战略”2 | 假威慑有时管用：软的怕硬的，横的怕不要命的 |\n| 0103 | 用一点“威慑战略”3 | 判断威慑真假，要看对方是否真会付出代价 |\n| 0104 | 如何面对威胁和承诺1 | 行胜于言；不可置信的威胁就是“空洞威胁” |\n| 0105 | 如何面对威胁和承诺2 | 逆向归纳揭穿威胁：说出来的打击往往只是说说 |\n| 0106 | 如何面对威胁和承诺3 | 承诺行动＝主动限制自己的选择，让威胁变得可信 |\n| 0107 | 如何面对威胁和承诺4 | 扩大产能、公开宣示、赌博合同，都能让威胁落地 |\n| 0108 | 如何面对威胁和承诺5 | 廉价的口头承诺不可信，没有兑现的惩罚等于没有 |\n| 0109 | 契约为何成为一纸空文1 | 斗鸡博弈本应合则两利，现实却常两败俱伤 |\n| 0110 | 契约为何成为一纸空文2 | 假道伐虢：晋国用贪利打破虞虢的同盟 |\n| 0111 | 契约为何成为一纸空文3 | 结盟须看实力，与虎谋皮终致唇亡齿寒 |\n| 0112 | 契约为何成为一纸空文4 | 斗鸡博弈中双方都不敢先让步，吴越争霸即是明证 |\n\n---\n\n## 第 0097 集｜学会牵着对方鼻子走3\n\n### 核心内容\n\n本集延续“牵着对方鼻子走”的话题，用诸葛亮舌战群儒的例子说明：在唇枪舌剑中，谁能抓住对方的软肋，谁就能迅速占据主动。诸葛亮一出场便戳中张昭的痛处，使他再也不能开口；张昭以下的一批儒生，更是一个回合就翻身落马。有人为了贬低刘备、抬高曹操的身份，犯了当时士大夫阶层舆论的大忌，被诸葛亮抓住，斥其一是无父无君，一是小儿之见，说得两人满面羞愧、无话可答。至于那些迂腐儒生，诸葛亮尖锐地指出其只会寻章摘句，是腐儒之见，何能兴基立业；小人之德，笔下虽有千言，胸中实无一策。这种准确有力、直击弱点的反击，使对方垂头丧气、理屈词穷。\n\n结论是：在情况微妙的时刻，若能聪明地抓住对方的软肋，只言片语就能消灭对手的气焰，为自己赢得主动。在日常工作中，人们总免不了要与人唇枪舌剑，尤其在商业谈判中，如果能先抓住对方的软肋，便可以迅速占据有利位置，让对方一开始就处于下风，大大削弱其士气和自信，从此便可以牵着对方的鼻子走。事实上，在交锋中对手总有说漏嘴的时候，这正是反守为攻的好机会；这种办法用来对付傲气十足的对手尤其奏效，因为他一旦丢丑，就很容易像斗败的公鸡一样垂头丧气、沮丧不已。\n\n### 金句摘录\n> 小人之德，笔下虽有千言，胸中实无一策。\n> 如果可以先抓住对方的软肋，便可以迅速占据有利位置，让对方从一开始就处于下风。\n\n---\n\n## 第 0098 集｜用点以退为进的手腕1\n\n### 核心内容\n\n本集转入“以退为进”的手腕。斗鸡博弈中，如果双方棋逢对手且都僵持不下，往往造成两败俱伤；在这种情况下，适当的退让、然后再展开攻势的一方，常常能起到出其不意的效果。以退为进，是做人做事中不可或缺的一种方式：你先表现得以他人利益为重，实际上是在为自己的利益开辟道路；在做有风险的事情时，冷静沉着地让一步，往往能取得绝佳效果。让自己的利益和意图丝毫不露，尊重并突出别人的观点和利益，让对方因为你能投其所好而情愿做你要他做的事，这就是与他人合作的成功模式。\n\n人们常常不会正确使用这一模式，是因为忽略了：如果过分强调自己的需求，那别人对此即便本来有兴趣，也会改变态度。要感动别人，就要从他们的需要入手；要让一个人做任何事，唯一的方法就是使他自己情愿。同时还必须记得，人的需要各不相同，各人有各自的癖好与偏爱，只要你认真探索对方的真正意向，特别是与你的计划有关的，就可以依照他的偏好去应对他。你首先要让自己的计划适应别人的需要，然后你的计划才有实现的可能。说服别人的基本要点之一，就是巧妙诱导对方的心理或感情，使其就范；如果一味强调自己的优点、企图占上风，对方反而会加强防范。所以应该先点破自己的缺点或错误，暂时让对方产生优越感，而且注意不要一本正经地表达，才不会让对方乘虚而入。有的人因为帮助过别人、有恩于人，心理上会不自觉产生优越感，甚至对求助者数落一番；当你意识到自己可能被指责时，不妨先数落自己一番，当对方发觉你已承认错误，便不好意思再指责你了。\n\n### 金句摘录\n> 你先表现的以他人利益为重，实际上是在为自己的利益开辟道路。\n> 要一个人做任何事情，唯一的方法就是使他自己情愿。\n\n---\n\n## 第 0099 集｜用点以退为进的手腕2\n\n### 核心内容\n\n本集进一步说明：人际关系中，暂时的忍让吃亏可以获得长远的利益，关键是要学会不露声色地迎合对方的需要——既以对方的利益为重，又为自己的利益开道。求人帮忙时可以先高后低，造成你大步退让的假象；或者循序渐进、由小到大，让对方无法察觉你先得寸后进尺的真正意图。\n\n书中举了美国矿业工程师赫蒙的例子。赫蒙毕业于耶鲁大学，又在德国弗莱堡大学拿到硕士学位，可当他带齐文凭去找美国西部的大矿主霍斯特应聘时却遇到麻烦：那位矿主脾气古怪又固执，自己没有文凭，所以不相信有文凭的人，更不喜欢那些文质彬彬、专爱讲理论的工程师。赫蒙递上文凭，满以为老板会乐不可支，没想到霍斯特很不礼貌地说：我之所以不想用你，就是因为你曾是弗莱堡大学的硕士，你脑子里装满了一大堆没用的理论，我可不需要什么文绉绉的工程师。聪明的赫蒙听了不但没有生气，反而心平气和地回答说：假如你答应不告诉我父亲，我就告诉你一个秘密。得到同意后，赫蒙小声说：其实我在弗莱堡并没有学到什么，那三年就好像稀里糊涂地混过来一样。霍斯特听了笑嘻嘻地说：好，那你明天就来上班吧。就这样，赫蒙在必要时退让了一步，轻易地在一个非常顽固的人面前通过了面试。\n\n也许有人认为赫蒙那样做不太合适，但关键在于，能不能做到既没有伤害别人、又能把问题解决。他贬低的是自己，而一个人的学识如何并不取决于自己的评价：抬得再高，学识也不会增加一分；贬得再低，也不会减少一分。\n\n### 金句摘录\n> 让步其实只是暂时的退却，为了进一尺，有时候就必须先做出退一寸的忍让。\n> 为了避免吃大亏，就不应计较吃点小亏。\n\n---\n\n## 第 0100 集｜用点以退为进的手腕3\n\n### 核心内容\n\n本集继续用事例说明“以退为进”的妙处。遇到类似赫蒙那样的情况，人们往往喜欢尽量表现出自己比别人强，或努力证明自己是有特殊才干的人；然而一个真正有能力的人是不会自吹自擂的。所谓“自谦则人必服，自夸则人必疑”，就是这个道理。本书总结道：让步其实只是暂时的退却，为了进一尺有时候就必须先做出退一寸的忍让，为了避免吃大亏，就不应计较吃点小亏。\n\n书中又举美国第一届总统华盛顿的例子：华盛顿在任时，身边的副总统德雷斯顿本是个闲差，但德雷斯顿却把它变成了具有实权的职位。他常常在演说时讲一些自己做副总统时闹出的笑话。这样做的结果，非但没有降低自己，反而赢得了敬佩和拥护。这说明退让有时只是表面上做出让步，实际上却暗中又进了一步。这种方法以假乱真、以虚就实，反语正说、虚实不定，令对手难以捉摸、防不胜防，是一种高超的以退为进之术。\n\n还有一个滑稽演员的例子：世界著名滑稽演员琥珀在表演时说，我住的旅馆房间又小又矮，连老鼠都是驼背的。旅馆老板知道后十分生气，认为他诋毁了旅馆声誉，要控告他。琥珀便用一种奇特的方法，既要坚持自己的看法，又可避免不必要的麻烦。他在电视台发表声明向对方致歉：我曾经说过，我住的旅馆房间的老鼠都是驼背的，这句话说错了，我现在郑重更正——那里的老鼠没有一只是驼背的。“连那里的老鼠都是驼背的”，意在说明旅馆小而且矮；“那里的老鼠没有一只是驼背的”，虽然否定了小和矮，却仍肯定了旅馆里有老鼠，而且很多。这个道歉名为更正，实为批评旅馆的卫生情况，不但坚持了以前的所有看法，讽刺力度反而更深刻有力。\n\n### 金句摘录\n> 自谦则人必服，自夸则人必疑，就是这个道理。\n> 退让有时只是表面上做出让步，实际上却暗中又进了一步。\n\n---\n\n## 第 0101 集｜用一点“威慑战略”1\n\n### 核心内容\n\n本集开始讲“威慑战略”。要让自己的威慑更加有效，就要有壮士断腕的行为，表达出你孤注一掷的决心，对方才会有所忌惮。按博弈论的说法，斗鸡博弈有两个纳什均衡：你进我退、你退我进，自己的行为取决于对方的行为，双方都是如此选择。那么最后的均衡究竟会出现在哪一点，也就是到底谁进攻、谁撤退，就要看谁使用了威慑战略、并且更有效了。\n\n所谓威慑战略，就是选择威慑的一方要表现出义无反顾、势不可当的样子，以大无畏的气势镇住对方。“狭路相逢勇者胜”就是这个意思。当然，威慑战略也是平等的，双方都可以采用；若对方表现得比你还勇猛，你就要识时务者为俊杰，与愣头青去拼命是不值得的。书中讲了一个战争年代的故事：一场血腥战役之后，敌我双方的两个士兵狭路相逢，他们都已身心疲惫，却仍勉力对峙，枪口对着枪口、目光对着目光。终于，一个士兵的信心崩溃了，扑通跪地求饶；当另一个战士吃力地夺过他的枪，发现里面根本没有子弹时，也一下子瘫倒在地——因为这个战士也早已弹尽粮绝。可见，勇还是不勇，有时并不需要真正的较量，而只需将“勇”的信息传递到对方即可。这个理论甚至在人类与野兽的较量中也通行。在很多情况下，博弈就是比拼谁比谁更有威慑力。正应了一句话：软的怕硬的，硬的怕横的，横的怕不要命的。\n\n### 金句摘录\n> 狭路相逢勇者胜，就是这个意思。\n> 软的怕硬的，硬的怕横的，横的怕不要命的。\n\n---\n\n## 第 0102 集｜用一点“威慑战略”2\n\n### 核心内容\n\n本集用故事说明假威慑的威力。一个面带菜色、衣着简朴的农民乘坐长途汽车，因为带的杂物太多被司机训斥，只好蜷缩在车尾角落。车行半路被劫匪劫持，司机被歹徒用刀凶狠地顶住脖子，眼看一场面对全体乘客的抢劫就要发生，农民突然站起来大叫一声“给我住手”，然后写了一张纸条递了过去。几个歹徒读了字条，互相对视片刻，竟然迅速下车逃跑了。大家诧异地问他是不是警察、是不是军人，他都否认了。农民老实说：我今天正好带着借来的大笔钱，被他们抢走的话，我也只有死路一条，所以只得铤而走险；我在纸条上写的是——快滚蛋，我是一个持枪在逃犯，惹火了我，就杀了你们。可见，横的还是怕不要命的，威慑战略在某些时候还真管用。\n\n本书指出：你给别人的威慑不一定代表你真会那么做，只是给别人一种威慑力或假象。在生活中采用一些假的威慑，或许可以解决一些难题。越剧电影《追鱼》中也有类似情节：书生张郎被宰相府召为女婿，却因家贫而遭宰相女儿牡丹嫌弃；而在张郎读书处的水潭里，鲤鱼精因爱慕张郎而变作牡丹的模样来与他私会，张郎误以为她真的回心转意，便与她情投意合。终于事发东窗，两个牡丹真假难辨。断案的包公知道了事情原委，假装要当庭杖打张郎；这时真的牡丹无动于衷，甚至幸灾乐祸，而假的牡丹则难掩忧心。明察秋毫的包公一看，心里便有数了。本书借此反过来说：如果鲤鱼精也懂一点博弈论，在洞察包公用意后也装作无动于衷、幸灾乐祸的样子，那么也许包青天也无能为力了。\n\n### 金句摘录\n> 你给别人的威慑不一定代表你真会那么做，只是给别人一种威慑力或假象。\n> 在生活中采用一些假的威慑，或许可以解决一些难题。\n\n---\n\n## 第 0103 集｜用一点“威慑战略”3\n\n### 核心内容\n\n本集说明假威慑也有失效的时候，特别是当对方拿出破釜沉舟的勇气时。书中举了电视剧里常见的例子：一位姑娘与小伙子相爱，但姑娘的父亲坚决反对，以断绝父女关系相威胁。如果姑娘相信，她可能会中断与恋人的关系，因为恋人是可以选择的，而血缘是不能替代的。庆幸的是，这是个聪明的姑娘，她知道父亲不会那么做——因为那样的结局对父亲更加不好，不但失去女婿，还会失去女儿。于是她义无反顾地将生米煮成熟饭，勇敢地结婚了。用博弈论的话来说，父亲的威慑也是个不可置信的假威慑。最后的结果，父亲还是接受了这个当初并不喜欢的女婿。\n\n本书指出，威慑战略只能是一种虚张声势，它不一定会真正实施。如何识破对方的虚张声势呢？这就要看对方的威慑是否可以置信。当父亲威慑顽皮的孩子“你再吵，我就把你从窗外扔下去”，这种大而不当的威慑就不用置信。那么，威慑在什么时候才是可信的？答案是：只有在当事人不施行这种威慑就会遭受更大损失时。书中以警察奉命拦截一支游行队伍为例：群众情绪激动，警察严阵以待，冲突一触即发；若游行群众表现出不可遏制的愤怒、拼死冲破封锁线的勇气，警察最好是让开，否则就要面对怒火中烧的群众。但若警察排成铜墙铁壁，并威慑“死也不会放你们过去”，群众就要考虑。那如何判断警察的威慑是真的呢？如果警察接到了上级“不成功便成仁”的命令，那么不要怀疑，他们将不惜代价也要挡住游行队伍。综上，要让自己的威慑更加有效，就要有壮士断腕的行为，表现出你孤注一掷的决心，对方才会有所忌惮。\n\n### 金句摘录\n> 威慑战略只能是一种虚张声势，它不一定会真正实施。\n> 只有在当事人不施行这种威慑就会遭受更大的损失时，威慑才是可信的。\n\n---\n\n## 第 0104 集｜如何面对威胁和承诺1\n\n### 核心内容\n\n本集进入“如何面对威胁和承诺”。在博弈中，威胁和承诺都是惯用伎俩；懂得斗鸡博弈的道理，往往有助于我们洞悉某些局中“不可置信的威胁”“不可置信的承诺”。一次博弈论课上，一名教授对学生们说：你们每个人必须给我十元钱，否则我就要去自杀。学生们哄堂大笑，因为他们觉得他在开玩笑，他的威胁是不可置信的。如果他真要以自杀来讹诈学生的钱财，怎么做才能成功？博弈论中，是否相信一个人，不是看他说了什么，而是看他做了什么——行胜于言。所以教授应该爬到高高的教学楼顶，翻到栏杆外，站在危险的边缘，然后再提出每人给他十元钱；这时候，至少大部分学生会乖乖地掏出十元钱来，因为他的威胁变得可信了，他现在随时有生命危险。\n\n本书指出，在生活中人们惯用威胁和恐吓来达到目的，但理性的参与者会发现，某些博弈中的威胁是不可置信的，即塞尔顿所谓的“空洞威胁”。威胁不可置信的一个重要原因是：将威胁所声称的策略付诸实践，对于威胁者本人来说，比实施非威胁声称的策略更不利。既然如此，我们就没有理由相信威胁者会选择其威胁所声称的策略。书中举了一个市场进入的例子：有一个垄断市场，唯一的垄断者独占市场，每年可获得一百万的利润。现在有一个新企业准备进入这个市场。如果垄断者对进入者采取打击政策，那么进入者每年亏损十万元，同时垄断者的利润也下降为三十万元；如果垄断者实行默认政策，那么进入者和垄断者都将各自得到五十万元利润。为防止进入者进入，在位的垄断企业宣称：如果进入者进入，他就会选择打击政策。然而，如果把这个市场进入博弈的博弈树画出来，再用逆向归纳方法求出均衡路径，你就会发现什么？\n\n### 金句摘录\n> 博弈论中是否相信一个人，不是看他说了什么，而是看他做了什么，行胜于言。\n> 教授应该爬到高高的教学楼顶，站在危险的边缘，然后再提出每人给他十元钱。\n\n---\n\n## 第 0105 集｜如何面对威胁和承诺2\n\n### 核心内容\n\n本集接上集给出答案：我们会发现，均衡路径是进入者进入，而在位者默认。在位者的威胁将是不可置信的——因为给定进入者真的进入了，在位者选择默认而不是打击将更符合其利益。所以在位者宣称要实施打击，也只是说说而已。不可置信的威胁之所以产生，是因为威胁者选择其威胁所宣称的行动时对自己并没有好处。这里的“对自己并没有好处”应做稍宽泛的理解：有时候可能并不是指对自己伤害多大，而是因为实施该行动的成本太高而使其无法实施，无法实施的威胁行动自然就是不可置信的威胁。\n\n这一观念可以解释生活中的诸多现象。在公司里，员工常常会策略性地提出加薪，而威胁老板加薪的一个常见版本就是：如果不给我加薪，那我就将离职。问题是老板会不会理睬员工的威胁呢？显然，老板非常理性，如果员工并没有其他的去处，老板就不会理睬。只有老板相信员工会离去，并且觉得多花点钱留住员工是值得的时候，他才会给员工加薪。又如，两个国家之间没有犯罪引渡条约，一个罪犯若在一国犯罪而又能成功潜逃到另一国，那么尽管前一国有明确的法律制裁规定，对罪犯也没有太大约束力，对他来说那只是一个不可置信的威胁，他可以成功逃避惩罚——这可能就是劫机之类的犯罪更多发生在缺乏引渡条约国家之间的原因；如果存在引渡，那么惩罚威胁将是可信的。在师生之间，有时也会存在不可置信的威胁：教师为了让学生更努力学习，有时会故意夸大命题和阅卷的严格程度；但学生很清楚，教师不可能让大面积的学生不及格，所以他们都不会理会试题的难度——如果他们预计百分之九十五的学生会及格，那么他们只需让自己进入那百分之九十五就行了，并不会担心绝对分数是否会达到六十分。如果教师真想通过考试压力迫使学生努力学习，那么他应当公布更低的相对及格标准：无论考多少分，只有百分之七十的同学才算及格——但是这样的做法并不合理。\n\n### 金句摘录\n> 在位者的威胁将是不可置信的，因为给定进入者真的进入了，在位者选择默认而不是打击将更符合其利益。\n> 如果存在引渡，那么惩罚威胁将是可信的。\n\n---\n\n## 第 0106 集｜如何面对威胁和承诺3\n\n### 核心内容\n\n本集讲如何让威胁变得可信，办法是采取“承诺行动”。承诺行动的基本思想是：通过限制自己的某些策略选择，从而使得其选择特定策略的宣称与意图变得可信；或者说，承诺行动是局中人通过减少自己在博弈中的可选行动，来迫使对手选择自己所希望的行动。其中的道理在于，既然对方的最优反应行动依赖于我的行动，那么限制我自己的某些行动，实际上也就限制了对方采取某些行动。如果某些承诺行动只是增加了选择某些行动的成本，而不是使该行动完全不可能被选取，则被称为“不完全承诺”。虽然语言也可以作为一种承诺，但这里讲的承诺行动更注重落实在行动上——行胜于言，是博弈论的基本教条，一个人嘴巴上可以说得天花乱坠，而理性的人只看他的行动。\n\n书中举例：假设在位的垄断企业事前扩大生产能力，造成过剩生产能力，这可以降低它打击进入者的成本；而每年对这些过剩生产能力的维护费用为三十万元。那么，这项投资使得其每年的垄断利润从一百万下降到七十万。但是如果进入者进入，在位者实施打击的成本降低了，即使扣除过剩生产能力的维护费用，也可获得利润三十万；如果进入者进入而在位者默认，那么在位者的利润为五十万减三十万，等于二十万。从而使打击的威胁变得可信了——因为如果在位者实施打击能得到三十万的利润，比选择默认得到二十万要好。而正是由于打击威胁可以置信，进入者就不会进入，从而在位者将得到七十万的利润。与不扩大生产能力、进入者进入而在位者默认、只能得五十万利润的情况比较，扩大生产能力虽然带来每年三十万的维护费用，但这样做仍然是值得的。\n\n### 金句摘录\n> 承诺行动是局中人通过减少自己在博弈中的可选行动来迫使对手选择自己所希望的行动。\n> 行胜于言，是博弈论的基本教条。\n\n---\n\n## 第 0107 集｜如何面对威胁和承诺4\n\n### 核心内容\n\n本集继续讲承诺行动的多种实现方式。除了扩大过剩产能，企业也可以用其他方式来承诺一定采用打击政策：它可以召开一个新闻发布会，对社会公开宣称自己的打击意图。尤其是有声望的大企业，利用这一招常常是有效果的——因为有声望的大企业言出必行，如果将来不这样做，就会损害企业的声誉，这相当于企业主动切断了沉默的道路，无路可退，只有打击。或者，企业也可以用一个赌博合同来阻止对手进入：在位的垄断企业与另外一个第三方订立赌约，如果进入者进入而我不打击，那么我就输给你五十万。在这样的赌约下，当进入者进入而在位者默认，虽然获得利润五十万，但支付赌注五十万出去，净所得为零，还不如打击得到利润三十万而不需支付赌注，所以打击威胁也就变得可信了。\n\n有意思的是，企业并不会真的付出这五十万的赌注。因为打击威胁可信时，进入者就会选择不进入，从而在位者并不需要付出这五十万，却得到了垄断利润一百万，赌约成立的条件也不会发生。这正是博弈中的一个有意思的地方：很多现实的博弈结果，常常是受到那些从未发生的事件所左右的。\n\n本书同时提醒：与空洞威胁一样，有时候博弈中的承诺也是不可相信的，这样的承诺被称为“空头承诺”。空头承诺之所以难以令人相信，是因为它太廉价，人们没有理由去相信；尤其是如果一个空头承诺本身不符合承诺者的利益，那我们就不应指望他会遵守承诺。廉价的口头承诺是不可置信的，博弈论讲究的就是看一个人的实际行动。\n\n### 金句摘录\n> 很多现实的博弈结果，常常是受到那些从未发生的事件所左右的。\n> 廉价的口头承诺是不可置信的，博弈论讲究的就是看一个人的实际行动。\n\n---\n\n## 第 0108 集｜如何面对威胁和承诺5\n\n### 核心内容\n\n本集说明“看实际行动”这一原则在生活中广泛适用。一个男孩子对一个女孩子许诺会爱她一生一世，如果女孩子就这样相信了他的话，那就太不理性了——因为说一句“我爱你”是非常容易的事，仅仅是嘴里说出的誓言是非常廉价的。如果男孩子更愿意在女孩身上花钱、更多地花费精力关心女孩子，那么他的承诺就更为可信，因为他为自己的承诺付出了代价。\n\n本书又设想一个小小的承诺与威胁：比如参加考试的学生承诺在没有老师的情况下绝不作弊。但不难想象，在考场里没有监考老师的时候，会是一种什么样的景象——学生并不都是品德高尚、自制力强的人。即使在有老师监督考场、并威胁如果有学生敢于顶风作案必然严惩不贷（比如考试卷直接作废、找家长等）的情况下，设想一下，如果这些威胁仅仅是威胁、在学生作弊后没有认真采取什么严惩的行动，那么学生作弊的风险就非常小，考场纪律依然与没有老师一样。由此可见，有些时候，监考老师不得不对学生进行专制式的惩罚。这一节的落点依然是：威胁和承诺是否可信，取决于它背后有没有真实的、要付代价的行动，光靠嘴上说说，任何理性的对手都不会当真。\n\n### 金句摘录\n> 说一句我爱你是非常容易的事，仅仅是嘴里说出的誓言是非常廉价的。\n> 如果这些威胁仅仅是威胁，在学生作弊后没有认真采取什么严惩的行动，那么学生作弊的风险非常小。\n\n---\n\n## 第 0109 集｜契约为何成为一纸空文1\n\n### 核心内容\n\n本集提出“契约为何成为一纸空文”这个问题，并从斗鸡博弈切入。斗鸡博弈是博弈论中一个奇特的现象，本应是合则两利、分则两害，但在现实中往往是两败俱伤，或一方吞并另一方。如果双方都不遵守博弈规则，极有可能导致同归于尽的结局，这是斗鸡博弈最悲惨的结局。这种结局历史上是否有呢？本书说，春秋初期虞国、虢国演绎的“唇亡齿寒”的故事，就是斗鸡博弈最具代表性的悲剧性结果。\n\n在博弈论中，斗鸡博弈指双方实力相当的时候，要猜测对手做出什么选择，自己选择最佳策略以维护自己的利益。这要求双方都具有互助互济的精神，而且要保持高度充分的信任；任何一方只要有了“人不为己，天诛地灭”的想法，双方都会陷入孤立无援的处境；而如果双方都打对方的主意，就必然陷于同归于尽的悲惨境地。所以任何一方的改变，或者任何外来势力的参与，都可能导致这一均衡被打破。春秋时期，今天山西境内实力较强的晋国，南面有两个小国：虞国（在今山西平陆）和虢国（在今河南陕县）。虞、虢虽然地狭人稀、国力弱小，但由于长期跟戎狄杂居，民风强悍。由于世代相邻、实力相当，这两个国家谁也吞并不了谁，反而在对付戎狄侵略的过程中互助互济，结成了统一战线。若用博弈观点看，虞和虢找到了最佳均衡点。这两国都和周天子有较多联系，虢国尤其与周天子亲近。虞、虢两国互结同盟、互为犄角，是一种典型的唇亡齿寒关系。然而不幸的是，此时已经有一个大国盯上了这两块肥肉，这就是晋国。\n\n### 金句摘录\n> 任何一方只要有了“人不为己，天诛地灭”的想法，双方都会陷入孤立无援的处境。\n> 虞、虢两国互结同盟，以为犄角，是一种典型的唇亡齿寒的关系。\n\n---\n\n## 第 0110 集｜契约为何成为一纸空文2\n\n### 核心内容\n\n本集讲述晋国如何处心积虑打破虞虢同盟。晋国从西周初年被分封到山西境内，实力一直不弱；到晋献公的时候，结束了家族内部纷争，奋发图强，极力开拓疆土。对国家而言，吞并他国是壮大自己的最佳策略。地处黄河北的虢国，是晋国向中原发展的首要障碍，晋献公遂下决心灭虢；但灭虢又必须经过南部边境的另一小国虞。而虞、虢两国唇齿相依，关系又十分密切，如果晋国贸然开启战端，就会陷入两线作战，犯兵家大忌。所以晋献公必须采取对策，打破虞虢两国的共赢博弈状态。\n\n晋献公为打破对手建立的战略联盟，而征求臣下的意见。大臣荀息提出了一个简单而又适用的方案：他请晋献公用自己最喜欢的北屈良马、垂棘玉璧献给虞君，借道虞国去讨伐虢国。晋献公舍不得宝马和美玉，荀息劝他说，若得道于虞，犹外府也（借道给虞国，就好像把东西存放在外面的库房里）。晋献公担心虞国有贤臣宫之奇，怕虞君不会上当。荀息申辩说，宫之奇的为人，懦而不能强谏，而且他从小和虞君一起长大，虞君不会重视他，虽谏也不会听。于是晋献公就去贿赂虞君，借道灭虢。情况正如荀息所料，虞君一看到良马宝玉，就陷入了利令智昏的地步，很快就答应了晋国的借道要求，虞、虢两国脆弱的联盟顿时土崩瓦解。虞国大夫宫之奇向虞公讲述了“辅车相依，唇亡齿寒”的道理，指出虞国和虢国休戚相关、荣辱与共，借道无异于自杀。然而虞公却打着自己的小算盘：在他看来，晋国和虞国是同宗，同宗的晋国正在强大，依附晋国必然获得更大的收获。事实是这样吗，合乎于真实的博弈应该是怎样的呢？\n\n### 金句摘录\n> 辅车相依，唇亡齿寒。\n> 虞公一看到良马宝玉，就陷入了利令智昏的地步。\n\n---\n\n## 第 0111 集｜契约为何成为一纸空文3\n\n### 核心内容\n\n本集分析虞公的错误在哪。很显然，虞公错误地估计了虞、晋的形势。对晋国来说，与虞国这样的小邻国互助互济，明显得不到最大好处——因为不占据对方的土地和人口，只能弄到点蝇头小利；最好的方法就是把对方的人口和土地据为己有，才能获取最大利益。所以从一开始，晋国从内心深处就准备消灭这些小国。对虞公来说，他的想法也不无道理：晋与虞同宗，从血缘关系上更接近，都是周王室的后裔；而且，与一个大国结成攻守同盟，比与一个小国结成战略联盟，似乎要划算得多。然而虞公的想法相当幼稚。虞、虢两国旗鼓相当，在双方势均力敌、又面临共同敌人的时候，能找到最佳平衡点，做到同舟共济；虞公想与晋这样的大国结盟，无异于与虎谋皮。因为晋、虞的均衡点是偏向晋国的，所以虞公一开始就做出了一个错误的博弈选择——没有看到任何平等，都是建立在实力基础上的。\n\n虞公迫不及待地出兵，和晋国兵合一处，共同讨伐昔日的战友虢国。虢国还真不是弱者，丢了山西平陆县，但元气未伤；然而战略要地和军事虚实还是都被晋国摸清楚了。晋国知道虢国实力不弱，暂且退兵。随后两年里，晋献公屡次催促荀息再次发兵攻打虢国，荀息说：如今虢国在和戎人作战，咱们坐山观虎斗吧。这其实也是一种非常高明的做法。晋国在虢国实力较强的时候出兵攻打，并没有完全实现预定目的，所以在对手实力强劲的时候出兵是不明智的；但当虢国和戎人打得死去活来的时候出兵也不明智，因为很可能导致灭了虢国而与戎人交手，或者把虢国推向戎人一方。因此，静观对手实力削弱才是理智的，而当对手耗尽自己的力量时，又必须立刻出击，不给对方恢复元气的机会。最后这一场三方博弈的结局很明显：晋献公二十二年，即公元前六五五年，晋国趁虢国实力大大削弱，再次借道虞国而伐虢，灭了虢国。虞公狼狈逃往周地。在荀息的策划之下，晋师在返回晋国的途中，趁虞国毫无戒备，突然发起袭击，轻而易举地灭掉虞国，俘虏了虞君。虞、虢从相互依靠到最后共同灭亡，最重要的原因就在于两国建立的共赢博弈太脆弱了，经不起外来力量的推动；而虞公在诱惑面前算错了形势，错误地推断了博弈均衡点，最终留下了唇亡齿寒的故事。\n\n### 金句摘录\n> 虞公想与晋这样的大国结盟，无异于与虎谋皮。\n> 没有看到任何平等，都是建立在实力基础上的。\n\n---\n\n## 第 0112 集｜契约为何成为一纸空文4\n\n### 核心内容\n\n本集对斗鸡博弈做出总结，并引出吴越争霸的历史事例。斗鸡博弈是博弈论中的一个典型：处于博弈状态的斗鸡实力相当，如果两者同时出击，往往是两败俱伤；当然，这种两败俱伤不是对等的，但一方想彻底战胜对手而毫发无损也绝不可能。所以处于斗鸡对抗的时候，一方总想自己前进、而另一方自动后退，这是一种均衡，只是一种不对等的均衡；其实双方各让一步，也是较为理想的一种均衡。然而，双方同时做出让步的机会少之又少，这是因为博弈双方的出发点往往都是希望对方让一步、而自己进一步，从而使自己得到好处。所以斗鸡博弈中，双方都不敢轻易做出让步——因为这种历史教训实在太多，而且血腥。\n\n书中举春秋时期的吴越争霸作为一个典型事例。吴越两国国土相当、实力相当，但吴国最初似乎并不屑于把越国当作主要敌人。它频频进攻楚国，最凶狠的一次在公元前五零六年冬天：吴王阖闾任用当时最杰出的军事家伍子胥和孙武，仅仅凭借三万人，千里挺进，直插楚国腹地，到楚境内决战，七战七胜，打垮二十万楚军，攻入郢都，险些使楚国亡国。就在吴国主力都集中在楚国攻城略地的时候，越国趁火打劫，派兵攻入吴国。从当时的形势来说，这就是一场斗鸡博弈——双方实力相当、互不相让，谁也不敢先退，最终只能以惨烈的对抗收场。这也正好回应了本集开头的追问：当契约与同盟缺乏实力与信任作支撑时，它很容易就成为一纸空文。\n\n### 金句摘录\n> 双方同时做出让步的机会少之又少，这是因为博弈双方的出发点都往往是希望对方让一步，而自己进一步。\n> 斗鸡博弈中，双方都不敢轻易做出让步，因为这种历史教训实在太多，而且血腥。\n\n---\n\n## 本篇小结\n\n本篇从“牵着对方鼻子走”的谈判技巧讲起，先教人抓软肋、以退为进，再深入博弈论中最核心的一组概念：威慑、威胁与承诺。核心结论是——威慑和威胁是否有效，取决于它是否“可置信”，而可置信与否，取决于威胁者若真的付诸行动，是否比不行动更有利、是否真的愿意付出代价。空洞威胁和廉价承诺都是不可信的，行胜于言才是博弈的铁律。为了让威胁变得可信，人们可以采取承诺行动：扩大过剩产能、公开宣示、签订赌博合同，都是通过限制自己的选择把威胁坐实。篇末用“契约为何成为一纸空文”与唇亡齿寒、吴越争霸的故事说明：缺乏实力与信任支撑的同盟和契约极易崩溃，斗鸡博弈中双方若都不肯先退，最终往往两败俱伤。全篇的方法论可浓缩为一句话：看行动、算代价，才能识破虚张声势，也才能让自己的策略真正可信。\n","outline":[{"level":2,"text":"本篇速览","id":"本篇速览"},{"level":2,"text":"第 0097 集｜学会牵着对方鼻子走3","id":"第-0097-集学会牵着对方鼻子走3"},{"level":3,"text":"核心内容","id":"核心内容"},{"level":3,"text":"金句摘录","id":"金句摘录"},{"level":2,"text":"第 0098 集｜用点以退为进的手腕1","id":"第-0098-集用点以退为进的手腕1"},{"level":3,"text":"核心内容","id":"核心内容-2"},{"level":3,"text":"金句摘录","id":"金句摘录-2"},{"level":2,"text":"第 0099 集｜用点以退为进的手腕2","id":"第-0099-集用点以退为进的手腕2"},{"level":3,"text":"核心内容","id":"核心内容-3"},{"level":3,"text":"金句摘录","id":"金句摘录-3"},{"level":2,"text":"第 0100 集｜用点以退为进的手腕3","id":"第-0100-集用点以退为进的手腕3"},{"level":3,"text":"核心内容","id":"核心内容-4"},{"level":3,"text":"金句摘录","id":"金句摘录-4"},{"level":2,"text":"第 0101 集｜用一点“威慑战略”1","id":"第-0101-集用一点威慑战略1"},{"level":3,"text":"核心内容","id":"核心内容-5"},{"level":3,"text":"金句摘录","id":"金句摘录-5"},{"level":2,"text":"第 0102 集｜用一点“威慑战略”2","id":"第-0102-集用一点威慑战略2"},{"level":3,"text":"核心内容","id":"核心内容-6"},{"level":3,"text":"金句摘录","id":"金句摘录-6"},{"level":2,"text":"第 0103 集｜用一点“威慑战略”3","id":
